<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>
  <rect width="1400" height="860" fill="url(#bg2)"/>

  <text x="700" y="55" font-family="-apple-system,sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">小学生也能 100% 听懂的“日常生活大白话比喻”</text>
  <text x="700" y="90" font-family="-apple-system,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">如果把 CPU 比作一名在书房里飞速写作业的学霸，四大存储设备到底分别扮演什么角色？</text>

  <!-- 4 Analogy Boxes -->
  <!-- Box 1: RAM -> Desk -->
  <g transform="translate(80, 130)">
    <rect width="580" height="320" rx="14" fill="url(#card1)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="50" cy="50" r="28" fill="#0369a1"/>
    <text x="50" y="58" font-size="28" text-anchor="middle">📖</text>
    <text x="95" y="46" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#38bdf8">内存 (RAM) ＝ 课桌的桌面</text>
    <text x="95" y="70" font-family="-apple-system,sans-serif" font-size="14" fill="#94a3b8">【特性】：极度快速、面积有限、断电即空</text>
    <path d="M25,95 H555" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="130" font-family="-apple-system,sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">• 为什么飞快？</text>
    <text x="40" y="155" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">现在要写的作业本、草稿纸就摊在眼皮底下，眼睛一扫、笔一挥就能写。</text>

    <text x="25" y="195" font-family="-apple-system,sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">• 为什么内存不够会极卡？</text>
    <text x="40" y="220" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">桌面太小堆不下了！学霸每做一道新题，都必须先把桌上的书塞回书架（换出到 Swap/虚拟内存），再把另一本翻出来，大部分时间全浪费在搬书上了！</text>

    <text x="25" y="260" font-family="-apple-system,sans-serif" font-size="15" fill="#f87171" font-weight="600">⚠️ 为什么关机数据全没？</text>
    <text x="40" y="285" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">晚上放学打铃，值日生进门把桌面所有草稿全部扫进垃圾桶，一张不留！</text>
  </g>

  <!-- Box 2: SSD -> Smart Filing Cabinet -->
  <g transform="translate(740, 130)">
    <rect width="580" height="320" rx="14" fill="url(#card1)" stroke="#4ade80" stroke-width="2"/>
    <circle cx="50" cy="50" r="28" fill="#15803d"/>
    <text x="50" y="58" font-size="28" text-anchor="middle">⚡</text>
    <text x="95" y="46" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#4ade80">固态硬盘 (SSD) ＝ 抽屉里的智能活页夹</text>
    <text x="95" y="70" font-family="-apple-system,sans-serif" font-size="14" fill="#94a3b8">【特性】：毫秒内调出、任意翻页、终生持久</text>
    <path d="M25,95 H555" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="130" font-family="-apple-system,sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">• 为什么叫“固态”？</text>
    <text x="40" y="155" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">里面没有任何会旋转的马达或齿轮，全是安安静静的电子芯片。</text>

    <text x="25" y="195" font-family="-apple-system,sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">• 为什么 4K 随机小文件也很快？</text>
    <text x="40" y="220" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">每个活页夹都有一个极聪明的电子管家（主控），不管你要第 1 页还是第 999 页，管家眨眼间直接指给你看，不需要排队寻道。</text>

    <text x="25" y="260" font-family="-apple-system,sans-serif" font-size="15" fill="#4ade80" font-weight="600">💡 掉电关机后呢？</text>
    <text x="40" y="285" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">抽屉锁好，里面的活页字迹被永久封印，放假一个月回来打开依然完好如初！</text>
  </g>

  <!-- Box 3: HDD -> Vinyl Record Archive -->
  <g transform="translate(80, 480)">
    <rect width="580" height="330" rx="14" fill="url(#card1)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="50" cy="50" r="28" fill="#b45309"/>
    <text x="50" y="58" font-size="28" text-anchor="middle">📻</text>
    <text x="95" y="46" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#f59e0b">机械硬盘 (HDD) ＝ 街角的老式黑胶唱片馆</text>
    <text x="95" y="70" font-family="-apple-system,sans-serif" font-size="14" fill="#94a3b8">【特性】：容量巨大极便宜、机械马达旋转、最怕随机寻道</text>
    <path d="M25,95 H555" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="130" font-family="-apple-system,sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">• 它是怎么工作的？</text>
    <text x="40" y="155" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">几张圆盘以每分钟 7200 圈在疯狂旋转，一根像留声机唱针的机械臂飞来飞去对准磁道读取数据。</text>

    <text x="25" y="195" font-family="-apple-system,sans-serif" font-size="15" fill="#f87171" font-weight="600">⚠️ 为什么读小碎文件会卡到怀疑人生？</text>
    <text x="40" y="220" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">如果你要看一部连续的大电影，磁头停在一个磁道连续读，速度还行；但如果你要找 10,000 张碎照片，机械臂必须来回摆动 10,000 次，每次摆动都要耗费毫秒级时间，当场累趴！</text>

    <text x="25" y="270" font-family="-apple-system,sans-serif" font-size="15" fill="#f59e0b" font-weight="600">💡 为什么现在还在用它？</text>
    <text x="40" y="295" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">太便宜了！花同样几百块，SSD 只能买 1TB，机械硬盘能买 4TB 甚至 8TB！</text>
  </g>

  <!-- Box 4: USB -> Grocery Bag -->
  <g transform="translate(740, 480)">
    <rect width="580" height="330" rx="14" fill="url(#card1)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="50" cy="50" r="28" fill="#7e22ce"/>
    <text x="50" y="58" font-size="28" text-anchor="middle">🛍️</text>
    <text x="95" y="46" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#c084fc">U 盘 (USB) ＝ 随身的轻便帆布买菜袋</text>
    <text x="95" y="70" font-family="-apple-system,sans-serif" font-size="14" fill="#94a3b8">【特性】：随插随用、临时搬运、芯片羸弱没有智慧脑</text>
    <path d="M25,95 H555" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="130" font-family="-apple-system,sans-serif" font-size="15" fill="#f1f5f9" font-weight="600">• 为什么表面也是芯片，却不能代替固态？</text>
    <text x="40" y="155" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">虽然也是闪存，但它只有一根简易单通道，没有独立缓存，主控智力只有‘幼儿园级别’，经不起高并发折腾。</text>

    <text x="25" y="195" font-family="-apple-system,sans-serif" font-size="15" fill="#f87171" font-weight="600">⚠️ 为什么进度条 100% 拔出来就坏了？</text>
    <text x="40" y="220" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">电脑骗了你！操作系统先把文件塞进了自己极快的内存书桌，骗你说‘拷完了’；实际上还在偷偷往买菜袋里塞，你猛地一扯袋子，东西掉了一地全砸烂了！</text>

    <text x="25" y="270" font-family="-apple-system,sans-serif" font-size="15" fill="#a855f7" font-weight="600">💡 正确姿势：</text>
    <text x="40" y="295" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">买菜袋是拿来临时送东西的，千万不要在里面生火做饭（别在上面装系统跑高负载）！</text>
  </g>
</svg>