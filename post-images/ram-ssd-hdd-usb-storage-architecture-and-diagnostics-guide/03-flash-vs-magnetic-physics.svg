<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1120"/><stop offset="100%" stop-color="#030712"/></linearGradient>
  </defs>
  <rect width="1400" height="820" fill="url(#bg3)"/>

  <text x="700" y="55" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">微观物理本质：半导体量子隧穿 (闪存) VS 磁畴偏转 (磁盘)</text>
  <text x="700" y="88" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">为什么 SSD 写入前必须整块擦除？为什么机械硬盘必须承受毫秒级寻道？</text>

  <!-- Left: NAND Flash Cell -->
  <g transform="translate(60, 120)">
    <rect width="600" height="650" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="45" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle">【闪存技术】NAND 浮栅 / 电荷陷阱单元</text>
    <text x="300" y="72" font-family="-apple-system,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">应用于：内存(DRAM变种)、SSD、U盘</text>
    <path d="M25,90 H575" stroke="#334155" stroke-width="1.5"/>

    <!-- Microscopic Structure Diagram -->
    <rect x="100" y="115" width="400" height="40" rx="6" fill="#3b82f6"/>
    <text x="300" y="140" font-family="monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Control Gate 控制栅极 (加高电压)</text>

    <rect x="100" y="165" width="400" height="20" rx="4" fill="#64748b"/>
    <text x="300" y="180" font-family="-apple-system,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">绝缘氧化阻挡层 (Inter-poly Oxide)</text>

    <rect x="100" y="195" width="400" height="45" rx="6" fill="#f59e0b"/>
    <text x="300" y="222" font-family="monospace" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Floating Gate 浮栅层 (捕获电子 e⁻ e⁻ e⁻)</text>

    <rect x="100" y="250" width="400" height="20" rx="4" fill="#ef4444" opacity="0.8"/>
    <text x="300" y="265" font-family="-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">隧穿二氧化硅层 (Tunnel Oxide ~ 10nm)</text>

    <rect x="100" y="280" width="400" height="50" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="300" y="310" font-family="monospace" font-size="15" fill="#94a3b8" text-anchor="middle">P型硅衬底 (P-type Silicon Substrate)</text>

    <!-- Key physical rules -->
    <g transform="translate(30, 360)">
      <text x="0" y="25" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#38bdf8">1. 写前必擦 (Erase before Write) 铁律：</text>
      <text x="15" y="50" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 读取和写入以「页 (Page，如 4KB/16KB)」为最小单位；</text>
      <text x="15" y="72" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 但擦除必须以整个「块 (Block，如几百个 Page，4MB~8MB)」进行！</text>
      <text x="15" y="94" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 这就引发了【写入放大 (Write Amplification)】与垃圾回收 (GC)。</text>

      <text x="0" y="135" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f87171">2. 寿命损耗 (P/E Cycle 磨损)：</text>
      <text x="15" y="160" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 电子每次靠高压强行穿过 10nm 隧穿层，都会损伤绝缘晶格；</text>
      <text x="15" y="182" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• SLC: ~100,000 次 | TLC: ~1,000 ~ 3,000 次 | QLC: ~500 ~ 1,000 次；</text>
      <text x="15" y="204" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 优质 SSD 靠精密磨损均衡算法 (Wear Leveling) 平均分摊寿命。</text>
    </g>
  </g>

  <!-- Right: Mechanical HDD Physics -->
  <g transform="translate(740, 120)">
    <rect width="600" height="650" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="45" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#f59e0b" text-anchor="middle">【磁记录技术】机械磁盘与巨磁阻磁头</text>
    <text x="300" y="72" font-family="-apple-system,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">应用于：3.5 寸 / 2.5 寸机械硬盘 (CMR / SMR)</text>
    <path d="M25,90 H575" stroke="#334155" stroke-width="1.5"/>

    <!-- Disk platter and actuator graphic -->
    <circle cx="200" cy="220" r="100" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="200" cy="220" r="30" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <path d="M200,220 L360,160" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="360" cy="160" r="14" fill="#ef4444"/>
    <text x="385" y="165" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#ef4444">磁头悬浮间隙仅 5 纳米！</text>

    <g transform="translate(30, 360)">
      <text x="0" y="25" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f59e0b">1. 机械寻道时间 (Seek Time) 的物理诅咒：</text>
      <text x="15" y="50" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 机械臂摆动对准磁道 (寻道时间)：通常耗时 4 ~ 9 毫秒 (ms)；</text>
      <text x="15" y="72" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 碟片转动让目标扇区转到磁头下方 (旋转延迟)：7200转需约 4.16 ms；</text>
      <text x="15" y="94" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• 一次随机读取合计耗时 8 ~ 13 ms，算下来每秒最多做 100 次 I/O！</text>

      <text x="0" y="135" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f87171">2. 瓦楞磁记录 (SMR) 的叠瓦大坑：</text>
      <text x="15" y="160" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• CMR (传统垂直)：磁道独立平行排列，改写互不干扰，性能稳定；</text>
      <text x="15" y="182" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">• SMR (叠瓦式)：像屋顶瓦片一样叠放磁道，改写一个扇区必须把后面整片</text>
      <text x="15" y="204" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">   重写一遍！遇到连续随机写时，写入速度暴跌至 0KB/s，系统死锁！</text>
    </g>
  </g>
</svg>