<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1329"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="l1g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="l2g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <linearGradient id="l3g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="l4g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="l5g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="l6g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/></linearGradient>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>

  <text x="700" y="55" font-family="-apple-system,sans-serif" font-size="30" font-weight="900" fill="#f8fafc" text-anchor="middle">计算机存储金字塔：速度、容量与时空跨度全景图</text>
  <text x="700" y="90" font-family="-apple-system,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">假定 CPU 1 个时钟周期 = 人类世界的 1 秒，看看访问各个存储介质需要等待多久？</text>

  <!-- Left annotations: Speed / Cost -->
  <g transform="translate(60, 240)">
    <path d="M40,380 V0" stroke="#f43f5e" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="30" y="-15" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f43f5e" text-anchor="middle">⚡ 访问速度最快 / 每GB造价最高</text>
    <text x="30" y="415" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">🐢 访问速度慢 / 容量超大便宜</text>
  </g>

  <!-- Pyramid Tiers -->
  <!-- Tier 1: CPU Registers & Cache -->
  <polygon points="700,130 570,220 830,220" fill="url(#l1g)" opacity="0.9"/>
  <text x="700" y="180" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">CPU 寄存器 &amp; L1/L2/L3 缓存</text>
  <text x="700" y="202" font-family="monospace" font-size="13" fill="#fef08a" text-anchor="middle">&lt; 1 ~ 10 ns (人类感知：1 秒 ~ 10 秒)</text>

  <!-- Tier 2: RAM (DRAM) -->
  <polygon points="570,225 830,225 930,335 470,335" fill="url(#l2g)" opacity="0.9"/>
  <text x="700" y="270" font-family="-apple-system,sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">内存 (RAM / DDR4 / DDR5)</text>
  <text x="700" y="295" font-family="-apple-system,sans-serif" font-size="14" fill="#1e293b" font-weight="600" text-anchor="middle">容量：16GB ~ 256GB | 延迟：50 ~ 80 ns (人类感知：约 3 ~ 4 分钟)</text>
  <text x="700" y="318" font-family="-apple-system,sans-serif" font-size="13" fill="#451a03" text-anchor="middle">易失介质，CPU 通过内存总线直连</text>

  <!-- Tier 3: NVMe SSD -->
  <polygon points="470,340 930,340 1020,455 380,455" fill="url(#l3g)" opacity="0.9"/>
  <text x="700" y="385" font-family="-apple-system,sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">NVMe PCIe 4.0/5.0 固态硬盘 (SSD)</text>
  <text x="700" y="412" font-family="-apple-system,sans-serif" font-size="14" fill="#f0f9ff" text-anchor="middle">容量：512GB ~ 8TB | 延迟：20 ~ 50 μs (人类感知：约 1.5 天 ~ 2 天！)</text>
  <text x="700" y="435" font-family="-apple-system,sans-serif" font-size="13" fill="#bae6fd" text-anchor="middle">从内存掉落到 SSD，CPU 感觉已经度过了一个漫长周末</text>

  <!-- Tier 4: SATA SSD -->
  <polygon points="380,460 1020,460 1090,560 310,560" fill="url(#l4g)" opacity="0.9"/>
  <text x="700" y="500" font-family="-apple-system,sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">SATA 3.0 固态硬盘 (SATA SSD)</text>
  <text x="700" y="525" font-family="-apple-system,sans-serif" font-size="14" fill="#f0fdf4" text-anchor="middle">受限 SATA 6Gbps 总线上限 550MB/s | 延迟：100 ~ 150 μs (人类感知：约 4 ~ 6 天)</text>
  <text x="700" y="545" font-family="-apple-system,sans-serif" font-size="13" fill="#dcfce7" text-anchor="middle">早期升级神器，现已逐渐被 NVMe 全面替代</text>

  <!-- Tier 5: HDD (Mechanical Hard Drive) -->
  <polygon points="310,565 1090,565 1160,675 240,675" fill="url(#l5g)" opacity="0.9"/>
  <text x="700" y="605" font-family="-apple-system,sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">机械硬盘 (HDD / 3.5寸 7200 RPM)</text>
  <text x="700" y="632" font-family="-apple-system,sans-serif" font-size="14" fill="#faf5ff" text-anchor="middle">容量：4TB ~ 26TB | 物理寻道延迟：8,000 ~ 12,000 μs (人类感知：整整 4 个月！)</text>
  <text x="700" y="655" font-family="-apple-system,sans-serif" font-size="13" fill="#f3e8ff" text-anchor="middle">CPU 等待机械磁盘寻道一个扇区，就像等一个快递寄了 4 个月！</text>

  <!-- Tier 6: USB Flash Drive / Cold Storage -->
  <polygon points="240,680 1160,680 1230,785 170,785" fill="url(#l6g)" opacity="0.9"/>
  <text x="700" y="718" font-family="-apple-system,sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">普通 U 盘 (USB Flash Drive) &amp; 冷备份介质</text>
  <text x="700" y="743" font-family="-apple-system,sans-serif" font-size="14" fill="#f1f5f9" text-anchor="middle">无 DRAM 缓存，4K 随机写入延迟达数十毫秒，甚至触发 USB 超时重置</text>
  <text x="700" y="765" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">主要用途：临时跨机文件交换、PE 启动装机，千万不要拿来做数据库宿主！</text>

  <!-- Legend / Key takeaway -->
  <rect x="200" y="805" width="1000" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="700" y="830" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">📌 核心启示：CPU 与存储设备之间的速度鸿沟跨越了 7 个数量级，操作系统的一切缓存调度都在努力掩盖这个残酷现实！</text>
</svg>