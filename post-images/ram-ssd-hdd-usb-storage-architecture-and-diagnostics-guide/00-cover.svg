<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#spaceBg)"/>

  <!-- Background decorative grid & circuits -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <path d="M0,150 H1600 M0,300 H1600 M0,450 H1600 M0,600 H1600 M0,750 H1600"/>
    <path d="M200,0 V900 M400,0 V900 M600,0 V900 M800,0 V900 M1000,0 V900 M1200,0 V900 M1400,0 V900"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="800" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">STORAGE &amp; MEMORY DEEP DIVE ARCHITECTURE</text>
  <text x="800" y="180" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle">内存 · U盘 · 机械硬盘 · 固态硬盘：底层真相与全景指南</text>
  <text x="800" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle">从微观物理到纳秒延迟 · 4K 随机读写 · SLC 缓存崩塌 · 脏页防掉电 · 自动化体检全景</text>

  <!-- 4 Cards representing the 4 Technologies -->
  <!-- Card 1: RAM -->
  <g transform="translate(100, 290)">
    <rect width="320" height="480" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="20" width="70" height="28" rx="6" fill="#0284c7"/>
    <text x="55" y="39" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">DRAM</text>
    <text x="20" y="85" font-family="-apple-system,sans-serif" font-size="32" font-weight="800" fill="#38bdf8">内存 (RAM)</text>
    <text x="20" y="115" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">主存 / 纳秒级快速课桌</text>
    <path d="M20,135 H300" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="170" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">物理介质：<tspan fill="#f1f5f9" font-weight="600">电容充放电 (DRAM 晶体管)</tspan></text>
    <text x="20" y="205" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">读取延迟：<tspan fill="#4ade80" font-weight="700">~ 50 - 80 纳秒 (ns)</tspan></text>
    <text x="20" y="240" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">持续吞吐：<tspan fill="#38bdf8" font-weight="700">50,000 ~ 100,000 MB/s</tspan></text>
    <text x="20" y="275" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">4K 随机读：<tspan fill="#4ade80" font-weight="700">&gt; 500,000 IOPS</tspan></text>
    <text x="20" y="310" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">易失特性：<tspan fill="#f87171" font-weight="700">断电数据即刻清空！</tspan></text>
    <text x="20" y="345" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">核心职责：<tspan fill="#f1f5f9">CPU 直接寻址、程序运行时</tspan></text>

    <rect x="20" y="385" width="280" height="70" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="412" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#38bdf8">💡 通俗比喻：</text>
    <text x="35" y="437" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">课桌桌面，随手翻书最快，放学清场</text>
  </g>

  <!-- Card 2: NVMe SSD -->
  <g transform="translate(460, 290)">
    <rect width="320" height="480" rx="16" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="2"/>
    <rect x="20" y="20" width="70" height="28" rx="6" fill="#15803d"/>
    <text x="55" y="39" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">NVMe</text>
    <text x="20" y="85" font-family="-apple-system,sans-serif" font-size="32" font-weight="800" fill="#4ade80">固态硬盘 (SSD)</text>
    <text x="20" y="115" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">闪存 / 高速电子档案库</text>
    <path d="M20,135 H300" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="170" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">物理介质：<tspan fill="#f1f5f9" font-weight="600">3D NAND 闪存 (浮栅/电荷陷阱)</tspan></text>
    <text x="20" y="205" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">读取延迟：<tspan fill="#4ade80" font-weight="700">~ 20 - 50 微秒 (μs)</tspan></text>
    <text x="20" y="240" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">持续吞吐：<tspan fill="#38bdf8" font-weight="700">3,500 ~ 7,500+ MB/s</tspan></text>
    <text x="20" y="275" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">4K 随机读：<tspan fill="#4ade80" font-weight="700">500,000 ~ 1,000,000 IOPS</tspan></text>
    <text x="20" y="310" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">非易失性：<tspan fill="#86efac" font-weight="700">掉电安全持久化 (Flash)</tspan></text>
    <text x="20" y="345" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">核心机制：<tspan fill="#f1f5f9">FTL 映射表、TRIM、SLC 缓存</tspan></text>

    <rect x="20" y="385" width="280" height="70" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="412" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#4ade80">💡 通俗比喻：</text>
    <text x="35" y="437" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">抽屉里的速查活页夹，瞬间翻到指定页</text>
  </g>

  <!-- Card 3: HDD -->
  <g transform="translate(820, 290)">
    <rect width="320" height="480" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="20" width="70" height="28" rx="6" fill="#b45309"/>
    <text x="55" y="39" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">SATA</text>
    <text x="20" y="85" font-family="-apple-system,sans-serif" font-size="32" font-weight="800" fill="#f59e0b">机械硬盘 (HDD)</text>
    <text x="20" y="115" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">磁性磁盘 / 慢速海量集装箱</text>
    <path d="M20,135 H300" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="170" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">物理介质：<tspan fill="#f1f5f9" font-weight="600">旋转磁碟片 + 移动磁头臂</tspan></text>
    <text x="20" y="205" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">读取延迟：<tspan fill="#f87171" font-weight="700">~ 8,000 - 15,000 微秒 (毫秒级)</tspan></text>
    <text x="20" y="240" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">持续吞吐：<tspan fill="#cbd5e1" font-weight="700">150 ~ 260 MB/s (外圈)</tspan></text>
    <text x="20" y="275" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">4K 随机读：<tspan fill="#f87171" font-weight="700">只有可怜的 75 ~ 150 IOPS</tspan></text>
    <text x="20" y="310" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">致命弱点：<tspan fill="#f87171" font-weight="700">怕摔怕震、机械寻道极慢</tspan></text>
    <text x="20" y="345" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">核心优势：<tspan fill="#4ade80">每 GB 成本超低、冷数据仓储</tspan></text>

    <rect x="20" y="385" width="280" height="70" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="412" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#f59e0b">💡 通俗比喻：</text>
    <text x="35" y="437" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">几条街外的黑胶唱片馆，磁头划片找歌</text>
  </g>

  <!-- Card 4: USB Drive -->
  <g transform="translate(1180, 290)">
    <rect width="320" height="480" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2"/>
    <rect x="20" y="20" width="70" height="28" rx="6" fill="#7e22ce"/>
    <text x="55" y="39" font-family="monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">USB 3.x</text>
    <text x="20" y="85" font-family="-apple-system,sans-serif" font-size="32" font-weight="800" fill="#c084fc">U 盘 (Flash Disk)</text>
    <text x="20" y="115" font-family="-apple-system,sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">便携闪存 / 随身帆布买菜袋</text>
    <path d="M20,135 H300" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="170" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">物理介质：<tspan fill="#f1f5f9" font-weight="600">低成本 NAND (单/双通道主控)</tspan></text>
    <text x="20" y="205" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">DRAM 缓存：<tspan fill="#f87171" font-weight="700">无 (DRAM-less 架构)</tspan></text>
    <text x="20" y="240" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">持续写入：<tspan fill="#fbbf24" font-weight="700">缓外断崖跌至 5 ~ 20 MB/s</tspan></text>
    <text x="20" y="275" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">4K 随机写：<tspan fill="#f87171" font-weight="700">&lt; 50 IOPS (零碎文件极其卡顿)</tspan></text>
    <text x="20" y="310" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">拔出风险：<tspan fill="#f87171" font-weight="700">脏页未刷盘直接拔出即损坏</tspan></text>
    <text x="20" y="345" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8">核心使命：<tspan fill="#cbd5e1">随身临时拷文档、系统引导盘</tspan></text>

    <rect x="20" y="385" width="280" height="70" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="412" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#c084fc">💡 通俗比喻：</text>
    <text x="35" y="437" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">随身布袋，装几个苹果方便，别当仓库</text>
  </g>

  <!-- Footer Banner -->
  <rect x="100" y="800" width="1400" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="800" y="837" font-family="-apple-system,sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">🔥 关键准则：绝不能把 U 盘当固态长期跑系统；不能把内存当磁盘存储数据；机械硬盘忌零碎 4K，固态硬盘重健康与 TRIM</text>
</svg>