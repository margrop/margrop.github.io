<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1329"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  </defs>
  <rect width="1400" height="800" fill="url(#bg5)"/>

  <text x="700" y="55" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">操作系统“脏页机制”：为什么进度条到 100% 拔出 U 盘依然会损坏？</text>
  <text x="700" y="88" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Page Cache（页面缓存）的甜头与苦果：用户态写操作 vs 物理磁盘真实落盘</text>

  <!-- Flow Diagram -->
  <!-- Step 1: User Application -->
  <g transform="translate(60, 140)">
    <rect width="260" height="240" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="45" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#38bdf8" text-anchor="middle">① 用户程序 / 拷贝窗口</text>
    <path d="M20,65 H240" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="105" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">用户拖拽文件到 U 盘</text>
    <text x="25" y="135" font-family="monospace" font-size="13" fill="#86efac">write(fd, buf, size);</text>
    <text x="25" y="170" font-family="-apple-system,sans-serif" font-size="14" fill="#fbbf24">进度条飞速冲到 100%！</text>
    <text x="25" y="200" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3b8">用户以为已经完全保存完成</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M330,260 H410" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6"/>
  <text x="370" y="245" font-family="monospace" font-size="13" fill="#38bdf8" text-anchor="middle">RAM 写入</text>

  <!-- Step 2: RAM Page Cache (Dirty Pages) -->
  <g transform="translate(420, 140)">
    <rect width="360" height="240" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="180" y="45" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#f59e0b" text-anchor="middle">② 系统内核 Page Cache (内存)</text>
    <path d="M20,65 H340" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="105" font-family="-apple-system,sans-serif" font-size="14" fill="#f1f5f9">内核为了性能，将数据暂存在 RAM 中！</text>
    <rect x="25" y="125" width="310" height="40" rx="6" fill="#78350f"/>
    <text x="180" y="150" font-family="monospace" font-size="14" font-weight="700" fill="#fde68a" text-anchor="middle">标记为 Dirty Pages (脏页)</text>
    <text x="25" y="195" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">此时数据【根本没有写进闪存】！</text>
    <text x="25" y="218" font-family="-apple-system,sans-serif" font-size="12" fill="#94a3b8">只存在于断电即失的内存芯片里</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M790,260 H870" stroke="#f59e0b" stroke-width="4"/>
  <text x="830" y="245" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="middle">慢速异步刷盘</text>

  <!-- Step 3: USB / Storage -->
  <g transform="translate(880, 140)">
    <rect width="280" height="240" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="140" y="45" font-family="-apple-system,sans-serif" font-size="18" font-weight="800" fill="#c084fc" text-anchor="middle">③ 实体介质 (U 盘 / 机械硬盘)</text>
    <path d="M20,65 H260" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="105" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">龟速写入 (如 8 MB/s)...</text>
    <text x="25" y="135" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">后台 flusher 线程慢慢同步</text>
    <text x="25" y="170" font-family="monospace" font-size="13" fill="#38bdf8">sync() / fsync()</text>
    <text x="25" y="205" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#4ade80">直到此时，数据才真正落盘！</text>
  </g>

  <!-- Disaster Callout -->
  <g transform="translate(100, 430)">
    <rect width="1200" height="310" rx="14" fill="#111827" stroke="#f87171" stroke-width="2"/>
    <text x="600" y="45" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#f87171" text-anchor="middle">💥 经典灾难现场：直接拔掉 U 盘到底发生了什么？</text>
    <path d="M30,65 H1170" stroke="#334155" stroke-width="1.5"/>

    <g transform="translate(40, 95)">
      <text x="0" y="20" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fca5a5">1. 文件内容截断为 0 字节或半截损坏：</text>
      <text x="20" y="45" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">在内存里排队的后半部分数据随着瞬间拔出灰飞烟灭，插到别的电脑打开提示“文件已损坏”。</text>

      <text x="0" y="85" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#fca5a5">2. 文件系统元数据 (FAT/MFT/Superblock) 撕裂：</text>
      <text x="20" y="110" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">若恰好在更新目录表（Directory Entry）时断电，整个 U 盘文件系统直接崩溃，Windows 提示“需要格式化后才能使用”。</text>

      <text x="0" y="150" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#4ade80">✅ 防御之道与工程治理策略：</text>
      <text x="20" y="175" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">• Windows：默认对 U 盘开启「快速删除 (Quick Removal)」策略（禁用写缓存）；若为了速度开启了写缓存，拔出前务必点击【安全删除硬件】！</text>
      <text x="20" y="198" font-family="-apple-system,sans-serif" font-size="14" fill="#cbd5e1">• Linux / macOS：拔盘前在终端敲下 <tspan font-family="monospace" fill="#38bdf8">sync</tspan> 命令，或者在文件管理器右键【弹出 (Unmount)】，等待完全退出后再拔。</text>
    </g>
  </g>
</svg>