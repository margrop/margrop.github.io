<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" width="1400" height="840">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
  </defs>
  <rect width="1400" height="840" fill="url(#bg4)"/>

  <text x="700" y="55" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle">架构解剖：为什么普通 U 盘绝不能当成 SSD 使用？</text>
  <text x="700" y="88" font-family="-apple-system,sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">表面上都是 USB/Type-C 接口与闪存颗粒，内部微架构却隔着银河系</text>

  <!-- Left: USB Flash Drive Internals -->
  <g transform="translate(60, 120)">
    <rect width="600" height="680" rx="14" fill="#111827" stroke="#a855f7" stroke-width="2"/>
    <text x="300" y="42" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#c084fc" text-anchor="middle">普通 U 盘内部架构 (USB Flash Drive)</text>
    <path d="M25,65 H575" stroke="#334155" stroke-width="1.5"/>

    <!-- Blocks -->
    <rect x="50" y="90" width="500" height="60" rx="8" fill="#581c87" stroke="#7e22ce"/>
    <text x="300" y="125" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">USB 接口 (USB 2.0 / 3.0 / 3.2 Gen1 单PHY)</text>

    <rect x="50" y="170" width="500" height="90" rx="8" fill="#1e293b" stroke="#a855f7"/>
    <text x="300" y="205" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="#f43f5e" text-anchor="middle">低端单通道主控 (Single-Channel ASIC)</text>
    <text x="300" y="235" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">❌ 无独立 DRAM 缓存芯片  |  ❌ 无复杂垃圾回收与磨损均衡</text>

    <!-- Channels -->
    <path d="M300,260 V300" stroke="#a855f7" stroke-width="3" stroke-dasharray="4"/>
    <text x="310" y="285" font-family="monospace" font-size="13" fill="#c084fc">仅 1 条通路 (Single Channel)</text>

    <rect x="50" y="300" width="500" height="110" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="300" y="340" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">NAND 闪存芯片 (通常为降级片/黑片/QLC)</text>
    <text x="300" y="370" font-family="-apple-system,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">SLC 模拟缓存仅 1GB ~ 4GB，写满后直坠 TLC/QLC 裸速 (3 ~ 15 MB/s)</text>

    <!-- Diagnostics Breakdown -->
    <g transform="translate(30, 440)">
      <text x="0" y="25" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f87171">⚠️ 为什么用 U 盘跑系统/Docker 会暴毙？</text>
      <text x="15" y="52" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">1. 没有 TRIM 指令：操作系统删除文件后，U盘主控无法回收无效块；</text>
      <text x="15" y="77" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">2. 写入放大系数极高：跑系统每天产生海量零碎日志，闪存颗粒在几周内</text>
      <text x="30" y="99" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">被耗尽 P/E 寿命，直接锁死为【只读】甚至主控掉盘识别为 0 字节；</text>
      <text x="15" y="125" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">3. 散热极度恶劣：无金属马甲导热，持续写入温度直奔 80℃ 导致热衰减。</text>
    </g>
  </g>

  <!-- Right: NVMe SSD Internals -->
  <g transform="translate(740, 120)">
    <rect width="600" height="680" rx="14" fill="#111827" stroke="#4ade80" stroke-width="2"/>
    <text x="300" y="42" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#4ade80" text-anchor="middle">正规 NVMe M.2 固态硬盘内部架构</text>
    <path d="M25,65 H575" stroke="#334155" stroke-width="1.5"/>

    <!-- Blocks -->
    <rect x="50" y="90" width="500" height="60" rx="8" fill="#14532d" stroke="#22c55e"/>
    <text x="300" y="125" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">PCIe 4.0 / 5.0 x4 总线 (64,000 ~ 128,000 MT/s)</text>

    <rect x="50" y="170" width="300" height="90" rx="8" fill="#1e293b" stroke="#22c55e"/>
    <text x="200" y="205" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#4ade80" text-anchor="middle">高端多通道主控芯片 (8 通道)</text>
    <text x="200" y="235" font-family="-apple-system,sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">多核 ARM CPU、TRIM、GC 算法</text>

    <rect x="370" y="170" width="180" height="90" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="460" y="205" font-family="-apple-system,sans-serif" font-size="15" font-weight="800" fill="#38bdf8" text-anchor="middle">独立 DRAM 缓存</text>
    <text x="460" y="235" font-family="-apple-system,sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">存放整张 FTL 映射表</text>

    <!-- Channels -->
    <path d="M120,260 V300 M240,260 V300 M360,260 V300 M480,260 V300" stroke="#22c55e" stroke-width="3"/>
    <text x="300" y="285" font-family="monospace" font-size="13" fill="#86efac" text-anchor="middle">4 ~ 8 通道并行并发读写 (Multi-Channel Interleave)</text>

    <rect x="50" y="300" width="500" height="110" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="300" y="340" font-family="-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">原厂正品 3D TLC/QLC NAND 颗粒 (高 P/E 寿命)</text>
    <text x="300" y="370" font-family="-apple-system,sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">全盘动态 SLC Cache 调度、OP 预留冗余空间、ECC 纠错引擎</text>

    <!-- Diagnostics Breakdown -->
    <g transform="translate(30, 440)">
      <text x="0" y="25" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#4ade80">✅ 正规 SSD 的工业级保障：</text>
      <text x="15" y="52" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">1. 原生 TRIM 与磨损均衡：保证每一颗闪存块的擦写次数绝对平均；</text>
      <text x="15" y="77" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">2. 完整 NVMe 队列：支持 64,000 个队列，每个队列 64,000 条并发指令；</text>
      <text x="15" y="102" font-family="-apple-system,sans-serif" font-size="13" fill="#cbd5e1">3. SMART 健康监控：实时上报已写字节数 (TBW)、备用块比例与温度告警。</text>
    </g>
  </g>
</svg>