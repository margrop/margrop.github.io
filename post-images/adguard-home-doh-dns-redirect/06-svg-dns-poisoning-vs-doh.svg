<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1515"/>
      <stop offset="100%" stop-color="#180b0b"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d28"/>
      <stop offset="100%" stop-color="#071815"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="url(#bg2)" rx="24"/>
  <rect x="2" y="2" width="1596" height="756" fill="none" stroke="#1e293b" stroke-width="2" rx="23"/>

  <text x="70" y="65" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="700" letter-spacing="3">SECURITY CONTRAST · 传输层明密对比</text>
  <text x="70" y="115" fill="#f8fafc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="32" font-weight="bold">传统 UDP 53 明文广播 vs DoH 加密信封（彻底防投毒）</text>

  <g transform="translate(70, 160)">
    <rect width="690" height="530" rx="16" fill="url(#badGrad)" stroke="#dc2626" stroke-width="2"/>
    <text x="35" y="50" fill="#ef4444" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="24" font-weight="bold">❌ 传统 UDP 53：走廊里大喊大叫（极易被抢答伪造）</text>

    <rect x="35" y="85" width="130" height="60" rx="8" fill="#331414" stroke="#7f1d1d"/>
    <text x="100" y="122" fill="#ffffff" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="bold">本地客户端</text>

    <line x1="165" y1="115" x2="310" y2="115" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="237" y="105" fill="#fca5a5" font-family="system-ui" font-size="13" text-anchor="middle">明文 UDP 53</text>

    <rect x="310" y="85" width="130" height="60" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="375" y="112" fill="#ffffff" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">中间拦截节点</text>
    <text x="375" y="132" fill="#fca5a5" font-family="system-ui" font-size="12" text-anchor="middle">DPI / 运营商代理</text>

    <line x1="440" y1="115" x2="520" y2="115" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>

    <rect x="520" y="85" width="135" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="587" y="122" fill="#94a3b8" font-family="system-ui" font-size="15" text-anchor="middle">公网公共 DNS</text>

    <path d="M 375 145 L 375 220 L 120 220 L 120 155" fill="none" stroke="#ef4444" stroke-width="3"/>
    <text x="250" y="245" fill="#ef4444" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15" font-weight="bold">⚡ 恶意/错误伪造应答抢先飞回客户端！</text>

    <rect x="35" y="270" width="620" height="225" rx="12" fill="#1c0f0f" stroke="#7f1d1d"/>
    <text x="55" y="305" fill="#fca5a5" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="17" font-weight="bold">致命弱点分析：</text>
    <text x="55" y="340" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">1. 无身份认证：UDP 协议无状态，只要源端口和 Query ID 匹配，客户端盲信。</text>
    <text x="55" y="375" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">2. 无防篡改机制：报文全透明，网络途经光猫、汇聚交换机、骨干网均可随意劫持。</text>
    <text x="55" y="410" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">3. 运营商透明代理陷阱：你在电脑写了 223.5.*.*，实际上包根本没到阿里，</text>
    <text x="55" y="440" fill="#f87171" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">   中途就被运营商光猫或网关拦截并返回缓存旧数据甚至劫持广告！</text>
    <text x="55" y="475" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">👦 比方：你在走廊喊“小红家在哪”，走廊恶霸直接插话骗你跑去假地址。</text>
  </g>

  <g transform="translate(840, 160)">
    <rect width="690" height="530" rx="16" fill="url(#goodGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="35" y="50" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="24" font-weight="bold">🛡️ DoH 加密上游：专职信使的密码保险箱</text>

    <rect x="35" y="85" width="130" height="60" rx="8" fill="#064e3b" stroke="#059669"/>
    <text x="100" y="122" fill="#ffffff" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="bold">AdGuard Home</text>

    <line x1="165" y1="115" x2="520" y2="115" stroke="#10b981" stroke-width="4"/>
    <rect x="250" y="100" width="180" height="30" rx="6" fill="#047857"/>
    <text x="340" y="121" fill="#ffffff" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="bold">TLS 1.3 强加密隧道 (443)</text>

    <rect x="520" y="85" width="135" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="587" y="112" fill="#ffffff" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="bold">可信 DoH 上游</text>
    <text x="587" y="132" fill="#6ee7b7" font-family="system-ui" font-size="12" text-anchor="middle">阿里/腾讯/自建 DoH</text>

    <rect x="35" y="270" width="620" height="225" rx="12" fill="#06221e" stroke="#059669"/>
    <text x="55" y="305" fill="#6ee7b7" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="17" font-weight="bold">核心防御优势：</text>
    <text x="55" y="340" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">1. 严密双向校验：DNS 查询封装在标准 HTTPS 报文内（RFC 8484），内容全密文。</text>
    <text x="55" y="375" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">2. 彻底瓦解旁路投毒：中间网络设备根本看不到查询的域名，更无法抢答注入！</text>
    <text x="55" y="410" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">3. 权威证书锁定身份：若中间节点企图伪造阿里/腾讯 DoH 服务器，会因无合法证书</text>
    <text x="55" y="440" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">   在 TLS 握手阶段被 AdGuard Home 斩立决，绝不接收任何污染数据！</text>
    <text x="55" y="475" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">👦 比方：把信包装进指纹密码箱直接送到专家办公室，路上谁也打不开、改不了。</text>
  </g>
</svg>
