<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="680" fill="url(#bg5)" rx="24"/>
  <rect x="2" y="2" width="1596" height="676" fill="none" stroke="#1e293b" stroke-width="2" rx="23"/>

  <text x="70" y="65" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="700" letter-spacing="3">ACCEPTANCE STANDARD · 端到端闭环验收规范</text>
  <text x="70" y="115" fill="#f8fafc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="32" font-weight="bold">“后台显示保存成功”不等于“故障修好”：四大验收漏斗</text>

  <g transform="translate(70, 160)">
    <rect width="330" height="450" rx="14" fill="#111c33" stroke="#38bdf8" stroke-width="2"/>
    <rect x="25" y="25" width="40" height="40" rx="8" fill="#0284c7"/>
    <text x="45" y="52" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="bold" text-anchor="middle">1</text>
    <text x="75" y="52" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="bold">第一层：DNS 证据</text>

    <text x="25" y="105" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【命令工具】</text>
    <rect x="25" y="118" width="280" height="35" rx="6" fill="#0b1329"/>
    <text x="35" y="141" fill="#38bdf8" font-family="monospace" font-size="13">dig @192.168.X.X blog... A</text>

    <text x="25" y="185" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【硬核验收指标】</text>
    <text x="25" y="215" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 返回状态必须为 NOERROR</text>
    <text x="25" y="245" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ A 记录精准指向源站 IP</text>
    <text x="25" y="275" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">  (185.199.*.* Anycast)</text>
    <text x="25" y="305" fill="#f87171" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">❌ 绝不出现 123.125.*.*</text>

    <rect x="25" y="340" width="280" height="85" rx="8" fill="#1e293b"/>
    <text x="35" y="370" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">确保不仅查到了答案，</text>
    <text x="35" y="395" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">且答案在真实源站 IP 列表中。</text>
  </g>

  <g transform="translate(430, 160)">
    <rect width="330" height="450" rx="14" fill="#111c33" stroke="#818cf8" stroke-width="2"/>
    <rect x="25" y="25" width="40" height="40" rx="8" fill="#4f46e5"/>
    <text x="45" y="52" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="bold" text-anchor="middle">2</text>
    <text x="75" y="52" fill="#a5b4fc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="bold">第二层：查询日志</text>

    <text x="25" y="105" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【控制台取证】</text>
    <rect x="25" y="118" width="280" height="35" rx="6" fill="#0b1329"/>
    <text x="35" y="141" fill="#a5b4fc" font-family="monospace" font-size="13">AdGuard Home -&gt; Query Log</text>

    <text x="25" y="185" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【硬核验收指标】</text>
    <text x="25" y="215" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 捕获到目标设备发出请求</text>
    <text x="25" y="245" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 上游精准命中 DoH 节点：</text>
    <text x="25" y="275" fill="#818cf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">  https://dns.alidns.com/...</text>
    <text x="25" y="305" fill="#f87171" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">❌ 没有 fallback 到明文 UDP</text>

    <rect x="25" y="340" width="280" height="85" rx="8" fill="#1e293b"/>
    <text x="35" y="370" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">证实流量确实走了加密信封，</text>
    <text x="35" y="395" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">没有暗度陈仓走老路。</text>
  </g>

  <g transform="translate(790, 160)">
    <rect width="330" height="450" rx="14" fill="#111c33" stroke="#f59e0b" stroke-width="2"/>
    <rect x="25" y="25" width="40" height="40" rx="8" fill="#d97706"/>
    <text x="45" y="52" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="bold" text-anchor="middle">3</text>
    <text x="75" y="52" fill="#fcd34d" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="bold">第三层：传输协议</text>

    <text x="25" y="105" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【终端工具】</text>
    <rect x="25" y="118" width="280" height="35" rx="6" fill="#0b1329"/>
    <text x="35" y="141" fill="#fcd34d" font-family="monospace" font-size="13">curl -I https://blog.../</text>

    <text x="25" y="185" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【硬核验收指标】</text>
    <text x="25" y="215" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ TLS 握手通过，无证书告警</text>
    <text x="25" y="245" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 协议提升为 HTTP/2</text>
    <text x="25" y="275" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 响应头包含 HSTS 标头</text>
    <text x="25" y="305" fill="#f87171" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">❌ 响应状态绝非 302 重定向</text>

    <rect x="25" y="340" width="280" height="85" rx="8" fill="#1e293b"/>
    <text x="35" y="370" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">证实从传输到网络层</text>
    <text x="35" y="395" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">均已与正品源站完成合法通信。</text>
  </g>

  <g transform="translate(1150, 160)">
    <rect width="380" height="450" rx="14" fill="#0f2922" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="25" width="40" height="40" rx="8" fill="#059669"/>
    <text x="45" y="52" fill="#ffffff" font-family="system-ui" font-size="20" font-weight="bold" text-anchor="middle">4</text>
    <text x="75" y="52" fill="#6ee7b7" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="bold">第四层：端侧页面实测</text>

    <text x="25" y="105" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【终极真实场景】</text>
    <rect x="25" y="118" width="330" height="35" rx="6" fill="#064e3b"/>
    <text x="35" y="141" fill="#a7f3d0" font-family="monospace" font-size="13">Chrome / Safari / 手机移动端</text>

    <text x="25" y="185" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">【硬核验收指标】</text>
    <text x="25" y="215" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 刷新 DNS 缓存与重启浏览器后</text>
    <text x="25" y="245" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">✔ 地址栏直接稳定显示原站域名</text>
    <text x="25" y="275" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14" font-weight="bold">✔ 状态码 200 OK，博客正文渲染！</text>
    <text x="25" y="305" fill="#f87171" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">❌ 没有任何跳转百度痕迹！</text>

    <rect x="25" y="340" width="330" height="85" rx="8" fill="#062e26"/>
    <text x="35" y="370" fill="#6ee7b7" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">用户最终所见即所得，</text>
    <text x="35" y="395" fill="#6ee7b7" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">多设备复测通过，形成排障闭环！</text>
  </g>
</svg>
