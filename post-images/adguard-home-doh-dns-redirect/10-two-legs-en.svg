<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-label="Two links, two configurations"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243c"/><stop offset="1" stop-color="#0d1626"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#60d6c4"/></marker></defs><rect width="1440" height="760" rx="28" fill="url(#bg)"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif"><text x="70" y="74" fill="#60d6c4" font-size="19" letter-spacing="3">FIELD NOTES · DNS / DoH</text><text x="70" y="150" fill="#f3f6fb" font-size="42" font-weight="700">Two links, two configurations</text><text x="70" y="205" fill="#b4c4d7" font-size="25">This incident calls for encrypted upstream queries.</text><rect x="70" y="294" width="410" height="226" rx="22" fill="#1c3149" stroke="#37516c"/><circle cx="113" cy="338" r="20" fill="#60d6c4"/><text x="107" y="345" font-size="20" fill="#10243c">1</text><text x="100" y="406" fill="#fff" font-size="30" font-weight="650">Your devices</text><text x="100" y="458" fill="#c3d0df" font-size="18">Client link: DNS or DoH</text><path d="M482,406 H508" stroke="#60d6c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="513" y="294" width="410" height="226" rx="22" fill="#1c3149" stroke="#37516c"/><circle cx="556" cy="338" r="20" fill="#60d6c4"/><text x="550" y="345" font-size="20" fill="#10243c">2</text><text x="543" y="406" fill="#fff" font-size="30" font-weight="650">AdGuard Home</text><text x="543" y="458" fill="#c3d0df" font-size="18">Cache, filter and forward</text><path d="M925,406 H951" stroke="#60d6c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="956" y="294" width="410" height="226" rx="22" fill="#1c3149" stroke="#37516c"/><circle cx="999" cy="338" r="20" fill="#60d6c4"/><text x="993" y="345" font-size="20" fill="#10243c">3</text><text x="986" y="406" fill="#fff" font-size="30" font-weight="650">Upstream resolver</text><text x="986" y="458" fill="#c3d0df" font-size="18">Upstream link: HTTPS / DoH</text><rect x="70" y="583" width="1296" height="89" rx="16" fill="#102f38"/><text x="96" y="637" fill="#9aeadc" font-size="21">Serving DoH to clients and using a DoH upstream are separate settings</text><text x="70" y="718" fill="#859ab1" font-size="17">MARGROP BLOG · ORIGINAL EXPLANATORY DIAGRAM · 2026</text></g></svg>