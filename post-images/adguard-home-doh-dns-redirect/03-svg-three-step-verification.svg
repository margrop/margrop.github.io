  <rect width="1600" height="720" fill="url(#bgGrad)" rx="24"/>
  <rect x="2" y="2" width="1596" height="716" fill="none" stroke="#1e293b" stroke-width="2" rx="23"/>

  <text x="70" y="70" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="700" letter-spacing="3">ARCHITECTURE ANALYSIS · 网站访问三大安全关卡</text>
  <text x="70" y="125" fill="#f8fafc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="34" font-weight="bold">问路、查验身份证、进门会话：拆解 HTTP 302 连环跳机制</text>

  <g transform="translate(70, 170)">
