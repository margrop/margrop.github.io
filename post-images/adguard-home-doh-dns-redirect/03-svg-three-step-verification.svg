    <text x="25" y="160" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">• 客户端发出域名查询: blog.margrop.net</text>
    <text x="25" y="188" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">• CNAME 别名指向: margrop.github.io</text>

