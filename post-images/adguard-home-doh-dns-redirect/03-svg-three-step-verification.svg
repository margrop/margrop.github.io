    <text x="45" y="252" fill="#10b981" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16" font-weight="bold">🛡️ HTTPS 的刚性防线：</text>
    <text x="45" y="282" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">若走 HTTPS 直连 123.125.*.*，证书校验必然失败</text>
    <text x="45" y="310" fill="#86efac" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">报错: SSL Certificate Name Mismatch！</text>
    <text x="45" y="338" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="13">保护机制生效，冒充者无法劫持加密流量。</text>
