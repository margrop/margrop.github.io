<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="660" fill="url(#bg4)" rx="24"/>
  <rect x="2" y="2" width="1596" height="656" fill="none" stroke="#1e293b" stroke-width="2" rx="23"/>

  <text x="70" y="65" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="700" letter-spacing="3">CORE MECHANISM · 关键技术点透析</text>
  <text x="70" y="115" fill="#f8fafc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="32" font-weight="bold">Bootstrap 引导 DNS：破解“先有鸡还是先有蛋”的哲学困境</text>

  <g transform="translate(70, 160)">
    <rect width="690" height="440" rx="16" fill="#181d33" stroke="#f59e0b" stroke-width="2"/>
    <text x="35" y="45" fill="#fbbf24" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="22" font-weight="bold">❓ 致命死循环：鸡生蛋还是蛋生鸡？</text>

    <text x="35" y="90" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16">1. 你给 AGH 配置的 DoH 上游是一个域名 URL：</text>
    <rect x="35" y="110" width="620" height="45" rx="8" fill="#0f172a"/>
    <text x="55" y="138" fill="#38bdf8" font-family="monospace" font-size="15">https://dns.alidns.com/dns-query</text>

    <text x="35" y="190" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16">2. AGH 要发起 HTTPS 连接，网卡必须先知道目标 IP 地址；</text>
    <text x="35" y="225" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16">3. 要知道目标 IP 地址，就必须先查询它的 DNS；</text>
    <text x="35" y="260" fill="#ef4444" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16" font-weight="bold">4. 可是你的 DNS 正依赖它去解析！—— 瞬间死锁死循环！</text>

    <rect x="35" y="295" width="620" height="120" rx="10" fill="#2d1515" stroke="#ef4444"/>
    <text x="50" y="330" fill="#fca5a5" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15" font-weight="bold">👦 小学生秒懂打比方：找送信员的家</text>
    <text x="50" y="360" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">你要寄一封加密信给“神机妙算王大爷”，托他打听别人家住址。</text>
    <text x="50" y="388" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">但你总得先知道“王大爷”本人住在幸福小区几栋几门！</text>
  </g>

  <g transform="translate(840, 160)">
    <rect width="690" height="440" rx="16" fill="#0f2420" stroke="#10b981" stroke-width="2"/>
    <text x="35" y="45" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="22" font-weight="bold">💡 破局方案：Bootstrap DNS 专门负责领路</text>

    <text x="35" y="90" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16">Bootstrap（引导 DNS）的唯一神圣使命：</text>
    <text x="35" y="120" fill="#a7f3d0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">在 DoH 建立前，纯粹只用来把 DoH 域名解析为纯数字 IP 地址！</text>

    <rect x="35" y="145" width="620" height="90" rx="10" fill="#064e3b"/>
    <text x="50" y="175" fill="#ffffff" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15" font-weight="bold">推荐配置的 Bootstrap 服务器（纯 IP 格式）：</text>
    <text x="50" y="202" fill="#6ee7b7" font-family="monospace" font-size="15">223.5.*.*  223.6.*.*  119.29.*.*  180.184.*.*</text>
    <text x="50" y="224" fill="#a7f3d0" font-family="system-ui" font-size="12">注：博客展示遵循脱敏规范，实际请填写权威官方纯数字 IP</text>

    <rect x="35" y="255" width="620" height="160" rx="10" fill="#062e26" stroke="#10b981"/>
    <text x="50" y="288" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16" font-weight="bold">🛡️ 引导阶段被污染了怎么办？不怕！</text>
    <text x="50" y="318" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">万一运营商在 Bootstrap 阶段把 dns.alidns.com 解析到假 IP 怎么办？</text>
    <text x="50" y="348" fill="#86efac" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">HTTPS 刚性锁死机制立即生效：AGH 连接假 IP 时会核对对方 TLS 证书，</text>
    <text x="50" y="376" fill="#86efac" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">假 IP 绝不可能拥有 *.alidns.com 证书，TLS 校验立即失败并自动拒绝连接！</text>
  </g>
</svg>
