<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c182c"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="680" fill="url(#bg3)" rx="24"/>
  <rect x="2" y="2" width="1596" height="676" fill="none" stroke="#1e293b" stroke-width="2" rx="23"/>

  <text x="70" y="65" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="18" font-weight="700" letter-spacing="3">ADGUARD HOME 拓扑架构 · 两段解析大起底</text>
  <text x="70" y="115" fill="#f8fafc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="32" font-weight="bold">入站段（内网设备）与出站段（上游解析器）：究竟该加密哪一段？</text>

  <g transform="translate(70, 160)">
    <rect width="430" height="450" rx="16" fill="#111c33" stroke="#38bdf8" stroke-width="2"/>
    <text x="35" y="45" fill="#38bdf8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="22" font-weight="bold">第一段：入站段（家庭局域网）</text>
    <text x="35" y="75" fill="#94a3b8" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">设备 (PC/手机/电视) ──> AdGuard Home</text>

    <line x1="35" y1="95" x2="395" y2="95" stroke="#334155" stroke-width="1.5"/>

    <rect x="35" y="120" width="360" height="110" rx="10" fill="#182747"/>
    <text x="50" y="150" fill="#f8fafc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16" font-weight="bold">常规家庭内网环境：</text>
    <text x="50" y="180" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">• 通过 DHCP 自动下发 AGH 作为网关 DNS</text>
    <text x="50" y="208" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">• 协议通常为常规 UDP/TCP 53（安全可控局域网）</text>

    <rect x="35" y="250" width="360" height="150" rx="10" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="50" y="280" fill="#a5b4fc" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16" font-weight="bold">📌 为什么这里不需要盲目开 DoH？</text>
    <text x="50" y="310" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">在后台的【加密设置】开 DoH，是把 AGH 变成</text>
    <text x="50" y="338" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">面向下联设备的 DoH 服务器！你必须为每台电脑、</text>
    <text x="50" y="366" fill="#e2e8f0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">手机安装自签 CA 证书或配公网域名证书，极其繁琐！</text>
  </g>

  <g transform="translate(530, 240)">
    <rect width="260" height="290" rx="16" fill="#047857" stroke="#34d399" stroke-width="3"/>
    <text x="130" y="55" fill="#ffffff" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="24" font-weight="bold" text-anchor="middle">AdGuard Home</text>
    <text x="130" y="85" fill="#a7f3d0" font-family="system-ui" font-size="14" text-anchor="middle">网络中枢与过滤核心</text>

    <rect x="25" y="110" width="210" height="50" rx="8" fill="#065f46"/>
    <text x="130" y="142" fill="#ffffff" font-family="system-ui" font-size="14" text-anchor="middle">1. 规则匹配与去广告</text>

    <rect x="25" y="170" width="210" height="50" rx="8" fill="#065f46"/>
    <text x="130" y="202" fill="#ffffff" font-family="system-ui" font-size="14" text-anchor="middle">2. 本地高速 DNS 缓存</text>

    <rect x="25" y="230" width="210" height="45" rx="8" fill="#064e3b" stroke="#6ee7b7"/>
    <text x="130" y="258" fill="#6ee7b7" font-family="system-ui" font-size="13" text-anchor="middle" font-weight="bold">3. 转发至上游 DoH</text>
  </g>

  <g transform="translate(820, 160)">
    <rect width="710" height="450" rx="16" fill="#0f2420" stroke="#10b981" stroke-width="2"/>
    <text x="35" y="45" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="22" font-weight="bold">第二段：出站段（公网互联网）—— 本次治理真正核心！</text>
    <text x="35" y="75" fill="#6ee7b7" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="15">AdGuard Home ──> 公网递归解析器 (AliDNS / DNSPod / CF)</text>

    <line x1="35" y1="95" x2="675" y2="95" stroke="#047857" stroke-width="1.5"/>

    <rect x="35" y="120" width="640" height="110" rx="10" fill="#064e3b"/>
    <text x="50" y="150" fill="#ffffff" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="16" font-weight="bold">公网出站面临的险恶环境：</text>
    <text x="50" y="180" fill="#a7f3d0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">• 跨越运营商城域网、光猫 NAT、汇聚路由，充满明文 UDP 劫持与投毒风险</text>
    <text x="50" y="208" fill="#a7f3d0" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">• 绝不能在此处继续配置传统的 223.5.*.* 或 114.114.*.* 明文 UDP 53 地址！</text>

    <rect x="35" y="250" width="640" height="170" rx="10" fill="#062e26" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="282" fill="#34d399" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="17" font-weight="bold">✅ 正确破局之道：在【DNS 设置 -> 上游 DNS 服务器】填入：</text>
    <text x="50" y="315" fill="#ffffff" font-family="monospace" font-size="15">https://dns.alidns.com/dns-query</text>
    <text x="50" y="342" fill="#ffffff" font-family="monospace" font-size="15">https://doh.pub/dns-query</text>
    <text x="50" y="380" fill="#cbd5e1" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">效果：AGH 作为客户端，主动与公网可信解析服务器建立 TLS 1.3 隧道，</text>
    <text x="50" y="405" fill="#6ee7b7" font-family="'PingFang SC','Noto Sans CJK SC',system-ui" font-size="14">不仅不需要在终端设备配证书，而且全家所有设备瞬间获得顶级防投毒免疫！</text>
  </g>
</svg>
