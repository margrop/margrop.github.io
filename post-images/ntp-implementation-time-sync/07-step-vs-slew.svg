<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="600" y="46" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">时钟调整策略深度博弈：Slew (平滑微调) vs Step (硬拨表)</text>
  <text x="600" y="74" fill="#94a3b8" font-size="14" text-anchor="middle">单调时钟连续性 (Monotonicity) 是保障分布式数据库与定时器存活的生命线</text>

  <!-- Left: Step (Danger) -->
  <rect x="80" y="110" width="500" height="400" rx="12" fill="#18131d" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="110" width="500" height="50" rx="12" fill="#7f1d1d"/>
  <text x="330" y="142" fill="#fecaca" font-size="18" font-weight="bold" text-anchor="middle">❌ Step 策略：硬拨时间 (直接修改系统墙上时钟)</text>

  <!-- Step Chart -->
  <line x1="120" y1="360" x2="540" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="360" x2="120" y2="190" stroke="#475569" stroke-width="2"/>
  <text x="540" y="385" fill="#64748b" font-size="12">真实物理时间 t</text>
  <text x="110" y="180" fill="#64748b" font-size="12">系统时间</text>

  <!-- Discontinuous Step Curve -->
  <line x1="120" y1="330" x2="280" y2="280" stroke="#f87171" stroke-width="4"/>
  <line x1="280" y1="280" x2="280" y2="220" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,4"/>
  <circle cx="280" cy="280" r="5" fill="#ef4444"/>
  <circle cx="280" cy="220" r="5" fill="#ef4444"/>
  <line x1="280" y1="220" x2="500" y2="170" stroke="#f87171" stroke-width="4"/>

  <!-- Callout -->
  <rect x="290" y="235" width="220" height="40" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="260" fill="#fca5a5" font-size="12" text-anchor="middle">⚠️ 时间断裂！出现时间跳跃或时光倒流</text>

  <!-- Consequences -->
  <text x="120" y="420" fill="#fca5a5" font-size="14" font-weight="bold">引发灾难：</text>
  <text x="120" y="445" fill="#cbd5e1" font-size="13">• 分布式锁 / Lease 误判提前失效，触发双主冲突</text>
  <text x="120" y="470" fill="#cbd5e1" font-size="13">• 数据库事务日志出现时间倒流，主从复制卡死</text>
  <text x="120" y="495" fill="#cbd5e1" font-size="13">• 定时任务 (Cron/Timer) 重复执行或永远挂起</text>

  <!-- Right: Slew (Safe) -->
  <rect x="620" y="110" width="500" height="400" rx="12" fill="#0c1b22" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="620" y="110" width="500" height="50" rx="12" fill="#064e3b"/>
  <text x="870" y="142" fill="#a7f3d0" font-size="18" font-weight="bold" text-anchor="middle">✅ Slew 策略：平滑调频 (微调硬件晶振走时速率)</text>

  <!-- Slew Chart -->
  <line x1="660" y1="360" x2="1080" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="660" y1="360" x2="660" y2="190" stroke="#475569" stroke-width="2"/>
  <text x="1080" y="385" fill="#64748b" font-size="12">真实物理时间 t</text>
  <text x="650" y="180" fill="#64748b" font-size="12">系统时间</text>

  <!-- Smooth Slew Curve -->
  <path d="M 660,330 Q 760,310 820,280 T 960,200 L 1050,175" fill="none" stroke="#34d399" stroke-width="4"/>

  <!-- Callout -->
  <rect x="800" y="240" width="220" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="910" y="265" fill="#6ee7b7" font-size="12" text-anchor="middle">🛡️ 速率微调 (如 ±500ppm)，时间严格单调递增</text>

  <!-- Advantages -->
  <text x="660" y="420" fill="#6ee7b7" font-size="14" font-weight="bold">生产护航：</text>
  <text x="660" y="445" fill="#cbd5e1" font-size="13">• Linux adjtimex() / tick 微调，时钟平稳不跳变</text>
  <text x="660" y="470" fill="#cbd5e1" font-size="13">• 单调时钟 (CLOCK_MONOTONIC) 持续向前推进</text>
  <text x="660" y="495" fill="#cbd5e1" font-size="13">• 默认阈值：偏差 &lt; 128ms 走 Slew；巨偏需受控人工介入</text>

  <!-- Metaphor Box -->
  <rect x="80" y="540" width="1040" height="110" rx="10" fill="#131e33" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="570" fill="#10b981" font-size="16" font-weight="bold">⏰ 小学生秒懂打比方：大挂钟调快还是拨指针？</text>
  <text x="110" y="600" fill="#e2e8f0" font-size="14">Step 是老师冲上讲台，一把猛拨分针！正在按秒表考试的同学成绩全乱，数据库大崩溃；</text>
  <text x="110" y="628" fill="#94a3b8" font-size="13">Slew 则是老师偷偷调整钟摆螺丝，让钟每分钟走快 0.5 秒，花 20 分钟神不知鬼不觉追上，没人发现时间曾经错漏！</text>
</svg>