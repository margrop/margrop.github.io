<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="600" y="46" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">NTP 树状层级体系：Stratum 时钟距离模型</text>
  <text x="600" y="74" fill="#94a3b8" font-size="14" text-anchor="middle">Stratum 代表距离物理参考源的跳数，而非绝对品质指标</text>

  <!-- Stratum 0 -->
  <rect x="250" y="100" width="700" height="75" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="134" fill="#a5b4fc" font-size="18" font-weight="bold">Stratum 0 (物理参考母钟)</text>
  <text x="350" y="158" fill="#e0e7ff" font-size="13">铯原子钟、铷原子频标、GPS / 北斗导航卫星系统、CDMA (不直接接入网络)</text>
  <circle cx="300" cy="137" r="22" fill="#4338ca"/>
  <text x="300" y="143" fill="#ffffff" font-size="18" text-anchor="middle">⏱️</text>

  <!-- Connection 0 -> 1 -->
  <line x1="600" y1="175" x2="600" y2="210" stroke="#818cf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Stratum 1 -->
  <rect x="250" y="210" width="700" height="75" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="244" fill="#38bdf8" font-size="18" font-weight="bold">Stratum 1 (一级主时间服务器 / Primary Servers)</text>
  <text x="350" y="268" fill="#cbd5e1" font-size="13">通过硬件 PPS / 串口直连 Stratum 0，提供绝对微秒级基准 (NIST, USNO, Cloudflare Time)</text>
  <circle cx="300" cy="247" r="22" fill="#0284c7"/>
  <text x="300" y="253" fill="#ffffff" font-size="18" text-anchor="middle">📡</text>

  <!-- Connection 1 -> 2 -->
  <line x1="600" y1="285" x2="600" y2="320" stroke="#38bdf8" stroke-width="3"/>
  <line x1="450" y1="320" x2="750" y2="320" stroke="#38bdf8" stroke-width="3"/>
  <line x1="450" y1="320" x2="450" y2="330" stroke="#38bdf8" stroke-width="3"/>
  <line x1="750" y1="320" x2="750" y2="330" stroke="#38bdf8" stroke-width="3"/>

  <!-- Stratum 2 -->
  <rect x="200" y="330" width="800" height="75" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="364" fill="#34d399" font-size="18" font-weight="bold">Stratum 2 (二级时间中继 / Secondary Servers)</text>
  <text x="350" y="388" fill="#cbd5e1" font-size="13">云厂商时间网关、公共 NTP 节点 (pool.ntp.org, ntp.aliyun.com)，节点间对等校验</text>
  <circle cx="270" cy="367" r="22" fill="#059669"/>
  <text x="270" y="373" fill="#ffffff" font-size="18" text-anchor="middle">☁️</text>

  <!-- Connection 2 -> 3 -->
  <line x1="600" y1="405" x2="600" y2="440" stroke="#10b981" stroke-width="3"/>

  <!-- Stratum 3 & Endpoints -->
  <rect x="200" y="440" width="800" height="75" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="474" fill="#fbbf24" font-size="18" font-weight="bold">Stratum 3 &amp; 终端设备 (Clients / Kubernetes / Endpoints)</text>
  <text x="350" y="498" fill="#cbd5e1" font-size="13">物理机、虚拟机、K8s 容器节点、桌面电脑 (Stratum 16 代表失去同步处于未校准状态)</text>
  <circle cx="270" cy="477" r="22" fill="#d97706"/>
  <text x="270" y="483" fill="#ffffff" font-size="18" text-anchor="middle">💻</text>

  <!-- Metaphor Box -->
  <rect x="120" y="540" width="960" height="110" rx="10" fill="#131e33" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="570" fill="#38bdf8" font-size="16" font-weight="bold">🏫 小学生秒懂打比方：学校广播台分级广播</text>
  <text x="150" y="600" fill="#e2e8f0" font-size="14">Stratum 0 是国家授时总台；Stratum 1 是学校广播室主控机；Stratum 2 是每个教学楼的分控喇叭；Stratum 3 是教室广播与同学手表。</text>
  <text x="150" y="628" fill="#94a3b8" font-size="13">关键启示：不要盲目迷信 Stratum 1！身边 1ms 延迟的优质 Stratum 2，远胜跨洲 300ms 抖动的 Stratum 1！</text>
</svg>