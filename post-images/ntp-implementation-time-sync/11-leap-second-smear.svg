<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="600" y="46" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">多出来的1秒如何吞掉：传统闰秒事故 vs Leap Smear 平滑抹平</text>
  <text x="600" y="74" fill="#94a3b8" font-size="14" text-anchor="middle">地球自转减速引发的 UTC 修正：科学精密与工业系统稳定性的终极妥协</text>

  <!-- Left: Traditional Leap Second -->
  <rect x="80" y="110" width="500" height="400" rx="12" fill="#1a1215" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="110" width="500" height="50" rx="12" fill="#881337"/>
  <text x="330" y="142" fill="#ffe4e6" font-size="18" font-weight="bold" text-anchor="middle">传统做法：硬插入 23:59:60 (POSIX 崩溃源泉)</text>

  <!-- Timeline Step Box -->
  <rect x="120" y="190" width="420" height="80" rx="8" fill="#2e1020" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="145" y="235" fill="#cbd5e1" font-size="15" font-family="monospace">23:59:59</text>
  <text x="250" y="235" fill="#f43f5e" font-size="18" font-weight="bold" font-family="monospace">➔ 23:59:60 ➔</text>
  <text x="420" y="235" fill="#cbd5e1" font-size="15" font-family="monospace">00:00:00</text>
  <text x="330" y="258" fill="#fda4af" font-size="12" text-anchor="middle">POSIX time_t 无法表示 60 秒！底层时钟倒退或死锁</text>

  <text x="120" y="305" fill="#fb7185" font-size="14" font-weight="bold">历史重大事故复盘：</text>
  <text x="120" y="330" fill="#cbd5e1" font-size="13">• 2012年闰秒：Linux 内核 Futex 锁死循环，全球数万服务器 CPU 100%</text>
  <text x="120" y="355" fill="#cbd5e1" font-size="13">• 2015年闰秒：多家航司订票系统、知名社交平台服务雪崩瘫痪</text>
  <text x="120" y="380" fill="#cbd5e1" font-size="13">• 2017年元旦：Cloudflare DNS 因 Go 语言 time.Now() 减出负时长 Panic</text>

  <!-- Right: Leap Smear -->
  <rect x="620" y="110" width="500" height="400" rx="12" fill="#0e1e24" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <rect x="620" y="110" width="500" height="50" rx="12" fill="#0369a1"/>
  <text x="870" y="142" fill="#e0f2fe" font-size="18" font-weight="bold" text-anchor="middle">现代方案：Leap Smear 24小时频率抹平</text>

  <!-- Smear Curve Box -->
  <rect x="660" y="190" width="420" height="120" rx="8" fill="#072d42" stroke="#0ea5e9" stroke-width="1.5"/>
  <path d="M 680,270 Q 770,230 870,230 T 1060,270" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <line x1="680" y1="270" x2="1060" y2="270" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="870" y="218" fill="#7dd3fc" font-size="13" text-anchor="middle">走时频率减慢 ~11.57 ppm (在 24 小时内摊薄 1 秒)</text>
  <text x="680" y="295" fill="#94a3b8" font-size="11">正午前 12 小时</text>
  <text x="870" y="295" fill="#38bdf8" font-size="11" text-anchor="middle">闰秒时刻</text>
  <text x="1060" y="295" fill="#94a3b8" font-size="11" text-anchor="end">正午后 12 小时</text>

  <text x="660" y="340" fill="#38bdf8" font-size="14" font-weight="bold">工业级标准化方案：</text>
  <text x="660" y="365" fill="#cbd5e1" font-size="13">• Google / AWS / Cloudflare 官方时间源全面默认采用 Leap Smear</text>
  <text x="660" y="390" fill="#cbd5e1" font-size="13">• 客户端不需要任何特殊补丁，直接享受平滑单调时间流</text>
  <text x="660" y="415" fill="#cbd5e1" font-size="13">• 核心避坑：绝不能将 Smear 源与传统 Non-Smear 源混合在同一个集群！</text>

  <!-- Metaphor Box -->
  <rect x="80" y="540" width="1040" height="110" rx="10" fill="#131e33" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="570" fill="#f43f5e" font-size="16" font-weight="bold">🌍 小学生秒懂打比方：地球自转偷懒了 1 秒钟</text>
  <text x="110" y="600" fill="#e2e8f0" font-size="14">传统做法是在跨年夜 23:59:59 之后硬塞一个怪兽般的“23:59:60”，电脑程序员从来没学过 60 秒，当场崩溃暴走；</text>
  <text x="110" y="628" fill="#94a3b8" font-size="13">Leap Smear 则是把这多出来的 1 秒像黄油一样平抹在 24 小时的面包上，每一秒偷偷慢十万分之一秒，谁都感觉不到却轻松化解危机！</text>
</svg>