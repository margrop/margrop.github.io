<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="600" y="46" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">时钟滤波与 Marzullo 交叉算法：NTP 如何揪出“时间说谎者”</text>
  <text x="600" y="74" fill="#94a3b8" font-size="14" text-anchor="middle">Clock Filter Register (8-Stage Shift Register) &amp; Intersection/Clustering Algorithm</text>

  <!-- Left Box: Clock Filter Register -->
  <rect x="80" y="110" width="480" height="400" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="110" width="480" height="50" rx="12" fill="#0284c7"/>
  <text x="320" y="142" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">1. 时钟滤波寄存器 (8 个历史样本滑窗)</text>

  <text x="110" y="190" fill="#cbd5e1" font-size="13">网络常有短暂拥堵与抖动，NTP 绝不以“最后一次”采样为准：</text>

  <!-- 8 Sample Register Slots -->
  <g transform="translate(105, 210)">
    <rect x="0" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="25" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#1</text>
    <text x="25" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">24ms</text>

    <rect x="55" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="80" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#2</text>
    <text x="80" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">85ms</text>

    <rect x="110" y="0" width="50" height="60" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="135" y="25" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">#3 ★</text>
    <text x="135" y="48" fill="#a7f3d0" font-size="11" font-family="monospace" text-anchor="middle">12ms</text>

    <rect x="165" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="190" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#4</text>
    <text x="190" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">33ms</text>

    <rect x="220" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="245" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#5</text>
    <text x="245" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">19ms</text>

    <rect x="275" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="300" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#6</text>
    <text x="300" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">52ms</text>

    <rect x="330" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="355" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#7</text>
    <text x="355" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">21ms</text>

    <rect x="385" y="0" width="50" height="60" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="410" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">#8</text>
    <text x="410" y="48" fill="#f8fafc" font-size="11" font-family="monospace" text-anchor="middle">44ms</text>
  </g>

  <rect x="110" y="295" width="420" height="60" rx="6" fill="#132438" stroke="#0284c7"/>
  <text x="125" y="320" fill="#38bdf8" font-size="13" font-weight="bold">选择原则：延迟最小 = 队列排队最短 = 误差最低</text>
  <text x="125" y="342" fill="#94a3b8" font-size="12">选出 #3 (12ms) 作为代表，并计算时钟抖动 Jitter 与 Dispersion</text>

  <text x="110" y="390" fill="#cbd5e1" font-size="13">• 8 轮采样成功即标志 Reachability = 377 (八进制 11111111)</text>
  <text x="110" y="420" fill="#cbd5e1" font-size="13">• 排除 Wi-Fi 重传、链路尖刺对时钟基准的恶意污染</text>

  <!-- Right Box: Marzullo Algorithm -->
  <rect x="640" y="110" width="480" height="400" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="110" width="480" height="50" rx="12" fill="#047857"/>
  <text x="880" y="142" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">2. Marzullo 交叉算法 (剔除异常时钟源)</text>

  <text x="670" y="190" fill="#cbd5e1" font-size="13">每个源构成置信区间 [θ - ε, θ + ε]，寻找最大重叠区域：</text>

  <!-- Intervals Diagram -->
  <g transform="translate(670, 215)">
    <!-- Source A -->
    <text x="0" y="20" fill="#94a3b8" font-size="12">源 A (Cloudflare)</text>
    <line x1="120" y1="16" x2="320" y2="16" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="220" cy="16" r="4" fill="#ffffff"/>

    <!-- Source B -->
    <text x="0" y="55" fill="#94a3b8" font-size="12">源 B (Aliyun)</text>
    <line x1="150" y1="51" x2="340" y2="51" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="245" cy="51" r="4" fill="#ffffff"/>

    <!-- Source C -->
    <text x="0" y="90" fill="#94a3b8" font-size="12">源 C (Apple)</text>
    <line x1="170" y1="86" x2="360" y2="86" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
    <circle cx="265" cy="86" r="4" fill="#ffffff"/>

    <!-- Source D (Falseticker) -->
    <text x="0" y="125" fill="#f87171" font-size="12" font-weight="bold">源 D (离谱异常源)</text>
    <line x1="390" y1="121" x2="440" y2="121" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="415" cy="121" r="4" fill="#ffffff"/>

    <!-- Intersection Overlay Box -->
    <rect x="170" y="0" width="150" height="105" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-dasharray="3,3"/>
    <text x="245" y="150" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">▲ 多数派交集 (Truechimers 集合)</text>
    <text x="415" y="150" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">✖ Falseticker 被剔除</text>
  </g>

  <rect x="670" y="390" width="420" height="50" rx="6" fill="#064e3b" stroke="#059669"/>
  <text x="880" y="415" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">结语：绝不可单点对齐！至少配置 3~4 个独立源</text>
  <text x="880" y="432" fill="#6ee7b7" font-size="11" text-anchor="middle">配置 1 个容易断；配 2 个发生分歧无法投票；配 3~4 个才能容灾容错！</text>

  <!-- Metaphor Box -->
  <rect x="80" y="540" width="1040" height="110" rx="10" fill="#131e33" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="570" fill="#38bdf8" font-size="16" font-weight="bold">👥 小学生秒懂打比方：三个同学对表决定放学时间</text>
  <text x="110" y="600" fill="#e2e8f0" font-size="14">小明看表是 11:59，小红看表是 12:01，小刚手表电池漏液显示 14:30。如果老师傻傻取平均值算成 12:50，全班同学就被坑惨了；</text>
  <text x="110" y="628" fill="#94a3b8" font-size="13">Marzullo 算法就像机智的班长：找出绝大多数手表的一致区间，当场把小刚这个离谱的“说谎者”识别并排除出参考名单！</text>
</svg>