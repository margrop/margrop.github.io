<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="gradClient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradServer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="arrowSend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="arrowRecv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="600" y="46" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">NTP 核心对时算法：四时间戳模型与延迟偏差计算</text>
  <text x="600" y="74" fill="#94a3b8" font-size="14" text-anchor="middle">RFC 5905 — Network Time Protocol Version 4 Timestamp Exchange</text>

  <!-- Lifeline Columns -->
  <!-- Client Column -->
  <rect x="120" y="100" width="220" height="420" rx="12" fill="url(#gradClient)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="100" width="220" height="50" rx="12" fill="#1e293b"/>
  <text x="230" y="132" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">客户端 (Client)</text>
  <line x1="230" y1="150" x2="230" y2="500" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Server Column -->
  <rect x="860" y="100" width="220" height="420" rx="12" fill="url(#gradClient)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="100" width="220" height="50" rx="12" fill="#0284c7"/>
  <text x="970" y="132" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">NTP 服务器 (Server)</text>
  <line x1="970" y1="150" x2="970" y2="500" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Timestamp Nodes & Arrows -->
  <!-- T1 -->
  <circle cx="230" cy="190" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <rect x="30" y="170" width="180" height="40" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="120" y="195" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">T1 (Originate Time)</text>

  <!-- Arrow T1 -> T2 -->
  <line x1="230" y1="190" x2="960" y2="280" stroke="url(#arrowSend)" stroke-width="4"/>
  <polygon points="970,281 954,272 958,284" fill="#f59e0b"/>
  <rect x="510" y="215" width="180" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="600" y="235" fill="#cbd5e1" font-size="12" text-anchor="middle">NTP 请求报文 (48 字节)</text>

  <!-- T2 -->
  <circle cx="970" cy="280" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="990" y="260" width="180" height="40" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1080" y="285" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">T2 (Receive Time)</text>

  <!-- Server Processing delta -->
  <line x1="970" y1="280" x2="970" y2="350" stroke="#f59e0b" stroke-width="4"/>
  <rect x="985" y="307" width="160" height="24" rx="4" fill="#1e293b"/>
  <text x="1065" y="323" fill="#cbd5e1" font-size="11" text-anchor="middle">服务器处理耗时: T3 - T2</text>

  <!-- T3 -->
  <circle cx="970" cy="350" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <rect x="990" y="335" width="180" height="40" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1080" y="360" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">T3 (Transmit Time)</text>

  <!-- Arrow T3 -> T4 -->
  <line x1="970" y1="350" x2="240" y2="440" stroke="url(#arrowRecv)" stroke-width="4"/>
  <polygon points="230,441 246,448 242,436" fill="#10b981"/>
  <rect x="510" y="380" width="180" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="600" y="400" fill="#cbd5e1" font-size="12" text-anchor="middle">NTP 响应报文 (带 T1,T2,T3)</text>

  <!-- T4 -->
  <circle cx="230" cy="440" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="30" y="420" width="180" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="120" y="445" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">T4 (Destination Time)</text>

  <!-- Formula Card (Center) -->
  <rect x="420" y="100" width="360" height="100" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="128" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">核心推算公式 (RFC 5905)</text>
  <text x="600" y="156" fill="#f8fafc" font-size="14" font-family="monospace" text-anchor="middle">往返延迟 Delay  δ = (T4 - T1) - (T3 - T2)</text>
  <text x="600" y="184" fill="#4ade80" font-size="14" font-family="monospace" text-anchor="middle">时钟偏差 Offset θ = ((T2 - T1) + (T3 - T4)) / 2</text>

  <!-- Metaphor Card (Bottom) -->
  <rect x="120" y="540" width="960" height="110" rx="10" fill="#131e33" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="570" fill="#f59e0b" font-size="16" font-weight="bold">👦 小学生秒懂打比方：隔壁班传纸条对表</text>
  <text x="150" y="600" fill="#e2e8f0" font-size="14">小明 9:00 (T1) 让跑腿同学送纸条；小红看挂钟 9:05 (T2) 收到，写完回信 9:06 (T3) 送回；小明 9:11 (T4) 收到。</text>
  <text x="150" y="628" fill="#94a3b8" font-size="13">路上总耗时 = (11分 - 0分) - (6分 - 5分) = 10分钟(往返 Delay)；单程 5 分钟，说明小红挂钟相比小明分秒不差 (Offset=0)！</text>
</svg>