<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <path d="M 0,150 L 1600,150 M 0,300 L 1600,300 M 0,450 L 1600,450 M 0,600 L 1600,600 M 0,750 L 1600,750" />
    <path d="M 200,0 L 200,900 M 400,0 L 400,900 M 600,0 L 600,900 M 800,0 L 800,900 M 1000,0 L 1000,900 M 1200,0 L 1200,900 M 1400,0 L 1400,900" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 80)">
    <rect width="280" height="38" rx="19" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#38BDF8"/>
    <text x="38" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" letter-spacing="1">WRONG-NOTEBOOK RETROSPECTIVE</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(100, 180)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">From 0 to 500+ Stars in 2 Weeks</text>
    <text x="0" y="65" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="400">A Developer Father's Journey from a Weekend Hack to an Open-Source Powerhouse</text>
  </g>

  <!-- Three Milestone Columns -->
  <!-- Column 1: 起源与痛点 -->
  <g transform="translate(100, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="70" height="28" rx="6" fill="#334155"/>
    <text x="35" y="43" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">PHASE 01</text>
    
    <text x="24" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Stop Copying, Start Understanding</text>
    <text x="24" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" line-height="24">
      <tspan x="24" dy="0">Born from a parent's real frustration:</tspan>
      <tspan x="24" dy="28">Manual copying takes hours, search apps encourage cheating,</tspan>
      <tspan x="24" dy="28">and answers are soon forgotten. Engineered a</tspan>
      <tspan x="24" dy="28">closed-loop system for real mastery.</tspan>
    </text>

    <!-- Key feature tags -->
    <g transform="translate(24, 280)">
      <rect width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">📷 AI Photo OCR & Clean</text>
      
      <rect x="175" width="180" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="191" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">🏷️ Curriculum Tagging</text>

      <rect y="50" width="180" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="73" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">🔄 Variant Generation</text>
    </g>

    <line x1="24" y1="410" x2="396" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="24" y="445" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Focus shift: From 'filing clerk' to deep understanding</text>
  </g>

  <!-- Column 2: 降门槛与破圈 -->
  <g transform="translate(560, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="24" y="24" width="70" height="28" rx="6" fill="#0284C7"/>
    <text x="35" y="43" fill="#F0F9FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">PHASE 02</text>
    
    <text x="24" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">Zero-Friction Access & Multi-Platform</text>
    <text x="24" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">
      <tspan x="24" dy="0">Democratizing AI for non-tech parents:</tspan>
      <tspan x="24" dy="28">No API Key barrier via one-click OAuth login;</tspan>
      <tspan x="24" dy="28">Standalone Android APK with embedded Node.js+SQLite;</tspan>
      <tspan x="24" dy="28">Ebbinghaus spaced-repetition scheduler.</tspan>
    </text>

    <!-- Key feature tags -->
    <g transform="translate(24, 280)">
      <rect width="180" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="16" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">🔑 Free OAuth Login</text>
      
      <rect x="195" width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="211" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">📱 Standalone APK</text>

      <rect y="50" width="180" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="73" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">📅 Spaced Daily Review</text>
    </g>

    <line x1="24" y1="410" x2="396" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="24" y="445" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Core win: Complex infrastructure behind effortless UI</text>
  </g>

  <!-- Column 3: 社区共鸣与质变 -->
  <g transform="translate(1020, 320)" filter="url(#shadow)">
    <rect width="480" height="480" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="70" height="28" rx="6" fill="#4338CA"/>
    <text x="35" y="43" fill="#EEF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">PHASE 03</text>
    
    <text x="24" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">500+ Stars & Production Maturation</text>
    <text x="24" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">
      <tspan x="24" dy="0">Scaling from personal tool to family standard:</tspan>
      <tspan x="24" dy="28">Curriculum standards, DOCX export, smart test spacing,</tspan>
      <tspan x="24" dy="28">animated SVG + cloud TTS explanations,</tspan>
      <tspan x="24" dy="28">and deep integration with domestic LLMs & fnOS.</tspan>
    </text>

    <!-- Key Stats Box -->
    <g transform="translate(24, 270)">
      <rect width="432" height="110" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">540+</text>
        <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">GitHub Stars</text>
      </g>
      <g transform="translate(170, 30)">
        <text x="0" y="32" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">90+</text>
        <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Community Forks</text>
      </g>
      <g transform="translate(310, 30)">
        <text x="0" y="32" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">0</text>
        <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Open Issues</text>
      </g>
    </g>

    <line x1="24" y1="410" x2="456" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="24" y="445" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Total control: 100% local data, zero privacy leakage</text>
  </g>
</svg>
