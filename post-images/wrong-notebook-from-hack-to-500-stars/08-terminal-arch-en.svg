<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <g transform="translate(100, 70)">
    <text x="0" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FULL-STACK MULTI-PLATFORM RUNTIME</text>
    <text x="0" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">Full-Stack Multi-Platform: From Home NAS to Offline Mobile Sandbox</text>
    <text x="0" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">How wrong-notebook runs across diverse home hardware with zero server maintenance</text>
  </g>

  <!-- 4 Terminal Cards -->
  <!-- Terminal 1: Web & PWA -->
  <g transform="translate(100, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#0284C7"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">🌐</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Web / PWA</text>
      <text x="0" y="112" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">Instant Response & Responsive UI</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· Next.js 16 App Router</tspan>
        <tspan x="0" dy="26">· Tailwind CSS 4 Mobile-First</tspan>
        <tspan x="0" dy="26">· Service Worker Offline Cache</tspan>
        <tspan x="0" dy="26">· Add-to-Homescreen support</tspan>
        <tspan x="0" dy="26">· Instant access, zero local footprint</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Targets: Mobile browsers, WeChat in-app, iPads</text>
    </g>
  </g>

  <!-- Terminal 2: 飞牛OS / Docker / NAS -->
  <g transform="translate(460, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#0D9488"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">🏠</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">飞牛OS / NAS / Docker</text>
      <text x="0" y="112" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">Private Family Cloud Hub</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· Official Docker Compose Setup</tspan>
        <tspan x="0" dy="26">· fnOS App Store Guided Setup</tspan>
        <tspan x="0" dy="26">· High-concurrency SQLite / WAL</tspan>
        <tspan x="0" dy="26">· Multi-tenant Family Accounts</tspan>
        <tspan x="0" dy="26">· Daily AI Quotas & Throttling</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Targets: Synology, QNAP, fnOS, Home Servers</text>
    </g>
  </g>

  <!-- Terminal 3: 桌面版 (Electron) -->
  <g transform="translate(820, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#4F46E5"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">💻</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Desktop App (Electron)</text>
      <text x="0" y="112" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">Windows / macOS Native App</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· Isolated Electron Container</tspan>
        <tspan x="0" dy="26">· Auto-launches guided initialization</tspan>
        <tspan x="0" dy="26">· Native printer driver integration</tspan>
        <tspan x="0" dy="26">· Formatted DOCX test export</tspan>
        <tspan x="0" dy="26">· Zero command-line friction</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Targets: Study PCs, Laptops, Local Printers</text>
    </g>
  </g>

  <!-- Terminal 4: 安卓单机版 (Node.js+SQLite APK) -->
  <g transform="translate(1180, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#059669"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">📱</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Standalone Android (Offline APK)</text>
      <text x="0" y="112" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">Embedded Server & Database in APK</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· Embedded Node.js runtime</tspan>
        <tspan x="0" dy="26">· Embedded SQLite database engine</tspan>
        <tspan x="0" dy="26">· Zero external server required!</tspan>
        <tspan x="0" dy="26">· Install and use anywhere, self-contained</tspan>
        <tspan x="0" dy="26">· Tailored phone & tablet layouts</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Targets: Kids' study tablets, offline travel</text>
    </g>
  </g>

  <!-- Bottom Common Substrate -->
  <g transform="translate(100, 660)" filter="url(#shadow3)">
    <rect width="1400" height="160" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(40, 30)">
      <text x="0" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">Core Foundation: 100% Local Sovereignty + Unified LLM Matrix</text>
      <text x="0" y="46" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        Regardless of terminal form factor, all questions, practice records, and Ebbinghaus states reside in local SQLite storage.
      </text>

      <g transform="translate(0, 70)">
        <rect width="180" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="16" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">MiniMax (Free OAuth)</text>

        <rect x="195" width="160" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="211" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Volcengine (Doubao/Coding)</text>

        <rect x="370" width="140" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="386" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">DeepSeek / Kimi</text>

        <rect x="525" width="140" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="541" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Qwen / Zhipu GLM</text>

        <rect x="680" width="150" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="696" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">StepFun / OpenAI</text>

        <rect x="845" width="190" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
        <text x="861" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">Full JSON v3 Backup & Restore</text>
      </g>
    </g>
  </g>
</svg>
