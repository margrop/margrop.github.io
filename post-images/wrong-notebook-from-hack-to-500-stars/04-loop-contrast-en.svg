<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <g transform="translate(100, 70)">
    <text x="0" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LEARNING PARADIGM SHIFT</text>
    <text x="0" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">The Two Paradigms of Error Correction</text>
    <text x="0" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">Why traditional copybooks burn kids out, and how a closed-loop drives genuine mastery</text>
  </g>

  <!-- Left Card: 传统错题本（死循环） -->
  <g transform="translate(100, 200)" filter="url(#shadow2)">
    <rect width="660" height="620" rx="20" fill="#1E293B" stroke="#EF4444" stroke-width="2" stroke-opacity="0.6"/>
    
    <g transform="translate(40, 40)">
      <rect width="120" height="32" rx="16" fill="#7F1D1D"/>
      <text x="18" y="21" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">Traditional Copying</text>
      <text x="135" y="22" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">The Dead-End Vicious Cycle</text>

      <!-- Step 1 -->
      <g transform="translate(0, 70)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">1</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Tedious Copying & Photo Chaos</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Parents spend hours cutting and pasting; photos rot in chat folders</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 145)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">2</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Search Apps Show Answers Immediately</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Creates the illusion of competence; bypasses crucial cognitive deduction</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 220)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">3</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Filed Away and Forgotten</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">No spaced retrieval schedule; notebooks pile up into unmanageable clutter</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 295)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">4</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Failed Again on the Exam</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">The slightest variation stumbles the child; underlying gaps remain unhealed</text>
      </g>

      <!-- Outcome summary box -->
      <g transform="translate(0, 390)">
        <rect width="580" height="110" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="24" y="35" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700">⚠️ Critical Symptoms</text>
        <text x="24" y="65" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">
          <tspan x="24" dy="0">· Form over substance: 80% effort wasted on transcribing & formatting</tspan>
          <tspan x="24" dy="24">· Data silos: Questions, explanations, and attempts are disconnected</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Right Card: wrong-notebook（闭环流） -->
  <g transform="translate(840, 200)" filter="url(#shadow2)">
    <rect width="660" height="620" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="2" stroke-opacity="0.8"/>
    
    <g transform="translate(40, 40)">
      <rect width="140" height="32" rx="16" fill="#064E3B"/>
      <text x="18" y="21" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">wrong-notebook</text>
      <text x="155" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">The 'Library Card' Closed-Loop</text>

      <!-- Step 1 -->
      <g transform="translate(0, 70)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">1</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Instant OCR & Handwriting Removal</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Extracts formulas, cleans handwriting, and auto-tags curriculum standards</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 145)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">2</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Animated SVG + Voiceover Walkthrough</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Not a dry answer dump, but a dynamic tutor guiding key reasoning steps</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 220)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">3</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Dynamic Ebbinghaus Daily Review</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Scheduled across 1/2/4/7/15/30 day intervals across 3 mastery states</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 295)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">4</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">Variant Drills + Strict Auto-Grading</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Generates variants targeting the same concept; passes only on genuine mastery</text>
      </g>

      <!-- Outcome summary box -->
      <g transform="translate(0, 390)">
        <rect width="580" height="110" rx="12" fill="#0F172A" stroke="#047857" stroke-width="1"/>
        <text x="24" y="35" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700">✨ The Solution Value</text>
        <text x="24" y="65" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">
          <tspan x="24" dy="0">· Library Card model: Full audit trail of exercises, variants, and exams</tspan>
          <tspan x="24" dy="24">· High efficiency: Pinpoints and repairs true blind spots with minimal fatigue</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
