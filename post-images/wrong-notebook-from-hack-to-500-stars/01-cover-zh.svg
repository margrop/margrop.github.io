<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <path d="M 0,150 L 1600,150 M 0,300 L 1600,300 M 0,450 L 1600,450 M 0,600 L 1600,600 M 0,750 L 1600,750" />
    <path d="M 200,0 L 200,900 M 400,0 L 400,900 M 600,0 L 600,900 M 800,0 L 800,900 M 1000,0 L 1000,900 M 1200,0 L 1200,900 M 1400,0 L 1400,900" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 80)">
    <rect width="280" height="38" rx="19" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#38BDF8"/>
    <text x="38" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="600" letter-spacing="1">WRONG-NOTEBOOK 深度复盘</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(100, 180)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">两周突破 500+ Star</text>
    <text x="0" y="65" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="400">一个程序员爸爸从自用小工具到开源错题利器的硬核进化</text>
  </g>

  <!-- Three Milestone Columns -->
  <!-- Column 1: 起源与痛点 -->
  <g transform="translate(100, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="70" height="28" rx="6" fill="#334155"/>
    <text x="35" y="43" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">阶段 01</text>
    
    <text x="24" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">拒绝让错题本变成抄题本</text>
    <text x="24" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" line-height="24">
      <tspan x="24" dy="0">为自家孩子辅导功课的原始痛点：</tspan>
      <tspan x="24" dy="28">手抄耗时费力、搜题软件直接抄答案、</tspan>
      <tspan x="24" dy="28">过两天又忘。决心用技术打造一个真正</tspan>
      <tspan x="24" dy="28">符合教育规律的智能错题闭环。</tspan>
    </text>

    <!-- Key feature tags -->
    <g transform="translate(24, 280)">
      <rect width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">📷 智能拍照去手写</text>
      
      <rect x="175" width="180" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="191" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">🏷️ 知识点智能归类</text>

      <rect y="50" width="180" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="73" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">🔄 举一反三变式练习</text>
    </g>

    <line x1="24" y1="410" x2="396" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="24" y="445" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">解决核心：从“资料管理员”转向“理解与复习”</text>
  </g>

  <!-- Column 2: 降门槛与破圈 -->
  <g transform="translate(560, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="24" y="24" width="70" height="28" rx="6" fill="#0284C7"/>
    <text x="35" y="43" fill="#F0F9FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">阶段 02</text>
    
    <text x="24" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">零门槛接入与多端落地</text>
    <text x="24" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">
      <tspan x="24" dy="0">技术下沉消除使用壁垒：</tspan>
      <tspan x="24" dy="28">普通家长不用懂 API Key，一键网页登录；</tspan>
      <tspan x="24" dy="28">没有服务器也能用安卓单机版随时刷题；</tspan>
      <tspan x="24" dy="28">艾宾浩斯复习流驱动每天定量巩固。</tspan>
    </text>

    <!-- Key feature tags -->
    <g transform="translate(24, 280)">
      <rect width="180" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="16" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">🔑 MiniMax 免Key授权</text>
      
      <rect x="195" width="160" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="211" y="23" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">📱 安卓单机版 APK</text>

      <rect y="50" width="180" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="16" y="73" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">📅 艾宾浩斯今日复习</text>
    </g>

    <line x1="24" y1="410" x2="396" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="24" y="445" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">解决核心：把复杂的工程架构藏在简单界面之后</text>
  </g>

  <!-- Column 3: 社区共鸣与质变 -->
  <g transform="translate(1020, 320)" filter="url(#shadow)">
    <rect width="480" height="480" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="70" height="28" rx="6" fill="#4338CA"/>
    <text x="35" y="43" fill="#EEF2FF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">阶段 03</text>
    
    <text x="24" y="95" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="700">500+ Star 与生产级演进</text>
    <text x="24" y="130" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">
      <tspan x="24" dy="0">从个人自用到广大极客家庭标配：</tspan>
      <tspan x="24" dy="28">适配人教版课标标签、试卷智能留白排版、</tspan>
      <tspan x="24" dy="28">DOCX 文档导出、动态 SVG+语音讲解、</tspan>
      <tspan x="24" dy="28">全面支持国产大模型生态与飞牛OS。</tspan>
    </text>

    <!-- Key Stats Box -->
    <g transform="translate(24, 270)">
      <rect width="432" height="110" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="32" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">540+</text>
        <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">GitHub Stars</text>
      </g>
      <g transform="translate(170, 30)">
        <text x="0" y="32" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">90+</text>
        <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Community Forks</text>
      </g>
      <g transform="translate(310, 30)">
        <text x="0" y="32" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">0</text>
        <text x="0" y="58" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">Open Issues</text>
      </g>
    </g>

    <line x1="24" y1="410" x2="456" y2="410" stroke="#334155" stroke-width="1"/>
    <text x="24" y="445" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">全自主掌控：数据 100% 本地化，零隐私顾虑</text>
  </g>
</svg>
