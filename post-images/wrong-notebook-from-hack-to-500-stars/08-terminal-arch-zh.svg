<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <g transform="translate(100, 70)">
    <text x="0" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">FULL-STACK MULTI-PLATFORM RUNTIME</text>
    <text x="0" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">全终端穿透架构：从家用 NAS 到移动离线沙盒</text>
    <text x="0" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">为什么 wrong-notebook 能在各种家庭设备上跑起来，而不需要复杂的云端运维？</text>
  </g>

  <!-- 4 Terminal Cards -->
  <!-- Terminal 1: Web & PWA -->
  <g transform="translate(100, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#0284C7"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">🌐</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">Web / PWA</text>
      <text x="0" y="112" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">极速响应与全平台自适应</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· Next.js 16 App Router</tspan>
        <tspan x="0" dy="26">· Tailwind CSS 4 移动优先</tspan>
        <tspan x="0" dy="26">· Service Worker 离线缓存</tspan>
        <tspan x="0" dy="26">· 支持手机添加到主屏幕</tspan>
        <tspan x="0" dy="26">· 双击即开，零客户端负担</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">适用：手机浏览器、微信内置、iPad</text>
    </g>
  </g>

  <!-- Terminal 2: 飞牛OS / Docker / NAS -->
  <g transform="translate(460, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#0D9488"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">🏠</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">飞牛OS / NAS / Docker</text>
      <text x="0" y="112" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">家庭私有云中心枢纽</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· 官方 Docker Compose 编排</tspan>
        <tspan x="0" dy="26">· 飞牛OS应用中心专属向导</tspan>
        <tspan x="0" dy="26">· 本地 SQLite / WAL 高性能并发</tspan>
        <tspan x="0" dy="26">· 家庭成员账号多租户隔离</tspan>
        <tspan x="0" dy="26">· 每日 AI 次数预算管控</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#2DD4BF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">适用：群晖、威联通、fnOS、Linux家用服</text>
    </g>
  </g>

  <!-- Terminal 3: 桌面版 (Electron) -->
  <g transform="translate(820, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#4F46E5"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">💻</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">桌面版 (Desktop)</text>
      <text x="0" y="112" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">Windows / macOS 一键安装</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· Electron 独立应用容器</tspan>
        <tspan x="0" dy="26">· 首次运行自动打开初始化</tspan>
        <tspan x="0" dy="26">· 本地原生打印驱动对接</tspan>
        <tspan x="0" dy="26">· 支持 DOCX 试卷格式化导出</tspan>
        <tspan x="0" dy="26">· 免去命令行环境依赖</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">适用：书房电脑、办公笔记本、直连打印机</text>
    </g>
  </g>

  <!-- Terminal 4: 安卓单机版 (Node.js+SQLite APK) -->
  <g transform="translate(1180, 200)" filter="url(#shadow3)">
    <rect width="320" height="420" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(24, 24)">
      <rect width="48" height="48" rx="12" fill="#059669"/>
      <text x="14" y="32" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20">📱</text>
      <text x="0" y="85" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">安卓单机版 (Standalone)</text>
      <text x="0" y="112" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600">APK 内置完整服务端运行时</text>
      
      <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        <tspan x="0" dy="0">· 内置嵌入式 Node.js 运行时</tspan>
        <tspan x="0" dy="26">· 内置嵌入式 SQLite 数据库</tspan>
        <tspan x="0" dy="26">· 无需准备任何外部服务器！</tspan>
        <tspan x="0" dy="26">· 安装即用，随身携带自成体系</tspan>
        <tspan x="0" dy="26">· 支持手机与安卓平板双布局</tspan>
      </text>

      <rect y="310" width="272" height="40" rx="8" fill="#0F172A"/>
      <text x="16" y="335" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">适用：儿童学习平板、移动刷题、无网络环境</text>
    </g>
  </g>

  <!-- Bottom Common Substrate -->
  <g transform="translate(100, 660)" filter="url(#shadow3)">
    <rect width="1400" height="160" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(40, 30)">
      <text x="0" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">核心基座：数据 100% 本地自控 + 国产大模型矩阵</text>
      <text x="0" y="46" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
        无论通过哪种终端形态使用，所有题目数据、作答记录、艾宾浩斯复习状态均采用本地加密与 SQLite 存储，不经由任何第三方公有数据库。
      </text>

      <g transform="translate(0, 70)">
        <rect width="180" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="16" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">MiniMax (免费OAuth)</text>

        <rect x="195" width="160" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="211" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">火山引擎 (豆包/Coding)</text>

        <rect x="370" width="140" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="386" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">DeepSeek / Kimi</text>

        <rect x="525" width="140" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="541" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">通义千问 / 智谱GLM</text>

        <rect x="680" width="150" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
        <text x="696" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">阶跃星辰 / OpenAI</text>

        <rect x="845" width="190" height="32" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
        <text x="861" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">完整 JSON v3 导入导出备份</text>
      </g>
    </g>
  </g>
</svg>
