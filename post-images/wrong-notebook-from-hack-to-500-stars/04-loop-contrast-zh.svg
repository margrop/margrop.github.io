<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <g transform="translate(100, 70)">
    <text x="0" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LEARNING PARADIGM SHIFT</text>
    <text x="0" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="36" font-weight="800">两种错题整理模式的本质对比</text>
    <text x="0" y="78" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18">为什么“抄题本”让孩子越做越累，而“闭环流”能真正掌握知识？</text>
  </g>

  <!-- Left Card: 传统错题本（死循环） -->
  <g transform="translate(100, 200)" filter="url(#shadow2)">
    <rect width="660" height="620" rx="20" fill="#1E293B" stroke="#EF4444" stroke-width="2" stroke-opacity="0.6"/>
    
    <g transform="translate(40, 40)">
      <rect width="120" height="32" rx="16" fill="#7F1D1D"/>
      <text x="18" y="21" fill="#FCA5A5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">传统抄题模式</text>
      <text x="135" y="22" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">“死循环”与资料坟墓</text>

      <!-- Step 1 -->
      <g transform="translate(0, 70)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">1</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">耗时抄题 / 拍了一堆照片</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">家长花半小时剪贴打印，或照片散落在微信和相册里</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 145)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">2</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">搜题软件直接看答案</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">孩子大脑产生“看懂了=学会了”的虚假认知，缺乏推导过程</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 220)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">3</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">归档后无人问津</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">没有系统复习时间表，本子越堆越厚，翻阅成本极高</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 295)">
        <circle cx="20" cy="20" r="16" fill="#334155"/>
        <text x="16" y="25" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">4</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">考场换皮再次做错</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">数字一换、问法一变立刻卡壳，痛点依然存在</text>
      </g>

      <!-- Outcome summary box -->
      <g transform="translate(0, 390)">
        <rect width="580" height="110" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="24" y="35" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700">⚠️ 核心问题表现</text>
        <text x="24" y="65" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">
          <tspan x="24" dy="0">· 重形式轻理解：80% 精力消耗在抄题和排版上</tspan>
          <tspan x="24" dy="24">· 数据孤岛：题目、解析与练习记录四分五裂，无法跟踪掌握度</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Right Card: wrong-notebook（闭环流） -->
  <g transform="translate(840, 200)" filter="url(#shadow2)">
    <rect width="660" height="620" rx="20" fill="#1E293B" stroke="#10B981" stroke-width="2" stroke-opacity="0.8"/>
    
    <g transform="translate(40, 40)">
      <rect width="140" height="32" rx="16" fill="#064E3B"/>
      <text x="18" y="21" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">wrong-notebook</text>
      <text x="155" y="22" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" font-weight="700">“借书证”智能成长闭环</text>

      <!-- Step 1 -->
      <g transform="translate(0, 70)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">1</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">秒级识别 + 去除手写痕迹</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">拍照即提取题干公式，自动归类对应人教版知识点</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(0, 145)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">2</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">SVG 逐步动画 + 语音生动讲解</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">不是冰冷答案，像私塾老师手把手在黑板上拆解关键思考步骤</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 220)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">3</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">艾宾浩斯动态推进“今日复习”</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">按 1/2/4/7/15/30 天科学间隔自动调度，三态流转（待复习/中/掌握）</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(0, 295)">
        <circle cx="20" cy="20" r="16" fill="#047857"/>
        <text x="16" y="25" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">4</text>
        <text x="50" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="600">举一反三变式 + 严格自动判题</text>
        <text x="50" y="38" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">同考点不同题型实战考核，做对才升级掌握度，杜绝蒙混过关</text>
      </g>

      <!-- Outcome summary box -->
      <g transform="translate(0, 390)">
        <rect width="580" height="110" rx="12" fill="#0F172A" stroke="#047857" stroke-width="1"/>
        <text x="24" y="35" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700">✨ 闭环解决价值</text>
        <text x="24" y="65" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">
          <tspan x="24" dy="0">· 借书证模型：每道题有完整练习史，变式与组卷全串联</tspan>
          <tspan x="24" dy="24">· 减负增效：孩子只专注于真正未掌握的薄弱盲点</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
