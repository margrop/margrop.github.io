<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="740" fill="url(#bgGrad3)" />

  <text x="600" y="52" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Google 2026 全维反作弊风控雷达探测矩阵
  </text>
  <text x="600" y="84" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    揭秘为什么普通网页注册被秒拒，而移动端原生 App 能轻松通关
  </text>

  <!-- Central Radar Visualization -->
  <g transform="translate(365, 420)">
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="165" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Radar axis lines -->
    <line x1="0" y1="-230" x2="0" y2="230" stroke="#334155" stroke-width="1" />
    <line x1="-230" y1="0" x2="230" y2="0" stroke="#334155" stroke-width="1" />
    <line x1="-162" y1="-162" x2="162" y2="162" stroke="#1e293b" stroke-width="1" />
    <line x1="-162" y1="162" x2="162" y2="-162" stroke="#1e293b" stroke-width="1" />

    <!-- Bad Shape (Web Datacenter Proxy Registration - Fail) -->
    <polygon points="0,-45 80,-30 45,70 -35,50 -90,-20" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2.5" />
    
    <!-- Good Shape (iOS / Android Mobile Native Registration - Pass) -->
    <polygon points="0,-200 190,-70 140,160 -150,150 -185,-60" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="2.5" />

    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />

    <!-- Dimension Labels around radar (Strictly fitted) -->
    <!-- Top: IP & ASN Quality -->
    <text x="0" y="-245" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">
      ① IP 质量与 ASN 归属 (原生家宽 vs 机房节点)
    </text>
    <!-- Top-Right: Device Attestation -->
    <text x="210" y="-70" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="start">
      <tspan x="210">② 硬件安全芯片证明</tspan>
      <tspan x="210" dy="18" font-size="11" fill="#94a3b8">(Apple / Google GMS)</tspan>
    </text>
    <!-- Bottom-Right: Browser Fingerprint -->
    <text x="170" y="195" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="start">
      <tspan x="170">③ 浏览器环境指纹</tspan>
      <tspan x="170" dy="18" font-size="11" fill="#94a3b8">(WebRTC / Canvas 探针)</tspan>
    </text>
    <!-- Bottom-Left: Geolocation & Timezone -->
    <text x="-155" y="195" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">
      <tspan x="-155">④ 语言与时区对齐</tspan>
      <tspan x="-155" dy="18" font-size="11" fill="#94a3b8">(Accept-Lang / GeoIP)</tspan>
    </text>
    <!-- Top-Left: Behavioral Biometrics -->
    <text x="-175" y="-70" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">
      <tspan x="-175">⑤ 行为生物学动力特征</tspan>
      <tspan x="-175" dy="18" font-size="11" fill="#94a3b8">(鼠标轨迹 / 击键微时延)</tspan>
    </text>
  </g>

  <!-- Right Side Legend & Insights Card -->
  <g transform="translate(710, 120)">
    <rect width="430" height="580" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="430" height="48" rx="14" fill="#0f172a" />
    <text x="24" y="31" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      风控雷达对抗结果对比与破局秘籍
    </text>

    <!-- Legend Items (All properly wrapped tspans) -->
    <g transform="translate(24, 68)">
      <!-- Green item -->
      <rect width="16" height="16" rx="4" fill="#22c55e" />
      <text x="26" y="13" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#86efac">
        移动端原生 App 通道 (综合评分: 94)
      </text>
      <text x="26" y="36" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="26">• 依托真机 Secure Enclave 硬件芯片数字签名</tspan>
        <tspan x="26" dy="20">• 默认赋予底层“真实个人终端”顶级初始信任</tspan>
        <tspan x="26" dy="20">• 手机号码绑定步骤可直接点击“跳过”顺利通关</tspan>
      </text>

      <!-- Red item -->
      <g transform="translate(0, 95)">
        <rect width="16" height="16" rx="4" fill="#ef4444" />
        <text x="26" y="13" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fca5a5">
          网页机房节点注册 (综合评分: 21)
        </text>
        <text x="26" y="36" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">• 机房 ASN (如 AWS/DigitalOcean) 风险分爆表</tspan>
          <tspan x="26" dy="20">• WebRTC 协议泄漏真实局域网 ISP 导致冲突</tspan>
          <tspan x="26" dy="20">• 触发硬性短信拦截：“此电话号码无法用于验证”</tspan>
        </text>
      </g>

      <!-- Divider -->
      <line x1="0" y1="200" x2="382" y2="200" stroke="#334155" stroke-width="1" />

      <!-- Golden Advice Box -->
      <g transform="translate(0, 220)">
        <rect width="382" height="240" rx="10" fill="#0f172a" stroke="#ca8a04" stroke-width="1" />
        <text x="18" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fde047">
          💡 2026 注册最佳实践黄金铁律：
        </text>
        <text x="18" y="58" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#e2e8f0">
          <tspan x="18">1. 优先使用 iOS / Android 手机客户端 Gmail App</tspan>
          <tspan x="18" dy="24">2. 确保代理出口具备原生住宅 IP (Residential)</tspan>
          <tspan x="18" dy="24">3. 手机系统语言设为英文，时区与节点国家对齐</tspan>
          <tspan x="18" dy="24">4. 填完密码到手机验证页，轻触左下角“跳过”</tspan>
          <tspan x="18" dy="24">5. 注册成功后立即绑定三方恢复邮箱与 Authenticator</tspan>
          <tspan x="18" dy="24">6. 前 7 天保持网络平稳，避免跨国频繁切换节点</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>