<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad3)" />

  <text x="600" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Google 2026 全维反作弊风控雷达探测矩阵
  </text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    揭秘为什么普通网页注册被秒拒，而移动端原生 App 能轻松通关
  </text>

  <!-- Central Radar Visualization -->
  <g transform="translate(360, 380)">
    <!-- Concentric radar circles -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="165" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Radar axis lines -->
    <line x1="0" y1="-230" x2="0" y2="230" stroke="#334155" stroke-width="1" />
    <line x1="-230" y1="0" x2="230" y2="0" stroke="#334155" stroke-width="1" />
    <line x1="-162" y1="-162" x2="162" y2="162" stroke="#1e293b" stroke-width="1" />
    <line x1="-162" y1="162" x2="162" y2="-162" stroke="#1e293b" stroke-width="1" />

    <!-- Bad Shape (Web Datacenter Proxy Registration - Fail) -->
    <polygon points="0,-45 80,-30 45,70 -35,50 -90,-20" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2.5" />
    
    <!-- Good Shape (iOS / Android Mobile Native Registration - Pass) -->
    <polygon points="0,-200 190,-70 140,160 -150,150 -185,-60" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="2.5" />

    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />

    <!-- Dimension Labels around radar -->
    <!-- Top: IP & ASN Quality -->
    <text x="0" y="-245" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">
      ① IP 质量与 ASN 归属 (原生家宽 vs 机房节点)
    </text>
    <!-- Top-Right: Device Attestation -->
    <text x="235" y="-70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start">
      ② 硬件安全芯片 (Apple DeviceCheck / Play Integrity)
    </text>
    <!-- Bottom-Right: Browser Fingerprint -->
    <text x="180" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="start">
      ③ 浏览器环境指纹 (WebRTC / Canvas / Audio)
    </text>
    <!-- Bottom-Left: Geolocation & Timezone -->
    <text x="-180" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">
      ④ 语言/时区一致性 (Accept-Language / GeoIP)
    </text>
    <!-- Top-Left: Behavioral Biometrics -->
    <text x="-235" y="-70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="end">
      ⑤ 行为生物特征 (鼠标动力学 / 击键间隔)
    </text>
  </g>

  <!-- Right Side Legend & Insights Card -->
  <g transform="translate(800, 140)">
    <rect width="350" height="480" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="350" height="50" rx="14" fill="#0f172a" />
    <text x="25" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      风控雷达对抗结果对比
    </text>

    <!-- Legend Items -->
    <g transform="translate(25, 75)">
      <!-- Green item -->
      <rect width="18" height="18" rx="4" fill="#22c55e" />
      <text x="28" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#86efac">
        移动端原生 App 通道 (综合评分: 94)
      </text>
      <text x="28" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
        • 依托真机 Secure Enclave 硬件签名<br/>
        • 默认直接赋予“真实个人终端”基础信任<br/>
        • 手机号码验证可直接点击“跳过”
      </text>

      <!-- Red item -->
      <rect y="90" width="18" height="18" rx="4" fill="#ef4444" />
      <text x="28" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">
        网页机房节点注册 (综合评分: 21)
      </text>
      <text x="28" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
        • 机房 ASN (如 DigitalOcean/AWS) 风险高<br/>
        • WebRTC 暴露真实局域网与 ISP 冲突<br/>
        • 触发硬性短信拦截：“此号码无法验证”
      </text>

      <!-- Divider -->
      <line x1="0" y1="180" x2="300" y2="180" stroke="#334155" stroke-width="1" />

      <!-- Golden Advice -->
      <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fde047">
        💡 2026 注册最佳实践黄金铁律：
      </text>
      <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1" width="300">
        1. 优先使用 iOS / Android 手机客户端 Gmail App<br/>
        2. 确保代理节点使用双 ISP 原生住宅 IP (Residential)<br/>
        3. 手机系统语言设为英文，时区与节点国家严格对齐<br/>
        4. 注册成功后不要立即换梯子，在同一设备上静置 7 天
      </text>
    </g>
  </g>
</svg>