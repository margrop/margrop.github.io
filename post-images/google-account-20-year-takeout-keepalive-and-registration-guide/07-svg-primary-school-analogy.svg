<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad2)" />

  <!-- Header -->
  <text x="600" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">
    小学生秒懂的生活大比方：透视 Google 账号核心机制
  </text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">
    用日常校园与生活场景，3 分钟看懂老号陈化、闲置死刑与风控拦截的深层逻辑
  </text>

  <!-- 3 Analogy Cards -->
  <!-- Analogy 1 -->
  <g transform="translate(60, 120)" filter="url(#shadow2)">
    <rect width="335" height="500" rx="16" fill="url(#card1)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="56" rx="16" fill="#b45309" fill-opacity="0.25" />
    <text x="167" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#fbbf24" text-anchor="middle">
      比方一：20年陈年老号
    </text>

    <!-- Icon & Subtitle -->
    <text x="167" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="32" text-anchor="middle">🏅</text>
    <text x="167" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fde68a" text-anchor="middle">
      “小区初代建民的金钥匙”
    </text>

    <!-- Body -->
    <g transform="translate(20, 140)">
      <rect width="295" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">生活场景场景：</text>
      <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">20 年前小区刚落成，你是第一批入住的业主。门口门卫大爷（风控系统）看着你长大，哪怕你今天戴了墨镜换了衣服（换了代理节点），大爷笑着点点头就直接给你放行进门。</text>

      <rect y="165" width="295" height="165" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">技术映射（Google）：</text>
      <text x="15" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">2006 年老号在 Google 数据库拥有 20 年的干净历史行为序列。系统内部判定该账号不是批量黑产脚本，信任基准极高，极难被误封或弹窗二次拦截。</text>
    </g>
  </g>

  <!-- Analogy 2 -->
  <g transform="translate(432, 120)" filter="url(#shadow2)">
    <rect width="335" height="500" rx="16" fill="url(#card1)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="56" rx="16" fill="#b91c1c" fill-opacity="0.25" />
    <text x="167" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f87171" text-anchor="middle">
      比方二：闲置两年死刑
    </text>

    <!-- Icon & Subtitle -->
    <text x="167" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="32" text-anchor="middle">🏫</text>
    <text x="167" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fca5a5" text-anchor="middle">
      “学校宿舍储物柜清理规则”
    </text>

    <!-- Body -->
    <g transform="translate(20, 140)">
      <rect width="295" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">生活场景：</text>
      <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">学校分配给你一个带锁的更衣柜。宿舍管理员规定：每位学生至少每隔 2 年必须来刷一次校园卡。如果你连续 2 年没露面，阿姨判定你已退学，直接剪开铁锁清空储物柜重新分配！</text>

      <rect y="165" width="295" height="165" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f87171">技术映射（Google）：</text>
      <text x="15" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">长期无人登录的账号极易被黑客撞库盗用。为了防范幽灵账号犯罪并释放海量冷存储服务器成本，Google 铁腕执行 2 年无活动永久注销制度。</text>
    </g>
  </g>

  <!-- Analogy 3 -->
  <g transform="translate(805, 120)" filter="url(#shadow2)">
    <rect width="335" height="500" rx="16" fill="url(#card1)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="56" rx="16" fill="#0369a1" fill-opacity="0.25" />
    <text x="167" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc" text-anchor="middle">
      比方三：手机注册被拒
    </text>

    <!-- Icon & Subtitle -->
    <text x="167" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="32" text-anchor="middle">🛂</text>
    <text x="167" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#bae6fd" text-anchor="middle">
      “冒牌租客与机场特勤通道”
    </text>

    <!-- Body -->
    <g transform="translate(20, 140)">
      <rect width="295" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">生活场景：</text>
      <text x="15" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">你自称是本国居民，却戴着假发（机房代理 IP），拿出了一张被涂改过几十次的临时借条（已被滥用的电话号段），海关警察一秒拉响警报：‘此证件无法通过！请走正规渠道。’</text>

      <rect y="165" width="295" height="165" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">技术映射（Google）：</text>
      <text x="15" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">数据中心 IP + 被多次注册的号段，在 Google 滥用评分器中瞬间爆表；而使用 iPhone / Android 官方 Gmail App 注册，自带真机硬件安全加密芯片证明，信誉极高可免验。</text>
    </g>
  </g>
</svg>