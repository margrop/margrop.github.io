<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad2)" />

  <!-- Header -->
  <text x="600" y="55" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">
    小学生秒懂的生活大比方：透视 Google 账号核心机制
  </text>
  <text x="600" y="88" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle">
    用日常校园与生活场景，看懂老号陈化、闲置死刑与风控拦截的深层逻辑
  </text>

  <!-- 3 Analogy Cards -->
  <!-- Analogy 1 -->
  <g transform="translate(60, 120)" filter="url(#shadow2)">
    <rect width="335" height="590" rx="16" fill="url(#card1)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="54" rx="16" fill="#b45309" fill-opacity="0.25" />
    <text x="167" y="34" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#fbbf24" text-anchor="middle">
      比方一：20年陈年老号
    </text>

    <!-- Icon & Subtitle -->
    <text x="167" y="85" font-size="30" text-anchor="middle">🏅</text>
    <text x="167" y="115" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#fde68a" text-anchor="middle">
      “小区初代建民的金钥匙”
    </text>

    <!-- Box 1: Life Scenario -->
    <g transform="translate(18, 135)">
      <rect width="299" height="195" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">生活场景：</text>
      <text x="14" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="14">20 年前小区刚落成，你是第一批</tspan>
        <tspan x="14" dy="22">入住的模范业主。门口门卫大爷</tspan>
        <tspan x="14" dy="22">看着你长大，信誉卡盖满全勤印章。</tspan>
        <tspan x="14" dy="22">今天哪怕你戴了墨镜、换了新衣服、</tspan>
        <tspan x="14" dy="22">甚至骑了新车（换节点或代理 IP），</tspan>
        <tspan x="14" dy="22">大爷笑着点点头，直接抬杆放行！</tspan>
      </text>
    </g>

    <!-- Box 2: Tech Mapping -->
    <g transform="translate(18, 345)">
      <rect width="299" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">技术映射（Google）：</text>
      <text x="14" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="14">2006 年老号在 Google 数据库拥</tspan>
        <tspan x="14" dy="22">有整整 20 年干净行为序列。反欺</tspan>
        <tspan x="14" dy="22">诈系统判定该账号绝非黑产机器人，</tspan>
        <tspan x="14" dy="22">信任基准分极高（98/100）。切换</tspan>
        <tspan x="14" dy="22">异地或机房 IP 时极少触发二次短信</tspan>
        <tspan x="14" dy="22">拦截，享有数字茅台级豁免特权。</tspan>
      </text>
    </g>
  </g>

  <!-- Analogy 2 -->
  <g transform="translate(432, 120)" filter="url(#shadow2)">
    <rect width="335" height="590" rx="16" fill="url(#card1)" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="54" rx="16" fill="#b91c1c" fill-opacity="0.25" />
    <text x="167" y="34" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#f87171" text-anchor="middle">
      比方二：闲置两年死刑
    </text>

    <!-- Icon & Subtitle -->
    <text x="167" y="85" font-size="30" text-anchor="middle">🏫</text>
    <text x="167" y="115" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#fca5a5" text-anchor="middle">
      “学校宿舍储物柜清理规则”
    </text>

    <!-- Box 1: Life Scenario -->
    <g transform="translate(18, 135)">
      <rect width="299" height="195" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">生活场景：</text>
      <text x="14" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="14">学校分配给你一个带锁的储物柜。</tspan>
        <tspan x="14" dy="22">宿管阿姨制定死规矩：每位学生每</tspan>
        <tspan x="14" dy="22">隔 2 年必须拿校园卡来柜前刷一次。</tspan>
        <tspan x="14" dy="22">若连续 2 年未露面，阿姨判定退学，</tspan>
        <tspan x="14" dy="22">拿大铁剪咔嚓剪断铁锁，将所有物</tspan>
        <tspan x="14" dy="22">品全部倒进垃圾桶，彻底清空！</tspan>
      </text>
    </g>

    <!-- Box 2: Tech Mapping -->
    <g transform="translate(18, 345)">
      <rect width="299" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#f87171">技术映射（Google）：</text>
      <text x="14" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="14">长期未活跃账号极易被撞库攻击，</tspan>
        <tspan x="14" dy="22">且占用了数十 PB 的分布式冷存储。</tspan>
        <tspan x="14" dy="22">为防范幽灵账号并释放巨额服务器</tspan>
        <tspan x="14" dy="22">成本，Google 铁面执行 2 年死刑。</tspan>
        <tspan x="14" dy="22">注意：仅邮件被动转发绝不算作活</tspan>
        <tspan x="14" dy="22">跃，必须有本人主动认证会话！</tspan>
      </text>
    </g>
  </g>

  <!-- Analogy 3 -->
  <g transform="translate(805, 120)" filter="url(#shadow2)">
    <rect width="335" height="590" rx="16" fill="url(#card1)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="335" height="54" rx="16" fill="#0369a1" fill-opacity="0.25" />
    <text x="167" y="34" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#7dd3fc" text-anchor="middle">
      比方三：手机注册被拒
    </text>

    <!-- Icon & Subtitle -->
    <text x="167" y="85" font-size="30" text-anchor="middle">🛂</text>
    <text x="167" y="115" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#bae6fd" text-anchor="middle">
      “冒牌租客与机场特勤通道”
    </text>

    <!-- Box 1: Life Scenario -->
    <g transform="translate(18, 135)">
      <rect width="299" height="195" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">生活场景：</text>
      <text x="14" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="14">你自称是本地居民，却戴着假发</tspan>
        <tspan x="14" dy="22">（机房代理 IP），拿出被涂改几十</tspan>
        <tspan x="14" dy="22">次的临时借条（黑产泛滥号段）敲</tspan>
        <tspan x="14" dy="22">门，安检警察一秒拉响警报拦截：</tspan>
        <tspan x="14" dy="22">“此证件无法通过，立即退回！”</tspan>
        <tspan x="14" dy="22">必须走正规渠道并出示有效证件。</tspan>
      </text>
    </g>

    <!-- Box 2: Tech Mapping -->
    <g transform="translate(18, 345)">
      <rect width="299" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="26" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">技术映射（Google）：</text>
      <text x="14" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="14">机房 IP 叠加滥用号段在 Google</tspan>
        <tspan x="14" dy="22">风控中瞬间判定为高危欺诈；而使</tspan>
        <tspan x="14" dy="22">用 iPhone / Android 官方 Gmail</tspan>
        <tspan x="14" dy="22">App 注册，自带真机硬件安全加密</tspan>
        <tspan x="14" dy="22">芯片认证（校车专线），信誉极高，</tspan>
        <tspan x="14" dy="22">无需绑定手机即可一键跳过注册！</tspan>
      </text>
    </g>
  </g>
</svg>