<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad4)" />

  <text x="600" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Google 多账号 2 年防销号生命周期与保活管道架构
  </text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    从 Takeout 创号溯源、本地脱敏账本到阶梯式健康预警与轻量零侵入保活闭环
  </text>

  <!-- Flow Steps Horizontal Containers -->
  <!-- Step 1: Takeout Extract -->
  <g transform="translate(60, 140)" filter="url(#shadow4)">
    <rect width="240" height="380" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="240" height="48" rx="14" fill="#1d4ed8" fill-opacity="0.25" />
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#93c5fd" text-anchor="middle">
      阶段 1: Takeout 溯源取证
    </text>

    <g transform="translate(20, 70)">
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">数据提取源：</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">takeout.google.com 仅勾选 Google 账号导出</text>

      <text x="0" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">核心时间戳解析：</text>
      <text x="0" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">定位 *.SubscriberInfo.html 中的 Created on 绝对基准时间</text>

      <text x="0" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">历史服务追溯：</text>
      <text x="0" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">确认首个接入产品 (如 2006 年 Gmail 内测邀请)</text>

      <rect y="210" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="100" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93c5fd" font-weight="600" text-anchor="middle">
        精确核算真实账号年龄
      </text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <polygon points="320,330 335,320 335,340" fill="#60a5fa" />

  <!-- Step 2: Local Desensitized Ledger -->
  <g transform="translate(350, 140)" filter="url(#shadow4)">
    <rect width="240" height="380" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="240" height="48" rx="14" fill="#047857" fill-opacity="0.25" />
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      阶段 2: 本地脱敏资产账本
    </text>

    <g transform="translate(20, 70)">
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">隐私零外泄原则：</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">无网络上报、无第三方依赖，纯本地 accounts.json 维护</text>

      <text x="0" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">账本记录字段：</text>
      <text x="0" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• 掩码账号 (u***@gmail)<br/>• 注册诞生时间<br/>• 上次主动活动日期</text>

      <rect y="210" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="100" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6ee7b7" font-weight="600" text-anchor="middle">
        静态离线配置 / 零云端依赖
      </text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <polygon points="610,330 625,320 625,340" fill="#34d399" />

  <!-- Step 3: Tiered Health Auditing -->
  <g transform="translate(640, 140)" filter="url(#shadow4)">
    <rect width="240" height="380" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="240" height="48" rx="14" fill="#b45309" fill-opacity="0.25" />
    <text x="120" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fde68a" text-anchor="middle">
      阶段 3: 阶梯式活动预警
    </text>

    <g transform="translate(20, 70)">
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">闲置天数倒计时：</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">基准 730 天 (24 个月) 倒扣</text>

      <text x="0" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#22c55e">● 绿色安全区间 (&lt;365天)：</text>
      <text x="0" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">正常使用，无需额外干预</text>

      <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#eab308">● 黄色预警区间 (365-600天)：</text>
      <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">提示计划在下次例行维护中登录</text>

      <text x="0" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ef4444">● 红色濒危区间 (&gt;600天)：</text>
      <text x="0" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fca5a5">距离死刑仅剩百日，立即保活！</text>

      <rect y="210" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="100" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fde68a" font-weight="600" text-anchor="middle">
        三色健康度红绿灯体系
      </text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <polygon points="900,330 915,320 915,340" fill="#fbbf24" />

  <!-- Step 4: Keepalive Actions -->
  <g transform="translate(930, 140)" filter="url(#shadow4)">
    <rect width="210" height="380" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <rect width="210" height="48" rx="14" fill="#7e22ce" fill-opacity="0.25" />
    <text x="105" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#e9d5ff" text-anchor="middle">
      阶段 4: 零侵入轻量保活
    </text>

    <g transform="translate(15, 70)">
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc">官方认证有效活动：</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">
        ✓ 登录阅读/发送 1 封邮件<br/>
        ✓ 登录搜索 1 个关键词<br/>
        ✓ 观看 1 个 YouTube 视频<br/>
        ✓ 打开 Google Drive<br/>
        ✓ 第三方 OAuth 登录刷新
      </text>

      <rect y="210" width="180" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="90" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e9d5ff" font-weight="600" text-anchor="middle">
        重置 2 年活跃倒计时
      </text>
    </g>
  </g>

  <!-- Bottom Global Summary Banner -->
  <rect x="60" y="555" width="1080" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="600" y="586" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">
    🛡️ 铁律警示：仅配置邮件客户端自动转信 / 接收邮件，<tspan fill="#f87171" font-weight="700">绝不算作活跃活动</tspan>！必须有主动认证会话交互方能合规续命。
  </text>
</svg>