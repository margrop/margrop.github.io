<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="740" fill="url(#bgGrad4)" />

  <text x="600" y="52" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Google 多账号 2 年防销号生命周期与保活管道架构
  </text>
  <text x="600" y="84" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    从 Takeout 创号溯源、本地脱敏账本到阶梯式健康预警与轻量零侵入保活闭环
  </text>

  <!-- Flow Steps Horizontal Containers -->
  <!-- Step 1: Takeout Extract -->
  <g transform="translate(50, 130)" filter="url(#shadow4)">
    <rect width="250" height="420" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="250" height="46" rx="14" fill="#1d4ed8" fill-opacity="0.25" />
    <text x="125" y="29" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle">
      阶段 1: Takeout 溯源取证
    </text>

    <g transform="translate(18, 65)">
      <text x="0" y="18" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">数据提取源：</text>
      <text x="0" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="0">• 访问 takeout.google.com</tspan>
        <tspan x="0" dy="20">• 点击“取消全选”避免臃肿</tspan>
        <tspan x="0" dy="20">• 单选“Google 账号”导出</tspan>
      </text>

      <text x="0" y="118" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">核心时间戳解析：</text>
      <text x="0" y="138" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="0">• 定位 SubscriberInfo.html</tspan>
        <tspan x="0" dy="20">• 提取 Created on 创号时间</tspan>
        <tspan x="0" dy="20">• 追溯 Gmail 内测初始接入</tspan>
      </text>

      <rect y="235" width="214" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="107" y="265" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#93c5fd" font-weight="700" text-anchor="middle">
        精确核算真实账号年龄
      </text>
      <text x="107" y="285" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
        识别 20 年茅台级高信任资产
      </text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <polygon points="315,340 330,330 330,350" fill="#60a5fa" />

  <!-- Step 2: Local Desensitized Ledger -->
  <g transform="translate(345, 130)" filter="url(#shadow4)">
    <rect width="250" height="420" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect width="250" height="46" rx="14" fill="#047857" fill-opacity="0.25" />
    <text x="125" y="29" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      阶段 2: 本地脱敏资产账本
    </text>

    <g transform="translate(18, 65)">
      <text x="0" y="18" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#34d399">隐私零外泄原则：</text>
      <text x="0" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="0">• 无网络上报、无云端依赖</tspan>
        <tspan x="0" dy="20">• 纯本地 accounts.json 维系</tspan>
        <tspan x="0" dy="20">• 绝不保存密码与敏感凭据</tspan>
      </text>

      <text x="0" y="118" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#34d399">账本记录脱敏字段：</text>
      <text x="0" y="138" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="0">• 掩码账号 (u***t@gmail)</tspan>
        <tspan x="0" dy="20">• 创号诞生日期 (Created on)</tspan>
        <tspan x="0" dy="20">• 上次主动交互会话日期</tspan>
      </text>

      <rect y="235" width="214" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="107" y="265" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6ee7b7" font-weight="700" text-anchor="middle">
        静态声明式资产配置
      </text>
      <text x="107" y="285" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
        100% 本地沙箱隔离
      </text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <polygon points="610,340 625,330 625,350" fill="#34d399" />

  <!-- Step 3: Tiered Health Auditing -->
  <g transform="translate(640, 130)" filter="url(#shadow4)">
    <rect width="250" height="420" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="250" height="46" rx="14" fill="#b45309" fill-opacity="0.25" />
    <text x="125" y="29" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fde68a" text-anchor="middle">
      阶段 3: 阶梯式活动预警
    </text>

    <g transform="translate(18, 65)">
      <text x="0" y="18" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#fbbf24">闲置天数倒计时（730天）：</text>
      <text x="0" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="0" fill="#22c55e" font-weight="700">● 绿色安全区间 (&lt;365天)</tspan>
        <tspan x="0" dy="18" fill="#94a3b8">  正常使用，无需额外干预</tspan>
        <tspan x="0" dy="24" fill="#eab308" font-weight="700">● 黄色预警区间 (365-600天)</tspan>
        <tspan x="0" dy="18" fill="#94a3b8">  提示列入近期登录保活计划</tspan>
        <tspan x="0" dy="24" fill="#ef4444" font-weight="700">● 红色濒危区间 (&gt;600天)</tspan>
        <tspan x="0" dy="18" fill="#fca5a5">  距离销号不足百日，即刻执行！</tspan>
      </text>

      <rect y="235" width="214" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="107" y="265" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#fde68a" font-weight="700" text-anchor="middle">
        三色健康度红绿灯体系
      </text>
      <text x="107" y="285" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
        精准量化闲置风险倒计时
      </text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <polygon points="905,340 920,330 920,350" fill="#fbbf24" />

  <!-- Step 4: Keepalive Actions -->
  <g transform="translate(935, 130)" filter="url(#shadow4)">
    <rect width="215" height="420" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <rect width="215" height="46" rx="14" fill="#7e22ce" fill-opacity="0.25" />
    <text x="107" y="29" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#e9d5ff" text-anchor="middle">
      阶段 4: 零侵入轻量保活
    </text>

    <g transform="translate(16, 65)">
      <text x="0" y="18" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#c084fc">官方认证有效活动：</text>
      <text x="0" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="0">✓ 登录读/发 1 封邮件</tspan>
        <tspan x="0" dy="22">✓ 登录搜索 1 个关键词</tspan>
        <tspan x="0" dy="22">✓ 观看 1 个 YouTube</tspan>
        <tspan x="0" dy="22">✓ 打开 Google Drive</tspan>
        <tspan x="0" dy="22">✓ 第三方 OAuth 授权</tspan>
      </text>

      <rect y="235" width="183" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="91" y="265" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#e9d5ff" font-weight="700" text-anchor="middle">
        重置 2 年活跃倒计时
      </text>
      <text x="91" y="285" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
        合规续命 · 安全无虞
      </text>
    </g>
  </g>

  <!-- Bottom Global Summary Banner -->
  <g transform="translate(50, 580)">
    <rect width="1100" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="550" y="35" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f87171" text-anchor="middle">
      🛡️ 铁律警示与保活避坑指南：
    </text>
    <text x="550" y="62" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
      仅配置邮件客户端自动转信或被动接收邮件，绝不算作有效活跃！必须产生用户主动认证会话交互方能合规续命。
    </text>
  </g>
</svg>