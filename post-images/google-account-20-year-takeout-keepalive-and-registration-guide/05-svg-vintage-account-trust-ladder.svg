<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.3">
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="200" y1="0" x2="200" y2="680" />
    <line x1="400" y1="0" x2="400" y2="680" />
    <line x1="600" y1="0" x2="600" y2="680" />
    <line x1="800" y1="0" x2="800" y2="680" />
    <line x1="1000" y1="0" x2="1000" y2="680" />
  </g>

  <!-- Header Section -->
  <text x="600" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    Google 账号信誉天梯与风控沙箱演进图 (2006 vs 2026)
  </text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    从 20 年前 Gmail 内测黄金时代的“免死金牌”到 2026 年零信任多维反作弊风控阵地
  </text>

  <!-- Left Column: 2006 Vintage Account (Vintage Maotai Tier) -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="510" height="510" rx="16" fill="url(#cardGrad1)" stroke="#eab308" stroke-width="2" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="510" height="64" rx="16" fill="#ca8a04" fill-opacity="0.2" />
    <circle cx="40" cy="32" r="16" fill="#eab308" />
    <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#000" font-weight="900" text-anchor="middle">★</text>
    <text x="70" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fef08a">
      2006 年初生老号 (20年陈化 · 茅台级资产)
    </text>

    <!-- Metrics Badge -->
    <rect x="30" y="80" width="450" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="45" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#cbd5e1">
      <tspan fill="#38bdf8" font-weight="700">诞生背景：</tspan> Gmail 1GB 邀请内测期 · 注册无需手机号绑定
    </text>

    <!-- Trust Level Indicator -->
    <text x="30" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#facc15">信誉权重评级 (Trust Score)：98 / 100</text>
    <rect x="30" y="160" width="450" height="12" rx="6" fill="#334155" />
    <rect x="30" y="160" width="440" height="12" rx="6" fill="url(#goldGrad)" />

    <!-- Feature Items -->
    <g transform="translate(30, 195)">
      <!-- Item 1 -->
      <circle cx="10" cy="12" r="6" fill="#22c55e" />
      <text x="25" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">极高抗风控免疫力</text>
      <text x="25" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">更换梯子节点、异地机房 IP 登录极少触发二次手机短信阻断</text>

      <!-- Item 2 -->
      <circle cx="10" cy="72" r="6" fill="#22c55e" />
      <text x="25" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">核心服务无阻力接入</text>
      <text x="25" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Google Cloud、Gemini API、Google Play 开发者等高危业务通过率 99%</text>

      <!-- Item 3 -->
      <circle cx="10" cy="132" r="6" fill="#22c55e" />
      <text x="25" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Gmail 邮件信誉权重顶格</text>
      <text x="25" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">发信入箱率（Inbox Delivery）极高，几乎绝不被对端误判为垃圾广告</text>

      <!-- Item 4 -->
      <circle cx="10" cy="192" r="6" fill="#ef4444" />
      <text x="25" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fca5a5">悬顶之剑：两年闲置死刑政策</text>
      <text x="25" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">连续 24 个月无有效登录或活动，将被 Google 永久注销、数据清空！</text>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="30" y="450" width="450" height="36" rx="8" fill="#ca8a04" fill-opacity="0.15" stroke="#eab308" stroke-width="1" />
    <text x="255" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#fde047" font-weight="600" text-anchor="middle">
      🛡️ 核心防守策略：设置周期巡检脚本，每 12-18 个月主动刷新活动
    </text>
  </g>

  <!-- Right Column: 2026 New Account (High Risk Control Tier) -->
  <g transform="translate(630, 120)" filter="url(#shadow)">
    <rect width="510" height="510" rx="16" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="510" height="64" rx="16" fill="#0284c7" fill-opacity="0.2" />
    <circle cx="40" cy="32" r="16" fill="#0284c7" />
    <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#fff" font-weight="900" text-anchor="middle">⚡</text>
    <text x="70" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#bae6fd">
      2026 年新注册账号 (高压沙箱 · 地狱级开局)
    </text>

    <!-- Metrics Badge -->
    <rect x="30" y="80" width="450" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="45" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#cbd5e1">
      <tspan fill="#f87171" font-weight="700">当前困境：</tspan> “此电话号码无法用于进行验证” · 机房 IP 秒封锁
    </text>

    <!-- Trust Level Indicator -->
    <text x="30" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">新号初始信誉 (Trust Score)：15 / 100</text>
    <rect x="30" y="160" width="450" height="12" rx="6" fill="#334155" />
    <rect x="30" y="160" width="75" height="12" rx="6" fill="url(#blueGrad)" />

    <!-- Feature Items -->
    <g transform="translate(30, 195)">
      <!-- Item 1 -->
      <circle cx="10" cy="12" r="6" fill="#f87171" />
      <text x="25" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">严苛的环境指纹审查</text>
      <text x="25" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">WebRTC 泄露、Canvas 指纹异常、时区与 IP 不一致即判定为黑产脚本</text>

      <!-- Item 2 -->
      <circle cx="10" cy="72" r="6" fill="#f87171" />
      <text x="25" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">手机号归属地拦截陷阱</text>
      <text x="25" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">国内 +86 号码被大量黑产滥用导致全局限流，接码平台虚拟号直接拒收</text>

      <!-- Item 3 -->
      <circle cx="10" cy="132" r="6" fill="#f87171" />
      <text x="25" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">前 90 天高度敏感观察期</text>
      <text x="25" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">稍有批量发信、调用敏感 API 或异常 IP 切换即刻触发人工申诉锁</text>

      <!-- Item 4 -->
      <circle cx="10" cy="192" r="6" fill="#22c55e" />
      <text x="25" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#86efac">破局捷径：移动端生态信任通道</text>
      <text x="25" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">利用 iOS / Android 原生 Gmail App 走系统级硬件凭证通道成功跳过验证</text>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="30" y="450" width="450" height="36" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="255" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7dd3fc" font-weight="600" text-anchor="middle">
      🚀 核心破局法：原生手机端应用 + 家宽纯净 IP + 正常自然浏览养号
    </text>
  </g>
</svg>