<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="740" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <text x="600" y="52" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Google 账号信誉天梯与风控沙箱演进图 (2006 vs 2026)
  </text>
  <text x="600" y="84" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    从 20 年前 Gmail 内测黄金时代的免死金牌到 2026 年零信任多维反作弊风控阵地
  </text>

  <!-- Left Column: 2006 Vintage Account -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="510" height="570" rx="16" fill="url(#cardGrad1)" stroke="#eab308" stroke-width="2" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="510" height="60" rx="16" fill="#ca8a04" fill-opacity="0.2" />
    <circle cx="36" cy="30" r="14" fill="#eab308" />
    <text x="36" y="35" font-size="16" fill="#000" font-weight="900" text-anchor="middle">★</text>
    <text x="64" y="36" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#fef08a">
      2006 年初生老号 (20年陈化 · 茅台级资产)
    </text>

    <!-- Metrics Badge -->
    <rect x="25" y="75" width="460" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="40" y="100" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#cbd5e1">
      <tspan fill="#38bdf8" font-weight="700">诞生背景：</tspan> Gmail 1GB 邀请内测期 · 注册无需手机号绑定
    </text>

    <!-- Trust Level Indicator -->
    <text x="25" y="145" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#facc15">信誉权重评级 (Trust Score)：98 / 100</text>
    <rect x="25" y="156" width="460" height="10" rx="5" fill="#334155" />
    <rect x="25" y="156" width="450" height="10" rx="5" fill="url(#goldGrad)" />

    <!-- Feature Items with multiline tspans -->
    <g transform="translate(25, 185)">
      <!-- Item 1 -->
      <circle cx="10" cy="12" r="6" fill="#22c55e" />
      <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">极高抗风控免疫力</text>
      <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="26">更换梯子节点或异地机房 IP 登录时，系统极少触发二次</tspan>
        <tspan x="26" dy="18">手机短信挑战，拥有超强的异地漫游抗风险韧性。</tspan>
      </text>

      <!-- Item 2 -->
      <g transform="translate(0, 68)">
        <circle cx="10" cy="12" r="6" fill="#22c55e" />
        <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">核心云服务绿灯放行</text>
        <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">Google Cloud (GCP)、Gemini API、Play 开发者凭据</tspan>
          <tspan x="26" dy="18">审核通过率达 99%，极少被误伤标记为欺诈封锁。</tspan>
        </text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 136)">
        <circle cx="10" cy="12" r="6" fill="#22c55e" />
        <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Gmail 邮件信誉权重顶格</text>
        <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">二十年如一日的干净收发记录赋予极高域名信誉分，</tspan>
          <tspan x="26" dy="18">邮件发信直达收件箱率（Inbox Rate）接近 100%。</tspan>
        </text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 204)">
        <circle cx="10" cy="12" r="6" fill="#ef4444" />
        <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#fca5a5">悬顶之剑：两年闲置死刑政策</text>
        <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">无论号龄多老，若连续 24 个月无有效登录或活跃，</tspan>
          <tspan x="26" dy="18">都将被 Google 永久注销、数据与名字永久清空！</tspan>
        </text>
      </g>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="25" y="505" width="460" height="38" rx="8" fill="#ca8a04" fill-opacity="0.15" stroke="#eab308" stroke-width="1" />
    <text x="255" y="529" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#fde047" font-weight="700" text-anchor="middle">
      🛡️ 核心防守策略：设置周期巡检脚本，每 12-18 个月主动刷新活动
    </text>
  </g>

  <!-- Right Column: 2026 New Account -->
  <g transform="translate(630, 120)" filter="url(#shadow)">
    <rect width="510" height="570" rx="16" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="510" height="60" rx="16" fill="#0284c7" fill-opacity="0.2" />
    <circle cx="36" cy="30" r="14" fill="#0284c7" />
    <text x="36" y="35" font-size="16" fill="#fff" font-weight="900" text-anchor="middle">⚡</text>
    <text x="64" y="36" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#bae6fd">
      2026 年新注册账号 (高压沙箱 · 地狱级开局)
    </text>

    <!-- Metrics Badge -->
    <rect x="25" y="75" width="460" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="40" y="100" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#cbd5e1">
      <tspan fill="#f87171" font-weight="700">当前困境：</tspan> “此电话号码无法用于验证” · 机房 IP 秒封锁
    </text>

    <!-- Trust Level Indicator -->
    <text x="25" y="145" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">新号初始信誉 (Trust Score)：15 / 100</text>
    <rect x="25" y="156" width="460" height="10" rx="5" fill="#334155" />
    <rect x="25" y="156" width="70" height="10" rx="5" fill="url(#blueGrad)" />

    <!-- Feature Items with multiline tspans -->
    <g transform="translate(25, 185)">
      <!-- Item 1 -->
      <circle cx="10" cy="12" r="6" fill="#f87171" />
      <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">严苛的环境指纹审查</text>
      <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
        <tspan x="26">WebRTC 泄露、Canvas 指纹异常、时区与 GeoIP 不一致</tspan>
        <tspan x="26" dy="18">即被风控雷达毫秒级判定为黑产自动化发号脚本。</tspan>
      </text>

      <!-- Item 2 -->
      <g transform="translate(0, 68)">
        <circle cx="10" cy="12" r="6" fill="#f87171" />
        <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">手机号码归属地拦截陷阱</text>
        <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">国内 +86 号段遭大面积配额限流，接码平台虚拟号直接拒收，</tspan>
          <tspan x="26" dy="18">网页端注册频频撞上“此电话号码无法用于验证”绝壁。</tspan>
        </text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 136)">
        <circle cx="10" cy="12" r="6" fill="#f87171" />
        <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">前 90 天高危敏感观察期</text>
        <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">初始账号权重极其脆弱，频繁更换节点、调用敏感 API</tspan>
          <tspan x="26" dy="18">或批量发信，极易直接触发人工申诉安全锁锁死。</tspan>
        </text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 204)">
        <circle cx="10" cy="12" r="6" fill="#22c55e" />
        <text x="26" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#86efac">破局捷径：移动端生态通道</text>
        <text x="26" y="38" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="26">利用 iOS / Android 原生 Gmail App 走系统硬件凭证通道，</tspan>
          <tspan x="26" dy="18">可直接跳过手机号绑定完成注册并安全激活！</tspan>
        </text>
      </g>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="25" y="505" width="460" height="38" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="255" y="529" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#7dd3fc" font-weight="700" text-anchor="middle">
      🚀 核心破局法：原生手机客户端 + 家宽纯净 IP + 自然交互养号
    </text>
  </g>
</svg>