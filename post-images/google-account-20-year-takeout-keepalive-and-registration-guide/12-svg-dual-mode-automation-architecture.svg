<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="740" fill="url(#bgGrad5)" />

  <text x="600" y="52" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">
    三大操作系统零依赖自动化套件运行架构 (双模驱动)
  </text>
  <text x="600" y="84" font-family="'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    适配 Windows 11 / Ubuntu 26.04 / macOS 27 · 人工交互排查与 AI Agent 静默自动化兼备
  </text>

  <!-- Left: Human Interactive Mode -->
  <g transform="translate(60, 120)" filter="url(#shadow5)">
    <rect width="510" height="400" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="510" height="52" rx="16" fill="#0284c7" fill-opacity="0.2" />
    <circle cx="34" cy="26" r="13" fill="#0284c7" />
    <text x="34" y="31" font-size="15" fill="#fff" text-anchor="middle">👤</text>
    <text x="60" y="32" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#bae6fd">
      模式一：人工交互排查模式 (Interactive CLI)
    </text>

    <g transform="translate(25, 75)">
      <rect width="460" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">命令行启动：</text>
      <text x="16" y="40" font-family="monospace" font-size="11" fill="#cbd5e1">./google_account_toolkit_macos27.zsh</text>

      <g transform="translate(6, 75)">
        <text x="0" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#38bdf8" font-weight="700">✓ 智能取证解析：</tspan>
          <tspan>拖入 Takeout .zip 或解压目录一键核算创号时间戳</tspan>
        </text>
        <text x="0" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#38bdf8" font-weight="700">✓ 直观终端表格：</tspan>
          <tspan>输出账号年龄、闲置天数与三级健康预警状态</tspan>
        </text>
        <text x="0" y="88" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#38bdf8" font-weight="700">✓ 一键唤起保活：</tspan>
          <tspan>针对濒危账号，一键唤起系统默认浏览器登录续命</tspan>
        </text>
        <text x="0" y="124" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#38bdf8" font-weight="700">✓ 本地脱敏归档：</tspan>
          <tspan>自动同步本地资产账本，绝不上传私有数据</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Right: Agent Autonomous Mode -->
  <g transform="translate(630, 120)" filter="url(#shadow5)">
    <rect width="510" height="400" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <rect width="510" height="52" rx="16" fill="#7e22ce" fill-opacity="0.2" />
    <circle cx="34" cy="26" r="13" fill="#7e22ce" />
    <text x="34" y="31" font-size="15" fill="#fff" text-anchor="middle">🤖</text>
    <text x="60" y="32" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#e9d5ff">
      模式二：AI Agent / CI 静默自动化 (Headless Auto)
    </text>

    <g transform="translate(25, 75)">
      <rect width="460" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700" fill="#c084fc">静默执行调用：</text>
      <text x="16" y="40" font-family="monospace" font-size="11" fill="#cbd5e1">./google_account_toolkit_macos27.zsh --auto --audit --json</text>

      <g transform="translate(6, 75)">
        <text x="0" y="16" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#c084fc" font-weight="700">✓ 零人工干预：</tspan>
          <tspan>自动化读取 accounts.json 声明式资产配置账本</tspan>
        </text>
        <text x="0" y="52" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#c084fc" font-weight="700">✓ 结构化数据：</tspan>
          <tspan>纯净标准 JSON 报告输出，支持钉钉/飞书告警接入</tspan>
        </text>
        <text x="0" y="88" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#c084fc" font-weight="700">✓ 严谨状态码：</tspan>
          <tspan>0 (健康) / 1 (需保活) / 2 (错误)，无缝适配 CI 监控</tspan>
        </text>
        <text x="0" y="124" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#cbd5e1">
          <tspan x="0" fill="#c084fc" font-weight="700">✓ 原生定时守护：</tspan>
          <tspan>开箱即用支持 cron、launchd 与任务计划程序</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Platform Cards -->
  <g transform="translate(60, 545)">
    <rect width="1080" height="145" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Platform 1: Windows 11 -->
    <g transform="translate(25, 20)">
      <rect width="330" height="105" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">🪟 Windows 11 原生套件</text>
      <text x="16" y="52" font-family="monospace" font-size="11" fill="#cbd5e1">google_account_toolkit_windows11.ps1</text>
      <text x="16" y="74" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94a3b8">PowerShell 7.4+ 原生脚本</text>
      <text x="16" y="92" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">零第三方模块 · 开箱即用</text>
    </g>

    <!-- Platform 2: Ubuntu 26.04 -->
    <g transform="translate(375, 20)">
      <rect width="330" height="105" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#f97316">🐧 Ubuntu 26.04 LTS 原生套件</text>
      <text x="16" y="52" font-family="monospace" font-size="11" fill="#cbd5e1">google_account_toolkit_ubuntu2604.sh</text>
      <text x="16" y="74" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94a3b8">Bash 5.2+ 标准脚本</text>
      <text x="16" y="92" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">标准 Python 3 内置库支撑</text>
    </g>

    <!-- Platform 3: macOS 27 -->
    <g transform="translate(725, 20)">
      <rect width="330" height="105" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="16" y="28" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#a855f7">🍎 macOS 27 原生套件</text>
      <text x="16" y="52" font-family="monospace" font-size="11" fill="#cbd5e1">google_account_toolkit_macos27.zsh</text>
      <text x="16" y="74" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#94a3b8">Zsh 5.9+ 标准脚本</text>
      <text x="16" y="92" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#64748b">open 命令无缝唤起默认浏览器</text>
    </g>
  </g>
</svg>