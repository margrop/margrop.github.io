<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad5)" />

  <text x="600" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">
    三大操作系统零依赖自动化套件运行架构 (双模驱动)
  </text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    适配 Windows 11 / Ubuntu 26.04 / macOS 27 · 人工交互排查与 AI Agent 静默自动化兼备
  </text>

  <!-- Left: Human Interactive Mode -->
  <g transform="translate(60, 130)" filter="url(#shadow5)">
    <rect width="510" height="360" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="510" height="54" rx="16" fill="#0284c7" fill-opacity="0.2" />
    <circle cx="36" cy="27" r="14" fill="#0284c7" />
    <text x="36" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff" text-anchor="middle">👤</text>
    <text x="62" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#bae6fd">
      模式一：人工交互排查模式 (Interactive CLI)
    </text>

    <g transform="translate(30, 80)">
      <rect width="450" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">命令行启动：</text>
      <text x="20" y="46" font-family="monospace" font-size="12" fill="#cbd5e1">./google_account_toolkit_macos27.zsh --interactive</text>

      <g transform="translate(10, 85)">
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 交互式引导：拖入 Takeout .zip 压缩包或解压目录一键解析</text>
        <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 彩色终端表格直观展示：账号年龄、闲置天数、健康等级</text>
        <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 智能跳转：针对黄色与红色濒危账号，一键唤起系统默认浏览器登录</text>
        <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 自动更新本地资产账本并留存归档日志</text>
      </g>
    </g>
  </g>

  <!-- Right: Agent Autonomous Mode -->
  <g transform="translate(630, 130)" filter="url(#shadow5)">
    <rect width="510" height="360" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <rect width="510" height="54" rx="16" fill="#7e22ce" fill-opacity="0.2" />
    <circle cx="36" cy="27" r="14" fill="#7e22ce" />
    <text x="36" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff" text-anchor="middle">🤖</text>
    <text x="62" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e9d5ff">
      模式二：AI Agent / CI 静默自动化 (Headless Auto)
    </text>

    <g transform="translate(30, 80)">
      <rect width="450" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#c084fc">静默执行调用：</text>
      <text x="20" y="46" font-family="monospace" font-size="12" fill="#cbd5e1">./google_account_toolkit_macos27.zsh --auto --json</text>

      <g transform="translate(10, 85)">
        <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 零人工干预：直接读取 accounts.json 声明式清单</text>
        <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 纯净结构化输出：标准 JSON 报告便于接入监控报警 (DingTalk/Slack)</text>
        <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 严格退出状态码：0 (全部健康) / 1 (有待保活账号) / 2 (执行异常)</text>
        <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">✓ 原生支持 Linux cron、macOS launchd 与 Windows 任务计划程序</text>
      </g>
    </g>
  </g>

  <!-- Bottom Platform Cards: Windows 11 / Ubuntu 26.04 / macOS 27 -->
  <g transform="translate(60, 520)">
    <rect width="1080" height="120" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Platform 1: Windows 11 -->
    <g transform="translate(30, 20)">
      <rect width="320" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🪟 Windows 11 原生套件</text>
      <text x="15" y="50" font-family="monospace" font-size="11" fill="#cbd5e1">google_account_toolkit_windows11.ps1</text>
      <text x="15" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">PowerShell 7.4+ · 零第三方模块依赖</text>
    </g>

    <!-- Platform 2: Ubuntu 26.04 -->
    <g transform="translate(380, 20)">
      <rect width="320" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f97316">🐧 Ubuntu 26.04 LTS 原生套件</text>
      <text x="15" y="50" font-family="monospace" font-size="11" fill="#cbd5e1">google_account_toolkit_ubuntu2604.sh</text>
      <text x="15" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Bash 5.2+ · 标准 Python 3 内置库支撑</text>
    </g>

    <!-- Platform 3: macOS 27 -->
    <g transform="translate(730, 20)">
      <rect width="320" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="15" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a855f7">🍎 macOS 27 (Apple Silicon) 原生套件</text>
      <text x="15" y="50" font-family="monospace" font-size="11" fill="#cbd5e1">google_account_toolkit_macos27.zsh</text>
      <text x="15" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Zsh 5.9+ · open 命令无缝唤起系统浏览器</text>
    </g>
  </g>
</svg>