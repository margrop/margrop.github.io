<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="72" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">全链路技术架构 · 算法与参数蒸馏工程全景</text>
  <text x="64" y="130" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">DeepSeek-V4-Pro 到 Qwen3.5 9B 的四阶进化管线</text>

  <!-- 4 Pipeline Stages Horizontal -->
  <!-- Stage 1 -->
  <g transform="translate(64, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="30" y="38" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">PHASE 1</text>
    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">教师模型生成</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">DeepSeek-V4-Pro</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">核心技术要点：</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• Max Effect 超长思维模式</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 671B MoE 知识激活与抽取</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 结构化自反思多步推演</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• &lt;think&gt; 显式思维标签包裹</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">产出语料：</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">250,000 条高质量</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">STEM / 数学竞赛 / 代码语料</text>
  </g>

