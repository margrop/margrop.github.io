    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">监督微调 SFT</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">Qwen3.5-9B Dense</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">核心技术要点：</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 保持 GQA 8 头注意力结构</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 思考与回答 Token 损失加权</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 跨语言双语知识对齐注入</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 梯度累积 Batch = 512</text>
    
