  <g transform="translate(400, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(192, 132, 252, 0.2)"/>
