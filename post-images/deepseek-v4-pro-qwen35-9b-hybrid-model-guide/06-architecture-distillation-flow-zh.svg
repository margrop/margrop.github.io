    <text x="32" y="470" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">训练目标：</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">让 9B 学习大模型解题脉络</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">学会自主使用 &lt;think&gt; 纠错</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(736, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(52, 211, 153, 0.2)"/>
    <text x="30" y="38" fill="#34d399" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">PHASE 3</text>
    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">强化学习 GSPO</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">Policy Optimization</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">核心技术要点：</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 广义序列策略优化算法</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 思维链长度动态惩罚系数</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 数学结果真值严格奖励机制</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 抑制无意义自言自语死循环</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">优化效果：</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">遏制冗余死循环</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">提升有效解答命中率与紧凑度</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(1072, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#facc15" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(250, 204, 21, 0.2)"/>
    <text x="30" y="38" fill="#facc15" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">PHASE 4</text>
    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">端侧量化与对齐</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">GGUF / imatrix / Modelfile</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">核心技术要点：</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 重要性矩阵 imatrix 保护关键权重</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• Q4_K_M 压缩至 5.8 GB 显存</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 扩容 num_ctx 至 16k/32k</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">• 注入 ChatML 3重终止标符</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#facc15" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">最终形态：</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">消费级单机秒开</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="Noto Sans CJK SC, sans-serif">48 t/s 满血稳定输出</text>
  </g>

  <!-- Connectors -->
