<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  
  <!-- Header -->
  <rect x="64" y="48" width="340" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="72" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono">EVERYDAY ANALOGIES · INTUITIVE BREAKDOWN</text>
  <text x="64" y="130" fill="#f8fafc" font-size="34" font-weight="900" font-family="DejaVu Sans, sans-serif">Why Hybrid Reasoning Models Infinite-Loop: Two Core Bottlenecks</text>

  <!-- Analogy 1: Draft Paper -->
  <g transform="translate(64, 170)">
    <rect width="630" height="630" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="24" y="24" width="220" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="36" y="46" fill="#38bdf8" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">Analogy 1: Einstein's Drafts</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans, sans-serif">Infinite CoT Reasoning vs Tiny Sticky Notes</text>

    <!-- Visual 1: Einstein -->
    <g transform="translate(24, 120)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="35" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">DeepSeek-V4-Pro Teacher</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">Infinite roll of scratchpad (128k)</text>
      <rect x="20" y="85" width="230" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#7ee787" font-size="12" font-family="DejaVu Sans Mono">&lt;think&gt;</text>
      <text x="30" y="135" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Let's re-verify step 1...</text>
      <text x="30" y="155" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Wait, could delta &lt; 0?</text>
      <text x="30" y="175" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Recalculating derivative...</text>
      <text x="30" y="195" fill="#7ee787" font-size="12" font-family="DejaVu Sans Mono">&lt;/think&gt; (3000+ tokens)</text>
    </g>

    <!-- Visual 2: Student default -->
    <g transform="translate(320, 120)">
      <rect width="280" height="230" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
      <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Default Ollama (Unconfigured)</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">Tiny palm-sized note (2048)</text>
      <rect x="20" y="85" width="240" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#7ee787" font-size="12" font-family="DejaVu Sans Mono">&lt;think&gt;</text>
      <text x="30" y="135" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Let's re-verify step 1...</text>
      <text x="30" y="155" fill="#f87171" font-size="12" font-weight="bold" font-family="DejaVu Sans Mono">[OVERFLOW: 2048 LIMIT]</text>
      <text x="30" y="175" fill="#ef4444" font-size="12" font-family="DejaVu Sans Mono">💥 Context lost! Enters loop...</text>
      <text x="30" y="195" fill="#64748b" font-size="12" font-family="DejaVu Sans Mono">Never delivers final answer...</text>
    </g>

    <text x="24" y="390" fill="#f8fafc" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Real-world Dynamics:</text>
    <text x="24" y="425" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">The student inherited the professor's habit of vigorous self-correction.</text>
    <text x="24" y="455" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">However, default runtimes allocate only 2048 tokens of context.</text>
    <text x="24" y="485" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Draft paper runs out mid-step, wiping memory and triggering hallucination.</text>

    <rect x="24" y="525" width="580" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="555" fill="#38bdf8" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">🛠️ The Fix:</text>
    <text x="40" y="582" fill="#e2e8f0" font-size="14" font-family="DejaVu Sans Mono">Explicitly set PARAMETER num_ctx 16384 (8x context scratchpad)</text>
  </g>

  <!-- Analogy 2: Traffic Lights -->
  <g transform="translate(740, 170)">
    <rect width="630" height="630" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="24" y="24" width="220" height="32" rx="6" fill="rgba(192, 132, 252, 0.15)"/>
    <text x="36" y="46" fill="#c084fc" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">Analogy 2: Traffic Light Clashes</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans, sans-serif">Qwen Signal Lights vs DeepSeek Stop Gestures</text>

    <!-- Visual 1: Qwen Protocol -->
    <g transform="translate(24, 120)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="20" y="35" fill="#c084fc" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Qwen Native Signals</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">Standard ChatML Syntax</text>
      <rect x="20" y="85" width="230" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono">&lt;|im_start|&gt;user (Green light)</text>
      <text x="30" y="145" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono">&lt;|im_start|&gt;assistant (Driving)</text>
      <text x="30" y="175" fill="#f87171" font-size="12" font-family="DejaVu Sans Mono">&lt;|im_end|&gt; (Red light! Stop now)</text>
    </g>

    <!-- Visual 2: DeepSeek Tokens -->
    <g transform="translate(320, 120)">
      <rect width="280" height="230" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="20" y="35" fill="#facc15" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">DeepSeek Distilled Tokens</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">Special CoT Symbols</text>
      <rect x="20" y="85" width="240" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono">&lt;think&gt; (Start scratchpad)</text>
      <text x="30" y="145" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono">&lt;/think&gt; (End reasoning)</text>
      <text x="30" y="175" fill="#f87171" font-size="12" font-family="DejaVu Sans Mono">&lt;｜end of sentence｜&gt;</text>
    </g>

    <text x="24" y="390" fill="#f8fafc" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">The Intersection Crash:</text>
    <text x="24" y="425" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">If the engine only monitors &lt;|im_end|&gt; but ignores &lt;/think&gt; or EOS,</text>
    <text x="24" y="455" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">the vehicle barrels right through red lights without braking.</text>
    <text x="24" y="485" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">It starts answering itself in infinite loops until crash.</text>

    <rect x="24" y="525" width="580" height="75" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="40" y="555" fill="#c084fc" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">🛠️ The Fix:</text>
    <text x="40" y="582" fill="#e2e8f0" font-size="14" font-family="DejaVu Sans Mono">Register ChatML Template + multi-token Stop parameters in Modelfile</text>
  </g>
</svg>