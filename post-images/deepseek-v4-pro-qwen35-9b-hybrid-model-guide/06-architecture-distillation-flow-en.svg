<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="72" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono">FULL-STACK PIPELINE · DISTILLATION ARCHITECTURE</text>
  <text x="64" y="130" fill="#f8fafc" font-size="34" font-weight="900" font-family="DejaVu Sans, sans-serif">DeepSeek-V4-Pro to Qwen3.5 9B: The 4-Stage Evolution</text>

  <!-- Stage 1 -->
  <g transform="translate(64, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="30" y="38" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">PHASE 1</text>
    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Teacher Generation</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">DeepSeek-V4-Pro</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Core Pillars:</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Max Effect Mode reasoning</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• 671B MoE knowledge extraction</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Multi-step backtracking proofs</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Explicit &lt;think&gt; token boundaries</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Output Corpus:</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">250,000 Verified High-Quality</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">STEM, Math, and Code Traces</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(400, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(192, 132, 252, 0.2)"/>
