    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Supervised Fine-Tune</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">Qwen3.5-9B Dense</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Core Pillars:</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Retain native GQA 8-head layout</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Thinking vs Answer loss weighting</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Cross-lingual grounding</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Global batch size = 512</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#c084fc" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Training Objective:</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">Equip 9B base with giant model</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">internal self-correction mechanics</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(736, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(52, 211, 153, 0.2)"/>
    <text x="30" y="38" fill="#34d399" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">PHASE 3</text>
    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">RL with GSPO</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">Policy Optimization</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Core Pillars:</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Generalized Sequence Policy Opt</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Dynamic CoT length penalty</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Verifiable reward signal for math</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Eliminate meaningless loop chattering</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#34d399" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Refinement Gain:</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">Curbs infinite chatter loops</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">Produces concise, verified answers</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(1072, 170)">
    <rect width="295" height="580" rx="14" fill="#111827" stroke="#facc15" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="26" rx="6" fill="rgba(250, 204, 21, 0.2)"/>
    <text x="30" y="38" fill="#facc15" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">PHASE 4</text>
    <text x="20" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Edge Quant &amp; Alignment</text>
    <text x="20" y="105" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">GGUF / imatrix / Modelfile</text>
    <line x1="20" y1="125" x2="275" y2="125" stroke="#1f2937" stroke-width="1"/>
    
    <text x="20" y="155" fill="#e2e8f0" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Core Pillars:</text>
    <text x="20" y="185" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Imatrix protects critical attention weights</text>
    <text x="20" y="215" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Q4_K_M packs into 5.8 GB VRAM</text>
    <text x="20" y="245" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Expand num_ctx to 16k/32k</text>
    <text x="20" y="275" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">• Inject ChatML triple stop delimiters</text>
    
    <rect x="20" y="440" width="255" height="110" rx="8" fill="#1e293b"/>
    <text x="32" y="470" fill="#facc15" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Final Artifact:</text>
    <text x="32" y="495" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">Instant edge deployment</text>
    <text x="32" y="520" fill="#e2e8f0" font-size="13" font-family="DejaVu Sans, sans-serif">Stable 48 t/s reasoning throughput</text>
