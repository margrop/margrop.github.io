<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="410" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="72" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">全自动跨平台脚本架构 · 零第三方依赖落地</text>
  <text x="64" y="130" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">三大操作系统一键部署与双模（人工 / Agent）调度流</text>

  <!-- 3 OS Cards -->
  <!-- Card 1: Windows 11 -->
  <g transform="translate(64, 170)">
    <rect width="400" height="420" rx="16" fill="#111827" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <rect x="24" y="24" width="140" height="30" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="36" y="45" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono">WINDOWS 11</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">PowerShell 7+ 原生驱动</text>
    <text x="24" y="118" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">deploy_hybrid_win11.ps1</text>
    <line x1="24" y1="138" x2="376" y2="138" stroke="#1f2937" stroke-width="1"/>
    
    <text x="24" y="172" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 自动探测 WinGet / NVIDIA CUDA 驱动</text>
    <text x="24" y="206" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 静默安装与托管 Ollama Windows 服务</text>
    <text x="24" y="240" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 流式下载 Q4_K_M GGUF 官方权重</text>
    <text x="24" y="274" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 自动编译 16k 上下文与 Stop 规则</text>
    <rect x="24" y="320" width="352" height="70" rx="8" fill="#1e293b"/>
    <text x="38" y="348" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">powershell -ExecutionPolicy Bypass</text>
    <text x="38" y="372" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">.\deploy_hybrid_win11.ps1 [-AgentMode]</text>
  </g>

  <!-- Card 2: Ubuntu 26.04 -->
  <g transform="translate(520, 170)">
    <rect width="400" height="420" rx="16" fill="#111827" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
    <rect x="24" y="24" width="140" height="30" rx="6" fill="rgba(192, 132, 252, 0.15)"/>
    <text x="36" y="45" fill="#c084fc" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono">UBUNTU 26.04</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Bash + Systemd 守护</text>
    <text x="24" y="118" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">deploy_hybrid_ubuntu26.sh</text>
    <line x1="24" y1="138" x2="376" y2="138" stroke="#1f2937" stroke-width="1"/>
    
    <text x="24" y="172" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 校验 Linux 内存与 GPU 硬件拓扑</text>
    <text x="24" y="206" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 一键配置 systemd 专用守护进程单元</text>
    <text x="24" y="240" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 支持 cURL 断点续传与 SHA256 校验</text>
    <text x="24" y="274" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 自动注入 ChatML 模型注册并起服务</text>
    <rect x="24" y="320" width="352" height="70" rx="8" fill="#1e293b"/>
    <text x="38" y="348" fill="#c084fc" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">bash deploy_hybrid_ubuntu26.sh</text>
    <text x="38" y="372" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">--agent-json | --interactive</text>
  </g>

  <!-- Card 3: macOS 27 -->
  <g transform="translate(976, 170)">
    <rect width="400" height="420" rx="16" fill="#111827" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5"/>
    <rect x="24" y="24" width="140" height="30" rx="6" fill="rgba(52, 211, 153, 0.15)"/>
    <text x="36" y="45" fill="#34d399" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono">MACOS 27 (DARWIN)</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Zsh + Apple Metal 加速</text>
    <text x="24" y="118" fill="#64748b" font-size="14" font-family="DejaVu Sans Mono">deploy_hybrid_macos27.sh</text>
    <line x1="24" y1="138" x2="376" y2="138" stroke="#1f2937" stroke-width="1"/>
    
    <text x="24" y="172" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 识别 Apple Silicon 统一内存架构</text>
    <text x="24" y="206" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 自动调谐 sysctl iogpu.wired_mem 限制</text>
    <text x="24" y="240" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 原生集成 launchd 后台开机自启机制</text>
    <text x="24" y="274" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">• 支持 Ollama 与 Apple MLX 双引擎切换</text>
    <rect x="24" y="320" width="352" height="70" rx="8" fill="#1e293b"/>
    <text x="38" y="348" fill="#34d399" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono">zsh deploy_hybrid_macos27.sh</text>
    <text x="38" y="372" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">--metal-opt --auto-start</text>
  </g>

  <!-- Dual Mode Box -->
  <g transform="translate(64, 620)">
    <rect width="1312" height="190" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="40" y="45" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">两种执行方式深度兼顾：</text>
    
    <g transform="translate(40, 70)">
      <rect width="590" height="95" rx="8" fill="#1e293b"/>
      <text x="24" y="32" fill="#38bdf8" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">模式 A：工程师交互式自动执行 (Human-in-the-Loop)</text>
      <text x="24" y="60" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">彩色进度条展示、硬件显存智能提示、一键冒烟测试（9.11 vs 9.9 自动验证）。</text>
    </g>

    <g transform="translate(680, 70)">
      <rect width="590" height="95" rx="8" fill="#1e293b"/>
      <text x="24" y="32" fill="#7ee787" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">模式 B：AI Agent / 无头自动化 (Headless JSON RPC)</text>
      <text x="24" y="60" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">传入 --agent-mode 参数输出标准 JSON 状态契约，支持 OpenClaw / Claude / Codex 自动编排。</text>
    </g>
  </g>
</svg>