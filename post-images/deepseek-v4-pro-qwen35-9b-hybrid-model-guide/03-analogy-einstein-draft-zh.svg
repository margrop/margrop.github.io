<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  
  <!-- Header -->
  <rect x="64" y="48" width="340" height="36" rx="18" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="72" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">生活化大比方 · 小学生也能秒懂 70%</text>
  <text x="64" y="130" fill="#f8fafc" font-size="36" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">为什么混血模型会「无限死循环」？拆解两大核心痛点</text>

  <!-- Analogy 1: Draft Paper -->
  <g transform="translate(64, 170)">
    <rect width="630" height="630" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="24" y="24" width="220" height="32" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="36" y="46" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">比方一：爱因斯坦的草稿纸</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">超长思维链 vs 小学生的迷你便签条</text>

    <!-- Visual 1: Einstein -->
    <g transform="translate(24, 120)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="35" fill="#38bdf8" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">DeepSeek-V4-Pro 导师</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">拥有无限连卷草稿纸 (128k)</text>
      <rect x="20" y="85" width="230" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#7ee787" font-size="12" font-family="DejaVu Sans Mono">&lt;think&gt;</text>
      <text x="30" y="135" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Let's re-verify step 1...</text>
      <text x="30" y="155" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Wait, could delta &lt; 0?</text>
      <text x="30" y="175" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Recalculating derivative...</text>
      <text x="30" y="195" fill="#7ee787" font-size="12" font-family="DejaVu Sans Mono">&lt;/think&gt; (3000+ tokens)</text>
    </g>

    <!-- Visual 2: Student default -->
    <g transform="translate(320, 120)">
      <rect width="280" height="230" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
      <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">默认 Ollama (未配参数)</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">只发了一张巴掌大便签 (2048)</text>
      <rect x="20" y="85" width="240" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#7ee787" font-size="12" font-family="DejaVu Sans Mono">&lt;think&gt;</text>
      <text x="30" y="135" fill="#8b949e" font-size="12" font-family="DejaVu Sans Mono">Let's re-verify step 1...</text>
      <text x="30" y="155" fill="#f87171" font-size="12" font-weight="bold" font-family="DejaVu Sans Mono">[OVERFLOW: 2048 LIMIT]</text>
      <text x="30" y="175" fill="#ef4444" font-size="12" font-family="DejaVu Sans Mono">💥 遗忘题目，陷入死循环！</text>
      <text x="30" y="195" fill="#64748b" font-size="12" font-family="DejaVu Sans Mono">从未输出最终答案...</text>
    </g>

    <text x="24" y="390" fill="#f8fafc" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">生活常理剖析：</text>
    <text x="24" y="425" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">蒸馏模型继承了顶尖教授「反复怀疑、草稿推导」的深思习惯。</text>
    <text x="24" y="455" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">但若运行容器默认只分配 2048 Token 上下文窗口，草稿纸在思索</text>
    <text x="24" y="485" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">到一半就被强行撕断！模型丢失记忆，产生胡言乱语。</text>

    <rect x="24" y="525" width="580" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="555" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">🛠️ 根治药方：</text>
    <text x="40" y="582" fill="#e2e8f0" font-size="14" font-family="DejaVu Sans Mono">Modelfile 显式声明 PARAMETER num_ctx 16384 (扩容8倍草稿纸)</text>
  </g>

  <!-- Analogy 2: Traffic Lights -->
  <g transform="translate(740, 170)">
    <rect width="630" height="630" rx="16" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="24" y="24" width="220" height="32" rx="6" fill="rgba(192, 132, 252, 0.15)"/>
    <text x="36" y="46" fill="#c084fc" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">比方二：交通红绿灯冲突</text>
    <text x="24" y="90" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Qwen 信号灯 vs DeepSeek 停步手势</text>

    <!-- Visual 1: Qwen Protocol -->
    <g transform="translate(24, 120)">
      <rect width="270" height="230" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="20" y="35" fill="#c084fc" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Qwen3.5 原生交通信号</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">ChatML 规范语法</text>
      <rect x="20" y="85" width="230" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono">&lt;|im_start|&gt;user (绿灯起步)</text>
      <text x="30" y="145" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono">&lt;|im_start|&gt;assistant (行车)</text>
      <text x="30" y="175" fill="#f87171" font-size="12" font-family="DejaVu Sans Mono">&lt;|im_end|&gt; (红灯！立即刹车)</text>
    </g>

    <!-- Visual 2: DeepSeek Tokens -->
    <g transform="translate(320, 120)">
      <rect width="280" height="230" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="20" y="35" fill="#facc15" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">DeepSeek 蒸馏新暗号</text>
      <text x="20" y="65" fill="#94a3b8" font-size="13" font-family="DejaVu Sans Mono">CoT 特殊符号</text>
      <rect x="20" y="85" width="240" height="120" rx="6" fill="#0d1117"/>
      <text x="30" y="115" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono">&lt;think&gt; (开始草稿构思)</text>
      <text x="30" y="145" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono">&lt;/think&gt; (构思结束输出)</text>
      <text x="30" y="175" fill="#f87171" font-size="12" font-family="DejaVu Sans Mono">&lt;｜end of sentence｜&gt;</text>
    </g>

    <text x="24" y="390" fill="#f8fafc" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">车祸撞击现场：</text>
    <text x="24" y="425" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">如果推理引擎只认标准红绿灯（&lt;|im_end|&gt;），却没把新暗号</text>
    <text x="24" y="455" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">（&lt;/think&gt;、&lt;|endoftext|&gt;）注册进刹车指令，模型吐完答案后</text>
    <text x="24" y="485" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">根本停不下来，一人分饰两角继续自问自答，直至崩盘！</text>

    <rect x="24" y="525" width="580" height="75" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
    <text x="40" y="555" fill="#c084fc" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">🛠️ 根治药方：</text>
    <text x="40" y="582" fill="#e2e8f0" font-size="14" font-family="DejaVu Sans Mono">注入完整 ChatML Template 并注册 3 类专用 Stop Tokens</text>
  </g>
</svg>