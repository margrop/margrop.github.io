<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#d6645a"/></marker>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#0b7a3e"/></marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6f4"/><stop offset="1" stop-color="#f7ebe8"/></linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#bg2)"/>
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#5a231d">B 站改版后的真实流程（BBDown 1.6.3 断在第二步）</text>
  <g font-size="20" fill="#17324d">
    <rect x="50" y="120" width="220" height="110" rx="14" fill="#ffffff" stroke="#5aa7d6" stroke-width="3"/>
    <text x="160" y="165" text-anchor="middle" font-weight="600">手机扫码并确认</text>
    <text x="160" y="197" text-anchor="middle" font-size="15" fill="#5b6b7a">流程的前半段完全一样</text>

    <rect x="350" y="120" width="280" height="110" rx="14" fill="#ffffff" stroke="#d6645a" stroke-width="3"/>
    <text x="490" y="158" text-anchor="middle" font-weight="600">返回 URL 里没有 Cookie</text>
    <text x="490" y="192" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#b0392e">ticket=xxxx;gourl=...;</text>
    <text x="490" y="216" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#b0392e">first_domain=.bilibili.com</text>

    <rect x="710" y="120" width="230" height="110" rx="14" fill="#ffffff" stroke="#d6645a" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="825" y="158" text-anchor="middle" font-weight="600">还需再访问跨域地址</text>
    <text x="825" y="192" text-anchor="middle" font-size="15" fill="#5b6b7a">crossDomain ? ticket=...</text>
    <text x="825" y="216" text-anchor="middle" font-size="15" fill="#5b6b7a">用 Set-Cookie 领取登录态</text>

    <rect x="990" y="120" width="180" height="110" rx="14" fill="#e7f7ee" stroke="#34c37b" stroke-width="3"/>
    <text x="1080" y="165" text-anchor="middle" font-weight="600" fill="#0b7a3e">拿到 SESSDATA</text>
    <text x="1080" y="197" text-anchor="middle" font-size="15" fill="#0b7a3e">登录才算完成 ✓</text>

    <rect x="80" y="380" width="480" height="150" rx="14" fill="#fdecea" stroke="#d6645a" stroke-width="3"/>
    <text x="320" y="425" text-anchor="middle" font-weight="700" font-size="22" fill="#b0392e">BBDown 1.6.3 实际停在这里</text>
    <text x="320" y="462" text-anchor="middle" font-size="18" fill="#5a231d">把 ticket URL 的参数当成 Cookie 原样存档</text>
    <text x="320" y="496" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#b0392e">BBDown.data = ticket=xxxx;gourl=...;first_domain=...</text>

    <rect x="640" y="380" width="500" height="150" rx="14" fill="#fdecea" stroke="#d6645a" stroke-width="3"/>
    <text x="890" y="425" text-anchor="middle" font-weight="700" font-size="22" fill="#b0392e">下载时检查 Cookie：没有 SESSDATA</text>
    <text x="890" y="462" text-anchor="middle" font-size="18" fill="#5a231d">每次都判定「你尚未登录B站账号」</text>
    <text x="890" y="496" text-anchor="middle" font-size="18" fill="#5a231d">扫一百次码结果都一样</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="270" y1="175" x2="342" y2="175" stroke="#5aa7d6" marker-end="url(#ar2)"/>
    <line x1="630" y1="175" x2="702" y2="175" stroke="#5aa7d6" marker-end="url(#ar2)"/>
    <line x1="940" y1="175" x2="982" y2="175" stroke="#0b7a3e" marker-end="url(#ar3)"/>
    <path d="M 490 230 L 490 372" stroke="#d6645a" marker-end="url(#ar2)"/>
  </g>
</svg>
