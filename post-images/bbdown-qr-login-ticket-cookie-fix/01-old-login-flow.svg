<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#5aa7d6"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f9ff"/><stop offset="1" stop-color="#e6f0fa"/></linearGradient>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#17324d">BBDown 1.6.3 期待的扫码登录流程（2024 年及更早）</text>
  <g font-size="20" fill="#17324d">
    <rect x="60" y="130" width="230" height="110" rx="14" fill="#ffffff" stroke="#5aa7d6" stroke-width="3"/>
    <text x="175" y="175" text-anchor="middle" font-weight="600">手机扫码并确认</text>
    <text x="175" y="207" text-anchor="middle" font-size="15" fill="#5b6b7a">qrcode/generate + poll</text>

    <rect x="370" y="130" width="260" height="110" rx="14" fill="#ffffff" stroke="#5aa7d6" stroke-width="3"/>
    <text x="500" y="175" text-anchor="middle" font-weight="600">返回的 URL 里直接带</text>
    <text x="500" y="207" text-anchor="middle" font-family="Consolas,monospace" font-size="17" fill="#0b7a3e">SESSDATA &amp; bili_jct</text>

    <rect x="710" y="130" width="200" height="110" rx="14" fill="#ffffff" stroke="#5aa7d6" stroke-width="3"/>
    <text x="810" y="175" text-anchor="middle" font-weight="600">整串写入</text>
    <text x="810" y="207" text-anchor="middle" font-family="Consolas,monospace" font-size="17">BBDown.data</text>

    <rect x="950" y="130" width="210" height="110" rx="14" fill="#e7f7ee" stroke="#34c37b" stroke-width="3"/>
    <text x="1055" y="175" text-anchor="middle" font-weight="600" fill="#0b7a3e">带着 Cookie 请求</text>
    <text x="1055" y="207" text-anchor="middle" font-size="15" fill="#0b7a3e">B站识别为已登录 ✓</text>
  </g>
  <g stroke="#5aa7d6" stroke-width="3" fill="none" marker-end="url(#ar)">
    <line x1="290" y1="185" x2="362" y2="185"/>
    <line x1="630" y1="185" x2="702" y2="185"/>
    <line x1="910" y1="185" x2="942" y2="185"/>
  </g>
  <rect x="60" y="300" width="1100" height="110" rx="14" fill="#fff8e1" stroke="#e6b93c" stroke-width="2"/>
  <text x="610" y="345" text-anchor="middle" font-size="21" fill="#7a5a00">这个流程的关键假设：扫码成功后，登录态（Cookie）就装在返回 URL 的参数里，一步到位。</text>
  <text x="610" y="382" text-anchor="middle" font-size="21" fill="#7a5a00">BBDown 1.6.3 的代码就是按这个假设写的——拿到 URL 后原样拆成 Cookie 存档。</text>
</svg>
