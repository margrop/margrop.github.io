<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2f7fb8"/></marker>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f8fd"/><stop offset="1" stop-color="#e4eef7"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg4)"/>
  <text x="600" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#173a5a">修复脚本做的事：把「换票」这一步补上，再按老格式回写</text>
  <g font-size="19" fill="#173a5a">
    <rect x="60" y="110" width="240" height="96" rx="14" fill="#ffffff" stroke="#2f7fb8" stroke-width="3"/>
    <text x="180" y="150" text-anchor="middle" font-weight="600">1. 生成登录二维码</text>
    <text x="180" y="182" text-anchor="middle" font-family="Consolas,monospace" font-size="14">qrcode/generate</text>

    <rect x="360" y="110" width="240" height="96" rx="14" fill="#ffffff" stroke="#2f7fb8" stroke-width="3"/>
    <text x="480" y="150" text-anchor="middle" font-weight="600">2. 轮询扫码状态</text>
    <text x="480" y="182" text-anchor="middle" font-family="Consolas,monospace" font-size="14">qrcode/poll (86101/86090/0)</text>

    <rect x="660" y="110" width="250" height="96" rx="14" fill="#fff8e1" stroke="#e6b93c" stroke-width="3"/>
    <text x="785" y="150" text-anchor="middle" font-weight="600" fill="#7a5a00">3. 拿到 ticket URL</text>
    <text x="785" y="182" text-anchor="middle" font-size="15" fill="#7a5a00">旧版 BBDown 的终点，脚本才刚到中场</text>

    <rect x="970" y="110" width="190" height="96" rx="14" fill="#ffffff" stroke="#2f7fb8" stroke-width="3"/>
    <text x="1065" y="150" text-anchor="middle" font-weight="600">4. 访问跨域地址</text>
    <text x="1065" y="182" text-anchor="middle" font-family="Consolas,monospace" font-size="14">crossDomain?ticket=</text>

    <rect x="300" y="330" width="270" height="100" rx="14" fill="#e7f7ee" stroke="#34c37b" stroke-width="3"/>
    <text x="435" y="372" text-anchor="middle" font-weight="600" fill="#0b7a3e">5. 收下 Set-Cookie</text>
    <text x="435" y="406" text-anchor="middle" font-family="Consolas,monospace" font-size="14" fill="#0b5a2a">SESSDATA / bili_jct / DedeUserID</text>

    <rect x="640" y="330" width="250" height="100" rx="14" fill="#e7f7ee" stroke="#34c37b" stroke-width="3"/>
    <text x="765" y="372" text-anchor="middle" font-weight="600" fill="#0b7a3e">6. 回写 BBDown.data</text>
    <text x="765" y="406" text-anchor="middle" font-size="15" fill="#0b5a2a">分号分隔 · 逗号转义 %2C</text>

    <rect x="950" y="330" width="210" height="100" rx="14" fill="#ffffff" stroke="#2f7fb8" stroke-width="3"/>
    <text x="1055" y="372" text-anchor="middle" font-weight="600">7. 自动验收</text>
    <text x="1055" y="406" text-anchor="middle" font-size="15">解析视频确认已登录</text>
  </g>
  <g stroke="#2f7fb8" stroke-width="3" fill="none" marker-end="url(#ar5)">
    <line x1="300" y1="158" x2="352" y2="158"/>
    <line x1="600" y1="158" x2="652" y2="158"/>
    <line x1="910" y1="158" x2="962" y2="158"/>
    <path d="M 1065 206 L 1065 280 L 452 280 L 445 322"/>
    <line x1="570" y1="380" x2="632" y2="380"/>
    <line x1="890" y1="380" x2="942" y2="380"/>
  </g>
  <rect x="60" y="500" width="1100" height="100" rx="14" fill="#ffffff" stroke="#2f7fb8" stroke-width="2"/>
  <text x="610" y="543" text-anchor="middle" font-size="20" fill="#173a5a">对用户来说只剩一个动作：运行脚本，扫一次码，在手机上点确认。其余的换票、存档、验收由脚本完成。</text>
  <text x="610" y="578" text-anchor="middle" font-size="17" fill="#5b7a94">脚本只访问 B 站官方 passport 接口，不经过任何第三方服务器；Cookie 只写进本机 BBDown.data。</text>
</svg>
