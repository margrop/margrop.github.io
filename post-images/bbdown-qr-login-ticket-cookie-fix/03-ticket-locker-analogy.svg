<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7a5ab8"/></marker>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f4fd"/><stop offset="1" stop-color="#ede7f8"/></linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg3)"/>
  <text x="600" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#3d2a63">打个比方：ticket 是「取件短信」，Cookie 才是「快递柜密码」</text>
  <g font-size="19" fill="#3d2a63">
    <!-- 快递柜 -->
    <rect x="80" y="120" width="330" height="330" rx="16" fill="#ffffff" stroke="#7a5ab8" stroke-width="3"/>
    <text x="245" y="165" text-anchor="middle" font-weight="700" font-size="22">小区快递柜</text>
    <g fill="#e3daf3" stroke="#7a5ab8" stroke-width="2">
      <rect x="110" y="190" width="80" height="60" rx="6"/><rect x="210" y="190" width="80" height="60" rx="6"/><rect x="310" y="190" width="70" height="60" rx="6"/>
      <rect x="110" y="270" width="80" height="60" rx="6"/><rect x="210" y="270" width="80" height="60" rx="6"/><rect x="310" y="270" width="70" height="60" rx="6"/>
      <rect x="110" y="350" width="80" height="60" rx="6"/><rect x="210" y="350" width="80" height="60" rx="6"/><rect x="310" y="350" width="70" height="60" rx="6"/>
    </g>
    <rect x="126" y="286" width="48" height="28" rx="4" fill="#34c37b"/>
    <text x="150" y="306" text-anchor="middle" font-size="13" fill="#fff">已开</text>
    <text x="245" y="440" text-anchor="middle" font-size="16" fill="#6b5a90">柜门 = SESSDATA / bili_jct</text>

    <!-- 短信 -->
    <rect x="470" y="170" width="280" height="140" rx="14" fill="#fff8e1" stroke="#e6b93c" stroke-width="3"/>
    <text x="610" y="215" text-anchor="middle" font-weight="700" fill="#7a5a00">取件短信 ticket</text>
    <text x="610" y="250" text-anchor="middle" font-size="16" fill="#7a5a00">能证明「柜子有你的件」</text>
    <text x="610" y="282" text-anchor="middle" font-size="16" fill="#7a5a00">但它打不开柜门，几分钟就作废</text>

    <!-- 两种行为 -->
    <rect x="820" y="120" width="320" height="150" rx="14" fill="#fdecea" stroke="#d6645a" stroke-width="3"/>
    <text x="980" y="162" text-anchor="middle" font-weight="700" fill="#b0392e">BBDown 1.6.3 的做法</text>
    <text x="980" y="198" text-anchor="middle" font-size="16" fill="#5a231d">把短信纸条塞进柜缝</text>
    <text x="980" y="230" text-anchor="middle" font-size="16" fill="#5a231d">柜门当然纹丝不动</text>

    <rect x="820" y="300" width="320" height="150" rx="14" fill="#e7f7ee" stroke="#34c37b" stroke-width="3"/>
    <text x="980" y="342" text-anchor="middle" font-weight="700" fill="#0b7a3e">修复脚本的做法</text>
    <text x="980" y="378" text-anchor="middle" font-size="16" fill="#0b5a2a">先按短信去驿站柜台换密码</text>
    <text x="980" y="410" text-anchor="middle" font-size="16" fill="#0b5a2a">再用密码开柜门取件 ✓</text>
  </g>
  <g stroke-width="3" fill="none" marker-end="url(#ar4)" stroke="#7a5ab8">
    <line x1="750" y1="240" x2="812" y2="195"/>
    <line x1="750" y1="240" x2="812" y2="375"/>
    <line x1="410" y1="285" x2="462" y2="240"/>
  </g>
  <text x="600" y="530" text-anchor="middle" font-size="18" fill="#6b5a90">修复的关键动作：拿着 ticket 再请求一次跨域确认接口，把响应里的 Set-Cookie 存下来</text>
</svg>
