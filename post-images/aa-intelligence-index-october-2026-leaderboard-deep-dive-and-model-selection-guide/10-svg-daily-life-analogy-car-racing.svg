<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGrad3)"/>
  <rect x="2" y="2" width="1196" height="596" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="19" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">INTUITIVE ANALOGY</text>
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="700">小学生秒懂的生活大比方：交通工具与大模型选型哲学</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">为什么你下楼买包酱油，绝不能叫一辆需要 20 人机组预热的 F1 赛车？</text>
  </g>

  <!-- Card 1: 下楼买酱油 (轻量模型) -->
  <g transform="translate(50, 160)">
    <rect width="340" height="390" rx="14" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="2"/>
    <circle cx="50" cy="50" r="26" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="57" font-size="24" text-anchor="middle">🛴</text>
    <text x="90" y="46" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="700">轻便电单车</text>
    <text x="90" y="68" fill="#94a3b8" font-family="sans-serif" font-size="12">对应：Haiku 5.5 / DeepSeek Flash</text>

    <line x1="20" y1="95" x2="320" y2="95" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(20, 115)">
      <text x="0" y="15" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🚗 生活场景：</text>
      <text x="0" y="38" fill="#cbd5e1" font-family="sans-serif" font-size="12">下楼买瓶酱油、取个快递、到街角吃早点</text>

      <text x="0" y="75" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">⚡ 核心特征：</text>
      <text x="0" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="12">给电就走、零起步时延、不占地、电费几分钱</text>

      <text x="0" y="135" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🤖 对应技术映射：</text>
      <text x="0" y="158" fill="#38bdf8" font-family="sans-serif" font-size="12">• 首字时延 &lt; 50ms，吞吐 380+ tok/s</text>
      <text x="0" y="180" fill="#38bdf8" font-family="sans-serif" font-size="12">• 价格：zsh.1 / 1M Token (极致廉价)</text>
      <text x="0" y="202" fill="#38bdf8" font-family="sans-serif" font-size="12">• 适合意图判定、格式化提取与简短对话</text>

      <rect x="0" y="225" width="300" height="35" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#059669"/>
      <text x="150" y="248" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">评价：80% 业务的降本神兵！</text>
    </g>
  </g>

  <!-- Card 2: 城市自驾通勤 (主力工作马) -->
  <g transform="translate(430, 160)">
    <rect width="340" height="390" rx="14" fill="url(#boxGrad1)" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="50" cy="50" r="26" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="50" y="57" font-size="24" text-anchor="middle">🚙</text>
    <text x="90" y="46" fill="#60a5fa" font-family="sans-serif" font-size="18" font-weight="700">智能纯电 SUV</text>
    <text x="90" y="68" fill="#94a3b8" font-family="sans-serif" font-size="12">对应：Sonnet 5.5 / MiMo / Argon</text>

    <line x1="20" y1="95" x2="320" y2="95" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20, 115)">
      <text x="0" y="15" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🚗 生活场景：</text>
      <text x="0" y="38" fill="#cbd5e1" font-family="sans-serif" font-size="12">全家自驾出游、雨雪天上下班、跨城商务差旅</text>

      <text x="0" y="75" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">⚡ 核心特征：</text>
      <text x="0" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="12">兼顾动力、安全性、智能驾驶与家庭综合成本</text>

      <text x="0" y="135" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🤖 对应技术映射：</text>
      <text x="0" y="158" fill="#93c5fd" font-family="sans-serif" font-size="12">• AA 智能指数 52~56 分 (工业最高阶梯)</text>
      <text x="0" y="180" fill="#93c5fd" font-family="sans-serif" font-size="12">• Terminal 运维与复杂代码达标率 &gt; 60%</text>
      <text x="0" y="202" fill="#93c5fd" font-family="sans-serif" font-size="12">• 价格：zsh.4 ~  / 1M Token (合理可控)</text>

      <rect x="0" y="225" width="300" height="35" rx="6" fill="#1e3a8a" fill-opacity="0.5" stroke="#2563eb"/>
      <text x="150" y="248" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">评价：工程落地的定海神针！</text>
    </g>
  </g>

  <!-- Card 3: 摩纳哥雨战方程式 (终极军师) -->
  <g transform="translate(810, 160)">
    <rect width="340" height="390" rx="14" fill="url(#boxGrad1)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="50" cy="50" r="26" fill="#581c87" stroke="#a855f7" stroke-width="1.5"/>
    <text x="50" y="57" font-size="24" text-anchor="middle">🏎️</text>
    <text x="90" y="46" fill="#c084fc" font-family="sans-serif" font-size="18" font-weight="700">F1 顶级方程式</text>
    <text x="90" y="68" fill="#94a3b8" font-family="sans-serif" font-size="12">对应：Claude Opus 5.5 / GPT-6 Astra</text>

    <line x1="20" y1="95" x2="320" y2="95" stroke="#334155" stroke-width="1"/>

    <g transform="translate(20, 115)">
      <text x="0" y="15" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🚗 生活场景：</text>
      <text x="0" y="38" fill="#cbd5e1" font-family="sans-serif" font-size="12">世界锦标赛雨天决战、突破人类物理极限</text>

      <text x="0" y="75" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">⚡ 核心特征：</text>
      <text x="0" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="12">极速推背感、造价千万、需专业机组、油耗惊人</text>

      <text x="0" y="135" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🤖 对应技术映射：</text>
      <text x="0" y="158" fill="#d8b4fe" font-family="sans-serif" font-size="12">• AA 智能指数 57.6 (全球绝对第一)</text>
      <text x="0" y="180" fill="#d8b4fe" font-family="sans-serif" font-size="12">• HLE 难题答对率与抗幻觉度断层领先</text>
      <text x="0" y="202" fill="#d8b4fe" font-family="sans-serif" font-size="12">• 价格： ~  / 1M (昂贵，需克制用)</text>

      <rect x="0" y="225" width="300" height="35" rx="6" fill="#4a044e" fill-opacity="0.5" stroke="#9333ea"/>
      <text x="150" y="248" fill="#f0abfc" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">评价：不惜代价攻坚的王牌武器！</text>
    </g>
  </g>
</svg>