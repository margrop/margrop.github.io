<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bgGrad4)"/>
  <rect x="2" y="2" width="1196" height="596" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="80" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CROSS-PLATFORM PIPELINE</text>
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="700">三大操作系统原生零依赖：模型评测与分流执行流水线</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">无需 pip、无需 npm、无需外部容器，原生终端 10 秒完成端到端时延基准与分流配置文件生成</text>
  </g>

  <!-- Dual Mode Selection Bar (Top Right) -->
  <g transform="translate(780, 50)">
    <rect width="370" height="65" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">🎯 双模自动化支持：</text>
    <text x="20" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11">1. 人工一键执行（彩显交互、自适应测速）</text>
    <text x="190" y="48" fill="#34d399" font-family="sans-serif" font-size="11">2. Agent 静默配置（--auto --json）</text>
  </g>

  <!-- 4 Horizontal Pipeline Stages -->
  <!-- Stage 1 -->
  <g transform="translate(50, 170)">
    <rect width="250" height="350" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#0369a1"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">1</text>
    <text x="65" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="700">环境就绪探测</text>
    <text x="65" y="48" fill="#38bdf8" font-family="sans-serif" font-size="11">Preflight Checks</text>
    <line x1="15" y1="65" x2="235" y2="65" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15, 85)">
      <text x="0" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">✓ 系统原生解释器锁定</text>
      <text x="15" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">• Windows: PowerShell 7</text>
      <text x="15" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11">• Ubuntu: /bin/bash (26.04)</text>
      <text x="15" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">• macOS: /bin/zsh (26)</text>
      <text x="0" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">✓ API Key 环境变量自检</text>
      <text x="15" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• 优先读取本地 ENV</text>
      <text x="15" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• 交互模式引导安全填入</text>
      <text x="0" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">✓ 零第三方包依赖</text>
      <text x="15" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11">纯原生 curl / 内置 HTTP 客户端</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 305 345 L 345 345" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,3"/>

  <!-- Stage 2 -->
  <g transform="translate(350, 170)">
    <rect width="250" height="350" rx="12" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#047857"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">2</text>
    <text x="65" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="700">性能与时延实测</text>
    <text x="65" y="48" fill="#34d399" font-family="sans-serif" font-size="11">Latency &amp; Speed</text>
    <line x1="15" y1="65" x2="235" y2="65" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15, 85)">
      <text x="0" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">⚡ TTFT 首字时延探针</text>
      <text x="15" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">• 测量首个 Chunk 流式响应</text>
      <text x="15" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11">• 识别跨洋与网关握手开销</text>
      <text x="0" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">📊 输出吞吐速率基准</text>
      <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">• 计算 Tokens / Second</text>
      <text x="15" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• 自动平滑 5 次采样中位数</text>
      <text x="0" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">💰 综合调用单价测算</text>
      <text x="15" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">输入输出 1M Token 真实账单</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 605 345 L 645 345" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3,3"/>

  <!-- Stage 3 -->
  <g transform="translate(650, 170)">
    <rect width="250" height="350" rx="12" fill="url(#stepGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#7e22ce"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">3</text>
    <text x="65" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="700">三层门禁动态仲裁</text>
    <text x="65" y="48" fill="#c084fc" font-family="sans-serif" font-size="11">Tier Policy Gate</text>
    <line x1="15" y1="65" x2="235" y2="65" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15, 85)">
      <text x="0" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🎯 业务规则评分卡</text>
      <text x="15" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">• 长度 &lt; 200字 ➔ Tier 1</text>
      <text x="15" y="55" fill="#94a3b8" font-family="sans-serif" font-size="11">• 复杂代码 / Agent ➔ Tier 2</text>
      <text x="15" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">• 终极难题 / 审查 ➔ Tier 3</text>
      <text x="0" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🛡️ 故障熔断与降级</text>
      <text x="15" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• 超时 3000ms 自动 Fallback</text>
      <text x="15" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• 429 限流梯次排队策略</text>
    </g>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 905 345 L 945 345" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="3,3"/>

  <!-- Stage 4 -->
  <g transform="translate(950, 170)">
    <rect width="200" height="350" rx="12" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#b45309"/>
    <text x="35" y="40" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">4</text>
    <text x="65" y="32" fill="#f1f5f9" font-family="sans-serif" font-size="15" font-weight="700">配置资产导出</text>
    <text x="65" y="48" fill="#fbbf24" font-family="sans-serif" font-size="11">Config Output</text>
    <line x1="15" y1="65" x2="185" y2="65" stroke="#334155" stroke-width="1"/>

    <g transform="translate(15, 85)">
      <text x="0" y="15" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">📁 router-config.json</text>
      <text x="10" y="35" fill="#94a3b8" font-family="sans-serif" font-size="11">分流中枢标准规则集</text>
      <text x="0" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">📊 benchmark.json</text>
      <text x="10" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">完整压测与时延数据</text>
      <text x="0" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🚀 环境变量一键注入</text>
      <text x="10" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11">一键集成 Agent 框架</text>
    </g>
  </g>
</svg>