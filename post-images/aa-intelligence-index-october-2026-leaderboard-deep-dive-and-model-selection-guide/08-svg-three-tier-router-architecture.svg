<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#bgGrad2)"/>
  <rect x="2" y="2" width="1196" height="636" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Section -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ENGINEERING DESIGN</text>
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="700">企业级 AI 降本增效：三层动态模型路由分发架构</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">告别“无论什么事都死磕顶配大模型”的成本黑洞，用智能分流兼顾毫秒时延与极限智能</text>
  </g>

  <!-- Request Source (Left Box) -->
  <g transform="translate(50, 160)">
    <rect width="170" height="430" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="85" y="40" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">输入请求中心</text>
    <line x1="20" y1="55" x2="150" y2="55" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(15, 80)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">用户交互对话</text>
      <text x="70" y="42" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Chatbot / Assistant</text>
    </g>
    <g transform="translate(15, 155)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">多 Agent 协作工作流</text>
      <text x="70" y="42" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Subagents Pipeline</text>
    </g>
    <g transform="translate(15, 230)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">后台批处理任务</text>
      <text x="70" y="42" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Batch Pipelines</text>
    </g>
    <g transform="translate(15, 305)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="70" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">代码审查与终端排障</text>
      <text x="70" y="42" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">CI/CD &amp; DevOps</text>
    </g>
  </g>

  <!-- Router Gate (Middle Box) -->
  <g transform="translate(260, 260)">
    <rect width="160" height="230" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="80" y="32" fill="#a5b4fc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">智能分流中枢</text>
    <text x="80" y="50" fill="#818cf8" font-family="sans-serif" font-size="11" text-anchor="middle">Adaptive Router</text>
    <line x1="16" y1="65" x2="144" y2="65" stroke="#4338ca" stroke-width="1"/>

    <text x="20" y="92" fill="#e0e7ff" font-family="sans-serif" font-size="11">1. 意图与复杂度预检</text>
    <text x="20" y="116" fill="#e0e7ff" font-family="sans-serif" font-size="11">2. 上下文长度自适应</text>
    <text x="20" y="140" fill="#e0e7ff" font-family="sans-serif" font-size="11">3. 动态预算约束控制</text>
    <text x="20" y="164" fill="#e0e7ff" font-family="sans-serif" font-size="11">4. 熔断与降级 Fallback</text>
    <text x="20" y="196" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">路由判定时延 &lt; 5ms</text>
  </g>

  <!-- Arrow from Requests to Router -->
  <path d="M 220 375 L 260 375" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Tier 1 Box (Top Right) -->
  <g transform="translate(460, 160)">
    <rect width="690" height="125" rx="12" fill="url(#tier1Grad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="14" width="65" height="22" rx="11" fill="#10b981" fill-opacity="0.3"/>
    <text x="48" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIER 1</text>
    <text x="90" y="31" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">敏捷高吞吐层 (80% 基础流量)</text>
    <text x="540" y="31" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">输入: zsh.1 ~ zsh.3 / 1M</text>
    
    <text x="16" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="13">主力模型：<strong>Claude Haiku 5.5</strong> (382 tok/s) / <strong>DeepSeek V4.1 Flash</strong> (320 tok/s)</text>
    <text x="16" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">适用场景：意图分流、格式提取、简单客服问答、多轮聊天状态追踪、初级摘要</text>
    <text x="16" y="110" fill="#6ee7b7" font-family="sans-serif" font-size="11">优势指标：超低时延 (&lt;50ms)、极度便宜、单日上亿 Token 无账单压力</text>
  </g>

  <!-- Tier 2 Box (Middle Right) -->
  <g transform="translate(460, 310)">
    <rect width="690" height="135" rx="12" fill="url(#tier2Grad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="16" y="14" width="65" height="22" rx="11" fill="#3b82f6" fill-opacity="0.3"/>
    <text x="48" y="30" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIER 2</text>
    <text x="90" y="31" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">工程主力工作马层 (18% 复杂流量)</text>
    <text x="540" y="31" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="600">输入: zsh.4 ~ .0 / 1M</text>

    <text x="16" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="13">主力模型：<strong>Claude Sonnet 5.5</strong> (Index 56.0) / <strong>Gemini 4 Argon</strong> / <strong>MiMo-V2.6-Pro</strong> (开源王牌)</text>
    <text x="16" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">适用场景：全栈代码生成、Terminal 运维排障、自动化工作流编排、企业级财务分析</text>
    <text x="16" y="112" fill="#93c5fd" font-family="sans-serif" font-size="11">优势指标：AA 指数超 52 分，极高性价比与出色工具调用能力，团队主力核心</text>
  </g>

  <!-- Tier 3 Box (Bottom Right) -->
  <g transform="translate(460, 470)">
    <rect width="690" height="120" rx="12" fill="url(#tier3Grad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="16" y="14" width="65" height="22" rx="11" fill="#a855f7" fill-opacity="0.3"/>
    <text x="48" y="30" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIER 3</text>
    <text x="90" y="31" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">终极深思军师层 (2% 极限疑难流量)</text>
    <text x="540" y="31" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600">输入: .0 ~ .0 / 1M</text>

    <text x="16" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="13">主力模型：<strong>Claude Opus 5.5</strong> (Index 57.6, 登顶榜首) / <strong>GPT-6 Astra</strong></text>
    <text x="16" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">适用场景：前沿科学攻坚、系统高危架构重构审查、法律/合规最终裁决、HLE 级盲题</text>
    <text x="16" y="108" fill="#e9d5ff" font-family="sans-serif" font-size="11">优势指标：抗幻觉综合得分 46.4，极限长链推理能力断层领先，关键决策定海神针</text>
  </g>

  <!-- Connectors from Router to Tiers -->
  <path d="M 420 320 C 440 320, 440 220, 460 220" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 420 375 L 460 375" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 420 430 C 440 430, 440 530, 460 530" fill="none" stroke="#a855f7" stroke-width="2"/>
</svg>