<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="676" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="85" y="19" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BENCHMARK ARCHITECTURE</text>
    <text x="0" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700">AA 智能指数 v4.3.2 十维评测雷达与四大能力象限</text>
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">从单点跑分幻觉走向工业化硬核实战：十项严苛基准全维度解构前沿 AI 智能基座</text>
  </g>

  <!-- Central Hub Circle -->
  <g transform="translate(600, 390)">
    <circle r="88" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <circle r="72" fill="#0f172a" stroke="#4338ca" stroke-width="1"/>
    <text x="0" y="-12" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">COMPOSITE INDEX</text>
    <text x="0" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" text-anchor="middle">AA Index</text>
    <text x="0" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">v4.3.2 综合智能</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 600 302 L 320 220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 600 302 L 880 220" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 600 478 L 320 540" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <path d="M 600 478 L 880 540" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Quadrant 1: 复杂工程与智能体 (Top Left) -->
  <g transform="translate(50, 160)">
    <rect width="460" height="190" rx="12" fill="url(#cardGrad1)" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="16" y="14" width="10" height="10" rx="2" fill="#38bdf8"/>
    <text x="34" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">象限 1：工程执行与长程智能体 (Autonomous Agent)</text>
    <line x1="16" y1="36" x2="444" y2="36" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(16, 52)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Terminal-Bench 4.0</text>
      <text x="160" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">真实 Linux 终端、多步工具调用、DevOps 排障闭环</text>
    </g>
    <g transform="translate(16, 92)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">AutomationBench-AA</text>
      <text x="160" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">跨 SaaS 自动化工作流、API 状态机编排与容错</text>
    </g>
    <g transform="translate(16, 132)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">AA-Briefcase v1.1</text>
      <text x="160" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">企业真实办公室任务竞技场 Elo (多轮协同对弈)</text>
    </g>
  </g>

  <!-- Quadrant 2: 极限科学与硬核推理 (Top Right) -->
  <g transform="translate(690, 160)">
    <rect width="460" height="190" rx="12" fill="url(#cardGrad1)" stroke="#9333ea" stroke-width="1.5"/>
    <rect x="16" y="14" width="10" height="10" rx="2" fill="#c084fc"/>
    <text x="34" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">象限 2：科学前沿与极限推理 (Frontier Reasoning)</text>
    <line x1="16" y1="36" x2="444" y2="36" stroke="#334155" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Humanity&#39;s Last Exam</text>
      <text x="170" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">跨学科专家级盲题、淘汰传统过拟合常识</text>
    </g>
    <g transform="translate(16, 92)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">SciCode</text>
      <text x="170" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">尖端自然科学科研模拟、数值分析与算法推导</text>
    </g>
    <g transform="translate(16, 132)">
      <circle cx="6" cy="6" r="4" fill="#c084fc"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">CritPt</text>
      <text x="170" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">高难度凝聚态物理与非线性工程临界计算推理</text>
    </g>
  </g>

  <!-- Quadrant 3: 经济价值与复杂决策 (Bottom Left) -->
  <g transform="translate(50, 420)">
    <rect width="460" height="190" rx="12" fill="url(#cardGrad1)" stroke="#059669" stroke-width="1.5"/>
    <rect x="16" y="14" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="34" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">象限 3：经济金融与专业研报 (Economic Valuation)</text>
    <line x1="16" y1="36" x2="444" y2="36" stroke="#334155" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="6" cy="6" r="4" fill="#34d399"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">GDPval-AA v2.1</text>
      <text x="150" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">跨行业真实商业估值、财务建模与投研分析力</text>
    </g>
    <g transform="translate(16, 102)">
      <circle cx="6" cy="6" r="4" fill="#34d399"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">GDP.pdf</text>
      <text x="150" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">多页图文财务研报、复杂排版数据穿透解析</text>
    </g>
  </g>

  <!-- Quadrant 4: 事实可信与超长上下文 (Bottom Right) -->
  <g transform="translate(690, 420)">
    <rect width="460" height="190" rx="12" fill="url(#cardGrad1)" stroke="#d97706" stroke-width="1.5"/>
    <rect x="16" y="14" width="10" height="10" rx="2" fill="#fbbf24"/>
    <text x="34" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">象限 4：知识事实与长文抗幻觉 (Factuality &amp; LCR)</text>
    <line x1="16" y1="36" x2="444" y2="36" stroke="#334155" stroke-width="1"/>

    <g transform="translate(16, 52)">
      <circle cx="6" cy="6" r="4" fill="#fbbf24"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">AA-Omniscience</text>
      <text x="160" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">全域事实性真值核验、高压对抗下的抗幻觉惩罚</text>
    </g>
    <g transform="translate(16, 102)">
      <circle cx="6" cy="6" r="4" fill="#fbbf24"/>
      <text x="18" y="10" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">AA-LCR v1.1</text>
      <text x="160" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">超长上下文深层逻辑链穿透（大海捞针+深度溯源）</text>
    </g>
  </g>
</svg>