<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">
    网络寻址核心三要素：日常生活直观比喻
  </text>
  <text x="480" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    MAC 地址、IP 地址与端口号：就像身份证号、收件门牌与房间分机
  </text>

  <!-- Card 1: MAC Address -->
  <g transform="translate(40, 115)">
    <rect width="270" height="360" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="270" height="60" rx="14" fill="url(#cyanGrad)"/>
    <rect x="0" y="45" width="270" height="15" fill="url(#cyanGrad)"/>
    <text x="135" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">
      MAC 地址 (数据链路层)
    </text>
    <text x="135" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#38bdf8">
      【唯一身份证号】
    </text>

    <!-- Details -->
    <text x="24" y="130" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">生活比喻：</text>
    <text x="24" y="152" font-family="sans-serif" font-size="12" fill="#94a3b8">出厂自带，终身不可变</text>
    <text x="24" y="172" font-family="sans-serif" font-size="12" fill="#94a3b8">就像公民身份证号码</text>

    <text x="24" y="210" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">作用范围：</text>
    <text x="24" y="232" font-family="sans-serif" font-size="12" fill="#94a3b8">仅在同一个局域网/小区内有效</text>
    <text x="24" y="252" font-family="sans-serif" font-size="12" fill="#94a3b8">出路由器后会被替换封装</text>

    <text x="24" y="290" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">典型格式 (48-bit)：</text>
    <rect x="20" y="305" width="230" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="135" y="329" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8">52:54:00:xx:xx:xx</text>
  </g>

  <!-- Card 2: IP Address -->
  <g transform="translate(345, 115)">
    <rect width="270" height="360" rx="14" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="270" height="60" rx="14" fill="url(#goldGrad)"/>
    <rect x="0" y="45" width="270" height="15" fill="url(#goldGrad)"/>
    <text x="135" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">
      IP 地址 (网络层)
    </text>
    <text x="135" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#fbbf24">
      【寄件/收件门牌号】
    </text>

    <!-- Details -->
    <text x="24" y="130" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">生活比喻：</text>
    <text x="24" y="152" font-family="sans-serif" font-size="12" fill="#94a3b8">随所在网络动态分配</text>
    <text x="24" y="172" font-family="sans-serif" font-size="12" fill="#94a3b8">搬迁到新小区就会拿到新门牌</text>

    <text x="24" y="210" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">核心使命：</text>
    <text x="24" y="232" font-family="sans-serif" font-size="12" fill="#94a3b8">跨越全球互联网进行路由导流</text>
    <text x="24" y="252" font-family="sans-serif" font-size="12" fill="#94a3b8">指引包裹从源主机送到目标网络</text>

    <text x="24" y="290" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">典型格式 (IPv4 / IPv6)：</text>
    <rect x="20" y="305" width="230" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="135" y="322" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">192.168.xx.xx (32-bit)</text>
    <text x="135" y="337" text-anchor="middle" font-family="monospace" font-size="10" fill="#67e8f9">240e:xxxx:xxxx::1 (128-bit)</text>
  </g>

  <!-- Card 3: Port Number -->
  <g transform="translate(650, 115)">
    <rect width="270" height="360" rx="14" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="270" height="60" rx="14" fill="url(#emeraldGrad)"/>
    <rect x="0" y="45" width="270" height="15" fill="url(#emeraldGrad)"/>
    <text x="135" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">
      端口号 (传输层)
    </text>
    <text x="135" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#34d399">
      【具体房间分机号】
    </text>

    <!-- Details -->
    <text x="24" y="130" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">生活比喻：</text>
    <text x="24" y="152" font-family="sans-serif" font-size="12" fill="#94a3b8">大楼内部的具体部门/房间</text>
    <text x="24" y="172" font-family="sans-serif" font-size="12" fill="#94a3b8">区分主机内哪一个进程在收发</text>

    <text x="24" y="210" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">服务映射：</text>
    <text x="24" y="232" font-family="sans-serif" font-size="12" fill="#94a3b8">80 = 普通网页 (HTTP)</text>
    <text x="24" y="252" font-family="sans-serif" font-size="12" fill="#94a3b8">443 = 安全加密网页 (HTTPS)</text>

    <text x="24" y="290" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-weight="600">范围大小 (16-bit)：</text>
    <rect x="20" y="305" width="230" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="135" y="329" text-anchor="middle" font-family="monospace" font-size="12" fill="#34d399">0 ~ 65535 (共 65,536 个)</text>
  </g>
</svg>
