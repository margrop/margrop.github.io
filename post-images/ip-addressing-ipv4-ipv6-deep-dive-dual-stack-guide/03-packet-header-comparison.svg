<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="headBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="16" fill="url(#headBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    底层协议拆解：IPv4 变长报头 vs IPv6 固定 40 字节极简报头
  </text>
  <text x="480" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    为什么 IPv6 地址长了 4 倍，路由器转发效率反而大幅提升？
  </text>

  <!-- Left: IPv4 Header (Variable 20-60 Bytes) -->
  <g transform="translate(40, 95)">
    <rect width="420" height="430" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="45" rx="12" fill="#f59e0b"/>
    <rect x="0" y="30" width="420" height="15" fill="#f59e0b"/>
    <text x="210" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      IPv4 报头（20 ~ 60 字节，变长设计）
    </text>

    <!-- IPv4 Fields -->
    <!-- Row 1: 0-31 bits -->
    <g transform="translate(20, 60)">
      <rect width="50" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="25" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fde68a">Version (4)</text>

      <rect x="50" width="50" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="75" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fde68a">IHL (4)</text>

      <rect x="100" width="110" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="155" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fde68a">Type of Service (8)</text>

      <rect x="210" width="170" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="295" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fde68a">Total Length (16)</text>
    </g>

    <!-- Row 2: Identification, Flags, Fragment -->
    <g transform="translate(20, 105)">
      <rect width="190" height="40" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="95" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fca5a5">Identification (16)</text>

      <rect x="190" width="60" height="40" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="220" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fca5a5">Flags (3)</text>

      <rect x="250" width="130" height="40" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="315" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#fca5a5">Fragment Offset (13)</text>
    </g>

    <!-- Row 3: TTL, Protocol, Checksum -->
    <g transform="translate(20, 150)">
      <rect width="80" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">TTL (8)</text>

      <rect x="80" width="100" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="130" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">Protocol (8)</text>

      <rect x="180" width="200" height="40" fill="#3b0764" stroke="#d946ef" stroke-width="1.5"/>
      <text x="280" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f5d0fe">Header Checksum (16)</text>
    </g>

    <!-- Row 4: Source IP (32 bits) -->
    <g transform="translate(20, 195)">
      <rect width="380" height="35" fill="#0f172a" stroke="#38bdf8"/>
      <text x="190" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Source IPv4 Address (32-bit)</text>
    </g>

    <!-- Row 5: Destination IP (32 bits) -->
    <g transform="translate(20, 235)">
      <rect width="380" height="35" fill="#0f172a" stroke="#38bdf8"/>
      <text x="190" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Destination IPv4 Address (32-bit)</text>
    </g>

    <!-- Row 6: Options (Variable) -->
    <g transform="translate(20, 275)">
      <rect width="380" height="35" fill="#18181b" stroke="#71717a" stroke-dasharray="4,3"/>
      <text x="190" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a1a1aa">Options &amp; Padding (0 ~ 40 Bytes 变长)</text>
    </g>

    <!-- Analysis notes -->
    <g transform="translate(20, 325)">
      <rect width="380" height="85" rx="6" fill="#0f172a"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" fill="#fca5a5">❌ 痛点 1: 头部变长导致硬件芯片无法直接硬解码</text>
      <text x="15" y="46" font-family="sans-serif" font-size="11" fill="#fca5a5">❌ 痛点 2: 每跳路由器都必须重新计算校验和 (耗CPU)</text>
      <text x="15" y="68" font-family="sans-serif" font-size="11" fill="#fca5a5">❌ 痛点 3: 中间路由器分片机制严重拖垮传输性能</text>
    </g>
  </g>

  <!-- Right: IPv6 Header (Fixed 40 Bytes) -->
  <g transform="translate(500, 95)">
    <rect width="420" height="430" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="45" rx="12" fill="#0284c7"/>
    <rect x="0" y="30" width="420" height="15" fill="#0284c7"/>
    <text x="210" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      IPv6 报头（固定 40 字节，硬件线速直通）
    </text>

    <!-- IPv6 Fields -->
    <!-- Row 1: Version (4), Traffic Class (8), Flow Label (20) -->
    <g transform="translate(20, 60)">
      <rect width="50" height="40" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="25" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7dd3fc">Ver (4)</text>

      <rect x="50" width="100" height="40" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="100" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7dd3fc">Traffic Class (8)</text>

      <rect x="150" width="230" height="40" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="265" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Flow Label 流标签 (20)</text>
    </g>

    <!-- Row 2: Payload Length (16), Next Header (8), Hop Limit (8) -->
    <g transform="translate(20, 105)">
      <rect width="180" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">Payload Length (16)</text>

      <rect x="180" width="110" height="40" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
      <text x="235" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6ee7b7">Next Header (8)</text>

      <rect x="290" width="90" height="40" fill="#0f172a" stroke="#475569"/>
      <text x="335" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cbd5e1">Hop Limit (8)</text>
    </g>

    <!-- Row 3: Source IP (128 bits) -->
    <g transform="translate(20, 150)">
      <rect width="380" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="190" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Source IPv6 Address (128-bit)</text>
      <text x="190" y="46" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">240e:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx</text>
    </g>

    <!-- Row 4: Destination IP (128 bits) -->
    <g transform="translate(20, 220)">
      <rect width="380" height="60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="190" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Destination IPv6 Address (128-bit)</text>
      <text x="190" y="46" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">2001:db8:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx</text>
    </g>

    <!-- Optional Next Headers Chain -->
    <g transform="translate(20, 290)">
      <rect width="380" height="25" rx="4" fill="#064e3b" stroke="#059669"/>
      <text x="190" y="17" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6ee7b7">扩展报头链表 (按需挂载：路由/分片/安全，不拖累基础报头)</text>
    </g>

    <!-- Analysis notes -->
    <g transform="translate(20, 325)">
      <rect width="380" height="85" rx="6" fill="#0f172a"/>
      <text x="15" y="24" font-family="sans-serif" font-size="11" fill="#6ee7b7">✓ 亮点 1: 固定 40 字节，网络 ASIC 交换芯片硬件流水线秒查</text>
      <text x="15" y="46" font-family="sans-serif" font-size="11" fill="#6ee7b7">✓ 亮点 2: 彻底取消报头 Checksum，转发路由器无需每次重算</text>
      <text x="15" y="68" font-family="sans-serif" font-size="11" fill="#6ee7b7">✓ 亮点 3: 20位流标签 (Flow Label) 赋予多媒体业务毫秒级选路</text>
    </g>
  </g>
</svg>
