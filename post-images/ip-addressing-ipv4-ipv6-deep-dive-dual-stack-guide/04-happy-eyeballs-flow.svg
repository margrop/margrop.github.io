<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#flowBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    RFC 8305 Happy Eyeballs v2 双栈竞速算法原理
  </text>
  <text x="480" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    为什么双栈开启后网页完全不会“卡死”？智能竞速引擎如何在 25 毫秒内做出最优选择
  </text>

  <!-- Step 1: DNS Dual Query -->
  <g transform="translate(60, 105)">
    <rect width="220" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">1. 并发 DNS 递归查询</text>
    <text x="20" y="58" font-family="monospace" font-size="11" fill="#cbd5e1">Query A    (IPv4)</text>
    <text x="20" y="78" font-family="monospace" font-size="11" fill="#cbd5e1">Query AAAA (IPv6)</text>
    <text x="20" y="98" font-family="sans-serif" font-size="10" fill="#94a3b8">同时获取 v4 和 v6 地址列表</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 285 160 L 345 160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowHead)"/>

  <!-- Step 2: IPv6 First Preference -->
  <g transform="translate(355, 105)">
    <rect width="250" height="110" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="125" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">2. IPv6 首发与抢跑保护</text>
    <text x="18" y="56" font-family="sans-serif" font-size="11" fill="#cbd5e1">优先向 IPv6 目标发送 TCP SYN</text>
    <rect x="18" y="68" width="214" height="28" rx="4" fill="#0c4a6e"/>
    <text x="125" y="86" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">启动 25ms ~ 50ms 竞速定时器</text>
  </g>

  <!-- Branching Arrows -->
  <path d="M 610 145 L 685 120" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowHead)"/>
  <path d="M 610 175 L 685 200" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)"/>

  <!-- Step 3A: IPv6 Success -->
  <g transform="translate(695, 80)">
    <rect width="215" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="107" y="28" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">场景 A：IPv6 快速响应</text>
    <text x="15" y="52" font-family="sans-serif" font-size="11" fill="#d1fae5">✓ 在 25ms 内收到 SYN-ACK</text>
    <text x="15" y="72" font-family="sans-serif" font-size="11" fill="#34d399">★ 直接全速使用 IPv6 传输！</text>
  </g>

  <!-- Step 3B: IPv4 Fallback Trigger -->
  <g transform="translate(695, 185)">
    <rect width="215" height="95" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="107" y="26" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24">场景 B：IPv6 丢包或超时</text>
    <text x="15" y="48" font-family="sans-serif" font-size="10" fill="#fed7aa">定时器超时 / 收到 ICMP 拒绝</text>
    <text x="15" y="66" font-family="sans-serif" font-size="10" fill="#fbbf24">立即并发启动 IPv4 TCP SYN 握手</text>
    <text x="15" y="84" font-family="sans-serif" font-size="10" fill="#fed7aa">双路并行赛马，胜者赢家通吃</text>
  </g>

  <!-- Bottom Panel: Key Benefits -->
  <g transform="translate(60, 310)">
    <rect width="850" height="175" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
      💡 为什么 Happy Eyeballs 是双栈体验的“定海神针”？
    </text>

    <!-- Point 1 -->
    <g transform="translate(30, 50)">
      <circle cx="8" cy="15" r="4" fill="#38bdf8"/>
      <text x="22" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">彻底杜绝单栈故障导致的“网页白屏”</text>
      <text x="22" y="38" font-family="sans-serif" font-size="11" fill="#94a3b8">过去若 IPv6 路径出现路由黑洞，系统可能等待 20~30 秒 TCP 超时才切换到 IPv4，用户体验极差；现在毫秒级无感降级。</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(30, 110)">
      <circle cx="8" cy="15" r="4" fill="#34d399"/>
      <text x="22" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">兼顾“优先推进 IPv6”与“用户体验零感知”</text>
      <text x="22" y="38" font-family="sans-serif" font-size="11" fill="#94a3b8">给 IPv6 预留 25ms 抢跑优势，既优先拥抱下一代互联网，又绝不牺牲响应速度。</text>
    </g>
  </g>
</svg>
