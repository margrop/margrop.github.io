<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="natBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131d31"/>
    </linearGradient>
    <linearGradient id="lanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="v6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="540" rx="16" fill="url(#natBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    IPv4 NAT（小区传达室） vs IPv6 直通（专属卫星电话）
  </text>
  <text x="480" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    为什么 IPv4 离不开路由器“代签”，而 IPv6 能做到全球点对点畅通无阻？
  </text>

  <!-- TOP SECTION: IPv4 NAT -->
  <g transform="translate(30, 95)">
    <rect width="900" height="195" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="25" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#fbbf24">
      方案 A：IPv4 + NAT 架构（小区传达室大爷模式）
    </text>

    <!-- LAN internal hosts -->
    <g transform="translate(25, 55)">
      <rect width="210" height="115" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="105" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">家庭内网 (私有 IP)</text>
      <text x="15" y="52" font-family="monospace" font-size="11" fill="#94a3b8">电脑 A: 192.168.xx.10:5120</text>
      <text x="15" y="75" font-family="monospace" font-size="11" fill="#94a3b8">手机 B: 192.168.xx.20:8080</text>
      <text x="15" y="98" font-family="monospace" font-size="11" fill="#94a3b8">NAS C : 192.168.xx.30:443</text>
    </g>

    <!-- NAT Router / Receptionist -->
    <g transform="translate(325, 50)">
      <rect width="250" height="125" rx="10" fill="url(#gateGrad)" filter="url(#glow)"/>
      <text x="125" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">NAT 网关 / 传达室大爷</text>
      <rect x="15" y="40" width="220" height="70" rx="6" fill="#0f172a" opacity="0.8"/>
      <text x="25" y="60" font-family="monospace" font-size="10" fill="#fde68a">【动态端口映射表 (NAT Table)】</text>
      <text x="25" y="78" font-family="monospace" font-size="10" fill="#cbd5e1">192.168.xx.10:5120 &lt;=&gt; :40001</text>
      <text x="25" y="95" font-family="monospace" font-size="10" fill="#cbd5e1">192.168.xx.20:8080 &lt;=&gt; :40002</text>
    </g>

    <!-- Arrows -->
    <path d="M 240 112 L 320 112" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M 580 112 L 660 112" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- WAN Internet target -->
    <g transform="translate(665, 55)">
      <rect width="210" height="115" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="105" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">公网服务器 (唯一公网IP)</text>
      <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">外部看到的唯一源 IP：</text>
      <text x="20" y="75" font-family="monospace" font-size="12" fill="#fbbf24">198.51.100.xx:40001</text>
      <text x="20" y="98" font-family="sans-serif" font-size="11" fill="#ef4444">⚠ 痛点：外网无法主动呼叫内网</text>
    </g>
  </g>

  <!-- BOTTOM SECTION: IPv6 End-to-End -->
  <g transform="translate(30, 310)">
    <rect width="900" height="195" rx="12" fill="#111827" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="25" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
      方案 B：IPv6 全局单播架构（端到端专属直通模式）
    </text>

    <!-- LAN internal hosts -->
    <g transform="translate(25, 55)">
      <rect width="240" height="115" rx="8" fill="#1e293b" stroke="#0284c7"/>
      <text x="120" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">每台设备自带独立公网 IPv6</text>
      <text x="12" y="52" font-family="monospace" font-size="10" fill="#38bdf8">PC : 240e:xxxx:xxxx:1::10</text>
      <text x="12" y="75" font-family="monospace" font-size="10" fill="#38bdf8">手机: 240e:xxxx:xxxx:1::20</text>
      <text x="12" y="98" font-family="monospace" font-size="10" fill="#38bdf8">NAS : 240e:xxxx:xxxx:1::30</text>
    </g>

    <!-- IPv6 Firewall Router -->
    <g transform="translate(345, 55)">
      <rect width="210" height="115" rx="10" fill="url(#v6Grad)"/>
      <text x="105" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">IPv6 路由器 (纯路由+防火墙)</text>
      <text x="105" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0f2fe">无 NAT 损耗 / 线速直通</text>
      <rect x="15" y="65" width="180" height="40" rx="4" fill="#0f172a" opacity="0.8"/>
      <text x="105" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#34d399">✓ 防火墙默认拦截非法入侵</text>
      <text x="105" y="97" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#38bdf8">✓ 允许主动发起与握手返回</text>
    </g>

    <!-- Direct Line -->
    <path d="M 270 112 L 340 112" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 560 112 L 640 112" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- WAN Internet target -->
    <g transform="translate(645, 55)">
      <rect width="230" height="115" rx="8" fill="#1e293b" stroke="#0284c7"/>
      <text x="115" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">全球任意对端 (P2P / 云服务)</text>
      <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">真实端到端连接：</text>
      <text x="15" y="75" font-family="monospace" font-size="11" fill="#34d399">240e:xxxx:xxxx:1::30 &lt;==&gt; 对端</text>
      <text x="15" y="98" font-family="sans-serif" font-size="11" fill="#38bdf8">★ 优势：P2P 秒打洞、无需公网端口映射</text>
    </g>
  </g>
</svg>
