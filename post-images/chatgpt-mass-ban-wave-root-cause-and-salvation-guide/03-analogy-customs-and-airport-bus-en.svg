<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0b0b14"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="400" height="38" rx="19" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="73" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Elementary Analogy 1 · Why Clean Accounts Get Collective Bans</text>

  <text x="64" y="140" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">"Digital Customs" &amp; The Crowded 500-Passenger Bus</text>
  <text x="64" y="180" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">Shared Datacenter VPN vs Private Residential ISP Risk Separation</text>

  <!-- Left: Shared Bus (Airport / Datacenter Proxy) -->
  <g transform="translate(64, 220)">
    <rect x="0" y="0" width="620" height="580" rx="16" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.4)"/>
    <rect x="32" y="24" width="220" height="34" rx="8" fill="rgba(239, 68, 68, 0.25)"/>
    <text x="48" y="47" fill="#f87171" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Shared Datacenter VPN (Hosting ASN)</text>
    <text x="32" y="95" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">The Crowded Bus Collective Ban</text>

    <!-- Analogy Visual -->
    <rect x="32" y="125" width="556" height="240" rx="12" fill="#18131d" stroke="#451a1a"/>
    <text x="56" y="165" fill="#fca5a5" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">【大比方场景】：</text>
    <text x="56" y="200" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">你买了一张昂贵的高级VIP俱乐部会员卡（$200 Pro）。</text>
    <text x="56" y="230" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">但你没有私家车，而是跟其他 500 个人挤上了同一辆无牌长途大巴。</text>
    <text x="56" y="260" fill="#f87171" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">车上有人在偷偷发色情广告、刷假票、偷钱包（爬虫/黑卡脚本）。</text>
    <text x="56" y="295" fill="#fca5a5" font-size="14" font-family="Noto Sans CJK SC, sans-serif">边防海关（Cloudflare WAF）直接将整辆大巴连车带人扣押并就地销毁！</text>
    <text x="56" y="325" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">即使你西装革履、出示真金白银的会员卡，海关也一视同仁全部驱逐。</text>

    <!-- Technical Mapping -->
    <rect x="32" y="390" width="556" height="150" rx="10" fill="#111827"/>
    <text x="56" y="425" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Technical Underpinnings:</text>
    <text x="56" y="455" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· ASN: DigitalOcean / Vultr / Linode / Cloudflare 托管网络</text>
    <text x="56" y="480" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 风险评分: IPQS 欺诈分 95+，同出口瞬时并发请求超数万次</text>
    <text x="56" y="505" fill="#f87171" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 结果: 自动化批处理清洗直接清空挂载该 IP 的全部 Cookie 会话</text>
  </g>

  <!-- Right: Residential ISP (Clean Home IP) -->
  <g transform="translate(756, 220)">
    <rect x="0" y="0" width="620" height="580" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)"/>
    <rect x="32" y="24" width="220" height="34" rx="8" fill="rgba(16, 185, 129, 0.25)"/>
    <text x="48" y="47" fill="#34d399" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Clean Home ISP (Residential)</text>
    <text x="32" y="95" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">The Private Car Green Light</text>

    <!-- Analogy Visual -->
    <rect x="32" y="125" width="556" height="240" rx="12" fill="#0f1d18" stroke="#164e3b"/>
    <text x="56" y="165" fill="#6ee7b7" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">【大比方场景】：</text>
    <text x="56" y="200" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">你开着自己名下的家庭轿车，车牌号归属地干净透明。</text>
    <text x="56" y="230" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">车里只有你一个人，行车记录仪规矩合法，没有任何可疑包裹。</text>
    <text x="56" y="260" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">海关人员看了一眼车牌和你的护照，微笑着直接抬杆放行！</text>
    <text x="56" y="295" fill="#6ee7b7" font-size="14" font-family="Noto Sans CJK SC, sans-serif">即便偶尔网络抖动或触发验证码，也能在 2 秒内秒过，绝不封停。</text>
    <text x="56" y="325" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">你的付费权益与历史对话安若磐石，享受 VIP 优先推理算力。</text>

    <!-- Technical Mapping -->
    <rect x="32" y="390" width="556" height="150" rx="10" fill="#111827"/>
    <text x="56" y="425" fill="#34d399" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Technical Underpinnings:</text>
    <text x="56" y="455" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· ASN: AT&amp;T / Comcast / Verizon / Spectrum 真实住宅网络</text>
    <text x="56" y="480" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 欺诈评分: Fraud Score &lt; 10，原生固定出口，DNS 一致</text>
    <text x="56" y="505" fill="#34d399" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 结果: 完全免受大规模风控浪潮误伤，长期稳定续费无虞</text>
  </g>
</svg>