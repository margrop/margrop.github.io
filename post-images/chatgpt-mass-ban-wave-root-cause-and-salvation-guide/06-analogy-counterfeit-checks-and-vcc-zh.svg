<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#1e1828"/>
      <stop offset="100%" stop-color="#090510"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg6)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="400" height="38" rx="19" fill="rgba(251, 191, 36, 0.15)" stroke="rgba(251, 191, 36, 0.35)"/>
  <text x="88" y="73" fill="#fbbf24" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">小学生秒懂大比方 ② · 为什么低价代充和虚拟卡会暴雷？</text>

  <text x="64" y="140" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">“跨国代金券套利”与“超市月底倒查大账本”</text>
  <text x="64" y="180" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">虚拟信用卡（VCC）批量开卡、低价区汇率羊毛与 Stripe 追溯清盘机制</text>

  <!-- Left: The Arbitrage Trap -->
  <g transform="translate(64, 220)">
    <rect x="0" y="0" width="620" height="580" rx="16" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.4)"/>
    <rect x="32" y="24" width="220" height="34" rx="8" fill="rgba(239, 68, 68, 0.25)"/>
    <text x="48" y="47" fill="#f87171" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">跨区代充与黑卡虚拟卡</text>
    <text x="32" y="95" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">“假代金券”终极反噬</text>

    <rect x="32" y="125" width="556" height="240" rx="12" fill="#1b1218" stroke="#4a1924"/>
    <text x="56" y="165" fill="#fca5a5" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">【大比方场景】：</text>
    <text x="56" y="200" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">某家高档牛排店一份顶级牛排标价 140 元。</text>
    <text x="56" y="230" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">有人告诉你：“去小巷子里买当地贫困救济代金券，折合只要 30 元！”</text>
    <text x="56" y="260" fill="#f87171" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">你吃了两个月，觉得占了大便宜（土耳其/菲律宾低价区拼车）。</text>
    <text x="56" y="295" fill="#fca5a5" font-size="14" font-family="Noto Sans CJK SC, sans-serif">到了月底，总部审计师拿着放大镜核对收据，发现所有代金券来自同一家造假作坊！</text>
    <text x="56" y="325" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">店长勃然大怒：凡是用过这批券的人，全部直接拉黑、终身没收会员资格！</text>

    <rect x="32" y="390" width="556" height="150" rx="10" fill="#111827"/>
    <text x="56" y="425" fill="#fbbf24" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">技术本质（Stripe 溯源）：</text>
    <text x="56" y="455" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 卡段标记: 某些虚拟卡 BIN 号（如 5561xx / 4288xx）欺诈拒付率极高</text>
    <text x="56" y="480" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 批量连带: 单张卡或同一个上游账户生成了数百个子卡叠号充值</text>
    <text x="56" y="505" fill="#f87171" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 倒查处置: OpenAI 每隔数月执行一次全局对账，触发全局注销</text>
  </g>

  <!-- Right: Legitimate Direct Payment -->
  <g transform="translate(756, 220)">
    <rect x="0" y="0" width="620" height="580" rx="16" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.4)"/>
    <rect x="32" y="24" width="220" height="34" rx="8" fill="rgba(56, 189, 248, 0.25)"/>
    <text x="48" y="47" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">正规本人信用卡 / 官方通道</text>
    <text x="32" y="95" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">“实名银行卡”高枕无忧</text>

    <rect x="32" y="125" width="556" height="240" rx="12" fill="#0c1926" stroke="#173e5f"/>
    <text x="56" y="165" fill="#7dd3fc" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">【大比方场景】：</text>
    <text x="56" y="200" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">你直接掏出自己名下的正规实体银行信用卡。</text>
    <text x="56" y="230" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">刷卡时附带手机短信验证码（3D Secure 双重身份核实）。</text>
    <text x="56" y="260" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">每一分钱都按原价清清楚楚划拨到 OpenAI 官方账单上。</text>
    <text x="56" y="295" fill="#7dd3fc" font-size="14" font-family="Noto Sans CJK SC, sans-serif">即便遇到系统 Bug 被误封，你也可以随时拿出银行扣款对账单去客服前台申诉。</text>
    <text x="56" y="325" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">客服查到是 100% 真实扣费的合法用户，不仅光速解封，还会发邮件致歉补偿。</text>

    <rect x="32" y="390" width="556" height="150" rx="10" fill="#111827"/>
    <text x="56" y="425" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">安全实践基准：</text>
    <text x="56" y="455" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 支付通道: 优先使用美区/港区 PayPal、Apple Pay 绑定的真实实体卡</text>
    <text x="56" y="480" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 拒绝拼车: 避免多未知主体共用 Team 席位，严禁多人同时高频换 IP</text>
    <text x="56" y="505" fill="#38bdf8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 申诉底气: 拥有正规 Stripe 账单流水，申诉成功率高达 90% 以上</text>
  </g>
</svg>