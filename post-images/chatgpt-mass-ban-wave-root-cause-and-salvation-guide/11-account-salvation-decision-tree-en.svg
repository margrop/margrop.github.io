<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg11)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="400" height="38" rx="19" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="73" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Actionable Playbook · Account Salvation Decision Tree</text>

  <text x="64" y="140" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">Account Deactivation Incident Response Roadmap</text>
  <text x="64" y="180" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">From Evidence Preservation, Root Cause Audit, Official Appeal to Local Fallbacks</text>

  <!-- Step 1 -->
  <g transform="translate(64, 230)">
    <rect x="0" y="0" width="280" height="570" rx="14" fill="#0b1120" stroke="#38bdf8"/>
    <circle cx="40" cy="40" r="18" fill="#38bdf8"/>
    <text x="34" y="46" fill="#0f172a" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">1</text>
    <text x="75" y="46" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Evidence Preservation</text>

    <text x="24" y="95" fill="#f87171" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">切忌盲目乱试！</text>
    <text x="24" y="125" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 截屏保留报错完整页面</text>
    <text x="24" y="150" fill="#38bdf8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 核心：记录 Request ID</text>
    <text x="24" y="175" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 记录遭遇拦截的具体时间戳</text>
    <text x="24" y="200" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 暂缓在同一 IP 连续尝试注册</text>

    <rect x="20" y="240" width="240" height="290" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">关键提示：</text>
    <text x="35" y="300" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">盲目切换节点在 5 分钟内连续</text>
    <text x="35" y="325" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">登录 10 次，会导致该账号从</text>
    <text x="35" y="350" fill="#f87171" font-size="12" font-family="Noto Sans CJK SC, sans-serif">“临时软拦截”升级为</text>
    <text x="35" y="375" fill="#f87171" font-size="12" font-family="Noto Sans CJK SC, sans-serif">“永久封停 (Hard Ban)”！</text>
    <text x="35" y="415" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">先通过诊断脚本检查出口干净度</text>
    <text x="35" y="440" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">再采取后续步骤。</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(380, 230)">
    <rect x="0" y="0" width="280" height="570" rx="14" fill="#0b1120" stroke="#fbbf24"/>
    <circle cx="40" cy="40" r="18" fill="#fbbf24"/>
    <text x="34" y="46" fill="#0f172a" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">2</text>
    <text x="75" y="46" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Diagnostic &amp; Audit</text>

    <text x="24" y="95" fill="#fbbf24" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">运行一键扫描脚本</text>
    <text x="24" y="125" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 运行 chatgpt_risk_scan</text>
    <text x="24" y="150" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 查 Egress ASN 是否机房节点</text>
    <text x="24" y="175" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 查 Stripe 扣款账单状态</text>
    <text x="24" y="200" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 区分 IP 屏蔽还是账号注销</text>

    <rect x="20" y="240" width="240" height="290" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#fbbf24" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">二选一定性：</text>
    <text x="35" y="300" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">A. 仅当前 IP 抛 403：</text>
    <text x="35" y="325" fill="#34d399" font-size="12" font-family="Noto Sans CJK SC, sans-serif">→ 换纯净住宅网络直接复活</text>
    <text x="35" y="365" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">B. 任何网络均显示 Deactivated：</text>
    <text x="35" y="390" fill="#f87171" font-size="12" font-family="Noto Sans CJK SC, sans-serif">→ 账号已入库注销，进入 Step 3</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(696, 230)">
    <rect x="0" y="0" width="310" height="570" rx="14" fill="#0b1120" stroke="#34d399"/>
    <circle cx="40" cy="40" r="18" fill="#34d399"/>
    <text x="34" y="46" fill="#0f172a" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">3</text>
    <text x="75" y="46" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Official Appeal Channel</text>

    <text x="24" y="95" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">help.openai.com 工单</text>
    <text x="24" y="125" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 采用脚本生成的标准英文申诉函</text>
    <text x="24" y="150" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 附带信用卡真实扣款对账单 PDF</text>
    <text x="24" y="175" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 阐明误判原因与合理使用承诺</text>
    <text x="24" y="200" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 耐心等待 3-7 个工作日人工审核</text>

    <rect x="20" y="240" width="270" height="290" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">申诉核心要义：</text>
    <text x="35" y="300" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 语气专业客观，切忌过激言辞</text>
    <text x="35" y="330" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 强调自己的学术/开发研究属性</text>
    <text x="35" y="360" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 提供合法银行对账单可极大提速</text>
    <text x="35" y="400" fill="#34d399" font-size="12" font-family="Noto Sans CJK SC, sans-serif">经验统计：合法付费被误伤账号</text>
    <text x="35" y="425" fill="#34d399" font-size="12" font-family="Noto Sans CJK SC, sans-serif">申诉恢复率可达 65% - 80%</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1042, 230)">
    <rect x="0" y="0" width="334" height="570" rx="14" fill="#0b1120" stroke="#a855f7"/>
    <circle cx="40" cy="40" r="18" fill="#a855f7"/>
    <text x="34" y="46" fill="#0f172a" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">4</text>
    <text x="75" y="46" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Local Backup &amp; Fallback</text>

    <text x="24" y="95" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">不再把鸡蛋放在单篮</text>
    <text x="24" y="125" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 日常开启 Data Export 本地归档</text>
    <text x="24" y="150" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 核心代码Prompt本地版本库管理</text>
    <text x="24" y="175" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 接入 Claude 3.7 / DeepSeek V4.1</text>
    <text x="24" y="200" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 私有化部署本地 LLM 兜底</text>

    <rect x="20" y="240" width="294" height="290" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">终极防风控架构：</text>
    <text x="35" y="300" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">1. 聚合网关 (NewAPI / OneAPI)</text>
    <text x="35" y="325" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">   实现多供应商瞬时故障切换</text>
    <text x="35" y="360" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">2. 本地模型 (Ollama / MLX)</text>
    <text x="35" y="385" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">   离线敏感数据推理永不断供</text>
    <text x="35" y="420" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">3. 知识资产 Markdown 沉淀</text>
    <text x="35" y="445" fill="#34d399" font-size="12" font-family="Noto Sans CJK SC, sans-serif">   摆脱对云端对话树的绝对依赖</text>
  </g>
</svg>