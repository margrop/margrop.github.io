    <text x="24" y="190" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 对话记录、自定义 GPT 与记忆全蒸发</text>
    <line x1="24" y1="220" x2="386" y2="220" stroke="rgba(255,255,255,0.1)"/>
