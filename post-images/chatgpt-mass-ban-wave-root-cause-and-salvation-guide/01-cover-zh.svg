    <text x="36" y="44" fill="#f87171" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">核心灾情现场</text>
    <text x="24" y="95" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">无预警注销 Deactivated</text>
    <text x="24" y="130" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 登录直报 Account Deleted / Deactivated</text>
