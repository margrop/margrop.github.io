    <rect x="24" y="280" width="362" height="190" rx="10" fill="#0b1120"/>
    <text x="40" y="315" fill="#ef4444" font-size="13" font-family="DejaVu Sans Mono, monospace">"You do not have an account</text>
    <text x="40" y="340" fill="#ef4444" font-size="13" font-family="DejaVu Sans Mono, monospace">because it has been deleted</text>
    <text x="40" y="365" fill="#ef4444" font-size="13" font-family="DejaVu Sans Mono, monospace">or deactivated."</text>
    <text x="40" y="410" fill="#64748b" font-size="12" font-family="DejaVu Sans Mono, monospace">Request ID: req_01jcb78x...</text>
    <text x="40" y="440" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono, monospace">Error Status: 403 / Terminated</text>
  </g>

  <g transform="translate(514, 270)">
