  <rect width="1440" height="860" fill="url(#bg)"/>
  <circle cx="1250" cy="180" r="320" fill="rgba(239, 68, 68, 0.06)"/>
  <circle cx="180" cy="700" r="350" fill="rgba(56, 189, 248, 0.04)"/>

  <!-- Badge -->
  <rect x="64" y="56" width="460" height="42" rx="21" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)"/>
