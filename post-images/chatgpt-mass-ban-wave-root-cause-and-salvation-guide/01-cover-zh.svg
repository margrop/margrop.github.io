    <text x="24" y="165" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">公共机场万人共享 IP，同段连坐封杀</text>

    <text x="24" y="210" fill="#fde68a" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">2. 虚拟信用卡与低价跨区</text>
    <text x="24" y="235" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">土耳其/菲律宾汇率套利遭 Stripe 溯源清洗</text>

    <text x="24" y="280" fill="#fde68a" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">3. 浏览器 TLS 与设备指纹</text>
    <text x="24" y="305" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">JA3/JA4 指纹穿透与 Cloudflare Turnstile</text>

    <text x="24" y="350" fill="#fde68a" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">4. 反代中转与 API 逆向</text>
    <text x="24" y="375" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">批量刷 Token 与多账号池瞬时触发熔断</text>
  </g>

  <g transform="translate(964, 270)">
    <!-- Card 3: 救砖与防封 -->
    <rect x="0" y="0" width="410" height="510" rx="16" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(56, 189, 248, 0.3)"/>
    <rect x="24" y="24" width="140" height="30" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="36" y="44" fill="#38bdf8" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">自救与排查全解</text>
    <text x="24" y="95" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">零依赖跨平台工具</text>

    <rect x="24" y="130" width="362" height="70" rx="8" fill="#0b1120" stroke="rgba(56,189,248,0.2)"/>
    <text x="40" y="158" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Windows 11 PowerShell</text>
    <text x="40" y="182" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">双模式：人类交互仪表盘 / Agent 结构化 JSON</text>

    <rect x="24" y="215" width="362" height="70" rx="8" fill="#0b1120" stroke="rgba(56,189,248,0.2)"/>
    <text x="40" y="243" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Ubuntu 26.04 POSIX Bash</text>
    <text x="40" y="267" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">零外部服务依赖，网络/ASN/Cookie 一键扫描</text>

    <rect x="24" y="300" width="362" height="70" rx="8" fill="#0b1120" stroke="rgba(56,189,248,0.2)"/>
    <text x="40" y="328" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">macOS 27 Native Zsh</text>
    <text x="40" y="352" fill="#94a3b8" font-size="12" font-family="Noto Sans CJK SC, sans-serif">Apple Silicon 专机审计，官方申诉信自动化生成</text>

    <rect x="24" y="390" width="362" height="90" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="40" y="425" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">✓ 官方申诉通道规范话术</text>
    <text x="40" y="455" fill="#a7f3d0" font-size="12" font-family="Noto Sans CJK SC, sans-serif">保留 Request ID，通过真实账单证据申诉解封</text>
