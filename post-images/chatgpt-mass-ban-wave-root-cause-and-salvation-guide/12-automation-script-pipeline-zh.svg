<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg12)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="410" height="38" rx="19" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)"/>
  <text x="88" y="73" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">工具架构 · 零第三方依赖跨三大操作系统检测修复流水线</text>

  <text x="64" y="140" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">ChatGPT 风险诊断脚本架构与双模式运行设计</text>
  <text x="64" y="180" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">支持人类直观交互 (Human CLI) 与 AI Agent 自动化驱动 (JSON Output) 双向协同</text>

  <!-- 3 OS Cards -->
  <!-- Windows 11 -->
  <g transform="translate(64, 230)">
    <rect x="0" y="0" width="410" height="570" rx="14" fill="#0b1120" stroke="#0078d4"/>
    <rect x="24" y="24" width="170" height="34" rx="8" fill="rgba(0, 120, 212, 0.2)"/>
    <text x="40" y="47" fill="#60a5fa" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Windows 11 26H2</text>
    
    <text x="24" y="95" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">PowerShell 7 / 5.1 原生</text>
    <text x="24" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 采用原生 Invoke-RestMethod 探测</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· Edge &amp; Chrome 会话缓存精准清理</text>
    <text x="24" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 严苛 IP 与计算机名称自动掩码脱敏</text>
    
    <rect x="24" y="210" width="362" height="150" rx="8" fill="#111827"/>
    <text x="40" y="240" fill="#60a5fa" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Execution Syntax:</text>
    <text x="40" y="270" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace"># 人类交互执行模式</text>
    <text x="40" y="295" fill="#f8fafc" font-size="12" font-family="DejaVu Sans Mono, monospace">powershell -File chatgpt_risk_scan.ps1</text>
    <text x="40" y="325" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace"># Agent 自动化 JSON 输出模式</text>
    <text x="40" y="348" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">.\chatgpt_risk_scan.ps1 -Mode Agent</text>

    <rect x="24" y="380" width="362" height="160" rx="8" fill="#161e2e"/>
    <text x="40" y="410" fill="#60a5fa" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">特色安全能力：</text>
    <text x="40" y="440" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 自动识别 Windows 原生桌面端状态</text>
    <text x="40" y="465" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 深度审计系统全局代理与 PAC 分流</text>
    <text x="40" y="490" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 一键导出 Markdown 标准工单附件</text>
  </g>

  <!-- Ubuntu 26.04 -->
  <g transform="translate(514, 230)">
    <rect x="0" y="0" width="410" height="570" rx="14" fill="#0b1120" stroke="#e95420"/>
    <rect x="24" y="24" width="170" height="34" rx="8" fill="rgba(233, 84, 32, 0.2)"/>
    <text x="40" y="47" fill="#fb923c" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Ubuntu 26.04 LTS</text>

    <text x="24" y="95" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">POSIX Shell &amp; Bash 脚本</text>
    <text x="24" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 纯标准 Linux 工具链 (curl/sed/awk)</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 支持无头服务器 (Headless) 自动调用</text>
    <text x="24" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 毫秒级 RDAP 机房 ASN 反查逻辑</text>

    <rect x="24" y="210" width="362" height="150" rx="8" fill="#111827"/>
    <text x="40" y="240" fill="#fb923c" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Execution Syntax:</text>
    <text x="40" y="270" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace"># 人类交互执行模式</text>
    <text x="40" y="295" fill="#f8fafc" font-size="12" font-family="DejaVu Sans Mono, monospace">bash chatgpt_risk_scan_ubuntu.sh</text>
    <text x="40" y="325" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace"># Agent 自动化 JSON 输出模式</text>
    <text x="40" y="348" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">./chatgpt_risk_scan_ubuntu.sh --agent</text>

    <rect x="24" y="380" width="362" height="160" rx="8" fill="#161e2e"/>
    <text x="40" y="410" fill="#fb923c" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">特色安全能力：</text>
    <text x="40" y="440" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 自动清理 Chromium 与 Firefox 缓存</text>
    <text x="40" y="465" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 兼容 x86_64 与 ARM64 双架构云主机</text>
    <text x="40" y="490" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 支持无交互非阻塞静默注入 CI/CD</text>
  </g>

  <!-- macOS 27 -->
  <g transform="translate(964, 230)">
    <rect x="0" y="0" width="410" height="570" rx="14" fill="#0b1120" stroke="#a855f7"/>
    <rect x="24" y="24" width="170" height="34" rx="8" fill="rgba(168, 85, 247, 0.2)"/>
    <text x="40" y="47" fill="#c084fc" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">macOS 27 (Darwin)</text>

    <text x="24" y="95" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Native Zsh &amp; Apple Silicon</text>
    <text x="24" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 适配最新 macOS 27 系统架构</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 原生 ChatGPT.app 沙盒状态检查</text>
    <text x="24" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· scutil 网络配置与 WebKit 缓存清理</text>

    <rect x="24" y="210" width="362" height="150" rx="8" fill="#111827"/>
    <text x="40" y="240" fill="#c084fc" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Execution Syntax:</text>
    <text x="40" y="270" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace"># 人类交互执行模式</text>
    <text x="40" y="295" fill="#f8fafc" font-size="12" font-family="DejaVu Sans Mono, monospace">zsh chatgpt_risk_scan_macos.zsh</text>
    <text x="40" y="325" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace"># Agent 自动化 JSON 输出模式</text>
    <text x="40" y="348" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">./chatgpt_risk_scan_macos.zsh --agent</text>

    <rect x="24" y="380" width="362" height="160" rx="8" fill="#161e2e"/>
    <text x="40" y="410" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">特色安全能力：</text>
    <text x="40" y="440" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 识别 Application Support 下异常 Token</text>
    <text x="40" y="465" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 检查 iCloud 专用代理与分流冲突</text>
    <text x="40" y="490" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 自动格式化系统硬件型号脱敏报告</text>
  </g>
</svg>