<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg7)"/>

  <!-- Badge -->
  <rect x="64" y="48" width="380" height="38" rx="19" fill="rgba(147, 51, 234, 0.15)" stroke="rgba(147, 51, 234, 0.4)"/>
  <text x="88" y="73" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Technical Architecture · OpenAI Automated Risk Radar Panorama</text>

  <text x="64" y="140" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">OpenAI 4-Tier Defensive &amp; Automated Deactivation Engine</text>
  <text x="64" y="180" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">From Network Egress, Client Fingerprints, Stripe Radar to Model Telemetry</text>

  <!-- 4 Layer Columns -->
  <!-- Layer 1 -->
  <g transform="translate(64, 230)">
    <rect x="0" y="0" width="300" height="570" rx="14" fill="#0b1120" stroke="#1e293b"/>
    <rect x="20" y="20" width="260" height="40" rx="8" fill="#1e293b"/>
    <text x="35" y="46" fill="#38bdf8" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Tier 1: Network &amp; Egress (ASN)</text>
    
    <text x="20" y="95" fill="#f8fafc" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Cloudflare 边界防御</text>
    <text x="20" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 机房 vs 住宅 ASN 识别</text>
    <text x="20" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 欺诈分 (Fraud Score) 过滤</text>
    <text x="20" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 跨大洲 IP 瞬移检测</text>
    <text x="20" y="200" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· DNS 泄漏与国家错位检测</text>
    
    <rect x="20" y="240" width="260" height="130" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">WAF Metric Tracked:</text>
    <text x="35" y="295" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· IP Concurrency &gt; 50</text>
    <text x="35" y="320" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Turnstile Failure Rate</text>
    <text x="35" y="345" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· ASN Tag: Hosting/VPS</text>

    <rect x="20" y="390" width="260" height="150" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="35" y="420" fill="#f87171" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Penalty Enforcement:</text>
    <text x="35" y="450" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· Cloudflare 403 Ray ID 封禁</text>
    <text x="35" y="475" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· Turnstile 人机验证死循环</text>
    <text x="35" y="500" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 登录界面抛出 Access Denied</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(394, 230)">
    <rect x="0" y="0" width="300" height="570" rx="14" fill="#0b1120" stroke="#1e293b"/>
    <rect x="20" y="20" width="260" height="40" rx="8" fill="#1e293b"/>
    <text x="35" y="46" fill="#a855f7" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Tier 2: Device &amp; TLS Fingerprint</text>

    <text x="20" y="95" fill="#f8fafc" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">客户端环境透视</text>
    <text x="20" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· TLS JA3 / JA4 指纹比对</text>
    <text x="20" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· WebGL / Canvas 渲染哈希</text>
    <text x="20" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· HTTP/2 Client Hints 头审计</text>
    <text x="20" y="200" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 单环境挂载多账号检测</text>

    <rect x="20" y="240" width="260" height="130" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#c084fc" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Fingerprint Tracked:</text>
    <text x="35" y="295" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Python-requests / Curl</text>
    <text x="35" y="320" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Fake User-Agent mismatch</text>
    <text x="35" y="345" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Multi-cookie reuse</text>

    <rect x="20" y="390" width="260" height="150" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="35" y="420" fill="#f87171" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Penalty Enforcement:</text>
    <text x="35" y="450" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· OAuth 授权回调直接失败</text>
    <text x="35" y="475" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 账号被标记为脚本/机器号</text>
    <text x="35" y="500" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 提示请检查环境后重试</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(724, 230)">
    <rect x="0" y="0" width="300" height="570" rx="14" fill="#0b1120" stroke="#1e293b"/>
    <rect x="20" y="20" width="260" height="40" rx="8" fill="#1e293b"/>
    <text x="35" y="46" fill="#fbbf24" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Tier 3: Stripe Billing &amp; Radar</text>

    <text x="20" y="95" fill="#f8fafc" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">资金与结算追溯</text>
    <text x="20" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 发卡行 BIN 高危号段黑名单</text>
    <text x="20" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 虚拟预付卡 (VCC) 批量开户</text>
    <text x="20" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 账单地址与国家汇率不一致</text>
    <text x="20" y="200" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 拒付率与争议历史倒查</text>

    <rect x="20" y="240" width="260" height="130" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#fbbf24" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Stripe Radar Rules:</text>
    <text x="35" y="295" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Risk Score &gt; 75 Decline</text>
    <text x="35" y="320" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Card-Stacking Limit Exceeded</text>
    <text x="35" y="345" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· 3DS Authentication Failure</text>

    <rect x="20" y="390" width="260" height="150" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="35" y="420" fill="#f87171" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Penalty Enforcement:</text>
    <text x="35" y="450" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 续费失败并立即剥离权限</text>
    <text x="35" y="475" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 账号进入 Batch Deactivate 池</text>
    <text x="35" y="500" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 登录直报 Account Deactivated</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(1054, 230)">
    <rect x="0" y="0" width="322" height="570" rx="14" fill="#0b1120" stroke="#1e293b"/>
    <rect x="20" y="20" width="282" height="40" rx="8" fill="#1e293b"/>
    <text x="35" y="46" fill="#34d399" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Tier 4: Behavior &amp; API Telemetry</text>

    <text x="20" y="95" fill="#f8fafc" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">应用层滥用熔断</text>
    <text x="20" y="125" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 非法逆向反向代理 (Pandora等)</text>
    <text x="20" y="150" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 自动化高频爬虫与 Token 倒卖</text>
    <text x="20" y="175" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 提示词注入与越狱对抗审计</text>
    <text x="20" y="200" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 恶意违规代码自动生成拦截</text>

    <rect x="20" y="240" width="282" height="130" rx="8" fill="#161e2e"/>
    <text x="35" y="270" fill="#34d399" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Model Telemetry:</text>
    <text x="35" y="295" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· RPM / TPM Abnormal Bursts</text>
    <text x="35" y="320" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Prompt Safety Violations &gt; 3</text>
    <text x="35" y="345" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">· Session Token Multi-Origin</text>

    <rect x="20" y="390" width="282" height="150" rx="8" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="35" y="420" fill="#f87171" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Penalty Enforcement:</text>
    <text x="35" y="450" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· API Key 瞬间失效并禁用</text>
    <text x="35" y="475" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 永久注销该账号下所有模型权限</text>
    <text x="35" y="500" fill="#fca5a5" font-size="12" font-family="Noto Sans CJK SC, sans-serif">· 申诉驳回（判定实质违反 ToS）</text>
  </g>
</svg>