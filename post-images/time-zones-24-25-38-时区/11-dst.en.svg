<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>The missing hour and the repeated hour</title><desc>Original explanatory illustration; conceptual, not a geographic map.</desc><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f1e9" stroke="none"/><text x="60" y="85" font-size="45" fill="#142b46" font-weight="700" text-anchor="start">Daylight saving changes the clock labels</text><text x="60" y="147" font-size="29" fill="#53677b" font-weight="400" text-anchor="start">New York’s two clock changes in 2026</text><rect x="60" y="208" width="1080" height="196" rx="20" fill="#ffffff" stroke="none"/><text x="85" y="259" font-size="32" fill="#007f80" font-weight="700" text-anchor="start">March 8: an hour is skipped</text><text x="250" y="340" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">01:59:59</text><line x1="460" y1="323" x2="716" y2="323" stroke="#007f80" stroke-width="4" stroke-dasharray=""/><path d="M 703.7138441335347 329.71195754045885 L 716 323 L 703.7138441335347 316.28804245954115" fill="none" stroke="#007f80" stroke-width="4"/><text x="912" y="340" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">03:00:00</text><rect x="60" y="440" width="1080" height="196" rx="20" fill="#ffffff" stroke="none"/><text x="85" y="491" font-size="32" fill="#c7513c" font-weight="700" text-anchor="start">November 1: an hour repeats</text><text x="250" y="572" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">01:59:59</text><line x1="460" y1="555" x2="716" y2="555" stroke="#c7513c" stroke-width="4" stroke-dasharray=""/><path d="M 703.7138441335347 561.7119575404588 L 716 555 L 703.7138441335347 548.2880424595412" fill="none" stroke="#c7513c" stroke-width="4"/><text x="912" y="572" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">01:00:00</text><text x="600" y="679" font-size="28" fill="#53677b" font-weight="400" text-anchor="middle">Spring’s 02:30 does not exist; autumn’s 01:30 occurs twice.</text><line x1="50" y1="710" x2="1150" y2="710" stroke="#d0d6d7" stroke-width="1" stroke-dasharray=""/><text x="55" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="start">MARGROP  /  TIME ZONES  /  2026</text><text x="1145" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="end">ORIGINAL ILLUSTRATION</text></g></svg>