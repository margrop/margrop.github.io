<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>25 labels do not mean 25 full longitude bands</title><desc>Original explanatory illustration; conceptual, not a geographic map.</desc><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f1e9" stroke="none"/><text x="60" y="86" font-size="42" fill="#142b46" font-weight="700" text-anchor="start">Unroll a circle: one seam becomes two edges</text><text x="60" y="153" font-size="27" fill="#53677b" font-weight="400" text-anchor="start">An unrolled ideal model, not a map of civil time zones.</text><rect x="60" y="208" width="22.5" height="116" rx="0" fill="#c7513c" stroke="#ffffff"/><rect x="82.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="127.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="172.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="217.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="262.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="307.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="352.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="397.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="442.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="487.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="532.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="577.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="622.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="667.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="712.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="757.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="802.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="847.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="892.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="937.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="982.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="1027.5" y="208" width="45" height="116" rx="0" fill="#87c6bc" stroke="#ffffff"/><rect x="1072.5" y="208" width="45" height="116" rx="0" fill="#007f80" stroke="#ffffff"/><rect x="1117.5" y="208" width="22.5" height="116" rx="0" fill="#c7513c" stroke="#ffffff"/><text x="62" y="368" font-size="28" fill="#c7513c" font-weight="700" text-anchor="start">−12</text><text x="600" y="368" font-size="28" fill="#007f80" font-weight="700" text-anchor="middle">0</text><text x="1135" y="368" font-size="28" fill="#c7513c" font-weight="700" text-anchor="end">+12</text><text x="600" y="448" font-size="54" fill="#142b46" font-weight="700" text-anchor="middle">23 + ½ + ½ = 24</text><rect x="60" y="495" width="515" height="155" rx="20" fill="#ffffff" stroke="none"/><rect x="603" y="495" width="537" height="155" rx="20" fill="#ffffff" stroke="none"/><text x="85" y="547" font-size="28" fill="#007f80" font-weight="700" text-anchor="start">Map: two halves make one band</text><text x="85" y="603" font-size="33" fill="#142b46" font-weight="400" text-anchor="start">7.5° + 7.5° = 15°</text><text x="628" y="547" font-size="28" fill="#c7513c" font-weight="700" text-anchor="start">Labels: dates remain different</text><text x="628" y="603" font-size="33" fill="#142b46" font-weight="400" text-anchor="start">UTC−12 ≠ UTC+12</text><line x1="50" y1="710" x2="1150" y2="710" stroke="#d0d6d7" stroke-width="1" stroke-dasharray=""/><text x="55" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="start">MARGROP  /  TIME ZONES  /  2026</text><text x="1145" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="end">ORIGINAL ILLUSTRATION</text></g></svg>