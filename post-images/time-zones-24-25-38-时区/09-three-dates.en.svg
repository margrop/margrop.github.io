<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Three dates, one instant</title><desc>Original explanatory illustration; conceptual, not a geographic map.</desc><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f1e9" stroke="none"/><text x="60" y="86" font-size="43" fill="#142b46" font-weight="700" text-anchor="start">One instant can carry three calendar dates</text><text x="60" y="145" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">UTC 2026-09-08 10:30</text><rect x="60" y="204" width="347" height="339" rx="20" fill="#ffffff" stroke="none"/><rect x="60" y="204" width="347" height="65" rx="20" fill="#c7513c" stroke="none"/><text x="233" y="249" font-size="32" fill="#ffffff" font-weight="700" text-anchor="middle">UTC−12</text><text x="233" y="352" font-size="50" fill="#142b46" font-weight="700" text-anchor="middle">09 / 07</text><text x="233" y="425" font-size="45" fill="#142b46" font-weight="700" text-anchor="middle">22:30</text><text x="233" y="494" font-size="27" fill="#53677b" font-weight="400" text-anchor="middle">Previous day</text><rect x="427" y="204" width="347" height="339" rx="20" fill="#ffffff" stroke="none"/><rect x="427" y="204" width="347" height="65" rx="20" fill="#007f80" stroke="none"/><text x="600" y="249" font-size="32" fill="#ffffff" font-weight="700" text-anchor="middle">UTC±00</text><text x="600" y="352" font-size="50" fill="#142b46" font-weight="700" text-anchor="middle">09 / 08</text><text x="600" y="425" font-size="45" fill="#142b46" font-weight="700" text-anchor="middle">10:30</text><text x="600" y="494" font-size="27" fill="#53677b" font-weight="400" text-anchor="middle">UTC date</text><rect x="794" y="204" width="347" height="339" rx="20" fill="#ffffff" stroke="none"/><rect x="794" y="204" width="347" height="65" rx="20" fill="#142b46" stroke="none"/><text x="967" y="249" font-size="32" fill="#ffffff" font-weight="700" text-anchor="middle">UTC+14</text><text x="967" y="352" font-size="50" fill="#142b46" font-weight="700" text-anchor="middle">09 / 09</text><text x="967" y="425" font-size="45" fill="#142b46" font-weight="700" text-anchor="middle">00:30</text><text x="967" y="494" font-size="27" fill="#53677b" font-weight="400" text-anchor="middle">Next day</text><line x1="95" y1="598" x2="1100" y2="598" stroke="#007f80" stroke-width="3" stroke-dasharray=""/><text x="600" y="660" font-size="30" fill="#53677b" font-weight="400" text-anchor="middle">The offsets span 26 hours; elapsed time has not changed.</text><line x1="50" y1="710" x2="1150" y2="710" stroke="#d0d6d7" stroke-width="1" stroke-dasharray=""/><text x="55" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="start">MARGROP  /  TIME ZONES  /  2026</text><text x="1145" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="end">ORIGINAL ILLUSTRATION</text></g></svg>