<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>分区、偏移与规则不能混数</title><desc>原创科普示意图；用于解释概念，不是实际地理边界地图。</desc><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f1e9" stroke="none"/><text x="60" y="85" font-size="45" fill="#142b46" font-weight="700" text-anchor="start">同一个词，三种数法</text><rect x="60" y="180" width="346" height="433" rx="20" fill="#ffffff" stroke="none"/><text x="82" y="242" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">理想分区</text><text x="82" y="335" font-size="53" fill="#142b46" font-weight="700" text-anchor="start">15°</text><text x="82" y="421" font-size="26" fill="#142b46" font-weight="400" text-anchor="start">像橙子切片</text><text x="82" y="497" font-size="22" fill="#53677b" font-weight="400" text-anchor="start">描述经度上的划分</text><rect x="426" y="180" width="346" height="433" rx="20" fill="#ffffff" stroke="none"/><text x="448" y="242" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">UTC 偏移</text><text x="448" y="335" font-size="53" fill="#142b46" font-weight="700" text-anchor="start">+08:00</text><text x="448" y="421" font-size="26" fill="#142b46" font-weight="400" text-anchor="start">像此刻的钟面读数</text><text x="448" y="497" font-size="22" fill="#53677b" font-weight="400" text-anchor="start">某时刻，比 UTC 快多少</text><rect x="792" y="180" width="346" height="433" rx="20" fill="#ffffff" stroke="none"/><text x="814" y="242" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">时区规则</text><text x="814" y="335" font-size="35" fill="#142b46" font-weight="700" text-anchor="start">Asia/Shanghai</text><text x="814" y="421" font-size="26" fill="#142b46" font-weight="400" text-anchor="start">像一整本作息表</text><text x="814" y="497" font-size="22" fill="#53677b" font-weight="400" text-anchor="start">过去、现在、未来怎样计时</text><text x="60" y="665" font-size="29" fill="#c7513c" font-weight="700" text-anchor="start">今天显示同一时间，不代表全年遵守同一套规则。</text><line x1="50" y1="710" x2="1150" y2="710" stroke="#d0d6d7" stroke-width="1" stroke-dasharray=""/><text x="55" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="start">MARGROP  /  TIME ZONES  /  2026</text><text x="1145" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="end">原创示意 · 非地理边界图</text></g></svg>