<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Do not mix bands, offsets and rules</title><desc>Original explanatory illustration; conceptual, not a geographic map.</desc><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f1e9" stroke="none"/><text x="60" y="85" font-size="45" fill="#142b46" font-weight="700" text-anchor="start">One word, three different things to count</text><rect x="60" y="180" width="346" height="433" rx="20" fill="#ffffff" stroke="none"/><text x="82" y="242" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">IDEAL BAND</text><text x="82" y="335" font-size="53" fill="#142b46" font-weight="700" text-anchor="start">15°</text><text x="82" y="421" font-size="26" fill="#142b46" font-weight="400" text-anchor="start">Like orange slices</text><text x="82" y="497" font-size="22" fill="#53677b" font-weight="400" text-anchor="start">A geometric division</text><rect x="426" y="180" width="346" height="433" rx="20" fill="#ffffff" stroke="none"/><text x="448" y="242" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">UTC OFFSET</text><text x="448" y="335" font-size="53" fill="#142b46" font-weight="700" text-anchor="start">+08:00</text><text x="448" y="421" font-size="26" fill="#142b46" font-weight="400" text-anchor="start">Like a clock reading now</text><text x="448" y="497" font-size="22" fill="#53677b" font-weight="400" text-anchor="start">A difference at one instant</text><rect x="792" y="180" width="346" height="433" rx="20" fill="#ffffff" stroke="none"/><text x="814" y="242" font-size="30" fill="#007f80" font-weight="700" text-anchor="start">TIME ZONE RULES</text><text x="814" y="335" font-size="35" fill="#142b46" font-weight="700" text-anchor="start">Asia/Shanghai</text><text x="814" y="421" font-size="26" fill="#142b46" font-weight="400" text-anchor="start">Like a full school timetable</text><text x="814" y="497" font-size="22" fill="#53677b" font-weight="400" text-anchor="start">How civil time changes over time</text><text x="60" y="665" font-size="29" fill="#c7513c" font-weight="700" text-anchor="start">Matching clocks today do not guarantee matching rules all year.</text><line x1="50" y1="710" x2="1150" y2="710" stroke="#d0d6d7" stroke-width="1" stroke-dasharray=""/><text x="55" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="start">MARGROP  /  TIME ZONES  /  2026</text><text x="1145" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="end">ORIGINAL ILLUSTRATION</text></g></svg>