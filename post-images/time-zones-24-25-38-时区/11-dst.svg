<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>被跳过与重复的一小时</title><desc>原创科普示意图；用于解释概念，不是实际地理边界地图。</desc><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f4f1e9" stroke="none"/><text x="60" y="85" font-size="45" fill="#142b46" font-weight="700" text-anchor="start">夏令时改的是钟表标签</text><text x="60" y="147" font-size="29" fill="#53677b" font-weight="400" text-anchor="start">以纽约 2026 年的两次调整为例</text><rect x="60" y="208" width="1080" height="196" rx="20" fill="#ffffff" stroke="none"/><text x="85" y="259" font-size="32" fill="#007f80" font-weight="700" text-anchor="start">3 月 8 日：跳过一小时</text><text x="250" y="340" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">01:59:59</text><line x1="460" y1="323" x2="716" y2="323" stroke="#007f80" stroke-width="4" stroke-dasharray=""/><path d="M 703.7138441335347 329.71195754045885 L 716 323 L 703.7138441335347 316.28804245954115" fill="none" stroke="#007f80" stroke-width="4"/><text x="912" y="340" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">03:00:00</text><rect x="60" y="440" width="1080" height="196" rx="20" fill="#ffffff" stroke="none"/><text x="85" y="491" font-size="32" fill="#c7513c" font-weight="700" text-anchor="start">11 月 1 日：一小时重来</text><text x="250" y="572" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">01:59:59</text><line x1="460" y1="555" x2="716" y2="555" stroke="#c7513c" stroke-width="4" stroke-dasharray=""/><path d="M 703.7138441335347 561.7119575404588 L 716 555 L 703.7138441335347 548.2880424595412" fill="none" stroke="#c7513c" stroke-width="4"/><text x="912" y="572" font-size="49" fill="#142b46" font-weight="700" text-anchor="middle">01:00:00</text><text x="600" y="679" font-size="28" fill="#53677b" font-weight="400" text-anchor="middle">春季的 02:30 不存在；秋季的 01:30 出现两次。</text><line x1="50" y1="710" x2="1150" y2="710" stroke="#d0d6d7" stroke-width="1" stroke-dasharray=""/><text x="55" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="start">MARGROP  /  TIME ZONES  /  2026</text><text x="1145" y="743" font-size="21" fill="#53677b" font-weight="400" text-anchor="end">原创示意 · 非地理边界图</text></g></svg>