<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#spaceBg)"/>
  <circle cx="250" cy="200" r="300" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1350" cy="700" r="350" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>

  <!-- Top Badges -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="7" fill="#38bdf8"/>
    <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" letter-spacing="1">SYSTEM ARCHITECTURE &amp; AUTOMATION</text>

    <rect x="360" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="382" cy="21" r="7" fill="#34d399"/>
    <text x="402" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#34d399">ZERO DEPENDENCY</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(100, 190)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
      别再把 <tspan fill="url(#cyanGrad)">.tar.gz</tspan> 当成普通 zip 了！
    </text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#94a3b8">
      彻底搞懂 ZIP / RAR / TAR.GZ / 7Z 的底层秘密与全平台自动化套件
    </text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#64748b">
      从收纳搬家纸箱与真空压缩袋的物理大白话，到跨平台文件名乱码、目录炸弹防御与自动化智能脚本
    </text>
  </g>

  <!-- 4 Core Format Cards -->
  <g transform="translate(100, 390)">
    <!-- Card 1: ZIP -->
    <rect x="0" y="0" width="320" height="340" rx="16" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="70" rx="12" fill="#1d4ed8" opacity="0.4"/>
    <text x="40" y="70" font-family="monospace" font-size="28" font-weight="bold" fill="#60a5fa">ZIP</text>
    <text x="25" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">通用兼容之王</text>
    <text x="25" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">核心算法：Deflate</text>
    <text x="25" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">随机读取：原生支持（独立压缩）</text>
    <text x="25" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">跨平台痛点：GBK/UTF-8乱码</text>
    <rect x="25" y="265" width="270" height="42" rx="8" fill="#1e3a8a" opacity="0.6"/>
    <text x="40" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#93c5fd">适用：办公文档、跨终端普通分享</text>

    <!-- Card 2: TAR.GZ -->
    <rect x="360" y="0" width="320" height="340" rx="16" fill="url(#cardBg)" stroke="#10b981" stroke-width="2"/>
    <rect x="385" y="25" width="95" height="70" rx="12" fill="#047857" opacity="0.4"/>
    <text x="395" y="70" font-family="monospace" font-size="22" font-weight="bold" fill="#34d399">TAR.GZ</text>
    <text x="385" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">服务器运维霸主</text>
    <text x="385" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">结构：先归档(tar)后压缩(gzip)</text>
    <text x="385" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">权限保留：完整保留chmod/UID/GID</text>
    <text x="385" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">软链接保护：完美支持符号链接</text>
    <rect x="385" y="265" width="270" height="42" rx="8" fill="#064e3b" opacity="0.6"/>
    <text x="400" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#a7f3d0">适用：Linux源码包、系统备份、Docker</text>

    <!-- Card 3: 7Z -->
    <rect x="720" y="0" width="320" height="340" rx="16" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="745" y="25" width="70" height="70" rx="12" fill="#b45309" opacity="0.4"/>
    <text x="765" y="70" font-family="monospace" font-size="28" font-weight="bold" fill="#fbbf24">7Z</text>
    <text x="745" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">极限压缩天花板</text>
    <text x="745" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">核心算法：LZMA / LZMA2</text>
    <text x="745" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">固实压缩：极高压缩比（超大字典）</text>
    <text x="745" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">安全加密：AES-256 原生头部加密</text>
    <rect x="745" y="265" width="270" height="42" rx="8" fill="#78350f" opacity="0.6"/>
    <text x="760" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fde68a">适用：巨型数据冷备、软件分发</text>

    <!-- Card 4: RAR -->
    <rect x="1080" y="0" width="320" height="340" rx="16" fill="url(#cardBg)" stroke="#ec4899" stroke-width="2"/>
    <rect x="1105" y="25" width="70" height="70" rx="12" fill="#be185d" opacity="0.4"/>
    <text x="1115" y="70" font-family="monospace" font-size="28" font-weight="bold" fill="#f472b6">RAR</text>
    <text x="1105" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">商业专有老兵</text>
    <text x="1105" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">核心算法：专有算法（Eugene Roshal）</text>
    <text x="1105" y="195" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">恢复记录：独家 Reed-Solomon 坏块纠错</text>
    <text x="1105" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94a3b8">开源现状：仅开放解压，压缩受专利限制</text>
    <rect x="1105" y="265" width="270" height="42" rx="8" fill="#831843" opacity="0.6"/>
    <text x="1120" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fbcfe8">适用：老旧论坛分卷、高损网络分发</text>
  </g>

  <!-- Footer platform tags -->
  <g transform="translate(100, 800)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#64748b">自动化套件支持平台：</text>
    <rect x="170" y="-20" width="130" height="30" rx="6" fill="#334155"/>
    <text x="185" y="0" font-family="monospace" font-size="15" fill="#f1f5f9">Windows 11</text>
    <rect x="315" y="-20" width="140" height="30" rx="6" fill="#334155"/>
    <text x="330" y="0" font-family="monospace" font-size="15" fill="#f1f5f9">Ubuntu 26.04</text>
    <rect x="470" y="-20" width="120" height="30" rx="6" fill="#334155"/>
    <text x="485" y="0" font-family="monospace" font-size="15" fill="#f1f5f9">macOS 26</text>
    <text x="1180" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#475569">Margrop · 深度硬核实战指南</text>
  </g>
</svg>