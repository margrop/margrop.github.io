<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tableHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="850" fill="url(#bg2)"/>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">无损压缩的物理秘密：速记员的“词典”与高频字母的“简短代号”</text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8">从 LZ77 滑动窗口字典查找，到霍夫曼编码（Huffman Coding）的概率最短树</text>
  </g>

  <!-- Left Box: Uncompressed Raw Stream -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="680" height="600" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="65" rx="16" fill="#0f172a"/>
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#f87171">原始未压缩文本（包含大量死板重复数据）</text>

    <!-- Raw text block -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="620" height="240" rx="10" fill="#020617" stroke="#1e293b"/>
      <text x="20" y="40" font-family="monospace" font-size="17" fill="#e2e8f0">"Hello World! This is a <tspan fill="#f59e0b" font-weight="bold">very very long</tspan> message.</text>
      <text x="20" y="80" font-family="monospace" font-size="17" fill="#e2e8f0"> The system recorded a <tspan fill="#f59e0b" font-weight="bold">very very long</tspan> stacktrace.</text>
      <text x="20" y="120" font-family="monospace" font-size="17" fill="#e2e8f0"> Every engineer saw this <tspan fill="#f59e0b" font-weight="bold">very very long</tspan> failure.</text>
      <text x="20" y="160" font-family="monospace" font-size="17" fill="#e2e8f0"> We finally fixed this <tspan fill="#f59e0b" font-weight="bold">very very long</tspan> error."</text>
      <text x="20" y="210" font-family="monospace" font-size="14" fill="#64748b">→ 每一个字符占用 1 字节（8 bit），整段占用 1,200 字节</text>
    </g>

    <!-- Elementary Analogy: Shorthand -->
    <g transform="translate(30, 370)">
      <rect x="0" y="0" width="620" height="190" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#fbbf24">💡 小学生日常比喻：课堂速记与外号</text>
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#cbd5e1">如果老师在讲台上连续念 100 遍“中华人民共和国”，</text>
      <text x="25" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#cbd5e1">聪明的同学不会在笔记本上老老实实写 100 遍这七个大字，</text>
      <text x="25" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#cbd5e1">而是先在纸角写下：<tspan fill="#38bdf8" font-weight="bold">① = 中华人民共和国</tspan>，后面全部只写 ①！</text>
      <text x="25" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#34d399">这就是 LZ77 算法与字典压缩最朴素的本质！</text>
    </g>
  </g>

  <!-- Right Box: Compressed Token Stream -->
  <g transform="translate(840, 170)">
    <rect x="0" y="0" width="680" height="600" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="65" rx="16" fill="url(#tableHeader)"/>
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">压缩后的数据流（字典指针 + 霍夫曼变长码）</text>

    <!-- Token Table -->
    <g transform="translate(30, 95)">
      <rect x="0" y="0" width="620" height="240" rx="10" fill="#020617" stroke="#312e81"/>
      <text x="20" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">1. 动态字典表（滑动窗口提取公因式）：</text>
      <text x="40" y="70" font-family="monospace" font-size="16" fill="#38bdf8">Token [1] = "very very long" (节省 42 字节)</text>
      <text x="40" y="105" font-family="monospace" font-size="16" fill="#38bdf8">Token [2] = "recorded a" &amp; "The system"</text>
      <path d="M 20 130 L 600 130" stroke="#334155" stroke-width="1"/>
      <text x="20" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#34d399">2. 霍夫曼变长编码（出现最多者分配最短比特）：</text>
      <text x="40" y="195" font-family="monospace" font-size="15" fill="#fde68a">最高频字母 'e' → 01 (仅 2 bit！原需 8 bit)</text>
      <text x="40" y="225" font-family="monospace" font-size="15" fill="#94a3b8">极低频字母 'z' → 1110110 (分配 7 bit)</text>
    </g>

    <!-- Result stats -->
    <g transform="translate(30, 370)">
      <rect x="0" y="0" width="620" height="190" rx="12" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#34d399">⚡ 为什么有些文件压缩率 90%，有些只有 0%？</text>
      <text x="25" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#cbd5e1">纯文本 / JSON / 日志 / 源码：大量重复词汇，压缩率高达 70% ~ 90%！</text>
      <text x="25" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f87171">JPEG 照片 / MP4 视频 / 已经压过的 zip：内部数据已经是高熵随机数，</text>
      <text x="25" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f87171">速记员根本找不到重复规律，强行压缩反而因为增加字典头变得更大！</text>
      <text x="25" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">压缩极限受香农信息熵定理（Shannon's Source Coding Theorem）死死约束</text>
    </g>
  </g>
</svg>