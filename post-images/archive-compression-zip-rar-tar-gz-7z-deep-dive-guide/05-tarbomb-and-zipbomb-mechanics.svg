<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120606"/>
      <stop offset="100%" stop-color="#240c0c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="850" fill="url(#bg5)"/>

  <!-- Title -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">高危安全防线：解压炸弹与目录地毯轰炸（Tarbomb &amp; Zip Bomb）</text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#fca5a5">从桌面被 5,000 个零散文件洗劫，到 42KB 压缩包膨胀为 4.5PB 瘫痪服务器内核（DoS）</text>
  </g>

  <!-- Left: Tarbomb -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="680" height="600" rx="16" fill="#1c1917" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="65" rx="16" fill="#7c2d12"/>
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">💣 灾难一：目录炸弹（Tarbomb 地毯式轰炸）</text>

    <g transform="translate(30, 90)">
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#fdba74">攻击原理与表现：</text>
      <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#e7e5e4">普通的压缩包会有一个顶层父文件夹（例如 project/file1, project/file2）。</text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#e7e5e4">但恶意的（或粗心打包的）Tarbomb 根本没有父目录！</text>
      <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fca5a5">当你在桌面敲下 tar -xzf bomb.tar.gz 的一瞬间：</text>

      <!-- Desktop mess illustration -->
      <rect x="0" y="125" width="620" height="150" rx="8" fill="#292524" stroke="#78350f"/>
      <text x="20" y="35" font-family="monospace" font-size="14" fill="#f87171">~/Desktop/file_0001.txt</text>
      <text x="20" y="60" font-family="monospace" font-size="14" fill="#f87171">~/Desktop/file_0002.txt</text>
      <text x="20" y="85" font-family="monospace" font-size="14" fill="#f87171">... 一口气向你的桌面倾倒 50,000 个零散小文件！</text>
      <text x="20" y="115" font-family="monospace" font-size="14" font-weight="bold" fill="#fbbf24">甚至恶意覆盖已有的 ~/.bashrc、~/.ssh/authorized_keys！</text>
    </g>

    <g transform="translate(30, 400)">
      <rect x="0" y="0" width="620" height="155" rx="10" fill="#0c0a09" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#34d399">🛡️ 自动化防御策略（脚本智能安全隔离）：</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">1. 解压前先执行模拟列出（dry-run / tar -tf / zipinfo）</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">2. 统计顶层根节点数量：若根节点 &gt; 1 或首级不是目录</text>
      <text x="20" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#a7f3d0">3. 自动创建隔离文件夹 package_quarantine/ 并安全解入！</text>
    </g>
  </g>

  <!-- Right: Zip Bomb -->
  <g transform="translate(840, 170)">
    <rect x="0" y="0" width="680" height="600" rx="16" fill="#1c1917" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="680" height="65" rx="16" fill="#991b1b"/>
    <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">☢️ 灾难二：解压核弹（Zip Bomb 42.zip 物理击穿）</text>

    <g transform="translate(30, 90)">
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#fca5a5">著名黑客案例：42.zip 的连锁裂变：</text>
      <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#e7e5e4">文件大小仅仅只有微不足道的 <tspan fill="#facc15" font-weight="bold">42 KB</tspan>。</text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#e7e5e4">它包含 16 个嵌套 zip，每层包含 16 个，递归 5 层，最底层全为 0 填充。</text>

      <rect x="0" y="105" width="620" height="170" rx="8" fill="#450a0a" stroke="#b91c1c"/>
      <text x="20" y="32" font-family="monospace" font-size="15" fill="#fecaca">42.zip (42 KB)</text>
      <text x="40" y="60" font-family="monospace" font-size="14" fill="#fecaca">↳ 16 个子压缩包 (每层递归放大)</text>
      <text x="60" y="88" font-family="monospace" font-size="14" fill="#fecaca">  ↳ 16 × 16 ... (16^5 = 1,048,576 个文件)</text>
      <text x="80" y="118" font-family="monospace" font-size="16" font-weight="bold" fill="#f87171">💥 完全解压所需磁盘空间：4.5 PB (4,500,000 GB)！</text>
      <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#fca5a5">触发后果：Linux 瞬间触发 OOM 崩溃，磁盘挂载点写满锁死！</text>
    </g>

    <g transform="translate(30, 400)">
      <rect x="0" y="0" width="620" height="155" rx="10" fill="#0c0a09" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">🛡️ 工业级防御三道闸门：</text>
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">1. 膨胀比检测（Ratio Guard）：解压后体积 / 压缩包体积 &gt; 100 触发熔断</text>
      <text x="20" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">2. 递归深度限制（Max Depth）：禁止自动递归解压嵌套压缩包</text>
      <text x="20" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">3. 磁盘硬限额与管道沙箱：设定最大流式写入上限（如不超过 20GB）</text>
    </g>
  </g>
</svg>