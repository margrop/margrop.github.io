<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="100%" stop-color="#1f1338"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="850" fill="url(#bg4)"/>

  <!-- Title -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">数字巴别塔之灾：为什么 Windows 压缩的文件在 Mac/Linux 上全是乱码？</text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8">ZIP 历史包袱：General Purpose Bit Flag 第 11 位与 Code Page 936 (GBK) 的跨世纪碰撞</text>
  </g>

  <!-- Left: Windows Generation -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="440" height="580" rx="16" fill="#18181b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="440" height="60" rx="16" fill="#1e3a8a"/>
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">1. Windows 11 中文系统打包</text>

    <g transform="translate(25, 90)">
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#cbd5e1">文件原始名称：</text>
      <rect x="0" y="40" width="390" height="55" rx="8" fill="#27272a"/>
      <text x="20" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#60a5fa">毕业论文最终定稿.docx</text>
    </g>

    <g transform="translate(25, 210)">
      <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#cbd5e1">Windows 默认编码处理：</text>
      <rect x="0" y="40" width="390" height="130" rx="8" fill="#09090b" stroke="#3f3f46"/>
      <text x="15" y="32" font-family="monospace" font-size="14" fill="#fbbf24">采用系统 ANSI 代码页：CP936 (GBK)</text>
      <text x="15" y="62" font-family="monospace" font-size="13" fill="#e4e4e7">每个汉字被编码为 2 字节十六进制：</text>
      <text x="15" y="92" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">[B1 CF] [D2 B5] [C2 DB] [CE C4]</text>
      <text x="15" y="118" font-family="monospace" font-size="12" fill="#ef4444">Flag Bit 11 (UTF-8 标志位) = 0 (未开启!)</text>
    </g>

    <g transform="translate(25, 410)">
      <rect x="0" y="0" width="390" height="130" rx="8" fill="#1c1917" stroke="#b45309"/>
      <text x="15" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">📦 产生后果：</text>
      <text x="15" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">ZIP 压缩包的中央目录头（Central Directory）</text>
      <text x="15" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d6d3d1">记录的是裸露的 GBK 字节流，</text>
      <text x="15" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#fca5a5">并且没有任何地方声明“我是GBK”！</text>
    </g>
  </g>

  <!-- Middle: The Transmit Tunnel -->
  <g transform="translate(560, 360)">
    <path d="M 0 40 L 120 40" stroke="#a855f7" stroke-width="4" stroke-dasharray="6,4"/>
    <circle cx="60" cy="40" r="30" fill="#6b21a8"/>
    <text x="48" y="48" font-family="sans-serif" font-size="26" fill="#ffffff">✈️</text>
    <text x="5" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d8b4fe">通过邮件/微信传给</text>
    <text x="15" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#d8b4fe">Mac 或 Linux 电脑</text>
  </g>

  <!-- Right: Linux/Mac Decompression -->
  <g transform="translate(720, 170)">
    <rect x="0" y="0" width="800" height="580" rx="16" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="800" height="60" rx="16" fill="#7f1d1d"/>
    <text x="25" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">2. macOS / Linux 接收解压：灾难降临！</text>

    <!-- Mojibake Error -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="740" height="150" rx="10" fill="#450a0a" stroke="#b91c1c"/>
      <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#fca5a5">💥 崩溃现场：默认 unzip 强制用 UTF-8 解释 GBK 字节</text>
      <rect x="25" y="55" width="690" height="50" rx="6" fill="#000000"/>
      <text x="40" y="88" font-family="monospace" font-size="20" font-weight="bold" fill="#f87171">????? - ????_????.docx  或者  ϱҵ.docx</text>
      <text x="25" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#fecaca">因为这些 GBK 字节组合不符合 UTF-8 的多字节前缀规则，操作系统直接替换为 Unicode 替换字符 U+FFFD ()！</text>
    </g>

    <!-- The 3 Clean Cures -->
    <g transform="translate(30, 270)">
      <rect x="0" y="0" width="740" height="270" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#34d399">✅ 彻底解决乱码的 3 种工程解法（告别手动重命名）：</text>

      <g transform="translate(25, 60)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">方法一：全能解压工具 unar（智能编码探测，最推荐）</text>
        <rect x="0" y="30" width="690" height="35" rx="6" fill="#1e293b"/>
        <text x="15" y="53" font-family="monospace" font-size="14" fill="#a5f3fc">$ unar -e GBK archive.zip    # 或者让 unar 自主学习推断文字语言</text>
      </g>

      <g transform="translate(25, 135)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">方法二：7-Zip 指定代码页参数</text>
        <rect x="0" y="30" width="690" height="35" rx="6" fill="#1e293b"/>
        <text x="15" y="53" font-family="monospace" font-size="14" fill="#a5f3fc">$ 7z x -mcp=936 archive.zip  # 强制 7z 使用简体中文 Windows 代码页解算</text>
      </g>

      <g transform="translate(25, 210)">
        <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">方法三：Python 自动重新解码转写（嵌入本指南自动化脚本）</text>
        <text x="15" y="45" font-family="monospace" font-size="13" fill="#94a3b8">filename.encode('cp437').decode('gbk')  → 毫秒级无损还原中文字符！</text>
      </g>
    </g>
  </g>
</svg>