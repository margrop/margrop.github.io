<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="920" fill="url(#bg3)"/>

  <!-- Title -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">四大主流归档与压缩格式全景横向矩阵（工程级硬核对照）</text>
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#94a3b8">从底层算法、固实压缩（Solid）、POSIX 元数据保留到跨平台兼容性深潜</text>
  </g>

  <!-- Table Wrapper -->
  <g transform="translate(80, 130)">
    <!-- Header Row -->
    <rect x="0" y="0" width="1440" height="60" rx="8" fill="#1e293b"/>
    <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="bold" fill="#94a3b8">对比维度</text>
    <text x="240" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="bold" fill="#60a5fa">ZIP (.zip)</text>
    <text x="540" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="bold" fill="#34d399">TAR.GZ (.tar.gz / .tgz)</text>
    <text x="870" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="bold" fill="#fbbf24">7-Zip (.7z)</text>
    <text x="1190" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="bold" fill="#f472b6">WinRAR (.rar)</text>

    <!-- Row 1: 诞生时间与开源协议 -->
    <rect x="0" y="65" width="1440" height="75" rx="6" fill="#111827"/>
    <text x="30" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">发明者与协议</text>
    <text x="240" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8fafc">Phil Katz (1989)</text>
    <text x="240" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#38bdf8">公开规范 / 事实全球标准</text>
    <text x="540" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8fafc">AT&amp;T (1979) + GNU (1992)</text>
    <text x="540" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#34d399">POSIX 标准 / GNU GPL 开源</text>
    <text x="870" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8fafc">Igor Pavlov (1999)</text>
    <text x="870" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#fbbf24">完全开源 (LGPL + BSD-3)</text>
    <text x="1190" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f8fafc">Eugene Roshal (1993)</text>
    <text x="1190" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#f87171">商业专有 / 仅开放解压源码</text>

    <!-- Row 2: 核心压缩算法与字典 -->
    <rect x="0" y="145" width="1440" height="75" rx="6" fill="#0f172a"/>
    <text x="30" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">底层压缩算法</text>
    <text x="240" y="178" font-family="monospace" font-size="15" fill="#cbd5e1">DEFLATE (LZ77 + Huffman)</text>
    <text x="240" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">字典上限 32KB（历史限制）</text>
    <text x="540" y="178" font-family="monospace" font-size="15" fill="#cbd5e1">DEFLATE (Gzip / pigz多核)</text>
    <text x="540" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">可选 xz(LZMA2) / zstd</text>
    <text x="870" y="178" font-family="monospace" font-size="15" fill="#cbd5e1">LZMA / LZMA2 / BCJ2</text>
    <text x="870" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">字典可达 1024MB（超大窗口）</text>
    <text x="1190" y="178" font-family="monospace" font-size="15" fill="#cbd5e1">RAR v5 专有算法</text>
    <text x="1190" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">字典可达 1024MB</text>

    <!-- Row 3: 固实压缩 (Solid Archive) -->
    <rect x="0" y="225" width="1440" height="75" rx="6" fill="#111827"/>
    <text x="30" y="270" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">固实压缩机制</text>
    <text x="240" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f87171">❌ 不支持固实（单独压缩）</text>
    <text x="240" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">随机取一个文件极快，压缩率偏低</text>
    <text x="540" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#34d399">✓ 天然固实（整流压缩）</text>
    <text x="540" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">多文件交叉重复特征直接消除</text>
    <text x="870" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#34d399">✓ 原生支持固实（可按类型分块）</text>
    <text x="870" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">同类型源码/文件聚合，压缩比霸榜</text>
    <text x="1190" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#34d399">✓ 支持固实压缩</text>
    <text x="1190" y="285" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">损坏时可能影响后续文件提取</text>

    <!-- Row 4: 元数据与权限保留 -->
    <rect x="0" y="305" width="1440" height="75" rx="6" fill="#0f172a"/>
    <text x="30" y="350" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">文件权限与软链接</text>
    <text x="240" y="338" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f87171">⚠️ 容易丢失（弱支持）</text>
    <text x="240" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">常将软链接转为空文件或实体</text>
    <text x="540" y="338" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#34d399">✓ 完美保留（POSIX 原生）</text>
    <text x="540" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">权限 chmod 755、UID/GID、硬软链接</text>
    <text x="870" y="338" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fbbf24">✓ 支持（需指定 -sni 开关）</text>
    <text x="870" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">新版 p7zip 原生保留 Linux 权限</text>
    <text x="1190" y="338" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#cbd5e1">✓ 支持 NTFS 与 POSIX 权限</text>
    <text x="1190" y="365" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">需在参数中显式开启安全属性</text>

    <!-- Row 5: 独家黑科技 -->
    <rect x="0" y="385" width="1440" height="75" rx="6" fill="#111827"/>
    <text x="30" y="430" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">核心王牌优势</text>
    <text x="240" y="418" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#60a5fa">免装软件，全平台开箱即用</text>
    <text x="240" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">所有操作系统内核或内置资源管理器标配</text>
    <text x="540" y="418" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#34d399">管道串流（Pipeline Streaming）</text>
    <text x="540" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">无需落盘即可一边打包一边网络传输</text>
    <text x="870" y="418" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fbbf24">极高压缩比 + 头部混淆加密</text>
    <text x="870" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">可完全隐藏压缩包内的文件名与文件树</text>
    <text x="1190" y="418" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#f472b6">恢复记录（Recovery Record）</text>
    <text x="1190" y="445" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">Reed-Solomon 坏道纠错，损坏可自愈</text>

    <!-- Row 6: 终极选型建议 -->
    <rect x="0" y="465" width="1440" height="75" rx="6" fill="#0f172a"/>
    <text x="30" y="510" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">最佳实战应用场景</text>
    <text x="240" y="498" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">日常向普通用户传文件</text>
    <text x="240" y="525" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">办公文档、发给客户、微信传输</text>
    <text x="540" y="498" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Linux 运维 / DevOps / CI/CD</text>
    <text x="540" y="525" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">代码构建、Docker 镜像、系统整备</text>
    <text x="870" y="498" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">大型数据归档 / 私密存储</text>
    <text x="870" y="525" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">数据库冷备、大模型权重、机密工程包</text>
    <text x="1190" y="498" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#f472b6">恶劣网络下的大型分卷传输</text>
    <text x="1190" y="525" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">网盘多卷分包、容错要求极高的大型包</text>
  </g>

  <!-- Summary Banner -->
  <g transform="translate(80, 715)">
    <rect x="0" y="0" width="1440" height="120" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#a5b4fc">🎯 架构师黄金法则：</text>
    <text x="40" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#e0e7ff">服务器运维与自动化脚本一律首选 <tspan fill="#34d399" font-weight="bold">tar.gz / pigz</tspan>；长期冷备份与极限省盘首选 <tspan fill="#fbbf24" font-weight="bold">7z (LZMA2)</tspan>；对外公开发布文档与非技术人员交互首选 <tspan fill="#60a5fa" font-weight="bold">zip (UTF-8)</tspan>！</text>
  </g>
</svg>