<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="vacuumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="850" fill="url(#bg)"/>

  <!-- Title -->
  <g transform="translate(80, 70)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">小学生也能秒懂的比喻：为什么 .tar.gz 解压后还会蹦出一个 .tar？</text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#94a3b8">计算机科学中的两个完全独立概念：“归档（Archiving / 打包）” vs “压缩（Compression / 抽真空）”</text>
  </g>

  <!-- Left: Loose Files -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="300" height="580" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
    <text x="25" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">1. 散落一地的杂物</text>
    <text x="25" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#9ca3af">散乱在硬盘各处的文件与目录</text>

    <!-- File items -->
    <g transform="translate(25, 110)">
      <rect x="0" y="0" width="250" height="50" rx="8" fill="#1f2937" stroke="#4b5563"/>
      <text x="20" y="32" font-family="monospace" font-size="15" fill="#60a5fa">📄 main.py (代码文件 15KB)</text>
    </g>
    <g transform="translate(25, 175)">
      <rect x="0" y="0" width="250" height="50" rx="8" fill="#1f2937" stroke="#4b5563"/>
      <text x="20" y="32" font-family="monospace" font-size="15" fill="#34d399">📁 assets/ (包含 150 张图片)</text>
    </g>
    <g transform="translate(25, 240)">
      <rect x="0" y="0" width="250" height="50" rx="8" fill="#1f2937" stroke="#4b5563"/>
      <text x="20" y="32" font-family="monospace" font-size="15" fill="#fbbf24">⚙️ run.sh (chmod +x 权限)</text>
    </g>
    <g transform="translate(25, 305)">
      <rect x="0" y="0" width="250" height="50" rx="8" fill="#1f2937" stroke="#4b5563"/>
      <text x="20" y="32" font-family="monospace" font-size="15" fill="#f472b6">🔗 symlink (指向共享动态库)</text>
    </g>

    <rect x="25" y="470" width="250" height="80" rx="10" fill="#374151" opacity="0.5"/>
    <text x="40" y="502" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#e5e7eb">总大小：约 100 MB</text>
    <text x="40" y="530" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#f87171">状态：碎片化，难以单独传输</text>
  </g>

  <!-- Arrow 1: TAR -->
  <g transform="translate(410, 420)">
    <path d="M 0 0 L 60 0" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
    <text x="-15" y="-20" font-family="monospace" font-size="16" font-weight="bold" fill="#f59e0b">tar -cf</text>
    <text x="-35" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#fbbf24">塞进搬家纸箱</text>
  </g>

  <!-- Middle: TAR Archive (Cardboard Box) -->
  <g transform="translate(500, 180)">
    <rect x="0" y="0" width="350" height="580" rx="16" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="25" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24">2. 瓦楞纸搬家大纸箱</text>
    <text x="25" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#d97706">归档 (Archive / .tar 文件)</text>

    <!-- Box Graphic -->
    <g transform="translate(35, 120)">
      <rect x="0" y="0" width="280" height="230" rx="12" fill="url(#boxGrad)" stroke="#b45309" stroke-width="2"/>
      <path d="M 0 50 L 280 50" stroke="#78350f" stroke-width="2" stroke-dasharray="4,4"/>
      <path d="M 140 0 L 140 230" stroke="#78350f" stroke-width="3"/>
      <!-- Tape label -->
      <rect x="60" y="85" width="160" height="60" rx="6" fill="#fef3c7"/>
      <text x="80" y="122" font-family="monospace" font-size="22" font-weight="bold" fill="#92400e">project.tar</text>
      <text x="75" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">仅捆绑，不减重！甚至稍重一点</text>
    </g>

    <g transform="translate(25, 380)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#a7f3d0">✓ 完整封存文件树层级结构</text>
      <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#a7f3d0">✓ 完整保留 Linux 读写执行权限</text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#a7f3d0">✓ 完整保留软链接与属主 UID/GID</text>
    </g>

    <rect x="25" y="470" width="300" height="80" rx="10" fill="#78350f" opacity="0.3"/>
    <text x="40" y="502" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fde68a">体积：100.2 MB (+200KB 纸箱标头)</text>
    <text x="40" y="530" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#fbbf24">核心意义：把几万个零散文件串成一条连续数据流</text>
  </g>

  <!-- Arrow 2: GZIP -->
  <g transform="translate(880, 420)">
    <path d="M 0 0 L 60 0" stroke="#0284c7" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
    <text x="-15" y="-20" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8">gzip -9</text>
    <text x="-35" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#38bdf8">真空机强力抽气</text>
  </g>

  <!-- Right: Compressed TAR.GZ (Vacuum Sealed Box) -->
  <g transform="translate(970, 180)">
    <rect x="0" y="0" width="550" height="580" rx="16" fill="#111827" stroke="#0284c7" stroke-width="2"/>
    <text x="25" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">3. 真空封口压缩袋中的纸箱</text>
    <text x="25" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#0284c7">压缩 (Compression / .tar.gz 诞生)</text>

    <!-- Vacuum Bag Graphic -->
    <g transform="translate(30, 120)">
      <rect x="0" y="0" width="490" height="230" rx="14" fill="url(#vacuumGrad)" opacity="0.3" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,4"/>
      <!-- Inner Box Shrunk -->
      <rect x="95" y="35" width="300" height="160" rx="10" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="2"/>
      <rect x="150" y="80" width="190" height="60" rx="6" fill="#ffffff" opacity="0.9"/>
      <text x="175" y="118" font-family="monospace" font-size="22" font-weight="bold" fill="#0369a1">project.tar.gz</text>
      <!-- Vacuum Valve -->
      <circle cx="430" cy="50" r="16" fill="#38bdf8"/>
      <text x="422" y="56" font-family="sans-serif" font-size="18" fill="#ffffff">💨</text>
    </g>

    <!-- Clarification on Unpacking -->
    <g transform="translate(25, 380)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">💡 为什么小白解压经常“套娃”？</text>
      <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">很多 Windows 解压工具第一步只剪开了真空袋（去掉 .gz 还原为 .tar）</text>
      <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">于是留在桌面上的是未开箱的纸箱（.tar），需要再点一次解包才能倒出杂物！</text>
    </g>

    <rect x="25" y="470" width="490" height="80" rx="10" fill="#0369a1" opacity="0.3"/>
    <text x="40" y="502" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#7dd3fc">最终体积：28.4 MB (体积锐减 72%！)</text>
    <text x="40" y="530" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#e0f2fe">现代命令一条搞定：tar -xzf project.tar.gz (同时完成剪袋与倒箱)</text>
  </g>
</svg>