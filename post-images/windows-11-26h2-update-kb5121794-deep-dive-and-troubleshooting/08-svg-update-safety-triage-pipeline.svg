<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="480" fill="url(#bg)"/>

  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">Windows 11 26H2 升级避坑安全流水线</text>
  <text x="500" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">五步防御策略：前置补丁核验 ➔ 组件库自检 ➔ BitLocker备份 ➔ USB隔离 ➔ 激活验收</text>

  <!-- 5 Pipeline Steps -->
  <!-- Step 1 -->
  <g transform="translate(30, 110)" filter="url(#cardShadow)">
    <rect width="170" height="300" rx="10" fill="#132039" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="85" cy="40" r="20" fill="#0284c7"/>
    <text x="85" y="46" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">01</text>
    <text x="85" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">前置补丁核查</text>
    <text x="15" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 校验当前系统版本</text>
    <text x="15" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 锁定 24H2/25H2</text>
    <text x="15" y="175" font-family="sans-serif" font-size="12" fill="#34d399">· 确认 KB5124010</text>
    <text x="15" y="200" font-family="sans-serif" font-size="12" fill="#f87171">· 排除 26H1 孤岛</text>
    <text x="15" y="240" font-family="sans-serif" font-size="11" fill="#94a3b8">拦截未达标的直冲，规避安装中途蓝屏。</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 205 260 L 225 260" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 2 -->
  <g transform="translate(230, 110)" filter="url(#cardShadow)">
    <rect width="170" height="300" rx="10" fill="#132039" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="85" cy="40" r="20" fill="#0284c7"/>
    <text x="85" y="46" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">02</text>
    <text x="85" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">WinSxS 组件自检</text>
    <text x="15" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">· DISM ScanHealth</text>
    <text x="15" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 在线修复坏损包</text>
    <text x="15" y="175" font-family="sans-serif" font-size="12" fill="#34d399">· SFC 系统完整性</text>
    <text x="15" y="200" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 清空 SoftwareDist</text>
    <text x="15" y="240" font-family="sans-serif" font-size="11" fill="#94a3b8">彻底杜绝 0x80073712 与下载回滚死循环。</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 405 260 L 425 260" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 3 -->
  <g transform="translate(430, 110)" filter="url(#cardShadow)">
    <rect width="170" height="300" rx="10" fill="#132039" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="85" cy="40" r="20" fill="#0284c7"/>
    <text x="85" y="46" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">03</text>
    <text x="85" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">BitLocker 秘钥护栏</text>
    <text x="15" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 探测加密卷状态</text>
    <text x="15" y="150" font-family="sans-serif" font-size="12" fill="#34d399">· 提取 48 位恢复码</text>
    <text x="15" y="175" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 离线安全导出保存</text>
    <text x="15" y="200" font-family="sans-serif" font-size="12" fill="#f59e0b">· 暂停自动加密策略</text>
    <text x="15" y="240" font-family="sans-serif" font-size="11" fill="#94a3b8">防止升级后 TPM 刷新导致全盘锁死黑屏。</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 605 260 L 625 260" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 4 -->
  <g transform="translate(630, 110)" filter="url(#cardShadow)">
    <rect width="170" height="300" rx="10" fill="#132039" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="85" cy="40" r="20" fill="#0284c7"/>
    <text x="85" y="46" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">04</text>
    <text x="85" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">USB 声卡防护</text>
    <text x="15" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 扫描 Class 1.0 设备</text>
    <text x="15" y="150" font-family="sans-serif" font-size="12" fill="#34d399">· 写入回退注册表项</text>
    <text x="15" y="175" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 隔离老式 DAC/麦</text>
    <text x="15" y="200" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 启用 KIR 兼容补丁</text>
    <text x="15" y="240" font-family="sans-serif" font-size="11" fill="#94a3b8">预防更新后 Code 10 哑音与设置闪退。</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 805 260 L 825 260" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 5 -->
  <g transform="translate(830, 110)" filter="url(#cardShadow)">
    <rect width="140" height="300" rx="10" fill="#0f2b23" stroke="#10b981" stroke-width="2"/>
    <circle cx="70" cy="40" r="20" fill="#10b981"/>
    <text x="70" y="46" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">05</text>
    <text x="70" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">安全激活验收</text>
    <text x="15" y="125" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 执行 eKB 激活</text>
    <text x="15" y="150" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 单次快速重启</text>
    <text x="15" y="175" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 校验 26300 内部版本</text>
    <text x="15" y="200" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 验证 AI 摘要与功能</text>
    <text x="15" y="240" font-family="sans-serif" font-size="11" fill="#6ee7b7">全程自动化闭环，丝滑无感晋升 26H2。</text>
  </g>
</svg>
