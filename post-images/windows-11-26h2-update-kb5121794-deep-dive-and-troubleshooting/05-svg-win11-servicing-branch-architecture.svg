<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0b1528"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="540" fill="url(#bg)"/>

  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">Windows 11 共享服务分支架构与 eKB 激活机制</text>
  <text x="500" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">揭秘 24H2 / 25H2 / 26H2 共享单一代码基，以及为什么 26H1 无法使用小包升级</text>

  <!-- Main Common Trunk -->
  <rect x="80" y="120" width="840" height="150" rx="14" fill="#0f1f38" stroke="#0284c7" stroke-width="2"/>
  <text x="110" y="155" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8">MAIN SERVICING BRANCH (Unified Codebase: Germanium / Cobalt Core)</text>
  <text x="110" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1">24H2、25H2 和 26H2 共享完全相同的基础系统组件、驱动模型和安全内核。</text>

  <!-- Checkpoints inside trunk -->
  <g transform="translate(110, 200)">
    <circle cx="20" cy="20" r="14" fill="#0284c7"/>
    <text x="20" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">24H2</text>
    <text x="45" y="24" font-family="sans-serif" font-size="12" fill="#94a3b8">Build 26100 (底座发布)</text>
  </g>

  <line x1="280" y1="220" x2="350" y2="220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>

  <g transform="translate(360, 200)">
    <circle cx="20" cy="20" r="14" fill="#2563eb"/>
    <text x="20" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">25H2</text>
    <text x="45" y="24" font-family="sans-serif" font-size="12" fill="#94a3b8">Build 26200 (功能休眠池)</text>
  </g>

  <line x1="530" y1="220" x2="600" y2="220" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>

  <g transform="translate(610, 200)">
    <circle cx="20" cy="20" r="16" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <text x="20" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">26H2</text>
    <text x="45" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">Build 26300 (KB5121794 激活)</text>
  </g>

  <!-- Pre-req Box in between -->
  <g transform="translate(80, 310)">
    <rect width="400" height="180" rx="10" fill="#13271f" stroke="#059669" stroke-width="1.5"/>
    <text x="25" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399">关键先决条件：前置补丁 KB5124010</text>
    <text x="25" y="70" font-family="sans-serif" font-size="13" fill="#a7f3d0">· 2026年9月累计安全预备更新 (Baseline CU)</text>
    <text x="25" y="95" font-family="sans-serif" font-size="13" fill="#a7f3d0">· 将 26H2 休眠代码注入系统 WinSxS 组件库</text>
    <text x="25" y="120" font-family="sans-serif" font-size="13" fill="#a7f3d0">· 若缺失该补丁，KB5121794 安装报错 0x80073712</text>
    <text x="25" y="145" font-family="sans-serif" font-size="13" fill="#fef08a">· 必须先更新 KB5124010 才能安全激活！</text>
  </g>

  <!-- The 26H1 Orphan Branch Box -->
  <g transform="translate(520, 310)">
    <rect width="400" height="180" rx="10" fill="#31151a" stroke="#e11d48" stroke-width="1.5"/>
    <text x="25" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fb7185">为什么 Windows 11 26H1 无法升级？</text>
    <text x="25" y="70" font-family="sans-serif" font-size="13" fill="#fecdd3">· 26H1 采用特定 OEM 预装的独立定制内核代码</text>
    <text x="25" y="95" font-family="sans-serif" font-size="13" fill="#fecdd3">· 分支代号不同，不共享 Germanium 主服务通道</text>
    <text x="25" y="120" font-family="sans-serif" font-size="13" fill="#fecdd3">· 无法挂载 KB5121794 激活包（报错 0xC1900101）</text>
    <text x="25" y="145" font-family="sans-serif" font-size="13" fill="#fca5a5">· 解决途径：必须使用 26H2 完整 ISO 镜像覆盖安装！</text>
  </g>
</svg>
