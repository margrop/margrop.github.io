<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#bg)"/>

  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">Windows 11 技术支持生命周期重置矩阵 (2026 年最新排期)</text>
  <text x="500" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">升级 26H2 的最大红利：家用/专业版重置 24 个月，企业/教育版重置 36 个月技术支持寿命</text>

  <!-- Table Header -->
  <g transform="translate(60, 110)">
    <rect width="880" height="45" rx="6" fill="#1e293b"/>
    <text x="30" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">Windows 11 版本</text>
    <text x="210" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">发布日期</text>
    <text x="360" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">Home / Pro 支持终止日</text>
    <text x="590" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">Enterprise / Edu 支持终止日</text>
    <text x="810" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">当前维护状态</text>
  </g>

  <!-- Row 1: 23H2 -->
  <g transform="translate(60, 165)">
    <rect width="880" height="65" rx="6" fill="#1e1b1b" stroke="#7f1d1d" stroke-width="1"/>
    <text x="30" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fca5a5">Version 23H2</text>
    <text x="210" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2023年10月</text>
    <text x="360" y="38" font-family="sans-serif" font-size="13" fill="#f87171">2025年11月 (已终止维护)</text>
    <text x="590" y="38" font-family="sans-serif" font-size="13" fill="#fca5a5">2026年11月 (即将退役)</text>
    <rect x="790" y="18" width="80" height="28" rx="4" fill="#991b1b"/>
    <text x="830" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">紧急淘汰</text>
  </g>

  <!-- Row 2: 24H2 -->
  <g transform="translate(60, 240)">
    <rect width="880" height="65" rx="6" fill="#172554" stroke="#1d4ed8" stroke-width="1"/>
    <text x="30" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#93c5fd">Version 24H2</text>
    <text x="210" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2024年10月</text>
    <text x="360" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2026年10月 (倒计时 1 个月)</text>
    <text x="590" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2027年10月</text>
    <rect x="790" y="18" width="80" height="28" rx="4" fill="#1e40af"/>
    <text x="830" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">建议升级</text>
  </g>

  <!-- Row 3: 25H2 -->
  <g transform="translate(60, 315)">
    <rect width="880" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="30" y="38" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Version 25H2</text>
    <text x="210" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2025年9月</text>
    <text x="360" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2027年10月</text>
    <text x="590" y="38" font-family="sans-serif" font-size="13" fill="#cbd5e1">2028年10月</text>
    <rect x="790" y="18" width="80" height="28" rx="4" fill="#334155"/>
    <text x="830" y="36" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">常规维护</text>
  </g>

  <!-- Row 4: 26H2 (Newest) -->
  <g transform="translate(60, 390)">
    <rect width="880" height="75" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="30" y="44" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399">Version 26H2 (2026 Update)</text>
    <text x="210" y="44" font-family="sans-serif" font-size="13" fill="#d1fae5">2026年9月29日</text>
    <text x="360" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7">2028年10月 (满血 24 个月)</text>
    <text x="590" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7">2029年10月 (满血 36 个月)</text>
    <rect x="790" y="24" width="80" height="28" rx="4" fill="#059669"/>
    <text x="830" y="42" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">最新旗舰</text>
  </g>
</svg>
