<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#182a4d"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="url(#bg)"/>

  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">AI Agent 自动化运维与声明式闭环架构</text>
  <text x="500" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">零信任原则：声明式目标 ➔ 只读预检 ➔ 人工确认 ➔ 幂等执行 ➔ 哈希验收回传</text>

  <!-- 4 Step Boxes -->
  <!-- Box 1: Plan -->
  <g transform="translate(40, 110)">
    <rect width="200" height="300" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="100" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. 声明式配置 (Plan)</text>
    <text x="15" y="75" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 输入 plan.json 规格</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 目标分支: 26H2</text>
    <text x="15" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 依赖补丁: KB5124010</text>
    <text x="15" y="165" font-family="sans-serif" font-size="12" fill="#cbd5e1">· BitLocker: 强制备份</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" fill="#cbd5e1">· USB Audio: 规避模式</text>
    <text x="15" y="240" font-family="monospace" font-size="11" fill="#94a3b8">Declarative Intent: Safe Upgrade</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 260 L 275 260" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Box 2: Preflight -->
  <g transform="translate(280, 110)">
    <rect width="200" height="300" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="100" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">2. 只读预检 (Audit)</text>
    <text x="15" y="75" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 扫描当前系统版本</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 验证 DISM 存储库</text>
    <text x="15" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 侦测外设驱动清单</text>
    <text x="15" y="165" font-family="sans-serif" font-size="12" fill="#34d399">· 产出 Diff 差异报告</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" fill="#f59e0b">· 严禁修改任何系统文件</text>
    <text x="15" y="240" font-family="monospace" font-size="11" fill="#94a3b8">Dry-run ExitCode: 0 (Safe)</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 485 260 L 515 260" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Box 3: Execution -->
  <g transform="translate(520, 110)">
    <rect width="200" height="300" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="100" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">3. 幂等执行 (Action)</text>
    <text x="15" y="75" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 注入 USB 回退键值</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 导出恢复密钥到本地</text>
    <text x="15" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">· 安装补丁 / 触发 eKB</text>
    <text x="15" y="165" font-family="sans-serif" font-size="12" fill="#34d399">· 重复运行不破坏环境</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" fill="#38bdf8">· 记录每一步运行日志</text>
    <text x="15" y="240" font-family="monospace" font-size="11" fill="#94a3b8">Idempotent Execution</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 725 260 L 755 260" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Box 4: Verification -->
  <g transform="translate(760, 110)">
    <rect width="200" height="300" rx="10" fill="#0f2b23" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="35" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">4. 哈希验收 (Verify)</text>
    <text x="15" y="75" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 核验 Build 26300</text>
    <text x="15" y="105" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 设备管理器 0 报警</text>
    <text x="15" y="135" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 生成 SHA256 凭证</text>
    <text x="15" y="165" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 回传结果至控制台</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" fill="#a7f3d0">· 零隐私泄露（IP已脱敏）</text>
    <text x="15" y="240" font-family="monospace" font-size="11" fill="#6ee7b7">Status: VERIFIED_SUCCESS</text>
  </g>
</svg>
