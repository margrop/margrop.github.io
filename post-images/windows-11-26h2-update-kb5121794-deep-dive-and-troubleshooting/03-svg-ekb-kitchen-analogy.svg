<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2647"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="100%" stop-color="#5a2e1b"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3325"/>
      <stop offset="100%" stop-color="#164e37"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#bgGrad)"/>
  
  <!-- Header -->
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">生活大比方：什么是 eKB“轻量激活包”？（小学生秒懂指南）</text>
  <text x="500" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">为什么 26H2 只有几百 KB 却号称“年度大版本”？拆迁重装 vs 撕封条开机</text>

  <!-- Left: Traditional Big OS Upgrade -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="430" height="360" rx="12" fill="url(#orangeCard)" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="430" height="42" rx="12" fill="#ea580c" fill-opacity="0.25"/>
    <text x="215" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffedd5" text-anchor="middle">传统大版本升级（如 23H2 到 24H2）</text>
    
    <text x="25" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#fdba74">形象打比方：全家搬空，厨房砸墙重新精装</text>
    <text x="25" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#fed7aa">· 搬运几十袋水泥黄沙（5GB 以上巨型安装镜像）</text>
    <text x="25" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#fed7aa">· 整个家停水停电 40 分钟，不能做饭不能睡觉</text>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#fed7aa">· 装修工人把所有橱柜、下水管道连根拔起换一遍</text>
    <text x="25" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#fed7aa">· 风险高：可能碰坏水管，稍有不慎就漏水返工</text>

    <!-- Visual icon box -->
    <rect x="25" y="210" width="380" height="125" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1"/>
    <text x="40" y="235" font-family="monospace" font-size="12" fill="#fb923c">OS Kernel Architecture: Replaced</text>
    <text x="40" y="258" font-family="monospace" font-size="12" fill="#fdba74">Download Size: ~4.8 GB - 6.2 GB</text>
    <text x="40" y="281" font-family="monospace" font-size="12" fill="#fdba74">Downtime: 25 - 60 minutes (Multiple Reboots)</text>
    <text x="40" y="304" font-family="monospace" font-size="12" fill="#fca5a5">Servicing Branch: Broken / New Major Branch</text>
  </g>

  <!-- Right: 26H2 Enablement Package -->
  <g transform="translate(530, 110)" filter="url(#shadow)">
    <rect width="430" height="360" rx="12" fill="url(#greenCard)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="430" height="42" rx="12" fill="#10b981" fill-opacity="0.25"/>
    <text x="215" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#d1fae5" text-anchor="middle">26H2 激活包升级（KB5121794 eKB）</text>

    <text x="25" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#6ee7b7">形象打比方：撕掉智能电磁炉上的封条按开机键</text>
    <text x="25" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a7f3d0">· 过去一年每月的例行小补丁早就把零件搬进来了</text>
    <text x="25" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a7f3d0">· 电磁炉早就装在台面上，只是开关被封条胶带贴住了</text>
    <text x="25" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a7f3d0">· KB5121794 只有 180 KB，就是手指撕掉胶带按了一下</text>
    <text x="25" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a7f3d0">· 翻车原因：如果电箱空开（KB5124010）没合上，按开关会跳闸！</text>

    <!-- Visual icon box -->
    <rect x="25" y="210" width="380" height="125" rx="8" fill="#062e22" stroke="#047857" stroke-width="1"/>
    <text x="40" y="235" font-family="monospace" font-size="12" fill="#34d399">OS Servicing Branch: Shared with 24H2/25H2</text>
    <text x="40" y="258" font-family="monospace" font-size="12" fill="#6ee7b7">Download Size: ~180 KB (Just Registry Bits)</text>
    <text x="40" y="281" font-family="monospace" font-size="12" fill="#6ee7b7">Downtime: 2 - 3 minutes (Single Fast Restart)</text>
    <text x="40" y="304" font-family="monospace" font-size="12" fill="#a7f3d0">Prerequisite: KB5124010 Baseline Installed</text>
  </g>
</svg>
