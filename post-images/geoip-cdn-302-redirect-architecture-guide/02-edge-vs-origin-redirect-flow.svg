<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg02)" rx="16"/>
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Title -->
  <g transform="translate(600, 45)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#f8fafc">
      ⚡ 架构时延对比：传统源站 302 调度 vs CDN 边缘无损 302 调度
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#94a3b8">
      跨洋 TCP+TLS 往返瓶颈 vs 边缘就近纳秒级判断与 HTTP 302 截断
    </text>
  </g>

  <!-- Left Half: Origin-based 302 (Slow) -->
  <g transform="translate(50, 100)">
    <rect width="520" height="540" rx="14" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="520" height="42" rx="14" fill="#7f1d1d"/>
    <text x="260" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#fef2f2" text-anchor="middle">❌ 传统方案：回源后由源站执行 302 调度</text>

    <!-- Lifelines -->
    <text x="70" y="75" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">终端 Client</text>
    <line x1="70" y1="85" x2="70" y2="450" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="260" y="75" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">CDN Edge</text>
    <line x1="260" y1="85" x2="260" y2="450" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="440" y="75" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">Origin (跨洋源站)</text>
    <line x1="440" y1="85" x2="440" y2="450" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Arrows -->
    <!-- Step 1 -->
    <line x1="70" y1="120" x2="260" y2="135" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="120" font-size="12" fill="#cbd5e1" text-anchor="middle">1. GET / (无缓存)</text>

    <!-- Step 2 -->
    <line x1="260" y1="150" x2="440" y2="190" stroke="#ef4444" stroke-width="2"/>
    <text x="350" y="165" font-size="12" fill="#fca5a5" text-anchor="middle">2. 跨洋回源 (180ms)</text>

    <!-- Step 3 -->
    <rect x="425" y="195" width="30" height="30" fill="#b45309" rx="4"/>
    <text x="440" y="215" font-size="10" fill="#fff" text-anchor="middle">Geo</text>

    <!-- Step 4 -->
    <line x1="440" y1="240" x2="260" y2="280" stroke="#fbbf24" stroke-width="2"/>
    <text x="350" y="255" font-size="12" fill="#fef08a" text-anchor="middle">3. 302 -> /zh-cn/</text>

    <!-- Step 5 -->
    <line x1="260" y1="290" x2="70" y2="305" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="290" font-size="12" fill="#cbd5e1" text-anchor="middle">4. 转发 302</text>

    <!-- Step 6 -->
    <line x1="70" y1="340" x2="260" y2="355" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="340" font-size="12" fill="#cbd5e1" text-anchor="middle">5. 跟随跳转: GET /zh-cn/</text>

    <!-- Step 7 -->
    <line x1="260" y1="370" x2="70" y2="385" stroke="#10b981" stroke-width="2"/>
    <text x="165" y="370" font-size="12" fill="#86efac" text-anchor="middle">6. 200 OK 页面呈现</text>

    <!-- Bottom Metric Box -->
    <rect x="30" y="450" width="460" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="45" y="475" font-size="14" font-weight="700" fill="#fca5a5">累计首屏开销：2 次 RTT + 跨洋握手 (≈ 480ms ~ 650ms)</text>
    <text x="45" y="500" font-size="12" fill="#94a3b8">源站每秒承载上万次重定向请求，服务器 CPU 与带宽被白白榨干</text>
  </g>

  <!-- Right Half: Edge-based 302 (Ultra Fast) -->
  <g transform="translate(630, 100)">
    <rect width="520" height="540" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <rect width="520" height="42" rx="14" fill="#065f46"/>
    <text x="260" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ecfdf5" text-anchor="middle">✅ 进阶方案：CDN 边缘计算直接截断 302 调度</text>

    <!-- Lifelines -->
    <text x="90" y="75" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">终端 Client</text>
    <line x1="90" y1="85" x2="90" y2="450" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="320" y="75" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">CDN Edge (Workers / Rules)</text>
    <line x1="320" y1="85" x2="320" y2="450" stroke="#475569" stroke-width="1" stroke-dasharray="4,4"/>

    <text x="460" y="75" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">Origin</text>
    <line x1="460" y1="85" x2="460" y2="450" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Step 1 -->
    <line x1="90" y1="130" x2="320" y2="150" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="135" font-size="12" fill="#cbd5e1" text-anchor="middle">1. GET / (就近 Anycast 节点)</text>

    <!-- Edge Computation (Workers) -->
    <rect x="300" y="155" width="40" height="40" fill="#0284c7" rx="6"/>
    <text x="320" y="180" font-size="11" fill="#fff" text-anchor="middle">Edge</text>

    <!-- Step 2: Instant 302 -->
    <line x1="320" y1="210" x2="90" y2="230" stroke="#fbbf24" stroke-width="2"/>
    <text x="200" y="215" font-size="12" fill="#fde047" text-anchor="middle">2. 边缘秒回 302 (CF-IPCountry=CN)</text>

    <!-- Step 3: Follow Redirect to Edge Cache -->
    <line x1="90" y1="270" x2="320" y2="290" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="275" font-size="12" fill="#cbd5e1" text-anchor="middle">3. 跟随跳转: GET /zh-cn/</text>

    <!-- Step 4: Edge Cache Hit -->
    <line x1="320" y1="320" x2="90" y2="340" stroke="#10b981" stroke-width="2"/>
    <text x="200" y="325" font-size="12" fill="#86efac" text-anchor="middle">4. 200 OK (边缘缓存命中 HIT)</text>

    <!-- Zero Origin Marker -->
    <circle cx="460" cy="240" r="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="460" y="245" font-size="12" fill="#94a3b8" text-anchor="middle">0%</text>
    <text x="460" y="275" font-size="11" fill="#64748b" text-anchor="middle">源站零负载</text>

    <!-- Bottom Metric Box -->
    <rect x="30" y="450" width="460" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="45" y="475" font-size="14" font-weight="700" fill="#86efac">累计首屏开销：全链路边缘收敛 (≈ 15ms ~ 35ms)</text>
    <text x="45" y="500" font-size="12" fill="#94a3b8">首屏提速 1500%！源站回源流量彻底归零，完美防御 CC 刷流量</text>
  </g>
</svg>
