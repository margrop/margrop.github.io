<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg01)" rx="16"/>
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Title Header -->
  <g transform="translate(600, 50)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">
      🏪 核心概念生活大比方：跨国连锁超市、社区前置店与导购指示牌
    </text>
    <text y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#94a3b8">
      让小学生也能彻底看懂源站、CDN 边缘、GeoIP 识别与 302 重定向的协作关系
    </text>
  </g>

  <!-- 4 Cards Grid -->
  <!-- Card 1: Origin Server -->
  <g transform="translate(60, 110)">
    <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#334155"/>
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">🏢 跨国总部 (源站 Origin)</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">实体位置：远在海外总仓</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 存放全部商品与核心数据库</text>
    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 亲自服务每个客人：漂洋过海</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 缺点：来回跑断腿 (200ms+)</text>
    <text x="20" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">对应技术：中央应用服务器 / DB</text>
  </g>

  <!-- Card 2: CDN Edge -->
  <g transform="translate(340, 110)">
    <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#0369a1"/>
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">🏪 社区前置仓 (CDN 边缘)</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">实体位置：就在家门口 500 米</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 提前囤积好爆款零食 (静态缓存)</text>
    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 邻居下楼一抬腿就买到 (5ms)</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 总部进货一次，造福整个小区</text>
    <text x="20" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#7dd3fc">对应技术：Cloudflare / Edge PoP</text>
  </g>

  <!-- Card 3: GeoIP -->
  <g transform="translate(620, 110)">
    <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#b45309"/>
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">📮 快递邮编分拣 (GeoIP)</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">核心作用：看你来自哪个省市区</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 凭门牌邮编辨别访客大体位置</text>
    <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 遇到代收转运点可能“认错家门”</text>
    <text x="20" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 必须定期翻新邮编大词典</text>
    <text x="20" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#fde68a">对应技术：MaxMind GeoIP2 / MMDB</text>
  </g>

  <!-- Card 4: 302 Redirect -->
  <g transform="translate(900, 110)">
    <rect width="240" height="240" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="240" height="42" rx="12" fill="#9d174d"/>
    <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">🪧 门口导购指示牌 (302)</text>
    <text x="16" y="75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#f472b6">调度法则：临时通知你去哪买</text>
    <text x="16" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 301 永久搬迁：“老店彻底关门”</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 302 临时调度：“今天可乐在2号柜”</text>
    <text x="16" y="155" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">· 明天可能换位置，顾客必须每次问</text>
    <text x="16" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#fbcfe8">对应技术：HTTP 302 Found (Location)</text>
  </g>

  <!-- Big Disaster Section (Bottom) -->
  <g transform="translate(60, 390)">
    <rect width="1080" height="240" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="2"/>
    <rect width="1080" height="44" rx="14" fill="#7f1d1d"/>
    <text x="540" y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#fef2f2" text-anchor="middle">
      🚨 致命翻车惨案：偷懒店员复印指示牌贴死在大门上（CDN 缓存 302 导致的全球死循环）
    </text>

    <!-- Step 1 -->
    <g transform="translate(40, 70)">
      <circle cx="20" cy="20" r="18" fill="#ef4444" opacity="0.2"/>
      <text x="20" y="26" font-size="16" font-weight="800" fill="#f87171" text-anchor="middle">1</text>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">早上来了一位美国客人</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">导购员给写了张小纸条：<tspan fill="#fbbf24">“请走左侧英语专柜通道” (302 -> /us/)</tspan></text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(40, 125)">
      <circle cx="20" cy="20" r="18" fill="#ef4444" opacity="0.2"/>
      <text x="20" y="26" font-size="16" font-weight="800" fill="#f87171" text-anchor="middle">2</text>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">前台值班经理 (CDN) 偷懒把纸条复印贴死</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">没有标明适用范围 (未设置 Vary)，直接将纸条焊死在大门口！<tspan fill="#f87171">缓存命中 (HIT)</tspan></text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(560, 70)">
      <circle cx="20" cy="20" r="18" fill="#ef4444" opacity="0.2"/>
      <text x="20" y="26" font-size="16" font-weight="800" fill="#f87171" text-anchor="middle">3</text>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">下午中国大爷进门买酱油</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">一进门看到焊死的纸条，被强行推到英语专柜；专柜又让大爷回门口找中文柜</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(560, 125)">
      <circle cx="20" cy="20" r="18" fill="#ef4444" opacity="0.2"/>
      <text x="20" y="26" font-size="16" font-weight="800" fill="#f87171" text-anchor="middle">4</text>
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fca5a5">大爷在大门口和专柜之间狂奔 20 趟</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">最后累趴在地口吐白沫：<tspan font-family="monospace" fill="#f87171" font-weight="700">ERR_TOO_MANY_REDIRECTS</tspan></text>
    </g>

    <!-- Fix Banner inside disaster box -->
    <rect x="30" y="180" width="1020" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="540" y="205" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">
      💡 解法：加装智能展示柜 (Vary: CF-IPCountry) 或 禁止前台缓存 (Cache-Control: private, no-store)
    </text>
  </g>
</svg>
