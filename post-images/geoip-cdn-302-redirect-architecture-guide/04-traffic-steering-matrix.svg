<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg04)" rx="16"/>
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Header -->
  <g transform="translate(600, 45)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#f8fafc">
      🗺️ 全球就近调度四大技术路线横向技术矩阵
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#94a3b8">
      GeoDNS、Anycast BGP、CDN 边缘 302 重定向与客户端软引导的优劣与场景权衡
    </text>
  </g>

  <!-- Table Header -->
  <g transform="translate(60, 95)">
    <rect width="1080" height="50" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="140" y="31" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">技术路线</text>
    <text x="360" y="31" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">生效层级与实现机制</text>
    <text x="560" y="31" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">首屏额外 RTT</text>
    <text x="750" y="31" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">缓存友好度 / 风险</text>
    <text x="960" y="31" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">推荐适用业务场景</text>
  </g>

  <!-- Row 1: GeoDNS -->
  <g transform="translate(60, 155)">
    <rect width="1080" height="110" rx="8" fill="#111827" stroke="#334155"/>
    <text x="140" y="45" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">GeoDNS</text>
    <text x="140" y="72" font-size="12" fill="#94a3b8" text-anchor="middle">RFC 7871 (ECS)</text>

    <text x="260" y="40" font-size="13" fill="#e2e8f0">· L4 域名解析层分流</text>
    <text x="260" y="65" font-size="13" fill="#e2e8f0">· 权威 DNS 按解析器 IP 返回记录</text>
    <text x="260" y="90" font-size="13" fill="#94a3b8">· 依赖公共 DNS 转发 EDNS 客户端网段</text>

    <text x="560" y="60" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">0 RTT</text>
    <text x="560" y="80" font-size="11" fill="#94a3b8" text-anchor="middle">(建联前完成)</text>

    <text x="660" y="45" font-size="12" fill="#cbd5e1">· 极高缓存命中</text>
    <text x="660" y="70" font-size="12" fill="#f59e0b">· 易受 LocalDNS 污染</text>
    <text x="660" y="92" font-size="12" fill="#f59e0b">· TTL 刷新有滞后</text>

    <text x="870" y="45" font-size="12" fill="#e2e8f0">· 跨国多机房统一域名</text>
    <text x="870" y="70" font-size="12" fill="#e2e8f0">· 游戏网关与 API 入口</text>
    <text x="870" y="92" font-size="12" fill="#38bdf8">· 多云双活主备切换</text>
  </g>

  <!-- Row 2: Anycast BGP -->
  <g transform="translate(60, 275)">
    <rect width="1080" height="110" rx="8" fill="#111827" stroke="#334155"/>
    <text x="140" y="45" font-size="16" font-weight="800" fill="#a855f7" text-anchor="middle">Anycast BGP</text>
    <text x="140" y="72" font-size="12" fill="#94a3b8" text-anchor="middle">网络层物理路由</text>

    <text x="260" y="40" font-size="13" fill="#e2e8f0">· L3 路由协议层宣告</text>
    <text x="260" y="65" font-size="13" fill="#e2e8f0">· 全球数百机房共享同一 IP</text>
    <text x="260" y="90" font-size="13" fill="#94a3b8">· 路由器通过 AS-Path 自动寻找近点</text>

    <text x="560" y="60" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">0 RTT</text>
    <text x="560" y="80" font-size="11" fill="#94a3b8" text-anchor="middle">(路由级天然就近)</text>

    <text x="660" y="45" font-size="12" fill="#cbd5e1">· 无应用层缓存污染</text>
    <text x="660" y="70" font-size="12" fill="#f59e0b">· 长连接容易 BGP 抖动</text>
    <text x="660" y="92" font-size="12" fill="#f59e0b">· 无法感知上层业务状态</text>

    <text x="870" y="45" font-size="12" fill="#e2e8f0">· 全球顶级 CDN 基础网</text>
    <text x="870" y="70" font-size="12" fill="#e2e8f0">· Cloudflare / 1.1.1.1</text>
    <text x="870" y="92" font-size="12" fill="#a855f7">· 高防抗 DDoS 清洗中心</text>
  </g>

  <!-- Row 3: Edge 302 -->
  <g transform="translate(60, 395)">
    <rect width="1080" height="110" rx="8" fill="#111827" stroke="#334155"/>
    <text x="140" y="45" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle">边缘 302 重定向</text>
    <text x="140" y="72" font-size="12" fill="#94a3b8" text-anchor="middle">HTTP 应用层调度</text>

    <text x="260" y="40" font-size="13" fill="#e2e8f0">· L7 HTTP 协议控制</text>
    <text x="260" y="65" font-size="13" fill="#e2e8f0">· CDN 边缘脚本直接判定 GeoIP</text>
    <text x="260" y="90" font-size="13" fill="#94a3b8">· 秒发 Location 响应头分流</text>

    <text x="560" y="60" font-size="14" font-weight="700" fill="#f59e0b" text-anchor="middle">+1 RTT</text>
    <text x="560" y="80" font-size="11" fill="#86efac" text-anchor="middle">(仅需 15ms 边缘跳)</text>

    <text x="660" y="45" font-size="12" fill="#cbd5e1">· 需严格配置 Vary 头</text>
    <text x="660" y="70" font-size="12" fill="#ef4444">· 误设易引发死循环</text>
    <text x="660" y="92" font-size="12" fill="#86efac">· 调度精度最高，支持多参数</text>

    <text x="870" y="45" font-size="12" fill="#e2e8f0">· 跨国多语言多国家门户</text>
    <text x="870" y="70" font-size="12" fill="#e2e8f0">· 大文件及镜像站下载分流</text>
    <text x="870" y="92" font-size="12" fill="#fbbf24">· 合规访问控制与区域封禁</text>
  </g>

  <!-- Row 4: Client-side Banner -->
  <g transform="translate(60, 515)">
    <rect width="1080" height="110" rx="8" fill="#111827" stroke="#334155"/>
    <text x="140" y="45" font-size="16" font-weight="800" fill="#10b981" text-anchor="middle">客户端软引导</text>
    <text x="140" y="72" font-size="12" fill="#94a3b8" text-anchor="middle">非阻断式气泡提示</text>

    <text x="260" y="40" font-size="13" fill="#e2e8f0">· 前端 JS / 浏览器层</text>
    <text x="260" y="65" font-size="13" fill="#e2e8f0">· 页面正常加载，异步检测地理位置</text>
    <text x="260" y="90" font-size="13" fill="#94a3b8">· 弹出“是否切换至中国站？”悬浮条</text>

    <text x="560" y="60" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">0 阻塞</text>
    <text x="560" y="80" font-size="11" fill="#94a3b8" text-anchor="middle">(首屏秒开)</text>

    <text x="660" y="45" font-size="12" fill="#86efac">· 零缓存污染风险</text>
    <text x="660" y="70" font-size="12" fill="#86efac">· SEO 友好度最高 (100分)</text>
    <text x="660" y="92" font-size="12" fill="#86efac">· 尊重用户自主选择权</text>

    <text x="870" y="45" font-size="12" fill="#e2e8f0">· 苹果/微软等现代官方商城</text>
    <text x="870" y="70" font-size="12" fill="#e2e8f0">· 跨境电商出海独立站</text>
    <text x="870" y="92" font-size="12" fill="#10b981">· 全球化 SaaS 统一官网</text>
  </g>
</svg>
