<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#spaceBg)"/>

  <!-- Cybernetic Grid & Routing Orbits -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <circle cx="800" cy="450" r="160" fill="none" stroke-dasharray="6,8"/>
    <circle cx="800" cy="450" r="280" fill="none" stroke-dasharray="10,10"/>
    <circle cx="800" cy="450" r="420" fill="none" stroke-dasharray="14,14"/>
    <circle cx="800" cy="450" r="560" fill="none" stroke-dasharray="18,18"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
  </g>

  <!-- Title Badge & Typography -->
  <g transform="translate(800, 110)" text-anchor="middle">
    <rect x="-240" y="-32" width="480" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#38bdf8" letter-spacing="2">
      RFC 9110 · MaxMind MMDB · Anycast BGP · Edge Compute
    </text>
    <text y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="50" font-weight="900" fill="#f8fafc" letter-spacing="1">
      GEO IP · CDN · 302 重定向全链路深潜
    </text>
    <text y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" fill="#94a3b8">
      从无限重定向死循环、CDN 缓存污染到精准就近调度与真实 IP 穿透实战
    </text>
  </g>

  <!-- Central Visual: Global Traffic Flow & 302 Steering Hub -->
  <!-- Center Core Hub -->
  <g transform="translate(800, 470)">
    <circle cx="0" cy="0" r="90" fill="#111827" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="75" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">CDN EDGE</text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="900" fill="#fbbf24" text-anchor="middle">HTTP 302</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">GeoIP Steering</text>
  </g>

  <!-- Left: Client Ingress with GeoIP Tags -->
  <g transform="translate(260, 470)">
    <rect x="-140" y="-130" width="280" height="260" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="-140" y="-130" width="280" height="50" rx="16" fill="#1e293b"/>
    <text x="0" y="-98" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" text-anchor="middle">🌐 全球多地域访客终端</text>
    
    <!-- User A -->
    <g transform="translate(-110, -50)">
      <circle cx="15" cy="15" r="14" fill="#38bdf8" opacity="0.2"/>
      <text x="15" y="21" font-size="16" text-anchor="middle">🇺🇸</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">北美访客 Client_US</text>
      <text x="40" y="32" font-family="monospace" font-size="12" fill="#38bdf8">IP: 198.51.100.*** (US)</text>
    </g>

    <!-- User B -->
    <g transform="translate(-110, 10)">
      <circle cx="15" cy="15" r="14" fill="#f43f5e" opacity="0.2"/>
      <text x="15" y="21" font-size="16" text-anchor="middle">🇯🇵</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">东亚访客 Client_JP</text>
      <text x="40" y="32" font-family="monospace" font-size="12" fill="#f43f5e">IP: 203.0.113.*** (JP)</text>
    </g>

    <!-- User C -->
    <g transform="translate(-110, 70)">
      <circle cx="15" cy="15" r="14" fill="#10b981" opacity="0.2"/>
      <text x="15" y="21" font-size="16" text-anchor="middle">🇩🇪</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">欧洲访客 Client_EU</text>
      <text x="40" y="32" font-family="monospace" font-size="12" fill="#10b981">IP: 192.0.2.*** (DE)</text>
    </g>
  </g>

  <!-- Right: Target Regional Stacks / Buckets -->
  <g transform="translate(1340, 470)">
    <rect x="-140" y="-130" width="280" height="260" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="-140" y="-130" width="280" height="50" rx="16" fill="#1e293b"/>
    <text x="0" y="-98" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" text-anchor="middle">🎯 目标就近集群 / 内容桶</text>
    
    <g transform="translate(-110, -50)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">/en-us/ · SJC Bucket</text>
    </g>

    <g transform="translate(-110, 10)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#f43f5e">/ja-jp/ · NRT Edge</text>
    </g>

    <g transform="translate(-110, 70)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#10b981">/de-de/ · FRA Cluster</text>
    </g>
  </g>

  <!-- Connecting Stream Lines & Badges -->
  <!-- Left to Center -->
  <path d="M 400 470 L 710 470" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="8,6"/>
  <!-- Center to Right Beams -->
  <path d="M 890 440 Q 1040 370 1200 440" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 890 470 L 1200 480" stroke="#f43f5e" stroke-width="3" fill="none"/>
  <path d="M 890 500 Q 1040 570 1200 540" stroke="#10b981" stroke-width="3" fill="none"/>

  <!-- Lower Architecture Highlights -->
  <g transform="translate(800, 740)">
    <rect x="-560" y="-45" width="1120" height="90" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(-480, 0)">
      <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">⚡ 边缘就近调度</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">毫秒级识别 Egress IP · 0 往返穿透</text>
    </g>
    <line x1="-190" y1="-30" x2="-190" y2="30" stroke="#334155" stroke-width="1"/>
    <g transform="translate(-140, 0)">
      <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#ec4899">🛡️ 击碎 302 循环与缓存污染</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Vary: CF-IPCountry · 状态码锁死保护</text>
    </g>
    <line x1="170" y1="-30" x2="170" y2="30" stroke="#334155" stroke-width="1"/>
    <g transform="translate(220, 0)">
      <text x="0" y="-8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">🔍 真实客户端 IP 还原</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">X-Forwarded-For · Nginx realip 模块</text>
    </g>
  </g>
</svg>
