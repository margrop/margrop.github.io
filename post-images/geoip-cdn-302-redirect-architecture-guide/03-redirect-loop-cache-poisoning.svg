<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg03)" rx="16"/>
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <!-- Title -->
  <g transform="translate(600, 45)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#f8fafc">
      💥 事故复盘：缺少 Vary 头导致的 CDN 缓存污染与无限 302 死循环
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#f87171">
      当 Cache-Key 仅包含 URI，首个访客的重定向响应将成为全网灾难
    </text>
  </g>

  <!-- Flowchart Stages -->
  <!-- Stage 1 -->
  <g transform="translate(60, 105)">
    <rect width="250" height="420" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="250" height="40" rx="12" fill="#1d4ed8"/>
    <text x="125" y="26" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">阶段 1：美区访客初次请求</text>

    <text x="15" y="70" font-family="sans-serif" font-size="13" fill="#cbd5e1">· 访客 IP: <tspan font-family="monospace" fill="#38bdf8">198.51.100.***</tspan></text>
    <text x="15" y="95" font-family="sans-serif" font-size="13" fill="#cbd5e1">· 请求 URI: <tspan font-family="monospace" fill="#e2e8f0">/</tspan></text>
    <text x="15" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">· CDN 节点状态: <tspan fill="#38bdf8">MISS</tspan></text>
    <text x="15" y="150" font-family="sans-serif" font-size="13" fill="#cbd5e1">· 回源至 Origin Server</text>

    <!-- Box inside -->
    <rect x="15" y="190" width="220" height="190" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="215" font-family="monospace" font-size="12" font-weight="700" fill="#86efac">HTTP/2 302 Found</text>
    <text x="25" y="240" font-family="monospace" font-size="12" fill="#f472b6">Location: /en-us/</text>
    <text x="25" y="265" font-family="monospace" font-size="11" fill="#f87171">Cache-Control: public, 3600</text>
    <text x="25" y="290" font-family="monospace" font-size="11" fill="#ef4444; text-decoration: line-through">Vary: (缺失!)</text>
    <text x="25" y="325" font-family="sans-serif" font-size="11" fill="#94a3b8">源站判定访客为美区</text>
    <text x="25" y="345" font-family="sans-serif" font-size="11" fill="#94a3b8">发出针对性 302 跳转</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 320 300 L 350 300" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(360, 105)">
    <rect width="240" height="420" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="240" height="40" rx="12" fill="#b45309"/>
    <text x="120" y="26" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">阶段 2：CDN 脏缓存固化</text>

    <text x="15" y="70" font-family="sans-serif" font-size="13" fill="#cbd5e1">· CDN 默认 Cache-Key 规则:</text>
    <rect x="15" y="85" width="210" height="30" rx="4" fill="#0f172a"/>
    <text x="25" y="105" font-family="monospace" font-size="11" fill="#38bdf8">${scheme}://${host}${uri}</text>

    <text x="15" y="145" font-family="sans-serif" font-size="13" fill="#fca5a5">⚠️ 致命诱因：</text>
    <text x="15" y="170" font-family="sans-serif" font-size="12" fill="#cbd5e1">Cache-Key 里只有 "/"</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" fill="#cbd5e1">没有包含国家或 IP 信息！</text>

    <rect x="15" y="230" width="210" height="150" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="25" y="255" font-family="sans-serif" font-size="13" font-weight="700" fill="#fca5a5">🪤 毒苹果已生成：</text>
    <text x="25" y="280" font-family="sans-serif" font-size="12" fill="#fecaca">任何请求 "/" 的人，</text>
    <text x="25" y="305" font-family="sans-serif" font-size="12" fill="#fecaca">无论是东京、伦敦、上海，</text>
    <text x="25" y="330" font-family="sans-serif" font-size="12" font-weight="700" fill="#ef4444">统统无脑分发 302 -> /en-us/</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 610 300 L 640 300" stroke="#ef4444" stroke-width="3"/>

  <!-- Stage 3 -->
  <g transform="translate(650, 105)">
    <rect width="250" height="420" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="250" height="40" rx="12" fill="#991b1b"/>
    <text x="125" y="26" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">阶段 3：亚太访客被误伤</text>

    <text x="15" y="70" font-family="sans-serif" font-size="13" fill="#cbd5e1">· 东京访客 IP: <tspan font-family="monospace" fill="#f43f5e">203.0.113.***</tspan></text>
    <text x="15" y="95" font-family="sans-serif" font-size="13" fill="#cbd5e1">· 请求 URI: <tspan font-family="monospace" fill="#e2e8f0">/</tspan></text>
    <text x="15" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">· CDN 状态: <tspan fill="#86efac" font-weight="700">HIT (命中脏缓存)</tspan></text>

    <rect x="15" y="155" width="220" height="110" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="25" y="180" font-family="monospace" font-size="12" fill="#f87171">HTTP/2 302 Found</text>
    <text x="25" y="205" font-family="monospace" font-size="12" fill="#fbbf24">Location: /en-us/</text>
    <text x="25" y="230" font-family="monospace" font-size="11" fill="#86efac">CF-Cache-Status: HIT</text>

    <text x="15" y="290" font-family="sans-serif" font-size="13" fill="#fca5a5">访客被迫重定向到 /en-us/</text>
    <text x="15" y="315" font-family="sans-serif" font-size="12" fill="#cbd5e1">但访客浏览器语言与国家是 JP</text>
    <text x="15" y="340" font-family="sans-serif" font-size="12" fill="#cbd5e1">站点应用路由再次介入纠错...</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 910 300 L 940 300" stroke="#dc2626" stroke-width="3"/>

  <!-- Stage 4 -->
  <g transform="translate(950, 105)">
    <rect width="200" height="420" rx="12" fill="#18181b" stroke="#b91c1c" stroke-width="2"/>
    <rect width="200" height="40" rx="12" fill="#450a0a"/>
    <text x="100" y="26" font-family="sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">阶段 4：死循环崩溃</text>

    <text x="15" y="75" font-family="sans-serif" font-size="12" fill="#cbd5e1">1. 访问 /</text>
    <text x="15" y="95" font-family="sans-serif" font-size="12" fill="#fca5a5">-> 命中 302 到 /en-us/</text>
    <text x="15" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">2. 访问 /en-us/</text>
    <text x="15" y="145" font-family="sans-serif" font-size="12" fill="#fca5a5">-> 应用判定JP，302到 /</text>
    <text x="15" y="175" font-family="sans-serif" font-size="12" fill="#cbd5e1">3. 再次访问 /</text>
    <text x="15" y="195" font-family="sans-serif" font-size="12" fill="#fca5a5">-> 又被踢到 /en-us/...</text>

    <rect x="15" y="240" width="170" height="140" rx="8" fill="#7f1d1d" stroke="#f87171"/>
    <text x="85" y="275" font-family="sans-serif" font-size="30" text-anchor="middle">🛑</text>
    <text x="85" y="315" font-family="monospace" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">ERR_TOO_MANY_</text>
    <text x="85" y="335" font-family="monospace" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">REDIRECTS</text>
    <text x="85" y="360" font-family="sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">浏览器跳出 20 次上限</text>
  </g>

  <!-- Bottom Resolution Footer -->
  <g transform="translate(60, 550)">
    <rect width="1090" height="95" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#86efac">
      🛠️ 根本解法与双保险防御 (RFC 9110 标准实践)：
    </text>
    <text x="30" y="58" font-family="sans-serif" font-size="13" fill="#cbd5e1">
      ① 响应头必须携带 <tspan font-family="monospace" fill="#38bdf8" font-weight="700">Vary: Accept-Encoding, CF-IPCountry</tspan>（强制 CDN 按国家细分缓存桶，杜绝一刀切）
    </text>
    <text x="30" y="80" font-family="sans-serif" font-size="13" fill="#cbd5e1">
      ② 重定向响应强制设置 <tspan font-family="monospace" fill="#fbbf24" font-weight="700">Cache-Control: private, no-cache, no-store</tspan>，或在 CDN 规则中配置 <tspan font-family="monospace" fill="#fbbf24">Edge Cache TTL = 0 for 302</tspan>
    </text>
  </g>
</svg>
