<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;">
  <text x="600" y="50" fill="#f8fafc" font-size="25" font-weight="800" text-anchor="middle">解剖一笔 .COM 域名续费账单：钱究竟进了谁的口袋？</text>
  <text x="600" y="80" fill="#94a3b8" font-size="14" text-anchor="middle">对比零加价服务商 vs 坐地起价商家的底层成本解构 (以 2026 年 11 月 1 日新标准核算)</text>

  <!-- Left: Honest Registrar (Cloudflare) -->
  <rect x="80" y="120" width="480" height="480" rx="14" fill="#111c2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="100" y="140" width="190" height="28" rx="6" fill="#0284c7"/>
  <text x="195" y="159" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">良心批发模式 (Cloudflare)</text>
  
  <text x="100" y="210" fill="#f8fafc" font-size="32" font-weight="800">$11.17 <span style="font-size:16px;color:#94a3b8;font-weight:400;">/ 年 (到手总价)</span></text>
  <text x="100" y="235" fill="#38bdf8" font-size="13">零加价直供 · 免费隐私保护 · 零隐藏扣费</text>

  <!-- Stack bar -->
  <rect x="100" y="260" width="440" height="110" rx="8" fill="#e11d48"/>
  <text x="320" y="315" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Verisign 垄断批发费：$10.97 (占比 98.2%)</text>
  <text x="320" y="340" fill="#fecdd3" font-size="12" text-anchor="middle">所有注册商必须向 Verisign 缴纳的法定刚性成本</text>

  <rect x="100" y="375" width="440" height="35" rx="6" fill="#6366f1"/>
  <text x="320" y="398" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">ICANN 规费：$0.20 (占比 1.8%)</text>

  <rect x="100" y="415" width="440" height="35" rx="6" fill="#10b981"/>
  <text x="320" y="438" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">注册商加价：$0.00 (0% 纯公益批发)</text>

  <rect x="100" y="470" width="440" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="120" y="500" fill="#f8fafc" font-size="13" font-weight="700">💡 为什么 Cloudflare 能做到零加价？</text>
  <text x="120" y="525" fill="#cbd5e1" font-size="12">域名作为“引流抓手”，目的是将开发者沉淀到其 CDN、WAF、Workers 等生态</text>
  <text x="120" y="548" fill="#cbd5e1" font-size="12">对开发者而言是最纯粹、最透明的永久避风港。</text>

  <!-- Right: Overpricing Registrar (GoDaddy / NameSilo Standard) -->
  <rect x="640" y="120" width="480" height="480" rx="14" fill="#24131b" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="660" y="140" width="190" height="28" rx="6" fill="#be123c"/>
  <text x="755" y="159" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">坐地起价模式 (主流商家)</text>

  <text x="660" y="210" fill="#f8fafc" font-size="32" font-weight="800">$19.99 ~ $24.99 <span style="font-size:16px;color:#94a3b8;font-weight:400;">/ 年</span></text>
  <text x="660" y="235" fill="#f87171" font-size="13">借势涨价 · 首年超低次年翻倍 · 捆绑隐私</text>

  <!-- Stack bar -->
  <rect x="660" y="260" width="440" height="60" rx="8" fill="#e11d48"/>
  <text x="880" y="295" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Verisign 垄断批发费：$10.97 (占比 44%~55%)</text>

  <rect x="660" y="325" width="440" height="25" rx="4" fill="#6366f1"/>
  <text x="880" y="342" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">ICANN 规费：$0.20</text>

  <rect x="660" y="355" width="440" height="95" rx="8" fill="#ea580c"/>
  <text x="880" y="395" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">注册商暴利溢价：$8.82 ~ $13.82 (溢价率达 80%~125%)</text>
  <text x="880" y="425" fill="#ffedd5" font-size="12" text-anchor="middle">包含品牌税、客服冗余、甚至变相加收的“隐私保护费”</text>

  <rect x="660" y="470" width="440" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="680" y="500" fill="#f87171" font-size="13" font-weight="700">🚨 常见的杀熟暗坑：</text>
  <text x="680" y="525" fill="#cbd5e1" font-size="12">1. 首年 $0.99 引流，默认勾选次年以 $24.99 自动静默扣费；</text>
  <text x="680" y="548" fill="#cbd5e1" font-size="12">2. NameSilo 邮件公告：散户续费提至 $19.99，除非拥有百个以上域名。</text>

  <!-- Bottom Quote -->
  <text x="600" y="635" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">成本红线摆在眼前：凡是超过 $12/年的续费账单，都是在向商家交智商税！</text>
</svg>