<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;">
  <text x="600" y="50" fill="#f8fafc" font-size="25" font-weight="800" text-anchor="middle">ICANN-Verisign 协议：.COM 批发价“6年涨4次”阶梯推演 (2020 - 2030)</text>
  <text x="600" y="82" fill="#94a3b8" font-size="14" text-anchor="middle">根据 2018 年特许修正案，Verisign 有权在每个 6 年周期内任选 4 年上调最多 7% 批发价</text>

  <!-- Cycle 1 (2020-2025) -->
  <rect x="70" y="120" width="510" height="420" rx="14" fill="#131d31" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="90" y="140" width="220" height="30" rx="6" fill="#1e40af"/>
  <text x="200" y="160" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">第一周期 (Cycle 1: 2020-2025)</text>

  <circle cx="120" cy="220" r="14" fill="#3b82f6"/>
  <text x="120" y="225" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="150" y="215" fill="#f8fafc" font-size="15" font-weight="700">2020 基准锁定：$7.85</text>
  <text x="150" y="235" fill="#94a3b8" font-size="12">特朗普政府松绑价格管制，协议正式生效</text>

  <circle cx="120" cy="280" r="14" fill="#ef4444"/>
  <text x="120" y="285" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="150" y="275" fill="#f8fafc" font-size="15" font-weight="700">2021 年第 1 涨：$8.39 (+6.9%)</text>
  <text x="150" y="295" fill="#94a3b8" font-size="12">首轮涨价试水，全球注册商跟进</text>

  <circle cx="120" cy="340" r="14" fill="#ef4444"/>
  <text x="120" y="345" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="150" y="335" fill="#f8fafc" font-size="15" font-weight="700">2022 年第 2 涨：$8.97 (+6.9%)</text>
  <text x="150" y="355" fill="#94a3b8" font-size="12">连续提价，单域批发价逼近 9 美元大关</text>

  <circle cx="120" cy="400" r="14" fill="#ef4444"/>
  <text x="120" y="405" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="150" y="395" fill="#f8fafc" font-size="15" font-weight="700">2023 年第 3 涨：$9.59 (+6.9%)</text>
  <text x="150" y="415" fill="#94a3b8" font-size="12">第三次涨价，个人站长保有成本持续攀升</text>

  <circle cx="120" cy="460" r="14" fill="#ef4444"/>
  <text x="120" y="465" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="150" y="455" fill="#f8fafc" font-size="15" font-weight="700">2024 年第 4 涨：$10.26 (+7.0%)</text>
  <text x="150" y="475" fill="#94a3b8" font-size="12">周期内4次涨价额度全额用尽！批发价破 10 美元</text>

  <circle cx="120" cy="510" r="10" fill="#10b981"/>
  <text x="150" y="515" fill="#34d399" font-size="13" font-weight="700">2025 年：法定冻结年 ($10.26 保持平盘)</text>

  <!-- Cycle 2 (2026-2031) -->
  <rect x="620" y="120" width="510" height="420" rx="14" fill="#20131d" stroke="#e11d48" stroke-width="2"/>
  <rect x="640" y="140" width="250" height="30" rx="6" fill="#be123c"/>
  <text x="765" y="160" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">新周期已启动！(Cycle 2: 2026-2031)</text>

  <rect x="640" y="195" width="470" height="65" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
  <circle cx="665" cy="227" r="14" fill="#ef4444"/>
  <text x="665" y="232" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">🔥</text>
  <text x="695" y="220" fill="#fecdd3" font-size="16" font-weight="800">2026 年 11 月 1 日 (现行)：$10.97 (+6.9%)</text>
  <text x="695" y="244" fill="#fca5a5" font-size="12" font-weight="600">新周期立即顶格涨价！零售注册商全面跟进爆发</text>

  <circle cx="665" cy="295" r="14" fill="#f97316"/>
  <text x="665" y="300" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="695" y="290" fill="#f8fafc" font-size="15" font-weight="700">2027 年 (预测第2涨)：$11.74 (+7.0%)</text>
  <text x="695" y="310" fill="#94a3b8" font-size="12">Verisign 商业惯性：几乎必定继续行使提价权</text>

  <circle cx="665" cy="355" r="14" fill="#f97316"/>
  <text x="665" y="360" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="695" y="350" fill="#f8fafc" font-size="15" font-weight="700">2028 年 (预测第3涨)：$12.56 (+7.0%)</text>
  <text x="695" y="370" fill="#94a3b8" font-size="12">单域批发价达 12.5 美元，零售均价逼近 20 美元</text>

  <circle cx="665" cy="415" r="14" fill="#f97316"/>
  <text x="665" y="420" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="695" y="410" fill="#f8fafc" font-size="15" font-weight="700">2029 年 (预测第4涨)：$13.44 (+7.0%)</text>
  <text x="695" y="430" fill="#94a3b8" font-size="12">第二周期 4 次涨价额度再次打满！较 2020 年涨幅达 +71%</text>

  <circle cx="665" cy="475" r="10" fill="#10b981"/>
  <text x="695" y="480" fill="#34d399" font-size="13" font-weight="700">2030 年：预测冻结冷却年 ($13.44 保持平盘)</text>

  <rect x="640" y="500" width="470" height="30" rx="4" fill="#1e293b"/>
  <text x="875" y="520" fill="#cbd5e1" font-size="12" text-anchor="middle">十年复合涨幅达 +71.2%！现在十年锁费每域名立省数十美元</text>

  <!-- Bottom Tip -->
  <rect x="70" y="570" width="1060" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="602" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">⚠️ 关键启示：不要对后续年份心存降价幻想！</text>
  <text x="600" y="626" fill="#cbd5e1" font-size="13" text-anchor="middle">根据合同规则，2026-2029 年均具备 7% 涨价空间。利用 ICANN 允许的 10 年上限在 11 月 1 日前提前锁价，是击穿通胀锁链的唯一防御手段！</text>
</svg>