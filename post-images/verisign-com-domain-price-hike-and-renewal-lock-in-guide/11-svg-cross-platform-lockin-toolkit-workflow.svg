<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;">
  <text x="600" y="50" fill="#f8fafc" font-size="25" font-weight="800" text-anchor="middle">三大系统跨平台全自动巡检与十年锁价套件架构</text>
  <text x="600" y="80" fill="#94a3b8" font-size="14" text-anchor="middle">零第三方依赖 · 权威 RDAP 协议直连 · 人工终端比价 + AI Agent 声明式静默执行双模式</text>

  <!-- Stage 1: Input & OS abstraction -->
  <rect x="60" y="120" width="240" height="420" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="80" y="140" width="140" height="26" rx="6" fill="#0284c7"/>
  <text x="150" y="158" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">跨平台原生环境</text>
  <text x="80" y="195" fill="#f8fafc" font-size="18" font-weight="700">1. 原生脚本层</text>

  <rect x="80" y="220" width="200" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="95" y="245" fill="#38bdf8" font-size="13" font-weight="700">macOS 26</text>
  <text x="95" y="265" fill="#94a3b8" font-size="12">Zsh 原生套件 (curl + jq / awk)</text>

  <rect x="80" y="295" width="200" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="95" y="320" fill="#4ade80" font-size="13" font-weight="700">Ubuntu 26.04 LTS</text>
  <text x="95" y="340" fill="#94a3b8" font-size="12">Bash 原生套件 (标准 Linux 工具链)</text>

  <rect x="80" y="370" width="200" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="95" y="395" fill="#60a5fa" font-size="13" font-weight="700">Windows 11</text>
  <text x="95" y="415" fill="#94a3b8" font-size="12">PowerShell 7 (Invoke-RestMethod)</text>

  <rect x="80" y="445" width="200" height="70" rx="8" fill="#0c4a6e"/>
  <text x="95" y="470" fill="#7dd3fc" font-size="12" font-weight="700">零第三方依赖保证</text>
  <text x="95" y="492" fill="#e0f2fe" font-size="11">不装 npm、不装 pip 扩展包</text>
  <text x="95" y="508" fill="#e0f2fe" font-size="11">纯净独立，任何机器开箱即用</text>

  <!-- Stage 2: RDAP Authoritative Engine -->
  <rect x="340" y="120" width="240" height="420" rx="12" fill="#111827" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="360" y="140" width="140" height="26" rx="6" fill="#4f46e5"/>
  <text x="430" y="158" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">权威协议直通</text>
  <text x="360" y="195" fill="#f8fafc" font-size="18" font-weight="700">2. RDAP 解析核心</text>

  <rect x="360" y="220" width="200" height="85" rx="8" fill="#1e1e38" stroke="#4338ca" stroke-width="1"/>
  <text x="375" y="245" fill="#a5b4fc" font-size="13" font-weight="700">Verisign RDAP 直连</text>
  <text x="375" y="265" fill="#94a3b8" font-size="11">https://rdap.verisign-grs.com</text>
  <text x="375" y="285" fill="#94a3b8" font-size="11">绕过第三方限频与付费 WHOIS API</text>

  <rect x="360" y="320" width="200" height="95" rx="8" fill="#1e1e38" stroke="#4338ca" stroke-width="1"/>
  <text x="375" y="345" fill="#a5b4fc" font-size="13" font-weight="700">数据提取与归一化</text>
  <text x="375" y="365" fill="#cbd5e1" font-size="11">• 当前注册商名称 (Registrar)</text>
  <text x="375" y="383" fill="#cbd5e1" font-size="11">• 准确到期时间戳 (expirationDate)</text>
  <text x="375" y="401" fill="#cbd5e1" font-size="11">• 域名安全锁状态 (clientTransferProhibited)</text>

  <rect x="360" y="430" width="200" height="85" rx="8" fill="#312e81"/>
  <text x="375" y="455" fill="#c7d2fe" font-size="12" font-weight="700">推算可续费最长年限</text>
  <text x="375" y="475" fill="#e0e7ff" font-size="11">依据 ICANN 10 年上限：</text>
  <text x="375" y="495" fill="#4ade80" font-size="12" font-weight="700">可续年数 = 10 - (到期年 - 当前年)</text>

  <!-- Stage 3: Cost Difference Engine -->
  <rect x="620" y="120" width="240" height="420" rx="12" fill="#111827" stroke="#f43f5e" stroke-width="1.5"/>
  <rect x="640" y="140" width="140" height="26" rx="6" fill="#be123c"/>
  <text x="710" y="158" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">多平台动态精算</text>
  <text x="640" y="195" fill="#f8fafc" font-size="18" font-weight="700">3. 差分套利引擎</text>

  <rect x="640" y="220" width="200" height="85" rx="8" fill="#2d151e" stroke="#9f1239" stroke-width="1"/>
  <text x="655" y="245" fill="#fda4af" font-size="13" font-weight="700">当前价格基准核算</text>
  <text x="655" y="268" fill="#cbd5e1" font-size="11">Cloudflare: $10.46/年</text>
  <text x="655" y="288" fill="#cbd5e1" font-size="11">NameSilo: $13.95/年 (现行)</text>

  <rect x="640" y="320" width="200" height="85" rx="8" fill="#2d151e" stroke="#9f1239" stroke-width="1"/>
  <text x="655" y="345" fill="#fda4af" font-size="13" font-weight="700">11月1日涨后预测核算</text>
  <text x="655" y="368" fill="#cbd5e1" font-size="11">Cloudflare: $11.17/年</text>
  <text x="655" y="388" fill="#cbd5e1" font-size="11">NameSilo: $19.99/年 (散户)</text>

  <rect x="640" y="420" width="200" height="95" rx="8" fill="#4c0519"/>
  <text x="655" y="445" fill="#fecdd3" font-size="12" font-weight="700">决策树输出</text>
  <text x="655" y="468" fill="#ffe4e6" font-size="11">1. 在原商家十年锁费</text>
  <text x="655" y="488" fill="#ffe4e6" font-size="11">2. 立即转入 Cloudflare 套利</text>
  <text x="655" y="505" fill="#ffe4e6" font-size="11">3. 判定无用僵尸域名建议放弃</text>

  <!-- Stage 4: Output Modes -->
  <rect x="900" y="120" width="240" height="420" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <rect x="920" y="140" width="140" height="26" rx="6" fill="#047857"/>
  <text x="990" y="158" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">交付双模式</text>
  <text x="920" y="195" fill="#f8fafc" font-size="18" font-weight="700">4. 终端与 Agent</text>

  <rect x="920" y="220" width="200" height="135" rx="8" fill="#132a22" stroke="#065f46" stroke-width="1"/>
  <text x="935" y="245" fill="#6ee7b7" font-size="13" font-weight="700">模式 A：人工交互式执行</text>
  <text x="935" y="268" fill="#cbd5e1" font-size="11">• 彩色终端 ASCII 报表表格</text>
  <text x="935" y="288" fill="#cbd5e1" font-size="11">• 倒计时预警 (距11月1日天数)</text>
  <text x="935" y="308" fill="#cbd5e1" font-size="11">• 一目了然的省钱总金额</text>
  <text x="935" y="328" fill="#cbd5e1" font-size="11">• 交互式域名快捷续费链接</text>

  <rect x="920" y="370" width="200" height="145" rx="8" fill="#132a22" stroke="#065f46" stroke-width="1"/>
  <text x="935" y="395" fill="#6ee7b7" font-size="13" font-weight="700">模式 B：AI Agent 声明式</text>
  <text x="935" y="418" fill="#cbd5e1" font-size="11">• 运行参数：--auto / -Auto</text>
  <text x="935" y="438" fill="#cbd5e1" font-size="11">• 静默生成 JSON 机器报告</text>
  <text x="935" y="458" fill="#cbd5e1" font-size="11">• 退出码严格语义化 (0=安全)</text>
  <text x="935" y="478" fill="#cbd5e1" font-size="11">• 自动集成到定时运维巡检</text>

  <!-- Flow Arrows -->
  <path d="M 300 330 L 340 330" stroke="#38bdf8" stroke-width="3" fill="none"/>
  <path d="M 580 330 L 620 330" stroke="#818cf8" stroke-width="3" fill="none"/>
  <path d="M 860 330 L 900 330" stroke="#f43f5e" stroke-width="3" fill="none"/>

  <!-- Footer Banner -->
  <rect x="60" y="565" width="1080" height="65" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="602" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">⚙️ 脚本已全面适配 Windows 11 (PowerShell 7)、Ubuntu 26.04 (Bash) 与 macOS 26 (Zsh)，纯本地执行，无信息泄露风险</text>
</svg>