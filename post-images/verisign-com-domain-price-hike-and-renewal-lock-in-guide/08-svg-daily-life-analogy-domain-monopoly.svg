<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Title Section -->
  <text x="600" y="55" fill="#f8fafc" font-size="26" font-weight="800" text-anchor="middle">互联网地皮垄断链条：小学生秒懂的生活大比方</text>
  <text x="600" y="88" fill="#94a3b8" font-size="15" text-anchor="middle">从自来水集团独家特许，到沿街商铺加价，再到数亿租客被动买单的完整图景</text>

  <!-- Level 1: Registry (Verisign) -->
  <rect x="70" y="130" width="310" height="420" rx="16" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="2"/>
  <rect x="100" y="150" width="120" height="28" rx="6" fill="#be123c"/>
  <text x="160" y="169" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">第一层：独家特许</text>
  
  <text x="100" y="215" fill="#ffffff" font-size="20" font-weight="800">Verisign (注册局)</text>
  <text x="100" y="240" fill="#fecdd3" font-size="14" font-weight="600">生活比喻：城市自来水总厂 / 垄断地主</text>
  
  <line x1="100" y1="260" x2="380" y2="260" stroke="#fb7185" stroke-width="1" stroke-dasharray="4"/>
  
  <text x="100" y="290" fill="#ffe4e6" font-size="13" font-weight="500">🏢 拥有所有 .COM 域名的独家管理特权</text>
  <text x="100" y="325" fill="#ffe4e6" font-size="13" font-weight="500">📜 与 ICANN 签署合同，每年可提价 7%</text>
  <text x="100" y="360" fill="#ffe4e6" font-size="13" font-weight="500">💰 11月1日起批发价从 $10.26 涨至 $10.97</text>
  <text x="100" y="395" fill="#ffe4e6" font-size="13" font-weight="500">📈 营业利润率高达 68.5%，旱涝保收</text>
  
  <rect x="100" y="440" width="280" height="85" rx="8" fill="#4c0519" stroke="#9f1239" stroke-width="1"/>
  <text x="240" y="470" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle">核心机制：特许垄断权</text>
  <text x="240" y="500" fill="#ffe4e6" font-size="12" text-anchor="middle">“只要你在用 .COM，哪怕喝一口水也得交钱”</text>

  <!-- Level 2: Registrars -->
  <rect x="445" y="130" width="310" height="420" rx="16" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="460" y="150" width="120" height="28" rx="6" fill="#0284c7"/>
  <text x="520" y="169" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">第二层：零售中介</text>

  <text x="460" y="215" fill="#ffffff" font-size="20" font-weight="800">Registrars (注册商)</text>
  <text x="460" y="240" fill="#bae6fd" font-size="14" font-weight="600">生活比喻：沿街连锁超市 / 房产中介</text>

  <line x1="460" y1="260" x2="740" y2="260" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="4"/>

  <text x="460" y="290" fill="#e0f2fe" font-size="13" font-weight="500">🏪 Cloudflare / Porkbun：平价便民超市</text>
  <text x="480" y="315" fill="#7dd3fc" font-size="12">按批发成本直供 ($11.17)，零中间差价</text>
  <text x="460" y="345" fill="#e0f2fe" font-size="13" font-weight="500">🛒 NameSilo：涨价转嫁 ($19.99 散户价)</text>
  <text x="460" y="375" fill="#e0f2fe" font-size="13" font-weight="500">🎣 GoDaddy：首年特价诱捕，次年翻倍宰客</text>
  <text x="480" y="400" fill="#f87171" font-size="12">首年 $1 元引流，续费直接涨到 $24.99+</text>

  <rect x="460" y="440" width="280" height="85" rx="8" fill="#0c4a6e" stroke="#0369a1" stroke-width="1"/>
  <text x="600" y="470" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">核心机制：成本转移与加价</text>
  <text x="600" y="500" fill="#e0f2fe" font-size="12" text-anchor="middle">批发成本涨 7 毛，零售中介能借势涨 5 块</text>

  <!-- Level 3: Registrants -->
  <rect x="820" y="130" width="310" height="420" rx="16" fill="url(#cardGrad3)" stroke="#34d399" stroke-width="2"/>
  <rect x="820" y="150" width="120" height="28" rx="6" fill="#059669"/>
  <text x="880" y="169" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">第三层：最终买单</text>

  <text x="820" y="215" fill="#ffffff" font-size="20" font-weight="800">Registrant (站长/你我)</text>
  <text x="820" y="240" fill="#a7f3d0" font-size="14" font-weight="600">生活比喻：在商铺里开店的租客</text>

  <line x1="820" y1="260" x2="1100" y2="260" stroke="#6ee7b7" stroke-width="1" stroke-dasharray="4"/>

  <text x="820" y="290" fill="#ecfdf5" font-size="13" font-weight="500">🏠 域名从来不是永久购买，只有使用权</text>
  <text x="820" y="325" fill="#ecfdf5" font-size="13" font-weight="500">🔒 品牌、邮箱、SEO 绑定，迁移成本极高</text>
  <text x="820" y="360" fill="#ecfdf5" font-size="13" font-weight="500">💸 每年雷打不动交租，面临温水煮青蛙</text>
  <text x="820" y="395" fill="#ecfdf5" font-size="13" font-weight="500">🛡️ 破解对策：赶在 11 月 1 日前 10 年满格锁费</text>

  <rect x="820" y="440" width="280" height="85" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1"/>
  <text x="960" y="470" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">自救策略：十年满额锁价</text>
  <text x="960" y="500" fill="#ecfdf5" font-size="12" text-anchor="middle">利用 ICANN 最长 10 年规则，锁定当前费率</text>

  <!-- Connective Arrows -->
  <path d="M 380 340 L 445 340" stroke="#f43f5e" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 755 340 L 820 340" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  
  <text x="412" y="325" fill="#fda4af" font-size="11" font-weight="700" text-anchor="middle">强制批发</text>
  <text x="787" y="325" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">零售加价</text>

  <!-- Bottom Summary bar -->
  <rect x="80" y="580" width="1040" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="616" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">💡 总结：只要自来水厂（Verisign）宣布涨价，沿街便利店（中介）就会把成本加倍转嫁给租客（开发者）。唯一的避坑法则就是：选平价超市，提前囤货！</text>
</svg>