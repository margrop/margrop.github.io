<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow11)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">跨平台面试自测沙箱套件架构图 (Zero Dependencies)</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">原生适配 Windows 11 / Ubuntu 26.04 / macOS 27，双模驱动（人工交互 vs Agent 静默配置）</text>

  <!-- 3 OS Platforms Cards -->
  <g transform="translate(60, 120)">
    <!-- Windows 11 -->
    <rect x="0" y="0" width="340" height="240" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="36" fill="#38bdf8" font-size="18" font-weight="bold">🪟 Windows 11</text>
    <text x="24" y="60" fill="#94a3b8" font-size="13">agent_interview_sandbox_windows11.ps1</text>
    <line x1="24" y1="75" x2="316" y2="75" stroke="#334155"/>
    <text x="24" y="105" fill="#e2e8f0" font-size="13">• 原生 PowerShell 7.4+ 执行引擎</text>
    <text x="24" y="135" fill="#e2e8f0" font-size="13">• 零依赖 System.Threading 并发验证</text>
    <text x="24" y="165" fill="#e2e8f0" font-size="13">• 支持 -Interactive 菜单与 -AgentMode</text>
    <text x="24" y="195" fill="#e2e8f0" font-size="13">• 输出 UTF-8 结构化 JSON 评测报告</text>
    <rect x="24" y="210" width="292" height="20" rx="4" fill="#0f172a"/>

    <!-- Ubuntu 26.04 -->
    <rect x="370" y="0" width="340" height="240" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="394" y="36" fill="#fb923c" font-size="18" font-weight="bold">🐧 Ubuntu 26.04 LTS</text>
    <text x="394" y="60" fill="#94a3b8" font-size="13">agent_interview_sandbox_ubuntu2604.sh</text>
    <line x1="394" y1="75" x2="686" y2="75" stroke="#334155"/>
    <text x="394" y="105" fill="#e2e8f0" font-size="13">• 纯净 GNU Bash 5.2+ 脚本环境</text>
    <text x="394" y="135" fill="#e2e8f0" font-size="13">• 管道隔离与 Linux 内核信号捕获</text>
    <text x="394" y="165" fill="#e2e8f0" font-size="13">• 支持 --verify-all 与 --silent 自动化</text>
    <text x="394" y="195" fill="#e2e8f0" font-size="13">• 原生集成标准 exit code 与 CI/CD 接入</text>
    <rect x="394" y="210" width="292" height="20" rx="4" fill="#0f172a"/>

    <!-- macOS 27 -->
    <rect x="740" y="0" width="340" height="240" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="764" y="36" fill="#c084fc" font-size="18" font-weight="bold">🍎 macOS 27</text>
    <text x="764" y="60" fill="#94a3b8" font-size="13">agent_interview_sandbox_macos27.zsh</text>
    <line x1="764" y1="75" x2="1056" y2="75" stroke="#334155"/>
    <text x="764" y="105" fill="#e2e8f0" font-size="13">• 原生 Darwin Zsh 5.9+ 架构驱动</text>
    <text x="764" y="135" fill="#e2e8f0" font-size="13">• POSIX 兼容性子进程与锁模拟</text>
    <text x="764" y="165" fill="#e2e8f0" font-size="13">• Apple Silicon 与 Intel 双架构自适应</text>
    <text x="764" y="195" fill="#e2e8f0" font-size="13">• 一键生成彩色彩色终端自测仪表盘</text>
    <rect x="764" y="210" width="292" height="20" rx="4" fill="#0f172a"/>
  </g>

  <!-- 4 Core Engine Modules (Bottom) -->
  <g transform="translate(60, 390)">
    <rect width="1080" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="bold">⚙️ 沙箱套件内置四大自测与能力审计引擎 (Self-Assessment Engines)</text>
    
    <g transform="translate(30, 60)">
      <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#38bdf8"/>
      <text x="16" y="28" fill="#38bdf8" font-size="14" font-weight="bold">引擎 1: 规格边界自检</text>
      <text x="16" y="55" fill="#cbd5e1" font-size="12">• 注入模糊业务需求</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="12">• 验证断言完备性 (100%)</text>
      <text x="16" y="105" fill="#cbd5e1" font-size="12">• 检测状态转移异常</text>
      <text x="16" y="130" fill="#94a3b8" font-size="11">考察：问题定义能力</text>
    </g>

    <g transform="translate(290, 60)">
      <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#f43f5e"/>
      <text x="16" y="28" fill="#f43f5e" font-size="14" font-weight="bold">引擎 2: 并发死穴探测</text>
      <text x="16" y="55" fill="#cbd5e1" font-size="12">• 模拟高频 TOCTOU 竞态</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="12">• 验证原子分布式租约</text>
      <text x="16" y="105" fill="#cbd5e1" font-size="12">• 捕获锁未释放与脑裂</text>
      <text x="16" y="130" fill="#94a3b8" font-size="11">考察：代码深度审计力</text>
    </g>

    <g transform="translate(550, 60)">
      <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#a855f7"/>
      <text x="16" y="28" fill="#c084fc" font-size="14" font-weight="bold">引擎 3: 架构防雪崩容灾</text>
      <text x="16" y="55" fill="#cbd5e1" font-size="12">• 模拟 10 万 QPS 突发流量</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="12">• 验证 Singleflight 合并</text>
      <text x="16" y="105" fill="#cbd5e1" font-size="12">• 熔断器半开自动恢复</text>
      <text x="16" y="130" fill="#94a3b8" font-size="11">考察：系统底层设计力</text>
    </g>

    <g transform="translate(810, 60)">
      <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#10b981"/>
      <text x="16" y="28" fill="#34d399" font-size="14" font-weight="bold">引擎 4: Agent 护栏审计</text>
      <text x="16" y="55" fill="#cbd5e1" font-size="12">• 监测长上下文幻觉</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="12">• 注入提示词安全围栏</text>
      <text x="16" y="105" fill="#cbd5e1" font-size="12">• 自动化多轮 Prompt 遥测</text>
      <text x="16" y="130" fill="#94a3b8" font-size="11">考察：AI 工具驾驭力</text>
    </g>
  </g>
</svg>