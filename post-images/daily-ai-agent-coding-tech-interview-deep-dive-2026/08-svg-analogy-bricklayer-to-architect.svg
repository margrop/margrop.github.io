<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow8)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">生活化大比方：小学生秒懂的三重工程师身份蜕变</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">为什么天天用 AI 写代码的人在面试中一戳就破？因为角色定位完全改变了！</text>

  <!-- Row 1: Construction Analogy -->
  <g transform="translate(60, 120)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="36" fill="#60a5fa" font-size="18" font-weight="bold">🏗️ 比方一：从【搬砖砌墙小工】到【工地监理总工程师】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#f87171" font-size="14" font-weight="bold">传统时代：搬砖小工 (Manual Coder)</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">面试考你一分钟能手搓砌几块砖（手写红黑树/快排），手慢就算不及格。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#34d399" font-size="14" font-weight="bold">AI 时代：监理总工程师 (Site Chief Inspector)</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">机器人两秒砌一万块砖！面试考图纸设计、承重墙核验、水泥标号抗震质量排查。</text>
  </g>

  <!-- Row 2: Racing Analogy -->
  <g transform="translate(60, 295)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="36" fill="#fbbf24" font-size="18" font-weight="bold">🏎️ 比方二：从【踩单车送外卖】到【F1 赛车控制台指挥官】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#f87171" font-size="14" font-weight="bold">传统时代：骑自行车 (Bicycle Courier)</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">每一步都是肉身手踩，速度慢但走错胡同随时能刹车掉头，对路线细节全掌握。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#34d399" font-size="14" font-weight="bold">AI 时代：F1 控制台指挥 (Pit Wall Strategist)</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">开 1000 匹马力超跑狂飙！面试考你如何读懂遥测数据、规避撞墙、设置紧急制动。</text>
  </g>

  <!-- Row 3: Kitchen Analogy -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="36" fill="#34d399" font-size="18" font-weight="bold">🍳 比方三：从【盲信外卖食客】到【米其林主厨后厨品控】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#f87171" font-size="14" font-weight="bold">外卖依赖者：一问三不知 (Blind Consumer)</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">把 AI 生成代码直接倒盘子里端给老板；面试官问高汤熬制原理和过敏源，当场傻眼！</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#34d399" font-size="14" font-weight="bold">米其林总厨：洞悉火候 (Executive Chef)</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">把 Agent 当做切菜学徒，对食材新鲜度、调味配比、交叉污染风险拥有绝对掌控权。</text>
  </g>
</svg>