<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow10)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">2026 工业级高效人机协同五步工程流 (The 5-Stage Agentic Loop)</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">顶级工程师如何驾驭 AI：把代码生成变成确定性交付闭环</text>

  <!-- 5 Horizontal Steps -->
  <g transform="translate(50, 140)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="200" height="340" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="100" cy="40" r="22" fill="#38bdf8"/>
    <text x="100" y="47" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">1</text>
    <text x="100" y="90" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold">规格定义</text>
    <text x="100" y="112" text-anchor="middle" fill="#94a3b8" font-size="13">Spec Engineering</text>
    <line x1="20" y1="130" x2="180" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="20" y="160" fill="#f1f5f9" font-size="13">• 锁定业务不变量</text>
    <text x="20" y="190" fill="#f1f5f9" font-size="13">• 明确并发与事务范围</text>
    <text x="20" y="220" fill="#f1f5f9" font-size="13">• 排除模糊与冗余假设</text>
    <text x="20" y="250" fill="#f1f5f9" font-size="13">• 建立输入输出约束</text>
    <rect x="15" y="280" width="170" height="40" rx="6" fill="#0f172a"/>
    <text x="100" y="305" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">人类主导：100%</text>

    <!-- Step 2 -->
    <rect x="225" y="0" width="200" height="340" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="325" cy="40" r="22" fill="#818cf8"/>
    <text x="325" y="47" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">2</text>
    <text x="325" y="90" text-anchor="middle" fill="#818cf8" font-size="17" font-weight="bold">测试护栏前置</text>
    <text x="325" y="112" text-anchor="middle" fill="#94a3b8" font-size="13">TDD Guardrails</text>
    <line x1="245" y1="130" x2="405" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="245" y="160" fill="#f1f5f9" font-size="13">• 编写破坏性单测用例</text>
    <text x="245" y="190" fill="#f1f5f9" font-size="13">• 模拟时钟漂移与网络抖动</text>
    <text x="245" y="220" fill="#f1f5f9" font-size="13">• 设定极端边界断言</text>
    <text x="245" y="250" fill="#f1f5f9" font-size="13">• 构建独立沙箱验证集</text>
    <rect x="240" y="280" width="170" height="40" rx="6" fill="#0f172a"/>
    <text x="325" y="305" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">人机协同设计</text>

    <!-- Step 3 -->
    <rect x="450" y="0" width="200" height="340" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="550" cy="40" r="22" fill="#c084fc"/>
    <text x="550" y="47" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">3</text>
    <text x="550" y="90" text-anchor="middle" fill="#c084fc" font-size="17" font-weight="bold">Agent 局部生成</text>
    <text x="550" y="112" text-anchor="middle" fill="#94a3b8" font-size="13">Bounded Generation</text>
    <line x1="470" y1="130" x2="630" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="470" y="160" fill="#f1f5f9" font-size="13">• 最小上下文精细注入</text>
    <text x="470" y="190" fill="#f1f5f9" font-size="13">• 单模块函数级实现</text>
    <text x="470" y="220" fill="#f1f5f9" font-size="13">• 限制外部依赖引入</text>
    <text x="470" y="250" fill="#f1f5f9" font-size="13">• 自动生成多版本候选</text>
    <rect x="465" y="280" width="170" height="40" rx="6" fill="#0f172a"/>
    <text x="550" y="305" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="bold">Agent 主导执行</text>

    <!-- Step 4 -->
    <rect x="675" y="0" width="200" height="340" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="775" cy="40" r="22" fill="#f43f5e"/>
    <text x="775" y="47" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">4</text>
    <text x="775" y="90" text-anchor="middle" fill="#f43f5e" font-size="17" font-weight="bold">穿透式代码审计</text>
    <text x="775" y="112" text-anchor="middle" fill="#94a3b8" font-size="13">Dual-Pass Audit</text>
    <line x1="695" y1="130" x2="855" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="695" y="160" fill="#f1f5f9" font-size="13">• TOCTOU 并发排查</text>
    <text x="695" y="190" fill="#f1f5f9" font-size="13">• 静态安全规则扫描</text>
    <text x="695" y="220" fill="#f1f5f9" font-size="13">• 资源释放与超时防线</text>
    <text x="695" y="250" fill="#f1f5f9" font-size="13">• 架构一致性检验</text>
    <rect x="690" y="280" width="170" height="40" rx="6" fill="#0f172a"/>
    <text x="775" y="305" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="bold">人类主导：100%</text>

    <!-- Step 5 -->
    <rect x="900" y="0" width="200" height="340" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <circle cx="1000" cy="40" r="22" fill="#34d399"/>
    <text x="1000" y="47" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="bold">5</text>
    <text x="1000" y="90" text-anchor="middle" fill="#34d399" font-size="17" font-weight="bold">沙箱仿真压测</text>
    <text x="1000" y="112" text-anchor="middle" fill="#94a3b8" font-size="13">Sandbox Stress Verify</text>
    <line x1="920" y1="130" x2="1080" y2="130" stroke="#334155" stroke-width="1"/>
    <text x="920" y="160" fill="#f1f5f9" font-size="13">• 10 万并发高压注入</text>
    <text x="920" y="190" fill="#f1f5f9" font-size="13">• 故障注入 (Chaos Mesh)</text>
    <text x="920" y="220" fill="#f1f5f9" font-size="13">• 验证回滚与补偿链路</text>
    <text x="920" y="250" fill="#f1f5f9" font-size="13">• 输出量化 Evals 报告</text>
    <rect x="915" y="280" width="170" height="40" rx="6" fill="#0f172a"/>
    <text x="1000" y="305" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">自动化执行验收</text>
  </g>

  <!-- Bottom Flow Arrows & Annotation -->
  <g transform="translate(60, 520)">
    <rect width="1080" height="110" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="30" y="38" fill="#38bdf8" font-size="16" font-weight="bold">💡 核心启示：把 AI 放在最安全的“沙箱三明治”中间</text>
    <text x="30" y="68" fill="#cbd5e1" font-size="14">输入端有【严格规格】与【前置测试】保驾护航，输出端有【人工穿透审计】与【仿真压测】兜底验证；</text>
    <text x="30" y="92" fill="#94a3b8" font-size="14">如此人机分工，既能享受 Agent 带来的 10 倍开发极速，又能 100% 免疫线上级联灾难。</text>
  </g>
</svg>