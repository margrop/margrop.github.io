<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow12)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">2026 工程师段位跃迁天梯图：从指令搬运工到智能体首席总指挥</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">AI 没有淘汰程序员，但淘汰了不理解底层的语法码农！你在哪一层？</text>

  <!-- 4 Tiers Pyramid / Staircase -->
  <g transform="translate(100, 130)">
    <!-- Tier 4: Top -->
    <rect x="350" y="0" width="400" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="550" y="32" text-anchor="middle" fill="#34d399" font-size="18" font-weight="bold">Level 4: 智能体系统总架构师 (Agentic Systems Architect)</text>
    <text x="550" y="60" text-anchor="middle" fill="#f1f5f9" font-size="13">特征：精通分布式底座、制定企业级 Agent 护栏、掌控全链路 Evals 评估</text>
    <text x="550" y="82" text-anchor="middle" fill="#6ee7b7" font-size="12">🏆 行业待遇：最稀缺的战略核心人才，各大厂与前沿机构重金疯抢</text>

    <!-- Tier 3 -->
    <rect x="250" y="120" width="600" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="550" y="152" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">Level 3: 人机协同高阶工程师 (AI-Augmented Senior Engineer)</text>
    <text x="550" y="180" text-anchor="middle" fill="#f1f5f9" font-size="13">特征：深谙 TDD 护栏、敏锐排查 AI 隐蔽 Bug、能主导复杂模块架构重构</text>
    <text x="550" y="202" text-anchor="middle" fill="#7dd3fc" font-size="12">🚀 行业待遇：主力研发骨干，1 人顶过去 5 人研发产出，面试通过率 90%+</text>

    <!-- Tier 2 -->
    <rect x="150" y="240" width="800" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="550" y="272" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="bold">Level 2: 提示词依附者 (Prompt-Dependent Coder)</text>
    <text x="550" y="300" text-anchor="middle" fill="#cbd5e1" font-size="13">特征：遇到报错只会盲目让 AI 重写，离开 IDE 补全后无法手写核心逻辑与排障</text>
    <text x="550" y="322" text-anchor="middle" fill="#fcd34d" font-size="12">⚠️ 风险预警：面试现场一问就懵，极易遭遇“认知外包陷阱”，替代风险高</text>

    <!-- Tier 1 -->
    <rect x="50" y="360" width="1000" height="100" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="550" y="392" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">Level 1: 纯机械语法码农 (Manual Syntax Typist)</text>
    <text x="550" y="420" text-anchor="middle" fill="#94a3b8" font-size="13">特征：拒绝使用现代 AI 编程工具，仍在死记硬背枯燥八股文与基础样板代码</text>
    <text x="550" y="442" text-anchor="middle" fill="#fca5a5" font-size="12">❌ 淘汰警告：产出效率落后时代 10 倍以上，基础岗位正被全面重塑</text>
  </g>

  <!-- Bottom Quote -->
  <g transform="translate(100, 610)">
    <text x="500" y="10" text-anchor="middle" fill="#94a3b8" font-size="15">“未来的软件工程，属于那些一手握着严谨计算机科学底座、一手熟练挥舞 AI 智能体长鞭的人。”</text>
  </g>
</svg>