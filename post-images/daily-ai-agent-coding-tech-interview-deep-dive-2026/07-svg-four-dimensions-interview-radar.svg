<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow)"/>
  
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">2026 技术面试核爆级变局：四大硬核考察维度矩阵</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">当 AI Agent 搞定 80% 基础编码后，顶级大厂与前沿团队究竟在面什么？</text>

  <!-- 4 Cards Grid (2x2) -->
  <!-- Card 1: Top Left -->
  <g transform="translate(60, 120)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#38bdf8"/>
    <text x="24" y="38" fill="#38bdf8" font-size="20" font-weight="bold">维度一：问题定义与规格说明能力 (Spec Engineering)</text>
    <text x="24" y="70" fill="#f1f5f9" font-size="15" font-weight="bold">从“手写函数解题”到“精确定义业务不变量与边界”</text>
    <text x="24" y="100" fill="#cbd5e1" font-size="14">• 模糊需求收敛：能否在 5 分钟内把抽象业务拆解为确定性状态机？</text>
    <text x="24" y="128" fill="#cbd5e1" font-size="14">• 不变量声明 (Invariants)：明确并发、死锁、网络超时的防御底线；</text>
    <text x="24" y="156" fill="#cbd5e1" font-size="14">• TDD 护栏前置：先编写完备的验证断言，再调度 Agent 生产实现；</text>
    <text x="24" y="190" fill="#94a3b8" font-size="13">💡 小学生打比方：就像给施工机器人画图纸，图纸画歪，机器人砌得越快塌得越惨！</text>
  </g>

  <!-- Card 2: Top Right -->
  <g transform="translate(620, 120)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#f43f5e"/>
    <text x="24" y="38" fill="#f43f5e" font-size="20" font-weight="bold">维度二：深度代码审计与致命陷阱排查 (Code Auditing)</text>
    <text x="24" y="70" fill="#f1f5f9" font-size="15" font-weight="bold">严查“带毒的 AI 代码”：识别肉眼极难发觉的隐蔽 Bug</text>
    <text x="24" y="100" fill="#cbd5e1" font-size="14">• 竞态死穴 (TOCTOU)：排查异步 Check-then-Set 的非原子并发漏洞；</text>
    <text x="24" y="128" fill="#cbd5e1" font-size="14">• 内存与资源泄露：侦测定时器未解绑、连接池未释放、闭包泄漏；</text>
    <text x="24" y="156" fill="#cbd5e1" font-size="14">• 静默安全漏洞：识别 AI 幻觉引入的注入风险与弱加密伪随机数；</text>
    <text x="24" y="190" fill="#94a3b8" font-size="13">💡 小学生打比方：就像监理工程大叔，用放大镜检查机器人的水泥标号有没有偷工减料！</text>
  </g>

  <!-- Card 3: Bottom Left -->
  <g transform="translate(60, 380)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#a855f7"/>
    <text x="24" y="38" fill="#c084fc" font-size="20" font-weight="bold">维度三：计算机底层原理与架构权衡 (CS Systems)</text>
    <text x="24" y="70" fill="#f1f5f9" font-size="15" font-weight="bold">剥离语法外衣，直击高并发、分布式一致性与操作系统内核</text>
    <text x="24" y="100" fill="#cbd5e1" font-size="14">• 操作系统与网络：虚拟内存、上下文切换开销、TCP 拥塞与 QUIC；</text>
    <text x="24" y="128" fill="#cbd5e1" font-size="14">• 分布式理论：CAP 定理权衡、Raft 共识机制、脑裂与网络分区容错；</text>
    <text x="24" y="156" fill="#cbd5e1" font-size="14">• 性能瓶颈穿透：在 10 万 QPS 高压下，能一眼指出哪一层先雪崩；</text>
    <text x="24" y="190" fill="#94a3b8" font-size="13">💡 小学生打比方：虽然大家都会踩油门，但只有懂发动机齿轮运转的人才配开 F1 赛车！</text>
  </g>

  <!-- Card 4: Bottom Right -->
  <g transform="translate(620, 380)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#10b981"/>
    <text x="24" y="38" fill="#34d399" font-size="20" font-weight="bold">维度四：人机协同与 Agent 编排驾驭力 (Agent Orchestration)</text>
    <text x="24" y="70" fill="#f1f5f9" font-size="15" font-weight="bold">掌握现代 AI 编程利器，建立工业级上下文管理与评估反馈</text>
    <text x="24" y="100" fill="#cbd5e1" font-size="14">• 上下文工程 (Context Control)：精准裁剪文件上下文，杜绝长窗口幻觉；</text>
    <text x="24" y="128" fill="#cbd5e1" font-size="14">• 多 Agent 协作链路：明确 Planner、Coder、Tester 的职责切分；</text>
    <text x="24" y="156" fill="#cbd5e1" font-size="14">• 自动化评估 (Evals)：建立沙箱基准，以确定性断言闭环检验生成成果；</text>
    <text x="24" y="190" fill="#94a3b8" font-size="13">💡 小学生打比方：就像指挥一支特种作战小队，队长必须懂得如何精准下达战术指令！</text>
  </g>
</svg>