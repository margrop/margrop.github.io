<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow9)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">认知心理学视界：“认知外包”的恶性陷阱 vs 破局自救飞轮</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">为什么很多天天用 AI 的人能力反而严重退化？如何通过批判性反思重塑技术壁垒？</text>

  <!-- Left: Vicious Cycle -->
  <g transform="translate(60, 120)">
    <rect width="520" height="490" rx="14" fill="#1f2937" stroke="#ef4444" stroke-width="1.5"/>
    <text x="24" y="38" fill="#f87171" font-size="20" font-weight="bold">❌ 恶性陷阱：虚假熟练度与认知肌肉萎缩</text>
    
    <g transform="translate(24, 70)">
      <rect width="472" height="70" rx="8" fill="#111827"/>
      <text x="20" y="30" fill="#fca5a5" font-size="15" font-weight="bold">1. 盲目依赖快速生成 (Cognitive Offloading)</text>
      <text x="20" y="52" fill="#9ca3af" font-size="13">遇到问题直接丢给 AI，不再思考数据结构、算法时空复杂度与边界条件。</text>
    </g>
    <g transform="translate(24, 155)">
      <rect width="472" height="70" rx="8" fill="#111827"/>
      <text x="20" y="30" fill="#fca5a5" font-size="15" font-weight="bold">2. 调试反馈回路断裂 (Feedback Loop Cutoff)</text>
      <text x="20" y="52" fill="#9ca3af" font-size="13">报错不再看栈追踪（Stack Trace），而是盲目让 AI “重新修一下”，丧失排障敏感度。</text>
    </g>
    <g transform="translate(24, 240)">
      <rect width="472" height="70" rx="8" fill="#111827"/>
      <text x="20" y="30" fill="#fca5a5" font-size="15" font-weight="bold">3. 虚假熟练度幻觉 (Illusion of Competence)</text>
      <text x="20" y="52" fill="#9ca3af" font-size="13">把大模型的强大智商误认为是自己的能力，误以为自己已经是“全栈全能大牛”。</text>
    </g>
    <g transform="translate(24, 325)">
      <rect width="472" height="70" rx="8" fill="#111827"/>
      <text x="20" y="30" fill="#f87171" font-size="15" font-weight="bold">4. 面试现场断崖式翻车 (Live Collapse)</text>
      <text x="20" y="52" fill="#ef4444" font-size="13">离开自动补全后，连基本网络模型、并发同步原语和系统流图都画不出来！</text>
    </g>
    <text x="260" y="445" text-anchor="middle" fill="#fca5a5" font-size="14">⚠️ 最终结果：沦为随时可被廉价替代的“Prompt 搬运工”</text>
  </g>

  <!-- Right: Virtuous Mastery Flywheel -->
  <g transform="translate(620, 120)">
    <rect width="520" height="490" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="38" fill="#34d399" font-size="20" font-weight="bold">✔ 破局飞轮：批判性审计与超级架构师演化</text>
    
    <g transform="translate(24, 70)">
      <rect width="472" height="70" rx="8" fill="#0f172a"/>
      <text x="20" y="30" fill="#6ee7b7" font-size="15" font-weight="bold">1. 严密规格前置声明 (Spec &amp; Invariants First)</text>
      <text x="20" y="52" fill="#cbd5e1" font-size="13">在唤醒 Agent 前，人脑清晰完成架构边界、状态转移与核心断言的设计。</text>
    </g>
    <g transform="translate(24, 155)">
      <rect width="472" height="70" rx="8" fill="#0f172a"/>
      <text x="20" y="30" fill="#6ee7b7" font-size="15" font-weight="bold">2. 穿透式代码审计 (Dual-pass Penetration Audit)</text>
      <text x="20" y="52" fill="#cbd5e1" font-size="13">把 Agent 生成的代码当作外部 PR，严格审查竞态条件、连接池与安全合规。</text>
    </g>
    <g transform="translate(24, 240)">
      <rect width="472" height="70" rx="8" fill="#0f172a"/>
      <text x="20" y="30" fill="#6ee7b7" font-size="15" font-weight="bold">3. 计算机底层深潜 (CS Fundamentals Rooting)</text>
      <text x="20" y="52" fill="#cbd5e1" font-size="13">将省下的敲代码时间，投资到 Linux 内核、高并发 I/O 模型与分布式理论上。</text>
    </g>
    <g transform="translate(24, 325)">
      <rect width="472" height="70" rx="8" fill="#0f172a"/>
      <text x="20" y="30" fill="#34d399" font-size="15" font-weight="bold">4. 工业级多 Agent 编排 (Agentic Orchestration)</text>
      <text x="20" y="52" fill="#6ee7b7" font-size="13">熟练驾驭 Context 工程与 Evals 评估，以 10 倍效能打造坚不可摧的业务系统。</text>
    </g>
    <text x="260" y="445" text-anchor="middle" fill="#6ee7b7" font-size="14">🚀 最终蜕变：不可替代的“AI 时代系统总架构师”</text>
  </g>
</svg>