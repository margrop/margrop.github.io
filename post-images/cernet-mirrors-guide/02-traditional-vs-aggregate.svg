<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="good-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cernet-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="998" height="518" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="500" y="45" text-anchor="middle" fill="#f3f4f6" font-size="22" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">传统手动单点镜像 vs CERNET 智能聚合镜像架构对比</text>
  <text x="500" y="72" text-anchor="middle" fill="#9ca3af" font-size="13" font-family="system-ui, sans-serif">为什么你总在换源、崩源、卡源？根因剖析与终极破局</text>

  <!-- Left: Traditional -->
  <g transform="translate(40, 100)">
    <rect width="430" height="380" rx="12" fill="url(#bad-grad)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="16" y="16" width="140" height="28" rx="6" fill="#ef4444" fill-opacity="0.2"/>
    <text x="86" y="35" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">⚠️ 传统单点镜像困境</text>

    <!-- Content Items -->
    <g transform="translate(20, 65)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="26" fill="#fca5a5" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">1. 单点故障与炸服无解</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">固定死写清华/中科大/阿里源，一旦上游维护或同步失败报 502</text>
    </g>

    <g transform="translate(20, 138)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="26" fill="#fca5a5" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">2. 跨网跨运营商减速背刺</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">北方联通直连南方电信源，跨省跨网延迟飙升，丢包率极高</text>
    </g>

    <g transform="translate(20, 211)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="26" fill="#fca5a5" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">3. 碎片化源无法统一管理</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">apt/pip/brew/docker 源散落各处，文档老旧格式过时无法维护</text>
    </g>

    <g transform="translate(20, 284)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="26" fill="#fca5a5" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">4. 人工运维极其繁琐</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">每次开新虚拟机都要谷歌找教程，反复备份 sources.list 手动修改</text>
    </g>
  </g>

  <!-- Right: CERNET Hub -->
  <g transform="translate(530, 100)">
    <rect width="430" height="380" rx="12" fill="url(#good-grad)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="16" y="16" width="160" height="28" rx="6" fill="url(#cernet-btn)"/>
    <text x="96" y="35" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">🚀 CERNET 聚合智能站</text>

    <!-- Content Items -->
    <g transform="translate(20, 65)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#0e7490"/>
      <text x="16" y="26" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">1. MirrorZ-302 毫秒级智能分发</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">自动识别访客 IP 与 ASN，就近重定向至最优最快高校节点</text>
    </g>

    <g transform="translate(20, 138)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#0e7490"/>
      <text x="16" y="26" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">2. 动态健康监测与自动容灾</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">实时跟踪各站点同步状态，一旦某个源故障瞬间自动静默剔除</text>
    </g>

    <g transform="translate(20, 211)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#0e7490"/>
      <text x="16" y="26" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">3. 国家级教育科研骨干网支撑</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">清华、中科大、上交、南大数十所名校万兆高速内网协同聚合</text>
    </g>

    <g transform="translate(20, 284)">
      <rect width="390" height="60" rx="8" fill="#1e293b" stroke="#0e7490"/>
      <text x="16" y="26" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">4. 统一入口与一站式多端配置</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">一个域名搞定全部发行版与语言包，零心智负担，配置持久稳定</text>
    </g>
  </g>
</svg>