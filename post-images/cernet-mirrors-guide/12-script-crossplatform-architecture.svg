<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg-grad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" rx="16" fill="url(#bg-grad12)"/>
  <rect x="1" y="1" width="998" height="498" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">跨平台一键换源与 AI Agent 自动运维架构</text>
  <text x="500" y="68" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Windows 11 / Ubuntu 26.04 / macOS 26 三栖支持 · 零第三方依赖 · 自动化自愈</text>

  <!-- 3 OS Columns -->
  <!-- Col 1: Windows 11 -->
  <g transform="translate(50, 105)">
    <rect width="280" height="230" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="35" rx="6" fill="#1e3a8a"/>
    <text x="140" y="38" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">🪟 Windows 11</text>
    
    <g transform="translate(15, 65)" font-size="12" fill="#cbd5e1">
      <text y="20">• 脚本: <tspan fill="#60a5fa" font-family="monospace">cernet-switch.ps1</tspan></text>
      <text y="45">• 覆盖源: winget / pip / npm</text>
      <text y="70">• 特性: 原生 PowerShell 7 / 5.1</text>
      <text y="95">• 零额外包: 纯内置 REST &amp; WMI</text>
      <text y="120">• 模式: -Check / -Apply / -Json</text>
      <text y="145">• 自动备份: 历史配置文件打时间戳</text>
    </g>
  </g>

  <!-- Col 2: Ubuntu 26.04 -->
  <g transform="translate(360, 105)">
    <rect width="280" height="230" rx="10" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="35" rx="6" fill="#7c2d12"/>
    <text x="140" y="38" text-anchor="middle" fill="#fdba74" font-size="14" font-weight="bold">🐧 Ubuntu 26.04</text>
    
    <g transform="translate(15, 65)" font-size="12" fill="#cbd5e1">
      <text y="20">• 脚本: <tspan fill="#fb923c" font-family="monospace">cernet-switch.sh</tspan></text>
      <text y="45">• 覆盖源: APT DEB822 / pip / docker</text>
      <text y="70">• 特性: 兼容 /etc/apt/sources.list.d</text>
      <text y="95">• 零额外包: 纯 POSIX sh / awk / sed</text>
      <text y="120">• 模式: --check / --apply / --json</text>
      <text y="145">• 自动备份: .bak.YYYYMMDD_HHMMSS</text>
    </g>
  </g>

  <!-- Col 3: macOS 26 -->
  <g transform="translate(670, 105)">
    <rect width="280" height="230" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="35" rx="6" fill="#581c87"/>
    <text x="140" y="38" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="bold">🍎 macOS 26</text>
    
    <g transform="translate(15, 65)" font-size="12" fill="#cbd5e1">
      <text y="20">• 脚本: <tspan fill="#c084fc" font-family="monospace">cernet-switch.zsh</tspan></text>
      <text y="45">• 覆盖源: Homebrew / Bottles / pip</text>
      <text y="70">• 特性: 原生 Zsh 环境无缝集成</text>
      <text y="95">• 零额外包: 自动识别 Apple Silicon</text>
      <text y="120">• 模式: --check / --apply / --json</text>
      <text y="145">• 自动备份: 安全写入 ~/.zprofile</text>
    </g>
  </g>

  <!-- Bottom Panel: Dual Execution Workflow -->
  <g transform="translate(50, 360)">
    <rect width="900" height="105" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <g transform="translate(30, 20)">
      <rect width="400" height="65" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669"/>
      <text x="200" y="26" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">👤 人工一键执行模式</text>
      <text x="200" y="48" text-anchor="middle" fill="#cbd5e1" font-size="12">一键复制脚本粘贴运行，彩色友好输出，自动备份与提示</text>
    </g>

    <g transform="translate(470, 20)">
      <rect width="400" height="65" rx="6" fill="#312e81" fill-opacity="0.4" stroke="#6366f1"/>
      <text x="200" y="26" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="bold">🤖 AI Agent 自动化运维模式</text>
      <text x="200" y="48" text-anchor="middle" fill="#cbd5e1" font-size="12">支持 --json 参数输出标准化结构，Agent 快速自检与修复</text>
    </g>
  </g>
</svg>