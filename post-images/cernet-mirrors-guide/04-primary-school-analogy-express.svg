<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hub-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg-grad4)"/>
  <rect x="1" y="1" width="998" height="518" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <text x="500" y="45" text-anchor="middle" fill="#f3f4f6" font-size="22" font-family="system-ui, sans-serif" font-weight="bold">小学生也能懂的打比方：开源镜像站到底是个啥？</text>
  <text x="500" y="72" text-anchor="middle" fill="#9ca3af" font-size="13" font-family="system-ui, sans-serif">从“骑自行车去远方总厂”到“全国智慧顺丰冷链自动分拣”的生动演变</text>

  <!-- Metaphor Container Left: Old Way -->
  <g transform="translate(50, 105)">
    <rect width="420" height="365" rx="12" fill="#1e1b4b" fill-opacity="0.3" stroke="#6366f1" stroke-dasharray="4 2"/>
    <rect x="16" y="16" width="150" height="28" rx="6" fill="#4338ca"/>
    <text x="91" y="35" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">🚴 传统手动模式：跑断腿</text>

    <!-- Step 1 -->
    <g transform="translate(20, 60)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#312e81"/>
      <text x="16" y="25" fill="#a5b4fc" font-size="13" font-weight="bold">① 默认官方源 = 骑车跨洋去欧美总厂</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">每次要一颗螺丝钉（装个包），都要跨越太平洋，慢到怀疑人生。</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 130)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#312e81"/>
      <text x="16" y="25" fill="#a5b4fc" font-size="13" font-weight="bold">② 手动镜像 = 自己背出各大学小卖部门牌</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">清华大学开了分店，中科大也开了分店。你得死记硬背每个店地址。</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 200)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#312e81"/>
      <text x="16" y="25" fill="#ef4444" font-size="13" font-weight="bold">③ 闭店维修 = 兴冲冲跑去吃闭门羹</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">好不容易赶到清华店门口，发现挂着“盘点暂停营业”，只能掉头回家。</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(20, 270)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#312e81"/>
      <text x="16" y="25" fill="#f59e0b" font-size="13" font-weight="bold">④ 跨省堵车 = 路上全是红绿灯减速带</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">明明哈工大就在隔壁，你却舍近求远往广州中山大学跑，白白耗费时间。</text>
    </g>
  </g>

  <!-- Metaphor Container Right: CERNET Way -->
  <g transform="translate(530, 105)">
    <rect width="420" height="365" rx="12" fill="#064e3b" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="16" width="180" height="28" rx="6" fill="url(#hub-glow)"/>
    <text x="106" y="35" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">⚡ CERNET 聚合站：外卖闪送</text>

    <!-- Step 1 -->
    <g transform="translate(20, 60)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#065f46"/>
      <text x="16" y="25" fill="#34d399" font-size="13" font-weight="bold">① 唯一下单窗口 = 全国智能美团/外卖台</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">你只需要记住一个网址，像点外卖一样直接说：我要一个 Ubuntu 软件包！</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 130)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#065f46"/>
      <text x="16" y="25" fill="#34d399" font-size="13" font-weight="bold">② 实时雷达定位 = 自动算出哪个仓库最近</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">系统后台瞬间测算：你在上海？交大和复旦有货！直接派单给交大！</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 200)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#065f46"/>
      <text x="16" y="25" fill="#34d399" font-size="13" font-weight="bold">③ 智能秒级替补 = 某家缺货无缝换邻居</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">如果交大正在同步维护，0.01 秒内自动切给南京大学，你根本感受不到中断。</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(20, 270)">
      <rect width="380" height="60" rx="8" fill="#0f172a" stroke="#065f46"/>
      <text x="16" y="25" fill="#38bdf8" font-size="13" font-weight="bold">④ 高铁专用道 = 国家骨干教育网高速直达</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12">全程走大学专属高速光纤专线，没有社会公网拥堵，千兆带宽直接拉满！</text>
    </g>
  </g>
</svg>