<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <linearGradient id="bg-grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="node-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="540" rx="16" fill="url(#bg-grad7)"/>
  <rect x="1" y="1" width="998" height="538" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="bold">MirrorZ-302 核心算法与智能路由决策流</text>
  <text x="500" y="68" text-anchor="middle" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Client IP / ASN 解析 ➔ 成员健康评分 ➔ HTTP 302 临时重定向 ➔ 全速拉取数据</text>

  <!-- Flow diagram -->
  <!-- Step 1: Client -->
  <g transform="translate(50, 110)">
    <rect width="240" height="120" rx="10" fill="url(#node-blue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="35" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">💻 客户端请求发起</text>
    <text x="120" y="65" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="monospace">apt-get update</text>
    <text x="120" y="85" text-anchor="middle" fill="#94a3b8" font-size="11">GET https://mirrors.cernet.edu.cn/...</text>
    <text x="120" y="105" text-anchor="middle" fill="#64748b" font-size="11">携带 Client IP &amp; User-Agent</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 290 170 L 370 170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
  <text x="330" y="160" text-anchor="middle" fill="#38bdf8" font-size="11">DNS 解析</text>

  <!-- Step 2: CERNET Dispatcher -->
  <g transform="translate(380, 95)">
    <rect width="260" height="150" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="130" y="30" text-anchor="middle" fill="#c7d2fe" font-size="15" font-weight="bold">⚡ CERNET MirrorZ-302 调度引擎</text>
    
    <rect x="15" y="45" width="230" height="28" rx="6" fill="#312e81"/>
    <text x="130" y="64" text-anchor="middle" fill="#e0e7ff" font-size="12">IPIP.NET GeoIP 归属地与 ASN 提取</text>

    <rect x="15" y="80" width="230" height="28" rx="6" fill="#312e81"/>
    <text x="130" y="99" text-anchor="middle" fill="#e0e7ff" font-size="12">遍历 mirrorz.json 实时同步状态</text>

    <rect x="15" y="115" width="230" height="25" rx="6" fill="#0284c7" fill-opacity="0.4"/>
    <text x="130" y="132" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">综合打分 = 运营商 + 地域 + 延迟 + 状态</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 640 170 L 720 170" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="680" y="160" text-anchor="middle" fill="#a5b4fc" font-size="11">302 Found</text>

  <!-- Step 3: University Mirror Nodes -->
  <g transform="translate(730, 95)">
    <rect width="220" height="150" rx="10" fill="url(#node-blue)" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="30" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">🏫 最优高校镜像节点</text>

    <g transform="translate(15, 45)">
      <rect width="190" height="26" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669"/>
      <text x="95" y="18" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">🏆 Top 1: 清华大学 TUNA</text>
    </g>
    <g transform="translate(15, 78)">
      <rect width="190" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="95" y="18" text-anchor="middle" fill="#94a3b8" font-size="12">Top 2: 中科大 USTC</text>
    </g>
    <g transform="translate(15, 111)">
      <rect width="190" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="95" y="18" text-anchor="middle" fill="#94a3b8" font-size="12">Top 3: 上交大 SJTU / 南大</text>
    </g>
  </g>

  <!-- Lower Phase: Real Data Transmission -->
  <g transform="translate(50, 300)">
    <rect width="900" height="195" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="450" y="32" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">高效数据传输阶段 (Direct Peer-to-Peer Pipeline)</text>
    
    <g transform="translate(30, 50)">
      <rect width="260" height="115" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="bold">1. HTTP 302 重定向握手</text>
      <text x="20" y="55" fill="#cbd5e1" font-size="11" font-family="monospace">HTTP/2 302 Found</text>
      <text x="20" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">Location: https://mirrors.hit...</text>
      <text x="20" y="98" fill="#94a3b8" font-size="11">耗时仅 10~25ms，不产生大流量</text>
    </g>

    <g transform="translate(320, 50)">
      <rect width="260" height="115" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="28" fill="#34d399" font-size="13" font-weight="bold">2. 客户端直连最近高校</text>
      <text x="20" y="55" fill="#cbd5e1" font-size="11">客户端自动沿 Location 发起请求</text>
      <text x="20" y="78" fill="#cbd5e1" font-size="11">利用高校直连千兆/万兆 CDN 节点</text>
      <text x="20" y="98" fill="#94a3b8" font-size="11">CERNET 调度中心无流量转发瓶颈</text>
    </g>

    <g transform="translate(610, 50)">
      <rect width="260" height="115" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="28" fill="#fbbf24" font-size="13" font-weight="bold">3. 容灾降级与无缝切流</text>
      <text x="20" y="55" fill="#cbd5e1" font-size="11">某镜像站磁盘满载或网络波动？</text>
      <text x="20" y="78" fill="#cbd5e1" font-size="11">探针打分立降，下一请求瞬时重定向</text>
      <text x="20" y="98" fill="#94a3b8" font-size="11">用户侧无感知，终结手动改源历史</text>
    </g>
  </g>
</svg>