<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0b1120"/>
  <rect x="48" y="40" width="400" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">SYSTEM ARCHITECTURE · PRODUCTION WORKFLOW</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="sans-serif">Production-Grade Claude Code Tri-Model Orchestration</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="sans-serif">From prompt intake to Jev routing, Sonnet execution, Haiku subagents, and Opus advisor escalation</text>
  
  <!-- Step 1 -->
  <rect x="48" y="230" width="220" height="180" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="68" y="270" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">STAGE 1: INPUT</text>
  <text x="68" y="310" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">User Prompt</text>
  <text x="68" y="344" fill="#94a3b8" font-size="13" font-family="sans-serif">Feature request or refactoring</text>
  <text x="68" y="370" fill="#cbd5e1" font-size="12" font-family="DejaVu Sans Mono, monospace">claude [prompt]</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="268" y1="320" x2="318" y2="320" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="318,315 328,320 318,325" fill="#38bdf8"/>

  <!-- Step 2 -->
  <rect x="328" y="210" width="250" height="220" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="348" y="230" width="100" height="24" rx="4" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="356" y="247" fill="#fbbf24" font-size="12" font-weight="bold" font-family="sans-serif">System 1 Gate</text>
  <text x="348" y="290" fill="#f8fafc" font-size="22" font-weight="bold" font-family="sans-serif">Jev Router</text>
  <text x="348" y="324" fill="#94a3b8" font-size="13" font-family="sans-serif">Non-autoregressive (&lt;5ms)</text>
  <text x="348" y="354" fill="#cbd5e1" font-size="12" font-family="sans-serif">· Deterministic tool routing</text>
  <text x="348" y="380" fill="#cbd5e1" font-size="12" font-family="sans-serif">· Escalates complex logic to LLM</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="578" y1="320" x2="628" y2="320" stroke="#38bdf8" stroke-width="3"/>
  <polygon points="628,315 638,320 628,325" fill="#38bdf8"/>

  <!-- Step 3 -->
  <rect x="638" y="200" width="360" height="420" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <rect x="662" y="224" width="120" height="26" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="672" y="242" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">PRIMARY EXECUTOR</text>
  <text x="662" y="286" fill="#f8fafc" font-size="24" font-weight="bold" font-family="sans-serif">Claude Sonnet 5.5</text>
  <text x="662" y="318" fill="#94a3b8" font-size="14" font-family="sans-serif">Long-horizon coding &amp; tool driver</text>
  <line x1="662" y1="340" x2="974" y2="340" stroke="#334155"/>
  <text x="662" y="372" fill="#cbd5e1" font-size="14" font-family="sans-serif">1. Plans task execution path</text>
  <text x="662" y="402" fill="#cbd5e1" font-size="14" font-family="sans-serif">2. Delegates exploration to Haiku</text>
  <text x="662" y="432" fill="#cbd5e1" font-size="14" font-family="sans-serif">3. Writes code and applies precise diffs</text>
  <text x="662" y="462" fill="#cbd5e1" font-size="14" font-family="sans-serif">4. Calls Opus advisor at 3 checkpoints</text>
  <rect x="662" y="500" width="312" height="90" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="678" y="530" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Context Window Shield:</text>
  <text x="678" y="556" fill="#94a3b8" font-size="12" font-family="sans-serif">Raw search logs &amp; verbose test outputs stay</text>
  <text x="678" y="576" fill="#94a3b8" font-size="12" font-family="sans-serif">encapsulated inside subagent threads!</text>

  <!-- Step 4A: Subagents -->
  <rect x="220" y="520" width="358" height="280" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <rect x="240" y="540" width="130" height="24" rx="4" fill="rgba(52, 211, 153, 0.2)"/>
  <text x="250" y="557" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif">PARALLEL SCOUTS</text>
  <text x="240" y="596" fill="#f8fafc" font-size="22" font-weight="bold" font-family="sans-serif">Haiku 5.5 Subagents</text>
  <text x="240" y="630" fill="#94a3b8" font-size="13" font-family="sans-serif">· @search: Read-only repo layout &amp; symbols</text>
  <text x="240" y="658" fill="#94a3b8" font-size="13" font-family="sans-serif">· @grep: Call-site and reference indexing</text>
  <text x="240" y="686" fill="#94a3b8" font-size="13" font-family="sans-serif">· @audit: Git worktree test &amp; lint sandbox</text>
  <rect x="240" y="714" width="318" height="62" rx="6" fill="#0f172a"/>
  <text x="254" y="740" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">worktree: .claude/worktrees/audit-tree</text>
  <text x="254" y="760" fill="#94a3b8" font-size="11" font-family="sans-serif">Physical isolation: never touches uncommitted files</text>

  <path d="M 638,480 L 578,560" stroke="#34d399" stroke-width="2" fill="none"/>
  <polygon points="578,552 570,566 584,562" fill="#34d399"/>

  <!-- Step 4B: Opus Advisor -->
  <rect x="1060" y="200" width="332" height="420" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="3"/>
  <rect x="1084" y="224" width="120" height="26" rx="4" fill="rgba(192, 132, 252, 0.2)"/>
  <text x="1094" y="242" fill="#c084fc" font-size="13" font-weight="bold" font-family="sans-serif">STRATEGIC BRAIN</text>
  <text x="1084" y="286" fill="#f8fafc" font-size="24" font-weight="bold" font-family="sans-serif">Claude Opus 5.5</text>
  <text x="1084" y="318" fill="#94a3b8" font-size="14" font-family="sans-serif">Frontier reasoning · No tools · Guidance only</text>
  <line x1="1084" y1="340" x2="1368" y2="340" stroke="#334155"/>
  <text x="1084" y="374" fill="#f87171" font-size="14" font-weight="bold" font-family="sans-serif">Checkpoint 1: Pre-Plan Finalization</text>
  <text x="1084" y="402" fill="#cbd5e1" font-size="13" font-family="sans-serif">Reviews architecture, prevents dead-ends</text>
  <text x="1084" y="442" fill="#f87171" font-size="14" font-weight="bold" font-family="sans-serif">Checkpoint 2: 2nd Recurring Error</text>
  <text x="1084" y="470" fill="#cbd5e1" font-size="13" font-family="sans-serif">Breaks circular debugging deadlocks</text>
  <text x="1084" y="510" fill="#f87171" font-size="14" font-weight="bold" font-family="sans-serif">Checkpoint 3: Pre-Completion Audit</text>
  <text x="1084" y="538" fill="#cbd5e1" font-size="13" font-family="sans-serif">Final diff verification before declaring done</text>

  <line x1="998" y1="380" x2="1060" y2="380" stroke="#c084fc" stroke-width="3"/>
  <polygon points="1050,375 1060,380 1050,385" fill="#c084fc"/>
  <polygon points="1008,375 998,380 1008,385" fill="#c084fc"/>

  <!-- Step 5 -->
  <rect x="638" y="680" width="360" height="120" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="662" y="718" fill="#34d399" font-size="16" font-weight="bold" font-family="sans-serif">DELIVERY: Zero Regression Code</text>
  <text x="662" y="748" fill="#cbd5e1" font-size="13" font-family="sans-serif">· Clean diff presented to user</text>
  <text x="662" y="774" fill="#cbd5e1" font-size="13" font-family="sans-serif">· Confirmed Git commit &amp; push</text>
  <line x1="818" y1="620" x2="818" y2="680" stroke="#10b981" stroke-width="3"/>
  <polygon points="813,670 818,680 823,670" fill="#10b981"/>
</svg>