<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0a0f1d"/>
  <rect x="48" y="40" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">通俗易懂 · 小学生秒懂的大比方</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">把 Claude Code 三模架构看作「现代化摩天大楼建设团队」</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">为什么把所有人塞进同一间会议室会吵翻天？看看高效工程队如何各司其职</text>
  
  <!-- 4 Metaphor Columns -->
  <!-- Col 1: Foreman -->
  <rect x="48" y="210" width="310" height="580" rx="16" fill="#161f30" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="203" cy="280" r="44" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="183" y="292" font-size="36">👷</text>
  <text x="203" y="360" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">工地带班工头</text>
  <text x="203" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="Noto Sans CJK SC, sans-serif">Claude Sonnet 5.5</text>
  <line x1="78" y1="416" x2="328" y2="416" stroke="#334155"/>
  <text x="78" y="450" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【工作状态】：</text>
  <text x="78" y="478" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">天天泡在施工现场，挽起袖子</text>
  <text x="78" y="504" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">亲自砌砖、拧螺丝、接电线。</text>
  <text x="78" y="540" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【为什么是他】：</text>
  <text x="78" y="568" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">干活利索、身强力壮、成本可控。</text>
  <text x="78" y="594" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">掌握最真实的现场施工细节。</text>
  <rect x="72" y="650" width="262" height="110" rx="10" fill="#0f172a"/>
  <text x="90" y="684" fill="#38bdf8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">比方金句：</text>
  <text x="90" y="710" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">工头不需要懂量子力学，</text>
  <text x="90" y="734" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">但他知道哪堵墙水泥还没干！</text>

  <!-- Col 2: Scouts -->
  <rect x="382" y="210" width="310" height="580" rx="16" fill="#161f30" stroke="#34d399" stroke-width="2"/>
  <circle cx="537" cy="280" r="44" fill="rgba(52, 211, 153, 0.2)"/>
  <text x="517" y="292" font-size="36">🏃</text>
  <text x="537" y="360" text-anchor="middle" fill="#34d399" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">现场勘探与跑腿员</text>
  <text x="537" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="Noto Sans CJK SC, sans-serif">Claude Haiku 5.5</text>
  <line x1="412" y1="416" x2="662" y2="416" stroke="#334155"/>
  <text x="412" y="450" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【工作状态】：</text>
  <text x="412" y="478" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">脚踩平衡车，满仓库查库存、</text>
  <text x="412" y="504" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">找图纸，在独立样板间做测试。</text>
  <text x="412" y="540" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【为什么是他】：</text>
  <text x="412" y="568" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">动作飞快、只搜不改、成本极低。</text>
  <text x="412" y="594" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">绝不把仓库的灰尘带进主办公室。</text>
  <rect x="406" y="650" width="262" height="110" rx="10" fill="#0f172a"/>
  <text x="424" y="684" fill="#34d399" font-size="13" font-family="Noto Sans CJK SC, sans-serif">比方金句：</text>
  <text x="424" y="710" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">只带结论回来，不把</text>
  <text x="424" y="734" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">1000斤废旧钢筋堆在客厅！</text>

  <!-- Col 3: Chief Architect -->
  <rect x="716" y="210" width="310" height="580" rx="16" fill="#161f30" stroke="#c084fc" stroke-width="2"/>
  <circle cx="871" cy="280" r="44" fill="rgba(192, 132, 252, 0.2)"/>
  <text x="851" y="292" font-size="36">🏛️</text>
  <text x="871" y="360" text-anchor="middle" fill="#c084fc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">特聘结构总设计师</text>
  <text x="871" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="Noto Sans CJK SC, sans-serif">Claude Opus 5.5</text>
  <line x1="746" y1="416" x2="996" y2="416" stroke="#334155"/>
  <text x="746" y="450" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【工作状态】：</text>
  <text x="746" y="478" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">坐在远方总部办公室喝咖啡，</text>
  <text x="746" y="504" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">每小时出场咨询费高达上万元。</text>
  <text x="746" y="540" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【为什么是他】：</text>
  <text x="746" y="568" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">智力极强，只在承重墙出现裂缝</text>
  <text x="746" y="594" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">或最终大楼竣工签字时视频指导。</text>
  <rect x="740" y="650" width="262" height="110" rx="10" fill="#0f172a"/>
  <text x="758" y="684" fill="#c084fc" font-size="13" font-family="Noto Sans CJK SC, sans-serif">比方金句：</text>
  <text x="758" y="710" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">好钢用在刀刃上，别让</text>
  <text x="758" y="734" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">院士去工地现场扫地搬水泥！</text>

  <!-- Col 4: Smart Gate -->
  <rect x="1050" y="210" width="342" height="580" rx="16" fill="#161f30" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="1221" cy="280" r="44" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="1201" y="292" font-size="36">⚡</text>
  <text x="1221" y="360" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">智能自动门禁闸机</text>
  <text x="1221" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="Noto Sans CJK SC, sans-serif">Jev Decision Engine</text>
  <line x1="1080" y1="416" x2="1362" y2="416" stroke="#334155"/>
  <text x="1080" y="450" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【工作状态】：</text>
  <text x="1080" y="478" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">门禁摄像头一扫，货车走货道、</text>
  <text x="1080" y="504" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">工人刷脸进，0.005 秒自动抬杆。</text>
  <text x="1080" y="540" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【为什么是他】：</text>
  <text x="1080" y="568" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">不需要任何人类或大模型动脑，</text>
  <text x="1080" y="594" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">确定性规则直接毫秒分流。</text>
  <rect x="1074" y="650" width="294" height="110" rx="10" fill="#0f172a"/>
  <text x="1092" y="684" fill="#fbbf24" font-size="13" font-family="Noto Sans CJK SC, sans-serif">比方金句：</text>
  <text x="1092" y="710" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">挑一把螺丝刀不需要开个研讨会，</text>
  <text x="1092" y="734" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">闸机闪电识别直接放行！</text>
</svg>