<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0b1120"/>
  <rect x="48" y="40" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">全自动脚本 · 跨三大操作系统支持</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Windows 11 / Ubuntu 26.04 / macOS 27 一键全自动配置套件</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">零第三方外部依赖 · 原生 Shell/PowerShell 驱动 · 人工交互与 AI Agent 结构化自动化双模切换</text>
  
  <!-- 3 OS Cards -->
  <!-- Windows 11 -->
  <rect x="48" y="210" width="420" height="470" rx="16" fill="#161f30" stroke="#0078d4" stroke-width="2"/>
  <rect x="76" y="236" width="140" height="30" rx="6" fill="rgba(0, 120, 212, 0.2)"/>
  <text x="88" y="256" fill="#60a5fa" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Windows 11 专版</text>
  <text x="76" y="306" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">PowerShell 自动化套件</text>
  <text x="76" y="338" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">支持 Win11 23H2 / 24H2 / 25H2 原生终端</text>
  <line x1="76" y1="360" x2="438" y2="360" stroke="#334155"/>
  <text x="76" y="394" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 零依赖：纯原生 PowerShell 脚本</text>
  <text x="76" y="424" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 自动建立 .claude\\agents 三大子代理</text>
  <text x="76" y="454" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 自动初始化 Git Worktree 隔离沙箱</text>
  <text x="76" y="484" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 写入 settings.json 与 CLAUDE.md 规则</text>
  <rect x="76" y="520" width="364" height="64" rx="8" fill="#0f172a"/>
  <text x="92" y="546" fill="#60a5fa" font-size="12" font-family="DejaVu Sans Mono, monospace">.\claude_code_trimodel_setup_windows11.ps1</text>
  <text x="92" y="568" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">.\...ps1 -Auto -Json (适合 AI Agent 调用)</text>
  <rect x="76" y="600" width="364" height="60" rx="8" fill="#1e293b"/>
  <text x="92" y="636" fill="#34d399" font-size="13" font-family="Noto Sans CJK SC, sans-serif">✔ 已通过 Windows 11 专业版实测验证</text>

  <!-- Ubuntu 26.04 -->
  <rect x="510" y="210" width="420" height="470" rx="16" fill="#161f30" stroke="#e95420" stroke-width="2"/>
  <rect x="538" y="236" width="140" height="30" rx="6" fill="rgba(233, 84, 32, 0.2)"/>
  <text x="550" y="256" fill="#fb923c" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Ubuntu 26.04 专版</text>
  <text x="538" y="306" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Bash 生产级流水线</text>
  <text x="538" y="338" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">全面兼容 Ubuntu 22.04 / 24.04 / 26.04 LTS</text>
  <line x1="538" y1="360" x2="900" y2="360" stroke="#334155"/>
  <text x="538" y="394" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 严格遵循 set -euo pipefail 防御标准</text>
  <text x="538" y="424" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 自动建立 .claude/worktrees 物理隔离</text>
  <text x="538" y="454" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 自动向 .gitignore 写入沙箱忽略规则</text>
  <text x="538" y="484" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 固化 advisorModel: opus 与子代理</text>
  <rect x="538" y="520" width="364" height="64" rx="8" fill="#0f172a"/>
  <text x="554" y="546" fill="#fb923c" font-size="12" font-family="DejaVu Sans Mono, monospace">./claude_code_trimodel_setup_ubuntu2604.sh</text>
  <text x="554" y="568" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">./...sh --auto --json (适合 CI/CD &amp; Agent)</text>
  <rect x="538" y="600" width="364" height="60" rx="8" fill="#1e293b"/>
  <text x="554" y="636" fill="#34d399" font-size="13" font-family="Noto Sans CJK SC, sans-serif">✔ 已通过 Ubuntu 26.04 LTS 生产实测</text>

  <!-- macOS 27 -->
  <rect x="972" y="210" width="420" height="470" rx="16" fill="#161f30" stroke="#a855f7" stroke-width="2"/>
  <rect x="1000" y="236" width="140" height="30" rx="6" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="1012" y="256" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">macOS 27 专版</text>
  <text x="1000" y="306" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Zsh 原生极速套件</text>
  <text x="1000" y="338" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">适配 Apple Silicon (M3/M4/M5) 及 Sonoma/Sequoia</text>
  <line x1="1000" y1="360" x2="1362" y2="360" stroke="#334155"/>
  <text x="1000" y="394" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 原生 Zsh 驱动，支持彩色交互式排版</text>
  <text x="1000" y="424" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 智能检测 /opt/homebrew 路径与环境</text>
  <text x="1000" y="454" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 完整生成 .claude/agents/*.md 生产配置</text>
  <text x="1000" y="484" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 结构化标准 JSON 输出，方便上层调度</text>
  <rect x="1000" y="520" width="364" height="64" rx="8" fill="#0f172a"/>
  <text x="1016" y="546" fill="#c084fc" font-size="12" font-family="DejaVu Sans Mono, monospace">./claude_code_trimodel_setup_macos27.zsh</text>
  <text x="1016" y="568" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">./...zsh --auto --json (支持自动化接入)</text>
  <rect x="1000" y="600" width="364" height="60" rx="8" fill="#1e293b"/>
  <text x="1016" y="636" fill="#34d399" font-size="13" font-family="Noto Sans CJK SC, sans-serif">✔ 已通过 macOS 27 Apple Silicon 实测</text>

  <!-- Bottom Bar: Dual Modes -->
  <rect x="48" y="710" width="1344" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="746" fill="#38bdf8" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">两种执行方式自由选择：</text>
  <text x="80" y="774" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">① 人工交互模式：直接在终端执行脚本，带丰富彩色日志引导、风险提示与执行确认；</text>
  <text x="80" y="796" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">② Agent 自动化模式：传入 --auto --json 参数，直接返回结构化 JSON 状态，零弹窗、零中断，极速接入 CI/CD 流水线。</text>
</svg>