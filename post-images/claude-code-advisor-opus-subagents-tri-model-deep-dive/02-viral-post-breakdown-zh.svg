<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0f172a"/>
  <rect x="48" y="40" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">事实核查 · 爆款文案深度剖析</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">「这真的是一座金矿！」爆款推文解构：神话 vs 现实</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">拆解网络疯传的 Claude Code 提示词神技，分清原生特性与营销包装</text>
  
  <!-- Left Box: The Viral Tweet Claims -->
  <rect x="48" y="210" width="650" height="590" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="76" y="236" width="160" height="32" rx="8" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="92" y="258" fill="#f87171" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">网传文案声称 (Hype)</text>
  
  <text x="76" y="306" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">1. 启动命令神技：</text>
  <text x="76" y="334" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans Mono, monospace">claude --model sonnet --advisor opus</text>
  
  <text x="76" y="380" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">2. 完美的乌托邦分工：</text>
  <text x="76" y="410" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· Sonnet 负责写代码、改 bug</text>
  <text x="76" y="438" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· Haiku 并行扫库，负责 search、grep、audit</text>
  <text x="76" y="466" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· Opus 只在关键 3 处当顾问，不浪费上下文</text>
  <text x="76" y="494" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· JEV 毫秒级处理所有小选择</text>
  
  <text x="76" y="540" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">3. 「一键粘贴即可自动配置」提示词：</text>
  <rect x="76" y="560" width="594" height="210" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="96" y="594" fill="#e2e8f0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">"按这个结构重新配置我的 Claude Code: ...</text>
  <text x="96" y="624" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">在 .claude/agents 建三个子代理、设置 worktree 隔离、</text>
  <text x="96" y="654" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">给 CLAUDE.md 加规则、快速小选择交给 JEV 处理..."</text>
  <text x="96" y="700" fill="#f87171" font-size="13" font-family="Noto Sans CJK SC, sans-serif">【破绽】：大模型读了文本不会自动挂载 Jev 网关，也不会自动调 Git API 绑定 worktree！</text>

  <!-- Right Box: Engineering Reality Check -->
  <rect x="742" y="210" width="650" height="590" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="770" y="236" width="180" height="32" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="786" y="258" fill="#34d399" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">真实工程落地 (Reality)</text>
  
  <text x="770" y="306" fill="#34d399" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">✔ 原生支持且真实有效：</text>
  <text x="770" y="336" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Anthropic 官方正式上线 Advisor Strategy 与 --advisor 参数</text>
  <text x="770" y="364" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 支持 .claude/agents/*.md 真实子代理与上下文隔离</text>
  <text x="770" y="392" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Git Worktree 是业界公认最坚固的 Agent 隔离沙箱</text>
  
  <text x="770" y="440" fill="#fbbf24" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">⚠ 必须补充的基础设施与避坑点：</text>
  <text x="770" y="470" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Jev 是 TypeSafe AI 的独立非自回归模型，需代理脚本或钩子转发</text>
  <text x="770" y="498" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 纯靠给 LLM 贴提示词无法持久化设置，必须写进 settings.json</text>
  <text x="770" y="526" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Worktree 必须预先由宿主机 git 命令行创建并绑定到 subagent</text>
  
  <text x="770" y="574" fill="#38bdf8" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">★ 终极结论：</text>
  <rect x="770" y="594" width="594" height="176" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="790" y="630" fill="#f8fafc" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">思路完全正确，确实是架构金矿！</text>
  <text x="790" y="662" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">但它不是一段魔法咒语，而是需要扎实脚本驱动的多智能体协同工程。</text>
  <text x="790" y="694" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">必须使用标准自动化脚本将配置、沙箱与快速网关一次性固化到本地。</text>
</svg>