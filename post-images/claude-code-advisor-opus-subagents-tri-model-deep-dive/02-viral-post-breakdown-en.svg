<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0f172a"/>
  <rect x="48" y="40" width="400" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">FACT CHECK · VIRAL POST DEEP DIVE</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="sans-serif">"This is a Gold Mine!" Viral Tweet Anatomy: Hype vs Reality</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="sans-serif">Dissecting the viral Claude Code prompt: separating native features from marketing hype</text>
  
  <!-- Left Box -->
  <rect x="48" y="210" width="650" height="590" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="76" y="236" width="170" height="32" rx="8" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="92" y="258" fill="#f87171" font-size="15" font-weight="bold" font-family="sans-serif">The Viral Claims (Hype)</text>
  
  <text x="76" y="306" fill="#f8fafc" font-size="18" font-weight="bold" font-family="sans-serif">1. The One-Liner Command:</text>
  <text x="76" y="334" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans Mono, monospace">claude --model sonnet --advisor opus</text>
  
  <text x="76" y="380" fill="#f8fafc" font-size="18" font-weight="bold" font-family="sans-serif">2. The Utopian Division of Labor:</text>
  <text x="76" y="410" fill="#94a3b8" font-size="15" font-family="sans-serif">· Sonnet 5.5 writes code and fixes bugs</text>
  <text x="76" y="438" fill="#94a3b8" font-size="15" font-family="sans-serif">· Haiku 5.5 scans repository in parallel (search, grep, audit)</text>
  <text x="76" y="466" fill="#94a3b8" font-size="15" font-family="sans-serif">· Opus 5.5 advises only on 3 milestones to save context</text>
  <text x="76" y="494" fill="#94a3b8" font-size="15" font-family="sans-serif">· Jev handles small decisions in sub-milliseconds</text>
  
  <text x="76" y="540" fill="#f8fafc" font-size="18" font-weight="bold" font-family="sans-serif">3. The "Just Paste This Prompt" Myth:</text>
  <rect x="76" y="560" width="594" height="210" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="96" y="594" fill="#e2e8f0" font-size="14" font-family="sans-serif">"Reconfigure my Claude Code according to this structure: ...</text>
  <text x="96" y="624" fill="#94a3b8" font-size="14" font-family="sans-serif">create 3 Haiku subagents, isolate audit in worktree,</text>
  <text x="96" y="654" fill="#94a3b8" font-size="14" font-family="sans-serif">add CLAUDE.md rules, delegate quick decisions to JEV..."</text>
  <text x="96" y="700" fill="#f87171" font-size="13" font-family="sans-serif">[Reality Gap]: An LLM prompt alone cannot bind Git worktrees or install external Jev proxies!</text>

  <!-- Right Box -->
  <rect x="742" y="210" width="650" height="590" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="770" y="236" width="220" height="32" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="786" y="258" fill="#34d399" font-size="15" font-weight="bold" font-family="sans-serif">Production Engineering Reality</text>
  
  <text x="770" y="306" fill="#34d399" font-size="17" font-weight="bold" font-family="sans-serif">✔ Natively Supported &amp; Highly Effective:</text>
  <text x="770" y="336" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Official Anthropic Advisor Strategy with --advisor CLI flag</text>
  <text x="770" y="364" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Real context isolation via .claude/agents/*.md</text>
  <text x="770" y="392" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Git Worktree sandboxing prevents uncommitted work contamination</text>
  
  <text x="770" y="440" fill="#fbbf24" font-size="17" font-weight="bold" font-family="sans-serif">⚠ Required Infrastructure &amp; Gotchas:</text>
  <text x="770" y="470" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Jev requires an external proxy or local deterministic router hook</text>
  <text x="770" y="498" fill="#cbd5e1" font-size="14" font-family="sans-serif">· CLI flags must be stored in settings.json to persist across sessions</text>
  <text x="770" y="526" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Worktree directories must be provisioned via Git commands</text>
  
  <text x="770" y="574" fill="#38bdf8" font-size="17" font-weight="bold" font-family="sans-serif">★ The Verdict:</text>
  <rect x="770" y="594" width="594" height="176" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="790" y="630" fill="#f8fafc" font-size="15" font-weight="bold" font-family="sans-serif">The architecture is indeed a gold mine!</text>
  <text x="790" y="662" fill="#94a3b8" font-size="14" font-family="sans-serif">However, it is not a magic prompt; it is a multi-agent systems engineering task.</text>
  <text x="790" y="694" fill="#94a3b8" font-size="14" font-family="sans-serif">Automated setup scripts are essential to configure local sandboxes and routing rules.</text>
</svg>