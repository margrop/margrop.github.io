<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0a0f1d"/>
  <rect x="48" y="40" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">INTUITIVE METAPHOR · 70%+ KID UNDERSTANDABLE</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="sans-serif">The "Modern Skyscraper Construction Team" Analogy</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="sans-serif">Why cramming everyone into one room causes chaos: how specialized teams collaborate efficiently</text>
  
  <!-- 4 Metaphor Columns -->
  <!-- Col 1 -->
  <rect x="48" y="210" width="310" height="580" rx="16" fill="#161f30" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="203" cy="280" r="44" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="183" y="292" font-size="36">👷</text>
  <text x="203" y="360" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold" font-family="sans-serif">Construction Foreman</text>
  <text x="203" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif">Claude Sonnet 5.5</text>
  <line x1="78" y1="416" x2="328" y2="416" stroke="#334155"/>
  <text x="78" y="450" fill="#cbd5e1" font-size="14" font-family="sans-serif">Daily Routine:</text>
  <text x="78" y="478" fill="#94a3b8" font-size="14" font-family="sans-serif">Onsite daily, sleeves rolled up,</text>
  <text x="78" y="504" fill="#94a3b8" font-size="14" font-family="sans-serif">laying bricks, fixing wiring.</text>
  <text x="78" y="540" fill="#cbd5e1" font-size="14" font-family="sans-serif">Why Him:</text>
  <text x="78" y="568" fill="#94a3b8" font-size="14" font-family="sans-serif">Fast, reliable, cost-effective.</text>
  <text x="78" y="594" fill="#94a3b8" font-size="14" font-family="sans-serif">Holds ground-truth physical context.</text>
  <rect x="72" y="650" width="262" height="110" rx="10" fill="#0f172a"/>
  <text x="90" y="684" fill="#38bdf8" font-size="13" font-family="sans-serif">Key Insight:</text>
  <text x="90" y="710" fill="#cbd5e1" font-size="13" font-family="sans-serif">He doesn't need a PhD to know</text>
  <text x="90" y="734" fill="#cbd5e1" font-size="13" font-family="sans-serif">which wall's cement is still wet!</text>

  <!-- Col 2 -->
  <rect x="382" y="210" width="310" height="580" rx="16" fill="#161f30" stroke="#34d399" stroke-width="2"/>
  <circle cx="537" cy="280" r="44" fill="rgba(52, 211, 153, 0.2)"/>
  <text x="517" y="292" font-size="36">🏃</text>
  <text x="537" y="360" text-anchor="middle" fill="#34d399" font-size="20" font-weight="bold" font-family="sans-serif">Field Scouts &amp; Runners</text>
  <text x="537" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif">Claude Haiku 5.5</text>
  <line x1="412" y1="416" x2="662" y2="416" stroke="#334155"/>
  <text x="412" y="450" fill="#cbd5e1" font-size="14" font-family="sans-serif">Daily Routine:</text>
  <text x="412" y="478" fill="#94a3b8" font-size="14" font-family="sans-serif">Riding scooters, checking warehouse</text>
  <text x="412" y="504" fill="#94a3b8" font-size="14" font-family="sans-serif">inventory &amp; sandbox mockups.</text>
  <text x="412" y="540" fill="#cbd5e1" font-size="14" font-family="sans-serif">Why Him:</text>
  <text x="412" y="568" fill="#94a3b8" font-size="14" font-family="sans-serif">Blazing fast, read-only, cheap.</text>
  <text x="412" y="594" fill="#94a3b8" font-size="14" font-family="sans-serif">Never drags warehouse dust to HQ.</text>
  <rect x="406" y="650" width="262" height="110" rx="10" fill="#0f172a"/>
  <text x="424" y="684" fill="#34d399" font-size="13" font-family="sans-serif">Key Insight:</text>
  <text x="424" y="710" fill="#cbd5e1" font-size="13" font-family="sans-serif">Returns concise summaries instead</text>
  <text x="424" y="734" fill="#cbd5e1" font-size="13" font-family="sans-serif">of dumping tons of scrap metal!</text>

  <!-- Col 3 -->
  <rect x="716" y="210" width="310" height="580" rx="16" fill="#161f30" stroke="#c084fc" stroke-width="2"/>
  <circle cx="871" cy="280" r="44" fill="rgba(192, 132, 252, 0.2)"/>
  <text x="851" y="292" font-size="36">🏛️</text>
  <text x="871" y="360" text-anchor="middle" fill="#c084fc" font-size="20" font-weight="bold" font-family="sans-serif">Chief Structural Architect</text>
  <text x="871" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif">Claude Opus 5.5</text>
  <line x1="746" y1="416" x2="996" y2="416" stroke="#334155"/>
  <text x="746" y="450" fill="#cbd5e1" font-size="14" font-family="sans-serif">Daily Routine:</text>
  <text x="746" y="478" fill="#94a3b8" font-size="14" font-family="sans-serif">At remote headquarters office,</text>
  <text x="746" y="504" fill="#94a3b8" font-size="14" font-family="sans-serif">consulting rate is $1,000/hr.</text>
  <text x="746" y="540" fill="#cbd5e1" font-size="14" font-family="sans-serif">Why Him:</text>
  <text x="746" y="568" fill="#94a3b8" font-size="14" font-family="sans-serif">Peak reasoning. Only called when a</text>
  <text x="746" y="594" fill="#94a3b8" font-size="14" font-family="sans-serif">pillar cracks or before final sign-off.</text>
  <rect x="740" y="650" width="262" height="110" rx="10" fill="#0f172a"/>
  <text x="758" y="684" fill="#c084fc" font-size="13" font-family="sans-serif">Key Insight:</text>
  <text x="758" y="710" fill="#cbd5e1" font-size="13" font-family="sans-serif">Save top brains for critical crises,</text>
  <text x="758" y="734" fill="#cbd5e1" font-size="13" font-family="sans-serif">never have architects sweep floors!</text>

  <!-- Col 4 -->
  <rect x="1050" y="210" width="342" height="580" rx="16" fill="#161f30" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="1221" cy="280" r="44" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="1201" y="292" font-size="36">⚡</text>
  <text x="1221" y="360" text-anchor="middle" fill="#fbbf24" font-size="20" font-weight="bold" font-family="sans-serif">Automated Smart Gate</text>
  <text x="1221" y="390" text-anchor="middle" fill="#f8fafc" font-size="16" font-family="sans-serif">Jev Decision Engine</text>
  <line x1="1080" y1="416" x2="1362" y2="416" stroke="#334155"/>
  <text x="1080" y="450" fill="#cbd5e1" font-size="14" font-family="sans-serif">Daily Routine:</text>
  <text x="1080" y="478" fill="#94a3b8" font-size="14" font-family="sans-serif">Gate cameras scan badges in 0.005s,</text>
  <text x="1080" y="504" fill="#94a3b8" font-size="14" font-family="sans-serif">lifting the boom barrier instantly.</text>
  <text x="1080" y="540" fill="#cbd5e1" font-size="14" font-family="sans-serif">Why Him:</text>
  <text x="1080" y="568" fill="#94a3b8" font-size="14" font-family="sans-serif">Zero human brain tokens consumed.</text>
  <text x="1080" y="594" fill="#94a3b8" font-size="14" font-family="sans-serif">Instant deterministic branching.</text>
  <rect x="1074" y="650" width="294" height="110" rx="10" fill="#0f172a"/>
  <text x="1092" y="684" fill="#fbbf24" font-size="13" font-family="sans-serif">Key Insight:</text>
  <text x="1092" y="710" fill="#cbd5e1" font-size="13" font-family="sans-serif">Picking a screwdriver doesn't need</text>
  <text x="1092" y="734" fill="#cbd5e1" font-size="13" font-family="sans-serif">a conference; gates route in 3ms!</text>
</svg>