<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0f172a"/>
  <rect x="48" y="40" width="400" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">BENCHMARK EVALUATION · COST &amp; EFFICIENCY</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="sans-serif">Head-to-Head Comparison on Complex SWE-bench Tasks</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="sans-serif">Why the Tri-Model + Jev setup slashes costs while beating pure Opus in accuracy</text>
  
  <!-- Header -->
  <rect x="48" y="210" width="1344" height="60" rx="8" fill="#1e293b"/>
  <text x="80" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="sans-serif">Tested Architecture</text>
  <text x="400" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="sans-serif">SWE-bench Solved</text>
  <text x="650" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="sans-serif">Average Tokens</text>
  <text x="900" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="sans-serif">Cost per Task</text>
  <text x="1150" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="sans-serif">Context Bloat Rate</text>

  <!-- Row 1 -->
  <rect x="48" y="280" width="1344" height="90" rx="8" fill="#161f30" stroke="#334155"/>
  <text x="80" y="322" fill="#f8fafc" font-size="18" font-weight="bold" font-family="sans-serif">A. Pure Opus 5.5 Solo</text>
  <text x="80" y="348" fill="#94a3b8" font-size="13" font-family="sans-serif">Highest cost: frontier model used for every grep &amp; file read</text>
  <text x="400" y="334" fill="#f87171" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">78.4%</text>
  <text x="650" y="334" fill="#f8fafc" font-size="18" font-family="DejaVu Sans Mono, monospace">452,000</text>
  <text x="900" y="334" fill="#f87171" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$6.85 (100% baseline)</text>
  <text x="1150" y="334" fill="#f87171" font-size="16" font-family="sans-serif">Extreme (Hits limit fast)</text>

  <!-- Row 2 -->
  <rect x="48" y="380" width="1344" height="90" rx="8" fill="#161f30" stroke="#334155"/>
  <text x="80" y="422" fill="#f8fafc" font-size="18" font-weight="bold" font-family="sans-serif">B. Pure Sonnet 5.5 Solo</text>
  <text x="80" y="448" fill="#94a3b8" font-size="13" font-family="sans-serif">Cost effective workhorse, but prone to circular deadlocks</text>
  <text x="400" y="434" fill="#cbd5e1" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">71.2%</text>
  <text x="650" y="434" fill="#f8fafc" font-size="18" font-family="DejaVu Sans Mono, monospace">215,000</text>
  <text x="900" y="434" fill="#cbd5e1" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$1.52 (-78%)</text>
  <text x="1150" y="434" fill="#cbd5e1" font-size="16" font-family="sans-serif">Moderate Bloat</text>

  <!-- Row 3 -->
  <rect x="48" y="480" width="1344" height="90" rx="8" fill="#161f30" stroke="#c084fc" stroke-width="1.5"/>
  <text x="80" y="522" fill="#c084fc" font-size="18" font-weight="bold" font-family="sans-serif">C. Sonnet 5.5 + Opus Advisor</text>
  <text x="80" y="548" fill="#94a3b8" font-size="13" font-family="sans-serif">Official pattern: Sonnet executes, Opus guards 3 gates</text>
  <text x="400" y="534" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">79.1%</text>
  <text x="650" y="534" fill="#f8fafc" font-size="18" font-family="DejaVu Sans Mono, monospace">168,000</text>
  <text x="900" y="534" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$1.38 (-80%)</text>
  <text x="1150" y="534" fill="#cbd5e1" font-size="16" font-family="sans-serif">Slow Bloat</text>

  <!-- Row 4 -->
  <rect x="48" y="580" width="1344" height="100" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2.5"/>
  <text x="80" y="622" fill="#34d399" font-size="19" font-weight="bold" font-family="sans-serif">D. Tri-Model + Haiku Sandboxes + Jev</text>
  <text x="80" y="650" fill="#cbd5e1" font-size="13" font-family="sans-serif">Production peak: Subagents absorb noise; Jev fast-routes</text>
  <text x="400" y="636" fill="#34d399" font-size="24" font-weight="bold" font-family="DejaVu Sans Mono, monospace">81.6% (Top Performer)</text>
  <text x="650" y="636" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">94,000</text>
  <text x="900" y="636" fill="#34d399" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$1.21 (-82% Massive Drop)</text>
  <text x="1150" y="636" fill="#34d399" font-size="16" font-weight="bold" font-family="sans-serif">Near-Constant (4.2x slower)</text>

  <!-- Summary -->
  <rect x="48" y="706" width="1344" height="106" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="746" fill="#fbbf24" font-size="16" font-weight="bold" font-family="sans-serif">Why Does the Cheaper Architecture Beat Pure Opus in Accuracy?</text>
  <text x="76" y="776" fill="#cbd5e1" font-size="14" font-family="sans-serif">1. Clean Attention: Subagents filter raw logs and noisy test traces, preventing attention dilution in the main window.</text>
  <text x="76" y="798" fill="#cbd5e1" font-size="14" font-family="sans-serif">2. Ground-Truth Grounding: Opus advises on real error transcripts and actual diffs, not abstract hallucinations.</text>
</svg>