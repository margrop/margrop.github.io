<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0f172a"/>
  <rect x="48" y="40" width="380" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">基准评测 · 成本与推理效能实测</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">4 种架构在 SWE-bench 复杂工程任务下的硬核对决</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">为什么「三模合一 + Jev 网关」不仅大幅省钱，而且成功率反超纯旗舰 Opus？</text>
  
  <!-- Data Table Visualizer -->
  <!-- Header Row -->
  <rect x="48" y="210" width="1344" height="60" rx="8" fill="#1e293b"/>
  <text x="80" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">测试架构模型组合</text>
  <text x="400" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">SWE-bench 解决率</text>
  <text x="650" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">平均消耗 Token</text>
  <text x="900" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">平均单任务成本</text>
  <text x="1150" y="246" fill="#94a3b8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">主上下文膨胀速度</text>

  <!-- Row 1: Pure Opus -->
  <rect x="48" y="280" width="1344" height="90" rx="8" fill="#161f30" stroke="#334155"/>
  <text x="80" y="322" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">A. 纯 Opus 5.5 全程单挑</text>
  <text x="80" y="348" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">最土豪打法：每个工具调用和日志都用最高档</text>
  <text x="400" y="334" fill="#f87171" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">78.4%</text>
  <text x="650" y="334" fill="#f8fafc" font-size="18" font-family="DejaVu Sans Mono, monospace">452,000</text>
  <text x="900" y="334" fill="#f87171" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$6.85 (基准 100%)</text>
  <text x="1150" y="334" fill="#f87171" font-size="16" font-family="Noto Sans CJK SC, sans-serif">极快 (单任务即撑爆)</text>

  <!-- Row 2: Pure Sonnet -->
  <rect x="48" y="380" width="1344" height="90" rx="8" fill="#161f30" stroke="#334155"/>
  <text x="80" y="422" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">B. 纯 Sonnet 5.5 单模执行</text>
  <text x="80" y="448" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">常规打法：性价比高，但在复杂死锁处易卡死</text>
  <text x="400" y="434" fill="#cbd5e1" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">71.2%</text>
  <text x="650" y="434" fill="#f8fafc" font-size="18" font-family="DejaVu Sans Mono, monospace">215,000</text>
  <text x="900" y="434" fill="#cbd5e1" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$1.52 (降 78%)</text>
  <text x="1150" y="434" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">中等膨胀</text>

  <!-- Row 3: Sonnet + Opus Advisor -->
  <rect x="48" y="480" width="1344" height="90" rx="8" fill="#161f30" stroke="#c084fc" stroke-width="1.5"/>
  <text x="80" y="522" fill="#c084fc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">C. Sonnet 5.5 + Opus 顾问模式</text>
  <text x="80" y="548" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">官方推荐：Sonnet 干活，Opus 3处关键护栏</text>
  <text x="400" y="534" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">79.1%</text>
  <text x="650" y="534" fill="#f8fafc" font-size="18" font-family="DejaVu Sans Mono, monospace">168,000</text>
  <text x="900" y="534" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$1.38 (降 80%)</text>
  <text x="1150" y="534" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">缓慢膨胀</text>

  <!-- Row 4: Tri-Model + Subagents + Jev -->
  <rect x="48" y="580" width="1344" height="100" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2.5"/>
  <text x="80" y="622" fill="#34d399" font-size="19" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">D. 三模合一 + Haiku 沙箱 + Jev 极速闸机</text>
  <text x="80" y="650" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">终极工业体：Haiku 子代理吸收噪音，Jev 搞定微小决策</text>
  <text x="400" y="636" fill="#34d399" font-size="24" font-weight="bold" font-family="DejaVu Sans Mono, monospace">81.6% (地表最强)</text>
  <text x="650" y="636" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">94,000</text>
  <text x="900" y="636" fill="#34d399" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$1.21 (暴降 82%)</text>
  <text x="1150" y="636" fill="#34d399" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">近乎恒定 (降 4.2 倍)</text>

  <!-- Summary Card -->
  <rect x="48" y="706" width="1344" height="106" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="76" y="746" fill="#fbbf24" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">核心技术启示：为什么更便宜的架构，解决率反而能反超贵 5 倍的纯 Opus？</text>
  <text x="76" y="776" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">1. 上下文保持轻盈：Haiku 子代理将海量无关日志完全过滤，主模型不会因为上下文膨胀产生「注意力迷失」；</text>
  <text x="76" y="798" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">2. 顾问带着执行现场求援：Opus 看到的是踩过坑的真实代码与报错，而非空中楼阁式的脑补设想，指导命中率呈几何级上升！</text>
</svg>