<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#0b1120"/>
  <rect x="48" y="40" width="400" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">AUTOMATION SCRIPTS · CROSS-PLATFORM TOOLKIT</text>
  
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="bold" font-family="sans-serif">Windows 11 / Ubuntu 26.04 / macOS 27 Automation Toolkit</text>
  <text x="48" y="170" fill="#94a3b8" font-size="18" font-family="sans-serif">Zero 3rd-party dependencies · Native Shell &amp; PowerShell · Interactive and Agent CLI dual modes</text>
  
  <!-- Windows 11 -->
  <rect x="48" y="210" width="420" height="470" rx="16" fill="#161f30" stroke="#0078d4" stroke-width="2"/>
  <rect x="76" y="236" width="140" height="30" rx="6" fill="rgba(0, 120, 212, 0.2)"/>
  <text x="88" y="256" fill="#60a5fa" font-size="14" font-weight="bold" font-family="sans-serif">Windows 11 Edition</text>
  <text x="76" y="306" fill="#f8fafc" font-size="22" font-weight="bold" font-family="sans-serif">PowerShell Toolkit</text>
  <text x="76" y="338" fill="#94a3b8" font-size="14" font-family="sans-serif">Supports Windows 11 23H2/24H2/25H2</text>
  <line x1="76" y1="360" x2="438" y2="360" stroke="#334155"/>
  <text x="76" y="394" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Pure native PowerShell without 3P modules</text>
  <text x="76" y="424" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Scaffolds .claude\agents\ subagent configs</text>
  <text x="76" y="454" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Provisions Git worktree sandbox</text>
  <text x="76" y="484" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Writes settings.json and CLAUDE.md rules</text>
  <rect x="76" y="520" width="364" height="64" rx="8" fill="#0f172a"/>
  <text x="92" y="546" fill="#60a5fa" font-size="12" font-family="DejaVu Sans Mono, monospace">.\claude_code_trimodel_setup_windows11.ps1</text>
  <text x="92" y="568" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">.\...ps1 -Auto -Json (for AI Agent CLI calls)</text>
  <rect x="76" y="600" width="364" height="60" rx="8" fill="#1e293b"/>
  <text x="92" y="636" fill="#34d399" font-size="13" font-family="sans-serif">✔ Verified on Windows 11 Pro</text>

  <!-- Ubuntu 26.04 -->
  <rect x="510" y="210" width="420" height="470" rx="16" fill="#161f30" stroke="#e95420" stroke-width="2"/>
  <rect x="538" y="236" width="140" height="30" rx="6" fill="rgba(233, 84, 32, 0.2)"/>
  <text x="550" y="256" fill="#fb923c" font-size="14" font-weight="bold" font-family="sans-serif">Ubuntu 26.04 Edition</text>
  <text x="538" y="306" fill="#f8fafc" font-size="22" font-weight="bold" font-family="sans-serif">Bash Pipeline Toolkit</text>
  <text x="538" y="338" fill="#94a3b8" font-size="14" font-family="sans-serif">Compatible with Ubuntu 22.04/24.04/26.04 LTS</text>
  <line x1="538" y1="360" x2="900" y2="360" stroke="#334155"/>
  <text x="538" y="394" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Conforms to strict 'set -euo pipefail' standard</text>
  <text x="538" y="424" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Creates .claude/worktrees physical sandbox</text>
  <text x="538" y="454" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Appends sandbox paths to .gitignore safely</text>
  <text x="538" y="484" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Configures advisorModel: opus &amp; subagents</text>
  <rect x="538" y="520" width="364" height="64" rx="8" fill="#0f172a"/>
  <text x="554" y="546" fill="#fb923c" font-size="12" font-family="DejaVu Sans Mono, monospace">./claude_code_trimodel_setup_ubuntu2604.sh</text>
  <text x="554" y="568" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">./...sh --auto --json (for CI/CD pipelines)</text>
  <rect x="538" y="600" width="364" height="60" rx="8" fill="#1e293b"/>
  <text x="554" y="636" fill="#34d399" font-size="13" font-family="sans-serif">✔ Verified on Ubuntu 26.04 LTS</text>

  <!-- macOS 27 -->
  <rect x="972" y="210" width="420" height="470" rx="16" fill="#161f30" stroke="#a855f7" stroke-width="2"/>
  <rect x="1000" y="236" width="140" height="30" rx="6" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="1012" y="256" fill="#c084fc" font-size="14" font-weight="bold" font-family="sans-serif">macOS 27 Edition</text>
  <text x="1000" y="306" fill="#f8fafc" font-size="22" font-weight="bold" font-family="sans-serif">Native Zsh Toolkit</text>
  <text x="1000" y="338" fill="#94a3b8" font-size="14" font-family="sans-serif">Optimized for Apple Silicon &amp; Darwin</text>
  <line x1="1000" y1="360" x2="1362" y2="360" stroke="#334155"/>
  <text x="1000" y="394" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Native Zsh with rich interactive formatting</text>
  <text x="1000" y="424" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Detects Homebrew binary locations</text>
  <text x="1000" y="454" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Generates .claude/agents/*.md configurations</text>
  <text x="1000" y="484" fill="#cbd5e1" font-size="14" font-family="sans-serif">· Structured JSON emission for autonomous agents</text>
  <rect x="1000" y="520" width="364" height="64" rx="8" fill="#0f172a"/>
  <text x="1016" y="546" fill="#c084fc" font-size="12" font-family="DejaVu Sans Mono, monospace">./claude_code_trimodel_setup_macos27.zsh</text>
  <text x="1016" y="568" fill="#94a3b8" font-size="12" font-family="DejaVu Sans Mono, monospace">./...zsh --auto --json (for Agent execution)</text>
  <rect x="1000" y="600" width="364" height="60" rx="8" fill="#1e293b"/>
  <text x="1016" y="636" fill="#34d399" font-size="13" font-family="sans-serif">✔ Verified on macOS 27 Apple Silicon</text>

  <!-- Bottom Bar -->
  <rect x="48" y="710" width="1344" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="746" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif">Dual Execution Modes:</text>
  <text x="80" y="774" fill="#cbd5e1" font-size="14" font-family="sans-serif">① Human Interactive Mode: Direct terminal run with color-coded guidance and safety confirmation;</text>
  <text x="80" y="796" fill="#cbd5e1" font-size="14" font-family="sans-serif">② Agent Automation Mode: Pass --auto --json to receive structured JSON output with zero prompts.</text>
</svg>