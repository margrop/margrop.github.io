<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="DejaVu Sans, sans-serif">Grade-School Metaphors: How a 763B Giant Fits into a Single Mac</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="DejaVu Sans, sans-serif">Hospital Triage, Desk Handbooks, Wire Snipping, and Warehouse Permits Demystified</text>

  <!-- 4 Quads -->
  <rect x="64" y="160" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="96" y="184" width="48" height="48" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="108" y="216" fill="#38bdf8" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">01</text>
  <text x="160" y="216" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">MoE Sparse Routing: Hospital with 763 Doctors</text>
  <text x="96" y="264" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">· Concept: 763 Billion total parameters, yet runs on desktop hardware?</text>
  <text x="96" y="296" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">· Metaphor: A world-class hospital with 763 specialist doctors. For a flu,</text>
  <text x="96" y="324" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  the triage nurse (Router) never calls all 763 doctors; only the 8 relevant</text>
  <text x="96" y="352" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  specialists enter the room. 763B capacity, but only 8 doctors' energy used!</text>
  <rect x="96" y="380" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="114" y="420" fill="#38bdf8" font-size="14" font-family="DejaVu Sans Mono, monospace">MoE: 763B Total Params -&gt; 8 Experts Active (~37B eval/tok)</text>

  <rect x="746" y="160" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="778" y="184" width="48" height="48" rx="10" fill="rgba(251, 191, 36, 0.15)"/>
  <text x="790" y="216" fill="#fbbf24" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">02</text>
  <text x="842" y="216" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Engram SSD Offload: Desk Reference Handbook</text>
  <text x="778" y="264" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">· Concept: Why can 188.8 GiB Engram tables reside on solid-state drive?</text>
  <text x="778" y="296" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">· Metaphor: The doctor cannot memorize every single drug directory code in RAM.</text>
  <text x="778" y="324" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  Instead, an indexed handbook rests on the desk (NVMe SSD). The nurse flips</text>
  <text x="778" y="352" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  to the page in advance (Async Prefetch), resulting in near-zero wait time!</text>
  <rect x="778" y="380" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="796" y="420" fill="#fbbf24" font-size="14" font-family="DejaVu Sans Mono, monospace">Engram: 188.8 GiB FP8 Table on NVMe -&gt; Async mmap (~3% delta)</text>

  <rect x="64" y="500" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="96" y="524" width="48" height="48" rx="10" fill="rgba(52, 211, 153, 0.15)"/>
  <text x="108" y="556" fill="#34d399" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">03</text>
  <text x="160" y="556" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Abliteration: Snipping the False-Alarm Wire</text>
  <text x="96" y="604" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">· Concept: Why do models refuse legitimate coding and how is it undone?</text>
  <text x="96" y="636" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">· Metaphor: A master chef conditioned by overcautious HR screams 'knives are dangerous!'</text>
  <text x="96" y="664" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  Abliteration is a precise surgical snip that disconnects the false alarm wire</text>
  <text x="96" y="692" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  without harming the chef's culinary mastery (mathematics, reasoning, syntax).</text>
  <rect x="96" y="720" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="114" y="760" fill="#34d399" font-size="14" font-family="DejaVu Sans Mono, monospace">Heretic Ablation: 38 Writer Tensors Orthogonalized (Zero LoRA overhead)</text>

  <rect x="746" y="500" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="778" y="524" width="48" height="48" rx="10" fill="rgba(244, 63, 94, 0.15)"/>
  <text x="790" y="556" fill="#f43f5e" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">04</text>
  <text x="842" y="556" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Wired Limit: Warehouse Special Machinery Permit</text>
  <text x="778" y="604" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">· Concept: Why does a 256GB Mac crash when allocating 204GB Metal buffer?</text>
  <text x="778" y="636" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">· Metaphor: You leased a 256-sqm warehouse, but default property rules cap equipment</text>
  <text x="778" y="664" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  at 75% (192GB). When your 204GB machine arrives, security stops you at the gate.</text>
  <text x="778" y="692" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">  sysctl is the approved VIP waiver allowing 232GB of heavy machinery!</text>
  <rect x="778" y="720" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="796" y="760" fill="#f43f5e" font-size="14" font-family="DejaVu Sans Mono, monospace">sysctl -w iogpu.wired_limit_mb=237568 (Cap elevated from 192GB to 232GB)</text>
</svg>