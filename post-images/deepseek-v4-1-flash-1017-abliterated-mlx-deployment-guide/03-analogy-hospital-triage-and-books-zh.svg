<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">小学生也能秒懂的大比方：7630 亿参数大模型如何塞进单台 Mac？</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">用「三甲医院分诊」、「桌旁字典」、「电线微创手术」与「仓库重载批文」讲透底层黑科技</text>

  <!-- 4 Quads -->
  <!-- Quad 1 -->
  <rect x="64" y="160" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="96" y="184" width="48" height="48" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="108" y="216" fill="#38bdf8" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">01</text>
  <text x="160" y="216" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">MoE 稀疏激活：763 位专家的三甲医院</text>
  <text x="96" y="264" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 难懂概念：7632 亿总参数，为什么单台 Mac 计算器算得动？</text>
  <text x="96" y="296" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 生动大比方：这就像一家拥有 763 位顶级医学专家的超级医院。病人看感冒，</text>
  <text x="96" y="324" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  分诊护士（Router）绝不会把 763 位专家全拉来开会，而是精准只叫 8 位对应</text>
  <text x="96" y="352" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  专科医生进诊室。所以医院虽然规模宏大，但每秒只消耗 8 个人的体力和精力！</text>
  <rect x="96" y="380" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="114" y="420" fill="#38bdf8" font-size="14" font-family="DejaVu Sans Mono, monospace">MoE: 763B Total Params -&gt; 8 Experts Active (~37B eval/tok)</text>

  <!-- Quad 2 -->
  <rect x="746" y="160" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="778" y="184" width="48" height="48" rx="10" fill="rgba(251, 191, 36, 0.15)"/>
  <text x="790" y="216" fill="#fbbf24" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">02</text>
  <text x="842" y="216" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Engram SSD 外存：医生桌边的百科大字典</text>
  <text x="778" y="264" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 难懂概念：188.8 GiB 的 Engram 表，为什么能直接扔在固态硬盘上？</text>
  <text x="778" y="296" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 生动大比方：医生大脑（RAM）记不下全世界所有的冷门药典。与其强塞进大脑，</text>
  <text x="778" y="324" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  不如在手边放一本 2000 页的高速活页字典（NVMe SSD）。由于护士提前预判并</text>
  <text x="778" y="352" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  翻到对应页码（异步预取），医生一转头书已翻好，看诊速度几乎不受丝毫影响！</text>
  <rect x="778" y="380" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="796" y="420" fill="#fbbf24" font-size="14" font-family="DejaVu Sans Mono, monospace">Engram: 188.8 GiB FP8 Table on NVMe -&gt; Async mmap (~3% delta)</text>

  <!-- Quad 3 -->
  <rect x="64" y="500" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="96" y="524" width="48" height="48" rx="10" fill="rgba(52, 211, 153, 0.15)"/>
  <text x="108" y="556" fill="#34d399" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">03</text>
  <text x="160" y="556" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Abliteration 去对齐：剪断误报警铃的微创手术</text>
  <text x="96" y="604" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 难懂概念：为什么模型动不动就弹「抱歉我无法协助」，如何彻底解除？</text>
  <text x="96" y="636" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 生动大比方：大厨被公司规训过度，一看到菜刀就吓得大叫「刀具太危险我不做菜」。</text>
  <text x="96" y="664" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  去对齐就是一把精准的手术镊，只剪断大厨大脑里那根连着「过度拒答警铃」的细线，</text>
  <text x="96" y="692" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  既不破坏大厨顶级的烹饪厨艺（代码与推理），又让他不再神经质地拒绝做正经菜！</text>
  <rect x="96" y="720" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="114" y="760" fill="#34d399" font-size="14" font-family="DejaVu Sans Mono, monospace">Heretic Ablation: 38 Writer Tensors Orthogonalized (Zero LoRA overhead)</text>

  <!-- Quad 4 -->
  <rect x="746" y="500" width="630" height="310" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="778" y="524" width="48" height="48" rx="10" fill="rgba(244, 63, 94, 0.15)"/>
  <text x="790" y="556" fill="#f43f5e" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">04</text>
  <text x="842" y="556" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Wired Limit：仓库物业处开具的重型设备批文</text>
  <text x="778" y="604" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 难懂概念：256GB 的 Mac 为什么加载 204GB 模型会瞬间 OOM 崩溃？</text>
  <text x="778" y="636" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 生动大比方：你租下了 256 平米的独立大平层，但物业（macOS 内核）默认规定：</text>
  <text x="778" y="664" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  「任何人摆放重物不得超过 75% 面积，必须留出通道和茶水间」。你买来的 204 米巨无霸</text>
  <text x="778" y="692" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">  直接被保安拦下。sysctl 锁存提权就是签署特批单，允许重型机床占满 232 平米！</text>
  <rect x="778" y="720" width="566" height="66" rx="8" fill="#0f172a"/>
  <text x="796" y="760" fill="#f43f5e" font-size="14" font-family="DejaVu Sans Mono, monospace">sysctl -w iogpu.wired_limit_mb=237568 (Cap elevated from 192GB to 232GB)</text>
</svg>