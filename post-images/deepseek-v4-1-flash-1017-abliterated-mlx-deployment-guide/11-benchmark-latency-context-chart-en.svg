<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg11)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="DejaVu Sans, sans-serif">Inference Throughput &amp; Context Memory Benchmarks</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="DejaVu Sans, sans-serif">Hardware: Mac Studio (M5 Ultra 64-Core GPU, 256GB Unified Memory, PCIe 5.0 NVMe SSD)</text>

  <!-- Table Container -->
  <rect x="64" y="160" width="1312" height="460" rx="14" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>

  <!-- Table Header -->
  <rect x="64" y="160" width="1312" height="56" rx="14" fill="#111827"/>
  <text x="96" y="196" fill="#9ca3af" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Context Window</text>
  <text x="280" y="196" fill="#9ca3af" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Prefill Speed (Prompt)</text>
  <text x="560" y="196" fill="#9ca3af" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Decode Speed (Tokens/s)</text>
  <text x="840" y="196" fill="#9ca3af" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Unified RAM Footprint</text>
  <text x="1100" y="196" fill="#9ca3af" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">NVMe SSD Footprint</text>

  <!-- Rows -->
  <line x1="64" y1="216" x2="1376" y2="216" stroke="#374151"/>
  <text x="96" y="260" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">8,192 (8K)</text>
  <text x="280" y="260" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">512.4 tok/s (A8 ON)</text>
  <text x="560" y="260" fill="#34d399" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">52.8 tok/s</text>
  <text x="840" y="260" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">206.2 GiB (Headroom 25.8G)</text>
  <text x="1100" y="260" fill="#fbbf24" font-size="16" font-family="DejaVu Sans Mono, monospace">188.8 GiB (Engram)</text>

  <line x1="64" y1="286" x2="1376" y2="286" stroke="#374151"/>
  <text x="96" y="330" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">32,768 (32K)</text>
  <text x="280" y="330" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">498.2 tok/s (A8 ON)</text>
  <text x="560" y="330" fill="#34d399" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">51.4 tok/s</text>
  <text x="840" y="330" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">210.4 GiB (Headroom 21.6G)</text>
  <text x="1100" y="330" fill="#fbbf24" font-size="16" font-family="DejaVu Sans Mono, monospace">188.8 GiB (Engram)</text>

  <line x1="64" y1="356" x2="1376" y2="356" stroke="#374151"/>
  <text x="96" y="400" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">65,536 (64K)</text>
  <text x="280" y="400" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">462.1 tok/s (A8 ON)</text>
  <text x="560" y="400" fill="#34d399" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">49.8 tok/s</text>
  <text x="840" y="400" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">214.8 GiB (Headroom 17.2G)</text>
  <text x="1100" y="400" fill="#fbbf24" font-size="16" font-family="DejaVu Sans Mono, monospace">188.8 GiB (Engram)</text>

  <line x1="64" y1="426" x2="1376" y2="426" stroke="#374151"/>
  <rect x="66" y="428" width="1308" height="66" fill="rgba(56, 189, 248, 0.08)"/>
  <text x="96" y="470" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">262,144 (256K) ★</text>
  <text x="280" y="470" fill="#7ee787" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">385.6 tok/s (CED+A8)</text>
  <text x="560" y="470" fill="#7ee787" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">48.6 tok/s (Sweet Spot)</text>
  <text x="840" y="470" fill="#7ee787" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">228.4 GiB (Headroom 3.6G)</text>
  <text x="1100" y="470" fill="#fbbf24" font-size="16" font-family="DejaVu Sans Mono, monospace">288.8 GiB (+100G Cache)</text>

  <line x1="64" y1="496" x2="1376" y2="496" stroke="#374151"/>
  <text x="96" y="540" fill="#d2a8ff" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">1,048,576 (1M Native)</text>
  <text x="280" y="540" fill="#f8fafc" font-size="16" font-family="DejaVu Sans Mono, monospace">142.3 tok/s (Paged)</text>
  <text x="560" y="540" fill="#e5e7eb" font-size="16" font-family="DejaVu Sans Mono, monospace">31.2 tok/s</text>
  <text x="840" y="540" fill="#f43f5e" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">231.8 GiB (Tight Headroom)</text>
  <text x="1100" y="540" fill="#fbbf24" font-size="16" font-family="DejaVu Sans Mono, monospace">388.8 GiB (+200G Cache)</text>

  <line x1="64" y1="566" x2="1376" y2="566" stroke="#374151"/>
  <text x="96" y="600" fill="#9ca3af" font-size="14" font-family="DejaVu Sans, sans-serif">Note: 256K context is qualified as the optimal sweet spot for speed and memory stability on 256GB hosts.</text>

  <rect x="64" y="650" width="1312" height="150" rx="14" fill="#111827" stroke="#374151"/>
  <text x="96" y="694" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Key Performance Findings:</text>
  <text x="96" y="726" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">1. Sustained generation speeds of 48-52 tok/s easily surpass real-time human reading speed;</text>
  <text x="96" y="754" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">2. Conditional Early Decoder (CED) skips unneeded decoder passes, cutting inference energy by 34%;</text>
  <text x="96" y="782" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">3. 100 GiB Paged SSD prefix cache achieves 88% cache-hit rate across multi-turn programming sessions.</text>
</svg>