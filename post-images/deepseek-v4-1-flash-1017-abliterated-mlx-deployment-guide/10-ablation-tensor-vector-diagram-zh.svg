<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg10)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">Heretic 去对齐原理：38 个注意张量的正交切除术</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">为什么不需要运行时挂载 LoRA 转向适配器？直接在底层权重烘焙切断「拒答特征向量」</text>

  <!-- Left: Geometric Projection -->
  <rect x="64" y="160" width="630" height="420" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="96" y="206" fill="#38bdf8" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">正交投影数学原理 (Orthogonal Steering)</text>
  <text x="96" y="246" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">1. 提取拒答方向向量 r：对比有害指令与无害指令的残差激活差分</text>
  <text x="96" y="274" fill="#94a3b8" font-size="15" font-family="DejaVu Sans Mono, monospace">   r = Mean(Activations_refusal) - Mean(Activations_benign)</text>
  <text x="96" y="306" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">2. 锁定 38 个负责生成拒答说教词元的核心 Writer 投影矩阵 W_O</text>
  <text x="96" y="334" fill="#94a3b8" font-size="15" font-family="DejaVu Sans Mono, monospace">   W'_O = W_O - r * (r^T * W_O)</text>
  <text x="96" y="366" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">3. 数学本质：将权重张量在拒答向量方向上的投影分量完全归零！</text>

  <!-- Geometry Graphic Box -->
  <rect x="96" y="396" width="566" height="154" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="120" y="436" fill="#7ee787" font-size="16" font-family="DejaVu Sans Mono, monospace">Original Vector: V = V_parallel (Refusal) + V_ortho (Competence)</text>
  <text x="120" y="472" fill="#f43f5e" font-size="16" font-family="DejaVu Sans Mono, monospace">Projection Cut : V_parallel -&gt; 0 (Abliterated Forever)</text>
  <text x="120" y="508" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Result Tensor  : V_clean = V_ortho (100% Coding &amp; Logic Intact)</text>

  <!-- Right: Comparison -->
  <rect x="746" y="160" width="630" height="420" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="778" y="206" fill="#34d399" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">传统运行时外挂 vs 权重烘焙对比</text>

  <rect x="778" y="240" width="566" height="150" rx="10" fill="#131c2e" stroke="#3b82f6"/>
  <text x="800" y="274" fill="#38bdf8" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">方案 A：运行时动态激活引导 (Steering Adapter / LoRA)</text>
  <text x="800" y="304" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 缺点：每一步推理都要注入负向激活，占用额外计算周期与显存</text>
  <text x="800" y="332" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 缺点：容易导致模型输出退化、重复字符、语法错乱</text>
  <text x="800" y="360" fill="#ff7b72" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 维护成本：需要专用推理框架支持，难以导出标准化格式</text>

  <rect x="778" y="410" width="566" height="140" rx="10" fill="#12251d" stroke="#10b981"/>
  <text x="800" y="444" fill="#34d399" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">方案 B：Baked Heretic 权重烘焙 (当前 Checkpoint)</text>
  <text x="800" y="474" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 优势：直接修改 safetensors 静态参数，量化后零额外开销</text>
  <text x="800" y="502" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 优势：兼容原生 oMLX / MLX LM，不需要任何外挂插件或提示词干预</text>
  <text x="800" y="530" fill="#34d399" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">· 测评表现：17*23=391 正确，长文本 needle 完美检索，无说教吐字</text>

  <!-- Bottom Banner -->
  <rect x="64" y="610" width="1312" height="190" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="96" y="654" fill="#fbbf24" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">关于模型智能与安全边界的严肃工程师思考</text>
  <text x="96" y="690" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">去对齐（Abliteration）并不是为了鼓励滥用，而是为了恢复模型在学术安全审计、高难度系统编程（如逆向工程、漏洞分析、</text>
  <text x="96" y="718" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">渗透测试脚本编写）中的原生智力。商业 API 粗暴的政治正确关键字拦截常常将正当的白帽工程师挡在门外，</text>
  <text x="96" y="746" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">而本地烘焙去对齐模型，让代码生产力重新回归开发者百分之百的掌管之中。</text>
</svg>