<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg12)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="DejaVu Sans, sans-serif">Cross-Platform Unified Orchestration Architecture</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="DejaVu Sans, sans-serif">Single Apple Silicon Inference Host Serving Windows 11 &amp; Ubuntu 26.04 Workstations</text>

  <!-- Central Node -->
  <rect x="520" y="200" width="400" height="340" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="552" y="232" width="60" height="60" rx="12" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="566" y="270" fill="#38bdf8" font-size="26" font-weight="bold" font-family="DejaVu Sans Mono, monospace">MAC</text>
  <text x="630" y="260" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans, sans-serif">Mac Studio Inference Host</text>
  <text x="630" y="288" fill="#38bdf8" font-size="14" font-family="DejaVu Sans Mono, monospace">oMLX 0.7.3 Service Node</text>

  <rect x="552" y="316" width="336" height="196" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="572" y="348" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Model: DeepSeek V4.1 763B MoE (Abliterated)</text>
  <text x="572" y="376" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Unified RAM: 256GB Unified Memory (232GB Wired)</text>
  <text x="572" y="404" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Storage: 188.8GB Engram Tables on NVMe SSD</text>
  <text x="572" y="432" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">· API Endpoint: 127.0.0.1:8080 (REST / SSE)</text>
  <text x="572" y="460" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">· Hardened loopback forwarding via SSH</text>
  <text x="572" y="488" fill="#d2a8ff" font-size="13" font-family="DejaVu Sans Mono, monospace">· 3 Concurrent Slots + Fair Decode Scheduling</text>

  <!-- Left Node -->
  <rect x="64" y="240" width="360" height="260" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="96" y="268" width="48" height="48" rx="10" fill="rgba(59, 130, 246, 0.15)"/>
  <text x="106" y="300" fill="#60a5fa" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">WIN</text>
  <text x="160" y="296" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Windows 11 Workstation</text>
  <text x="96" y="346" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· VS Code / Continue / Cline extensions</text>
  <text x="96" y="374" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Cursor / Claude Code automatic configuration</text>
  <text x="96" y="402" fill="#7ee787" font-size="14" font-family="DejaVu Sans Mono, monospace">· Loopback: localhost:8080 -&gt; Host</text>
  <text x="96" y="430" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Zero external cloud dependencies or API fees</text>

  <line x1="424" y1="370" x2="520" y2="370" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,6"/>
  <polygon points="510,365 520,370 510,375" fill="#38bdf8"/>

  <!-- Right Node -->
  <rect x="1016" y="240" width="360" height="260" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="1048" y="268" width="48" height="48" rx="10" fill="rgba(234, 88, 12, 0.15)"/>
  <text x="1058" y="300" fill="#fb923c" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">LNX</text>
  <text x="1112" y="296" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Ubuntu 26.04 Build Node</text>
  <text x="1048" y="346" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· CI/CD automated code reviews</text>
  <text x="1048" y="374" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Autonomous coding agents batch execution</text>
  <text x="1048" y="402" fill="#7ee787" font-size="14" font-family="DejaVu Sans Mono, monospace">· Systemd daemon resilience &amp; watchdog</text>
  <text x="1048" y="430" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Private LAN air-gapped security perimeter</text>

  <line x1="920" y1="370" x2="1016" y2="370" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="6,6"/>
  <polygon points="930,365 920,370 930,375" fill="#fb923c"/>

  <!-- Bottom Architecture Highlights -->
  <rect x="64" y="580" width="1312" height="220" rx="14" fill="#131d31" stroke="#334155"/>
  <text x="96" y="624" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Enterprise-Grade Private AI Infrastructure Best Practices</text>
  <text x="96" y="660" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">1. Decoupled Compute &amp; Editing: Heavy 256GB Mac Studio computes quietly while developers code on thin laptops;</text>
  <text x="96" y="690" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">2. Zero Friction Standard API: Standard OpenAI format works natively with IDEs, Copilot extensions, and CLI tools;</text>
  <text x="96" y="720" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">3. Absolute Data Sovereignty: Proprietary codebases and sensitive tokens never transit public networks;</text>
  <text x="96" y="750" fill="#7ee787" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">4. Unified Automation: Included toolkits handle health checks, tunnel lifecycles, and automated verification.</text>
</svg>