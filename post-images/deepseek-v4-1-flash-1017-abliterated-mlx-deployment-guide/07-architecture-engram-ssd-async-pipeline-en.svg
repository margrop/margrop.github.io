<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg7)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="DejaVu Sans, sans-serif">DeepSeek Engram Asynchronous SSD Offloading Pipeline</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="DejaVu Sans, sans-serif">Why Offloading 188.8GB of Static Tables to NVMe SSD Results in Only ~3% Latency Overhead</text>

  <!-- Flow Boxes -->
  <rect x="64" y="180" width="380" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="96" y="224" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Layer 0: Input &amp; Embeddings</text>
  <text x="96" y="260" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Token input &amp; prefix cache reuse</text>
  <text x="96" y="288" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Unified RAM lightning-fast forward pass</text>
  <text x="96" y="316" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Async Trigger: Layer 1 Engram</text>

  <line x1="444" y1="270" x2="528" y2="270" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="528,265 540,270 528,275" fill="#38bdf8"/>

  <rect x="540" y="180" width="380" height="180" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="572" y="224" fill="#fbbf24" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Layer 1: Engram NVMe Lookup</text>
  <text x="572" y="260" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Direct NVMe SSD memory-mapped read (94.4 GB)</text>
  <text x="572" y="288" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Sparse memory patterns fused into residual stream</text>
  <text x="572" y="316" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Async Trigger: Layer 14 Engram</text>

  <line x1="920" y1="270" x2="1004" y2="270" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="1004,265 1016,270 1004,275" fill="#fbbf24"/>

  <rect x="1016" y="180" width="360" height="180" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1048" y="224" fill="#34d399" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Layer 2-13: Compute Dense</text>
  <text x="1048" y="260" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Attention &amp; 256 Expert MoE routing</text>
  <text x="1048" y="288" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Metal GPU unified memory throughput maxed out</text>
  <text x="1048" y="316" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Completely hides SSD read latency!</text>

  <line x1="1196" y1="360" x2="1196" y2="440" stroke="#34d399" stroke-width="3"/>
  <polygon points="1191,440 1196,452 1201,440" fill="#34d399"/>

  <rect x="800" y="460" width="576" height="170" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="832" y="504" fill="#fbbf24" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Layer 14: Engram Table 2 Zero-Wait Arrival</text>
  <text x="832" y="540" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· By the time dense GEMM in Layer 2-13 completes, Layer 14 tables (94.4 GB) are hot in page cache</text>
  <text x="832" y="568" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">· Feeds seamlessly into deep layers and Multi-Token Prediction (MTP) decoder head</text>
  <text x="832" y="596" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Pipeline Stall: 0ms | IO Overhead: ~3%</text>

  <rect x="64" y="460" width="700" height="170" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="96" y="504" fill="#38bdf8" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Tiered Memory Hierarchy: Unified RAM + Fast NVMe</text>
  <text x="96" y="540" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans Mono, monospace">Mac Studio M5 Ultra Unified Bus Bandwidth: 1,200 GB/s (204.7 GB active)</text>
  <text x="96" y="568" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans Mono, monospace">PCIe Gen 5 NVMe SSD Sequential Read Burst: 7.5 GB/s (188.8 GB offloaded)</text>
  <text x="96" y="596" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Asynchronous double-buffering completely decouples active RAM limits.</text>

  <rect x="64" y="660" width="1312" height="140" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="96" y="700" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">DEEPSEEK ENGRAM CONDITIONAL MEMORY SPECIFICATION</text>
  <text x="96" y="732" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">Engram isolates massive multi-token lookup tables from dense weights. While conventional architectures</text>
  <text x="96" y="758" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">require all 763B parameters in VRAM, DeepSeek V4.1 retains trillion-scale knowledge with 48% less RAM footprint.</text>
</svg>