  <text x="114" y="594" fill="#64748b" font-size="13" font-family="Noto Sans CJK SC, sans-serif">驻留权重压缩至 204.7 GiB</text>
  <text x="114" y="624" fill="#38bdf8" font-size="13" font-family="DejaVu Sans Mono, monospace">A8 Prefill + CED Early Skip</text>

