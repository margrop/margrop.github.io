  <text x="565" y="624" fill="#fbbf24" font-size="13" font-family="DejaVu Sans Mono, monospace">SSD Table: 202.8 GB FP8/E8M0</text>

  <!-- Card 3 -->
  <rect x="966" y="270" width="410" height="420" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="998" y="302" width="56" height="56" rx="12" fill="rgba(52, 211, 153, 0.15)"/>
  <text x="1006" y="338" fill="#34d399" font-size="24" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Cut</text>
