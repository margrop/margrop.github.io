  <text x="1016" y="562" fill="#34d399" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">No Steering Adapter Needed</text>
  <text x="1016" y="594" fill="#64748b" font-size="13" font-family="Noto Sans CJK SC, sans-serif">保留完整编程推理与数理逻辑</text>
  <text x="1016" y="624" fill="#34d399" font-size="13" font-family="DejaVu Sans Mono, monospace">1M Native / 256K Serving Window</text>

  <!-- Bottom Banner -->
  <rect x="64" y="722" width="1312" height="82" rx="12" fill="#131d31" stroke="#334155"/>
  <text x="96" y="768" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">iogpu.wired_limit_mb=237568 (232 GiB)</text>
  <text x="560" y="768" fill="#94a3b8" font-size="16" font-family="Noto Sans CJK SC, sans-serif">三大平台零依赖全自动脚本 · Windows 11 / Ubuntu 26.04 / macOS 27</text>
  <rect x="1220" y="744" width="130" height="38" rx="8" fill="#38bdf8"/>
  <text x="1242" y="768" fill="#0f172a" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">DUAL-MODE</text>
