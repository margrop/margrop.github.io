<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg12)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">跨平台无缝协同拓扑架构</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">单台 Apple Silicon 核心推理节点，赋能 Windows 11 / Ubuntu 26.04 全局开发工作站</text>

  <!-- Central Node: Mac Studio Host -->
  <rect x="520" y="200" width="400" height="340" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="552" y="232" width="60" height="60" rx="12" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="566" y="270" fill="#38bdf8" font-size="26" font-weight="bold" font-family="DejaVu Sans Mono, monospace">MAC</text>
  <text x="630" y="260" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Mac Studio 推理主机</text>
  <text x="630" y="288" fill="#38bdf8" font-size="14" font-family="DejaVu Sans Mono, monospace">oMLX 0.7.3 Service Node</text>

  <rect x="552" y="316" width="336" height="196" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="572" y="348" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 核心模型：DeepSeek V4.1 763B MoE</text>
  <text x="572" y="376" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 统一内存：256GB Unified Memory (232GB Wired)</text>
  <text x="572" y="404" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 外存加速：188.8GB Engram Tables on NVMe</text>
  <text x="572" y="432" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">· API 监听：127.0.0.1:8080 (REST / SSE)</text>
  <text x="572" y="460" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">· 局域网绑定：Zero-Trust SSH 隧道双向加固</text>
  <text x="572" y="488" fill="#d2a8ff" font-size="13" font-family="DejaVu Sans Mono, monospace">· 3 并发 Slot + Decode 公平轮询调度</text>

  <!-- Left Node: Windows 11 Client -->
  <rect x="64" y="240" width="360" height="260" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="96" y="268" width="48" height="48" rx="10" fill="rgba(59, 130, 246, 0.15)"/>
  <text x="106" y="300" fill="#60a5fa" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">WIN</text>
  <text x="160" y="296" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Windows 11 开发工作站</text>
  <text x="96" y="346" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· VS Code / Continue / Cline 智能插件</text>
  <text x="96" y="374" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Cursor / Claude Code 终端自动配准</text>
  <text x="96" y="402" fill="#7ee787" font-size="14" font-family="DejaVu Sans Mono, monospace">· 环回转发：localhost:8080 -&gt; Host</text>
  <text x="96" y="430" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 零公网依赖，无任何 API 账单消耗</text>

  <!-- Connecting Line Left -->
  <line x1="424" y1="370" x2="520" y2="370" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,6"/>
  <polygon points="510,365 520,370 510,375" fill="#38bdf8"/>

  <!-- Right Node: Ubuntu 26.04 Client -->
  <rect x="1016" y="240" width="360" height="260" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="1048" y="268" width="48" height="48" rx="10" fill="rgba(234, 88, 12, 0.15)"/>
  <text x="1058" y="300" fill="#fb923c" font-size="20" font-weight="bold" font-family="DejaVu Sans Mono, monospace">LNX</text>
  <text x="1112" y="296" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Ubuntu 26.04 编译节点</text>
  <text x="1048" y="346" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· CI/CD 自动化流水线代码审查</text>
  <text x="1048" y="374" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 自主智能体后台批量分析执行</text>
  <text x="1048" y="402" fill="#7ee787" font-size="14" font-family="DejaVu Sans Mono, monospace">· Systemd 后台服务自愈保活</text>
  <text x="1048" y="430" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 安全加固通道，杜绝数据出境内网</text>

  <!-- Connecting Line Right -->
  <line x1="920" y1="370" x2="1016" y2="370" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="6,6"/>
  <polygon points="930,365 920,370 930,375" fill="#fb923c"/>

  <!-- Bottom Architecture Highlights -->
  <rect x="64" y="580" width="1312" height="220" rx="14" fill="#131d31" stroke="#334155"/>
  <text x="96" y="624" fill="#38bdf8" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">工业级私有化 AI 基础设施的最佳实践闭环</text>
  <text x="96" y="660" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">1. 算力与交互分离：高性能计算由专用 256GB Mac Studio 主机静默承担，开发者在 Windows 笔记本或 Linux 瘦终端无感编码；</text>
  <text x="96" y="690" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">2. 协议极简兼容：标准 OpenAI 协议格式暴露，各大 IDE、Copilot 扩展、CLI Agent 均可直接填入 localhost 接入；</text>
  <text x="96" y="720" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">3. 零云端隐私外泄：所有源代码检索、漏洞挖掘与模型思考完全停留在局域网内部，彻底阻断第三方厂商遥测与审计风险；</text>
  <text x="96" y="750" fill="#7ee787" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">4. 一键脚本全覆盖：附赠的三大操作系统脚本均实现环境检查、隧道拉起与自动化验证的全流程闭环。</text>
</svg>