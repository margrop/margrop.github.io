<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg7)"/>

  <!-- Title -->
  <text x="64" y="80" fill="#f8fafc" font-size="34" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">DeepSeek Engram 异步外存流水线解密</text>
  <text x="64" y="120" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">为什么把 188.8GB 记忆表扔在固态硬盘上，推理速度仅有 3% 的微弱损耗？</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Prompt Input & Embedding -->
  <rect x="64" y="180" width="380" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="96" y="224" fill="#38bdf8" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Layer 0: 输入与嵌入计算</text>
  <text x="96" y="260" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Token 序列输入 (Prefix 缓存复用)</text>
  <text x="96" y="288" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 统一内存 (RAM) 极速前向计算</text>
  <text x="96" y="316" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">发出异步预取：Layer 1 Engram</text>

  <!-- Arrow 1 -->
  <line x1="444" y1="270" x2="528" y2="270" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="528,265 540,270 528,275" fill="#38bdf8"/>

  <!-- Box 2: Layer 1 Engram Lookup -->
  <rect x="540" y="180" width="380" height="180" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="572" y="224" fill="#fbbf24" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Layer 1: Engram 外存查找</text>
  <text x="572" y="260" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· NVMe PCIe SSD 并行映射读取 (94.4 GB)</text>
  <text x="572" y="288" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 稀疏记忆模式直接融合残差流</text>
  <text x="572" y="316" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">发出异步预取：Layer 14 Engram</text>

  <!-- Arrow 2 -->
  <line x1="920" y1="270" x2="1004" y2="270" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6"/>
  <polygon points="1004,265 1016,270 1004,275" fill="#fbbf24"/>

  <!-- Box 3: Dense Layers 2-13 -->
  <rect x="1016" y="180" width="360" height="180" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="1048" y="224" fill="#34d399" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Layer 2-13: 计算密集层</text>
  <text x="1048" y="260" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 注意力与 256 专家 MoE 路由</text>
  <text x="1048" y="288" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Metal GPU 纯内存高吞吐狂飙</text>
  <text x="1048" y="316" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 完美掩盖 SSD 固态硬盘读取时延！</text>

  <!-- Vertical Arrow Down -->
  <line x1="1196" y1="360" x2="1196" y2="440" stroke="#34d399" stroke-width="3"/>
  <polygon points="1191,440 1196,452 1201,440" fill="#34d399"/>

  <!-- Lower Row -->
  <!-- Box 4: Layer 14 Engram Arrival -->
  <rect x="800" y="460" width="576" height="170" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="832" y="504" fill="#fbbf24" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Layer 14: Engram 表 2 零等待无缝对接</text>
  <text x="832" y="540" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 当 Layer 2-13 的密集矩阵乘法刚算完，Layer 14 (94.4 GB) 的数据已预加载至内核页缓存</text>
  <text x="832" y="568" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 零额外计算等待，直接进入深层网络与 MTP (Multi-Token Prediction) 解码头</text>
  <text x="832" y="596" fill="#7ee787" font-size="14" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Pipeline Stall: 0ms | IO Overhead: ~3%</text>

  <!-- Left lower box: Hardware IO vs Compute Bandwidth -->
  <rect x="64" y="460" width="700" height="170" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="96" y="504" fill="#38bdf8" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">硬件带宽协同架构：RAM + NVMe 分级存储</text>
  <text x="96" y="540" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans Mono, monospace">Mac Studio M5 Ultra 统一内存带宽 : 1,200 GB/s (驻留 204.7 GB 活跃权重)</text>
  <text x="96" y="568" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans Mono, monospace">PCIe Gen 5 NVMe SSD 顺序突发读取  : 7.5 GB/s  (卸载 188.8 GB 记忆表)</text>
  <text x="96" y="596" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">结论：异步双缓冲调度下，固态硬盘只作为只读模式存储，完全解耦 RAM 瓶颈！</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="64" y="660" width="1312" height="140" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="96" y="700" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">DEEPSEEK ENGRAM CONDITIONAL MEMORY SPECIFICATION</text>
  <text x="96" y="732" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">Engram 表储存了庞大的静态世界事实与跨词元组合模式。传统大模型必须将所有参数驻留显存，而 DeepSeek V4.1</text>
  <text x="96" y="758" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">将其抽离为独立的条件查表单元。这使得 7630 亿参数大模型在保有万亿级知识密度的同时，显存开销直降 48%！</text>
</svg>