<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="42" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">生产级 AI Agent CLI 核心架构图</text>
  <text x="500" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Deterministic ReAct Loop + PTY Terminal Hijacking + Context Pruning + Safety Gate</text>

  <!-- Layer 1: Terminal &amp; REPL -->
  <rect x="60" y="95" width="880" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#cardGlow)"/>
  <text x="90" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">1. Terminal REPL &amp; Interactive I/O Layer</text>
  <text x="90" y="152" font-family="sans-serif" font-size="12" fill="#94a3b8">ANSI Color Styling · Readline Multiline Input · Ctrl+C Graceful Interruption · Streaming Token Display · Status Spinners</text>

  <!-- Layer 2: Deterministic Loop State Machine -->
  <rect x="60" y="190" width="880" height="95" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#cardGlow)"/>
  <text x="90" y="225" font-family="sans-serif" font-size="16" font-weight="bold" fill="#818cf8">2. Agent Controller (ReAct Deterministic State Machine)</text>
  <text x="90" y="248" font-family="sans-serif" font-size="12" fill="#e2e8f0">States: INIT ➔ THINKING (LLM Stream) ➔ TOOL_DISPATCH ➔ EXECUTE ➔ OBSERVE ➔ COMPLETED</text>
  <text x="90" y="270" font-family="sans-serif" font-size="12" fill="#94a3b8">Safety Caps: Max Iterations Safeguard (Default 25) · Stalled Loop Detection · JSON Schema Malformation Auto-Repair</text>

  <!-- Mid Columns: Context Engine &amp; Security Gate -->
  <rect x="60" y="305" width="425" height="150" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="85" y="335" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399">3. Context &amp; Token Engine</text>
  <text x="85" y="365" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Sliding Window: Prunes older tool messages</text>
  <text x="85" y="390" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Smart Truncation: Head/Tail line sampling</text>
  <text x="85" y="415" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Token Budget Monitor: Hard stop before 128K</text>
  <text x="85" y="440" font-family="sans-serif" font-size="12" fill="#94a3b8">• Ephemeral Scratchpad: Discards raw bulky blobs</text>

  <rect x="515" y="305" width="425" height="150" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="540" y="335" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f87171">4. Human-in-the-Loop Safety Gate</text>
  <text x="540" y="365" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Path Traversal Guard: Blocks ../../ escapes</text>
  <text x="540" y="390" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Destructive Command Interceptor: rm -rf / git clean</text>
  <text x="540" y="415" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Unified Diff Preview: Color-coded [y/n/e/a] prompt</text>
  <text x="540" y="440" font-family="sans-serif" font-size="12" fill="#94a3b8">• Rollback Registry: Atomic backups before modification</text>

  <!-- Layer 5: Tool Execution &amp; Sandbox Engine -->
  <rect x="60" y="475" width="880" height="110" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" filter="url(#cardGlow)"/>
  <text x="90" y="508" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">5. Tool Execution &amp; PTY Sandboxed OS Layer</text>
  <text x="90" y="533" font-family="sans-serif" font-size="12" fill="#e2e8f0">• PTY Pseudoterminal Allocation (openpty / ConPTY): Emulates real terminal, avoids stdout buffer deadlock</text>
  <text x="90" y="555" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Process Group Isolation (setpgrp / os.killpg): Kills hung child trees completely without leaving zombies</text>
  <text x="90" y="575" font-family="sans-serif" font-size="12" fill="#94a3b8">• Core Tools: run_sandboxed_bash, read_file_range, apply_unified_diff, grep_search, list_workspace_dir</text>
</svg>
