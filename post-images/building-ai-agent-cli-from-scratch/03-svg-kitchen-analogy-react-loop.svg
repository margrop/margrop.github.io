<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">生活大比方：五星级大厨做菜与 ReAct 智能体循环</text>
  <text x="500" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">“接单 ➔ 翻冰箱 ➔ 构思菜谱 ➔ 操刀翻炒 ➔ 尝咸淡 ➔ 装盘出餐” 的闭环映射</text>

  <!-- Step 1: Customer Order -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="160" height="280" rx="12" fill="url(#blueCard)" stroke="#0284c7" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#0284c7"/>
    <rect x="0" y="25" width="160" height="15" fill="#0284c7"/>
    <text x="80" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1. 顾客下单</text>
    <text x="80" y="80" font-family="sans-serif" font-size="36" text-anchor="middle">📋</text>
    <text x="80" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">生活场景</text>
    <text x="80" y="155" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">“来一份少盐的</text>
    <text x="80" y="175" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">扬州炒饭”</text>
    <line x1="20" y1="195" x2="140" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="80" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">AI Agent 映射</text>
    <text x="80" y="250" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">User Prompt</text>
    <text x="80" y="270" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(用户任务指令)</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 205 250 L 225 250" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2: Context / Fridge -->
  <g transform="translate(230, 110)" filter="url(#shadow)">
    <rect width="160" height="280" rx="12" fill="url(#blueCard)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#6366f1"/>
    <rect x="0" y="25" width="160" height="15" fill="#6366f1"/>
    <text x="80" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2. 查看冷柜</text>
    <text x="80" y="80" font-family="sans-serif" font-size="36" text-anchor="middle">🧊</text>
    <text x="80" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">生活场景</text>
    <text x="80" y="155" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">翻看冰箱米饭、</text>
    <text x="80" y="175" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">火腿与调料储备</text>
    <line x1="20" y1="195" x2="140" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="80" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#818cf8" text-anchor="middle">AI Agent 映射</text>
    <text x="80" y="250" font-family="sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">Workspace Context</text>
    <text x="80" y="270" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(工作区目录/文件)</text>
  </g>

  <!-- Step 3: Chef Brain / Think -->
  <g transform="translate(420, 110)" filter="url(#shadow)">
    <rect width="160" height="280" rx="12" fill="url(#blueCard)" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#a855f7"/>
    <rect x="0" y="25" width="160" height="15" fill="#a855f7"/>
    <text x="80" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 构思菜谱</text>
    <text x="80" y="80" font-family="sans-serif" font-size="36" text-anchor="middle">🧠</text>
    <text x="80" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">生活场景</text>
    <text x="80" y="155" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">心想：“先热锅倒油</text>
    <text x="80" y="175" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">再打鸡蛋碎炒”</text>
    <line x1="20" y1="195" x2="140" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="80" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">AI Agent 映射</text>
    <text x="80" y="250" font-family="sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">LLM Reasoning</text>
    <text x="80" y="270" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(大模型思考: Think)</text>
  </g>

  <!-- Step 4: Utensils / Act -->
  <g transform="translate(610, 110)" filter="url(#shadow)">
    <rect width="160" height="280" rx="12" fill="url(#blueCard)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#f59e0b"/>
    <rect x="0" y="25" width="160" height="15" fill="#f59e0b"/>
    <text x="80" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">4. 操刀炒菜</text>
    <text x="80" y="80" font-family="sans-serif" font-size="36" text-anchor="middle">🍳</text>
    <text x="80" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">生活场景</text>
    <text x="80" y="155" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">拿起锅铲开大火，</text>
    <text x="80" y="175" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">爆香葱花与米饭</text>
    <line x1="20" y1="195" x2="140" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="80" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle">AI Agent 映射</text>
    <text x="80" y="250" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">Tool Execution</text>
    <text x="80" y="270" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(工具执行: Act)</text>
  </g>

  <!-- Step 5: Taste & Output -->
  <g transform="translate(800, 110)" filter="url(#shadow)">
    <rect width="160" height="280" rx="12" fill="url(#blueCard)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#10b981"/>
    <rect x="0" y="25" width="160" height="15" fill="#10b981"/>
    <text x="80" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">5. 尝味装盘</text>
    <text x="80" y="80" font-family="sans-serif" font-size="36" text-anchor="middle">🍽️</text>
    <text x="80" y="130" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">生活场景</text>
    <text x="80" y="155" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">尝口咸淡（不够补盐）</text>
    <text x="80" y="175" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">最终装盘端给顾客</text>
    <line x1="20" y1="195" x2="140" y2="195" stroke="#334155" stroke-width="1"/>
    <text x="80" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">AI Agent 映射</text>
    <text x="80" y="250" font-family="sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Observe & Output</text>
    <text x="80" y="270" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(观察反馈与最终交付)</text>
  </g>

  <!-- Cycle Loop Arrow (From 5 back to 3) -->
  <path d="M 880 395 C 880 460, 500 460, 500 395" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <text x="690" y="445" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">若尝味未熟/失败，带反馈进入下一轮循环 (ReAct Loop)</text>
</svg>
