<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#bg)"/>

  <text x="500" y="42" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">生活大比方：小学生课桌与文具盒（上下文窗口管理）</text>
  <text x="500" y="70" font-family="sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">为什么不能把整个书包一股脑倒在桌子上？如何用便签纸和笔盒维持极限专注</text>

  <!-- Left Side: Wrong Approach -->
  <rect x="50" y="100" width="425" height="380" rx="12" fill="#1e1315" stroke="#ef4444" stroke-width="2"/>
  <rect x="50" y="100" width="425" height="42" rx="12" fill="#ef4444"/>
  <rect x="50" y="125" width="425" height="17" fill="#ef4444"/>
  <text x="262" y="128" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ 错误做法：整包倒在课桌上（朴素累加）</text>

  <text x="262" y="180" font-family="sans-serif" font-size="42" text-anchor="middle">🎒 ➔ 💥 📚 📐 🗂️ 📎</text>
  <text x="80" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">• 现象：把小学六年所有课本、字典、草稿本全倒桌上</text>
  <text x="80" y="265" font-family="sans-serif" font-size="13" fill="#fca5a5">• 结果：桌面面积有限（128K Token Limit），瞬间堆满</text>
  <text x="80" y="295" font-family="sans-serif" font-size="13" fill="#fca5a5">• 后果：桌子被压垮（API 报 400 Context Exceeded）</text>
  <text x="80" y="325" font-family="sans-serif" font-size="13" fill="#fca5a5">• 找笔像大海捞针，大模型发生“大海捞针注意力衰减”</text>
  <text x="80" y="355" font-family="sans-serif" font-size="13" fill="#fca5a5">• 每翻一页书都要给老师交高额学费（Token 账单爆表）</text>
  <rect x="75" y="390" width="375" height="60" rx="8" fill="#2d1217" stroke="#f87171" stroke-width="1"/>
  <text x="262" y="415" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">Agent 映射：read_file 无差别读取 1MB 原始日志</text>
  <text x="262" y="435" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">直接把完整文本塞入 messages 历史，2 轮交互消耗殆尽</text>

  <!-- Right Side: Correct Approach -->
  <rect x="525" y="100" width="425" height="380" rx="12" fill="#0c1f17" stroke="#10b981" stroke-width="2"/>
  <rect x="525" y="100" width="425" height="42" rx="12" fill="#10b981"/>
  <rect x="525" y="125" width="425" height="17" fill="#10b981"/>
  <text x="737" y="128" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">✔ 正确做法：便签精简与文具盒（滑动窗口）</text>

  <text x="737" y="180" font-family="sans-serif" font-size="42" text-anchor="middle">✏️ 📝 🗃️ 🏷️</text>
  <text x="555" y="235" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7">• 做法：桌面只摆放当前正在写的这一页作业（Prompt）</text>
  <text x="555" y="265" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 文具盒只放 3 支必需的铅笔（核心系统指令 System Prompt）</text>
  <text x="555" y="295" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 字典太大不放桌面，查到答案记在便签纸上（采样摘要）</text>
  <text x="555" y="325" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 写完的旧草稿收进抽屉归档（滑动窗口剪除过期观察）</text>
  <text x="555" y="355" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 桌面永远清爽开阔，注意力 100% 聚焦当前题目</text>
  <rect x="550" y="390" width="375" height="60" rx="8" fill="#062d22" stroke="#34d399" stroke-width="1"/>
  <text x="737" y="415" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Agent 映射：Head/Tail 截断 + 观察结果滑动清理</text>
  <text x="737" y="435" font-family="sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">上下文永远维持在 3K~5K Token，连续交互 50 轮不宕机</text>
</svg>
