<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#bg)"/>

  <text x="500" y="42" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Agent CLI 声明式自动配置与运维 SOP</text>
  <text x="500" y="68" font-family="sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">Declarative Provisioning Pipeline · Zero External Dependencies · Idempotent State Engine</text>

  <!-- Step 1 -->
  <g transform="translate(50, 100)">
    <rect width="190" height="340" rx="10" fill="url(#card)" stroke="#0284c7" stroke-width="2"/>
    <rect width="190" height="40" rx="10" fill="#0284c7"/>
    <rect y="25" width="190" height="15" fill="#0284c7"/>
    <text x="95" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">阶段 1: 声明目标状态</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">agent.config.json</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#94a3b8">• 模型端点 (OpenAI/Ollama)</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#94a3b8">• 最大迭代轮数: 25</text>
    <text x="20" y="135" font-family="sans-serif" font-size="11" fill="#94a3b8">• 窗口硬限额: 128K</text>
    <text x="20" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8">• 工具安全策略: AUDIT</text>
    <text x="20" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">• 允许操作路径: ./workspace</text>
    <rect x="15" y="240" width="160" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="95" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">非交互式注入</text>
    <text x="95" y="285" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">--declarative --config</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(280, 100)">
    <rect width="190" height="340" rx="10" fill="url(#card)" stroke="#818cf8" stroke-width="2"/>
    <rect width="190" height="40" rx="10" fill="#818cf8"/>
    <rect y="25" width="190" height="15" fill="#818cf8"/>
    <text x="95" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">阶段 2: 幂等基座校验</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Runtime Pre-flight</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#94a3b8">• 探测 Python 3.10+ 环境</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#94a3b8">• 校验 PTY 虚拟终端驱动</text>
    <text x="20" y="135" font-family="sans-serif" font-size="11" fill="#94a3b8">• 检测现有 CLI 可执行别名</text>
    <text x="20" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8">• 已就绪则跳过重复安装</text>
    <text x="20" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">• 零破坏性，保证幂等</text>
    <rect x="15" y="240" width="160" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="95" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">三端兼容层</text>
    <text x="95" y="285" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Win11 / Ubuntu / macOS</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(510, 100)">
    <rect width="190" height="340" rx="10" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/>
    <rect width="190" height="40" rx="10" fill="#f59e0b"/>
    <rect y="25" width="190" height="15" fill="#f59e0b"/>
    <text x="95" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">阶段 3: 脚手架与注入</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Scaffold &amp; Tools</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#94a3b8">• 展开核心 ReAct 状态机</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#94a3b8">• 挂载 PTY 沙箱执行引擎</text>
    <text x="20" y="135" font-family="sans-serif" font-size="11" fill="#94a3b8">• 注入 Unified Diff 工具链</text>
    <text x="20" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8">• 绑定滑动窗口防爆中间件</text>
    <text x="20" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">• 写入安全拦截规则库</text>
    <rect x="15" y="240" width="160" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="95" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">原子写入</text>
    <text x="95" y="285" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">带备份与回滚机制</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(740, 100)">
    <rect width="210" height="340" rx="10" fill="url(#card)" stroke="#10b981" stroke-width="2"/>
    <rect width="210" height="40" rx="10" fill="#10b981"/>
    <rect y="25" width="210" height="15" fill="#10b981"/>
    <text x="105" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">阶段 4: 8项自测验收</text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">Automated Verification</text>
    <text x="20" y="95" font-family="sans-serif" font-size="11" fill="#94a3b8">✔ ReAct 循环终止判定</text>
    <text x="20" y="115" font-family="sans-serif" font-size="11" fill="#94a3b8">✔ PTY 超时与进程树强杀</text>
    <text x="20" y="135" font-family="sans-serif" font-size="11" fill="#94a3b8">✔ Token 滑动窗口剪枝</text>
    <text x="20" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8">✔ 畸形 JSON 自动容错</text>
    <text x="20" y="175" font-family="sans-serif" font-size="11" fill="#94a3b8">✔ 高危审批门禁拒执行</text>
    <text x="20" y="195" font-family="sans-serif" font-size="11" fill="#94a3b8">✔ 路径跨目录逃逸拦截</text>
    <rect x="15" y="240" width="180" height="70" rx="6" fill="#062d22" stroke="#10b981" stroke-width="1"/>
    <text x="105" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">PASS (8/8 OK)</text>
    <text x="105" y="285" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Exit Code: 0 (Provisioned)</text>
  </g>

  <!-- Connectors -->
  <path d="M 240 270 L 280 270" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 470 270 L 510 270" stroke="#818cf8" stroke-width="2"/>
  <path d="M 700 270 L 740 270" stroke="#f59e0b" stroke-width="2"/>

  <!-- Footer note -->
  <text x="500" y="485" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">全流程无任何第三方云端依赖，支持 CI/CD 流水线与 Agent 自治环境初始化</text>
</svg>
