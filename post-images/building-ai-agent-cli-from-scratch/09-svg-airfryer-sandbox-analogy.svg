<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bg)"/>

  <text x="500" y="42" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">生活大比方：空气炸锅与厨房防烫手套（PTY 终端沙箱）</text>
  <text x="500" y="70" font-family="sans-serif" font-size="13" fill="#38bdf8" text-anchor="middle">为什么直接在木桌上生火会烧掉厨房？如何用隔离仓与定时器实现绝对安全</text>

  <!-- Left: Raw Command Execution -->
  <rect x="60" y="100" width="410" height="350" rx="12" fill="#1e1315" stroke="#ef4444" stroke-width="2"/>
  <text x="265" y="135" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ef4444" text-anchor="middle">🔥 裸跑 Shell（木桌上生火）</text>
  <text x="265" y="185" font-family="sans-serif" font-size="40" text-anchor="middle">🪵 🔥 🚒</text>
  <text x="90" y="240" font-family="sans-serif" font-size="13" fill="#fca5a5">• 危险：直接在客厅木茶几上点明火烤肉</text>
  <text x="90" y="270" font-family="sans-serif" font-size="13" fill="#fca5a5">• 没有定时器：火势失控越烧越旺（死循环挂死）</text>
  <text x="90" y="300" font-family="sans-serif" font-size="13" fill="#fca5a5">• 没有油烟机：烟雾倒灌房间（管道死锁缓冲区塞满）</text>
  <text x="90" y="330" font-family="sans-serif" font-size="13" fill="#fca5a5">• 没有灭火器：主人强行离开，火还在继续烧（孤儿进程）</text>
  <rect x="85" y="360" width="360" height="60" rx="8" fill="#2d1217" stroke="#f87171" stroke-width="1"/>
  <text x="265" y="385" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">原生缺陷：subprocess.Popen(shell=True)</text>
  <text x="265" y="405" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">缺乏伪终端绑定与进程组生命周期治理，极易 hang 死</text>

  <!-- Right: PTY Sandbox -->
  <rect x="530" y="100" width="410" height="350" rx="12" fill="#0c1f17" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="135" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">🛡️ PTY 沙箱（智能空气炸锅）</text>
  <text x="735" y="185" font-family="sans-serif" font-size="40" text-anchor="middle">🍗 ⏲️ 🧤 🔌</text>
  <text x="560" y="240" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 金属密封舱：热量不外泄（独立 PTY 虚拟终端驱动）</text>
  <text x="560" y="270" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 机械定时器：时间一到“叮”的一声断电（硬超时控制）</text>
  <text x="560" y="300" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 抽屉联动开关：抽开炸篮立即全断电（os.killpg 进程组强杀）</text>
  <text x="560" y="330" font-family="sans-serif" font-size="13" fill="#6ee7b7">• 防烫手套：人工确认后再端出来（高危操作审批门禁）</text>
  <rect x="555" y="360" width="360" height="60" rx="8" fill="#062d22" stroke="#34d399" stroke-width="1"/>
  <text x="735" y="385" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">架构实装：pty.openpty() + setpgrp() + SIGKILL</text>
  <text x="735" y="405" font-family="sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">完美兼容 ANSI 交互输出，彻底杜绝僵尸进程与终端假死</text>
</svg>
