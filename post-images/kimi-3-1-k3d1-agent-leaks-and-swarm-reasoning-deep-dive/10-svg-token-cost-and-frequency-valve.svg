  <text x="90" y="270" fill="#cbd5e1" font-size="13">每次调用耗费 15 万 Token，每日高强度编程 4~6 小时</text>
  <text x="90" y="295" fill="#f87171" font-size="13">➔ 全月 26M 大池在 第 5.2 天 彻底干涸！</text>

  <rect x="75" y="330" width="480" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="90" y="355" fill="#10b981" font-size="14" font-weight="bold">换装 Kimi 3.1 [Low/High 动态按需档] 后的耐用度：</text>
  <text x="90" y="380" fill="#cbd5e1" font-size="13">日常单测与代码改动仅消耗 1/3 Token，KV 压缩 4.2x</text>
