  <rect x="645" y="170" width="480" height="35" rx="6" fill="#451a03"/>
  <text x="660" y="193" fill="#f59e0b" font-size="14" font-weight="bold">5-Hour Sliding Window Rate Limit Valve</text>

  <rect x="645" y="220" width="480" height="210" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="660" y="245" fill="#f59e0b" font-size="14" font-weight="bold">防爆警告：即便全月余额剩余 80%，瞬时高并发仍会熔断！</text>
  <text x="660" y="275" fill="#cbd5e1" font-size="13">• Swarm 多智能体若无节制并发，5 轮迭代即可突破 2.5M 阈值</text>
