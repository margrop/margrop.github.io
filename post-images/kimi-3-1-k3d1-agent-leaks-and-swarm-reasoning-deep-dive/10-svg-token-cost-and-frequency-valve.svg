  <text x="75" y="135" fill="#38bdf8" font-size="16" font-weight="bold">第一道防线：月度统一共享大水库 (约 26,000,000 Tokens)</text>

  <rect x="75" y="170" width="480" height="35" rx="6" fill="#082f49"/>
