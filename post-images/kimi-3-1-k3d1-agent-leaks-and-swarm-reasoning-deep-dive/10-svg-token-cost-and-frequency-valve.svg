  <text x="75" y="505" fill="#38bdf8" font-size="16" font-weight="bold">开发者黄金实战法则：动静分离与模型分流 (Rule of Thumb)</text>
  <text x="75" y="535" fill="#ffffff" font-size="14">1. 日常代码补全、小型重构、单测生成 ➔ 锁定 K3.1 [Tier: Low]，享受 280ms 极速吐字与极低额度消耗；</text>
  <text x="75" y="565" fill="#ffffff" font-size="14">2. 跨工程模块重构、复杂竞态死锁分析 ➔ 开启 K3.1 [Tier: High]，借助 Swarm 多智能体并行推演；</text>
  <text x="75" y="595" fill="#ffffff" font-size="14">3. 部署跨平台探针脚本守护频控水龙头 ➔ 杜绝 429 限流卡死，真正把 199 元订阅榨干出数千元商业 API 的价值！</text>
