<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="55" rx="14" fill="#182234"/>
  <line x1="22" y1="77" x2="1178" y2="77" stroke="#334155" stroke-width="2"/>
  <circle cx="48" cy="48" r="7" fill="#ef4444"/>
  <circle cx="70" cy="48" r="7" fill="#f59e0b"/>
  <circle cx="92" cy="48" r="7" fill="#10b981"/>
  <text x="120" y="54" fill="#f8fafc" font-size="18" font-weight="bold">跨平台自动化诊断脚本与智能体无缝集成调度架构 (Cross-Platform Pipeline)</text>

  <!-- Left Branch: Human Execution -->
  <rect x="50" y="105" width="530" height="525" rx="12" fill="#131d31" stroke="#38bdf8" stroke-width="2"/>
  <rect x="50" y="105" width="530" height="45" rx="10" fill="#1e293b"/>
  <text x="75" y="135" fill="#38bdf8" font-size="16" font-weight="bold">模式 A：人工运维与开发者一键自动化自测</text>

  <rect x="75" y="170" width="480" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="95" y="195" fill="#f8fafc" font-size="14" font-weight="bold">Windows 11 (PowerShell 7+)</text>
  <text x="95" y="220" fill="#38bdf8" font-size="12">powershell -ExecutionPolicy Bypass -File .\kimi_31_probe_windows11.ps1</text>
  <text x="95" y="242" fill="#94a3b8" font-size="12">零外部依赖，使用 .NET 原生 HttpClient 与系统安全凭据</text>

  <rect x="75" y="275" width="480" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="95" y="300" fill="#f8fafc" font-size="14" font-weight="bold">Ubuntu 26.04 LTS (Bash)</text>
  <text x="95" y="325" fill="#38bdf8" font-size="12">bash ./kimi_31_probe_ubuntu2604.sh</text>
  <text x="95" y="347" fill="#94a3b8" font-size="12">纯原生 curl + awk 处理，适配 systemd 服务常驻健康探针</text>

  <rect x="75" y="380" width="480" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="95" y="405" fill="#f8fafc" font-size="14" font-weight="bold">macOS 26 (Apple Silicon Zsh)</text>
  <text x="95" y="430" fill="#38bdf8" font-size="12">zsh ./kimi_31_probe_macos26.zsh</text>
  <text x="95" y="452" fill="#94a3b8" font-size="12">兼容 Darwin 内核网络栈，支持 LaunchAgent 定时后台省流巡检</text>

  <rect x="75" y="490" width="480" height="120" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
  <text x="95" y="515" fill="#38bdf8" font-size="14" font-weight="bold">人工操作核心特征：</text>
  <text x="95" y="540" fill="#cbd5e1" font-size="12">• 交互式终端彩色高亮输出，直观呈现网关状态与 TTFT 毫秒数</text>
  <text x="95" y="565" fill="#cbd5e1" font-size="12">• 实时判断当前账号是否已被纳入 K3.1 灰度白名单</text>
  <text x="95" y="590" fill="#10b981" font-size="12">• 遭遇 429 频控时自动计算并倒计时冷却时间</text>

  <!-- Right Branch: Autonomous Agent Execution -->
  <rect x="620" y="105" width="530" height="525" rx="12" fill="#131d31" stroke="#10b981" stroke-width="2"/>
  <rect x="620" y="105" width="530" height="45" rx="10" fill="#1e293b"/>
  <text x="645" y="135" fill="#10b981" font-size="16" font-weight="bold">模式 B：AI Agent 自治调度与无感托管配置</text>

  <rect x="645" y="170" width="480" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="195" fill="#f8fafc" font-size="14" font-weight="bold">参数化静默输出 (--agent-mode --json)</text>
  <text x="665" y="220" fill="#10b981" font-size="12">./probe.sh --agent-mode --json ➔ 标准结构化遥测输出</text>
  <text x="665" y="242" fill="#94a3b8" font-size="12">无任何 ANSI 干扰字符，LLM Agent 可直接精确反序列化</text>

  <rect x="645" y="275" width="480" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="300" fill="#f8fafc" font-size="14" font-weight="bold">智能体动态自愈与降级策略 (Autonomous Fallback)</text>
  <text x="665" y="325" fill="#cbd5e1" font-size="12">若探针检测到 k3d1-agent 403/429 ➔ 自动回退至标准 K3</text>
  <text x="665" y="347" fill="#cbd5e1" font-size="12">若检测到白名单激活 ➔ 自动注入 reasoning_effort=low 提速</text>

  <rect x="645" y="380" width="480" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="665" y="405" fill="#f8fafc" font-size="14" font-weight="bold">严格企业级隐私脱敏 (Zero-Leak Sanitization)</text>
  <text x="665" y="430" fill="#cbd5e1" font-size="12">自动擦除全部内网完整 IP、本地计算机名与敏感 Key</text>
  <text x="665" y="452" fill="#10b981" font-size="12">保证遥测回传与日志归档绝对零隐私泄露风险</text>

  <rect x="645" y="490" width="480" height="120" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="665" y="515" fill="#10b981" font-size="14" font-weight="bold">Agent 自治核心优势：</text>
  <text x="665" y="540" fill="#cbd5e1" font-size="12">• 适合 Claude Code, Cursor, OpenClaw, HermesAgent 等自主运维</text>
  <text x="665" y="565" fill="#cbd5e1" font-size="12">• 零人工干预完成环境配置、依赖检查与模型能力基准自检</text>
  <text x="665" y="590" fill="#4ade80" font-size="12">• 真正实现跨平台统一的“声明式模型治理”全闭环</text>
</svg>