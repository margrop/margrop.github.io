<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="55" rx="14" fill="#182234"/>
  <line x1="22" y1="77" x2="1178" y2="77" stroke="#334155" stroke-width="2"/>
  <circle cx="48" cy="48" r="7" fill="#ef4444"/>
  <circle cx="70" cy="48" r="7" fill="#f59e0b"/>
  <circle cx="92" cy="48" r="7" fill="#10b981"/>
  <text x="120" y="54" fill="#f8fafc" font-size="18" font-weight="bold">Kimi 3.1 原生 Swarm 蜂群多智能体协同架构 (Multi-Agent Swarm Orchestration)</text>

  <!-- User Input -->
  <rect x="60" y="110" width="220" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="145" fill="#38bdf8" font-size="15" font-weight="bold">开发者复杂工程指令</text>
  <text x="80" y="172" fill="#cbd5e1" font-size="13">"全工程重构 Channel 泄漏并补全单测"</text>

  <!-- Flow Arrow -->
  <line x1="280" y1="155" x2="360" y2="155" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>

  <!-- Supervisor Planner Agent -->
  <rect x="360" y="100" width="280" height="110" rx="10" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="385" y="132" fill="#38bdf8" font-size="16" font-weight="bold">Supervisor 规划中枢</text>
  <text x="385" y="158" fill="#e2e8f0" font-size="13">• AST 依赖树解析与上下文切片</text>
  <text x="385" y="182" fill="#94a3b8" font-size="12">• 生成 DAG 有向无环任务拓扑图</text>
  <text x="385" y="200" fill="#10b981" font-size="12">• 动态调度 Low/High/Max 慢思考</text>

  <!-- Flow to Parallel Swarm -->
  <line x1="500" y1="210" x2="500" y2="270" stroke="#a855f7" stroke-width="2"/>
  <text x="515" y="245" fill="#a855f7" font-size="13" font-weight="bold">并发解耦分发 (Parallel Swarm Fork)</text>

  <!-- Central Blackboard / Shared Context Reservoir -->
  <rect x="60" y="270" width="1080" height="80" rx="10" fill="#131d31" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="305" fill="#f59e0b" font-size="16" font-weight="bold">Shared Context Blackboard (1M Token 共享记忆大黑板 / KV-Cache 压缩池)</text>
  <text x="90" y="332" fill="#94a3b8" font-size="13">各子智能体共享工程状态、类型定义与错误日志，避免冗余 Prompt 传递，Token 消耗直降 55%！</text>

  <!-- 3 Parallel Sub-Agents -->
  <!-- Agent A: Searcher / RAG -->
  <rect x="60" y="380" width="320" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="412" fill="#38bdf8" font-size="15" font-weight="bold">Agent 1: Searcher &amp; RAG</text>
  <text x="80" y="440" fill="#cbd5e1" font-size="13">• 全网官方文档与依赖抓取</text>
  <text x="80" y="465" fill="#cbd5e1" font-size="13">• 本地源码符号语义检索</text>
  <text x="80" y="490" fill="#94a3b8" font-size="12">慢思考模式: Low (快速吐字)</text>
  <text x="80" y="512" fill="#10b981" font-size="12">首字响应: 280ms</text>

  <!-- Agent B: Code Synthesizer -->
  <rect x="440" y="380" width="320" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="412" fill="#10b981" font-size="15" font-weight="bold">Agent 2: Code Synthesizer</text>
  <text x="460" y="440" fill="#cbd5e1" font-size="13">• 生成 Unified Diff 代码补丁</text>
  <text x="460" y="465" fill="#cbd5e1" font-size="13">• 针对通道锁竞态条件精修</text>
  <text x="460" y="490" fill="#94a3b8" font-size="12">慢思考模式: High (深度边界推导)</text>
  <text x="460" y="512" fill="#f59e0b" font-size="12">吞吐速率: 110 Tok/s</text>

  <!-- Agent C: Verifier & Tester -->
  <rect x="820" y="380" width="320" height="150" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="840" y="412" fill="#a855f7" font-size="15" font-weight="bold">Agent 3: Verifier &amp; Tester</text>
  <text x="840" y="440" fill="#cbd5e1" font-size="13">• 自动化单测生成与静态 Lint</text>
  <text x="840" y="465" fill="#cbd5e1" font-size="13">• 动态执行诊断与死锁复查</text>
  <text x="840" y="490" fill="#94a3b8" font-size="12">慢思考模式: Max (形式化逻辑证明)</text>
  <text x="840" y="512" fill="#a855f7" font-size="12">严格排错无漏洞</text>

  <!-- Bottom Synthesis Result -->
  <rect x="60" y="565" width="1080" height="75" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text x="90" y="595" fill="#4ade80" font-size="15" font-weight="bold">Swarm 合流交付：经过严格双重检验的代码补丁与绿色通过的单元测试套件</text>
  <text x="90" y="622" fill="#cbd5e1" font-size="13">无需开发者人工来回粘贴纠错，多智能体在沙箱内完成闭环治理，单次任务端到端交付成功率飙升至 91.4%！</text>
</svg>