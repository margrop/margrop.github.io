  <text x="120" y="54" fill="#f8fafc" font-size="18" font-weight="bold">技术架构代际跃迁：Kimi K3 (2.8T MoE) 对比 Kimi K3.1 (k3d1-agent)</text>

  <!-- Top Half: Kimi K3 (July 2026) -->
  <rect x="50" y="100" width="1100" height="235" rx="12" fill="#131d31" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="100" width="1100" height="42" rx="10" fill="#1e293b"/>
  <text x="75" y="128" fill="#94a3b8" font-size="16" font-weight="bold">【上代旗舰基座】Kimi K3 (2026年7月发布) ➔ 单兵巨构，大力出奇迹</text>

  <rect x="75" y="160" width="220" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
