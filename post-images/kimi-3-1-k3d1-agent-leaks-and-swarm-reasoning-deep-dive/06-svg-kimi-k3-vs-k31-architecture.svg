  <text x="390" y="580" fill="#10b981" font-size="12">效率飙升 60% 以上</text>

  <text x="615" y="525" fill="#38bdf8" font-size="28" font-weight="bold">➔</text>

  <rect x="665" y="420" width="220" height="200" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="685" y="455" fill="#f59e0b" font-size="15" font-weight="bold">3 档动态慢思考</text>
  <text x="685" y="485" fill="#f8fafc" font-size="13">Tunable Reasoning</text>
  <text x="685" y="510" fill="#cbd5e1" font-size="12">Low : 心算口算零延迟</text>
  <text x="685" y="532" fill="#cbd5e1" font-size="12">High : 草稿纸平衡推演</text>
  <text x="685" y="555" fill="#cbd5e1" font-size="12">Max : 奥数级严密思维树</text>
  <text x="685" y="580" fill="#10b981" font-size="12">开发者掌控算力预算</text>

  <text x="910" y="525" fill="#38bdf8" font-size="28" font-weight="bold">➔</text>

  <rect x="955" y="420" width="170" height="200" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1"/>
  <text x="975" y="455" fill="#10b981" font-size="15" font-weight="bold">实战核心收益</text>
  <text x="975" y="485" fill="#cbd5e1" font-size="12">✓ 人机交互丝滑沉浸</text>
  <text x="975" y="515" fill="#cbd5e1" font-size="12">✓ 额度耐用度提升 3x</text>
  <text x="975" y="545" fill="#cbd5e1" font-size="12">✓ 告别 429 频控限流</text>
  <text x="975" y="575" fill="#cbd5e1" font-size="12">✓ 复杂任务单次成功率</text>
  <text x="975" y="598" fill="#10b981" font-size="12">   提升至 91.4%</text>
