<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="55" rx="14" fill="#182234"/>
  <line x1="22" y1="77" x2="1178" y2="77" stroke="#334155" stroke-width="2"/>
  <circle cx="48" cy="48" r="7" fill="#ef4444"/>
  <circle cx="70" cy="48" r="7" fill="#f59e0b"/>
  <circle cx="92" cy="48" r="7" fill="#10b981"/>
  <text x="120" y="54" fill="#f8fafc" font-size="18" font-weight="bold">小学生秒懂日常比方：Kimi 3.1 核心特性的生活化通俗拆解</text>

  <!-- Left Card: 3-tier Reasoning Effort (Math Scratchpad) -->
  <rect x="50" y="105" width="530" height="525" rx="12" fill="#131d31" stroke="#38bdf8" stroke-width="2"/>
  <rect x="50" y="105" width="530" height="45" rx="10" fill="#1e293b"/>
  <text x="75" y="135" fill="#38bdf8" font-size="16" font-weight="bold">特写 1：3 档慢思考 ➔ 做数学题的“草稿纸深度”</text>

  <!-- Low Tier -->
  <rect x="70" y="170" width="490" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="90" y="198" fill="#10b981" font-size="15" font-weight="bold">【Low 极速档】口算心算 (如 9 × 9 = 81)</text>
  <text x="90" y="225" fill="#cbd5e1" font-size="13">生活场景：简单乘法表一眼出答案，完全不需草稿纸。</text>
  <text x="90" y="248" fill="#94a3b8" font-size="12">模型表现：首字响应 280ms，零思维耗时，极速省额度！</text>

  <!-- High Tier -->
  <rect x="70" y="285" width="490" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="90" y="313" fill="#f59e0b" font-size="15" font-weight="bold">【High 推荐档】草稿纸列竖式 (如 128 × 47)</text>
  <text x="90" y="340" fill="#cbd5e1" font-size="13">生活场景：两位数乘法在草稿纸边缘列式，并心算验算一遍。</text>
  <text x="90" y="363" fill="#94a3b8" font-size="12">模型表现：慢思考约 2~4 秒，推导核心边界条件，保障正确率。</text>

  <!-- Max Tier -->
  <rect x="70" y="410" width="490" height="120" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
  <text x="90" y="438" fill="#a855f7" font-size="15" font-weight="bold">【Max 终极档】奥数压轴大题 (画辅助线与反证法)</text>
  <text x="90" y="465" fill="#cbd5e1" font-size="13">生活场景：压轴几何证明题，在整张大草稿纸上探索多种解法并排错。</text>
  <text x="90" y="488" fill="#94a3b8" font-size="12">模型表现：深入多链回溯推导，生成完整思维树，数学级绝对严谨！</text>

  <rect x="70" y="545" width="490" height="65" rx="6" fill="#082f49"/>
  <text x="85" y="572" fill="#38bdf8" font-size="13" font-weight="bold">小结：告别‘不管问啥都傻呆呆慢思考几十秒’，按需选草稿纸！</text>
  <text x="85" y="595" fill="#94a3b8" font-size="12">既节约了开发者的宝贵等待时间，又彻底保住了每月配额大水库。</text>

  <!-- Right Card: Swarm Multi-Agent Collaboration (School Classroom Cleaning) -->
  <rect x="620" y="105" width="530" height="525" rx="12" fill="#131d31" stroke="#a855f7" stroke-width="2"/>
  <rect x="620" y="105" width="530" height="45" rx="10" fill="#1e293b"/>
  <text x="645" y="135" fill="#a855f7" font-size="16" font-weight="bold">特写 2：Swarm 多智能体 ➔ 学校班级“大扫除分工”</text>

  <!-- Old Way -->
  <rect x="640" y="170" width="490" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="660" y="198" fill="#ef4444" font-size="15" font-weight="bold">传统单兵模式：班长一个人包揽全部大扫除</text>
  <text x="660" y="225" fill="#cbd5e1" font-size="13">扫地、擦黑板、倒垃圾、洗抹布全靠一个人轮流干，累死还总超时。</text>
  <text x="660" y="248" fill="#94a3b8" font-size="12">对应痛点：单个 Agent 循环调用，等待累加，上下文臃肿导致逻辑卡壳。</text>

  <!-- Swarm Way -->
  <rect x="640" y="285" width="490" height="145" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="660" y="313" fill="#10b981" font-size="15" font-weight="bold">Kimi 3.1 Swarm 蜂群协作：各小组同时动手！</text>
  <text x="660" y="340" fill="#cbd5e1" font-size="13">【总指挥】在讲台上写任务清单并动态分配（Supervisor）</text>
  <text x="660" y="365" fill="#cbd5e1" font-size="13">【地面组】专注扫地擦地，【玻璃组】专注喷水擦窗（Parallel Workers）</text>
  <text x="660" y="390" fill="#cbd5e1" font-size="13">【卫生委员】拿着手电筒与放大镜严格验收打分（Verifier）</text>
  <text x="660" y="415" fill="#94a3b8" font-size="12">协同机制：黑板即共享记忆池，大家举手即时沟通，效率提升数倍！</text>

  <!-- 1M Context -->
  <rect x="640" y="445" width="490" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="660" y="473" fill="#38bdf8" font-size="15" font-weight="bold">100 万长文本：随身携带装了彩色便签的大词典</text>
  <text x="660" y="500" fill="#cbd5e1" font-size="13">不用一页页死翻，贴了高灵敏雷达荧光签，问哪一页瞬间秒翻到！</text>
  <text x="660" y="520" fill="#94a3b8" font-size="12">底层 KV-Cache 压缩率 4.2x，超长文件搜索首字不卡顿。</text>

  <rect x="640" y="545" width="490" height="65" rx="6" fill="#3b0764"/>
  <text x="655" y="572" fill="#c084fc" font-size="13" font-weight="bold">总结：不是单纯比拼谁力气大，而是看谁脑子转得巧、配合得默契！</text>
  <text x="655" y="595" fill="#94a3b8" font-size="12">小学生能懂的质朴逻辑，正是现代分布式人工智能的最深层精髓。</text>
</svg>