<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">调优四线作战图：PostgreSQL 的资源都花在哪</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">把数据库想成一家餐厅：备菜区、服务员、收银小票、保洁 —— 四条线都要管</text>

  <!-- 内存 -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#16283f" stroke="#4a90d9" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#2f6db3"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">① 内存 = 大堂备菜区</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="22" font-weight="bold" fill="#9fd0ff">shared_buffers · work_mem</text>
      <text x="30" y="128" font-size="19" fill="#d6e9ff">备菜区越大，跑后厨（磁盘）次数越少</text>
      <text x="30" y="162" font-size="19" fill="#d6e9ff">小料台每桌一份，桌数多要控制单份大小</text>
      <text x="30" y="200" font-size="19" fill="#ffd9a0">默认 128MB / 4MB —— 远远不够</text>
    </g>
  </g>

  <!-- 连接 -->
  <g transform="translate(620,150)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#1f2a1a" stroke="#68a357" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#4a7c3a"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">② 连接 = 服务员编制</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="22" font-weight="bold" fill="#b8e6a8">max_connections + PgBouncer</text>
      <text x="30" y="128" font-size="19" fill="#dcf2d2">一个连接 = 一名专属服务员（一个进程）</text>
      <text x="30" y="162" font-size="19" fill="#dcf2d2">客人太多不靠扩招，靠领班发号码牌</text>
      <text x="30" y="200" font-size="19" fill="#ffd9a0">默认 100 —— 撞墙就是「too many clients」</text>
    </g>
  </g>

  <!-- 写入 -->
  <g transform="translate(70,400)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#3a2c17" stroke="#d98e32" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#b06f1d"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">③ 写入 = 小票与盘点</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="18" font-weight="bold" fill="#ffd9a0">max_wal_size · checkpoint_timeout · wal_compression</text>
      <text x="30" y="128" font-size="19" fill="#f0dcbb">每笔记小票（WAL 顺序写）快，盘点抄账慢</text>
      <text x="30" y="162" font-size="19" fill="#f0dcbb">盘点太频繁，高峰期就会一卡一卡</text>
      <text x="30" y="200" font-size="19" fill="#ffd9a0">默认 1GB / 5 分钟 —— 写多就不够用</text>
    </g>
  </g>

  <!-- 清理 -->
  <g transform="translate(620,400)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#331b24" stroke="#c05b7c" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#9c3d5f"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">④ 清理 = 保洁打扫</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="22" font-weight="bold" fill="#f3b8cc">autovacuum_vacuum_scale_factor</text>
      <text x="30" y="128" font-size="19" fill="#f5d7e2">删掉的数据像衣柜里没清走的旧衣服</text>
      <text x="30" y="162" font-size="19" fill="#f5d7e2">攒到 20% 才打扫？大表会等成「垃圾山」</text>
      <text x="30" y="200" font-size="19" fill="#ffd9a0">默认 0.2 —— 大表建议降到 0.05</text>
    </g>
  </g>
</svg>
