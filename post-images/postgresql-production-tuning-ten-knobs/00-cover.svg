<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="pgBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2f6db3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="80" cy="90" r="4"/><circle cx="180" cy="60" r="3"/><circle cx="1120" cy="120" r="4"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="120" cy="590" r="4"/><circle cx="980" cy="70" r="3"/>
    <circle cx="620" cy="620" r="3"/><circle cx="60" cy="330" r="3"/><circle cx="1140" cy="330" r="3"/>
  </g>
  <!-- PostgreSQL 大象新家：开始装修 -->
  <g transform="translate(90,360)">
    <rect x="0" y="70" width="380" height="190" rx="18" fill="url(#pgBody)" stroke="#1d4e86" stroke-width="5"/>
    <rect x="0" y="70" width="380" height="40" rx="18" fill="#1d4e86"/>
    <g transform="translate(24,108)" fill="#eaf3ff">
      <ellipse cx="60" cy="62" rx="52" ry="46"/>
      <circle cx="96" cy="44" r="26"/>
      <path d="M112 62 q26 10 20 44" stroke="#eaf3ff" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="104" cy="40" r="4.5" fill="#1d4e86"/>
    </g>
    <text x="280" y="172" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#ffffff">PostgreSQL</text>
    <text x="280" y="212" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#bcd8f5">新家入住 · 开始装修</text>
  </g>
  <!-- 开关面板 -->
  <g transform="translate(540,360)">
    <rect x="0" y="0" width="570" height="260" rx="18" fill="#101828" stroke="#3d5a80" stroke-width="3"/>
    <text x="285" y="44" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#9fc3ec">生产调优开关面板</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#e6edf3">
      <text x="36" y="86">shared_buffers</text>
      <text x="36" y="136">work_mem</text>
      <text x="36" y="186">max_wal_size</text>
      <text x="36" y="236">autovacuum</text>
    </g>
    <g>
      <rect x="300" y="64" width="96" height="32" rx="16" fill="#28c840"/>
      <circle cx="378" cy="80" r="12" fill="#ffffff"/>
      <rect x="300" y="114" width="96" height="32" rx="16" fill="#28c840"/>
      <circle cx="378" cy="130" r="12" fill="#ffffff"/>
      <rect x="300" y="164" width="96" height="32" rx="16" fill="#28c840"/>
      <circle cx="378" cy="180" r="12" fill="#ffffff"/>
      <rect x="300" y="214" width="96" height="32" rx="16" fill="#28c840"/>
      <circle cx="378" cy="230" r="12" fill="#ffffff"/>
    </g>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#7ee787">
      <text x="420" y="86">128MB → 25% 内存</text>
      <text x="420" y="136">4MB → 按预算</text>
      <text x="420" y="186">1GB → 4GB+</text>
      <text x="420" y="236">0.2 → 0.05</text>
    </g>
  </g>
  <!-- 标题 -->
  <text x="600" y="150" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="60" font-weight="bold" fill="#ffffff">128MB 内存也想跑生产？</text>
  <text x="600" y="220" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="44" font-weight="bold" fill="#ffcc4d">PostgreSQL 必调的 10 个开关</text>
  <text x="600" y="286" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#9fc3ec">内存 · 连接 · 写入 · 清理 —— 搬进新家后的「装修」实战</text>
</svg>
