<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg4)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">连接模型：专属服务员 vs 领班发号码牌</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">PostgreSQL 每个连接一个进程 —— 客人翻倍不能靠无限招服务员</text>

  <!-- 左边：无连接池 -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="490" height="440" rx="16" fill="#331b24" stroke="#c05b7c" stroke-width="4"/>
    <rect x="0" y="0" width="490" height="54" rx="16" fill="#9c3d5f"/>
    <text x="245" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">没有连接池：1 客 1 服务员</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="96" font-size="20" fill="#f5d7e2">1000 个客人 = 1000 个进程</text>
      <text x="30" y="130" font-size="20" fill="#f5d7e2">每个进程占内存、抢 CPU、互相挤</text>
    </g>
    <!-- 小人阵列 -->
    <g fill="#f3b8cc">
      <circle cx="70" cy="190" r="14"/><circle cx="130" cy="190" r="14"/><circle cx="190" cy="190" r="14"/><circle cx="250" cy="190" r="14"/><circle cx="310" cy="190" r="14"/><circle cx="370" cy="190" r="14"/><circle cx="430" cy="190" r="14"/>
      <circle cx="70" cy="240" r="14"/><circle cx="130" cy="240" r="14"/><circle cx="190" cy="240" r="14"/><circle cx="250" cy="240" r="14"/><circle cx="310" cy="240" r="14"/><circle cx="370" cy="240" r="14"/><circle cx="430" cy="240" r="14"/>
      <circle cx="70" cy="290" r="14"/><circle cx="130" cy="290" r="14"/><circle cx="190" cy="290" r="14"/><circle cx="250" cy="290" r="14"/><circle cx="310" cy="290" r="14"/><circle cx="370" cy="290" r="14"/><circle cx="430" cy="290" r="14"/>
    </g>
    <text x="245" y="340" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#ff8fa8">× 1000 …… 餐厅挤爆</text>
    <rect x="30" y="366" width="430" height="52" rx="10" fill="#4a2532"/>
    <text x="245" y="399" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#ffb3c2">结果：FATAL: sorry, too many clients</text>
  </g>

  <!-- 右边：PgBouncer -->
  <g transform="translate(640,150)">
    <rect x="0" y="0" width="490" height="440" rx="16" fill="#1f2a1a" stroke="#68a357" stroke-width="4"/>
    <rect x="0" y="0" width="490" height="54" rx="16" fill="#4a7c3a"/>
    <text x="245" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">PgBouncer：领班发号码牌</text>
    <!-- 排队客人 -->
    <g fill="#dcf2d2">
      <circle cx="50" cy="110" r="12"/><circle cx="50" cy="145" r="12"/><circle cx="50" cy="180" r="12"/><circle cx="50" cy="215" r="12"/><circle cx="50" cy="250" r="12"/><circle cx="50" cy="285" r="12"/>
    </g>
    <text x="50" y="330" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#b8e6a8">1000 客</text>
    <!-- 领班 -->
    <rect x="120" y="150" width="140" height="120" rx="12" fill="#4a7c3a"/>
    <text x="190" y="205" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">领班</text>
    <text x="190" y="240" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#dcf2d2">PgBouncer</text>
    <path d="M75 210 L115 210" stroke="#b8e6a8" stroke-width="5" stroke-linecap="round"/>
    <path d="M103 196 L120 210 L103 224 Z" fill="#b8e6a8"/>
    <!-- 服务员 -->
    <g>
      <rect x="330" y="96" width="120" height="46" rx="10" fill="#2c4f2a" stroke="#68a357" stroke-width="2"/>
      <text x="390" y="125" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#dcf2d2">服务员 1</text>
      <rect x="330" y="160" width="120" height="46" rx="10" fill="#2c4f2a" stroke="#68a357" stroke-width="2"/>
      <text x="390" y="189" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#dcf2d2">服务员 2</text>
      <rect x="330" y="224" width="120" height="46" rx="10" fill="#2c4f2a" stroke="#68a357" stroke-width="2"/>
      <text x="390" y="253" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#dcf2d2">…… 共 30 名</text>
    </g>
    <path d="M265 210 L325 210" stroke="#b8e6a8" stroke-width="5" stroke-linecap="round"/>
    <path d="M313 196 L330 210 L313 224 Z" fill="#b8e6a8"/>
    <rect x="30" y="366" width="430" height="52" rx="10" fill="#24391f"/>
    <text x="245" y="399" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#b8e6a8">30 个真实连接服务 1000 个客人，轮流上桌</text>
  </g>
</svg>
