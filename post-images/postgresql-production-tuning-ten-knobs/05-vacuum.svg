<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg6)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">表膨胀：衣柜里「扔了但没清走」的旧衣服</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">PG 的 DELETE / UPDATE 不会立刻腾地方，旧版本留在原地等保洁（autovacuum）</text>

  <!-- 衣柜 -->
  <g transform="translate(70,160)">
    <rect x="0" y="0" width="420" height="380" rx="16" fill="#331b24" stroke="#c05b7c" stroke-width="4"/>
    <rect x="0" y="0" width="420" height="54" rx="16" fill="#9c3d5f"/>
    <text x="210" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">一张频繁更新的表 = 衣柜</text>
    <!-- 衣服：有效数据 -->
    <g>
      <rect x="40" y="86" width="90" height="60" rx="8" fill="#2f6db3"/>
      <text x="85" y="123" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffffff">有效行</text>
      <rect x="150" y="86" width="90" height="60" rx="8" fill="#2f6db3"/>
      <text x="195" y="123" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffffff">有效行</text>
    </g>
    <!-- 死元组 -->
    <g>
      <rect x="250" y="86" width="110" height="60" rx="8" fill="#6e2a41"/>
      <text x="305" y="112" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffb3c2">死元组</text>
      <text x="305" y="136" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#e08aa3">旧版本行</text>
      <rect x="40" y="166" width="110" height="60" rx="8" fill="#6e2a41"/>
      <text x="95" y="192" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffb3c2">死元组</text>
      <text x="95" y="216" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#e08aa3">已删/旧版本</text>
      <rect x="170" y="166" width="110" height="60" rx="8" fill="#6e2a41"/>
      <text x="225" y="192" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#ffb3c2">死元组</text>
      <text x="225" y="216" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#e08aa3">占着挂杆</text>
    </g>
    <text x="210" y="280" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" fill="#ffb3c2">表文件越来越大，查询越来越慢</text>
    <text x="210" y="320" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#f5d7e2">默认规矩：死元组超过 20% 才叫保洁</text>
    <text x="210" y="356" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#ffd9a0">100GB 大表 = 攒 20GB 垃圾才打扫！</text>
  </g>

  <!-- 保洁 -->
  <g transform="translate(540,160)">
    <rect x="0" y="0" width="600" height="380" rx="16" fill="#16283f" stroke="#4a90d9" stroke-width="4"/>
    <rect x="0" y="0" width="600" height="54" rx="16" fill="#2f6db3"/>
    <text x="300" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">autovacuum = 自动上门的保洁阿姨</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="36" y="100" font-size="21" fill="#d6e9ff">触发线 = 50 行 + 表行数 × scale_factor</text>
      <text x="36" y="140" font-size="21" fill="#d6e9ff">默认 <tspan font-weight="bold" fill="#ffd9a0">0.2（20%）</tspan>：小表勤、大表懒 —— 反了</text>
      <text x="36" y="196" font-size="23" font-weight="bold" fill="#9fd0ff">autovacuum_vacuum_scale_factor = 0.05</text>
      <text x="36" y="240" font-size="20" fill="#d6e9ff">大表降到 5% 就打扫；超大表可单表设置：</text>
      <rect x="36" y="262" width="528" height="74" rx="8" fill="#0d1117"/>
      <text x="52" y="290" font-size="18" fill="#7ee787" font-family="Menlo, monospace">ALTER TABLE 大表名 SET</text>
      <text x="52" y="318" font-size="18" fill="#7ee787" font-family="Menlo, monospace">  (autovacuum_vacuum_scale_factor = 0.01);</text>
      <text x="36" y="348" font-size="20" fill="#d6e9ff">再盯一眼 pg_stat_user_tables 的 n_dead_tup 即可</text>
    </g>
  </g>
</svg>
