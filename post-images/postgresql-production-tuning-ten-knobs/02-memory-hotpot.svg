<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">内存四件套 = 火锅店的四个面积问题</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">以一台 16GB 的专用数据库服务器为例</text>

  <!-- shared_buffers -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#16283f" stroke="#4a90d9" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#2f6db3"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">shared_buffers = 大堂公共保温台</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="20" fill="#d6e9ff">全店共用的热菜区，热门菜（热数据）放这里</text>
      <text x="30" y="126" font-size="20" fill="#d6e9ff">台面越大，服务员跑后厨（读磁盘）越少</text>
      <text x="30" y="166" font-size="21" font-weight="bold" fill="#9fd0ff">默认 128MB → 建议物理内存的 25%</text>
      <text x="30" y="202" font-size="19" fill="#ffd9a0">16GB 机器：先给 4GB，超过 40% 收益递减</text>
    </g>
  </g>

  <!-- work_mem -->
  <g transform="translate(620,150)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#1f2a1a" stroke="#68a357" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#4a7c3a"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">work_mem = 每桌的小料台</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="20" fill="#dcf2d2">排序、哈希的临时操作台，<tspan font-weight="bold">每个连接每步操作各一份</tspan></text>
      <text x="30" y="126" font-size="20" fill="#dcf2d2">台面太小，菜只能放地上（排序溢出到磁盘）</text>
      <text x="30" y="166" font-size="21" font-weight="bold" fill="#b8e6a8">默认 4MB → 16~64MB 起步</text>
      <text x="30" y="202" font-size="19" fill="#ffd9a0">陷阱：100 连接 × 多步排序，会乘法级吃内存</text>
    </g>
  </g>

  <!-- effective_cache_size -->
  <g transform="translate(70,400)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#2d2438" stroke="#9a7bd0" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#6d4fa1"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">effective_cache_size = 告诉领班仓库多大</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="20" fill="#e4d9f5">不占一平米面积，只是一句「口供」</text>
      <text x="30" y="126" font-size="20" fill="#e4d9f5">优化器据此判断：走索引还是全表扫更划算</text>
      <text x="30" y="166" font-size="21" font-weight="bold" fill="#cdb4ec">默认 4GB → 建议物理内存的 50%~75%</text>
      <text x="30" y="202" font-size="19" fill="#ffd9a0">报小了，优化器不敢用索引，白白全表扫描</text>
    </g>
  </g>

  <!-- maintenance_work_mem -->
  <g transform="translate(620,400)">
    <rect x="0" y="0" width="510" height="225" rx="16" fill="#3a2c17" stroke="#d98e32" stroke-width="4"/>
    <rect x="0" y="0" width="510" height="54" rx="16" fill="#b06f1d"/>
    <text x="255" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="bold" fill="#ffffff">maintenance_work_mem = 打烊后大扫除</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <text x="30" y="92" font-size="20" fill="#f0dcbb">VACUUM、建索引、改表结构的施工面积</text>
      <text x="30" y="126" font-size="20" fill="#f0dcbb">不影响营业（日常查询），尽管给大一点</text>
      <text x="30" y="166" font-size="21" font-weight="bold" fill="#ffd9a0">默认 64MB → 512MB~2GB</text>
      <text x="30" y="202" font-size="19" fill="#ffd9a0">大表建索引提速最明显的一项</text>
    </g>
  </g>
</svg>
