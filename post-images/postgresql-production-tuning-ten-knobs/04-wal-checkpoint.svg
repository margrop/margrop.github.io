<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">WAL 与 checkpoint：收银小票和打烊盘点</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">先记小票（快），后抄账本（慢）—— 盘点太频繁，高峰期就会一卡一卡</text>

  <!-- 收银台 -->
  <g transform="translate(70,160)">
    <rect x="0" y="0" width="330" height="180" rx="14" fill="#16283f" stroke="#4a90d9" stroke-width="3"/>
    <text x="165" y="44" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#9fd0ff">每笔交易先记小票</text>
    <text x="165" y="86" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#d6e9ff">WAL 顺序写，磁盘最擅长</text>
    <text x="165" y="126" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#d6e9ff">掉电也不丢账，靠它恢复</text>
    <text x="165" y="162" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#7ee787">wal_compression = on：小票压缩省纸</text>
  </g>
  <g transform="translate(415,225)">
    <path d="M0 25 L90 25" stroke="#ffcc4d" stroke-width="8" stroke-linecap="round"/>
    <path d="M74 5 L110 25 L74 45 Z" fill="#ffcc4d"/>
    <text x="55" y="-12" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#ffcc4d">攒一批</text>
  </g>

  <!-- 盘点 -->
  <g transform="translate(540,160)">
    <rect x="0" y="0" width="330" height="180" rx="14" fill="#3a2c17" stroke="#d98e32" stroke-width="3"/>
    <text x="165" y="44" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#ffd9a0">定期把小票抄进账本</text>
    <text x="165" y="86" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#f0dcbb">checkpoint：集中、随机写</text>
    <text x="165" y="126" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#f0dcbb">像盘点：摊开来全店都慢</text>
    <text x="165" y="162" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#ffd9a0">默认每 5 分钟或攒满 1GB 就盘一次</text>
  </g>
  <g transform="translate(885,225)">
    <path d="M0 25 L90 25" stroke="#ffcc4d" stroke-width="8" stroke-linecap="round"/>
    <path d="M74 5 L110 25 L74 45 Z" fill="#ffcc4d"/>
  </g>

  <!-- 结果 -->
  <g transform="translate(990,160)">
    <rect x="0" y="0" width="150" height="180" rx="14" fill="#1f2a1a" stroke="#68a357" stroke-width="3"/>
    <text x="75" y="50" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="bold" fill="#b8e6a8">账实相符</text>
    <text x="75" y="92" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#dcf2d2">数据页</text>
    <text x="75" y="124" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#dcf2d2">落盘</text>
  </g>

  <!-- 下方建议 -->
  <g transform="translate(70,400)">
    <rect x="0" y="0" width="1070" height="210" rx="16" fill="#101828" stroke="#3d5a80" stroke-width="3"/>
    <text x="535" y="50" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">写多的库，把「盘点间隔」拉长</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#d6e9ff">
      <text x="60" y="102">• max_wal_size：1GB → 4GB+，小票多攒一点再盘</text>
      <text x="60" y="146">• checkpoint_timeout：5min → 15~30min，盘点别太勤</text>
      <text x="60" y="190">• wal_compression：on，小票压缩，写盘量立减（CPU 几乎无感）</text>
    </g>
    <text x="680" y="146" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#ffd9a0">代价：崩溃恢复多翻几页小票（多几秒~几十秒）</text>
  </g>
</svg>
