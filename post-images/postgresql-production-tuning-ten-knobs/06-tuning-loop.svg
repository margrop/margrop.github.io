<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg7)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">安全调参闭环：像试水温一样调数据库</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">每次只拧一个旋钮，量过水温再拧下一个 —— 任何一步不对就退回</text>

  <!-- 四步循环 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <!-- 步骤1 -->
    <g transform="translate(80,200)">
      <rect x="0" y="0" width="230" height="230" rx="16" fill="#16283f" stroke="#4a90d9" stroke-width="4"/>
      <circle cx="115" cy="52" r="30" fill="#2f6db3"/>
      <text x="115" y="63" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">1</text>
      <text x="115" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#9fd0ff">先测基线</text>
      <text x="115" y="158" text-anchor="middle" font-size="18" fill="#d6e9ff">pgbench 跑一遍</text>
      <text x="115" y="186" text-anchor="middle" font-size="18" fill="#d6e9ff">记下 TPS 和延迟</text>
    </g>
    <!-- 步骤2 -->
    <g transform="translate(370,200)">
      <rect x="0" y="0" width="230" height="230" rx="16" fill="#1f2a1a" stroke="#68a357" stroke-width="4"/>
      <circle cx="115" cy="52" r="30" fill="#4a7c3a"/>
      <text x="115" y="63" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">2</text>
      <text x="115" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#b8e6a8">只改一个</text>
      <text x="115" y="158" text-anchor="middle" font-size="18" fill="#dcf2d2">ALTER SYSTEM 改一项</text>
      <text x="115" y="186" text-anchor="middle" font-size="18" fill="#dcf2d2">改完写进变更记录</text>
    </g>
    <!-- 步骤3 -->
    <g transform="translate(660,200)">
      <rect x="0" y="0" width="230" height="230" rx="16" fill="#3a2c17" stroke="#d98e32" stroke-width="4"/>
      <circle cx="115" cy="52" r="30" fill="#b06f1d"/>
      <text x="115" y="63" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">3</text>
      <text x="115" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffd9a0">再测验证</text>
      <text x="115" y="158" text-anchor="middle" font-size="18" fill="#f0dcbb">同样负载再跑一遍</text>
      <text x="115" y="186" text-anchor="middle" font-size="18" fill="#f0dcbb">对比基线，量化收益</text>
    </g>
    <!-- 步骤4 -->
    <g transform="translate(950,200)">
      <rect x="0" y="0" width="230" height="230" rx="16" fill="#331b24" stroke="#c05b7c" stroke-width="4"/>
      <circle cx="115" cy="52" r="30" fill="#9c3d5f"/>
      <text x="115" y="63" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">4</text>
      <text x="115" y="120" text-anchor="middle" font-size="24" font-weight="bold" fill="#f3b8cc">留好退路</text>
      <text x="115" y="158" text-anchor="middle" font-size="18" fill="#f5d7e2">ALTER SYSTEM RESET</text>
      <text x="115" y="186" text-anchor="middle" font-size="18" fill="#f5d7e2">一条命令回到从前</text>
    </g>
    <!-- 箭头 -->
    <g stroke="#ffcc4d" stroke-width="7" stroke-linecap="round" fill="#ffcc4d">
      <path d="M318 315 L362 315"/><path d="M348 297 L368 315 L348 333 Z" stroke="none"/>
      <path d="M608 315 L652 315"/><path d="M638 297 L658 315 L638 333 Z" stroke="none"/>
      <path d="M898 315 L942 315"/><path d="M928 297 L948 315 L928 333 Z" stroke="none"/>
    </g>
  </g>

  <!-- 底部口诀 -->
  <g transform="translate(180,480)">
    <rect x="0" y="0" width="840" height="120" rx="16" fill="#101828" stroke="#3d5a80" stroke-width="3"/>
    <text x="420" y="52" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">口诀：先量体温，再吃药；一次只吃一种</text>
    <text x="420" y="94" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#98a2b3">五个一起改，出问题了你永远不知道是谁的锅</text>
  </g>
</svg>
