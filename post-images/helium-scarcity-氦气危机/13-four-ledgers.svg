<g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="790" rx="0" fill="#101e32" stroke="none" stroke-width="2"/>
<text x="55" y="62" font-size="36" fill="#f3f7fa" font-weight="700" text-anchor="start">看到“氦不够用”，先问是在说哪本账</text><text x="55" y="102" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">FOUR DIFFERENT QUESTIONS · Four different measures</text><rect x="60" y="155" width="510" height="225" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="88" y="212" font-size="34" fill="#72dfd0" font-weight="700" text-anchor="start">01</text><text x="153" y="210" font-size="31" fill="#f3f7fa" font-weight="700" text-anchor="start">元素总量</text><text x="154" y="249" font-size="25" fill="#adbed0" font-weight="400" text-anchor="start">Total atoms</text><text x="88" y="306" font-size="28" fill="#f3f7fa" font-weight="400" text-anchor="start">有没有生成或逃逸？</text><text x="88" y="348" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">Are atoms formed or escaping?</text><rect x="630" y="155" width="510" height="225" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="658" y="212" font-size="34" fill="#ffd185" font-weight="700" text-anchor="start">02</text><text x="723" y="210" font-size="31" fill="#f3f7fa" font-weight="700" text-anchor="start">可采储量</text><text x="724" y="249" font-size="25" fill="#adbed0" font-weight="400" text-anchor="start">Economic reserves</text><text x="658" y="306" font-size="28" fill="#f3f7fa" font-weight="400" text-anchor="start">已知条件下能采多少？</text><text x="658" y="348" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">How much is economic to recover?</text><rect x="60" y="435" width="510" height="225" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="88" y="492" font-size="34" fill="#ff9a8b" font-weight="700" text-anchor="start">03</text><text x="153" y="490" font-size="31" fill="#f3f7fa" font-weight="700" text-anchor="start">年度产能</text><text x="154" y="529" font-size="25" fill="#adbed0" font-weight="400" text-anchor="start">Annual production capacity</text><text x="88" y="586" font-size="28" fill="#f3f7fa" font-weight="400" text-anchor="start">工厂一年能处理多少？</text><text x="88" y="628" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">What can plants process each year?</text><rect x="630" y="435" width="510" height="225" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="658" y="492" font-size="34" fill="#72dfd0" font-weight="700" text-anchor="start">04</text><text x="723" y="490" font-size="31" fill="#f3f7fa" font-weight="700" text-anchor="start">可交付供应</text><text x="724" y="529" font-size="25" fill="#adbed0" font-weight="400" text-anchor="start">Deliverable supply</text><text x="658" y="586" font-size="28" fill="#f3f7fa" font-weight="400" text-anchor="start">需要时能送到哪里？</text><text x="658" y="628" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">What reaches the user on time?</text><path d="M55 725 L1145 725" stroke="#355069" stroke-width="1" fill="none"/><text x="55" y="762" font-size="20" fill="#adbed0" font-weight="400" text-anchor="start">原创科学示意 / Original science illustration · Margrop</text></g></svg>