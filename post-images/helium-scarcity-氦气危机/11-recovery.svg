<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">最实在的“新氦矿”，可能是回收管道</title><desc id="desc">CLOSE THE LOOP BEFORE HELIUM DISPERSES INTO THE AIR. Original educational illustration by Margrop; schematic, not to scale.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#72dfd0"/></marker>
<linearGradient id="planet" x2="1" y2="1"><stop stop-color="#294f70"/><stop offset="1" stop-color="#102539"/></linearGradient>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101e32"/><stop offset="1" stop-color="#1e3e55"/></linearGradient></defs>
<g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#101e32" stroke="none" stroke-width="2"/>
<text x="55" y="62" font-size="36" fill="#f3f7fa" font-weight="700" text-anchor="start">最实在的“新氦矿”，可能是回收管道</text><text x="55" y="102" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">CLOSE THE LOOP BEFORE HELIUM DISPERSES INTO THE AIR</text><rect x="70" y="180" width="470" height="130" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="100" y="233" font-size="32" fill="#f3f7fa" font-weight="700" text-anchor="start">低温设备</text><text x="100" y="277" font-size="27" fill="#adbed0" font-weight="400" text-anchor="start">Cryogenic equipment</text><rect x="650" y="180" width="470" height="130" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="680" y="233" font-size="32" fill="#f3f7fa" font-weight="700" text-anchor="start">收集蒸发气</text><text x="680" y="277" font-size="27" fill="#adbed0" font-weight="400" text-anchor="start">Capture boil-off</text><rect x="650" y="420" width="470" height="130" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="680" y="473" font-size="32" fill="#f3f7fa" font-weight="700" text-anchor="start">压缩与净化</text><text x="680" y="517" font-size="27" fill="#adbed0" font-weight="400" text-anchor="start">Compress &amp; purify</text><rect x="70" y="420" width="470" height="130" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="100" y="473" font-size="32" fill="#f3f7fa" font-weight="700" text-anchor="start">重新液化</text><text x="100" y="517" font-size="27" fill="#adbed0" font-weight="400" text-anchor="start">Re-liquefy</text><path d="M551 245 L637 245" stroke="#72dfd0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M885 322 L885 407" stroke="#72dfd0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M638 485 L552 485" stroke="#72dfd0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M306 408 L306 324" stroke="#72dfd0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="530" y="372" font-size="45" fill="#ffd185" font-weight="700" text-anchor="start">He</text><text x="85" y="632" font-size="30" fill="#ffd185" font-weight="700" text-anchor="start">减少损失 ≠ 零成本，也不等于永远不漏。</text><text x="85" y="677" font-size="25" fill="#adbed0" font-weight="400" text-anchor="start">Less loss still requires energy, maintenance and make-up supply.</text><path d="M55 715 L1145 715" stroke="#355069" stroke-width="1" fill="none"/><text x="55" y="752" font-size="20" fill="#adbed0" font-weight="400" text-anchor="start">原创科学示意 / Original science illustration · Margrop</text></g></svg>