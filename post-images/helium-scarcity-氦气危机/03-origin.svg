<linearGradient id="planet" x2="1" y2="1"><stop stop-color="#294f70"/><stop offset="1" stop-color="#102539"/></linearGradient>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101e32"/><stop offset="1" stop-color="#1e3e55"/></linearGradient></defs>
<g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#101e32" stroke="none" stroke-width="2"/>
<text x="55" y="62" font-size="36" fill="#f3f7fa" font-weight="700" text-anchor="start">地球还在“造氦”，只是造得很慢</text><text x="55" y="102" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">RADIOACTIVE DECAY → MIGRATION → GEOLOGICAL TRAP</text><rect x="55" y="150" width="1090" height="95" rx="18" fill="#25374a" stroke="none" stroke-width="2"/><text x="85" y="190" font-size="25" fill="#f3f7fa" font-weight="400" text-anchor="start">地表 / Surface</text><text x="650" y="210" font-size="24" fill="#72dfd0" font-weight="400" text-anchor="start">气体缓慢迁移 / Slow migration</text><path d="M55 340 Q300 240 570 330 T1145 340 L1145 405 Q850 310 580 405 T55 415 Z" fill="#75664f"/><text x="680" y="351" font-size="26" fill="#ffd185" font-weight="700" text-anchor="start">封闭盖层 / Cap rock</text><path d="M560 430 Q800 318 1115 431 Q790 532 560 430" fill="#315c70"/><circle cx="650" cy="438" r="10" fill="#ffd185" stroke="none" stroke-width="2"/><circle cx="727" cy="447" r="10" fill="#ffd185" stroke="none" stroke-width="2"/><circle cx="804" cy="439" r="10" fill="#ffd185" stroke="none" stroke-width="2"/><circle cx="881" cy="448" r="10" fill="#ffd185" stroke="none" stroke-width="2"/><circle cx="958" cy="440" r="10" fill="#ffd185" stroke="none" stroke-width="2"/><circle cx="1035" cy="449" r="10" fill="#ffd185" stroke="none" stroke-width="2"/><text x="670" y="510" font-size="27" fill="#f3f7fa" font-weight="400" text-anchor="start">富集气藏 / Gas reservoir</text><text x="664" y="547" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">并非每处岩石都能形成矿藏</text><rect x="75" y="400" width="407" height="200" rx="18" fill="#1a3049" stroke="none" stroke-width="2"/><text x="98" y="443" font-size="29" fill="#ffd185" font-weight="700" text-anchor="start">铀 / 钍衰变链</text><text x="98" y="483" font-size="21" fill="#adbed0" font-weight="400" text-anchor="start">Uranium / thorium decay chains</text><text x="98" y="532" font-size="27" fill="#f3f7fa" font-weight="400" text-anchor="start">α 粒子 = 氦-4 原子核</text><text x="98" y="574" font-size="24" fill="#72dfd0" font-weight="400" text-anchor="start">再获得电子 → 中性氦原子</text><path d="M483 520 Q540 521 574 456" stroke="#72dfd0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="75" y="649" font-size="27" fill="#f3f7fa" font-weight="700" text-anchor="start">会生成 ≠ 能快速补库存 / New atoms do not mean rapid replenishment</text><path d="M55 695 L1145 695" stroke="#355069" stroke-width="1" fill="none"/><text x="55" y="732" font-size="20" fill="#adbed0" font-weight="400" text-anchor="start">原创科学示意 / Original science illustration · Margrop</text></g></svg>