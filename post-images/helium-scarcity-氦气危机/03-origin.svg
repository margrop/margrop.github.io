<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">地球还在“造氦”，只是造得很慢</title><desc id="desc">RADIOACTIVE DECAY → MIGRATION → GEOLOGICAL TRAP. Original educational illustration by Margrop; schematic, not to scale.</desc>
