<text x="55" y="62" font-size="36" fill="#f3f7fa" font-weight="700" text-anchor="start">“都很冷”，不代表可以互相替代</text><text x="55" y="102" font-size="23" fill="#adbed0" font-weight="400" text-anchor="start">TEMPERATURE LANDMARKS · Schematic positions, not a linear scale</text><path d="M218 165 L218 626" stroke="#4b677f" stroke-width="14" fill="none"/><circle cx="218" cy="177" r="13" fill="#adbed0" stroke="none" stroke-width="2"/><text x="55" y="187" font-size="28" fill="#adbed0" font-weight="700" text-anchor="start">273.15 K</text><path d="M245 177 L1080 177" stroke="#344c64" stroke-width="2" fill="none"/><text x="282" y="164" font-size="28" fill="#f3f7fa" font-weight="600" text-anchor="start">水结冰 / Water freezes</text><text x="282" y="206" font-size="24" fill="#adbed0" font-weight="400" text-anchor="start">0°C</text><circle cx="218" cy="275" r="13" fill="#adbed0" stroke="none" stroke-width="2"/><text x="55" y="285" font-size="33" fill="#adbed0" font-weight="700" text-anchor="start">77 K</text><path d="M245 275 L1080 275" stroke="#344c64" stroke-width="2" fill="none"/><text x="282" y="262" font-size="28" fill="#f3f7fa" font-weight="600" text-anchor="start">液氮沸点 / Nitrogen boils</text><text x="282" y="304" font-size="24" fill="#adbed0" font-weight="400" text-anchor="start">≈ −196°C</text><circle cx="218" cy="389" r="13" fill="#72dfd0" stroke="none" stroke-width="2"/><text x="55" y="399" font-size="33" fill="#72dfd0" font-weight="700" text-anchor="start">4.2 K</text><path d="M245 389 L1080 389" stroke="#344c64" stroke-width="2" fill="none"/><text x="282" y="376" font-size="28" fill="#f3f7fa" font-weight="600" text-anchor="start">液氦沸点 / Helium-4 boils</text><text x="282" y="418" font-size="24" fill="#72dfd0" font-weight="400" text-anchor="start">≈ −269°C</text><circle cx="218" cy="505" r="13" fill="#ffd185" stroke="none" stroke-width="2"/><text x="55" y="515" font-size="33" fill="#ffd185" font-weight="700" text-anchor="start">1.9 K</text><path d="M245 505 L1080 505" stroke="#344c64" stroke-width="2" fill="none"/><text x="282" y="492" font-size="28" fill="#f3f7fa" font-weight="600" text-anchor="start">LHC 主磁体 / LHC main magnets</text><text x="282" y="534" font-size="24" fill="#ffd185" font-weight="400" text-anchor="start">≈ −271.3°C</text><circle cx="218" cy="621" r="13" fill="#ff9a8b" stroke="none" stroke-width="2"/><text x="55" y="631" font-size="33" fill="#ff9a8b" font-weight="700" text-anchor="start">0 K</text><path d="M245 621 L1080 621" stroke="#344c64" stroke-width="2" fill="none"/><text x="282" y="608" font-size="28" fill="#f3f7fa" font-weight="600" text-anchor="start">绝对零度 / Absolute zero</text><text x="282" y="650" font-size="24" fill="#ff9a8b" font-weight="400" text-anchor="start">−273.15°C</text><text x="70" y="697" font-size="24" fill="#adbed0" font-weight="400" text-anchor="start">常压沸点；LHC 依靠低压与制冷系统达到更低温度。</text><path d="M55 715 L1145 715" stroke="#355069" stroke-width="1" fill="none"/><text x="55" y="752" font-size="20" fill="#adbed0" font-weight="400" text-anchor="start">原创科学示意 / Original science illustration · Margrop</text></g></svg>