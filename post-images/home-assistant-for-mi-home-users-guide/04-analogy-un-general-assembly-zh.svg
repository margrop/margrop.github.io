<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="小学生秒懂的智能家居联合国大会大比方">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">ELEMENTARY ANALOGY × UN GENERAL ASSEMBLY ARCHITECTURE</text>
<text x="64" y="150" font-size="36" fill="#0f172a" font-weight="600">小学生秒懂的大比方：智能家居的“联合国大会”</text>
<text x="64" y="200" font-size="22" fill="#475569">各品牌如同来自不同国家的代表，HA 是联合国大厦，集成（Integration）是同声传译官</text>

<!-- Box 1: Brand Dialects -->
<rect x="64" y="240" width="300" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="94" y="265" width="110" height="36" rx="8" fill="#f1f5f9"/>
<text x="106" y="289" font-size="15" fill="#0f172a" font-weight="700">各国方言</text>
<text x="94" y="335" font-size="20" fill="#0f172a" font-weight="700">各厂商私有协议</text>

<rect x="84" y="370" width="260" height="75" rx="10" fill="#fef3c7"/>
<text x="100" y="400" font-size="16" fill="#d97706" font-weight="700">小米米家 (Xiaomi)</text>
<text x="100" y="425" font-size="13" fill="#475569">讲“Miot 规范语”</text>

<rect x="84" y="460" width="260" height="75" rx="10" fill="#e0f2fe"/>
<text x="100" y="490" font-size="16" fill="#0284c7" font-weight="700">美的美居 (Midea)</text>
<text x="100" y="515" font-size="13" fill="#475569">讲“MSmart 加密语”</text>

<rect x="84" y="550" width="260" height="75" rx="10" fill="#ede9fe"/>
<text x="100" y="580" font-size="16" fill="#7c3aed" font-weight="700">飞利浦/涂鸦/绿米</text>
<text x="100" y="605" font-size="13" fill="#475569">讲“Zigbee / Tuya 协议”</text>

<rect x="84" y="640" width="260" height="75" rx="10" fill="#f1f5f9"/>
<text x="100" y="670" font-size="16" fill="#0f172a" font-weight="700">苹果 HomeKit</text>
<text x="100" y="695" font-size="13" fill="#475569">讲“HAP 闭门语”</text>

<!-- Arrow 1 -->
<path d="M374 495 L416 495" stroke="#0284c7" stroke-width="4" stroke-dasharray="6 4"/>
<polygon points="416,490 428,495 416,500" fill="#0284c7"/>

<!-- Box 2: Translators -->
<rect x="438" y="240" width="300" height="520" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
<rect x="468" y="265" width="130" height="36" rx="8" fill="#e0f2fe"/>
<text x="480" y="289" font-size="15" fill="#0284c7" font-weight="700">同声传译官</text>
<text x="468" y="335" font-size="20" fill="#0f172a" font-weight="700">集成 (Integration)</text>

<rect x="458" y="370" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="400" font-size="15" fill="#0f172a" font-weight="600">Xiaomi Miot 翻译官</text>
<text x="474" y="425" font-size="13" fill="#475569">将小米指令秒译为标准开关</text>

<rect x="458" y="460" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="490" font-size="15" fill="#0f172a" font-weight="600">Midea AC LAN 翻译官</text>
<text x="474" y="515" font-size="13" fill="#475569">将美的局域网报文秒译为温控</text>

<rect x="458" y="550" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="580" font-size="15" fill="#0f172a" font-weight="600">Zigbee2MQTT 翻译官</text>
<text x="474" y="605" font-size="13" fill="#475569">将无线射频报文秒译为数值</text>

<rect x="458" y="640" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="670" font-size="15" fill="#0f172a" font-weight="600">HomeKit Bridge 翻译官</text>
<text x="474" y="695" font-size="13" fill="#475569">把全屋实体打包成苹果懂的语言</text>

<!-- Arrow 2 -->
<path d="M748 495 L790 495" stroke="#059669" stroke-width="4" stroke-dasharray="6 4"/>
<polygon points="790,490 802,495 790,500" fill="#059669"/>

<!-- Box 3: Universal State Machine -->
<rect x="812" y="240" width="564" height="520" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<rect x="842" y="265" width="150" height="36" rx="8" fill="#d1fae5"/>
<text x="854" y="289" font-size="15" fill="#059669" font-weight="700">联合国大会总厅</text>
<text x="842" y="335" font-size="20" fill="#0f172a" font-weight="700">Home Assistant 核心状态机 (Core)</text>

<rect x="832" y="370" width="524" height="165" rx="12" fill="#d1fae5"/>
<text x="852" y="405" font-size="16" fill="#059669" font-weight="700">统一宇宙通用乐高积木 (Standard Entities)</text>
<text x="852" y="440" font-size="14" fill="#0f172a">・switch.xxx（开关）：只认开与关，不管你是小米还是美的</text>
<text x="852" y="470" font-size="14" fill="#0f172a">・climate.xxx（温控）：统一调温度、制冷制热与风速</text>
<text x="852" y="500" font-size="14" fill="#0f172a">・binary_sensor.xxx（二值感应）：统一代表人来/人走、门开/门关</text>

<rect x="832" y="555" width="524" height="165" rx="12" fill="#f1f5f9"/>
<text x="852" y="590" font-size="16" fill="#0f172a" font-weight="700">向下驱动两大超级能力：</text>
<text x="852" y="625" font-size="14" fill="#0284c7" font-weight="600">1. 无限自动化引擎：</text>
<text x="990" y="625" font-size="14" fill="#475569">米家门磁开 + 美的空调关 + 易来灯亮</text>
<text x="852" y="665" font-size="14" fill="#7c3aed" font-weight="600">2. 全生态控制出口：</text>
<text x="990" y="665" font-size="14" fill="#475569">Siri 语音、现代 Lovelace 网页、桌面触控屏</text>
</svg>