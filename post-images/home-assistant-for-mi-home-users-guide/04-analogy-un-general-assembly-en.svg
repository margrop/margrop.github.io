<text x="106" y="289" font-size="14" fill="#0f172a" font-weight="700">Foreign Dialects</text>
<text x="94" y="335" font-size="19" fill="#0f172a" font-weight="700">Proprietary Protocols</text>

<rect x="84" y="370" width="260" height="75" rx="10" fill="#fef3c7"/>
<text x="100" y="400" font-size="15" fill="#d97706" font-weight="700">Xiaomi / Mi Home</text>
<text x="100" y="425" font-size="13" fill="#475569">Speaks "Miot dialect"</text>

<rect x="84" y="460" width="260" height="75" rx="10" fill="#e0f2fe"/>
<text x="100" y="490" font-size="15" fill="#0284c7" font-weight="700">Midea Smart Life</text>
<text x="100" y="515" font-size="13" fill="#475569">Speaks "MSmart encrypted"</text>

<rect x="84" y="550" width="260" height="75" rx="10" fill="#ede9fe"/>
<text x="100" y="580" font-size="15" fill="#7c3aed" font-weight="700">Philips / Tuya / Aqara</text>
<text x="100" y="605" font-size="13" fill="#475569">Speaks "Zigbee / Tuya"</text>

<rect x="84" y="640" width="260" height="75" rx="10" fill="#f1f5f9"/>
<text x="100" y="670" font-size="15" fill="#0f172a" font-weight="700">Apple HomeKit</text>
<text x="100" y="695" font-size="13" fill="#475569">Speaks "HAP closed protocol"</text>

<!-- Arrow 1 -->
<path d="M374 495 L416 495" stroke="#0284c7" stroke-width="4" stroke-dasharray="6 4"/>
<polygon points="416,490 428,495 416,500" fill="#0284c7"/>

<!-- Box 2: Translators -->
<rect x="438" y="240" width="300" height="520" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
<rect x="468" y="265" width="140" height="36" rx="8" fill="#e0f2fe"/>
<text x="480" y="289" font-size="14" fill="#0284c7" font-weight="700">Expert Translators</text>
<text x="468" y="335" font-size="19" fill="#0f172a" font-weight="700">Integrations</text>

<rect x="458" y="370" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="400" font-size="14" fill="#0f172a" font-weight="600">Xiaomi Miot Translator</text>
<text x="474" y="425" font-size="13" fill="#475569">Decodes Xiaomi commands to switches</text>

<rect x="458" y="460" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="490" font-size="14" fill="#0f172a" font-weight="600">Midea AC LAN Translator</text>
<text x="474" y="515" font-size="13" fill="#475569">Decodes local LAN packets to climate</text>

<rect x="458" y="550" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="580" font-size="14" fill="#0f172a" font-weight="600">Zigbee2MQTT Translator</text>
<text x="474" y="605" font-size="13" fill="#475569">Decodes RF sensors to standard events</text>

<rect x="458" y="640" width="260" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="474" y="670" font-size="14" fill="#0f172a" font-weight="600">HomeKit Bridge Translator</text>
<text x="474" y="695" font-size="13" fill="#475569">Presents all entities as native Apple gear</text>

<!-- Arrow 2 -->
<path d="M748 495 L790 495" stroke="#059669" stroke-width="4" stroke-dasharray="6 4"/>
<polygon points="790,490 802,495 790,500" fill="#059669"/>

<!-- Box 3: Universal State Machine -->
<rect x="812" y="240" width="564" height="520" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<rect x="842" y="265" width="160" height="36" rx="8" fill="#d1fae5"/>
<text x="854" y="289" font-size="14" fill="#059669" font-weight="700">UN Assembly Hall</text>
<text x="842" y="335" font-size="19" fill="#0f172a" font-weight="700">Home Assistant Core State Machine</text>

<rect x="832" y="370" width="524" height="165" rx="12" fill="#d1fae5"/>
<text x="852" y="405" font-size="16" fill="#059669" font-weight="700">Universal Lego Blocks (Standard Entities)</text>
<text x="852" y="440" font-size="14" fill="#0f172a">• switch.xxx: Simple ON/OFF state, regardless of vendor brand</text>
<text x="852" y="470" font-size="14" fill="#0f172a">• climate.xxx: Universal HVAC controls: temp, cooling, fan mode</text>
<text x="852" y="500" font-size="14" fill="#0f172a">• binary_sensor.xxx: Unified presence, motion, and door contact states</text>

<rect x="832" y="555" width="524" height="165" rx="12" fill="#f1f5f9"/>
<text x="852" y="590" font-size="16" fill="#0f172a" font-weight="700">Empowering 2 Superpowers Downstream:</text>
<text x="852" y="625" font-size="14" fill="#0284c7" font-weight="600">1. Unlimited Automation Engine:</text>
<text x="1080" y="625" font-size="14" fill="#475569">Xiaomi door opens -&gt; Midea AC starts</text>
<text x="852" y="665" font-size="14" fill="#7c3aed" font-weight="600">2. Any Control Surface:</text>
<text x="1080" y="665" font-size="14" fill="#475569">Native Siri, 3D Lovelace, Touch Panels</text>
</svg>