<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="UN General Assembly Analogy for Smart Home">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">ELEMENTARY ANALOGY × UN GENERAL ASSEMBLY ARCHITECTURE</text>
<text x="64" y="150" font-size="34" fill="#0f172a" font-weight="600">The Elementary Analogy: The "UN General Assembly" of Smart Home</text>
<text x="64" y="200" font-size="21" fill="#475569">Vendors are nation delegates, HA is the UN Palace, and Integrations are simultaneous translators</text>

