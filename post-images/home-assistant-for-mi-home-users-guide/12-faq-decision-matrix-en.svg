<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Vendor App vs Home Assistant Comprehensive Decision Matrix">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">COMPREHENSIVE DECISION MATRIX × FAQ BENCHMARK</text>
<text x="64" y="150" font-size="34" fill="#0f172a" font-weight="600">The Ultimate Showdown: Single-Brand App vs Home Assistant Hub</text>
<text x="64" y="200" font-size="21" fill="#475569">An in-depth decision guide covering control, cross-brand automation, resilience, and maintenance</text>

<rect x="64" y="240" width="1312" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

<rect x="64" y="240" width="1312" height="60" rx="16" fill="#f1f5f9"/>
<rect x="64" y="280" width="1312" height="20" fill="#f1f5f9"/>
<text x="94" y="278" font-size="15" fill="#0f172a" font-weight="700">Evaluation Dimension</text>
<text x="420" y="278" font-size="15" fill="#dc2626" font-weight="700">Vendor Apps (Mi Home / Midea / Tuya)</text>
<text x="880" y="278" font-size="15" fill="#059669" font-weight="700">Home Assistant Local Master Hub</text>

<line x1="64" y1="340" x2="1376" y2="340" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="325" font-size="14" fill="#0f172a" font-weight="600">Cross-Brand Interconnect</text>
<text x="420" y="325" font-size="14" fill="#475569">Walled gardens; cannot command rival appliances</text>
<text x="880" y="325" font-size="14" fill="#059669" font-weight="600">Universal federation: 3,000+ brands combined freely</text>

<line x1="64" y1="410" x2="1376" y2="410" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="380" font-size="14" fill="#0f172a" font-weight="600">Offline Resilience</text>
<text x="420" y="380" font-size="14" fill="#dc2626">Heavy cloud lock; internet down freezes automations</text>
<text x="880" y="380" font-size="14" fill="#059669" font-weight="600">100% local execution; unplug WAN, everything runs fine</text>

<line x1="64" y1="480" x2="1376" y2="480" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="450" font-size="14" fill="#0f172a" font-weight="600">Execution Latency</text>
<text x="420" y="450" font-size="14" fill="#475569">1000ms ~ 3000ms (round-trip through remote cloud)</text>
<text x="880" y="450" font-size="14" fill="#059669" font-weight="600">5ms ~ 15ms (direct LAN packets; instantaneous click)</text>

<line x1="64" y1="550" x2="1376" y2="550" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="520" font-size="14" fill="#0f172a" font-weight="600">Apple HomeKit / Siri</text>
<text x="420" y="520" font-size="14" fill="#475569">Only expensive MFi hardware; cheap sensors excluded</text>
<text x="880" y="520" font-size="14" fill="#059669" font-weight="600">One-click bridge: turns $3 Xiaomi sensors into native Apple accessories</text>

<line x1="64" y1="620" x2="1376" y2="620" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="590" font-size="14" fill="#0f172a" font-weight="600">Data Privacy &amp; Lifetime</text>
<text x="420" y="590" font-size="14" fill="#475569">Telemetry uploaded to vendor cloud; shutdown risk</text>
<text x="880" y="590" font-size="14" fill="#059669" font-weight="600">All data stays on local drive; open source permanence</text>

<line x1="64" y1="690" x2="1376" y2="690" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="660" font-size="14" fill="#0f172a" font-weight="600">Learning Curve</text>
<text x="420" y="660" font-size="14" fill="#059669" font-weight="600">Very easy initially, but quickly hits brick wall</text>
<text x="880" y="660" font-size="14" fill="#0f172a">Wintermelon HAOS removes pain; 100% visual web UI</text>

<rect x="94" y="705" width="1252" height="42" rx="8" fill="#e0f2fe"/>
<text x="114" y="731" font-size="14" fill="#0284c7" font-weight="700">Novice Golden Strategy:</text>
<text x="280" y="731" font-size="14" fill="#0f172a">Keep Mi Home App for family members' daily use; add a low-power HA mini PC as the true brain behind the scenes!</text>
</svg>