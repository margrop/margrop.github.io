<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Remote Cloud Call Center vs In-House Private Butler">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#dc2626" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#dc2626" font-weight="600">LATENCY &amp; RESILIENCE × CLOUD VS LOCAL EXECUTION PIPELINE</text>
<text x="64" y="150" font-size="34" fill="#0f172a" font-weight="600">Why "Local-First Control" is the Lifeline of Smart Homes</text>
<text x="64" y="200" font-size="21" fill="#475569">Remote offshore call center round-trips vs resident full-time in-house private butler</text>

<!-- Pipeline 1: Cloud -->
<rect x="64" y="240" width="1312" height="240" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<rect x="94" y="265" width="220" height="34" rx="8" fill="#fee2e2"/>
<text x="108" y="288" font-size="14" fill="#dc2626" font-weight="700">Path A: Vendor Cloud Call Center</text>
<text x="330" y="288" font-size="17" fill="#0f172a" font-weight="700">1500~3000ms latency | Single point of failure: ISP cut or cloud outage bricks home</text>

<rect x="94" y="325" width="220" height="120" rx="10" fill="#f1f5f9"/>
<text x="110" y="360" font-size="15" fill="#0f172a" font-weight="700">1. Motion Sensor Fires</text>
<text x="110" y="390" font-size="13" fill="#475569">Walk across entryway,</text>
<text x="110" y="415" font-size="13" fill="#475569">sensor catches movement</text>

<path d="M324 385 L354 385" stroke="#dc2626" stroke-width="3"/>
<polygon points="354,380 364,385 354,390" fill="#dc2626"/>

<rect x="374" y="325" width="240" height="120" rx="10" fill="#f1f5f9"/>
<text x="390" y="360" font-size="15" fill="#0f172a" font-weight="700">2. Long WAN Odyssey</text>
<text x="390" y="390" font-size="13" fill="#475569">Local gateway -&gt; ISP fiber</text>
<text x="390" y="415" font-size="13" fill="#dc2626">Crosses 1,000+ miles of WAN</text>

<path d="M624 385 L654 385" stroke="#dc2626" stroke-width="3"/>
<polygon points="654,380 664,385 654,390" fill="#dc2626"/>

<rect x="674" y="325" width="280" height="120" rx="10" fill="#fee2e2"/>
<text x="690" y="360" font-size="15" fill="#dc2626" font-weight="700">3. Cloud Server Queue</text>
<text x="690" y="390" font-size="13" fill="#475569">Millions of devices in queue</text>
<text x="690" y="415" font-size="13" fill="#dc2626">Evaluates rule and signs payload</text>

<path d="M964 385 L994 385" stroke="#dc2626" stroke-width="3"/>
<polygon points="994,380 1004,385 994,390" fill="#dc2626"/>

<rect x="1014" y="325" width="260" height="120" rx="10" fill="#f1f5f9"/>
<text x="1030" y="360" font-size="15" fill="#0f172a" font-weight="700">4. Return WAN Journey</text>
<text x="1030" y="390" font-size="13" fill="#475569">Signal returns via home router</text>
<text x="1030" y="415" font-size="13" fill="#d97706">Entryway light finally clicks ON</text>

<!-- Pipeline 2: Local HA -->
<rect x="64" y="520" width="1312" height="240" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<rect x="94" y="545" width="240" height="34" rx="8" fill="#d1fae5"/>
<text x="108" y="568" font-size="14" fill="#059669" font-weight="700">Path B: Home Assistant Local Butler</text>
<text x="350" y="568" font-size="17" fill="#0f172a" font-weight="700">5~15ms pure local execution | 100% resilient: pull WAN cable, everything keeps working</text>

<rect x="94" y="605" width="340" height="120" rx="10" fill="#d1fae5"/>
<text x="114" y="640" font-size="15" fill="#059669" font-weight="700">1. Instant LAN Broadcast</text>
<text x="114" y="670" font-size="13" fill="#0f172a">Sensor transmits BLE/Zigbee packet</text>
<text x="114" y="695" font-size="13" fill="#0f172a">directly over home network (took 1ms)</text>

<path d="M444 665 L484 665" stroke="#059669" stroke-width="4"/>
<polygon points="484,660 496,665 484,670" fill="#059669"/>

<rect x="506" y="605" width="390" height="120" rx="10" fill="#d1fae5"/>
<text x="526" y="640" font-size="15" fill="#059669" font-weight="700">2. Local Core In-Memory Decision</text>
<text x="526" y="670" font-size="13" fill="#0f172a">HA Core catches the event with zero delay</text>
<text x="526" y="695" font-size="13" fill="#059669">Matches "motion + dark" rule in memory (took 2ms)</text>

<path d="M906 665 L946 665" stroke="#059669" stroke-width="4"/>
<polygon points="946,660 958,665 946,670" fill="#059669"/>

<rect x="968" y="605" width="370" height="120" rx="10" fill="#d1fae5"/>
<text x="988" y="640" font-size="15" fill="#059669" font-weight="700">3. Direct LAN Command to Light</text>
<text x="988" y="670" font-size="13" fill="#0f172a">Command stays within local subnet to light fixture</text>
<text x="988" y="695" font-size="13" fill="#059669">Lights snap on before your foot lands! Zero WAN needed!</text>
</svg>