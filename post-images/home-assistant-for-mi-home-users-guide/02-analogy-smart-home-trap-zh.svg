<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="伪智能家居四大陷阱 vs 真全屋智能中枢">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#d97706" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#d97706" font-weight="600">SMART HOME PITFALL ANALYSIS × ARCHITECTURAL ROOT CAUSE</text>
<text x="64" y="150" font-size="36" fill="#0f172a" font-weight="600">为什么你家买了一堆智能家电，却越用越累？</text>
<text x="64" y="200" font-size="22" fill="#475569">单品牌云端生态的四大“隐形枷锁”与 Home Assistant 破壁重构对比</text>

<!-- Left Column: The 4 Traps (Red) -->
<rect x="64" y="240" width="630" height="520" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<rect x="94" y="270" width="140" height="38" rx="8" fill="#fee2e2"/>
<text x="108" y="295" font-size="16" fill="#dc2626" font-weight="700">传统单品牌云端</text>
<text x="254" y="295" font-size="22" fill="#0f172a" font-weight="700">伪智能的四大隐形枷锁</text>

<rect x="94" y="330" width="570" height="88" rx="12" fill="#f1f5f9"/>
<text x="114" y="360" font-size="17" fill="#dc2626" font-weight="700">1. 手机变成“呼叫中心” (App 碎片化)</text>
<text x="114" y="392" font-size="14" fill="#475569">小米、美的、海尔、涂鸦各有各的 App，控制全屋要频繁翻屏切换 5 个软件。</text>

<rect x="94" y="435" width="570" height="88" rx="12" fill="#f1f5f9"/>
<text x="114" y="465" font-size="17" fill="#dc2626" font-weight="700">2. 生态割裂的“柏林墙” (跨品牌绝缘)</text>
<text x="114" y="497" font-size="14" fill="#475569">米家的人体感应器永远指挥不动美的空调；飞利浦灯泡进不了小米的离家场景。</text>

<rect x="94" y="540" width="570" height="88" rx="12" fill="#f1f5f9"/>
<text x="114" y="570" font-size="17" fill="#dc2626" font-weight="700">3. 断网即瘫痪的“弱智危机” (高延迟与云依赖)</text>
<text x="114" y="602" font-size="14" fill="#475569">按个开关信号要绕地球半圈到北京云端，光缆施工或厂商服务器卡顿全家趴窝。</text>

<rect x="94" y="645" width="570" height="88" rx="12" fill="#f1f5f9"/>
<text x="114" y="675" font-size="17" fill="#dc2626" font-weight="700">4. 隐私裸奔与停运变砖 (数据无主权)</text>
<text x="114" y="707" font-size="14" fill="#475569">传感器行为被厂商作为画像资产；小众品牌一旦倒闭关服，硬件直接沦为电子垃圾。</text>

<!-- Right Column: Home Assistant Hub (Green) -->
<rect x="746" y="240" width="630" height="520" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<rect x="776" y="270" width="160" height="38" rx="8" fill="#d1fae5"/>
<text x="790" y="295" font-size="16" fill="#059669" font-weight="700">Home Assistant</text>
<text x="956" y="295" font-size="22" fill="#0f172a" font-weight="700">全屋智能终极解脱方案</text>

<rect x="776" y="330" width="570" height="88" rx="12" fill="#d1fae5"/>
<text x="796" y="360" font-size="17" fill="#059669" font-weight="700">1. 万物归一的极简驾驶舱 (单一中枢)</text>
<text x="796" y="392" font-size="14" fill="#0f172a">一个网页或一个 App 统一收纳全家开关、传感器、监控，告别桌面 App 混乱。</text>

<rect x="776" y="435" width="570" height="88" rx="12" fill="#d1fae5"/>
<text x="796" y="465" font-size="17" fill="#059669" font-weight="700">2. 彻底拆墙的宇宙级混搭 (真正联动)</text>
<text x="796" y="497" font-size="14" fill="#0f172a">任意品牌无缝握手：小米门磁开门 -&gt; 美的空调开机 -&gt; 易来灯光调温 -&gt; HomePod 播报。</text>

<rect x="776" y="540" width="570" height="88" rx="12" fill="#d1fae5"/>
<text x="796" y="570" font-size="17" fill="#059669" font-weight="700">3. 稳如磐石的 5ms 本地总线 (断网照常工作)</text>
<text x="796" y="602" font-size="14" fill="#0f172a">智能逻辑跑在客厅本地小主机上，信号局域网毫秒直达，外网拔线所有家规照样执行！</text>

<rect x="776" y="645" width="570" height="88" rx="12" fill="#d1fae5"/>
<text x="796" y="675" font-size="17" fill="#059669" font-weight="700">4. 绝不泄露的绝对数据主权 (安全安心)</text>
<text x="796" y="707" font-size="14" fill="#0f172a">数据 100% 存在本地硬盘，开源社区 10 年沉淀，永无厂商倒闭停机之忧。</text>
</svg>