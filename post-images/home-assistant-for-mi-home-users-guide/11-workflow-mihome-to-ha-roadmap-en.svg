<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Mi Home to Home Assistant 4-Step Roadmap">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#059669" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#059669" font-weight="600">ZERO-COST ONBOARDING ROADMAP × MI HOME MIGRATION</text>
<text x="64" y="150" font-size="34" fill="#0f172a" font-weight="600">Mi Home Veteran Upgrade: 4 Smooth Steps to True Smart Home</text>
<text x="64" y="200" font-size="21" fill="#475569">Zero equipment scrapped, zero family learning curve, complete the central upgrade in 30 minutes</text>

<rect x="64" y="240" width="300" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="114" cy="290" r="24" fill="#e0f2fe"/>
<text x="108" y="298" font-size="22" fill="#0284c7" font-weight="700">1</text>
<text x="154" y="298" font-size="19" fill="#0f172a" font-weight="700">Zero Gear Waste</text>

<rect x="84" y="340" width="260" height="140" rx="10" fill="#f1f5f9"/>
<text x="100" y="375" font-size="14" fill="#0f172a" font-weight="700">Retain Existing Devices</text>
<text x="100" y="410" font-size="13" fill="#475569">• Xiaomi sockets, lamps, switches remain</text>
<text x="100" y="435" font-size="13" fill="#475569">• Midea ACs &amp; water heaters remain</text>
<text x="100" y="460" font-size="13" fill="#475569">• Official vendor apps continue working</text>

<rect x="84" y="500" width="260" height="230" rx="10" fill="#e0f2fe"/>
<text x="100" y="535" font-size="14" fill="#0284c7" font-weight="700">Dual-Track Guarantee:</text>
<text x="100" y="570" font-size="13" fill="#0f172a">HA does not overwrite or destroy</text>
<text x="100" y="595" font-size="13" fill="#0f172a">existing Mi Home routines. Family</text>
<text x="100" y="620" font-size="13" fill="#0f172a">members still talk to Xiaoai speakers,</text>
<text x="100" y="645" font-size="13" fill="#0f172a">while you command the master brain!</text>

<rect x="394" y="240" width="300" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="444" cy="290" r="24" fill="#fef3c7"/>
<text x="438" y="298" font-size="22" fill="#d97706" font-weight="700">2</text>
<text x="484" y="298" font-size="19" fill="#0f172a" font-weight="700">HAOS Power-On</text>

<rect x="414" y="340" width="260" height="140" rx="10" fill="#f1f5f9"/>
<text x="430" y="375" font-size="14" fill="#0f172a" font-weight="700">Ultra-Low Power Mini PC</text>
<text x="430" y="410" font-size="13" fill="#475569">• A budget mini PC / used laptop / NAS</text>
<text x="430" y="435" font-size="13" fill="#475569">• Under 10W power draw (pennies a year)</text>
<text x="430" y="460" font-size="13" fill="#475569">• Zero network lock: Wintermelon HAOS</text>

<rect x="414" y="500" width="260" height="230" rx="10" fill="#fef3c7"/>
<text x="430" y="535" font-size="14" fill="#d97706" font-weight="700">Pain-Free Boot:</text>
<text x="430" y="570" font-size="13" fill="#0f172a">As covered in our previous guide,</text>
<text x="430" y="595" font-size="13" fill="#0f172a">Wintermelon HAOS comes with local</text>
<text x="430" y="620" font-size="13" fill="#0f172a">mirrors and port 8124 companion,</text>
<text x="430" y="645" font-size="13" fill="#0f172a">booting up in 3 minutes cleanly!</text>

<rect x="724" y="240" width="300" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="774" cy="290" r="24" fill="#d1fae5"/>
<text x="768" y="298" font-size="22" fill="#059669" font-weight="700">3</text>
<text x="814" y="298" font-size="19" fill="#0f172a" font-weight="700">10-Sec Sync</text>

<rect x="744" y="340" width="260" height="140" rx="10" fill="#f1f5f9"/>
<text x="760" y="375" font-size="14" fill="#0f172a" font-weight="700">Xiaomi Miot Integration</text>
<text x="760" y="410" font-size="13" fill="#475569">• Search Xiaomi Miot in Integrations</text>
<text x="760" y="435" font-size="13" fill="#475569">• Log in with your Xiaomi credentials</text>
<text x="760" y="460" font-size="13" fill="#475569">• Dozens of devices sync automatically</text>

<rect x="744" y="500" width="260" height="230" rx="10" fill="#d1fae5"/>
<text x="760" y="535" font-size="14" fill="#059669" font-weight="700">Automatic Entities:</text>
<text x="760" y="570" font-size="13" fill="#0f172a">Fans, bulbs, cookers, and vacuums</text>
<text x="760" y="595" font-size="13" fill="#0f172a">are instantly parsed into clean entities.</text>
<text x="760" y="620" font-size="13" fill="#0f172a">Supports cloud or direct LAN token,</text>
<text x="760" y="645" font-size="13" fill="#0f172a">saving hours of re-pairing hassle!</text>

<rect x="1054" y="240" width="322" height="520" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<circle cx="1104" cy="290" r="24" fill="#ede9fe"/>
<text x="1098" y="298" font-size="22" fill="#7c3aed" font-weight="700">4</text>
<text x="1144" y="298" font-size="19" fill="#0f172a" font-weight="700">Cross-Brand &amp; Apple</text>

<rect x="1074" y="340" width="282" height="140" rx="10" fill="#f1f5f9"/>
<text x="1090" y="375" font-size="14" fill="#0f172a" font-weight="700">Unlock Full Potential</text>
<text x="1090" y="410" font-size="13" fill="#475569">• Enable Apple HomeKit Bridge</text>
<text x="1090" y="435" font-size="13" fill="#475569">• Scan QR with iPhone: instant native sync</text>
<text x="1090" y="460" font-size="13" fill="#475569">• Build first cross-brand automation</text>

<rect x="1074" y="500" width="282" height="230" rx="10" fill="#ede9fe"/>
<text x="1090" y="535" font-size="14" fill="#7c3aed" font-weight="700">Pure Dimensional Strike:</text>
<text x="1090" y="570" font-size="13" fill="#0f172a">Click a $3 Xiaomi button to shut down</text>
<text x="1090" y="595" font-size="13" fill="#0f172a">Midea AC and Sony TV simultaneously.</text>
<text x="1090" y="620" font-size="13" fill="#0f172a">Say "Hey Siri, I'm home" to trigger</text>
<text x="1090" y="645" font-size="13" fill="#0f172a">the ultimate whole-home symphony!</text>
</svg>