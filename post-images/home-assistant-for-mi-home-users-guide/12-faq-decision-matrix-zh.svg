<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="单品牌 App vs Home Assistant 终极对比决策矩阵">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">COMPREHENSIVE DECISION MATRIX × FAQ BENCHMARK</text>
<text x="64" y="150" font-size="36" fill="#0f172a" font-weight="600">终极对决：单品牌 App 与 Home Assistant 核心维度全景对比</text>
<text x="64" y="200" font-size="22" fill="#475569">从日常操控、跨界联动、断网生存到维护成本的深度决策指南</text>

<!-- Matrix Table Container -->
<rect x="64" y="240" width="1312" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- Table Header -->
<rect x="64" y="240" width="1312" height="60" rx="16" fill="#f1f5f9"/>
<rect x="64" y="280" width="1312" height="20" fill="#f1f5f9"/>
<text x="94" y="278" font-size="16" fill="#0f172a" font-weight="700">评估维度 / 核心需求</text>
<text x="420" y="278" font-size="16" fill="#dc2626" font-weight="700">传统单品牌 App (米家 / 美居 / 涂鸦)</text>
<text x="880" y="278" font-size="16" fill="#059669" font-weight="700">Home Assistant 本地智能中枢</text>

<line x1="64" y1="340" x2="1376" y2="340" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="325" font-size="15" fill="#0f172a" font-weight="600">跨品牌互联能力</text>
<text x="420" y="325" font-size="14" fill="#475569">极度封闭，无法直接指挥竞品家电</text>
<text x="880" y="325" font-size="14" fill="#059669" font-weight="600">宇宙级打通，支持 3000+ 品牌任意混搭组合</text>

<line x1="64" y1="410" x2="1376" y2="410" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="380" font-size="15" fill="#0f172a" font-weight="600">断网生存与可靠性</text>
<text x="420" y="380" font-size="14" fill="#dc2626">极度依赖外网，断网时联动规则大面积瘫痪</text>
<text x="880" y="380" font-size="14" fill="#059669" font-weight="600">100% 本地运算，拔掉光纤所有联动毫秒级秒开</text>

<line x1="64" y1="480" x2="1376" y2="480" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="450" font-size="15" fill="#0f172a" font-weight="600">响应延迟与体验</text>
<text x="420" y="450" font-size="14" fill="#475569">1000ms ~ 3000ms (需千里之外云端折返)</text>
<text x="880" y="450" font-size="14" fill="#059669" font-weight="600">5ms ~ 15ms (局域网直连，按键抬手即响应)</text>

<line x1="64" y1="550" x2="1376" y2="550" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="520" font-size="15" fill="#0f172a" font-weight="600">苹果 HomeKit / Siri</text>
<text x="420" y="520" font-size="14" fill="#475569">仅限高价专版，绝大多数廉价传感器不支持</text>
<text x="880" y="520" font-size="14" fill="#059669" font-weight="600">一键原生桥接，20 元米家配件秒变苹果官方家庭</text>

<line x1="64" y1="620" x2="1376" y2="620" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="590" font-size="15" fill="#0f172a" font-weight="600">数据隐私与生命周期</text>
<text x="420" y="590" font-size="14" fill="#475569">数据上传公网服务器；厂商关服设备变砖</text>
<text x="880" y="590" font-size="14" fill="#059669" font-weight="600">全屋数据留存本地硬盘；开源社区历久弥新</text>

<line x1="64" y1="690" x2="1376" y2="690" stroke="#cbd5e1" stroke-width="1"/>
<text x="94" y="660" font-size="15" fill="#0f172a" font-weight="600">上手门槛与日常维护</text>
<text x="420" y="660" font-size="14" fill="#059669" font-weight="600">极低，扫码即用 (但后期扩展性极受限)</text>
<text x="880" y="660" font-size="14" fill="#0f172a">冬瓜 HAOS 免除配置痛点；全中文可视化点选</text>

<rect x="94" y="705" width="1252" height="42" rx="8" fill="#e0f2fe"/>
<text x="114" y="731" font-size="14" fill="#0284c7" font-weight="700">新手终极建议：</text>
<text x="210" y="731" font-size="14" fill="#0f172a">保留现有米家 App 给家人日常操作，引入一台低功耗 HA 主机担任幕后真正大脑，双轨兼顾、一步到位！</text>
</svg>