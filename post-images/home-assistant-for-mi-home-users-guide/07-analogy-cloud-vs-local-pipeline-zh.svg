<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="云端外包呼叫中心 vs 客厅全职大管家">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC","Noto Sans SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#dc2626" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#dc2626" font-weight="600">LATENCY &amp; RESILIENCE × CLOUD VS LOCAL EXECUTION PIPELINE</text>
<text x="64" y="150" font-size="36" fill="#0f172a" font-weight="600">为什么“本地控制”是智能家居的命根子？</text>
<text x="64" y="200" font-size="22" fill="#475569">千里之外的云端外包呼叫中心 vs 客厅常驻的私人全职大管家</text>

<!-- Pipeline 1: Cloud -->
<rect x="64" y="240" width="1312" height="240" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<rect x="94" y="265" width="200" height="34" rx="8" fill="#fee2e2"/>
<text x="108" y="288" font-size="15" fill="#dc2626" font-weight="700">模式 A：传统云端呼叫中心</text>
<text x="310" y="288" font-size="18" fill="#0f172a" font-weight="700">延迟 1500~3000ms | 弱点：外网波动、云端宕机全屋瘫痪</text>

<rect x="94" y="325" width="220" height="120" rx="10" fill="#f1f5f9"/>
<text x="110" y="360" font-size="16" fill="#0f172a" font-weight="700">1. 人体感应器触发</text>
<text x="110" y="390" font-size="13" fill="#475569">走过玄关，感应器侦测</text>
<text x="110" y="415" font-size="13" fill="#475569">到人员移动信号</text>

<path d="M324 385 L354 385" stroke="#dc2626" stroke-width="3"/>
<polygon points="354,380 364,385 354,390" fill="#dc2626"/>

<rect x="374" y="325" width="240" height="120" rx="10" fill="#f1f5f9"/>
<text x="390" y="360" font-size="16" fill="#0f172a" font-weight="700">2. 跨公网长途跋涉</text>
<text x="390" y="390" font-size="13" fill="#475569">局域网网关 -&gt; 运营商光纤</text>
<text x="390" y="415" font-size="13" fill="#dc2626">跨越 1000+ 公里公网干线</text>

<path d="M624 385 L654 385" stroke="#dc2626" stroke-width="3"/>
<polygon points="654,380 664,385 654,390" fill="#dc2626"/>

<rect x="674" y="325" width="280" height="120" rx="10" fill="#fee2e2"/>
<text x="690" y="360" font-size="16" fill="#dc2626" font-weight="700">3. 云端服务器排队鉴权</text>
<text x="690" y="390" font-size="13" fill="#475569">几百万设备挤在云端队列中</text>
<text x="690" y="415" font-size="13" fill="#dc2626">判别家规、计算并下发指令</text>

<path d="M964 385 L994 385" stroke="#dc2626" stroke-width="3"/>
<polygon points="994,380 1004,385 994,390" fill="#dc2626"/>

<rect x="1014" y="325" width="260" height="120" rx="10" fill="#f1f5f9"/>
<text x="1030" y="360" font-size="16" fill="#0f172a" font-weight="700">4. 信号千里折返客厅</text>
<text x="1030" y="390" font-size="13" fill="#475569">信号再次穿过公网回到家中</text>
<text x="1030" y="415" font-size="13" fill="#d97706">玄关吸顶灯终于亮起 (明显迟钝)</text>

<!-- Pipeline 2: Local HA -->
<rect x="64" y="520" width="1312" height="240" rx="16" fill="#ffffff" stroke="#059669" stroke-width="2"/>
<rect x="94" y="545" width="220" height="34" rx="8" fill="#d1fae5"/>
<text x="108" y="568" font-size="15" fill="#059669" font-weight="700">模式 B：HA 客厅常驻私人管家</text>
<text x="330" y="568" font-size="18" fill="#0f172a" font-weight="700">延迟 5~15ms (纯本地直连) | 优势：断网坚如磐石，极速零卡顿</text>

<rect x="94" y="605" width="340" height="120" rx="10" fill="#d1fae5"/>
<text x="114" y="640" font-size="16" fill="#059669" font-weight="700">1. 人体感应器本地触发</text>
<text x="114" y="670" font-size="13" fill="#0f172a">人走过玄关，蓝牙Mesh/Zigbee 报文</text>
<text x="114" y="695" font-size="13" fill="#0f172a">在局域网内广播发送 (耗时 1ms)</text>

<path d="M444 665 L484 665" stroke="#059669" stroke-width="4"/>
<polygon points="484,660 496,665 484,670" fill="#059669"/>

<rect x="506" y="605" width="390" height="120" rx="10" fill="#d1fae5"/>
<text x="526" y="640" font-size="16" fill="#059669" font-weight="700">2. 客厅小主机 HA 本地内核计算</text>
<text x="526" y="670" font-size="13" fill="#0f172a">本地大管家 0 延迟捕获事件，在本地内存</text>
<text x="526" y="695" font-size="13" fill="#059669">完成“有人且天黑”家规匹配 (耗时 2ms)</text>

<path d="M906 665 L946 665" stroke="#059669" stroke-width="4"/>
<polygon points="946,660 958,665 946,670" fill="#059669"/>

<rect x="968" y="605" width="370" height="120" rx="10" fill="#d1fae5"/>
<text x="988" y="640" font-size="16" fill="#059669" font-weight="700">3. 局域网直达点亮吸顶灯</text>
<text x="988" y="670" font-size="13" fill="#0f172a">信号无需离开路由器，Wi-Fi/局域网直发灯具</text>
<text x="988" y="695" font-size="13" fill="#059669">人刚抬脚灯已亮起！哪怕光猫断电也毫不受影响！</text>
</svg>