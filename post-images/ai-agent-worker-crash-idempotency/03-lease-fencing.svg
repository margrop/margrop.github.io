<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="t d">
  <title id="t">Lease versus fencing token</title><desc id="d">A newer Worker obtains token 42 and a stale Worker with token 41 is rejected by the receiver.</desc>
  <rect width="1500" height="860" rx="30" fill="#081527"/>
  <text x="70" y="84" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="43">A LEASE TELLS WORKERS.</text>
  <text x="70" y="132" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="43">A FENCE TELLS THE RECEIVER.</text>
  <text x="70" y="180" fill="#8fa9ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Time can expire while an old process is paused, partitioned, or waking up.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="90" y="260" width="350" height="210" rx="28" fill="#2f1b30" stroke="#ff7190" stroke-width="3"/>
    <text x="135" y="330" fill="#ffe0e7" font-weight="800" font-size="34">Worker A · stale</text>
    <text x="135" y="390" fill="#d0a6b0" font-size="27">lease expired</text>
    <text x="135" y="435" fill="#ff91a8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="29">fence = 41</text>
    <rect x="90" y="560" width="350" height="210" rx="28" fill="#123b39" stroke="#4ff0b7" stroke-width="3"/>
    <text x="135" y="630" fill="#e3fbf5" font-weight="800" font-size="34">Worker B · owner</text>
    <text x="135" y="690" fill="#a9d8ce" font-size="27">new lease acquired</text>
    <text x="135" y="735" fill="#4ff0b7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="29">fence = 42</text>

    <rect x="930" y="330" width="470" height="350" rx="32" fill="#102b48" stroke="#3c70a8" stroke-width="3"/>
    <text x="985" y="405" fill="#f3f7fd" font-weight="800" font-size="35">Effect receiver</text>
    <text x="985" y="470" fill="#9bb5d4" font-size="26">highest accepted fence = 42</text>
    <rect x="985" y="525" width="360" height="74" rx="16" fill="#401c2c"/>
    <text x="1030" y="573" fill="#ff9caf" font-size="26">41 &lt; 42  →  REJECT</text>
    <text x="985" y="645" fill="#6f91b8" font-size="22">Use a conditional version, epoch,</text>
    <text x="985" y="678" fill="#6f91b8" font-size="22">generation, or receiver-side token.</text>
  </g>
  <path d="M440 365 C650 365 680 490 900 490" fill="none" stroke="#ff7190" stroke-width="8" stroke-dasharray="15 13"/>
  <path d="M875 467 l32 23 -32 23" fill="none" stroke="#ff7190" stroke-width="8" stroke-linecap="round"/>
  <path d="M440 665 C650 665 680 565 900 565" fill="none" stroke="#4ff0b7" stroke-width="8"/>
  <path d="M875 542 l32 23 -32 23" fill="none" stroke="#4ff0b7" stroke-width="8" stroke-linecap="round"/>
  <text x="590" y="325" fill="#ff9caf" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="24">late write</text>
  <text x="590" y="705" fill="#4ff0b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="24">current write</text>
</svg>
