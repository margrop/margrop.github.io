<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d">
  <title id="t">Durable task state machine</title><desc id="d">Task states from pending through leased, executing and terminal or reconciliation paths.</desc>
  <rect width="1500" height="900" rx="30" fill="#071526"/>
  <text x="74" y="95" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="50">TASK STATE IS NOT CHAT HISTORY</text>
  <text x="74" y="145" fill="#8fa9ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">Every transition has an owner, precondition, version, and audit event.</text>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#5f83ad"/></marker></defs>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle">
    <g><rect x="70" y="290" width="220" height="110" rx="24" fill="#132e52" stroke="#3475aa" stroke-width="3"/><text x="180" y="357" fill="#dceafa" font-size="29">PENDING</text></g>
    <g><rect x="365" y="290" width="220" height="110" rx="24" fill="#132e52" stroke="#3475aa" stroke-width="3"/><text x="475" y="357" fill="#dceafa" font-size="29">LEASED</text></g>
    <g><rect x="660" y="290" width="220" height="110" rx="24" fill="#173750" stroke="#42bdd5" stroke-width="3"/><text x="770" y="357" fill="#dceafa" font-size="29">EXECUTING</text></g>
    <g><rect x="955" y="290" width="220" height="110" rx="24" fill="#123d38" stroke="#4ff0b7" stroke-width="3"/><text x="1065" y="357" fill="#dffbf3" font-size="29">COMPLETED</text></g>
    <g><rect x="660" y="585" width="280" height="110" rx="24" fill="#3b2830" stroke="#f7ca6a" stroke-width="3"/><text x="800" y="630" fill="#fff1c8" font-size="26">UNKNOWN</text><text x="800" y="670" fill="#cdbd9a" font-size="20">outcome ambiguous</text></g>
    <g><rect x="1040" y="585" width="330" height="110" rx="24" fill="#351d31" stroke="#ff7190" stroke-width="3"/><text x="1205" y="630" fill="#ffe1e8" font-size="25">RECONCILING</text><text x="1205" y="670" fill="#d5aab5" font-size="20">verify or compensate</text></g>
  </g>
  <g fill="none" stroke="#5f83ad" stroke-width="6" marker-end="url(#arrow)">
    <path d="M290 345 H353"/><path d="M585 345 H648"/><path d="M880 345 H943"/>
    <path d="M770 412 V568"/><path d="M940 640 H1028"/><path d="M1205 573 V470 Q1205 445 1180 445 H1090 V412"/>
    <path d="M475 412 V470 Q475 510 430 510 H180 Q140 510 140 470 V412"/>
  </g>
  <g fill="#8fa9ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">
    <text x="307" y="327">claim</text><text x="598" y="327">start</text><text x="894" y="327">commit</text>
    <text x="788" y="500">lost ACK</text><text x="968" y="618">inspect</text><text x="1218" y="510">resolved</text><text x="260" y="490">lease expired</text>
  </g>
  <text x="76" y="812" fill="#7090b6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">FAILED, CANCEL_REQUESTED, DENIED, and WAITING_APPROVAL can be added by policy; do not hide them in prose.</text>
</svg>
