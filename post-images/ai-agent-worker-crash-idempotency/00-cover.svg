<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One request, two restarts?</title>
  <desc id="desc">An original illustration of a Worker crashing between a side effect and its completion record, followed by a safe deduplicated retry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#10264a"/>
      <stop offset="1" stop-color="#182e3d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d5ff"/>
      <stop offset="1" stop-color="#4ff0b7"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1370" cy="130" r="210" fill="#273e72" opacity=".32"/>
  <circle cx="180" cy="760" r="260" fill="#0f5b67" opacity=".28"/>
  <text x="112" y="150" fill="#7e9cc5" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="30" letter-spacing="6">AI WORKER FAULT LAB</text>
  <text x="112" y="265" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="86">ONE REQUEST.</text>
  <text x="112" y="365" fill="url(#cyan)" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="86">TWO RESTARTS?</text>
  <text x="116" y="430" fill="#b9c8df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31">Crash after effect  ·  before COMPLETED  ·  retry safely</text>

  <g transform="translate(120 525)">
    <rect x="0" y="0" width="300" height="190" rx="28" fill="#142c50" stroke="#3b6da7" stroke-width="3"/>
    <circle cx="54" cy="52" r="16" fill="#4ff0b7"/>
    <text x="88" y="64" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="32">Worker A</text>
    <text x="38" y="120" fill="#8fa9ca" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24">effect: DONE</text>
    <text x="38" y="157" fill="#ff7190" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="24">state: CRASH</text>
  </g>
  <path d="M444 620 H620" stroke="#ff7190" stroke-width="8" stroke-linecap="round"/>
  <path d="M526 572 l44 96 M570 572 l-44 96" stroke="#ff7190" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <text x="470" y="740" fill="#ff9caf" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="25">THE 1 ms GAP</text>

  <g transform="translate(650 525)">
    <rect x="0" y="0" width="360" height="190" rx="28" fill="#142c50" stroke="#3b6da7" stroke-width="3"/>
    <text x="38" y="64" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="31">Queue redelivers</text>
    <text x="38" y="120" fill="#8fa9ca" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23">delivery = 2</text>
    <text x="38" y="157" fill="#f7ca6a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="23">at-least-once</text>
  </g>
  <path d="M1034 620 H1168" stroke="#4ff0b7" stroke-width="8" stroke-linecap="round"/>
  <path d="M1140 594 l34 26 -34 26" fill="none" stroke="#4ff0b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1190 525)">
    <rect x="0" y="0" width="300" height="190" rx="28" fill="#103c3d" stroke="#4ff0b7" stroke-width="3"/>
    <text x="34" y="65" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="31">Safe receiver</text>
    <text x="34" y="120" fill="#a9dacd" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22">UNIQUE(key)</text>
    <text x="34" y="157" fill="#4ff0b7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22">effects = 1</text>
  </g>
  <text x="113" y="820" fill="#6683a7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Original diagram · deterministic local experiment · zero network · zero credentials</text>
</svg>
