<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="t d">
  <title id="t">The dangerous crash window</title><desc id="d">Timeline showing an accepted side effect, a Worker crash before checkpoint, and a queue redelivery.</desc>
  <rect width="1500" height="820" rx="30" fill="#081528"/>
  <text x="80" y="100" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="52">THE DANGEROUS WINDOW</text>
  <text x="80" y="150" fill="#90a9ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">The tool finished. The task record did not.</text>
  <line x1="140" y1="410" x2="1360" y2="410" stroke="#34557d" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="190" cy="410" r="30" fill="#2fc7ff"/><text x="130" y="485" fill="#dce7f7" font-size="27">CLAIM</text><text x="100" y="525" fill="#7895ba" font-size="22">lease acquired</text>
    <circle cx="485" cy="410" r="30" fill="#4ff0b7"/><text x="420" y="485" fill="#dce7f7" font-size="27">EXECUTE</text><text x="390" y="525" fill="#7895ba" font-size="22">effect accepted</text>
    <rect x="650" y="255" width="310" height="310" rx="30" fill="#3a1728" stroke="#ff6b8d" stroke-width="4"/>
    <text x="712" y="335" fill="#ffb4c3" font-weight="800" font-size="33">1 ms GAP</text>
    <path d="M748 380 l114 114 M862 380 L748 494" stroke="#ff6b8d" stroke-width="20" stroke-linecap="round"/>
    <text x="687" y="615" fill="#ff91a8" font-size="24">process disappears here</text>
    <circle cx="1070" cy="410" r="30" fill="#f7ca6a"/><text x="1010" y="485" fill="#dce7f7" font-size="27">SAVE</text><text x="974" y="525" fill="#7895ba" font-size="22">never reached</text>
    <circle cx="1320" cy="410" r="30" fill="#a688ff"/><text x="1260" y="485" fill="#dce7f7" font-size="27">RETRY</text><text x="1218" y="525" fill="#7895ba" font-size="22">queue sees RUNNING</text>
  </g>
  <rect x="120" y="680" width="1260" height="78" rx="18" fill="#102845"/>
  <text x="160" y="731" fill="#d6e4f6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="27">at-least-once delivery + no idempotency = possible duplicate side effect</text>
</svg>
