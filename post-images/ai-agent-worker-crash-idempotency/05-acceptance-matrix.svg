<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="t d">
  <title id="t">Production acceptance matrix</title><desc id="d">Acceptance gates for delivery, effects, leases, outbox, compensation, observability, and privacy.</desc>
  <rect width="1500" height="900" rx="30" fill="#071526"/>
  <text x="72" y="100" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="52">THE QUEUE MAY REPEAT. THE WORLD MUST NOT.</text>
  <text x="72" y="150" fill="#8fa9ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">Ship only when failure injection proves the invariant.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="220" width="1360" height="580" rx="28" fill="#0f2946" stroke="#315e8a" stroke-width="3"/>
    <rect x="70" y="220" width="1360" height="78" rx="28" fill="#173a60"/>
    <text x="115" y="270" fill="#dce9f8" font-weight="700" font-size="26">GATE</text>
    <text x="590" y="270" fill="#dce9f8" font-weight="700" font-size="26">PRODUCTION INVARIANT</text>
    <text x="1275" y="270" fill="#dce9f8" font-weight="700" font-size="26">PASS</text>
    <g fill="#9db4d0" font-size="24">
      <text x="115" y="360">Redelivery</text><text x="590" y="360">2+ deliveries, exactly 1 accepted effect</text>
      <text x="115" y="430">Lease takeover</text><text x="590" y="430">old fence cannot update task or receiver</text>
      <text x="115" y="500">Outbox</text><text x="590" y="500">committed change is eventually published</text>
      <text x="115" y="570">Ambiguous outcome</text><text x="590" y="570">verify before retry; compensate if required</text>
      <text x="115" y="640">Evidence</text><text x="590" y="640">intent, key, attempt, fence, result share trace</text>
      <text x="115" y="710">Privacy boundary</text><text x="590" y="710">no secret, host identity, or raw sensitive result</text>
    </g>
    <g fill="#4ff0b7" font-size="35" font-weight="800"><text x="1295" y="362">✓</text><text x="1295" y="432">✓</text><text x="1295" y="502">✓</text><text x="1295" y="572">✓</text><text x="1295" y="642">✓</text><text x="1295" y="712">✓</text></g>
    <g stroke="#244c72" stroke-width="2"><path d="M100 388 H1400"/><path d="M100 458 H1400"/><path d="M100 528 H1400"/><path d="M100 598 H1400"/><path d="M100 668 H1400"/><path d="M100 738 H1400"/></g>
  </g>
  <text x="72" y="854" fill="#6e8db1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">HTTP 200 and COMPLETED are evidence only when the business effect is also counted.</text>
</svg>
