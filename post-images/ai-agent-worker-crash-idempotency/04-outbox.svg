<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d">
  <title id="t">Transactional outbox recovery</title><desc id="d">Business state and event are committed together, then a dispatcher retries delivery to an idempotent receiver.</desc>
  <rect width="1500" height="850" rx="30" fill="#081526"/>
  <text x="72" y="82" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="42">OUTBOX: SAVE THE RECEIPT</text>
  <text x="72" y="130" fill="#f5f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="42">BEFORE RINGING THE BELL</text>
  <text x="72" y="176" fill="#8fa9ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">It prevents a committed business change from losing its message.</text>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#5d83af"/></marker></defs>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="255" width="500" height="420" rx="30" fill="#102b49" stroke="#3b70aa" stroke-width="3"/>
    <text x="115" y="320" fill="#ecf3fd" font-weight="800" font-size="33">One database transaction</text>
    <rect x="120" y="370" width="400" height="105" rx="20" fill="#173958"/>
    <text x="160" y="415" fill="#cfe1f6" font-size="27">business_commands</text>
    <text x="160" y="452" fill="#4ff0b7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22">command-001 · COMMITTED</text>
    <rect x="120" y="510" width="400" height="105" rx="20" fill="#173958"/>
    <text x="160" y="555" fill="#cfe1f6" font-size="27">outbox</text>
    <text x="160" y="592" fill="#f7ca6a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22">event-001 · PENDING</text>

    <rect x="665" y="355" width="280" height="210" rx="28" fill="#322932" stroke="#f7ca6a" stroke-width="3"/>
    <text x="716" y="425" fill="#fff0c5" font-weight="800" font-size="31">Dispatcher</text>
    <text x="716" y="480" fill="#cbbd98" font-size="24">retry pending</text>
    <text x="716" y="522" fill="#cbbd98" font-size="24">events safely</text>

    <rect x="1050" y="255" width="380" height="420" rx="30" fill="#123a39" stroke="#4ff0b7" stroke-width="3"/>
    <text x="1095" y="320" fill="#e8fbf7" font-weight="800" font-size="33">Receiver</text>
    <text x="1095" y="380" fill="#9fd1c7" font-size="24">UNIQUE(event_id)</text>
    <rect x="1095" y="425" width="290" height="82" rx="18" fill="#174f49"/>
    <text x="1134" y="477" fill="#4ff0b7" font-size="25">first → ACCEPT</text>
    <rect x="1095" y="535" width="290" height="82" rx="18" fill="#263a49"/>
    <text x="1134" y="587" fill="#b3c7dc" font-size="25">retry → DEDUPE</text>
  </g>
  <path d="M570 465 H650" fill="none" stroke="#5d83af" stroke-width="7" marker-end="url(#a)"/>
  <path d="M945 465 H1035" fill="none" stroke="#5d83af" stroke-width="7" marker-end="url(#a)"/>
  <text x="600" y="420" fill="#7e9cbe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">poll</text>
  <text x="970" y="420" fill="#7e9cbe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">send</text>
  <text x="72" y="770" fill="#6e8db1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Outbox prevents loss. Receiver idempotency prevents duplicate effect. You usually need both.</text>
</svg>
