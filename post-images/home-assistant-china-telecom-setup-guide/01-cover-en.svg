<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>
  
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="320" x2="1440" y2="320"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="640" x2="1440" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="820"/>
    <line x1="480" y1="0" x2="480" y2="820"/>
    <line x1="720" y1="0" x2="720" y2="820"/>
    <line x1="960" y1="0" x2="960" y2="820"/>
    <line x1="1200" y1="0" x2="1200" y2="820"/>
  </g>

  <!-- Header Badge -->
  <rect x="520" y="45" width="400" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">HOME ASSISTANT BEGINNER STEP-BY-STEP GUIDE</text>

  <!-- Main Title -->
  <text x="720" y="130" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">China Telecom Integration Guide for Home Assistant</text>
  <text x="720" y="172" fill="#94a3b8" font-size="20" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">Zero Cloud Risk · No Password Leak · 10-Min Setup for Phone Balance & Data</text>

  <!-- Left Card: Carrier Account -->
  <g transform="translate(80, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="130" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="90" y="46" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Carrier API Data</text>
    
    <text x="30" y="105" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Family Shared Telecom Plan</text>
    <text x="30" y="132" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">Direct Official Gateway Connection</text>

    <!-- Sub item 1 -->
    <rect x="25" y="155" width="330" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="190" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Main Card Phone Balance</text>
    <text x="45" y="232" fill="#34d399" font-size="34" font-weight="800" font-family="system-ui, sans-serif">￥128.50</text>
    <text x="330" y="228" fill="#10b981" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">● Healthy</text>

    <!-- Sub item 2 -->
    <rect x="25" y="265" width="330" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="300" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Shared High-Speed Data</text>
    <text x="45" y="342" fill="#38bdf8" font-size="34" font-weight="800" font-family="system-ui, sans-serif">48.6 <tspan font-size="18">GB Left</tspan></text>
    <text x="330" y="338" fill="#64748b" font-size="13" text-anchor="end" font-family="system-ui, sans-serif">Total: 80 GB</text>

    <!-- Sub item 3 -->
    <rect x="25" y="375" width="330" height="115" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="408" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">Sub-Card 1 &amp; 2 Binding Status</text>
    <text x="45" y="440" fill="#cbd5e1" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Sub-Card 1: 340 Voice Minutes Left</text>
    <text x="45" y="470" fill="#cbd5e1" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Sub-Card 2: 12.2 GB Data Used</text>
  </g>

  <!-- Middle Section: Safe Local Bridge -->
  <g transform="translate(500, 220)">
    <rect width="440" height="520" rx="20" fill="url(#cardG)" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="150" y="25" width="140" height="32" rx="16" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="220" y="46" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Zero-Cloud Local Bridge</text>

    <text x="220" y="105" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Solve 3006 Device Not Trusted</text>
    <text x="220" y="132" fill="#64748b" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">Local Tool · No Password Exposed</text>

    <g transform="translate(35, 160)">
      <circle cx="20" cy="20" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="25" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">1-Click Local Python Script</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Runs purely in RAM, zero proxy</text>
    </g>

    <g transform="translate(35, 230)">
      <circle cx="20" cy="20" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="25" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Open Local Web UI via Phone</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Solve slider puzzle on your couch</text>
    </g>

    <g transform="translate(35, 300)">
      <circle cx="20" cy="20" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="25" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Offscreen Canvas Pixel Scanner</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Eliminates transparent padding</text>
    </g>

    <g transform="translate(35, 370)">
      <circle cx="20" cy="20" r="16" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="25" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Official Long-Lived DeviceId</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Authorize once, silent hourly sync</text>
    </g>

    <rect x="35" y="445" width="370" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="220" y="475" fill="#38bdf8" font-size="14" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Open Source: telecom-phone-device-id-tools</text>
  </g>

  <!-- Right Card: Home Assistant Dashboard -->
  <g transform="translate(980, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="130" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="46" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Home Assistant</text>

    <text x="30" y="105" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui, sans-serif">Smart Home Dashboard</text>
    <text x="30" y="132" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">Automated Alerts & Smart TTS</text>

    <rect x="25" y="155" width="330" height="105" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="65" cy="207" r="28" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
    <text x="65" y="213" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">HA</text>
    <text x="115" y="195" fill="#f8fafc" font-size="18" font-weight="700" font-family="system-ui, sans-serif">China Telecom Integration Active</text>
    <text x="115" y="222" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">18 Entities Generated · All Healthy</text>

    <rect x="25" y="275" width="330" height="105" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="305" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Low Balance Warning (Automation)</text>
    <text x="45" y="332" fill="#f59e0b" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Trigger: Balance < 20.00 CNY</text>
    <text x="45" y="358" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Action: Voice TTS Broadcast + Push Notification</text>

    <rect x="25" y="395" width="330" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="425" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">Data Exhaustion Alert (90% Threshold)</text>
    <text x="45" y="452" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Current Data: 72 / 80 GB Used</text>
    <text x="45" y="475" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Notify family members to avoid extra fee</text>
  </g>
</svg>
