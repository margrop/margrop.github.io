<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gaugeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>

  <rect x="490" y="45" width="460" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">家庭智能中控呈现方案</text>
  <text x="720" y="130" fill="#ffffff" font-size="38" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Lovelace 看板卡片设计与自动化联动链路</text>
  <text x="720" y="170" fill="#94a3b8" font-size="18" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">给新手打造一套高颜值、能看懂、有告警的家庭通信大屏</text>

  <g transform="translate(80, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="55" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">卡片 A: 话费余额环形仪表</text>
    <text x="30" y="85" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">卡片类型: Gauge 仪表盘</text>

    <path d="M 90 260 A 100 100 0 1 1 290 260" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
    <path d="M 90 260 A 100 100 0 1 1 275 195" fill="none" stroke="url(#gaugeG)" stroke-width="20" stroke-linecap="round"/>
    
    <text x="190" y="240" fill="#ffffff" font-size="44" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">￥128.5</text>
    <text x="190" y="275" fill="#34d399" font-size="16" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">账户状态充裕</text>

    <rect x="30" y="340" width="320" height="150" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="375" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">三级动态变色规则：</text>
    <circle cx="55" cy="405" r="6" fill="#10b981"/>
    <text x="75" y="410" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">&gt; 50 元: 健康绿（安心使用）</text>
    <circle cx="55" cy="435" r="6" fill="#f59e0b"/>
    <text x="75" y="440" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">20 ~ 50 元: 提醒橙（建议适时充值）</text>
    <circle cx="55" cy="465" r="6" fill="#ef4444"/>
    <text x="75" y="470" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">&lt; 20 元: 报警红（触发语音与推送）</text>
  </g>

  <g transform="translate(530, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="55" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">卡片 B: 通用流量与套餐详情</text>
    <text x="30" y="85" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">卡片类型: Entities 实体清单</text>

    <rect x="30" y="130" width="320" height="85" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="160" fill="#cbd5e1" font-size="15" font-weight="600" font-family="system-ui, sans-serif">通用高速流量</text>
    <text x="330" y="160" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">48.6 / 80 GB</text>
    <rect x="50" y="175" width="280" height="14" rx="7" fill="#1e293b"/>
    <rect x="50" y="175" width="170" height="14" rx="7" fill="#0284c7"/>

    <rect x="30" y="235" width="320" height="85" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="265" fill="#cbd5e1" font-size="15" font-weight="600" font-family="system-ui, sans-serif">国内免费通话分钟</text>
    <text x="330" y="265" fill="#34d399" font-size="15" font-weight="700" text-anchor="end" font-family="system-ui, sans-serif">620 / 1000 分钟</text>
    <rect x="50" y="280" width="280" height="14" rx="7" fill="#1e293b"/>
    <rect x="50" y="280" width="173" height="14" rx="7" fill="#10b981"/>

    <rect x="30" y="340" width="320" height="150" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="375" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">副卡消耗明细：</text>
    <text x="50" y="408" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">• 189xxxx0001 (长辈卡): 本月 2.4 GB</text>
    <text x="50" y="438" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">• 189xxxx0002 (儿童卡): 本月 8.1 GB</text>
    <text x="50" y="468" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">更新时间: 10分钟前 (静默轮询)</text>
  </g>

  <g transform="translate(980, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#0284c7" stroke-width="1.8"/>
    <text x="30" y="55" fill="#ffffff" font-size="22" font-weight="700" font-family="system-ui, sans-serif">自动化 C: 闭环预警与联动</text>
    <text x="30" y="85" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">场景: 低余额 &amp; 流量告警</text>

    <rect x="30" y="130" width="320" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="160" fill="#f59e0b" font-size="15" font-weight="700" font-family="system-ui, sans-serif">触发条件 (Trigger)</text>
    <text x="50" y="188" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">sensor.telecom_balance &lt; 20</text>
    <text x="50" y="210" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">当话费余额低于预警阈值</text>

    <path d="M 190 235 L 190 260" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

    <rect x="30" y="270" width="320" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="300" fill="#38bdf8" font-size="15" font-weight="700" font-family="system-ui, sans-serif">判断环境 (Condition)</text>
    <text x="50" y="328" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">有人在家 (state: home)</text>
    <text x="50" y="350" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">时间处于白天 (08:00 - 21:00)</text>

    <path d="M 190 375 L 190 400" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

    <rect x="30" y="410" width="320" height="100" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="50" y="438" fill="#10b981" font-size="15" font-weight="700" font-family="system-ui, sans-serif">执行动作 (Action)</text>
    <text x="50" y="465" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 智能音箱播报: "主人，电信话费仅剩..."</text>
    <text x="50" y="490" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 手机 HA App: 推送点击直达充值链接</text>
  </g>
</svg>
