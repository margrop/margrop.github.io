      <text x="20" y="25" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">本机一键运行 Python 脚本</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">纯内存运行，无第三方服务器转接</text>
    </g>

    <g transform="translate(35, 230)">
      <circle cx="20" cy="20" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="25" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">局域网手机打开 Web 页面</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">躺在沙发上即可完成滑块拼图</text>
    </g>

    <g transform="translate(35, 300)">
      <circle cx="20" cy="20" r="16" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="25" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">离屏 Canvas 像素校准</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">剔除透明留白，滑块校验 100% 通过</text>
    </g>

    <g transform="translate(35, 370)">
      <circle cx="20" cy="20" r="16" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="25" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
      <text x="50" y="18" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">签发长效受信任 DeviceId</text>
      <text x="50" y="38" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">仅需一次授权，终身静默轮询更新</text>
    </g>

    <rect x="35" y="445" width="370" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="220" y="475" fill="#38bdf8" font-size="14" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">开源小工具：telecom-phone-device-id-tools</text>
  </g>

  <!-- Right Card: Home Assistant Dashboard -->
  <g transform="translate(980, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="130" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="46" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Home Assistant</text>

    <text x="30" y="105" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui, sans-serif">家庭中控大屏呈现</text>
    <text x="30" y="132" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">自动化预警 · 联动语音播报</text>

    <rect x="25" y="155" width="330" height="105" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="65" cy="207" r="28" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
    <text x="65" y="213" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">HA</text>
    <text x="115" y="195" fill="#f8fafc" font-size="18" font-weight="700" font-family="system-ui, sans-serif">中国电信集成就绪</text>
    <text x="115" y="222" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">已生成 18 个实体 · 状态全部健康</text>

    <rect x="25" y="275" width="330" height="105" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="305" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">低话费自动化预警 (Automation)</text>
    <text x="45" y="332" fill="#f59e0b" font-size="14" font-weight="600" font-family="system-ui, sans-serif">触发条件: 余额低于 20.00 元</text>
    <text x="45" y="358" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">执行动作: 客厅音箱语音提醒 + 手机推送</text>

    <rect x="25" y="395" width="330" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="425" fill="#e2e8f0" font-size="15" font-weight="600" font-family="system-ui, sans-serif">流量耗尽预警 (90% 阈值)</text>
    <text x="45" y="452" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">当月通用流量已用 72 / 80 GB</text>
    <text x="45" y="475" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">自动关闭副卡高速热点</text>
  </g>
</svg>
