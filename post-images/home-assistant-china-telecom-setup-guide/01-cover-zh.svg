    <text x="45" y="300" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">通用高速共享流量</text>
    <text x="45" y="342" fill="#38bdf8" font-size="34" font-weight="800" font-family="system-ui, sans-serif">48.6 <tspan font-size="18">GB 剩余</tspan></text>
    <text x="330" y="338" fill="#64748b" font-size="13" text-anchor="end" font-family="system-ui, sans-serif">总量 80 GB</text>

    <!-- Sub item 3 -->
    <rect x="25" y="375" width="330" height="115" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="408" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">副卡 1 &amp; 副卡 2 绑定状态</text>
    <text x="45" y="440" fill="#cbd5e1" font-size="16" font-weight="600" font-family="system-ui, sans-serif">副卡 1 (长辈机): 剩余通话 340 分钟</text>
    <text x="45" y="470" fill="#cbd5e1" font-size="16" font-weight="600" font-family="system-ui, sans-serif">副卡 2 (学生机): 本月已用 12.2 GB</text>
  </g>

  <!-- Middle Section: Safe Local Bridge -->
  <g transform="translate(500, 220)">
    <rect width="440" height="520" rx="20" fill="url(#cardG)" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="150" y="25" width="140" height="32" rx="16" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
    <text x="220" y="46" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">本地自研零云端网桥</text>

