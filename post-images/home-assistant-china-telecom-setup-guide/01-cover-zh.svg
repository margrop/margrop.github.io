<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>
  
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="320" x2="1440" y2="320"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="640" x2="1440" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="820"/>
    <line x1="480" y1="0" x2="480" y2="820"/>
    <line x1="720" y1="0" x2="720" y2="820"/>
    <line x1="960" y1="0" x2="960" y2="820"/>
    <line x1="1200" y1="0" x2="1200" y2="820"/>
  </g>

  <!-- Header Badge -->
  <rect x="520" y="45" width="400" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">HOME ASSISTANT 新手小白保姆级教程</text>

  <!-- Main Title -->
  <text x="720" y="130" fill="#ffffff" font-size="40" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">告别 3006 报错！中国电信话费与流量接入全指南</text>
  <text x="720" y="172" fill="#94a3b8" font-size="20" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">零云端依赖 · 杜绝密码外泄 · 10分钟打造全家通信资产实时大屏看板</text>

  <!-- Left Card: Carrier Account -->
  <g transform="translate(80, 220)">
    <rect width="380" height="520" rx="20" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="130" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="90" y="46" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">中国电信官方数据</text>
    
    <text x="30" y="105" fill="#e2e8f0" font-size="22" font-weight="700" font-family="system-ui, sans-serif">全家手机主副卡套餐</text>
    <text x="30" y="132" fill="#64748b" font-size="14" font-family="system-ui, sans-serif">电信官方云端网关接口直连</text>

    <!-- Sub item 1 -->
    <rect x="25" y="155" width="330" height="95" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="45" y="190" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif">主卡实时话费余额</text>
    <text x="45" y="232" fill="#34d399" font-size="34" font-weight="800" font-family="system-ui, sans-serif">￥128.50</text>
    <text x="330" y="228" fill="#10b981" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, sans-serif">● 状态充盈</text>

    <!-- Sub item 2 -->
