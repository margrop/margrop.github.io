<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    Elementary Analogy: Bank Teller & The Registered RFID Keycard
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    Why Carrier Gateways Reject Correct PINs Without a Registered DeviceId
  </text>

  <!-- Box 1: Password -->
  <g transform="translate(100, 160)">
    <rect width="280" height="340" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="50" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🔑</text>
    <text x="140" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">1. Carrier Service PIN</text>
    <text x="140" y="115" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Analogy: Memorized Spoken Secret</text>
    <rect x="25" y="140" width="230" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• A memorized 6-digit number</tspan>
      <tspan x="25" dy="26">• Anyone who overhears it could say it</tspan>
      <tspan x="25" dy="26">• Teller thinks: 'You know the secret,</tspan>
      <tspan x="25" dy="22">  but how do I know you're not a thief?'</tspan>
      <tspan x="25" dy="30">• Secrets alone cannot prove device trust!</tspan>
    </text>
  </g>

  <!-- Box 2: SMS -->
  <g transform="translate(410, 160)">
    <rect width="280" height="340" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="50" fill="#34d399" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🎫</text>
    <text x="140" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">2. SMS Verification Code</text>
    <text x="140" y="115" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Analogy: One-Time Paper Queue Slip</text>
    <rect x="25" y="140" width="230" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• Can only be received if phone is in hand</tspan>
      <tspan x="25" dy="26">• Proves 'the real owner is physically here'</tspan>
      <tspan x="25" dy="26">• Different every time; expires in minutes</tspan>
      <tspan x="25" dy="26">• Downside: HA checks balances hourly,</tspan>
      <tspan x="25" dy="22">  you cannot approve SMS codes every hour!</tspan>
    </text>
  </g>

  <!-- Box 3: DeviceId -->
  <g transform="translate(720, 160)">
    <rect width="280" height="340" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="50" fill="#10b981" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🪪</text>
    <text x="140" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">3. Issued DeviceId Token</text>
    <text x="140" y="115" fill="#34d399" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Analogy: Registered RFID Hardware Card</text>
    <rect x="25" y="140" width="230" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• Issued after presenting both PIN and SMS ticket</tspan>
      <tspan x="25" dy="26">• Bank issues a cryptographic hardware keycard</tspan>
      <tspan x="25" dy="26">• Uniquely tied to your specific machine</tspan>
      <tspan x="25" dy="26">• Future hourly polls just tap card + PIN,</tspan>
      <tspan x="25" dy="22">  with zero recurring SMS interruptions!</tspan>
    </text>
  </g>

  <!-- Box 4: 3006 Error -->
  <g transform="translate(1030, 160)">
    <rect width="310" height="340" rx="14" fill="url(#cardBg)" stroke="#ef4444" stroke-width="2"/>
    <text x="155" y="50" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🛑</text>
    <text x="155" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">4. Why Does Error 3006 Happen?</text>
    <text x="155" y="115" fill="#f87171" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">Analogy: Stranger with No Registered Card</text>
    <rect x="25" y="140" width="260" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• A fresh HA installation is an unknown device</tspan>
      <tspan x="25" dy="26">• It walked up to the counter shouting only PIN</tspan>
      <tspan x="25" dy="26">• Teller shouts: 'Untrusted Device (3006)!</tspan>
      <tspan x="25" dy="22">  Where is your registered RFID keycard?'</tspan>
      <tspan x="25" dy="28">• Solution: Perform one-time SMS verification,</tspan>
      <tspan x="25" dy="22">  get the DeviceId, and pass it to HA!</tspan>
    </text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(100, 530)">
    <rect width="1240" height="210" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">💡 Why Does Broadband WiFi Cellular Gateway Auto-Login Fail?</text>
    <text x="40" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" line-height="1.8">
      <tspan x="40" dy="0">When on mobile 4G/5G networks, carrier cell towers directly read SIM cryptographic identities for silent auto-login;</tspan>
      <tspan x="40" dy="28">Over home broadband WiFi and fiber Ethernet, cell towers cannot see SIM cards, returning 'Environment Not Supported';</tspan>
      <tspan x="40" dy="28">Therefore, running the official synchronous SMS challenge flow is the only reliable path to obtain this device credential.</tspan>
    </text>
  </g>
</svg>