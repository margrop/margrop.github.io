<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>

  <rect x="500" y="45" width="440" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">常见疑问与故障秒查</text>
  <text x="720" y="130" fill="#ffffff" font-size="38" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">新手避坑自检清单与排障决策树</text>
  <text x="720" y="170" fill="#94a3b8" font-size="18" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">遇到问题不要慌，对号入座 1 分钟快速定位解决</text>

  <!-- Problem 1 -->
  <g transform="translate(60, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="25" y="25" width="100" height="32" rx="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="75" y="46" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">报错 3006</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">提示“设备未信任”</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">发生阶段: 保存集成配置时</text>

    <rect x="20" y="145" width="260" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#f87171" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 核心原因：</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">电信官方接口要求出示</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">受信任硬件凭证 (DeviceId)，</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">仅填服务密码会被风控拒绝。</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(就像去银行取钱只报口头密码)</text>

    <rect x="20" y="315" width="260" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 一秒解决：</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">运行本文提供的一键脚本，</text>
    <text x="35" y="398" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">在本地网页滑动一次拼图，</text>
    <text x="35" y="421" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">提取出 DeviceId 字符串，</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">粘贴进集成配置重新保存。</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">立马绿灯放行！</text>
  </g>

  <!-- Problem 2 -->
  <g transform="translate(390, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="25" y="25" width="100" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="46" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">滑块失败</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">滑块提示偏差过大</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">发生阶段: 本地工具滑动拼图时</text>

    <rect x="20" y="145" width="260" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#fbbf24" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 核心原因：</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">电信下发的滑块小图四周有</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">肉眼看不见的透明留白空气，</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">或者网络缓慢图片尚未载入。</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(就像拼图卡片边框贴了透明胶)</text>

    <rect x="20" y="315" width="260" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 一秒解决：</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">我们的开源工具已内置</text>
    <text x="35" y="398" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">离屏 Canvas 像素扫描算法，</text>
    <text x="35" y="421" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">若偶尔失败，点击右上角</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">“刷新拼图”，匀速拖拽到位。</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">通常 1~2 次内百分百通过。</text>
  </g>

  <!-- Problem 3 -->
  <g transform="translate(720, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="25" y="25" width="100" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="75" y="46" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">实体未知</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">状态显示 unknown</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">发生阶段: 刚添加集成或HA重启</text>

    <rect x="20" y="145" width="260" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 核心原因：</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">现代优雅架构设计：</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">HA 先把 18 个实体空位占好，</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">后台异步协程正在拉取数据。</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(就像开学先占座，再点名入座)</text>

    <rect x="20" y="315" width="260" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 一秒解决：</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">完全无需惊慌！耐心等待</text>
    <text x="35" y="398" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">30 ~ 60 秒钟，</text>
    <text x="35" y="421" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">首次轮询网络请求完毕后，</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">状态数值将自动点亮浮现。</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">刷新浏览器页面即可看见。</text>
  </g>

  <!-- Problem 4 -->
  <g transform="translate(1050, 220)">
    <rect width="330" height="520" rx="18" fill="url(#cardG)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="25" y="25" width="110" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="46" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">主副卡全家桶</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">如何添加家庭多张卡</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">场景: 1主卡 + 多副卡宽带套餐</text>

    <rect x="20" y="145" width="290" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 机制说明：</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">主卡负责整个家庭账户余额，</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">副卡共享主卡流量池，</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">但每张卡有独立的通话与使用量。</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(就像同一个水库引出多条水管)</text>

    <rect x="20" y="315" width="290" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 正确接入姿势：</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">在 HA 集成页面点击“添加条目”，</text>
    <text x="35" y="398" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">分别为主卡和副卡提取 DeviceId，</text>
    <text x="35" y="421" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">作为独立条目添加进去即可。</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">并发安全锁会自动排队同步，</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">数据完全独立互不干扰！</text>
  </g>
</svg>
