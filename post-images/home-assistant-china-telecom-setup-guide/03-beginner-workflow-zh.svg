<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>

  <rect x="520" y="45" width="400" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">从零到大屏：新手实战路线图</text>
  <text x="720" y="130" fill="#ffffff" font-size="38" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">中国电信接进 Home Assistant 四步极速通关</text>
  <text x="720" y="170" fill="#94a3b8" font-size="18" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">逻辑清晰、步骤精简、不踩坑、不折腾</text>

  <!-- Step 1 -->
  <g transform="translate(60, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="68" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">准备电信凭证</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">30秒获取两项基础信息</text>
    
    <rect x="20" y="195" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">所需材料清单：</text>
    <text x="35" y="255" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">• 手机号码 (11位)</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">• 电信服务密码 (6位)</text>
    <text x="35" y="315" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">忘密码可在电信App一键重置</text>

    <rect x="20" y="350" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#f59e0b" font-size="14" font-weight="600" font-family="system-ui, sans-serif">⚠️ 避坑提醒：</text>
    <text x="35" y="410" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">千万不要直接把密码提交</text>
    <text x="35" y="432" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">给任何第三方陌生反代服务器！</text>
    <text x="35" y="460" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">请使用官方或本地自研工具</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(390, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#0284c7" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="68" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">获取受信任 DeviceId</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">攻克 3006 报错核心一步</text>

    <rect x="20" y="195" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">一键执行本地脚本：</text>
    <text x="35" y="255" fill="#38bdf8" font-size="13" font-family="monospace">python3 server.py</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">打开手机网页完成滑块拼图</text>
    <text x="35" y="315" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">输入手机验证码</text>

    <rect x="20" y="350" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">✅ 获得成果：</text>
    <text x="35" y="410" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, sans-serif">长效受信任 DeviceId 字符串</text>
    <text x="35" y="435" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">有效期通常可达数月甚至数年</text>
    <text x="35" y="460" fill="#10b981" font-size="13" font-weight="600" font-family="system-ui, sans-serif">后续静默轮询，无需再发短信</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(720, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="68" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">HA 添加集成并绑定</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">只需在界面上粘贴三行数据</text>

    <rect x="20" y="195" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">配置弹窗输入三项：</text>
    <text x="35" y="255" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">1. 手机号码: 189xxxx</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">2. 服务密码: ******</text>
    <text x="35" y="315" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">3. 设备标识: 粘贴 DeviceId</text>

    <rect x="20" y="350" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🎯 自动发现实体：</text>
    <text x="35" y="410" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">系统自动生成 18 个标准传感器：</text>
    <text x="35" y="435" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">话费余额 / 通用流量 / 本月账单</text>
    <text x="35" y="460" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">通话时长 / 定向流量 / 更新时间</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1050, 220)">
    <rect width="330" height="520" rx="18" fill="url(#cardG)" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
    <text x="60" y="68" fill="#34d399" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">大屏卡片与自动化联动</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">享受家庭中控智慧体验</text>

    <rect x="20" y="195" width="290" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Lovelace 精美卡片：</text>
    <text x="35" y="255" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 余额仪表盘 (绿/橙/红变色)</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 流量消耗圆环进度条</text>
    <text x="35" y="315" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Mushroom 现代极简芯片卡</text>

    <rect x="20" y="350" width="290" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🤖 贴心自动化场景：</text>
    <text x="35" y="410" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 话费余额 &lt; 20元: 音箱温馨提醒</text>
    <text x="35" y="435" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• 流量超标 90%: 微信/App 弹窗</text>
    <text x="35" y="460" fill="#34d399" font-size="13" font-weight="600" font-family="system-ui, sans-serif">再也不用担心家里欠费停机断网！</text>
  </g>
</svg>
