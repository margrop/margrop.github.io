<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>

  <rect x="520" y="45" width="400" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">ZERO TO DASHBOARD: BEGINNER PRACTICAL ROADMAP</text>
  <text x="720" y="130" fill="#ffffff" font-size="38" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4 Steps to Integrate China Telecom into Home Assistant</text>
  <text x="720" y="170" fill="#94a3b8" font-size="18" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">Clear Logic · Simple Steps · Zero Hassle · Rock Solid</text>

  <!-- Step 1 -->
  <g transform="translate(60, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="68" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Prepare Credentials</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Get 2 basic items in 30 seconds</text>
    
    <rect x="20" y="195" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Required items:</text>
    <text x="35" y="255" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">• Phone number (11 digits)</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif">• 6-digit service PIN / password</text>
    <text x="35" y="315" fill="#64748b" font-size="12" font-family="system-ui, sans-serif">Can be reset via Carrier App</text>

    <rect x="20" y="350" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#f59e0b" font-size="14" font-weight="600" font-family="system-ui, sans-serif">⚠️ Security Warning:</text>
    <text x="35" y="410" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Never submit your password to</text>
    <text x="35" y="432" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">unknown 3rd-party proxy servers!</text>
    <text x="35" y="460" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Use our local offline zero-cloud tool</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(390, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#0284c7" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="68" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Get Trusted DeviceId</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Core step to eliminate 3006 error</text>

    <rect x="20" y="195" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Run 1-click local script:</text>
    <text x="35" y="255" fill="#38bdf8" font-size="13" font-family="monospace">python3 server.py</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Open web page on phone to solve slider</text>
    <text x="35" y="315" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Input SMS verification code</text>

    <rect x="20" y="350" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">✅ Result:</text>
    <text x="35" y="410" fill="#e2e8f0" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Trusted DeviceId string</text>
    <text x="35" y="435" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Valid for months or years</text>
    <text x="35" y="460" fill="#10b981" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Silent background sync, no more SMS</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(720, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="68" fill="#38bdf8" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">3</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Add HA Integration</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Paste 3 fields in the UI modal</text>

    <rect x="20" y="195" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Input into config modal:</text>
    <text x="35" y="255" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">1. Phone number</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">2. Service password</text>
    <text x="35" y="315" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">3. DeviceId (pasted)</text>

    <rect x="20" y="350" width="260" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🎯 Auto-discovered Entities:</text>
    <text x="35" y="410" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Auto-generates 18 standard sensors:</text>
    <text x="35" y="435" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Phone Balance / Data Quota / Monthly Bill</text>
    <text x="35" y="460" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Voice Minutes / App Data / Last Updated</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(1050, 220)">
    <rect width="330" height="520" rx="18" fill="url(#cardG)" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="70" rx="35" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
    <text x="60" y="68" fill="#34d399" font-size="28" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4</text>
    
    <text x="25" y="135" fill="#ffffff" font-size="20" font-weight="700" font-family="system-ui, sans-serif">Dashboard & Automation</text>
    <text x="25" y="162" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Enjoy smart home central control</text>

    <rect x="20" y="195" width="290" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="225" fill="#94a3b8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">Lovelace Cards:</text>
    <text x="35" y="255" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Balance Gauge (Green/Orange/Red)</text>
    <text x="35" y="285" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Data Quota Progress Bar</text>
    <text x="35" y="315" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Mushroom Modern Chip Cards</text>

    <rect x="20" y="350" width="290" height="135" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="380" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🤖 Smart Automation:</text>
    <text x="35" y="410" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Balance &lt; 20 CNY: TTS Voice alert</text>
    <text x="35" y="435" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Data &gt; 90%: Phone App Notification</text>
    <text x="35" y="460" fill="#34d399" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Never worry about unexpected broadband cutoffs!</text>
  </g>
</svg>
