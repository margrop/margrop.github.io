<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    小学生秒懂比方：银行柜台与专用门禁芯片卡
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    为什么 Home Assistant 明明填对了电信服务密码，却还是被官方拒之门外？
  </text>

  <!-- Box 1: Password -->
  <g transform="translate(100, 160)">
    <rect width="280" height="340" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="50" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🔑</text>
    <text x="140" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">1. 电信服务密码</text>
    <text x="140" y="115" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生活比方：口头暗号</text>
    <rect x="25" y="140" width="230" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• 是一串记住的 6 位数字</tspan>
      <tspan x="25" dy="26">• 任何人只要偷听到都能念出来</tspan>
      <tspan x="25" dy="26">• 柜员心想：“你能说对暗号，</tspan>
      <tspan x="25" dy="22">  但我怎么知道你是不是小偷？”</tspan>
      <tspan x="25" dy="30">• 仅凭暗号无法证明设备安全！</tspan>
    </text>
  </g>

  <!-- Box 2: SMS -->
  <g transform="translate(410, 160)">
    <rect width="280" height="340" rx="14" fill="url(#cardBg)" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="50" fill="#34d399" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🎫</text>
    <text x="140" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">2. 短信验证码</text>
    <text x="140" y="115" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生活比方：现场排队号票</text>
    <rect x="25" y="140" width="230" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• 必须手机在身边才能收到</tspan>
      <tspan x="25" dy="26">• 证明“主人此时此刻在现场”</tspan>
      <tspan x="25" dy="26">• 每次都不一样，几分钟作废</tspan>
      <tspan x="25" dy="26">• 缺点：智能家居每小时查余额，</tspan>
      <tspan x="25" dy="22">  总不能每小时给你发条短信！</tspan>
    </text>
  </g>

  <!-- Box 3: DeviceId -->
  <g transform="translate(720, 160)">
    <rect width="280" height="340" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="50" fill="#10b981" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🪪</text>
    <text x="140" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">3. 授权凭证 DeviceId</text>
    <text x="140" y="115" fill="#34d399" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生活比方：专属门禁芯片卡</text>
    <rect x="25" y="140" width="230" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• 凭“暗号+排队号”去柜台办理</tspan>
      <tspan x="25" dy="26">• 银行给你的设备颁发专属芯片卡</tspan>
      <tspan x="25" dy="26">• 绑定了这台特定的设备硬件</tspan>
      <tspan x="25" dy="26">• 以后每天只用“刷卡+暗号”，</tspan>
      <tspan x="25" dy="22">  再也不用反复发短信！</tspan>
    </text>
  </g>

  <!-- Box 4: 3006 Error -->
  <g transform="translate(1030, 160)">
    <rect width="310" height="340" rx="14" fill="url(#cardBg)" stroke="#ef4444" stroke-width="2"/>
    <text x="155" y="50" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="32" text-anchor="middle">🛑</text>
    <text x="155" y="90" fill="#f8fafc" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" font-weight="700" text-anchor="middle">4. 为什么报 3006 错误？</text>
    <text x="155" y="115" fill="#f87171" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle">生活比方：陌生人没带卡</text>
    <rect x="25" y="140" width="260" height="1" fill="#334155"/>
    <text x="25" y="170" fill="#cbd5e1" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="25" dy="0">• HA 刚装好时，是一个陌生设备</tspan>
      <tspan x="25" dy="26">• 它直接跑去柜台报了服务密码</tspan>
      <tspan x="25" dy="26">• 柜员大喊：“设备未信任(3006)！</tspan>
      <tspan x="25" dy="22">  你的专用门禁芯片卡呢？”</tspan>
      <tspan x="25" dy="28">• 破局：必须先用短信完成一次授权，</tspan>
      <tspan x="25" dy="22">  拿到专属卡(DeviceId)再给 HA！</tspan>
    </text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(100, 530)">
    <rect width="1240" height="210" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">💡 为什么宽带 WiFi 尝试“免密登录”也会失败？</text>
    <text x="40" y="85" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" line-height="1.8">
      <tspan x="40" dy="0">我们在实测中抓包了电信官方的“天翼免密”接口。手机在 4G/5G 蜂窝网络下，运营商基站可以直接读取 SIM 卡硬件身份完成认证；</tspan>
      <tspan x="40" dy="28">但当我们坐在家里的宽带 WiFi 下时，路由器走的是光纤以太网，基站根本看不见你的 SIM 卡！接口直接返回“当前环境不支持免密登录”。</tspan>
      <tspan x="40" dy="28">因此，想在局域网内优雅且安全地获取这块“专属芯片卡”，唯一合规、可靠的路径，就是运行官方短信授权协议链。</tspan>
    </text>
  </g>
</svg>