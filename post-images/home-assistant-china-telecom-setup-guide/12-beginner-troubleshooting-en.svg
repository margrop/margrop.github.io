<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="820" fill="url(#bgG)"/>

  <rect x="500" y="45" width="440" height="38" rx="19" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="720" y="69" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1.5">FREQUENT QUESTIONS & QUICK TROUBLESHOOTING</text>
  <text x="720" y="130" fill="#ffffff" font-size="38" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Beginner Self-Check Checklist & Troubleshooting Tree</text>
  <text x="720" y="170" fill="#94a3b8" font-size="18" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">Don't panic when issues arise: diagnose and resolve in 1 minute</text>

  <!-- Problem 1 -->
  <g transform="translate(60, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="25" y="25" width="100" height="32" rx="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="75" y="46" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Error 3006</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">Device Not Trusted</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Phase: Saving Integration Config</text>

    <rect x="20" y="145" width="260" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#f87171" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 Root Cause:</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Telecom carrier API strictly requires</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">a trusted hardware token (DeviceId).</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Service password alone triggers 3006.</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(Like bank teller demanding chip ID card)</text>

    <rect x="20" y="315" width="260" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 Quick Solution:</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Run our 1-click local offline script,</text>
    <text x="35" y="398" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">solve the slider puzzle on local web UI,</text>
    <text x="35" y="421" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">extract the trusted DeviceId string,</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">paste into HA config modal and save.</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Instant green light!</text>
  </g>

  <!-- Problem 2 -->
  <g transform="translate(390, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="25" y="25" width="100" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="46" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Slider Failed</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">Trajectory Mismatch</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Phase: Solving Slider on Local Web UI</text>

    <rect x="20" y="145" width="260" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#fbbf24" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 Root Cause:</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Telecom slider piece has invisible</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">transparent padding margin,</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">or image was dragged before fully loaded.</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(Like puzzle pieces surrounded by film)</text>

    <rect x="20" y="315" width="260" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 Quick Solution:</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Our open-source tool includes</text>
    <text x="35" y="398" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">offscreen Canvas pixel scanner.</text>
    <text x="35" y="421" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">If failed, click Refresh at top right</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">and slide at an even, natural pace.</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">100% pass within 1-2 attempts.</text>
  </g>

  <!-- Problem 3 -->
  <g transform="translate(720, 220)">
    <rect width="300" height="520" rx="18" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="25" y="25" width="100" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="75" y="46" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Unknown State</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">Entities Show 'unknown'</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Phase: Initial Setup or HA Reboot</text>

    <rect x="20" y="145" width="260" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 Root Cause:</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Modern resilient design:</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">HA pre-registers placeholder slots,</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">background task fetches data asynchronously.</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(Like classroom seats reserved before roll call)</text>

    <rect x="20" y="315" width="260" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 Quick Solution:</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">No need to worry! Just wait</text>
    <text x="35" y="398" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">30 to 60 seconds,</text>
    <text x="35" y="421" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">once first background sync completes,</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">all sensor values light up automatically.</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">Refresh browser page to see live data.</text>
  </g>

  <!-- Problem 4 -->
  <g transform="translate(1050, 220)">
    <rect width="330" height="520" rx="18" fill="url(#cardG)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="25" y="25" width="110" height="32" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="80" y="46" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Family Plans</text>

    <text x="25" y="95" fill="#ffffff" font-size="18" font-weight="700" font-family="system-ui, sans-serif">Adding Multiple Sub-Cards</text>
    <text x="25" y="120" fill="#64748b" font-size="13" font-family="system-ui, sans-serif">Scenario: Main Card + Shared Sub-Cards</text>

    <rect x="20" y="145" width="290" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="175" fill="#34d399" font-size="14" font-weight="600" font-family="system-ui, sans-serif">🔍 How it works:</text>
    <text x="35" y="202" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Main card holds total family balance,</text>
    <text x="35" y="224" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">sub-cards share the high-speed data pool,</text>
    <text x="35" y="246" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">with independent voice and data usages.</text>
    <text x="35" y="275" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">(Like multiple taps drawing from one reservoir)</text>

    <rect x="20" y="315" width="290" height="175" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="35" y="345" fill="#38bdf8" font-size="14" font-weight="600" font-family="system-ui, sans-serif">💡 Proper Setup Method:</text>
    <text x="35" y="375" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Click 'Add Entry' in HA Integrations page,</text>
    <text x="35" y="398" fill="#38bdf8" font-size="13" font-weight="600" font-family="system-ui, sans-serif">extract DeviceId for each phone number,</text>
    <text x="35" y="421" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">and add each as an independent entry.</text>
    <text x="35" y="444" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">Async lock serializes requests safely,</text>
    <text x="35" y="472" fill="#10b981" font-size="12" font-weight="600" font-family="system-ui, sans-serif">data stays completely independent!</text>
  </g>
</svg>
