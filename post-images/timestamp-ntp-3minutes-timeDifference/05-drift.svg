    </defs><text x="40" y="48" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#e2e8f0" font-weight="700">无人校时的钟，会自己“走偏”（时钟漂移）</text><text x="40" y="78" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" font-weight="400">像两只便宜的手表：都以为自己在好好走，两周后能差出半分钟</text><rect x="40" y="110" width="920" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/><line x1="110" y1="150" x2="110" y2="350" stroke="#334155" stroke-width="2"/><line x1="110" y1="350" x2="890" y2="350" stroke="#334155" stroke-width="2"/><text x="98" y="250" text-anchor="end" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">偏差(秒)</text><text x="890" y="380" text-anchor="end" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">→ 天数</text><text x="500.0" y="380" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="400">第 7 天</text><text x="890" y="380" text-anchor="end" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="400">第 14 天</text><line x1="110" y1="336" x2="890" y2="336" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/><text x="114" y="330" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" font-weight="400">0（与标准时间一致）</text><polyline points="110,334 162,337 214,335 266,338 318,334 370,337 422,334 474,337 526,335 578,338 630,334 682,337 734,334 786,337 838,335" fill="none" stroke="#34d399" stroke-width="3"/><text x="118" y="146" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#34d399" font-weight="700">每天自动对时（NTP 开启）</text><polyline points="110,336.0 162,333.6 214,331.2 266,328.8 318,326.4 370,324.0 422,321.6 474,319.2 526,316.8 578,314.4 630,312.0 682,309.6 734,307.2 786,304.8 838,302.4" fill="none" stroke="#f87171" stroke-width="3"/><text x="410" y="156" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#f87171" font-weight="700">无人校时（石英晶振自由跑）</text><text x="410" y="178" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="400">每天快 ~2 秒，两周差 ~30 秒</text><circle cx="838" cy="302" r="6" fill="#f87171"/><rect x="560" y="340" width="400" height="52" rx="10" fill="#3f1d24" stroke="#f87171" stroke-width="2"/><text x="760" y="362" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#f87171" font-weight="700">日志排序错乱、定时任务错过、</text><text x="760" y="384" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#f87171" font-weight="700">TLS/Kerberos 校验失败……都从这开始</text><text x="40" y="445" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">示意图。普通电脑的石英晶振每天可能快/慢 1~几秒，温度、老化、虚拟机调度都会放大它。</text></svg>