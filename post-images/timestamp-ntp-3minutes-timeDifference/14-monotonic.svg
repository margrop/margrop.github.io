    </defs><text x="40" y="48" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#e2e8f0" font-weight="700">两种“时间”：墙钟会倒退，秒表不会</text><text x="40" y="78" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" font-weight="400">挂钟可能被家长调准（突然倒退）；跑步计时器只管流逝，永远前进</text><rect x="40" y="110" width="440" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/><text x="60" y="140" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="18" fill="#fbbf24" font-weight="700">墙钟 wall clock</text><line x1="90" y1="350" x2="430" y2="350" stroke="#334155" stroke-width="2"/><line x1="90" y1="170" x2="90" y2="350" stroke="#334155" stroke-width="2"/><path d="M 90 340 L 170 300 L 260 250 L 330 265 L 330 330 L 410 270" fill="none" stroke="#fbbf24" stroke-width="3"/><circle cx="330" cy="265" r="7" fill="#f87171"/><path d="M 330 265 L 330 330" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="5 5"/><text x="330" y="250" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#f87171" font-weight="700">NTP 校正：突然回拨</text><text x="60" y="392" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#e2e8f0" font-weight="400">适合：显示今天几号、写日志时间</text><text x="60" y="414" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">风险：倒退会让“排队序号”突然乱掉</text><rect x="520" y="110" width="440" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/><text x="540" y="140" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="18" fill="#34d399" font-weight="700">单调时钟 monotonic clock</text><line x1="570" y1="350" x2="910" y2="350" stroke="#334155" stroke-width="2"/><line x1="570" y1="170" x2="570" y2="350" stroke="#334155" stroke-width="2"/><line x1="570" y1="340" x2="910" y2="185" stroke="#34d399" stroke-width="4"/><text x="700" y="220" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#34d399" font-weight="700">只会前进</text><text x="540" y="392" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#e2e8f0" font-weight="400">适合：计算“某件事花了多久”</text><text x="540" y="414" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">就像跑步计时器：不管几号，只管跑了多久</text><text x="40" y="448" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">结论：测量耗时用单调时钟；记录业务时刻用墙钟 + 时间戳。二者别混用。</text></svg>