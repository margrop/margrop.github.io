      <marker id="arr-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker>
      <marker id="arr-f87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/></marker>
      <marker id="arr-7dd3fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/></marker>
      <marker id="arr-f472b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6"/></marker>
      
    </defs><text x="40" y="48" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#e2e8f0" font-weight="700">对表的诀窍：打一个“时间电话”，来回记 4 个数</text><text x="40" y="78" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" font-weight="400">你问同伴“现在几点”——一问一答之间，把网络延迟也考虑进去，才能算得准</text><rect x="110" y="70" width="260" height="44" rx="10" fill="#132033" stroke="#7dd3fc" stroke-width="2"/><text x="240" y="100" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="16" fill="#7dd3fc" font-weight="700">你的服务器（客户端）</text><rect x="630" y="70" width="260" height="44" rx="10" fill="#132033" stroke="#34d399" stroke-width="2"/><text x="760" y="100" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="16" fill="#34d399" font-weight="700">NTP 服务器</text><line x1="240" y1="120" x2="240" y2="400" stroke="#334155" stroke-width="3"/><line x1="760" y1="120" x2="760" y2="400" stroke="#334155" stroke-width="3"/><line x1="240" y1="210.0" x2="760" y2="170.0" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arr-7dd3fc)"/><text x="500.0" y="160.0" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#7dd3fc" font-weight="700">① “现在几点？”（附上我发出时刻 T1）</text><text x="740" y="200.0" text-anchor="end" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#34d399" font-weight="400">T2 = 收到时刻</text><line x1="760" y1="280.0" x2="240" y2="320.0" stroke="#34d399" stroke-width="3" marker-end="url(#arr-34d399)"/><text x="500.0" y="275.0" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#34d399" font-weight="700">② “现在是 T3”（附上回复时刻 T3）</text><text x="260" y="305.0" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#7dd3fc" font-weight="400">T4 = 收到回复的时刻</text><rect x="120" y="410" width="760" height="96" rx="12" fill="#10233b" stroke="#334155" stroke-width="2"/><text x="150" y="442" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#e2e8f0" font-weight="700">时钟偏差 ≈ [(T2−T1) + (T3−T4)] ÷ 2</text><text x="150" y="474" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#94a3b8" font-weight="400">网络单程延迟 ≈ (T4−T1) − (T3−T2)，来回越对称，估得越准</text><text x="40" y="545" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">就像打电话对表：报两次时间，再扣掉“电话来回”的耗时，你就能估出自己手表快了还是慢了几秒。</text></svg>