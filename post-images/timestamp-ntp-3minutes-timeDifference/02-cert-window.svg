    </defs><text x="40" y="48" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#e2e8f0" font-weight="700">TLS 证书有效期 vs 一台慢了的时钟</text><text x="40" y="78" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" font-weight="400">牛奶保质期打比方：盒子上的日期没到 / 已过，工厂里的牛奶都可能是好的</text><rect x="40" y="110" width="920" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/><line x1="80" y1="330" x2="920" y2="330" stroke="#334155" stroke-width="3"/><rect x="430" y="200" width="400" height="52" rx="8" fill="#34d399" opacity="0.22"/><rect x="430" y="200" width="400" height="52" rx="8" fill="none" stroke="#34d399" stroke-width="3"/><text x="630" y="232" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="17" fill="#34d399" font-weight="700">证书有效期 notBefore → notAfter</text><text x="430" y="275" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">2026-09-13 08:00</text><text x="830" y="275" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">2026-12-13 08:00</text><text x="630" y="300" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">像牛奶盒上的“保质期：9-13 至 12-13”</text><line x1="700" y1="150" x2="700" y2="330" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="6 5"/><text x="700" y="140" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="16" fill="#7dd3fc" font-weight="700">真实时间 now ✓</text><text x="700" y="168" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="400">牛奶还在保质期内，正常</text><line x1="250" y1="150" x2="250" y2="330" stroke="#f87171" stroke-width="3" stroke-dasharray="6 5"/><text x="250" y="140" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="16" fill="#f87171" font-weight="700">慢了 4 天的时钟以为的 now ✗</text><text x="250" y="168" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#94a3b8" font-weight="400">“保质期还没到”，直接拒收</text><rect x="120" y="355" width="300" height="40" rx="8" fill="#3f1d24" stroke="#f87171" stroke-width="2"/><text x="270" y="381" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#f87171" font-weight="700">报错：certificate not yet valid</text><text x="40" y="440" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8" font-weight="400">示意图：横轴时间未按比例。真实证书的有效期通常以月/年计，但对“未生效”的判断只看 notBefore 这一瞬间。</text></svg>