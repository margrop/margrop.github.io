<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0b0f19;">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="820" fill="url(#bgG)"/>
  <circle cx="200" cy="150" r="280" fill="#0284c7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1200" cy="650" r="320" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Top Category / Tags -->
  <g transform="translate(100, 100)">
    <rect width="170" height="34" rx="17" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5"/>
    <text x="85" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HOME ASSISTANT</text>

    <rect x="185" width="160" height="34" rx="17" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="265" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">AI AGENT 实战</text>

    <rect x="360" width="170" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="445" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">零云端安全授权</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      电信集成报 3006？
    </text>
    <text x="0" y="70" fill="url(#blueG)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      手搓零云端设备授权工具与 HA 深度排坑
    </text>
    <text x="0" y="140" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="22" font-weight="400">
      从设备未信任、宽带免密失败、滑块几何陷阱，到 Home Assistant 优雅接入两张手机卡
    </text>
  </g>

  <!-- Central Visual Cards -->
  <g transform="translate(100, 420)">
    <!-- Card 1: 3006 Error -->
    <rect x="0" y="0" width="370" height="280" rx="16" fill="url(#cardG)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="24" y="24" width="40" height="40" rx="8" fill="#ef4444" fill-opacity="0.15"/>
    <text x="44" y="50" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">✕</text>
    <text x="80" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">3006 设备未信任</text>
    <text x="80" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">官方运营商反欺诈安全壁垒</text>
    <text x="24" y="115" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" line-height="1.6">
      <tspan x="24" dy="0">• 仅输服务密码登录失败</tspan>
      <tspan x="24" dy="28">• 宽带 WiFi 环境不支持蜂窝免密</tspan>
      <tspan x="24" dy="28">• 社区第三方反代存在严重隐私泄露</tspan>
      <tspan x="24" dy="28">• HA 旧版异常导致 0 实体加载崩溃</tspan>
    </text>
    <rect x="24" y="225" width="322" height="32" rx="6" fill="#ef4444" fill-opacity="0.1"/>
    <text x="185" y="246" fill="#f87171" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">resultCode: 3006 | DeviceId: None</text>

    <!-- Card 2: Local Auth Tool -->
    <rect x="420" y="0" width="400" height="280" rx="16" fill="url(#cardG)" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="444" y="24" width="40" height="40" rx="8" fill="#0284c7" fill-opacity="0.15"/>
    <text x="464" y="50" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">⚙</text>
    <text x="500" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">自研本地授权工具</text>
    <text x="500" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">100% 内存会话 · 零云端调用</text>
    <text x="444" y="115" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="444" dy="0">• 官方 189.cn TLS 双向直连</tspan>
      <tspan x="444" dy="28">• 离屏 Canvas 像素级透明通道对齐</tspan>
      <tspan x="444" dy="28">• 局域网随机 Token 隔离与 10分钟过期</tspan>
      <tspan x="444" dy="28">• 47 项单元测试保证密码凭据不落盘</tspan>
    </text>
    <rect x="444" y="225" width="352" height="32" rx="6" fill="#0284c7" fill-opacity="0.15"/>
    <text x="620" y="246" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">POST /api/submit-sms -&gt; DeviceId</text>

    <!-- Card 3: Home Assistant Final -->
    <rect x="850" y="0" width="390" height="280" rx="16" fill="url(#cardG)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="874" y="24" width="40" height="40" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <text x="894" y="50" fill="#34d399" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">✓</text>
    <text x="930" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="700">优雅入驻 Home Assistant</text>
    <text x="930" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">双号码 36 个实体稳定运行</text>
    <text x="874" y="115" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
      <tspan x="874" dy="0">• 架构补丁：预注册 18 实体防止中断</tspan>
      <tspan x="874" dy="28">• 异步并发锁：杜绝静态前端卡片竞态</tspan>
      <tspan x="874" dy="28">• 话费余额、剩余流量实时呈现</tspan>
      <tspan x="874" dy="28">• 附 Win11 / Ubuntu / macOS 一键套件</tspan>
    </text>
    <rect x="874" y="225" width="342" height="32" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="1045" y="246" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">sensor.liu_liang_sheng_yu: 66.58 GB</text>
  </g>
</svg>