      Carrier Integration Hit Error 3006?
    </text>
    <text x="0" y="65" fill="url(#blueG)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">
