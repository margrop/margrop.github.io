      <tspan x="444" dy="26">• Offscreen Canvas opaque-bounds pixel math</tspan>
      <tspan x="444" dy="26">• Random LAN token &amp; 10-minute expiry</tspan>
      <tspan x="444" dy="26">• 47 automated tests ensure zero credential disk leak</tspan>
