    <text x="185" y="246" fill="#f87171" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">resultCode: 3006 | DeviceId: None</text>

    <!-- Card 2 -->
    <rect x="420" y="0" width="400" height="280" rx="16" fill="url(#cardG)" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="444" y="24" width="40" height="40" rx="8" fill="#0284c7" fill-opacity="0.15"/>
    <text x="464" y="50" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">⚙</text>
    <text x="500" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700">Local Auth Tool Architecture</text>
    <text x="500" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">100% In-Memory Session · Zero Cloud</text>
