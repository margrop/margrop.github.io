    <rect x="874" y="225" width="342" height="32" rx="6" fill="#10b981" fill-opacity="0.15"/>
    <text x="1045" y="246" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" text-anchor="middle">sensor.liu_liang_sheng_yu: 66.58 GB</text>
