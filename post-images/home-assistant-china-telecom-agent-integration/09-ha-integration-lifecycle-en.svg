<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    HA Integration Lifecycle Patch: Pre-registration & Concurrency Lock
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    Fixing 'Zero Entities on Refresh Failure' & 'Concurrent Multi-Account Crash'
  </text>

  <!-- Left: Defect 1 (Entities Drop) -->
  <g transform="translate(100, 160)">
    <rect width="590" height="580" rx="16" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="45" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Fix 1: Entity Pre-registration & Non-blocking Refresh</text>

    <!-- Before subcard -->
    <rect x="30" y="70" width="530" height="190" rx="10" fill="#18181b" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="45" y="100" fill="#f87171" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Before (Upstream Logic)</text>
    <text x="45" y="130" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">async_setup_entry(...) {</text>
    <text x="65" y="152" fill="#ef4444" font-family="ui-monospace, Menlo, monospace" font-size="12">  await coordinator.async_config_entry_first_refresh();</text>
    <text x="85" y="174" fill="#f87171" font-family="ui-monospace, Menlo, monospace" font-size="11">// 💥 3006 exception thrown here; downstream code never reached!</text>
    <text x="65" y="196" fill="#64748b" font-family="ui-monospace, Menlo, monospace" font-size="12">  async_add_entities(sensors); // Zero entities ever registered!</text>
    <text x="45" y="218" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">}</text>
    <text x="45" y="244" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="12">Symptom: User configures entry, but 0 entities appear in HA.</text>

    <!-- After subcard -->
    <rect x="30" y="280" width="530" height="260" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="45" y="310" fill="#34d399" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">After (Graceful Lifecycle Logic)</text>
    <text x="45" y="340" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">async_setup_entry(...) {</text>
    <text x="65" y="362" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12">  // 1. Pre-register 18 sensor entities unconditionally (state: unavailable)</text>
    <text x="65" y="384" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">  async_add_entities(sensors);</text>
    <text x="65" y="410" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="12">  // 2. Schedule non-blocking background refresh without crashing setup</text>
    <text x="65" y="432" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12">  hass.async_create_task(coordinator.async_refresh());</text>
    <text x="45" y="454" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">}</text>
    <text x="45" y="490" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12">Result: Entities retained; hot-reloads data as soon as DeviceId is injected!</text>
  </g>

  <!-- Right: Defect 2 (Concurrent Lock) -->
  <g transform="translate(750, 160)">
    <rect width="590" height="580" rx="16" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="45" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Fix 2: Protecting Static Resources with asyncio.Lock</text>

    <!-- Concurrency issue -->
    <rect x="30" y="70" width="530" height="190" rx="10" fill="#18181b" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="45" y="100" fill="#f87171" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Race Condition (Multi-Account Setup)</text>
    <text x="45" y="130" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12"># Two telecom numbers initializing concurrently:</text>
    <text x="45" y="152" fill="#ef4444" font-family="ui-monospace, Menlo, monospace" font-size="12">Account A: hass.http.register_static_path("/china-telecom-card")</text>
    <text x="45" y="174" fill="#ef4444" font-family="ui-monospace, Menlo, monospace" font-size="12">Account B: hass.http.register_static_path("/china-telecom-card")</text>
    <text x="45" y="200" fill="#f87171" font-family="ui-monospace, Menlo, monospace" font-size="11">💥 Static path duplicate registration conflict -&gt; second entry crashes with setup_error!</text>
    <text x="45" y="235" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="12">Symptom: Works with 1 card, but adding family secondary cards crashes setup.</text>

    <!-- Asyncio lock fix -->
    <rect x="30" y="280" width="530" height="260" rx="10" fill="#064e3b" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="45" y="310" fill="#34d399" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Serialized Registration Guard</text>
    <text x="45" y="340" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">SETUP_LOCK = asyncio.Lock()</text>
    <text x="45" y="365" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">async with SETUP_LOCK:</text>
    <text x="65" y="387" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12">  if not hass.data[DOMAIN].get("card_registered"):</text>
    <text x="85" y="410" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">    hass.http.register_static_path(...)</text>
    <text x="85" y="432" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12">    hass.data[DOMAIN]["card_registered"] = True</text>
    <text x="45" y="480" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="12">Result: Multi-account setup serialized cleanly; all 36 entities loaded.</text>
  </g>
</svg>