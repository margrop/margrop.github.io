<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    排障决策树与问题排查矩阵 (Troubleshooting Matrix)
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    遇到电信集成配置异常时的诊断流程、根本原因与解决方案
  </text>

  <!-- Grid of 4 troubleshooting cards -->
  <g transform="translate(100, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="600" height="260" rx="14" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="24" width="10" height="24" rx="3" fill="#ef4444"/>
    <text x="44" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700">现象一：登录返回 3006 设备未信任</text>
    <text x="24" y="85" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">
      <tspan x="24" dy="0" font-weight="600" fill="#cbd5e1">【排查诊断】</tspan> 仅输入手机号和服务密码，无 DeviceId 凭据；
      <tspan x="24" dy="24" font-weight="600" fill="#f87171">【根本原因】</tspan> 运营商安全机制要求绑定信任设备硬件标识；
      <tspan x="24" dy="24" font-weight="600" fill="#34d399">【解决策略】</tspan> 启动本地授权工具完成一次滑块+短信鉴权，将生成的 DeviceId 填入 HA 条目；
      <tspan x="24" dy="24" font-weight="600" fill="#38bdf8">【验证指标】</tspan> HA 日志出现 resultCode=0000，实体从 unavailable 变为真实余额/流量。
    </text>

    <!-- Card 2 -->
    <rect x="640" y="0" width="600" height="260" rx="14" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="664" y="24" width="10" height="24" rx="3" fill="#f59e0b"/>
    <text x="684" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700">现象二：滑块拖动“明明对准了”却验证失败</text>
    <text x="664" y="85" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">
      <tspan x="664" dy="0" font-weight="600" fill="#cbd5e1">【排查诊断】</tspan> 滑块拼图视觉上移入缺口，接口持续返回“验证码错误”；
      <tspan x="664" dy="24" font-weight="600" fill="#fbbf24">【根本原因】</tspan> 拼图图片自带透明 Padding，直接使用 naturalWidth 计算导致基准偏移；
      <tspan x="664" dy="24" font-weight="600" fill="#34d399">【解决策略】</tspan> 使用离屏 Canvas 扫描 Alpha 通道，提取最小外接矩形 (opaqueBounds)；
      <tspan x="664" dy="24" font-weight="600" fill="#38bdf8">【验证指标】</tspan> 计算出的 travel 与 nativeLeft 完全契合实际缺口，一次拖动即过。
    </text>

    <!-- Card 3 -->
    <rect x="0" y="290" width="600" height="260" rx="14" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="314" width="10" height="24" rx="3" fill="#3b82f6"/>
    <text x="44" y="332" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700">现象三：添加第二个电信号码时 setup_error 崩溃</text>
    <text x="24" y="375" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">
      <tspan x="24" dy="0" font-weight="600" fill="#cbd5e1">【排查诊断】</tspan> 第一个号码正常，添加第二张卡或重启 HA 时其中一个条目报错误；
      <tspan x="24" dy="24" font-weight="600" fill="#60a5fa">【根本原因】</tspan> 多个条目并发调用 register_static_path 注册卡片前端资源引起路由冲突；
      <tspan x="24" dy="24" font-weight="600" fill="#34d399">【解决策略】</tspan> 引入模块级 asyncio.Lock()，加锁并在首个条目注册后置位跳过；
      <tspan x="24" dy="24" font-weight="600" fill="#38bdf8">【验证指标】</tspan> 两条配置条目均为 Loaded 状态，每个号码 18 个传感器完整加载。
    </text>

    <!-- Card 4 -->
    <rect x="640" y="290" width="600" height="260" rx="14" fill="url(#cardG)" stroke="#334155" stroke-width="1.5"/>
    <rect x="664" y="314" width="10" height="24" rx="3" fill="#8b5cf6"/>
    <text x="684" y="332" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700">现象四：宽带网络下蜂窝免密登录返回不支持</text>
    <text x="664" y="375" fill="#94a3b8" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13">
      <tspan x="664" dy="0" font-weight="600" fill="#cbd5e1">【排查诊断】</tspan> 试图在家庭 WiFi 下通过 open.e.189.cn 网关免密获取号码凭据；
      <tspan x="664" dy="24" font-weight="600" fill="#c084fc">【根本原因】</tspan> 网关取号依赖移动蜂窝基站直接鉴权 SIM 卡，家庭宽带以太网无 SIM 通道；
      <tspan x="664" dy="24" font-weight="600" fill="#34d399">【解决策略】</tspan> 放弃蜂窝免密幻想，走官方标准的短信挑战码（SMS Challenge）流程；
      <tspan x="664" dy="24" font-weight="600" fill="#38bdf8">【验证指标】</tspan> 官方直接触发短信验证码，成功返回带签名的合规 DeviceId。
    </text>
  </g>
</svg>