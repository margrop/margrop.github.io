<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="badG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#2d1215"/>
    </linearGradient>
    <linearGradient id="goodG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    架构对比：传统第三方云端代验 vs 本地零云端安全授权
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    为什么绝不能把手机号、服务密码和短信验证码输入到未知的第三方托管平台？
  </text>

  <!-- Left: Bad Architecture -->
  <g transform="translate(100, 160)">
    <rect width="590" height="580" rx="16" fill="url(#badG)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="30" y="30" width="160" height="32" rx="16" fill="#ef4444" fill-opacity="0.2"/>
    <text x="110" y="52" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">传统高危社区方案</text>

    <!-- Node 1: User -->
    <rect x="40" y="100" width="180" height="64" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="130" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" text-anchor="middle">用户终端 (浏览器)</text>
    <text x="130" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">输入手机号 / 密码 / 验证码</text>

    <!-- Arrow down -->
    <path d="M 130 164 L 130 210" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="140" y="190" fill="#f87171" font-family="ui-monospace, monospace" font-size="11">包含明文密码与短信</text>

    <!-- Node 2: Sketchy Proxy -->
    <rect x="40" y="210" width="510" height="110" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="60" y="240" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">第三方未知代理服务器 / 抓包代管服务</text>
    <text x="60" y="270" fill="#fecaca" font-family="-apple-system, sans-serif" font-size="13">⚠️ 风险：第三方中心化掌握用户电信控制权</text>
    <text x="60" y="295" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12">• 撞库风险：电信服务密码多为通用6位PIN</text>
    <text x="60" y="315" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12">• 拦截风险：获取短信验证码可直接办理增值业务</text>

    <!-- Arrow down -->
    <path d="M 295 320 L 295 380" stroke="#94a3b8" stroke-width="2"/>

    <!-- Node 3: Official 189 -->
    <rect x="40" y="380" width="510" height="70" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="295" y="415" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">中国电信官方鉴权接口 (189.cn)</text>
    <text x="295" y="435" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">返回 DeviceId 经由第三方服务器，可能被持久化记录</text>

    <!-- Bottom summary -->
    <rect x="40" y="480" width="510" height="70" rx="8" fill="#18181b" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="60" y="512" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">结论：高危不可控</text>
    <text x="60" y="535" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">家庭自动化不应以让渡运营商核心账号安全为代价。</text>
  </g>

  <!-- Right: Good Architecture -->
  <g transform="translate(750, 160)">
    <rect width="590" height="580" rx="16" fill="url(#goodG)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="30" y="30" width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="120" y="52" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">自研零云端本地工具</text>

    <!-- Node 1: User Browser -->
    <rect x="40" y="100" width="220" height="64" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="150" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" text-anchor="middle">用户终端 (局域网)</text>
    <text x="150" y="150" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">访问带临时令牌的本地服务</text>

    <!-- Arrow Right -->
    <path d="M 260 132 L 310 132" stroke="#34d399" stroke-width="2"/>

    <!-- Node 2: Local Python Server -->
    <rect x="310" y="90" width="240" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="430" y="120" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">本地隔离授权服务</text>
    <text x="430" y="145" fill="#ecfdf5" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">tools.telecom_auth</text>
    <text x="430" y="170" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• 仅限局域网 Token 校验</text>
    <text x="430" y="188" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• 内存短期会话 / 零落盘</text>

    <!-- Arrow Down -->
    <path d="M 430 200 L 430 260" stroke="#34d399" stroke-width="2"/>
    <text x="440" y="235" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">官方 HTTPS 直接加密通信</text>

    <!-- Node 3: Official 189 -->
    <rect x="40" y="260" width="510" height="90" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="60" y="290" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">中国电信官方入口 (appgologinsz.189.cn)</text>
    <text x="60" y="315" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">1. 请求官方动态滑块拼图 &amp; 算法验证</text>
    <text x="60" y="335" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">2. 直连官方发送短信 &amp; 短信二次登录完成签发</text>

    <!-- Arrow Down to HA -->
    <path d="M 295 350 L 295 400" stroke="#34d399" stroke-width="2"/>

    <!-- Node 4: HA Core -->
    <rect x="40" y="400" width="510" height="70" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="295" y="430" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Home Assistant Core (本地安全配置)</text>
    <text x="295" y="452" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">仅写入签发出的 DeviceId 凭据，持续每小时安全轮询</text>

    <!-- Bottom summary -->
    <rect x="40" y="490" width="510" height="60" rx="8" fill="#18181b" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="60" y="515" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">优势：零外泄、可审计、开源透明</text>
    <text x="60" y="535" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">会话 10 分钟自动销毁，凭据直达官方，无任何中间商。</text>
  </g>
</svg>