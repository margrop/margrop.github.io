<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="badG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#2d1215"/>
    </linearGradient>
    <linearGradient id="goodG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    Architecture: High-Risk 3rd-Party Proxy vs Zero-Cloud Local Auth
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    Why You Must Never Entrust Phone Credentials & SMS Codes to Unknown Third Parties
  </text>

  <!-- Left: Bad Architecture -->
  <g transform="translate(100, 160)">
    <rect width="590" height="580" rx="16" fill="url(#badG)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="30" y="30" width="160" height="32" rx="16" fill="#ef4444" fill-opacity="0.2"/>
    <text x="110" y="52" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">High-Risk Community Proxy</text>

    <!-- Node 1: User -->
    <rect x="40" y="100" width="180" height="64" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="130" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" text-anchor="middle">User Terminal (Browser)</text>
    <text x="130" y="150" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Inputs Phone / PIN / SMS</text>

    <!-- Arrow down -->
    <path d="M 130 164 L 130 210" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="140" y="190" fill="#f87171" font-family="ui-monospace, monospace" font-size="11">Carries Plaintext PIN & SMS</text>

    <!-- Node 2: Sketchy Proxy -->
    <rect x="40" y="210" width="510" height="110" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="60" y="240" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Unknown Third-Party Proxy / Cloud Interceptor</text>
    <text x="60" y="270" fill="#fecaca" font-family="-apple-system, sans-serif" font-size="13">⚠️ Risk: Third Party Holds Full Account Control</text>
    <text x="60" y="295" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12">• Credential Stuffing: Carrier PINs are often reused 6-digit numbers</text>
    <text x="60" y="315" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12">• Interception: SMS codes can approve fee-charging services</text>

    <!-- Arrow down -->
    <path d="M 295 320 L 295 380" stroke="#94a3b8" stroke-width="2"/>

    <!-- Node 3: Official 189 -->
    <rect x="40" y="380" width="510" height="70" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="295" y="415" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Official China Telecom Gateway (189.cn)</text>
    <text x="295" y="435" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">DeviceId passes through third party; risk of permanent logging</text>

    <!-- Bottom summary -->
    <rect x="40" y="480" width="510" height="70" rx="8" fill="#18181b" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="60" y="512" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Verdict: High Security Hazard</text>
    <text x="60" y="535" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Smart home automation must not compromise core carrier credentials.</text>
  </g>

  <!-- Right: Good Architecture -->
  <g transform="translate(750, 160)">
    <rect width="590" height="580" rx="16" fill="url(#goodG)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="30" y="30" width="180" height="32" rx="16" fill="#10b981" fill-opacity="0.2"/>
    <text x="120" y="52" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Local Zero-Cloud Tool</text>

    <!-- Node 1: User Browser -->
    <rect x="40" y="100" width="220" height="64" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="150" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" text-anchor="middle">User Terminal (LAN)</text>
    <text x="150" y="150" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Accesses local service with random token</text>

    <!-- Arrow Right -->
    <path d="M 260 132 L 310 132" stroke="#34d399" stroke-width="2"/>

    <!-- Node 2: Local Python Server -->
    <rect x="310" y="90" width="240" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="430" y="120" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Local Isolated Auth Tool</text>
    <text x="430" y="145" fill="#ecfdf5" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">tools.telecom_auth</text>
    <text x="430" y="170" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• Strict LAN Token Access Control</text>
    <text x="430" y="188" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">• In-Memory Ephemeral Sessions / Zero Disk Log</text>

    <!-- Arrow Down -->
    <path d="M 430 200 L 430 260" stroke="#34d399" stroke-width="2"/>
    <text x="440" y="235" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">Direct Official HTTPS Encryption</text>

    <!-- Node 3: Official 189 -->
    <rect x="40" y="260" width="510" height="90" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="60" y="290" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Official Telecom Gateway (appgologinsz.189.cn)</text>
    <text x="60" y="315" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">1. Fetches official slider challenge &amp; verifies track</text>
    <text x="60" y="335" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">2. Direct SMS verification &amp; official DeviceId issuance</text>

    <!-- Arrow Down to HA -->
    <path d="M 295 350 L 295 400" stroke="#34d399" stroke-width="2"/>

    <!-- Node 4: HA Core -->
    <rect x="40" y="400" width="510" height="70" rx="8" fill="#1e293b" stroke="#10b981"/>
    <text x="295" y="430" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Home Assistant Core (Local Private Storage)</text>
    <text x="295" y="452" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Only writes issued DeviceId; hourly read-only polling</text>

    <!-- Bottom summary -->
    <rect x="40" y="490" width="510" height="60" rx="8" fill="#18181b" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="60" y="515" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Verdict: Zero Leakage & Fully Auditable</text>
    <text x="60" y="535" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Sessions expire in 10 mins; direct to carrier with zero intermediaries.</text>
  </g>
</svg>