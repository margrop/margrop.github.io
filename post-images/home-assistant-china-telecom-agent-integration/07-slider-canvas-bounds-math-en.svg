<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" style="background:#0f172a;">
  <defs>
    <linearGradient id="sliderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="100" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="800">
    The Slider Alignment Mystery: Why 'Visually Aligned' Drags Still Failed
  </text>
  <text x="100" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">
    Frontend Offscreen Canvas Opaque-Bounds Pixel Scanning Solves the Gap Drift
  </text>

  <!-- Left: Problem Illustration -->
  <g transform="translate(100, 160)">
    <rect width="590" height="420" rx="16" fill="url(#sliderG)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="30" y="45" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">❌ Naive Math: Raw Dimensions Cause Massive Pixel Drift</text>
    
    <!-- Simulation image container -->
    <rect x="30" y="70" width="530" height="180" rx="8" fill="#1e293b" stroke="#334155"/>
    <!-- Background puzzle slot -->
    <rect x="320" y="120" width="70" height="70" rx="4" fill="#0f172a" stroke="#f87171" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="355" y="160" fill="#f87171" font-family="sans-serif" font-size="12" text-anchor="middle">Actual Slot Position</text>

    <!-- Piece canvas with transparent padding -->
    <rect x="220" y="100" width="150" height="110" rx="4" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-dasharray="2,2"/>
    <text x="295" y="118" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Raw Canvas Image (With Transparent Padding)</text>
    
    <!-- Actual opaque piece inside canvas -->
    <rect x="250" y="120" width="70" height="70" rx="4" fill="#2563eb" fill-opacity="0.6" stroke="#60a5fa"/>
    <text x="285" y="160" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Opaque Piece</text>

    <text x="30" y="280" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Critical Flaw:</text>
    <text x="30" y="305" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">
      <tspan x="30" dy="0">• Carrier slider puzzle piece is not tightly cropped; contains wide alpha margins!</tspan>
      <tspan x="30" dy="24">• Mapping 0-100% directly to raw width creates severe visual offset from true puzzle bounds;</tspan>
      <tspan x="30" dy="24">• Drags appear visually aligned to the eye, but submitted coordinates deviate by 20+ px!</tspan>
    </text>
  </g>

  <!-- Right: Solution Illustration -->
  <g transform="translate(750, 160)">
    <rect width="590" height="420" rx="16" fill="url(#sliderG)" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="45" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">✓ Pixel Solution: Dynamic Opaque Bounding Box Extraction</text>

    <!-- Canvas scan code block -->
    <rect x="30" y="70" width="530" height="180" rx="8" fill="#090d16" stroke="#1e293b"/>
    <text x="45" y="100" fill="#a7f3d0" font-family="ui-monospace, Menlo, monospace" font-size="12">// 1. Offscreen canvas extracts pixel RGBA bytes</text>
    <text x="45" y="122" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">const pixels = context.getImageData(0, 0, w, h).data;</text>
    <text x="45" y="144" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="12">if (pixels[(y * w + x) * 4 + 3] &gt; 128) {</text>
    <text x="65" y="166" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">  bounds.left = Math.min(bounds.left, x); // Discards alpha padding</text>
    <text x="65" y="188" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">  bounds.width = right - left + 1;</text>
    <text x="45" y="210" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="12">}</text>
    <text x="45" y="232" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="12">const travel = bg.naturalWidth - bounds.width;</text>

    <text x="30" y="280" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Mathematical Formula & Responsive Scale Alignment:</text>
    <text x="30" y="305" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">
      <tspan x="30" dy="0">• Padding removal: nativeLeft = (val / max) * travel - bounds.x</tspan>
      <tspan x="30" dy="24">• Dynamic screen scaling: scale = background.clientWidth / background.naturalWidth</tspan>
      <tspan x="30" dy="24">• Pixel-perfect alignment across mobile & Retina screens; passes on first attempt!</tspan>
    </text>
  </g>

  <!-- Bottom workflow -->
  <g transform="translate(100, 610)">
    <rect width="1240" height="130" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Official Slider Authentication & SMS Trigger 3-Step Handshake:</text>
    <text x="40" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      <tspan x="40" dy="0">1. /login/client/getLoginRandomCode fetches session key & RSA encryption salt;</tspan>
      <tspan x="40" dy="22">2. /login/client/getSliderVerificationPicture gets challenge images; Canvas calculates bounds;</tspan>
      <tspan x="40" dy="22">3. /login/client/verificationSliderPicture submits timestamped drag track & distance; carrier triggers SMS!</tspan>
    </text>
  </g>
</svg>