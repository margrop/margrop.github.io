<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="pgBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2f6db3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="80" cy="90" r="4"/><circle cx="180" cy="60" r="3"/><circle cx="1120" cy="120" r="4"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="120" cy="590" r="4"/><circle cx="980" cy="70" r="3"/>
    <circle cx="620" cy="620" r="3"/><circle cx="60" cy="330" r="3"/><circle cx="1140" cy="330" r="3"/>
  </g>
  <!-- MySQL 海豚老兵：递钥匙 -->
  <g transform="translate(120,380)">
    <rect x="0" y="60" width="220" height="150" rx="12" fill="#d98e32" stroke="#b06f1d" stroke-width="4"/>
    <rect x="0" y="60" width="220" height="34" rx="12" fill="#b06f1d"/>
    <text x="110" y="165" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">MySQL</text>
    <text x="110" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#ffd9a0">十年老兵 · 经验打包</text>
    <!-- 钥匙 -->
    <g transform="translate(215,0) rotate(20)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#ffcc4d" stroke-width="7"/>
      <path d="M14 10 L52 48 M40 36 L52 30 M46 44 L58 38" stroke="#ffcc4d" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 搬家箭头：带步骤 -->
  <g transform="translate(410,400)">
    <path d="M0 60 L180 60" stroke="#ffcc4d" stroke-width="14" stroke-linecap="round"/>
    <path d="M160 30 L205 60 L160 90 Z" fill="#ffcc4d"/>
    <text x="100" y="10" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffcc4d">学习 → 迁移</text>
    <text x="100" y="140" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#9fc3ec">7 天上手 · 30 天迁完</text>
  </g>
  <!-- PostgreSQL 大象新家：门已打开 -->
  <g transform="translate(680,330)">
    <rect x="0" y="80" width="400" height="200" rx="18" fill="url(#pgBody)" stroke="#1d4e86" stroke-width="5"/>
    <rect x="0" y="80" width="400" height="40" rx="18" fill="#1d4e86"/>
    <g transform="translate(24,118)" fill="#eaf3ff">
      <ellipse cx="60" cy="62" rx="52" ry="46"/>
      <circle cx="96" cy="44" r="26"/>
      <path d="M112 62 q26 10 20 44" stroke="#eaf3ff" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="104" cy="40" r="4.5" fill="#1d4e86"/>
    </g>
    <text x="290" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">PostgreSQL</text>
    <text x="290" y="228" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#bcd8f5">新家 · 门牌已挂好</text>
  </g>
  <!-- 标题 -->
  <text x="600" y="170" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="66" font-weight="bold" fill="#ffffff">MySQL 老兵的 PostgreSQL 上岸指南</text>
  <text x="600" y="240" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" fill="#9fc3ec">概念秒懂 · 7 天学习路线 · pgloader 无缝迁移实战</text>
</svg>
