<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg4)"/>
  <text x="600" y="62" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">无缝迁移六步曲：像搬家公司一样搬数据库</text>
  <text x="600" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">每一步都有「验收单」，任何一步不合格就回滚，业务无感</text>

  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <!-- 6 个步骤卡片，两行三列 -->
    <g transform="translate(70,140)">
      <rect width="330" height="180" rx="14" fill="#3a2c17" stroke="#d98e32" stroke-width="3"/>
      <circle cx="44" cy="44" r="24" fill="#d98e32"/>
      <text x="44" y="53" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">1</text>
      <text x="82" y="52" font-size="25" font-weight="bold" fill="#ffd9a0">盘点行李</text>
      <text x="24" y="96" font-size="19" fill="#e8c48a">扫方言：存储过程、ENUM、</text>
      <text x="24" y="124" font-size="19" fill="#e8c48a">unsigned、触发器、视图</text>
      <text x="24" y="158" font-size="18" fill="#98a2b3">验收：产出方言清单</text>
    </g>
    <g transform="translate(435,140)">
      <rect width="330" height="180" rx="14" fill="#3a2c17" stroke="#d98e32" stroke-width="3"/>
      <circle cx="44" cy="44" r="24" fill="#d98e32"/>
      <text x="44" y="53" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">2</text>
      <text x="82" y="52" font-size="25" font-weight="bold" fill="#ffd9a0">沙盒试搬</text>
      <text x="24" y="96" font-size="19" fill="#e8c48a">Docker 里跑 pgloader，</text>
      <text x="24" y="124" font-size="19" fill="#e8c48a">记录每张表的报错和转换</text>
      <text x="24" y="158" font-size="18" fill="#98a2b3">验收：迁移命令可重放</text>
    </g>
    <g transform="translate(800,140)">
      <rect width="330" height="180" rx="14" fill="#16283f" stroke="#4a90d9" stroke-width="3"/>
      <circle cx="44" cy="44" r="24" fill="#4a90d9"/>
      <text x="44" y="53" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">3</text>
      <text x="82" y="52" font-size="25" font-weight="bold" fill="#9fd0ff">全量搬运</text>
      <text x="24" y="96" font-size="19" fill="#c7d7ea">生产旁路导入历史数据，</text>
      <text x="24" y="124" font-size="19" fill="#c7d7ea">同时开启增量同步(CDC)</text>
      <text x="24" y="158" font-size="18" fill="#98a2b3">验收：行数/抽样一致</text>
    </g>
    <g transform="translate(70,360)">
      <rect width="330" height="180" rx="14" fill="#16283f" stroke="#4a90d9" stroke-width="3"/>
      <circle cx="44" cy="44" r="24" fill="#4a90d9"/>
      <text x="44" y="53" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">4</text>
      <text x="82" y="52" font-size="25" font-weight="bold" fill="#9fd0ff">并行对账</text>
      <text x="24" y="96" font-size="19" fill="#c7d7ea">双跑一段时间，比行数、</text>
      <text x="24" y="124" font-size="19" fill="#c7d7ea">比 checksum、比业务报表</text>
      <text x="24" y="158" font-size="18" fill="#98a2b3">验收：差异率为 0</text>
    </g>
    <g transform="translate(435,360)">
      <rect width="330" height="180" rx="14" fill="#1d3a2a" stroke="#39c26d" stroke-width="3"/>
      <circle cx="44" cy="44" r="24" fill="#39c26d"/>
      <text x="44" y="53" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">5</text>
      <text x="82" y="52" font-size="25" font-weight="bold" fill="#7ce6a3">低峰切流</text>
      <text x="24" y="96" font-size="19" fill="#c9e8d5">停写 1~5 分钟，等增量追平，</text>
      <text x="24" y="124" font-size="19" fill="#c9e8d5">改连接串指向 PG，恢复写入</text>
      <text x="24" y="158" font-size="18" fill="#98a2b3">验收：核心接口全绿</text>
    </g>
    <g transform="translate(800,360)">
      <rect width="330" height="180" rx="14" fill="#1d3a2a" stroke="#39c26d" stroke-width="3"/>
      <circle cx="44" cy="44" r="24" fill="#39c26d"/>
      <text x="44" y="53" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">6</text>
      <text x="82" y="52" font-size="25" font-weight="bold" fill="#7ce6a3">旧家保留</text>
      <text x="24" y="96" font-size="19" fill="#c9e8d5">MySQL 只读保留 2~4 周，</text>
      <text x="24" y="124" font-size="19" fill="#c9e8d5">回滚通道常备，确认后再拆</text>
      <text x="24" y="158" font-size="18" fill="#98a2b3">验收：回滚演练 &lt; 10 分钟</text>
    </g>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">口诀：先盘点、再试搬、全量加增量、对账后切流、旧家别急着退租</text>
</svg>
