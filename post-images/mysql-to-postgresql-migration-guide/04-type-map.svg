<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>
  <text x="600" y="62" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">方言翻译速查：MySQL 腔 → PostgreSQL 腔</text>
  <text x="600" y="102" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">像两地方言：说的都是 SQL，口音不一样</text>

  <!-- 表头 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="70" y="130" width="490" height="52" rx="10" fill="#d98e32"/>
    <text x="315" y="165" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffffff">MySQL 腔</text>
    <rect x="640" y="130" width="490" height="52" rx="10" fill="#2f6db3"/>
    <text x="885" y="165" text-anchor="middle" font-size="25" font-weight="bold" fill="#ffffff">PostgreSQL 腔</text>
    <!-- 中间箭头列 -->
    <g fill="#ffcc4d">
      <path d="M585 220 L615 220 M605 210 L618 220 L605 230" stroke="#ffcc4d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M585 300 L615 300 M605 290 L618 300 L605 310" stroke="#ffcc4d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M585 380 L615 380 M605 370 L618 380 L605 390" stroke="#ffcc4d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M585 460 L615 460 M605 450 L618 460 L605 470" stroke="#ffcc4d" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M585 540 L615 540 M605 530 L618 540 L605 550" stroke="#ffcc4d" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 行 -->
    <g font-size="21">
      <rect x="70" y="192" width="490" height="60" rx="8" fill="#2b2113"/>
      <text x="92" y="230" fill="#ffd9a0" font-family="DejaVu Sans Mono, monospace">AUTO_INCREMENT</text>
      <rect x="640" y="192" width="490" height="60" rx="8" fill="#16283f"/>
      <text x="662" y="230" fill="#9fd0ff" font-family="DejaVu Sans Mono, monospace">GENERATED ALWAYS AS IDENTITY</text>

      <rect x="70" y="272" width="490" height="60" rx="8" fill="#2b2113"/>
      <text x="92" y="310" fill="#ffd9a0" font-family="DejaVu Sans Mono, monospace">TINYINT(1) 当布尔用</text>
      <rect x="640" y="272" width="490" height="60" rx="8" fill="#16283f"/>
      <text x="662" y="310" fill="#9fd0ff" font-family="DejaVu Sans Mono, monospace">BOOLEAN（真·布尔）</text>

      <rect x="70" y="352" width="490" height="60" rx="8" fill="#2b2113"/>
      <text x="92" y="390" fill="#ffd9a0" font-family="DejaVu Sans Mono, monospace">`反引号` + 大小写不敏感</text>
      <rect x="640" y="352" width="490" height="60" rx="8" fill="#16283f"/>
      <text x="662" y="390" fill="#9fd0ff" font-family="DejaVu Sans Mono, monospace">"双引号" + 未加引号一律转小写</text>

      <rect x="70" y="432" width="490" height="60" rx="8" fill="#2b2113"/>
      <text x="92" y="470" fill="#ffd9a0" font-family="DejaVu Sans Mono, monospace">LIMIT offset, n / ON DUPLICATE KEY</text>
      <rect x="640" y="432" width="490" height="60" rx="8" fill="#16283f"/>
      <text x="662" y="470" fill="#9fd0ff" font-family="DejaVu Sans Mono, monospace">LIMIT n OFFSET m / ON CONFLICT</text>

      <rect x="70" y="512" width="490" height="60" rx="8" fill="#2b2113"/>
      <text x="92" y="550" fill="#ffd9a0" font-family="DejaVu Sans Mono, monospace">UNSIGNED / ENUM / 零日期</text>
      <rect x="640" y="512" width="490" height="60" rx="8" fill="#16283f"/>
      <text x="662" y="550" fill="#9fd0ff" font-family="DejaVu Sans Mono, monospace">CHECK 约束代替 / 严格校验不收零日期</text>
    </g>
  </g>

  <text x="600" y="630" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">pgloader 能自动翻译 80% 的口音，剩下 20%（存储过程、触发器）要人工翻</text>
</svg>
