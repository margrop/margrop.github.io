<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg3)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">7 天上手路线：从 iPhone 换到 Android</text>
  <text x="600" y="104" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">系统变了，但打电话、发微信的肌肉记忆还在 —— 学 PG 同理</text>

  <!-- 路线主线 -->
  <path d="M110 380 C 300 300, 480 460, 660 380 S 1020 300, 1090 380" stroke="#4a90d9" stroke-width="6" fill="none" stroke-dasharray="14 10"/>

  <!-- 7 天节点 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(110,300)">
      <circle cx="0" cy="80" r="34" fill="#d98e32"/>
      <text x="0" y="90" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D1</text>
      <text x="0" y="-20" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffd9a0">装环境</text>
      <text x="0" y="150" text-anchor="middle" font-size="18" fill="#c7d7ea">Docker 起 PG</text>
      <text x="0" y="176" text-anchor="middle" font-size="18" fill="#c7d7ea">psql 三连</text>
    </g>
    <g transform="translate(270,380)">
      <circle cx="0" cy="0" r="34" fill="#d98e32"/>
      <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D2</text>
      <text x="0" y="-60" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffd9a0">概念映射</text>
      <text x="0" y="66" text-anchor="middle" font-size="18" fill="#c7d7ea">库/schema/用户</text>
    </g>
    <g transform="translate(430,420)">
      <circle cx="0" cy="0" r="34" fill="#d98e32"/>
      <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D3</text>
      <text x="0" y="-60" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffd9a0">SQL 方言</text>
      <text x="0" y="66" text-anchor="middle" font-size="18" fill="#c7d7ea">自增/分页/引号</text>
    </g>
    <g transform="translate(590,380)">
      <circle cx="0" cy="0" r="34" fill="#4a90d9"/>
      <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D4</text>
      <text x="0" y="-60" text-anchor="middle" font-size="22" font-weight="bold" fill="#9fd0ff">事务与锁</text>
      <text x="0" y="66" text-anchor="middle" font-size="18" fill="#c7d7ea">MVCC/DDL 回滚</text>
    </g>
    <g transform="translate(750,340)">
      <circle cx="0" cy="0" r="34" fill="#4a90d9"/>
      <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D5</text>
      <text x="0" y="-60" text-anchor="middle" font-size="22" font-weight="bold" fill="#9fd0ff">pgloader 迁移</text>
      <text x="0" y="66" text-anchor="middle" font-size="18" fill="#c7d7ea">沙盒演练全量</text>
    </g>
    <g transform="translate(910,330)">
      <circle cx="0" cy="0" r="34" fill="#4a90d9"/>
      <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D6</text>
      <text x="0" y="-60" text-anchor="middle" font-size="22" font-weight="bold" fill="#9fd0ff">校验与压测</text>
      <text x="0" y="66" text-anchor="middle" font-size="18" fill="#c7d7ea">行数/抽样/EXPLAIN</text>
    </g>
    <g transform="translate(1070,380)">
      <circle cx="0" cy="0" r="34" fill="#39c26d"/>
      <text x="0" y="10" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">D7</text>
      <text x="0" y="-60" text-anchor="middle" font-size="22" font-weight="bold" fill="#7ce6a3">切换演练</text>
      <text x="0" y="66" text-anchor="middle" font-size="18" fill="#c7d7ea">回滚预案走一遍</text>
    </g>
  </g>

  <!-- 底部提示 -->
  <rect x="180" y="540" width="840" height="76" rx="12" fill="#16283f" stroke="#4a90d9" stroke-width="2"/>
  <text x="600" y="570" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#9fd0ff">原则：先在沙盒里把「搬家的每一步」演练两遍，再碰生产库</text>
  <text x="600" y="600" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#98a2b3">就像换手机前先云备份——演练不是浪费时间，是买保险</text>
</svg>
