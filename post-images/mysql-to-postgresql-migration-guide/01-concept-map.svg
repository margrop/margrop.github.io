<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#1d2939"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <text x="600" y="64" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">概念对照：MySQL 的「楼」 vs PostgreSQL 的「楼」</text>
  <text x="600" y="106" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">同一个词，两种户型 —— 搬家前先把「户型图」看懂</text>

  <!-- MySQL 楼 -->
  <g transform="translate(70,150)">
    <rect x="0" y="0" width="440" height="430" rx="16" fill="#3a2c17" stroke="#d98e32" stroke-width="4"/>
    <rect x="0" y="0" width="440" height="54" rx="16" fill="#d98e32"/>
    <text x="220" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">MySQL 实例 = 一栋楼</text>
    <!-- database 楼层 -->
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <rect x="24" y="76" width="392" height="100" rx="10" fill="#5c4526" stroke="#b06f1d" stroke-width="2"/>
      <text x="44" y="112" font-size="24" font-weight="bold" fill="#ffd9a0">database: shop</text>
      <text x="44" y="150" font-size="20" fill="#e8c48a">一整层都是订单表</text>
      <rect x="24" y="196" width="392" height="100" rx="10" fill="#5c4526" stroke="#b06f1d" stroke-width="2"/>
      <text x="44" y="232" font-size="24" font-weight="bold" fill="#ffd9a0">database: blog</text>
      <text x="44" y="270" font-size="20" fill="#e8c48a">一整层都是文章表</text>
      <rect x="24" y="316" width="392" height="92" rx="10" fill="#5c4526" stroke="#b06f1d" stroke-width="2"/>
      <text x="44" y="352" font-size="24" font-weight="bold" fill="#ffd9a0">跨层串门很容易</text>
      <text x="44" y="388" font-size="19" fill="#e8c48a">SELECT * FROM shop.orders 随便查</text>
    </g>
  </g>

  <!-- 中间对照 -->
  <g transform="translate(530,300)">
    <path d="M0 30 L120 30" stroke="#ffcc4d" stroke-width="10" stroke-linecap="round"/>
    <path d="M102 6 L140 30 L102 54 Z" fill="#ffcc4d"/>
    <text x="70" y="-14" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#ffcc4d">对应</text>
  </g>

  <!-- PostgreSQL 楼 -->
  <g transform="translate(690,150)">
    <rect x="0" y="0" width="440" height="430" rx="16" fill="#16283f" stroke="#4a90d9" stroke-width="4"/>
    <rect x="0" y="0" width="440" height="54" rx="16" fill="#2f6db3"/>
    <text x="220" y="37" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">PostgreSQL 集群 = 一栋楼</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif">
      <rect x="24" y="76" width="392" height="152" rx="10" fill="#1f3a5c" stroke="#4a90d9" stroke-width="2"/>
      <text x="44" y="112" font-size="24" font-weight="bold" fill="#9fd0ff">database: app（一整层）</text>
      <rect x="44" y="128" width="180" height="80" rx="8" fill="#2c4f7c"/>
      <text x="134" y="162" text-anchor="middle" font-size="20" font-weight="bold" fill="#d6e9ff">schema: shop</text>
      <text x="134" y="192" text-anchor="middle" font-size="17" fill="#a8c8ec">房间：订单表</text>
      <rect x="236" y="128" width="160" height="80" rx="8" fill="#2c4f7c"/>
      <text x="316" y="162" text-anchor="middle" font-size="20" font-weight="bold" fill="#d6e9ff">schema: blog</text>
      <text x="316" y="192" text-anchor="middle" font-size="17" fill="#a8c8ec">房间：文章表</text>
      <rect x="24" y="248" width="392" height="72" rx="10" fill="#1f3a5c" stroke="#4a90d9" stroke-width="2"/>
      <text x="44" y="278" font-size="22" font-weight="bold" fill="#9fd0ff">同层串门容易，跨层要走楼梯</text>
      <text x="44" y="306" font-size="18" fill="#a8c8ec">跨 database 查询需要 dblink / FDW</text>
      <rect x="24" y="340" width="392" height="68" rx="10" fill="#1f3a5c" stroke="#4a90d9" stroke-width="2"/>
      <text x="44" y="382" font-size="21" font-weight="bold" fill="#ffd9a0">MySQL 的 database ≈ PG 的 schema</text>
    </g>
  </g>

  <text x="600" y="640" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#98a2b3">口诀：实例对集群、库对层、schema 对房间；MySQL 的「库」在 PG 里大多数时候该建成「schema」</text>
</svg>
