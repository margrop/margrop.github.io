<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="480" y="44" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">PVE Assist 工业级五层安全防御与原子回滚机制</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">告别传统 Shell 脚本「盲跑、污染、爆雷、不可逆」的四大痛点</text>

  <!-- Step 1 -->
  <g transform="translate(30, 105)">
    <rect width="165" height="260" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="82" cy="35" r="18" fill="#0284c7" fill-opacity="0.3"/>
    <text x="82" y="41" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">01</text>
    <text x="82" y="75" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">严格版本门禁</text>
    <text x="82" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">Non-destructive Check</text>
    <path d="M 20 120 L 145 120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">• SHA256 完整性强校</text>
    <text x="15" y="175" fill="#cbd5e1" font-size="12">• 非 PVE 9.x 严禁运行</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="12">• 阻断跨版本页面崩溃</text>
    <text x="15" y="235" fill="#38bdf8" font-size="11">防误伤旧系统</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 202 235 L 220 235" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Step 2 -->
  <g transform="translate(222, 105)">
    <rect width="165" height="260" rx="12" fill="url(#stepGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="82" cy="35" r="18" fill="#4338ca" fill-opacity="0.3"/>
    <text x="82" y="41" fill="#818cf8" font-size="14" font-weight="bold" text-anchor="middle">02</text>
    <text x="82" y="75" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">带 Marker 备份</text>
    <text x="82" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">Stateful Snapshots</text>
    <path d="M 20 120 L 145 120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">• 修改前自动全量快照</text>
    <text x="15" y="175" fill="#cbd5e1" font-size="12">• 植入唯一指纹 Marker</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="12">• 保留源文件注释语法</text>
    <text x="15" y="235" fill="#818cf8" font-size="11">随时一键恢复出厂</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 394 235 L 412 235" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Step 3 -->
  <g transform="translate(414, 105)">
    <rect width="165" height="260" rx="12" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="82" cy="35" r="18" fill="#047857" fill-opacity="0.3"/>
    <text x="82" y="41" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">03</text>
    <text x="82" y="75" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">原子事务防护</text>
    <text x="82" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">Lock &amp; Digest</text>
    <path d="M 20 120 L 145 120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">• qm digest 锁防并发</text>
    <text x="15" y="175" fill="#cbd5e1" font-size="12">• 严禁配置运行中虚拟机</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="12">• 发现外部篡改即终止</text>
    <text x="15" y="235" fill="#34d399" font-size="11">防多终端打架踩脚</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 586 235 L 604 235" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Step 4 -->
  <g transform="translate(606, 105)">
    <rect width="165" height="260" rx="12" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="82" cy="35" r="18" fill="#b45309" fill-opacity="0.3"/>
    <text x="82" y="41" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">04</text>
    <text x="82" y="75" fill="#f8fafc" font-size="15" font-weight="600" text-anchor="middle">无损探针设计</text>
    <text x="82" y="100" fill="#94a3b8" font-size="12" text-anchor="middle">Passive Hardware</text>
    <path d="M 20 120 L 145 120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">• 彻底剔除 EC /dev/port</text>
    <text x="15" y="175" fill="#cbd5e1" font-size="12">• 严禁自动探测第三方驱动</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="12">• 纯只读 hwmon/IPMI</text>
    <text x="15" y="235" fill="#fbbf24" font-size="11">杜绝主机莫名死机</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 778 235 L 796 235" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Step 5 -->
  <g transform="translate(798, 105)">
    <rect width="135" height="260" rx="12" fill="url(#stepGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="67" cy="35" r="18" fill="#be185d" fill-opacity="0.3"/>
    <text x="67" y="41" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">05</text>
    <text x="67" y="75" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">平滑无感重启</text>
    <text x="67" y="100" fill="#94a3b8" font-size="11" text-anchor="middle">Delayed Daemon</text>
    <path d="M 15 120 L 120 120" stroke="#334155" stroke-width="1"/>
    <text x="12" y="145" fill="#cbd5e1" font-size="12">• 延迟后台重载</text>
    <text x="12" y="175" fill="#cbd5e1" font-size="12">• 保障 WebShell</text>
    <text x="12" y="205" fill="#cbd5e1" font-size="12">• 不断流、不掉线</text>
    <text x="12" y="235" fill="#f472b6" font-size="11">任务完美终结</text>
  </g>
</svg>