<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="gradCard1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradCard2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e172e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="480" y="46" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">生活化比喻：原生 PVE 9 vs PVE Assist 改造后</text>
  <text x="480" y="74" fill="#94a3b8" font-size="14" text-anchor="middle">为什么说原生系统是「毛坯商业房」，而 PVE Assist 是「智能精装交付队」？</text>

  <!-- Left Card: Raw PVE -->
  <rect x="40" y="105" width="410" height="340" rx="16" fill="url(#gradCard1)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="60" y="125" width="130" height="28" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="125" y="144" fill="#fca5a5" font-size="13" font-weight="600" text-anchor="middle">⚠️ 原生 PVE 9 (毛坯房)</text>

  <g transform="translate(60, 175)" font-size="14" fill="#cbd5e1">
    <text x="0" y="0" font-weight="600" fill="#f87171">🏢 默认连着「企业收费大水管」</text>
    <text x="20" y="24" font-size="12" fill="#94a3b8">每次开门先弹无订阅警告，更新直接报 401 走不通</text>

    <text x="0" y="65" font-weight="600" fill="#f87171">🌡️ 墙上没有任何「温度计与电表」</text>
    <text x="20" y="89" font-size="12" fill="#94a3b8">CPU/硬盘发烫到多少度不知道，全凭用手摸铁皮</text>

    <text x="0" y="130" font-weight="600" fill="#f87171">🔌 房间空间生硬分割 (local-lvm)</text>
    <text x="20" y="154" font-size="12" fill="#94a3b8">镜像装不下，虚拟机磁盘用不着，空间严重两头受限</text>

    <text x="0" y="195" font-weight="600" fill="#f87171">🚗 直通如同徒手拆地基改暗线</text>
    <text x="20" y="219" font-size="12" fill="#94a3b8">网上找过时脚本一顿乱敲，动辄网卡失联或内核死锁</text>
  </g>

  <!-- Middle Arrow -->
  <circle cx="480" cy="275" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 472 275 L 488 275 M 482 268 L 489 275 L 482 282" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Card: PVE Assist -->
  <rect x="510" y="105" width="410" height="340" rx="16" fill="url(#gradCard2)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="530" y="125" width="160" height="28" rx="6" fill="#0284c7" fill-opacity="0.3"/>
  <text x="610" y="144" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">✨ PVE Assist (全智能精装)</text>

  <g transform="translate(530, 175)" font-size="14" fill="#cbd5e1">
    <text x="0" y="0" font-weight="600" fill="#38bdf8">🚀 换接高速市政自来水 (国内高校镜像)</text>
    <text x="20" y="24" font-size="12" fill="#94a3b8">中科大/清华/阿里源秒级切换，修复 Deb822 语法</text>

    <text x="0" y="65" font-weight="600" fill="#38bdf8">📊 节点仪表盘全感官亮屏</text>
    <text x="20" y="89" font-size="12" fill="#94a3b8">CPU功耗(W)/各核温度/风扇转速/NVMe 0E健康度</text>

    <text x="0" y="130" font-weight="600" fill="#38bdf8">🏠 空间全打通 (local 一体化大平层)</text>
    <text x="20" y="154" font-size="12" fill="#94a3b8">安全移除 local-lvm，ISO、容器、虚拟磁盘随意存</text>

    <text x="0" y="195" font-weight="600" fill="#38bdf8">🛡️ 事务级安全直通 + SR-IOV 虚拟化</text>
    <text x="20" y="219" font-size="12" fill="#94a3b8">显式分流、次回启动内核预编译、带标记备份与回滚</text>
  </g>
</svg>