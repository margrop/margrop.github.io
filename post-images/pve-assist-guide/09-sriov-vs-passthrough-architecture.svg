<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="480" y="42" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">硬件直通双轨制：整卡 VFIO 直通 vs SR-IOV 虚拟化切分</text>
  <text x="480" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">PVE Assist 将两者彻底解耦分流，杜绝传统工具「参数乱踩、显卡锁死」的世纪难题</text>

  <!-- Left: Whole Card -->
  <g transform="translate(50, 100)">
    <rect width="410" height="310" rx="14" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="25" y="25" width="150" height="28" rx="6" fill="#0284c7" fill-opacity="0.3"/>
    <text x="100" y="44" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">方案 A：整卡 VFIO 直通</text>

    <text x="25" y="85" fill="#f8fafc" font-size="15" font-weight="600">🏎️「包场专线」：独享整张显卡</text>
    <text x="25" y="110" fill="#94a3b8" font-size="12">物理 GPU (例如 NVIDIA/AMD 或 Intel 核显整卡) 直接绑定 vfio-pci</text>

    <!-- Visual Box -->
    <rect x="25" y="135" width="360" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="45" y="165" fill="#38bdf8" font-size="13" font-weight="600">物理 GPU (PF)</text>
    <path d="M 170 170 L 230 170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="245" y="165" fill="#22c55e" font-size="13" font-weight="600">单个主虚拟机 (VM)</text>
    <text x="45" y="190" fill="#64748b" font-size="11">宿主机放弃核显输出，由指定 VM 获得 100% 原生满血算力</text>

    <text x="25" y="235" fill="#cbd5e1" font-size="13" font-weight="600">🛡️ PVE Assist 安全亮点：</text>
    <text x="25" y="260" fill="#94a3b8" font-size="12">• 显式绑定 VFIO，自动规避 i915 / 内核驱动冲突</text>
    <text x="25" y="282" fill="#94a3b8" font-size="12">• 重启前硬验证，支持一键撤销并恢复宿主机核显</text>
  </g>

  <!-- Right: SR-IOV -->
  <g transform="translate(500, 100)">
    <rect width="410" height="310" rx="14" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="25" y="25" width="160" height="28" rx="6" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="105" y="44" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">方案 B：SR-IOV 虚拟切分</text>

    <text x="25" y="85" fill="#f8fafc" font-size="15" font-weight="600">🚇「高铁拼车」：1张核显切成 1~7 张</text>
    <text x="25" y="110" fill="#94a3b8" font-size="12">Intel 11~14 代核显生成多个独立虚拟功能 (VF)</text>

    <!-- Visual Box -->
    <rect x="25" y="135" width="360" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="40" y="160" fill="#c084fc" font-size="12" font-weight="600">物理 GPU</text>
    <text x="40" y="180" fill="#94a3b8" font-size="10">(PF 主干道)</text>

    <g transform="translate(130, 145)" font-size="11">
      <rect x="0" y="0" width="70" height="22" rx="4" fill="#3b0764"/>
      <text x="35" y="15" fill="#c084fc" text-anchor="middle">VF1: 群晖</text>
      <rect x="80" y="0" width="70" height="22" rx="4" fill="#3b0764"/>
      <text x="115" y="15" fill="#c084fc" text-anchor="middle">VF2: FNOS</text>
      <rect x="160" y="0" width="70" height="22" rx="4" fill="#3b0764"/>
      <text x="195" y="15" fill="#c084fc" text-anchor="middle">VF3: Win</text>
    </g>
    <text x="130" y="195" fill="#22c55e" font-size="11">同时硬解转码，互不干扰、资源超额复用</text>

    <text x="25" y="235" fill="#cbd5e1" font-size="13" font-weight="600">🛡️ PVE Assist 安全亮点：</text>
    <text x="25" y="260" fill="#94a3b8" font-size="12">• 针对「下次启动内核」构建 DKMS，解决幽灵内核脱节</text>
    <text x="25" y="282" fill="#94a3b8" font-size="12">• 适配 Win 驱动 Code 0、FNOS VA-API 及群晖 USB 引导</text>
  </g>
</svg>