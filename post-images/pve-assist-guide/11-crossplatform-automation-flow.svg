<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="cliCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <text x="480" y="42" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">多平台一键全自动投递脚本体系 (Win11 / Ubuntu / macOS)</text>
  <text x="480" y="68" fill="#94a3b8" font-size="13" text-anchor="middle">无需在每台客户机上额外安装依赖，纯原生 SSH/PowerShell 驱动，支持「人工交互」与「AI Agent 自动化」双模式</text>

  <!-- Left: Client Platforms -->
  <g transform="translate(40, 100)">
    <rect width="250" height="290" rx="12" fill="url(#cliCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="35" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">💻 客户端平台 (Client OS)</text>

    <g transform="translate(20, 60)" font-size="12">
      <!-- Win11 -->
      <rect x="0" y="0" width="210" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" fill="#38bdf8" font-weight="bold">Windows 11</text>
      <text x="15" y="45" fill="#94a3b8">PowerShell 7 / 5.1 原生脚本</text>

      <!-- Ubuntu -->
      <rect x="0" y="75" width="210" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="99" fill="#f97316" font-weight="bold">Ubuntu 26.04 LTS</text>
      <text x="15" y="120" fill="#94a3b8">纯 Bash，零外部 pip/npm 依赖</text>

      <!-- macOS -->
      <rect x="0" y="150" width="210" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="174" fill="#e2e8f0" font-weight="bold">macOS 26</text>
      <text x="15" y="195" fill="#94a3b8">原生 Zsh / Bash 兼容器</text>
    </g>
  </g>

  <!-- Middle: Dual Mode Channels -->
  <g transform="translate(320, 100)">
    <rect width="320" height="290" rx="12" fill="url(#cliCard)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="160" y="35" fill="#818cf8" font-size="15" font-weight="bold" text-anchor="middle">⚙️ 双模式投递管道 (Pipeline)</text>

    <!-- Mode A -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="280" height="95" rx="8" fill="#1e1b4b" stroke="#4f46e5"/>
      <text x="15" y="26" fill="#a5b4fc" font-size="13" font-weight="bold">模式 1：人工一键执行 (Interactive)</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">• 交互式引导输入 PVE 主机 IP / 端口</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="11">• 自动建立安全 SSH 隧道并拉起 TUI 菜单</text>
      <text x="15" y="88" fill="#34d399" font-size="10">体验丝滑，直接在终端里方向键点选</text>
    </g>

    <!-- Mode B -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="280" height="100" rx="8" fill="#064e3b" stroke="#059669"/>
      <text x="15" y="26" fill="#6ee7b7" font-size="13" font-weight="bold">模式 2：AI Agent 自动配置 (Headless)</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">• 传递参数静默投递，无需人工打回车</text>
      <text x="15" y="70" fill="#cbd5e1" font-size="11">• 自动化健康巡检与 JSON 格式状态返回</text>
      <text x="15" y="90" fill="#6ee7b7" font-size="10">适合云原生、批量运维、自主智能体部署</text>
    </g>
  </g>

  <!-- Right: Target Proxmox VE Host -->
  <g transform="translate(670, 100)">
    <rect width="250" height="290" rx="12" fill="url(#cliCard)" stroke="#10b981" stroke-width="1.5"/>
    <text x="125" y="35" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle">🎯 目标宿主机 (PVE 9)</text>

    <g transform="translate(20, 65)" font-size="12" fill="#cbd5e1">
      <circle cx="10" cy="15" r="5" fill="#38bdf8"/>
      <text x="25" y="19" font-weight="bold">下载与安装校验</text>
      <text x="25" y="38" fill="#94a3b8" font-size="11">SHA256 &amp; PVE 9 版本硬锁</text>

      <circle cx="10" cy="70" r="5" fill="#6366f1"/>
      <text x="25" y="74" font-weight="bold">单文件二进制部署</text>
      <text x="25" y="93" fill="#94a3b8" font-size="11">/usr/local/bin/pve-assist</text>

      <circle cx="10" cy="125" r="5" fill="#10b981"/>
      <text x="25" y="129" font-weight="bold">执行换源/增强/直通</text>
      <text x="25" y="148" fill="#94a3b8" font-size="11">带 marker 备份，无损升级</text>

      <circle cx="10" cy="180" r="5" fill="#f59e0b"/>
      <text x="25" y="184" font-weight="bold">后台平滑生效</text>
      <text x="25" y="203" fill="#94a3b8" font-size="11">防 WebShell 中断，无感刷新</text>
    </g>
  </g>
</svg>