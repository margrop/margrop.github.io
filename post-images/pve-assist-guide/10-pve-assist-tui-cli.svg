<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" style="background:#090d16; font-family:'Fira Code',Menlo,Monaco,Consolas,monospace;">
  <!-- Terminal Window Header -->
  <rect x="30" y="20" width="900" height="440" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="20" width="900" height="36" rx="10" fill="#1e293b"/>
  <circle cx="55" cy="38" r="6" fill="#ef4444"/>
  <circle cx="75" cy="38" r="6" fill="#f59e0b"/>
  <circle cx="95" cy="38" r="6" fill="#10b981"/>
  <text x="480" y="43" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">root@pve-node:~# pve-assist (Proxmox VE 9.x Maintenance Suite)</text>

  <!-- Terminal Content -->
  <g transform="translate(60, 85)" font-size="13" fill="#e2e8f0">
    <text x="0" y="0" fill="#38bdf8" font-weight="bold">╔═══════════════════════════════════════════════════════════════════════════════╗</text>
    <text x="0" y="20" fill="#38bdf8" font-weight="bold">║           PVE Assist v1.2.59 · 面向 Proxmox VE 9.x 的安全维护套件             ║</text>
    <text x="0" y="40" fill="#38bdf8" font-weight="bold">╚═══════════════════════════════════════════════════════════════════════════════╝</text>

    <text x="20" y="75" fill="#34d399"> 1. 一键设置 DNS、换源并更新系统  <tspan fill="#64748b">[中科大/清华/阿里源 + Deb822 格式修复]</tspan></text>
    <text x="20" y="100" fill="#34d399"> 2. 去除订阅及仓库黄色提示        <tspan fill="#64748b">[消灭 No-Subscription 弹窗与更新警告]</tspan></text>
    <text x="20" y="125" fill="#38bdf8"> 3. 修改 PVE 概要信息 (监控增强)  <tspan fill="#64748b">[CPU功耗/各核温度/风扇/0E监测/UPS电池]</tspan></text>
    <text x="20" y="150" fill="#c084fc"> 4. 硬件直通与 SR-IOV 配置向导    <tspan fill="#64748b">[整卡 VFIO / 1-7核显虚拟切分 / 停机验证]</tspan></text>
    <text x="20" y="175" fill="#e2e8f0"> 5. CPU 电源管理 P-State 模式     <tspan fill="#64748b">[AMD Guided/Active/Passive 自适应策略]</tspan></text>
    <text x="20" y="200" fill="#e2e8f0"> 6. CPU 工作模式与主频限制        <tspan fill="#64748b">[Intel EPP 高性能/均衡/省电; AMD Governor]</tspan></text>
    <text x="20" y="225" fill="#facc15"> 7. 系统维护与内核清理优化        <tspan fill="#64748b">[固定启动内核 / 卸载幽灵内核 / NTP 同步]</tspan></text>
    <text x="20" y="250" fill="#facc15"> 8. 合并 local-lvm 到 local       <tspan fill="#64748b">[删除空置 thinpool，扩容为一体化大存储]</tspan></text>
    <text x="20" y="275" fill="#94a3b8"> 9. 经典网卡名称 (eth0 兼容)      <tspan fill="#64748b">[写入 net.ifnames=0 biosdevname=0]</tspan></text>
    <text x="20" y="300" fill="#38bdf8">10. 健康检查、备份恢复与自更新    <tspan fill="#64748b">[带 Marker 配置秒级回滚，保障出厂状态]</tspan></text>
    <text x="20" y="325" fill="#22c55e">11. 高手推荐：一键全套初始化      <tspan fill="#64748b">[换源+去弹窗+概要增强+IOMMU基础一键搞定]</tspan></text>
    <text x="20" y="350" fill="#94a3b8">12. 存储健康与网络共享状态 (Samba)<tspan fill="#64748b">[ZFS/磁盘健康只读巡检与共享示例查看]</tspan></text>
  </g>
</svg>