<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <text x="480" y="40" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Proxmox VE 节点概要增强：全景监测指标体系</text>
  <text x="480" y="65" fill="#94a3b8" font-size="13" text-anchor="middle">PVE Assist 注入的安全非阻塞 UI 补丁，让关键硬件健康状态一目了然</text>

  <!-- Metric 1: CPU Package Watt -->
  <g transform="translate(40, 95)">
    <rect width="270" height="155" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="32" fill="#38bdf8" font-size="14" font-weight="bold">⚡ CPU 功耗 (Package Watt)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">采集：turbostat PkgWatt / powercap</text>
    <text x="20" y="95" fill="#38bdf8" font-size="28" font-weight="bold">38.4 W</text>
    <rect x="20" y="115" width="230" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="115" width="90" height="6" rx="3" fill="#38bdf8"/>
    <text x="20" y="138" fill="#64748b" font-size="11">带超时断路保护，永不卡死 Web UI</text>
  </g>

  <!-- Metric 2: Per-core Temp & Multi-Socket -->
  <g transform="translate(345, 95)">
    <rect width="270" height="155" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1"/>
    <text x="20" y="32" fill="#34d399" font-size="14" font-weight="bold">🌡️ 核心温度与多路 CPU</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">双路按 CPU 1 / CPU 2 智能分组</text>
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="65" height="26" rx="4" fill="#065f46"/>
      <text x="32" y="18" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">48°C 均</text>
      <rect x="75" y="0" width="65" height="26" rx="4" fill="#065f46"/>
      <text x="107" y="18" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">42°C 低</text>
      <rect x="150" y="0" width="65" height="26" rx="4" fill="#854d0e"/>
      <text x="182" y="18" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle">68°C 高</text>
    </g>
    <text x="20" y="138" fill="#64748b" font-size="11">&lt;60°C 绿色 | 60-79°C 黄色 | ≥80°C 红色</text>
  </g>

  <!-- Metric 3: Per-thread Frequency -->
  <g transform="translate(650, 95)">
    <rect width="270" height="155" rx="10" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1"/>
    <text x="20" y="32" fill="#818cf8" font-size="14" font-weight="bold">🚀 线程频率色块统计</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">按各核心实时调度频率动态渲染</text>
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="45" height="24" rx="4" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="22" y="16" fill="#818cf8" font-size="11" text-anchor="middle">2.4G</text>
      <rect x="52" y="0" width="45" height="24" rx="4" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="74" y="16" fill="#818cf8" font-size="11" text-anchor="middle">3.2G</text>
      <rect x="104" y="0" width="45" height="24" rx="4" fill="#713f12" stroke="#eab308"/>
      <text x="126" y="16" fill="#fde047" font-size="11" text-anchor="middle">4.8G</text>
      <rect x="156" y="0" width="45" height="24" rx="4" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="178" y="16" fill="#818cf8" font-size="11" text-anchor="middle">2.8G</text>
    </g>
    <text x="20" y="138" fill="#64748b" font-size="11">&lt;70% 负荷低调蓝绿 | ≥70% 睿频醒目黄色</text>
  </g>

  <!-- Metric 4: Fan Speeds -->
  <g transform="translate(40, 275)">
    <rect width="270" height="155" rx="10" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="0.7"/>
    <text x="20" y="32" fill="#f8fafc" font-size="14" font-weight="bold">🌀 风扇转速 (hwmon / IPMI)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">智能 2000 RPM 动态基准保护</text>
    <text x="20" y="95" fill="#f8fafc" font-size="24" font-weight="bold">1150 RPM <tspan fill="#22c55e" font-size="14">(57%)</tspan></text>
    <text x="20" y="125" fill="#94a3b8" font-size="12">防低速误报满速，低于60%保持健康绿</text>
    <text x="20" y="142" fill="#64748b" font-size="11">无硬件传感器时不强行探测，保稳定性</text>
  </g>

  <!-- Metric 5: NVMe / SATA Health & 0E Monitoring -->
  <g transform="translate(345, 275)">
    <rect width="270" height="155" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="32" fill="#fbbf24" font-size="14" font-weight="bold">💾 多盘阵列与 0E 早期监测</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">NVME1/2, SATA1/2 排序编号</text>
    <text x="20" y="90" fill="#cbd5e1" font-size="13">NVME1: 41°C | 寿命 99% | <tspan fill="#22c55e">健康</tspan></text>
    <text x="20" y="112" fill="#cbd5e1" font-size="13">NVME2: 44°C | 0E 错误 0 | <tspan fill="#22c55e">健康</tspan></text>
    <text x="20" y="140" fill="#64748b" font-size="11">寿命&lt;10%、介质错误、重映射扇区标红警报</text>
  </g>

  <!-- Metric 6: UPS & Laptop Battery -->
  <g transform="translate(650, 275)">
    <rect width="270" height="155" rx="10" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1"/>
    <text x="20" y="32" fill="#f472b6" font-size="14" font-weight="bold">🔋 UPS 智能监控 / 笔记本电池</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">优先 apcupsd / NUT，无独立 UPS 回退</text>
    <text x="20" y="92" fill="#f472b6" font-size="20" font-weight="bold">100% 在线 <tspan fill="#94a3b8" font-size="13">(续航约 45m)</tspan></text>
    <text x="20" y="122" fill="#cbd5e1" font-size="12">电压：228V | 负载率：18%</text>
    <text x="20" y="140" fill="#64748b" font-size="11">笔电主机直接读取 Linux 标准电池接口</text>
  </g>
</svg>