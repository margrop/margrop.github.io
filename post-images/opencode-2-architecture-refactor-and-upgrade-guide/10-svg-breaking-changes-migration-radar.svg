<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">OpenCode 2.0 升级必踩四大雷区与兼容性排查雷达</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16">官方重大不兼容变更深度剖析与安全迁移防护策略</text>

  <!-- 2x2 Grid -->
  <!-- Card 1: Plugin API Overhaul -->
  <g transform="translate(60, 115)">
    <rect width="520" height="240" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="240" rx="4" fill="#f85149"/>
    <text x="24" y="38" fill="#f85149" font-size="18" font-weight="bold">雷区一：插件系统 API 完全重写 (Plugin API V2)</text>
    <text x="24" y="68" fill="#f0f6fc" font-size="14" font-weight="bold">❌ 现象：升级后启动报 TypeError: plugin.registerHooks is not a function</text>
    <text x="24" y="96" fill="#8b949e" font-size="13">• 根因：V1 插件基于简单回调，V2 全面切换为基于领域驱动上下文的 Hook 体系</text>
    <text x="24" y="122" fill="#8b949e" font-size="13">• 影响：老插件（如 oh-my-opencode 1.x、自定义工具拦截器）会导致启动崩溃</text>
    <text x="24" y="150" fill="#ffa198" font-size="13" font-weight="bold">• 应对方案：必须在升级前将 ~/.config/opencode/plugins/ 下插件隔离至备份目录</text>
    <text x="24" y="176" fill="#cbd5e1" font-size="13">• 迁移策略：等待作者发布 V2 兼容版本，或使用 Code Mode 替代传统脚本插件</text>
    <text x="24" y="204" fill="#7ee787" font-size="12">自动化脚本：检测老插件并安全隔离，生成 disabled 标记</text>
  </g>

  <!-- Card 2: Config Schema Mutation -->
  <g transform="translate(620, 115)">
    <rect width="520" height="240" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="240" rx="4" fill="#d29922"/>
    <text x="24" y="38" fill="#d29922" font-size="18" font-weight="bold">雷区二：权限与配置字段剧变 (tools -&gt; permission)</text>
    <text x="24" y="68" fill="#f0f6fc" font-size="14" font-weight="bold">❌ 现象：静默拒绝执行工具、命令行警告 Config schema deprecated</text>
    <text x="24" y="96" fill="#8b949e" font-size="13">• 根因：V1 的分散式 "tools" 字段已全量归并至严苛的 "permission" 模型</text>
    <text x="24" y="122" fill="#8b949e" font-size="13">• 影响：嵌套层级混合使用旧格式时，可能导致特定 Agent 工具权限被静默收回</text>
    <text x="24" y="150" fill="#e3b341" font-size="13" font-weight="bold">• 应对方案：由自动化工具或会话内 Prompt 进行 AST 级无损迁移</text>
    <text x="24" y="176" fill="#cbd5e1" font-size="13">• 迁移提示词："Migrate my OpenCode configuration to V2 format preserving behavior"</text>
    <text x="24" y="204" fill="#7ee787" font-size="12">自动化脚本：递归解析 JSON/JSONC，自动对齐 permission 规范</text>
  </g>

  <!-- Card 3: TUI Config Consolidation -->
  <g transform="translate(60, 380)">
    <rect width="520" height="240" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="240" rx="4" fill="#58a6ff"/>
    <text x="24" y="38" fill="#58a6ff" font-size="18" font-weight="bold">雷区三：终端客户端配置统一收口 (tui.json 废弃)</text>
    <text x="24" y="68" fill="#f0f6fc" font-size="14" font-weight="bold">❌ 现象：升级后终端快捷键失效、主题变回默认配色、本地配置丢失</text>
    <text x="24" y="96" fill="#8b949e" font-size="13">• 根因：废弃多层级 tui.json / tui.jsonc，全部收口至 ~/.config/opencode/cli.json</text>
    <text x="24" y="122" fill="#8b949e" font-size="13">• 影响：项目级局部 tui.json 不再被 TUI 自动读取，需显式声明于全局 cli.json</text>
    <text x="24" y="150" fill="#79c0ff" font-size="13" font-weight="bold">• 应对方案：将原 tui.jsonc 提取合并至 cli.json 并转换键名</text>
    <text x="24" y="176" fill="#cbd5e1" font-size="13">• 自动行为：V2 首次启动会尝试迁移全局配置，但本地项目配置会被忽略</text>
    <text x="24" y="204" fill="#7ee787" font-size="12">自动化脚本：深度递归扫描工作区，完成跨文件配置合并</text>
  </g>

  <!-- Card 4: Socket Lock & Zombie Daemons -->
  <g transform="translate(620, 380)">
    <rect width="520" height="240" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="240" rx="4" fill="#a371f7"/>
    <text x="24" y="38" fill="#bc8cff" font-size="18" font-weight="bold">雷区四：僵尸进程端口抢占与 Socket 锁死 (EADDRINUSE)</text>
    <text x="24" y="68" fill="#f0f6fc" font-size="14" font-weight="bold">❌ 现象：opencode: error: listen EADDRINUSE: address already in use 127.0.0.1:4096</text>
    <text x="24" y="96" fill="#8b949e" font-size="13">• 根因：升级前 V1 后台未正常终止，或残留 /tmp/opencode.sock 锁文件未清理</text>
    <text x="24" y="122" fill="#8b949e" font-size="13">• 影响：V2 二进制无法创建新服务端守护进程，导致所有客户端无法连接</text>
    <text x="24" y="150" fill="#d2a8ff" font-size="13" font-weight="bold">• 应对方案：必须先 kill 遗留 node 进程，并删除 stale socket 锁文件</text>
    <text x="24" y="176" fill="#cbd5e1" font-size="13">• SDK 契约变化：自定义集成必须使用官方 @opencode/client TypeScript 包</text>
    <text x="24" y="204" fill="#7ee787" font-size="12">自动化脚本：智能检测并杀灭孤儿进程，清空残留 lockfile</text>
  </g>
</svg>