<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">Code Mode 运作机制大比方：一次性列清单买菜 vs 来回跑腿十次</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16">为什么 @opencode/codemode 能够让多工具组合执行速度暴增 10 倍？</text>

  <!-- Left: 1.0 Sequential Tool Calling -->
  <g transform="translate(60, 115)">
    <rect width="520" height="425" rx="14" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="425" rx="4" fill="#da3633"/>
    <text x="24" y="36" fill="#f85149" font-size="18" font-weight="bold">❌ 传统工具调用 (V1 / 行业通用方式)</text>
    <text x="24" y="62" fill="#8b949e" font-size="14">【保姆式串行往返】：每次执行都要与大模型汇报一轮</text>

    <!-- Timeline Steps -->
    <g transform="translate(24, 85)">
      <circle cx="16" cy="20" r="14" fill="#30363d"/><text x="16" y="25" text-anchor="middle" fill="#ffa198" font-size="12" font-weight="bold">1</text>
      <text x="42" y="18" fill="#f0f6fc" font-size="13" font-weight="bold">去菜场买个番茄 (调用工具: git.status)</text>
      <text x="42" y="36" fill="#8b949e" font-size="12">网络往返 1.2s，消耗 400 Context Tokens</text>

      <circle cx="16" cy="75" r="14" fill="#30363d"/><text x="16" y="80" text-anchor="middle" fill="#ffa198" font-size="12" font-weight="bold">2</text>
      <text x="42" y="73" fill="#f0f6fc" font-size="13" font-weight="bold">跑回家问你：番茄买好了，还要啥？</text>
      <text x="42" y="91" fill="#8b949e" font-size="12">模型再次推理，等待人类或上下文确认 1.5s</text>

      <circle cx="16" cy="130" r="14" fill="#30363d"/><text x="16" y="135" text-anchor="middle" fill="#ffa198" font-size="12" font-weight="bold">3</text>
      <text x="42" y="128" fill="#f0f6fc" font-size="13" font-weight="bold">再去买两个鸡蛋 (调用工具: lsp.getDefinition)</text>
      <text x="42" y="146" fill="#8b949e" font-size="12">网络往返 1.1s，消耗 650 Context Tokens</text>

      <circle cx="16" cy="185" r="14" fill="#30363d"/><text x="16" y="190" text-anchor="middle" fill="#ffa198" font-size="12" font-weight="bold">4</text>
      <text x="42" y="183" fill="#f0f6fc" font-size="13" font-weight="bold">再跑回家问你：鸡蛋买好了，接下来呢？</text>
      <text x="42" y="201" fill="#8b949e" font-size="12">模型第三次推理，上下文急剧膨胀</text>

      <circle cx="16" cy="240" r="14" fill="#30363d"/><text x="16" y="245" text-anchor="middle" fill="#ffa198" font-size="12" font-weight="bold">5</text>
      <text x="42" y="238" fill="#f0f6fc" font-size="13" font-weight="bold">再去买一捆小葱 (调用工具: testRunner.run)</text>
      <text x="42" y="256" fill="#8b949e" font-size="12">网络往返 1.4s，中间极易发生工具参数幻觉</text>
    </g>

    <text x="24" y="385" fill="#f85149" font-size="15" font-weight="bold">⏱ 总耗时：5.2 秒 | 累积消耗：3,800+ Tokens</text>
    <text x="24" y="408" fill="#8b949e" font-size="13">痛点：跑腿的人累死，做饭的人急死，多次往返网络开销巨大</text>
  </g>

  <!-- Right: 2.0 Code Mode -->
  <g transform="translate(620, 115)">
    <rect width="520" height="425" rx="14" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="425" rx="4" fill="#238636"/>
    <text x="24" y="36" fill="#3fb950" font-size="18" font-weight="bold">✔ Code Mode (OpenCode 2.0 创新机制)</text>
    <text x="24" y="62" fill="#8b949e" font-size="14">【智能清单一次性搞定】：写成 JavaScript 脚本原子执行</text>

    <!-- Code Mode Steps -->
    <g transform="translate(24, 85)">
      <rect width="472" height="150" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="26" fill="#58a6ff" font-size="12" font-weight="bold">// 大模型在第一步直接写出一个复合脚本：</text>
      <text x="16" y="48" fill="#7ee787" font-size="12">const st = await git.status();</text>
      <text x="16" y="68" fill="#7ee787" font-size="12">const defs = await lsp.getDefinition(st.file);</text>
      <text x="16" y="88" fill="#7ee787" font-size="12">await fs.patch(st.file, defs.fix);</text>
      <text x="16" y="108" fill="#7ee787" font-size="12">const result = await testRunner.run();</text>
      <text x="16" y="130" fill="#ffa657" font-size="12">return result.passed ? 'ALL_DONE' : 'FAILED';</text>

      <g transform="translate(0, 170)">
        <circle cx="16" cy="18" r="14" fill="#238636"/><text x="16" y="23" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">★</text>
        <text x="42" y="16" fill="#f0f6fc" font-size="14" font-weight="bold">一次性打包进入安全沙箱本地极速执行</text>
        <text x="42" y="36" fill="#8b949e" font-size="12">无需经过大模型多次中转，本地环境毫秒级串联</text>

        <circle cx="16" cy="68" r="14" fill="#238636"/><text x="16" y="73" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">★</text>
        <text x="42" y="66" fill="#f0f6fc" font-size="14" font-weight="bold">仅将最终聚合结果返回大模型</text>
        <text x="42" y="86" fill="#8b949e" font-size="12">大幅降低上下文污染，避免中间变量挤占上下文窗口</text>
      </g>
    </g>

    <text x="24" y="385" fill="#3fb950" font-size="15" font-weight="bold">⚡ 总耗时：0.42 秒 (提升 11x) | 仅消耗：450 Tokens</text>
    <text x="24" y="408" fill="#8b949e" font-size="13">优势：将工具组合逻辑交给代码，大模型专注高阶决策</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="34" fill="#58a6ff" font-size="16" font-weight="bold">🎯 核心突破：让 MCP (Model Context Protocol) 从“笨重的远程 RPC”变成“大模型手中的本地标准库”</text>
    <text x="30" y="65" fill="#8b949e" font-size="14">OpenCode 2.0 默认将所有注册的 MCP 工具自动映射为 JavaScript 函数，让多工具链协作真正具备生产级速度。</text>
  </g>
</svg>