<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f1418"/>
      <stop offset="100%" stop-color="#220b0e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3321"/>
      <stop offset="100%" stop-color="#061c11"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">OpenCode 2.0 架构重构大比方：学校中央厨房 vs 教室各自开火</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16">为什么 2.0 的后台 Daemon 能把内存直降 95%，彻底告别 3GB 卡顿？（小学生秒懂版）</text>

  <!-- Left Card: 1.0 Classroom Cooking -->
  <g transform="translate(60, 115)">
    <rect width="520" height="420" rx="14" fill="url(#redGrad)" stroke="#f85149" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="420" rx="4" fill="#f85149"/>
    <text x="26" y="38" fill="#f85149" font-size="20" font-weight="bold">❌ OpenCode 1.x：每个教室各搬一台柴火灶</text>
    <text x="26" y="70" fill="#f1f5f9" font-size="15" font-weight="bold">【孤立单机模式】：每个终端窗口单开全套庞大运行时</text>

    <!-- Analogy Items -->
    <rect x="26" y="90" width="468" height="74" rx="8" fill="#2d1216" stroke="#da3633" stroke-width="1"/>
    <text x="42" y="118" fill="#ffa198" font-size="14" font-weight="bold">🍳 灶台与锅碗瓢盆塞满课桌 (内存爆炸)</text>
    <text x="42" y="145" fill="#cbd5e1" font-size="13">开 3 个终端就要启动 3 个 Node.js 运行时，瞬间吞噬 2GB+ 内存</text>

    <rect x="26" y="174" width="468" height="74" rx="8" fill="#2d1216" stroke="#da3633" stroke-width="1"/>
    <text x="42" y="202" fill="#ffa198" font-size="14" font-weight="bold">🪵 多个灶台争抢柴火油烟 (CPU 轮询竞争)</text>
    <text x="42" y="229" fill="#cbd5e1" font-size="13">每个窗口重复扫描代码库 AST 索引，导致风扇狂转、系统发烫</text>

    <rect x="26" y="258" width="468" height="74" rx="8" fill="#2d1216" stroke="#da3633" stroke-width="1"/>
    <text x="42" y="286" fill="#ffa198" font-size="14" font-weight="bold">🚫 隔壁班炒完菜，你这班还得重炒 (数据孤岛)</text>
    <text x="42" y="313" fill="#cbd5e1" font-size="13">终端 A 刚生成的代码上下文，终端 B 与 Web 界面完全看不见</text>

    <text x="26" y="375" fill="#f85149" font-size="16" font-weight="bold">⚠️ 结果：内存爆满、多窗口割裂、电脑卡成幻灯片</text>
    <text x="26" y="400" fill="#8b949e" font-size="13">典型指标：单终端 600MB+，3 个标签页累加突破 1.8GB-2.5GB</text>
  </g>

  <!-- Right Card: 2.0 Central Kitchen -->
  <g transform="translate(620, 115)">
    <rect width="520" height="420" rx="14" fill="url(#greenGrad)" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="420" rx="4" fill="#3fb950"/>
    <text x="26" y="38" fill="#3fb950" font-size="20" font-weight="bold">✔ OpenCode 2.0：全校统一地下中央大厨房</text>
    <text x="26" y="70" fill="#f1f5f9" font-size="15" font-weight="bold">【统一 Daemon 守护】：单例后台核心 + 极轻量客户端</text>

    <!-- Analogy Items -->
    <rect x="26" y="90" width="468" height="74" rx="8" fill="#0c2619" stroke="#238636" stroke-width="1"/>
    <text x="42" y="118" fill="#7ee787" font-size="14" font-weight="bold">👨‍🍳 专业厨师集中烹饪 (单例内存仅 86MB)</text>
    <text x="42" y="145" fill="#cbd5e1" font-size="13">后台仅运行一个高性能 Daemon 进程，所有工具与模型统一挂载</text>

    <rect x="26" y="174" width="468" height="74" rx="8" fill="#0c2619" stroke="#238636" stroke-width="1"/>
    <text x="42" y="202" fill="#7ee787" font-size="14" font-weight="bold">📡 教室只配一台微型对讲机 (IPC 极速响应)</text>
    <text x="42" y="229" fill="#cbd5e1" font-size="13">终端 TUI / 桌面 App / Web 只是轻量通信探针，启动仅需 12ms</text>

    <rect x="26" y="258" width="468" height="74" rx="8" fill="#0c2619" stroke="#238636" stroke-width="1"/>
    <text x="42" y="286" fill="#7ee787" font-size="14" font-weight="bold">🍲 全校共用一个出餐看板 (多端实时同步)</text>
    <text x="42" y="313" fill="#cbd5e1" font-size="13">终端敲的代码，浏览器与桌面应用毫秒级同步查看，会话天然互通</text>

    <text x="26" y="375" fill="#3fb950" font-size="16" font-weight="bold">🚀 收益：内存暴跌 95%、随手多开终端、全平台实时联动</text>
    <text x="26" y="400" fill="#8b949e" font-size="13">实测指标：核心常驻仅 86MB，多开 10 个终端依然丝滑如飞</text>
  </g>

  <!-- Bottom Comparison Strip -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="34" fill="#58a6ff" font-size="16" font-weight="bold">💡 架构进化总结：从“桌面端臃肿胖客户端”蜕变为“类 Docker / LSP 的 Client-Daemon 现代解耦范式”</text>
    <text x="30" y="65" fill="#8b949e" font-size="14">无论你在终端输入 opencode，还是用浏览器打开 localhost:4096，你都在操控同一个底层的全知 Agent 大脑。</text>
  </g>
</svg>