<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">跨平台一键平滑升级与自动化容灾流水线架构</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16">适配 Windows 11 (PowerShell) / Ubuntu 26.04 (Bash) / macOS 27 (Zsh) 的零依赖生产级流程</text>

  <!-- 5 Sequential Pipeline Steps -->
  <g transform="translate(50, 130)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="340" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b"/>
      <text x="100" y="27" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">阶段 1: 环境探测</text>
      <text x="16" y="70" fill="#f1f5f9" font-size="13" font-weight="bold">• 操作系统与构架</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">Win11 / Ubuntu / macOS</text>
      <text x="16" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 包管理器探查</text>
      <text x="16" y="145" fill="#94a3b8" font-size="11">brew / npm / curl binary</text>
      <text x="16" y="180" fill="#f1f5f9" font-size="13" font-weight="bold">• 当前版本采集</text>
      <text x="16" y="200" fill="#94a3b8" font-size="11">识别 v1.x (如 1.19.2)</text>
      <text x="16" y="240" fill="#f1f5f9" font-size="13" font-weight="bold">• 模式决策</text>
      <text x="16" y="260" fill="#38bdf8" font-size="11">交互模式 vs --agent JSON</text>
      <rect x="16" y="295" width="168" height="28" rx="6" fill="#0c4a6e"/>
      <text x="100" y="314" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="bold">✓ 审计报告就绪</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 205 170 L 225 170" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <!-- Stage 2 -->
    <g transform="translate(230, 0)">
      <rect width="200" height="340" rx="10" fill="#161b22" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b"/>
      <text x="100" y="27" text-anchor="middle" fill="#f43f5e" font-size="14" font-weight="bold">阶段 2: 僵尸清理</text>
      <text x="16" y="70" fill="#f1f5f9" font-size="13" font-weight="bold">• 优雅信号通知</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">SIGTERM 停止运行进程</text>
      <text x="16" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 强制孤儿回收</text>
      <text x="16" y="145" fill="#94a3b8" font-size="11">超时后 kill -9 残留 Node</text>
      <text x="16" y="180" fill="#f1f5f9" font-size="13" font-weight="bold">• Socket 锁擦除</text>
      <text x="16" y="200" fill="#94a3b8" font-size="11">删除 /tmp/*.sock 文件</text>
      <text x="16" y="240" fill="#f1f5f9" font-size="13" font-weight="bold">• 释放端口 4096</text>
      <text x="16" y="260" fill="#f43f5e" font-size="11">消除 EADDRINUSE 隐患</text>
      <rect x="16" y="295" width="168" height="28" rx="6" fill="#4c0519"/>
      <text x="100" y="314" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="bold">✓ 端口与进程净空</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 435 170 L 455 170" stroke="#f43f5e" stroke-width="3" fill="none"/>

    <!-- Stage 3 -->
    <g transform="translate(460, 0)">
      <rect width="200" height="340" rx="10" fill="#161b22" stroke="#eab308" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b"/>
      <text x="100" y="27" text-anchor="middle" fill="#eab308" font-size="14" font-weight="bold">阶段 3: 快照备份</text>
      <text x="16" y="70" fill="#f1f5f9" font-size="13" font-weight="bold">• 配置全量封存</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">~/.config/opencode/*</text>
      <text x="16" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 历史会话快照</text>
      <text x="16" y="145" fill="#94a3b8" font-size="11">~/.opencode/ 完整打包</text>
      <text x="16" y="180" fill="#f1f5f9" font-size="13" font-weight="bold">• 时间戳归档</text>
      <text x="16" y="200" fill="#94a3b8" font-size="11">v1_backup_{timestamp}.tgz</text>
      <text x="16" y="240" fill="#f1f5f9" font-size="13" font-weight="bold">• 灾备回滚支持</text>
      <text x="16" y="260" fill="#eab308" font-size="11">若出错 100% 一键还原</text>
      <rect x="16" y="295" width="168" height="28" rx="6" fill="#422006"/>
      <text x="100" y="314" text-anchor="middle" fill="#fde047" font-size="11" font-weight="bold">✓ 零丢失快照落盘</text>
    </g>

    <!-- Connector Arrow 3 -->
    <path d="M 665 170 L 685 170" stroke="#eab308" stroke-width="3" fill="none"/>

    <!-- Stage 4 -->
    <g transform="translate(690, 0)">
      <rect width="200" height="340" rx="10" fill="#161b22" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b"/>
      <text x="100" y="27" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">阶段 4: 配置转换</text>
      <text x="16" y="70" fill="#f1f5f9" font-size="13" font-weight="bold">• tui.json 迁移</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">转换整合为 cli.json</text>
      <text x="16" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 权限模式重构</text>
      <text x="16" y="145" fill="#94a3b8" font-size="11">tools 字段 -&gt; permission</text>
      <text x="16" y="180" fill="#f1f5f9" font-size="13" font-weight="bold">• 老旧插件隔离</text>
      <text x="16" y="200" fill="#94a3b8" font-size="11">搬移至 plugins_v1_legacy/</text>
      <text x="16" y="240" fill="#f1f5f9" font-size="13" font-weight="bold">• 格式校验守护</text>
      <text x="16" y="260" fill="#a855f7" font-size="11">防止 JSON 语法破坏</text>
      <rect x="16" y="295" width="168" height="28" rx="6" fill="#3b0764"/>
      <text x="100" y="314" text-anchor="middle" fill="#d8b4fe" font-size="11" font-weight="bold">✓ V2 配置规范对齐</text>
    </g>

    <!-- Connector Arrow 4 -->
    <path d="M 895 170 L 915 170" stroke="#a855f7" stroke-width="3" fill="none"/>

    <!-- Stage 5 -->
    <g transform="translate(920, 0)">
      <rect width="200" height="340" rx="10" fill="#161b22" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b"/>
      <text x="100" y="27" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">阶段 5: 二进制与探针</text>
      <text x="16" y="70" fill="#f1f5f9" font-size="13" font-weight="bold">• 核心二进制替换</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">opencode upgrade --major</text>
      <text x="16" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 守护进程预热</text>
      <text x="16" y="145" fill="#94a3b8" font-size="11">拉起后台 opencode serve</text>
      <text x="16" y="180" fill="#f1f5f9" font-size="13" font-weight="bold">• 健康探针探测</text>
      <text x="16" y="200" fill="#94a3b8" font-size="11">GET /health 状态 HTTP 200</text>
      <text x="16" y="240" fill="#f1f5f9" font-size="13" font-weight="bold">• 内存达标核验</text>
      <text x="16" y="260" fill="#22c55e" font-size="11">核实常驻内存 &lt; 100MB</text>
      <rect x="16" y="295" width="168" height="28" rx="6" fill="#052e16"/>
      <text x="100" y="314" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold">✓ 升级成功交付</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(50, 500)">
    <rect width="1100" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="25" y="32" fill="#58a6ff" font-size="15" font-weight="bold">🛠 双模执行保障设计 (Dual-Mode Execution Guarantees):</text>
    <text x="25" y="62" fill="#cbd5e1" font-size="13">1. 人工互动模式 (Interactive): 终端输出全彩 ANSI 进度动画、提示每步详细细节、关键变更有交互确认，新手体感极佳。</text>
    <text x="25" y="90" fill="#cbd5e1" font-size="13">2. Agent 自动化模式 (--agent / --json): 静默运行、关闭交互提示、捕获全部异常，标准输出仅喷出结构化 JSON 回执，供上层 AI 智能体无缝消费。</text>
    <text x="25" y="120" fill="#7ee787" font-size="13">🛡 零第三方依赖：仅使用各操作系统原生内置 Shell 语法与工具 (Bash 5.2+ / Zsh / PowerShell 7+)，无需安装额外依赖。</text>
  </g>
</svg>