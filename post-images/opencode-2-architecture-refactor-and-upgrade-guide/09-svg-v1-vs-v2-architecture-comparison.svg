<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">OpenCode 1.x vs 2.0 架构拓扑演进全景对比</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16">从各自为战的 Monolithic 胖终端，到以守护进程为核心的分布式 Agent 操作系统</text>

  <!-- Left: V1 Topology -->
  <g transform="translate(60, 115)">
    <rect width="520" height="520" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="24" y="36" fill="#f85149" font-size="18" font-weight="bold">OpenCode 1.x 架构拓扑 (多实例资源孤岛)</text>

    <!-- Client Box 1 -->
    <rect x="24" y="60" width="472" height="130" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1"/>
    <text x="40" y="88" fill="#ffa198" font-size="14" font-weight="bold">终端窗口 1 (TUI Session A) — [RSS: 650MB]</text>
    <text x="40" y="112" fill="#8b949e" font-size="12">独立 Node.js 运行时 + 独立 AST 索引器 + 独立 MCP 连接池</text>
    <text x="40" y="132" fill="#8b949e" font-size="12">配置源: ~/.config/opencode/tui.json (孤立生效)</text>
    <text x="40" y="152" fill="#f85149" font-size="12">LLM 请求: 单独直连远程 API (无本地统一速率限制与缓存)</text>

    <!-- Client Box 2 -->
    <rect x="24" y="210" width="472" height="130" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1"/>
    <text x="40" y="238" fill="#ffa198" font-size="14" font-weight="bold">终端窗口 2 (TUI Session B) — [RSS: 620MB]</text>
    <text x="40" y="262" fill="#8b949e" font-size="12">独立 Node.js 运行时 + 重复 AST 扫描 + 独立 MCP 连接池</text>
    <text x="40" y="282" fill="#8b949e" font-size="12">配置源: ./opencode.json (局部覆盖)</text>
    <text x="40" y="302" fill="#f85149" font-size="12">状态同步: 无！两终端互不知晓上下文</text>

    <!-- Ad-hoc Server -->
    <rect x="24" y="360" width="472" height="130" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1"/>
    <text x="40" y="388" fill="#ffa198" font-size="14" font-weight="bold">Web/Desktop UI (需单独执行 opencode serve) — [RSS: 580MB]</text>
    <text x="40" y="412" fill="#8b949e" font-size="12">脆弱的 REST 接口，易出现僵尸端口 4096 占用</text>
    <text x="40" y="432" fill="#8b949e" font-size="12">总物理内存累计: 1.85 GB - 2.5 GB</text>
    <text x="40" y="452" fill="#da3633" font-size="12">并发执行: 互相阻塞，无统一任务调度池</text>
  </g>

  <!-- Right: V2 Topology -->
  <g transform="translate(620, 115)">
    <rect width="520" height="520" rx="14" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <text x="24" y="36" fill="#3fb950" font-size="18" font-weight="bold">OpenCode 2.0 架构拓扑 (Daemon 统一中枢)</text>

    <!-- Multi-Clients Layer -->
    <rect x="24" y="60" width="472" height="90" rx="8" fill="#1c2433" stroke="#388bfd" stroke-width="1"/>
    <text x="40" y="86" fill="#58a6ff" font-size="14" font-weight="bold">客户端接入层 (极轻量探针，每个仅消耗 15MB 内存)</text>
    <text x="40" y="110" fill="#cbd5e1" font-size="12">[终端 TUI 1]    [终端 TUI 2]    [Web 控制台]    [VS Code / Cursor 插件]</text>
    <text x="40" y="130" fill="#7ee787" font-size="12">通过 Unix Domain Socket (/run/user/1000/daemon.sock) 或 HTTP 本地直连</text>

    <!-- Central Daemon Layer -->
    <rect x="24" y="170" width="472" height="210" rx="8" fill="#0d1f14" stroke="#2ea043" stroke-width="1.5"/>
    <text x="40" y="198" fill="#7ee787" font-size="15" font-weight="bold">中央后台守护进程 (OpenCode Core Daemon) — [RSS: 86MB]</text>
    
    <rect x="40" y="215" width="205" height="65" rx="6" fill="#163821" stroke="#3fb950" stroke-width="1"/>
    <text x="50" y="238" fill="#e6edf3" font-size="12" font-weight="bold">Code Mode 引擎</text>
    <text x="50" y="258" fill="#8b949e" font-size="11">TypeScript 脚本原子沙箱</text>

    <rect x="265" y="215" width="215" height="65" rx="6" fill="#163821" stroke="#3fb950" stroke-width="1"/>
    <text x="275" y="238" fill="#e6edf3" font-size="12" font-weight="bold">Subagent 任务调度池</text>
    <text x="275" y="258" fill="#8b949e" font-size="11">后台并行探针 (Build/Plan/Explore)</text>

    <rect x="40" y="295" width="440" height="65" rx="6" fill="#163821" stroke="#3fb950" stroke-width="1"/>
    <text x="50" y="318" fill="#e6edf3" font-size="12" font-weight="bold">统一 AST 索引与文件系统监听 (File Watcher)</text>
    <text x="50" y="338" fill="#8b949e" font-size="11">全项目单份缓存，杜绝重复扫描与 CPU 抖动 | 权限统一管控 (permission)</text>

    <!-- Model & Providers Layer -->
    <rect x="24" y="400" width="472" height="110" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="426" fill="#d2a8ff" font-size="14" font-weight="bold">模型与提供商层 (75+ Providers &amp; Models.dev)</text>
    <text x="40" y="450" fill="#cbd5e1" font-size="12">统一管理 API Key、并发速率控制、流式 Token 代理、OpenCode Go</text>
    <text x="40" y="470" fill="#7ee787" font-size="12">Anthropic (Claude 3.7/4.5) | Google (Gemini 4 Argon) | DeepSeek | 本地 Ollama</text>
  </g>
</svg>