<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Structured memory recall passes through six deterministic gates">
  <rect width="1200" height="760" rx="34" fill="#f8fafc"/><text x="65" y="78" fill="#0f172a" font-size="42" font-family="system-ui" font-weight="800">Recall is an airport security line</text><text x="65" y="122" fill="#475569" font-size="25" font-family="system-ui">Similarity nominates a candidate; deterministic gates decide whether it enters context.</text>
  <g font-family="system-ui" font-size="23" text-anchor="middle"><g fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"><rect x="55" y="240" width="160" height="145" rx="24"/><rect x="240" y="240" width="160" height="145" rx="24"/><rect x="425" y="240" width="160" height="145" rx="24"/></g><g fill="#dcfce7" stroke="#22c55e" stroke-width="3"><rect x="610" y="240" width="160" height="145" rx="24"/><rect x="795" y="240" width="160" height="145" rx="24"/><rect x="980" y="240" width="160" height="145" rx="24"/></g><g fill="#0f172a" font-weight="800"><text x="135" y="302">TENANT</text><text x="135" y="340">SCOPE</text><text x="320" y="302">SOURCE</text><text x="320" y="340">TRUST</text><text x="505" y="302">TIME</text><text x="505" y="340">VALIDITY</text><text x="690" y="302">LATEST</text><text x="690" y="340">VERSION</text><text x="875" y="302">CONSENT</text><text x="875" y="340">RISK</text><text x="1060" y="302">DELETE</text><text x="1060" y="340">STATUS</text></g></g>
  <g stroke="#64748b" stroke-width="5" fill="#64748b"><path d="M215 312h25"/><path d="M400 312h25"/><path d="M585 312h25"/><path d="M770 312h25"/><path d="M955 312h25"/></g>
  <rect x="325" y="500" width="550" height="135" rx="30" fill="#0f766e"/><text x="600" y="555" text-anchor="middle" fill="#ecfeff" font-size="34" font-family="system-ui" font-weight="800">PROMPT CONTEXT</text><text x="600" y="598" text-anchor="middle" fill="#99f6e4" font-size="24" font-family="system-ui">current · scoped · explainable · deletable</text><path d="M600 400v86" stroke="#0f766e" stroke-width="8"/><path d="m578 475 22 28 22-28" fill="#0f766e"/>
