<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Memory corrections create new versions and suppress old values">
  <rect width="1200" height="700" rx="34" fill="#0f172a"/><text x="70" y="84" fill="#f8fafc" font-size="42" font-family="system-ui" font-weight="800">Correction must replace, not compete</text><text x="70" y="130" fill="#94a3b8" font-size="25" font-family="system-ui">Appending a new sentence without suppressing the old one creates two “truths.”</text>
  <path d="M120 370h960" stroke="#475569" stroke-width="8"/>
  <g font-family="system-ui" text-anchor="middle"><circle cx="220" cy="370" r="70" fill="#7f1d1d" stroke="#fca5a5" stroke-width="4"/><text x="220" y="360" fill="#fee2e2" font-size="29" font-weight="800">v1</text><text x="220" y="398" fill="#fee2e2" font-size="22">team-blue</text><text x="220" y="500" fill="#fca5a5" font-size="24">SUPERSEDED</text><circle cx="600" cy="370" r="70" fill="#14532d" stroke="#86efac" stroke-width="4"/><text x="600" y="360" fill="#dcfce7" font-size="29" font-weight="800">v2</text><text x="600" y="398" fill="#dcfce7" font-size="22">team-green</text><text x="600" y="500" fill="#86efac" font-size="24">ACTIVE</text><circle cx="980" cy="370" r="70" fill="#1e3a8a" stroke="#93c5fd" stroke-width="4"/><text x="980" y="360" fill="#dbeafe" font-size="29" font-weight="800">DELETE</text><text x="980" y="398" fill="#dbeafe" font-size="22">tombstone</text><text x="980" y="500" fill="#93c5fd" font-size="24">NOT RECALLABLE</text></g>
  <path d="m490 348 35 22-35 22" fill="#86efac"/><path d="m870 348 35 22-35 22" fill="#93c5fd"/>
  <text x="600" y="620" text-anchor="middle" fill="#cbd5e1" font-size="27" font-family="ui-monospace,monospace">one active version · immutable audit · reversible reasoning</text>
</svg>
