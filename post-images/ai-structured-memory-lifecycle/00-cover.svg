<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Structured memory needs lifecycle gates</title><desc id="d">A memory gate admits current verified scoped data and rejects expired, cross-tenant, and untrusted records.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081428"/><stop offset="1" stop-color="#163c5d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <text x="72" y="105" fill="#7dd3fc" font-size="27" font-family="system-ui,sans-serif" font-weight="700">AI PLATFORM · STRUCTURED MEMORY</text>
  <text x="72" y="178" fill="#f8fafc" font-size="52" font-family="system-ui,sans-serif" font-weight="800">Remembering can be riskier</text>
  <text x="72" y="238" fill="#f8fafc" font-size="52" font-family="system-ui,sans-serif" font-weight="800">than forgetting</text>
  <g filter="url(#s)"><rect x="72" y="312" width="280" height="210" rx="24" fill="#17233a" stroke="#64748b" stroke-width="3"/><text x="212" y="365" text-anchor="middle" fill="#e2e8f0" font-size="29" font-family="system-ui,sans-serif" font-weight="700">CANDIDATES</text><text x="108" y="419" fill="#86efac" font-size="25" font-family="ui-monospace,monospace">✓ verified</text><text x="108" y="462" fill="#fca5a5" font-size="25" font-family="ui-monospace,monospace">✕ expired</text><text x="108" y="505" fill="#fca5a5" font-size="25" font-family="ui-monospace,monospace">✕ wrong scope</text></g>
  <path d="M370 417h130" stroke="#7dd3fc" stroke-width="8"/><path d="m490 395 32 22-32 22" fill="#7dd3fc"/>
  <g filter="url(#s)"><rect x="520" y="300" width="240" height="235" rx="38" fill="#0f766e" stroke="#5eead4" stroke-width="4"/><text x="640" y="373" text-anchor="middle" fill="#ecfeff" font-size="31" font-family="system-ui,sans-serif" font-weight="800">MEMORY</text><text x="640" y="414" text-anchor="middle" fill="#ecfeff" font-size="31" font-family="system-ui,sans-serif" font-weight="800">GATE</text><text x="640" y="468" text-anchor="middle" fill="#99f6e4" font-size="22" font-family="ui-monospace,monospace">source · scope</text><text x="640" y="501" text-anchor="middle" fill="#99f6e4" font-size="22" font-family="ui-monospace,monospace">version · TTL</text></g>
  <path d="M780 417h130" stroke="#86efac" stroke-width="8"/><path d="m900 395 32 22-32 22" fill="#86efac"/>
  <g filter="url(#s)"><rect x="932" y="335" width="196" height="165" rx="24" fill="#123326" stroke="#86efac" stroke-width="3"/><text x="1030" y="392" text-anchor="middle" fill="#dcfce7" font-size="28" font-family="system-ui,sans-serif" font-weight="800">CONTEXT</text><text x="1030" y="437" text-anchor="middle" fill="#86efac" font-size="22" font-family="ui-monospace,monospace">current</text><text x="1030" y="469" text-anchor="middle" fill="#86efac" font-size="22" font-family="ui-monospace,monospace">explainable</text></g>
  <text x="72" y="612" fill="#cbd5e1" font-size="26" font-family="system-ui,sans-serif">A vector search finds similar text. A lifecycle policy decides whether it may be used now.</text>
</svg>
