<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Memory trust and action risk matrix">
  <rect width="1200" height="780" rx="34" fill="#f8fafc"/><text x="70" y="82" fill="#0f172a" font-size="42" font-family="system-ui" font-weight="800">The riskier the action, the stronger the proof</text><text x="70" y="126" fill="#475569" font-size="25" font-family="system-ui">A guessed preference may personalize a greeting. It must never grant production authority.</text>
  <g transform="translate(220 185)" font-family="system-ui"><rect width="840" height="480" fill="#fff" stroke="#94a3b8" stroke-width="3"/><path d="M0 160h840M0 320h840M280 0v480M560 0v480" stroke="#cbd5e1" stroke-width="3"/><rect x="0" y="0" width="280" height="160" fill="#dcfce7"/><rect x="280" y="0" width="280" height="160" fill="#fef9c3"/><rect x="560" y="0" width="280" height="160" fill="#fee2e2"/><rect x="0" y="160" width="280" height="160" fill="#fef9c3"/><rect x="280" y="160" width="280" height="160" fill="#ffedd5"/><rect x="560" y="160" width="280" height="160" fill="#fee2e2"/><rect x="0" y="320" width="840" height="160" fill="#e2e8f0"/><g text-anchor="middle" font-size="25" font-weight="800" fill="#0f172a"><text x="140" y="72">READ-ONLY</text><text x="140" y="108">personalization</text><text x="420" y="72">BUSINESS</text><text x="420" y="108">recommendation</text><text x="700" y="72">HIGH-RISK</text><text x="700" y="108">side effect</text><text x="140" y="230">verify if used</text><text x="420" y="230">require source</text><text x="700" y="230">deny inference</text><text x="420" y="390">QUARANTINE: untrusted retrieved instructions</text></g><g font-size="22" fill="#475569" text-anchor="middle"><text x="140" y="145">confirmed preference</text><text x="420" y="145">verified directory</text><text x="700" y="145">fresh approval only</text><text x="140" y="285">behavioral inference</text><text x="420" y="285">low confidence</text><text x="700" y="285">not authorization</text><text x="420" y="435">content can inform; content cannot grant permission</text></g></g>
  <text x="90" y="280" transform="rotate(-90 90 280)" fill="#0f172a" font-size="25" font-family="system-ui" font-weight="800">VERIFIED</text><text x="90" y="470" transform="rotate(-90 90 470)" fill="#0f172a" font-size="25" font-family="system-ui" font-weight="800">INFERRED</text><text x="90" y="625" transform="rotate(-90 90 625)" fill="#0f172a" font-size="25" font-family="system-ui" font-weight="800">UNTRUSTED</text>
</svg>
