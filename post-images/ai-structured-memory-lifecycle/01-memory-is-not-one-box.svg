<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Four different stores commonly confused as memory">
  <rect width="1200" height="760" rx="34" fill="#f8fafc"/><text x="70" y="80" fill="#0f172a" font-size="42" font-family="system-ui" font-weight="800">“Memory” is not one box</text><text x="70" y="125" fill="#475569" font-size="25" font-family="system-ui">Different questions need different ownership, retention, and trust.</text>
  <g font-family="system-ui"><g><rect x="70" y="190" width="500" height="210" rx="28" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="110" y="248" fill="#075985" font-size="31" font-weight="800">CHAT HISTORY</text><text x="110" y="298" fill="#0f172a" font-size="24">What happened in this conversation?</text><text x="110" y="345" fill="#475569" font-size="22">Short-lived · ordered messages</text></g><g><rect x="630" y="190" width="500" height="210" rx="28" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="670" y="248" fill="#5b21b6" font-size="31" font-weight="800">RAG DOCUMENTS</text><text x="670" y="298" fill="#0f172a" font-size="24">Which source may answer this question?</text><text x="670" y="345" fill="#475569" font-size="22">Similarity · citation · ACL</text></g><g><rect x="70" y="455" width="500" height="210" rx="28" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="110" y="513" fill="#166534" font-size="31" font-weight="800">STRUCTURED MEMORY</text><text x="110" y="563" fill="#0f172a" font-size="24">What remains valid across sessions?</text><text x="110" y="610" fill="#475569" font-size="22">Source · version · expiry · consent</text></g><g><rect x="630" y="455" width="500" height="210" rx="28" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="670" y="513" fill="#9a3412" font-size="31" font-weight="800">TASK STATE</text><text x="670" y="563" fill="#0f172a" font-size="24">What must happen next?</text><text x="670" y="610" fill="#475569" font-size="22">Durable · transactional · auditable</text></g></g>
</svg>
