<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="A structured memory envelope with provenance and lifecycle fields">
  <rect width="1200" height="760" rx="34" fill="#081526"/><text x="70" y="82" fill="#f8fafc" font-size="42" font-family="system-ui" font-weight="800">A memory needs a label, not just a sentence</text><text x="70" y="126" fill="#94a3b8" font-size="25" font-family="system-ui">Like food in a refrigerator: owner, date, source, and safe-use rules matter.</text>
  <rect x="120" y="185" width="960" height="485" rx="32" fill="#111f35" stroke="#38bdf8" stroke-width="4"/>
  <g font-family="ui-monospace,monospace" font-size="27"><text x="175" y="250" fill="#7dd3fc">kind</text><text x="500" y="250" fill="#e2e8f0">preferred_language</text><text x="175" y="310" fill="#7dd3fc">value</text><text x="500" y="310" fill="#86efac">zh-CN</text><text x="175" y="370" fill="#7dd3fc">source / trust</text><text x="500" y="370" fill="#e2e8f0">user-confirmed / verified</text><text x="175" y="430" fill="#7dd3fc">scope</text><text x="500" y="430" fill="#e2e8f0">tenant-demo / user-demo</text><text x="175" y="490" fill="#7dd3fc">version</text><text x="500" y="490" fill="#e2e8f0">3 · supersedes 2</text><text x="175" y="550" fill="#7dd3fc">validity</text><text x="500" y="550" fill="#fde68a">valid_from → expires_at</text><text x="175" y="610" fill="#7dd3fc">governance</text><text x="500" y="610" fill="#e2e8f0">consent · sensitivity · deletion</text></g>
</svg>
