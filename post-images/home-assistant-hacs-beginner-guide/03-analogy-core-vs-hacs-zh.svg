<text x="124" y="556" font-size="19" fill="#334155" font-weight="400">界面卡片样式单一，缺少高颜值动效与主题</text>
<circle cx="106" cy="601" r="4.5" fill="#64748b"/>
<text x="124" y="608" font-size="19" fill="#334155" font-weight="400">买回来的国产品牌智能设备一概显示无法识别</text>
<rect x="96" y="640" width="516" height="38" rx="8" fill="#f1f5f9"/>
<text x="354" y="665" font-size="17" fill="#64748b" font-weight="500" text-anchor="middle">如同买了一盒标准积木，只能拼出官方图纸的小方块</text>

<path d="M668 482h44m-12 -10l12 10-12 10" fill="none" stroke="#0284c7" stroke-width="4"/>
<text x="690" y="445" font-size="17" fill="#0284c7" font-weight="600" text-anchor="middle">HACS 激活</text>

<rect x="736" y="265" width="640" height="435" rx="16" fill="white" stroke="#0284c7" stroke-width="2"/>
