<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">小学生秒懂比方：官方标准积木盒 vs 民间 MOC 创意大集市</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">为什么没有安装 HACS 的 Home Assistant 只能发挥不到 10% 的智能潜能？</text>

<rect x="64" y="265" width="580" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
