<text x="181" y="323" font-size="19" fill="#334155" font-weight="600" text-anchor="middle">HA Core 原生官方盒</text>
<text x="96" y="380" font-size="28" fill="#0f172a" font-weight="600">商场标准出厂套装 (10%)</text>
