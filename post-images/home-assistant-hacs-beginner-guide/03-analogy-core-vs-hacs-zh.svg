<text x="796" y="556" font-size="19" fill="#0f172a" font-weight="400">Mushroom 蘑菇卡片、动效天气与酷炫玻璃拟态组件</text>
<circle cx="778" cy="601" r="4.5" fill="#0284c7"/>
<text x="796" y="608" font-size="19" fill="#0f172a" font-weight="400">全球开源创作者每日持续迭代，即点即装自动升级</text>
