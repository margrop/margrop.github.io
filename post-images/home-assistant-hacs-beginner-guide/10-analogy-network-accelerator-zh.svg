<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="小学生秒懂比方：跨国慢递平邮 vs 国内保税直邮专线">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">NETWORK DIAGNOSTICS / DOMESTIC SPEEDUP PIPELINE</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">小学生秒懂比方：跨国慢递平邮 vs 国内保税直邮专线</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">深度揭秘为什么直连 GitHub 频频翻车，以及零第三方依赖纯净下载的底层逻辑</text>

<rect x="64" y="265" width="580" height="435" rx="16" fill="white" stroke="#ef4444" stroke-width="1.5"/>
<rect x="96" y="295" width="170" height="42" rx="8" fill="#fef2f2"/>
<text x="181" y="323" font-size="19" fill="#dc2626" font-weight="600" text-anchor="middle">普通直连跨国慢递</text>
<text x="96" y="380" font-size="28" fill="#dc2626" font-weight="600">关卡重重与频繁超时中断</text>
<line x1="96" y1="406" x2="612" y2="406" stroke="#fee2e2" stroke-width="2"/>
<circle cx="106" cy="445" r="4.5" fill="#ef4444"/>
<text x="124" y="452" font-size="19" fill="#7f1d1d" font-weight="400">DNS 污染：raw.githubusercontent 解析到错误 IP</text>
<circle cx="106" cy="497" r="4.5" fill="#ef4444"/>
<text x="124" y="504" font-size="19" fill="#7f1d1d" font-weight="400">SNI 阻断：HTTPS 握手阶段频繁丢包或直接 RST 重置</text>
<circle cx="106" cy="549" r="4.5" fill="#ef4444"/>
<text x="124" y="556" font-size="19" fill="#7f1d1d" font-weight="400">403 Rate Limit：未授权 IP 每小时仅允许请求 60 次</text>
<circle cx="106" cy="601" r="4.5" fill="#ef4444"/>
<text x="124" y="608" font-size="19" fill="#7f1d1d" font-weight="400">结果：脚本运行到一半卡死，报错 Failed to connect</text>
<rect x="96" y="640" width="516" height="38" rx="8" fill="#fef2f2"/>
<text x="354" y="665" font-size="17" fill="#dc2626" font-weight="500" text-anchor="middle">如同寄一封没有挂号的跨国信件，漂洋过海极易遗失</text>

<path d="M668 482h44m-12 -10l12 10-12 10" fill="none" stroke="#059669" stroke-width="4"/>
<text x="690" y="445" font-size="17" fill="#059669" font-weight="600" text-anchor="middle">工具提速</text>

<rect x="736" y="265" width="640" height="435" rx="16" fill="white" stroke="#059669" stroke-width="2"/>
<rect x="768" y="295" width="180" height="42" rx="8" fill="#059669"/>
<text x="858" y="323" font-size="19" fill="white" font-weight="600" text-anchor="middle">本地零依赖直邮专线</text>
<text x="768" y="380" font-size="28" fill="#059669" font-weight="600">纯净秒级极速下载部署</text>
<line x1="768" y1="406" x2="1344" y2="406" stroke="#ecfdf5" stroke-width="2"/>
<circle cx="778" cy="445" r="4.5" fill="#059669"/>
<text x="796" y="452" font-size="19" fill="#064e3b" font-weight="400">智能探测：自动测速筛选最优连接，杜绝第三方假冒镜像</text>
<circle cx="778" cy="497" r="4.5" fill="#059669"/>
<text x="796" y="504" font-size="19" fill="#064e3b" font-weight="400">纯净分发：拉取官方 Release 原包，SHA256 完整性核验</text>
<circle cx="778" cy="549" r="4.5" fill="#059669"/>
<text x="796" y="556" font-size="19" fill="#064e3b" font-weight="400">设备授权扩容：引导 8 位代码握手，额度瞬间翻倍至 5000 次</text>
<circle cx="778" cy="601" r="4.5" fill="#059669"/>
<text x="796" y="608" font-size="19" fill="#064e3b" font-weight="400">一键落地：自动解压至 custom_components/hacs 目录</text>
<rect x="768" y="640" width="576" height="38" rx="8" fill="#d1fae5"/>
<text x="1056" y="665" font-size="17" fill="#065f46" font-weight="600" text-anchor="middle">如同保税仓直邮闪送：货物源头正品，全程高速安全秒达！</text>

