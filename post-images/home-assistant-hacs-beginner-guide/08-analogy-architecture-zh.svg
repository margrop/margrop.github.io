<circle cx="100" cy="507" r="4.5" fill="#475569"/>
<text x="116" y="514" font-size="19" fill="#334155" font-weight="400">代表服务：MQTT 代理 / Samba / Node-RED</text>
<circle cx="100" cy="559" r="4.5" fill="#475569"/>
<text x="116" y="566" font-size="19" fill="#334155" font-weight="400">系统要求：需 HAOS 或 Supervised 支持</text>
<circle cx="100" cy="611" r="4.5" fill="#475569"/>
<text x="116" y="618" font-size="19" fill="#334155" font-weight="400">隔离程度：HA 重启完全不影响其运行</text>

<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="118" height="46" rx="10" fill="#0284c7"/>
<text x="599" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">Core Integration</text>
<text x="540" y="390" font-size="27" fill="#0f172a" font-weight="600">原厂出厂系统驱动</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#0284c7"/>
