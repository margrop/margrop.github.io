<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">一图看透三大概念：加载项 (Add-on) vs 官方集成 vs HACS 组件</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">彻底告别概念混淆：用外置家电、出厂驱动与民间改装件打通技术本质</text>

<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="118" height="46" rx="10" fill="#475569"/>
<text x="151" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">Add-on 加载项</text>
<text x="92" y="390" font-size="27" fill="#0f172a" font-weight="600">独立的家用电器</text>
