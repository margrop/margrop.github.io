<circle cx="548" cy="507" r="4.5" fill="#0284c7"/>
<text x="564" y="514" font-size="19" fill="#334155" font-weight="400">代表服务：HomeKit / Matter / 宜家 / 飞利浦</text>
<circle cx="548" cy="559" r="4.5" fill="#0284c7"/>
<text x="564" y="566" font-size="19" fill="#334155" font-weight="400">审核标准：官方团队严格 Code Review</text>
<circle cx="548" cy="611" r="4.5" fill="#0284c7"/>
<text x="564" y="618" font-size="19" fill="#334155" font-weight="400">发版周期：必须跟随 HA 每月大版本更新</text>

<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#7c3aed" stroke-width="2"/>
