<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="小学生秒懂比方：少年宫借书暗号与 8 位免密握手通行证">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">SECURITY PROTOCOL / GITHUB DEVICE OAUTH</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">小学生秒懂比方：借书接头暗号与 8 位免密握手通行证</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">为什么 HACS 绝不索取你的 GitHub 账号密码？三步闭环确保凭证零泄露</text>

<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="88" height="46" rx="10" fill="#0284c7"/>
<text x="136" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">步骤 1</text>
<text x="92" y="390" font-size="27" fill="#0f172a" font-weight="600">生成 8 位临时暗号</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="19" fill="#334155" font-weight="400">HA 主机向 GitHub 请求配对码</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="19" fill="#334155" font-weight="400">生成形如 ABCD-1234 的临时暗号</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="19" fill="#334155" font-weight="400">暗号有效期 15 分钟，过期自动作废</text>
<rect x="92" y="605" width="360" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="108" y="635" font-size="16" fill="#64748b" font-weight="500">如同借书机打印出一张带编号的小纸条</text>
<text x="108" y="660" font-size="16" fill="#0284c7" font-weight="600">完全不需要输入银行卡密码！</text>

<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="88" height="46" rx="10" fill="#d97706"/>
<text x="584" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">步骤 2</text>
<text x="540" y="390" font-size="27" fill="#0f172a" font-weight="600">官方页面核对放行</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="19" fill="#334155" font-weight="400">访问 github.com/login/device</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="19" fill="#334155" font-weight="400">由 GitHub 官方页面处理登录鉴权</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="19" fill="#334155" font-weight="400">输入暗号并点击 Authorize HACS</text>
<rect x="540" y="605" width="360" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="556" y="635" font-size="16" fill="#64748b" font-weight="500">如同家长拿着小纸条在前台亲自确认签字</text>
<text x="556" y="660" font-size="16" fill="#d97706" font-weight="600">借书机全程看不到你的账号密码</text>

<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="88" height="46" rx="10" fill="#059669"/>
<text x="1032" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">步骤 3</text>
<text x="988" y="390" font-size="27" fill="#0f172a" font-weight="600">下发专属只读通行证</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="19" fill="#334155" font-weight="400">GitHub 下发加密 OAuth Token</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="19" fill="#334155" font-weight="400">权限受限：仅允许读取公共仓库</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="19" fill="#334155" font-weight="400">API 额度立即从 60 飙升至 5000 次/时</text>
<rect x="988" y="605" width="360" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="1004" y="635" font-size="16" fill="#64748b" font-weight="500">前台给机器发了一张「借阅胸牌」</text>
<text x="1004" y="660" font-size="16" fill="#059669" font-weight="600">若不想用了，可以在后台随时一键作废！</text>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">原创安全架构图解 · GitHub Device Code 授权机制通俗科普 · 2026-10-29</text>
<text x="1376" y="790" font-size="21" fill="#0284c7" font-weight="600" text-anchor="end">05</text>
</svg>