<text x="108" y="635" font-size="15.5" fill="#64748b" font-weight="500">Like a library kiosk printing a temporary slip</text>
<text x="108" y="660" font-size="15.5" fill="#0284c7" font-weight="600">Never exposes your private master password!</text>

<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="98" height="46" rx="10" fill="#d97706"/>
<text x="589" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Step 2</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">Official Web Approval</text>
