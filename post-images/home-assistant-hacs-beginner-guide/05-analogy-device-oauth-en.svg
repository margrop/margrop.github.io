<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">Authentication handled by GitHub web</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">Enter code and tap Authorize HACS</text>
<rect x="540" y="605" width="360" height="70" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="556" y="635" font-size="15.5" fill="#64748b" font-weight="500">Like a parent signing the slip at the front desk</text>
<text x="556" y="660" font-size="15.5" fill="#d97706" font-weight="600">The kiosk never learns your secret credentials</text>

<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

