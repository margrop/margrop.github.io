<text x="64" y="150" font-size="36" fill="#0f172a" font-weight="600">Elementary Analogy: Library Pass &amp; 8-Digit Zero-Password Handshake</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">Why HACS never asks for your GitHub password: 3-step closed-loop security</text>

<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="98" height="46" rx="10" fill="#0284c7"/>
