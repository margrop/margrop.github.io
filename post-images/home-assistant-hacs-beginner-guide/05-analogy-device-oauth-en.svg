<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">8-Digit Pairing Code</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">HA requests a temporary code</text>
