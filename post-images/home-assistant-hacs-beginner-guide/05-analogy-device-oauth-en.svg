<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">GitHub returns encrypted OAuth token</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">Scope restricted strictly to public repos</text>
