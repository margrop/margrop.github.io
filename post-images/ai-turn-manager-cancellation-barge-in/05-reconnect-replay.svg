<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Disconnect and sequence-cursor replay</title><desc id="d">The server persists numbered events, the client reconnects after the last acknowledged sequence, and duplicate events are ignored.</desc>
  <rect width="1600" height="900" rx="32" fill="#f8fafc"/>
  <text x="80" y="105" fill="#0f172a" font-family="Arial,sans-serif" font-size="62" font-weight="800">RECONNECT: REPLAY ONCE, RENDER ONCE</text>
  <text x="82" y="165" fill="#475569" font-family="Arial,sans-serif" font-size="34">Persist first, number every event, resume after the last ACK.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="200" y="270" fill="#0f172a" font-size="40" font-weight="800">SERVER STORE</text><text x="1400" y="270" fill="#0f172a" font-size="40" font-weight="800">CLIENT</text>
    <g font-size="32" font-weight="700">
      <rect x="110" y="330" width="180" height="75" rx="18" fill="#2563eb"/><text x="200" y="378" fill="white">SEQ 1</text><path d="M300 367H1290" stroke="#2563eb" stroke-width="7"/><text x="1400" y="378" fill="#1e40af">ACK 1</text>
      <rect x="110" y="440" width="180" height="75" rx="18" fill="#2563eb"/><text x="200" y="488" fill="white">SEQ 2</text><path d="M300 477H1290" stroke="#2563eb" stroke-width="7"/><text x="1400" y="488" fill="#1e40af">ACK 2</text>
      <rect x="110" y="550" width="180" height="75" rx="18" fill="#2563eb"/><text x="200" y="598" fill="white">SEQ 3</text><path d="M300 587H720" stroke="#2563eb" stroke-width="7"/><path d="M750 560l60 55m-60 0l60-55" stroke="#dc2626" stroke-width="12"/><text x="950" y="598" fill="#991b1b">DISCONNECT</text>
      <rect x="110" y="660" width="180" height="75" rx="18" fill="#7c3aed"/><text x="200" y="708" fill="white">SEQ 4..N</text><path d="M300 697H1290" stroke="#7c3aed" stroke-width="7" stroke-dasharray="18 12"/><text x="1400" y="690" fill="#5b21b6">RESUME</text><text x="1400" y="730" fill="#5b21b6">after=3</text>
    </g>
    <rect x="400" y="790" width="800" height="70" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="800" y="835" fill="#166534" font-size="32" font-weight="800">DUPLICATE SEQ? ACK IT—RENDER IT ONCE.</text>
  </g>
</svg>
