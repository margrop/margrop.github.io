<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Cooperative and non-cancellable tool boundaries</title><desc id="d">A cooperative tool can roll back before commit. Once an external commit is in flight, cancellation stops delivery but the platform must reconcile instead of claiming success.</desc>
  <rect width="1600" height="900" rx="32" fill="#071426"/>
  <text x="80" y="105" fill="#f8fafc" font-family="Arial,sans-serif" font-size="62" font-weight="800">CANCEL IS A REQUEST, NOT A TIME MACHINE</text>
  <g font-family="Arial,sans-serif">
    <rect x="80" y="220" width="700" height="560" rx="30" fill="#052e2b" stroke="#14b8a6" stroke-width="5"/>
    <text x="430" y="300" text-anchor="middle" fill="#5eead4" font-size="46" font-weight="800">COOPERATIVE TOOL</text>
    <text x="150" y="390" fill="#ccfbf1" font-size="34">1. read inputs</text><text x="150" y="460" fill="#ccfbf1" font-size="34">2. write temporary output</text><text x="150" y="530" fill="#fca5a5" font-size="34">3. observe cancel checkpoint</text><text x="150" y="600" fill="#ccfbf1" font-size="34">4. remove temporary work</text>
    <rect x="145" y="655" width="570" height="80" rx="20" fill="#0f766e"/><text x="430" y="706" text-anchor="middle" fill="white" font-size="34" font-weight="700">CANCELLED · SIDE EFFECTS = 0</text>
    <rect x="820" y="220" width="700" height="560" rx="30" fill="#3b1907" stroke="#f97316" stroke-width="5"/>
    <text x="1170" y="300" text-anchor="middle" fill="#fdba74" font-size="46" font-weight="800">COMMIT IN FLIGHT</text>
    <text x="890" y="390" fill="#ffedd5" font-size="34">1. external commit sent</text><text x="890" y="460" fill="#fca5a5" font-size="34">2. user asks to stop</text><text x="890" y="530" fill="#ffedd5" font-size="34">3. stop response delivery</text><text x="890" y="600" fill="#ffedd5" font-size="34">4. record result + reconcile</text>
    <rect x="885" y="655" width="570" height="80" rx="20" fill="#c2410c"/><text x="1170" y="706" text-anchor="middle" fill="white" font-size="31" font-weight="700">RECONCILE_REQUIRED · EFFECT = 1</text>
  </g>
</svg>
