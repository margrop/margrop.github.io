<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">A turn is larger than one HTTP request</title><desc id="d">HTTP disconnects while the turn continues across model, tools and speech unless a Turn Manager owns its lifecycle.</desc>
  <rect width="1600" height="900" rx="32" fill="#f8fafc"/>
  <text x="90" y="110" fill="#0f172a" font-family="Arial,sans-serif" font-size="64" font-weight="800">TURN ≠ HTTP REQUEST</text>
  <text x="92" y="170" fill="#475569" font-family="Arial,sans-serif" font-size="35">A transport carries events. The Turn Manager owns the work.</text>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="250" width="650" height="520" rx="30" fill="#fee2e2" stroke="#ef4444" stroke-width="5"/>
    <text x="415" y="330" text-anchor="middle" fill="#991b1b" font-size="48" font-weight="800">REQUEST-OWNED</text>
    <rect x="160" y="400" width="220" height="100" rx="20" fill="#fff"/><text x="270" y="463" text-anchor="middle" fill="#0f172a" font-size="36">HTTP</text>
    <path d="M380 450H575" stroke="#ef4444" stroke-width="8" stroke-dasharray="18 12"/>
    <text x="480" y="425" text-anchor="middle" fill="#b91c1c" font-size="32">disconnect</text>
    <rect x="575" y="400" width="100" height="100" rx="50" fill="#ef4444"/><text x="625" y="465" text-anchor="middle" fill="white" font-size="46">?</text>
    <text x="415" y="590" text-anchor="middle" fill="#7f1d1d" font-size="36">Who stops the model?</text><text x="415" y="645" text-anchor="middle" fill="#7f1d1d" font-size="36">Who clears queued audio?</text><text x="415" y="700" text-anchor="middle" fill="#7f1d1d" font-size="36">Who records the final state?</text>
    <rect x="860" y="250" width="650" height="520" rx="30" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <text x="1185" y="330" text-anchor="middle" fill="#166534" font-size="48" font-weight="800">TURN-OWNED</text>
    <rect x="930" y="400" width="220" height="100" rx="20" fill="#fff"/><text x="1040" y="463" text-anchor="middle" fill="#0f172a" font-size="36">Transport</text>
    <path d="M1150 450H1265" stroke="#16a34a" stroke-width="8"/>
    <rect x="1265" y="385" width="180" height="130" rx="24" fill="#16a34a"/><text x="1355" y="438" text-anchor="middle" fill="white" font-size="34" font-weight="700">TURN</text><text x="1355" y="480" text-anchor="middle" fill="white" font-size="28">MANAGER</text>
    <text x="1185" y="590" text-anchor="middle" fill="#14532d" font-size="36">Durable turn identity</text><text x="1185" y="645" text-anchor="middle" fill="#14532d" font-size="36">Cancel tree + deadline</text><text x="1185" y="700" text-anchor="middle" fill="#14532d" font-size="36">Replay cursor + one terminal state</text>
  </g>
</svg>
