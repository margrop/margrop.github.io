<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Turn Manager release metrics</title><desc id="d">A dashboard separates first-token latency, end-to-end latency, cancellation propagation, late-event drops, reconnect success and post-cancel side effects.</desc>
  <rect width="1600" height="900" rx="32" fill="#071426"/>
  <text x="80" y="105" fill="#f8fafc" font-family="Arial,sans-serif" font-size="62" font-weight="800">A “STOPPED” BADGE IS NOT EVIDENCE</text>
  <text x="82" y="165" fill="#94a3b8" font-family="Arial,sans-serif" font-size="34">Release on end-to-end signals, not one HTTP status.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="80" y="240" width="440" height="210" rx="28" fill="#172554"/><text x="300" y="305" fill="#93c5fd" font-size="34">TTFT</text><text x="300" y="390" fill="white" font-size="72" font-weight="800">61 ms</text></g>
    <g><rect x="580" y="240" width="440" height="210" rx="28" fill="#3b0764"/><text x="800" y="305" fill="#d8b4fe" font-size="34">CANCEL PROPAGATION</text><text x="800" y="390" fill="white" font-size="72" font-weight="800">8 ms</text></g>
    <g><rect x="1080" y="240" width="440" height="210" rx="28" fill="#134e4a"/><text x="1300" y="305" fill="#99f6e4" font-size="34">LATE EVENTS DELIVERED</text><text x="1300" y="390" fill="white" font-size="72" font-weight="800">0</text></g>
    <g><rect x="80" y="510" width="440" height="210" rx="28" fill="#422006"/><text x="300" y="575" fill="#fde68a" font-size="34">RECONNECT EXACTNESS</text><text x="300" y="660" fill="white" font-size="72" font-weight="800">PASS</text></g>
    <g><rect x="580" y="510" width="440" height="210" rx="28" fill="#450a0a"/><text x="800" y="575" fill="#fecaca" font-size="34">DUPLICATE STOP EFFECTS</text><text x="800" y="660" fill="white" font-size="72" font-weight="800">0</text></g>
    <g><rect x="1080" y="510" width="440" height="210" rx="28" fill="#1f2937"/><text x="1300" y="575" fill="#cbd5e1" font-size="34">LAB ASSERTIONS</text><text x="1300" y="660" fill="#67e8f9" font-size="72" font-weight="800">24 / 24</text></g>
    <rect x="350" y="780" width="900" height="75" rx="18" fill="#16a34a"/><text x="800" y="828" fill="white" font-size="36" font-weight="800">RELEASE GATE: PASS · NETWORK COST: 0</text>
  </g>
</svg>
