<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Voice barge-in event timeline</title><desc id="d">New user speech clears queued output audio, cancels the old response generation, fences late packets and starts a new turn.</desc>
  <rect width="1600" height="900" rx="32" fill="#f8fafc"/>
  <text x="80" y="105" fill="#0f172a" font-family="Arial,sans-serif" font-size="60" font-weight="800">BARGE-IN: OLD OUTPUT OFF, NEW TURN ON</text>
  <text x="82" y="165" fill="#475569" font-family="Arial,sans-serif" font-size="32">New speech advances the active generation.</text>
  <g font-family="Arial,sans-serif">
    <line x1="120" y1="430" x2="1480" y2="430" stroke="#64748b" stroke-width="8"/>
    <text x="120" y="365" fill="#475569" font-size="32">old response plays</text>
    <path d="M120 310q40-100 80 0t80 0t80 0t80 0" fill="none" stroke="#7c3aed" stroke-width="10"/>
    <g text-anchor="middle">
      <circle cx="520" cy="430" r="34" fill="#dc2626"/><text x="520" y="510" fill="#991b1b" font-size="25" font-weight="700">speech_started</text><text x="520" y="548" fill="#475569" font-size="24">VAD threshold</text>
      <circle cx="740" cy="430" r="34" fill="#ea580c"/><text x="740" y="510" fill="#9a3412" font-size="25" font-weight="700">audio.clear</text><text x="740" y="548" fill="#475569" font-size="24">silence speaker</text>
      <circle cx="950" cy="430" r="34" fill="#2563eb"/><text x="950" y="510" fill="#1e40af" font-size="25" font-weight="700">response.cancel</text><text x="950" y="548" fill="#475569" font-size="24">old generation</text>
      <circle cx="1170" cy="430" r="34" fill="#0f766e"/><text x="1170" y="510" fill="#115e59" font-size="25" font-weight="700">late DROP</text><text x="1170" y="548" fill="#475569" font-size="24">generation fence</text>
      <circle cx="1400" cy="430" r="34" fill="#16a34a"/><text x="1400" y="510" fill="#166534" font-size="25" font-weight="700">new turn</text><text x="1400" y="548" fill="#475569" font-size="24">generation + 1</text>
    </g>
    <rect x="200" y="670" width="1200" height="135" rx="26" fill="#0f172a"/><text x="800" y="720" text-anchor="middle" fill="#67e8f9" font-size="34" font-weight="800">SUCCESSFUL BARGE-IN NEEDS THREE GUARANTEES</text><text x="800" y="760" text-anchor="middle" fill="#e2e8f0" font-size="29">Clear audio · cancel old work · fence late events</text><text x="800" y="791" text-anchor="middle" fill="#94a3b8" font-size="24">Miss one and the ghost reply returns.</text>
  </g>
</svg>
