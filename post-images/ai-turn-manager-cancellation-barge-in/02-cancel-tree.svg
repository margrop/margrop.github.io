<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Structured cancellation tree</title><desc id="d">One turn cancellation signal fans out to retrieval, model streaming, tool execution and audio delivery while a generation gate rejects late events.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#38bdf8"/></marker></defs>
  <rect width="1600" height="900" rx="32" fill="#071426"/>
  <text x="80" y="105" fill="#f8fafc" font-family="Arial,sans-serif" font-size="62" font-weight="800">ONE STOP SIGNAL, FOUR BRANCHES</text>
  <text x="82" y="165" fill="#94a3b8" font-family="Arial,sans-serif" font-size="34">Cancellation is a tree, not a button style.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="560" y="230" width="480" height="125" rx="26" fill="#dc2626"/><text x="800" y="285" fill="white" font-size="43" font-weight="800">TURN CANCEL TOKEN</text><text x="800" y="330" fill="#fee2e2" font-size="29">reason · deadline · generation</text>
    <path d="M800 355V445M800 400H245V500M800 400H610V500M800 400H990V500M800 400H1355V500" fill="none" stroke="#38bdf8" stroke-width="8" marker-end="url(#a)"/>
    <g font-size="38" font-weight="700">
      <rect x="90" y="510" width="310" height="125" rx="24" fill="#1d4ed8"/><text x="245" y="587" fill="white">RETRIEVAL</text>
      <rect x="455" y="510" width="310" height="125" rx="24" fill="#7c3aed"/><text x="610" y="587" fill="white">MODEL STREAM</text>
      <rect x="835" y="510" width="310" height="125" rx="24" fill="#0f766e"/><text x="990" y="587" fill="white">TOOL TASK</text>
      <rect x="1200" y="510" width="310" height="125" rx="24" fill="#b45309"/><text x="1355" y="587" fill="white">AUDIO / TTS</text>
    </g>
    <rect x="480" y="725" width="640" height="105" rx="24" fill="#0f172a" stroke="#22d3ee" stroke-width="5"/><text x="800" y="774" fill="#22d3ee" font-size="36" font-weight="800">DELIVERY GATE</text><text x="800" y="812" fill="#e2e8f0" font-size="28">Drop late events from an old generation</text>
  </g>
</svg>
