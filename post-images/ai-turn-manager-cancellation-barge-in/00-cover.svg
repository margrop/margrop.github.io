<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stop must be a platform event</title>
  <desc id="desc">A Turn Manager presses one stop button that cancels model, retrieval, tool and speech branches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1350" cy="150" r="190" fill="#7c3aed" opacity=".18"/><circle cx="180" cy="800" r="260" fill="#0891b2" opacity=".16"/>
  <text x="110" y="150" fill="#67e8f9" font-family="Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="6">AI PLATFORM / TURN MANAGER</text>
  <text x="110" y="270" fill="#f8fafc" font-family="Arial,sans-serif" font-size="86" font-weight="800">You said “STOP”.</text>
  <text x="110" y="365" fill="#f8fafc" font-family="Arial,sans-serif" font-size="86" font-weight="800">Did the AI really stop?</text>
  <text x="112" y="435" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="40">Cancellation trees · Barge-in · Deadlines · Reconnect</text>
  <g filter="url(#shadow)">
    <rect x="120" y="545" width="300" height="150" rx="32" fill="#dc2626"/>
    <rect x="150" y="575" width="240" height="90" rx="24" fill="#ef4444" stroke="#fecaca" stroke-width="4"/>
    <text x="270" y="635" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="48" font-weight="800">STOP</text>
  </g>
  <path d="M450 620H620" fill="none" stroke="#67e8f9" stroke-width="10" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700">
    <rect x="670" y="520" width="270" height="90" rx="22" fill="#1d4ed8"/><text x="805" y="577" fill="white" font-size="35">MODEL STREAM</text>
    <rect x="980" y="520" width="240" height="90" rx="22" fill="#0f766e"/><text x="1100" y="577" fill="white" font-size="35">RETRIEVAL</text>
    <rect x="670" y="650" width="270" height="90" rx="22" fill="#7c3aed"/><text x="805" y="707" fill="white" font-size="35">TOOL TASK</text>
    <rect x="980" y="650" width="240" height="90" rx="22" fill="#b45309"/><text x="1100" y="707" fill="white" font-size="35">AUDIO / TTS</text>
    <rect x="1270" y="570" width="240" height="120" rx="26" fill="#111827" stroke="#67e8f9" stroke-width="5"/><text x="1390" y="620" fill="#67e8f9" font-size="34">ONE TURN</text><text x="1390" y="663" fill="white" font-size="34">ONE OWNER</text>
  </g>
</svg>
