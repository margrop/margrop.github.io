<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="教室黑板粉笔字 vs 学生私家记事本">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">PERSISTENCE / ZERO-LOSS RESTARTS</text>
<text x="64" y="155" font-size="46" fill="#0f172a" font-weight="600">教室黑板粉笔字 vs 学生私家记事本</text>
<text x="64" y="210" font-size="26" fill="#475569" font-weight="400">为什么重启后卡片变红？REST 临时状态与模板持久化的底层秘密</text>
<rect x="64" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="92" y="305" width="64" height="46" rx="10" fill="#dc2626" stroke="#dc2626"/><text x="104" y="337" font-size="22" fill="white" font-weight="600">01</text><text x="92" y="400" font-size="32" fill="#0f172a" font-weight="600">普通 REST 状态</text><text x="92" y="460" font-size="24" fill="#475569" font-weight="400">就像教室黑板上的粉笔字</text><text x="92" y="506" font-size="24" fill="#475569" font-weight="400">采集器写一次，大家看一次</text><text x="92" y="552" font-size="24" fill="#475569" font-weight="400">下课重启黑板被擦空，实体全消失</text><path d="M485 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="512" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="305" width="64" height="46" rx="10" fill="#059669" stroke="#059669"/><text x="552" y="337" font-size="22" fill="white" font-weight="600">02</text><text x="540" y="400" font-size="32" fill="#0f172a" font-weight="600">触发式模板镜像</text><text x="540" y="460" font-size="24" fill="#475569" font-weight="400">如同学生随身带的私家笔记本</text><text x="540" y="506" font-size="24" fill="#475569" font-weight="400">黑板有新字就誊抄到本子上</text><text x="540" y="552" font-size="24" fill="#475569" font-weight="400">黑板擦了，管家翻开本子照样能看</text><path d="M933 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="960" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="988" y="305" width="64" height="46" rx="10" fill="#0284c7" stroke="#0284c7"/><text x="1000" y="337" font-size="22" fill="white" font-weight="600">03</text><text x="988" y="400" font-size="32" fill="#0f172a" font-weight="600">新手保姆级正解</text><text x="988" y="460" font-size="24" fill="#475569" font-weight="400">添加 packages 配置文件</text><text x="988" y="506" font-size="24" fill="#475569" font-weight="400">设置 `this.state` 保底恢复</text><text x="988" y="552" font-size="24" fill="#475569" font-weight="400">从此 HA 随便重启，电费卡片永不掉线</text>
<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">原创保姆级教程 · 原理与全流程拆解 · 2026-10-28</text><text x="1300" y="790" font-size="21" fill="#0284c7" font-weight="600">08</text>
</svg>