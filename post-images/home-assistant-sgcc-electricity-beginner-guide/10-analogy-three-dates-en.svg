<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">DATA SEMANTICS / T+1 BUSINESS LAG</text>
<text x="64" y="155" font-size="46" fill="#0f172a" font-weight="600">Three Dates Like Parcel Delivery: Why No Bill for Today Yet?</text>
<text x="64" y="210" font-size="26" fill="#475569" font-weight="400">Ordering, dispatch, and delivery map to usage, utility billing, and HA arrival</text>
<rect x="64" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="92" y="305" width="64" height="46" rx="10" fill="#0284c7" stroke="#0284c7"/><text x="104" y="337" font-size="22" fill="white" font-weight="600">D1</text><text x="92" y="400" font-size="32" fill="#0f172a" font-weight="600">Usage Date (Ordered)</text><text x="92" y="460" font-size="24" fill="#475569" font-weight="400">Actual kWh consumed on Monday</text><text x="92" y="506" font-size="24" fill="#475569" font-weight="400">The true physical business date</text><text x="92" y="552" font-size="24" fill="#475569" font-weight="400">All daily records must align here</text><path d="M485 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="512" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="305" width="64" height="46" rx="10" fill="#d97706" stroke="#d97706"/><text x="552" y="337" font-size="22" fill="white" font-weight="600">D2</text><text x="540" y="400" font-size="32" fill="#0f172a" font-weight="600">Billing Date (Shipped)</text><text x="540" y="460" font-size="24" fill="#475569" font-weight="400">Utility batches meter data overnight</text><text x="540" y="506" font-size="24" fill="#475569" font-weight="400">Monday data often appears Tuesday/Wed</text><text x="540" y="552" font-size="24" fill="#475569" font-weight="400">Delay is utility schedule, not a bug</text><path d="M933 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="960" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="988" y="305" width="64" height="46" rx="10" fill="#059669" stroke="#059669"/><text x="1000" y="337" font-size="22" fill="white" font-weight="600">D3</text><text x="988" y="400" font-size="32" fill="#0f172a" font-weight="600">Arrival Date (Received)</text><text x="988" y="460" font-size="24" fill="#475569" font-weight="400">Add-on captures &amp; pushes to HA now</text><text x="988" y="506" font-size="24" fill="#475569" font-weight="400">Default sensors stamp arrival time</text><text x="988" y="552" font-size="24" fill="#475569" font-weight="400">Never confuse arrival date with usage date</text>
