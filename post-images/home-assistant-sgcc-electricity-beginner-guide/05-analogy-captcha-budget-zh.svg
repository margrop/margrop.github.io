<text x="64" y="155" font-size="46" fill="#0f172a" font-weight="600">验证码避坑：为什么思考大模型会被截断？</text>
<text x="64" y="210" font-size="26" fill="#475569" font-weight="400">插件只给 50 Token 预算：选错模型会导致验证码永远返回空白！</text>
<rect x="64" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="92" y="305" width="64" height="46" rx="10" fill="#dc2626" stroke="#dc2626"/><text x="104" y="337" font-size="22" fill="white" font-weight="600">X</text><text x="92" y="400" font-size="32" fill="#0f172a" font-weight="600">慢思考 / 推理模型</text><text x="92" y="460" font-size="24" fill="#475569" font-weight="400">满脑子输出推理过程</text><text x="92" y="506" font-size="24" fill="#475569" font-weight="400">刚打几个字就耗尽 50 Token</text><text x="92" y="552" font-size="24" fill="#475569" font-weight="400">最终坐标没说出来就被强行截断</text><path d="M485 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="512" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="305" width="64" height="46" rx="10" fill="#059669" stroke="#059669"/><text x="552" y="337" font-size="22" fill="white" font-weight="600">OK</text><text x="540" y="400" font-size="32" fill="#0f172a" font-weight="600">快速轻量视觉模型</text><text x="540" y="460" font-size="24" fill="#475569" font-weight="400">如 glm-5.3-flash 等模型</text><text x="540" y="506" font-size="24" fill="#475569" font-weight="400">不啰嗦，直接输出目标坐标点</text><text x="540" y="552" font-size="24" fill="#475569" font-weight="400">几十毫秒秒级返回，识别率超 95%</text><path d="M933 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="960" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="988" y="305" width="64" height="46" rx="10" fill="#0284c7" stroke="#0284c7"/><text x="1000" y="337" font-size="22" fill="white" font-weight="600">TIP</text><text x="988" y="400" font-size="32" fill="#0f172a" font-weight="600">新手避坑黄金法则</text><text x="988" y="460" font-size="24" fill="#475569" font-weight="400">切勿盲目迷信“最强大脑”</text><text x="988" y="506" font-size="24" fill="#475569" font-weight="400">视觉选轻快直接的图文模型</text><text x="988" y="552" font-size="24" fill="#475569" font-weight="400">配置前先在网关测试输出格式</text>
