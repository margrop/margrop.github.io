<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="分清收快递的三日期：为什么今天看不到今天的电费？">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">DATA SEMANTICS / T+1 BUSINESS LAG</text>
<text x="64" y="155" font-size="46" fill="#0f172a" font-weight="600">分清收快递的三日期：为什么今天看不到今天的电费？</text>
<text x="64" y="210" font-size="26" fill="#475569" font-weight="400">买买买的下单、发货与签收，对应着电网的用电、出账与推送</text>
<rect x="64" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="92" y="305" width="64" height="46" rx="10" fill="#0284c7" stroke="#0284c7"/><text x="104" y="337" font-size="22" fill="white" font-weight="600">D1</text><text x="92" y="400" font-size="32" fill="#0f172a" font-weight="600">用电发生日 (下单)</text><text x="92" y="460" font-size="24" fill="#475569" font-weight="400">周一全家吹空调、开地暖用了多少度</text><text x="92" y="506" font-size="24" fill="#475569" font-weight="400">真正发生耗电的物理业务日期</text><text x="92" y="552" font-size="24" fill="#475569" font-weight="400">所有日用电历史必须按此日期对齐</text><path d="M485 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="512" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="540" y="305" width="64" height="46" rx="10" fill="#d97706" stroke="#d97706"/><text x="552" y="337" font-size="22" fill="white" font-weight="600">D2</text><text x="540" y="400" font-size="32" fill="#0f172a" font-weight="600">电网出账日 (发货)</text><text x="540" y="460" font-size="24" fill="#475569" font-weight="400">电网后台每天凌晨批量跑批汇总</text><text x="540" y="506" font-size="24" fill="#475569" font-weight="400">通常周二或周三才能查到周一数据</text><text x="540" y="552" font-size="24" fill="#475569" font-weight="400">出现延迟不是插件坏了，是电网未出</text><path d="M933 485h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/><rect x="960" y="275" width="416" height="420" rx="16" fill="white" stroke="#cbd5e1"/><rect x="988" y="305" width="64" height="46" rx="10" fill="#059669" stroke="#059669"/><text x="1000" y="337" font-size="22" fill="white" font-weight="600">D3</text><text x="988" y="400" font-size="32" fill="#0f172a" font-weight="600">HA 收到日 (签收)</text><text x="988" y="460" font-size="24" fill="#475569" font-weight="400">采集插件此时抓取并推送到 HA</text><text x="988" y="506" font-size="24" fill="#475569" font-weight="400">普通传感器如果按收到时间打标签</text><text x="988" y="552" font-size="24" fill="#475569" font-weight="400">容易误把周一的用电当成周三的电量</text>
<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">原创保姆级教程 · 原理与全流程拆解 · 2026-10-28</text><text x="1300" y="790" font-size="21" fill="#0284c7" font-weight="600">10</text>
</svg>