<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="legoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Title Header -->
  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">日常生活大白话比喻：为什么大模型偏爱乐高外卖（Python/Node.js）而非高炉炼铁（C++/Rust）？</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Everyday Analogies: Lego Blocks &amp; Express Kitchens vs. Iron Forging &amp; Rigid Banquets</text>

  <!-- Card 1: 乐高搭城堡 (Python / Node.js) -->
  <g transform="translate(60, 135)">
    <rect width="710" height="710" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2.5"/>
    <rect width="710" height="52" rx="18" fill="url(#legoGrad)"/>
    <text x="355" y="34" fill="#ffffff" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">模式 A：乐高积木 + 外卖厨房（Python / Node.js）</text>

    <!-- Sub-analogy 1: 乐高积木 -->
    <g transform="translate(30, 75)">
      <rect width="650" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="25" y="32" fill="#34d399" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">🧩 比喻一：即插即用的乐高积木（动态类型与丰富包生态）</text>
      <text x="25" y="62" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 小朋友搭城堡：直接从箱子里拿出做好的轮子、门窗、炮台，咔哒一拼就能开动！</text>
      <text x="25" y="90" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 对应现实：PyPI 与 npm 拥有人类历史上最庞大的即用模块（NumPy, Axios, Pandas...）</text>
      <text x="25" y="118" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 凹凸兼容：大模型吐出的 JSON 无缝贴合，不需要定义复杂的结构体，3 秒组装完毕！</text>
      <rect x="25" y="132" width="600" height="32" rx="6" fill="#064e3b"/>
      <text x="35" y="153" fill="#a7f3d0" font-size="13" font-family="monospace">优势：AI 只要调用 import / require，十几行代码就能立刻实现一个完整的外部工具调用！</text>
    </g>

    <!-- Sub-analogy 2: 随性外卖快餐 -->
    <g transform="translate(30, 275)">
      <rect width="650" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="25" y="32" fill="#38bdf8" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">🍔 比喻二：极速响应的外卖快餐（解释型执行与秒级 REPL）</text>
      <text x="25" y="62" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 顾客下单：“来份汉堡加薯条！”厨房 30 秒出餐。吃的时候发现缺了番茄酱？</text>
      <text x="25" y="90" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 随性纠错：喊一声服务员直接换成甜辣酱（Exception 捕获与动态纠错），继续愉快用餐！</text>
      <text x="25" y="118" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 对应现实：CPython 与 Node.js V8 沙箱冷启动仅需 5ms，大模型试错成本无限趋近于零！</text>
      <rect x="25" y="132" width="600" height="32" rx="6" fill="#0c4a6e"/>
      <text x="35" y="153" fill="#bae6fd" font-size="13" font-family="monospace">核心机制：ReAct 智能体循环（生成代码 -> 毫秒级运行 -> 抓取报错 -> 1 次提示词修复）</text>
    </g>

    <!-- Sub-analogy 3: 方向盘与发动机 -->
    <g transform="translate(30, 475)">
      <rect width="650" height="195" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="25" y="32" fill="#facc15" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">🏎️ 比喻三：跑车方向盘与底层航空引擎（胶水语言真谛）</text>
      <text x="25" y="62" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 司机不需要亲自钻进发动机里烧机油，只需要转动方向盘、踩下油门！</text>
      <text x="25" y="90" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 破除偏见：AI 喜欢 Python 绝不是因为 Python 运算快，而是因为底层的 PyTorch/CUDA</text>
      <text x="25" y="118" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 完美分工：底层 99% 的张量计算全由 C++/CUDA 狂暴执行，Python 只做轻盈的指令调度！</text>
      <rect x="25" y="138" width="600" height="42" rx="6" fill="#713f12"/>
      <text x="35" y="164" fill="#fef08a" font-size="13" font-family="monospace">架构结论：Python = 方向盘，Node.js = 仪表盘与通信雷达，C++/CUDA = 双涡轮增压引擎！</text>
    </g>
  </g>

  <!-- Card 2: 炼铁与国宴 (C++ / Rust / Java) -->
  <g transform="translate(830, 135)">
    <rect width="710" height="710" rx="18" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="2.5"/>
    <rect width="710" height="52" rx="18" fill="url(#forgeGrad)"/>
    <text x="355" y="34" fill="#ffffff" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">模式 B：高炉炼铁 + 严苛国宴（C++ / Rust / Java）</text>

    <!-- Sub-analogy 1: 炼铁铸剑 -->
    <g transform="translate(30, 75)">
      <rect width="650" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="25" y="32" fill="#fb7185" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">⚔️ 比喻一：高炉炼铁与模具铸剑（静态编译与生命周期）</text>
      <text x="25" y="62" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 铁匠造剑：采矿石、生火炉、拉风箱、调配碳比、千锤百炼、淬火研磨才能成型！</text>
      <text x="25" y="90" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 致命短板：剑身虽然锋利无比削铁如泥，但哪怕剑柄少了一颗销钉，整炉钢水直接报废！</text>
      <text x="25" y="118" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 对应现实：Rust 编译检查与借用检查极其严厉，大模型微小的引用疏忽就会引发编译死锁！</text>
      <rect x="25" y="132" width="600" height="32" rx="6" fill="#881337"/>
      <text x="35" y="153" fill="#fecdd3" font-size="13" font-family="monospace">劣势：每次修改代码都需要重新经历数秒编译，智能体在冷启动中频繁超时瘫痪！</text>
    </g>

    <!-- Sub-analogy 2: 严苛国宴 -->
    <g transform="translate(30, 275)">
      <rect width="650" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="25" y="32" fill="#fb923c" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">🏛️ 比喻二：严苛的国宴厨艺大考（刚性类型系统与样板约束）</text>
      <text x="25" y="62" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 考官巡视：菜谱必须有 50 页规划，食材每克精确称重，少了一颗葱花整桌直接判零分！</text>
      <text x="25" y="90" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 刚性易碎：外界只要传进来一个未在菜单上登记的佐料，厨房立刻拉闸断电（反序列化崩溃）！</text>
      <text x="25" y="118" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 对应现实：Java/C++ 需要写冗长的 class、public static void main、getter/setter 与 Trait。</text>
      <rect x="25" y="132" width="600" height="32" rx="6" fill="#7c2d12"/>
      <text x="35" y="153" fill="#fed7aa" font-size="13" font-family="monospace">Token 核爆：实现相同的一个工具调用，样板代码占用上下文窗口 300% 以上！</text>
    </g>

    <!-- Sub-analogy 3: 外币繁杂兑换 -->
    <g transform="translate(30, 475)">
      <rect width="650" height="195" rx="12" fill="#0f172a" stroke="#334155"/>
      <text x="25" y="32" fill="#f87171" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">🏦 比喻三：繁琐的外币审批（强类型反序列化摩擦）</text>
      <text x="25" y="62" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 去银行换钱，必须提交户籍、工作证明、资产证明，错一个字就要从头排队！</text>
      <text x="25" y="90" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 大模型的天然本能是生成流动自如的“JSON 现金流”，强类型语言却非要严格验钞。</text>
      <text x="25" y="118" fill="#e2e8f0" font-size="15" font-family="-apple-system, sans-serif">• 一旦第三方 API 升级增加了一个可选字段，静态类型解析器可能直接抛出未知字段异常！</text>
      <rect x="25" y="138" width="600" height="42" rx="6" fill="#450a0a"/>
      <text x="35" y="164" fill="#fca5a5" font-size="13" font-family="monospace">现实反差：工业级运行性能再高，一旦在“智能体动态连接层”卡死，性能优势全成泡影！</text>
    </g>
  </g>
</svg>
