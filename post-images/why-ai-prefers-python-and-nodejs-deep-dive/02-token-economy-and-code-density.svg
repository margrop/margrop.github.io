<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad2)"/>

  <!-- Title Header -->
  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">Token 经济学与代码密度：相同功能在五大语言中的上下文占用与编译延迟对比</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">Token Density, Boilerplate Overhead &amp; Sandbox Cold-Start Latency Across 5 Major Languages</text>

  <!-- Benchmark Container -->
  <g transform="translate(80, 130)">
    <rect width="1440" height="710" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Benchmark header -->
    <rect width="1440" height="50" rx="16" fill="#1e293b"/>
    <text x="40" y="32" fill="#94a3b8" font-size="15" font-weight="bold" font-family="monospace">语言 / 运行时</text>
    <text x="240" y="32" fill="#94a3b8" font-size="15" font-weight="bold" font-family="monospace">代码行数 (LOC)</text>
    <text x="440" y="32" fill="#94a3b8" font-size="15" font-weight="bold" font-family="monospace">Token 消耗量</text>
    <text x="680" y="32" fill="#94a3b8" font-size="15" font-weight="bold" font-family="monospace">样板代码占比</text>
    <text x="920" y="32" fill="#94a3b8" font-size="15" font-weight="bold" font-family="monospace">沙箱冷启动耗时</text>
    <text x="1180" y="32" fill="#94a3b8" font-size="15" font-weight="bold" font-family="monospace">大模型 Pass@1 成功率</text>

    <!-- Row 1: Python 3.12 -->
    <g transform="translate(0, 50)">
      <rect width="1440" height="95" fill="#102a45" opacity="0.4"/>
      <line x1="0" y1="95" x2="1440" y2="95" stroke="#334155"/>
      <text x="40" y="45" fill="#38bdf8" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif">🐍 Python 3.12</text>
      <text x="40" y="72" fill="#7dd3fc" font-size="13" font-family="monospace">CPython / Pyodide</text>
      <text x="240" y="55" fill="#f8fafc" font-size="18" font-family="monospace">12 行</text>
      <text x="440" y="55" fill="#4ade80" font-size="20" font-weight="bold" font-family="monospace">48 Tokens</text>
      <!-- Bar for Token -->
      <rect x="560" y="40" width="70" height="18" rx="4" fill="#22c55e"/>
      <text x="680" y="55" fill="#4ade80" font-size="18" font-family="monospace">8.3% (极低)</text>
      <text x="920" y="55" fill="#4ade80" font-size="18" font-weight="bold" font-family="monospace">4.2 ms (即时)</text>
      <text x="1180" y="55" fill="#4ade80" font-size="22" font-weight="bold" font-family="monospace">94.6% 🌟</text>
    </g>

    <!-- Row 2: Node.js 22 / TypeScript -->
    <g transform="translate(0, 145)">
      <rect width="1440" height="95" fill="#06322b" opacity="0.4"/>
      <line x1="0" y1="95" x2="1440" y2="95" stroke="#334155"/>
      <text x="40" y="45" fill="#34d399" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif">⚡ Node.js 22 / TS</text>
      <text x="40" y="72" fill="#6ee7b7" font-size="13" font-family="monospace">V8 Isolate / Bun</text>
      <text x="240" y="55" fill="#f8fafc" font-size="18" font-family="monospace">15 行</text>
      <text x="440" y="55" fill="#34d399" font-size="20" font-weight="bold" font-family="monospace">64 Tokens</text>
      <rect x="560" y="40" width="95" height="18" rx="4" fill="#10b981"/>
      <text x="680" y="55" fill="#34d399" font-size="18" font-family="monospace">14.1% (极低)</text>
      <text x="920" y="55" fill="#34d399" font-size="18" font-weight="bold" font-family="monospace">5.8 ms (即时)</text>
      <text x="1180" y="55" fill="#34d399" font-size="22" font-weight="bold" font-family="monospace">91.8% 🌟</text>
    </g>

    <!-- Row 3: Go 1.23 -->
    <g transform="translate(0, 240)">
      <line x1="0" y1="95" x2="1440" y2="95" stroke="#334155"/>
      <text x="40" y="45" fill="#0ea5e9" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif">🔷 Go 1.23</text>
      <text x="40" y="72" fill="#94a3b8" font-size="13" font-family="monospace">gc Native Compiler</text>
      <text x="240" y="55" fill="#f8fafc" font-size="18" font-family="monospace">38 行</text>
      <text x="440" y="55" fill="#fbbf24" font-size="20" font-weight="bold" font-family="monospace">148 Tokens</text>
      <rect x="560" y="40" width="220" height="18" rx="4" fill="#f59e0b"/>
      <text x="680" y="55" fill="#fbbf24" font-size="18" font-family="monospace">46.5% (中等)</text>
      <text x="920" y="55" fill="#fbbf24" font-size="18" font-weight="bold" font-family="monospace">820 ms (需编译)</text>
      <text x="1180" y="55" fill="#fbbf24" font-size="22" font-weight="bold" font-family="monospace">76.4%</text>
    </g>

    <!-- Row 4: Rust 1.80 -->
    <g transform="translate(0, 335)">
      <line x1="0" y1="95" x2="1440" y2="95" stroke="#334155"/>
      <text x="40" y="45" fill="#f97316" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif">🦀 Rust 1.80</text>
      <text x="40" y="72" fill="#94a3b8" font-size="13" font-family="monospace">rustc + LLVM</text>
      <text x="240" y="55" fill="#f8fafc" font-size="18" font-family="monospace">52 行</text>
      <text x="440" y="55" fill="#f87171" font-size="20" font-weight="bold" font-family="monospace">226 Tokens</text>
      <rect x="560" y="40" width="340" height="18" rx="4" fill="#ea580c"/>
      <text x="680" y="55" fill="#f87171" font-size="18" font-family="monospace">68.2% (偏高)</text>
      <text x="920" y="55" fill="#f87171" font-size="18" font-weight="bold" font-family="monospace">3150 ms (极慢)</text>
      <text x="1180" y="55" fill="#f87171" font-size="22" font-weight="bold" font-family="monospace">61.2% (借用检查难)</text>
    </g>

    <!-- Row 5: Java 21 LTS -->
    <g transform="translate(0, 430)">
      <line x1="0" y1="95" x2="1440" y2="95" stroke="#334155"/>
      <text x="40" y="45" fill="#ef4444" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif">☕ Java 21 LTS</text>
      <text x="40" y="72" fill="#94a3b8" font-size="13" font-family="monospace">javac + HotSpot JVM</text>
      <text x="240" y="55" fill="#f8fafc" font-size="18" font-family="monospace">68 行</text>
      <text x="440" y="55" fill="#ef4444" font-size="20" font-weight="bold" font-family="monospace">285 Tokens</text>
      <rect x="560" y="40" width="410" height="18" rx="4" fill="#dc2626"/>
      <text x="680" y="55" fill="#ef4444" font-size="18" font-family="monospace">74.8% (严重冗余)</text>
      <text x="920" y="55" fill="#ef4444" font-size="18" font-weight="bold" font-family="monospace">1750 ms (JVM慢启动)</text>
      <text x="1180" y="55" fill="#ef4444" font-size="22" font-weight="bold" font-family="monospace">58.7% (样板导致幻觉)</text>
    </g>

    <!-- Bottom summary insights -->
    <g transform="translate(30, 545)">
      <rect width="1380" height="135" rx="12" fill="#090d16" stroke="#1e293b"/>
      <text x="25" y="32" fill="#fbbf24" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">💡 架构师量化洞见：大模型时代的残酷 Token 定律</text>
      <text x="25" y="62" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">1. 上下文成本定律：Python/Node.js 比 Java/Rust 节省高达 75%~83% 的输入输出 Token，不仅推理费用直降 4 倍，且远离注意力的长程遗忘衰减区！</text>
      <text x="25" y="90" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">2. 智能体响应定律：Node.js/Python 沙箱启动耗时仅为 4~6 毫秒，相比 Rust/C++ 的秒级编译构建，在多轮 ReAct 反思闭环中速度领先 500 倍！</text>
      <text x="25" y="118" fill="#4ade80" font-size="14" font-family="-apple-system, sans-serif">3. 容错生成定律：动态语言允许大模型专注于业务逻辑与数据流，免除繁复的类型签名与所有权标注，一次生成通过率突破 90% 大关！</text>
    </g>
  </g>
</svg>
