<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad3)"/>

  <!-- Title Header -->
  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">现代 AI 智能体体系结构：“双环一核”分工模型 (Dual-Ring &amp; Core Engine)</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">How Node.js (Connect), Python (Compute) and C++/Rust/CUDA (Inference) Form the Ideal AI Triumvirate</text>

  <!-- Container -->
  <g transform="translate(80, 130)">
    <!-- Layer 1: Outer Ring (Node.js / TypeScript) -->
    <g transform="translate(0, 0)">
      <rect width="1440" height="210" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <rect width="1440" height="42" rx="16" fill="url(#outerGrad)"/>
      <text x="40" y="28" fill="#ffffff" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">【外环：连接与行动】Node.js / TypeScript 智能体交互与协议中枢 (Agent Action &amp; Protocol Layer)</text>
      
      <g transform="translate(30, 60)">
        <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#34d399" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">📡 MCP 协议与工具中心</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Model Context Protocol</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• JSON-RPC 2.0 / Stdio 传输</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 官方 TypeScript SDK 事实标准</text>
      </g>

      <g transform="translate(380, 60)">
        <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#38bdf8" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">⚡ 高并发非阻塞 I/O 调度</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Libuv 事件循环 (Event Loop)</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 异步等待万千 HTTP / API 响应</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 零线程阻塞，内存占用极微小</text>
      </g>

      <g transform="translate(730, 60)">
        <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#a78bfa" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🌐 全栈感知与浏览器自动化</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Playwright / Puppeteer 原生操控</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• DOM 树无缝解析 / 截图审查</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 前端 React / Vue 组件实时渲染</text>
      </g>

      <g transform="translate(1080, 60)">
        <rect width="330" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#f43f5e" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🌊 实时流式传输 (SSE/WS)</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Server-Sent Events 流式打字机</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 双向 WebSocket 智能体协同</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 极简 JSON Schema 动态装配</text>
      </g>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(720, 215)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
      <polygon points="-6,35 6,35 0,45" fill="#38bdf8"/>
    </g>

    <!-- Layer 2: Inner Ring (Python Compute) -->
    <g transform="translate(0, 255)">
      <rect width="1440" height="210" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect width="1440" height="42" rx="16" fill="url(#innerGrad)"/>
      <text x="40" y="28" fill="#ffffff" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">【内环：思考与计算】Python 科学数据分析与模型编排中心 (Cognition &amp; Data Sandbox)</text>
      
      <g transform="translate(30, 60)">
        <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#38bdf8" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🧠 科学计算与数学推导</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• NumPy 矩阵与张量运算</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• SciPy / SymPy 符号微积分</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 统计模型与算法验证</text>
      </g>

      <g transform="translate(380, 60)">
        <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#facc15" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">📊 数据分析与图表生成</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Pandas / Polars 大数据挖掘</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Matplotlib / Seaborn 自动化绘图</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Code Interpreter 代码解释器标准</text>
      </g>

      <g transform="translate(730, 60)">
        <rect width="320" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#fb923c" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🤗 模型生态与微调管线</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Hugging Face Transformers</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• PEFT / LoRA / QLoRA 训练管线</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• LangChain / DSPy 提示词优化</text>
      </g>

      <g transform="translate(1080, 60)">
        <rect width="330" height="130" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#4ade80" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🛡️ 安全沙箱与微执行环境</text>
        <text x="20" y="62" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Jupyter Kernel / IPython REPL</text>
        <text x="20" y="85" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Pyodide WebAssembly 客户端运行</text>
        <text x="20" y="108" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• gVisor / Firecracker 轻量隔离</text>
      </g>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(720, 470)">
      <line x1="0" y1="0" x2="0" y2="35" stroke="#ea580c" stroke-width="3" stroke-dasharray="6,4"/>
      <polygon points="-6,35 6,35 0,45" fill="#ea580c"/>
    </g>

    <!-- Layer 3: Core Engine (C++ / Rust / CUDA) -->
    <g transform="translate(0, 510)">
      <rect width="1440" height="200" rx="16" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>
      <rect width="1440" height="42" rx="16" fill="url(#coreGrad)"/>
      <text x="40" y="28" fill="#ffffff" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">【核心：极致算力底座】C++ / Rust / CUDA 高性能推理引擎 (High-Performance Inference Core)</text>
      
      <g transform="translate(30, 60)">
        <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#fb7185" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">⚡ vLLM / TensorRT-LLM</text>
        <text x="20" y="60" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• PagedAttention 显存优化 (C++/CUDA)</text>
        <text x="20" y="82" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 连续批处理 (Continuous Batching)</text>
        <text x="20" y="104" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 极致吞吐与张量并行</text>
      </g>

      <g transform="translate(380, 60)">
        <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#f97316" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🦙 llama.cpp &amp; GGUF</text>
        <text x="20" y="60" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 纯纯纯 C/C++ 裸金属优化</text>
        <text x="20" y="82" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• AVX-512 / ARM NEON / Metal</text>
        <text x="20" y="104" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 极致轻量的消费级端侧推理</text>
      </g>

      <g transform="translate(730, 60)">
        <rect width="320" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#facc15" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🔍 向量检索与索引库</text>
        <text x="20" y="60" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• FAISS (Facebook C++ 引擎)</text>
        <text x="20" y="82" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Qdrant / LanceDB (Rust 核心)</text>
        <text x="20" y="104" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• HNSW 毫秒级百万维向量相似度</text>
      </g>

      <g transform="translate(1080, 60)">
        <rect width="330" height="120" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="32" fill="#4ade80" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">🛡️ 安全微虚拟机与容器</text>
        <text x="20" y="60" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Firecracker (Rust MicroVM)</text>
        <text x="20" y="82" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• Wasmtime / Wasmer (Wasm 引擎)</text>
        <text x="20" y="104" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">• 为动态语言代码提供铁壁防御</text>
      </g>
    </g>
  </g>
</svg>
