<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flowGood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flowBad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad4)"/>

  <!-- Title Header -->
  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">智能体 ReAct 极速闭环：为什么毫秒级 REPL 是 AI 自我纠错的生命线？</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">Millisecond Dynamic REPL Loop vs. Heavy Rigid Compilation Overhead in Agent Self-Correction</text>

  <!-- Flow Comparison Container -->
  <g transform="translate(60, 135)">
    <!-- Top Route: Dynamic Languages (Python / Node.js) -->
    <g transform="translate(0, 0)">
      <rect width="1480" height="340" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <rect width="1480" height="42" rx="16" fill="url(#flowGood)"/>
      <text x="30" y="28" fill="#ffffff" font-size="17" font-weight="bold" font-family="-apple-system, sans-serif">🟢 极速闭环模式：动态脚本语言（Python / Node.js）—— 总耗时 420 ms（极度敏捷）</text>

      <!-- Step 1 -->
      <g transform="translate(30, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#34d399" font-size="16" font-weight="bold">步骤 1：意图解析与生成</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">大模型接收任务：</text>
        <text x="20" y="95" fill="#94a3b8" font-size="13">“抓取天气 API 并画图”</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">生成代码体积：</text>
        <text x="20" y="155" fill="#38bdf8" font-size="15" font-family="monospace">14 行代码 (52 tokens)</text>
        <text x="20" y="195" fill="#a7f3d0" font-size="14">耗时：~350 ms</text>
      </g>

      <!-- Arrow 1 -->
      <line x1="290" y1="185" x2="330" y2="185" stroke="#10b981" stroke-width="3"/>
      <polygon points="330,180 340,185 330,190" fill="#10b981"/>

      <!-- Step 2 -->
      <g transform="translate(345, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#38bdf8" font-size="16" font-weight="bold">步骤 2：沙箱微环境执行</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">CPython / V8 Isolate：</text>
        <text x="20" y="95" fill="#4ade80" font-size="15" font-family="monospace">冷启动: 4.8 ms</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">动态执行过程：</text>
        <text x="20" y="155" fill="#f87171" font-size="13" font-family="monospace">KeyError: 'temp_c'</text>
        <text x="20" y="195" fill="#fbbf24" font-size="14">执行报错立即可捕获！</text>
      </g>

      <!-- Arrow 2 -->
      <line x1="605" y1="185" x2="645" y2="185" stroke="#10b981" stroke-width="3"/>
      <polygon points="645,180 655,185 645,190" fill="#10b981"/>

      <!-- Step 3 -->
      <g transform="translate(660, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#fbbf24" font-size="16" font-weight="bold">步骤 3：轻量错误反馈</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">向 LLM 反馈 stderr：</text>
        <text x="20" y="100" fill="#fca5a5" font-size="13" font-family="monospace">Line 8: KeyError: 'temp_c'</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">精准错误仅占：</text>
        <text x="20" y="155" fill="#fbbf24" font-size="15" font-family="monospace">18 个额外 tokens</text>
        <text x="20" y="195" fill="#a7f3d0" font-size="14">零污染上下文窗口！</text>
      </g>

      <!-- Arrow 3 -->
      <line x1="920" y1="185" x2="960" y2="185" stroke="#10b981" stroke-width="3"/>
      <polygon points="960,180 970,185 960,190" fill="#10b981"/>

      <!-- Step 4 -->
      <g transform="translate(975, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#a78bfa" font-size="16" font-weight="bold">步骤 4：极速单步修正</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">LLM 动态自省修改：</text>
        <text x="20" y="100" fill="#a7f3d0" font-size="13" font-family="monospace">res.get('temp', 22.5)</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">动态类型宽容保护：</text>
        <text x="20" y="155" fill="#34d399" font-size="14">无缝吸纳结构微变</text>
        <text x="20" y="195" fill="#a7f3d0" font-size="14">生成耗时：~200 ms</text>
      </g>

      <!-- Arrow 4 -->
      <line x1="1235" y1="185" x2="1275" y2="185" stroke="#10b981" stroke-width="3"/>
      <polygon points="1275,180 1285,185 1275,190" fill="#10b981"/>

      <!-- Step 5 -->
      <g transform="translate(1290, 65)">
        <rect width="160" height="240" rx="12" fill="#064e3b" stroke="#10b981"/>
        <text x="20" y="45" fill="#34d399" font-size="20" font-weight="bold">任务成功</text>
        <text x="20" y="85" fill="#ffffff" font-size="26" font-weight="bold">SUCCESS</text>
        <text x="20" y="125" fill="#cbd5e1" font-size="13">图表已生成</text>
        <text x="20" y="150" fill="#cbd5e1" font-size="13">数据已导出</text>
        <text x="20" y="195" fill="#facc15" font-size="13">总轮数: 1 次纠错</text>
      </g>
    </g>

    <!-- Bottom Route: Heavy Compiled Languages (C++ / Rust) -->
    <g transform="translate(0, 365)">
      <rect width="1480" height="340" rx="16" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
      <rect width="1480" height="42" rx="16" fill="url(#flowBad)"/>
      <text x="30" y="28" fill="#ffffff" font-size="17" font-weight="bold" font-family="-apple-system, sans-serif">🔴 冗长停滞模式：严格编译型语言（C++ / Rust）—— 总耗时 12,800 ms（智能体频繁超时锁死）</text>

      <!-- Step 1 -->
      <g transform="translate(30, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold">步骤 1：庞大结构体声明</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">必须定义完整模型：</text>
        <text x="20" y="95" fill="#94a3b8" font-size="13">#[derive(Deserialize)]</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">生成代码体积：</text>
        <text x="20" y="155" fill="#fca5a5" font-size="15" font-family="monospace">58 行代码 (245 tokens)</text>
        <text x="20" y="195" fill="#fca5a5" font-size="14">耗时：~1200 ms</text>
      </g>

      <!-- Arrow 1 -->
      <line x1="290" y1="185" x2="330" y2="185" stroke="#f43f5e" stroke-width="3"/>
      <polygon points="330,180 340,185 330,190" fill="#f43f5e"/>

      <!-- Step 2 -->
      <g transform="translate(345, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#fb7185" font-size="16" font-weight="bold">步骤 2：沉重全量编译构建</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">Cargo / Clang++ 启动：</text>
        <text x="20" y="95" fill="#ef4444" font-size="15" font-family="monospace">编译耗时: 3,450 ms</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">严格所有权检查：</text>
        <text x="20" y="155" fill="#ef4444" font-size="13" font-family="monospace">E0502: borrow of moved</text>
        <text x="20" y="195" fill="#f87171" font-size="14">编译器直接拒绝生成二进制</text>
      </g>

      <!-- Arrow 2 -->
      <line x1="605" y1="185" x2="645" y2="185" stroke="#f43f5e" stroke-width="3"/>
      <polygon points="645,180 655,185 645,190" fill="#f43f5e"/>

      <!-- Step 3 -->
      <g transform="translate(660, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold">步骤 3：海量编译器诊断日志</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">Cargo 吐出海量报错：</text>
        <text x="20" y="100" fill="#fca5a5" font-size="12" font-family="monospace">error[E0597]: `val` does not live long enough...</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">吞噬上下文窗口：</text>
        <text x="20" y="155" fill="#ef4444" font-size="15" font-family="monospace">650+ 错误 Tokens</text>
        <text x="20" y="195" fill="#fca5a5" font-size="14">挤占核心注意力！</text>
      </g>

      <!-- Arrow 3 -->
      <line x1="920" y1="185" x2="960" y2="185" stroke="#f43f5e" stroke-width="3"/>
      <polygon points="960,180 970,185 960,190" fill="#f43f5e"/>

      <!-- Step 4 -->
      <g transform="translate(975, 65)">
        <rect width="250" height="240" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="20" y="35" fill="#f87171" font-size="16" font-weight="bold">步骤 4：多轮反思幻觉死循环</text>
        <text x="20" y="70" fill="#cbd5e1" font-size="14">LLM 试图加生命周期：</text>
        <text x="20" y="100" fill="#fca5a5" font-size="13" font-family="monospace">&amp;'a mut Data&lt;'b&gt;</text>
        <text x="20" y="130" fill="#cbd5e1" font-size="14">再次触发新错误：</text>
        <text x="20" y="155" fill="#ef4444" font-size="13">E0499 / E0382 死锁</text>
        <text x="20" y="195" fill="#fca5a5" font-size="14">第 3 轮编译再次失败！</text>
      </g>

      <!-- Arrow 4 -->
      <line x1="1235" y1="185" x2="1275" y2="185" stroke="#f43f5e" stroke-width="3"/>
      <polygon points="1275,180 1285,185 1275,190" fill="#f43f5e"/>

      <!-- Step 5 -->
      <g transform="translate(1290, 65)">
        <rect width="160" height="240" rx="12" fill="#450a0a" stroke="#f43f5e"/>
        <text x="20" y="45" fill="#f87171" font-size="20" font-weight="bold">超时中断</text>
        <text x="20" y="85" fill="#fca5a5" font-size="26" font-weight="bold">TIMEOUT</text>
        <text x="20" y="125" fill="#cbd5e1" font-size="13">沙箱熔断保护</text>
        <text x="20" y="150" fill="#cbd5e1" font-size="13">超出最大重试</text>
        <text x="20" y="195" fill="#ef4444" font-size="13">状态: 智能体卡死</text>
      </g>
    </g>
  </g>
</svg>
