<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#4A90D9" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid decoration -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- accent tag -->
  <rect x="80" y="180" width="148" height="36" rx="18" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="154" y="204" text-anchor="middle" font-size="16" fill="#93c5fd" letter-spacing="2">深度体验</text>

  <!-- title -->
  <text x="80" y="300" font-size="64" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">MiniMax Code CLI</text>
  <text x="80" y="378" font-size="64" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">深度体验</text>

  <!-- subtitle -->
  <text x="80" y="440" font-size="26" fill="#94a3b8">从安装踩坑到真香实测</text>
  <line x1="80" y1="470" x2="340" y2="470" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- terminal window icon bottom-right -->
  <g transform="translate(720,330)" filter="url(#glow)">
    <rect x="0" y="0" width="380" height="230" rx="14" fill="#0d1117" stroke="#334155"/>
    <rect x="0" y="0" width="380" height="34" rx="14" fill="#1c2128"/>
    <rect x="0" y="17" width="380" height="17" fill="#1c2128"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="17" r="6" fill="#febc2e"/>
    <circle cx="66" cy="17" r="6" fill="#28c840"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" fill="#8b949e">root@server: ~</text>
    <!-- code lines -->
    <g font-size="15" font-family="Menlo, monospace">
      <text x="24" y="72" fill="#3fb950">$ <tspan fill="#e6edf3">mcode --version</tspan></text>
      <text x="24" y="100" fill="#8b949e">0.1.4</text>
      <text x="24" y="136" fill="#3fb950">$ <tspan fill="#e6edf3">mcode exec </tspan><tspan fill="#e3b341">"修复 bug"</tspan></text>
      <text x="24" y="164" fill="#39c5cf">● <tspan fill="#c9d1d9">Editing app.py</tspan></text>
      <text x="24" y="200" fill="#3fb950" font-weight="700">6 passed<tspan fill="#8b949e" font-weight="400"> in 0.02s</tspan></text>
    </g>
  </g>
</svg>
