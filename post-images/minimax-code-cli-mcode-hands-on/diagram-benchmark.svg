<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4A90D9"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>

  <text x="600" y="60" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">4 个真实任务耗时实测</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#64748b">M2.5 模型 · mcode exec --permission full · 从发出提示词到任务完成</text>

  <!-- chart area: label col 0-300, bars from x=320, scale: 50s -> 780px (15.6px/s) -->
  <!-- gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="320" y1="130" x2="320" y2="440"/>
    <line x1="476" y1="130" x2="476" y2="440"/>
    <line x1="632" y1="130" x2="632" y2="440"/>
    <line x1="788" y1="130" x2="788" y2="440"/>
    <line x1="944" y1="130" x2="944" y2="440"/>
    <line x1="1100" y1="130" x2="1100" y2="440"/>
  </g>
  <g font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="320" y="462">0s</text>
    <text x="476" y="462">10s</text>
    <text x="632" y="462">20s</text>
    <text x="788" y="462">30s</text>
    <text x="944" y="462">40s</text>
    <text x="1100" y="462">50s</text>
  </g>

  <!-- bar 1: 修复bug+测试 38s -> 592.8px -->
  <text x="300" y="192" text-anchor="end" font-size="17" font-weight="600" fill="#0f172a">修复 bug + 补测试</text>
  <rect x="320" y="166" width="593" height="40" rx="8" fill="url(#bar)"/>
  <text x="929" y="193" font-size="17" font-weight="700" fill="#2563eb">38s</text>

  <!-- bar 2: 生成AGENTS.md 30s -> 468px -->
  <text x="300" y="270" text-anchor="end" font-size="17" font-weight="600" fill="#0f172a">生成 AGENTS.md</text>
  <rect x="320" y="244" width="468" height="40" rx="8" fill="url(#bar)"/>
  <text x="804" y="271" font-size="17" font-weight="700" fill="#2563eb">30s</text>

  <!-- bar 3: 代码问答 11s -> 171.6px -->
  <text x="300" y="348" text-anchor="end" font-size="17" font-weight="600" fill="#0f172a">代码问答</text>
  <rect x="320" y="322" width="172" height="40" rx="8" fill="url(#bar)"/>
  <text x="508" y="349" font-size="17" font-weight="700" fill="#2563eb">11s</text>

  <!-- bar 4: 添加pow功能 47s -> 733.2px -->
  <text x="300" y="426" text-anchor="end" font-size="17" font-weight="600" fill="#0f172a">添加 pow 功能</text>
  <rect x="320" y="400" width="733" height="40" rx="8" fill="url(#barOrange)"/>
  <text x="1069" y="427" font-size="17" font-weight="700" fill="#d97706">47s</text>

  <text x="600" y="498" text-anchor="middle" font-size="13" fill="#94a3b8">橙色为耗时最长的任务：新增功能 + 跑完整测试套件</text>
</svg>
