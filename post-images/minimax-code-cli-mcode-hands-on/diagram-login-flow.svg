<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="480" fill="#f8fafc"/>

  <text x="600" y="60" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">SSH 服务器上的登录「接力赛」</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#64748b">无浏览器的远程服务器如何完成 OAuth 登录：回调地址需要靠隧道「接力」回本地</text>

  <!-- steps -->
  <g font-size="14" fill="#334155">
    <!-- step 1 -->
    <g filter="url(#sh)"><rect x="30" y="150" width="200" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
    <circle cx="60" cy="150" r="16" fill="#2563eb"/>
    <text x="60" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">服务器上运行</text>
    <text x="130" y="222" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">$ mcode login</text>
    <text x="130" y="248" text-anchor="middle" font-size="13" fill="#64748b">SSH 会话里发起登录</text>

    <!-- step 2 -->
    <g filter="url(#sh)"><rect x="270" y="150" width="200" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
    <circle cx="300" cy="150" r="16" fill="#2563eb"/>
    <text x="300" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="370" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">生成回调地址</text>
    <text x="370" y="222" text-anchor="middle" font-size="13" fill="#64748b">随机端口 127.0.0.1:xxxxx</text>
    <text x="370" y="248" text-anchor="middle" font-size="13" fill="#64748b">等待浏览器授权结果</text>

    <!-- step 3 -->
    <g filter="url(#sh)"><rect x="510" y="150" width="200" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
    <circle cx="540" cy="150" r="16" fill="#f59e0b"/>
    <text x="540" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="610" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">本地浏览器授权</text>
    <text x="610" y="222" text-anchor="middle" font-size="13" fill="#64748b">把链接复制到本地打开</text>
    <text x="610" y="248" text-anchor="middle" font-size="13" fill="#64748b">登录 MiniMax 账号</text>

    <!-- step 4 -->
    <g filter="url(#sh)"><rect x="750" y="150" width="200" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/></g>
    <circle cx="780" cy="150" r="16" fill="#f59e0b"/>
    <text x="780" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="850" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">拿到回调 URL</text>
    <text x="850" y="222" text-anchor="middle" font-size="13" fill="#64748b">授权后跳转到</text>
    <text x="850" y="248" text-anchor="middle" font-size="13" fill="#64748b">127.0.0.1 的回调链接</text>

    <!-- step 5 -->
    <g filter="url(#sh)"><rect x="990" y="150" width="180" height="130" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
    <circle cx="1020" cy="150" r="16" fill="#16a34a"/>
    <text x="1020" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
    <text x="1080" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">接力完成登录</text>
    <text x="1080" y="222" text-anchor="middle" font-size="13" fill="#64748b">SSH 隧道 / SOCKS</text>
    <text x="1080" y="248" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="600">登录成功 ✅</text>
  </g>

  <!-- arrows -->
  <line x1="232" y1="215" x2="266" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="472" y1="215" x2="506" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="712" y1="215" x2="746" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="952" y1="215" x2="986" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- dashed SSH tunnel annotation: from step5 back to server (step1/2) -->
  <path d="M1080 284 C 1080 390, 370 390, 370 296" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <rect x="520" y="370" width="180" height="34" rx="17" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">SSH 隧道转发回调</text>
</svg>
