<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <linearGradient id="modelbox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4A90D9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>

  <text x="600" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">MiniMax Code CLI 的三种使用方式</text>
  <text x="600" y="96" text-anchor="middle" font-size="17" fill="#64748b">同一个 mcode 二进制，三种接入形态，最终都调用云端 M 系列模型</text>

  <!-- Card 1: TUI -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="320" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="60" y="150" width="320" height="6" rx="3" fill="#4A90D9"/>
  <!-- terminal icon -->
  <g transform="translate(190,186)">
    <rect x="0" y="0" width="60" height="44" rx="6" fill="#0d1117"/>
    <circle cx="10" cy="8" r="2.5" fill="#ff5f57"/><circle cx="18" cy="8" r="2.5" fill="#febc2e"/><circle cx="26" cy="8" r="2.5" fill="#28c840"/>
    <path d="M8 22 l8 6 -8 6" stroke="#3fb950" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22" y1="34" x2="38" y2="34" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="220" y="272" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">① 交互式 TUI</text>
  <text x="220" y="302" text-anchor="middle" font-size="14" fill="#64748b">终端里直接对话式编程</text>
  <text x="220" y="326" text-anchor="middle" font-size="14" fill="#64748b">适合日常开发、探索代码库</text>
  <text x="220" y="352" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">$ mcode</text>

  <!-- Card 2: Headless -->
  <g filter="url(#shadow)">
    <rect x="440" y="150" width="320" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="440" y="150" width="320" height="6" rx="3" fill="#f59e0b"/>
  <!-- gear icon -->
  <g transform="translate(576,184)">
    <g fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
      <circle cx="24" cy="24" r="11" fill="#fef3c7"/>
      <circle cx="24" cy="24" r="4" fill="#f59e0b"/>
      <path d="M24 2 v6 M24 40 v6 M2 24 h6 M40 24 h6 M8.4 8.4 l4.2 4.2 M35.4 35.4 l4.2 4.2 M39.6 8.4 l-4.2 4.2 M12.6 35.4 l-4.2 4.2"/>
    </g>
  </g>
  <text x="600" y="272" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">② Headless / CI</text>
  <text x="600" y="302" text-anchor="middle" font-size="14" fill="#64748b">单次任务，无 TUI，管道友好</text>
  <text x="600" y="326" text-anchor="middle" font-size="14" fill="#64748b">JSON 结构化输出，适合自动化</text>
  <text x="600" y="352" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">$ mcode exec --output-format json</text>

  <!-- Card 3: ACP -->
  <g filter="url(#shadow)">
    <rect x="820" y="150" width="320" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="820" y="150" width="320" height="6" rx="3" fill="#4A90D9"/>
  <!-- editor icon -->
  <g transform="translate(946,184)">
    <rect x="0" y="0" width="68" height="48" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="0" y="0" width="20" height="48" rx="6" fill="#dbeafe"/>
    <rect x="26" y="8" width="30" height="4" rx="2" fill="#4A90D9"/>
    <rect x="26" y="16" width="36" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="26" y="24" width="26" height="4" rx="2" fill="#f59e0b"/>
    <rect x="26" y="32" width="34" height="4" rx="2" fill="#cbd5e1"/>
  </g>
  <text x="980" y="272" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">③ ACP 编辑器接入</text>
  <text x="980" y="302" text-anchor="middle" font-size="14" fill="#64748b">Agent Client Protocol 服务器</text>
  <text x="980" y="326" text-anchor="middle" font-size="14" fill="#64748b">接入 Zed 等支持 ACP 的编辑器</text>
  <text x="980" y="352" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="600">$ mcode acp</text>

  <!-- arrows down -->
  <line x1="220" y1="382" x2="220" y2="470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="382" x2="600" y2="470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="382" x2="980" y2="470" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- model box -->
  <g filter="url(#shadow)">
    <rect x="320" y="482" width="560" height="88" rx="16" fill="url(#modelbox)"/>
  </g>
  <!-- cloud icon -->
  <g transform="translate(372,505)">
    <path d="M14 40 a11 11 0 1 1 3 -21.5 a13 13 0 0 1 24 2 a10 10 0 1 1 4 19.5 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="630" y="522" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">MiniMax M 系列模型（云端）</text>
  <text x="630" y="550" text-anchor="middle" font-size="14" fill="#dbeafe">统一推理入口 · 支持 BYOK 自定义 provider</text>
</svg>
