<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="460" fill="#f8fafc"/>

  <text x="600" y="60" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">四种权限策略，像驾照等级</text>
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#64748b">--permission 控制 agent 对文件系统与命令执行的操作权限</text>

  <!-- card template x offsets: 60, 350, 640, 930 ; w=250 -->
  <!-- ask -->
  <g filter="url(#sh)"><rect x="60" y="130" width="250" height="270" rx="16" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="60" y="130" width="250" height="6" rx="3" fill="#94a3b8"/>
  <text x="185" y="186" text-anchor="middle" font-size="40">🚗</text>
  <text x="185" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">ask</text>
  <text x="185" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">新手学员 · 步步确认</text>
  <text x="185" y="290" text-anchor="middle" font-size="13" fill="#64748b">每次写文件、跑命令</text>
  <text x="185" y="312" text-anchor="middle" font-size="13" fill="#64748b">都要弹窗让你点头</text>
  <text x="185" y="334" text-anchor="middle" font-size="13" fill="#64748b">最安全，也最磨人</text>
  <rect x="105" y="356" width="160" height="28" rx="14" fill="#f1f5f9"/>
  <text x="185" y="375" text-anchor="middle" font-size="13" fill="#475569">适合陌生项目试水</text>

  <!-- smart -->
  <g filter="url(#sh)"><rect x="350" y="130" width="250" height="270" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/></g>
  <rect x="350" y="130" width="250" height="6" rx="3" fill="#2563eb"/>
  <text x="475" y="186" text-anchor="middle" font-size="40">🚙</text>
  <text x="475" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">smart</text>
  <text x="475" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">老司机 · 智能放行</text>
  <text x="475" y="290" text-anchor="middle" font-size="13" fill="#64748b">读文件、改代码自动放行</text>
  <text x="475" y="312" text-anchor="middle" font-size="13" fill="#64748b">危险操作仍会停下来问你</text>
  <text x="475" y="334" text-anchor="middle" font-size="13" fill="#64748b">安全与效率的平衡点</text>
  <rect x="395" y="356" width="160" height="28" rx="14" fill="#dbeafe"/>
  <text x="475" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">日常开发推荐 ⭐</text>

  <!-- full -->
  <g filter="url(#sh)"><rect x="640" y="130" width="250" height="270" rx="16" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="640" y="130" width="250" height="6" rx="3" fill="#f59e0b"/>
  <text x="765" y="186" text-anchor="middle" font-size="40">🏎️</text>
  <text x="765" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">full</text>
  <text x="765" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#f59e0b">赛车手 · 全自动</text>
  <text x="765" y="290" text-anchor="middle" font-size="13" fill="#64748b">读写执行全部自动通过</text>
  <text x="765" y="312" text-anchor="middle" font-size="13" fill="#64748b">全程零打扰，跑得飞快</text>
  <text x="765" y="334" text-anchor="middle" font-size="13" fill="#64748b">翻车了也得自己兜底</text>
  <rect x="685" y="356" width="160" height="28" rx="14" fill="#fef3c7"/>
  <text x="765" y="375" text-anchor="middle" font-size="13" fill="#b45309">CI / 一次性容器适用</text>

  <!-- off -->
  <g filter="url(#sh)"><rect x="930" y="130" width="250" height="270" rx="16" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="930" y="130" width="250" height="6" rx="3" fill="#475569"/>
  <text x="1055" y="186" text-anchor="middle" font-size="40">🅿️</text>
  <text x="1055" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">off</text>
  <text x="1055" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">熄火 · 只读模式</text>
  <text x="1055" y="290" text-anchor="middle" font-size="13" fill="#64748b">只能看代码、回答问题</text>
  <text x="1055" y="312" text-anchor="middle" font-size="13" fill="#64748b">不给改，也不给跑</text>
  <text x="1055" y="334" text-anchor="middle" font-size="13" fill="#64748b">纯代码问答场景</text>
  <rect x="975" y="356" width="160" height="28" rx="14" fill="#f1f5f9"/>
  <text x="1055" y="375" text-anchor="middle" font-size="13" fill="#475569">只读审查 / 问答</text>
</svg>
