<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow13)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">生活化大比方：Trae Rules 就像米其林后厨的【食品安全守则】</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">不管大模型是 Claude、GPT-4o 还是豆包，进门必须严格执行的三大纪律八项注意！</text>

  <!-- Rule 1 -->
  <g transform="translate(60, 120)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="30" y="36" fill="#22d3ee" font-size="18" font-weight="bold">🧼 纪律一：出锅前必须用纯净水冲洗 ——【测试驱动与确定性验证】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#67e8f9" font-size="14" font-weight="bold">后厨大比方</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">不论菜炒得多香，上菜前洗碗消毒工序一道不能省，否则客人当场腹泻！</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#38bdf8" font-size="14" font-weight="bold">Trae Rules 工程落地 (.trae/rules/testing-guardrails.md)</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">每次修改核心逻辑后，强制调用终端执行 npm test 或 pytest，红灯严禁标记完成！</text>
  </g>

  <!-- Rule 2 -->
  <g transform="translate(60, 295)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#ec4899" stroke-width="1.5"/>
    <text x="30" y="36" fill="#f472b6" font-size="18" font-weight="bold">🚫 纪律二：严禁私自引入路边摊原料 ——【依赖与第三方库准入限制】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#fbcfe8" font-size="14" font-weight="bold">后厨大比方</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">大厨做菜只能用中央厨房认证过的有机食材，绝不能图省事在菜市场捡烂菜叶。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#f43f5e" font-size="14" font-weight="bold">Trae Rules 工程落地 (.trae/rules/architecture-invariants.md)</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">未经明确指令，严禁自行 npm install 引入未知包，优先复用项目中已有的实用工具。</text>
  </g>

  <!-- Rule 3 -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="30" y="36" fill="#a78bfa" font-size="18" font-weight="bold">🏷️ 纪律三：每盘菜必须贴上出品标签 ——【类型契约与模块边界规范】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#ddd6fe" font-size="14" font-weight="bold">后厨大比方</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">盘子上必须标注制作时间、温度、过敏原，任何人接手都清楚这盘菜的底细。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#c084fc" font-size="14" font-weight="bold">Trae Rules 工程落地 (.trae/rules/style-conventions.md)</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">全量使用严格 TypeScript 泛型接口，严禁滥用 any，函数边界必须声明清晰出入参契约。</text>
  </g>
</svg>