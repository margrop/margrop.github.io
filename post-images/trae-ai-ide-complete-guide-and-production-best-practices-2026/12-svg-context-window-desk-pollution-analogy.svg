<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow12)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">生活化大比方：Token 上下文窗口与“书桌堆满废纸”困境</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">为什么 Trae 对话时间长了会胡言乱语？小学生也能秒懂的上下文管理模型！</text>

  <!-- Left: Cluttered Desk -->
  <g transform="translate(60, 120)">
    <rect width="510" height="500" rx="12" fill="#1f2937" stroke="#ef4444" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f87171" font-size="20" font-weight="bold">❌ 堆满杂物的 1 米窄书桌（上下文污染）</text>
    
    <rect x="30" y="70" width="450" height="90" rx="8" fill="#111827"/>
    <text x="45" y="98" fill="#fca5a5" font-size="15" font-weight="bold">堆叠无用垃圾：无控索引</text>
    <text x="45" y="125" fill="#9ca3af" font-size="13">把 node_modules、数百兆构建产物、历史死循环日志全塞进记忆窗口。</text>

    <rect x="30" y="180" width="450" height="90" rx="8" fill="#111827"/>
    <text x="45" y="208" fill="#fca5a5" font-size="15" font-weight="bold">注意力被稀释：图纸被埋</text>
    <text x="45" y="235" fill="#9ca3af" font-size="13">真正关键的核心架构规则和接口契约被压在最底下，AI 翻找时产生幻觉。</text>

    <rect x="30" y="290" width="450" height="160" rx="8" fill="#111827" stroke="#b91c1c" stroke-width="1"/>
    <text x="45" y="320" fill="#f87171" font-size="16" font-weight="bold">后果表现：</text>
    <text x="45" y="350" fill="#fca5a5" font-size="14">⚠️ 忘记刚刚定好的架构铁律</text>
    <text x="45" y="380" fill="#fca5a5" font-size="14">⚠️ 擅自删除已有功能的函数实现</text>
    <text x="45" y="410" fill="#fca5a5" font-size="14">⚠️ 陷入原地修 Bug、越修越崩的死循环</text>
  </g>

  <!-- Right: Clean Desk -->
  <g transform="translate(630, 120)">
    <rect width="510" height="500" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="40" fill="#34d399" font-size="20" font-weight="bold">✅ 极简高效的整洁操作台（精准定点投喂）</text>

    <rect x="30" y="70" width="450" height="90" rx="8" fill="#111827"/>
    <text x="45" y="98" fill="#6ee7b7" font-size="15" font-weight="bold">严格设立门禁：.traeignore</text>
    <text x="45" y="125" fill="#9ca3af" font-size="13">主动屏蔽构建目录、依赖库与临时缓存，让 AI 的视线永远聚焦在纯净源码。</text>

    <rect x="30" y="180" width="450" height="90" rx="8" fill="#111827"/>
    <text x="45" y="208" fill="#6ee7b7" font-size="15" font-weight="bold">高阶定点召唤：#File 与 #Doc</text>
    <text x="45" y="235" fill="#9ca3af" font-size="13">每次只给当前任务最相关的 2-3 个文件，用精准的特异性上下文替代模糊扫描。</text>

    <rect x="30" y="290" width="450" height="160" rx="8" fill="#111827" stroke="#047857" stroke-width="1"/>
    <text x="45" y="320" fill="#34d399" font-size="16" font-weight="bold">调优成效：</text>
    <text x="45" y="350" fill="#a7f3d0" font-size="14">🎯 响应速度提升 300%，Token 消耗下降 75%</text>
    <text x="45" y="380" fill="#a7f3d0" font-size="14">🎯 跨文件代码重构零语法破坏</text>
    <text x="45" y="410" fill="#a7f3d0" font-size="14">🎯 每次会话始终紧盯核心业务目标</text>
  </g>
</svg>