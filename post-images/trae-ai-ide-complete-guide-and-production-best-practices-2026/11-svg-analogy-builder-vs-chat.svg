<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow11)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">生活化大比方：Chat 模式 vs Builder/SOLO 模式的本质差异</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">为什么很多人把 Trae 当普通 Copilot 用？因为混淆了【动嘴出图】与【扛锤施工】！</text>

  <!-- Row 1: Chat Mode -->
  <g transform="translate(60, 120)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="36" fill="#60a5fa" font-size="18" font-weight="bold">🛋️ Chat 模式：【室内家装咨询设计师】（只动嘴出图，绝不碰你家一面墙）</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#93c5fd" font-size="14" font-weight="bold">核心特征：上下文顾问 (Contextual Advisor)</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">你问他客厅怎么摆沙发、地暖用什么牌子，他给你方案草图，但绝不替你搬砖。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#38bdf8" font-size="14" font-weight="bold">适用场景：头脑风暴与局部探究</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">架构方案对比、算法逻辑推导、单段代码答疑，不直接污染或改动本地文件系统。</text>
  </g>

  <!-- Row 2: Builder / SOLO Mode -->
  <g transform="translate(60, 295)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="36" fill="#34d399" font-size="18" font-weight="bold">🏗️ Builder / SOLO 模式：【精装建筑总包工程队】（自带电钻、卷尺与验收仪）</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#6ee7b7" font-size="14" font-weight="bold">核心特征：自主执行智能体 (Autonomous Agent)</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">领到任务后自主拆解工序、跨多个房间砸墙拆砌，改完还拿水平仪亲自检验平整度。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#4ade80" font-size="14" font-weight="bold">适用场景：端到端项目级交付</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">跨模块重构、多文件功能新增、终端自动安装依赖并执行单测、内嵌 Webview 实时预览。</text>
  </g>

  <!-- Row 3: Synergy Workflow -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="150" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="36" fill="#fbbf24" font-size="18" font-weight="bold">⚡ 黄金协作法：【总工定规范】+【设计师出图】+【工程队施工】</text>
    <rect x="30" y="55" width="480" height="75" rx="8" fill="#111827"/>
    <text x="45" y="80" fill="#fcd34d" font-size="14" font-weight="bold">第一步：Chat 论证可行性与边界</text>
    <text x="45" y="105" fill="#9ca3af" font-size="13">用自然语言厘清数据流、接口协议与边界条件，确定技术选型方案。</text>
    <rect x="540" y="55" width="510" height="75" rx="8" fill="#111827"/>
    <text x="555" y="80" fill="#34d399" font-size="14" font-weight="bold">第二步：一键送入 Builder 闭环交付</text>
    <text x="555" y="105" fill="#e2e8f0" font-size="13">由 Agent 自动创建文件、调用终端跑测试，人在旁担任【监理总工】审批关键 Diff。</text>
  </g>
</svg>