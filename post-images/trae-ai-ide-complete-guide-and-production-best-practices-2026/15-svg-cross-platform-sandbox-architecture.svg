<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow15)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">跨平台零依赖自愈沙箱套件架构 (Windows 11 / Ubuntu 26.04 / macOS 27)</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">一键检测、自愈配置、注入生产级 Rules 与本地 MCP 握手测试</text>

  <!-- Target OS Matrix -->
  <g transform="translate(60, 120)">
    <rect width="1080" height="110" rx="12" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="32" fill="#60a5fa" font-size="16" font-weight="bold">🎯 三大操作系统原生执行支持（零外部包依赖，即开即跑）</text>
    
    <rect x="30" y="45" width="320" height="50" rx="6" fill="#111827"/>
    <text x="45" y="75" fill="#93c5fd" font-size="14" font-weight="bold">🪟 Windows 11 (PowerShell 7)</text>
    
    <rect x="380" y="45" width="320" height="50" rx="6" fill="#111827"/>
    <text x="395" y="75" fill="#fed7aa" font-size="14" font-weight="bold">🐧 Ubuntu 26.04 LTS (Bash)</text>

    <rect x="730" y="45" width="320" height="50" rx="6" fill="#111827"/>
    <text x="745" y="75" fill="#a7f3d0" font-size="14" font-weight="bold">🍎 macOS 27 (Zsh Native)</text>
  </g>

  <!-- Two Execution Modes -->
  <g transform="translate(60, 250)">
    <rect width="520" height="390" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="38" fill="#34d399" font-size="18" font-weight="bold">🛠️ 模式一：人工交互自愈模式 (Manual Interactive)</text>
    
    <rect x="30" y="60" width="460" height="75" rx="8" fill="#111827"/>
    <text x="45" y="88" fill="#6ee7b7" font-size="14" font-weight="bold">1. 终端菜单引导与环境自检</text>
    <text x="45" y="112" fill="#9ca3af" font-size="12">自动排查 Node.js、Python3、Trae 目录与权限配置</text>

    <rect x="30" y="145" width="460" height="75" rx="8" fill="#111827"/>
    <text x="45" y="173" fill="#6ee7b7" font-size="14" font-weight="bold">2. 智能构建 .traeignore</text>
    <text x="45" y="197" fill="#9ca3af" font-size="12">隔离 .git、node_modules、build、secrets，根除 Token 漂移</text>

    <rect x="30" y="230" width="460" height="75" rx="8" fill="#111827"/>
    <text x="45" y="258" fill="#6ee7b7" font-size="14" font-weight="bold">3. 注入三套生产级 .trae/rules/</text>
    <text x="45" y="282" fill="#9ca3af" font-size="12">架构恒等式、单元测试强护栏、Git 零泄露安全提交规范</text>

    <rect x="30" y="315" width="460" height="60" rx="8" fill="#111827"/>
    <text x="45" y="343" fill="#fcd34d" font-size="13" font-weight="bold">4. 本地测试 stdio MCP 握手</text>
    <text x="45" y="362" fill="#9ca3af" font-size="11">验证零日志污染 JSON-RPC 2.0 通信链路</text>
  </g>

  <g transform="translate(620, 250)">
    <rect width="520" height="390" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="38" fill="#fbbf24" font-size="18" font-weight="bold">🤖 模式二：Agent 静默配置模式 (--agent-mode)</text>
    
    <rect x="30" y="60" width="460" height="75" rx="8" fill="#111827"/>
    <text x="45" y="88" fill="#fcd34d" font-size="14" font-weight="bold">1. 非阻塞静默扫描 (--headless)</text>
    <text x="45" y="112" fill="#9ca3af" font-size="12">无 ANSI 控制字符打扰，纯粹标准输出流或结构化文件</text>

    <rect x="30" y="145" width="460" height="75" rx="8" fill="#111827"/>
    <text x="45" y="173" fill="#fcd34d" font-size="14" font-weight="bold">2. 幂等自愈执行 (Idempotent Apply)</text>
    <text x="45" y="197" fill="#9ca3af" font-size="12">不破坏已有配置，增量补齐缺失规则与环境变量</text>

    <rect x="30" y="230" width="460" height="75" rx="8" fill="#111827"/>
    <text x="45" y="258" fill="#fcd34d" font-size="14" font-weight="bold">3. 结构化 JSON 状态摘要</text>
    <text x="45" y="282" fill="#9ca3af" font-size="12">输出完整 JSON 对象供上游 Agent 直接解析与断言决策</text>

    <rect x="30" y="315" width="460" height="60" rx="8" fill="#111827"/>
    <text x="45" y="343" fill="#34d399" font-size="13" font-weight="bold">4. 零安全风险无外网调用</text>
    <text x="45" y="362" fill="#9ca3af" font-size="11">100% 离线运行，严防任何内网或凭证泄露</text>
  </g>
</svg>