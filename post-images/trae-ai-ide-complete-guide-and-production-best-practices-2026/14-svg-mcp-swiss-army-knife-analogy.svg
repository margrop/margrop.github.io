<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow14)"/>
  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">生活化大比方：MCP 就像给关在小黑屋的“学霸”装上机械臂与传感器</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">为什么 MCP 是 Trae 最具想象力的核武器？小学生也能理解的标准协议演进！</text>

  <!-- Left: The Brain in a Vat -->
  <g transform="translate(60, 120)">
    <rect width="330" height="500" rx="12" fill="#1f2937" stroke="#6366f1" stroke-width="1.5"/>
    <text x="25" y="40" fill="#818cf8" font-size="18" font-weight="bold">🧠 原始大模型大脑</text>
    <text x="25" y="70" fill="#9ca3af" font-size="13">（满腹经纶但手无寸铁）</text>
    
    <rect x="25" y="100" width="280" height="80" rx="8" fill="#111827"/>
    <text x="35" y="128" fill="#c7d2fe" font-size="14" font-weight="bold">超强大脑储备</text>
    <text x="35" y="155" fill="#9ca3af" font-size="12">精通所有编程语言与算法原理。</text>

    <rect x="25" y="200" width="280" height="120" rx="8" fill="#111827" stroke="#4338ca" stroke-width="1"/>
    <text x="35" y="228" fill="#f87171" font-size="14" font-weight="bold">致命现实痛点：</text>
    <text x="35" y="255" fill="#fca5a5" font-size="12">❌ 看不见本地数据库的真实表结构</text>
    <text x="35" y="280" fill="#fca5a5" font-size="12">❌ 无法启动浏览器点击验证网页</text>
    <text x="35" y="305" fill="#fca5a5" font-size="12">❌ 无法直接调取 Figma 原型设计稿</text>

    <rect x="25" y="340" width="280" height="130" rx="8" fill="#111827"/>
    <text x="35" y="370" fill="#fbbf24" font-size="13" font-weight="bold">状态：</text>
    <text x="35" y="400" fill="#e2e8f0" font-size="12">只能靠用户不断截图和复制粘贴，</text>
    <text x="35" y="425" fill="#e2e8f0" font-size="12">信息失真，效率大打折扣。</text>
  </g>

  <!-- Middle: MCP Bridge -->
  <g transform="translate(420, 120)">
    <rect width="360" height="500" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="40" fill="#34d399" font-size="18" font-weight="bold">🔌 MCP (Model Context Protocol)</text>
    <text x="25" y="70" fill="#9ca3af" font-size="13">（标准化的即插即用数字神经索）</text>

    <rect x="25" y="100" width="310" height="100" rx="8" fill="#111827"/>
    <text x="35" y="128" fill="#6ee7b7" font-size="14" font-weight="bold">标准化通讯契约</text>
    <text x="35" y="155" fill="#9ca3af" font-size="12">基于 JSON-RPC 2.0 规范，统一定义：</text>
    <text x="35" y="178" fill="#9ca3af" font-size="12">Tools(工具) / Resources(资源) / Prompts</text>

    <rect x="25" y="220" width="310" height="120" rx="8" fill="#111827"/>
    <text x="35" y="248" fill="#6ee7b7" font-size="14" font-weight="bold">双通道传输支持</text>
    <text x="35" y="275" fill="#9ca3af" font-size="12">🔹 stdio（本地进程标准输入输出）</text>
    <text x="35" y="300" fill="#9ca3af" font-size="12">🔹 SSE / HTTP（云端微服务实时流）</text>

    <rect x="25" y="360" width="310" height="110" rx="8" fill="#111827" stroke="#047857" stroke-width="1"/>
    <text x="35" y="390" fill="#34d399" font-size="14" font-weight="bold">协议价值：</text>
    <text x="35" y="418" fill="#e2e8f0" font-size="12">一次接入，让所有模型瞬间获得同等</text>
    <text x="35" y="442" fill="#e2e8f0" font-size="12">外设操作能力，彻底告别定制胶水代码！</text>
  </g>

  <!-- Right: Real-World Capabilities -->
  <g transform="translate(810, 120)">
    <rect width="330" height="500" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="25" y="40" fill="#fbbf24" font-size="18" font-weight="bold">🦾 现实世界的全能执行官</text>
    <text x="25" y="70" fill="#9ca3af" font-size="13">（手脑合一的真超级工程师）</text>

    <rect x="25" y="100" width="280" height="75" rx="8" fill="#111827"/>
    <text x="35" y="128" fill="#fcd34d" font-size="14" font-weight="bold">📊 数据库 MCP Server</text>
    <text x="35" y="153" fill="#9ca3af" font-size="12">直接读写真实库表，秒做数据迁移与索引分析</text>

    <rect x="25" y="190" width="280" height="75" rx="8" fill="#111827"/>
    <text x="35" y="218" fill="#fcd34d" font-size="14" font-weight="bold">🌐 Playwright / Chrome MCP</text>
    <text x="35" y="243" fill="#9ca3af" font-size="12">自动截屏比对 UI，端到端测试自主点击</text>

    <rect x="25" y="280" width="280" height="75" rx="8" fill="#111827"/>
    <text x="35" y="308" fill="#fcd34d" font-size="14" font-weight="bold">🎨 Figma / 设计走查 MCP</text>
    <text x="35" y="333" fill="#9ca3af" font-size="12">直接解析设计 Token，1:1 还原前端组件</text>

    <rect x="25" y="370" width="280" height="100" rx="8" fill="#111827" stroke="#b45309" stroke-width="1"/>
    <text x="35" y="400" fill="#34d399" font-size="14" font-weight="bold">最终效果：</text>
    <text x="35" y="428" fill="#e2e8f0" font-size="12">从“纸上谈兵的程序员”</text>
    <text x="35" y="450" fill="#e2e8f0" font-size="12">升级为“能调动全局资源的系统总控官”！</text>
  </g>
</svg>