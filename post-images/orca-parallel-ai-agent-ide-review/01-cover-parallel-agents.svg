<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="orcaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d29922"/><stop offset="1" stop-color="#9e6a03"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f778ba"/><stop offset="1" stop-color="#da3633"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- 连接线与粒子 -->
  <g stroke-width="2" opacity="0.85">
    <line x1="600" y1="330" x2="240" y2="180" stroke="#58a6ff"/>
    <line x1="600" y1="330" x2="960" y2="180" stroke="#3fb950"/>
    <line x1="600" y1="330" x2="240" y2="490" stroke="#d29922"/>
    <line x1="600" y1="330" x2="960" y2="490" stroke="#f778ba"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="420" cy="255" r="5" fill="#58a6ff"/>
    <circle cx="780" cy="255" r="5" fill="#3fb950"/>
    <circle cx="420" cy="410" r="5" fill="#d29922"/>
    <circle cx="780" cy="410" r="5" fill="#f778ba"/>
  </g>

  <!-- 中心 Orca 调度器 -->
  <g filter="url(#glow)">
    <circle cx="600" cy="330" r="78" fill="#0d1117" stroke="url(#orcaGrad)" stroke-width="3"/>
    <circle cx="600" cy="330" r="62" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="600" y="322" text-anchor="middle" font-size="30" font-weight="700" fill="url(#orcaGrad)">ORCA</text>
    <text x="600" y="352" text-anchor="middle" font-size="14" fill="#8b949e">Agent 调度器</text>
  </g>

  <!-- Agent 卡片 -->
  <g>
    <rect x="140" y="130" width="200" height="100" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="168" cy="160" r="10" fill="url(#g1)"/>
    <text x="188" y="166" font-size="16" font-weight="600" fill="#c9d1d9">Agent A</text>
    <text x="158" y="192" font-size="13" fill="#8b949e">worktree: feat/login</text>
    <rect x="158" y="204" width="120" height="6" rx="3" fill="#21262d"/>
    <rect x="158" y="204" width="96" height="6" rx="3" fill="#58a6ff"/>
  </g>
  <g>
    <rect x="860" y="130" width="200" height="100" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="888" cy="160" r="10" fill="url(#g2)"/>
    <text x="908" y="166" font-size="16" font-weight="600" fill="#c9d1d9">Agent B</text>
    <text x="878" y="192" font-size="13" fill="#8b949e">worktree: feat/api</text>
    <rect x="878" y="204" width="120" height="6" rx="3" fill="#21262d"/>
    <rect x="878" y="204" width="72" height="6" rx="3" fill="#3fb950"/>
  </g>
  <g>
    <rect x="140" y="440" width="200" height="100" rx="14" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="168" cy="470" r="10" fill="url(#g3)"/>
    <text x="188" y="476" font-size="16" font-weight="600" fill="#c9d1d9">Agent C</text>
    <text x="158" y="502" font-size="13" fill="#8b949e">worktree: fix/cache</text>
    <rect x="158" y="514" width="120" height="6" rx="3" fill="#21262d"/>
    <rect x="158" y="514" width="54" height="6" rx="3" fill="#d29922"/>
  </g>
  <g>
    <rect x="860" y="440" width="200" height="100" rx="14" fill="#161b22" stroke="#f778ba" stroke-width="1.5"/>
    <circle cx="888" cy="470" r="10" fill="url(#g4)"/>
    <text x="908" y="476" font-size="16" font-weight="600" fill="#c9d1d9">Agent D</text>
    <text x="878" y="502" font-size="13" fill="#8b949e">worktree: refactor/ui</text>
    <rect x="878" y="514" width="120" height="6" rx="3" fill="#21262d"/>
    <rect x="878" y="514" width="108" height="6" rx="3" fill="#f778ba"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="70" text-anchor="middle" font-size="40" font-weight="800" fill="#c9d1d9">多个 AI Agent 并行工作</text>
  <text x="600" y="106" text-anchor="middle" font-size="17" fill="#8b949e">Orca · 让每个 Agent 在独立 Worktree 中互不干扰地编码</text>

  <!-- 底部标签 -->
  <g font-size="13" fill="#8b949e" text-anchor="middle">
    <rect x="380" y="580" width="130" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="445" y="599">⚡ 并行执行</text>
    <rect x="530" y="580" width="140" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="600" y="599">🔀 Worktree 隔离</text>
    <rect x="690" y="580" width="130" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="755" y="599">🤖 Agent 调度</text>
  </g>
</svg>
