<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrW" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="560" fill="#0d1117"/>
  <text x="550" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#c9d1d9">使用体验：四步完成并行开发</text>
  <text x="550" y="82" text-anchor="middle" font-size="15" fill="#8b949e">从创建 Worktree 到合并最佳方案的完整工作流</text>

  <!-- 步骤连线 -->
  <line x1="255" y1="240" x2="305" y2="240" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrW)"/>
  <line x1="505" y1="240" x2="555" y2="240" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrW)"/>
  <line x1="755" y1="240" x2="805" y2="240" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrW)"/>

  <!-- 步骤 1 -->
  <g>
    <circle cx="160" cy="150" r="20" fill="url(#stepGrad)"/>
    <text x="160" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">1</text>
    <rect x="60" y="180" width="195" height="130" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="157" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#58a6ff">创建 Worktree</text>
    <text x="157" y="246" text-anchor="middle" font-size="12.5" fill="#8b949e">一键为每个任务创建</text>
    <text x="157" y="266" text-anchor="middle" font-size="12.5" fill="#8b949e">独立的 Git 工作区</text>
    <rect x="85" y="280" width="145" height="20" rx="6" fill="#21262d"/>
    <text x="157" y="294" text-anchor="middle" font-size="11" fill="#3fb950" font-family="Menlo, monospace">git worktree add …</text>
  </g>

  <!-- 步骤 2 -->
  <g>
    <circle cx="410" cy="150" r="20" fill="url(#stepGrad)"/>
    <text x="410" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">2</text>
    <rect x="310" y="180" width="195" height="130" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <text x="407" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#d2a8ff">并行运行 Agent</text>
    <circle cx="345" cy="252" r="6" fill="#58a6ff"/>
    <circle cx="407" cy="252" r="6" fill="#3fb950"/>
    <circle cx="469" cy="252" r="6" fill="#d29922"/>
    <text x="407" y="282" text-anchor="middle" font-size="12.5" fill="#8b949e">多个 Agent 同时编码</text>
    <text x="407" y="300" text-anchor="middle" font-size="12.5" fill="#8b949e">终端实时查看进度</text>
  </g>

  <!-- 步骤 3 -->
  <g>
    <circle cx="660" cy="150" r="20" fill="url(#stepGrad)"/>
    <text x="660" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">3</text>
    <rect x="560" y="180" width="195" height="130" rx="14" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="657" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#d29922">对比结果</text>
    <text x="657" y="246" text-anchor="middle" font-size="12.5" fill="#8b949e">并排查看各方案 diff</text>
    <rect x="582" y="258" width="70" height="40" rx="6" fill="#21262d"/>
    <text x="617" y="275" text-anchor="middle" font-size="10" fill="#3fb950">+128</text>
    <text x="617" y="290" text-anchor="middle" font-size="10" fill="#f85149">-42</text>
    <rect x="662" y="258" width="70" height="40" rx="6" fill="#21262d"/>
    <text x="697" y="275" text-anchor="middle" font-size="10" fill="#3fb950">+96</text>
    <text x="697" y="290" text-anchor="middle" font-size="10" fill="#f85149">-18</text>
  </g>

  <!-- 步骤 4 -->
  <g>
    <circle cx="910" cy="150" r="20" fill="url(#stepGrad)"/>
    <text x="910" y="157" text-anchor="middle" font-size="18" font-weight="800" fill="#0d1117">4</text>
    <rect x="810" y="180" width="195" height="130" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="907" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#3fb950">合并最佳方案</text>
    <text x="907" y="246" text-anchor="middle" font-size="12.5" fill="#8b949e">选中优胜分支</text>
    <text x="907" y="266" text-anchor="middle" font-size="12.5" fill="#8b949e">一键合回主干</text>
    <rect x="840" y="280" width="135" height="22" rx="11" fill="#238636"/>
    <text x="907" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">✓ Merge to main</text>
  </g>

  <!-- 底部补充：全程可移动操作 -->
  <rect x="250" y="380" width="600" height="110" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="412" text-anchor="middle" font-size="15" font-weight="600" fill="#c9d1d9">📱 全程 Mobile 伴侣在线</text>
  <g font-size="13" fill="#8b949e" text-anchor="middle">
    <text x="360" y="448">通勤路上审批 PR</text>
    <text x="550" y="448">·</text>
    <text x="550" y="448" fill="#8b949e"></text>
    <text x="560" y="448" text-anchor="middle"></text>
    <text x="585" y="448">实时推送 Agent 状态</text>
    <text x="770" y="448">随时打断 / 追加指令</text>
  </g>
  <text x="550" y="472" text-anchor="middle" font-size="12.5" fill="#6e7681">离开工位，开发也不停</text>
</svg>
