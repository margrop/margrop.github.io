<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#f85149"/>
    </marker>
    <marker id="arrGr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="#0d1117"/>
  <text x="550" y="50" text-anchor="middle" font-size="30" font-weight="800" fill="#c9d1d9">问题背景：串行等待 vs 并行探索</text>

  <!-- 左侧：传统方式 -->
  <rect x="50" y="90" width="470" height="470" rx="16" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="285" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#f85149">❌ 传统开发方式</text>
  <text x="285" y="158" text-anchor="middle" font-size="13" fill="#8b949e">一个分支、一个 Agent、一次只能试一种方案</text>

  <!-- 串行时间线 -->
  <line x1="285" y1="200" x2="285" y2="480" stroke="#30363d" stroke-width="3"/>
  <g>
    <circle cx="285" cy="220" r="8" fill="#f85149"/>
    <rect x="310" y="200" width="180" height="40" rx="8" fill="#21262d"/>
    <text x="326" y="225" font-size="13" fill="#c9d1d9">方案 A 编码 … 2h</text>

    <circle cx="285" cy="290" r="8" fill="#d29922"/>
    <rect x="310" y="270" width="180" height="40" rx="8" fill="#21262d"/>
    <text x="326" y="295" font-size="13" fill="#c9d1d9">测试失败，回滚 😞</text>

    <circle cx="285" cy="360" r="8" fill="#f85149"/>
    <rect x="310" y="340" width="180" height="40" rx="8" fill="#21262d"/>
    <text x="326" y="365" font-size="13" fill="#c9d1d9">方案 B 重来 … 2h</text>

    <circle cx="285" cy="430" r="8" fill="#8b949e"/>
    <rect x="310" y="410" width="180" height="40" rx="8" fill="#21262d"/>
    <text x="326" y="435" font-size="13" fill="#8b949e">切换分支冲突不断</text>
  </g>
  <text x="285" y="530" text-anchor="middle" font-size="14" fill="#f85149">总耗时 ≈ 6h+ · 只能验证 2 个方案</text>

  <!-- VS -->
  <circle cx="550" cy="325" r="30" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="550" y="334" text-anchor="middle" font-size="18" font-weight="800" fill="#8b949e">VS</text>

  <!-- 右侧：Orca 方式 -->
  <rect x="580" y="90" width="470" height="470" rx="16" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="815" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#3fb950">✅ Orca 多 Agent 并行</text>
  <text x="815" y="158" text-anchor="middle" font-size="13" fill="#8b949e">多个 Worktree 同时起跑，选最好的合并</text>

  <!-- 并行泳道 -->
  <g>
    <rect x="620" y="190" width="390" height="56" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
    <circle cx="650" cy="218" r="9" fill="#58a6ff"/>
    <text x="670" y="214" font-size="13" font-weight="600" fill="#c9d1d9">Agent A · 方案 A</text>
    <text x="670" y="234" font-size="12" fill="#8b949e">worktree-1 编码中 ⚡</text>

    <rect x="620" y="262" width="390" height="56" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
    <circle cx="650" cy="290" r="9" fill="#3fb950"/>
    <text x="670" y="286" font-size="13" font-weight="600" fill="#c9d1d9">Agent B · 方案 B</text>
    <text x="670" y="306" font-size="12" fill="#8b949e">worktree-2 编码中 ⚡</text>

    <rect x="620" y="334" width="390" height="56" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1"/>
    <circle cx="650" cy="362" r="9" fill="#d29922"/>
    <text x="670" y="358" font-size="13" font-weight="600" fill="#c9d1d9">Agent C · 方案 C</text>
    <text x="670" y="378" font-size="12" fill="#8b949e">worktree-3 编码中 ⚡</text>
  </g>

  <line x1="815" y1="406" x2="815" y2="440" stroke="#3fb950" stroke-width="2" marker-end="url(#arrGr)"/>
  <rect x="640" y="444" width="350" height="46" rx="10" fill="#1f6feb22" stroke="#3fb950" stroke-width="1"/>
  <text x="815" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#3fb950">对比 diff → 合并最佳方案 🎉</text>

  <text x="815" y="530" text-anchor="middle" font-size="14" fill="#3fb950">总耗时 ≈ 2h · 同时验证 3 个方案</text>

  <!-- 底部结论 -->
  <rect x="230" y="580" width="640" height="42" rx="21" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="607" text-anchor="middle" font-size="15" fill="#c9d1d9">同一个问题，让多个 Agent 给出不同解法 —— 你只做选择题</text>
</svg>
