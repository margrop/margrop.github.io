<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#0d1117"/>

  <text x="500" y="52" text-anchor="middle" font-size="30" font-weight="800" fill="#c9d1d9">Orca 核心功能架构</text>
  <text x="500" y="82" text-anchor="middle" font-size="15" fill="#8b949e">一个调度中心，连接编码所需的一切</text>

  <!-- 中心：Orca 核心 -->
  <rect x="370" y="300" width="260" height="140" rx="16" fill="#161b22" stroke="url(#coreGrad)" stroke-width="2.5"/>
  <text x="500" y="352" text-anchor="middle" font-size="26" font-weight="700" fill="url(#coreGrad)">Orca Core</text>
  <text x="500" y="382" text-anchor="middle" font-size="14" fill="#8b949e">任务编排 · 状态同步</text>
  <text x="500" y="404" text-anchor="middle" font-size="14" fill="#8b949e">结果对比 · 一键合并</text>

  <!-- 上：Agent 调度 -->
  <rect x="360" y="130" width="280" height="90" rx="14" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="500" y="168" text-anchor="middle" font-size="18" font-weight="600" fill="#d2a8ff">🤖 Agent 调度</text>
  <text x="500" y="196" text-anchor="middle" font-size="13" fill="#8b949e">Claude / Codex / Gemini 多 Agent 并行派发</text>
  <line x1="500" y1="220" x2="500" y2="292" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 左：Worktree 隔离 -->
  <rect x="60" y="300" width="240" height="140" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="180" y="340" text-anchor="middle" font-size="18" font-weight="600" fill="#3fb950">🌿 Worktree 隔离</text>
  <text x="180" y="370" text-anchor="middle" font-size="13" fill="#8b949e">每个 Agent 独立</text>
  <text x="180" y="392" text-anchor="middle" font-size="13" fill="#8b949e">Git Worktree 工作区</text>
  <text x="180" y="414" text-anchor="middle" font-size="13" fill="#8b949e">互不冲突、随时丢弃</text>
  <line x1="300" y1="370" x2="362" y2="370" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- 右：终端 -->
  <rect x="700" y="290" width="240" height="70" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="820" y="320" text-anchor="middle" font-size="18" font-weight="600" fill="#58a6ff">💻 集成终端</text>
  <text x="820" y="344" text-anchor="middle" font-size="13" fill="#8b949e">实时查看 Agent 输出与日志</text>
  <line x1="630" y1="330" x2="692" y2="325" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右下：浏览器 -->
  <rect x="700" y="390" width="240" height="70" rx="14" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="820" y="420" text-anchor="middle" font-size="18" font-weight="600" fill="#d29922">🌐 内置浏览器</text>
  <text x="820" y="444" text-anchor="middle" font-size="13" fill="#8b949e">即时预览前端改动效果</text>
  <line x1="630" y1="410" x2="692" y2="425" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 下：Mobile 伴侣 -->
  <rect x="360" y="530" width="280" height="90" rx="14" fill="#161b22" stroke="#f778ba" stroke-width="1.5"/>
  <text x="500" y="568" text-anchor="middle" font-size="18" font-weight="600" fill="#f778ba">📱 Mobile 伴侣</text>
  <text x="500" y="596" text-anchor="middle" font-size="13" fill="#8b949e">手机上审批、监控、随时指挥 Agent</text>
  <line x1="500" y1="440" x2="500" y2="522" stroke="#f778ba" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部数据流说明 -->
  <rect x="180" y="670" width="640" height="54" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="500" y="703" text-anchor="middle" font-size="14" fill="#8b949e">调度 Agent → Worktree 编码 → 终端/浏览器验证 → 手机审批 → 合并最佳方案</text>
</svg>
