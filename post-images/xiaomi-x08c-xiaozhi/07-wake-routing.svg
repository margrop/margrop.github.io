<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#101522"/><text x="60" y="70" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">三个关键词，两个去向</text><g font-family="sans-serif" font-size="25"><rect x="60" y="145" width="320" height="100" rx="18" fill="#245b70"/><text x="105" y="207" fill="#fff">小智小智 / 小屁小屁</text><rect x="60" y="365" width="320" height="100" rx="18" fill="#69435f"/><text x="135" y="427" fill="#fff">小爱同学</text><rect x="760" y="145" width="330" height="100" rx="18" fill="#245b3a"/><text x="840" y="207" fill="#fff">小智 auto/VAD</text><rect x="760" y="365" width="330" height="100" rx="18" fill="#65482b"/><text x="830" y="427" fill="#fff">原厂小爱</text><path d="M380 195h360M380 415h360" stroke="#ffd166" stroke-width="8" marker-end="url(#a)"/><text x="60" y="550" fill="#ced8e7">像分诊台：先听关键词，再把人送到正确的医生那里。</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#ffd166"/></marker></defs></g></svg>
