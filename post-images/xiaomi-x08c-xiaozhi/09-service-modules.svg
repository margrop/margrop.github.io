<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#101827"/><text x="60" y="70" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">把复杂系统拆成可替换的积木</text><g font-family="sans-serif"><rect x="70" y="145" width="230" height="130" rx="18" fill="#244e69"/><text x="112" y="195" fill="#8be9ff" font-size="27">ASR</text><text x="112" y="235" fill="#fff" font-size="21">听懂中文</text><rect x="360" y="145" width="230" height="130" rx="18" fill="#2d604d"/><text x="402" y="195" fill="#a9ffc5" font-size="27">LLM</text><text x="402" y="235" fill="#fff" font-size="21">组织答案</text><rect x="650" y="145" width="230" height="130" rx="18" fill="#694633"/><text x="692" y="195" fill="#ffd59b" font-size="27">TTS</text><text x="692" y="235" fill="#fff" font-size="21">说出答案</text><rect x="940" y="145" width="190" height="130" rx="18" fill="#5a385e"/><text x="985" y="195" fill="#ffb9ee" font-size="27">HA</text><text x="970" y="235" fill="#fff" font-size="21">控制设备</text><path d="M300 210h60M590 210h60M880 210h60" stroke="#ffd166" stroke-width="8" marker-end="url(#a)"/><rect x="70" y="375" width="1060" height="100" rx="20" fill="#192536"/><text x="110" y="435" fill="#dce9f5" font-size="25">可以换模型，也可以换服务；先定义接口，再替换积木。</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#ffd166"/></marker></defs></g></svg>
