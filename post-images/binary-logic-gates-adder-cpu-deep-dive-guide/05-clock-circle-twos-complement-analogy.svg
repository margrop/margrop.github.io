<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg5)"/>

  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">为什么减法就是加法？12 小时挂钟与补码 (Two's Complement) 环形奥秘</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">The Clock Analogy of Modular Arithmetic: How Inversion + 1 Turns Hardware Subtraction into Addition</text>

  <!-- Left: 12-Hour Clock Analogy -->
  <g transform="translate(80, 140)">
    <rect width="680" height="700" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect width="680" height="50" rx="16" fill="#0284c7"/>
    <text x="340" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">生活中的大白话比喻：12 小时制挂钟</text>

    <!-- Clock illustration -->
    <circle cx="340" cy="300" r="150" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="340" cy="300" r="8" fill="#facc15"/>

    <!-- Numbers on clock -->
    <text x="340" y="180" fill="#f8fafc" font-size="22" font-weight="bold" font-family="monospace" text-anchor="middle">12 (0)</text>
    <text x="470" y="308" fill="#f8fafc" font-size="22" font-weight="bold" font-family="monospace" text-anchor="middle">3</text>
    <text x="340" y="435" fill="#f8fafc" font-size="22" font-weight="bold" font-family="monospace" text-anchor="middle">6</text>
    <text x="210" y="308" fill="#f8fafc" font-size="22" font-weight="bold" font-family="monospace" text-anchor="middle">9</text>

    <!-- Hands: current is 6 -->
    <line x1="340" y1="300" x2="340" y2="210" stroke="#facc15" stroke-width="6"/> <!-- pointing to 12 -->
    <line x1="340" y1="300" x2="430" y2="300" stroke="#38bdf8" stroke-width="4"/> <!-- pointing to 3 -->

    <!-- Analogy explanation -->
    <g font-family="-apple-system, sans-serif" font-size="15">
      <text x="40" y="490" fill="#facc15" font-weight="bold">● 场景提问：如果现在是 6 点，你想把时间倒退 4 个小时（6 - 4）？</text>
      <text x="60" y="520" fill="#cbd5e1">方案一 (减法倒拨)：逆时针拨动 4 格 → 指向 2 点。</text>
      <text x="60" y="550" fill="#4ade80" font-weight="bold">方案二 (顺时针快进)：顺时针向前拨动 8 格 (6 + 8 = 14 ≡ 2 点)！</text>
      <text x="40" y="600" fill="#38bdf8" font-weight="bold">★ 核心数学真理 (模 12 运算):</text>
      <text x="60" y="630" fill="#f8fafc" font-family="monospace" font-size="16">6 - 4 ≡ 6 + (12 - 4) ≡ 6 + 8 ≡ 2 (mod 12)</text>
      <text x="60" y="660" fill="#94a3b8">减去一个数，等价于加上它的【补数 (Complement)】！</text>
    </g>
  </g>

  <!-- Right: 8-Bit Two's Complement Ring -->
  <g transform="translate(840, 140)">
    <rect width="680" height="700" rx="16" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="680" height="50" rx="16" fill="#047857"/>
    <text x="340" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">计算机中的 8 位补码圆环 (模 256)</text>

    <!-- Ring circle -->
    <circle cx="340" cy="300" r="150" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    
    <!-- Top 0 -->
    <text x="340" y="175" fill="#34d399" font-size="16" font-weight="bold" font-family="monospace" text-anchor="middle">00000000 (0)</text>
    <!-- Right +127 -->
    <text x="500" y="305" fill="#38bdf8" font-size="14" font-weight="bold" font-family="monospace" text-anchor="start">01111111 (+127)</text>
    <!-- Bottom -128 -->
    <text x="340" y="445" fill="#ef4444" font-size="15" font-weight="bold" font-family="monospace" text-anchor="middle">10000000 (-128)</text>
    <!-- Left -1 -->
    <text x="180" y="305" fill="#f59e0b" font-size="14" font-weight="bold" font-family="monospace" text-anchor="end">11111111 (-1)</text>

    <!-- Upper semi circle positive, lower negative -->
    <path d="M 340,150 A 150 150 0 0 1 340,450" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.4"/>
    <path d="M 340,450 A 150 150 0 0 1 340,150" fill="none" stroke="#ef4444" stroke-width="8" opacity="0.4"/>
    <text x="440" y="220" fill="#38bdf8" font-size="14" font-family="-apple-system, sans-serif">正数区 (0~127)</text>
    <text x="240" y="380" fill="#ef4444" font-size="14" font-family="-apple-system, sans-serif">负数区 (-128~-1)</text>

    <g font-family="-apple-system, sans-serif" font-size="15">
      <text x="40" y="490" fill="#34d399" font-weight="bold">● 为什么硬件只要“取反加一”？</text>
      <text x="60" y="520" fill="#cbd5e1">在 8 位世界里，模为 256 = 255 + 1 = 11111111₂ + 1。</text>
      <text x="60" y="550" fill="#cbd5e1">对任意数 B：-B = 256 - B = (255 - B) + 1 = (~B) + 1 ！</text>
      <text x="40" y="600" fill="#10b981" font-weight="bold">★ 工程师的极致省钱优雅解法：</text>
      <text x="60" y="630" fill="#f8fafc" font-family="monospace" font-size="16">A - B = A + (~B) + 1</text>
      <text x="60" y="660" fill="#cbd5e1">~B 靠一组异或门瞬间翻转，+1 顺手交给加法器的初始进位输入 C0！</text>
    </g>
  </g>
</svg>