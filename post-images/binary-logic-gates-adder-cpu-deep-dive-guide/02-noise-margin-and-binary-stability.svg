<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  
  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">为什么计算机非要用二进制？抗噪容限与信号再生物理原理</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">Why Binary? Noise Margins, Voltage Regeneration, and Why 10-Level Decimal Fails in Physical Silicon</text>

  <!-- Left Side: Decimal Disaster (十进制的噪音悲剧) -->
  <g transform="translate(80, 140)">
    <rect width="680" height="700" rx="16" fill="#111827" stroke="#ef4444" stroke-width="2"/>
    <rect width="680" height="50" rx="16" fill="#991b1b"/>
    <text x="340" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">❌ 假设使用十进制 (0V ~ 5V 划分 10 级阶梯)</text>
    
    <text x="40" y="90" fill="#fca5a5" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">物理灾难：每一级电压间隔仅有 0.5V！</text>
    <text x="40" y="120" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">在芯片内部，温度波动、电磁辐射、电阻分压会产生 ±0.3V 甚至更高的热噪声。</text>

    <!-- Voltage Scale Diagram -->
    <rect x="50" y="150" width="580" height="420" rx="12" fill="#0b1220" stroke="#334155"/>
    
    <!-- 10 levels -->
    <g font-family="monospace" font-size="13">
      <line x1="120" y1="180" x2="560" y2="180" stroke="#f87171" stroke-dasharray="4"/>
      <text x="70" y="185" fill="#f87171">4.5V~5V</text><text x="140" y="185" fill="#f87171">数字 9</text>
      
      <line x1="120" y1="215" x2="560" y2="215" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="220" fill="#94a3b8">4.0V~4.5V</text><text x="140" y="220" fill="#cbd5e1">数字 8</text>

      <line x1="120" y1="250" x2="560" y2="250" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="255" fill="#94a3b8">3.5V~4.0V</text><text x="140" y="255" fill="#cbd5e1">数字 7</text>

      <line x1="120" y1="285" x2="560" y2="285" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="290" fill="#94a3b8">3.0V~3.5V</text><text x="140" y="290" fill="#cbd5e1">数字 6</text>

      <line x1="120" y1="320" x2="560" y2="320" stroke="#f59e0b" stroke-dasharray="2"/>
      <text x="70" y="325" fill="#f59e0b">2.5V~3.0V</text><text x="140" y="325" fill="#f59e0b">数字 5 (原始发送信号 2.6V)</text>

      <line x1="120" y1="355" x2="560" y2="355" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="360" fill="#94a3b8">2.0V~2.5V</text><text x="140" y="360" fill="#cbd5e1">数字 4</text>

      <line x1="120" y1="390" x2="560" y2="390" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="395" fill="#94a3b8">1.5V~2.0V</text><text x="140" y="395" fill="#cbd5e1">数字 3</text>

      <line x1="120" y1="425" x2="560" y2="425" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="430" fill="#94a3b8">1.0V~1.5V</text><text x="140" y="430" fill="#cbd5e1">数字 2</text>

      <line x1="120" y1="460" x2="560" y2="460" stroke="#64748b" stroke-dasharray="2"/>
      <text x="70" y="465" fill="#94a3b8">0.5V~1.0V</text><text x="140" y="465" fill="#cbd5e1">数字 1</text>

      <line x1="120" y1="495" x2="560" y2="495" stroke="#38bdf8" stroke-dasharray="4"/>
      <text x="70" y="500" fill="#38bdf8">0.0V~0.5V</text><text x="140" y="500" fill="#38bdf8">数字 0</text>
    </g>

    <!-- Noise wave jumping bands -->
    <path d="M 280,320 Q 320,270 360,320 T 440,290 T 500,245" fill="none" stroke="#ef4444" stroke-width="3"/>
    <text x="400" y="270" fill="#ef4444" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif">微小噪声干扰 +0.4V</text>
    <text x="410" y="240" fill="#ef4444" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif">数字 5 突变成数字 7！</text>

    <!-- Bottom summary -->
    <rect x="40" y="590" width="600" height="85" rx="8" fill="#1f2937"/>
    <text x="50" y="615" fill="#fca5a5" font-size="13" font-family="-apple-system, sans-serif">💥 结论：十进制芯片需要在千万个晶体管间精密分辨微弱电压，</text>
    <text x="50" y="638" fill="#fca5a5" font-size="13" font-family="-apple-system, sans-serif">任何轻微发热或电压衰减都会导致计算瞬间崩溃，抗干扰能力几乎为零！</text>
  </g>

  <!-- Right Side: Binary Invincible (二进制的铜墙铁壁) -->
  <g transform="translate(840, 140)">
    <rect width="680" height="700" rx="16" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="680" height="50" rx="16" fill="#047857"/>
    <text x="340" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">✔ 二进制现实 (0 与 1：坚不可摧的抗噪容限)</text>
    
    <text x="40" y="90" fill="#6ee7b7" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">工程奇迹：只看“通电”与“断电”，中间留出巨大禁区！</text>
    <text x="40" y="120" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">无论信号在途中如何衰减变形，只要经过逻辑门，输出就会被重新校准拉满！</text>

    <rect x="50" y="150" width="580" height="420" rx="12" fill="#0b1220" stroke="#334155"/>

    <!-- High Region -->
    <rect x="120" y="170" width="460" height="100" rx="6" fill="#065f46" opacity="0.6"/>
    <text x="250" y="225" fill="#34d399" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">逻辑高电平 (1) 区间: 2.7V ~ 5.0V</text>
    <text x="60" y="185" fill="#34d399" font-family="monospace">5.0V Vdd</text>
    <text x="60" y="270" fill="#34d399" font-family="monospace">2.7V Vih</text>

    <!-- Forbidden / Transition Region -->
    <rect x="120" y="275" width="460" height="110" rx="6" fill="#450a0a" opacity="0.5"/>
    <text x="240" y="335" fill="#f87171" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">⚡ 非法过渡禁区 (Forbidden Region: 0.8V ~ 2.7V)</text>
    <text x="240" y="360" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif">不允许稳态停留，通过施密特触发器极速跳跃翻转</text>

    <!-- Low Region -->
    <rect x="120" y="390" width="460" height="100" rx="6" fill="#1e3a8a" opacity="0.6"/>
    <text x="250" y="445" fill="#60a5fa" font-size="18" font-weight="bold" font-family="-apple-system, sans-serif">逻辑低电平 (0) 区间: 0.0V ~ 0.8V</text>
    <text x="60" y="395" fill="#60a5fa" font-family="monospace">0.8V Vil</text>
    <text x="60" y="490" fill="#60a5fa" font-family="monospace">0.0V GND</text>

    <!-- Regeneration wave -->
    <path d="M 150,230 Q 180,210 210,240 T 260,225" fill="none" stroke="#facc15" stroke-width="3"/>
    <text x="270" y="235" fill="#facc15" font-size="13" font-family="-apple-system, sans-serif">波动输入 (2.4V)</text>
    <text x="370" y="235" fill="#34d399" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif">→ 门电路整形输出: 5.0V 满血复活!</text>

    <!-- Bottom summary -->
    <rect x="40" y="590" width="600" height="85" rx="8" fill="#1f2937"/>
    <text x="50" y="615" fill="#6ee7b7" font-size="13" font-family="-apple-system, sans-serif">🛡️ 结论：二进制拥有高达近 2V 的抗噪容限（Noise Margin）！</text>
    <text x="50" y="638" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif">哪怕电线老化、温度高达 90°C，只要能区分“有电”和“没电”，计算永远 100% 准确！</text>
  </g>
</svg>