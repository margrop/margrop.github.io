<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg6)"/>

  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">现代 CPU 的算术心脏：从加法器到全功能 ALU 算术逻辑单元与数据通路</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">The Beating Heart of Computing: From 8-Bit Adder to Complete ALU, Multiplexers, and CPU Register File</text>

  <!-- Central ALU shape (V-shape / trapezoid) -->
  <g transform="translate(550, 220)">
    <polygon points="0,0 500,0 400,280 280,280 250,220 220,280 100,280" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <text x="250" y="110" fill="#38bdf8" font-size="28" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">ALU 算术逻辑单元</text>
    <text x="250" y="145" fill="#94a3b8" font-size="15" font-family="monospace" text-anchor="middle">(Arithmetic Logic Unit)</text>

    <!-- Sub components inside ALU -->
    <rect x="70" y="165" width="100" height="45" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="120" y="193" fill="#34d399" font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">8-Bit ADD/SUB</text>

    <rect x="190" y="165" width="120" height="45" rx="6" fill="#0f172a" stroke="#a855f7"/>
    <text x="250" y="193" fill="#c084fc" font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">AND / OR / XOR</text>

    <rect x="330" y="165" width="100" height="45" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="380" y="193" fill="#fbbf24" font-size="13" font-weight="bold" font-family="monospace" text-anchor="middle">SHIFTER 移位</text>
  </g>

  <!-- Left Inputs: Register A and Register B -->
  <g transform="translate(100, 200)">
    <rect width="320" height="130" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect width="320" height="35" rx="12" fill="#0284c7"/>
    <text x="160" y="24" fill="#ffffff" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">通用寄存器堆 (General Registers)</text>
    <text x="30" y="65" fill="#cbd5e1" font-size="14" font-family="monospace">RA (如 x86 AL / RAX): 8-Bit 数据</text>
    <text x="30" y="95" fill="#cbd5e1" font-size="14" font-family="monospace">RB (如 x86 BL / RBX): 8-Bit 数据</text>

    <!-- Data Bus to ALU -->
    <line x1="320" y1="55" x2="570" y2="220" stroke="#38bdf8" stroke-width="4"/>
    <line x1="320" y1="85" x2="720" y2="220" stroke="#38bdf8" stroke-width="4"/>
    <text x="440" y="130" fill="#38bdf8" font-size="14" font-weight="bold" font-family="monospace">总线 Bus A &amp; Bus B</text>
  </g>

  <!-- Top: Control Unit ALUOp -->
  <g transform="translate(640, 130)">
    <rect width="320" height="60" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="160" y="36" fill="#f43f5e" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">控制器译码指令 (ALU Control / Opcode)</text>
    <line x1="160" y1="60" x2="160" y2="90" stroke="#f43f5e" stroke-width="3"/>
    <text x="160" y="80" fill="#fca5a5" font-size="12" font-family="monospace" text-anchor="middle">ADD / SUB / AND / OR / SHL</text>
  </g>

  <!-- Bottom: Output Result Bus -->
  <g transform="translate(650, 500)">
    <line x1="150" y1="0" x2="150" y2="120" stroke="#4ade80" stroke-width="5"/>
    <polygon points="140,120 160,120 150,140" fill="#4ade80"/>
    <text x="170" y="65" fill="#4ade80" font-size="16" font-weight="bold" font-family="monospace">算术结果总线 Output Bus (8-Bit)</text>

    <rect x="-30" y="140" width="360" height="80" rx="10" fill="#111827" stroke="#4ade80" stroke-width="2"/>
    <text x="150" y="175" fill="#4ade80" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">写回目标寄存器 (Write-Back Stage)</text>
    <text x="150" y="202" fill="#cbd5e1" font-size="13" font-family="-apple-system, sans-serif" text-anchor="middle">将结果存入 RAX / 内存缓存</text>
  </g>

  <!-- Right: Status Flags Register -->
  <g transform="translate(1180, 220)">
    <rect width="340" height="280" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect width="340" height="40" rx="12" fill="#b45309"/>
    <text x="170" y="26" fill="#ffffff" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">标志寄存器 FLAGS (EFLAGS / RFLAGS)</text>

    <!-- connecting line from ALU -->
    <line x1="-130" y1="120" x2="0" y2="120" stroke="#f59e0b" stroke-width="3"/>
    <text x="-65" y="110" fill="#f59e0b" font-size="13" font-weight="bold" font-family="monospace">条件状态</text>

    <g font-family="monospace" font-size="14">
      <rect x="25" y="60" width="290" height="35" rx="6" fill="#1e293b"/>
      <text x="40" y="83" fill="#38bdf8">CF (Carry): 无符号溢出</text>

      <rect x="25" y="105" width="290" height="35" rx="6" fill="#1e293b"/>
      <text x="40" y="128" fill="#ef4444">OF (Overflow): 有符号溢出</text>

      <rect x="25" y="150" width="290" height="35" rx="6" fill="#1e293b"/>
      <text x="40" y="173" fill="#10b981">ZF (Zero): 结果为零判断</text>

      <rect x="25" y="195" width="290" height="35" rx="6" fill="#1e293b"/>
      <text x="40" y="218" fill="#a855f7">SF (Sign): 正负号高位映射</text>
    </g>

    <text x="170" y="255" fill="#fde68a" font-size="12" font-family="-apple-system, sans-serif" text-anchor="middle">决定分支跳转: JZ / JNZ / JL / JG / JC</text>
  </g>
</svg>