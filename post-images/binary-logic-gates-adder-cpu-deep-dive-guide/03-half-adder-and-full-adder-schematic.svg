<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>

  <text x="800" y="65" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">从半加器到全加器：加法核心电路微观门级原理图</text>
  <text x="800" y="100" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">Building Blocks of Arithmetic: Half Adder (XOR + AND) and Full Adder (2 Half Adders + OR Gate)</text>

  <!-- Left: Half Adder -->
  <g transform="translate(60, 140)">
    <rect width="660" height="700" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect width="660" height="50" rx="16" fill="#0284c7"/>
    <text x="330" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">半加器 (Half Adder: 只能算两位，不接受进位)</text>

    <!-- Schematic Area -->
    <rect x="40" y="80" width="580" height="340" rx="12" fill="#0b1220" stroke="#334155"/>

    <!-- Inputs A and B -->
    <text x="60" y="160" fill="#38bdf8" font-size="18" font-weight="bold" font-family="monospace">输入 A</text>
    <text x="60" y="260" fill="#38bdf8" font-size="18" font-weight="bold" font-family="monospace">输入 B</text>

    <!-- XOR Gate for Sum -->
    <line x1="140" y1="155" x2="280" y2="155" stroke="#38bdf8" stroke-width="3"/>
    <line x1="140" y1="255" x2="200" y2="255" stroke="#38bdf8" stroke-width="3"/>
    <line x1="200" y1="255" x2="200" y2="185" stroke="#38bdf8" stroke-width="3"/>
    <line x1="200" y1="185" x2="280" y2="185" stroke="#38bdf8" stroke-width="3"/>

    <!-- XOR symbol -->
    <rect x="280" y="130" width="100" height="80" rx="10" fill="url(#gateGrad)" stroke="#a855f7" stroke-width="2"/>
    <text x="330" y="178" fill="#c084fc" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">XOR 门</text>

    <line x1="380" y1="170" x2="520" y2="170" stroke="#4ade80" stroke-width="4"/>
    <text x="530" y="176" fill="#4ade80" font-size="18" font-weight="bold" font-family="monospace">本位和 Sum = A ⊕ B</text>

    <!-- AND Gate for Carry -->
    <line x1="180" y1="155" x2="180" y2="300" stroke="#38bdf8" stroke-width="3"/>
    <line x1="180" y1="300" x2="280" y2="300" stroke="#38bdf8" stroke-width="3"/>
    <line x1="200" y1="255" x2="200" y2="330" stroke="#38bdf8" stroke-width="3"/>
    <line x1="200" y1="330" x2="280" y2="330" stroke="#38bdf8" stroke-width="3"/>

    <!-- AND symbol -->
    <rect x="280" y="275" width="100" height="80" rx="10" fill="url(#gateGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="330" y="322" fill="#38bdf8" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">AND 门</text>

    <line x1="380" y1="315" x2="520" y2="315" stroke="#f59e0b" stroke-width="4"/>
    <text x="530" y="321" fill="#f59e0b" font-size="18" font-weight="bold" font-family="monospace">进位 Carry = A · B</text>

    <!-- Truth Table -->
    <rect x="40" y="445" width="580" height="225" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="330" y="480" fill="#f8fafc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">半加器完整真值表</text>
    <g font-family="monospace" font-size="15">
      <text x="100" y="520" fill="#94a3b8">A    B  |  Sum (和)   Carry (进位)  |  日常数学十进制等价</text>
      <text x="100" y="555" fill="#cbd5e1">0 +  0  |    0           0          |  0 + 0 = 0</text>
      <text x="100" y="585" fill="#cbd5e1">0 +  1  |    1           0          |  0 + 1 = 1</text>
      <text x="100" y="615" fill="#cbd5e1">1 +  0  |    1           0          |  1 + 0 = 1</text>
      <text x="100" y="645" fill="#4ade80" font-weight="bold">1 +  1  |    0           1          |  1 + 1 = 2 (二进制 10₂!)</text>
    </g>
  </g>

  <!-- Right: Full Adder -->
  <g transform="translate(760, 140)">
    <rect width="780" height="700" rx="16" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="780" height="50" rx="16" fill="#059669"/>
    <text x="390" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">全加器 (Full Adder: 接受上一级的进位 Cin，组成算术长河)</text>

    <rect x="40" y="80" width="700" height="340" rx="12" fill="#0b1220" stroke="#334155"/>

    <!-- Inputs -->
    <text x="60" y="140" fill="#38bdf8" font-size="16" font-weight="bold" font-family="monospace">A</text>
    <text x="60" y="190" fill="#38bdf8" font-size="16" font-weight="bold" font-family="monospace">B</text>
    <text x="60" y="270" fill="#facc15" font-size="16" font-weight="bold" font-family="monospace">Cin (低位进位)</text>

    <!-- Block 1: Half Adder 1 -->
    <rect x="120" y="110" width="160" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="150" fill="#38bdf8" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">半加器 HA 1</text>
    <text x="200" y="180" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">S1 = A ⊕ B</text>
    <text x="200" y="205" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">C1 = A · B</text>

    <!-- Block 2: Half Adder 2 -->
    <rect x="360" y="140" width="160" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="440" y="180" fill="#34d399" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">半加器 HA 2</text>
    <text x="440" y="210" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">Sum = S1 ⊕ Cin</text>
    <text x="440" y="235" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">C2 = S1 · Cin</text>

    <!-- Lines connecting HA1 to HA2 -->
    <line x1="280" y1="160" x2="360" y2="160" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="180" y1="270" x2="360" y2="250" stroke="#facc15" stroke-width="3"/>

    <!-- Sum Output -->
    <line x1="520" y1="180" x2="650" y2="180" stroke="#4ade80" stroke-width="4"/>
    <text x="655" y="186" fill="#4ade80" font-size="16" font-weight="bold" font-family="monospace">本位和 Sum</text>

    <!-- OR Gate for Cout -->
    <rect x="580" y="270" width="100" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="630" y="318" fill="#f59e0b" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">OR 门</text>
    <line x1="280" y1="210" x2="580" y2="300" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="520" y1="240" x2="580" y2="320" stroke="#cbd5e1" stroke-width="2"/>

    <line x1="680" y1="310" x2="730" y2="310" stroke="#f59e0b" stroke-width="4"/>
    <text x="630" y="380" fill="#f59e0b" font-size="15" font-weight="bold" font-family="monospace" text-anchor="middle">向高位进位 Cout = C1 + C2</text>

    <!-- Mathematical Formula & Insight -->
    <rect x="40" y="445" width="700" height="225" rx="12" fill="#0b1220" stroke="#334155"/>
    <text x="390" y="480" fill="#f8fafc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">全加器工程核心公式与思考</text>
    <g font-family="-apple-system, sans-serif" font-size="14">
      <text x="60" y="520" fill="#38bdf8" font-weight="bold">● 本位和 Sum = A ⊕ B ⊕ Cin</text>
      <text x="80" y="545" fill="#cbd5e1">（三个输入里有奇数个 1 时结果为 1，偶数个 1 时结果为 0。奇偶校验本质！）</text>
      
      <text x="60" y="580" fill="#f59e0b" font-weight="bold">● 高位进位 Cout = (A · B) + (Cin · (A ⊕ B))</text>
      <text x="80" y="605" fill="#cbd5e1">（只要 A 和 B 都是 1，或者 A、B 有一个为 1 且原本有进位，就会向更高位进位！）</text>
      
      <text x="60" y="640" fill="#4ade80" font-weight="bold">★ 工业结论：全加器是现代一切算术芯片（CPU/GPU/NPU）的最小细胞原子！</text>
    </g>
  </g>
</svg>