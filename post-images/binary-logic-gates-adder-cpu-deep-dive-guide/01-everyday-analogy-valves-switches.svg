<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- Title Header -->
  <text x="800" y="70" fill="#38bdf8" font-size="32" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">日常生活中的大白话逻辑门：小学生也能秒懂的四种水阀与开关模型</text>
  <text x="800" y="105" fill="#94a3b8" font-size="18" font-family="-apple-system, sans-serif" text-anchor="middle">Everyday Analogies for Logic Gates: Series &amp; Parallel Valves, Seesaw Inverters, and Dual-Way Corridor Switches</text>

  <!-- Card 1: AND Gate (串联水阀 / 串联开关) -->
  <g transform="translate(60, 140)">
    <rect width="340" height="690" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect width="340" height="50" rx="16" fill="#0284c7"/>
    <text x="170" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">与门 AND (串联双开关)</text>
    
    <!-- Water pipe illustration -->
    <text x="170" y="85" fill="#7dd3fc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">生活比喻：两个串联的水龙头</text>
    <text x="30" y="120" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">两个水龙头必须【全部拧开】，水才能流出！</text>
    
    <!-- Diagram -->
    <rect x="50" y="150" width="240" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
    <line x1="70" y1="240" x2="110" y2="240" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="110" cy="240" r="6" fill="#38bdf8"/>
    <line x1="110" y1="240" x2="145" y2="215" stroke="#f43f5e" stroke-width="4"/> <!-- switch 1 open -->
    <circle cx="150" cy="240" r="6" fill="#38bdf8"/>
    <text x="125" y="200" fill="#fbbf24" font-size="13" font-family="monospace">开关A</text>
    
    <line x1="150" y1="240" x2="190" y2="240" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="190" cy="240" r="6" fill="#38bdf8"/>
    <line x1="190" y1="240" x2="225" y2="215" stroke="#f43f5e" stroke-width="4"/> <!-- switch 2 open -->
    <circle cx="230" cy="240" r="6" fill="#38bdf8"/>
    <text x="205" y="200" fill="#fbbf24" font-size="13" font-family="monospace">开关B</text>
    <line x1="230" y1="240" x2="270" y2="240" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="270" cy="240" r="10" fill="#64748b"/>
    <text x="170" y="300" fill="#ef4444" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">灯泡熄灭 (0)</text>

    <!-- Truth Table -->
    <text x="170" y="365" fill="#f8fafc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">真值表 (Truth Table)</text>
    <rect x="30" y="390" width="280" height="170" rx="8" fill="#0b1220" stroke="#1e293b"/>
    <text x="60" y="420" fill="#94a3b8" font-size="14" font-family="monospace">开关A   开关B  |  灯泡状态</text>
    <text x="60" y="450" fill="#cbd5e1" font-size="14" font-family="monospace">  0       0    |    0 (灭)</text>
    <text x="60" y="480" fill="#cbd5e1" font-size="14" font-family="monospace">  0       1    |    0 (灭)</text>
    <text x="60" y="510" fill="#cbd5e1" font-size="14" font-family="monospace">  1       0    |    0 (灭)</text>
    <text x="60" y="540" fill="#4ade80" font-size="14" font-weight="bold" font-family="monospace">  1       1    |    1 (亮!)</text>

    <text x="170" y="595" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">布尔表达式: Y = A · B</text>
    <rect x="30" y="615" width="280" height="55" rx="8" fill="#1e293b"/>
    <text x="40" y="640" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">★ 记忆口诀：</text>
    <text x="40" y="660" fill="#38bdf8" font-size="13" font-weight="bold" font-family="-apple-system, sans-serif">全高才高，一低即低</text>
  </g>

  <!-- Card 2: OR Gate (并联水阀 / 并联开关) -->
  <g transform="translate(430, 140)">
    <rect width="340" height="690" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect width="340" height="50" rx="16" fill="#059669"/>
    <text x="170" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">或门 OR (并联双开关)</text>
    
    <text x="170" y="85" fill="#6ee7b7" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">生活比喻：两个并联的水龙头</text>
    <text x="30" y="120" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">只要【任意一个拧开】，水就能哗哗流出！</text>
    
    <rect x="50" y="150" width="240" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
    <line x1="70" y1="240" x2="95" y2="240" stroke="#10b981" stroke-width="4"/>
    <line x1="95" y1="200" x2="95" y2="280" stroke="#10b981" stroke-width="4"/>
    <!-- branch top -->
    <line x1="95" y1="200" x2="135" y2="200" stroke="#10b981" stroke-width="4"/>
    <circle cx="135" cy="200" r="5" fill="#10b981"/>
    <line x1="135" y1="200" x2="170" y2="185" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="175" cy="200" r="5" fill="#10b981"/>
    <line x1="175" y1="200" x2="215" y2="200" stroke="#10b981" stroke-width="4"/>
    <!-- branch bottom -->
    <line x1="95" y1="280" x2="135" y2="280" stroke="#10b981" stroke-width="4"/>
    <circle cx="135" cy="280" r="5" fill="#10b981"/>
    <line x1="135" y1="280" x2="175" y2="280" stroke="#4ade80" stroke-width="4"/> <!-- closed -->
    <circle cx="175" cy="280" r="5" fill="#10b981"/>
    <line x1="175" y1="280" x2="215" y2="280" stroke="#10b981" stroke-width="4"/>
    <!-- merge -->
    <line x1="215" y1="200" x2="215" y2="280" stroke="#10b981" stroke-width="4"/>
    <line x1="215" y1="240" x2="260" y2="240" stroke="#10b981" stroke-width="4"/>
    <circle cx="260" cy="240" r="10" fill="#facc15" filter="url(#glow)"/>
    <text x="170" y="315" fill="#4ade80" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">灯泡通电发光! (1)</text>

    <text x="170" y="365" fill="#f8fafc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">真值表 (Truth Table)</text>
    <rect x="30" y="390" width="280" height="170" rx="8" fill="#0b1220" stroke="#1e293b"/>
    <text x="60" y="420" fill="#94a3b8" font-size="14" font-family="monospace">开关A   开关B  |  灯泡状态</text>
    <text x="60" y="450" fill="#cbd5e1" font-size="14" font-family="monospace">  0       0    |    0 (灭)</text>
    <text x="60" y="480" fill="#4ade80" font-size="14" font-family="monospace">  0       1    |    1 (亮!)</text>
    <text x="60" y="510" fill="#4ade80" font-size="14" font-family="monospace">  1       0    |    1 (亮!)</text>
    <text x="60" y="540" fill="#4ade80" font-size="14" font-family="monospace">  1       1    |    1 (亮!)</text>

    <text x="170" y="595" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">布尔表达式: Y = A + B</text>
    <rect x="30" y="615" width="280" height="55" rx="8" fill="#1e293b"/>
    <text x="40" y="640" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">★ 记忆口诀：</text>
    <text x="40" y="660" fill="#10b981" font-size="13" font-weight="bold" font-family="-apple-system, sans-serif">一高即高，全低才低</text>
  </g>

  <!-- Card 3: NOT Gate (非门 跷跷板反相器) -->
  <g transform="translate(800, 140)">
    <rect width="340" height="690" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect width="340" height="50" rx="16" fill="#d97706"/>
    <text x="170" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">非门 NOT (反相器)</text>
    
    <text x="170" y="85" fill="#fde68a" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">生活比喻：操场上的跷跷板</text>
    <text x="30" y="120" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">左边坐下去 (1)，右边就翘起来上天 (0)！</text>
    
    <rect x="50" y="150" width="240" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
    <polygon points="100,190 100,290 180,240" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="195" cy="240" r="10" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <line x1="60" y1="240" x2="100" y2="240" stroke="#f59e0b" stroke-width="4"/>
    <line x1="205" y1="240" x2="250" y2="240" stroke="#f59e0b" stroke-width="4"/>
    <text x="80" y="225" fill="#f59e0b" font-size="16" font-weight="bold" font-family="monospace">1</text>
    <text x="235" y="225" fill="#ef4444" font-size="16" font-weight="bold" font-family="monospace">0</text>
    <text x="170" y="315" fill="#fbbf24" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">彻底颠倒黑白：0变1，1变0</text>

    <text x="170" y="365" fill="#f8fafc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">真值表 (Truth Table)</text>
    <rect x="30" y="390" width="280" height="170" rx="8" fill="#0b1220" stroke="#1e293b"/>
    <text x="70" y="440" fill="#94a3b8" font-size="16" font-family="monospace">输入 A  |  输出 Y</text>
    <text x="70" y="480" fill="#4ade80" font-size="16" font-family="monospace">   0    |    1 (反转成真)</text>
    <text x="70" y="520" fill="#ef4444" font-size="16" font-family="monospace">   1    |    0 (反转成假)</text>

    <text x="170" y="595" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">布尔表达式: Y = ¬A (或 Ā)</text>
    <rect x="30" y="615" width="280" height="55" rx="8" fill="#1e293b"/>
    <text x="40" y="640" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">★ 记忆口诀：</text>
    <text x="40" y="660" fill="#f59e0b" font-size="13" font-weight="bold" font-family="-apple-system, sans-serif">遇真则假，遇假则真</text>
  </g>

  <!-- Card 4: XOR Gate (异或门 楼梯双控开关) -->
  <g transform="translate(1170, 140)">
    <rect width="370" height="690" rx="16" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2"/>
    <rect width="370" height="50" rx="16" fill="#9333ea"/>
    <text x="185" y="32" fill="#ffffff" font-size="20" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">异或门 XOR (楼梯双控开关)</text>
    
    <text x="185" y="85" fill="#e9d5ff" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">生活比喻：楼上楼下的双控走廊灯</text>
    <text x="30" y="120" fill="#cbd5e1" font-size="14" font-family="-apple-system, sans-serif">两人拨动状态【不同】就亮，【相同】就灭！</text>
    
    <rect x="50" y="150" width="270" height="180" rx="12" fill="#0f172a" stroke="#334155"/>
    <path d="M 80,180 Q 115,240 80,300" fill="none" stroke="#a855f7" stroke-width="3"/>
    <path d="M 95,180 Q 130,240 95,300 Q 180,300 215,240 Q 180,180 95,180 Z" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
    <line x1="50" y1="210" x2="105" y2="210" stroke="#a855f7" stroke-width="4"/>
    <line x1="50" y1="270" x2="105" y2="270" stroke="#a855f7" stroke-width="4"/>
    <line x1="215" y1="240" x2="280" y2="240" stroke="#a855f7" stroke-width="4"/>
    <circle cx="280" cy="240" r="10" fill="#facc15" filter="url(#glow)"/>
    <text x="185" y="318" fill="#c084fc" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">异(不同)=1，同(一样)=0</text>

    <text x="185" y="365" fill="#f8fafc" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">真值表 (加法器的灵魂!)</text>
    <rect x="30" y="390" width="310" height="170" rx="8" fill="#0b1220" stroke="#1e293b"/>
    <text x="60" y="420" fill="#94a3b8" font-size="14" font-family="monospace">开关A   开关B  |  走廊灯 (XOR)</text>
    <text x="60" y="450" fill="#cbd5e1" font-size="14" font-family="monospace">  0       0    |    0 (同灭)</text>
    <text x="60" y="480" fill="#4ade80" font-size="14" font-weight="bold" font-family="monospace">  0       1    |    1 (异亮!)</text>
    <text x="60" y="510" fill="#4ade80" font-size="14" font-weight="bold" font-family="monospace">  1       0    |    1 (异亮!)</text>
    <text x="60" y="540" fill="#cbd5e1" font-size="14" font-family="monospace">  1       1    |    0 (同灭)</text>

    <text x="185" y="595" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">布尔表达式: Y = A ⊕ B</text>
    <rect x="30" y="615" width="310" height="55" rx="8" fill="#1e293b"/>
    <text x="40" y="640" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">★ 灵魂地位：</text>
    <text x="40" y="660" fill="#c084fc" font-size="13" font-weight="bold" font-family="-apple-system, sans-serif">XOR 就是不带进位的 1 位二进制加法！</text>
  </g>
</svg>