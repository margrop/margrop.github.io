  <text x="56" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">小学生也能看懂：Gemini 4 Hydrogen 三大核心机制生活比喻</text>
  <text x="56" y="146" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">把 100万统一池、思考档位与被忽略的采样参数，翻译成厨房、游泳池与变速自行车</text>
<g transform="translate(56, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="424" height="610" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="0" y="0" width="424" height="56" rx="16" fill="#E8F0FE"/><rect x="0" y="42" width="424" height="14" fill="#E8F0FE"/><text x="24" y="36" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#1A73E8">1. 顶级主厨 + 闪电二厨</text><rect x="24" y="78" width="376" height="118" rx="12" fill="#0F172A"/><text x="42" y="108" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD">Carbon / Argon (米其林总厨)</text><text x="42" y="136" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="42" dy="0">只定大方向与关键架构，工钱贵（12/01 起</tspan><tspan x="42" dy="20.7">$4/$20）</tspan></text><line x1="212" y1="196" x2="212" y2="232" stroke="#1A73E8" stroke-width="3"/><polygon points="205,226 219,226 212,238" fill="#1A73E8"/><rect x="24" y="242" width="376" height="144" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="42" y="272" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0B57D0">Hydrogen (闪电全能二厨)</text><text x="42" y="300" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="42" dy="0">把 80% 翻文档、查代码、改测试、跑命令并行做</tspan><tspan x="42" dy="21.5">完！速度快 2~2.8 倍，Antigravity 配额还省</tspan><tspan x="42" dy="21.5">24%</tspan></text><text x="24" y="418" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start"><tspan x="24" dy="0">生活类比：以前搬小事找勤杂工（3.8 Flash），结</tspan><tspan x="24" dy="23.2">果经常听错返工 3 遍；现在 Hydrogen 又快又稳、</tspan><tspan x="24" dy="23.2">一遍做对，算总账反而少花 59% 工钱。</tspan></text></g><g transform="translate(508, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="424" height="610" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="0" y="0" width="424" height="56" rx="16" fill="#E6F4EA"/><rect x="0" y="42" width="424" height="14" fill="#E6F4EA"/><text x="24" y="36" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0F9D58">2. 100万统一大泳池 (Unified Pool)</text><text x="24" y="88" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#64748B">旧模型：分格饭盒 (1M 输入 + 独立 64K 出口)</text><rect x="24" y="98" width="260" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><rect x="292" y="98" width="108" height="44" rx="8" fill="#E2E8F0" stroke="#94A3B8"/><text x="154" y="125" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12.5" fill="#475569">Input (Max 1M)</text><text x="346" y="125" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" fill="#475569">Out</text><text x="24" y="176" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F9D58">Hydrogen：同一座 1,048,576 泳池</text><rect x="24" y="188" width="376" height="56" rx="10" fill="#ECFDF5" stroke="#0F9D58" stroke-width="1.8"/><rect x="30" y="194" width="170" height="44" rx="6" fill="#93C5FD"/><rect x="204" y="194" width="96" height="44" rx="6" fill="#FDE68A"/><rect x="304" y="194" width="90" height="44" rx="6" fill="#34D399"/><text x="115" y="221" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Input</text><text x="252" y="221" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">草稿 Think</text><text x="349" y="221" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">答案 Out</text><rect x="24" y="264" width="376" height="122" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/><text x="40" y="294" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#B91C1C">常见翻车：max_output_tokens=8192 盖子</text><text x="40" y="322" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="40" dy="0">Hydrogen 把“草稿(Thinking)+正式回答(Output)”</tspan><tspan x="40" dy="20.7">算进同一个水桶！如果限死 8192，打完草稿水桶就</tspan><tspan x="40" dy="20.7">满了，屏幕吐出空白 incomplete。</tspan></text><text x="24" y="418" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start"><tspan x="24" dy="0">同步单口上限是 64K（65,536）；超过 64K 写长代</tspan><tspan x="24" dy="23.2">码要打开 background=True 后台排队写，最高把整</tspan><tspan x="24" dy="23.2">座 100 万池剩水量全写完。</tspan></text></g><g transform="translate(960, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="424" height="610" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="0" y="0" width="424" height="56" rx="16" fill="#FEF7E0"/><rect x="0" y="42" width="424" height="14" fill="#FEF7E0"/><text x="24" y="36" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#B45309">3. 四档思考变速器 &amp; 无效调料罐</text><rect x="22" y="82" width="70" height="84" rx="10" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/><text x="57" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#B91C1C">minimal</text><text x="57" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">报错废除！</text><rect x="98" y="82" width="70" height="84" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="133" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#334155">low</text><text x="133" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">轻快挡</text><rect x="174" y="82" width="70" height="84" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="209" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#334155">medium</text><text x="209" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">旧默认</text><rect x="250" y="82" width="70" height="84" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/><text x="285" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#1D4ED8">high ★</text><text x="285" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8">新默认</text><rect x="326" y="82" width="70" height="84" rx="10" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="361" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#60A5FA">xhigh</text><text x="361" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#60A5FA">极限脑</text><rect x="24" y="190" width="376" height="196" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.4"/><text x="40" y="220" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#92400E">被无视的“盐罐”：temperature / top_p / top_k</text><text x="40" y="250" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="40" dy="0">就算你在订单备注写 temperature=0.1，Hydrogen</tspan><tspan x="40" dy="21.3">也会礼貌地回你 HTTP 200 OK，但后厨其实把你的</tspan><tspan x="40" dy="21.3">盐罐直接收起来按主厨标准温度出菜——不会报错，但</tspan><tspan x="40" dy="21.3">输出不再被你锁死，必须用 Structured Outputs（</tspan><tspan x="40" dy="21.3">结构化模板）控格式！</tspan></text><text x="24" y="418" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start"><tspan x="24" dy="0">同时记住：旧车默契在 medium（中档），Hydrogen</tspan><tspan x="24" dy="23.2">出厂默认挂进 high（高档），推理深度暴涨、思考</tspan><tspan x="24" dy="23.2">Token 按 $7.50/M 算。简单分类记得手动降回 low。</tspan></text></g>
  <line x1="56" y1="814" x2="1384" y2="814" stroke="#CBD5E1" stroke-width="1"/>
  <text x="56" y="838" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" fill="#64748B">比喻仅用于建立直觉，对应参数均以 Google AI Studio Gemini 4 Hydrogen 官方文档为准</text>
</svg>