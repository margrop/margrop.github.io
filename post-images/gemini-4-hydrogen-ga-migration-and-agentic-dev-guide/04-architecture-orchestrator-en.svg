" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="10.2" fill="#334155">65,536 sync cap</text><text x="217" y="102" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#64748B">→</text><rect x="226" y="62" width="194" height="72" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="1.2"/><text x="236" y="90" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#3730A3">Hop 2 (64K ~ 128K)</text><text x="236" y="114" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="10.2" fill="#334155">background=True + store=True</text><text x="421" y="102" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#64748B">→</text><rect x="430" y="62" width="194" height="72" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.2"/><text x="440" y="90" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#065F46">Hop N (... 1M - input)</text><text x="440" y="114" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="10.2" fill="#334155">max_output_tokens &gt; 65536</text><text x="28" y="160" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start"><tspan x="28" dy="0">Server-side: Interactions API with BOTH background=True, store=True AND</tspan><tspan x="28" dy="22.5">max_output_tokens &gt; 65536.</tspan><tspan x="28" dy="22.5">Client-side continuation: upgrade Python google-genai &gt;= 2.34.0 / JS &gt;=</tspan><tspan x="28" dy="22.5">2.32.0 / Go &gt;= 1.77.0, and compute compaction using initial_input +</tspan><tspan x="28" dy="22.5">total_output + total_thought.</tspan></text></g><g transform="translate(734, 484)" filter="url(#cardShadow)"><rect x="0" y="0" width="650" height="304" rx="16" fill="#FFFFFF" stroke=