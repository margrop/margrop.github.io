al, sans-serif" font-size="14.5" font-weight="500" fill="#475569" text-anchor="start"><tspan x="22" dy="0">$3.16 vs $7.77 (3.8 Flash)</tspan></text></g><g transform="translate(56, 636)" filter="url(#cardShadow)"><rect x="0" y="0" width="1328" height="148" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><circle cx="36" cy="38" r="6" fill="#D93025"/><text x="52" y="44" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">定价拐点预警</text><text x="34" y="74" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="34" dy="0">$1.50 / $7.50 每百万 token；12/01 Carbon</tspan><tspan x="34" dy="21.8">翻倍，01/01 3.8 Flash 涨平同价</tspan></text><line x1="450" y1="22" x2="450" y2="126" stroke="#E2E8F0" stroke-width="1"/><circle cx="476" cy="38" r="6" fill="#0F9D58"/><text x="492" y="44" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">95% 隐式缓存折扣</text><text x="474" y="74" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="474" dy="0">&gt;= 4,096 tokens 自动触发 $0.075/M，无需也不支持</tspan><tspan x="474" dy="21.8">caches.create</tspan></text><line x1="890" y1="22" x2="890" y2="126" stroke="#E2E8F0" stroke-width="1"/><circle cx="916" cy="38" r="6" fill="#1A73E8"/><text x="932" y="44" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">2026-12-01 截止期</text><text x="914" y="74" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#475569" text-anchor="start"><tspan x="914" dy="0">已下线 gemini-2.5-pro 将自动路由至 3.8 Flash，建</tspan><tspan x="914" dy="21.8">议直接迁往 Hydrogen</tspan></text></g>
