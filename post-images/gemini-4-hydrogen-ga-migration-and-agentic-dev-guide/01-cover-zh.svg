<g transform="translate(56, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="730" height="440" rx="18" fill="url(#gHeroDark)"/><g transform="translate(36, 34) scale(1.7)"><path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81" fill="#60A5FA"/></g><text x="92" y="54" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="14" font-weight="600" fill="#93C5FD">MODEL ID: gemini-4-hydrogen (GA FREE + PAID)</text><text x="36" y="106" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="24.5" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="36" dy="0">Flash 的速度，超越 Argon 的终端大脑</tspan></text><text x="36" y="192" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="36" dy="0">2026年11月12日 Google 全量开放 Gemini 4 Hydrogen。它用 188~198 tok/s 的极</tspan><tspan x="36" dy="24.8">速承接 Carbon/Argon 约 80% 的日常编码、搜索与并行调研负载，复杂任务单次成本</tspan><tspan x="36" dy="24.8">反而比 Gemini 3.8 Flash 低 59%（$3.16 vs $7.77）。</tspan></text><rect x="36" y="318" width="210" height="86" rx="12" fill="#1E3A8A" stroke="#334155" stroke-width="1"/><text x="50" y="350" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD">Antigravity Orchestrator</text><text x="50" y="378" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E2E8F0">Carbon 协调 + Hydrogen 并行</text><rect x="260" y="318" width="210" height="86" rx="12" fill="#064E3B" stroke="#334155" stroke-width="1"/><text x="274" y="350" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#6EE7B7">统一 1M 窗口</text><text x="274" y="378" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E2E8F0">Input + Think + Out 总池</text><rect x="484" y="318" width="210" height="86" rx="12" fill="#3B0764" stroke="#334155" stroke-width="1"/><text x="498" y="350" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#D8B4FE">3 OS 一键脚本</text><text x="498" y="378" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#E2E8F0">Win11 / Ubuntu26 / macOS27</text></g><g transform="translate(812, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="276" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/><rect x="20" y="20" width="236" height="44" rx="10" fill="#E8F0FE"/><text x="34" y="48" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#1A73E8">Terminal-Bench 4.1</text><text x="22" y="126" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="42" font-weight="800" fill="#0F172A">57.0%</text><text x="22" y="166" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#475569" text-anchor="start"><tspan x="22" dy="0">vs 3.8 Flash 仅 18.2%</tspan></text></g><g transform="translate(1104, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="276" height="210" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/><rect x="20" y="20" width="236" height="44" rx="10" fill="#E6F4EA"/><text x="34" y="48" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica 