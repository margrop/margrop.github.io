#1E293B"/><text x="485" y="224" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="11" fill="#6EE7B7">Implicit Prefix &gt;= 4,096 tok (95% OFF)</text><line x1="628" y1="158" x2="684" y2="94" stroke="#0F9D58" stroke-width="2.2"/><polygon points="678,89 690,94 678,99" fill="#0F9D58"/><line x1="628" y1="158" x2="684" y2="158" stroke="#0F9D58" stroke-width="2.2"/><polygon points="678,153 690,158 678,163" fill="#0F9D58"/><line x1="628" y1="158" x2="684" y2="222" stroke="#0F9D58" stroke-width="2.2"/><polygon points="678,217 690,222 678,227" fill="#0F9D58"/><rect x="692" y="64" width="320" height="58" rx="10" fill="#ECFDF5" stroke="#0F9D58" stroke-width="1.3"/><text x="708" y="87" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#065F46">Worker A • 并行检索</text><text x="708" y="108" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#064E3B">同时读多个源码/文档/终端日志（提速 2x）</text><rect x="692" y="132" width="320" height="58" rx="10" fill="#ECFDF5" stroke="#0F9D58" stroke-width="1.3"/><text x="708" y="155" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#065F46">Worker B • 审计修复</text><text x="708" y="176" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#064E3B">执行 8 项静态排雷、替换参数、重写 Schema</text><rect x="692" y="200" width="320" height="58" rx="10" fill="#ECFDF5" stroke="#0F9D58" stroke-width="1.3"/><text x="708" y="223" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#065F46">Worker C • 回归验证</text><text x="708" y="244" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#064E3B">跑单测 + SQL/依赖图推理（省 12~23% Token）</text><line x1="1012" y1="158" x2="1060" y2="158" stroke="#0F9D58" stroke-width="2.5"/><polygon points="1054,151 1068,158 1054,165" fill="#0F9D58"/><rect x="1070" y="64" width="230" height="190" rx="12" fill="#EFF6FF" stroke="#1A73E8" stroke-width="1.5"/><text x="1088" y="96" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="800" fill="#1E40AF">官方防幻觉 Skill 护栏</text><text x="1088" y="126" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="1088" dy="0">安装 gemini-api-dev 技能</tspan><tspan x="1088" dy="20.0">后，Agent 写代码前自动拉取</tspan><tspan x="1088" dy="20.0">最新 Hydrogen API 规范，避</tspan><tspan x="1088" dy="20.0">免写错旧 SDK。</tspan></text><rect x="1086" y="206" width="198" height="28" rx="6" fill="#1D4ED8"/><text x="1185" y="224" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="11.5" fill="#FFFFFF">gemini-api-dev Skill</text></g><g transform="translate(56, 484)" filter="url(#cardShadow)"><rect x="0" y="0" width="650" height="304" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="800" fill="#0F172A">2. >64K 长输出（Long Decode）唯一正确接力机制</text><rect x="22" y="62" width="194" height="72" rx="10" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.2"/><text x="32" y="90" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#1E40AF">Hop 1 (0 ~ 64K)</text><text x="32" y="114" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="10.2" fill="#334155">65,536 sync cap</text><text x="217" y="102" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#64748B">→</text><rect x="226" y="62" width="194" height="72" rx="10" fill="#E0E7FF" stroke="#3730A3" stroke-width="1.2"/><text x="236" y="90" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#3730A3">Hop 2 (64K ~ 128K)</text><text x="236" y="114" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="10.2" fill="#334155">background=True + store=True</text><text x="421" y="102" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#64748B">→</text><rect x="430" y="62" width="194" height="72" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.2"/><text x="440" y="90" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#065F46">Hop N (... 1M - input)</text><text x="440" y="114" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="10.2" fill="#334155">max_output_tokens &gt; 65536</text><text x="28" y="160" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start"><tspan x="28" dy="0">服务端方案：Interactions API 同时设置 background=True + store=True +</tspan><tspan x="28" dy="22.5">max_output_tokens &gt; 65536。</tspan><tspan x="28" dy="22.5">客户端方案：若用普通 Responses / generateContent 自动续写，必须升级 SDK 到</tspan><tspan x="28" dy="22.5">Python google-genai &gt;= 2.34.0 / JS &gt;= 2.32.0，且用 initial_input +</tspan><tspan x="28" dy="22.5">total_output + total_thought 计算上下文水位。</tspan></text></g><g transform="translate(734, 484)" filter="url(#cardShadow)"><rect x="0" y="0" width="650" height="304" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><text x="28" y="38" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="17.5" font-weight="800" fill="#0F172A">3. 隐式缓存 + Stateless thought_signature 排布铁律</text><rect x="28" y="64" width="380" height="54" rx="8" fill="#0F9D58"/><rect x="414" y="64" width="208" height="54" rx="8" fill="#F59E0B"/><text x="218" y="88" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">固定静态前缀 >= 4,096 tok (享 95% 折扣 $0.075/M)</text><text x="218" y="107" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="11.5" fill="#ECFDF5">System Prompt + Tool Schemas + Repo Map</text><text x="518" y="88" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">动态实时内容</text><text x="518" y="107" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="11.5" fill="#FFFBEB">User Msg + Diff + Time</text><text x="28" y="152" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#334155" text-anchor="start"><tspan x="28" dy="0">千万别把时间戳/随机 ID 放在 System Prompt 开头，否则每次请求都击穿缓存按</tspan><tspan x="28" dy="22.5">$1.50/M 计费！</tspan><tspan x="28" dy="22.5">此外在无状态 generateContent 循环里，前一次响应返回的 thought_signature 必</tspan><tspan x="28" dy="22.5">须逐字原样附带回传给下一轮；平行 functionCall 只需第一个带，禁止擅自复制或改写。</tspan></text></g>
