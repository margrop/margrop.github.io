  <text x="56" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">Plain-English Mental Models: How Gemini 4 Hydrogen Actually Works</text>
  <text x="56" y="146" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">Translating Unified 1M Pools, Thinking Gears &amp; Ignored Temperature into Kitchens, Pools &amp; Bikes</text>
<g transform="translate(56, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="424" height="610" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="0" y="0" width="424" height="56" rx="16" fill="#E8F0FE"/><rect x="0" y="42" width="424" height="14" fill="#E8F0FE"/><text x="24" y="36" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#1A73E8">1. Master Chef + Lightning Sous-Chef</text><rect x="24" y="78" width="376" height="118" rx="12" fill="#0F172A"/><text x="42" y="108" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD">Carbon / Argon (Executive Chef)</text><text x="42" y="136" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#CBD5E1" text-anchor="start"><tspan x="42" dy="0">Writes the master recipe &amp; tricky logic</tspan><tspan x="42" dy="20.7">($4/$20 from Dec 1)</tspan></text><line x1="212" y1="196" x2="212" y2="232" stroke="#1A73E8" stroke-width="3"/><polygon points="205,226 219,226 212,238" fill="#1A73E8"/><rect x="24" y="242" width="376" height="144" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="42" y="272" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#0B57D0">Hydrogen (Lightning Sous-Chef)</text><text x="42" y="300" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B" text-anchor="start"><tspan x="42" dy="0">Reads files, searches code, runs tests</tspan><tspan x="42" dy="21.5">in parallel — 2-2.8x faster &amp; cuts 24%</tspan><tspan x="42" dy="21.5">Antigravity quota</tspan></text><text x="24" y="418" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start"><tspan x="24" dy="0">Analogy: A cheap helper (3.8 Flash) who</tspan><tspan x="24" dy="23.2">breaks dishes costs more in retries ($7.77).</tspan><tspan x="24" dy="23.2">Hydrogen nails multi-step chores on the</tspan><tspan x="24" dy="23.2">first pass ($3.16).</tspan></text></g><g transform="translate(508, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="424" height="610" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="0" y="0" width="424" height="56" rx="16" fill="#E6F4EA"/><rect x="0" y="42" width="424" height="14" fill="#E6F4EA"/><text x="24" y="36" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0F9D58">2. Unified 1M Pool vs Split Bento</text><text x="24" y="88" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#64748B">Legacy: Separate Input (1M) + Fixed Output Box</text><rect x="24" y="98" width="260" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><rect x="292" y="98" width="108" height="44" rx="8" fill="#E2E8F0" stroke="#94A3B8"/><text x="154" y="125" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12.5" fill="#475569">Input (Max 1M)</text><text x="346" y="125" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" fill="#475569">Out</text><text x="24" y="176" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0F9D58">Hydrogen: ONE 1,048,576 Shared Pool</text><rect x="24" y="188" width="376" height="56" rx="10" fill="#ECFDF5" stroke="#0F9D58" stroke-width="1.8"/><rect x="30" y="194" width="170" height="44" rx="6" fill="#93C5FD"/><rect x="204" y="194" width="96" height="44" rx="6" fill="#FDE68A"/><rect x="304" y="194" width="90" height="44" rx="6" fill="#34D399"/><text x="115" y="221" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Input</text><text x="252" y="221" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Thinking</text><text x="349" y="221" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Output</text><rect x="24" y="264" width="376" height="122" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/><text x="40" y="294" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" fill="#B91C1C">Low max_output_tokens=8192 Cap Trap</text><text x="40" y="322" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="40" dy="0">Hydrogen counts Thinking + Final Output</tspan><tspan x="40" dy="20.7">under ONE max_output_tokens lid. If capped</tspan><tspan x="40" dy="20.7">at 8192, internal thoughts eat the whole</tspan><tspan x="40" dy="20.7">cap -&gt; empty text!</tspan></text><text x="24" y="418" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start"><tspan x="24" dy="0">Sync calls cap at 65,536 tokens/hop. Want</tspan><tspan x="24" dy="23.2">&gt;64K generated code? Enable background=True</tspan><tspan x="24" dy="23.2">+ max_output_tokens &gt; 65536 to fill</tspan><tspan x="24" dy="23.2">remaining pool!</tspan></text></g><g transform="translate(960, 174)" filter="url(#cardShadow)"><rect x="0" y="0" width="424" height="610" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="0" y="0" width="424" height="56" rx="16" fill="#FEF7E0"/><rect x="0" y="42" width="424" height="14" fill="#FEF7E0"/><text x="24" y="36" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#B45309">3. 4 Thinking Gears &amp; Ignored Salt Shaker</text><rect x="22" y="82" width="70" height="84" rx="10" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/><text x="57" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#B91C1C">minimal</text><text x="57" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">ERROR!</text><rect x="98" y="82" width="70" height="84" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="133" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#334155">low</text><text x="133" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Fast</text><rect x="174" y="82" width="70" height="84" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="209" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#334155">medium</text><text x="209" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Old Def</text><rect x="250" y="82" width="70" height="84" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/><text x="285" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#1D4ED8">high ★</text><text x="285" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1D4ED8">New Def</text><rect x="326" y="82" width="70" height="84" rx="10" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="361" y="114" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" font-weight="700" fill="#60A5FA">xhigh</text><text x="361" y="146" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#60A5FA">Extra</text><rect x="24" y="190" width="376" height="196" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.4"/><text x="40" y="220" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#92400E">Ignored Salt: temperature / top_p / top_k</text><text x="40" y="250" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#78350F" text-anchor="start"><tspan x="40" dy="0">Passing temperature=0.1 still returns HTTP</tspan><tspan x="40" dy="21.3">200 OK, yet the kitchen ignores your salt</tspan><tspan x="40" dy="21.3">shaker and uses its calibrated default!</tspan><tspan x="40" dy="21.3">Stop relying on temperature for JSON safety</tspan><tspan x="40" dy="21.3">— use Structured Outputs.</tspan></text><text x="24" y="418" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#334155" text-anchor="start"><tspan x="24" dy="0">Because default gear shifted from medium to</tspan><tspan x="24" dy="23.2">high, Hydrogen thinks much harder</tspan><tspan x="24" dy="23.2">out-of-the-box — and thinking tokens bill</tspan><tspan x="24" dy="23.2">at $7.50/1M output. Set low for trivial</tspan><tspan x="24" dy="23.2">tasks.</tspan></text></g>
