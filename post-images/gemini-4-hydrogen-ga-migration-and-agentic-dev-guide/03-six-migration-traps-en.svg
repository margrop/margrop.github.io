  <text x="56" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">What Breaks When You Swap Model IDs? The 8 Migration Traps</text>
  <text x="56" y="146" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">The scariest bugs don't raise HTTP 400 — they return HTTP 200 OK while silently truncating, draining budget, or breaking compaction</text>
<rect x="56" y="170" width="650" height="656" rx="16" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.8" filter="url(#cardShadow)"/><rect x="56" y="170" width="650" height="54" rx="16" fill="#FEF3C7"/><rect x="56" y="208" width="650" height="16" fill="#FEF3C7"/><text x="80" y="204" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#92400E">ZONE A: Silent HTTP 200 Behavior Changes (No Error Thrown)</text><rect x="78" y="242" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="272" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">01 | temperature / top_p / top_k Silently Ignored</text><text x="96" y="300" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">API returns 200 OK but ignores custom sampling params. Use Structured</tspan><tspan x="96" dy="21.0">Outputs instead of temperature=0.</tspan></text><rect x="78" y="384" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="414" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">02 | Default thinking_level Jumped medium -&gt; high</text><text x="96" y="442" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">Routing or classification calls will over-think at $7.50/M output</tspan><tspan x="96" dy="21.0">unless you explicitly set low.</tspan></text><rect x="78" y="526" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="556" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">03 | Unified 1M Pool + Cap Includes Thinking Tokens</text><text x="96" y="584" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">A 900K prompt leaves only 148K for thinking+output; legacy 8192 cap</tspan><tspan x="96" dy="21.0">gets exhausted in thinking.</tspan></text><rect x="78" y="668" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="698" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">04 | total_input_tokens Over-Counts in Long Decode</text><text x="96" y="726" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">Long decode sums input across every 64K hop; track initial_input +</tspan><tspan x="96" dy="21.0">total_output + total_thought.</tspan></text><rect x="734" y="170" width="650" height="656" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" filter="url(#cardShadow)"/><rect x="734" y="170" width="650" height="54" rx="16" fill="#FEE2E2"/><rect x="734" y="208" width="650" height="16" fill="#FEE2E2"/><text x="758" y="204" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#991B1B">ZONE B: Loud Errors &amp; Unsupported Capabilities</text><rect x="756" y="242" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="272" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">05 | thinking_level='minimal' Throws Immediate Error</text><text x="774" y="300" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">Hydrogen removes minimal thinking. Replace minimal -&gt; low across</tspan><tspan x="774" dy="21.0">prompts and SDK configs.</tspan></text><rect x="756" y="384" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="414" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">06 | Explicit Caching Unsupported -&gt; Drop caches.create</text><text x="774" y="442" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">Remove cachedContents calls; put stable system/tool prefixes first to</tspan><tspan x="774" dy="21.0">trigger auto 95% off &gt;=4,096 tok.</tspan></text><rect x="756" y="526" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="556" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">07 | &gt;64K Outputs Need background=True + New SDK</text><text x="774" y="584" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">Requires BOTH background=True, store=True AND max_output_tokens &gt; 65536</tspan><tspan x="774" dy="21.0">(or SDK &gt;= 2.34.0).</tspan></text><rect x="756" y="668" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="698" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">08 | thought_signature Drop &amp; +5.57pp Refusal Shift</text><text x="774" y="726" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">Echo thought_signature verbatim on multi-turn tool calls; no</tspan><tspan x="774" dy="21.0">Live/Image/Audio gen; audit safety edge prompts.</tspan></text>
  <line x1="56" y1="854" x2="1384" y2="854" stroke="#CBD5E1" stroke-width="1"/>
  <text x="56" y="878" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" fill="#64748B">All 8 checks are automated in the zero-dependency Win11 / Ubuntu 26.04 / macOS 27 scripts below</text>
</svg>