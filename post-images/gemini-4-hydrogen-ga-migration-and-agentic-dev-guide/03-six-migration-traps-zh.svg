  <text x="56" y="114" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="800" fill="#0F172A">老项目直接换模型 ID 会怎样？8 个高频迁移深坑全息图</text>
  <text x="56" y="146" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">最危险的不是报错 400，而是服务器静悄悄返回 HTTP 200 OK 后才在线上吞钱、截断或漏缓存</text>
<rect x="56" y="170" width="650" height="656" rx="16" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.8" filter="url(#cardShadow)"/><rect x="56" y="170" width="650" height="54" rx="16" fill="#FEF3C7"/><rect x="56" y="208" width="650" height="16" fill="#FEF3C7"/><text x="80" y="204" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#92400E">A 区：返回 HTTP 200 OK 却暗中变形（4 大隐形杀手）</text><rect x="78" y="242" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="272" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">01 | temperature / top_p / top_k 被静默忽略</text><text x="96" y="300" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">API 不报错，但固定使用官方校准参数；别再靠 temperature=0 保 JSON，改用</tspan><tspan x="96" dy="21.0">response_schema。</tspan></text><rect x="78" y="384" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="414" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">02 | 默认 thinking_level 从 medium 升为 high</text><text x="96" y="442" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">简单抽词/路由如果不显式降档 low，单次请求会多跑数倍思考 Token，按 $7.50/M</tspan><tspan x="96" dy="21.0">计费。</tspan></text><rect x="78" y="526" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="556" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">03 | 统一 1M 池 + max_output_tokens 含思考额度</text><text x="96" y="584" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">90 万输入只剩 14.8 万草稿与输出；且沿用 8192 上限会被草稿吃空返回</tspan><tspan x="96" dy="21.0">incomplete 空文本！</tspan></text><rect x="78" y="668" width="606" height="126" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/><text x="96" y="698" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#B45309">04 | Long Decode 中 total_input_tokens 统计陷阱</text><text x="96" y="726" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#451A03" text-anchor="start"><tspan x="96" dy="0">后台长输出跨 64K 跳点时该字段会累加每一跳的重复输入，误触发上下文压缩。改用</tspan><tspan x="96" dy="21.0">initial_input + out + thought。</tspan></text><rect x="734" y="170" width="650" height="656" rx="16" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" filter="url(#cardShadow)"/><rect x="734" y="170" width="650" height="54" rx="16" fill="#FEE2E2"/><rect x="734" y="208" width="650" height="16" fill="#FEE2E2"/><text x="758" y="204" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#991B1B">B 区：直接报错或必须架构改道（4 大显性断点）</text><rect x="756" y="242" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="272" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">05 | thinking_level='minimal' 直接报错</text><text x="774" y="300" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">Hydrogen 最低支持档位是 low。迁移前需把 minimal 全局替换为 low，避免请求直</tspan><tspan x="774" dy="21.0">接 400。</tspan></text><rect x="756" y="384" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="414" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">06 | 不支持 Explicit Caching，必须删 caches.create</text><text x="774" y="442" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">改用免费自动触发的 Implicit Caching：&gt;= 4,096 tokens 且固定前缀放前面，即</tspan><tspan x="774" dy="21.0">享 95% 折扣（$0.075/M）。</tspan></text><rect x="756" y="526" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="556" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">07 | 超过 64K 输出：必须 background=True + 新版 SDK</text><text x="774" y="584" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">单传 background=True 会停在 64K！还需 max_output_tokens &gt;</tspan><tspan x="774" dy="21.0">65536、store=True，或升级 google-genai &gt;= 2.34.0。</tspan></text><rect x="756" y="668" width="606" height="126" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/><text x="774" y="698" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#991B1B">08 | 无状态的 thought_signature 丢失 &amp; 拒绝率 +5.57pp</text><text x="774" y="726" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F1D1D" text-anchor="start"><tspan x="774" dy="0">多轮手动 generateContent 必须原样回传 thought_signature；且图像安全合规更</tspan><tspan x="774" dy="21.0">严、无 Live/生图/生音 API。</tspan></text>
  <line x1="56" y1="854" x2="1384" y2="854" stroke="#CBD5E1" stroke-width="1"/>
  <text x="56" y="878" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="12" fill="#64748B">全部 8 项规则已内置进本文附带的一键审计脚本（Windows 11 / Ubuntu 26.04 / macOS 27）</text>
</svg>