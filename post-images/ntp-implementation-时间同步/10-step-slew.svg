<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"><rect width="1200" height="280" rx="18" fill="#0b1724"/><rect width="1200" height="72" rx="18" fill="#123b5d"/><circle cx="35" cy="36" r="9" fill="#ff6b6b"/><circle cx="65" cy="36" r="9" fill="#ffd166"/><circle cx="95" cy="36" r="9" fill="#06d6a0"/><text x="130" y="44" font-family="Arial" font-size="24" font-weight="bold" fill="white">示意图：step 与 slew</text><text x="34" y="120" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">offset &lt; 128 ms  →  slew：慢慢调频，不跳时钟</text><text x="34" y="145" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">offset &gt; 128 ms  →  step：直接拨正（默认策略）</text><text x="34" y="170" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">offset &gt; 1000 s  →  panic：通常拒绝启动</text><text x="34" y="195" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">阈值因实现和配置不同，请以本机文档为准</text></svg>