<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="355" viewBox="0 0 1200 355"><rect width="1200" height="355" rx="18" fill="#0b1724"/><rect width="1200" height="72" rx="18" fill="#147d92"/><circle cx="35" cy="36" r="9" fill="#ff6b6b"/><circle cx="65" cy="36" r="9" fill="#ffd166"/><circle cx="95" cy="36" r="9" fill="#06d6a0"/><text x="130" y="44" font-family="Arial" font-size="24" font-weight="bold" fill="white">原创配图：NTP 四时间戳</text><text x="34" y="120" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">T1  client sends request</text><text x="34" y="145" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">T2  server receives request</text><text x="34" y="170" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">T3  server sends reply</text><text x="34" y="195" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">T4  client receives reply</text><text x="34" y="220" font-family="Consolas,monospace" font-size="15" fill="#d9edf7"></text><text x="34" y="245" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">offset = ((T2-T1)+(T3-T4))/2</text><text x="34" y="270" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">delay  = (T4-T1)-(T3-T2)</text></svg>