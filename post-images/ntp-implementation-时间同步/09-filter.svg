<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"><rect width="1200" height="280" rx="18" fill="#0b1724"/><rect width="1200" height="72" rx="18" fill="#123b5d"/><circle cx="35" cy="36" r="9" fill="#ff6b6b"/><circle cx="65" cy="36" r="9" fill="#ffd166"/><circle cx="95" cy="36" r="9" fill="#06d6a0"/><text x="130" y="44" font-family="Arial" font-size="24" font-weight="bold" fill="white">示意图：clock filter 不是只看最近一次</text><text x="34" y="120" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">sample 1  delay 80ms   offset +4ms   keep</text><text x="34" y="145" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">sample 2  delay 12ms   offset +3ms   best</text><text x="34" y="170" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">sample 3  delay 210ms  offset +9ms   down-weight</text><text x="34" y="195" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">最近 8 个样本 → 选低延迟、低抖动的可信样本</text></svg>