<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255"><rect width="1200" height="255" rx="18" fill="#0b1724"/><rect width="1200" height="72" rx="18" fill="#123b5d"/><circle cx="35" cy="36" r="9" fill="#ff6b6b"/><circle cx="65" cy="36" r="9" fill="#ffd166"/><circle cx="95" cy="36" r="9" fill="#06d6a0"/><text x="130" y="44" font-family="Arial" font-size="24" font-weight="bold" fill="white">示意图：闰秒为什么会伤害应用</text><text x="34" y="120" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">23:59:59 → 23:59:60 → 00:00:00</text><text x="34" y="145" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">应用若假设时间永远递增，可能出现负时长</text><text x="34" y="170" font-family="Consolas,monospace" font-size="15" fill="#d9edf7">leap smear：把 1 秒摊到更长时间里</text></svg>