<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#f4f8fb"/><text x="700" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#14314f">NAND / SSD 价格不是只由一个因素决定</text><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#1b4b6d"><rect x="80" y="225" width="240" height="140" rx="22"/><text x="200" y="285" font-size="29" fill="white">数据中心需求</text><text x="200" y="325" font-size="22" fill="#c6eff1">AI 推理与存储</text><rect x="420" y="225" width="240" height="140" rx="22"/><text x="540" y="285" font-size="29" fill="white">产能与库存</text><text x="540" y="325" font-size="22" fill="#c6eff1">供给调整</text><rect x="760" y="225" width="240" height="140" rx="22"/><text x="880" y="285" font-size="29" fill="white">产品结构</text><text x="880" y="325" font-size="22" fill="#c6eff1">企业级与消费级</text><rect x="1100" y="225" width="240" height="140" rx="22"/><text x="1220" y="285" font-size="29" fill="white">厂商策略</text><text x="1220" y="325" font-size="22" fill="#c6eff1">报价与交期</text></g><g fill="#f19a4a" font-size="46"><text x="365" y="315">+</text><text x="705" y="315">+</text><text x="1045" y="315">+</text></g><path d="M700 420v75" stroke="#f19a4a" stroke-width="8"/><path d="M680 475l20 24 20-24" fill="none" stroke="#f19a4a" stroke-width="8"/><rect x="360" y="530" width="680" height="120" rx="24" fill="#e8f1f6" stroke="#2b7280" stroke-width="4"/><text x="700" y="585" font-size="34" fill="#14314f">最终表现为：SSD / NAND 的价格与供给波动</text><text x="700" y="625" font-size="22" fill="#4f6c82">AI 是重要变量，但不是唯一原因</text></g></svg>
