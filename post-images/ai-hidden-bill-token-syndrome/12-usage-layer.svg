<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#20344d">个人 AI 使用分层</text><g font-family="Arial" text-anchor="middle"><rect x="170" y="170" width="860" height="125" rx="22" fill="#173d5e"/><text x="600" y="225" font-size="31" fill="white">主力层</text><text x="600" y="265" font-size="22" fill="#a9eeeb">稳定、熟悉、覆盖大多数日常任务</text><rect x="250" y="340" width="700" height="125" rx="22" fill="#2b7280"/><text x="600" y="395" font-size="31" fill="white">备用层</text><text x="600" y="435" font-size="22" fill="#d8ffff">故障、限额或特殊能力时切换</text><rect x="340" y="510" width="520" height="125" rx="22" fill="#f09b4a"/><text x="600" y="565" font-size="31" fill="white">实验层</text><text x="600" y="605" font-size="22" fill="#fff6e9">短期试用，定期清理</text></g></svg>
