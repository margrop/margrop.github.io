<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg12)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
    三平台一键部署架构：Windows 11 / Ubuntu 26.04 / macOS 26
  </text>
  <text x="480" y="72" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif" text-anchor="middle">
    零第三方云依赖，原生守护进程封装，支持人工一键执行与自主智能体自动配置
  </text>

  <g transform="translate(40, 100)" font-family="-apple-system, sans-serif">
    <!-- Platform 1: Windows 11 -->
    <g transform="translate(0, 0)">
      <rect width="270" height="330" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="270" height="38" rx="10" fill="#0284c7" opacity="0.3"/>
      <text x="135" y="24" fill="#38bdf8" font-weight="bold" font-size="14" text-anchor="middle">🪟 Windows 11</text>
      
      <g transform="translate(16, 50)" font-size="12" fill="#cbd5e1">
        <text x="0" y="20" fill="#fff" font-weight="bold">脚本形式：</text>
        <text x="0" y="38" font-family="monospace" fill="#38bdf8">deploy_jev_system1.ps1</text>

        <text x="0" y="70" fill="#fff" font-weight="bold">运行环境：</text>
        <text x="0" y="88">PowerShell 7+ / WinGet 原生</text>

        <text x="0" y="120" fill="#fff" font-weight="bold">核心动作：</text>
        <text x="0" y="138">• 自动检测并拉取 Python 3.12+</text>
        <text x="0" y="156">• 部署单次决策推理轻量引擎</text>
        <text x="0" y="174">• 配置 Windows 服务原生自启</text>
        <text x="0" y="192">• 打开环回端口安全决策接口</text>

        <rect x="0" y="220" width="238" height="35" rx="6" fill="#1e293b"/>
        <text x="119" y="242" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">.\deploy_jev_system1.ps1</text>
      </g>
    </g>

    <!-- Platform 2: Ubuntu 26.04 -->
    <g transform="translate(300, 0)">
      <rect width="270" height="330" rx="10" fill="#0f172a" stroke="#ea580c" stroke-width="1.5"/>
      <rect width="270" height="38" rx="10" fill="#ea580c" opacity="0.3"/>
      <text x="135" y="24" fill="#fb923c" font-weight="bold" font-size="14" text-anchor="middle">🐧 Ubuntu 26.04 LTS</text>
      
      <g transform="translate(16, 50)" font-size="12" fill="#cbd5e1">
        <text x="0" y="20" fill="#fff" font-weight="bold">脚本形式：</text>
        <text x="0" y="38" font-family="monospace" fill="#fb923c">deploy_jev_system1.sh</text>

        <text x="0" y="70" fill="#fff" font-weight="bold">运行环境：</text>
        <text x="0" y="88">POSIX Bash / systemd 体系</text>

        <text x="0" y="120" fill="#fff" font-weight="bold">核心动作：</text>
        <text x="0" y="138">• apt 极速无交互配置环境</text>
        <text x="0" y="156">• 编译挂载微秒级决策端点</text>
        <text x="0" y="174">• 注册 systemd 单元守护服务</text>
        <text x="0" y="192">• 开启 Unix Domain Socket 通信</text>

        <rect x="0" y="220" width="238" height="35" rx="6" fill="#1e293b"/>
        <text x="119" y="242" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">sudo bash deploy_jev_system1.sh</text>
      </g>
    </g>

    <!-- Platform 3: macOS 26 -->
    <g transform="translate(600, 0)">
      <rect width="270" height="330" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="270" height="38" rx="10" fill="#a855f7" opacity="0.3"/>
      <text x="135" y="24" fill="#c084fc" font-weight="bold" font-size="14" text-anchor="middle">🍎 macOS 26</text>
      
      <g transform="translate(16, 50)" font-size="12" fill="#cbd5e1">
        <text x="0" y="20" fill="#fff" font-weight="bold">脚本形式：</text>
        <text x="0" y="38" font-family="monospace" fill="#c084fc">deploy_jev_system1.zsh</text>

        <text x="0" y="70" fill="#fff" font-weight="bold">运行环境：</text>
        <text x="0" y="88">Zsh / Apple Silicon Neural Engine</text>

        <text x="0" y="120" fill="#fff" font-weight="bold">核心动作：</text>
        <text x="0" y="138">• 激活 Apple Silicon 神经网络引擎</text>
        <text x="0" y="156">• 部署 LaunchAgent 守护常驻</text>
        <text x="0" y="174">• 暴露本地低延迟 IPC 命名管道</text>
        <text x="0" y="192">• 提供 Swift/Python 双通道桥接</text>

        <rect x="0" y="220" width="238" height="35" rx="6" fill="#1e293b"/>
        <text x="119" y="242" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">zsh deploy_jev_system1.zsh</text>
      </g>
    </g>
  </g>
</svg>