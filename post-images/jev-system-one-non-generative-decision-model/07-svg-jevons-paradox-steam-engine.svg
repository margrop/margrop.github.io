<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg7)" rx="16"/>

  <text x="480" y="46" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
    以经济学史命名：为什么模型叫 Jev？—— 杰文斯悖论（Jevons Paradox）
  </text>
  <text x="480" y="76" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif" text-anchor="middle">
    资源使用效率的巨幅提升，不仅不会减少总消耗，反而会因应用场景泛化而带来指数级爆发
  </text>

  <!-- Left: 1865 Steam & Coal -->
  <g transform="translate(50, 110)">
    <rect width="410" height="320" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="205" y="32" fill="#fbbf24" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
      1865 年：瓦特蒸汽机与煤炭
    </text>

    <g transform="translate(24, 60)" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
      <text x="0" y="20" fill="#fff" font-weight="bold">🚂 现象：</text>
      <text x="0" y="42">瓦特改进冷凝器，蒸汽机燃煤效率暴涨数倍。</text>
      
      <text x="0" y="80" fill="#fff" font-weight="bold">📉 传统预测：</text>
      <text x="0" y="102">机器更省煤了，英国煤炭总消耗量应该会减少。</text>

      <text x="0" y="140" fill="#fff" font-weight="bold">💥 真实结果（杰文斯发现）：</text>
      <text x="0" y="162">动力成本暴降使得火车、轮船、纺织厂全面装上蒸汽机！</text>
      <text x="0" y="184" fill="#fbbf24" font-weight="bold">英国煤炭总消耗量不仅没降，反而暴涨数百倍！</text>
    </g>
  </g>

  <!-- Right: 2026 Jev & AI Compute -->
  <g transform="translate(500, 110)">
    <rect width="410" height="320" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="205" y="32" fill="#38bdf8" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
      2026 年：Jev 决策模型与智能总需求
    </text>

    <g transform="translate(24, 60)" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
      <text x="0" y="20" fill="#fff" font-weight="bold">⚡ 现象：</text>
      <text x="0" y="42">Jev 砍掉无用文本，单次决策推理成本下降 444 倍。</text>
      
      <text x="0" y="80" fill="#fff" font-weight="bold">📉 浅层认知：</text>
      <text x="0" y="102">开发者调用更少 Token，GPU 算力市场会萎缩？</text>

      <text x="0" y="140" fill="#fff" font-weight="bold">🚀 真实结果（Jev 时代的 AI 爆炸）：</text>
      <text x="0" y="162">毫秒级决策让 AI 嵌入每一个 if-else 语句、内网路由与游戏引擎！</text>
      <text x="0" y="184" fill="#38bdf8" font-weight="bold">AI 决策调用频次从每天几次飙升至每秒万次！</text>
    </g>
  </g>
</svg>