<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg9)" rx="16"/>

  <text x="480" y="40" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
    底层硬核技术架构剖析：自回归解码循环 vs 单次前向并行决策头
  </text>
  <text x="480" y="68" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif" text-anchor="middle">
    为什么 Jev 能够以 70ms 彻底甩开通用大模型？
  </text>

  <!-- Top: Autoregressive LLM Loop -->
  <g transform="translate(40, 90)">
    <rect width="880" height="150" rx="10" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="28" fill="#f87171" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif">
      传统生成模型：自回归循环解码（N 步推理，逐 Token 依赖）
    </text>

    <!-- Flow -->
    <g transform="translate(20, 50)" font-family="monospace" font-size="11">
      <rect x="0" y="10" width="120" height="50" rx="6" fill="#1f2937" stroke="#4b5563"/>
      <text x="60" y="40" fill="#fff" text-anchor="middle">Prompt 状态</text>

      <path d="M 125 35 L 165 35" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="170" y="10" width="130" height="50" rx="6" fill="#1f2937" stroke="#4b5563"/>
      <text x="235" y="40" fill="#fff" text-anchor="middle">Forward Pass 1</text>

      <path d="M 305 35 L 345 35" stroke="#ef4444" stroke-width="2"/>

      <rect x="350" y="10" width="120" height="50" rx="6" fill="#374151" stroke="#ef4444"/>
      <text x="410" y="40" fill="#fca5a5" text-anchor="middle">Token 1 "{"</text>

      <path d="M 475 35 L 515 35" stroke="#ef4444" stroke-width="2"/>

      <rect x="520" y="10" width="130" height="50" rx="6" fill="#1f2937" stroke="#4b5563"/>
      <text x="585" y="40" fill="#fff" text-anchor="middle">Forward Pass 2</text>

      <path d="M 655 35 L 695 35" stroke="#ef4444" stroke-width="2"/>

      <rect x="700" y="10" width="150" height="50" rx="6" fill="#374151" stroke="#ef4444"/>
      <text x="775" y="32" fill="#fca5a5" text-anchor="middle">... 循环 50~200 步 ...</text>
      <text x="775" y="50" fill="#94a3b8" text-anchor="middle">延迟 3000ms+</text>
    </g>
    <text x="20" y="135" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">
      每个字符的生成都受上一个字符约束，内存墙导致带宽饱和，容易出现语法截断与非法 JSON。
    </text>
  </g>

  <!-- Bottom: Jev Parallel Decision Head -->
  <g transform="translate(40, 260)">
    <rect width="880" height="190" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="28" fill="#38bdf8" font-size="14" font-weight="bold" font-family="-apple-system, sans-serif">
      Jev / NanoJev：单次前向传播 + 并行分类决策头（Parallel Decision Heads）
    </text>

    <!-- Architecture flow -->
    <g transform="translate(20, 50)" font-family="monospace" font-size="11">
      <rect x="0" y="15" width="140" height="70" rx="6" fill="#0369a1" stroke="#38bdf8"/>
      <text x="70" y="45" fill="#fff" text-anchor="middle" font-weight="bold">非结构化状态</text>
      <text x="70" y="65" fill="#bae6fd" text-anchor="middle">(State Text/Data)</text>

      <path d="M 145 50 L 195 50" stroke="#38bdf8" stroke-width="2"/>

      <rect x="200" y="10" width="180" height="80" rx="6" fill="#0c4a6e" stroke="#0284c7"/>
      <text x="290" y="42" fill="#fff" text-anchor="middle" font-weight="bold">Transformer 骨干网络</text>
      <text x="290" y="62" fill="#93c5fd" text-anchor="middle">提取深层隐藏状态向量</text>
      <text x="290" y="78" fill="#38bdf8" text-anchor="middle">Hidden State H</text>

      <!-- Forking into parallel heads -->
      <path d="M 385 50 L 440 25" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 385 50 L 440 50" stroke="#38bdf8" stroke-width="2"/>
      <path d="M 385 50 L 440 75" stroke="#38bdf8" stroke-width="2"/>

      <!-- Decision heads -->
      <rect x="445" y="10" width="180" height="26" rx="4" fill="#1e293b" stroke="#38bdf8"/>
      <text x="535" y="27" fill="#38bdf8" text-anchor="middle">决策头 A: 路由分类 Softmax</text>

      <rect x="445" y="40" width="180" height="26" rx="4" fill="#1e293b" stroke="#38bdf8"/>
      <text x="535" y="57" fill="#38bdf8" text-anchor="middle">决策头 B: 风险打分 Sigmoid</text>

      <rect x="445" y="70" width="180" height="26" rx="4" fill="#1e293b" stroke="#38bdf8"/>
      <text x="535" y="87" fill="#38bdf8" text-anchor="middle">决策头 C: 布尔拦截判定</text>

      <path d="M 630 50 L 670 50" stroke="#4ade80" stroke-width="2"/>

      <rect x="675" y="10" width="175" height="80" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="762" y="38" fill="#6ee7b7" text-anchor="middle" font-weight="bold">确定性概率分布</text>
      <text x="762" y="58" fill="#fff" text-anchor="middle">70ms 一次性并发出</text>
      <text x="762" y="76" fill="#a7f3d0" text-anchor="middle">类型绝对安全 (0 幻觉)</text>
    </g>
    <text x="20" y="170" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif">
      采用 RLCD（校准强化学习）端到端训练，输出的不仅是选择，更是具有数学校准精度的置信度指标。
    </text>
  </g>
</svg>