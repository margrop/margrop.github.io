<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="jevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad)" rx="16"/>

  <text x="480" y="48" fill="#f8fafc" font-size="24" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
    通俗大比方：话痨服务员（传统大模型） vs 极速红绿灯（Jev 决策模型）
  </text>
  <text x="480" y="78" fill="#94a3b8" font-size="14" font-family="-apple-system, sans-serif" text-anchor="middle">
    小学生都能听懂的核心差异：为什么软件自动化不需要会吟诗作赋的 AI？
  </text>

  <!-- Left: Traditional LLM (Chatty Waiter) -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="420" height="330" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect width="420" height="40" rx="12" fill="url(#llmGrad)" opacity="0.2"/>
    <text x="210" y="26" fill="#fca5a5" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
      传统自回归大模型（话痨服务员）
    </text>

    <!-- Icon / Metaphor representation -->
    <circle cx="210" cy="85" r="30" fill="#374151"/>
    <text x="210" y="93" font-size="28" text-anchor="middle">🤵</text>

    <!-- Dialogue Box -->
    <rect x="25" y="130" width="370" height="85" rx="8" fill="#1f2937" stroke="#4b5563"/>
    <text x="35" y="155" fill="#f8fafc" font-size="13" font-family="monospace">提问: "这个 VIP 客户该放行吗？"</text>
    <text x="35" y="180" fill="#f87171" font-size="12" font-family="monospace">服务员: "您好！非常荣幸为您服务，根据您</text>
    <text x="35" y="200" fill="#f87171" font-size="12" font-family="monospace">提供的上下文，我认为JSON格式如下```json{"allow...</text>

    <g transform="translate(25, 230)">
      <text x="0" y="20" fill="#ef4444" font-size="13" font-weight="bold">⏱ 反应耗时：3,000ms ~ 15,000ms（逐字吐出废话）</text>
      <text x="0" y="45" fill="#ef4444" font-size="13" font-weight="bold">💰 产生费用：必须为生成的上百个文字买单</text>
      <text x="0" y="70" fill="#ef4444" font-size="13" font-weight="bold">⚠️ 致命隐患：可能手抖少打一个引号导致程序崩溃！</text>
    </g>
  </g>

  <!-- Right: Jev System One (Smart Traffic Light) -->
  <g transform="translate(500, 110)" filter="url(#shadow)">
    <rect width="420" height="330" rx="12" fill="#111827" stroke="#0284c7" stroke-width="2"/>
    <rect width="420" height="40" rx="12" fill="url(#jevGrad)" opacity="0.2"/>
    <text x="210" y="26" fill="#38bdf8" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
      Jev 决策大模型（智能电子闸机）
    </text>

    <!-- Icon / Metaphor representation -->
    <circle cx="210" cy="85" r="30" fill="#0369a1"/>
    <text x="210" y="93" font-size="28" text-anchor="middle">🚥</text>

    <!-- Signal Box -->
    <rect x="25" y="130" width="370" height="85" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
    <text x="35" y="155" fill="#f8fafc" font-size="13" font-family="monospace">输入: [客户状态与预设权限选项]</text>
    <text x="35" y="185" fill="#4ade80" font-size="14" font-weight="bold" font-family="monospace">输出: [放行: 99.2% | 拦截: 0.8%]</text>
    <text x="35" y="205" fill="#93c5fd" font-size="11" font-family="monospace">（一个废字都不吐，直出高置信度结构化概率）</text>

    <g transform="translate(25, 230)">
      <text x="0" y="20" fill="#38bdf8" font-size="13" font-weight="bold">⚡ 反应耗时：70ms ~ 100ms（如条件反射般瞬间亮灯）</text>
      <text x="0" y="45" fill="#38bdf8" font-size="13" font-weight="bold">📉 产生费用：输出 Token 为 0，成本暴跌 444 倍</text>
      <text x="0" y="70" fill="#38bdf8" font-size="13" font-weight="bold">🛡 数学保证：绝不可能亮出紫色或输出畸形语法！</text>
    </g>
  </g>
</svg>