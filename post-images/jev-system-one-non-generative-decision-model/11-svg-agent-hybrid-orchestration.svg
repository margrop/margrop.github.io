<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg11)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
    工程实践：工业级混合智能体协作架构（Hybrid Agent Orchestration）
  </text>
  <text x="480" y="72" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif" text-anchor="middle">
    Jev 充当超高速前置路由与安全护栏，通用 LLM 专攻复杂长尾推理与富文本生成
  </text>

  <g transform="translate(60, 100)" font-family="-apple-system, sans-serif">
    <!-- User Input -->
    <rect x="0" y="110" width="140" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="142" fill="#fff" text-anchor="middle" font-weight="bold" font-size="14">用户/业务请求</text>
    <text x="70" y="162" fill="#94a3b8" text-anchor="middle" font-size="11">高并发流量入口</text>

    <!-- Arrow to Jev -->
    <path d="M 145 145 L 205 145" stroke="#38bdf8" stroke-width="2"/>

    <!-- Fast Gate: Jev -->
    <rect x="210" y="60" width="220" height="170" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <rect x="210" y="60" width="220" height="34" rx="12" fill="#0284c7" opacity="0.4"/>
    <text x="320" y="83" fill="#fff" font-weight="bold" font-size="13" text-anchor="middle">⚡ 快系统（Jev 决策中枢）</text>
    <text x="320" y="115" fill="#38bdf8" font-size="12" text-anchor="middle">• 意图分类 (70ms)</text>
    <text x="320" y="135" fill="#38bdf8" font-size="12" text-anchor="middle">• 安全护栏 / 越狱拦截</text>
    <text x="320" y="155" fill="#38bdf8" font-size="12" text-anchor="middle">• 工具调用置信度评估</text>
    <text x="320" y="195" fill="#4ade80" font-weight="bold" font-size="12" text-anchor="middle">85% 的请求在 80ms 内决断！</text>

    <!-- Branch A: Direct Execution -->
    <path d="M 435 110 L 530 110" stroke="#4ade80" stroke-width="2"/>
    <text x="480" y="102" fill="#4ade80" font-size="11" text-anchor="middle">置信度 &gt; 90%</text>

    <rect x="535" y="70" width="240" height="80" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="655" y="105" fill="#6ee7b7" font-weight="bold" font-size="14" text-anchor="middle">直接触发自动化工作流</text>
    <text x="655" y="128" fill="#a7f3d0" font-size="11" text-anchor="middle">执行微服务调用、数据分流或缓存响应</text>

    <!-- Branch B: Slow Reasoner -->
    <path d="M 320 235 L 320 290 L 530 290" stroke="#a855f7" stroke-width="2"/>
    <text x="420" y="280" fill="#c084fc" font-size="11" text-anchor="middle">复杂歧义 / 创造性需求</text>

    <rect x="535" y="250" width="240" height="80" rx="8" fill="#2e1065" stroke="#a855f7"/>
    <text x="655" y="285" fill="#d8b4fe" font-weight="bold" font-size="14" text-anchor="middle">慢系统：通用大模型</text>
    <text x="655" y="308" fill="#e9d5ff" font-size="11" text-anchor="middle">Claude 3.7 / GPT-5 (深度长文生成)</text>

    <!-- Aggregator -->
    <path d="M 780 110 L 830 145" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 780 290 L 830 185" stroke="#64748b" stroke-width="1.5"/>
    <rect x="835" y="125" width="90" height="60" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="880" y="160" fill="#fff" font-size="12" text-anchor="middle">最终交付</text>
  </g>
</svg>