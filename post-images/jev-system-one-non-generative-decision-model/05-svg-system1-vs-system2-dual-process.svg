<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg5)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
    双系统认知理论在人工智能中的映射：System 1 直觉 vs System 2 深思
  </text>
  <text x="480" y="72" fill="#94a3b8" font-size="13" font-family="-apple-system, sans-serif" text-anchor="middle">
    卡尼曼《思考，快与慢》哲学在软件智能架构中的完美工程落地
  </text>

  <!-- Left: System 1 (Jev) -->
  <g transform="translate(50, 100)">
    <rect width="410" height="340" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="410" height="46" rx="12" fill="#0284c7" opacity="0.25"/>
    <text x="205" y="30" fill="#38bdf8" font-size="17" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
      System 1：直觉反射（Jev 决策模型）
    </text>

    <g transform="translate(24, 70)" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
      <text x="0" y="20" fill="#fff" font-weight="bold">🧠 人脑类比：</text>
      <text x="0" y="42">守门员扑点球的下意识飞扑、火烧手指的瞬间缩回</text>
      
      <text x="0" y="80" fill="#fff" font-weight="bold">⚙️ 模型计算本质：</text>
      <text x="0" y="102">单次前向传播（Single Forward Pass）</text>
      <text x="0" y="122">直接在 Hidden States 上做决策投影，无循环解码</text>

      <text x="0" y="160" fill="#fff" font-weight="bold">🎯 核心使命：</text>
      <text x="0" y="182">智能体路由（Routing）、垃圾过滤、风险分级、微服务决策</text>

      <text x="0" y="220" fill="#fff" font-weight="bold">📊 关键指标：</text>
      <text x="0" y="242" fill="#38bdf8" font-weight="bold">• 延迟：70ms ~ 100ms</text>
      <text x="0" y="262" fill="#38bdf8" font-weight="bold">• 成本：$0.042 / 百万 Token（输出免费）</text>
    </g>
  </g>

  <!-- Right: System 2 (Traditional LLM) -->
  <g transform="translate(500, 100)">
    <rect width="410" height="340" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="410" height="46" rx="12" fill="#7c3aed" opacity="0.25"/>
    <text x="205" y="30" fill="#c084fc" font-size="17" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">
      System 2：深思熟虑（传统生成式 LLM）
    </text>

    <g transform="translate(24, 70)" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
      <text x="0" y="20" fill="#fff" font-weight="bold">🧠 人脑类比：</text>
      <text x="0" y="42">草稿纸上手算微积分证明、创作一部悬疑长篇小说</text>
      
      <text x="0" y="80" fill="#fff" font-weight="bold">⚙️ 模型计算本质：</text>
      <text x="0" y="102">自回归迭代（Autoregressive Decoding Loop）</text>
      <text x="0" y="122">每吐出一个 Token 重算一次 Attention，耗尽 GPU 算力</text>

      <text x="0" y="160" fill="#fff" font-weight="bold">🎯 核心使命：</text>
      <text x="0" y="182">长文撰写、复杂架构设计、头脑风暴、人机情感对话</text>

      <text x="0" y="220" fill="#fff" font-weight="bold">📊 关键指标：</text>
      <text x="0" y="242" fill="#c084fc" font-weight="bold">• 延迟：3,000ms ~ 300,000ms</text>
      <text x="0" y="262" fill="#c084fc" font-weight="bold">• 成本：$2.00 ~ $25.00 / 百万 Token</text>
    </g>
  </g>
</svg>