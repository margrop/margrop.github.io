<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">OMP configuration precedence</title><desc id="desc">Original bilingual layered diagram of defaults, global config, project config, overlays, and runtime flags.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#09090f"/><stop offset="1" stop-color="#15111f"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="720" y="72" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#fff">配置像五层衣服：越靠外，优先级越高</text>
  <text x="720" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#a5b4fc">OMP configuration precedence — outer layers win</text>
  <g filter="url(#s)" font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(170 166)"><rect width="1100" height="550" rx="42" fill="#23172d" stroke="#7e22ce" stroke-width="3"/><text x="42" y="50" font-size="20" font-weight="700" fill="#f0abfc">⑤ 运行参数 / RUNTIME FLAGS</text><text x="1055" y="50" text-anchor="end" font-size="16" fill="#d8b4fe">--model · --approval-mode · --config</text></g>
    <g transform="translate(230 238)"><rect width="980" height="430" rx="36" fill="#21182f" stroke="#c026d3" stroke-width="3"/><text x="38" y="48" font-size="20" font-weight="700" fill="#f5d0fe">④ 临时覆盖 / OVERLAYS</text><text x="938" y="48" text-anchor="end" font-size="16" fill="#e879f9">PI_CONFIG_FILES · repeated --config</text></g>
    <g transform="translate(290 310)"><rect width="860" height="310" rx="30" fill="#172238" stroke="#2563eb" stroke-width="3"/><text x="36" y="48" font-size="20" font-weight="700" fill="#bfdbfe">③ 项目配置 / PROJECT</text><text x="824" y="48" text-anchor="end" font-family="Consolas,monospace" font-size="16" fill="#93c5fd">&lt;repo&gt;/.omp/config.yml</text></g>
    <g transform="translate(350 382)"><rect width="740" height="190" rx="25" fill="#17302d" stroke="#14b8a6" stroke-width="3"/><text x="34" y="46" font-size="20" font-weight="700" fill="#ccfbf1">② 全局 / GLOBAL</text><text x="706" y="46" text-anchor="end" font-family="Consolas,monospace" font-size="16" fill="#99f6e4">~/.omp/agent/config.yml</text></g>
    <g transform="translate(410 454)"><rect width="620" height="70" rx="20" fill="#273244" stroke="#64748b" stroke-width="3"/><text x="310" y="43" text-anchor="middle" font-size="20" font-weight="700" fill="#e2e8f0">① 内置默认值 / BUILT-IN DEFAULTS</text></g>
  </g>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><rect x="238" y="742" width="964" height="46" rx="12" fill="#2a1933"/><text x="720" y="771" text-anchor="middle" font-size="18" fill="#f5d0fe">对象会深度合并；数组整组替换，不会自动追加  ·  Objects merge; arrays replace</text></g>
</svg>
