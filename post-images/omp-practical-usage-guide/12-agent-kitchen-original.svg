<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Subagents as a restaurant kitchen</title><desc id="desc">Original bilingual analogy diagram comparing the main agent to a head chef coordinating specialist subagents.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".14"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="720" y="72" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#3f261c">子代理像后厨：主厨不必亲手切每一棵葱</text>
  <text x="720" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#9a3412">The main agent coordinates specialists, reconciles results, and owns delivery</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" filter="url(#s)">
    <g transform="translate(70 205)"><rect width="260" height="320" rx="28" fill="#fff" stroke="#f97316" stroke-width="3"/><circle cx="130" cy="78" r="48" fill="#ffedd5"/><path d="M91 77h78M103 62h54M112 47h36" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/><text x="130" y="149" text-anchor="middle" font-size="25" font-weight="800" fill="#7c2d12">主代理</text><text x="130" y="177" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">HEAD CHEF</text><text x="130" y="216" text-anchor="middle" font-size="17" fill="#78350f">拆任务 · 定边界</text><text x="130" y="246" text-anchor="middle" font-size="17" fill="#78350f">看进度 · 解冲突</text><text x="130" y="276" text-anchor="middle" font-size="17" fill="#78350f">复核证据 · 交付</text></g>
    <g transform="translate(470 160)"><rect width="250" height="150" rx="22" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="125" y="49" text-anchor="middle" font-size="24" font-weight="800" fill="#1d4ed8">SCOUT</text><text x="125" y="82" text-anchor="middle" font-size="17" fill="#475569">探路：目录、调用链、风险</text><text x="125" y="112" text-anchor="middle" font-size="15" fill="#64748b">Explore before changing</text></g>
    <g transform="translate(790 160)"><rect width="250" height="150" rx="22" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><text x="125" y="49" text-anchor="middle" font-size="24" font-weight="800" fill="#6d28d9">LIBRARIAN</text><text x="125" y="82" text-anchor="middle" font-size="17" fill="#475569">查证：上游文档与 API</text><text x="125" y="112" text-anchor="middle" font-size="15" fill="#64748b">Source-verified research</text></g>
    <g transform="translate(470 390)"><rect width="250" height="150" rx="22" fill="#fff" stroke="#22c55e" stroke-width="3"/><text x="125" y="49" text-anchor="middle" font-size="24" font-weight="800" fill="#15803d">TASK</text><text x="125" y="82" text-anchor="middle" font-size="17" fill="#475569">执行：实现、测试、产物</text><text x="125" y="112" text-anchor="middle" font-size="15" fill="#64748b">Bounded implementation</text></g>
    <g transform="translate(790 390)"><rect width="250" height="150" rx="22" fill="#fff" stroke="#ef4444" stroke-width="3"/><text x="125" y="49" text-anchor="middle" font-size="24" font-weight="800" fill="#b91c1c">REVIEWER</text><text x="125" y="82" text-anchor="middle" font-size="17" fill="#475569">质检：只看 diff 和证据</text><text x="125" y="112" text-anchor="middle" font-size="15" fill="#64748b">Independent review</text></g>
    <g transform="translate(1120 205)"><rect width="250" height="320" rx="28" fill="#fff" stroke="#0f766e" stroke-width="3"/><rect x="42" y="48" width="166" height="112" rx="14" fill="#ccfbf1"/><path d="M68 83h114M68 108h88M68 133h102" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/><text x="125" y="206" text-anchor="middle" font-size="25" font-weight="800" fill="#115e59">出餐 / DELIVERY</text><text x="125" y="245" text-anchor="middle" font-size="17" fill="#475569">一份统一结论</text><text x="125" y="275" text-anchor="middle" font-size="17" fill="#475569">可追溯证据</text></g>
  </g>
  <g fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#a)"><path d="M330 285C390 285 410 235 460 235"/><path d="M330 330C430 330 650 235 780 235"/><path d="M330 400C400 400 420 465 460 465"/><path d="M330 445C500 445 620 465 780 465"/><path d="M1040 235C1090 235 1095 285 1110 285"/><path d="M1040 465C1090 465 1095 425 1110 425"/></g>
  <g font-family="Arial,'Microsoft YaHei',sans-serif"><rect x="180" y="650" width="1080" height="92" rx="20" fill="#3f261c"/><text x="720" y="686" text-anchor="middle" font-size="19" fill="#ffedd5">适合并行：互相独立、边界清楚、结果可合并</text><text x="720" y="718" text-anchor="middle" font-size="17" fill="#fed7aa">Avoid delegation when tasks write the same files or require constant shared decisions</text></g>
</svg>
