<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OMP from chat to engineering delivery</title>
  <desc id="desc">Original bilingual cover showing a prompt becoming a plan, parallel agents, code changes, tests, and a verified delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070b"/><stop offset="0.55" stop-color="#11101a"/><stop offset="1" stop-color="#200b25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="0.52" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d946ef"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1340" cy="120" r="220" fill="#a855f7" opacity=".12" filter="url(#glow)"/>
  <circle cx="210" cy="790" r="210" fill="#0891b2" opacity=".12" filter="url(#glow)"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="112" y="115" font-size="28" font-weight="700" letter-spacing="6" fill="#f0abfc">OMP PRACTICAL GUIDE</text>
    <text x="112" y="224" font-size="78" font-weight="800" fill="#fff">装完只会聊天？</text>
    <text x="112" y="310" font-size="62" font-weight="750" fill="url(#accent)">从一句 Prompt 到可验证交付</text>
    <text x="116" y="365" font-size="26" fill="#cbd5e1">PLAN · SUBAGENTS · LSP / DAP · SESSIONS · MEMORY · SAFETY</text>
  </g>
  <g transform="translate(112 432)">
    <rect width="1376" height="360" rx="24" fill="#0a0a0f" stroke="#3f3f4a" stroke-width="2"/>
    <rect width="1376" height="54" rx="24" fill="#181821"/><rect y="30" width="1376" height="24" fill="#181821"/>
    <circle cx="31" cy="27" r="7" fill="#fb7185"/><circle cx="56" cy="27" r="7" fill="#facc15"/><circle cx="81" cy="27" r="7" fill="#4ade80"/>
    <text x="112" y="35" font-family="Consolas,monospace" font-size="17" fill="#94a3b8">omp — project workspace</text>
    <g transform="translate(46 92)" font-family="Arial, 'Microsoft YaHei', sans-serif">
      <rect width="224" height="92" rx="14" fill="#21142b" stroke="#c026d3"/><text x="112" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#f5d0fe">目标 + 边界</text><text x="112" y="68" text-anchor="middle" font-size="15" fill="#d8b4fe">OUTCOME</text>
      <line x1="230" y1="46" x2="305" y2="46" stroke="#d946ef" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="318" width="224" height="92" rx="14" fill="#1c1730" stroke="#8b5cf6"/><text x="430" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#ddd6fe">只读计划</text><text x="430" y="68" text-anchor="middle" font-size="15" fill="#c4b5fd">PLAN</text>
      <line x1="548" y1="46" x2="623" y2="46" stroke="#d946ef" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="636" width="224" height="92" rx="14" fill="#111f2d" stroke="#06b6d4"/><text x="748" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#cffafe">并行分工</text><text x="748" y="68" text-anchor="middle" font-size="15" fill="#67e8f9">AGENTS</text>
      <line x1="866" y1="46" x2="941" y2="46" stroke="#d946ef" stroke-width="4" marker-end="url(#arrow)"/>
      <rect x="954" width="224" height="92" rx="14" fill="#14251f" stroke="#22c55e"/><text x="1066" y="39" text-anchor="middle" font-size="20" font-weight="700" fill="#dcfce7">验证交付</text><text x="1066" y="68" text-anchor="middle" font-size="15" fill="#86efac">VERIFY</text>
      <path d="M112 125v70h954v-70" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 7"/>
      <g transform="translate(174 194)" font-family="Consolas,monospace" font-size="17">
        <text x="0" y="0" fill="#94a3b8">$</text><text x="26" y="0" fill="#f8fafc">inspect → edit → diagnostics → focused tests → diff → summary</text>
        <rect x="0" y="31" width="872" height="44" rx="8" fill="#13131a" stroke="#31313b"/>
        <text x="19" y="59" fill="#4ade80">✓ 3 files changed   ✓ tests passed   ✓ remaining risks reported</text>
      </g>
    </g>
  </g>
  <text x="1488" y="850" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Original illustration · 2026</text>
</svg>
