<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Context, sessions, compaction, and memory</title><desc id="desc">Original bilingual analogy using a school bag, notebook, summary card, and archive to explain four OMP concepts.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".13"/></filter></defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="720" y="74" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#172033">四个都像“记东西”，但不是同一个抽屉</text>
  <text x="720" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Context, sessions, compaction, and memory solve different continuity problems</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" filter="url(#s)">
    <g transform="translate(70 185)"><rect width="300" height="430" rx="26" fill="#fff" stroke="#3b82f6" stroke-width="3"/><path d="M92 82q58-52 116 0v128H92Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><path d="M113 82q0-47 37-47t37 47" fill="none" stroke="#2563eb" stroke-width="7"/><text x="150" y="267" text-anchor="middle" font-size="26" font-weight="800" fill="#1d4ed8">上下文文件</text><text x="150" y="299" text-anchor="middle" font-size="16" fill="#2563eb">CONTEXT FILES</text><text x="150" y="342" text-anchor="middle" font-size="17" fill="#475569">每天上学前装进书包</text><text x="150" y="374" text-anchor="middle" font-size="17" fill="#475569">项目规则与做事方法</text><text x="150" y="406" text-anchor="middle" font-size="15" fill="#64748b">AGENTS.md · RULES.md</text></g>
    <g transform="translate(403 185)"><rect width="300" height="430" rx="26" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><rect x="80" y="42" width="140" height="174" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/><path d="M110 82h80M110 115h80M110 148h58" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/><text x="150" y="267" text-anchor="middle" font-size="26" font-weight="800" fill="#6d28d9">会话</text><text x="150" y="299" text-anchor="middle" font-size="16" fill="#7c3aed">SESSIONS</text><text x="150" y="342" text-anchor="middle" font-size="17" fill="#475569">这一本完整课堂笔记</text><text x="150" y="374" text-anchor="middle" font-size="17" fill="#475569">可续聊、分支、导出</text><text x="150" y="406" text-anchor="middle" font-size="15" fill="#64748b">resume · branch · fork</text></g>
    <g transform="translate(736 185)"><rect width="300" height="430" rx="26" fill="#fff" stroke="#f59e0b" stroke-width="3"/><rect x="62" y="55" width="176" height="142" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="5"/><path d="M91 91h118M91 123h92M91 155h106" stroke="#d97706" stroke-width="7" stroke-linecap="round"/><text x="150" y="267" text-anchor="middle" font-size="26" font-weight="800" fill="#b45309">压缩</text><text x="150" y="299" text-anchor="middle" font-size="16" fill="#d97706">COMPACTION</text><text x="150" y="342" text-anchor="middle" font-size="17" fill="#475569">把这节课写成摘要卡</text><text x="150" y="374" text-anchor="middle" font-size="17" fill="#475569">省当前会话的上下文</text><text x="150" y="406" text-anchor="middle" font-size="15" fill="#64748b">shortens one conversation</text></g>
    <g transform="translate(1069 185)"><rect width="300" height="430" rx="26" fill="#fff" stroke="#22c55e" stroke-width="3"/><path d="M70 74h160v124H70Z" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><path d="M88 51h124v23H88ZM90 105h120M90 137h86M90 169h104" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/><text x="150" y="267" text-anchor="middle" font-size="26" font-weight="800" fill="#15803d">记忆</text><text x="150" y="299" text-anchor="middle" font-size="16" fill="#16a34a">MEMORY</text><text x="150" y="342" text-anchor="middle" font-size="17" fill="#475569">跨学期留下的档案</text><text x="150" y="374" text-anchor="middle" font-size="17" fill="#475569">偏好、决策、长期知识</text><text x="150" y="406" text-anchor="middle" font-size="15" fill="#64748b">off by default</text></g>
  </g>
  <rect x="170" y="676" width="1100" height="76" rx="18" fill="#172033"/><text x="720" y="707" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" fill="#dbeafe">先写清 Context，再管理 Session；长对话交给 Compaction，确需跨会话才开启 Memory</text><text x="720" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#cbd5e1">Keep durable rules explicit; do not use memory as a substitute for project documentation</text>
</svg>
