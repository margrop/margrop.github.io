<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">A reliable OMP task loop</title><desc id="desc">Original bilingual workflow diagram: outcome, boundaries, inspect, plan, act, verify, review, resume.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b5cf6"/></marker></defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="720" y="78" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="38" font-weight="800" fill="#172033">靠谱的一轮，不是“问完等答案”</text>
  <text x="720" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#64748b">A reliable OMP loop is a reviewable delivery pipeline</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" filter="url(#s)">
    <g transform="translate(90 190)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#a855f7" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#f3e8ff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#9333ea">1</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">说清结果</text><text x="80" y="76" font-size="15" fill="#7e22ce">OUTCOME</text><text x="25" y="108" font-size="16" fill="#475569">要什么，而不是“帮我看看”</text></g>
    <g transform="translate(425 190)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#ec4899" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#fce7f3"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#db2777">2</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">圈定边界</text><text x="80" y="76" font-size="15" fill="#be185d">BOUNDARIES</text><text x="25" y="108" font-size="16" fill="#475569">可改、不可改、何时停</text></g>
    <g transform="translate(760 190)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#e0f2fe"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#0284c7">3</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">先查再动</text><text x="80" y="76" font-size="15" fill="#0369a1">INSPECT / PLAN</text><text x="25" y="108" font-size="16" fill="#475569">复杂任务先用只读 Plan</text></g>
    <g transform="translate(1095 190)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#14b8a6" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#ccfbf1"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#0f766e">4</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">小步执行</text><text x="80" y="76" font-size="15" fill="#0f766e">ACT</text><text x="25" y="108" font-size="16" fill="#475569">最小修改，随时可打断</text></g>
    <g transform="translate(90 485)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#f59e0b" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#fef3c7"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#d97706">8</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">续聊或分叉</text><text x="80" y="76" font-size="15" fill="#b45309">RESUME / FORK</text><text x="25" y="108" font-size="16" fill="#475569">保留证据，换路线不丢历史</text></g>
    <g transform="translate(425 485)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#64748b" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#e2e8f0"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#475569">7</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">人来复核</text><text x="80" y="76" font-size="15" fill="#475569">REVIEW</text><text x="25" y="108" font-size="16" fill="#475569">看 diff、证据和剩余风险</text></g>
    <g transform="translate(760 485)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#22c55e" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#dcfce7"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#16a34a">6</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">拿出证据</text><text x="80" y="76" font-size="15" fill="#15803d">VERIFY</text><text x="25" y="108" font-size="16" fill="#475569">测试、诊断、运行结果</text></g>
    <g transform="translate(1095 485)"><rect width="250" height="128" rx="20" fill="#fff" stroke="#6366f1" stroke-width="3"/><circle cx="42" cy="42" r="22" fill="#e0e7ff"/><text x="42" y="50" text-anchor="middle" font-size="22" font-weight="800" fill="#4f46e5">5</text><text x="80" y="46" font-size="23" font-weight="750" fill="#172033">观察过程</text><text x="80" y="76" font-size="15" fill="#4338ca">STEER / STOP</text><text x="25" y="108" font-size="16" fill="#475569">偏航就纠正，不必等到底</text></g>
  </g>
  <g fill="none" stroke="#8b5cf6" stroke-width="4" marker-end="url(#a)"><path d="M340 254H415"/><path d="M675 254H750"/><path d="M1010 254h75"/><path d="M1220 328v145"/><path d="M1095 549h-75"/><path d="M760 549h-75"/><path d="M425 549h-75"/><path d="M215 485V342"/></g>
  <rect x="274" y="681" width="892" height="72" rx="18" fill="#172033"/><text x="720" y="712" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#e9d5ff">目标 + 范围 + 禁区 + 验证方式 + 停止条件</text><text x="720" y="739" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#cbd5e1">Outcome + scope + constraints + verification + stopping condition</text>
</svg>
