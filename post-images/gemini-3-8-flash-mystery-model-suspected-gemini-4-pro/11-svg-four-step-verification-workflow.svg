<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="440" fill="url(#bg4)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    开发者自测指南：四步探针锁定“披皮”神秘模型
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    The 4-Step Verification Pipeline to Detect Canary Frontier Routing
  </text>

  <!-- 4 Step Boxes Horizontally -->
  <!-- Step 1 -->
  <g transform="translate(40, 110)">
    <rect width="195" height="260" rx="10" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="32" cy="32" r="16" fill="#0284c7"/>
    <text x="32" y="38" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">1</text>
    <text x="60" y="37" fill="#38bdf8" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">TTFT 延迟探针</text>

    <g transform="translate(15, 75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" fill="#cbd5e1">
      <text y="0" font-weight="bold" fill="#fff">测试方法：</text>
      <text y="22" fill="#94a3b8">发起需长推理问题</text>
      <text y="42" fill="#94a3b8">精确测量首字耗时</text>

      <text y="80" font-weight="bold" fill="#38bdf8">特征阈值：</text>
      <text y="102" fill="#94a3b8">&lt; 500ms：普通 Flash</text>
      <text y="124" fill="#ec4899" font-weight="bold">&gt; 3,500ms：触发异常</text>
      <text y="144" fill="#ec4899">（存在隐藏草稿计算）</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 240 L 270 240" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 2 -->
  <g transform="translate(275, 110)">
    <rect width="195" height="260" rx="10" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="2"/>
    <circle cx="32" cy="32" r="16" fill="#4f46e5"/>
    <text x="32" y="38" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">2</text>
    <text x="60" y="37" fill="#818cf8" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">空间矢量绘制</text>

    <g transform="translate(15, 75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" fill="#cbd5e1">
      <text y="0" font-weight="bold" fill="#fff">测试方法：</text>
      <text y="22" fill="#94a3b8">发送鹈鹕骑自行车或</text>
      <text y="42" fill="#94a3b8">等距 3D 水晶城市指令</text>

      <text y="80" font-weight="bold" fill="#818cf8">特征阈值：</text>
      <text y="102" fill="#94a3b8">杂乱拼凑：常规 Flash</text>
      <text y="124" fill="#ec4899" font-weight="bold">&gt; 800 行高精连贯：</text>
      <text y="144" fill="#ec4899">旗舰模型空间直觉</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <path d="M 480 240 L 505 240" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 3 -->
  <g transform="translate(510, 110)">
    <rect width="195" height="260" rx="10" fill="url(#boxGrad)" stroke="#c084fc" stroke-width="2"/>
    <circle cx="32" cy="32" r="16" fill="#9333ea"/>
    <text x="32" y="38" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">3</text>
    <text x="60" y="37" fill="#c084fc" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">复杂并发压测</text>

    <g transform="translate(15, 75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" fill="#cbd5e1">
      <text y="0" font-weight="bold" fill="#fff">测试方法：</text>
      <text y="22" fill="#94a3b8">注入 Tokio 异步死锁</text>
      <text y="42" fill="#94a3b8">及内存模型乱序代码</text>

      <text y="80" font-weight="bold" fill="#c084fc">特征阈值：</text>
      <text y="102" fill="#94a3b8">空泛建议：常规 Flash</text>
      <text y="124" fill="#ec4899" font-weight="bold">零样本给出完整证明</text>
      <text y="144" fill="#ec4899">与零分配内存池修复</text>
    </g>
  </g>

  <!-- Arrow 3 -->
  <path d="M 715 240 L 740 240" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Step 4 -->
  <g transform="translate(745, 110)">
    <rect width="175" height="260" rx="10" fill="url(#boxGrad)" stroke="#ec4899" stroke-width="2"/>
    <circle cx="32" cy="32" r="16" fill="#db2777"/>
    <text x="32" y="38" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">4</text>
    <text x="60" y="37" fill="#f472b6" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">综合判定</text>

    <g transform="translate(15, 75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" fill="#cbd5e1">
      <text y="0" font-weight="bold" fill="#fff">结论输出：</text>
      <text y="22" fill="#94a3b8">脚本自动计算匹配分</text>

      <text y="70" font-weight="bold" fill="#4ade80">判定规则：</text>
      <text y="92" fill="#cbd5e1">3 项指标均异常</text>
      <text y="114" fill="#ec4899" font-weight="bold">置信度 &gt; 90%</text>
      <text y="136" fill="#cbd5e1">锁定金丝雀通道！</text>
    </g>
  </g>
</svg>
