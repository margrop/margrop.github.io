<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flowNormal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flowCanary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bg2)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    Google 隐秘盲测灰度流水线：为什么你能在 Arena 撞见神秘大杀器？
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    DeepMind Shadow A/B Testing, Canary Dispatch & Blind Arena Evaluation Topology
  </text>

  <!-- Input Sources -->
  <g transform="translate(40, 150)">
    <rect width="180" height="200" rx="10" fill="#131c31" stroke="#334155" stroke-width="2"/>
    <text x="90" y="32" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      请求输入源
    </text>
    <g transform="translate(15, 60)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" fill="#cbd5e1">
      <rect width="150" height="34" rx="6" fill="#1e293b"/>
      <text x="75" y="22" text-anchor="middle">LMSYS 竞技场对决</text>

      <rect y="44" width="150" height="34" rx="6" fill="#1e293b"/>
      <text x="75" y="66" text-anchor="middle">AI Studio 开发者</text>

      <rect y="88" width="150" height="34" rx="6" fill="#1e293b"/>
      <text x="75" y="110" text-anchor="middle">Vertex AI 生产流</text>
    </g>
  </g>

  <!-- Central Canary Dispatch Router -->
  <g transform="translate(290, 130)">
    <rect width="240" height="240" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadowGlow)"/>
    <text x="120" y="36" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      智能灰度分流网关
    </text>
    <text x="120" y="58" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="monospace">
      Traffic Canary Gatekeeper
    </text>

    <!-- Logic Inside -->
    <g transform="translate(20, 80)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="11">
      <rect width="200" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="100" y="24" fill="#94a3b8" text-anchor="middle">Hash(Request_ID) 采样</text>

      <rect y="50" width="200" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="100" y="74" fill="#4ade80" text-anchor="middle">98.5% 命中标准生产线</text>

      <rect y="100" width="200" height="40" rx="6" fill="#3b0764" stroke="#ec4899"/>
      <text x="100" y="124" fill="#f472b6" font-weight="bold" text-anchor="middle">1.5% 旁路重定向至探针</text>
    </g>
  </g>

  <!-- Connecting Lines -->
  <!-- Left to Middle -->
  <path d="M 220 250 L 290 250" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,2"/>

  <!-- Middle to Top: Standard Cluster -->
  <path d="M 530 200 L 620 170" stroke="url(#flowNormal)" stroke-width="4" stroke-linecap="round"/>
  <!-- Middle to Bottom: Stealth Frontier Cluster -->
  <path d="M 530 290 L 620 320" stroke="url(#flowCanary)" stroke-width="4" stroke-linecap="round" filter="url(#shadowGlow)"/>

  <!-- Right Top: Standard Flash Cluster -->
  <g transform="translate(620, 100)">
    <rect width="300" height="130" rx="10" fill="#131c31" stroke="#0284c7" stroke-width="2"/>
    <text x="20" y="30" fill="#38bdf8" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      标准集群：Gemini 3.8 Flash (GA)
    </text>
    <g transform="translate(20, 48)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="11" fill="#cbd5e1">
      <text y="16">• 正常 TPU v5e 轻量量化阵列</text>
      <text y="36">• TTFT: ~200ms | 150 tokens/s</text>
      <text y="56">• 表现：日常编程稳健，困难奥数易卡死</text>
    </g>
  </g>

  <!-- Right Bottom: Stealth Gemini 4 Cluster -->
  <g transform="translate(620, 260)">
    <rect width="300" height="170" rx="10" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" filter="url(#shadowGlow)"/>
    <text x="20" y="30" fill="#f472b6" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      神秘集群：Gemini 4 Pro (Pre-GA)
    </text>
    <g transform="translate(20, 50)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="11" fill="#cbd5e1">
      <text y="16">• TPU v6 (Trillium) 超大规模稀疏 MoE</text>
      <text y="36" fill="#f43f5e" font-weight="bold">• 隐藏推理：激活 5s 动态深度思考链</text>
      <text y="56" fill="#4ade80">• 表现：全盲状态下狂虐业界各路 SOTA</text>
      <text y="76">• 收集目标：零偏见的自然用户胜率反馈</text>
    </g>
  </g>
</svg>
