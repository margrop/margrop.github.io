<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mysteryBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="flashBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg3)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    全方位技术剖析：标准 Flash 与神秘探针模型的能力断层
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    Multi-Dimensional Capability Fingerprint: Official Flash vs Mystery Checkpoint
  </text>

  <!-- Left: Multi-bar Matrix -->
  <g transform="translate(60, 110)">
    <rect width="480" height="320" rx="10" fill="#131c31" stroke="#334155" stroke-width="1"/>

    <!-- Dimension 1: Complex SVG Synthesis -->
    <g transform="translate(20, 25)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#cbd5e1" font-weight="bold">空间几何与复杂 SVG 绘制</text>
      <!-- Flash -->
      <rect y="10" width="180" height="14" rx="3" fill="url(#flashBar)"/>
      <text x="190" y="22" fill="#94a3b8" font-family="monospace" font-size="11">45%</text>
      <!-- Mystery -->
      <rect y="28" width="390" height="14" rx="3" fill="url(#mysteryBar)"/>
      <text x="400" y="40" fill="#ec4899" font-weight="bold" font-family="monospace" font-size="11">96% (+113%)</text>
    </g>

    <!-- Dimension 2: Multi-file Concurrency Debugging -->
    <g transform="translate(20, 85)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#cbd5e1" font-weight="bold">多线程死锁与长程代码重构 (SWE-bench)</text>
      <!-- Flash -->
      <rect y="10" width="170" height="14" rx="3" fill="url(#flashBar)"/>
      <text x="180" y="22" fill="#94a3b8" font-family="monospace" font-size="11">42%</text>
      <!-- Mystery -->
      <rect y="28" width="365" height="14" rx="3" fill="url(#mysteryBar)"/>
      <text x="375" y="40" fill="#ec4899" font-weight="bold" font-family="monospace" font-size="11">91% (+116%)</text>
    </g>

    <!-- Dimension 3: Zero-shot Math Olympiad -->
    <g transform="translate(20, 145)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#cbd5e1" font-weight="bold">数学竞赛 (Putnam / AIME) 零样本解题</text>
      <!-- Flash -->
      <rect y="10" width="140" height="14" rx="3" fill="url(#flashBar)"/>
      <text x="150" y="22" fill="#94a3b8" font-family="monospace" font-size="11">35%</text>
      <!-- Mystery -->
      <rect y="28" width="350" height="14" rx="3" fill="url(#mysteryBar)"/>
      <text x="360" y="40" fill="#ec4899" font-weight="bold" font-family="monospace" font-size="11">88% (+151%)</text>
    </g>

    <!-- Dimension 4: Instruction Adherence -->
    <g transform="translate(20, 205)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#cbd5e1" font-weight="bold">长指令与多重负向约束严格遵循</text>
      <!-- Flash -->
      <rect y="10" width="260" height="14" rx="3" fill="url(#flashBar)"/>
      <text x="270" y="22" fill="#94a3b8" font-family="monospace" font-size="11">65%</text>
      <!-- Mystery -->
      <rect y="28" width="380" height="14" rx="3" fill="url(#mysteryBar)"/>
      <text x="390" y="40" fill="#ec4899" font-weight="bold" font-family="monospace" font-size="11">95% (+46%)</text>
    </g>

    <!-- Dimension 5: Response Speed (TTFT) -->
    <g transform="translate(20, 265)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#cbd5e1" font-weight="bold">首字闪电响应速度 (越短越快)</text>
      <!-- Flash -->
      <rect y="10" width="390" height="14" rx="3" fill="url(#flashBar)"/>
      <text x="400" y="22" fill="#38bdf8" font-family="monospace" font-size="11">0.25s (极速)</text>
      <!-- Mystery -->
      <rect y="28" width="70" height="14" rx="3" fill="url(#mysteryBar)"/>
      <text x="80" y="40" fill="#f43f5e" font-weight="bold" font-family="monospace" font-size="11">5.1s (深度思考)</text>
    </g>
  </g>

  <!-- Right: Key Takeaways Card -->
  <g transform="translate(570, 110)">
    <rect width="330" height="320" rx="10" fill="#131c31" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="165" y="32" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      断层级技术特征总结
    </text>

    <g transform="translate(20, 60)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12" fill="#cbd5e1">
      <text y="0" fill="#f472b6" font-weight="bold">1. 思考延迟 (Thinking Latency)</text>
      <text y="20" fill="#94a3b8">神秘模型并非直接流式吐字，而是在</text>
      <text y="38" fill="#94a3b8">后台进行了 4~6 秒的动态推理计算。</text>

      <text y="75" fill="#f472b6" font-weight="bold">2. 拓扑级空间建模能力</text>
      <text y="95" fill="#94a3b8">普通轻量模型只能堆叠 2D 贴图，神秘</text>
      <text y="113" fill="#94a3b8">模型能自主计算 3D 矩阵投影与连杆力学。</text>

      <text y="150" fill="#f472b6" font-weight="bold">3. 旗舰 MoE 架构特征</text>
      <text y="170" fill="#94a3b8">吐字速度稳定在 110 t/s，符合 Google</text>
      <text y="188" fill="#94a3b8">新一代超大稀疏专家集群硬件特性。</text>

      <text y="225" fill="#38bdf8" font-weight="bold">结论：绝非 3.8 Flash 本尊！</text>
    </g>
  </g>
</svg>
