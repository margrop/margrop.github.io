<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="460" fill="url(#bg5)" rx="16"/>

  <text x="480" y="44" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    Gemini 演进之路与代际分水岭：从 1.5 到 4.0 旗舰破局
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
    Evolution of Google's Gemini Architecture: The Leap Towards Autonomous Reasoning
  </text>

  <!-- Timeline Line -->
  <line x1="80" y1="230" x2="880" y2="230" stroke="#334155" stroke-width="4"/>

  <!-- Milestone 1: Gemini 1.5 Pro -->
  <g transform="translate(100, 150)">
    <circle cx="30" cy="80" r="14" fill="#38bdf8"/>
    <line x1="30" y1="66" x2="30" y2="-10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="-50" y="-80" width="160" height="70" rx="6" fill="#1e293b" stroke="#38bdf8"/>
    <text x="30" y="-56" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Gemini 1.5 系列</text>
    <text x="30" y="-36" fill="#cbd5e1" font-size="11" text-anchor="middle">百万超长上下文</text>
    <text x="30" y="-18" fill="#94a3b8" font-size="10" text-anchor="middle">2024 年初</text>
  </g>

  <!-- Milestone 2: Gemini 2.0 Flash -->
  <g transform="translate(320, 230)">
    <circle cx="30" cy="0" r="14" fill="#818cf8"/>
    <line x1="30" y1="14" x2="30" y2="90" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="-50" y="90" width="160" height="70" rx="6" fill="#1e293b" stroke="#818cf8"/>
    <text x="30" y="114" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Gemini 2.0 系列</text>
    <text x="30" y="134" fill="#cbd5e1" font-size="11" text-anchor="middle">多模态实时交互 / 思考</text>
    <text x="30" y="152" fill="#94a3b8" font-size="10" text-anchor="middle">2024 年末 ~ 2025</text>
  </g>

  <!-- Milestone 3: Gemini 3.8 Flash -->
  <g transform="translate(540, 150)">
    <circle cx="30" cy="80" r="14" fill="#34d399"/>
    <line x1="30" y1="66" x2="30" y2="-10" stroke="#34d399" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="-50" y="-80" width="160" height="70" rx="6" fill="#1e293b" stroke="#34d399"/>
    <text x="30" y="-56" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Gemini 3.8 Flash</text>
    <text x="30" y="-36" fill="#cbd5e1" font-size="11" text-anchor="middle">极速长程工程化工作马</text>
    <text x="30" y="-18" fill="#94a3b8" font-size="10" text-anchor="middle">2026 年 9 月 (正式发布)</text>
  </g>

  <!-- Milestone 4: Mystery Canary / Gemini 4 Pro -->
  <g transform="translate(760, 230)">
    <circle cx="30" cy="0" r="18" fill="#ec4899"/>
    <line x1="30" y1="18" x2="30" y2="80" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3"/>
    <rect x="-60" y="80" width="180" height="85" rx="8" fill="#3b0764" stroke="#ec4899" stroke-width="2"/>
    <text x="30" y="104" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">Gemini 4 Pro (谍照)</text>
    <text x="30" y="124" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">原生测试时思考计算</text>
    <text x="30" y="142" fill="#cbd5e1" font-size="10" text-anchor="middle">竞技场 1382 分屠榜狂飙</text>
    <text x="30" y="158" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">2026 秋季蓄势待发</text>
  </g>
</svg>
