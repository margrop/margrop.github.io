<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="480" y="44" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto">
    硬核比方：五菱宏光外壳下，竟然塞了一台布加迪 W16 发动机？！
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto">
    A Visual Metaphor: Economy Car Exterior (Flash Gateway) Housing a Frontier MoE Supercluster (Gemini 4 Pro)
  </text>

  <!-- Left: Exterior Shell (The Economy Car / Flash Gateway) -->
  <g transform="translate(60, 110)">
    <rect width="380" height="310" rx="12" fill="#131c31" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="42" rx="12" fill="#1e293b"/>
    <text x="20" y="27" fill="#38bdf8" font-size="15" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      外表：日常轻量代步车（Gemini 3.8 Flash）
    </text>

    <!-- Car Silhouette Graphic -->
    <path d="M 40 160 Q 70 120 120 110 L 220 110 Q 280 110 320 160 L 340 180 Q 345 195 330 200 L 40 200 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <circle cx="95" cy="205" r="24" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="265" cy="205" r="24" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="95" cy="205" r="8" fill="#38bdf8"/>
    <circle cx="265" cy="205" r="8" fill="#38bdf8"/>

    <text x="190" y="150" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">
      API Tag: "gemini-3.8-flash"
    </text>

    <!-- Specs List -->
    <g transform="translate(25, 235)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#cbd5e1">• 定价：$0.75 / M 词元（极低门槛）</text>
      <text y="22" fill="#cbd5e1">• 标准延迟：200ms 首字闪电响应</text>
      <text y="44" fill="#cbd5e1">• 预期定位：自动化运维、高频日常对话</text>
      <text y="66" fill="#f87171">• 常规短板：无法搞定超长程自研算法闭环</text>
    </g>
  </g>

  <!-- Middle Neon Connector: Canary Stealth Routing -->
  <g transform="translate(450, 230)">
    <path d="M 0 0 L 50 0" stroke="url(#neonPink)" stroke-width="4" stroke-dasharray="6,4" filter="url(#glow)"/>
    <polygon points="52,-6 62,0 52,6" fill="#ec4899" filter="url(#glow)"/>
    <text x="30" y="-14" fill="#ec4899" font-size="11" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      灰度金丝雀旁路
    </text>
    <text x="30" y="24" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="monospace">
      1% 流量采样
    </text>
  </g>

  <!-- Right: Interior Monster Engine (Gemini 4 Pro Frontier Checkpoint) -->
  <g transform="translate(520, 110)">
    <rect width="380" height="310" rx="12" fill="#131c31" stroke="#ec4899" stroke-width="2" filter="url(#glow)"/>
    <rect x="0" y="0" width="380" height="42" rx="12" fill="url(#neonPink)"/>
    <text x="20" y="27" fill="#ffffff" font-size="15" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, Segoe UI">
      内芯：布加迪 W16 级怪兽（Gemini 4 Pro 探针）
    </text>

    <!-- Super Engine Graphic -->
    <g transform="translate(40, 60)">
      <rect x="20" y="20" width="260" height="90" rx="8" fill="#1e293b" stroke="url(#engineGrad)" stroke-width="3"/>
      <!-- Cylinders -->
      <circle cx="60" cy="50" r="14" fill="#3b82f6"/>
      <circle cx="105" cy="50" r="14" fill="#8b5cf6"/>
      <circle cx="150" cy="50" r="14" fill="#ec4899"/>
      <circle cx="195" cy="50" r="14" fill="#f43f5e"/>
      <circle cx="240" cy="50" r="14" fill="#38bdf8"/>
      <!-- Sparks & Energy -->
      <path d="M 60 70 L 60 90 M 105 70 L 105 90 M 150 70 L 150 90 M 195 70 L 195 90 M 240 70 L 240 90" stroke="#38bdf8" stroke-width="3"/>
      <text x="150" y="130" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">
        [500B+ MoE Sparse Cluster + CoT Loop]
      </text>
    </g>

    <!-- Capabilities List -->
    <g transform="translate(25, 215)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-size="12">
      <text y="0" fill="#4ade80">• 真实首字延迟：5 秒深思熟虑（草稿纸验算）</text>
      <text y="22" fill="#4ade80">• 降维打击：SWE-bench 58.8% 解题率屠榜</text>
      <text y="44" fill="#4ade80">• 空间与拓扑：完美绘制高精等距三维矢量</text>
      <text y="66" fill="#f472b6">• 幕后真相：未官宣的下一代旗舰隐秘实测</text>
    </g>
  </g>
</svg>
