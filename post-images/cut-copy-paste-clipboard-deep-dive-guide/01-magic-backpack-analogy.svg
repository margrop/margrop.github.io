<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1400" height="700" fill="url(#bgGrad)"/>

  <text x="700" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">小学生也能懂的“隐形魔法背包”模型（系统剪贴板运行原理）</text>
  <text x="700" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#94a3b8">为什么剪切或复制的数据既不在键盘里，也不在屏幕上，而是在内存（RAM）中的单槽临时背包里？</text>

  <!-- Left: Source Desk -->
  <g transform="translate(80, 140)">
    <rect width="340" height="480" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="170" y="45" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#38bdf8">【课桌与笔记本】</text>
    <text x="170" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">原始数据存放地（源程序）</text>

    <!-- Notebook sheet -->
    <rect x="30" y="105" width="280" height="240" rx="8" fill="#f8fafc"/>
    <text x="50" y="140" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">《我的暑假作文》</text>
    <text x="50" y="175" font-family="sans-serif" font-size="14" fill="#334155">第一段：今天学会了编程...</text>
    
    <rect x="45" y="195" width="250" height="60" rx="4" fill="#fef08a" stroke="#eab308" stroke-dasharray="4,4"/>
    <text x="55" y="220" font-family="sans-serif" font-size="14" font-weight="700" fill="#854d0e">【选中的关键段落 1000字】</text>
    <text x="55" y="242" font-family="sans-serif" font-size="12" fill="#a16207">按下 Ctrl+X (剪走) 或 Ctrl+C (复制)</text>

    <text x="50" y="280" font-family="sans-serif" font-size="14" fill="#334155">结尾：明天继续加油！</text>

    <!-- Action indicator -->
    <rect x="30" y="375" width="280" height="75" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="170" y="405" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">Ctrl+C：原文保留，造出镜像</text>
    <text x="170" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f43f5e">Ctrl+X：剪下文字，原处留白</text>
  </g>

  <!-- Center: Magic Backpack (RAM Clipboard) -->
  <g transform="translate(530, 140)">
    <rect width="340" height="480" rx="16" fill="#182234" stroke="#f59e0b" stroke-width="3" filter="url(#glow)"/>
    <text x="170" y="45" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#fbbf24">【隐形单格魔法背包】</text>
    <text x="170" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fde68a">系统剪贴板（RAM 临时缓冲区）</text>

    <!-- Backpack pocket -->
    <rect x="30" y="105" width="280" height="230" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="170" y="145" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#f59e0b">背包只有一个隔层（单槽位）</text>

    <rect x="50" y="165" width="240" height="75" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="170" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#92400e">当前装入：作文段落 (1000字)</text>
    <text x="170" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b45309">内存地址: 0x7FFF8A12 | 纯文本+格式</text>

    <!-- Danger Alert -->
    <rect x="40" y="260" width="260" height="60" rx="6" fill="#450a0a" stroke="#dc2626"/>
    <text x="170" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fca5a5">⚠ 致命危机：覆写（Overwrite）</text>
    <text x="170" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fecaca">若此时不小心按 Ctrl+C 复制了一张猫猫图，作文立即掉落被销毁！</text>

    <!-- Solution note -->
    <rect x="30" y="360" width="280" height="90" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="170" y="390" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">升级神器：多格文具盒！</text>
    <text x="170" y="415" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cbd5e1">按 Win+V 开启【剪贴板历史记录】</text>
    <text x="170" y="435" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94a3b8">可容纳 25 个物品，再也不怕弄丢！</text>
  </g>

  <!-- Right: Target Destination -->
  <g transform="translate(980, 140)">
    <rect width="340" height="480" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="45" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#10b981">【新作业本 / 终点】</text>
    <text x="170" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">目标程序（Word / 微信 / 终端）</text>

    <!-- Stamp Action -->
    <rect x="30" y="105" width="280" height="240" rx="8" fill="#f8fafc"/>
    <text x="50" y="140" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e293b">《期末汇报最终版》</text>
    
    <rect x="45" y="160" width="250" height="85" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="55" y="190" font-family="sans-serif" font-size="14" font-weight="700" fill="#166534">【按下 Ctrl+V 盖章印出】</text>
    <text x="55" y="212" font-family="sans-serif" font-size="12" fill="#15803d">今天学会了编程...</text>
    <text x="55" y="230" font-family="sans-serif" font-size="11" fill="#166534">★背包里的东西不消耗，可重复盖章！</text>

    <text x="50" y="270" font-family="sans-serif" font-size="14" fill="#334155">【再次 Ctrl+V】再次盖章印出一份！</text>
    <text x="50" y="300" font-family="sans-serif" font-size="14" fill="#334155">【洗干净再印】Ctrl+Shift+V 纯文本</text>

    <!-- Paste Feature -->
    <rect x="30" y="375" width="280" height="75" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="170" y="405" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e2e8f0">读取内存无损：非破坏性提取</text>
    <text x="170" y="430" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#6ee7b7">随时关机 = 内存断电，背包物品清空</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#fbbf24" stroke-width="3" fill="none">
    <path d="M 425 320 L 525 320"/>
    <path d="M 875 320 L 975 320"/>
  </g>
  <polygon points="525,320 515,313 515,327" fill="#fbbf24"/>
  <polygon points="975,320 965,313 965,327" fill="#fbbf24"/>

  <text x="475" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">入包 (Put)</text>
  <text x="925" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">盖章 (Get)</text>
</svg>