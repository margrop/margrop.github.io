<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#182338"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="720" fill="url(#bg3)"/>

  <text x="700" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">“带泥巴的红薯”比喻：为什么直接粘贴会把 Word 排版搞烂？</text>
  <text x="700" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94a3b8">剪贴板多格式封装机制（MIME Types）与 Ctrl+Shift+V “洗红薯”纯文本清洗法则</text>

  <!-- Left: Muddy Sweet Potato (Webpage Copy) -->
  <g transform="translate(80, 130)">
    <rect width="360" height="520" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="180" y="45" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#f59e0b">【网页上的带泥红薯】</text>
    <text x="180" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">在浏览器按下 Ctrl+C 复制一段文字</text>

    <rect x="30" y="105" width="300" height="375" rx="12" fill="#0f172a" stroke="#475569"/>
    
    <!-- Layers -->
    <rect x="50" y="130" width="260" height="60" rx="6" fill="#854d0e"/>
    <text x="65" y="155" font-family="sans-serif" font-size="14" font-weight="700" fill="#fef08a">【表面厚泥巴】HTML 标签与 CSS</text>
    <text x="65" y="175" font-family="monospace" font-size="12" fill="#fef9c3">&lt;span style="color:#ff0000;font-size:32px"&gt;</text>

    <rect x="50" y="210" width="260" height="60" rx="6" fill="#713f12"/>
    <text x="65" y="235" font-family="sans-serif" font-size="14" font-weight="700" fill="#fef08a">【杂草与碎石】外链与追踪埋点</text>
    <text x="65" y="255" font-family="monospace" font-size="12" fill="#fef9c3">&lt;a href="https://ads.track.site/?utm=..."&gt;</text>

    <rect x="50" y="290" width="260" height="60" rx="6" fill="#ca8a04"/>
    <text x="65" y="315" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">【底层黑背景】表格与暗黑背景色</text>
    <text x="65" y="335" font-family="monospace" font-size="12" fill="#fef08a">background-color: #0b1120; padding: 12px;</text>

    <rect x="50" y="370" width="260" height="85" rx="6" fill="#ea580c"/>
    <text x="65" y="398" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffffff">【红薯果肉本身】真正的文字！</text>
    <text x="65" y="425" font-family="sans-serif" font-size="13" fill="#ffedd5">“剪贴板是现代计算机最早的 IPC 机制”</text>
  </g>

  <!-- Middle: Clipboard Lunchbox with Multiple Compartments -->
  <g transform="translate(480, 130)">
    <rect width="440" height="520" rx="16" fill="#182235" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="220" y="45" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#38bdf8">【剪贴板多格便当盒】</text>
    <text x="220" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">系统剪贴板同时打包了多种格式（MIME）</text>

    <!-- Slot A -->
    <rect x="30" y="105" width="380" height="110" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="50" y="135" font-family="sans-serif" font-size="16" font-weight="700" fill="#4ade80">格层 1: text/plain (洗干净的红薯)</text>
    <text x="50" y="160" font-family="monospace" font-size="13" fill="#cbd5e1">"剪贴板是现代计算机最早的 IPC 机制"</text>
    <text x="50" y="185" font-family="sans-serif" font-size="12" fill="#86efac">无任何颜色、字号、外链，体积仅 54 字节</text>

    <!-- Slot B -->
    <rect x="30" y="235" width="380" height="110" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="50" y="265" font-family="sans-serif" font-size="16" font-weight="700" fill="#fbbf24">格层 2: text/html (带泥巴杂草的红薯)</text>
    <text x="50" y="290" font-family="monospace" font-size="13" fill="#cbd5e1">&lt;p style="color:red;bg:#000"&gt;&lt;a...&gt;...&lt;/p&gt;</text>
    <text x="50" y="315" font-family="sans-serif" font-size="12" fill="#fde68a">包含完整样式树，体积膨胀至 840 字节</text>

    <!-- Slot C -->
    <rect x="30" y="365" width="380" height="110" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="50" y="395" font-family="sans-serif" font-size="16" font-weight="700" fill="#c084fc">格层 3: text/rtf (微软/苹果富文本)</text>
    <text x="50" y="420" font-family="monospace" font-size="13" fill="#cbd5e1">{tf1nsinsicpg936\deff0 ...}</text>
    <text x="50" y="445" font-family="sans-serif" font-size="12" fill="#e9d5ff">桌面文档编辑器兼容格式</text>
  </g>

  <!-- Right: Two Destiny Outcomes -->
  <g transform="translate(960, 130)">
    <rect width="360" height="520" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="180" y="45" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#f8fafc">【两种粘贴的命运】</text>
    <text x="180" y="75" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">不同快捷键决定了取哪个格层</text>

    <!-- Bad Path: Ctrl+V -->
    <rect x="25" y="105" width="310" height="175" rx="10" fill="#450a0a" stroke="#dc2626"/>
    <text x="45" y="135" font-family="sans-serif" font-size="16" font-weight="800" fill="#fca5a5">直接按 Ctrl + V (恶梦)</text>
    <text x="45" y="160" font-family="sans-serif" font-size="13" fill="#fecaca">Word 默认优先读取【text/html 格层】</text>
    <text x="45" y="185" font-family="sans-serif" font-size="13" fill="#fca5a5">❌ 泥巴把整洁的作文全部糊满</text>
    <text x="45" y="210" font-family="sans-serif" font-size="13" fill="#fca5a5">❌ 出现奇怪黑底色、巨型红色标题</text>
    <text x="45" y="235" font-family="sans-serif" font-size="13" fill="#fca5a5">❌ 排版完全错乱崩塌！</text>

    <!-- Good Path: Ctrl+Shift+V -->
    <rect x="25" y="310" width="310" height="195" rx="10" fill="#064e3b" stroke="#10b981"/>
    <text x="45" y="340" font-family="sans-serif" font-size="16" font-weight="800" fill="#86efac">按 Ctrl+Shift+V (自来水冲洗)</text>
    <text x="45" y="365" font-family="sans-serif" font-size="13" fill="#a7f3d0">Mac: Cmd + Option + Shift + V</text>
    <text x="45" y="395" font-family="sans-serif" font-size="13" fill="#6ee7b7">✓ 强制只取【纯文本 text/plain】</text>
    <text x="45" y="420" font-family="sans-serif" font-size="13" fill="#6ee7b7">✓ 所有 HTML 泥巴和样式被水冲刷干净</text>
    <text x="45" y="445" font-family="sans-serif" font-size="13" fill="#6ee7b7">✓ 自动匹配目标 Word 当前字号和宋体</text>
    <text x="45" y="470" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">★ 神清气爽，排版严丝合缝！</text>
  </g>
</svg>