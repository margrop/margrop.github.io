<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="720" fill="url(#bg4)"/>

  <text x="700" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">操作系统剪贴板底层 IPC 与惰性求值架构</text>
  <text x="700" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#94a3b8">跨进程通信（IPC）、共享内存（Shared Memory）与超大文件“虚拟指针”流转</text>

  <!-- App A: User Space -->
  <g transform="translate(80, 130)">
    <rect width="360" height="520" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#38bdf8">源进程 A (User Space)</text>
    <text x="180" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">如 Chrome / 记事本 / 资源管理器</text>

    <rect x="30" y="90" width="300" height="120" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="50" y="120" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">1. 触发复制 / 剪切事件</text>
    <text x="50" y="145" font-family="monospace" font-size="12" fill="#38bdf8">Windows: OpenClipboard(hWnd)</text>
    <text x="50" y="165" font-family="monospace" font-size="12" fill="#38bdf8">macOS  : [NSPasteboard generalPasteboard]</text>
    <text x="50" y="185" font-family="monospace" font-size="12" fill="#38bdf8">Linux  : wl_data_device_set_selection</text>

    <rect x="30" y="230" width="300" height="130" rx="10" fill="#0f172a" stroke="#f59e0b"/>
    <text x="50" y="260" font-family="sans-serif" font-size="15" font-weight="700" fill="#fbbf24">2. 序列化或注册回调</text>
    <text x="50" y="285" font-family="sans-serif" font-size="13" fill="#cbd5e1">普通文本: 直接拷贝字节流到内存</text>
    <text x="50" y="310" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b">50GB大文件: 注册惰性回调指针！</text>
    <text x="50" y="335" font-family="monospace" font-size="11" fill="#94a3b8">Delayed Rendering (CF_HDROP句柄)</text>

    <rect x="30" y="380" width="300" height="110" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="50" y="410" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">3. 提交并通知总线</text>
    <text x="50" y="435" font-family="monospace" font-size="12" fill="#38bdf8">Windows: SetClipboardData()</text>
    <text x="50" y="455" font-family="monospace" font-size="12" fill="#38bdf8">Windows: CloseClipboard()</text>
    <text x="50" y="475" font-family="sans-serif" font-size="11" fill="#94a3b8">释放锁，通知系统剪贴板监听链</text>
  </g>

  <!-- Middle: OS Kernel & IPC Shared Memory -->
  <g transform="translate(480, 130)">
    <rect width="440" height="520" rx="16" fill="#182235" stroke="#a855f7" stroke-width="2.5"/>
    <text x="220" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#c084fc">操作系统剪贴板管理器 (OS Kernel / IPC)</text>
    <text x="220" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e9d5ff">跨进程共享内存区与安全沙箱调度</text>

    <rect x="30" y="90" width="380" height="150" rx="10" fill="#0f172a" stroke="#a855f7"/>
    <text x="50" y="120" font-family="sans-serif" font-size="16" font-weight="700" fill="#c084fc">【共享内存总线 Shared Memory】</text>
    <text x="50" y="150" font-family="monospace" font-size="12" fill="#cbd5e1">0x7FFF0000: text/plain ("Clean text...")</text>
    <text x="50" y="175" font-family="monospace" font-size="12" fill="#cbd5e1">0x7FFF0800: text/html ("&lt;html&gt;...&lt;/html&gt;")</text>
    <text x="50" y="200" font-family="monospace" font-size="12" fill="#cbd5e1">0x7FFF2000: image/png (Raw Bitmap Buffer)</text>
    <text x="50" y="225" font-family="monospace" font-size="12" fill="#fbbf24">0x7FFF8000: Lazy_Promise_Ptr -> FileDescriptor</text>

    <rect x="30" y="260" width="380" height="110" rx="10" fill="#0f172a" stroke="#38bdf8"/>
    <text x="50" y="290" font-family="sans-serif" font-size="15" font-weight="700" fill="#38bdf8">【安全沙箱与剪贴板监听器】</text>
    <text x="50" y="315" font-family="sans-serif" font-size="12" fill="#cbd5e1">系统派发 WM_CLIPBOARDUPDATE 广播</text>
    <text x="50" y="340" font-family="sans-serif" font-size="12" fill="#fb7185">恶意 App 若常驻后台即可偷窥银行卡号/口令！</text>
    <text x="50" y="358" font-family="sans-serif" font-size="11" fill="#94a3b8">现代系统增加“剪贴板访问弹窗提醒”</text>

    <rect x="30" y="390" width="380" height="100" rx="10" fill="#0f172a" stroke="#22c55e"/>
    <text x="50" y="420" font-family="sans-serif" font-size="15" font-weight="700" fill="#4ade80">【跨设备流转 (Universal Clipboard)】</text>
    <text x="50" y="445" font-family="sans-serif" font-size="12" fill="#cbd5e1">苹果接力 (Handoff) / 微软手机互联</text>
    <text x="50" y="468" font-family="sans-serif" font-size="11" fill="#86efac">局域网 BLE 广播发现 + Wi-Fi 点对点 TLS 加密飞传</text>
  </g>

  <!-- App B: Target Space -->
  <g transform="translate(960, 130)">
    <rect width="360" height="520" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="180" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#10b981">目标进程 B (User Space)</text>
    <text x="180" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#94a3b8">如 Word / VS Code / 终端 Shell</text>

    <rect x="30" y="90" width="300" height="120" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="50" y="120" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">1. 触发粘贴事件</text>
    <text x="50" y="145" font-family="monospace" font-size="12" fill="#10b981">Windows: IsClipboardFormatAvailable()</text>
    <text x="50" y="165" font-family="monospace" font-size="12" fill="#10b981">macOS  : [pboard types]</text>
    <text x="50" y="185" font-family="monospace" font-size="12" fill="#10b981">Linux  : wl_data_offer_receive()</text>

    <rect x="30" y="230" width="300" height="130" rx="10" fill="#0f172a" stroke="#10b981"/>
    <text x="50" y="260" font-family="sans-serif" font-size="15" font-weight="700" fill="#34d399">2. 格式协商与解码</text>
    <text x="50" y="285" font-family="sans-serif" font-size="13" fill="#cbd5e1">文本编辑器：只提取 text/plain</text>
    <text x="50" y="310" font-family="sans-serif" font-size="13" fill="#cbd5e1">富文本编辑器：优先提取 text/html</text>
    <text x="50" y="335" font-family="sans-serif" font-size="12" fill="#94a3b8">终端模拟器：触发括号粘贴保护模式</text>

    <rect x="30" y="380" width="300" height="110" rx="10" fill="#0f172a" stroke="#22c55e"/>
    <text x="50" y="410" font-family="sans-serif" font-size="15" font-weight="700" fill="#86efac">3. 唤醒惰性求值 (若是大文件)</text>
    <text x="50" y="435" font-family="sans-serif" font-size="12" fill="#cbd5e1">此时系统直接发起磁盘 DMA 移动/硬链接</text>
    <text x="50" y="458" font-family="sans-serif" font-size="12" fill="#86efac">不经过内存爆破，瞬间毫秒级移交完成！</text>
  </g>
</svg>