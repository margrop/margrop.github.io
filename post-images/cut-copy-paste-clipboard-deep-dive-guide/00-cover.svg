<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#spaceBg)"/>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1100" y1="0" x2="1100" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Main Title Area -->
  <rect x="100" y="70" width="360" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="120" y="97" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">DEEP DIVE: OPERATING SYSTEM CLIPBOARD</text>

  <text x="100" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="900" fill="#f8fafc">剪切、复制与粘贴的底层秘密</text>
  <text x="100" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">从“隐形魔法背包”、内存剪贴板机制到终端防黑全自动化实战指南</text>

  <!-- 3 Big Cards: Cut, Copy, Paste -->
  <!-- Card 1: CUT -->
  <g transform="translate(100, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="20" fill="#0f172a" stroke="#f43f5e" stroke-width="2.5"/>
    <rect x="30" y="30" width="80" height="40" rx="8" fill="#e11d48"/>
    <text x="70" y="56" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">CUT</text>
    <text x="125" y="58" font-family="sans-serif" font-size="18" font-weight="600" fill="#fda4af">Ctrl + X  /  Cmd + X</text>
    
    <text x="30" y="115" font-family="sans-serif" font-size="26" font-weight="800" fill="#f8fafc">魔法剪刀：移走并暂存</text>
    <text x="30" y="155" font-family="sans-serif" font-size="17" fill="#cbd5e1">【生活比喻】把练习本上的错题剪下来</text>
    <text x="30" y="185" font-family="sans-serif" font-size="17" fill="#cbd5e1">装进隐形背包，原书页留下空白。</text>

    <!-- Visual snippet -->
    <rect x="30" y="225" width="360" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="50" y="265" font-family="monospace" font-size="15" fill="#f43f5e">[-] Source Text REMOVED</text>
    <text x="50" y="300" font-family="monospace" font-size="15" fill="#38bdf8">[+] Stored in RAM Buffer (0x7F...)</text>
    <text x="50" y="335" font-family="monospace" font-size="14" fill="#94a3b8">File cut: Lazy Eval (semi-transparent)</text>

    <text x="30" y="420" font-family="sans-serif" font-size="16" font-weight="600" fill="#fb7185">⚠ 风险点：若再次剪切，前文永久消失</text>
    <text x="30" y="445" font-family="sans-serif" font-size="14" fill="#94a3b8">单槽剪贴板会立即覆盖原有数据</text>
  </g>

  <!-- Card 2: COPY -->
  <g transform="translate(590, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="20" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="30" y="30" width="85" height="40" rx="8" fill="#0284c7"/>
    <text x="72" y="56" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">COPY</text>
    <text x="130" y="58" font-family="sans-serif" font-size="18" font-weight="600" fill="#7dd3fc">Ctrl + C  /  Cmd + C</text>

    <text x="30" y="115" font-family="sans-serif" font-size="26" font-weight="800" fill="#f8fafc">神奇复印机：克隆并装包</text>
    <text x="30" y="155" font-family="sans-serif" font-size="17" fill="#cbd5e1">【生活比喻】把书上的画印一份复印件</text>
    <text x="30" y="185" font-family="sans-serif" font-size="17" fill="#cbd5e1">装进隐形背包，原书毫发无损。</text>

    <!-- Visual snippet -->
    <rect x="30" y="225" width="360" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="50" y="265" font-family="monospace" font-size="15" fill="#22c55e">[=] Source Document UNCHANGED</text>
    <text x="50" y="300" font-family="monospace" font-size="15" fill="#38bdf8">[+] Mirror payload serialized to IPC</text>
    <text x="50" y="335" font-family="monospace" font-size="14" fill="#94a3b8">Multi-format: Plain + HTML + RTF</text>

    <text x="30" y="420" font-family="sans-serif" font-size="16" font-weight="600" fill="#38bdf8">💡 核心机制：序列化与多格式协商</text>
    <text x="30" y="445" font-family="sans-serif" font-size="14" fill="#94a3b8">操作系统向剪贴板写入多种 MIME 格式</text>
  </g>

  <!-- Card 3: PASTE -->
  <g transform="translate(1080, 320)" filter="url(#shadow)">
    <rect width="420" height="480" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2.5"/>
    <rect x="30" y="30" width="95" height="40" rx="8" fill="#059669"/>
    <text x="77" y="56" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">PASTE</text>
    <text x="140" y="58" font-family="sans-serif" font-size="18" font-weight="600" fill="#6ee7b7">Ctrl + V  /  Cmd + V</text>

    <text x="30" y="115" font-family="sans-serif" font-size="26" font-weight="800" fill="#f8fafc">魔法图章：无损盖章拓印</text>
    <text x="30" y="155" font-family="sans-serif" font-size="17" fill="#cbd5e1">【生活比喻】拿出背包里的图章盖印</text>
    <text x="30" y="185" font-family="sans-serif" font-size="17" fill="#cbd5e1">盖 100 次背包里的东西也不会消耗！</text>

    <!-- Visual snippet -->
    <rect x="30" y="225" width="360" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="50" y="265" font-family="monospace" font-size="15" fill="#10b981">[+] Read from RAM (Non-destructive)</text>
    <text x="50" y="300" font-family="monospace" font-size="15" fill="#f59e0b">[*] Format Negotiation by Target App</text>
    <text x="50" y="335" font-family="monospace" font-size="14" fill="#94a3b8">Pure Text: Ctrl+Shift+V (Wash Mud)</text>

    <text x="30" y="420" font-family="sans-serif" font-size="16" font-weight="600" fill="#34d399">🛡 防御建议：终端开启括号粘贴保护</text>
    <text x="30" y="445" font-family="sans-serif" font-size="14" fill="#94a3b8">防范恶意网站 Pastejacking 注入攻击</text>
  </g>
</svg>