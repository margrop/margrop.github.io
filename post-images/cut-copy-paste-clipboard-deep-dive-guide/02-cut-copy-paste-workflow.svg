<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="700" fill="url(#bg2)"/>

  <text x="700" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">三大核心动作物理学：剪切 vs 复制 vs 粘贴</text>
  <text x="700" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#94a3b8">源对象状态改变、内存缓冲区覆写与多端提取生命周期对比</text>

  <!-- Row 1: COPY (Ctrl+C) -->
  <g transform="translate(80, 130)">
    <rect width="1240" height="150" rx="14" fill="#111c2e" stroke="#0284c7" stroke-width="2"/>
    <rect x="25" y="25" width="160" height="42" rx="8" fill="#0284c7"/>
    <text x="105" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">复制 (Copy)</text>
    <text x="105" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7dd3fc">Ctrl+C / Cmd+C</text>

    <!-- Source -->
    <rect x="220" y="30" width="270" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="240" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">源端 (Source Text)</text>
    <text x="240" y="90" font-family="sans-serif" font-size="14" fill="#22c55e">✓ 原样保留 (毫发无损)</text>

    <!-- RAM Buffer -->
    <rect x="540" y="30" width="340" height="90" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="560" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">内存剪贴板 (RAM Buffer)</text>
    <text x="560" y="90" font-family="sans-serif" font-size="14" fill="#cbd5e1">克隆并序列化写入 0x7FFF... 覆写旧值</text>

    <!-- Target -->
    <rect x="930" y="30" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="950" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#94a3b8">目标端 (Target)</text>
    <text x="950" y="90" font-family="sans-serif" font-size="14" fill="#94a3b8">等待粘贴指令 (静默待命)</text>
  </g>

  <!-- Row 2: CUT (Ctrl+X) -->
  <g transform="translate(80, 310)">
    <rect width="1240" height="150" rx="14" fill="#1f1418" stroke="#e11d48" stroke-width="2"/>
    <rect x="25" y="25" width="160" height="42" rx="8" fill="#e11d48"/>
    <text x="105" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">剪切 (Cut)</text>
    <text x="105" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fda4af">Ctrl+X / Cmd+X</text>

    <!-- Source -->
    <rect x="220" y="30" width="270" height="90" rx="8" fill="#2d151e" stroke="#881337"/>
    <text x="240" y="55" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">源端 (Source Text)</text>
    <text x="240" y="80" font-family="sans-serif" font-size="13" fill="#fb7185">文字：立即从原页面删除并清空</text>
    <text x="240" y="102" font-family="sans-serif" font-size="12" fill="#f43f5e">文件：惰性求值变半透明 (不删原始文件)</text>

    <!-- RAM Buffer -->
    <rect x="540" y="30" width="340" height="90" rx="8" fill="#2d151e" stroke="#f43f5e"/>
    <text x="560" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#fb7185">内存剪贴板 (RAM Buffer)</text>
    <text x="560" y="90" font-family="sans-serif" font-size="14" fill="#cbd5e1">暂存被剪下的数据载荷 / 文件句柄指针</text>

    <!-- Target -->
    <rect x="930" y="30" width="280" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="950" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#94a3b8">目标端 (Target)</text>
    <text x="950" y="90" font-family="sans-serif" font-size="14" fill="#94a3b8">等待粘贴落盘移交</text>
  </g>

  <!-- Row 3: PASTE (Ctrl+V) -->
  <g transform="translate(80, 490)">
    <rect width="1240" height="150" rx="14" fill="#0f231e" stroke="#10b981" stroke-width="2"/>
    <rect x="25" y="25" width="160" height="42" rx="8" fill="#059669"/>
    <text x="105" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">粘贴 (Paste)</text>
    <text x="105" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6ee7b7">Ctrl+V / Cmd+V</text>

    <!-- Source -->
    <rect x="220" y="30" width="270" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="240" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">源端 (Source)</text>
    <text x="240" y="90" font-family="sans-serif" font-size="14" fill="#94a3b8">剪切文件此时完成物理移动/硬链接</text>

    <!-- RAM Buffer -->
    <rect x="540" y="30" width="340" height="90" rx="8" fill="#132e27" stroke="#10b981"/>
    <text x="560" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#34d399">内存剪贴板 (RAM Buffer)</text>
    <text x="560" y="90" font-family="sans-serif" font-size="14" fill="#6ee7b7">非破坏性读取：数据继续保留在内存！</text>

    <!-- Target -->
    <rect x="930" y="30" width="280" height="90" rx="8" fill="#132e27" stroke="#34d399"/>
    <text x="950" y="60" font-family="sans-serif" font-size="16" font-weight="700" fill="#34d399">目标端 (Target Document)</text>
    <text x="950" y="90" font-family="sans-serif" font-size="14" fill="#a7f3d0">印出数据；支持格式协商 (纯文本/富文本)</text>
  </g>
</svg>