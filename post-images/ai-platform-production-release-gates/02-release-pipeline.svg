<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="AI Platform staged release pipeline">
  <rect width="1200" height="760" rx="34" fill="#0b1220"/><text x="65" y="80" fill="#f8fafc" font-size="42" font-family="system-ui" font-weight="800">Do not jump from prompt edit to 100% traffic</text><text x="65" y="126" fill="#94a3b8" font-size="25" font-family="system-ui">Evidence grows at every stage; blast radius grows only after the previous gate passes.</text>
  <g font-family="system-ui" text-anchor="middle"><g><rect x="48" y="250" width="190" height="190" rx="28" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="143" y="315" fill="#dbeafe" font-size="27" font-weight="800">STATIC</text><text x="143" y="351" fill="#dbeafe" font-size="27" font-weight="800">CHECKS</text><text x="143" y="399" fill="#bfdbfe" font-size="20">schema · secrets</text></g><g><rect x="278" y="250" width="190" height="190" rx="28" fill="#5b21b6" stroke="#c4b5fd" stroke-width="3"/><text x="373" y="315" fill="#ede9fe" font-size="27" font-weight="800">OFFLINE</text><text x="373" y="351" fill="#ede9fe" font-size="27" font-weight="800">EVAL</text><text x="373" y="399" fill="#ddd6fe" font-size="20">golden tasks</text></g><g><rect x="508" y="250" width="190" height="190" rx="28" fill="#9a3412" stroke="#fdba74" stroke-width="3"/><text x="603" y="315" fill="#ffedd5" font-size="27" font-weight="800">FAULT</text><text x="603" y="351" fill="#ffedd5" font-size="27" font-weight="800">LAB</text><text x="603" y="399" fill="#fed7aa" font-size="20">429 · crash · stale</text></g><g><rect x="738" y="250" width="190" height="190" rx="28" fill="#155e75" stroke="#67e8f9" stroke-width="3"/><text x="833" y="315" fill="#cffafe" font-size="27" font-weight="800">SHADOW</text><text x="833" y="351" fill="#cffafe" font-size="27" font-weight="800">CANARY</text><text x="833" y="399" fill="#a5f3fc" font-size="20">1% · rollback</text></g><g><rect x="968" y="250" width="190" height="190" rx="28" fill="#14532d" stroke="#86efac" stroke-width="3"/><text x="1063" y="315" fill="#dcfce7" font-size="27" font-weight="800">PROD</text><text x="1063" y="351" fill="#dcfce7" font-size="27" font-weight="800">SLO</text><text x="1063" y="399" fill="#bbf7d0" font-size="20">watch · abort</text></g></g>
  <g fill="#e2e8f0"><path d="m248 330 25 15-25 15"/><path d="m478 330 25 15-25 15"/><path d="m708 330 25 15-25 15"/><path d="m938 330 25 15-25 15"/></g>
  <rect x="255" y="545" width="690" height="100" rx="24" fill="#31134d" stroke="#c084fc" stroke-width="3"/><text x="600" y="588" text-anchor="middle" fill="#f3e8ff" font-size="29" font-family="system-ui" font-weight="800">ANY BLOCK → STOP, EXPLAIN, FIX, RE-RUN</text><text x="600" y="622" text-anchor="middle" fill="#d8b4fe" font-size="21" font-family="ui-monospace,monospace">never delete a failing gate to make the dashboard green</text>
</svg>
