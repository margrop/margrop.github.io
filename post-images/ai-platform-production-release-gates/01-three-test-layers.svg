<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Three complementary AI Platform test layers">
  <rect width="1200" height="760" rx="34" fill="#f8fafc"/><text x="70" y="82" fill="#0f172a" font-size="42" font-family="system-ui" font-weight="800">Three layers answer three different questions</text><text x="70" y="128" fill="#475569" font-size="25" font-family="system-ui">One score cannot cover deterministic control, probabilistic quality, and real usefulness.</text>
  <g font-family="system-ui"><rect x="90" y="205" width="1020" height="145" rx="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="140" y="265" fill="#1e3a8a" font-size="31" font-weight="800">DETERMINISTIC CONTROL</text><text x="140" y="309" fill="#0f172a" font-size="23">identity · policy · schema · state · idempotency · audit</text><text x="1000" y="285" text-anchor="end" fill="#1d4ed8" font-size="25" font-weight="800">must always pass</text><rect x="90" y="390" width="1020" height="145" rx="28" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="140" y="450" fill="#5b21b6" font-size="31" font-weight="800">PROBABILISTIC QUALITY</text><text x="140" y="494" fill="#0f172a" font-size="23">task success · groundedness · safety · variance · cost</text><text x="1000" y="470" text-anchor="end" fill="#6d28d9" font-size="25" font-weight="800">compare distributions</text><rect x="90" y="575" width="1020" height="125" rx="28" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="140" y="635" fill="#166534" font-size="31" font-weight="800">HUMAN AND BUSINESS OUTCOME</text><text x="140" y="674" fill="#0f172a" font-size="23">resolved work · safe handoff · user trust · rollback readiness</text></g>
</svg>
