<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Evidence chain connects identity, route, policy, execution, outcome, and cost">
  <rect width="1200" height="720" rx="34" fill="#f8fafc"/><text x="70" y="82" fill="#0f172a" font-size="42" font-family="system-ui" font-weight="800">One request needs one explainable evidence chain</text><text x="70" y="128" fill="#475569" font-size="25" font-family="system-ui">Green dashboards are weak evidence when identity, decisions, effects, and cost cannot be joined.</text>
  <path d="M125 370h950" stroke="#94a3b8" stroke-width="10"/>
  <g font-family="system-ui" text-anchor="middle"><g><circle cx="145" cy="370" r="72" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="145" y="360" fill="#1e3a8a" font-size="25" font-weight="800">WHO</text><text x="145" y="394" fill="#1e3a8a" font-size="19">identity</text></g><g><circle cx="330" cy="370" r="72" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><text x="330" y="360" fill="#5b21b6" font-size="25" font-weight="800">WHERE</text><text x="330" y="394" fill="#5b21b6" font-size="19">route</text></g><g><circle cx="515" cy="370" r="72" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/><text x="515" y="360" fill="#991b1b" font-size="25" font-weight="800">WHY</text><text x="515" y="394" fill="#991b1b" font-size="19">policy</text></g><g><circle cx="700" cy="370" r="72" fill="#ffedd5" stroke="#f97316" stroke-width="4"/><text x="700" y="360" fill="#9a3412" font-size="25" font-weight="800">EFFECT</text><text x="700" y="394" fill="#9a3412" font-size="19">idempotent</text></g><g><circle cx="885" cy="370" r="72" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><text x="885" y="360" fill="#166534" font-size="25" font-weight="800">RESULT</text><text x="885" y="394" fill="#166534" font-size="19">outcome</text></g><g><circle cx="1070" cy="370" r="72" fill="#cffafe" stroke="#06b6d4" stroke-width="4"/><text x="1070" y="360" fill="#155e75" font-size="25" font-weight="800">COST</text><text x="1070" y="394" fill="#155e75" font-size="19">budget</text></g></g>
  <rect x="210" y="530" width="780" height="100" rx="25" fill="#0f172a"/><text x="600" y="574" text-anchor="middle" fill="#e2e8f0" font-size="27" font-family="ui-monospace,monospace">request_id + trace_id + task_id + audit_id</text><text x="600" y="607" text-anchor="middle" fill="#7dd3fc" font-size="21" font-family="system-ui">If they cannot join, an incident cannot be reconstructed.</text>
</svg>
