<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Thirty AI Platform production gates in six categories">
  <rect width="1200" height="780" rx="34" fill="#f8fafc"/><text x="70" y="80" fill="#0f172a" font-size="42" font-family="system-ui" font-weight="800">Thirty gates, six failure boundaries</text><text x="70" y="125" fill="#475569" font-size="25" font-family="system-ui">A strong model cannot compensate for a missing identity, transaction, or audit record.</text>
  <g font-family="system-ui"><g transform="translate(65 180)"><rect width="330" height="240" rx="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="28" y="52" fill="#1e3a8a" font-size="29" font-weight="800">IDENTITY · 5</text><text x="28" y="95" fill="#0f172a" font-size="21">envelope · tenant · delegation</text><text x="28" y="130" fill="#0f172a" font-size="21">scope · request propagation</text><text x="28" y="190" fill="#1d4ed8" font-size="23" font-weight="700">Who is acting?</text></g><g transform="translate(435 180)"><rect width="330" height="240" rx="25" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="28" y="52" fill="#5b21b6" font-size="29" font-weight="800">GATEWAY · 5</text><text x="28" y="95" fill="#0f172a" font-size="21">429 · 401 · retry · budget</text><text x="28" y="130" fill="#0f172a" font-size="21">data-region eligibility</text><text x="28" y="190" fill="#6d28d9" font-size="23" font-weight="700">Where may it run?</text></g><g transform="translate(805 180)"><rect width="330" height="240" rx="25" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="28" y="52" fill="#991b1b" font-size="29" font-weight="800">POLICY · 5</text><text x="28" y="95" fill="#0f172a" font-size="21">risk · approval · injection</text><text x="28" y="130" fill="#0f172a" font-size="21">schema · argument binding</text><text x="28" y="190" fill="#b91c1c" font-size="23" font-weight="700">May it happen?</text></g><g transform="translate(65 460)"><rect width="330" height="240" rx="25" fill="#ffedd5" stroke="#f97316" stroke-width="3"/><text x="28" y="52" fill="#9a3412" font-size="29" font-weight="800">EXECUTION · 5</text><text x="28" y="95" fill="#0f172a" font-size="21">state · lease · idempotency</text><text x="28" y="130" fill="#0f172a" font-size="21">fencing · cancellation</text><text x="28" y="190" fill="#c2410c" font-size="23" font-weight="700">Did it happen once?</text></g><g transform="translate(435 460)"><rect width="330" height="240" rx="25" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="28" y="52" fill="#166534" font-size="29" font-weight="800">MEMORY · 5</text><text x="28" y="95" fill="#0f172a" font-size="21">expiry · tenant · trust</text><text x="28" y="130" fill="#0f172a" font-size="21">version · deletion</text><text x="28" y="190" fill="#15803d" font-size="23" font-weight="700">Is it still true?</text></g><g transform="translate(805 460)"><rect width="330" height="240" rx="25" fill="#cffafe" stroke="#06b6d4" stroke-width="3"/><text x="28" y="52" fill="#155e75" font-size="29" font-weight="800">EVIDENCE · 5</text><text x="28" y="95" fill="#0f172a" font-size="21">trace · audit · cost</text><text x="28" y="130" fill="#0f172a" font-size="21">outcome · recovery SLO</text><text x="28" y="190" fill="#0e7490" font-size="23" font-weight="700">Can we prove it?</text></g></g>
</svg>
