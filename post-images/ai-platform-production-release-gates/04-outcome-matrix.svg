<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="AI Platform outcome taxonomy distinguishes success, control, pending, and outage">
  <rect width="1200" height="740" rx="34" fill="#0f172a"/><text x="70" y="82" fill="#f8fafc" font-size="42" font-family="system-ui" font-weight="800">“Not completed” does not always mean “failed”</text><text x="70" y="128" fill="#94a3b8" font-size="25" font-family="system-ui">A correct denial and a waiting approval are healthy control outcomes.</text>
  <g font-family="system-ui"><rect x="75" y="205" width="500" height="190" rx="27" fill="#14532d" stroke="#86efac" stroke-width="3"/><text x="115" y="265" fill="#dcfce7" font-size="31" font-weight="800">COMPLETED</text><text x="115" y="310" fill="#bbf7d0" font-size="23">business outcome verified</text><text x="115" y="350" fill="#86efac" font-size="22">success · include cost and quality</text><rect x="625" y="205" width="500" height="190" rx="27" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="665" y="265" fill="#dbeafe" font-size="31" font-weight="800">DENIED</text><text x="665" y="310" fill="#bfdbfe" font-size="23">policy protected the boundary</text><text x="665" y="350" fill="#93c5fd" font-size="22">correct control · not an outage</text><rect x="75" y="440" width="500" height="190" rx="27" fill="#713f12" stroke="#fde68a" stroke-width="3"/><text x="115" y="500" fill="#fef3c7" font-size="31" font-weight="800">WAITING_APPROVAL</text><text x="115" y="545" fill="#fde68a" font-size="23">durable task, no side effect yet</text><text x="115" y="585" fill="#fcd34d" font-size="22">pending · measure approval latency</text><rect x="625" y="440" width="500" height="190" rx="27" fill="#7f1d1d" stroke="#fca5a5" stroke-width="3"/><text x="665" y="500" fill="#fee2e2" font-size="31" font-weight="800">FAILED</text><text x="665" y="545" fill="#fecaca" font-size="23">unexpected loss of intended outcome</text><text x="665" y="585" fill="#fca5a5" font-size="22">outage · recover and explain</text></g>
</svg>
