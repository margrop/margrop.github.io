<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151d30" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" rx="16" />
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15" />

  <!-- Header -->
  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">生活大比方：为什么工业级 Agent 不能只靠大模型“单打独斗”？</text>
  <text x="600" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">—— 用“米其林星级后厨的流水线”彻底搞懂 AI Agent 工程化架构</text>

  <!-- Left: The Chef (LLM) -->
  <g transform="translate(60, 130)">
    <rect width="320" height="490" fill="url(#card1)" stroke="#38bdf8" stroke-width="2" rx="12" />
    <circle cx="160" cy="60" r="35" fill="#0369a1" />
    <text x="160" y="68" font-size="32" text-anchor="middle">👨‍🍳</text>
    <text x="160" y="125" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">大模型 (LLM / 认知引擎)</text>
    <text x="160" y="150" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">【米其林天才主厨】</text>

    <line x1="20" y1="170" x2="300" y2="170" stroke="#334155" stroke-width="1" />

    <text x="30" y="200" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399">✨ 绝世神技 (核心优势)：</text>
    <text x="30" y="225" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 精通全球 10 万道私房菜谱 (泛化推理)</text>
    <text x="30" y="248" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 刀工出神入化、出菜极快 (快速生成)</text>
    <text x="30" y="271" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 能随机构思天马行空的创意料理</text>

    <text x="30" y="315" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f87171">⚠️ 致命缺陷 (若无工程约束)：</text>
    <text x="30" y="340" font-family="sans-serif" font-size="13" fill="#fca5a5">• 记性只有 10 分钟 (上下文遗忘)</text>
    <text x="30" y="363" font-family="sans-serif" font-size="13" fill="#fca5a5">• 偶尔把盐当成糖放 (幻觉生成)</text>
    <text x="30" y="386" font-family="sans-serif" font-size="13" fill="#fca5a5">• 遇到菜烧焦会慌乱死循环翻炒 (死循环)</text>
    <text x="30" y="409" font-family="sans-serif" font-size="13" fill="#fca5a5">• 一兴奋可能拿刀去砸后厨水管 (无沙箱越权)</text>

    <rect x="25" y="440" width="270" height="35" fill="#1e293b" rx="6" />
    <text x="160" y="462" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="bold" text-anchor="middle">结论：单靠主厨撑不起一家餐厅！</text>
  </g>

  <!-- Middle: Connectors -->
  <g transform="translate(400, 340)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#glow)" stroke-width="4" stroke-dasharray="6,4" />
    <polygon points="65,0 55,-6 55,6" fill="#c084fc" />
    <text x="32" y="-15" font-family="sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">协同协作</text>
  </g>

  <!-- Right: The Kitchen Guardrails (Engineering System) -->
  <g transform="translate(480, 130)">
    <rect width="660" height="490" fill="url(#card1)" stroke="#818cf8" stroke-width="2" rx="12" />
    <text x="330" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#818cf8" text-anchor="middle">工业级工程化护栏系统 (Production Guardrails)</text>
    <text x="330" y="70" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">【现代化五星后厨的标准作业 SOP 与安全基础设施】</text>

    <line x1="20" y1="90" x2="640" y2="90" stroke="#334155" stroke-width="1" />

    <!-- Sub-card 1: FSM -->
    <rect x="30" y="110" width="280" height="150" fill="#1e293b" rx="8" stroke="#475569" stroke-width="1" />
    <text x="45" y="138" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. 配菜流水线看板 (状态机 FSM)</text>
    <text x="45" y="165" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 比方：备菜-炒菜-装盘严格单向流动</text>
    <text x="45" y="188" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 作用：严禁跳步、严禁无限重炒</text>
    <text x="45" y="211" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 技术：确定性状态图锁死执行流程</text>
    <text x="45" y="234" font-family="sans-serif" font-size="12" fill="#34d399">✓ 杜绝死循环与状态漂移</text>

    <!-- Sub-card 2: Schema -->
    <rect x="340" y="110" width="280" height="150" fill="#1e293b" rx="8" stroke="#475569" stroke-width="1" />
    <text x="355" y="138" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c084fc">2. 精密配料电子秤 (JSON Schema)</text>
    <text x="355" y="165" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 比方：调料必须精确到克，不可凭手感</text>
    <text x="355" y="188" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 作用：入参出参强制结构化校验</text>
    <text x="355" y="211" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 技术：Pydantic / Zod 双向拦截器</text>
    <text x="355" y="234" font-family="sans-serif" font-size="12" fill="#34d399">✓ 杜绝参数胡编乱造</text>

    <!-- Sub-card 3: Memory Ledger -->
    <rect x="30" y="280" width="280" height="150" fill="#1e293b" rx="8" stroke="#475569" stroke-width="1" />
    <text x="45" y="308" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">3. 传菜员的点菜单 (压缩分层记忆)</text>
    <text x="45" y="335" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 比方：只保留未上菜品与忌口，扔掉废话</text>
    <text x="45" y="358" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 作用：滑动窗口定期压缩与语义提炼</text>
    <text x="45" y="381" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 技术：Layered Context &amp; Ledger</text>
    <text x="45" y="404" font-family="sans-serif" font-size="12" fill="#34d399">✓ 杜绝上下文臃肿与注意力衰退</text>

    <!-- Sub-card 4: Sandbox & Gatekeeper -->
    <rect x="340" y="280" width="280" height="150" fill="#1e293b" rx="8" stroke="#475569" stroke-width="1" />
    <text x="355" y="308" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f43f5e">4. 灭火喷淋与安保台 (沙箱与验菜)</text>
    <text x="355" y="335" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 比方：易燃品放防爆柜，危险操作需经理签字</text>
    <text x="355" y="358" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 作用：文件/网络权限隔离与双人审核</text>
    <text x="355" y="381" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 技术：Landlock / eBPF / Human Gate</text>
    <text x="355" y="404" font-family="sans-serif" font-size="12" fill="#34d399">✓ 杜绝系统误删与特权逃逸</text>

    <!-- Bottom summary banner -->
    <rect x="30" y="445" width="590" height="30" fill="#1e1e38" rx="6" />
    <text x="325" y="465" font-family="sans-serif" font-size="13" fill="#818cf8" font-weight="bold" text-anchor="middle">工业结论：大模型只提供“智力”，工程护栏保障“100% 确定性”！</text>
  </g>
</svg>