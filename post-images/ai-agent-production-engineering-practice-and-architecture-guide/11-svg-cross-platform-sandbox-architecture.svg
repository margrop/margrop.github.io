<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151d30" />
    </linearGradient>
    <linearGradient id="c_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" rx="16" />
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15" />

  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">零依赖跨平台 AI Agent 生产护栏沙箱测试套件架构</text>
  <text x="600" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">适配 Windows 11 (PowerShell 7) / Ubuntu 26.04 (Bash) / macOS 27 (Zsh) | 双模式执行</text>

  <!-- Top Core Engine Test Specification -->
  <g transform="translate(60, 125)">
    <rect width="1080" height="150" fill="url(#c_card)" stroke="#6366f1" stroke-width="2" rx="10" />
    <text x="540" y="35" font-family="sans-serif" font-size="17" font-weight="bold" fill="#a5b4fc" text-anchor="middle">统一测试契约 (Unified Benchmark Protocol)</text>
    <line x1="20" y1="50" x2="1060" y2="50" stroke="#334155" stroke-width="1" />

    <g transform="translate(30, 70)">
      <rect width="230" height="60" fill="#182234" rx="6" />
      <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Module 1: 死循环熔断</text>
      <text x="15" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">检测递归调用在 depth=5 强行终止</text>
    </g>

    <g transform="translate(290, 70)">
      <rect width="230" height="60" fill="#182234" rx="6" />
      <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc">Module 2: 上下文精简压缩</text>
      <text x="15" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">压缩率 &gt; 95%，验证事实三元组</text>
    </g>

    <g transform="translate(550, 70)">
      <rect width="230" height="60" fill="#182234" rx="6" />
      <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f43f5e">Module 3: 沙箱隔离与逃逸拦截</text>
      <text x="15" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">越权路径拦截与 AST 危险命令过滤</text>
    </g>

    <g transform="translate(810, 70)">
      <rect width="240" height="60" fill="#182234" rx="6" />
      <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">Module 4: 强类型模式契约</text>
      <text x="15" y="46" font-family="sans-serif" font-size="11" fill="#94a3b8">Pydantic/JSON 静态校验与自动纠错</text>
    </g>
  </g>

  <!-- Bottom 3 Platform Cards -->
  <!-- Platform 1: Windows 11 -->
  <g transform="translate(60, 310)">
    <rect width="330" height="310" fill="url(#c_card)" stroke="#0078d4" stroke-width="1.5" rx="10" />
    <rect x="20" y="20" width="36" height="36" fill="#0078d4" rx="6" />
    <text x="38" y="45" font-size="20" text-anchor="middle" fill="#ffffff">🪟</text>
    <text x="70" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">Windows 11</text>
    <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8">PowerShell 7.4+ Core</text>
    <line x1="20" y1="70" x2="310" y2="70" stroke="#334155" stroke-width="1" />

    <text x="25" y="98" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 文件: <tspan fill="#38bdf8" font-family="monospace">agent_prod_sandbox_windows11.ps1</tspan></text>
    <text x="25" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 原生特性: AppContainer / ConPTY</text>
    <text x="25" y="150" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 执行方式: pwsh -File ./agent_sandbox.ps1</text>
    <text x="25" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 依赖需求: 纯原生，零外部 pip/npm 依赖</text>

    <rect x="20" y="205" width="290" height="85" fill="#182234" rx="6" />
    <text x="35" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">双模式支持 (Dual-Mode):</text>
    <text x="35" y="252" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. 人工模式: -Interactive (彩色可视化进度)</text>
    <text x="35" y="274" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Agent 模式: -AgentMode (静默纯净 JSON)</text>
  </g>

  <!-- Platform 2: Ubuntu 26.04 -->
  <g transform="translate(435, 310)">
    <rect width="330" height="310" fill="url(#c_card)" stroke="#e95420" stroke-width="1.5" rx="10" />
    <rect x="20" y="20" width="36" height="36" fill="#e95420" rx="6" />
    <text x="38" y="45" font-size="20" text-anchor="middle" fill="#ffffff">🐧</text>
    <text x="70" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fb923c">Ubuntu 26.04 LTS</text>
    <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8">GNU Bash 5.3+ / Linux 6.14+</text>
    <line x1="20" y1="70" x2="310" y2="70" stroke="#334155" stroke-width="1" />

    <text x="25" y="98" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 文件: <tspan fill="#fb923c" font-family="monospace">agent_prod_sandbox_ubuntu2604.sh</tspan></text>
    <text x="25" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 原生特性: Linux Landlock / cgroups v2</text>
    <text x="25" y="150" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 执行方式: bash ./agent_sandbox.sh</text>
    <text x="25" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 依赖需求: 纯原生 Linux Coreutils</text>

    <rect x="20" y="205" width="290" height="85" fill="#182234" rx="6" />
    <text x="35" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fb923c">双模式支持 (Dual-Mode):</text>
    <text x="35" y="252" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. 人工模式: --manual (高对比终端输出)</text>
    <text x="35" y="274" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Agent 模式: --agent (机器读取 JSON 契约)</text>
  </g>

  <!-- Platform 3: macOS 27 -->
  <g transform="translate(810, 310)">
    <rect width="330" height="310" fill="url(#c_card)" stroke="#a855f7" stroke-width="1.5" rx="10" />
    <rect x="20" y="20" width="36" height="36" fill="#a855f7" rx="6" />
    <text x="38" y="45" font-size="20" text-anchor="middle" fill="#ffffff">🍎</text>
    <text x="70" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c084fc">macOS 27 (Apple Silicon)</text>
    <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#94a3b8">Zsh 5.9+ / Darwin 26+</text>
    <line x1="20" y1="70" x2="310" y2="70" stroke="#334155" stroke-width="1" />

    <text x="25" y="98" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 文件: <tspan fill="#c084fc" font-family="monospace">agent_prod_sandbox_macos27.zsh</tspan></text>
    <text x="25" y="125" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 原生特性: sandbox-exec / pfctl anchor</text>
    <text x="25" y="150" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 执行方式: zsh ./agent_sandbox.zsh</text>
    <text x="25" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 依赖需求: 纯原生，零 Homebrew 依赖</text>

    <rect x="20" y="205" width="290" height="85" fill="#182234" rx="6" />
    <text x="35" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc">双模式支持 (Dual-Mode):</text>
    <text x="35" y="252" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. 人工模式: --manual (彩色终端交互报告)</text>
    <text x="35" y="274" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Agent 模式: --agent (结构化退出码与日志)</text>
  </g>
</svg>