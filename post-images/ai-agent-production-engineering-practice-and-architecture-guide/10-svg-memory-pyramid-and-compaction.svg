<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151d30" />
    </linearGradient>
    <linearGradient id="c_top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="c_mid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="c_bot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" rx="16" />
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15" />

  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">AI Agent 分层记忆金字塔与上下文滑动压缩机制</text>
  <text x="600" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">如何用 4k-8k 的恒定上下文开销，承载长达数周、成千上万步的复杂长周期任务？</text>

  <!-- Left: Memory Pyramid -->
  <g transform="translate(100, 140)">
    <!-- Pyramid Level 1: Working Memory -->
    <polygon points="260,20 160,130 360,130" fill="url(#c_top)" opacity="0.9" />
    <text x="260" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">活跃工作记忆</text>
    <text x="260" y="112" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">(Working Memory)</text>

    <!-- Pyramid Level 2: Episodic Ledger -->
    <polygon points="155,138 365,138 435,260 85,260" fill="url(#c_mid)" opacity="0.85" />
    <text x="260" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">结构化情景账本</text>
    <text x="260" y="220" font-family="sans-serif" font-size="13" fill="#f1f5f9" text-anchor="middle">(Episodic State Ledger)</text>

    <!-- Pyramid Level 3: Semantic Long-Term Memory -->
    <polygon points="80,268 440,268 510,400 10,400" fill="url(#c_bot)" opacity="0.8" />
    <text x="260" y="330" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">长期语义记忆 &amp; 外部知识库</text>
    <text x="260" y="358" font-family="sans-serif" font-size="13" fill="#fef3c7" text-anchor="middle">(Semantic Vector Store &amp; Knowledge Graph)</text>
  </g>

  <!-- Right: Detailed Mechanism Breakdown -->
  <g transform="translate(640, 130)">
    <!-- Box 1 -->
    <rect x="0" y="10" width="480" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8" />
    <text x="20" y="38" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. 工作记忆 (容量: 2k-4k Tokens | 毫秒级命中)</text>
    <text x="20" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 只保存当前步骤的 System Prompt、最近 1-2 轮 Tool Call 和输入</text>
    <text x="20" y="88" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 极速响应，保证 Prompt Caching 命中率 &gt; 85%，端到端延迟低</text>
    <text x="20" y="110" font-family="sans-serif" font-size="12" fill="#34d399">✓ 绝不堆砌历史废话，注意力 100% 聚焦当下目标</text>

    <!-- Box 2 -->
    <rect x="0" y="150" width="480" height="135" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="8" />
    <text x="20" y="178" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c084fc">2. 情景账本 (滑动压缩 | 丢弃噪音提取事实)</text>
    <text x="20" y="205" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 当轮次超过 3 轮时，由轻量模型将过去的 Tool Output 压缩为事实三元组</text>
    <text x="20" y="228" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 例如：100KB 日志压缩为 “已在 auth.py:45 确认 JWT 密钥过期错误”</text>
    <text x="20" y="251" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 压缩比高达 95%+，从根源消灭注意力漂移</text>
    <text x="20" y="272" font-family="sans-serif" font-size="12" fill="#34d399">✓ 兼顾历史因果连续性与轻量化上下文</text>

    <!-- Box 3 -->
    <rect x="0" y="305" width="480" height="130" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8" />
    <text x="20" y="333" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">3. 长期记忆 (持久化存储 | 向量召回)</text>
    <text x="20" y="360" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 用户偏好、企业业务规则、历史代码库索引沉淀至持久存储</text>
    <text x="20" y="383" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 采用混合检索 (BM25 关键词 + Dense 向量 + 重排 Rerank)</text>
    <text x="20" y="406" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 每次只拉取 Top-3 相关碎片精准注入，按需取用</text>
    <text x="20" y="426" font-family="sans-serif" font-size="12" fill="#34d399">✓ 记忆无限扩展，且与模型窗口解耦</text>
  </g>

  <!-- Bottom Quote Banner -->
  <g transform="translate(100, 580)">
    <rect width="1020" height="50" fill="#1e293b" rx="8" stroke="#334155" stroke-width="1" />
    <text x="510" y="31" font-family="sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="bold">工程心法：</tspan> 上下文窗口越来越大（1M/2M），但优秀工程师必须把它当作<tspan fill="#ef4444" font-weight="bold">昂贵稀缺的 CPU L1 缓存</tspan>来敬畏与打理！
    </text>
  </g>
</svg>