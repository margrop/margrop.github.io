<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151d30" />
    </linearGradient>
    <linearGradient id="box_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" rx="16" />
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15" />

  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">工业级 AI Agent 全生命周期全景架构图 (Industrial Reference Architecture)</text>
  <text x="600" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">双层解耦：外层确定性状态机编排 + 内层受限认知推理引擎 + 纵深防御沙箱</text>

  <!-- Layer 1: Ingress & Gate -->
  <g transform="translate(60, 120)">
    <rect width="240" height="500" fill="url(#box_blue)" stroke="#38bdf8" stroke-width="1.5" rx="10" />
    <text x="120" y="35" font-family="sans-serif" font-size="17" font-weight="bold" fill="#38bdf8" text-anchor="middle">1. 接入层与安全闸门</text>
    <line x1="15" y1="55" x2="225" y2="55" stroke="#334155" stroke-width="1" />

    <rect x="20" y="75" width="200" height="70" fill="#182234" rx="6" />
    <text x="35" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">API Gateway &amp; Auth</text>
    <text x="35" y="128" font-family="sans-serif" font-size="12" fill="#94a3b8">OAuth2 / JWT / Rate Limit</text>

    <rect x="20" y="165" width="200" height="85" fill="#182234" rx="6" />
    <text x="35" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f87171">Prompt Guardrail</text>
    <text x="35" y="218" font-family="sans-serif" font-size="12" fill="#94a3b8">• Injection Filter</text>
    <text x="35" y="238" font-family="sans-serif" font-size="12" fill="#94a3b8">• Jailbreak Detection</text>

    <rect x="20" y="270" width="200" height="95" fill="#182234" rx="6" />
    <text x="35" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">Budget Controller</text>
    <text x="35" y="323" font-family="sans-serif" font-size="12" fill="#94a3b8">• Max Tokens Quota</text>
    <text x="35" y="343" font-family="sans-serif" font-size="12" fill="#94a3b8">• Cost Threshold Alert</text>
    <text x="35" y="360" font-family="sans-serif" font-size="12" fill="#94a3b8">• Max Step Depth = 10</text>

    <rect x="20" y="385" width="200" height="90" fill="#182234" rx="6" />
    <text x="35" y="415" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">Human-in-the-Loop</text>
    <text x="35" y="438" font-family="sans-serif" font-size="12" fill="#94a3b8">• High-Risk Op Escalation</text>
    <text x="35" y="458" font-family="sans-serif" font-size="12" fill="#94a3b8">• Async 2FA Approval</text>
  </g>

  <!-- Layer 2: Deterministic State Machine (Core) -->
  <g transform="translate(340, 120)">
    <rect width="520" height="500" fill="url(#box_blue)" stroke="#818cf8" stroke-width="2" rx="10" />
    <text x="260" y="35" font-family="sans-serif" font-size="17" font-weight="bold" fill="#818cf8" text-anchor="middle">2. 编排核心：确定性状态机 (Deterministic FSM)</text>
    <line x1="20" y1="55" x2="500" y2="55" stroke="#334155" stroke-width="1" />

    <!-- State flow boxes -->
    <g transform="translate(30, 80)">
      <rect width="130" height="55" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6" />
      <text x="65" y="33" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">INIT / PARSE</text>
    </g>
    <line x1="160" y1="107" x2="195" y2="107" stroke="#818cf8" stroke-width="2" />

    <g transform="translate(195, 80)">
      <rect width="130" height="55" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="6" />
      <text x="65" y="33" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">PLANNING</text>
    </g>
    <line x1="325" y1="107" x2="360" y2="107" stroke="#818cf8" stroke-width="2" />

    <g transform="translate(360, 80)">
      <rect width="130" height="55" fill="#1e293b" stroke="#34d399" stroke-width="1.5" rx="6" />
      <text x="65" y="33" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">EXECUTE</text>
    </g>

    <!-- LLM Node in the center -->
    <rect x="50" y="165" width="420" height="135" fill="#111827" stroke="#6366f1" stroke-width="1.5" rx="8" />
    <text x="260" y="195" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a5b4fc" text-anchor="middle">⚡ 受控 LLM 认知推理引擎 (Stateless Reasoning Unit)</text>
    <text x="70" y="225" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Prompt Caching &amp; Schema-constrained Decoding (json_schema)</text>
    <text x="70" y="248" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Strict Structured Output Validator (Pydantic / Zod)</text>
    <text x="70" y="271" font-family="sans-serif" font-size="13" fill="#fbbf24">• Circuit Breaker: Max 3 Retries on Schema Failure -&gt; Fallback Node</text>

    <!-- Memory Subsystem inside FSM -->
    <rect x="50" y="325" width="420" height="145" fill="#182234" stroke="#475569" stroke-width="1" rx="8" />
    <text x="260" y="355" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">💾 分层记忆与上下文精简账本 (Tiered Memory Ledger)</text>
    <text x="70" y="385" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 活跃工作记忆 (Working Memory): Sliding Window 4k-8k</text>
    <text x="70" y="408" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 事件状态账本 (Episodic Ledger): 关键事件摘要，自动丢弃原始噪音</text>
    <text x="70" y="431" font-family="sans-serif" font-size="13" fill="#cbd5e1">• 长期向量/图记忆 (Semantic RAG): 按需精准召回，杜绝大海捞针</text>
    <text x="70" y="454" font-family="sans-serif" font-size="12" fill="#34d399">✓ 保证上下文长度恒定，根除 Lost-in-the-Middle 上下文衰退</text>
  </g>

  <!-- Layer 3: Tool Execution & Sandbox -->
  <g transform="translate(900, 120)">
    <rect width="240" height="500" fill="url(#box_blue)" stroke="#34d399" stroke-width="1.5" rx="10" />
    <text x="120" y="35" font-family="sans-serif" font-size="17" font-weight="bold" fill="#34d399" text-anchor="middle">3. 工具执行与沙箱隔离</text>
    <line x1="15" y1="55" x2="225" y2="55" stroke="#334155" stroke-width="1" />

    <rect x="20" y="75" width="200" height="90" fill="#182234" rx="6" />
    <text x="35" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Filesystem Sandbox</text>
    <text x="35" y="128" font-family="sans-serif" font-size="12" fill="#94a3b8">• Linux Landlock</text>
    <text x="35" y="148" font-family="sans-serif" font-size="12" fill="#94a3b8">• Workspace Chroot Only</text>

    <rect x="20" y="180" width="200" height="90" fill="#182234" rx="6" />
    <text x="35" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Network Egress Filter</text>
    <text x="35" y="233" font-family="sans-serif" font-size="12" fill="#94a3b8">• Internal IP Drop</text>
    <text x="35" y="253" font-family="sans-serif" font-size="12" fill="#94a3b8">• Domain Whitelist Proxy</text>

    <rect x="20" y="285" width="200" height="90" fill="#182234" rx="6" />
    <text x="35" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Idempotent Execution</text>
    <text x="35" y="338" font-family="sans-serif" font-size="12" fill="#94a3b8">• Transactional Rollback</text>
    <text x="35" y="358" font-family="sans-serif" font-size="12" fill="#94a3b8">• Request Idempotency Key</text>

    <rect x="20" y="390" width="200" height="90" fill="#182234" rx="6" />
    <text x="35" y="420" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Telemetry &amp; Audit</text>
    <text x="35" y="443" font-family="sans-serif" font-size="12" fill="#94a3b8">• OpenInference Tracing</text>
    <text x="35" y="463" font-family="sans-serif" font-size="12" fill="#94a3b8">• Immutable Audit Trail</text>
  </g>
</svg>