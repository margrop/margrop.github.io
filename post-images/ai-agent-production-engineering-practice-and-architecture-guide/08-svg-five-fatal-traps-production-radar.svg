<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#151d30" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" rx="16" />
  <rect x="2" y="2" width="1196" height="676" fill="none" stroke="#334155" stroke-width="1.5" rx="15" />

  <text x="600" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">生产环境 AI Agent 五大致命架构死穴与概率雪崩曲线</text>
  <text x="600" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">—— 为什么“单步 95% 准确率”的多轮 Agent 在实际生产中成功率不足 35%？</text>

  <!-- Left: Five Fatal Traps Cards -->
  <g transform="translate(60, 130)">
    <rect width="520" height="500" fill="url(#card)" stroke="#ef4444" stroke-width="1.5" rx="12" />
    <text x="260" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f87171" text-anchor="middle">生产落地的 5 大致命架构陷阱</text>
    <line x1="20" y1="60" x2="500" y2="60" stroke="#334155" stroke-width="1" />

    <g transform="translate(30, 80)">
      <rect width="460" height="70" fill="#182234" rx="8" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f87171">1. 死循环风暴 (Infinite Tool Loops)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">报错后自言自语无脑重试，瞬间烧毁几十万 Token 并打爆下游</text>
    </g>

    <g transform="translate(30, 160)">
      <rect width="460" height="70" fill="#182234" rx="8" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fb923c">2. 上下文注意力衰减 (Context Rot &amp; Dilution)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">随着轮次增加，原始系统约束被冲刷遗忘，产生“越跑越呆”</text>
    </g>

    <g transform="translate(30, 240)">
      <rect width="460" height="70" fill="#182234" rx="8" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#facc15">3. 工具幻觉与脏写 (Tool Hallucination &amp; Side-Effects)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">虚构不存在的 API 字段，或非幂等操作重复提交导致脏数据</text>
    </g>

    <g transform="translate(30, 320)">
      <rect width="460" height="70" fill="#182234" rx="8" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#e879f9">4. 越权利用与沙箱逃逸 (Security Escapes)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">Prompt Injection 诱骗 Agent 越过沙箱读取敏感凭证甚至删库</text>
    </g>

    <g transform="translate(30, 400)">
      <rect width="460" height="70" fill="#182234" rx="8" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">5. 非确定性调试地狱 (Non-Deterministic Chaos)</text>
      <text x="20" y="52" font-family="sans-serif" font-size="13" fill="#cbd5e1">线上偶然复现致命 Bug，线下回放 50 次由于采样完全无法复现</text>
    </g>
  </g>

  <!-- Right: Cascading Probability Curve -->
  <g transform="translate(620, 130)">
    <rect width="520" height="500" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5" rx="12" />
    <text x="260" y="40" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fbbf24" text-anchor="middle">多步骤概率雪崩数学法则：P(总) = p^n</text>
    <line x1="20" y1="60" x2="500" y2="60" stroke="#334155" stroke-width="1" />

    <!-- Chart Axes -->
    <line x1="60" y1="360" x2="480" y2="360" stroke="#64748b" stroke-width="1.5" />
    <line x1="60" y1="100" x2="60" y2="360" stroke="#64748b" stroke-width="1.5" />

    <!-- Y labels -->
    <text x="45" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">100%</text>
    <text x="45" y="165" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">75%</text>
    <text x="45" y="225" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">50%</text>
    <text x="45" y="285" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">25%</text>
    <text x="45" y="360" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">0%</text>

    <!-- X labels -->
    <text x="60" y="380" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Step 1</text>
    <text x="140" y="380" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Step 3</text>
    <text x="220" y="380" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Step 5</text>
    <text x="300" y="380" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Step 8</text>
    <text x="400" y="380" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Step 12</text>

    <!-- Curve 1: p=0.90 (Red Avalanche) -->
    <path d="M 60,126 Q 140,170 220,206 T 400,287" fill="none" stroke="#ef4444" stroke-width="3" />
    <circle cx="60" cy="126" r="4" fill="#ef4444" />
    <circle cx="220" cy="206" r="4" fill="#ef4444" />
    <circle cx="400" cy="287" r="4" fill="#ef4444" />
    <text x="410" y="292" font-family="sans-serif" font-size="12" fill="#ef4444" font-weight="bold">p=90% 跌至 28.2%</text>

    <!-- Curve 2: p=0.98 With Guardrails (Green Solid Line) -->
    <path d="M 60,105 Q 220,110 400,120" fill="none" stroke="#10b981" stroke-width="3" />
    <circle cx="60" cy="105" r="4" fill="#10b981" />
    <circle cx="400" cy="120" r="4" fill="#10b981" />
    <text x="410" y="125" font-family="sans-serif" font-size="12" fill="#10b981" font-weight="bold">护栏干预: 稳定 &gt; 95%</text>

    <!-- Bottom Math Summary -->
    <rect x="25" y="410" width="470" height="70" fill="#182234" rx="8" stroke="#334155" stroke-width="1" />
    <text x="40" y="435" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">硬核工程真理：</text>
    <text x="40" y="460" font-family="sans-serif" font-size="13" fill="#cbd5e1">“没有确定性护栏的多步 Agent，在数学上注定无法大规模跑通生产！”</text>
  </g>
</svg>