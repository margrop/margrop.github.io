<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">三大平台典型报错信息对比</text>
  
  <!-- Codex error -->
  <rect x="50" y="80" width="220" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ef4444">Codex</text>
  <text x="160" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#cbd5e1">Error 503</text>
  <text x="160" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#cbd5e1">Service Unavailable</text>
  <text x="160" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">The server is currently</text>
  <text x="160" y="212" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">unable to handle the</text>
  <text x="160" y="229" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">request due to temporary</text>
  <text x="160" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">overloading</text>
  
  <!-- Claude error -->
  <rect x="290" y="80" width="220" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ef4444">Claude</text>
  <text x="400" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#cbd5e1">Error 529</text>
  <text x="400" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#cbd5e1">Overloaded</text>
  <text x="400" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Claude is currently</text>
  <text x="400" y="212" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">experiencing high demand.</text>
  <text x="400" y="229" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Please try again later.</text>
  
  <!-- Grok error -->
  <rect x="530" y="80" width="220" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="110" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ef4444">Grok</text>
  <text x="640" y="145" text-anchor="middle" font-family="monospace" font-size="12" fill="#cbd5e1">Error 502</text>
  <text x="640" y="165" text-anchor="middle" font-family="monospace" font-size="12" fill="#cbd5e1">Bad Gateway</text>
  <text x="640" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">The server received an</text>
  <text x="640" y="212" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">invalid response from</text>
  <text x="640" y="229" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">the upstream server</text>
  
  <!-- Common pattern -->
  <rect x="100" y="300" width="600" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#f59e0b">共同特征分析</text>
  
  <text x="400" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="#cbd5e1">• 错误码均为 5xx 系列，指向服务端问题而非客户端</text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial" font-size="14" fill="#cbd5e1">• 错误信息均提及"过载"、"暂时不可用"等关键词</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#cbd5e1">• 三家平台几乎同时出现故障，指向共同依赖项</text>
</svg>
