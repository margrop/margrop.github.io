<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">生活化比喻：网红餐厅同时爆满</text>
  
  <!-- Restaurant illustration -->
  <g transform="translate(100, 100)">
    <!-- Building -->
    <rect x="0" y="50" width="200" height="180" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="20" y="80" width="40" height="40" fill="#0ea5e9"/>
    <rect x="80" y="80" width="40" height="40" fill="#0ea5e9"/>
    <rect x="140" y="80" width="40" height="40" fill="#0ea5e9"/>
    <rect x="20" y="140" width="40" height="40" fill="#0ea5e9"/>
    <rect x="80" y="140" width="40" height="40" fill="#ef4444"/>
    <rect x="140" y="140" width="40" height="40" fill="#0ea5e9"/>
    <rect x="0" y="30" width="200" height="20" fill="#ef4444"/>
    <text x="100" y="45" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">AI 餐厅</text>
    
    <!-- People queue -->
    <circle cx="250" cy="100" r="12" fill="#64748b"/>
    <circle cx="280" cy="100" r="12" fill="#64748b"/>
    <circle cx="310" cy="100" r="12" fill="#64748b"/>
    <circle cx="340" cy="100" r="12" fill="#64748b"/>
    <circle cx="370" cy="100" r="12" fill="#64748b"/>
    <text x="310" y="140" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">排队等待的用户</text>
  </g>
  
  <!-- Analogy text -->
  <g transform="translate(50, 380)">
    <rect x="0" y="0" width="700" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="350" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="#f8fafc">三家网红餐厅共用同一个中央厨房</text>
    <text x="350" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="#cbd5e1">当中央厨房（底层基础设施）出问题时，</text>
    <text x="350" y="75" text-anchor="middle" font-family="Arial" font-size="14" fill="#cbd5e1">无论哪家餐厅（AI 服务）都无法出餐</text>
  </g>
</svg>
