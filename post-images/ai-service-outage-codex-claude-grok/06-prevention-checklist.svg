<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">AI 服务中断防范清单</text>
  
  <rect x="50" y="80" width="340" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="90" cy="110" r="15" fill="#3b82f6"/>
  <text x="90" y="117" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">1</text>
  <text x="120" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">多平台账号</text>
  <text x="120" y="135" font-family="Arial" font-size="12" fill="#cbd5e1">注册 3-4 家 AI 服务商</text>
  <text x="120" y="152" font-family="Arial" font-size="12" fill="#cbd5e1">确保每家都有可用额度</text>
  <text x="120" y="169" font-family="Arial" font-size="12" fill="#94a3b8">推荐：Claude + Codex + Gemini</text>
  
  <rect x="410" y="80" width="340" height="120" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="450" cy="110" r="15" fill="#8b5cf6"/>
  <text x="450" y="117" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">2</text>
  <text x="480" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">统一接入层</text>
  <text x="480" y="135" font-family="Arial" font-size="12" fill="#cbd5e1">使用 One-API / New-API</text>
  <text x="480" y="152" font-family="Arial" font-size="12" fill="#cbd5e1">实现请求自动路由</text>
  <text x="480" y="169" font-family="Arial" font-size="12" fill="#94a3b8">支持故障转移与负载均衡</text>
  
  <rect x="50" y="220" width="340" height="120" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <circle cx="90" cy="250" r="15" fill="#22c55e"/>
  <text x="90" y="257" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">3</text>
  <text x="120" y="250" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">本地缓存</text>
  <text x="120" y="275" font-family="Arial" font-size="12" fill="#cbd5e1">常用 Prompt 模板保存</text>
  <text x="120" y="292" font-family="Arial" font-size="12" fill="#cbd5e1">历史结果缓存复用</text>
  <text x="120" y="309" font-family="Arial" font-size="12" fill="#94a3b8">减少重复请求，降低成本</text>
  
  <rect x="410" y="220" width="340" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="450" cy="250" r="15" fill="#f59e0b"/>
  <text x="450" y="257" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">4</text>
  <text x="480" y="250" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">监控告警</text>
  <text x="480" y="275" font-family="Arial" font-size="12" fill="#cbd5e1">实时监控服务状态</text>
  <text x="480" y="292" font-family="Arial" font-size="12" fill="#cbd5e1">设置自动切换阈值</text>
  <text x="480" y="309" font-family="Arial" font-size="12" fill="#94a3b8">邮件 / 钉钉 / 企业微信通知</text>
  
  <rect x="50" y="360" width="340" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="90" cy="390" r="15" fill="#ef4444"/>
  <text x="90" y="397" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">5</text>
  <text x="120" y="390" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">降级预案</text>
  <text x="120" y="415" font-family="Arial" font-size="12" fill="#cbd5e1">准备离线工作模式</text>
  <text x="120" y="432" font-family="Arial" font-size="12" fill="#cbd5e1">关键任务人工接管流程</text>
  <text x="120" y="449" font-family="Arial" font-size="12" fill="#94a3b8">文档化应急预案</text>
  
  <rect x="410" y="360" width="340" height="120" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="450" cy="390" r="15" fill="#06b6d4"/>
  <text x="450" y="397" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">6</text>
  <text x="480" y="390" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">定期演练</text>
  <text x="480" y="415" font-family="Arial" font-size="12" fill="#cbd5e1">模拟服务中断场景</text>
  <text x="480" y="432" font-family="Arial" font-size="12" fill="#cbd5e1">测试切换流程有效性</text>
  <text x="480" y="449" font-family="Arial" font-size="12" fill="#94a3b8">每季度至少一次演练</text>
</svg>
