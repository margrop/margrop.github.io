<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f172a"/>
  
  <rect x="50" y="50" width="700" height="350" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <rect x="50" y="50" width="700" height="30" rx="8" fill="#334155"/>
  <circle cx="70" cy="65" r="6" fill="#ef4444"/>
  <circle cx="90" cy="65" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="65" r="6" fill="#22c55e"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#94a3b8">Terminal — Codex API Test</text>
  
  <text x="70" y="110" font-family="monospace" font-size="13" fill="#22c55e">$ curl -X POST https://api.openai.com/v1/chat/completions</text>
  <text x="70" y="135" font-family="monospace" font-size="13" fill="#94a3b8">  -H "Authorization: Bearer $OPENAI_KEY"</text>
  <text x="70" y="160" font-family="monospace" font-size="13" fill="#94a3b8">  -d '{"model": "codex-1", "messages": [...]}'</text>
  
  <text x="70" y="200" font-family="monospace" font-size="13" fill="#ef4444">HTTP/2 503</text>
  <text x="70" y="225" font-family="monospace" font-size="13" fill="#ef4444">content-type: application/json</text>
  <text x="70" y="250" font-family="monospace" font-size="13" fill="#ef4444">retry-after: 120</text>
  
  <text x="70" y="290" font-family="monospace" font-size="13" fill="#cbd5e1">{</text>
  <text x="70" y="315" font-family="monospace" font-size="13" fill="#cbd5e1">  "error": {</text>
  <text x="70" y="340" font-family="monospace" font-size="13" fill="#ef4444">    "message": "The server is currently overloaded",</text>
  <text x="70" y="365" font-family="monospace" font-size="13" fill="#ef4444">    "type": "server_error",</text>
  <text x="70" y="390" font-family="monospace" font-size="13" fill="#ef4444">    "code": "service_unavailable"</text>
  <text x="70" y="415" font-family="monospace" font-size="13" fill="#cbd5e1">  }</text>
  <text x="70" y="440" font-family="monospace" font-size="13" fill="#cbd5e1">}</text>
</svg>
