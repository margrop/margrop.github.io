<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#0f172a"/>
  
  <rect x="50" y="50" width="700" height="300" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <rect x="50" y="50" width="700" height="30" rx="8" fill="#334155"/>
  <circle cx="70" cy="65" r="6" fill="#ef4444"/>
  <circle cx="90" cy="65" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="65" r="6" fill="#22c55e"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#94a3b8">Terminal — Grok API Test</text>
  
  <text x="70" y="110" font-family="monospace" font-size="13" fill="#22c55e">$ curl -X POST https://api.x.ai/v1/chat/completions</text>
  <text x="70" y="135" font-family="monospace" font-size="13" fill="#94a3b8">  -H "Authorization: Bearer $XAI_KEY"</text>
  <text x="70" y="160" font-family="monospace" font-size="13" fill="#94a3b8">  -d '{"model": "grok-4", "messages": [...]}'</text>
  
  <text x="70" y="200" font-family="monospace" font-size="13" fill="#ef4444">HTTP/2 502</text>
  <text x="70" y="225" font-family="monospace" font-size="13" fill="#ef4444">content-type: text/html</text>
  
  <text x="70" y="265" font-family="monospace" font-size="13" fill="#cbd5e1">&lt;html&gt;</text>
  <text x="70" y="290" font-family="monospace" font-size="13" fill="#cbd5e1">&lt;head&gt;&lt;title&gt;502 Bad Gateway&lt;/title&gt;&lt;/head&gt;</text>
  <text x="70" y="315" font-family="monospace" font-size="13" fill="#ef4444">&lt;body&gt;The server received an invalid response&lt;/body&gt;</text>
  <text x="70" y="340" font-family="monospace" font-size="13" fill="#cbd5e1">&lt;/html&gt;</text>
</svg>
