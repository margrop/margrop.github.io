<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">服务监控仪表盘（模拟）</text>
  
  <!-- Dashboard frame -->
  <rect x="50" y="70" width="700" height="400" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="50" y="70" width="700" height="40" rx="8" fill="#334155"/>
  <text x="70" y="95" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">AI Service Status Monitor</text>
  <text x="730" y="95" text-anchor="end" font-family="Arial" font-size="14" fill="#94a3b8">2026-09-03 20:15:00</text>
  
  <!-- Status cards -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fca5a5">Codex</text>
    <text x="100" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="#fca5a5">❌ Down</text>
    <text x="100" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">Since 19:15</text>
  </g>
  
  <g transform="translate(300, 130)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fca5a5">Claude</text>
    <text x="100" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="#fca5a5">❌ Down</text>
    <text x="100" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">Since 19:42</text>
  </g>
  
  <g transform="translate(520, 130)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fca5a5">Grok</text>
    <text x="100" y="55" text-anchor="middle" font-family="Arial" font-size="14" fill="#fca5a5">❌ Down</text>
    <text x="100" y="72" text-anchor="middle" font-family="Arial" font-size="11" fill="#94a3b8">Since 20:05</text>
  </g>
  
  <!-- Graph area -->
  <rect x="80" y="230" width="640" height="200" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="400" y="255" text-anchor="middle" font-family="Arial" font-size="14" fill="#94a3b8">请求成功率趋势 (%)</text>
  
  <!-- Graph lines -->
  <polyline points="100,280 150,275 200,270 250,400 300,410 350,405 400,380 450,350 500,320 550,300 600,290 650,285 700,280" 
    fill="none" stroke="#ef4444" stroke-width="3"/>
  
  <!-- X axis labels -->
  <text x="100" y="450" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">19:00</text>
  <text x="250" y="450" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">19:30</text>
  <text x="400" y="450" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">20:00</text>
  <text x="550" y="450" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">20:30</text>
  <text x="700" y="450" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">21:00</text>
  
  <!-- Y axis labels -->
  <text x="70" y="280" text-anchor="end" font-family="Arial" font-size="11" fill="#64748b">100%</text>
  <text x="70" y="350" text-anchor="end" font-family="Arial" font-size="11" fill="#64748b">50%</text>
  <text x="70" y="420" text-anchor="end" font-family="Arial" font-size="11" fill="#64748b">0%</text>
</svg>
