<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">服务恢复时间线</text>
  <text x="400" y="70" text-anchor="middle" font-family="Arial" font-size="14" fill="#94a3b8">从故障发生到完全恢复的全过程</text>
  
  <line x1="100" y1="150" x2="700" y2="150" stroke="#475569" stroke-width="3"/>
  
  <circle cx="150" cy="150" r="10" fill="#ef4444"/>
  <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="13" fill="#f8fafc">13:26</text>
  <text x="150" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">故障开始</text>
  <text x="150" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">Investigating</text>
  
  <circle cx="280" cy="150" r="10" fill="#f59e0b"/>
  <text x="280" y="120" text-anchor="middle" font-family="Arial" font-size="13" fill="#f8fafc">13:41</text>
  <text x="280" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">定位问题</text>
  <text x="280" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">Identified</text>
  
  <circle cx="410" cy="150" r="10" fill="#f59e0b"/>
  <text x="410" y="120" text-anchor="middle" font-family="Arial" font-size="13" fill="#f8fafc">14:49</text>
  <text x="410" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">确认受影响范围</text>
  <text x="410" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">Opus 系列全线</text>
  
  <circle cx="540" cy="150" r="10" fill="#22c55e"/>
  <text x="540" y="120" text-anchor="middle" font-family="Arial" font-size="13" fill="#f8fafc">16:06</text>
  <text x="540" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">修复部署</text>
  <text x="540" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">Monitoring</text>
  
  <circle cx="650" cy="150" r="10" fill="#22c55e"/>
  <text x="650" y="120" text-anchor="middle" font-family="Arial" font-size="13" fill="#f8fafc">16:23</text>
  <text x="650" y="180" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">完全恢复</text>
  <text x="650" y="197" text-anchor="middle" font-family="Arial" font-size="11" fill="#cbd5e1">Resolved</text>
  
  <rect x="200" y="240" width="400" height="80" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="270" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">总恢复时长：约 3 小时</text>
  <text x="400" y="295" text-anchor="middle" font-family="Arial" font-size="13" fill="#94a3b8">13:26 UTC → 16:23 UTC（北京时间 21:26 → 次日 00:23）</text>
  
  <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">数据来源：Anthropic 官方状态页 status.anthropic.com</text>
</svg>
