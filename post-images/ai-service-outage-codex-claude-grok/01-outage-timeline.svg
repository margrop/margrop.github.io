<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#0f172a"/>
  
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#f8fafc">宕机时间线</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial" font-size="16" fill="#94a3b8">2026年9月3日 晚间</text>
  
  <!-- Timeline -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#475569" stroke-width="3"/>
  
  <!-- Event 1 -->
  <circle cx="150" cy="200" r="12" fill="#ef4444"/>
  <text x="150" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#f8fafc">19:15</text>
  <text x="150" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">用户开始报告</text>
  <text x="150" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">Codex 响应缓慢</text>
  
  <!-- Event 2 -->
  <circle cx="300" cy="200" r="12" fill="#ef4444"/>
  <text x="300" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#f8fafc">19:42</text>
  <text x="300" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">Claude API</text>
  <text x="300" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">大面积超时</text>
  
  <!-- Event 3 -->
  <circle cx="450" cy="200" r="12" fill="#ef4444"/>
  <text x="450" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#f8fafc">20:05</text>
  <text x="450" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">Grok 服务</text>
  <text x="450" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">完全中断</text>
  
  <!-- Event 4 -->
  <circle cx="600" cy="200" r="12" fill="#f59e0b"/>
  <text x="600" y="170" text-anchor="middle" font-family="Arial" font-size="14" fill="#f8fafc">21:30</text>
  <text x="600" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">服务陆续</text>
  <text x="600" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#cbd5e1">开始恢复</text>
  
  <!-- Legend -->
  <rect x="250" y="320" width="300" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="280" cy="345" r="8" fill="#ef4444"/>
  <text x="300" y="350" font-family="Arial" font-size="14" fill="#cbd5e1">服务中断</text>
  <circle cx="420" cy="345" r="8" fill="#f59e0b"/>
  <text x="440" y="350" font-family="Arial" font-size="14" fill="#cbd5e1">逐步恢复</text>
</svg>
