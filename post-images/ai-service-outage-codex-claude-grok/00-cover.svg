<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="alert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc">AI 大宕机之夜</text>
  <text x="400" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8">当 Codex、Claude、Grok 同时倒下</text>
  
  <!-- Server icons -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="20" width="90" height="12" rx="2" fill="#64748b"/>
    <rect x="15" y="45" width="90" height="12" rx="2" fill="#64748b"/>
    <rect x="15" y="70" width="90" height="12" rx="2" fill="#64748b"/>
    <circle cx="60" cy="120" r="20" fill="#ef4444"/>
    <text x="60" y="128" text-anchor="middle" font-family="Arial" font-size="24" fill="white">✕</text>
    <text x="60" y="185" text-anchor="middle" font-family="Arial" font-size="16" fill="#cbd5e1">Codex</text>
  </g>
  
  <g transform="translate(340, 180)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="20" width="90" height="12" rx="2" fill="#64748b"/>
    <rect x="15" y="45" width="90" height="12" rx="2" fill="#64748b"/>
    <rect x="15" y="70" width="90" height="12" rx="2" fill="#64748b"/>
    <circle cx="60" cy="120" r="20" fill="#ef4444"/>
    <text x="60" y="128" text-anchor="middle" font-family="Arial" font-size="24" fill="white">✕</text>
    <text x="60" y="185" text-anchor="middle" font-family="Arial" font-size="16" fill="#cbd5e1">Claude</text>
  </g>
  
  <g transform="translate(530, 180)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="20" width="90" height="12" rx="2" fill="#64748b"/>
    <rect x="15" y="45" width="90" height="12" rx="2" fill="#64748b"/>
    <rect x="15" y="70" width="90" height="12" rx="2" fill="#64748b"/>
    <circle cx="60" cy="120" r="20" fill="#ef4444"/>
    <text x="60" y="128" text-anchor="middle" font-family="Arial" font-size="24" fill="white">✕</text>
    <text x="60" y="185" text-anchor="middle" font-family="Arial" font-size="16" fill="#cbd5e1">Grok</text>
  </g>
  
  <!-- Alert banner -->
  <rect x="200" y="380" width="400" height="50" rx="6" fill="url(#alert)" opacity="0.9"/>
  <text x="400" y="412" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">SYSTEM OUTAGE</text>
  
  <!-- Date -->
  <text x="400" y="435" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">2026.09.03</text>
</svg>
