<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">AI 服务依赖架构图</text>
  
  <!-- User layer -->
  <rect x="300" y="80" width="200" height="50" rx="8" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">用户 / 开发者</text>
  
  <!-- API Gateway layer -->
  <rect x="250" y="160" width="300" height="50" rx="8" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">API 网关层</text>
  
  <!-- Service layer -->
  <rect x="100" y="240" width="180" height="50" rx="8" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
  <text x="190" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Codex</text>
  
  <rect x="310" y="240" width="180" height="50" rx="8" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
  <text x="400" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Claude</text>
  
  <rect x="520" y="240" width="180" height="50" rx="8" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
  <text x="610" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Grok</text>
  
  <!-- Infrastructure layer -->
  <rect x="200" y="330" width="400" height="60" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">共享云基础设施 / CDN / DNS</text>
  
  <!-- Arrows -->
  <line x1="400" y1="130" x2="400" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="210" x2="190" y2="240" stroke="#a78bfa" stroke-width="2"/>
  <line x1="400" y1="210" x2="400" y2="240" stroke="#a78bfa" stroke-width="2"/>
  <line x1="610" y1="210" x2="610" y2="240" stroke="#a78bfa" stroke-width="2"/>
  <line x1="190" y1="290" x2="190" y2="330" stroke="#f87171" stroke-width="2"/>
  <line x1="400" y1="290" x2="400" y2="330" stroke="#f87171" stroke-width="2"/>
  <line x1="610" y1="290" x2="610" y2="330" stroke="#f87171" stroke-width="2"/>
  
  <!-- Warning -->
  <rect x="150" y="420" width="500" height="60" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="445" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fca5a5">⚠️ 单点故障风险：多家服务依赖同一基础设施</text>
  <text x="400" y="465" text-anchor="middle" font-family="Arial" font-size="12" fill="#fca5a5">当共享层出现问题时，所有上层服务同时受影响</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>
