<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">生活化比喻：为什么三家会同时出问题？</text>
  
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">Claude 餐厅</text>
    <text x="100" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">高端法式料理</text>
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">Opus 系列招牌菜</text>
    <circle cx="100" cy="115" r="15" fill="#ef4444"/>
    <text x="100" y="122" text-anchor="middle" font-family="Arial" font-size="18" fill="white">✕</text>
  </g>
  
  <g transform="translate(320, 100)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">Codex 餐厅</text>
    <text x="100" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">美式快餐</text>
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">代码生成专供</text>
    <circle cx="100" cy="115" r="15" fill="#ef4444"/>
    <text x="100" y="122" text-anchor="middle" font-family="Arial" font-size="18" fill="white">✕</text>
  </g>
  
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#334155" stroke="#475569" stroke-width="2"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#f8fafc">Grok 餐厅</text>
    <text x="100" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">新式融合菜</text>
    <text x="100" y="85" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">实时信息检索</text>
    <circle cx="100" cy="115" r="15" fill="#ef4444"/>
    <text x="100" y="122" text-anchor="middle" font-family="Arial" font-size="18" fill="white">✕</text>
  </g>
  
  <g transform="translate(250, 280)">
    <rect x="0" y="0" width="300" height="120" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
    <text x="150" y="35" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#fca5a5">共享中央厨房</text>
    <text x="150" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="#fca5a5">GPU 集群 / CDN / 云服务</text>
    <text x="150" y="90" text-anchor="middle" font-family="Arial" font-size="12" fill="#fca5a5">（AWS / GCP / Azure / Cloudflare）</text>
  </g>
  
  <line x1="200" y1="250" x2="400" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="420" y1="250" x2="400" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="640" y1="250" x2="400" y2="280" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  
  <rect x="150" y="430" width="500" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="460" text-anchor="middle" font-family="Arial" font-size="14" fill="#f8fafc">💡 核心原因：三家共用同一套底层基础设施，一损俱损</text>
</svg>
