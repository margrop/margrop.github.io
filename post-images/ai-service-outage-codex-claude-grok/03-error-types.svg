<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f172a"/>
  
  <text x="400" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#f8fafc">典型错误类型分析</text>
  
  <rect x="50" y="80" width="340" height="160" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="220" y="115" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#ef4444">Claude API</text>
  <text x="220" y="150" text-anchor="middle" font-family="monospace" font-size="14" fill="#cbd5e1">HTTP 529 Overloaded</text>
  <text x="220" y="175" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">"Claude is currently experiencing</text>
  <text x="220" y="195" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">high demand. Please try again later."</text>
  <text x="220" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">错误类型：overloaded_error</text>
  
  <rect x="410" y="80" width="340" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="115" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#f59e0b">Codex / OpenAI</text>
  <text x="580" y="150" text-anchor="middle" font-family="monospace" font-size="14" fill="#cbd5e1">HTTP 503 Service Unavailable</text>
  <text x="580" y="175" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">"The server is currently overloaded"</text>
  <text x="580" y="195" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">retry-after: 120 seconds</text>
  <text x="580" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">错误类型：server_error</text>
  
  <rect x="230" y="260" width="340" height="160" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#3b82f6">Grok / xAI</text>
  <text x="400" y="330" text-anchor="middle" font-family="monospace" font-size="14" fill="#cbd5e1">HTTP 502 Bad Gateway</text>
  <text x="400" y="355" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">"The server received an invalid</text>
  <text x="400" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">response from the upstream server"</text>
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">错误类型：gateway_error</text>
</svg>
