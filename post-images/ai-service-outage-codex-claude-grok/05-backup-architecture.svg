  <line x1="450" y1="210" x2="470" y2="240" stroke="#a78bfa" stroke-width="2"/>
  <line x1="500" y1="210" x2="630" y2="240" stroke="#a78bfa" stroke-width="2"/>
  
  <rect x="200" y="420" width="400" height="60" rx="6" fill="#0f172a" stroke="#22c55e"/>
