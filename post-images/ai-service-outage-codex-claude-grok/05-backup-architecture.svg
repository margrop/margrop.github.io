  <rect x="240" y="240" width="140" height="50" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="310" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Codex (备)</text>
  
  <rect x="400" y="240" width="140" height="50" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="470" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Gemini (备)</text>
  
  <rect x="560" y="240" width="140" height="50" rx="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <text x="630" y="270" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">Grok (备)</text>
  
  <line x1="150" y1="290" x2="150" y2="340" stroke="#4ade80" stroke-width="2"/>
  <line x1="310" y1="290" x2="310" y2="340" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="470" y1="290" x2="470" y2="340" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="630" y1="290" x2="630" y2="340" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,5"/>
  
