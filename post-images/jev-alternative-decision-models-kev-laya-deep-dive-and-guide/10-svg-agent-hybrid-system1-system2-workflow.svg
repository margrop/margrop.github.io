<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0a0e17; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <rect width="1200" height="680" fill="#0a0e17"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold">工业落地推荐架构：双轨智能协同（System 1 本能网关 + System 2 深度长考）</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="15">将 90% 的高频机械式决策在 20ms 内解决，为大模型省下 95% 的账单与等待时间</text>

  <!-- Step 1: User Request -->
  <g transform="translate(60, 240)">
    <rect width="180" height="180" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="90" y="50" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">海量高并发输入</text>
    <text x="90" y="85" text-anchor="middle" fill="#94a3b8" font-size="13">• 客服工单分流</text>
    <text x="90" y="110" text-anchor="middle" fill="#94a3b8" font-size="13">• 安全风控拦截</text>
    <text x="90" y="135" text-anchor="middle" fill="#94a3b8" font-size="13">• Agent 工具路由</text>
    <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-size="13">• 意图模式分类</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 330 L 315 330" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <polygon points="325,330 315,324 315,336" fill="#38bdf8"/>

  <!-- Step 2: System 1 Reflex Gate -->
  <g transform="translate(330, 150)">
    <rect width="360" height="360" rx="16" fill="#0c4a6e" opacity="0.6" stroke="#0284c7" stroke-width="2"/>
    <rect x="20" y="20" width="320" height="38" rx="8" fill="#0369a1"/>
    <text x="180" y="45" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">System 1 本地极速反射中枢 (Kev / Laya)</text>

    <text x="35" y="90" fill="#bae6fd" font-size="14" font-weight="bold">⚡ 决策时延：15 ~ 35 ms</text>
    <text x="35" y="115" fill="#bae6fd" font-size="14" font-weight="bold">🪙 Token 消耗：0 输出 Token（完全免费）</text>
    <text x="35" y="140" fill="#bae6fd" font-size="14" font-weight="bold">🛡️ 类型错误：0.00%（绝对类型安全）</text>

    <line x1="20" y1="165" x2="340" y2="165" stroke="#0369a1" stroke-width="1"/>

    <text x="35" y="195" fill="#f8fafc" font-size="14" font-weight="bold">自动置信度分流逻辑：</text>
    <rect x="25" y="215" width="310" height="50" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
    <text x="180" y="245" text-anchor="middle" fill="#4ade80" font-size="14">置信度 ≥ 0.85 (占比 ~92%)</text>

    <rect x="25" y="280" width="310" height="50" rx="6" fill="#082f49" stroke="#f59e0b" stroke-width="1"/>
    <text x="180" y="310" text-anchor="middle" fill="#fbbf24" font-size="14">置信度 &lt; 0.85 或极端长尾 (占比 ~8%)</text>
  </g>

  <!-- Arrow Top: Direct Fast Path -->
  <path d="M 695 240 L 810 240 L 810 180 L 880 180" stroke="#4ade80" stroke-width="3" fill="none"/>
  <polygon points="890,180 880,174 880,186" fill="#4ade80"/>
  <text x="760" y="220" fill="#4ade80" font-size="13" font-weight="bold">极速直通车 (92%)</text>

  <!-- Direct Result -->
  <g transform="translate(895, 110)">
    <rect width="250" height="140" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="125" y="40" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="bold">毫秒级确定性执行</text>
    <text x="25" y="70" fill="#d1fae5" font-size="13">• 自动派单至指定业务线</text>
    <text x="25" y="95" fill="#d1fae5" font-size="13">• 本地直接放行 / 拦截阻断</text>
    <text x="25" y="120" fill="#d1fae5" font-size="13">• 耗时 &lt; 40ms，端到端丝滑</text>
  </g>

  <!-- Arrow Bottom: Fallback Slow Path -->
  <path d="M 695 305 L 810 305 L 810 460 L 880 460" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <polygon points="890,460 880,454 880,466" fill="#f59e0b"/>
  <text x="750" y="440" fill="#fbbf24" font-size="13" font-weight="bold">回退兜底 (8%)</text>

  <!-- Heavy LLM Result -->
  <g transform="translate(895, 390)">
    <rect width="250" height="150" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="125" y="40" text-anchor="middle" fill="#fde68a" font-size="16" font-weight="bold">System 2 复杂推理解析</text>
    <text x="25" y="70" fill="#fef3c7" font-size="13">• 调用 GPT-5 / Claude 深度长考</text>
    <text x="25" y="95" fill="#fef3c7" font-size="13">• 多步骤链式思维 (CoT) 辨析</text>
    <text x="25" y="120" fill="#fef3c7" font-size="13">• 人工审核挂起与高级排障</text>
  </g>

  <!-- Bottom Metric Box -->
  <rect x="60" y="560" width="1080" height="80" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="600" y="595" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">综合收益：全系统整体吞吐量飙升 12.8 倍，端到端平均延迟由 4.5 秒压至 68 毫秒，大模型推理账单骤降 91.4%！</text>
  <text x="600" y="622" text-anchor="middle" fill="#94a3b8" font-size="13">既享受了小模型带来的零延迟与零成本优势，又保底拥有大模型的顶级推理兜底。</text>
</svg>