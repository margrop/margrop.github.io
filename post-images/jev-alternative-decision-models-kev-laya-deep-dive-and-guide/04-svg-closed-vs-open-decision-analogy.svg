<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="cardLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#081c24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="55" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold">生动大比方：闭源 Jev 高级裁缝铺 vs 开源自建 Kev/Laya 家用智能缝纫机</text>
  <text x="600" y="88" text-anchor="middle" fill="#9ca3af" font-size="16">小学生秒懂：为什么天下开发者宁可自己找布料，也要连夜把缝纫机搬回自己家？</text>

  <!-- Left Card: Closed Jev API -->
  <g transform="translate(60, 120)">
    <rect width="510" height="510" rx="16" fill="url(#cardLeft)" stroke="#374151" stroke-width="1.5"/>
    <rect x="25" y="25" width="460" height="42" rx="8" fill="#374151" opacity="0.6"/>
    <text x="255" y="52" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">🏦 闭源 Jev（跨洋高档私人裁缝店）</text>

    <g transform="translate(25, 90)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">1</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">隐私红线：必须寄出核心敏感数据</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">每量一次尺寸（每个工单/数据），全得走公网送去远方云端。</text>
    </g>

    <g transform="translate(25, 170)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">2</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">延迟枷锁：路上来回跑断腿</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">就算裁缝下剪刀只要30ms，跨洋送快递（网络握手）仍要200ms。</text>
    </g>

    <g transform="translate(25, 250)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">3</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">成本黑洞：裁缝按次收保护费</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">高并发流水线一天刷上亿次决策，账单足以压垮任何技术团队。</text>
    </g>

    <g transform="translate(25, 330)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">4</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">黑盒封印：无法缝制特殊冷门花样</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">行业专用术语和私有业务标签无法微调，只能看官方脸色。</text>
    </g>
  </g>

  <!-- Right Card: Open-Source Kev / Laya -->
  <g transform="translate(630, 120)">
    <rect width="510" height="510" rx="16" fill="url(#cardRight)" stroke="#0e7490" stroke-width="1.5"/>
    <rect x="25" y="25" width="460" height="42" rx="8" fill="#0891b2" opacity="0.2"/>
    <text x="255" y="52" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">⚙️ 开源替代 Kev / Laya（自家客厅智能裁缝机）</text>

    <g transform="translate(25, 90)">
      <circle cx="15" cy="18" r="12" fill="#06b6d4" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">1</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">数据绝对主权：100% 物理留存本地</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">数据在自己的服务器/NPU中流转，合规审计零风险，彻底断网可用。</text>
    </g>

    <g transform="translate(25, 170)">
      <circle cx="15" cy="18" r="12" fill="#06b6d4" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">2</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">真·毫秒级极速：本地总线直达 15~30ms</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">消除全部网络往返跳数，微秒级进程间通信，实现真正的神经膝跳反射。</text>
    </g>

    <g transform="translate(25, 250)">
      <circle cx="15" cy="18" r="12" fill="#06b6d4" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">3</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">零推理成本：用电不用钱，无限次调用</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">消费级显卡或 MacBook 就能畅跑，边际推理成本趋近于零。</text>
    </g>

    <g transform="translate(25, 330)">
      <circle cx="15" cy="18" r="12" fill="#06b6d4" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">4</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">自由微调：定制属于你的专属决策头</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">用几百条自有工单微调一个 LoRA 适配器，准确率立拔10个百分点。</text>
    </g>
  </g>
</svg>