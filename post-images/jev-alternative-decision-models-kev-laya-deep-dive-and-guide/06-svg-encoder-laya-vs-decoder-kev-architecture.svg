<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="boxLaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="boxKev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="#090d16"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold">两大开源技术路线：现代双向 Encoder 流派 (Laya) vs 因果基座指针头流派 (Kev)</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="15">从底层矩阵计算结构解析：为什么它们都能做到“不吐文字、纯直出高保真概率”？</text>

  <!-- Left: Laya Architecture -->
  <g transform="translate(60, 110)">
    <rect width="510" height="520" rx="14" fill="url(#boxLaya)" stroke="#0891b2" stroke-width="1.5"/>
    <text x="255" y="40" text-anchor="middle" fill="#38bdf8" font-size="19" font-weight="bold">流派 A：纯双向 Encoder (ModernBERT-421M)</text>
    <text x="255" y="65" text-anchor="middle" fill="#67e8f9" font-size="13">代表模型：Laya (Convai Innovations, Apache 2.0)</text>

    <!-- Block 1 -->
    <rect x="30" y="90" width="450" height="70" rx="8" fill="#0e7490" opacity="0.4" stroke="#22d3ee" stroke-width="1"/>
    <text x="50" y="118" fill="#f8fafc" font-size="15" font-weight="bold">输入层：拼接 State 与 Typed Questions</text>
    <text x="50" y="142" fill="#bae6fd" font-size="13">[CLS] 状态上下文 [SEP] 问题描述 [SEP] 候选选项集合 [EOS]</text>

    <!-- Block 2 -->
    <rect x="30" y="180" width="450" height="120" rx="8" fill="#0e7490" opacity="0.6" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="50" y="210" fill="#f8fafc" font-size="15" font-weight="bold">核心骨干：ModernBERT 全双向无因果掩码注意力</text>
    <text x="50" y="235" fill="#bae6fd" font-size="13">• 全局 O(N²) 双向上下文通读，无视前后顺序影响</text>
    <text x="50" y="258" fill="#bae6fd" font-size="13">• 仅 421M 参数量，显存占用不足 1GB，CPU 即可极速推理</text>
    <text x="50" y="281" fill="#bae6fd" font-size="13">• FlashAttention-3 加速，单次前向延迟低至 15~30ms</text>

    <!-- Block 3 -->
    <rect x="30" y="320" width="450" height="90" rx="8" fill="#0891b2" opacity="0.5" stroke="#22d3ee" stroke-width="1"/>
    <text x="50" y="350" fill="#f8fafc" font-size="15" font-weight="bold">决策头：多任务池化投影 (Multi-Task Pooling Head)</text>
    <text x="50" y="375" fill="#bae6fd" font-size="13">抽取对应问题与选项的隐层特征向量做内积相似度比对</text>
    <text x="50" y="398" fill="#38bdf8" font-size="13">Logits = W_proj · h_q ⊙ h_options</text>

    <!-- Block 4 -->
    <rect x="30" y="430" width="450" height="60" rx="8" fill="#155e75" stroke="#22d3ee" stroke-width="1"/>
    <text x="255" y="465" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="bold">直出结果：Softmax 标定概率分布（0 Token 消耗）</text>
  </g>

  <!-- Right: Kev Architecture -->
  <g transform="translate(630, 110)">
    <rect width="510" height="520" rx="14" fill="url(#boxKev)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="255" y="40" text-anchor="middle" fill="#818cf8" font-size="19" font-weight="bold">流派 B：因果基座 + 指针头 (Qwen 3.5 0.8B~27B)</text>
    <text x="255" y="65" text-anchor="middle" fill="#a5b4fc" font-size="13">代表模型：Kev (Jared Palmer, Qwen 3.5 LoRA + Pointer Head)</text>

    <!-- Block 1 -->
    <rect x="30" y="90" width="450" height="70" rx="8" fill="#4338ca" opacity="0.4" stroke="#818cf8" stroke-width="1"/>
    <text x="50" y="118" fill="#f8fafc" font-size="15" font-weight="bold">输入层：共享 State 前缀 + 独立问题分支 (Prefix Cache)</text>
    <text x="50" y="142" fill="#c7d2fe" font-size="13">状态文本编码一次，各独立问题并行挂载，问题间相互隔离不可见</text>

    <!-- Block 2 -->
    <rect x="30" y="180" width="450" height="120" rx="8" fill="#4338ca" opacity="0.6" stroke="#818cf8" stroke-width="1.2"/>
    <text x="50" y="210" fill="#f8fafc" font-size="15" font-weight="bold">核心骨干：冻结千亿级通识基座 + 决策专用 LoRA</text>
    <text x="50" y="235" fill="#c7d2fe" font-size="13">• 继承 Qwen 超强零样本世界通识与泛化理解能力</text>
    <text x="50" y="258" fill="#c7d2fe" font-size="13">• 彻底切除传统自回归文本生成头 (Bypass lm_head)</text>
    <text x="50" y="281" fill="#c7d2fe" font-size="13">• 仅需 0.8B 到 4B 参数，即在未知任务上逼近闭源 Jev 精度</text>

    <!-- Block 3 -->
    <rect x="30" y="320" width="450" height="90" rx="8" fill="#4f46e5" opacity="0.5" stroke="#818cf8" stroke-width="1"/>
    <text x="50" y="350" fill="#f8fafc" font-size="15" font-weight="bold">决策头：指针分类头 (Pointer Head)</text>
    <text x="50" y="375" fill="#c7d2fe" font-size="13">将问题末尾 token 隐状态直接投影至候选选项坐标维度</text>
    <text x="50" y="398" fill="#818cf8" font-size="13">P(option_k) = Softmax(Score_MLP(h_last, option_k))</text>

    <!-- Block 4 -->
    <rect x="30" y="430" width="450" height="60" rx="8" fill="#3730a3" stroke="#818cf8" stroke-width="1"/>
    <text x="255" y="465" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="bold">直出结果：Brier Score 标定置信度分布（0 Token 消耗）</text>
  </g>
</svg>