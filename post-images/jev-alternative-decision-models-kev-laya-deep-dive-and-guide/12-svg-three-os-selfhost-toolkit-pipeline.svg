<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#090d16; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <rect width="1200" height="680" fill="#090d16"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold">零依赖跨平台自建决策中枢：三大操作系统守护运行流水线</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="15">无须任何三方闭源云服务，标准系统原生守护进程，开箱即用暴露 localhost:8009</text>

  <!-- Platform 1: Windows 11 -->
  <g transform="translate(60, 120)">
    <rect width="330" height="500" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="20" y="20" width="290" height="40" rx="8" fill="#0369a1"/>
    <text x="165" y="46" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">🪟 Windows 11 (26H2 Ready)</text>

    <text x="25" y="90" fill="#38bdf8" font-size="14" font-weight="bold">底层脚本：PowerShell 7.x</text>
    <text x="25" y="115" fill="#94a3b8" font-size="13">• 原生支持 DirectML / ONNX</text>
    <text x="25" y="135" fill="#94a3b8" font-size="13">• 无须 Admin 权限注册计划任务</text>

    <rect x="20" y="160" width="290" height="150" rx="8" fill="#1e293b"/>
    <text x="35" y="190" fill="#f8fafc" font-size="13" font-weight="bold">原生守护管理方式：</text>
    <text x="35" y="215" fill="#7dd3fc" font-size="12">Register-ScheduledTask 或</text>
    <text x="35" y="235" fill="#7dd3fc" font-size="12">Start-Job 后台持久化任务</text>
    <text x="35" y="260" fill="#94a3b8" font-size="12">自动注入 LOCALAPPDATA 环境变量</text>
    <text x="35" y="285" fill="#94a3b8" font-size="12">支持开机自启与崩溃自动唤醒</text>

    <rect x="20" y="330" width="290" height="145" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="35" y="360" fill="#38bdf8" font-size="13" font-weight="bold">端到端测试与集成：</text>
    <text x="35" y="385" fill="#e0f2fe" font-size="12">Invoke-RestMethod 本地压力自测</text>
    <text x="35" y="410" fill="#4ade80" font-size="12">端点：http://127.0.0.1:8009</text>
    <text x="35" y="435" fill="#e0f2fe" font-size="12">支持 Claude Desktop / MCP 挂载</text>
  </g>

  <!-- Platform 2: Ubuntu 26.04 -->
  <g transform="translate(435, 120)">
    <rect width="330" height="500" rx="14" fill="#0f172a" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="20" y="20" width="290" height="40" rx="8" fill="#c2410c"/>
    <text x="165" y="46" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">🐧 Ubuntu 26.04 LTS</text>

    <text x="25" y="90" fill="#fb923c" font-size="14" font-weight="bold">底层脚本：Bash (Strict Mode)</text>
    <text x="25" y="115" fill="#94a3b8" font-size="13">• Linux 6.x 内核 io_uring 加速</text>
    <text x="25" y="135" fill="#94a3b8" font-size="13">• 支持 CUDA / ROCm / CPU 矢量加速</text>

    <rect x="20" y="160" width="290" height="150" rx="8" fill="#1e293b"/>
    <text x="35" y="190" fill="#f8fafc" font-size="13" font-weight="bold">原生守护管理方式：</text>
    <text x="35" y="215" fill="#fdba74" font-size="12">systemd --user 隔离服务单元</text>
    <text x="35" y="235" fill="#fdba74" font-size="12">systemone-decision.service</text>
    <text x="35" y="260" fill="#94a3b8" font-size="12">Restart=on-failure / 内存软限制</text>
    <text x="35" y="285" fill="#94a3b8" font-size="12">标准日志输出至 journalctl -u</text>

    <rect x="20" y="330" width="290" height="145" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1"/>
    <text x="35" y="360" fill="#fb923c" font-size="13" font-weight="bold">端到端测试与集成：</text>
    <text x="35" y="385" fill="#ffedd5" font-size="12">curl -sS 回环回归验证</text>
    <text x="35" y="410" fill="#4ade80" font-size="12">端点：http://localhost:8009</text>
    <text x="35" y="435" fill="#ffedd5" font-size="12">支持 Docker / K8s Sidecar 容器化</text>
  </g>

  <!-- Platform 3: macOS 26 -->
  <g transform="translate(810, 120)">
    <rect width="330" height="500" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="20" y="20" width="290" height="40" rx="8" fill="#6d28d9"/>
    <text x="165" y="46" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">🍎 macOS 26 (Apple Silicon)</text>

    <text x="25" y="90" fill="#c084fc" font-size="14" font-weight="bold">底层脚本：Zsh (Native)</text>
    <text x="25" y="115" fill="#94a3b8" font-size="13">• Apple Silicon MLX 统一显存加速</text>
    <text x="25" y="135" fill="#94a3b8" font-size="13">• 16-Core NPU 毫秒级矩阵内积</text>

    <rect x="20" y="160" width="290" height="150" rx="8" fill="#1e293b"/>
    <text x="35" y="190" fill="#f8fafc" font-size="13" font-weight="bold">原生守护管理方式：</text>
    <text x="35" y="215" fill="#d8b4fe" font-size="12">~/Library/LaunchAgents 描述符</text>
    <text x="35" y="235" fill="#d8b4fe" font-size="12">net.margrop.systemone.plist</text>
    <text x="35" y="260" fill="#94a3b8" font-size="12">RunAtLoad / KeepAlive 常驻模式</text>
    <text x="35" y="285" fill="#94a3b8" font-size="12">退出自动拉起，零外部进程依赖</text>

    <rect x="20" y="330" width="290" height="145" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
    <text x="35" y="360" fill="#c084fc" font-size="13" font-weight="bold">端到端测试与集成：</text>
    <text x="35" y="385" fill="#f3e8ff" font-size="12">launchctl 状态比对与 curl 探测</text>
    <text x="35" y="410" fill="#4ade80" font-size="12">端点：http://localhost:8009</text>
    <text x="35" y="435" fill="#f3e8ff" font-size="12">TypeSafe Python SDK 直接重定向</text>
  </g>
</svg>