<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arr12" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad12)" rx="16"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#1f2937" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" fill="#f9fafb" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    零第三方依赖：跨三大主流操作系统的一键自动化探针架构
  </text>
  <text x="480" y="80" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    Windows 11 / Ubuntu 26.04 / macOS 26 原生脚本，支持“人工一键执行”与“Agent 自动部署”双模式
  </text>

  <!-- 3 OS Cards -->
  <g transform="translate(50, 110)">
    <!-- Windows 11 -->
    <rect width="260" height="230" fill="#111827" stroke="#374151" rx="10"/>
    <rect x="0" y="0" width="260" height="40" fill="#1e3a8a" rx="10 10 0 0"/>
    <text x="130" y="25" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      Windows 11 (PowerShell 7+)
    </text>
    <text x="20" y="65" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 原生 Invoke-RestMethod</text>
    <text x="20" y="90" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 零依赖执行，安全校验</text>
    <text x="20" y="115" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 自动适配 Windows Terminal</text>
    <rect x="15" y="145" width="230" height="60" fill="#030712" stroke="#1f2937" rx="6"/>
    <text x="130" y="170" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">step5_probe_win11.ps1</text>
    <text x="130" y="190" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">pwsh ./step5_probe_win11.ps1</text>
  </g>

  <g transform="translate(350, 110)">
    <!-- Ubuntu 26.04 -->
    <rect width="260" height="230" fill="#111827" stroke="#e11d48" stroke-width="1.5" rx="10"/>
    <rect x="0" y="0" width="260" height="40" fill="#881337" rx="10 10 0 0"/>
    <text x="130" y="25" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      Ubuntu 26.04 LTS (Bash)
    </text>
    <text x="20" y="65" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 原生 curl + jq (自动回退 grep)</text>
    <text x="20" y="90" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• Linux 服务器标准无人值守</text>
    <text x="20" y="115" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 完整 exit code 状态回传</text>
    <rect x="15" y="145" width="230" height="60" fill="#030712" stroke="#1f2937" rx="6"/>
    <text x="130" y="170" fill="#f43f5e" font-family="monospace" font-size="11" text-anchor="middle">step5_probe_ubuntu.sh</text>
    <text x="130" y="190" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">bash ./step5_probe_ubuntu.sh</text>
  </g>

  <g transform="translate(650, 110)">
    <!-- macOS 26 -->
    <rect width="260" height="230" fill="#111827" stroke="#374151" rx="10"/>
    <rect x="0" y="0" width="260" height="40" fill="#334155" rx="10 10 0 0"/>
    <text x="130" y="25" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      macOS 26 (Apple Silicon Zsh)
    </text>
    <text x="20" y="65" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 兼容 M 系列统一内存探测</text>
    <text x="20" y="90" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 系统内置 curl/python/sed 驱动</text>
    <text x="20" y="115" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="12">• 支持 iTerm2 / 终端直显颜色</text>
    <rect x="15" y="145" width="230" height="60" fill="#030712" stroke="#1f2937" rx="6"/>
    <text x="130" y="170" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">step5_probe_macos.zsh</text>
    <text x="130" y="190" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">zsh ./step5_probe_macos.zsh</text>
  </g>

  <!-- Bottom Execution Mode Banner -->
  <g transform="translate(50, 365)">
    <rect width="860" height="65" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="215" y="30" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      【模式 A：人工一键执行】
    </text>
    <text x="215" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">
      下载脚本 &rarr; 传入 STEPFUN_API_KEY &rarr; 终端秒级输出可视化结果
    </text>

    <line x1="430" y1="12" x2="430" y2="53" stroke="#475569"/>

    <text x="645" y="30" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      【模式 B：Agent 自动挂载】
    </text>
    <text x="645" y="50" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">
      AI Agent 通过 Tool Calling 自动下载探针 &rarr; 验证基模能力 &rarr; 挂载为主力模型
    </text>
  </g>
</svg>