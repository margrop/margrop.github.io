<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad5)" rx="16"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#1f2937" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" fill="#f9fafb" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    基座大模型帕累托前沿 (Pareto Frontier)：综合智能 vs 单任务推理成本
  </text>
  <text x="480" y="80" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    在越靠近左上方（智能极高、成本极低）的区间，代表越具压倒性的工业实用价值
  </text>

  <!-- Coordinate System -->
  <g transform="translate(100, 100)">
    <!-- Axes -->
    <line x1="60" y1="280" x2="780" y2="280" stroke="#374151" stroke-width="2"/>
    <line x1="60" y1="280" x2="60" y2="20" stroke="#374151" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="420" y="325" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      单任务综合调用成本 (Task Cost in USD · 对数刻度) &rarr;
    </text>
    <text x="-150" y="25" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90)">
      Artificial Analysis 智能指数 (分数) &rarr;
    </text>

    <!-- Grid lines -->
    <line x1="60" y1="220" x2="780" y2="220" stroke="#1f2937" stroke-dasharray="4"/>
    <text x="45" y="224" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="end">35</text>

    <line x1="60" y1="160" x2="780" y2="160" stroke="#1f2937" stroke-dasharray="4"/>
    <text x="45" y="164" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="end">40</text>

    <line x1="60" y1="100" x2="780" y2="100" stroke="#1f2937" stroke-dasharray="4"/>
    <text x="45" y="104" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="end">45</text>

    <line x1="60" y1="40" x2="780" y2="40" stroke="#1f2937" stroke-dasharray="4"/>
    <text x="45" y="44" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="end">50</text>

    <!-- X tick labels -->
    <text x="180" y="298" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">$0.005</text>
    <text x="340" y="298" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">$0.01</text>
    <text x="500" y="298" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">$0.04</text>
    <text x="680" y="298" fill="#6b7280" font-family="monospace" font-size="11" text-anchor="middle">$0.08</text>

    <!-- Pareto Frontier Curve -->
    <path d="M 320 110 Q 550 60 700 35" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="520" y="70" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-style="italic">
      Pareto Frontier (帕累托最优边界)
    </text>

    <!-- Models Plot Points -->
    <!-- GPT-6 Astra -->
    <circle cx="700" cy="35" r="7" fill="#f59e0b"/>
    <text x="700" y="20" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      GPT-6 Astra (51分 · $0.085)
    </text>

    <!-- Claude Opus 5 -->
    <circle cx="650" cy="55" r="7" fill="#cbd5e1"/>
    <text x="650" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Claude Opus 5 (49分 · $0.076)
    </text>

    <!-- Step 5 Preview: The Hero Point -->
    <circle cx="320" cy="110" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <rect x="180" y="125" width="280" height="58" fill="#0c2d48" stroke="#38bdf8" rx="6"/>
    <text x="320" y="145" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ★ Step 5 Preview (44分 · $0.0095)
    </text>
    <text x="320" y="165" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      成本削减至 1/8，稳居全球开源前三
    </text>

    <!-- Kimi K3 Max -->
    <circle cx="500" cy="120" r="6" fill="#64748b"/>
    <text x="500" y="142" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
      Kimi K3 Max (43分 · $0.038)
    </text>

    <!-- Qwen 3.5 120B -->
    <circle cx="440" cy="160" r="6" fill="#475569"/>
    <text x="440" y="180" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
      Qwen 3.5 120B (40分 · $0.024)
    </text>
  </g>
</svg>