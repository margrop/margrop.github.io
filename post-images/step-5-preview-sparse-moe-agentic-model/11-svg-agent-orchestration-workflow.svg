<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arr11" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad11)" rx="16"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    生产环境落地架构：以 Step 5 Preview 为核心的智能体编排拓扑
  </text>
  <text x="480" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    旗舰总工统筹 + 本地小模型预筛 + 确定性代码执行器，打造兼具极致性价比与工程确定性的系统
  </text>

  <!-- User / System Goal -->
  <g transform="translate(50, 190)">
    <rect width="140" height="100" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="70" y="38" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">业务系统 / 工程师</text>
    <text x="70" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">复杂长程任务派发</text>
    <rect x="15" y="74" width="110" height="18" fill="#0f172a" rx="4"/>
    <text x="70" y="87" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Issue / PR / Report</text>
  </g>

  <!-- Arrow to Step 5 Core -->
  <line x1="190" y1="240" x2="250" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr11)"/>

  <!-- Central Brain: Step 5 Preview -->
  <g transform="translate(260, 120)">
    <rect width="280" height="240" fill="#0c2d48" stroke="#0284c7" stroke-width="2" rx="12"/>
    <rect x="0" y="0" width="280" height="42" fill="#0369a1" rx="12 12 0 0"/>
    <text x="140" y="27" fill="#fff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      Step 5 Preview (大脑中枢总工)
    </text>
    
    <g transform="translate(18, 55)">
      <rect width="244" height="45" fill="#0f172a" stroke="#1e293b" rx="6"/>
      <text x="122" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">全局 1M 架构上下文掌控</text>
      <text x="122" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">跨几十个模块代码关系与需求全量驻留</text>

      <rect y="55" width="244" height="45" fill="#0f172a" stroke="#1e293b" rx="6"/>
      <text x="122" y="75" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">任务分解与动态调度</text>
      <text x="122" y="91" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">生成可执行 Tool Calls 与状态评估</text>

      <rect y="110" width="244" height="45" fill="#0f172a" stroke="#1e293b" rx="6"/>
      <text x="122" y="130" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">高性价比无限容错</text>
      <text x="122" y="146" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">1/8 成本支撑持续尝试纠错直至成功</text>
    </g>
  </g>

  <!-- Distribution Lines -->
  <line x1="540" y1="180" x2="620" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr11)"/>
  <line x1="540" y1="240" x2="620" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr11)"/>
  <line x1="540" y1="300" x2="620" y2="330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr11)"/>

  <!-- Execution Workers -->
  <g transform="translate(630, 110)">
    <rect width="270" height="70" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="135" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">本地轻量快速预筛 (SLM)</text>
    <text x="135" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">正则匹配、初级分词与格式粗筛</text>

    <rect y="90" width="270" height="70" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="135" y="118" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">代码编译 / 测试验证沙箱</text>
    <text x="135" y="142" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">pytest, cargo test, gcc, git diff 物理环境</text>

    <rect y="180" width="270" height="70" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="135" y="208" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">外部知识库 / 搜索 / API 适配</text>
    <text x="135" y="232" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">向量数据库、Web 实时检索、内部微服务</text>
  </g>
</svg>