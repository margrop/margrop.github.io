<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="denseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="moeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad3)" rx="16"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
    通俗大比方：传统密集大模型 vs 阶跃星辰 600B 稀疏 MoE 架构
  </text>
  <text x="480" y="82" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">
    为什么说 600B 参数仅激活 27B，就像一家拥有 600 位专家的医院只让 27 位医生进会诊室？
  </text>

  <!-- Left: Traditional Dense Model -->
  <g transform="translate(50, 110)">
    <rect width="410" height="320" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="410" height="42" fill="#2d1515" rx="10 10 0 0"/>
    <text x="205" y="27" fill="#f87171" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      传统密集大模型 (Dense 600B)
    </text>

    <!-- Metaphor Illustration -->
    <rect x="25" y="60" width="360" height="70" fill="#0f172a" stroke="#475569" stroke-width="1" rx="6"/>
    <text x="35" y="85" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">【全员出动的疲惫诊所】</text>
    <text x="35" y="112" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">
      病人哪怕只是手指划破个小口子，600 位医生也必须全员到场开会！
    </text>

    <!-- Visual Representation -->
    <g transform="translate(25, 145)">
      <rect width="360" height="95" fill="#181212" stroke="#7f1d1d" stroke-dasharray="4" rx="6"/>
      <text x="180" y="32" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        每次 Token 解码激活：全部 600B 参数！
      </text>
      <text x="180" y="58" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">
        显存带宽严重占满 · 巨额耗电 · 账单直线飙升
      </text>
      <rect x="40" y="70" width="280" height="12" fill="#ef4444" rx="6"/>
    </g>

    <!-- Outcome -->
    <text x="205" y="270" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      单次长程任务成本：$0.08 ~ $0.20 / 次（昂贵不可承受）
    </text>
    <text x="205" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">
      长周期智能体循环调用 100 次即濒临破产
    </text>
  </g>

  <!-- Right: Step 5 Preview Sparse MoE -->
  <g transform="translate(500, 110)">
    <rect width="410" height="320" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" rx="10"/>
    <rect x="0" y="0" width="410" height="42" fill="#0c2d48" rx="10 10 0 0"/>
    <text x="205" y="27" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      Step 5 Preview (稀疏 MoE 600B/27B)
    </text>

    <!-- Metaphor Illustration -->
    <rect x="25" y="60" width="360" height="70" fill="#0f172a" stroke="#0284c7" stroke-width="1" rx="6"/>
    <text x="35" y="85" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">【精准分诊的现代化超级三甲医院】</text>
    <text x="35" y="112" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">
      分诊台毫秒识别病因，仅召唤对应领域的 27 位专家入场会诊！
    </text>

    <!-- Visual Representation -->
    <g transform="translate(25, 145)">
      <rect width="360" height="95" fill="#082032" stroke="#0284c7" stroke-dasharray="4" rx="6"/>
      <text x="180" y="32" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
        每次 Token 解码激活：仅 27B 关键参数！
      </text>
      <text x="180" y="58" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">
        保留 600B 顶级智慧 · 计算量仅 4.5% · 速度快吞吐高
      </text>
      <rect x="40" y="70" width="280" height="12" fill="#1e293b" rx="6"/>
      <rect x="40" y="70" width="28" height="12" fill="#4ade80" rx="6"/>
    </g>

    <!-- Outcome -->
    <text x="205" y="270" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      单次任务成本：仅 Claude Opus 5 的 1/8（约 $0.0095）
    </text>
    <text x="205" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">
      支持千轮万步工具自由探索，真正成为工程师“主力工作机”
    </text>
  </g>
</svg>