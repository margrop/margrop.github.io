<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad9)" rx="16"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    Step 5 Preview 底层稀疏混合专家 (Sparse MoE) 路由原理
  </text>
  <text x="480" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    Router Gate 动态评估：总容量 600B 参数池，仅激活 Top-K 对应领域专家的 27B 参数
  </text>

  <!-- Input Token Stream -->
  <g transform="translate(60, 140)">
    <rect width="160" height="200" fill="#1e293b" stroke="#334155" rx="8"/>
    <text x="80" y="30" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">输入词元流</text>
    <rect x="20" y="50" width="120" height="32" fill="#0f172a" stroke="#0284c7" rx="4"/>
    <text x="80" y="71" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">Token: "CUDA_Sync"</text>
    <rect x="20" y="95" width="120" height="32" fill="#0f172a" stroke="#0284c7" rx="4"/>
    <text x="80" y="116" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">Token: "Loss_Grad"</text>
    <rect x="20" y="140" width="120" height="32" fill="#0f172a" stroke="#0284c7" rx="4"/>
    <text x="80" y="161" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">Token: "Risk_Ratio"</text>
  </g>

  <!-- Router Gate -->
  <line x1="220" y1="240" x2="270" y2="240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr9)"/>
  <g transform="translate(280, 130)">
    <polygon points="0,60 50,0 130,0 180,60 130,160 50,160" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="70" fill="#fff" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Router Gate</text>
    <text x="90" y="92" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">门控权重分发网络</text>
    <text x="90" y="115" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Top-K Selection</text>
  </g>

  <!-- Expert Bank (Total 600B) -->
  <line x1="470" y1="180" x2="520" y2="150" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr9)"/>
  <line x1="470" y1="210" x2="520" y2="210" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arr9)"/>
  <line x1="470" y1="240" x2="520" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="470" y1="270" x2="520" y2="330" stroke="#334155" stroke-width="1.5" stroke-dasharray="4"/>

  <g transform="translate(530, 110)">
    <!-- Active Expert 1 -->
    <rect x="0" y="10" width="220" height="50" fill="#0c2d48" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="110" y="32" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Expert #12: 高性能算子优化 [激活]
    </text>
    <text x="110" y="48" fill="#4ade80" font-family="monospace" font-size="10" text-anchor="middle">Weight: 0.68 · 激活参与计算</text>

    <!-- Active Expert 2 -->
    <rect x="0" y="75" width="220" height="50" fill="#0c2d48" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="110" y="97" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Expert #45: 硬件体系架构 [激活]
    </text>
    <text x="110" y="113" fill="#4ade80" font-family="monospace" font-size="10" text-anchor="middle">Weight: 0.32 · 激活参与计算</text>

    <!-- Dormant Experts -->
    <rect x="0" y="140" width="220" height="40" fill="#111827" stroke="#374151" rx="6"/>
    <text x="110" y="165" fill="#6b7280" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
      Expert #88: 金融报表审计 [休眠]
    </text>

    <rect x="0" y="195" width="220" height="40" fill="#111827" stroke="#374151" rx="6"/>
    <text x="110" y="220" fill="#6b7280" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">
      Expert #102: 司法文书分析 [休眠]
    </text>

    <text x="110" y="258" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11" font-style="italic" text-anchor="middle">
      ... 其余数百个专家保持待命状态 ...
    </text>
  </g>

  <!-- Output Weighted Sum -->
  <line x1="760" y1="180" x2="800" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr9)"/>
  <g transform="translate(810, 160)">
    <rect width="110" height="110" fill="#1e293b" stroke="#0284c7" rx="8"/>
    <text x="55" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">加权合成</text>
    <text x="55" y="65" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Σ (Wi * Ei)</text>
    <text x="55" y="90" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">输出高质量表征</text>
  </g>
</svg>