<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <marker id="arr7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad7)" rx="16"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#1e293b" stroke-width="1.5" rx="12"/>

  <!-- Title -->
  <text x="480" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    Step 5 Preview 原生面向真实 Agentic 任务的 1M 上下文闭环工作流
  </text>
  <text x="480" y="80" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    从非结构化需求，到自主多步工具链调用、环境反馈解析与 24 小时长程收敛
  </text>

  <!-- Step 1: Input & Context Ingestion -->
  <g transform="translate(60, 115)">
    <rect width="180" height="280" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="180" height="38" fill="#0284c7" rx="10 10 0 0"/>
    <text x="90" y="24" fill="#fff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      1. 超长上下文吞吐
    </text>
    <text x="90" y="65" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">1M Tokens Window</text>
    
    <rect x="15" y="85" width="150" height="175" fill="#0f172a" stroke="#1e293b" rx="6"/>
    <text x="25" y="110" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 完整大型代码仓库</text>
    <text x="25" y="135" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 多模态设计草图/视频</text>
    <text x="25" y="160" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 上百份财报研报汇总</text>
    <text x="25" y="185" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 历史百轮交互轨迹</text>
    <text x="25" y="225" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">缓存命中: $0.05/M</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="240" y1="250" x2="280" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- Step 2: MoE Core Reasoning -->
  <g transform="translate(290, 115)">
    <rect width="200" height="280" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" rx="10"/>
    <rect x="0" y="0" width="200" height="38" fill="#0369a1" rx="10 10 0 0"/>
    <text x="100" y="24" fill="#fff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      2. 稀疏 MoE 核心推理
    </text>
    <text x="100" y="65" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">600B Total / 27B Active</text>

    <rect x="15" y="85" width="170" height="175" fill="#082032" stroke="#0284c7" rx="6"/>
    <text x="25" y="110" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• 任务目标分解拆解</text>
    <text x="25" y="135" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• 领域专家精准激活</text>
    <text x="25" y="160" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• 结构化工具意图生成</text>
    <text x="25" y="185" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5">• 64k 最大输出生成</text>
    <text x="25" y="225" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">极速吞吐: 74+ tok/s</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="490" y1="250" x2="530" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- Step 3: Tool Execution & Sandbox -->
  <g transform="translate(540, 115)">
    <rect width="180" height="280" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/>
    <rect x="0" y="0" width="180" height="38" fill="#475569" rx="10 10 0 0"/>
    <text x="90" y="24" fill="#fff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      3. 沙箱环境工具执行
    </text>
    <text x="90" y="65" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Execution Engine</text>

    <rect x="15" y="85" width="150" height="175" fill="#0f172a" stroke="#1e293b" rx="6"/>
    <text x="25" y="110" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 终端命令行 Shell</text>
    <text x="25" y="135" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 自动化编译与测试</text>
    <text x="25" y="160" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 浏览器搜索/网络爬取</text>
    <text x="25" y="185" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11.5">• 硬件串口 / ESP32</text>
    <text x="25" y="225" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">真实系统物理交互</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="720" y1="250" x2="750" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- Step 4: Verification & Feedback Loop -->
  <g transform="translate(760, 115)">
    <rect width="140" height="280" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="10"/>
    <rect x="0" y="0" width="140" height="38" fill="#065f46" rx="10 10 0 0"/>
    <text x="70" y="24" fill="#fff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      4. 闭环收敛
    </text>
    <text x="70" y="65" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Self-Correction</text>

    <rect x="12" y="85" width="116" height="175" fill="#062e24" stroke="#10b981" rx="6"/>
    <text x="18" y="115" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">误差捕获</text>
    <text x="18" y="145" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">自主回溯修复</text>
    <text x="18" y="175" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">24h 极限调优</text>
    <text x="18" y="225" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">最终交付验收</text>
  </g>

  <!-- Return Loop feedback path -->
  <path d="M 830 405 L 830 435 L 390 435 L 390 405" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6" marker-end="url(#arr7)"/>
  <text x="610" y="430" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">
    多轮反馈无缝回注上下文 (持续 100+ 轮不漂移)
  </text>
</svg>