<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg8)"/>

  <!-- Title Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">生活大比方：小学生秒懂的“超级管家与银行金库守门员”</text>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">How Muse Spark, Secure VM, Sentinel &amp; Stripe Link Work in Everyday Life</text>

  <!-- Step 1: Master gives an audacious goal -->
  <g transform="translate(50, 130)">
    <rect width="250" height="490" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#0284c7"/>
    <text x="125" y="27" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. 主人下达指令</text>

    <circle cx="125" cy="95" r="35" fill="#0369a1"/>
    <text x="125" y="103" text-anchor="middle" font-size="28">👑</text>

    <text x="125" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">小学生 / 用户主人</text>
    <text x="25" y="195" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">“帮我买一套下周去露营的装备，预算不超过500元，还要把我的旧自行车在网上卖个好价钱！”</text>

    <rect x="20" y="270" width="210" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="295" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">日常直观类比：</text>
    <text x="35" y="325" font-family="sans-serif" font-size="12" fill="#94a3b8">• 不再需要你教它点击哪个按钮</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#94a3b8">• 只要给出终极目标</text>
    <text x="35" y="385" font-family="sans-serif" font-size="12" fill="#94a3b8">• 甚至当你睡觉或去上学时</text>
    <text x="35" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8">• 任务依然在后台安静推进</text>
    <text x="35" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">• 就像家里请了一位 24小时管家</text>
  </g>

  <!-- Step 2: Butler works in isolated room -->
  <g transform="translate(330, 130)">
    <rect width="250" height="490" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#7e22ce"/>
    <text x="125" y="27" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2. 独立小屋推演计划</text>

    <circle cx="125" cy="95" r="35" fill="#581c87"/>
    <text x="125" y="103" text-anchor="middle" font-size="28">🧠</text>

    <text x="125" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">管家 (Muse Spark)</text>
    <text x="25" y="195" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">在专属的小书房 (Secure VM) 里查资料、货比三家、草拟发布文案，绝不与其他客人串门！</text>

    <rect x="20" y="270" width="210" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="295" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#a855f7">技术内核映射：</text>
    <text x="35" y="325" font-family="sans-serif" font-size="12" fill="#94a3b8">• 对应：Muse Secure VM 沙盒</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#94a3b8">• 每个人一台独立轻量 Linux 机器</text>
    <text x="35" y="385" font-family="sans-serif" font-size="12" fill="#94a3b8">• 隔绝外部黑客与别的 Agent 干扰</text>
    <text x="35" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8">• 内置完整浏览器替你自动操作</text>
    <text x="35" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">• 思考再久也不会泄露家里的秘密</text>
  </g>

  <!-- Step 3: Strict Sentinel Guard -->
  <g transform="translate(610, 130)">
    <rect width="250" height="490" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="250" height="42" rx="12" fill="#d97706"/>
    <text x="125" y="27" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3. 门口铁面保安审核</text>

    <circle cx="125" cy="95" r="35" fill="#78350f"/>
    <text x="125" y="103" text-anchor="middle" font-size="28">🛡️</text>

    <text x="125" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">保安守卫 (Sentinel)</text>
    <text x="25" y="195" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">管家要出门寄信或花钱？不行！保安一把拦住：“必须先拿主人手机上的指纹批条才准放行！”</text>

    <rect x="20" y="270" width="210" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="295" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">技术内核映射：</text>
    <text x="35" y="325" font-family="sans-serif" font-size="12" fill="#94a3b8">• 对应：Sentinel 独立监控进程</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#94a3b8">• 独立于 AI 模型之外的系统级把关</text>
    <text x="35" y="385" font-family="sans-serif" font-size="12" fill="#94a3b8">• 就算 AI 被坏人诱导‘胡思乱想’</text>
    <text x="35" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8">• 出站流量和权限依然死死锁住</text>
    <text x="35" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">• 关键行为必须获得用户明确审批</text>
  </g>

  <!-- Step 4: Virtual Coupon / Stripe Link -->
  <g transform="translate(890, 130)">
    <rect width="260" height="490" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="260" height="42" rx="12" fill="#059669"/>
    <text x="130" y="27" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">4. 柜员发放一次性代金券</text>

    <circle cx="130" cy="95" r="35" fill="#064e3b"/>
    <text x="130" y="103" text-anchor="middle" font-size="28">💳</text>

    <text x="130" y="160" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">银行柜员 (Auth &amp; Link)</text>
    <text x="25" y="195" font-family="PingFang SC, sans-serif" font-size="13" fill="#cbd5e1">绝不把真正的银行存折给管家！只发一张‘买完即作废’的专属小纸条，连管家都看不到卡号！</text>

    <rect x="20" y="270" width="220" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="295" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#34d399">技术内核映射：</text>
    <text x="35" y="325" font-family="sans-serif" font-size="12" fill="#94a3b8">• 对应：Stripe Link 一次性虚拟卡</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#94a3b8">• 对应：Auth Daemon 凭证边界代理</text>
    <text x="35" y="385" font-family="sans-serif" font-size="12" fill="#94a3b8">• AI 永远不接触真实银行卡与密码</text>
    <text x="35" y="415" font-family="sans-serif" font-size="12" fill="#94a3b8">• 享受丢件包赔与免手续费退货</text>
    <text x="35" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">• 哪怕外网被黑客截获也毫无用处</text>
  </g>
</svg>
