<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Title Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Meta Muse 个人智能体全栈系统架构全景拓扑</text>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Multi-Modal Client Interfaces, Muse Secure VM, Sentinel Gatekeeper &amp; Link Guard</text>

  <!-- Left Column: Client Layer -->
  <rect x="40" y="125" width="230" height="595" rx="14" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="40" y="125" width="230" height="42" rx="14" fill="#0369a1"/>
  <text x="155" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">端侧交互层 (Clients)</text>

  <!-- Client Cards -->
  <g transform="translate(55, 185)">
    <rect width="200" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">Ray-Ban Meta 眼镜</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 原生多模态第一人称视角</text>
    <text x="15" y="74" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 实时语音唤醒 &amp; 空间环境感知</text>
  </g>

  <g transform="translate(55, 295)">
    <rect width="200" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">Muse Charm 硬件挂件</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 2寸 OLED 触控 + 指纹激活</text>
    <text x="15" y="74" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 实时语音模型 + 动态虚拟形象</text>
  </g>

  <g transform="translate(55, 405)">
    <rect width="200" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">手机 App &amp; WhatsApp</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• iOS / Android 移动端原生流</text>
    <text x="15" y="74" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 社交对话即指令，零门槛接入</text>
  </g>

  <g transform="translate(55, 515)">
    <rect width="200" height="95" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">Web 控制台 (muse.ai)</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 复杂多步骤任务可视化看板</text>
    <text x="15" y="74" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 完整审计追溯与凭证权限中心</text>
  </g>

  <!-- Middle Column: Cloud VM Sandboxing -->
  <rect x="300" y="125" width="570" height="595" rx="14" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="300" y="125" width="570" height="42" rx="14" fill="#6d28d9"/>
  <text x="585" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">云端个人独立安全机 (Muse Secure VM - 单用户强隔离)</text>

  <!-- Top VM: Muse Spark Brain -->
  <g transform="translate(325, 185)">
    <rect width="520" height="150" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="12" width="130" height="26" rx="4" fill="#581c87"/>
    <text x="80" y="29" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#f3e8ff">Muse Spark 核心</text>
    <text x="160" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Meta Superintelligence Labs 专研前沿模型</text>
    <text x="25" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">长轨迹规划引擎</tspan>：支持百万 Token (1M) 上下文，自纠错长程推理链</text>
    <text x="25" y="92" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">多模态感知</tspan>：第一视角图像语义解析，视频帧时序动态理解</text>
    <text x="25" y="119" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">无缝工具调度</tspan>：自主控制无头浏览器、表单自动填写、跨应用编排</text>
  </g>

  <!-- Middle VM: Execution Environment -->
  <g transform="translate(325, 350)">
    <rect width="520" height="150" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="12" width="140" height="26" rx="4" fill="#1e3a8a"/>
    <text x="85" y="29" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#dbeafe">执行环境与沙盒</text>
    <text x="170" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">systemd-nspawn Linux 容器隔离工作区</text>
    <text x="25" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">完整 Chromium</tspan>：真实 Web 页面渲染、模拟键鼠操作、解决验证码</text>
    <text x="25" y="92" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">Debian 基础运行栈</tspan>：本地持久化轻量存储、临时缓存与状态管理</text>
    <text x="25" y="119" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#38bdf8" font-weight="bold">24/7 后台长效挂起</tspan>：用户关闭手机应用后，智能体持续在云端看护执行</text>
  </g>

  <!-- Bottom VM: Sentinel & Auth Daemon -->
  <g transform="translate(325, 515)">
    <rect width="520" height="185" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="12" width="130" height="26" rx="4" fill="#064e3b"/>
    <text x="80" y="29" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">双重守卫机制</text>
    <text x="160" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">Sentinel 门禁守卫 + Auth Daemon 凭证黑盒</text>
    <text x="25" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#fbbf24" font-weight="bold">Sentinel (独立看门狗)</tspan>：系统层物理隔离，牢牢把控网络出站与权限审批</text>
    <text x="25" y="92" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#fbbf24" font-weight="bold">Auth Daemon 凭证屏蔽</tspan>：密码与密钥在网络边界自动注入，模型完全看不见明文</text>
    <text x="25" y="119" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#fbbf24" font-weight="bold">人机协同护栏 (HITL)</tspan>：涉及付款、发送邮件、修改资料必须获得用户明确确认</text>
    <text x="25" y="146" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#fbbf24" font-weight="bold">机密虚拟机 (Confidential VM)</tspan>：硬件级内存加密，Meta 内部运维人员亦无权窥探</text>
  </g>

  <!-- Right Column: External Connectors & Payment -->
  <rect x="900" y="125" width="260" height="595" rx="14" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="900" y="125" width="260" height="42" rx="14" fill="#047857"/>
  <text x="1030" y="152" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">外部生态与安全支付</text>

  <!-- Connectors Cards -->
  <g transform="translate(915, 185)">
    <rect width="230" height="110" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#34d399">Stripe Link 虚拟卡</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 动态生成单次使用虚拟卡</text>
    <text x="15" y="72" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 首个支持退款保障的 AI 钱包</text>
    <text x="15" y="92" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 真实银行卡号永不暴露公网</text>
  </g>

  <g transform="translate(915, 310)">
    <rect width="230" height="110" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#34d399">生产力工具连接器</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Gmail &amp; Google 日历</text>
    <text x="15" y="72" font-family="sans-serif" font-size="12" fill="#cbd5e1">• GitHub 代码仓与 Issue 追踪</text>
    <text x="15" y="92" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Box 企业文档协同中心</text>
  </g>

  <g transform="translate(915, 435)">
    <rect width="230" height="110" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#34d399">生活与电商连接器</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Walmart 智能比价与自动加购</text>
    <text x="15" y="72" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Instagram 灵感自动转购物清单</text>
    <text x="15" y="92" font-family="sans-serif" font-size="12" fill="#cbd5e1">• PayPal &amp; 1Password 密码集成</text>
  </g>

  <g transform="translate(915, 560)">
    <rect width="230" height="140" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="15" y="28" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#34d399">数据主权与隐私护栏</text>
    <text x="15" y="52" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 严格禁止用于 Meta 广告系统</text>
    <text x="15" y="72" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 可一键退订模型训练授权</text>
    <text x="15" y="92" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 随时指令“遗忘”特定私密记忆</text>
    <text x="15" y="112" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 随时一键切断任何第三方授权</text>
  </g>

  <!-- Connectors Lines / Arrows -->
  <path d="M 270 422 L 300 422" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 870 422 L 900 422" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
