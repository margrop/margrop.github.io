<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg12)"/>

  <!-- Title Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">跨平台智能体安全沙盒与出站审计探针矩阵</text>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Zero-Dependency Automation Toolkit for Windows 11, Ubuntu 26.04 &amp; macOS 26 (Human CLI &amp; Agent JSON Mode)</text>

  <!-- Platform 1: Windows 11 -->
  <g transform="translate(50, 130)">
    <rect width="340" height="490" rx="12" fill="#1e293b" stroke="#0078d4" stroke-width="1.5"/>
    <rect width="340" height="46" rx="12" fill="#005a9e"/>
    <text x="170" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Windows 11 (PowerShell 7+ / 5.1)</text>

    <text x="25" y="80" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">脚本：meta_muse_agent_guardian_windows11.ps1</text>
    <text x="25" y="110" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 原生 Invoke-RestMethod，零第三方包依赖</text>
    <text x="25" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 深度集成 Windows Defender 凭证保护</text>
    <text x="25" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 原生拦截剪贴板与明文密钥注入风险</text>
    <text x="25" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 支持 -AgentMode 直接吐出标准化 JSON</text>

    <rect x="20" y="215" width="300" height="250" rx="8" fill="#0f172a" stroke="#0078d4"/>
    <text x="35" y="245" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#38bdf8"># 人工交互式快速审计</text>
    <text x="35" y="275" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">.\meta_muse_guardian.ps1</text>
    <text x="35" y="315" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#38bdf8"># 智能体全自动化 JSON 遥测</text>
    <text x="35" y="345" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">.\meta_muse_guardian.ps1 `</text>
    <text x="50" y="370" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">-AgentMode -Output ".udit.json"</text>
    <text x="35" y="410" font-family="sans-serif" font-size="11" fill="#94a3b8">适用于本地 Windows 开发工作站与</text>
    <text x="35" y="435" font-family="sans-serif" font-size="11" fill="#94a3b8">桌面级自主智能体执行环境体检。</text>
  </g>

  <!-- Platform 2: Ubuntu 26.04 -->
  <g transform="translate(430, 130)">
    <rect width="340" height="490" rx="12" fill="#1e293b" stroke="#e95420" stroke-width="1.5"/>
    <rect width="340" height="46" rx="12" fill="#b3360b"/>
    <text x="170" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Ubuntu 26.04 LTS (Bash 5+ / Linux)</text>

    <text x="25" y="80" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#fb923c">脚本：meta_muse_agent_guardian_ubuntu2604.sh</text>
    <text x="25" y="110" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 原生 Bash + curl + awk，纯粹无外挂</text>
    <text x="25" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 支持 cgroups v2 / systemd 容器隔离核查</text>
    <text x="25" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 快速审计 iptables / nftables 出站审计规则</text>
    <text x="25" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 支持 CI/CD 与 Kubernetes 云上自动化注入</text>

    <rect x="20" y="215" width="300" height="250" rx="8" fill="#0f172a" stroke="#e95420"/>
    <text x="35" y="245" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#fb923c"># 人工彩色交互式执行</text>
    <text x="35" y="275" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">./meta_muse_guardian_ubuntu.sh</text>
    <text x="35" y="315" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#fb923c"># Agent 自动化流水线调度</text>
    <text x="35" y="345" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">./meta_muse_guardian_ubuntu.sh \</text>
    <text x="50" y="370" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">--agent-mode --output=/tmp/telemetry.json</text>
    <text x="35" y="410" font-family="sans-serif" font-size="11" fill="#94a3b8">适用于 Linux 云主机集群、Docker 沙盒</text>
    <text x="35" y="435" font-family="sans-serif" font-size="11" fill="#94a3b8">与私有化本地 Agent 网关节点检测。</text>
  </g>

  <!-- Platform 3: macOS 26 -->
  <g transform="translate(810, 130)">
    <rect width="340" height="490" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="340" height="46" rx="12" fill="#6d28d9"/>
    <text x="170" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">macOS 26 (Apple Silicon arm64 / Zsh)</text>

    <text x="25" y="80" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#c084fc">脚本：meta_muse_agent_guardian_macos26.zsh</text>
    <text x="25" y="110" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 原生 Zsh 编写，针对 M 系列架构深度优化</text>
    <text x="25" y="135" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 集成 macOS 钥匙串 (Keychain) 敏感词探针</text>
    <text x="25" y="160" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 实时监控本地应用沙盒与网络连接</text>
    <text x="25" y="185" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 配合 Ray-Ban 蓝牙数据流实现低延迟响应</text>

    <rect x="20" y="215" width="300" height="250" rx="8" fill="#0f172a" stroke="#a855f7"/>
    <text x="35" y="245" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#c084fc"># 终端交互式一键体检</text>
    <text x="35" y="275" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">./meta_muse_guardian_macos.zsh</text>
    <text x="35" y="315" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#c084fc"># 智能体自动编排与结构化报告</text>
    <text x="35" y="345" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">./meta_muse_guardian_macos.zsh \</text>
    <text x="50" y="370" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">-a -o ~/Library/Logs/agent_audit.json</text>
    <text x="35" y="410" font-family="sans-serif" font-size="11" fill="#94a3b8">适用于 Mac 极客开发者、AI 创作者</text>
    <text x="35" y="435" font-family="sans-serif" font-size="11" fill="#94a3b8">与本端多 Agent 自动化协同网关。</text>
  </g>
</svg>
