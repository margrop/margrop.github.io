<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg10)"/>

  <!-- Title Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">人机交互进化三部曲：从聊天框到全天候物理智能体</text>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Generational Shift: Chatbot Q&amp;A (Gen 1) -> Workflow Automation (Gen 2) -> Embodied/Physical Autonomous Agent (Gen 3 - Meta Muse)</text>

  <!-- Gen 1: Chatbot -->
  <g transform="translate(50, 130)">
    <rect width="340" height="490" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="340" height="46" rx="12" fill="#334155"/>
    <text x="170" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">第一代：文本问答聊天框 (2022-2024)</text>

    <text x="25" y="80" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#94a3b8">典型代表：ChatGPT 3.5, Claude 2</text>
    <text x="25" y="115" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#f87171" font-weight="bold">交互模式</tspan>：一问一答，纯文本被动响应</text>
    <text x="25" y="145" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#f87171" font-weight="bold">执行能力</tspan>：零行动力，只动嘴皮子不动手</text>
    <text x="25" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#f87171" font-weight="bold">记忆与时间</tspan>：关闭会话即失忆，无法后台运行</text>
    <text x="25" y="205" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#f87171" font-weight="bold">用户负担</tspan>：用户必须复制粘贴代码/方案手动执行</text>

    <rect x="20" y="240" width="300" height="225" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="270" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#64748b">局限与痛点：</text>
    <text x="35" y="300" font-family="sans-serif" font-size="12" fill="#94a3b8">“请帮我规划东京旅游路线”</text>
    <text x="35" y="330" font-family="sans-serif" font-size="12" fill="#64748b">AI 生成了精美行程单，但机票、酒店、</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#64748b">门票依然需要用户打开十几款 App 手动操作，</text>
    <text x="35" y="380" font-family="sans-serif" font-size="12" fill="#64748b">最终依然让人精疲力竭。</text>
  </g>

  <!-- Gen 2: Tool Workflow -->
  <g transform="translate(430, 130)">
    <rect width="340" height="490" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="340" height="46" rx="12" fill="#1d4ed8"/>
    <text x="170" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">第二代：脚本与工具调用 (2025-2026)</text>

    <text x="25" y="80" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#60a5fa">典型代表：Claude Computer Use, Function Calling</text>
    <text x="25" y="115" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#60a5fa" font-weight="bold">交互模式</tspan>：指令式调用 API 与点击桌面屏幕</text>
    <text x="25" y="145" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#60a5fa" font-weight="bold">执行能力</tspan>：可执行简单脚本，但极易被反爬阻断</text>
    <text x="25" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#60a5fa" font-weight="bold">安全隐患</tspan>：模型直接接触敏感凭证，越权风险高</text>
    <text x="25" y="205" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#60a5fa" font-weight="bold">门槛痛点</tspan>：依赖开发者配置环境，大众完全用不来</text>

    <rect x="20" y="240" width="300" height="225" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="270" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#3b82f6">局限与痛点：</text>
    <text x="35" y="300" font-family="sans-serif" font-size="12" fill="#94a3b8">“占用你的电脑屏幕不停乱晃鼠标”</text>
    <text x="35" y="330" font-family="sans-serif" font-size="12" fill="#64748b">稍微遇到网络卡顿或验证码就抛错中断，</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#64748b">且把所有私人账号密码明文扔给大模型，</text>
    <text x="35" y="380" font-family="sans-serif" font-size="12" fill="#64748b">普通大众对隐私安全疑虑重重。</text>
  </g>

  <!-- Gen 3: Meta Muse Agent -->
  <g transform="translate(810, 130)">
    <rect width="340" height="490" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="340" height="46" rx="12" fill="#047857"/>
    <text x="170" y="30" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">第三代：全托管具身智能体 (Meta Muse)</text>

    <text x="25" y="80" font-family="PingFang SC, sans-serif" font-size="15" font-weight="bold" fill="#34d399">生态全景：Muse Spark + Secure VM + Charm + 眼镜</text>
    <text x="25" y="115" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#34d399" font-weight="bold">交互模式</tspan>：眼镜第一视角 + 随身 Charm 物理挂件</text>
    <text x="25" y="145" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#34d399" font-weight="bold">执行能力</tspan>：云端独享独立机 24/7 后台长效自驱推进</text>
    <text x="25" y="175" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#34d399" font-weight="bold">安全架构</tspan>：Sentinel 独立守卫 + 一次性虚拟安全卡</text>
    <text x="25" y="205" font-family="sans-serif" font-size="13" fill="#cbd5e1">• <tspan fill="#34d399" font-weight="bold">普惠大众</tspan>：数十亿人无缝上手，连老奶奶都能用！</text>

    <rect x="20" y="240" width="300" height="225" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="270" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" fill="#10b981">质的飞跃体验：</text>
    <text x="35" y="300" font-family="sans-serif" font-size="12" fill="#a7f3d0">“说一句话，剩下的全部搞定”</text>
    <text x="35" y="330" font-family="sans-serif" font-size="12" fill="#cbd5e1">眼镜看一眼货架立刻对比网购最便宜价格；</text>
    <text x="35" y="355" font-family="sans-serif" font-size="12" fill="#cbd5e1">Charm 随身挂件随时语音跟进任务进度；</text>
    <text x="35" y="380" font-family="sans-serif" font-size="12" fill="#cbd5e1">关掉手机安心睡觉，醒来事情已经办妥！</text>
  </g>
</svg>
