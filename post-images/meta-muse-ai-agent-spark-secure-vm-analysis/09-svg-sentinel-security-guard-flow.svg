<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg9)"/>

  <!-- Title Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, PingFang SC, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Sentinel 门禁守卫系统级审计与人机协同护栏机制</text>
  <text x="600" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">Out-of-Band Process, Semantic Egress Filtering, Biometric Approval &amp; Zero-Trust Token Injection</text>

  <!-- Flow Steps Horizontal -->
  <g transform="translate(60, 140)">
    <rect width="220" height="480" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="220" height="38" rx="10" fill="#0284c7"/>
    <text x="110" y="25" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">阶段 1: 意图与规划生成</text>
    
    <text x="20" y="70" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">Muse Spark 规划</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 分析用户多模态输入</text>
    <text x="20" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 分解复杂目标为子任务</text>
    <text x="20" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 生成待执行 Action 提案</text>
    
    <rect x="15" y="190" width="190" height="260" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="215" font-family="PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">典型动作提议示例：</text>
    <text x="25" y="245" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Action: "web_checkout"</text>
    <text x="25" y="270" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Target: "store.example"</text>
    <text x="25" y="295" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Amount: "$49.90 USD"</text>
    <text x="25" y="320" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Item: "Camping Lantern"</text>
    <text x="25" y="355" font-family="sans-serif" font-size="11" fill="#cbd5e1">AI 无法直接访问网络，</text>
    <text x="25" y="380" font-family="sans-serif" font-size="11" fill="#cbd5e1">只能将提议发送给</text>
    <text x="25" y="405" font-family="sans-serif" font-size="11" fill="#38bdf8">系统唯一的门禁 Sentinel</text>
  </g>

  <g transform="translate(340, 140)">
    <rect width="240" height="480" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="240" height="38" rx="10" fill="#d97706"/>
    <text x="120" y="25" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">阶段 2: Sentinel 语义审查</text>

    <text x="20" y="70" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">独立门禁策略评估</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 拦截所有出站请求报文</text>
    <text x="20" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 检查是否命中敏感动作白名单</text>
    <text x="20" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 阻断 Prompt 注入恶意逃逸</text>

    <rect x="15" y="190" width="210" height="260" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="215" font-family="PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#ef4444">敏感性评级判定：</text>
    <text x="25" y="245" font-family="sans-serif" font-size="12" fill="#cbd5e1">A. <tspan fill="#34d399">低危 (直接放行)</tspan>：</text>
    <text x="35" y="270" font-family="sans-serif" font-size="11" fill="#94a3b8">查天气、看食谱、比价搜索</text>
    <text x="25" y="305" font-family="sans-serif" font-size="12" fill="#cbd5e1">B. <tspan fill="#fbbf24">中危 (策略受限)</tspan>：</text>
    <text x="35" y="330" font-family="sans-serif" font-size="11" fill="#94a3b8">保存联系人、起草邮件草稿</text>
    <text x="25" y="365" font-family="sans-serif" font-size="12" fill="#cbd5e1">C. <tspan fill="#ef4444">高危 (强制阻断待批)</tspan>：</text>
    <text x="35" y="390" font-family="sans-serif" font-size="11" fill="#94a3b8">扣费支付、发送邮件、删文件</text>
    <text x="35" y="415" font-family="sans-serif" font-size="11" fill="#f87171">触发 HITL 物理审批流！</text>
  </g>

  <g transform="translate(640, 140)">
    <rect width="230" height="480" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="230" height="38" rx="10" fill="#b91c1c"/>
    <text x="115" y="25" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">阶段 3: 人机协同决策 (HITL)</text>

    <text x="20" y="70" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#f87171">主人授权关卡</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 向用户推送高优先级确认卡片</text>
    <text x="20" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 展示清晰明了的金额与详情</text>
    <text x="20" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Charm / 手机一键指纹授权</text>

    <rect x="15" y="190" width="200" height="260" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="215" font-family="PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">推送卡片实录：</text>
    <rect x="25" y="235" width="180" height="110" rx="6" fill="#1e293b" stroke="#3b82f6"/>
    <text x="35" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Muse 请求支付授权</text>
    <text x="35" y="280" font-family="sans-serif" font-size="11" fill="#cbd5e1">购买露营灯 $49.90</text>
    <rect x="35" y="295" width="70" height="26" rx="4" fill="#059669"/>
    <text x="70" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">同意</text>
    <rect x="120" y="295" width="70" height="26" rx="4" fill="#dc2626"/>
    <text x="155" y="312" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffffff">拒绝</text>
    <text x="25" y="380" font-family="sans-serif" font-size="11" fill="#cbd5e1">超时自动熔断并通知用户</text>
    <text x="25" y="405" font-family="sans-serif" font-size="11" fill="#cbd5e1">绝不擅自越权扣费！</text>
  </g>

  <g transform="translate(930, 140)">
    <rect width="210" height="480" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="38" rx="10" fill="#047857"/>
    <text x="105" y="25" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">阶段 4: 凭证注入与执行</text>

    <text x="20" y="70" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" fill="#34d399">安全执行与交付</text>
    <text x="20" y="100" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Auth Daemon 边界注入凭证</text>
    <text x="20" y="125" font-family="sans-serif" font-size="12" fill="#cbd5e1">• Stripe Link 一次性卡结算</text>
    <text x="20" y="150" font-family="sans-serif" font-size="12" fill="#cbd5e1">• 形成不可篡改的审计日志</text>

    <rect x="15" y="190" width="180" height="260" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="215" font-family="PingFang SC, sans-serif" font-size="12" font-weight="bold" fill="#10b981">最终交付保障：</text>
    <text x="25" y="245" font-family="sans-serif" font-size="11" fill="#cbd5e1">✓ 订单号自动归档入库</text>
    <text x="25" y="275" font-family="sans-serif" font-size="11" fill="#cbd5e1">✓ 物流进度 24h 追踪更新</text>
    <text x="25" y="305" font-family="sans-serif" font-size="11" fill="#cbd5e1">✓ 一键退款险全面生效</text>
    <text x="25" y="335" font-family="sans-serif" font-size="11" fill="#cbd5e1">✓ 内存数据即刻抹除清空</text>
    <text x="25" y="375" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">闭环完成！</text>
  </g>
</svg>
