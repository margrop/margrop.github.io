<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3)"/>
  
  <text x="64" y="68" fill="#fbbf24" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">EVERYDAY LIFE ANALOGIES · CLEAR AS CRYSTAL</text>
  <text x="64" y="112" fill="#f8fafc" font-size="34" font-weight="bold" font-family="DejaVu Sans, sans-serif">Three Everyday Analogies Explaining Codex Image 2.6</text>
  <text x="64" y="148" fill="#94a3b8" font-size="18" font-family="DejaVu Sans, sans-serif">Bento Boxes, Architectural Blueprints, and Film Set Wardrobe Continuity</text>

  <!-- Three Big Cards -->
  <!-- Analogy 1 -->
  <rect x="64" y="180" width="416" height="610" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="96" y="210" width="96" height="32" rx="16" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="110" y="232" fill="#fbbf24" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Analogy 1</text>
  <text x="96" y="280" fill="#f8fafc" font-size="24" font-weight="bold" font-family="DejaVu Sans, sans-serif">Bento Box vs Master Chef</text>
  <text x="96" y="315" fill="#38bdf8" font-size="17" font-family="DejaVu Sans, sans-serif">Explains: Flare Speed vs Sunburst Precision</text>
  <line x1="96" y1="340" x2="448" y2="340" stroke="#334155" stroke-width="1"/>
  
  <text x="96" y="375" fill="#fbbf24" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">🍱 Convenience Bento Box (Flare)</text>
  <text x="96" y="405" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Heated in 30 seconds when you're late (6s output).</text>
  <text x="96" y="432" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Tasty, filling, and gets the job done instantly.</text>
  <text x="96" y="460" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Maps to: Fast wireframes, mockups, A/B testing.</text>

  <text x="96" y="510" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">👨‍🍳 Michelin Master Chef (Sunburst)</text>
  <text x="96" y="540" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Hand-picks rare ingredients and plans every detail.</text>
  <text x="96" y="567" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Takes 30 minutes, but produces pure culinary art.</text>
  <text x="96" y="595" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Maps to: Deep reasoning, final production assets.</text>

  <rect x="96" y="710" width="352" height="50" rx="8" fill="rgba(251, 191, 36, 0.1)"/>
  <text x="110" y="740" fill="#fbbf24" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Takeaway: Don't demand plating on bento boxes!</text>

  <!-- Analogy 2 -->
  <rect x="512" y="180" width="416" height="610" rx="16" fill="url(#card-grad)" stroke="#0284c7" stroke-width="2"/>
  <rect x="544" y="210" width="96" height="32" rx="16" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="558" y="232" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Analogy 2</text>
  <text x="544" y="280" fill="#f8fafc" font-size="24" font-weight="bold" font-family="DejaVu Sans, sans-serif">Polaroid Photo vs Blueprint</text>
  <text x="544" y="315" fill="#38bdf8" font-size="17" font-family="DejaVu Sans, sans-serif">Explains: Bitmap (PNG/WebP) vs Vector (SVG)</text>
  <line x1="544" y1="340" x2="896" y2="340" stroke="#334155" stroke-width="1"/>
  
  <text x="544" y="375" fill="#f87171" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">📷 Polaroid Snapshot (Raster Bitmap)</text>
  <text x="544" y="405" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Made of colored ink dots fixed permanently.</text>
  <text x="544" y="432" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Zoom in with a lens and it turns into blurry pixels.</text>
  <text x="544" y="460" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Maps to: Conventional heavy raster image outputs.</text>

  <text x="544" y="510" fill="#4ade80" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">📐 Architectural Blueprint (Vector SVG)</text>
  <text x="544" y="540" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Formulas and shapes: centers, radius, bezier curves.</text>
  <text x="544" y="567" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Scale to skyscraper size: lines remain razor-sharp!</text>
  <text x="544" y="595" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Maps to: Codex 2.6 native programmable SVG code.</text>

  <rect x="544" y="710" width="352" height="50" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="558" y="740" fill="#38bdf8" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Takeaway: Photos pixelate; blueprints scale infinitely!</text>

  <!-- Analogy 3 -->
  <rect x="960" y="180" width="416" height="610" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="992" y="210" width="96" height="32" rx="16" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="1006" y="232" fill="#c084fc" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Analogy 3</text>
  <text x="992" y="280" fill="#f8fafc" font-size="24" font-weight="bold" font-family="DejaVu Sans, sans-serif">Film Set Wardrobe Continuity</text>
  <text x="992" y="315" fill="#38bdf8" font-size="17" font-family="DejaVu Sans, sans-serif">Explains: @Reference Tag Identity Anchoring</text>
  <line x1="992" y1="340" x2="1344" y2="340" stroke="#334155" stroke-width="1"/>
  
  <text x="992" y="375" fill="#f87171" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">🎬 Disorganized Actor (No Reference)</text>
  <text x="992" y="405" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Wears a straw hat in scene 1, a cap in scene 2.</text>
  <text x="992" y="432" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Audience immediately notices the continuity glitch.</text>
  <text x="992" y="460" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Maps to: Naive prompts changing button characters.</text>

  <text x="992" y="510" fill="#c084fc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">📋 Script Supervisor Log (@Reference)</text>
  <text x="992" y="540" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Pins exact Polaroid reference photos to each scene.</text>
  <text x="992" y="567" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Even after 100 scenes, hairstyle &amp; costume match!</text>
  <text x="992" y="595" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Maps to: Locking asset_id across UI state toggles.</text>

  <rect x="992" y="710" width="352" height="50" rx="8" fill="rgba(168, 85, 247, 0.15)"/>
  <text x="1006" y="740" fill="#c084fc" font-size="14" font-weight="bold" font-family="DejaVu Sans, sans-serif">Takeaway: With reference tags, zero continuity errors!</text>
</svg>