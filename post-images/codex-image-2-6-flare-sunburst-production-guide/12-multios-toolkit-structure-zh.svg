<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="card12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg12)"/>

  <text x="64" y="68" fill="#4ade80" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">CROSS-PLATFORM AUTOMATION TOOLKIT</text>
  <text x="64" y="112" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">三大操作系统零依赖全自动套件架构</text>
  <text x="64" y="148" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">Windows 11 / Ubuntu 26.04 / macOS 27 原生脚本：双模执行（人类向导 + Agent JSON）</text>

  <!-- Three Columns for OS -->
  <!-- Col 1: Windows 11 -->
  <rect x="64" y="180" width="416" height="480" rx="16" fill="url(#card12)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="96" y="210" width="130" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="108" y="229" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">WINDOWS 11</text>
  <text x="96" y="275" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">codex_image26_windows11.ps1</text>
  <text x="96" y="310" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">纯 PowerShell 7+ 原生驱动</text>
  <line x1="96" y1="335" x2="448" y2="335" stroke="#334155" stroke-width="1"/>
  
  <text x="96" y="370" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 零外部模块依赖 (无需 npm / pip 插件)</text>
  <text x="96" y="405" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 自动适配 Windows Terminal ANSI 色彩</text>
  <text x="96" y="440" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 支持 Invoke-RestMethod 异步分块拉取</text>
  <text x="96" y="475" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 内置 Windows Defender 路径白名单防护</text>
  <text x="96" y="510" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ -Agent -Json 纯 JSON 管道调用</text>

  <rect x="96" y="560" width="352" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="595" fill="#4ade80" font-size="14" font-family="DejaVu Sans Mono, monospace">.\codex_image26_windows11.ps1 -Agent -Json</text>

  <!-- Col 2: Ubuntu 26.04 -->
  <rect x="512" y="180" width="416" height="480" rx="16" fill="url(#card12)" stroke="#d97706" stroke-width="1.5"/>
  <rect x="544" y="210" width="140" height="28" rx="6" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="556" y="229" fill="#fbbf24" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">UBUNTU 26.04</text>
  <text x="544" y="275" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">codex_image26_ubuntu2604.sh</text>
  <text x="544" y="310" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">标准 POSIX Bash (set -euo pipefail)</text>
  <line x1="544" y1="335" x2="896" y2="335" stroke="#334155" stroke-width="1"/>

  <text x="544" y="370" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 依赖系统内置 curl / python3 / openssl</text>
  <text x="544" y="405" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 自动检测并优先采用本地 SVGO 引擎</text>
  <text x="544" y="440" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 内置 CI/CD GitHub Actions 兼容退出码</text>
  <text x="544" y="475" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 建立 /tmp/codex-quarantine 安全沙箱</text>
  <text x="544" y="510" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ --agent --json 标准输出管道</text>

  <rect x="544" y="560" width="352" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="558" y="595" fill="#4ade80" font-size="14" font-family="DejaVu Sans Mono, monospace">bash codex_image26_ubuntu2604.sh --agent --json</text>

  <!-- Col 3: macOS 27 -->
  <rect x="960" y="180" width="416" height="480" rx="16" fill="url(#card12)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="992" y="210" width="110" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="1004" y="229" fill="#c084fc" font-size="13" font-weight="bold" font-family="DejaVu Sans Mono, monospace">MACOS 27</text>
  <text x="992" y="275" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">codex_image26_macos27.zsh</text>
  <text x="992" y="310" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">原生 Darwin Zsh + Apple Silicon 适配</text>
  <line x1="992" y1="335" x2="1344" y2="335" stroke="#334155" stroke-width="1"/>

  <text x="992" y="370" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 自动识别 Retina 屏幕 2x/3x DPR</text>
  <text x="992" y="405" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 内置 Keychain 密钥静默读取（免明文暴露）</text>
  <text x="992" y="440" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 集成 sips / rsvg-convert 本地极速转换</text>
  <text x="992" y="475" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ 零外部编译链，开箱即用</text>
  <text x="992" y="510" fill="#e2e8f0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">✓ --agent --json 无缝融入 Claude/Codex 编排</text>

  <rect x="992" y="560" width="352" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="1006" y="595" fill="#4ade80" font-size="14" font-family="DejaVu Sans Mono, monospace">zsh codex_image26_macos27.zsh --agent --json</text>

  <!-- Bottom Architecture Banner -->
  <rect x="64" y="694" width="1312" height="106" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="96" y="736" fill="#4ade80" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">⚡ 双模执行哲学（Dual-Mode Philosophy）</text>
  <text x="96" y="768" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">人类工程师双击或命令行直接运行：提供高对比度彩色终端向导、自动补齐缺失环境、实时按键测试；</text>
  <text x="96" y="792" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">自主 Agent (Codex/Claude Code) 自动化调用：传入 --agent --json 标志，静默自愈执行并输出严格 JSON 协议。</text>
</svg>