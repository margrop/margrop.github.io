<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg2)"/>
  
  <text x="64" y="68" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">ENGINE ARCHITECTURE &amp; BENCHMARK</text>
  <text x="64" y="112" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">GPT-Image-2.6 双引擎深度对比矩阵</text>
  <text x="64" y="148" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">理清 Flare 与 Sunburst 的底层机制差异，杜绝在生产管线中盲目错配</text>
  
  <!-- Table Header -->
  <rect x="64" y="180" width="1312" height="56" rx="8" fill="#1e293b"/>
  <text x="96" y="215" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">对比核心指标</text>
  <text x="460" y="215" fill="#fbbf24" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">GPT-Image-2.6 Flare（极速先锋）</text>
  <text x="930" y="215" fill="#38bdf8" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">GPT-Image-2.6 Sunburst（高精旗舰）</text>

  <!-- Row 1: Latency -->
  <rect x="64" y="246" width="1312" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="96" y="287" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">端到端生成延迟</text>
  <text x="460" y="287" fill="#4ade80" font-size="19" font-weight="bold" font-family="DejaVu Sans Mono, monospace">6.0s ~ 9.5s（极速响应）</text>
  <text x="930" y="287" fill="#f87171" font-size="19" font-weight="bold" font-family="DejaVu Sans Mono, monospace">24.0s ~ 45.0s（多轮深度思考）</text>

  <!-- Row 2: Underlying Mechanism -->
  <rect x="64" y="324" width="1312" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="96" y="365" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">底层生成机制</text>
  <text x="460" y="365" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">单阶段隐空间流匹配（Latent Flow）</text>
  <text x="930" y="365" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">多步自适应视觉规划扩散（Visual Reasoning）</text>

  <!-- Row 3: Reasoning Effort / Complexity -->
  <rect x="64" y="402" width="1312" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="96" y="443" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">复杂度支持范围</text>
  <text x="460" y="443" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">complexity: low / medium（轻量推理）</text>
  <text x="930" y="443" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">complexity: medium / high（支持精细几何推导）</text>

  <!-- Row 4: Continuity & Reference Lock -->
  <rect x="64" y="480" width="1312" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="96" y="521" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">跨轮次一致性 (@Reference)</text>
  <text x="460" y="521" fill="#f87171" font-size="16" font-family="Noto Sans CJK SC, sans-serif">弱一致（仅保留主色调与轮廓语义）</text>
  <text x="930" y="521" fill="#4ade80" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">强锁定（面部特征、服饰、品牌标志严格锚定）</text>

  <!-- Row 5: Vector SVG Capability -->
  <rect x="64" y="558" width="1312" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="96" y="599" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">原生矢量 SVG 支持</text>
  <text x="460" y="599" fill="#cbd5e1" font-size="16" font-family="Noto Sans CJK SC, sans-serif">简单扁平几何形状、图标草图</text>
  <text x="930" y="599" fill="#4ade80" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">生产级复杂渐变、嵌套 Path、精确 ViewBox</text>

  <!-- Row 6: API Cost -->
  <rect x="64" y="636" width="1312" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="96" y="677" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">单次调用成本</text>
  <text x="460" y="677" fill="#4ade80" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">约 $0.012（仅为 Sunburst 25%）</text>
  <text x="930" y="677" fill="#cbd5e1" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">约 $0.048（高画质 + 复杂推理）</text>

  <!-- Row 7: Best Fit -->
  <rect x="64" y="714" width="1312" height="88" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="764" fill="#38bdf8" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">最佳适用工程场景</text>
  <text x="460" y="750" fill="#fbbf24" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">开发阶段 UI Mockup、海报布局、快速 A/B 测款</text>
  <text x="460" y="776" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">Codex Agent 在单轮编码会话中快速填充占位图</text>
  <text x="930" y="750" fill="#38bdf8" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">正式发布资产、品牌 IP 连贯表情包、高保真 SVG 图标库</text>
  <text x="930" y="776" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">需要精确 Markup 局部重绘与多状态 UI 组件落地</text>
</svg>