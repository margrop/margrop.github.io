  <text x="96" y="736" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">💡 Golden Architectural Rule</text>
  <text x="96" y="768" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Route prototypes &amp; local dev to Flare (complexity=low) to cut 75% costs and avoid CI pipeline lag.</text>
  <text x="96" y="792" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Trigger Sunburst (complexity=0.7+) asynchronously for official release assets and vector SVG libraries.</text>
