  <circle cx="380" cy="528" r="6" fill="#fbbf24"/>
  <circle cx="620" cy="510" r="6" fill="#fbbf24"/>
  <text x="470" y="495" fill="#fbbf24" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">Flare: 6.2s ~ 9.1s</text>

