<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg11)"/>

  <text x="64" y="68" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">BENCHMARK &amp; COST TRADEOFF</text>
  <text x="64" y="112" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">参数 Complexity 对延迟、画质与成本的影响曲线</text>
  <text x="64" y="148" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">实测数据：在生产环境中如何根据业务需求平衡出图速度与推理开销</text>

  <!-- Left Chart Box: Latency (Seconds) -->
  <rect x="64" y="180" width="630" height="490" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="96" y="225" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">生成耗时 (秒) vs Complexity 参数</text>
  <text x="96" y="255" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">Flare 保持平缓 6~9s；Sunburst 随复杂度指数级上升</text>

  <!-- Grid lines -->
  <line x1="120" y1="300" x2="640" y2="300" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <text x="80" y="305" fill="#64748b" font-size="13" font-family="DejaVu Sans Mono, monospace">40s</text>
  
  <line x1="120" y1="380" x2="640" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <text x="80" y="385" fill="#64748b" font-size="13" font-family="DejaVu Sans Mono, monospace">25s</text>

  <line x1="120" y1="460" x2="640" y2="460" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <text x="80" y="465" fill="#64748b" font-size="13" font-family="DejaVu Sans Mono, monospace">15s</text>

  <line x1="120" y1="540" x2="640" y2="540" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <text x="80" y="545" fill="#64748b" font-size="13" font-family="DejaVu Sans Mono, monospace">5s</text>

  <!-- Flare Curve (Yellow) -->
  <path d="M 140,535 Q 360,530 620,510" fill="none" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="140" cy="535" r="6" fill="#fbbf24"/>
  <circle cx="380" cy="528" r="6" fill="#fbbf24"/>
  <circle cx="620" cy="510" r="6" fill="#fbbf24"/>
  <text x="470" y="495" fill="#fbbf24" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Flare: 6.2s ~ 9.1s</text>

  <!-- Sunburst Curve (Cyan) -->
  <path d="M 140,430 Q 340,360 620,290" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="140" cy="430" r="6" fill="#38bdf8"/>
  <circle cx="380" cy="355" r="6" fill="#38bdf8"/>
  <circle cx="620" cy="290" r="6" fill="#38bdf8"/>
  <text x="440" y="270" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Sunburst: 18.5s ~ 42.0s</text>

  <!-- X axis labels -->
  <text x="130" y="580" fill="#94a3b8" font-size="14" font-family="DejaVu Sans Mono, monospace">0.1 (low)</text>
  <text x="350" y="580" fill="#94a3b8" font-size="14" font-family="DejaVu Sans Mono, monospace">0.5 (medium)</text>
  <text x="580" y="580" fill="#94a3b8" font-size="14" font-family="DejaVu Sans Mono, monospace">1.0 (high)</text>
  <text x="320" y="615" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">Complexity 参数值</text>

  <!-- Right Chart Box: Cost per 1000 Calls ($) -->
  <rect x="746" y="180" width="630" height="490" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="778" y="225" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">千次调用成本 ($ USD)</text>
  <text x="778" y="255" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">生产环境下规模化调用的成本开销对比</text>

  <!-- Bar 1: Flare Low -->
  <rect x="810" y="490" width="90" height="90" rx="6" fill="#fbbf24"/>
  <text x="830" y="475" fill="#fbbf24" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$12</text>
  <text x="805" y="605" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">Flare (低)</text>

  <!-- Bar 2: Flare Med -->
  <rect x="940" y="445" width="90" height="135" rx="6" fill="#d97706"/>
  <text x="960" y="430" fill="#fbbf24" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$18</text>
  <text x="935" y="605" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">Flare (中)</text>

  <!-- Bar 3: Sunburst Med -->
  <rect x="1070" y="355" width="90" height="225" rx="6" fill="#0284c7"/>
  <text x="1090" y="340" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$36</text>
  <text x="1055" y="605" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">Sunburst (中)</text>

  <!-- Bar 4: Sunburst High -->
  <rect x="1200" y="265" width="90" height="315" rx="6" fill="#38bdf8"/>
  <text x="1220" y="250" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans Mono, monospace">$54</text>
  <text x="1185" y="605" fill="#cbd5e1" font-size="13" font-family="Noto Sans CJK SC, sans-serif">Sunburst (高)</text>

  <!-- Bottom Insight Card -->
  <rect x="64" y="694" width="1312" height="106" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="736" fill="#38bdf8" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">💡 架构设计黄金法则（Golden Rule）</text>
  <text x="96" y="768" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">在线交互式界面与本地原型阶段，强制路由 Flare (complexity=low)，节约 75% 费用并消除 CI 卡顿；</text>
  <text x="96" y="792" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">在正式交付生产矢量 SVG 与角色定妆包时，异步触发 Sunburst (complexity=0.7+)，锁定顶级一致性。</text>
</svg>