<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3)"/>
  
  <text x="64" y="68" fill="#fbbf24" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">EVERYDAY LIFE ANALOGIES · 小学生秒懂的技术解构</text>
  <text x="64" y="112" fill="#f8fafc" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">用三大生活常识讲透 Codex Image 2.6 核心概念</text>
  <text x="64" y="148" fill="#94a3b8" font-size="18" font-family="Noto Sans CJK SC, sans-serif">摆脱晦涩学术名词：快餐便当、建筑图纸与剧组定妆照的工程映射</text>

  <!-- Three Big Cards -->
  <!-- Analogy 1 -->
  <rect x="64" y="180" width="416" height="610" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="96" y="210" width="88" height="32" rx="16" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="110" y="232" fill="#fbbf24" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">比方一</text>
  <text x="96" y="280" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">快餐便当 vs 国宴主厨</text>
  <text x="96" y="315" fill="#38bdf8" font-size="17" font-family="Noto Sans CJK SC, sans-serif">解释：Flare 与 Sunburst 的速度与质感</text>
  <line x1="96" y1="340" x2="448" y2="340" stroke="#334155" stroke-width="1"/>
  
  <text x="96" y="375" fill="#fbbf24" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">🍱 便利店加热盒饭（Flare）</text>
  <text x="96" y="405" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">快迟到了只要 30 秒微波加热（6 秒出图）。</text>
  <text x="96" y="432" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">饭菜美味管饱，解决燃眉之急。</text>
  <text x="96" y="460" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">对应：快速占位、交互原型、测款线框图。</text>

  <text x="96" y="510" fill="#38bdf8" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">👨‍🍳 特级国宴主厨（Sunburst）</text>
  <text x="96" y="540" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">选上乘食材，精雕细琢，反复摆盘推敲。</text>
  <text x="96" y="567" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">需要等半小时，但每道菜都是艺术品。</text>
  <text x="96" y="595" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">对应：高复杂度推理、正式上线高精度资产。</text>

  <rect x="96" y="710" width="352" height="50" rx="8" fill="rgba(251, 191, 36, 0.1)"/>
  <text x="110" y="740" fill="#fbbf24" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">小学生总结：吃快餐别催摆盘，办婚宴别买盒饭！</text>

  <!-- Analogy 2 -->
  <rect x="512" y="180" width="416" height="610" rx="16" fill="url(#card-grad)" stroke="#0284c7" stroke-width="2"/>
  <rect x="544" y="210" width="88" height="32" rx="16" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="558" y="232" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">比方二</text>
  <text x="544" y="280" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">拍立得照片 vs 建筑图纸</text>
  <text x="544" y="315" fill="#38bdf8" font-size="17" font-family="Noto Sans CJK SC, sans-serif">解释：位图 (PNG/WebP) 与矢量 (SVG)</text>
  <line x1="544" y1="340" x2="896" y2="340" stroke="#334155" stroke-width="1"/>
  
  <text x="544" y="375" fill="#f87171" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">📷 拍立得照片（位图 Bitmap）</text>
  <text x="544" y="405" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">由密密麻麻的彩色墨水小点组成。</text>
  <text x="544" y="432" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">用放大镜一看全是模糊马赛克，文件大且死板。</text>
  <text x="544" y="460" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">对应：传统文生图直出的大体积栅格图片。</text>

  <text x="544" y="510" fill="#4ade80" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">📐 建筑施工图纸（矢量 SVG）</text>
  <text x="544" y="540" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">写的是数学几何公式：圆心坐标、曲线半径。</text>
  <text x="544" y="567" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">放大到摩天大楼也丝毫不糊，能被代码自由修改。</text>
  <text x="544" y="595" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">对应：Codex 2.6 原生直出的可编程 SVG 标签。</text>

  <rect x="544" y="710" width="352" height="50" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="558" y="740" fill="#38bdf8" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">小学生总结：照片放大全是格子，图纸怎么缩都笔直！</text>

  <!-- Analogy 3 -->
  <rect x="960" y="180" width="416" height="610" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="992" y="210" width="88" height="32" rx="16" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="1006" y="232" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">比方三</text>
  <text x="992" y="280" fill="#f8fafc" font-size="24" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">剧组场记的定妆照档案</text>
  <text x="992" y="315" fill="#38bdf8" font-size="17" font-family="Noto Sans CJK SC, sans-serif">解释：@Reference 标签锁定角色特征</text>
  <line x1="992" y1="340" x2="1344" y2="340" stroke="#334155" stroke-width="1"/>
  
  <text x="992" y="375" fill="#f87171" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">🎬 没看定妆照的糊涂演员</text>
  <text x="992" y="405" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">上午戴草帽，下午换了牛仔帽，发型也变了。</text>
  <text x="992" y="432" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">前后两场戏拼在一起直接穿帮被观众骂惨。</text>
  <text x="992" y="460" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">对应：每次调用新 Prompt，导致按钮角色变脸。</text>

  <text x="992" y="510" fill="#c084fc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">📋 场记的档案夹（@Reference Tag）</text>
  <text x="992" y="540" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">每场戏开拍前，对照一模一样的定妆照卡片。</text>
  <text x="992" y="567" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">哪怕拍一万场戏，衣服细节、脸颊痣永远一致！</text>
  <text x="992" y="595" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">对应：传入固定 asset_id，UI 状态切换绝对一致。</text>

  <rect x="992" y="710" width="352" height="50" rx="8" fill="rgba(168, 85, 247, 0.15)"/>
  <text x="1006" y="740" fill="#c084fc" font-size="14" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">小学生总结：拍戏有了定妆照，连演十集绝不穿帮！</text>
</svg>