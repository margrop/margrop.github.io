<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg2)"/>
  
  <text x="64" y="68" fill="#38bdf8" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">ENGINE ARCHITECTURE &amp; BENCHMARK</text>
  <text x="64" y="112" fill="#f8fafc" font-size="34" font-weight="bold" font-family="DejaVu Sans, sans-serif">GPT-Image-2.6 Dual Engine Comparison Matrix</text>
  <text x="64" y="148" fill="#94a3b8" font-size="18" font-family="DejaVu Sans, sans-serif">Comparing Flare and Sunburst architectures to prevent mismatch in production pipelines</text>
  
  <!-- Table Header -->
  <rect x="64" y="180" width="1312" height="56" rx="8" fill="#1e293b"/>
  <text x="96" y="215" fill="#f8fafc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Key Metrics</text>
  <text x="460" y="215" fill="#fbbf24" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">GPT-Image-2.6 Flare (Speed-Optimized)</text>
  <text x="930" y="215" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">GPT-Image-2.6 Sunburst (Precision Flagship)</text>

  <!-- Row 1: Latency -->
  <rect x="64" y="246" width="1312" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="96" y="287" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">End-to-End Latency</text>
  <text x="460" y="287" fill="#4ade80" font-size="19" font-weight="bold" font-family="DejaVu Sans Mono, monospace">6.0s ~ 9.5s (Ultra-fast)</text>
  <text x="930" y="287" fill="#f87171" font-size="19" font-weight="bold" font-family="DejaVu Sans Mono, monospace">24.0s ~ 45.0s (Deep visual reasoning)</text>

  <!-- Row 2: Underlying Mechanism -->
  <rect x="64" y="324" width="1312" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="96" y="365" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Underlying Architecture</text>
  <text x="460" y="365" fill="#cbd5e1" font-size="16" font-family="DejaVu Sans, sans-serif">Single-pass Latent Flow Matching</text>
  <text x="930" y="365" fill="#cbd5e1" font-size="16" font-family="DejaVu Sans, sans-serif">Multi-step Adaptive Visual Reasoning Diffusion</text>

  <!-- Row 3: Complexity -->
  <rect x="64" y="402" width="1312" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="96" y="443" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Complexity Range</text>
  <text x="460" y="443" fill="#cbd5e1" font-size="16" font-family="DejaVu Sans, sans-serif">complexity: low / medium</text>
  <text x="930" y="443" fill="#cbd5e1" font-size="16" font-family="DejaVu Sans, sans-serif">complexity: medium / high (geometric reasoning)</text>

  <!-- Row 4: Continuity -->
  <rect x="64" y="480" width="1312" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="96" y="521" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Multi-Turn Consistency</text>
  <text x="460" y="521" fill="#f87171" font-size="16" font-family="DejaVu Sans, sans-serif">Loose (preserves primary palette and coarse layout)</text>
  <text x="930" y="521" fill="#4ade80" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Strict (@Reference Tag locks face &amp; identity)</text>

  <!-- Row 5: SVG Vector -->
  <rect x="64" y="558" width="1312" height="68" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="96" y="599" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Native SVG Export</text>
  <text x="460" y="599" fill="#cbd5e1" font-size="16" font-family="DejaVu Sans, sans-serif">Basic flat geometry &amp; icon sketches</text>
  <text x="930" y="599" fill="#4ade80" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Production-grade gradients, paths, precise viewBox</text>

  <!-- Row 6: Cost -->
  <rect x="64" y="636" width="1312" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="96" y="677" fill="#e2e8f0" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Cost per Generation</text>
  <text x="460" y="677" fill="#4ade80" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">~$0.012 (25% of Sunburst)</text>
  <text x="930" y="677" fill="#cbd5e1" font-size="18" font-weight="bold" font-family="DejaVu Sans Mono, monospace">~$0.048 (High-fidelity + reasoning)</text>

  <!-- Row 7: Best Fit -->
  <rect x="64" y="714" width="1312" height="88" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="96" y="764" fill="#38bdf8" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Best Production Fit</text>
  <text x="460" y="750" fill="#fbbf24" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">UI Mockups, Posters, rapid A/B layout experiments</text>
  <text x="460" y="776" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Codex Agent instant placeholder filling during dev</text>
  <text x="930" y="750" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Official brand assets, multi-state UI buttons, SVG icons</text>
  <text x="930" y="776" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Markup-guided local inpainting and production code</text>
</svg>