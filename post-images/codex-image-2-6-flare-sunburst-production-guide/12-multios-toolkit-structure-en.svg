  <text x="544" y="275" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">codex_image26_ubuntu2604.sh</text>
  <text x="544" y="310" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">POSIX compliant Bash (set -euo pipefail)</text>
