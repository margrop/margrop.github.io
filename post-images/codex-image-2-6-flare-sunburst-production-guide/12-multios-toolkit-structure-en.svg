  <text x="96" y="275" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">codex_image26_windows11.ps1</text>
  <text x="96" y="310" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">Pure PowerShell 7+ native engine</text>
  <line x1="96" y1="335" x2="448" y2="335" stroke="#334155" stroke-width="1"/>
  
  <text x="96" y="370" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Zero external npm/pip dependencies</text>
  <text x="96" y="405" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Native Windows Terminal ANSI color formatting</text>
  <text x="96" y="440" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Asynchronous chunked fetch via Invoke-RestMethod</text>
