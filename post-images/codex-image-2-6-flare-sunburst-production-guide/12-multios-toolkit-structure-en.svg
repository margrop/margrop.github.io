  <text x="992" y="275" fill="#f8fafc" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">codex_image26_macos27.zsh</text>
  <text x="992" y="310" fill="#94a3b8" font-size="15" font-family="DejaVu Sans, sans-serif">Native Darwin Zsh + Apple Silicon tuned</text>
  <line x1="992" y1="335" x2="1344" y2="335" stroke="#334155" stroke-width="1"/>

  <text x="992" y="370" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Automatic Retina Display 2x/3x DPR calibration</text>
  <text x="992" y="405" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Keychain secret fetching (zero plaintext leakage)</text>
  <text x="992" y="440" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Hardware-accelerated sips / rsvg conversion</text>
  <text x="992" y="475" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Zero build-tool prerequisites</text>
  <text x="992" y="510" fill="#e2e8f0" font-size="16" font-family="DejaVu Sans, sans-serif">✓ Seamless agent handoff via --agent --json</text>

  <rect x="992" y="560" width="352" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="1006" y="595" fill="#4ade80" font-size="14" font-family="DejaVu Sans Mono, monospace">zsh codex_image26_macos27.zsh --agent --json</text>

  <!-- Bottom Architecture Banner -->
  <rect x="64" y="694" width="1312" height="106" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="96" y="736" fill="#4ade80" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">⚡ Dual-Mode Execution Philosophy</text>
  <text x="96" y="768" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Human Engineers run interactively: high-contrast terminal wizard, automated environment checks, guided testing.</text>
  <text x="96" y="792" fill="#cbd5e1" font-size="15" font-family="DejaVu Sans, sans-serif">Autonomous Agents pass --agent --json: silent self-healing execution and strict structured JSON reporting.</text>
