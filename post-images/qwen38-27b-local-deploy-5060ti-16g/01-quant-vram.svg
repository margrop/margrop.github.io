<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="600" fill="#f7f9fc"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#1b2333">GGUF 量化文件体积 vs RTX 5060 Ti 16GB 可用显存</text>
  <text x="40" y="76" font-size="15" fill="#5a6a85">绿色 = 可以完整放进显存；红色 = 放不进，需要 CPU 分担或换更小的量化</text>
  <!-- bars: x0=230, scale 17px/GB ; 15.5GB => 494 -->
  <g>
    <rect x="230" y="110" width="153" height="34" rx="6" fill="#27ae60"/>
    <text x="40" y="133" font-size="15" fill="#1b2333">IQ2_XXS · 9.0 GB</text>
    <rect x="230" y="154" width="168" height="34" rx="6" fill="#27ae60"/>
    <text x="40" y="177" font-size="15" fill="#1b2333">IQ2_XS · 9.9 GB</text>
    <rect x="230" y="198" width="189" height="34" rx="6" fill="#27ae60"/>
    <text x="40" y="221" font-size="15" fill="#1b2333">IQ2_S · 11.1 GB</text>
    <rect x="230" y="242" width="206" height="34" rx="6" fill="#27ae60"/>
    <text x="40" y="265" font-size="15" fill="#1b2333">IQ3_XXS · 12.1 GB</text>
    <rect x="230" y="286" width="235" height="34" rx="6" fill="#2ecc71" stroke="#1e8449" stroke-width="3"/>
    <text x="40" y="309" font-size="15" font-weight="800" fill="#1b2333">IQ3_S · 13.8 GB ★推荐</text>
    <rect x="230" y="330" width="245" height="34" rx="6" fill="#f39c12"/>
    <text x="40" y="353" font-size="15" fill="#1b2333">IQ3_S+ · 14.4 GB(偏紧张)</text>
    <rect x="230" y="374" width="281" height="34" rx="6" fill="#e74c3c"/>
    <text x="40" y="397" font-size="15" fill="#1b2333">IQ4_XS · 16.5 GB</text>
    <rect x="230" y="418" width="291" height="34" rx="6" fill="#e74c3c"/>
    <text x="40" y="441" font-size="15" fill="#1b2333">Q4_K_M · 17.1 GB</text>
    <rect x="230" y="462" width="343" height="34" rx="6" fill="#e74c3c"/>
    <text x="40" y="485" font-size="15" fill="#1b2333">Q5_K_M · 20.2 GB</text>
    <rect x="230" y="506" width="425" height="34" rx="6" fill="#e74c3c"/>
    <text x="40" y="529" font-size="15" fill="#1b2333">Q6_K · 25.0 GB</text>
  </g>
  <line x1="494" y1="100" x2="494" y2="545" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="506" y="120" font-size="14" font-weight="700" fill="#c0392b">5060 Ti 16G 实际可用 ≈ 15.5 GB(系统还要占一部分)</text>
  <text x="40" y="580" font-size="13" fill="#8a97ab">数据来自 AtomicChat 公布的实测量化体积；同名量化不同发布者体积不同，选文件看大小不看名字。</text>
</svg>
