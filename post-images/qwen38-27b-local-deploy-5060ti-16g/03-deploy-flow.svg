<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1100" height="430" fill="#f7f9fc"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#1b2333">一键脚本的四个步骤(三个平台同一套流程)</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5a6a85"/>
    </marker>
  </defs>
  <g>
    <rect x="40" y="100" width="220" height="180" rx="14" fill="#ffffff" stroke="#7b5cff" stroke-width="2"/>
    <circle cx="90" cy="150" r="24" fill="#7b5cff"/>
    <text x="90" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="150" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2333">检测环境</text>
    <text x="150" y="196" text-anchor="middle" font-size="13" fill="#5a6a85">显卡 / 统一内存</text>
    <text x="150" y="218" text-anchor="middle" font-size="13" fill="#5a6a85">显存容量检查</text>
    <text x="150" y="240" text-anchor="middle" font-size="13" fill="#5a6a85">默认只预演</text>
  </g>
  <line x1="262" y1="190" x2="300" y2="190" stroke="#5a6a85" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="305" y="100" width="220" height="180" rx="14" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <circle cx="355" cy="150" r="24" fill="#27ae60"/>
    <text x="355" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text>
    <text x="415" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2333">安装 llama.cpp</text>
    <text x="415" y="196" text-anchor="middle" font-size="13" fill="#5a6a85">官方预编译包</text>
    <text x="415" y="218" text-anchor="middle" font-size="13" fill="#5a6a85">CUDA / Metal / Vulkan</text>
    <text x="415" y="240" text-anchor="middle" font-size="13" fill="#5a6a85">校验可执行</text>
  </g>
  <line x1="527" y1="190" x2="565" y2="190" stroke="#5a6a85" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="570" y="100" width="220" height="180" rx="14" fill="#ffffff" stroke="#ff8a3d" stroke-width="2"/>
    <circle cx="620" cy="150" r="24" fill="#ff8a3d"/>
    <text x="620" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text>
    <text x="680" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2333">下载 GGUF 模型</text>
    <text x="680" y="196" text-anchor="middle" font-size="13" fill="#5a6a85">默认 IQ3_S 13.8GB</text>
    <text x="680" y="218" text-anchor="middle" font-size="13" fill="#5a6a85">断点续传</text>
    <text x="680" y="240" text-anchor="middle" font-size="13" fill="#5a6a85">可切换 Q4_K_M</text>
  </g>
  <line x1="792" y1="190" x2="830" y2="190" stroke="#5a6a85" stroke-width="2.5" marker-end="url(#arr)"/>
  <g>
    <rect x="835" y="100" width="225" height="180" rx="14" fill="#ffffff" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="885" cy="150" r="24" fill="#e74c3c"/>
    <text x="885" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text>
    <text x="947" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2333">启动并自测</text>
    <text x="947" y="196" text-anchor="middle" font-size="13" fill="#5a6a85">llama-server 启动</text>
    <text x="947" y="218" text-anchor="middle" font-size="13" fill="#5a6a85">curl 发一条消息</text>
    <text x="947" y="240" text-anchor="middle" font-size="13" fill="#5a6a85">打印生成速度</text>
  </g>
  <rect x="40" y="320" width="1020" height="70" rx="10" fill="#eef3fb"/>
  <text x="60" y="350" font-size="14" fill="#33415c">所有脚本默认 Dry-Run(只打印将要做的事),确认无误后加一个开关才真正执行;</text>
  <text x="60" y="374" font-size="14" fill="#33415c">不覆盖系统已有命令,不依赖任何第三方付费服务,模型只从官方仓库下载。</text>
</svg>
