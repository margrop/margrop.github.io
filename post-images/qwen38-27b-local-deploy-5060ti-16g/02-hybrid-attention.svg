<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="520" fill="#f7f9fc"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#1b2333">混合注意力：64 层里只有 16 层需要“越来越大的桌面”</text>
  <text x="40" y="76" font-size="15" fill="#5a6a85">Qwen3.8-27B = 48 层 Gated DeltaNet(固定记忆) + 16 层 Gated Attention(KV 缓存随对话变长)</text>
  <!-- DeltaNet block -->
  <g transform="translate(60,110)">
    <rect width="400" height="330" rx="14" fill="#e8f6ef" stroke="#27ae60" stroke-width="2"/>
    <text x="20" y="36" font-size="19" font-weight="700" fill="#1e8449">48 层 Gated DeltaNet(线性注意力)</text>
    <rect x="20" y="60" width="360" height="44" rx="8" fill="#27ae60"/>
    <text x="200" y="88" text-anchor="middle" font-size="15" fill="#fff">记忆大小固定,不随对话变长</text>
    <text x="20" y="134" font-size="14" fill="#33415c">像一支“会自己更新的笔”:</text>
    <text x="20" y="160" font-size="14" fill="#33415c">每读一个字,就在同一张卡片上改写摘要,</text>
    <text x="20" y="186" font-size="14" fill="#33415c">卡片数量永远不变。</text>
    <rect x="20" y="206" width="360" height="100" rx="8" fill="#ffffff" stroke="#a9dfbf"/>
    <text x="36" y="238" font-size="14" fill="#1e8449">聊 1 句 → 摘要卡片 ×1</text>
    <text x="36" y="266" font-size="14" fill="#1e8449">聊 1000 句 → 摘要卡片 ×1</text>
    <text x="36" y="292" font-size="14" fill="#1e8449">内存占用:不变 ✓</text>
  </g>
  <!-- Attention block -->
  <g transform="translate(540,110)">
    <rect width="400" height="330" rx="14" fill="#fdeeee" stroke="#e74c3c" stroke-width="2"/>
    <text x="20" y="36" font-size="19" font-weight="700" fill="#c0392b">16 层 Gated Attention(标准注意力)</text>
    <rect x="20" y="60" width="360" height="44" rx="8" fill="#e74c3c"/>
    <text x="200" y="88" text-anchor="middle" font-size="15" fill="#fff">每个字都要留一张便签(KV 缓存)</text>
    <text x="20" y="134" font-size="14" fill="#33415c">像课桌上的便签纸:</text>
    <text x="20" y="160" font-size="14" fill="#33415c">每聊一句就多贴一张,桌面(显存)</text>
    <text x="20" y="186" font-size="14" fill="#33415c">被越占越多。</text>
    <rect x="20" y="206" width="360" height="100" rx="8" fill="#ffffff" stroke="#f5b7b1"/>
    <text x="36" y="238" font-size="14" fill="#c0392b">8K 上下文 → 便签约 2 GB</text>
    <text x="36" y="266" font-size="14" fill="#c0392b">32K 上下文 → 便签约 8 GB</text>
    <text x="36" y="292" font-size="14" fill="#c0392b">262K 上下文 → 便签约 67 GB!</text>
  </g>
  <text x="500" y="485" text-anchor="middle" font-size="15" font-weight="600" fill="#33415c">因为只有 1/4 的层在“贴便签”,27B 模型的长上下文显存压力约为同尺寸传统模型的 1/4</text>
</svg>
