<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#14255e"/>
      <stop offset="1" stop-color="#0a3d62"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3b52"/>
      <stop offset="1" stop-color="#1b2333"/>
    </linearGradient>
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#3d6e00"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#3a2fb3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#7fd4ff" stroke-width="1">
    <path d="M0 520 Q300 460 600 520 T1200 500" fill="none"/>
    <path d="M0 560 Q300 500 600 560 T1200 545" fill="none"/>
    <path d="M0 600 Q300 545 600 600 T1200 590" fill="none"/>
  </g>
  <!-- GPU card -->
  <g transform="translate(720,190)">
    <rect x="0" y="0" width="400" height="220" rx="16" fill="url(#card)" stroke="#4a5a7a" stroke-width="2"/>
    <rect x="0" y="220" width="400" height="26" rx="8" fill="#d4af37"/>
    <g>
      <circle cx="110" cy="110" r="72" fill="#10151f" stroke="url(#fan)" stroke-width="6"/>
      <g stroke="#76b900" stroke-width="7" stroke-linecap="round">
        <path d="M110 110 L110 52"/><path d="M110 110 L160 140"/><path d="M110 110 L60 140"/>
        <path d="M110 110 L160 80"/><path d="M110 110 L60 80"/>
      </g>
      <circle cx="110" cy="110" r="16" fill="#76b900"/>
    </g>
    <g>
      <circle cx="290" cy="110" r="72" fill="#10151f" stroke="url(#fan)" stroke-width="6"/>
      <g stroke="#76b900" stroke-width="7" stroke-linecap="round">
        <path d="M290 110 L290 52"/><path d="M290 110 L340 140"/><path d="M290 110 L240 140"/>
        <path d="M290 110 L340 80"/><path d="M290 110 L240 80"/>
      </g>
      <circle cx="290" cy="110" r="16" fill="#76b900"/>
    </g>
    <text x="200" y="32" text-anchor="middle" font-size="20" fill="#9fb3d9">RTX 5060 Ti · 16GB GDDR7</text>
  </g>
  <!-- model chip -->
  <g transform="translate(90,120)">
    <rect x="0" y="0" width="200" height="200" rx="18" fill="url(#chip)" stroke="#b7a8ff" stroke-width="2"/>
    <g stroke="#b7a8ff" stroke-width="4">
      <path d="M30 -24 v24 M70 -24 v24 M110 -24 v24 M150 -24 v24 M170 -24 v24"/>
      <path d="M30 200 v24 M70 200 v24 M110 200 v24 M150 200 v24 M170 200 v24"/>
      <path d="M-24 30 h24 M-24 70 h24 M-24 110 h24 M-24 150 h24 M-24 170 h24"/>
      <path d="M200 30 h24 M200 70 h24 M200 110 h24 M200 150 h24 M200 170 h24"/>
    </g>
    <text x="100" y="92" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">Qwen</text>
    <text x="100" y="132" text-anchor="middle" font-size="30" font-weight="700" fill="#ffe28a">3.8-27B</text>
  </g>
  <!-- connector -->
  <path d="M310 230 C 430 230, 560 290, 700 290" fill="none" stroke="#7fd4ff" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="310" cy="230" r="7" fill="#7fd4ff"/>
  <circle cx="700" cy="290" r="7" fill="#7fd4ff"/>
  <!-- titles -->
  <text x="80" y="430" font-size="56" font-weight="800" fill="#ffffff">16G 显存，跑出旗舰级 27B</text>
  <text x="80" y="490" font-size="30" fill="#a9c7ff">Qwen3.8-27B 本地部署实战 · Windows / Ubuntu / macOS 一键脚本</text>
  <g transform="translate(80,530)">
    <rect width="150" height="42" rx="21" fill="#76b900"/>
    <text x="75" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1030">GGUF 量化</text>
    <rect x="165" width="150" height="42" rx="21" fill="#7b5cff"/>
    <text x="240" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">llama.cpp</text>
    <rect x="330" width="170" height="42" rx="21" fill="#ff8a3d"/>
    <text x="415" y="29" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1030">262K 长上下文</text>
  </g>
