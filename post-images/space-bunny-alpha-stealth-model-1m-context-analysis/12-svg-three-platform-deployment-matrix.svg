<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">跨平台零依赖探针与智能体（Agent）自动化调度矩阵</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Windows 11 / Ubuntu 26.04 / macOS 26 Architecture: Dual Mode CLI &amp; Autonomous JSON Telemetry</text>

  <!-- Platform 1: Windows 11 -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="320" height="340" rx="12" fill="#111827" stroke="#0078d4" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#005a9e"/>
    <text x="20" y="26" fill="#ffffff" font-size="15" font-weight="bold">Windows 11 (PowerShell 7+)</text>
    <text x="20" y="70" fill="#60a5fa" font-size="13" font-weight="bold">space_bunny_probe_windows11.ps1</text>
    <text x="20" y="100" fill="#cbd5e1" font-size="12">• 纯原生 Invoke-RestMethod / HttpClient</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="12">• 零依赖无外部包，支持自签免安装执行</text>
    <text x="20" y="150" fill="#cbd5e1" font-size="12">• 支持 -AgentMode 输出结构化 JSON</text>
    <text x="20" y="175" fill="#cbd5e1" font-size="12">• 支持 -Live 网关探活与 Mock 兜底</text>
    <rect x="20" y="210" width="280" height="100" rx="6" fill="#1e293b"/>
    <text x="32" y="235" fill="#94a3b8" font-size="11">人工执行命令:</text>
    <text x="32" y="255" fill="#e2e8f0" font-size="11" font-family="monospace">.\space_bunny_probe_windows11.ps1</text>
    <text x="32" y="280" fill="#94a3b8" font-size="11">Agent 自动集成:</text>
    <text x="32" y="300" fill="#38bdf8" font-size="11" font-family="monospace">-AgentMode | ConvertFrom-Json</text>
  </g>

  <!-- Platform 2: Ubuntu 26.04 -->
  <g transform="translate(440, 110)">
    <rect x="0" y="0" width="320" height="340" rx="12" fill="#111827" stroke="#e95420" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#b3360b"/>
    <text x="20" y="26" fill="#ffffff" font-size="15" font-weight="bold">Ubuntu 26.04 LTS (Bash)</text>
    <text x="20" y="70" fill="#fb923c" font-size="13" font-weight="bold">space_bunny_probe_ubuntu2604.sh</text>
    <text x="20" y="100" fill="#cbd5e1" font-size="12">• 原生 bash + curl + awk，极简极速</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="12">• 自动捕获 TLS 握手、TTFT 与推流速度</text>
    <text x="20" y="150" fill="#cbd5e1" font-size="12">• 支持 --agent-mode 供 CI/CD 自动调度</text>
    <text x="20" y="175" fill="#cbd5e1" font-size="12">• 针对云服务器/Docker 环境优化探针</text>
    <rect x="20" y="210" width="280" height="100" rx="6" fill="#1e293b"/>
    <text x="32" y="235" fill="#94a3b8" font-size="11">人工执行命令:</text>
    <text x="32" y="255" fill="#e2e8f0" font-size="11" font-family="monospace">bash space_bunny_probe_ubuntu2604.sh</text>
    <text x="32" y="280" fill="#94a3b8" font-size="11">Agent 自动集成:</text>
    <text x="32" y="300" fill="#38bdf8" font-size="11" font-family="monospace">./probe.sh --agent-mode | jq .</text>
  </g>

  <!-- Platform 3: macOS 26 -->
  <g transform="translate(820, 110)">
    <rect x="0" y="0" width="320" height="340" rx="12" fill="#111827" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#7e22ce"/>
    <text x="20" y="26" fill="#ffffff" font-size="15" font-weight="bold">macOS 26 (Zsh / Apple Silicon)</text>
    <text x="20" y="70" fill="#c084fc" font-size="13" font-weight="bold">space_bunny_probe_macos26.zsh</text>
    <text x="20" y="100" fill="#cbd5e1" font-size="12">• 针对 Apple Silicon arm64 优化测速</text>
    <text x="20" y="125" fill="#cbd5e1" font-size="12">• 纯原生 zsh 脚本，不引入第三方依赖</text>
    <text x="20" y="150" fill="#cbd5e1" font-size="12">• 完整测试 5 级推理梯度与 1M 上下文</text>
    <text x="20" y="175" fill="#cbd5e1" font-size="12">• 一键纳入本地自动化智能体工具链</text>
    <rect x="20" y="210" width="280" height="100" rx="6" fill="#1e293b"/>
    <text x="32" y="235" fill="#94a3b8" font-size="11">人工执行命令:</text>
    <text x="32" y="255" fill="#e2e8f0" font-size="11" font-family="monospace">zsh space_bunny_probe_macos26.zsh</text>
    <text x="32" y="280" fill="#94a3b8" font-size="11">Agent 自动集成:</text>
    <text x="32" y="300" fill="#38bdf8" font-size="11" font-family="monospace">zsh ./probe.zsh -a &gt; telemetry.json</text>
  </g>

  <!-- Bottom: Unified Autonomous Agent Router -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="1080" height="130" rx="10" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <text x="30" y="35" fill="#34d399" font-size="16" font-weight="bold">⚡ 统一企业级智能体自动化决策与降级路由（Autonomous Fallback Pipeline）</text>
    <text x="30" y="65" fill="#e2e8f0" font-size="13">1. 主力路由 (Primary): 所有代码重构、多模态时序分析、长程架构设计优先走 Space Bunny Alpha (100% 免费 + 1M 窗口)</text>
    <text x="30" y="90" fill="#e2e8f0" font-size="13">2. 看门狗守卫 (Watchdog): 设置 30s 思考超时与 16k Token 上限，一旦探针捕获卡顿立即熔断降级</text>
    <text x="30" y="115" fill="#94a3b8" font-size="13">3. 自动故障转移 (Failover): 探针返回 HEALTHY 时保持 Space Bunny；若触发限制则无缝转移至 Claude 3.7 / GPT-6 Sol</text>
  </g>
</svg>