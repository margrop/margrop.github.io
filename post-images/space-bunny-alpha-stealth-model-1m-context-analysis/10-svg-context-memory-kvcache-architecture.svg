<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">Space Bunny 100万 Token KV-Cache 与多模态时序流式架构</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Multi-Modal Temporal Encoding, Block-Sparse Attention, and Ephemeral Zero-Retention Privacy Isolation</text>

  <!-- Left: Inputs -->
  <rect x="50" y="120" width="300" height="470" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <rect x="50" y="120" width="300" height="40" rx="12" fill="#0369a1"/>
  <text x="70" y="146" fill="#ffffff" font-size="16" font-weight="bold">多模态原生输入管道</text>

  <rect x="70" y="180" width="260" height="80" rx="8" fill="#1e293b"/>
  <text x="86" y="206" fill="#38bdf8" font-size="14" font-weight="bold">1. 文本流 (Text Tokens)</text>
  <text x="86" y="230" fill="#94a3b8" font-size="12">超大单仓代码库 / 100万 Token 日志</text>

  <rect x="70" y="280" width="260" height="80" rx="8" fill="#1e293b"/>
  <text x="86" y="306" fill="#38bdf8" font-size="14" font-weight="bold">2. 高清图像 (Image Patches)</text>
  <text x="86" y="330" fill="#94a3b8" font-size="12">架构拓扑图 / UI 原型 / 显微原理图</text>

  <rect x="70" y="380" width="260" height="90" rx="8" fill="#1e293b"/>
  <text x="86" y="406" fill="#38bdf8" font-size="14" font-weight="bold">3. 连续时序视频 (Video Frames)</text>
  <text x="86" y="430" fill="#94a3b8" font-size="12">动态时序下采样 (Temporal Sampling)</text>
  <text x="86" y="450" fill="#94a3b8" font-size="12">自动提取关键帧与时序动作变化</text>

  <rect x="70" y="490" width="260" height="75" rx="8" fill="#1e293b"/>
  <text x="86" y="516" fill="#34d399" font-size="14" font-weight="bold">统一多模态 Embedding</text>
  <text x="86" y="540" fill="#94a3b8" font-size="12">Cross-Modal Projection 映射向量</text>

  <!-- Middle: Core Engine -->
  <rect x="420" y="120" width="380" height="470" rx="12" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <rect x="420" y="120" width="380" height="40" rx="12" fill="#7e22ce"/>
  <text x="440" y="146" fill="#ffffff" font-size="16" font-weight="bold">超长上下文推演与 KV-Cache 引擎</text>

  <rect x="440" y="180" width="340" height="110" rx="8" fill="#1e293b"/>
  <text x="456" y="206" fill="#c084fc" font-size="14" font-weight="bold">动态分块注意力 (Chunked Attention)</text>
  <text x="456" y="232" fill="#e2e8f0" font-size="12">• 稀疏块检索 (Block-Sparse Routing)</text>
  <text x="456" y="254" fill="#e2e8f0" font-size="12">• 分层状态压缩 (Hierarchical Memory State)</text>
  <text x="456" y="276" fill="#94a3b8" font-size="11">将计算复杂度由 O(N^2) 降至近线性 O(N)</text>

  <rect x="440" y="310" width="340" height="110" rx="8" fill="#1e293b"/>
  <text x="456" y="336" fill="#c084fc" font-size="14" font-weight="bold">100万 Token 动态显存分页 (PagedKV)</text>
  <text x="456" y="362" fill="#e2e8f0" font-size="12">• GPU HBM 高速显存虚拟化池化</text>
  <text x="456" y="384" fill="#e2e8f0" font-size="12">• 零拷贝前缀复用 (Prefix Caching &gt; 95%)</text>
  <text x="456" y="406" fill="#94a3b8" font-size="11">首字延迟 TTFT 压缩至惊人的 380ms</text>

  <rect x="440" y="440" width="340" height="125" rx="8" fill="#1e293b"/>
  <text x="456" y="466" fill="#fbbf24" font-size="14" font-weight="bold">双通道输出缓冲区 (524K Completion)</text>
  <text x="456" y="492" fill="#e2e8f0" font-size="12">• 通道 A: &lt;thought&gt; 隐藏思维链流</text>
  <text x="456" y="514" fill="#e2e8f0" font-size="12">• 通道 B: 干净 Markdown / Code 输出流</text>
  <text x="456" y="536" fill="#34d399" font-size="11">流式吞吐量高达 118.5 Tokens/秒</text>

  <!-- Right: Privacy & Output -->
  <rect x="870" y="120" width="280" height="470" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <rect x="870" y="120" width="280" height="40" rx="12" fill="#047857"/>
  <text x="890" y="146" fill="#ffffff" font-size="16" font-weight="bold">企业级隐私与隔离沙箱</text>

  <rect x="890" y="180" width="240" height="120" rx="8" fill="#1e293b"/>
  <text x="906" y="206" fill="#34d399" font-size="14" font-weight="bold">零数据留存承诺</text>
  <text x="906" y="232" fill="#e2e8f0" font-size="12">• 会话结束显存即刻擦除</text>
  <text x="906" y="254" fill="#e2e8f0" font-size="12">• 永不纳入模型后续训练</text>
  <text x="906" y="276" fill="#94a3b8" font-size="11">彻底满足企业合规审计要求</text>

  <rect x="890" y="320" width="240" height="110" rx="8" fill="#1e293b"/>
  <text x="906" y="346" fill="#38bdf8" font-size="14" font-weight="bold">安全防护看门狗</text>
  <text x="906" y="372" fill="#e2e8f0" font-size="12">• 思考死循环自动熔断</text>
  <text x="906" y="394" fill="#e2e8f0" font-size="12">• 输出长度预算硬限制</text>
  <text x="906" y="416" fill="#94a3b8" font-size="11">防止产生超长无意义开销</text>

  <rect x="890" y="450" width="240" height="115" rx="8" fill="#1e293b"/>
  <text x="906" y="476" fill="#fbbf24" font-size="14" font-weight="bold">高兼容 OpenAI 契约</text>
  <text x="906" y="502" fill="#e2e8f0" font-size="12">• 原生兼容 v1/chat/completions</text>
  <text x="906" y="524" fill="#e2e8f0" font-size="12">• 无缝嵌入现有 Agent 体系</text>
  <text x="906" y="546" fill="#34d399" font-size="11">单行配置零成本快速切换</text>
</svg>