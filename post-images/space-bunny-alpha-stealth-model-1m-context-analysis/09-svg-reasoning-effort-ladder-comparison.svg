<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">Space Bunny Alpha 五阶推理梯阶（Reasoning Effort Ladder）开销与场景匹配</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Balancing Compute, Latency, and Reasoning Depth: From Rapid Routine Tasks to Deep Formal Proofs</text>

  <!-- Level 5: max -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="1080" height="90" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#6d28d9"/>
    <text x="70" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">max</text>
    <text x="70" y="68" text-anchor="middle" fill="#ddd6fe" font-size="11">(Default 默认)</text>
    <text x="160" y="32" fill="#c4b5fd" font-size="15" font-weight="bold">极限形式化逻辑推导与底层系统重构 (Token 预算: 16k - 64k+)</text>
    <text x="160" y="58" fill="#e2e8f0" font-size="13">适用场景：高难度算法竞赛、数学证明、内核底层内存安全性验证、超大规模复杂代码库架构重构。</text>
    <text x="160" y="78" fill="#a78bfa" font-size="12">特点：深度回溯思考，验证各种极端边界条件；思考耗时约 8 - 25 秒，推理严密性地表顶级。</text>
  </g>

  <!-- Level 4: xhigh -->
  <g transform="translate(60, 215)">
    <rect x="0" y="0" width="1080" height="90" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#1d4ed8"/>
    <text x="70" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">xhigh</text>
    <text x="70" y="68" text-anchor="middle" fill="#bfdbfe" font-size="11">极高思考深度</text>
    <text x="160" y="32" fill="#93c5fd" font-size="15" font-weight="bold">多模块跨文件复杂特性开发 (Token 预算: 8k - 16k)</text>
    <text x="160" y="58" fill="#e2e8f0" font-size="13">适用场景：多微服务协同接口设计、复杂数据库 Schema 迁移、并发锁竞争排查、高危安全审计。</text>
    <text x="160" y="78" fill="#60a5fa" font-size="12">特点：深度推演 5 - 12 秒，兼顾了高可靠性与合理的响应时间。</text>
  </g>

  <!-- Level 3: high -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="1080" height="90" rx="10" fill="#132e29" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#047857"/>
    <text x="70" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">high</text>
    <text x="70" y="68" text-anchor="middle" fill="#a7f3d0" font-size="11">高级编程标准</text>
    <text x="160" y="32" fill="#6ee7b7" font-size="15" font-weight="bold">日常生产环境代码编写与 Bug 修复 (Token 预算: 4k - 8k)</text>
    <text x="160" y="58" fill="#e2e8f0" font-size="13">适用场景：完整 REST API 编写、单元测试自动生成、前端核心组件交互、复杂 SQL 查询优化。</text>
    <text x="160" y="78" fill="#34d399" font-size="12">特点：思考耗时 2 - 5 秒，绝大部分复杂企业级任务的最佳甜蜜平衡点。</text>
  </g>

  <!-- Level 2: medium -->
  <g transform="translate(60, 425)">
    <rect x="0" y="0" width="1080" height="90" rx="10" fill="#3b2b11" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#b45309"/>
    <text x="70" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">medium</text>
    <text x="70" y="68" text-anchor="middle" fill="#fde68a" font-size="11">智能体推荐档</text>
    <text x="160" y="32" fill="#fcd34d" font-size="15" font-weight="bold">自主智能体（Agent）高速工具调用与日志排查 (Token 预算: 1.5k - 4k)</text>
    <text x="160" y="58" fill="#e2e8f0" font-size="13">适用场景：自主 Agent 循环执行、Tool Use 决策分发、实时异常告警分析、长文档概要提炼。</text>
    <text x="160" y="78" fill="#fbbf24" font-size="12">特点：思考延迟 &lt; 1.5 秒，生成流畅，防止智能体在循环调用中过度陷入长考。</text>
  </g>

  <!-- Level 1: low -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="1080" height="90" rx="10" fill="#20293a" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="90" rx="10" fill="#475569"/>
    <text x="70" y="42" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">low</text>
    <text x="70" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">轻量快响应</text>
    <text x="160" y="32" fill="#cbd5e1" font-size="15" font-weight="bold">轻量级问答、代码格式化与语法校对 (Token 预算: 500 - 1.5k)</text>
    <text x="160" y="58" fill="#e2e8f0" font-size="13">适用场景：快速语法补全、Markdown 格式排版、简短文本问答、翻译与修辞润色。</text>
    <text x="160" y="78" fill="#94a3b8" font-size="12">特点：极速首字输出，保留基本链式推理保护，避免纯无思考模型的低级常识幻觉。</text>
  </g>
</svg>