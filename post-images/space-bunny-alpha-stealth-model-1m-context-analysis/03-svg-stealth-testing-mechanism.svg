<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradLab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradRouter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gradTraffic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gradTelemetry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gradLaunch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">前沿大模型“隐形马甲（Stealth Model）”盲测全生命周期架构</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-size="14">Why Frontier Labs Deploy Anonymous AI: Eliminating Brand Halo, Stress-Testing Inference &amp; Zero-Liability Red-Teaming</text>

  <!-- Step 1 -->
  <rect x="50" y="140" width="320" height="200" rx="12" fill="#111827" stroke="#4f46e5" stroke-width="2"/>
  <rect x="50" y="140" width="320" height="40" rx="12" fill="url(#gradLab)"/>
  <text x="70" y="166" fill="#ffffff" font-size="16" font-weight="bold">阶段 1: 实验室绝密孵化</text>
  <text x="70" y="210" fill="#e2e8f0" font-size="13">• 全新代际基座 (如 Kimi k2 / MiniMax-2)</text>
  <text x="70" y="238" fill="#e2e8f0" font-size="13">• 100万 Token 超长上下文注意力微调</text>
  <text x="70" y="266" fill="#e2e8f0" font-size="13">• 强制慢思考 RL 强化学习蒸馏对齐</text>
  <text x="70" y="294" fill="#94a3b8" font-size="12">状态: 权重冻结，内部基准测试完成</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 370 240 L 440 240" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="440" y="140" width="320" height="200" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="2"/>
  <rect x="440" y="140" width="320" height="40" rx="12" fill="url(#gradMask)"/>
  <text x="460" y="166" fill="#ffffff" font-size="16" font-weight="bold">阶段 2: 隐形马甲伪装与脱敏</text>
  <text x="460" y="210" fill="#e2e8f0" font-size="13">• 命名遮蔽: 'Space Bunny Alpha' (太空玉兔)</text>
  <text x="460" y="238" fill="#e2e8f0" font-size="13">• 隐藏提供商标签: 'Anonymous 3rd Party'</text>
  <text x="460" y="266" fill="#e2e8f0" font-size="13">• 隐私脱敏: 承诺零数据留存 (Zero Retention)</text>
  <text x="460" y="294" fill="#94a3b8" font-size="12">目的: 彻底消除用户心理上的“品牌光环”</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 760 240 L 830 240" stroke="#10b981" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Step 3 -->
  <rect x="830" y="140" width="320" height="200" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <rect x="830" y="140" width="320" height="40" rx="12" fill="url(#gradRouter)"/>
  <text x="850" y="166" fill="#ffffff" font-size="16" font-weight="bold">阶段 3: 路由聚合网关分发</text>
  <text x="850" y="210" fill="#e2e8f0" font-size="13">• OpenRouter: stealth/space-bunny-alpha</text>
  <text x="850" y="238" fill="#e2e8f0" font-size="13">• OpenCode: space-bunny-free (Zen API)</text>
  <text x="850" y="266" fill="#e2e8f0" font-size="13">• 限时 100% 免费策应 ($0/1M Tokens)</text>
  <text x="850" y="294" fill="#94a3b8" font-size="12">策略: 以零门槛迅速吸纳全球真实野生流量</text>

  <!-- Downward to Phase 4, 5, 6 -->
  <path d="M 990 340 L 990 410" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Step 4 -->
  <rect x="830" y="410" width="320" height="210" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
  <rect x="830" y="410" width="320" height="40" rx="12" fill="url(#gradTraffic)"/>
  <text x="850" y="436" fill="#ffffff" font-size="16" font-weight="bold">阶段 4: 盲测流量淬火与实战</text>
  <text x="850" y="480" fill="#e2e8f0" font-size="13">• 全球开发者进行复杂编程与多模态实测</text>
  <text x="850" y="508" fill="#e2e8f0" font-size="13">• 100万 Token 真实长文档/视频压测</text>
  <text x="850" y="536" fill="#e2e8f0" font-size="13">• 对比 Claude 3.7 / o1 / GPT-6 实时战力</text>
  <text x="850" y="564" fill="#94a3b8" font-size="12">反馈: Reddit / NodeSeek 社区热烈破解原作者</text>

  <!-- Arrow 4 <- 5 -->
  <path d="M 830 515 L 760 515" stroke="#e11d48" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Step 5 -->
  <rect x="440" y="410" width="320" height="210" rx="12" fill="#111827" stroke="#e11d48" stroke-width="2"/>
  <rect x="440" y="410" width="320" height="40" rx="12" fill="url(#gradTelemetry)"/>
  <text x="460" y="436" fill="#ffffff" font-size="16" font-weight="bold">阶段 5: 遥测数据回收与红蓝对抗</text>
  <text x="460" y="480" fill="#e2e8f0" font-size="13">• 发现长程推理中的死循环与过度思考</text>
  <text x="460" y="508" fill="#e2e8f0" font-size="13">• 捕捉对抗性越狱与安全边界试探</text>
  <text x="460" y="536" fill="#e2e8f0" font-size="13">• 优化 TTFT 首字延迟与 KV Cache 命中</text>
  <text x="460" y="564" fill="#94a3b8" font-size="12">价值: 零品牌负债下完成全套工业级脱敏压测</text>

  <!-- Arrow 5 <- 6 -->
  <path d="M 440 515 L 370 515" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Step 6 -->
  <rect x="50" y="410" width="320" height="210" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
  <rect x="50" y="410" width="320" height="40" rx="12" fill="url(#gradLaunch)"/>
  <text x="70" y="436" fill="#ffffff" font-size="16" font-weight="bold">阶段 6: 揭面官宣与商业化收割</text>
  <text x="70" y="480" fill="#e2e8f0" font-size="13">• 正式公布真实身份 (如同 Ox Alpha -> GLM)</text>
  <text x="70" y="508" fill="#e2e8f0" font-size="13">• 携带权威榜单与压测声誉高调发布</text>
  <text x="70" y="536" fill="#e2e8f0" font-size="13">• 转入正式商业化 API 定价与企业级服务</text>
  <text x="70" y="564" fill="#94a3b8" font-size="12">结果: 零翻车风险，全行业认知度瞬间引爆</text>
</svg>