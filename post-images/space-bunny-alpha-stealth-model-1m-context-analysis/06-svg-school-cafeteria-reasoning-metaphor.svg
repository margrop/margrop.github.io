<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">小学生秒懂打比方：学校食堂大厨与神秘“太空兔子”打饭记</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">An Everyday Life Metaphor: How Space Bunny Alpha Combines Massive 1M Memory with Mandatory Scratchpad Reasoning</text>

  <!-- Left: Standard Chat Model -->
  <rect x="50" y="110" width="520" height="490" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <rect x="50" y="110" width="520" height="45" rx="14" fill="#7f1d1d"/>
  <text x="75" y="140" fill="#ffffff" font-size="18" font-weight="bold">普通快餐档口大厨 (传统无思考大模型)</text>

  <!-- Sub-block 1 -->
  <rect x="75" y="175" width="470" height="90" rx="8" fill="#1e293b"/>
  <text x="95" y="205" fill="#f87171" font-size="15" font-weight="bold">1. 记忆小托盘 (小上下文 8K - 32K)</text>
  <text x="95" y="235" fill="#cbd5e1" font-size="13">只能记住你刚说的上一句话。如果点了一桌复杂的大餐，</text>
  <text x="95" y="255" fill="#94a3b8" font-size="13">吃到后半段他就把前面的菜谱全忘了，经常丢三落四。</text>

  <!-- Sub-block 2 -->
  <rect x="75" y="280" width="470" height="90" rx="8" fill="#1e293b"/>
  <text x="95" y="310" fill="#f87171" font-size="15" font-weight="bold">2. 不打草稿凭感觉抓菜 (No Reasoning)</text>
  <text x="95" y="340" fill="#cbd5e1" font-size="13">你问他一道高难度数学竞赛题，他不打草稿直接抓起一把菜扔盘里，</text>
  <text x="95" y="360" fill="#94a3b8" font-size="13">虽然一秒钟端给你，但结果往往是错的（一本正经地胡说八道）。</text>

  <!-- Sub-block 3 -->
  <rect x="75" y="385" width="470" height="90" rx="8" fill="#1e293b"/>
  <text x="95" y="415" fill="#f87171" font-size="15" font-weight="bold">3. 遇到超难长文章就手忙脚乱</text>
  <text x="95" y="445" fill="#cbd5e1" font-size="13">如果给他一本《现代汉语词典》，他看都没翻完脑子就宕机，</text>
  <text x="95" y="465" fill="#94a3b8" font-size="13">或者干脆把中间最关键的几页直接当废纸跳过。</text>

  <rect x="75" y="490" width="470" height="85" rx="8" fill="#371b1b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="95" y="520" fill="#fca5a5" font-size="14" font-weight="bold">结果总结：</text>
  <text x="95" y="545" fill="#e2e8f0" font-size="13">速度看起来挺快，但关键时刻不靠谱，做不了复杂的大工程！</text>

  <!-- Right: Space Bunny Alpha -->
  <rect x="630" y="110" width="520" height="490" rx="14" fill="#111827" stroke="#10b981" stroke-width="2"/>
  <rect x="630" y="110" width="520" height="45" rx="14" fill="#065f46"/>
  <text x="655" y="140" fill="#ffffff" font-size="18" font-weight="bold">太空玉兔超级神厨 (Space Bunny Alpha 隐形模型)</text>

  <!-- Sub-block 1 -->
  <rect x="655" y="175" width="470" height="90" rx="8" fill="#1e293b"/>
  <text x="675" y="205" fill="#34d399" font-size="15" font-weight="bold">1. 操场级超级记忆保温车 (100万 Token 上下文)</text>
  <text x="675" y="235" fill="#cbd5e1" font-size="13">能把整个小学一到六年级的全部语文、数学课本一次性装在车里，</text>
  <text x="675" y="255" fill="#94a3b8" font-size="13">你随口问第三册第58页第3行写了啥，他瞬间精准找到，一字不差！</text>

  <!-- Sub-block 2 -->
  <rect x="655" y="280" width="470" height="90" rx="8" fill="#1e293b"/>
  <text x="675" y="310" fill="#34d399" font-size="15" font-weight="bold">2. 强制配一本专用演算本 (Mandatory Reasoning)</text>
  <text x="675" y="340" fill="#cbd5e1" font-size="13">不管题目多简单或多难，必须在草稿纸上把推理公式一条条写清楚！</text>
  <text x="675" y="360" fill="#94a3b8" font-size="13">自我检查逻辑有没有漏洞，确认百分之百无误后，才把最终答案端给你。</text>

  <!-- Sub-block 3 -->
  <rect x="655" y="385" width="470" height="90" rx="8" fill="#1e293b"/>
  <text x="675" y="415" fill="#34d399" font-size="15" font-weight="bold">3. 超光速神厨飞铲 (118.5 Tokens/s 闪电生成)</text>
  <text x="675" y="445" fill="#cbd5e1" font-size="13">一般的思考型模型像老爷爷算盘算得慢吞吞，而玉兔大厨自带火箭引擎，</text>
  <text x="675" y="465" fill="#94a3b8" font-size="13">虽然演算过程极度严谨，但飞铲舞得如同残影，几秒钟就盛满一大碗！</text>

  <rect x="655" y="490" width="470" height="85" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="675" y="520" fill="#6ee7b7" font-size="14" font-weight="bold">结果总结：</text>
  <text x="675" y="545" fill="#e2e8f0" font-size="13">既有学霸级的超级脑容量与严密逻辑，又有闪电般的速度，还完全免费！</text>
</svg>