<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="600" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#1a2b4a">PostgreSQL = 一台主机 + 一墙乐高插件</text>
  <text x="600" y="100" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#5a6b87">想要新能力不用换数据库,往上插一块积木就行</text>

  <!-- 主机 -->
  <g transform="translate(430,260)">
    <rect width="340" height="220" rx="20" fill="#2f6db3" stroke="#1d4e86" stroke-width="5"/>
    <text x="170" y="100" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">PostgreSQL</text>
    <text x="170" y="150" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#bcd8f5">数据库主机</text>
    <text x="170" y="190" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#bcd8f5">CREATE EXTENSION 一键插上</text>
  </g>

  <!-- 积木: pgvector -->
  <g transform="translate(70,160)">
    <rect width="270" height="130" rx="14" fill="#7c3aed"/>
    <rect x="30" y="-14" width="46" height="16" rx="6" fill="#7c3aed"/><rect x="112" y="-14" width="46" height="16" rx="6" fill="#7c3aed"/><rect x="194" y="-14" width="46" height="16" rx="6" fill="#7c3aed"/>
    <text x="135" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">pgvector</text>
    <text x="135" y="96" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#e4d5ff">AI 向量检索 / RAG</text>
  </g>
  <!-- 积木: PostGIS -->
  <g transform="translate(860,160)">
    <rect width="270" height="130" rx="14" fill="#1e8e5a"/>
    <rect x="30" y="-14" width="46" height="16" rx="6" fill="#1e8e5a"/><rect x="112" y="-14" width="46" height="16" rx="6" fill="#1e8e5a"/><rect x="194" y="-14" width="46" height="16" rx="6" fill="#1e8e5a"/>
    <text x="135" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">PostGIS</text>
    <text x="135" y="96" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#d2f2e2">地图 / 地理围栏</text>
  </g>
  <!-- 积木: TimescaleDB -->
  <g transform="translate(70,440)">
    <rect width="270" height="130" rx="14" fill="#e0882a"/>
    <rect x="30" y="-14" width="46" height="16" rx="6" fill="#e0882a"/><rect x="112" y="-14" width="46" height="16" rx="6" fill="#e0882a"/><rect x="194" y="-14" width="46" height="16" rx="6" fill="#e0882a"/>
    <text x="135" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">TimescaleDB</text>
    <text x="135" y="96" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#fde8cf">时序数据 / 监控指标</text>
  </g>
  <!-- 积木: Citus -->
  <g transform="translate(860,440)">
    <rect width="270" height="130" rx="14" fill="#c0392b"/>
    <rect x="30" y="-14" width="46" height="16" rx="6" fill="#c0392b"/><rect x="112" y="-14" width="46" height="16" rx="6" fill="#c0392b"/><rect x="194" y="-14" width="46" height="16" rx="6" fill="#c0392b"/>
    <text x="135" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Citus</text>
    <text x="135" y="96" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#fadbd4">水平分片 / 分布式</text>
  </g>

  <!-- 连接线 -->
  <g stroke="#8fa5c2" stroke-width="5" stroke-dasharray="10 8">
    <line x1="340" y1="290" x2="430" y2="330"/>
    <line x1="860" y1="290" x2="770" y2="330"/>
    <line x1="340" y1="500" x2="430" y2="440"/>
    <line x1="860" y1="500" x2="770" y2="440"/>
  </g>

  <text x="600" y="660" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1a2b4a">AI 时代最贵的不是数据库,是「少搬一次家」</text>
  <text x="600" y="694" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#5a6b87">MySQL 也能装插件,但规格像螺丝对不上的玩具 —— 能插的积木少得多</text>
</svg>
