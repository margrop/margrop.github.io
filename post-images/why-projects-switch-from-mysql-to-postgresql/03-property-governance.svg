<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f7f9fc"/>
  <text x="600" y="58" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#1a2b4a">同一个小区,两种物业</text>
  <text x="600" y="100" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#5a6b87">选数据库,其实是在选「谁说了算」</text>

  <!-- 左: MySQL 商业物业 -->
  <g transform="translate(70,140)">
    <rect width="480" height="480" rx="20" fill="#ffffff" stroke="#e0882a" stroke-width="4"/>
    <rect width="480" height="70" rx="20" fill="#e0882a"/>
    <text x="240" y="48" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">MySQL:商业物业公司</text>
    <!-- 物业楼 -->
    <rect x="150" y="110" width="180" height="130" rx="8" fill="#f6ddba" stroke="#b06f1d" stroke-width="3"/>
    <text x="240" y="160" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#8a5410">Oracle 物业总部</text>
    <text x="240" y="200" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#8a5410">电梯广告位招租中</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#4a5568">
      <text x="40" y="300">• 修不修电梯,物业说了算</text>
      <text x="40" y="345">• 物业费(企业版功能)说涨就涨</text>
      <text x="40" y="390">• 2025 年物业裁员,保安亭空了</text>
      <text x="40" y="435">• GPL 双许可证:免费住,但规矩它定</text>
    </g>
  </g>

  <!-- 右: PostgreSQL 业委会 -->
  <g transform="translate(650,140)">
    <rect width="480" height="480" rx="20" fill="#ffffff" stroke="#2f6db3" stroke-width="4"/>
    <rect width="480" height="70" rx="20" fill="#2f6db3"/>
    <text x="240" y="48" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">PostgreSQL:小区业委会</text>
    <!-- 业委会圆桌 -->
    <ellipse cx="240" cy="180" rx="130" ry="46" fill="#dceafc" stroke="#2f6db3" stroke-width="3"/>
    <circle cx="150" cy="150" r="20" fill="#7fb3e8"/>
    <circle cx="240" cy="132" r="20" fill="#7fb3e8"/>
    <circle cx="330" cy="150" r="20" fill="#7fb3e8"/>
    <text x="240" y="186" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#1d4e86">全球社区圆桌</text>
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#4a5568">
      <text x="40" y="300">• 修电梯大家一起投票(社区治理)</text>
      <text x="40" y="345">• 没有物业费,账本公开(PostgreSQL 许可证)</text>
      <text x="40" y="390">• 谁也收购不了它 —— 它不属于任何公司</text>
      <text x="40" y="435">• 云厂商只能「托管」,不能「占有」</text>
    </g>
  </g>

  <text x="600" y="680" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#5a6b87">技术差距会追平,治理结构不会 —— 这才是架构师真正下注的东西</text>
</svg>
