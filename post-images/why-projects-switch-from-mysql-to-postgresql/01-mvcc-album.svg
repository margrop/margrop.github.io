<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f9fc"/>
  <text x="600" y="60" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#1a2b4a">同一份家庭相册，两种改法</text>
  <text x="600" y="104" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#5a6b87">MVCC 多版本并发控制：为什么 PostgreSQL 读写不用互相排队</text>

  <!-- 左: MySQL 涂改原件 -->
  <g transform="translate(70,150)">
    <rect width="480" height="540" rx="20" fill="#ffffff" stroke="#e0882a" stroke-width="4"/>
    <rect width="480" height="70" rx="20" fill="#e0882a"/>
    <text x="240" y="48" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">MySQL(InnoDB):直接涂改原件</text>
    <!-- 相册照片 -->
    <rect x="140" y="110" width="200" height="160" rx="8" fill="#fde8cf" stroke="#c97b1f" stroke-width="3"/>
    <text x="240" y="180" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#8a5410">照片:余额 100 元</text>
    <text x="240" y="220" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#c0392b">被划掉,改成 80</text>
    <line x1="160" y1="170" x2="320" y2="150" stroke="#c0392b" stroke-width="5"/>
    <!-- 读者排队 -->
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#4a5568">
      <text x="40" y="340">想看照片的人(读者):</text>
    </g>
    <g>
      <circle cx="90" cy="410" r="24" fill="#f0b27a"/><text x="90" y="460" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#7a4a12">排队等</text>
      <circle cx="180" cy="410" r="24" fill="#f0b27a"/><text x="180" y="460" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#7a4a12">排队等</text>
      <circle cx="270" cy="410" r="24" fill="#f0b27a"/><text x="270" y="460" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#7a4a12">排队等</text>
      <text x="380" y="420" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#c0392b">🔒 写锁</text>
    </g>
    <text x="240" y="520" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#8a5410">旧版本塞在「回收站」(undo log),找回要翻垃圾桶</text>
  </g>

  <!-- 右: PostgreSQL 复印新版本 -->
  <g transform="translate(650,150)">
    <rect width="480" height="540" rx="20" fill="#ffffff" stroke="#2f6db3" stroke-width="4"/>
    <rect width="480" height="70" rx="20" fill="#2f6db3"/>
    <text x="240" y="48" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">PostgreSQL:每人发一张复印</text>
    <!-- 两张照片 -->
    <rect x="50" y="110" width="180" height="140" rx="8" fill="#dceafc" stroke="#2f6db3" stroke-width="3" transform="rotate(-4 140 180)"/>
    <text x="140" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#1d4e86" transform="rotate(-4 140 180)">旧版:100 元</text>
    <rect x="250" y="110" width="180" height="140" rx="8" fill="#d3f2e3" stroke="#1e8e5a" stroke-width="3" transform="rotate(3 340 180)"/>
    <text x="340" y="185" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#14663f" transform="rotate(3 340 180)">新版:80 元</text>
    <!-- 读者各看各的 -->
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#4a5568">
      <text x="40" y="330">想看照片的人(读者):</text>
    </g>
    <g>
      <circle cx="90" cy="400" r="24" fill="#7fb3e8"/><text x="90" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#1d4e86">看旧版 ✓</text>
      <circle cx="210" cy="400" r="24" fill="#7fb3e8"/><text x="210" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#1d4e86">看旧版 ✓</text>
      <circle cx="330" cy="400" r="24" fill="#8fd6ae"/><text x="330" y="452" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#14663f">看新版 ✓</text>
      <text x="395" y="406" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#1e8e5a">互不干扰</text>
    </g>
    <text x="240" y="520" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#1d4e86">新旧版本都摆在桌上,读者随手拿,谁也不挡谁</text>
  </g>

  <text x="600" y="730" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#5a6b87">读多写多的系统(订单、账单、Feed 流)最怕排队 —— 这正是 PostgreSQL 的主场</text>
</svg>
