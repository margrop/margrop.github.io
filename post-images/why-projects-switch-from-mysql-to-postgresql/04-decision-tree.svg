<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <rect width="1200" height="860" fill="#f7f9fc"/>
  <text x="600" y="56" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="bold" fill="#1a2b4a">2026 年了,新项目到底选谁?一张图说清</text>

  <!-- 起点 -->
  <g transform="translate(430,90)">
    <rect width="340" height="70" rx="35" fill="#1a2b4a"/>
    <text x="170" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">新项目选数据库</text>
  </g>

  <!-- 分支问题1 -->
  <g transform="translate(360,200)">
    <rect width="480" height="80" rx="14" fill="#ffffff" stroke="#2f6db3" stroke-width="3"/>
    <text x="240" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1a2b4a">Q1:要做 AI 检索 / 地图 / 时序,</text>
    <text x="240" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1a2b4a">或者复杂 SQL 报表吗?</text>
  </g>
  <line x1="600" y1="160" x2="600" y2="200" stroke="#8fa5c2" stroke-width="4"/>

  <!-- 是 -> PostgreSQL -->
  <g transform="translate(70,330)">
    <rect width="420" height="130" rx="16" fill="#2f6db3"/>
    <text x="210" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">直接 PostgreSQL</text>
    <text x="210" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#bcd8f5">pgvector / PostGIS / JSONB</text>
    <text x="210" y="112" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#bcd8f5">一个顶三个,少养一套中间件</text>
  </g>
  <line x1="360" y1="240" x2="280" y2="330" stroke="#2f6db3" stroke-width="4"/>
  <text x="270" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#2f6db3">是</text>

  <!-- 否 -> Q2 -->
  <g transform="translate(640,330)">
    <rect width="490" height="80" rx="14" fill="#ffffff" stroke="#e0882a" stroke-width="3"/>
    <text x="245" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1a2b4a">Q2:是简单 CRUD + 超高并发读,</text>
    <text x="245" y="66" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#1a2b4a">团队全是 MySQL 老兵吗?</text>
  </g>
  <line x1="840" y1="240" x2="885" y2="330" stroke="#e0882a" stroke-width="4"/>
  <text x="858" y="288" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#e0882a">否</text>

  <!-- 是 -> MySQL 也合理 -->
  <g transform="translate(640,460)">
    <rect width="490" height="130" rx="16" fill="#e0882a"/>
    <text x="245" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">选 MySQL 依然合理</text>
    <text x="245" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#fde8cf">博客 / 电商读多 / 存量系统别乱动</text>
    <text x="245" y="112" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#fde8cf">团队熟练度就是最贵的性能优化</text>
  </g>
  <line x1="885" y1="410" x2="885" y2="460" stroke="#e0882a" stroke-width="4"/>
  <text x="900" y="442" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#e0882a">是</text>

  <!-- 否 -> PostgreSQL 默认 -->
  <g transform="translate(360,640)">
    <rect width="480" height="120" rx="16" fill="#1e8e5a"/>
    <text x="240" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">都不确定?默认 PostgreSQL</text>
    <text x="240" y="84" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#d2f2e2">2026 年的「默认选项」:上限更高,退路更多</text>
  </g>
  <line x1="885" y1="590" x2="660" y2="640" stroke="#1e8e5a" stroke-width="4"/>
  <text x="800" y="622" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#1e8e5a">否</text>

  <text x="600" y="826" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" fill="#5a6b87">选型不是站队,是算账:算未来三年要多养几套系统、多招几个人</text>
</svg>
