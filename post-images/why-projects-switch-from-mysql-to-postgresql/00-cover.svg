<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="pgBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90d9"/>
      <stop offset="1" stop-color="#2f6db3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- 背景数据流点阵 -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="80" cy="90" r="4"/><circle cx="180" cy="60" r="3"/><circle cx="1120" cy="120" r="4"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="120" cy="590" r="4"/><circle cx="980" cy="70" r="3"/>
    <circle cx="620" cy="620" r="3"/><circle cx="60" cy="330" r="3"/><circle cx="1140" cy="330" r="3"/>
  </g>
  <!-- 搬家的箱子: MySQL 海豚搬出 -->
  <g transform="translate(140,380)">
    <rect x="0" y="60" width="200" height="150" rx="12" fill="#d98e32" stroke="#b06f1d" stroke-width="4"/>
    <rect x="0" y="60" width="200" height="34" rx="12" fill="#b06f1d"/>
    <text x="100" y="165" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">MySQL</text>
    <text x="100" y="46" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#ffd9a0">旧家 · 行李打包中</text>
  </g>
  <!-- 搬家箭头 -->
  <g transform="translate(400,440)">
    <path d="M0 30 L150 30" stroke="#ffcc4d" stroke-width="14" stroke-linecap="round"/>
    <path d="M130 0 L175 30 L130 60 Z" fill="#ffcc4d"/>
    <text x="85" y="-18" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#ffcc4d">搬家潮</text>
  </g>
  <!-- PostgreSQL 大象新家 -->
  <g transform="translate(640,330)">
    <rect x="0" y="80" width="420" height="200" rx="18" fill="url(#pgBody)" stroke="#1d4e86" stroke-width="5"/>
    <rect x="0" y="80" width="420" height="40" rx="18" fill="#1d4e86"/>
    <!-- 大象简笔画 -->
    <g transform="translate(28,120)" fill="#eaf3ff">
      <ellipse cx="60" cy="60" rx="52" ry="46"/>
      <circle cx="96" cy="42" r="26"/>
      <path d="M112 60 q26 10 20 44" stroke="#eaf3ff" stroke-width="14" fill="none" stroke-linecap="round"/>
      <circle cx="104" cy="38" r="4.5" fill="#1d4e86"/>
    </g>
    <text x="300" y="190" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">PostgreSQL</text>
    <text x="300" y="235" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#bcd8f5">新家 · 8 亿用户都在用</text>
  </g>
  <!-- 标题 -->
  <text x="600" y="180" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">数据库的「搬家时代」</text>
  <text x="600" y="252" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="36" fill="#9fc3ec">为什么越来越多的项目告别 MySQL，搬进 PostgreSQL</text>
</svg>
