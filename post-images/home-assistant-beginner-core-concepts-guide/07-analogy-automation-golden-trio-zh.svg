<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="自动化的黄金三要素：触发器、限制条件与执行动作">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#059669" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#059669" font-weight="600">AUTOMATION LOGIC / THE GOLDEN TRIO</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">自动化的黄金三要素：庄园自动化家规的三段式链条</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">Trigger（导火索：什么时候看）&#8594; Condition（过滤器：真的要执行吗）&#8594; Action（清单：做什么）</text>

<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="130" height="46" rx="10" fill="#e11d48"/>
<text x="157" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">1. 触发器</text>
<text x="92" y="390" font-size="28" fill="#0f172a" font-weight="600">Trigger (导火索)</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#e11d48"/>
<text x="116" y="462" font-size="19" fill="#334155" font-weight="400">定义：唤醒管家查看家规的瞬间事件</text>
<circle cx="100" cy="507" r="4.5" fill="#e11d48"/>
<text x="116" y="514" font-size="19" fill="#334155" font-weight="400">核心特征：状态瞬间跳变（关变为开）</text>
<circle cx="100" cy="559" r="4.5" fill="#e11d48"/>
<text x="116" y="566" font-size="19" fill="#334155" font-weight="400">典型举例：大门传感器被推开</text>
<circle cx="100" cy="611" r="4.5" fill="#e11d48"/>
<text x="116" y="618" font-size="19" fill="#334155" font-weight="400">典型举例：太阳刚好落入地平线 (日落)</text>

<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#059669" stroke-width="3"/>
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="130" height="46" rx="10" fill="#d97706"/>
<text x="605" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">2. 条件</text>
<text x="540" y="390" font-size="28" fill="#0f172a" font-weight="600">Condition (过滤器)</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="19" fill="#334155" font-weight="400">定义：唤醒后必须同时满足的前提限制</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="19" fill="#334155" font-weight="400">核心特征：当下静态状态（是不是...）</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="19" fill="#334155" font-weight="400">典型举例：此时光照强度低于 50 Lux</text>
<circle cx="548" cy="611" r="4.5" fill="#d97706"/>
<text x="564" y="618" font-size="19" fill="#334155" font-weight="400">典型举例：并且主人此时状态为「在家」</text>

<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#059669" stroke-width="3"/>
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="130" height="46" rx="10" fill="#059669"/>
<text x="1053" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">3. 动作</text>
<text x="988" y="390" font-size="28" fill="#0f172a" font-weight="600">Action (执行令)</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="19" fill="#334155" font-weight="400">定义：确认通过过滤器后立即下达的指令</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="19" fill="#334155" font-weight="400">核心特征：调用具体服务或改变实体状态</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="19" fill="#334155" font-weight="400">典型举例：点亮玄关灯并调为暖黄光</text>
<circle cx="996" cy="611" r="4.5" fill="#059669"/>
<text x="1012" y="618" font-size="19" fill="#334155" font-weight="400">典型举例：小爱音箱播放「欢迎回家」</text>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">原创逻辑图解 · 自动化黄金三要素与执行逻辑 · 2026-10-29</text>
<text x="1376" y="790" font-size="21" fill="#059669" font-weight="600" text-anchor="end">07</text>
</svg>