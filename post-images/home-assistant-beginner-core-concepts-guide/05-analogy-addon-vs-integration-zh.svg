<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="终极辨析：加载项 (Add-on) 与 集成 (Integration) 的本质区别">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#d97706" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#d97706" font-weight="600">DEEP DIVE COMPARISON / ADD-ON VS INTEGRATION</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">新手终极困惑辨析：加载项 (Add-on) 与 集成 (Integration) 的区别</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">庄园后院独立小木屋 vs. 庄园主楼常驻翻译官：底层架构、使用场景与辨析口诀</text>

<rect x="64" y="265" width="630" height="370" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="96" y="295" width="180" height="46" rx="10" fill="#0284c7"/>
<text x="186" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">加载项 (Add-on)</text>
<text x="96" y="380" font-size="26" fill="#0f172a" font-weight="600">后院的「独立工坊小木屋」</text>
<line x1="96" y1="405" x2="662" y2="405" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="106" cy="442" r="4.5" fill="#0284c7"/>
<text x="122" y="449" font-size="19" fill="#334155">本质：完全独立的 Docker 容器应用（如 sidecar 架构）</text>
<circle cx="106" cy="488" r="4.5" fill="#0284c7"/>
<text x="122" y="495" font-size="19" fill="#334155">运行：拥有独立端口、独立进程与完整运行沙箱</text>
<circle cx="106" cy="534" r="4.5" fill="#0284c7"/>
<text x="122" y="541" font-size="19" fill="#334155">门槛：仅在 HAOS / Supervised 安装模式下原生支持</text>
<circle cx="106" cy="580" r="4.5" fill="#0284c7"/>
<text x="122" y="587" font-size="19" fill="#334155">典型：Mosquitto (MQTT 服务器)、Node-RED、File Editor</text>

<rect x="746" y="265" width="630" height="370" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="778" y="295" width="180" height="46" rx="10" fill="#059669"/>
<text x="868" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">集成 (Integration)</text>
<text x="778" y="380" font-size="26" fill="#0f172a" font-weight="600">主楼里的「驻场翻译外交官」</text>
<line x1="778" y1="405" x2="1344" y2="405" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="788" cy="442" r="4.5" fill="#059669"/>
<text x="804" y="449" font-size="19" fill="#334155">本质：HA Core 内部直接加载的 Python 驱动模块</text>
<circle cx="788" cy="488" r="4.5" fill="#059669"/>
<text x="804" y="495" font-size="19" fill="#334155">运行：不占独立端口，直接向状态机注入实体与服务</text>
<circle cx="788" cy="534" r="4.5" fill="#059669"/>
<text x="804" y="541" font-size="19" fill="#334155">门槛：所有 HA 安装模式（包括 Docker/Core）全部通用</text>
<circle cx="788" cy="580" r="4.5" fill="#059669"/>
<text x="804" y="587" font-size="19" fill="#334155">典型：Xiaomi Miot、Midea AC LAN、HomeKit、MQTT 集成</text>

<rect x="64" y="655" width="1312" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="96" y="703" font-size="20" fill="#1e40af" font-weight="600">新手避坑口诀：</text>
<text x="240" y="703" font-size="20" fill="#1e3a8a">想连智能灯、空调、电表去「集成」添加；想装 MQTT 服务器、终端工具、代码编辑器去「加载项」下载！</text>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">原创概念辨析 · 加载项 (Add-on) 与 集成 (Integration) 的本质对比 · 2026-10-29</text>
<text x="1376" y="790" font-size="21" fill="#0284c7" font-weight="600" text-anchor="end">05</text>
</svg>