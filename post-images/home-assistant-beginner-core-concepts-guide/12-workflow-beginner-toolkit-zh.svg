<text x="116" y="566" font-size="19" fill="#334155" font-weight="400">绝不向全网洪泛广播，零依赖外部云服务</text>
<circle cx="100" cy="611" r="4.5" fill="#6366f1"/>
<text x="116" y="618" font-size="19" fill="#334155" font-weight="400">校验本机防火墙与局域网路由连通性</text>

<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#6366f1" stroke-width="3"/>
