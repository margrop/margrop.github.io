<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">Windows 11 / Ubuntu 26.04 / macOS 27 零依赖脚本：局域网发现、状态审计与开箱治理</text>

<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
