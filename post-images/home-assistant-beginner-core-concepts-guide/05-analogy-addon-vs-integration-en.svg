<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="The Fundamental Difference: Add-on (Sidecar App) vs Integration (Internal Driver)">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#d97706" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#d97706" font-weight="600">DEEP DIVE COMPARISON / ADD-ON VS INTEGRATION</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">The #1 Beginner Trap: Add-ons (Sidecars) vs. Integrations (Drivers)</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">Backyard Workshop Cottages vs. In-House Diplomats: Architecture, Ports &amp; Rules of Thumb</text>

<rect x="64" y="265" width="630" height="370" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="96" y="295" width="180" height="46" rx="10" fill="#0284c7"/>
<text x="186" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">Add-on (Sidecar)</text>
<text x="96" y="380" font-size="26" fill="#0f172a" font-weight="600">Backyard Standalone Workshop</text>
<line x1="96" y1="405" x2="662" y2="405" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="106" cy="442" r="4.5" fill="#0284c7"/>
<text x="122" y="449" font-size="19" fill="#334155">Nature: Fully independent Docker container application</text>
<circle cx="106" cy="488" r="4.5" fill="#0284c7"/>
<text x="122" y="495" font-size="19" fill="#334155">Runtime: Owns isolated ports, processes, and memory sandbox</text>
<circle cx="106" cy="534" r="4.5" fill="#0284c7"/>
<text x="122" y="541" font-size="19" fill="#334155">Requirement: Native to HAOS and Supervised installs only</text>
<circle cx="106" cy="580" r="4.5" fill="#0284c7"/>
<text x="122" y="587" font-size="19" fill="#334155">Examples: Mosquitto MQTT Broker, Node-RED, File Editor</text>

<rect x="746" y="265" width="630" height="370" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="778" y="295" width="180" height="46" rx="10" fill="#059669"/>
<text x="868" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">Integration (Driver)</text>
<text x="778" y="380" font-size="26" fill="#0f172a" font-weight="600">In-House Resident Diplomat</text>
<line x1="778" y1="405" x2="1344" y2="405" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="788" cy="442" r="4.5" fill="#059669"/>
<text x="804" y="449" font-size="19" fill="#334155">Nature: Internal Python module running inside HA Core</text>
<circle cx="788" cy="488" r="4.5" fill="#059669"/>
<text x="804" y="495" font-size="19" fill="#334155">Runtime: Shares Core process; directly injects entities into states</text>
<circle cx="788" cy="534" r="4.5" fill="#059669"/>
<text x="804" y="541" font-size="19" fill="#334155">Requirement: Universal across all installs (HAOS, Docker, Core)</text>
<circle cx="788" cy="580" r="4.5" fill="#059669"/>
<text x="804" y="587" font-size="19" fill="#334155">Examples: Xiaomi Miot, Midea AC, HomeKit Bridge, MQTT Client</text>

<rect x="64" y="655" width="1312" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="96" y="703" font-size="20" fill="#1e40af" font-weight="600">Beginner Golden Rule:</text>
<text x="320" y="703" font-size="20" fill="#1e3a8a">To connect lights, ACs, and switches &#8594; Add an Integration. To run an MQTT server or web terminal &#8594; Install an Add-on!</text>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">Original Conceptual Deep-Dive · Add-ons vs. Integrations Explained · 2026-10-29</text>
<text x="1376" y="790" font-size="21" fill="#0284c7" font-weight="600" text-anchor="end">05</text>
</svg>