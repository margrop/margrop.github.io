<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="19" fill="#334155" font-weight="400">Entity: The temperature dial &amp; power switch</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="19" fill="#334155" font-weight="400">State: Current dial reading (e.g., 26°C, ON)</text>
<circle cx="996" cy="611" r="4.5" fill="#059669"/>
<text x="1012" y="618" font-size="19" fill="#334155" font-weight="400">Attributes: Specs tag (fan speed, power draw)</text>

