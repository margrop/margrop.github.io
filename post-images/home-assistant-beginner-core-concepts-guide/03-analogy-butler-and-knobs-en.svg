<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">ELEMENTARY SCHOOL METAPHOR / THE SMART MANSION</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">The Smart Mansion Metaphor: Demystifying Home Assistant Architecture</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">Grand Butler (Core), Diplomats (Integrations), Hardware (Device) &amp; Knobs (Entities)</text>

<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="160" height="46" rx="10" fill="#0284c7"/>
<text x="172" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">Grand Butler</text>
<text x="92" y="390" font-size="28" fill="#0f172a" font-weight="600">HA Core &amp; State Engine</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="19" fill="#334155" font-weight="400">Keeps the master ledger of all states</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="19" fill="#334155" font-weight="400">Event Bus: Listens to every whisper in house</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="19" fill="#334155" font-weight="400">Enforces house rules via automated actions</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="19" fill="#334155" font-weight="400">Never touches raw wires; only issues standard calls</text>

<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="160" height="46" rx="10" fill="#d97706"/>
<text x="620" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">The Diplomats</text>
<text x="540" y="390" font-size="28" fill="#0f172a" font-weight="600">Integrations Layer</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="19" fill="#334155" font-weight="400">Speaks vendor dialects: Xiaomi, Midea, Apple</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="19" fill="#334155" font-weight="400">Eliminates brand silos into universal schemas</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="19" fill="#334155" font-weight="400">Lives inside the main building (Python module)</text>
<circle cx="548" cy="611" r="4.5" fill="#d97706"/>
<text x="564" y="618" font-size="19" fill="#334155" font-weight="400">Wraps physical gadgets into controllable units</text>

<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="160" height="46" rx="10" fill="#059669"/>
<text x="1068" y="325" font-size="20" fill="white" font-weight="600" text-anchor="middle">Shell &amp; Knobs</text>
<text x="988" y="390" font-size="28" fill="#0f172a" font-weight="600">Device vs Entity</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
