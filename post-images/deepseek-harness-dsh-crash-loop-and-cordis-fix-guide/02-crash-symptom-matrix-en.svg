<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg2-en" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg2-en)"/>
  
  <rect x="64" y="56" width="360" height="38" rx="19" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)"/>
  <text x="88" y="81" fill="#f43f5e" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">DIAGNOSTIC MATRIX · 4 RECURRENT CRASHES</text>
  
  <text x="64" y="150" fill="#f9fafb" font-size="36" font-weight="900" font-family="DejaVu Sans, sans-serif">DeepSeek Harness Crash Matrix &amp; Failure Modes</text>
  <text x="64" y="196" fill="#9ca3af" font-size="19" font-family="DejaVu Sans, sans-serif">Why DSH Desktop crashes on startup, models fail to save, and Windows terminals freeze</text>
  
  <!-- 4 Quadrants -->
  <!-- Box 1 -->
  <rect x="64" y="240" width="630" height="260" rx="14" fill="#1f2937" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="96" cy="276" r="14" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="91" y="282" fill="#ef4444" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">1</text>
  <text x="124" y="282" fill="#f9fafb" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Desktop Startup Crash: Web authentication failed</text>
  <text x="88" y="324" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Symptom: After ~70 sessions, desktop app instantly fails with auth errors.</text>
  <text x="88" y="356" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Diagnosis: Disabling third-party plugins or reinstalling fails to recover.</text>
  <text x="88" y="388" fill="#9ca3af" font-size="14" font-family="DejaVu Sans, sans-serif">Root Cause: Electron net.fetch rejected by Node.js due to HTTP 431 Header overflow.</text>
  <rect x="88" y="420" width="580" height="52" rx="8" fill="#111827"/>
  <text x="104" y="452" fill="#f87171" font-size="13" font-family="DejaVu Sans Mono, monospace">Error: desktop welcome: Web authentication failed (net::ERR_FAILED 431)</text>

  <!-- Box 2 -->
  <rect x="746" y="240" width="630" height="260" rx="14" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="778" cy="276" r="14" fill="rgba(245, 158, 11, 0.2)"/>
  <text x="773" y="282" fill="#f59e0b" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">2</text>
  <text x="806" y="282" fill="#f9fafb" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Settings Model Exception: next is not a function</text>
  <text x="770" y="324" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Symptom: Clicking Save under Settings → Models → Create Provider crashes.</text>
  <text x="770" y="356" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Diagnosis: Blocked across official DeepSeek API and custom endpoints.</text>
  <text x="770" y="388" fill="#9ca3af" font-size="14" font-family="DejaVu Sans, sans-serif">Root Cause: Cordis waterfall middleware signature mismatch missing valid next().</text>
  <rect x="770" y="420" width="580" height="52" rx="8" fill="#111827"/>
  <text x="786" y="452" fill="#fbbf24" font-size="13" font-family="DejaVu Sans Mono, monospace">TypeError: next is not a function at Object.dispatch (cordis/waterfall.ts:48)</text>

  <!-- Box 3 -->
  <rect x="64" y="530" width="630" height="260" rx="14" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="96" cy="566" r="14" fill="rgba(59, 130, 246, 0.2)"/>
  <text x="91" y="572" fill="#3b82f6" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">3</text>
  <text x="124" y="572" fill="#f9fafb" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Windows Terminal Spam: whoami: extra operand '/user'</text>
  <text x="88" y="614" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Symptom: Running dsh web on Windows repeatedly outputs whoami errors.</text>
  <text x="88" y="646" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Diagnosis: Environment identity check fails, causing agent retry loops.</text>
  <text x="88" y="678" fill="#9ca3af" font-size="14" font-family="DejaVu Sans, sans-serif">Root Cause: Git for Windows GNU coreutils precedes System32 in PATH.</text>
  <rect x="88" y="710" width="580" height="52" rx="8" fill="#111827"/>
  <text x="104" y="742" fill="#60a5fa" font-size="13" font-family="DejaVu Sans Mono, monospace">whoami: extra operand '/user' (GNU Coreutils collision in PATH)</text>

  <!-- Box 4 -->
  <rect x="746" y="530" width="630" height="260" rx="14" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="778" cy="566" r="14" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="773" y="572" fill="#10b981" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">4</text>
  <text x="806" y="572" fill="#f9fafb" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Headless CLI Silent Hangs with Orphan Zombies</text>
  <text x="770" y="614" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Symptom: Running dsh --profile open-design hangs with zero output.</text>
  <text x="770" y="646" fill="#d1d5db" font-size="14" font-family="DejaVu Sans, sans-serif">Diagnosis: Orphan background Node.js processes consume 100% CPU core.</text>
  <text x="770" y="678" fill="#9ca3af" font-size="14" font-family="DejaVu Sans, sans-serif">Root Cause: Internal profiles require Electron IPC without CLI fallback guard.</text>
  <rect x="770" y="710" width="580" height="52" rx="8" fill="#111827"/>
  <text x="786" y="742" fill="#34d399" font-size="13" font-family="DejaVu Sans Mono, monospace">Process hangs waiting for Electron window.cordisBridge (No timeout)</text>
</svg>