<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg11-en" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg11-en)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)"/>
  <text x="88" y="81" fill="#f43f5e" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">ROOT CAUSE TIMELINE</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="36" font-weight="900" font-family="DejaVu Sans, sans-serif">The HTTP 431 Time Bomb: Failure Cascade from Launch 1 to 71</text>
  <text x="64" y="192" fill="#94a3b8" font-size="19" font-family="DejaVu Sans, sans-serif">How Electron net.fetch, SQLite accumulation, and Node.js 16KB header cap collided</text>
  
  <!-- Flow Steps -->
  <rect x="64" y="240" width="290" height="420" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="96" cy="276" r="14" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="91" y="282" fill="#38bdf8" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">1</text>
  <text x="124" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Ephemeral Port Boot</text>
  <text x="88" y="324" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· On every launch, Node host binds to a random loopback port</text>
  <text x="88" y="374" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Generates a fresh auth cookie with timestamp</text>
  <rect x="88" y="420" width="242" height="60" rx="8" fill="#111827"/>
  <text x="100" y="456" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono, monospace">Set-Cookie: dsh-auth-ts=...</text>
  <text x="88" y="520" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Flaw: Max-Age=30 days without expiration cleanup</text>

  <rect x="396" y="240" width="290" height="420" rx="14" fill="#1f2937" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="428" cy="276" r="14" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="423" y="282" fill="#fbbf24" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">2</text>
  <text x="456" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Chromium SQLite DB</text>
  <text x="420" y="324" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Chromium stores cookies in local SQLite database</text>
  <text x="420" y="374" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Faithfully appends new tokens under localhost domain</text>
  <rect x="420" y="420" width="242" height="60" rx="8" fill="#111827"/>
  <text x="432" y="456" fill="#fbbf24" font-size="12" font-family="DejaVu Sans Mono, monospace">Network/Cookies (SQLite)</text>
  <text x="420" y="520" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">70 launches accumulate 70+ cookies, reaching ~16KB</text>

  <rect x="728" y="240" width="290" height="420" rx="14" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="760" cy="276" r="14" fill="rgba(249, 115, 22, 0.2)"/>
  <text x="755" y="282" fill="#f97316" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">3</text>
  <text x="788" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">net.fetch Blowout</text>
  <text x="752" y="324" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· 71st launch executes connectDesktopWelcome</text>
  <text x="752" y="374" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Sends entire cookie collection to loopback host</text>
  <rect x="752" y="420" width="242" height="60" rx="8" fill="#111827"/>
  <text x="764" y="456" fill="#f97316" font-size="12" font-family="DejaVu Sans Mono, monospace">Cookie: size = 16,842 B</text>
  <text x="752" y="520" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Header breaches Node.js default 16,384 bytes threshold</text>

  <rect x="1060" y="240" width="316" height="420" rx="14" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
  <circle cx="1092" cy="276" r="14" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="1087" y="282" fill="#ef4444" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">4</text>
  <text x="1120" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">HTTP 431 Lockup</text>
  <text x="1084" y="324" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Node.js parser drops incoming request immediately</text>
  <text x="1084" y="374" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Responds with HTTP 431 Fields Too Large</text>
  <rect x="1084" y="420" width="268" height="60" rx="8" fill="#111827"/>
  <text x="1096" y="456" fill="#ef4444" font-size="12" font-family="DejaVu Sans Mono, monospace">Web authentication failed</text>
  <text x="1084" y="520" fill="#f87171" font-size="14" font-family="DejaVu Sans, sans-serif">Electron misinterprets as auth failure and crashes</text>

  <!-- Bottom Banner -->
  <rect x="64" y="690" width="1312" height="114" rx="12" fill="rgba(31, 41, 55, 0.8)" stroke="#374151"/>
  <text x="96" y="730" fill="#f9fafb" font-size="17" font-weight="bold" font-family="DejaVu Sans, sans-serif">Why does reinstalling the app fail?</text>
  <text x="96" y="760" fill="#9ca3af" font-size="15" font-family="DejaVu Sans, sans-serif">Uninstalling only replaces application binaries, leaving SQLite Cookies files intact inside Application Support / AppData!</text>
  <text x="96" y="786" fill="#38bdf8" font-size="15" font-family="DejaVu Sans, sans-serif">Permanent Remedy: Purge stale cookies with the automated script and set NODE_OPTIONS="--max-http-header-size=65536".</text>
</svg>