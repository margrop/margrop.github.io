<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3-en" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3-en)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)"/>
  <text x="88" y="81" fill="#c084fc" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">EVERYDAY METAPHOR · INTUITIVE BREAKDOWN</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="36" font-weight="900" font-family="DejaVu Sans, sans-serif">The Wristband Hoarder vs The Choked Security Gate</text>
  <text x="64" y="192" fill="#94a3b8" font-size="19" font-family="DejaVu Sans, sans-serif">Why DeepSeek Harness suddenly crashes with HTTP 431 on its 71st launch</text>
  
  <!-- 3 Stages -->
  <!-- Stage 1 -->
  <rect x="64" y="240" width="410" height="460" rx="16" fill="rgba(30, 27, 75, 0.7)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="88" y="264" width="150" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="100" y="283" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans, sans-serif">Day 1 · Instant Pass</text>
  <text x="88" y="330" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Single Slim Wristband</text>
  <text x="88" y="364" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">DSH First Launch</text>
  <line x1="88" y1="384" x2="450" y2="384" stroke="#4338ca"/>
  <text x="88" y="420" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· 1 valid wristband with 30-day expiry</text>
  <text x="88" y="456" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Scanner thickness: 1 mm</text>
  <text x="88" y="492" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Green light flashed in 0.05 seconds</text>
  <text x="88" y="528" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Cookie header: ~240 Bytes (&lt;&lt; 16 KB)</text>
  <rect x="88" y="590" width="362" height="74" rx="10" fill="#0f172a"/>
  <text x="104" y="622" fill="#38bdf8" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Status: 200 OK</text>
  <text x="104" y="648" fill="#22c55e" font-size="13" font-family="DejaVu Sans, sans-serif">✓ Handshake successful, instant load</text>

  <!-- Stage 2 -->
  <rect x="514" y="240" width="410" height="460" rx="16" fill="rgba(30, 27, 75, 0.7)" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="538" y="264" width="150" height="28" rx="6" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="550" y="283" fill="#fbbf24" font-size="13" font-weight="bold" font-family="DejaVu Sans, sans-serif">Day 30 · Getting Heavy</text>
  <text x="538" y="330" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Wristbands Accumulating</text>
  <text x="538" y="364" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Heavy usage for one week</text>
  <line x1="538" y1="384" x2="900" y2="384" stroke="#4338ca"/>
  <text x="538" y="420" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Stale wristbands never pruned</text>
  <text x="538" y="456" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· 30 different bands stacked on arm</text>
  <text x="538" y="492" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Scanner takes 800ms to verify all</text>
  <text x="538" y="528" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Cookie header: ~7.2 KB (Getting close)</text>
  <rect x="538" y="590" width="362" height="74" rx="10" fill="#0f172a"/>
  <text x="554" y="622" fill="#fbbf24" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Status: 200 OK (Slow)</text>
  <text x="554" y="648" fill="#eab308" font-size="13" font-family="DejaVu Sans, sans-serif">⚠ Handshake latency creeps up</text>

  <!-- Stage 3 -->
  <rect x="964" y="240" width="410" height="460" rx="16" fill="rgba(30, 27, 75, 0.7)" stroke="#f43f5e" stroke-width="2"/>
  <rect x="988" y="264" width="150" height="28" rx="6" fill="rgba(244, 63, 94, 0.2)"/>
  <text x="1000" y="283" fill="#f43f5e" font-size="13" font-weight="bold" font-family="DejaVu Sans, sans-serif">Day 71 · Fatal Crash</text>
  <text x="988" y="330" fill="#f8fafc" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">The Gate Chokes &amp; Alarms!</text>
  <text x="988" y="364" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">The 71st Launch Lockup</text>
  <line x1="988" y1="384" x2="1350" y2="384" stroke="#4338ca"/>
  <text x="988" y="420" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Arm wider than the gate scanner (16 KB)</text>
  <text x="988" y="456" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Node.js rejects request with 431</text>
  <text x="988" y="492" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Guard screams 'Web authentication failed'</text>
  <text x="988" y="528" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Entire app locks up permanently</text>
  <rect x="988" y="590" width="362" height="74" rx="10" fill="#0f172a"/>
  <text x="1004" y="622" fill="#f43f5e" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">HTTP 431 Fields Too Large</text>
  <text x="1004" y="648" fill="#ef4444" font-size="13" font-family="DejaVu Sans, sans-serif">❌ Handshake fails, permanent crash screen</text>

  <!-- Summary Banner -->
  <rect x="64" y="730" width="1312" height="74" rx="12" fill="rgba(49, 46, 129, 0.4)" stroke="#4338ca"/>
  <text x="96" y="774" fill="#c7d2fe" font-size="16" font-family="DejaVu Sans, sans-serif">Key Takeaway: The ticket is valid, but stale wristbands blocked the door! Fix: Snip old bands (clear Cookies DB) or widen the gate (--max-http-header-size).</text>
</svg>