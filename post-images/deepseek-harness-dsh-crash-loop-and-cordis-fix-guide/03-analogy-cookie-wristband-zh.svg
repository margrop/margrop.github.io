<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg3)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.4)"/>
  <text x="88" y="81" fill="#c084fc" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">LIFE ANALOGY · 小学生秒懂的通俗大比方</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="38" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">游乐园门禁手环收集狂 vs 卡壳的安检门</text>
  <text x="64" y="192" fill="#94a3b8" font-size="20" font-family="Noto Sans CJK SC, sans-serif">生动讲透为什么 DeepSeek Harness 会在第 71 次启动时突然因 HTTP 431 暴毙成砖</text>
  
  <!-- 3 Stages -->
  <!-- Stage 1 -->
  <rect x="64" y="240" width="410" height="460" rx="16" fill="rgba(30, 27, 75, 0.7)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="88" y="264" width="130" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="100" y="283" fill="#38bdf8" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">第 1 次入园 · 畅通</text>
  <text x="88" y="330" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">单条手环轻巧秒过</text>
  <text x="88" y="364" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【现实】DSH 首次启动</text>
  <line x1="88" y1="384" x2="450" y2="384" stroke="#4338ca"/>
  <text x="88" y="420" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 游客手腕戴 1 条 30 天防伪手环</text>
  <text x="88" y="456" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 安检门红外扫描厚度：仅 1 毫米</text>
  <text x="88" y="492" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 安检员瞬间放行，绿灯秒亮</text>
  <text x="88" y="528" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 相当于 Cookie Header: 240 字节</text>
  <rect x="88" y="590" width="362" height="74" rx="10" fill="#0f172a"/>
  <text x="104" y="622" fill="#38bdf8" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Status: 200 OK</text>
  <text x="104" y="648" fill="#22c55e" font-size="13" font-family="Noto Sans CJK SC, sans-serif">✓ 握手成功，桌面端秒开</text>

  <!-- Stage 2 -->
  <rect x="514" y="240" width="410" height="460" rx="16" fill="rgba(30, 27, 75, 0.7)" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="538" y="264" width="130" height="28" rx="6" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="550" y="283" fill="#fbbf24" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">第 30 次入园 · 臃肿</text>
  <text x="538" y="330" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">手环成串，扫描变慢</text>
  <text x="538" y="364" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【现实】高强度使用一周</text>
  <line x1="538" y1="384" x2="900" y2="384" stroke="#4338ca"/>
  <text x="538" y="420" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 游乐园规定旧手环不准摘下</text>
  <text x="538" y="456" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 手腕上套满 30 条不同手环</text>
  <text x="538" y="492" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 安检员要一条条全部核对一遍</text>
  <text x="538" y="528" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 相当于 Cookie Header: 7.2 KB</text>
  <rect x="538" y="590" width="362" height="74" rx="10" fill="#0f172a"/>
  <text x="554" y="622" fill="#fbbf24" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">Status: 200 OK (Slow)</text>
  <text x="554" y="648" fill="#eab308" font-size="13" font-family="Noto Sans CJK SC, sans-serif">⚠ 握手延迟攀升至 800ms，隐患加剧</text>

  <!-- Stage 3 -->
  <rect x="964" y="240" width="410" height="460" rx="16" fill="rgba(30, 27, 75, 0.7)" stroke="#f43f5e" stroke-width="2"/>
  <rect x="988" y="264" width="130" height="28" rx="6" fill="rgba(244, 63, 94, 0.2)"/>
  <text x="1000" y="283" fill="#f43f5e" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">第 71 次入园 · 暴毙</text>
  <text x="988" y="330" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">手环卡死安检门！</text>
  <text x="988" y="364" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【现实】第 71 次启动崩溃</text>
  <line x1="988" y1="384" x2="1350" y2="384" stroke="#4338ca"/>
  <text x="988" y="420" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 胳膊套满 71 条手环，比大门还粗</text>
  <text x="988" y="456" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 安检门红外限宽标尺（16KB）爆表</text>
  <text x="988" y="492" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 机器直接拉响防恐警报拒检死机</text>
  <text x="988" y="528" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 保安大喊“门禁认证失败”赶人</text>
  <rect x="988" y="590" width="362" height="74" rx="10" fill="#0f172a"/>
  <text x="1004" y="622" fill="#f43f5e" font-size="15" font-weight="bold" font-family="DejaVu Sans Mono, monospace">HTTP 431 Fields Too Large</text>
  <text x="1004" y="648" fill="#ef4444" font-size="13" font-family="Noto Sans CJK SC, sans-serif">❌ 握手断开，弹出 Web authentication failed</text>

  <!-- Summary Banner -->
  <rect x="64" y="730" width="1312" height="74" rx="12" fill="rgba(49, 46, 129, 0.4)" stroke="#4338ca"/>
  <text x="96" y="774" fill="#c7d2fe" font-size="16" font-family="Noto Sans CJK SC, sans-serif">核心道理：不是门票过期，而是你带的“旧手环”堆得比安检门还宽！解法是剪掉旧手环（清空 SQLite Cookies）或把门拓宽（--max-http-header-size）。</text>
</svg>