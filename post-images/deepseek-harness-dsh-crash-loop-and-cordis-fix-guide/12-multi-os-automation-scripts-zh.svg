<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg12" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg12)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.4)"/>
  <text x="88" y="81" fill="#34d399" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">CROSS-PLATFORM TOOLKIT · 三大系统一键脚本</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="38" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">DeepSeek Harness 零依赖全自动跨平台抢救脚本</text>
  <text x="64" y="192" fill="#a7f3d0" font-size="20" font-family="Noto Sans CJK SC, sans-serif">针对 Windows 11、Ubuntu 26.04、macOS 27 的开箱即用救砖工具（支持人工交互与 Agent JSON 双模）</text>
  
  <!-- 3 OS Cards -->
  <!-- Windows 11 -->
  <rect x="64" y="240" width="410" height="460" rx="16" fill="rgba(6, 78, 59, 0.7)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="88" y="264" width="130" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="100" y="283" fill="#38bdf8" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Windows 11</text>
  <text x="88" y="330" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">PowerShell 自动化</text>
  <text x="88" y="364" fill="#a7f3d0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">原生修复 whoami 冲突与 AppData Cookies</text>
  <line x1="88" y1="384" x2="450" y2="384" stroke="#047857"/>
  <text x="88" y="420" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 杀死假死 dsh-desktop 孤儿进程</text>
  <text x="88" y="456" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 备份并清空 %APPDATA% Cookies 库</text>
  <text x="88" y="492" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 修正 System32 与 Git whoami 优先级</text>
  <text x="88" y="528" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 写入用户级 NODE_OPTIONS 免疫防线</text>
  <rect x="88" y="580" width="362" height="84" rx="10" fill="#022c22"/>
  <text x="104" y="612" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono, monospace"># 人工交互执行</text>
  <text x="104" y="632" fill="#f8fafc" font-size="12" font-family="DejaVu Sans Mono, monospace">.\deepseek_harness_fix_windows11.ps1</text>
  <text x="104" y="652" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">.\deepseek_harness_fix_windows11.ps1 -Json</text>

  <!-- Ubuntu 26.04 -->
  <rect x="514" y="240" width="410" height="460" rx="16" fill="rgba(6, 78, 59, 0.7)" stroke="#fb923c" stroke-width="1.5"/>
  <rect x="538" y="264" width="130" height="28" rx="6" fill="rgba(251, 146, 60, 0.2)"/>
  <text x="550" y="283" fill="#fb923c" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Ubuntu 26.04</text>
  <text x="538" y="330" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Bash 生产级脚本</text>
  <text x="538" y="364" fill="#a7f3d0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">兼容 Linux 标准 XDG 路径与 CI 管道</text>
  <line x1="538" y1="384" x2="900" y2="384" stroke="#047857"/>
  <text x="538" y="420" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 安全扫描并终止 pgrep -f dsh</text>
  <text x="538" y="456" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 清理 ~/.config 臃肿 Cookies 存储</text>
  <text x="538" y="492" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 注入 ~/.bashrc 头部防御环境变量</text>
  <text x="538" y="528" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 自动修补 cordis.patch.yml 解决 next 缺陷</text>
  <rect x="538" y="580" width="362" height="84" rx="10" fill="#022c22"/>
  <text x="554" y="612" fill="#fb923c" font-size="12" font-family="DejaVu Sans Mono, monospace"># 人工交互执行</text>
  <text x="554" y="632" fill="#f8fafc" font-size="12" font-family="DejaVu Sans Mono, monospace">bash deepseek_harness_fix_ubuntu2604.sh</text>
  <text x="554" y="652" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">bash deepseek_harness_fix_ubuntu2604.sh --json</text>

  <!-- macOS 27 -->
  <rect x="964" y="240" width="410" height="460" rx="16" fill="rgba(6, 78, 59, 0.7)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="988" y="264" width="130" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="1000" y="283" fill="#c084fc" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">macOS 27</text>
  <text x="988" y="330" fill="#f8fafc" font-size="22" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Zsh 原生工具包</text>
  <text x="988" y="364" fill="#a7f3d0" font-size="14" font-family="Noto Sans CJK SC, sans-serif">针对 Darwin Application Support 精准清理</text>
  <line x1="988" y1="384" x2="1350" y2="384" stroke="#047857"/>
  <text x="988" y="420" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· killall 清理僵死 Electron 桌面宿主</text>
  <text x="988" y="456" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 规整 Library/Application Support 数据库</text>
  <text x="988" y="492" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 永久固化 ~/.zshrc 环境防护开关</text>
  <text x="988" y="528" fill="#e2e8f0" font-size="15" font-family="Noto Sans CJK SC, sans-serif">· 落地官方 DeepSeek API 端点模板</text>
  <rect x="988" y="580" width="362" height="84" rx="10" fill="#022c22"/>
  <text x="1004" y="612" fill="#c084fc" font-size="12" font-family="DejaVu Sans Mono, monospace"># 人工交互执行</text>
  <text x="1004" y="632" fill="#f8fafc" font-size="12" font-family="DejaVu Sans Mono, monospace">zsh deepseek_harness_fix_macos27.zsh</text>
  <text x="1004" y="652" fill="#34d399" font-size="12" font-family="DejaVu Sans Mono, monospace">zsh deepseek_harness_fix_macos27.zsh --json</text>

  <!-- Bottom Banner -->
  <rect x="64" y="730" width="1312" height="74" rx="12" fill="rgba(4, 120, 87, 0.3)" stroke="#047857"/>
  <text x="96" y="774" fill="#a7f3d0" font-size="16" font-family="Noto Sans CJK SC, sans-serif">双模运行保障：人工执行时提供友好彩色高亮交互与步骤确认；Agent 调用时通过 --json 输出纯粹结构化结果，无缝接入自动化运维闭环。</text>
</svg>