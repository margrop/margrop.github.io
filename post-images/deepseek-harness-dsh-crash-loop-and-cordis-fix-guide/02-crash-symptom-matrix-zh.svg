<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg2)"/>
  
  <rect x="64" y="56" width="360" height="38" rx="19" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)"/>
  <text x="88" y="81" fill="#f43f5e" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">DIAGNOSTIC MATRIX · 四大真实故障表现矩阵</text>
  
  <text x="64" y="150" fill="#f9fafb" font-size="38" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">DeepSeek Harness 社区高频踩坑全景图</text>
  <text x="64" y="196" fill="#9ca3af" font-size="20" font-family="Noto Sans CJK SC, sans-serif">为什么好端端跑了几天，桌面端突然秒退、模型配置报错、Windows 终端疯刷异常？</text>
  
  <!-- 4 Quadrants -->
  <!-- Box 1 -->
  <rect x="64" y="240" width="630" height="260" rx="14" fill="#1f2937" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="96" cy="276" r="14" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="91" y="282" fill="#ef4444" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">1</text>
  <text x="124" y="282" fill="#f9fafb" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">桌面端启动秒退死锁：Web authentication failed</text>
  <text x="88" y="324" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【现象】使用了大约 70+ 次后，桌面客户端突然无法启动，无限弹出鉴权失败。</text>
  <text x="88" y="356" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【排查】即使勾选“禁用第三方插件”或重新安装软件，也无法恢复正常。</text>
  <text x="88" y="388" fill="#9ca3af" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【本质】Electron net.fetch 握手被 Node.js 拦截，返回 HTTP 431 Header 溢出。</text>
  <rect x="88" y="420" width="580" height="52" rx="8" fill="#111827"/>
  <text x="104" y="452" fill="#f87171" font-size="13" font-family="DejaVu Sans Mono, monospace">Error: desktop welcome: Web authentication failed (net::ERR_FAILED 431)</text>

  <!-- Box 2 -->
  <rect x="746" y="240" width="630" height="260" rx="14" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="778" cy="276" r="14" fill="rgba(245, 158, 11, 0.2)"/>
  <text x="773" y="282" fill="#f59e0b" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">2</text>
  <text x="806" y="282" fill="#f9fafb" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">设置模型配置崩溃：next is not a function</text>
  <text x="770" y="324" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【现象】在 Settings → Models → Create Provider 保存模型时直接抛错阻断。</text>
  <text x="770" y="356" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【排查】无论是添加官方 DeepSeek API 还是自定义 OpenAI 兼容端点均无法保存。</text>
  <text x="770" y="388" fill="#9ca3af" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【本质】Cordis 事件瀑布流中间件签名重构疏漏，回调未能正确传递 next()。</text>
  <rect x="770" y="420" width="580" height="52" rx="8" fill="#111827"/>
  <text x="786" y="452" fill="#fbbf24" font-size="13" font-family="DejaVu Sans Mono, monospace">TypeError: next is not a function at Object.dispatch (cordis/waterfall.ts:48)</text>

  <!-- Box 3 -->
  <rect x="64" y="530" width="630" height="260" rx="14" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="96" cy="566" r="14" fill="rgba(59, 130, 246, 0.2)"/>
  <text x="91" y="572" fill="#3b82f6" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">3</text>
  <text x="124" y="572" fill="#f9fafb" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Windows 终端刷屏：whoami: extra operand '/user'</text>
  <text x="88" y="614" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【现象】在 Windows PowerShell / CMD 执行 dsh web 时终端被疯狂刷屏报错。</text>
  <text x="88" y="646" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【排查】Agent 检测用户权限失败，陷入重试死循环或权限识别异常。</text>
  <text x="88" y="678" fill="#9ca3af" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【本质】Git 安装自带的 Linux GNU whoami 覆盖了 Windows 原生 System32 whoami。</text>
  <rect x="88" y="710" width="580" height="52" rx="8" fill="#111827"/>
  <text x="104" y="742" fill="#60a5fa" font-size="13" font-family="DejaVu Sans Mono, monospace">whoami: extra operand '/user' (GNU Coreutils collision in PATH)</text>

  <!-- Box 4 -->
  <rect x="746" y="530" width="630" height="260" rx="14" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="778" cy="566" r="14" fill="rgba(16, 185, 129, 0.2)"/>
  <text x="773" y="572" fill="#10b981" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">4</text>
  <text x="806" y="572" fill="#f9fafb" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">无头 CLI 与特化 Profile 静默卡死假死</text>
  <text x="770" y="614" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【现象】终端调用 dsh --profile open-design 或 desktop 无任何输出无限挂起。</text>
  <text x="770" y="646" fill="#d1d5db" font-size="15" font-family="Noto Sans CJK SC, sans-serif">【排查】后台生成孤儿 Node.js 进程持续消耗单核 CPU 100%。</text>
  <text x="770" y="678" fill="#9ca3af" font-size="14" font-family="Noto Sans CJK SC, sans-serif">【本质】内部特化 Profile 强依赖 Electron IPC 通道，缺少终端降级保护。</text>
  <rect x="770" y="710" width="580" height="52" rx="8" fill="#111827"/>
  <text x="786" y="742" fill="#34d399" font-size="13" font-family="DejaVu Sans Mono, monospace">Process hangs waiting for Electron window.cordisBridge (No timeout)</text>
</svg>