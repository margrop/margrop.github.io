<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <circle cx="1250" cy="160" r="300" fill="rgba(56, 189, 248, 0.06)"/>
  <circle cx="180" cy="700" r="320" fill="rgba(251, 113, 133, 0.05)"/>
  
  <!-- Badge -->
  <rect x="64" y="56" width="410" height="40" rx="20" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="82" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">DEEPSEEK HARNESS (DSH) · 生产级避坑深度实测</text>
  
  <!-- Main Title -->
  <text x="64" y="156" fill="#f8fafc" font-size="42" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">DeepSeek Harness 刚封神就翻车？</text>
  <text x="64" y="214" fill="#94a3b8" font-size="23" font-family="Noto Sans CJK SC, sans-serif">实测 dsh 桌面端秒退与 Cordis 架构深坑：扒开 HTTP 431 隐形炸弹与跨平台救砖指南</text>
  
  <!-- 4 Cards -->
  <!-- Card 1: DSH Core -->
  <rect x="64" y="270" width="300" height="420" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="88" y="294" width="96" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="100" y="313" fill="#38bdf8" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Agent 运行时</text>
  <text x="88" y="360" fill="#f8fafc" font-size="26" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">DSH Runtime</text>
  <text x="88" y="394" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">DeepSeek 官方开源 Harness</text>
  <text x="88" y="420" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">连接代码库与自主工具调用</text>
  <line x1="88" y1="448" x2="340" y2="448" stroke="#334155"/>
  <text x="88" y="480" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 驱动 V3 / R1 / V4 Pro 模型</text>
  <text x="88" y="512" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 支持 Web/Desktop/Headless</text>
  <text x="88" y="544" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 深度对齐 Claude Code 生态</text>
  <rect x="88" y="608" width="252" height="52" rx="8" fill="#1e293b"/>
  <text x="104" y="640" fill="#38bdf8" font-size="14" font-family="DejaVu Sans Mono, monospace">npx @deepseek-ai/dsh web</text>

  <!-- Card 2: Cordis Microkernel -->
  <rect x="396" y="270" width="300" height="420" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="2"/>
  <rect x="420" y="294" width="96" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)"/>
  <text x="432" y="313" fill="#c084fc" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">微内核基座</text>
  <text x="420" y="360" fill="#f8fafc" font-size="26" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Cordis Kernel</text>
