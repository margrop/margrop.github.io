  <text x="420" y="420" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">时空可组合性与依赖注入</text>
  <line x1="420" y1="448" x2="672" y2="448" stroke="#334155"/>
  <text x="420" y="480" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 动态加载与干净卸载</text>
  <text x="420" y="512" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 循环机制彻底解耦插件化</text>
  <text x="420" y="544" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 事件瀑布流控制中间件</text>
  <rect x="420" y="608" width="252" height="52" rx="8" fill="#1e293b"/>
  <text x="436" y="640" fill="#c084fc" font-size="14" font-family="DejaVu Sans Mono, monospace">cordis.patch.yml</text>

  <!-- Card 3: HTTP 431 Death Loop -->
  <rect x="728" y="270" width="300" height="420" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#fb7185" stroke-width="2"/>
  <rect x="752" y="294" width="96" height="28" rx="6" fill="rgba(251, 113, 133, 0.2)"/>
  <text x="764" y="313" fill="#fb7185" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">隐形炸弹</text>
  <text x="752" y="360" fill="#f8fafc" font-size="26" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">HTTP 431 崩溃</text>
  <text x="752" y="394" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">第 71 次启动必定死锁变砖</text>
  <text x="752" y="420" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">Web authentication failed</text>
  <line x1="752" y1="448" x2="1004" y2="448" stroke="#334155"/>
  <text x="752" y="480" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Cookie 累积膨胀突破 16KB</text>
  <text x="752" y="512" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Node.js 默认头上限拦截</text>
  <text x="752" y="544" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 重启/重装无法清除 SQLite</text>
  <rect x="752" y="608" width="252" height="52" rx="8" fill="#1e293b"/>
  <text x="768" y="640" fill="#fb7185" font-size="14" font-family="DejaVu Sans Mono, monospace">net.fetch 431 Header</text>

  <!-- Card 4: Multi-OS Automation -->
  <rect x="1060" y="270" width="316" height="420" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-width="2"/>
  <rect x="1084" y="294" width="96" height="28" rx="6" fill="rgba(52, 211, 153, 0.2)"/>
  <text x="1096" y="313" fill="#34d399" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">跨平台救砖</text>
  <text x="1084" y="360" fill="#f8fafc" font-size="26" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">一键全自动修复</text>
  <text x="1084" y="394" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">三大操作系统零依赖脚本</text>
  <text x="1084" y="420" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">支持人工交互与 Agent JSON</text>
  <line x1="1084" y1="448" x2="1352" y2="448" stroke="#334155"/>
  <text x="1084" y="480" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Windows 11 PowerShell</text>
  <text x="1084" y="512" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Ubuntu 26.04 Bash</text>
  <text x="1084" y="544" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· macOS 27 Zsh</text>
  <rect x="1084" y="608" width="268" height="52" rx="8" fill="#1e293b"/>
  <text x="1100" y="640" fill="#34d399" font-size="14" font-family="DejaVu Sans Mono, monospace">bash fix_ubuntu2604.sh</text>
  
  <!-- Footer Note -->
  <rect x="64" y="730" width="1312" height="74" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="#334155"/>
  <text x="96" y="774" fill="#94a3b8" font-size="16" font-family="Noto Sans CJK SC, sans-serif">深度解构：游乐园门禁大比方 · Cordis 中间件瀑布流 next() 缺陷 · Windows whoami 环境变量冲突 · 生产级防崩护栏</text>
</svg>