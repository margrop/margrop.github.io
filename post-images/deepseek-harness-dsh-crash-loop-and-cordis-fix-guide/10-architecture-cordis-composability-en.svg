<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg10-en" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg10-en)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="81" fill="#38bdf8" font-size="15" font-weight="bold" font-family="DejaVu Sans, sans-serif">ARCHITECTURE DEEP DIVE</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="36" font-weight="900" font-family="DejaVu Sans, sans-serif">Cordis Microkernel &amp; Spatiotemporal Composability</text>
  <text x="64" y="192" fill="#94a3b8" font-size="19" font-family="DejaVu Sans, sans-serif">Why DeepSeek Harness is built on 'Everything is a Plugin' and where fragility creeps in</text>
  
  <!-- Central Microkernel -->
  <rect x="520" y="250" width="400" height="180" rx="20" fill="rgba(30, 41, 59, 0.9)" stroke="#38bdf8" stroke-width="3"/>
  <rect x="550" y="274" width="140" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="562" y="293" fill="#38bdf8" font-size="13" font-weight="bold" font-family="DejaVu Sans, sans-serif">CORDIS KERNEL</text>
  <text x="550" y="340" fill="#f8fafc" font-size="24" font-weight="bold" font-family="DejaVu Sans, sans-serif">Cordis Clean Microkernel</text>
  <text x="550" y="374" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Carries no domain business logic</text>
  <text x="550" y="402" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Lifecycle orchestrator, Event bus &amp; Effect tracker</text>

  <!-- Surrounding Satellite Plugins -->
  <rect x="64" y="240" width="380" height="150" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="88" y="276" fill="#c084fc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Execution Loop Plugin (@dsh/loop)</text>
  <text x="88" y="310" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Drives agent thought &amp; tool call step loop</text>
  <text x="88" y="338" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Hot-swappable to SuperAgent multi-agent DAG</text>
  <text x="88" y="366" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">Zero lingering state left when detached</text>

  <rect x="64" y="440" width="380" height="150" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="476" fill="#38bdf8" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Model Adapters (@dsh/adapter-*)</text>
  <text x="88" y="510" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· DeepSeek native prefix caching optimization</text>
  <text x="88" y="538" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· OpenAI / Anthropic compatible endpoints</text>
  <text x="88" y="566" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">Waterfall middleware for streaming tokens</text>

  <rect x="996" y="240" width="380" height="150" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1020" y="276" fill="#34d399" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Tooling Plugins (dsh-tool-*)</text>
  <text x="1020" y="310" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Shell execution, Ripgrep search, File ops</text>
  <text x="1020" y="338" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Terminal sandbox isolation &amp; whoami checks</text>
  <text x="1020" y="366" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">Dynamic dependency injection on demand</text>

  <rect x="996" y="440" width="380" height="150" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1020" y="476" fill="#fbbf24" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">Session Logs &amp; Surfaces (@dsh/web)</text>
  <text x="1020" y="510" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Event-sourced audit trails, fully replayable</text>
  <text x="1020" y="538" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">· Electron desktop app &amp; Web console surfaces</text>
  <text x="1020" y="566" fill="#94a3b8" font-size="13" font-family="DejaVu Sans, sans-serif">Where the cookie accumulation bug lived</text>

  <line x1="444" y1="315" x2="520" y2="340" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="444" y1="515" x2="520" y2="340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="920" y1="340" x2="996" y2="315" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="920" y1="340" x2="996" y2="515" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom Concept Card -->
  <rect x="64" y="640" width="1312" height="160" rx="14" fill="#111827" stroke="#334155"/>
  <text x="96" y="680" fill="#f8fafc" font-size="18" font-weight="bold" font-family="DejaVu Sans, sans-serif">The Double-Edged Sword of Spatiotemporal Composability:</text>
  <text x="96" y="716" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">1. Spatial Composability: Explicit injection (ctx.inject). Plugins sleep safely until declared dependencies are met.</text>
  <text x="96" y="746" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">2. Temporal Composability: Effect Disposables. Unloading a plugin cleanly tears down event listeners without memory leaks.</text>
  <text x="96" y="776" fill="#f87171" font-size="14" font-family="DejaVu Sans, sans-serif">3. Engineering Tradeoff: High flexibility in middleware waterfalls requires strict signature guards and clean cookie lifecycle management.</text>
</svg>