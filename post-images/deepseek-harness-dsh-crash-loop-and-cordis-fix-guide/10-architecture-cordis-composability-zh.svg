<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg10)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="88" y="81" fill="#38bdf8" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">ARCHITECTURE DEEP DIVE · 架构核心全解</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="38" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">Cordis 微内核与时空可组合性哲学</text>
  <text x="64" y="192" fill="#94a3b8" font-size="20" font-family="Noto Sans CJK SC, sans-serif">为什么 DeepSeek Harness 坚持“一切皆插件”？解构其优雅与初生期的脆弱边界</text>
  
  <!-- Central Microkernel -->
  <rect x="520" y="250" width="400" height="180" rx="20" fill="rgba(30, 41, 59, 0.9)" stroke="#38bdf8" stroke-width="3"/>
  <rect x="550" y="274" width="120" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="562" y="293" fill="#38bdf8" font-size="13" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">CORDIS KERNEL</text>
  <text x="550" y="340" fill="#f8fafc" font-size="26" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Cordis 纯净微内核</text>
  <text x="550" y="374" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">不含任何业务逻辑，仅维护依赖注入图谱</text>
  <text x="550" y="402" fill="#94a3b8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">生命周期管理器、事件总线与副作用追踪器</text>

  <!-- Surrounding Satellite Plugins -->
  <!-- Top Left: Agent Loop -->
  <rect x="64" y="240" width="380" height="150" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="88" y="276" fill="#c084fc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">执行循环插件 (@dsh/loop)</text>
  <text x="88" y="310" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 驱动模型思考与工具调用的 Step 循环</text>
  <text x="88" y="338" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 可热替换为 SuperAgent 多智能体拓扑</text>
  <text x="88" y="366" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">拔除插件时，执行状态瞬间清空，零残留</text>

  <!-- Bottom Left: Model Adapter -->
  <rect x="64" y="440" width="380" height="150" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="476" fill="#38bdf8" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">模型适配层 (@dsh/adapter-*)</text>
  <text x="88" y="510" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· DeepSeek 官方前缀缓存 (Prefix Caching)</text>
  <text x="88" y="538" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 兼容 OpenAI / Anthropic 规范端点</text>
  <text x="88" y="566" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">通过瀑布流中间件完成流式响应与鉴权</text>

  <!-- Top Right: Tool Registry -->
  <rect x="996" y="240" width="380" height="150" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1020" y="276" fill="#34d399" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">工具生态插件 (dsh-tool-*)</text>
  <text x="1020" y="510" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Bash 执行器、Ripgrep 检索、文件读写</text>
  <text x="1020" y="310" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 终端沙箱隔离与环境探测器 (whoami)</text>
  <text x="1020" y="338" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 动态生命周期注入，按需启用卸载</text>

  <!-- Bottom Right: Session & UI Surface -->
  <rect x="996" y="440" width="380" height="150" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1020" y="476" fill="#fbbf24" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">会话持久化与界面 (@dsh/web)</text>
  <text x="1020" y="510" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Event-Sourced 溯源日志，可完整重放</text>
  <text x="1020" y="538" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Electron 桌面端与 Web 控制台双端消费</text>
  <text x="1020" y="566" fill="#94a3b8" font-size="13" font-family="Noto Sans CJK SC, sans-serif">Cookie 握手设计疏漏引爆了 HTTP 431</text>

  <!-- Connecting Lines -->
  <line x1="444" y1="315" x2="520" y2="340" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="444" y1="515" x2="520" y2="340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="920" y1="340" x2="996" y2="315" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="920" y1="340" x2="996" y2="515" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Bottom Concept Card -->
  <rect x="64" y="640" width="1312" height="160" rx="14" fill="#111827" stroke="#334155"/>
  <text x="96" y="680" fill="#f8fafc" font-size="20" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">时空可组合性 (Spatio-Temporal Composability) 的双刃剑：</text>
  <text x="96" y="716" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">1. 空间可组合性：显式依赖注入（ctx.inject）。只要前置依赖（如网络、Shell）就绪，插件即时激活；未满足时安全休眠。</text>
  <text x="96" y="746" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, sans-serif">2. 时间可组合性：副作用追踪（Effect Disposable）。卸载插件时，注册的路由、事件、监听器全被自动撤回，如同从未存在。</text>
  <text x="96" y="776" fill="#f87171" font-size="14" font-family="Noto Sans CJK SC, sans-serif">3. 现实挑战：过度灵活的中间件瀑布流容易因签名微调（next 缺失）或持久层生命周期（Cookies 遗漏）引发隐蔽雪崩。</text>
</svg>