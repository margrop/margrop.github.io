<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg11)"/>
  
  <rect x="64" y="56" width="370" height="38" rx="19" fill="rgba(244, 63, 94, 0.12)" stroke="rgba(244, 63, 94, 0.35)"/>
  <text x="88" y="81" fill="#f43f5e" font-size="15" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">ROOT CAUSE TIMELINE · 故障根因推演全流程</text>
  
  <text x="64" y="148" fill="#f8fafc" font-size="38" font-weight="900" font-family="Noto Sans CJK SC, sans-serif">HTTP 431 隐形炸弹：从第 1 次到第 71 次启动的雪崩链</text>
  <text x="64" y="192" fill="#94a3b8" font-size="20" font-family="Noto Sans CJK SC, sans-serif">解构 Electron net.fetch、SQLite Cookie 累积与 Node.js 16KB 上限的致命撞车</text>
  
  <!-- Flow Steps -->
  <!-- Step 1 -->
  <rect x="64" y="240" width="290" height="420" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="96" cy="276" r="14" fill="rgba(56, 189, 248, 0.2)"/>
  <text x="91" y="282" fill="#38bdf8" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">1</text>
  <text x="124" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">随机环回端口启动</text>
  <text x="88" y="324" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 每次桌面端打开时，Node 后台随机绑定本地端口</text>
  <text x="88" y="374" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 为防未授权访问，生成带有时间戳的临时凭证</text>
  <rect x="88" y="420" width="242" height="60" rx="8" fill="#111827"/>
  <text x="100" y="456" fill="#38bdf8" font-size="12" font-family="DejaVu Sans Mono, monospace">Set-Cookie: dsh-auth-ts=...</text>
  <text x="88" y="520" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">致命设计：Max-Age=30天且未设置轮转自动清理</text>

  <!-- Step 2 -->
  <rect x="396" y="240" width="290" height="420" rx="14" fill="#1f2937" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="428" cy="276" r="14" fill="rgba(251, 191, 36, 0.2)"/>
  <text x="423" y="282" fill="#fbbf24" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">2</text>
  <text x="456" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Chromium 忠实落盘</text>
  <text x="420" y="324" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Electron 的 Chromium 内核管理 Cookie SQLite 库</text>
  <text x="420" y="374" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 每次启动都在 localhost 作用域下追加写入一条记录</text>
  <rect x="420" y="420" width="242" height="60" rx="8" fill="#111827"/>
  <text x="432" y="456" fill="#fbbf24" font-size="12" font-family="DejaVu Sans Mono, monospace">Network/Cookies (SQLite)</text>
  <text x="420" y="520" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">70 次启动累积 70+ 条独立 Cookie，总大小逼近 16KB</text>

  <!-- Step 3 -->
  <rect x="728" y="240" width="290" height="420" rx="14" fill="#1f2937" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="760" cy="276" r="14" fill="rgba(249, 115, 22, 0.2)"/>
  <text x="755" y="282" fill="#f97316" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">3</text>
  <text x="788" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">net.fetch 全量附带</text>
  <text x="752" y="324" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 第 71 次启动执行 connectDesktopWelcome 握手</text>
  <text x="752" y="374" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Electron 按照 RFC 规范将所有 localhost Cookie 打包发送</text>
  <rect x="752" y="420" width="242" height="60" rx="8" fill="#111827"/>
  <text x="764" y="456" fill="#f97316" font-size="12" font-family="DejaVu Sans Mono, monospace">Cookie: size = 16,842 B</text>
  <text x="752" y="520" fill="#94a3b8" font-size="14" font-family="Noto Sans CJK SC, sans-serif">单条 Cookie 请求头突破 Node.js 16,384 字节硬编码阈值</text>

  <!-- Step 4 -->
  <rect x="1060" y="240" width="316" height="420" rx="14" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
  <circle cx="1092" cy="276" r="14" fill="rgba(239, 68, 68, 0.2)"/>
  <text x="1087" y="282" fill="#ef4444" font-size="16" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">4</text>
  <text x="1120" y="282" fill="#f8fafc" font-size="18" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">HTTP 431 拒检死锁</text>
  <text x="1084" y="324" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· Node.js HTTP 解析器拒绝处理并在底层直接丢弃连接</text>
  <text x="1084" y="374" fill="#cbd5e1" font-size="14" font-family="Noto Sans CJK SC, sans-serif">· 抛出 HTTP 431 Request Header Fields Too Large</text>
  <rect x="1084" y="420" width="268" height="60" rx="8" fill="#111827"/>
  <text x="1096" y="456" fill="#ef4444" font-size="12" font-family="DejaVu Sans Mono, monospace">Web authentication failed</text>
  <text x="1084" y="520" fill="#f87171" font-size="14" font-family="Noto Sans CJK SC, sans-serif">Electron 误判为鉴权失败，桌面端直接退出变砖！</text>

  <!-- Bottom Banner -->
  <rect x="64" y="690" width="1312" height="114" rx="12" fill="rgba(31, 41, 55, 0.8)" stroke="#374151"/>
  <text x="96" y="730" fill="#f9fafb" font-size="17" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">为什么重装软件无效？</text>
  <text x="96" y="760" fill="#9ca3af" font-size="15" font-family="Noto Sans CJK SC, sans-serif">因为普通的“卸载并重装”只会替换应用程序二进制文件，而存在于系统 Application Support / AppData 中的 SQLite 数据库完全保留！</text>
  <text x="96" y="786" fill="#38bdf8" font-size="15" font-family="Noto Sans CJK SC, sans-serif">彻底解法：执行脚本精准清空 Cookies 库，并配置 NODE_OPTIONS="--max-http-header-size=65536" 筑起双重免疫防线。</text>
</svg>