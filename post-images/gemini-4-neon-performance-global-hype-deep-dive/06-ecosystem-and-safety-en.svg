    <rect width="1440" height="860" class="bg"/>
    <rect x="0" y="0" width="1440" height="8" fill="#1A73E8"/>
    <rect x="0" y="0" width="480" height="8" fill="#0D9488"/>
    <text x="64" y="64" class="eyebrow">ECOSYSTEM &amp; SAFETY  ·  GLOBAL ADOPTION &amp; ALIGNMENT LEAP</text>
    <text x="64" y="114" class="h1">From Solo Chat to Agent Swarms: Ecosystem &amp; Trust Baseline</text>
    <text x="64" y="150" class="sub">Why production teams trust Gemini 4 Neon with real repositories, spreadsheets, and autonomous pipelines</text>
    <line x1="64" y1="176" x2="1376" y2="176" stroke="#E2DFD7" stroke-width="1.5"/>
    <rect x="64" y="206" width="760" height="572" rx="16" class="card"/><text x="96" y="258" class="h2">Four Major Adoption Pillars</text>
        <rect x="96" y="290" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="328" class="h3" style="fill:#1A73E8;">Google Antigravity</text>
        <text x="122" y="360" class="body" style="font-size:15.5px;">Orchestrator pairs Neon planning with Hydrogen speed behind one prompt</text>
        
        <rect x="96" y="406" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="444" class="h3" style="fill:#1A73E8;">Cursor IDE</text>
        <text x="122" y="476" class="body" style="font-size:15.5px;">Day-one integration; 1M context &amp; low hallucination win repo-wide refactors</text>
        
        <rect x="96" y="522" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="560" class="h3" style="fill:#1A73E8;">OpenRouter API</text>
        <text x="122" y="592" class="body" style="font-size:15.5px;">OpenAI-compatible endpoint hitting 120+ tok/s for indie &amp; startup builders</text>
        
        <rect x="96" y="638" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="676" class="h3" style="fill:#1A73E8;">AI Studio &amp; Cloud</text>
        <text x="122" y="708" class="body" style="font-size:15.5px;">Native 1M unified multimodal pool (text, image, audio, video, PDF)</text>
        <rect x="852" y="206" width="524" height="572" rx="16" class="card-teal"/><text x="884" y="258" class="h2" style="fill:#0F766E;">Three Hard Alignment Metrics</text>
        <rect x="884" y="290" width="460" height="134" rx="12" class="card"/>
        <text x="910" y="346" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:38px;font-weight:800;fill:#0D9488;">0.09%</text>
        <text x="910" y="380" class="h3" style="font-size:17px;">Misaligned Action Rate</text>
        <text x="910" y="406" class="muted">Ultra-low unintended side effects in tool loops</text>
        
        <rect x="884" y="446" width="460" height="134" rx="12" class="card"/>
        <text x="910" y="502" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:38px;font-weight:800;fill:#1A73E8;">99.2%</text>
        <text x="910" y="536" class="h3" style="font-size:17px;">Agent Honesty Pass Rate</text>
        <text x="910" y="562" class="muted">Admits uncertainty instead of fabricating results</text>
        
        <rect x="884" y="602" width="460" height="134" rx="12" class="card"/>
        <text x="910" y="658" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:38px;font-weight:800;fill:#D97706;">-43–56%</text>
        <text x="910" y="692" class="h3" style="font-size:17px;">Under-Service Reduction</text>
        <text x="910" y="718" class="muted">Far fewer false refusals on legitimate tech tasks</text>
        
    <line x1="64" y1="806" x2="1376" y2="806" stroke="#E2DFD7" stroke-width="1"/>
    <text x="64" y="836" class="footer">Sources: Google DeepMind Safety Evaluation / Antigravity / OpenRouter / Cursor</text>
    <text x="1376" y="836" text-anchor="end" class="footer">blog.margrop.net  |  2026-11-26</text>
    </svg>