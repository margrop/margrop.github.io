<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
<defs>
  <style>
    .bg { fill: #FAF9F6; }
    .card { fill: #FFFFFF; stroke: #E2DFD7; stroke-width: 1.5; }
    .card-soft { fill: #F4F2EC; stroke: #E2DFD7; stroke-width: 1.5; }
    .card-dark { fill: #111827; stroke: #1F2937; stroke-width: 1.5; }
    .card-blue { fill: #EEF5FF; stroke: #BDD6FB; stroke-width: 1.5; }
    .card-teal { fill: #ECFAF7; stroke: #A7E3D8; stroke-width: 1.5; }
    .card-amber { fill: #FEF7EC; stroke: #F6D59C; stroke-width: 1.5; }
    .card-red { fill: #FEF2F2; stroke: #FECACA; stroke-width: 1.5; }
    .eyebrow { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #0D9488; }
    .h1 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 40px; font-weight: 800; fill: #111827; }
    .h2 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
    .h3 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
    .sub { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 400; fill: #4B5563; }
    .body { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 400; fill: #374151; }
    .muted { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 500; fill: #6B7280; }
    .kpi { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #111827; }
    .kpi-teal { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #0D9488; }
    .kpi-blue { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #1A73E8; }
    .kpi-amber { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #D97706; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 15px; font-weight: 600; fill: #1F2937; }
    .white-h2 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 24px; font-weight: 700; fill: #FFFFFF; }
    .white-body { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 400; fill: #D1D5DB; }
    .white-kpi { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 42px; font-weight: 800; fill: #5EEAD4; }
    .footer { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 13px; fill: #9CA3AF; }
  </style>
</defs>

    <rect width="1440" height="860" class="bg"/>
    <rect x="0" y="0" width="1440" height="8" fill="#1A73E8"/>
    <rect x="0" y="0" width="480" height="8" fill="#0D9488"/>
    <text x="64" y="64" class="eyebrow">COST &amp; THINKING ARCHITECTURE  ·  四档算力变速箱与缓存经济学</text>
    <text x="64" y="114" class="h1">一车四档变速箱：思考档位 + 95% 缓存如何把账单砍到骨折？</text>
    <text x="64" y="150" class="sub">把复杂推理做成可调档位，再叠加 $0.15/1M 的超低缓存价，破解“价格倒挂”迷思</text>
    <line x1="64" y1="176" x2="1376" y2="176" stroke="#E2DFD7" stroke-width="1.5"/>
    
        <rect x="64" y="208" width="310" height="248" rx="14" class="card-soft"/>
        <rect x="88" y="232" width="144" height="32" rx="8" fill="#6B7280"/>
        <text x="160" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">LOW</text>
        <text x="88" y="306" class="h3">1 档 · 起步速答</text>
        <text x="88" y="346" class="body" style="font-size:15px;">简单格式转换、摘要提取</text>
        <line x1="88" y1="382" x2="350" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="88" y="418" class="muted" style="fill:#6B7280;font-weight:600;">延迟最低 · 费用极省</text>
        
        <rect x="398" y="208" width="310" height="248" rx="14" class="card-blue"/>
        <rect x="422" y="232" width="144" height="32" rx="8" fill="#1A73E8"/>
        <text x="494" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">MEDIUM</text>
        <text x="422" y="306" class="h3">2 档 · 均衡巡航</text>
        <text x="422" y="346" class="body" style="font-size:15px;">常规代码编写、文档润色</text>
        <line x1="422" y1="382" x2="684" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="422" y="418" class="muted" style="fill:#1A73E8;font-weight:600;">日常交互黄金甜点</text>
        
        <rect x="732" y="208" width="310" height="248" rx="14" class="card-teal"/>
        <rect x="756" y="232" width="144" height="32" rx="8" fill="#0D9488"/>
        <text x="828" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">HIGH (默认)</text>
        <text x="756" y="306" class="h3">3 档 · 全力输出</text>
        <text x="756" y="346" class="body" style="font-size:15px;">多文件重构、Agent 排障</text>
        <line x1="756" y1="382" x2="1018" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="756" y="418" class="muted" style="fill:#0D9488;font-weight:600;">官方默认档位 · 稳准狠</text>
        
        <rect x="1066" y="208" width="310" height="248" rx="14" class="card-amber"/>
        <rect x="1090" y="232" width="144" height="32" rx="8" fill="#D97706"/>
        <text x="1162" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">XHIGH</text>
        <text x="1090" y="306" class="h3">4 档 · 涡轮增压</text>
        <text x="1090" y="346" class="body" style="font-size:15px;">高难数学、系统架构攻坚</text>
        <line x1="1090" y1="382" x2="1352" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="1090" y="418" class="muted" style="fill:#D97706;font-weight:600;">AA 智力指数冲至 61</text>
        
    <rect x="64" y="486" width="640" height="292" rx="16" class="card"/>
    <rect x="64" y="486" width="640" height="8" rx="4" fill="#0D9488"/>
    <text x="96" y="540" class="h2">缓存经济学算一笔小学生也能懂的账</text>
    <text x="96" y="608" class="kpi-teal">$3.00 → $0.15</text>
    <text x="96" y="654" class="body" style="font-size:15.5px;">常规输入 $3.00/1M，缓存命中仅需 $0.15（狂省 95%）。</text>
    <text x="96" y="686" class="body" style="font-size:15.5px;">好比把 500 页教材复印好放桌边，每次提问只付翻页费，</text>
    <text x="96" y="718" class="body" style="font-size:15.5px;">不用反复重抄整本书——长对话与代码库成本瞬间腰斩。</text>

    <rect x="736" y="486" width="640" height="292" rx="16" class="card-dark"/>
    <text x="768" y="544" class="white-h2">为什么社区热议“价格倒挂”？</text>
    <text x="768" y="604" class="white-kpi" style="font-size:32px;">Promo Quirk vs. Total Cost</text>
    <text x="768" y="654" class="white-body" style="font-size:15.5px;">旗舰 Carbon 促销期内单价短暂略低于 Neon，但 Neon</text>
    <text x="768" y="686" class="white-body" style="font-size:15.5px;">输出更快、返工更少；12 月 1 日 Carbon 恢复 $4/$20</text>
    <text x="768" y="718" class="white-body" style="font-size:15.5px;">标准价后，Neon 的长期生产性价比将彻底拉开差距。</text>
    
    <line x1="64" y1="806" x2="1376" y2="806" stroke="#E2DFD7" stroke-width="1"/>
    <text x="64" y="836" class="footer">图解：Gemini 4 Neon 四档思考档位与 Prompt Caching 成本结构</text>
    <text x="1376" y="836" text-anchor="end" class="footer">blog.margrop.net  |  2026-11-26</text>
    </svg>