        <text x="88" y="306" class="h3">Gear 1 · Instant</text>
        <text x="88" y="346" class="body" style="font-size:15px;">Formatting, extraction, triage</text>
        <line x1="88" y1="382" x2="350" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="88" y="418" class="muted" style="fill:#6B7280;font-weight:600;">Lowest latency &amp; token spend</text>
        
        <rect x="398" y="208" width="310" height="248" rx="14" class="card-blue"/>
        <rect x="422" y="232" width="144" height="32" rx="8" fill="#1A73E8"/>
        <text x="494" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">MEDIUM</text>
        <text x="422" y="306" class="h3">Gear 2 · Cruise</text>
        <text x="422" y="346" class="body" style="font-size:15px;">Standard coding &amp; writing</text>
        <line x1="422" y1="382" x2="684" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="422" y="418" class="muted" style="fill:#1A73E8;font-weight:600;">Everyday interactive sweet spot</text>
        
        <rect x="732" y="208" width="310" height="248" rx="14" class="card-teal"/>
        <rect x="756" y="232" width="144" height="32" rx="8" fill="#0D9488"/>
        <text x="828" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">HIGH (Default)</text>
        <text x="756" y="306" class="h3">Gear 3 · Workhorse</text>
        <text x="756" y="346" class="body" style="font-size:15px;">Multi-file refactor &amp; agents</text>
        <line x1="756" y1="382" x2="1018" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="756" y="418" class="muted" style="fill:#0D9488;font-weight:600;">Official default · high reliability</text>
        
        <rect x="1066" y="208" width="310" height="248" rx="14" class="card-amber"/>
        <rect x="1090" y="232" width="144" height="32" rx="8" fill="#D97706"/>
        <text x="1162" y="253" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;">XHIGH</text>
        <text x="1090" y="306" class="h3">Gear 4 · Turbo</text>
        <text x="1090" y="346" class="body" style="font-size:15px;">Hard math &amp; deep architecture</text>
        <line x1="1090" y1="382" x2="1352" y2="382" stroke="#D1D5DB" stroke-width="1"/>
        <text x="1090" y="418" class="muted" style="fill:#D97706;font-weight:600;">Pushes AA Intelligence to 61</text>
        
    <rect x="64" y="486" width="640" height="292" rx="16" class="card"/>
    <rect x="64" y="486" width="640" height="8" rx="4" fill="#0D9488"/>
    <text x="96" y="540" class="h2">Cache Economics in Plain English</text>
    <text x="96" y="608" class="kpi-teal">$3.00 → $0.15</text>
    <text x="96" y="654" class="body" style="font-size:15.5px;">Standard input is $3.00/1M; cached input drops to $0.15/1M.</text>
    <text x="96" y="686" class="body" style="font-size:15.5px;">That is a 95% discount — like keeping a 500-page textbook</text>
    <text x="96" y="718" class="body" style="font-size:15.5px;">open on your desk instead of reprinting it for every query.</text>

    <rect x="736" y="486" width="640" height="292" rx="16" class="card-dark"/>
    <text x="768" y="544" class="white-h2">Explaining the 'Pricing Inversion' Debate</text>
    <text x="768" y="604" class="white-kpi" style="font-size:32px;">Promo Quirk vs. Total Cost</text>
    <text x="768" y="654" class="white-body" style="font-size:15.5px;">Carbon's promo window briefly undercut Neon per raw token,</text>
    <text x="768" y="686" class="white-body" style="font-size:15.5px;">yet Neon finishes faster with fewer retries. Once Carbon</text>
    <text x="768" y="718" class="white-body" style="font-size:15.5px;">resets to $4/$20 on Dec 1, Neon wins long-term ROI cleanly.</text>
    
    <line x1="64" y1="806" x2="1376" y2="806" stroke="#E2DFD7" stroke-width="1"/>
