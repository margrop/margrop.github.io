    <rect width="1440" height="860" class="bg"/>
    <rect x="0" y="0" width="1440" height="8" fill="#1A73E8"/>
    <rect x="0" y="0" width="480" height="8" fill="#0D9488"/>
    <text x="64" y="64" class="eyebrow">COST &amp; THINKING ARCHITECTURE  ·  4-GEAR REASONING &amp; CACHE ECONOMICS</text>
    <text x="64" y="114" class="h1">A 4-Speed Gearbox for AI: Tunable Effort + 95% Cache Savings</text>
    <text x="64" y="150" class="sub">Dial reasoning depth up or down per request while cutting repeated repo context costs to $0.15 per 1M tokens</text>
    <line x1="64" y1="176" x2="1376" y2="176" stroke="#E2DFD7" stroke-width="1.5"/>
    
        <rect x="64" y="208" width="310" height="248" rx="14" class="card-soft"/>
        <rect x="88" y="232" width="144" height="32" rx="8" fill="#6B7280"/>
