<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
<defs>
  <style>
    .bg { fill: #FAF9F6; }
    .card { fill: #FFFFFF; stroke: #E2DFD7; stroke-width: 1.5; }
    .card-soft { fill: #F4F2EC; stroke: #E2DFD7; stroke-width: 1.5; }
    .card-dark { fill: #111827; stroke: #1F2937; stroke-width: 1.5; }
    .card-blue { fill: #EEF5FF; stroke: #BDD6FB; stroke-width: 1.5; }
    .card-teal { fill: #ECFAF7; stroke: #A7E3D8; stroke-width: 1.5; }
    .card-amber { fill: #FEF7EC; stroke: #F6D59C; stroke-width: 1.5; }
    .card-red { fill: #FEF2F2; stroke: #FECACA; stroke-width: 1.5; }
    .eyebrow { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #0D9488; }
    .h1 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 40px; font-weight: 800; fill: #111827; }
    .h2 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
    .h3 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
    .sub { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 19px; font-weight: 400; fill: #4B5563; }
    .body { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 400; fill: #374151; }
    .muted { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; font-weight: 500; fill: #6B7280; }
    .kpi { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #111827; }
    .kpi-teal { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #0D9488; }
    .kpi-blue { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #1A73E8; }
    .kpi-amber { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 44px; font-weight: 800; fill: #D97706; }
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 15px; font-weight: 600; fill: #1F2937; }
    .white-h2 { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 24px; font-weight: 700; fill: #FFFFFF; }
    .white-body { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 400; fill: #D1D5DB; }
    .white-kpi { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 42px; font-weight: 800; fill: #5EEAD4; }
    .footer { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 13px; fill: #9CA3AF; }
  </style>
</defs>

    <rect width="1440" height="860" class="bg"/>
    <rect x="0" y="0" width="1440" height="8" fill="#1A73E8"/>
    <rect x="0" y="0" width="480" height="8" fill="#0D9488"/>
    <text x="64" y="64" class="eyebrow">ECOSYSTEM &amp; SAFETY  ·  全球生态爆发与安全对齐进化</text>
    <text x="64" y="114" class="h1">从单打独斗到智能体蜂群：Neon 的生态版图与信任基线</text>
    <text x="64" y="150" class="sub">为什么企业敢把真实代码库、税务表和自动化流水线交给 Gemini 4 Neon？</text>
    <line x1="64" y1="176" x2="1376" y2="176" stroke="#E2DFD7" stroke-width="1.5"/>
    <rect x="64" y="206" width="760" height="572" rx="16" class="card"/><text x="96" y="258" class="h2">四大主流落地生态</text>
        <rect x="96" y="290" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="328" class="h3" style="fill:#1A73E8;">Google Antigravity</text>
        <text x="122" y="360" class="body" style="font-size:15.5px;">Orchestrator 模式自动组合：Neon 管架构规划 + Hydrogen 跑高速执行</text>
        
        <rect x="96" y="406" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="444" class="h3" style="fill:#1A73E8;">Cursor IDE</text>
        <text x="122" y="476" class="body" style="font-size:15.5px;">首日接入，凭借 1M 上下文与低幻觉迅速成为全仓库重构热门默认模型</text>
        
        <rect x="96" y="522" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="560" class="h3" style="fill:#1A73E8;">OpenRouter API</text>
        <text x="122" y="592" class="body" style="font-size:15.5px;">兼容 OpenAI 接口，实测 120+ tok/s 丝滑输出，成独立开发者新宠</text>
        
        <rect x="96" y="638" width="696" height="96" rx="12" class="card-soft"/>
        <text x="122" y="676" class="h3" style="fill:#1A73E8;">AI Studio &amp; Cloud</text>
        <text x="122" y="708" class="body" style="font-size:15.5px;">原生支持 1M 统一多模态池（文本/图像/音频/视频/PDF）与长解码</text>
        <rect x="852" y="206" width="524" height="572" rx="16" class="card-teal"/><text x="884" y="258" class="h2" style="fill:#0F766E;">安全与对齐的三大硬指标</text>
        <rect x="884" y="290" width="460" height="134" rx="12" class="card"/>
        <text x="910" y="346" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:38px;font-weight:800;fill:#0D9488;">0.09%</text>
        <text x="910" y="380" class="h3" style="font-size:17px;">越权/偏差行动率</text>
        <text x="910" y="406" class="muted">极低误操作风险，适合接管终端与工具链</text>
        
        <rect x="884" y="446" width="460" height="134" rx="12" class="card"/>
        <text x="910" y="502" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:38px;font-weight:800;fill:#1A73E8;">99.2%</text>
        <text x="910" y="536" class="h3" style="font-size:17px;">Agent 诚实度通过率</text>
        <text x="910" y="562" class="muted">做不到就直说，大幅减少“一本正经胡编”</text>
        
        <rect x="884" y="602" width="460" height="134" rx="12" class="card"/>
        <text x="910" y="658" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:38px;font-weight:800;fill:#D97706;">-43~56%</text>
        <text x="910" y="692" class="h3" style="font-size:17px;">过度保守/敷衍下降</text>
        <text x="910" y="718" class="muted">不再动不动把正常技术需求当成违规拒答</text>
        
    <line x1="64" y1="806" x2="1376" y2="806" stroke="#E2DFD7" stroke-width="1"/>
    <text x="64" y="836" class="footer">数据来源：Google DeepMind Safety Evaluation / Antigravity / OpenRouter / Cursor</text>
    <text x="1376" y="836" text-anchor="end" class="footer">blog.margrop.net  |  2026-11-26</text>
    </svg>