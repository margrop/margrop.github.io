    <rect width="1440" height="860" class="bg"/>
    <rect x="0" y="0" width="1440" height="8" fill="#1A73E8"/>
    <rect x="0" y="0" width="480" height="8" fill="#0D9488"/>
    <text x="64" y="64" class="eyebrow">ARCHITECTURE &amp; ANALOGY  ·  PERIODIC TABLE LINEUP</text>
    <text x="64" y="114" class="h1">Hydrogen vs. Neon vs. Carbon: The Construction Crew Analogy</text>
    <text x="64" y="150" class="sub">Google replaced generic tiers with chemical elements: Hydrogen for speed, Neon for daily mastery, Carbon for deep frontier work</text>
    <line x1="64" y1="176" x2="1376" y2="176" stroke="#E2DFD7" stroke-width="1.5"/>
    
        <rect x="64" y="206" width="416" height="430" rx="16" class="card-blue"/>
        <rect x="88" y="230" width="76" height="76" rx="12" fill="#1A73E8"/>
