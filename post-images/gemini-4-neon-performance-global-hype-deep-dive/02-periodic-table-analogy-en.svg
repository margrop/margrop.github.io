        <text x="126" y="290" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:32px;font-weight:800;fill:#FFFFFF;">H</text>
        <text x="182" y="264" class="h2">Hydrogen</text>
        <text x="182" y="294" class="body" style="font-weight:600;fill:#1A73E8;">Express Runner / Fast Crew</text>
        <rect x="88" y="328" width="368" height="62" rx="10" fill="#FFFFFF" stroke="#E2DFD7"/>
        <text x="104" y="355" class="mono">$1.50 / $7.50</text>
        <text x="104" y="378" class="muted">188–198 tok/s</text>
        
            <circle cx="100" cy="421" r="4.5" fill="#1A73E8"/>
            <text x="116" y="426" class="body" style="font-size:15.5px;">High-frequency file reads &amp; tool calls</text>
            
            <circle cx="100" cy="483" r="4.5" fill="#1A73E8"/>
            <text x="116" y="488" class="body" style="font-size:15.5px;">Search, Sheets &amp; fast chat UX</text>
            
            <circle cx="100" cy="545" r="4.5" fill="#1A73E8"/>
            <text x="116" y="550" class="body" style="font-size:15.5px;">Worker layer under Orchestrator</text>
            
        <rect x="512" y="206" width="416" height="430" rx="16" class="card-teal"/>
        <rect x="536" y="230" width="76" height="76" rx="12" fill="#0D9488"/>
        <text x="548" y="252" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;opacity:0.85;">10</text>
        <text x="574" y="290" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:32px;font-weight:800;fill:#FFFFFF;">Ne</text>
        <text x="630" y="264" class="h2">Neon (Star)</text>
        <text x="630" y="294" class="body" style="font-weight:600;fill:#0D9488;">All-Round Chief Architect</text>
        <rect x="536" y="328" width="368" height="62" rx="10" fill="#FFFFFF" stroke="#E2DFD7"/>
        <text x="552" y="355" class="mono">$3.00 / $15.00</text>
        <text x="552" y="378" class="muted">120+ tok/s · 1M Pool</text>
        
            <circle cx="548" cy="421" r="4.5" fill="#0D9488"/>
            <text x="564" y="426" class="body" style="font-size:15.5px;">85% of daily coding &amp; repo refactors</text>
            
            <circle cx="548" cy="483" r="4.5" fill="#0D9488"/>
            <text x="564" y="488" class="body" style="font-size:15.5px;">Analytics, legal, tax &amp; STEM work</text>
            
            <circle cx="548" cy="545" r="4.5" fill="#0D9488"/>
            <text x="564" y="550" class="body" style="font-size:15.5px;">Best performance-per-dollar workhorse</text>
            
        <rect x="960" y="206" width="416" height="430" rx="16" class="card-amber"/>
        <rect x="984" y="230" width="76" height="76" rx="12" fill="#D97706"/>
        <text x="996" y="252" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:13px;font-weight:700;fill:#FFFFFF;opacity:0.85;">6</text>
        <text x="1022" y="290" text-anchor="middle" style="font-family:'SF Mono', 'JetBrains Mono', Menlo, monospace;font-size:32px;font-weight:800;fill:#FFFFFF;">C</text>
        <text x="1078" y="264" class="h2">Carbon</text>
        <text x="1078" y="294" class="body" style="font-weight:600;fill:#D97706;">Chief Scientist / Heavy Lab</text>
        <rect x="984" y="328" width="368" height="62" rx="10" fill="#FFFFFF" stroke="#E2DFD7"/>
        <text x="1000" y="355" class="mono">$4.00 / $20.00*</text>
        <text x="1000" y="378" class="muted">Deep Long-Horizon</text>
        
            <circle cx="996" cy="421" r="4.5" fill="#D97706"/>
            <text x="1012" y="426" class="body" style="font-size:15.5px;">Multi-day research &amp; novel algorithms</text>
            
            <circle cx="996" cy="483" r="4.5" fill="#D97706"/>
            <text x="1012" y="488" class="body" style="font-size:15.5px;">Hardest math &amp; system bottlenecks</text>
            
            <circle cx="996" cy="545" r="4.5" fill="#D97706"/>
            <text x="1012" y="550" class="body" style="font-size:15.5px;">*Standard tier pricing from Dec 1</text>
            
    <rect x="64" y="662" width="1312" height="122" rx="14" class="card"/>
    <rect x="64" y="662" width="8" height="122" rx="4" fill="#0D9488"/>
    <text x="96" y="700" class="h3" style="fill:#0F766E;">Everyday Analogy: Renovating a House</text>
    <text x="96" y="734" class="body">Hydrogen is the lightning-fast crew hauling materials; Neon is the seasoned Chief Architect who drafts blueprints,</text>
    <text x="96" y="762" class="body">checks wiring, and runs the whole site at a fair rate; Carbon is the structural professor called only for rare puzzles.</text>
    
    <line x1="64" y1="806" x2="1376" y2="806" stroke="#E2DFD7" stroke-width="1"/>
    <text x="64" y="836" class="footer">Diagram: Gemini 4 Element Family Role Allocation (Hydrogen / Neon / Carbon)</text>
