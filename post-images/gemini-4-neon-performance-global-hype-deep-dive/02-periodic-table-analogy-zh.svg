    <text x="64" y="114" class="h1">氢、氖、碳怎么选？用“装修工程队”秒懂 Gemini 4 三兄弟</text>
    <text x="64" y="150" class="sub">Google 放弃传统命名，改用化学元素定位：Hydrogen（氢）求极速、Neon（氖）扛主力、Carbon（碳）攻难关</text>
    <line x1="64" y1="176" x2="1376" y2="176" stroke="#E2DFD7" stroke-width="1.5"/>
    
        <rect x="64" y="206" width="416" height="430" rx="16" class="card-blue"/>
