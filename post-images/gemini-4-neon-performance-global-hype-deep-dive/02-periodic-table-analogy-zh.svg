            <circle cx="548" cy="483" r="4.5" fill="#0D9488"/>
            <text x="564" y="488" class="body" style="font-size:15.5px;">数据分析、法律税务与科研推理</text>
            
            <circle cx="548" cy="545" r="4.5" fill="#0D9488"/>
            <text x="564" y="550" class="body" style="font-size:15.5px;">性价比最高的主力生产模型</text>
            
