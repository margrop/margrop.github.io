            <circle cx="996" cy="483" r="4.5" fill="#D97706"/>
            <text x="1012" y="488" class="body" style="font-size:15.5px;">极致高难度数学与架构攻坚</text>
            
            <circle cx="996" cy="545" r="4.5" fill="#D97706"/>
