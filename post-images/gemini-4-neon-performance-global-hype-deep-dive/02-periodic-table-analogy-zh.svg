    <rect x="64" y="662" width="1312" height="122" rx="14" class="card"/>
    <rect x="64" y="662" width="8" height="122" rx="4" fill="#0D9488"/>
    <text x="96" y="700" class="h3" style="fill:#0F766E;">小学生也能听懂的大比方：装修一套房子</text>
    <text x="96" y="734" class="body">Hydrogen 是手脚麻利的搬砖和跑腿小哥，拿材料、刷墙飞快；Neon 是经验老道的总工长，画图纸、查水电、</text>
    <text x="96" y="762" class="body">管进度样样精通且工钱公道；Carbon 是只请来解决“承重墙结构力学难题”的大学教授，本事最大但最贵最慢。</text>
    
