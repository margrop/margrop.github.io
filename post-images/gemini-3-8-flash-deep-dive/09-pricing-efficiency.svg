<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="priceGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="priceGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="priceGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  
  <rect width="960" height="500" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">性价比降维打击：每百万 Token 成本与工程吞吐对比</text>
  <text x="48" y="78" fill="#94a3b8" font-family="sans-serif" font-size="13">定价维持在 3.7 Flash 首发极低水平，但工程智能逼近顶尖 Frontier 旗舰</text>
  
  <g transform="translate(60, 110)">
    <!-- Column 1: Gemini 3.8 Flash -->
    <rect x="0" y="0" width="250" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="20" y="20" width="130" height="24" rx="6" fill="url(#priceGrad1)"/>
    <text x="85" y="36" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Gemini 3.8 Flash</text>
    
    <text x="24" y="80" fill="#64748b" font-family="sans-serif" font-size="12">输入成本 (Input)</text>
    <text x="24" y="112" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="800">$0.75 <tspan font-size="13" fill="#94a3b8" font-weight="400">/ 1M tokens</tspan></text>
    
    <text x="24" y="150" fill="#64748b" font-family="sans-serif" font-size="12">输出成本 (Output)</text>
    <text x="24" y="182" fill="#34d399" font-family="sans-serif" font-size="26" font-weight="800">$3.75 <tspan font-size="13" fill="#94a3b8" font-weight="400">/ 1M tokens</tspan></text>
    
    <line x1="20" y1="210" x2="230" y2="210" stroke="#334155"/>
    <text x="24" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Terminal-Bench: <tspan fill="#34d399" font-weight="700">90.8%</tspan></text>
    <text x="24" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="12">• DeepSWE 软件工程: <tspan fill="#34d399" font-weight="700">73.7%</tspan></text>
    <text x="24" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="12">• 缓存折扣: 最高 <tspan fill="#34d399" font-weight="700">50% 折扣</tspan></text>
    <text x="24" y="315" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">极致性价比，高频 Agent 首选</text>

    <!-- Column 2: Claude 3.5 Sonnet -->
    <rect x="290" y="0" width="250" height="340" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="310" y="20" width="140" height="24" rx="6" fill="url(#priceGrad2)"/>
    <text x="380" y="36" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Claude 3.5 Sonnet</text>
    
    <text x="314" y="80" fill="#64748b" font-family="sans-serif" font-size="12">输入成本 (Input)</text>
    <text x="314" y="112" fill="#fbbf24" font-family="sans-serif" font-size="26" font-weight="800">$3.00 <tspan font-size="13" fill="#94a3b8" font-weight="400">/ 1M (4.0x)</tspan></text>
    
    <text x="314" y="150" fill="#64748b" font-family="sans-serif" font-size="12">输出成本 (Output)</text>
    <text x="314" y="182" fill="#fbbf24" font-family="sans-serif" font-size="26" font-weight="800">$15.00 <tspan font-size="13" fill="#94a3b8" font-weight="400">/ 1M (4.0x)</tspan></text>
    
    <line x1="310" y1="210" x2="520" y2="210" stroke="#334155"/>
    <text x="314" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Terminal-Bench: 78.4%</text>
    <text x="314" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="12">• DeepSWE 软件工程: 66.8%</text>
    <text x="314" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="12">• 深度编码能力极强</text>
    <text x="314" y="315" fill="#f59e0b" font-family="sans-serif" font-size="11">综合费用约为 3.8 Flash 的 4 倍</text>

    <!-- Column 3: GPT-4o Frontier -->
    <rect x="580" y="0" width="250" height="340" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="600" y="20" width="120" height="24" rx="6" fill="url(#priceGrad3)"/>
    <text x="660" y="36" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">GPT-4o</text>
    
    <text x="604" y="80" fill="#64748b" font-family="sans-serif" font-size="12">输入成本 (Input)</text>
    <text x="604" y="112" fill="#f87171" font-family="sans-serif" font-size="26" font-weight="800">$2.50 <tspan font-size="13" fill="#94a3b8" font-weight="400">/ 1M (3.3x)</tspan></text>
    
    <text x="604" y="150" fill="#64748b" font-family="sans-serif" font-size="12">输出成本 (Output)</text>
    <text x="604" y="182" fill="#f87171" font-family="sans-serif" font-size="26" font-weight="800">$10.00 <tspan font-size="13" fill="#94a3b8" font-weight="400">/ 1M (2.7x)</tspan></text>
    
    <line x1="600" y1="210" x2="810" y2="210" stroke="#334155"/>
    <text x="604" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Terminal-Bench: 76.2%</text>
    <text x="604" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="12">• DeepSWE 软件工程: 63.4%</text>
    <text x="604" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="12">• 全能多模态通用模型</text>
    <text x="604" y="315" fill="#ef4444" font-family="sans-serif" font-size="11">大规模 Agent 循环运行成本较高</text>
  </g>
</svg>