<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#2a2b3d"/>
    </linearGradient>
    <linearGradient id="badgeRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <rect width="960" height="520" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">小学生也能懂的思维模型：为什么 Gemini 3.8 更能“死磕”？</text>
  <text x="48" y="78" fill="#94a3b8" font-family="sans-serif" font-size="13">对比“急躁抢答的大厨”与“带草稿纸的乐高工程师/大侦探”两种认知模式</text>
  
  <!-- Left Box: Old Flash Model (The Rushed Chef) -->
  <g transform="translate(48, 110)">
    <rect width="410" height="360" rx="12" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="20" y="20" width="140" height="26" rx="6" fill="url(#badgeRed)"/>
    <text x="90" y="37" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">传统快速模型：抢答厨师</text>
    
    <text x="24" y="80" fill="#fca5a5" font-family="sans-serif" font-size="15" font-weight="600">思维方式：凭直觉一次性抢答</text>
    
    <!-- Step 1 -->
    <circle cx="36" cy="120" r="12" fill="#3f1d24" stroke="#f87171" stroke-width="1.5"/>
    <text x="36" y="125" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="60" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="13">看到指令立刻开炒，不细看食谱细节</text>
    
    <!-- Step 2 -->
    <circle cx="36" cy="175" r="12" fill="#3f1d24" stroke="#f87171" stroke-width="1.5"/>
    <text x="36" y="180" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="60" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="13">中途发现放错盐（报错），惊慌失措</text>
    
    <!-- Step 3 -->
    <circle cx="36" cy="230" r="12" fill="#3f1d24" stroke="#f87171" stroke-width="1.5"/>
    <text x="36" y="235" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="60" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="13">胡乱加糖掩盖味道，导致越改越错</text>
    
    <!-- Step 4 -->
    <circle cx="36" cy="285" r="12" fill="#3f1d24" stroke="#f87171" stroke-width="1.5"/>
    <text x="36" y="290" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="60" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="13">尝试 2 次失败后直接认输：“我无法完成”</text>
    
    <!-- Result Tag -->
    <rect x="20" y="315" width="370" height="30" rx="6" fill="#450a0a"/>
    <text x="205" y="335" fill="#fca5a5" font-family="sans-serif" font-size="12" text-anchor="middle">终局：遇到深度 bug 容易死循环或中途弃工</text>
  </g>
  
  <!-- Right Box: Gemini 3.8 Flash (The Lego Master & Detective) -->
  <g transform="translate(502, 110)">
    <rect width="410" height="360" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="20" y="20" width="180" height="26" rx="6" fill="url(#badgeGreen)"/>
    <text x="110" y="37" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Gemini 3.8：带草稿纸的侦探</text>
    
    <text x="24" y="80" fill="#6ee7b7" font-family="sans-serif" font-size="15" font-weight="600">思维方式：Iterative Tool Use + 深度死磕</text>
    
    <!-- Step 1 -->
    <circle cx="36" cy="120" r="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="36" y="125" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="60" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="13">先在草稿纸（Thinking 预算）上拆解图纸</text>
    
    <!-- Step 2 -->
    <circle cx="36" cy="175" r="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="36" y="180" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="60" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="13">拼一块、晃一晃（运行测试检验真伪）</text>
    
    <!-- Step 3 -->
    <circle cx="36" cy="230" r="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="36" y="235" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="60" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="13">若螺丝没拧紧，看报错回退重拼，绝不砸桌子</text>
    
    <!-- Step 4 -->
    <circle cx="36" cy="285" r="12" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="36" y="290" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="60" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="13">多轮工具交互直至整栋城堡通过全部验收测试</text>
    
    <!-- Result Tag -->
    <rect x="20" y="315" width="370" height="30" rx="6" fill="#064e3b"/>
    <text x="205" y="335" fill="#6ee7b7" font-family="sans-serif" font-size="12" text-anchor="middle">终局：Terminal-Bench 达成 90.8% 的关键根因！</text>
  </g>
</svg>