<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barG38" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="barG37" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="barSonnet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Title & Subtitle -->
  <text x="48" y="52" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Gemini 3.8 Flash vs. 行业主流模型 核心评测对比</text>
  <text x="48" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">数据来源：Google 官方技术发布公告 (2026-09-02) 及行业标准自动化基准测试</text>
  
  <!-- Legend -->
  <g transform="translate(560, 42)">
    <rect x="0" y="0" width="16" height="12" rx="3" fill="url(#barG38)"/>
    <text x="24" y="11" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Gemini 3.8 Flash</text>
    <rect x="160" y="0" width="16" height="12" rx="3" fill="url(#barG37)"/>
    <text x="184" y="11" fill="#cbd5e1" font-family="sans-serif" font-size="12">Gemini 3.7 Flash</text>
    <rect x="290" y="0" width="16" height="12" rx="3" fill="url(#barSonnet)"/>
    <text x="314" y="11" fill="#cbd5e1" font-family="sans-serif" font-size="12">Claude 3.5 Sonnet</text>
  </g>
  
  <!-- Grid Lines (0% to 100%) -->
  <g transform="translate(240, 110)">
    <!-- X-Axis markers -->
    <line x1="0" y1="0" x2="0" y2="360" stroke="#334155" stroke-dasharray="4,4"/>
    <text x="0" y="380" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">0%</text>
    
    <line x1="160" y1="0" x2="160" y2="360" stroke="#334155" stroke-dasharray="4,4"/>
    <text x="160" y="380" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">25%</text>
    
    <line x1="320" y1="0" x2="320" y2="360" stroke="#334155" stroke-dasharray="4,4"/>
    <text x="320" y="380" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">50%</text>
    
    <line x1="480" y1="0" x2="480" y2="360" stroke="#334155" stroke-dasharray="4,4"/>
    <text x="480" y="380" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">75%</text>
    
    <line x1="640" y1="0" x2="640" y2="360" stroke="#475569" stroke-width="1.5"/>
    <text x="640" y="380" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">100%</text>
    
    <!-- Benchmark 1: Terminal-Bench 2.1 (90.8% vs 81.6% vs 78.4%) -->
    <text x="-20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">Terminal-Bench 2.1</text>
    <text x="-20" y="46" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">终端复杂工程操控</text>
    <rect x="0" y="10" width="581.1" height="14" rx="4" fill="url(#barG38)"/>
    <text x="590" y="22" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">90.8%</text>
    
    <rect x="0" y="28" width="522.2" height="11" rx="3" fill="url(#barG37)"/>
    <text x="532" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">81.6%</text>
    
    <rect x="0" y="43" width="501.7" height="11" rx="3" fill="url(#barSonnet)"/>
    <text x="512" y="53" fill="#f59e0b" font-family="sans-serif" font-size="11">78.4%</text>
    
    <!-- Benchmark 2: DeepSWE v1.1 (73.7% vs 65.3% vs 66.8%) -->
    <text x="-20" y="105" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">DeepSWE v1.1</text>
    <text x="-20" y="121" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">长跨度真实仓库Issue解决</text>
    <rect x="0" y="85" width="471.6" height="14" rx="4" fill="url(#barG38)"/>
    <text x="480" y="97" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">73.7%</text>
    
    <rect x="0" y="103" width="417.9" height="11" rx="3" fill="url(#barG37)"/>
    <text x="428" y="113" fill="#94a3b8" font-family="sans-serif" font-size="11">65.3%</text>
    
    <rect x="0" y="118" width="427.5" height="11" rx="3" fill="url(#barSonnet)"/>
    <text x="438" y="128" fill="#f59e0b" font-family="sans-serif" font-size="11">66.8%</text>
    
    <!-- Benchmark 3: OSWorld-2.0 (59.0% vs 50.6% vs 48.2%) -->
    <text x="-20" y="180" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">OSWorld-2.0</text>
    <text x="-20" y="196" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">全系统级自主交互</text>
    <rect x="0" y="160" width="377.6" height="14" rx="4" fill="url(#barG38)"/>
    <text x="388" y="172" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">59.0%</text>
    
    <rect x="0" y="178" width="323.8" height="11" rx="3" fill="url(#barG37)"/>
    <text x="334" y="188" fill="#94a3b8" font-family="sans-serif" font-size="11">50.6%</text>
    
    <rect x="0" y="193" width="308.4" height="11" rx="3" fill="url(#barSonnet)"/>
    <text x="318" y="203" fill="#f59e0b" font-family="sans-serif" font-size="11">48.2%</text>

    <!-- Benchmark 4: Vals Finance v2 (61.4% vs 59.0% vs 58.1%) -->
    <text x="-20" y="255" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">Vals Finance v2</text>
    <text x="-20" y="271" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">多步金融研报与复杂推理</text>
    <rect x="0" y="235" width="392.9" height="14" rx="4" fill="url(#barG38)"/>
    <text x="402" y="247" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">61.4%</text>
    
    <rect x="0" y="253" width="377.6" height="11" rx="3" fill="url(#barG37)"/>
    <text x="388" y="263" fill="#94a3b8" font-family="sans-serif" font-size="11">59.0%</text>
    
    <rect x="0" y="268" width="371.8" height="11" rx="3" fill="url(#barSonnet)"/>
    <text x="382" y="278" fill="#f59e0b" font-family="sans-serif" font-size="11">58.1%</text>
    
    <!-- Benchmark 5: HLE-Verified (54.9% vs 53.6% vs 52.4%) -->
    <text x="-20" y="330" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="end">HLE-Verified</text>
    <text x="-20" y="346" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="end">人类终极难度学术测试</text>
    <rect x="0" y="310" width="351.3" height="14" rx="4" fill="url(#barG38)"/>
    <text x="362" y="322" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">54.9%</text>
    
    <rect x="0" y="328" width="343.0" height="11" rx="3" fill="url(#barG37)"/>
    <text x="352" y="338" fill="#94a3b8" font-family="sans-serif" font-size="11">53.6%</text>
    
    <rect x="0" y="343" width="335.3" height="11" rx="3" fill="url(#barSonnet)"/>
    <text x="345" y="353" fill="#f59e0b" font-family="sans-serif" font-size="11">52.4%</text>
  </g>
</svg>