<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCache" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <rect width="960" height="500" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="52" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">100 万 Token 上下文与 KV 缓存机制：立体仓储工作台比喻</text>
  <text x="48" y="78" fill="#94a3b8" font-family="sans-serif" font-size="13">为什么 Gemini 3.8 Flash 能在一整座仓库的代码中秒级检索与无损长上下文推理</text>
  
  <!-- Desk Base (Context Window) -->
  <g transform="translate(60, 110)">
    <!-- Big Table Layer -->
    <rect x="0" y="180" width="840" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="24" y="210" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="700">超大无损作业台 (1,048,576 Tokens 物理全宽)</text>
    <text x="24" y="235" fill="#64748b" font-family="sans-serif" font-size="12">容纳范围：可同时平铺 12 个完整微服务工程代码、几百页 PDF 技术规范与数万条历史交互日志</text>
    
    <!-- Shelf 1: Prefix Caching -->
    <rect x="30" y="255" width="240" height="55" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="45" y="278" fill="#ccfbf1" font-family="sans-serif" font-size="12" font-weight="700">持久前缀缓存 (Prefix KV)</text>
    <text x="45" y="298" fill="#99f6e4" font-family="sans-serif" font-size="11">工程框架/系统规则 (零延迟读取)</text>
    
    <!-- Shelf 2: Working Active Memory -->
    <rect x="290" y="255" width="310" height="55" rx="8" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="305" y="278" fill="#dbeafe" font-family="sans-serif" font-size="12" font-weight="700">活跃工程工作区 (Dynamic Buffer)</text>
    <text x="305" y="298" fill="#93c5fd" font-family="sans-serif" font-size="11">当前排查的 Bug、调用栈与终端实时输出</text>
    
    <!-- Shelf 3: Output Generator -->
    <rect x="620" y="255" width="190" height="55" rx="8" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5"/>
    <text x="635" y="278" fill="#f3e8ff" font-family="sans-serif" font-size="12" font-weight="700">64K 产物出货口</text>
    <text x="635" y="298" fill="#e9d5ff" font-family="sans-serif" font-size="11">单次完整输出补丁与脚本</text>
    
    <!-- Overhead Cranes (Attention Heads) -->
    <g transform="translate(100, 0)">
      <rect x="0" y="10" width="640" height="20" rx="4" fill="#334155"/>
      <!-- Crane 1 -->
      <line x1="120" y1="30" x2="120" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="120" cy="160" r="8" fill="#38bdf8"/>
      <text x="120" y="80" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">精准抓取依赖</text>
      <!-- Crane 2 -->
      <line x1="380" y1="30" x2="380" y2="160" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="380" cy="160" r="8" fill="#818cf8"/>
      <text x="380" y="95" fill="#818cf8" font-family="sans-serif" font-size="11" text-anchor="middle">多跳跨文件推理</text>
      <!-- Crane 3 -->
      <line x1="560" y1="30" x2="560" y2="160" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="560" cy="160" r="8" fill="#a78bfa"/>
      <text x="560" y="80" fill="#a78bfa" font-family="sans-serif" font-size="11" text-anchor="middle">零丢失召回</text>
    </g>
  </g>
</svg>