<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="oldBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="newBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1400" height="800" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="700" y="55" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">Kimi 199元套餐底层配额架构蜕变：旧版周额度独立护城河 vs 新版月度统一合流大池</text>
  <text x="700" y="85" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Architectural Comparison: Old Weekly Compartments + 20x Code Multiplier vs New Unified Monthly Shared Ledger</text>

  <!-- TOP: OLD 199 -->
  <g transform="translate(60, 120)">
    <rect width="1280" height="290" rx="16" fill="url(#oldBoxGrad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect x="25" y="20" width="220" height="36" rx="8" fill="#1d4ed8"/>
    <text x="135" y="44" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">旧 199 套餐 (Allegretto 机制)</text>
    <text x="260" y="44" font-family="sans-serif" font-size="14" fill="#93c5fd">核心逻辑：每周独立刷新配额 + 5小时滚动频控 + Kimi Code 专属 20x 额度系数红利</text>

    <!-- 4 Weekly Buckets -->
    <g transform="translate(40, 80)">
      <rect width="210" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">第 1 周配额 (独立)</text>
      <text x="105" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">~6.5M 等效基准 Tokens</text>
      <text x="105" y="92" font-family="sans-serif" font-size="13" fill="#34d399" text-anchor="middle">★ Code 享有 20x 系数红利</text>
      <text x="105" y="125" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">周日 24:00 未用完清零</text>
    </g>

    <g transform="translate(280, 80)">
      <rect width="210" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">第 2 周配额 (独立)</text>
      <text x="105" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">~6.5M 等效基准 Tokens</text>
      <text x="105" y="92" font-family="sans-serif" font-size="13" fill="#34d399" text-anchor="middle">★ Code 享有 20x 系数红利</text>
      <text x="105" y="125" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">周日 24:00 未用完清零</text>
    </g>

    <g transform="translate(520, 80)">
      <rect width="210" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">第 3 周配额 (独立)</text>
      <text x="105" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">~6.5M 等效基准 Tokens</text>
      <text x="105" y="92" font-family="sans-serif" font-size="13" fill="#34d399" text-anchor="middle">★ Code 享有 20x 系数红利</text>
      <text x="105" y="125" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">周日 24:00 未用完清零</text>
    </g>

    <g transform="translate(760, 80)">
      <rect width="210" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8" text-anchor="middle">第 4 周配额 (独立)</text>
      <text x="105" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">~6.5M 等效基准 Tokens</text>
      <text x="105" y="92" font-family="sans-serif" font-size="13" fill="#34d399" text-anchor="middle">★ Code 享有 20x 系数红利</text>
      <text x="105" y="125" font-family="sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">月底自动结算周期更新</text>
    </g>

    <!-- Side Guard -->
    <g transform="translate(1000, 80)">
      <rect width="240" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="120" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f59e0b" text-anchor="middle">周限隔离防线 (Isolation)</text>
      <text x="120" y="62" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">第1周即使爆肝耗尽配额</text>
      <text x="120" y="85" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">绝对不会侵蚀后三周底牌！</text>
      <text x="120" y="115" font-family="sans-serif" font-size="12" fill="#4ade80" text-anchor="middle">✔ 每周一满血复活重启</text>
    </g>
  </g>

  <!-- BOTTOM: NEW 199 -->
  <g transform="translate(60, 450)">
    <rect width="1280" height="300" rx="16" fill="url(#newBoxGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="25" y="20" width="220" height="36" rx="8" fill="#059669"/>
    <text x="135" y="44" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">新 199 套餐 (Pro 统一大池)</text>
    <text x="260" y="44" font-family="sans-serif" font-size="14" fill="#a7f3d0">核心逻辑：取消周额度，整月 26,000,000 Tokens 统一大水库，所有产品合流直接扣点</text>

    <!-- Huge Reservoir Box -->
    <g transform="translate(40, 75)">
      <rect width="700" height="195" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="350" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6ee7b7" text-anchor="middle">统一月度共享额度池 (Unified Shared Pool: 26M Tokens)</text>

      <!-- Sub streams flowing in -->
      <g transform="translate(30, 60)">
        <rect width="140" height="110" rx="8" fill="#022c22" stroke="#10b981"/>
        <text x="70" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Kimi Code</text>
        <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">长程 Agent 补全</text>
        <text x="70" y="80" font-family="sans-serif" font-size="11" fill="#f87171" text-anchor="middle">无20x独立倍率</text>
        <text x="70" y="98" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">全额吞噬大池</text>
      </g>

      <g transform="translate(195, 60)">
        <rect width="140" height="110" rx="8" fill="#022c22" stroke="#10b981"/>
        <text x="70" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">Agent 集群</text>
        <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">50次多任务并行</text>
        <text x="70" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">多步工具反思</text>
        <text x="70" y="98" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">扣共享 Token</text>
      </g>

      <g transform="translate(360, 60)">
        <rect width="140" height="110" rx="8" fill="#022c22" stroke="#10b981"/>
        <text x="70" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">深度研究</text>
        <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Deep Research</text>
        <text x="70" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">百篇长文泛读</text>
        <text x="70" y="98" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">扣共享 Token</text>
      </g>

      <g transform="translate(525, 60)">
        <rect width="140" height="110" rx="8" fill="#022c22" stroke="#10b981"/>
        <text x="70" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ec4899" text-anchor="middle">Chat / Claw</text>
        <text x="70" y="55" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">常规网页对话</text>
        <text x="70" y="80" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">微信群助理回调</text>
        <text x="70" y="98" font-family="sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">扣共享 Token</text>
      </g>
    </g>

    <!-- Rolling Window Valve on Right -->
    <g transform="translate(770, 75)">
      <rect width="470" height="195" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
      <text x="235" y="32" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">双重拦截：5小时滚动频控阀门 (2.5M Token Ceiling)</text>
      <text x="235" y="65" font-family="sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">即使 26M 月度池还有大半，短时爆发若在 5小时内超过 2.5M</text>
      <text x="235" y="90" font-family="sans-serif" font-size="13" fill="#f87171" text-anchor="middle">立即触发 HTTP 429 Rate Limit，硬锁等待窗口滑动降温！</text>
      <line x1="30" y1="110" x2="440" y2="110" stroke="#374151" stroke-width="1"/>
      <text x="235" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0" text-anchor="middle">【关键异同总结】</text>
      <text x="235" y="160" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">利：单周突发大任务不再受单周上限卡死，灵活性大增</text>
      <text x="235" y="182" font-family="sans-serif" font-size="12" fill="#f87171" text-anchor="middle">弊：失去周限护城河，重度长程编程若无节制，5天即可烧空整月！</text>
    </g>
  </g>
</svg>
