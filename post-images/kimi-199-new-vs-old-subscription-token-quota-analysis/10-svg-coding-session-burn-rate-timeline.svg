<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="750" fill="url(#bgGrad)"/>
  <text x="700" y="55" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">新 199 套餐 (26M Token 月共享大池) 30天寿命衰减曲线</text>
  <text x="700" y="85" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Burnout Velocity: How Long Does the 26M Shared Quota Last Across 3 Developer Profiles?</text>

  <!-- Chart Area -->
  <g transform="translate(120, 130)">
    <!-- Axes -->
    <line x1="80" y1="20" x2="80" y2="480" stroke="#334155" stroke-width="2"/>
    <line x1="80" y1="480" x2="1180" y2="480" stroke="#334155" stroke-width="2"/>

    <!-- Y Ticks -->
    <text x="65" y="25" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">26M (100%)</text>
    <line x1="80" y1="20" x2="1180" y2="20" stroke="#1e293b" stroke-dasharray="4"/>

    <text x="65" y="140" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">19.5M (75%)</text>
    <line x1="80" y1="135" x2="1180" y2="135" stroke="#1e293b" stroke-dasharray="4"/>

    <text x="65" y="255" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">13M (50%)</text>
    <line x1="80" y1="250" x2="1180" y2="250" stroke="#1e293b" stroke-dasharray="4"/>

    <text x="65" y="370" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">6.5M (25%)</text>
    <line x1="80" y1="365" x2="1180" y2="365" stroke="#1e293b" stroke-dasharray="4"/>

    <text x="65" y="485" font-family="sans-serif" font-size="13" fill="#ef4444" text-anchor="end">0M (耗尽)</text>

    <!-- X Ticks: Days 1, 5, 10, 15, 20, 25, 30 -->
    <!-- 1100 px width for 30 days => 36.66 px per day -->
    <text x="80" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 1 天</text>
    <text x="263" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 5 天</text>
    <text x="446" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 10 天</text>
    <text x="630" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 15 天</text>
    <text x="813" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 20 天</text>
    <text x="996" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 25 天</text>
    <text x="1180" y="515" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">第 30 天 (结算)</text>

    <!-- Curve 1: Heavy Coder (5M/day) -> Depletes on Day 5.2 -->
    <!-- Day 1 (80, 20) -> Day 5.2 (270, 480) -->
    <path d="M 80 20 L 270 480 L 1180 480" fill="none" stroke="#ef4444" stroke-width="3.5"/>
    <circle cx="270" cy="480" r="6" fill="#ef4444"/>
    <text x="285" y="460" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f87171">【重度极客：第 5.2 天即告见底！】</text>

    <!-- Curve 2: Moderate Coder (1.2M/day) -> Depletes on Day 21.6 -->
    <!-- Day 1 (80, 20) -> Day 21.6 (872, 480) -->
    <path d="M 80 20 L 872 480 L 1180 480" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="872" cy="480" r="6" fill="#f59e0b"/>
    <text x="760" y="440" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">【中度开发：第 21.6 天额度耗尽】</text>

    <!-- Curve 3: Light Coder (0.5M/day) -> Day 30 at 11M left -->
    <!-- Day 1 (80, 20) -> Day 30 (1180, 285) -->
    <path d="M 80 20 L 1180 285" fill="none" stroke="#10b981" stroke-width="3.5"/>
    <circle cx="1180" cy="285" r="6" fill="#10b981"/>
    <text x="1060" y="260" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">【轻度开发：稳撑全月且剩 42%】</text>
  </g>

  <!-- Legend -->
  <g transform="translate(200, 680)">
    <circle cx="20" cy="15" r="7" fill="#ef4444"/>
    <text x="35" y="20" font-family="sans-serif" font-size="14" fill="#cbd5e1">重度爆肝组 (4~6小时高频 Agent 重构，日均消耗 5.0M Tokens)</text>

    <circle cx="560" cy="15" r="7" fill="#f59e0b"/>
    <text x="575" y="20" font-family="sans-serif" font-size="14" fill="#cbd5e1">常规职业组 (日常代码辅助 + 单元测试，日均消耗 1.2M Tokens)</text>

    <circle cx="1060" cy="15" r="7" fill="#10b981"/>
    <text x="1075" y="20" font-family="sans-serif" font-size="14" fill="#cbd5e1">轻度辅助组 (碎片答疑修Bug，日均消耗 0.5M Tokens)</text>
  </g>
</svg>
