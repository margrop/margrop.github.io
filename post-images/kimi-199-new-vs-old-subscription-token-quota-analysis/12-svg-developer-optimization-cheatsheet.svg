<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="780" fill="url(#bgGrad)"/>
  <text x="700" y="55" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">重度开发者 Kimi 199 额度延寿省流四大黄金准则</text>
  <text x="700" y="85" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Four Core Tactics to Double Your Effective Token Longevity under the Unified Quota Regime</text>

  <!-- 4 Strategy Cards -->
  <g transform="translate(60, 120)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="610" height="280" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="25" y="25" width="45" height="45" rx="8" fill="#1e3a8a"/>
      <text x="47" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#60a5fa" text-anchor="middle">1</text>
      <text x="85" y="55" font-family="sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">严格维护 .kimiignore，消灭上下文冗余</text>
      <line x1="25" y1="85" x2="585" y2="85" stroke="#1f2937" stroke-width="1"/>
      <text x="25" y="115" font-family="sans-serif" font-size="14" fill="#94a3b8">• 很多开发者直接把包含 node_modules、dist、.git 的工程丢给 Kimi；</text>
      <text x="25" y="145" font-family="sans-serif" font-size="14" fill="#94a3b8">• 一次文件遍历就吃掉 120,000 Tokens 上下文，等于白白烧钱；</text>
      <text x="25" y="175" font-family="sans-serif" font-size="14" fill="#38bdf8">• 策略：通过 .kimiignore 过滤所有构建产物、依赖库与锁文件；</text>
      <text x="25" y="205" font-family="sans-serif" font-size="14" fill="#4ade80">• 收益：单次 Agent 任务 Prompt 输入减少 60% ~ 80%！</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(670, 0)">
      <rect width="610" height="280" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
      <rect x="25" y="25" width="45" height="45" rx="8" fill="#064e3b"/>
      <text x="47" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#34d399" text-anchor="middle">2</text>
      <text x="85" y="55" font-family="sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">会话定时降温：警惕“长单会话”滚雪球</text>
      <line x1="25" y1="85" x2="585" y2="85" stroke="#1f2937" stroke-width="1"/>
      <text x="25" y="115" font-family="sans-serif" font-size="14" fill="#94a3b8">• 单个会话超过 8 轮后，每一轮对话都要把前面所有历史全部重读一遍；</text>
      <text x="25" y="145" font-family="sans-serif" font-size="14" fill="#94a3b8">• 哪怕你只问了一句“这里加个log”，也会按 180,000 上下文全量计费；</text>
      <text x="25" y="175" font-family="sans-serif" font-size="14" fill="#34d399">• 策略：完成一个功能模块或测试后，立即执行 /clear 或重开窗口；</text>
      <text x="25" y="205" font-family="sans-serif" font-size="14" fill="#4ade80">• 收益：彻底阻断上下文自发性雪崩，延长会话可用寿命 3 倍！</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 310)">
      <rect width="610" height="280" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="25" y="25" width="45" height="45" rx="8" fill="#78350f"/>
      <text x="47" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fbbf24" text-anchor="middle">3</text>
      <text x="85" y="55" font-family="sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">混合双引擎分流：大小模型协同作战</text>
      <line x1="25" y1="85" x2="585" y2="85" stroke="#1f2937" stroke-width="1"/>
      <text x="25" y="115" font-family="sans-serif" font-size="14" fill="#94a3b8">• 绝不杀鸡用牛刀！语法补全、简单注释、格式化由本地轻量模型解决；</text>
      <text x="25" y="145" font-family="sans-serif" font-size="14" fill="#94a3b8">• 把 Kimi Pro 199 昂贵的配额保留给“多文件架构重构与长推理”；</text>
      <text x="25" y="175" font-family="sans-serif" font-size="14" fill="#fbbf24">• 策略：搭配本地 Ollama (Qwen2.5-Coder) 做行内补全，Kimi 做 Agent；</text>
      <text x="25" y="205" font-family="sans-serif" font-size="14" fill="#4ade80">• 收益：每日 Token 消耗直接砍半，无痛支撑 30 天日常开发！</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(670, 310)">
      <rect width="610" height="280" rx="14" fill="#111827" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="25" y="25" width="45" height="45" rx="8" fill="#4c1d95"/>
      <text x="47" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#c084fc" text-anchor="middle">4</text>
      <text x="85" y="55" font-family="sans-serif" font-size="19" font-weight="bold" fill="#f8fafc">错峰波段利用：绕开 5 小时滚动频控死锁</text>
      <line x1="25" y1="85" x2="585" y2="85" stroke="#1f2937" stroke-width="1"/>
      <text x="25" y="115" font-family="sans-serif" font-size="14" fill="#94a3b8">• 5 小时窗口包含 2.5M 阈值，短时间连续重度调用必然触发 429；</text>
      <text x="25" y="145" font-family="sans-serif" font-size="14" fill="#94a3b8">• 策略：将超大型代码审查或端到端测试生成分批切片执行；</text>
      <text x="25" y="175" font-family="sans-serif" font-size="14" fill="#c084fc">• 配合本地 Token Guardian 脚本，在用量到达 75% 时主动暂缓；</text>
      <text x="25" y="205" font-family="sans-serif" font-size="14" fill="#4ade80">• 收益：全天零 429 报错，开发节奏平滑丝滑，拒绝强制冷却！</text>
    </g>
  </g>
</svg>
