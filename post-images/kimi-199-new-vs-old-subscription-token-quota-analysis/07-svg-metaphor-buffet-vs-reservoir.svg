<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="780" fill="url(#bgGrad)"/>
  <text x="700" y="55" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">极简生活化比喻：小学生也能秒懂的 Kimi 额度与频控机制</text>
  <text x="700" y="85" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Everyday Metaphors: Weekly Meal Vouchers vs Shared Debit Card &amp; Giant Reservoir vs Faucet Throttle</text>

  <!-- Metaphor 1: Left -->
  <g transform="translate(60, 120)">
    <rect width="600" height="600" rx="16" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#38bdf8" text-anchor="middle">比喻一：食堂周餐券 vs 全家共享储值卡</text>
    <text x="300" y="75" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">解释：为什么取消周限制后，很多人的额度反而不够用了？</text>

    <!-- Old Plan Card -->
    <g transform="translate(30, 105)">
      <rect width="540" height="210" rx="12" fill="#1e293b" stroke="#3b82f6"/>
      <text x="25" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#60a5fa">【旧 199 模式：学校食堂的“每周伙食券包”】</text>
      <text x="25" y="70" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 每周一发给你 4 张固定的牛肉面券，还带“编程免费续面”特权；</text>
      <text x="25" y="100" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 就算周三特别嘴馋吃撑了，周日没吃完的券作废，下周一又发新券；</text>
      <text x="25" y="130" font-family="sans-serif" font-size="14" fill="#4ade80">• 核心护城河：你绝对不可能在第 1 周把整整一个月的口粮全吃光！</text>
      <text x="25" y="160" font-family="sans-serif" font-size="14" fill="#94a3b8">• 缺点：遇到要请客的暴饮暴食大工程，单周券不够用只能干瞪眼。</text>
    </g>

    <!-- New Plan Card -->
    <g transform="translate(30, 345)">
      <rect width="540" height="225" rx="12" fill="#064e3b" stroke="#10b981"/>
      <text x="25" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#34d399">【新 199 模式：全家人唯一的“共享储值饭卡”】</text>
      <text x="25" y="70" font-family="sans-serif" font-size="14" fill="#e2e8f0">• 不再发按周作废的零碎券了，月初直接打入全月总额 2600 块钱；</text>
      <text x="25" y="100" font-family="sans-serif" font-size="14" fill="#e2e8f0">• 你的写代码大餐、老爸的深度研究咖啡、妹妹的PPT冰激凌全刷这张卡；</text>
      <text x="25" y="130" font-family="sans-serif" font-size="14" fill="#fbbf24">• 优点：自由度极高！周一你想请全班吃一顿 1000 块的豪华海鲜也行；</text>
      <text x="25" y="160" font-family="sans-serif" font-size="14" fill="#f87171">• 致命坑：如果你前 5 天天天山珍海味毫无节制，第 6 天卡里余额变 0，</text>
      <text x="25" y="185" font-family="sans-serif" font-size="14" fill="#f87171">  接下来的 25 天全家只能顿顿喝自来水，或者被迫掏钱买“加油包”！</text>
    </g>
  </g>

  <!-- Metaphor 2: Right -->
  <g transform="translate(740, 120)">
    <rect width="600" height="600" rx="16" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="45" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f59e0b" text-anchor="middle">比喻二：巨型水库蓄水量 vs 水龙头防爆限流阀</text>
    <text x="300" y="75" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">解释：为什么月度额度明明还有 80%，终端却突然报 429 限流？</text>

    <g transform="translate(30, 105)">
      <rect width="540" height="465" rx="12" fill="#1e293b" stroke="#475569"/>
      <text x="25" y="40" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fde047">【双重管道水压控制机制】</text>

      <text x="25" y="85" font-family="sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">1. 屋顶总蓄水库 = 月度统一共享额度池 (26M Tokens)</text>
      <text x="25" y="115" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 代表你整整一个月总共可以放多少升水；</text>
      <text x="25" y="140" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 只要池里还有水，这个月就还能继续用。</text>

      <line x1="25" y1="165" x2="515" y2="165" stroke="#334155" stroke-width="1"/>

      <text x="25" y="200" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fbbf24">2. 厨房水龙头防爆限流阀 = 5小时滚动频控 (2.5M Tokens)</text>
      <text x="25" y="230" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 如果你拿着高压水枪把龙头开到最大，狂放水洗大车；</text>
      <text x="25" y="255" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 管道温度瞬间过热，限流阀会“咔哒”一声强行闭锁！</text>
      <text x="25" y="285" font-family="sans-serif" font-size="14" fill="#f87171">• 这时候就算大水库里还有 90% 的蓄水，龙头也一滴水都流不出来；</text>
      <text x="25" y="310" font-family="sans-serif" font-size="14" fill="#f87171">• 必须静静等待 5 小时管道散热降温，水才会恢复流动。</text>

      <line x1="25" y1="340" x2="515" y2="340" stroke="#334155" stroke-width="1"/>

      <text x="25" y="375" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399">【小学生生活常识启示】</text>
      <text x="25" y="405" font-family="sans-serif" font-size="14" fill="#cbd5e1">• 想细水长流：别一口气连续跑 10 个超长 Agent 任务；</text>
      <text x="25" y="430" font-family="sans-serif" font-size="14" fill="#4ade80">• 跑完一段就关水龙头（/clear 刷新上下文），给管道降温！</text>
    </g>
  </g>
</svg>
