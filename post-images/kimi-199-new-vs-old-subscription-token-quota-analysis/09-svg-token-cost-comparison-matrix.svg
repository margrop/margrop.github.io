<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="750" fill="url(#bgGrad)"/>
  <text x="700" y="55" font-family="sans-serif" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle">每 1000 万 Token 综合实际成本全网大横评 (折合人民币 RMB)</text>
  <text x="700" y="85" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Effective Cost per 10 Million Tokens: Subscription Tiers vs Official Cloud APIs</text>

  <!-- Bars Container -->
  <g transform="translate(100, 140)">
    <!-- Y Axis Labels -->
    <line x1="280" y1="20" x2="280" y2="480" stroke="#334155" stroke-width="2"/>
    <line x1="280" y1="480" x2="1200" y2="480" stroke="#334155" stroke-width="2"/>

    <!-- Grid lines -->
    <line x1="464" y1="20" x2="464" y2="480" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="464" y="510" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">¥80</text>

    <line x1="648" y1="20" x2="648" y2="480" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="648" y="510" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">¥160</text>

    <line x1="832" y1="20" x2="832" y2="480" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="832" y="510" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">¥240</text>

    <line x1="1016" y1="20" x2="1016" y2="480" stroke="#1e293b" stroke-dasharray="4"/>
    <text x="1016" y="510" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">¥320</text>

    <!-- Item 1: DeepSeek V3 API -->
    <g transform="translate(0, 35)">
      <text x="260" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="end">DeepSeek V3 (官方API缓存)</text>
      <rect x="282" y="10" width="28" height="32" rx="6" fill="#0284c7"/>
      <text x="320" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">¥12.0 / 1000万</text>
    </g>

    <!-- Item 2: Old 199 Allegretto -->
    <g transform="translate(0, 115)">
      <text x="260" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6ee7b7" text-anchor="end">旧 199 套餐 (含20x Code红利)</text>
      <rect x="282" y="10" width="92" height="32" rx="6" fill="#059669"/>
      <text x="385" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#34d399">¥39.8 / 1000万 (极致甜点)</text>
    </g>

    <!-- Item 3: New 199 Pro -->
    <g transform="translate(0, 195)">
      <text x="260" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fde047" text-anchor="end">新 199 套餐 (Pro 月共享大池)</text>
      <rect x="282" y="10" width="176" height="32" rx="6" fill="#d97706"/>
      <text x="470" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">¥76.5 / 1000万 (涨幅约92%)</text>
    </g>

    <!-- Item 4: Moonshot API -->
    <g transform="translate(0, 275)">
      <text x="260" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="end">Moonshot K1.5 (官方按量API)</text>
      <rect x="282" y="10" width="414" height="32" rx="6" fill="#64748b"/>
      <text x="710" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">¥180.0 / 1000万</text>
    </g>

    <!-- Item 5: OpenAI GPT-4o -->
    <g transform="translate(0, 355)">
      <text x="260" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="end">OpenAI GPT-4o (混合平均)</text>
      <rect x="282" y="10" width="483" height="32" rx="6" fill="#475569"/>
      <text x="780" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">¥210.0 / 1000万</text>
    </g>

    <!-- Item 6: Claude 3.5 Sonnet -->
    <g transform="translate(0, 435)">
      <text x="260" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#cbd5e1" text-anchor="end">Claude 3.5 Sonnet (API按量)</text>
      <rect x="282" y="10" width="736" height="32" rx="6" fill="#dc2626"/>
      <text x="1030" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fca5a5">¥320.0 / 1000万</text>
    </g>
  </g>

  <!-- Summary Callout -->
  <g transform="translate(100, 660)">
    <rect width="1200" height="65" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="30" y="38" font-family="sans-serif" font-size="14" fill="#cbd5e1">💡 <tspan font-weight="bold" fill="#34d399">硬核算账小结：</tspan> 虽说新 199 折算单价从 ￥39.8 攀升到 ￥76.5（单位成本上浮接近一倍），但相比官方 API 按量计费（￥180/千万）依然便宜了 57% 以上！依然是高性价比选择，但再也经不起盲目挥霍。</text>
  </g>
</svg>
