<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold" letter-spacing="1">OpenAI dots 全自主智能体系统架构与双轨运行全景</text>
  <text x="600" y="80" text-anchor="middle" fill="#9ca3af" font-size="15">GPT-6 Astra 核心大脑 + 独享云端计算机沙箱 + WebMCP 跨应用总线 + 本地 Codex 互通桥梁</text>

  <!-- Layer 1: Core Brain (GPT-6 Astra / Sol) -->
  <g transform="translate(80, 110)">
    <rect width="1040" height="110" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="16" width="220" height="34" rx="6" fill="url(#brainGrad)"/>
    <text x="130" y="39" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">🧠 核心规划大脑 (Reasoning)</text>
    
    <g transform="translate(260, 20)">
      <rect width="240" height="70" rx="8" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <text x="120" y="30" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="bold">GPT-6 Astra</text>
      <text x="120" y="52" text-anchor="middle" fill="#a5b4fc" font-size="12">最强对齐模型 / 视觉 CoT / 长程规划</text>
    </g>

    <g transform="translate(520, 20)">
      <rect width="240" height="70" rx="8" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <text x="120" y="30" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="bold">GPT-6.1 Sol (轻量分级)</text>
      <text x="120" y="52" text-anchor="middle" fill="#a5b4fc" font-size="12">仅需 Astra 1/5 资费 / 专业代码与日常执行</text>
    </g>

    <g transform="translate(780, 20)">
      <rect width="240" height="70" rx="8" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
      <text x="120" y="30" text-anchor="middle" fill="#e0e7ff" font-size="15" font-weight="bold">Decisions API (毫秒勾选)</text>
      <text x="120" y="52" text-anchor="middle" fill="#a5b4fc" font-size="12">多选题预设选项 / 极速分支路由</text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <line x1="600" y1="220" x2="600" y2="250" stroke="#6366f1" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="600,255 595,245 605,245" fill="#6366f1"/>

  <!-- Layer 2: Dedicated Cloud Computer Sandbox -->
  <g transform="translate(80, 260)">
    <rect width="1040" height="150" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="20" y="16" width="260" height="34" rx="6" fill="url(#cloudGrad)"/>
    <text x="150" y="39" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">☁️ 独享云端计算机 (Cloud Computer)</text>

    <g transform="translate(20, 65)">
      <rect width="230" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="115" y="30" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">🖥️ 独立 Linux 沙箱容器</text>
      <text x="115" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">24/7 离线守护进程与持久状态</text>
    </g>

    <g transform="translate(270, 65)">
      <rect width="230" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="115" y="30" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">🌐 Headless Browser 引擎</text>
      <text x="115" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">网页比价 / 数据爬取 / 表单填报</text>
    </g>

    <g transform="translate(520, 65)">
      <rect width="230" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="115" y="30" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">⚙️ Codex Cloud 运行时</text>
      <text x="115" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">全栈构建 / 测试跑通 / Git 分支推送</text>
    </g>

    <g transform="translate(770, 65)">
      <rect width="250" height="70" rx="8" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
      <text x="125" y="30" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="bold">🛡️ 人工审批门禁 (HITL)</text>
      <text x="125" y="52" text-anchor="middle" fill="#f87171" font-size="12">破坏性写操作 / 支付需二次确认</text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <line x1="360" y1="410" x2="360" y2="445" stroke="#0284c7" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="360,450 355,440 365,440" fill="#0284c7"/>

  <line x1="840" y1="410" x2="840" y2="445" stroke="#0284c7" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="840,450 835,440 845,440" fill="#0284c7"/>

  <!-- Layer 3: Split execution - Left: 4000+ Apps via WebMCP, Right: Local Laptop Codex Bridge -->
  <g transform="translate(80, 455)">
    <!-- Left Box: WebMCP Apps -->
    <rect width="500" height="210" rx="14" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="20" y="16" width="260" height="32" rx="6" fill="url(#mcpGrad)"/>
    <text x="150" y="38" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">🔌 WebMCP 跨应用生态 (4000+)</text>
    
    <g transform="translate(20, 65)">
      <rect width="140" height="55" rx="6" fill="#27272a"/>
      <text x="70" y="26" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="bold">💬 Slack / Teams</text>
      <text x="70" y="44" text-anchor="middle" fill="#a1a1aa" font-size="11">群内@直接代办任务</text>

      <rect x="160" width="140" height="55" rx="6" fill="#27272a"/>
      <text x="230" y="26" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="bold">🐙 GitHub / Git</text>
      <text x="230" y="44" text-anchor="middle" fill="#a1a1aa" font-size="11">自动建分支与提 PR</text>

      <rect x="320" width="140" height="55" rx="6" fill="#27272a"/>
      <text x="390" y="26" text-anchor="middle" fill="#fef08a" font-size="13" font-weight="bold">📑 Notion / Sheets</text>
      <text x="390" y="44" text-anchor="middle" fill="#a1a1aa" font-size="11">文档与看板动态同步</text>
    </g>

    <text x="250" y="155" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">🌟 结构化协议调用，告别脆弱的屏幕截屏识别</text>
    <text x="250" y="180" text-anchor="middle" fill="#a1a1aa" font-size="12">比传统 Computer Use 降低 70% 延迟与 80% Token 消耗</text>
  </g>

  <g transform="translate(620, 455)">
    <!-- Right Box: Local Laptop Bridge -->
    <rect width="500" height="210" rx="14" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="20" y="16" width="260" height="32" rx="6" fill="#059669"/>
    <text x="150" y="38" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">💻 本地开发设备打通 (Codex Remote)</text>

    <g transform="translate(20, 65)">
      <rect width="215" height="55" rx="6" fill="#27272a"/>
      <text x="107" y="26" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">📱 iPhone 模拟器联动</text>
      <text x="107" y="44" text-anchor="middle" fill="#a1a1aa" font-size="11">本地拉起 Xcode/iOS 预览</text>

      <rect x="245" width="215" height="55" rx="6" fill="#27272a"/>
      <text x="352" y="26" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">🔒 本地安全执行沙箱</text>
      <text x="352" y="44" text-anchor="middle" fill="#a1a1aa" font-size="11">只放通指定目录与安全指令</text>
    </g>

    <text x="250" y="155" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">三端原生守护探针：Windows 11 / Ubuntu 26.04 / macOS 26</text>
    <text x="250" y="180" text-anchor="middle" fill="#a1a1aa" font-size="12">一键自动化环境就绪性验证与 WebMCP 本地服务启动</text>
  </g>
</svg>