<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f9fafb" font-size="26" font-weight="bold" letter-spacing="1">跨平台 dots 自动化管理与连接守护探针工作流</text>
  <text x="600" y="75" text-anchor="middle" fill="#9ca3af" font-size="14">Windows 11 (PowerShell 7) · Ubuntu 26.04 (Bash) · macOS 26 (Zsh) 零外部依赖统一标准</text>

  <!-- 4 Step Boxes -->
  <g transform="translate(60, 110)">
    <!-- Step 1 -->
    <rect width="250" height="230" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="220" height="32" rx="6" fill="url(#stepGrad)"/>
    <text x="125" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">第 1 步：环境就绪自检</text>
    <text x="25" y="75" fill="#e2e8f0" font-size="13" font-weight="bold">🔍 运行基底检查</text>
    <text x="25" y="100" fill="#94a3b8" font-size="12">• 校验 Node / Python3 / Curl</text>
    <text x="25" y="125" fill="#94a3b8" font-size="12">• 检查 Git 与 SSH 密钥状态</text>
    <text x="25" y="150" fill="#94a3b8" font-size="12">• 注入桌面 UA 绕过移动端拦截</text>
    <rect x="15" y="180" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="125" y="202" text-anchor="middle" fill="#60a5fa" font-size="12" font-family="monospace">Desktop Bypass Ready</text>
  </g>

  <g transform="translate(340, 110)">
    <!-- Step 2 -->
    <rect width="250" height="230" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="15" y="15" width="220" height="32" rx="6" fill="#7c3aed"/>
    <text x="125" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">第 2 步：API 延迟基准测速</text>
    <text x="25" y="75" fill="#e2e8f0" font-size="13" font-weight="bold">⚡ 端点 TTFT 探测</text>
    <text x="25" y="100" fill="#94a3b8" font-size="12">• Astra (GPT-6) 响应延迟基线</text>
    <text x="25" y="125" fill="#94a3b8" font-size="12">• Sol 6.1 高性价比路由校验</text>
    <text x="25" y="150" fill="#94a3b8" font-size="12">• Ultrafast 300 t/s 极速通道</text>
    <rect x="15" y="180" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="125" y="202" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="monospace">Latency &lt; 260ms (OK)</text>
  </g>

  <g transform="translate(620, 110)">
    <!-- Step 3 -->
    <rect width="250" height="230" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="15" width="220" height="32" rx="6" fill="#d97706"/>
    <text x="125" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">第 3 步：WebMCP 本地桥接</text>
    <text x="25" y="75" fill="#e2e8f0" font-size="13" font-weight="bold">🔌 协议网关握手</text>
    <text x="25" y="100" fill="#94a3b8" font-size="12">• 绑定 127.0.0.1 安全环回口</text>
    <text x="25" y="125" fill="#94a3b8" font-size="12">• JSON-RPC 2.0 握手健康探测</text>
    <text x="25" y="150" fill="#94a3b8" font-size="12">• 目录映射隔离与只读权限沙箱</text>
    <rect x="15" y="180" width="220" height="34" rx="6" fill="#0f172a"/>
    <text x="125" y="202" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="monospace">RPC Handshake 200 OK</text>
  </g>

  <g transform="translate(900, 110)">
    <!-- Step 4 -->
    <rect width="240" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="210" height="32" rx="6" fill="#059669"/>
    <text x="120" y="36" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">第 4 步：双模执行输出</text>
    <text x="25" y="75" fill="#e2e8f0" font-size="13" font-weight="bold">🚀 执行范式切换</text>
    <text x="25" y="100" fill="#94a3b8" font-size="12">• 人工交互模式：全彩终端指示</text>
    <text x="25" y="125" fill="#94a3b8" font-size="12">• Agent 自动化模式：结构化 JSON</text>
    <text x="25" y="150" fill="#94a3b8" font-size="12">• 自动写入环境与守护进程</text>
    <rect x="15" y="180" width="210" height="34" rx="6" fill="#0f172a"/>
    <text x="120" y="202" text-anchor="middle" fill="#34d399" font-size="12" font-family="monospace">Exit Code 0 (Success)</text>
  </g>

  <!-- Bottom Platform Cards -->
  <g transform="translate(60, 370)">
    <rect width="1080" height="240" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="38" fill="#f8fafc" font-size="18" font-weight="bold">💻 三大主流平台原生脚本与无缝落地落地指南</text>
    
    <!-- Win11 -->
    <g transform="translate(30, 60)">
      <rect width="320" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="20" y="30" fill="#38bdf8" font-size="15" font-weight="bold">🪟 Windows 11 (PowerShell 7+)</text>
      <text x="20" y="55" fill="#94a3b8" font-size="12">脚本：openai_dots_toolkit_windows11.ps1</text>
      <text x="20" y="78" fill="#cbd5e1" font-size="12">人工运行：.\openai_dots_toolkit_windows11.ps1</text>
      <text x="20" y="100" fill="#a78bfa" font-size="12">Agent 编排：-Mode Agent -AutoFix</text>
      <text x="20" y="125" fill="#34d399" font-size="11">特性：系统注册表与用户级环境变量自动同步</text>
    </g>

    <!-- Ubuntu 26.04 -->
    <g transform="translate(380, 60)">
      <rect width="320" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="20" y="30" fill="#fb923c" font-size="15" font-weight="bold">🐧 Ubuntu 26.04 LTS (Bash)</text>
      <text x="20" y="55" fill="#94a3b8" font-size="12">脚本：openai_dots_toolkit_ubuntu2604.sh</text>
      <text x="20" y="78" fill="#cbd5e1" font-size="12">人工运行：bash openai_dots_toolkit_ubuntu2604.sh</text>
      <text x="20" y="100" fill="#a78bfa" font-size="12">Agent 编排：--agent --format=json</text>
      <text x="20" y="125" fill="#34d399" font-size="11">特性：systemd 用户服务单元自动生成与自愈</text>
    </g>

    <!-- macOS 26 -->
    <g transform="translate(730, 60)">
      <rect width="320" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="20" y="30" fill="#a855f7" font-size="15" font-weight="bold">🍎 macOS 26 Tahoe (Zsh)</text>
      <text x="20" y="55" fill="#94a3b8" font-size="12">脚本：openai_dots_toolkit_macos26.zsh</text>
      <text x="20" y="78" fill="#cbd5e1" font-size="12">人工运行：zsh openai_dots_toolkit_macos26.zsh</text>
      <text x="20" y="100" fill="#a78bfa" font-size="12">Agent 编排：--agent --non-interactive</text>
      <text x="20" y="125" fill="#34d399" font-size="11">特性：launchd 守护进程与钥匙串安全联动</text>
    </g>
  </g>
</svg>