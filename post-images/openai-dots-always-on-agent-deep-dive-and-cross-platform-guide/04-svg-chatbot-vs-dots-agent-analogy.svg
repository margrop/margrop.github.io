<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="cardLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <!-- Top Title -->
  <text x="600" y="55" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold" letter-spacing="1">日常大比方：传统 Chatbot 问答摊位 vs OpenAI dots 住家全能管家</text>
  <text x="600" y="88" text-anchor="middle" fill="#9ca3af" font-size="16">小学生秒懂：从“你给钱我动嘴的单次买卖”到“自带云端电脑的24小时长程独立办事员”</text>

  <!-- Left Card: Chatbot -->
  <g transform="translate(60, 120)">
    <rect width="510" height="510" rx="16" fill="url(#cardLeft)" stroke="#374151" stroke-width="1.5"/>
    <rect x="25" y="25" width="460" height="42" rx="8" fill="#374151" opacity="0.6"/>
    <text x="255" y="52" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">🏫 传统 Chatbot（学校门口代写作业小摊）</text>

    <!-- Point 1 -->
    <g transform="translate(25, 90)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">1</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">交互模式：被动单轮问答（乒乓球对打）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">你提一句它回一段；你不按发送键，它原地发呆绝不动弹。</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(25, 170)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">2</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">生命周期：浏览器关掉即失忆（临时过客）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">一旦关闭网页或手机黑屏，上下文彻底终结，绝不保留长期状态。</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(25, 250)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">3</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">行动能力：只出谋划策，跑腿全靠你</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">给你写好旅游攻略或代码，发邮件、改文件、提 PR 依然要你手动做。</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(25, 330)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">4</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">工具孤岛：封闭网页对话框</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">无法与同事在 Slack/Teams 中共同@它，无法直接操控你的开发环境。</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="25" y="425" width="460" height="60" rx="8" fill="#450a0a" stroke="#7f1d1d" stroke-width="1"/>
    <text x="255" y="452" text-anchor="middle" fill="#fca5a5" font-size="14" font-weight="bold">读者痛点：“动嘴皮子的诸葛亮，干苦力的依然是我”</text>
    <text x="255" y="472" text-anchor="middle" fill="#f87171" font-size="13">长程任务频繁中断，重构代码需人工反复盯盘复制粘贴</text>
  </g>

  <!-- Right Card: Dots Agent -->
  <g transform="translate(630, 120)">
    <rect width="510" height="510" rx="16" fill="url(#cardRight)" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="25" y="25" width="460" height="42" rx="8" fill="#312e81" opacity="0.6"/>
    <text x="255" y="52" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">🤖 OpenAI dots（自带云端电脑的住家大管家）</text>

    <!-- Point 1 -->
    <g transform="translate(25, 90)">
      <circle cx="15" cy="18" r="12" fill="#0284c7" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">1</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">交互模式：目标自驱与主动巡检（24/7 Always-On）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">给出一个宏大目标后，它在云端自主分解步骤，晨间主动汇总报告。</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(25, 170)">
      <circle cx="15" cy="18" r="12" fill="#0284c7" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">2</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">生命周期：专属云端电脑沙箱（关灯睡觉也在干活）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">运行在独立云端计算机，关掉手机、拔掉网线，后台任务依然按部就班。</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(25, 250)">
      <circle cx="15" cy="18" r="12" fill="#0284c7" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f3f4f6" font-size="16" font-weight="bold">行动能力：全流程自主代劳（查依赖、改代码、提PR）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">连接 4000+ 企业软件，调用 Codex 编译测试，重大决策才弹窗请示。</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(25, 330)">
      <circle cx="15" cy="18" r="12" fill="#0284c7" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f3f4f6" font-size="16" font-weight="bold">协同工作：ChatGPT Space 与 Slack 团队实体</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">拥有独立数字形象与身份，全团队可在 Space 中像共享文档一样协同。</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="25" y="425" width="460" height="60" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="255" y="452" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="bold">体验跃迁：“从雇佣兼职小时工，到签约全职数字合伙人”</text>
    <text x="255" y="472" text-anchor="middle" fill="#38bdf8" font-size="13">长达 8~16 小时任务零人工干预成功率跃升至 35%</text>
  </g>
</svg>