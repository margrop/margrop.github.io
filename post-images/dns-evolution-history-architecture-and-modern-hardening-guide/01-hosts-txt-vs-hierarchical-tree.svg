<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" fill="url(#bg1)" rx="16"/>
  <rect x="1" y="1" width="1198" height="648" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <text x="600" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">
    网络命名机制的历史分野：中心化 HOSTS.TXT vs 分布式树状 DNS
  </text>
  <text x="600" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">
    从 1970 年代斯坦福 SRI-NIC 集中式人工维护，到 1983 年 Paul Mockapetris 提出的层次化架构
  </text>

  <!-- Left Box: SRI-NIC Centralized HOSTS.TXT -->
  <g transform="translate(60, 130)">
    <rect width="510" height="470" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2"/>
    <rect width="510" height="50" rx="14" fill="#991b1b"/>
    <text x="255" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#fef2f2">
      前世：1970s~1983 中心化 HOSTS.TXT
    </text>

    <!-- Content -->
    <g transform="translate(30, 80)" font-family="monospace" font-size="14" fill="#fca5a5">
      <rect width="450" height="150" rx="8" fill="#1f2937" stroke="#374151"/>
      <text x="15" y="30" fill="#94a3b8"># SRI-NIC HOSTS.TXT (人工电话/FTP分发)</text>
      <text x="15" y="60" fill="#f87171">10.0.*.*     SRI-NIC     # 斯坦福网络中心</text>
      <text x="15" y="90" fill="#f87171">10.1.*.*     MIT-MULTICS # 麻省理工学院</text>
      <text x="15" y="120" fill="#f87171">10.2.*.*     UTAH-10     # 犹他大学计算节点</text>
    </g>

    <!-- Bottlenecks -->
    <g transform="translate(30, 260)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e2e8f0">
      <text y="20" font-weight="700" fill="#f87171">致命缺陷与瓶颈：</text>
      <text y="50" fill="#cbd5e1">1. <tspan font-weight="600" fill="#fca5a5">单点故障与网络瘫痪：</tspan>SRI-NIC 宕机，全网无法更新</text>
      <text y="80" fill="#cbd5e1">2. <tspan font-weight="600" fill="#fca5a5">周五流量雪崩：</tspan>全美所有节点每周五 FTP 拖拽大文件</text>
      <text y="110" fill="#cbd5e1">3. <tspan font-weight="600" fill="#fca5a5">命名冲突严重：</tspan>扁平命名空间，名字撞车只能人工协调</text>
      <text y="140" fill="#cbd5e1">4. <tspan font-weight="600" fill="#fca5a5">无法自主管理：</tspan>改一个内部主机名需要向斯坦福打报告</text>
      <text y="170" fill="#cbd5e1">5. <tspan font-weight="600" fill="#fca5a5">扩展性归零：</tspan>节点过千后，纸带与文本体积指数膨胀</text>
    </g>
  </g>

  <!-- Right Box: Modern Hierarchical Tree DNS -->
  <g transform="translate(630, 130)">
    <rect width="510" height="470" rx="14" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="510" height="50" rx="14" fill="#065f46"/>
    <text x="255" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="700" fill="#ecfdf5">
      今生：1983~至今 分布式树状 DNS (RFC 1034/1035)
    </text>

    <!-- Mini tree diagram -->
    <g transform="translate(30, 80)">
      <rect width="450" height="150" rx="8" fill="#1f2937" stroke="#374151"/>
      <circle cx="225" cy="30" r="16" fill="#059669"/>
      <text x="225" y="36" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#ffffff">.</text>
      <line x1="225" y1="46" x2="120" y2="85" stroke="#10b981" stroke-width="2"/>
      <line x1="225" y1="46" x2="225" y2="85" stroke="#10b981" stroke-width="2"/>
      <line x1="225" y1="46" x2="330" y2="85" stroke="#10b981" stroke-width="2"/>
      
      <rect x="85" y="85" width="70" height="26" rx="6" fill="#047857"/>
      <text x="120" y="103" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff">.com</text>
      <rect x="190" y="85" width="70" height="26" rx="6" fill="#047857"/>
      <text x="225" y="103" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff">.net</text>
      <rect x="295" y="85" width="70" height="26" rx="6" fill="#047857"/>
      <text x="330" y="103" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffffff">.org</text>

      <line x1="120" y1="111" x2="75" y2="135" stroke="#34d399" stroke-width="1.5"/>
      <line x1="120" y1="111" x2="165" y2="135" stroke="#34d399" stroke-width="1.5"/>
      <text x="75" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#a7f3d0">google</text>
      <text x="165" y="145" text-anchor="middle" font-family="monospace" font-size="11" fill="#a7f3d0">github</text>
    </g>

    <!-- Advantages -->
    <g transform="translate(30, 260)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#e2e8f0">
      <text y="20" font-weight="700" fill="#34d399">核心架构突破：</text>
      <text y="50" fill="#cbd5e1">1. <tspan font-weight="600" fill="#6ee7b7">层级分权（Zone Delegation）：</tspan>各级域自主运维，互不影响</text>
      <text y="80" fill="#cbd5e1">2. <tspan font-weight="600" fill="#6ee7b7">高可用 Anycast 根集群：</tspan>13 个 IP 背后数千台镜像无缝冗余</text>
      <text y="110" fill="#cbd5e1">3. <tspan font-weight="600" fill="#6ee7b7">TTL 局部缓存：</tspan>95%+ 解析在客户端或本地递归内毫秒命中</text>
      <text y="140" fill="#cbd5e1">4. <tspan font-weight="600" fill="#6ee7b7">无限平滑扩容：</tspan>支撑全球数十亿网民与数百亿 IoT/云实例</text>
      <text y="170" fill="#cbd5e1">5. <tspan font-weight="600" fill="#6ee7b7">协议持续演进：</tspan>从 UDP 53 到 DNSSEC、DoT、DoH 与 DoQ</text>
    </g>
  </g>
</svg>
