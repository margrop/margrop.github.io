<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#spaceBg)"/>

  <!-- Cybernetic Grid & Rings -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <circle cx="800" cy="450" r="180" fill="none" stroke-dasharray="6,8"/>
    <circle cx="800" cy="450" r="320" fill="none" stroke-dasharray="12,12"/>
    <circle cx="800" cy="450" r="460" fill="none" stroke-dasharray="16,16"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
  </g>

  <!-- Title Badge & Typography -->
  <g transform="translate(800, 110)" text-anchor="middle">
    <rect x="-180" y="-32" width="360" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" letter-spacing="2">
      RFC 882 · RFC 1034/1035 · RFC 8484 · RFC 9250
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="1">
      DNS 的前世今生：互联网的数字罗盘与神经中枢
    </text>
    <text y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" fill="#94a3b8">
      从手工抄写纸带 HOSTS.TXT 到撑起百亿终端的全球分布式超级目录与下一代加密防劫持
    </text>
  </g>

  <!-- Hierarchical Tree Links -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.6" fill="none">
    <!-- Root to TLDs -->
    <path d="M800,340 C800,410 400,430 400,500"/>
    <path d="M800,340 C800,410 600,430 600,500"/>
    <path d="M800,340 C800,410 800,430 800,500"/>
    <path d="M800,340 C800,410 1000,430 1000,500"/>
    <path d="M800,340 C800,410 1200,430 1200,500"/>

    <!-- TLDs to SLDs -->
    <path d="M400,560 C400,620 280,640 280,700"/>
    <path d="M400,560 C400,620 440,640 440,700"/>
    <path d="M800,560 C800,620 720,640 720,700"/>
    <path d="M800,560 C800,620 880,640 880,700"/>
    <path d="M1200,560 C1200,620 1120,640 1120,700"/>
    <path d="M1200,560 C1200,620 1320,640 1320,700"/>
  </g>

  <!-- Root Node (The Root .) -->
  <g transform="translate(800, 340)" filter="url(#glow)">
    <circle r="48" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="3"/>
    <text y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff">.</text>
    <text y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc">Root Zone (13 Anycast)</text>
  </g>

  <!-- TLD Nodes -->
  <g transform="translate(400, 530)">
    <circle r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">.com</text>
  </g>
  <g transform="translate(600, 530)">
    <circle r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">.net</text>
  </g>
  <g transform="translate(800, 530)">
    <circle r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">.org</text>
  </g>
  <g transform="translate(1000, 530)">
    <circle r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">.io</text>
  </g>
  <g transform="translate(1200, 530)">
    <circle r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#f8fafc">.ai</text>
  </g>

  <!-- SLD & Authoritative Leaf Nodes -->
  <g transform="translate(280, 720)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#fde68a">google.com</text>
  </g>
  <g transform="translate(440, 720)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#fde68a">github.com</text>
  </g>
  <g transform="translate(720, 720)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#e9d5ff">ietf.org</text>
  </g>
  <g transform="translate(880, 720)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#e9d5ff">wikipedia.org</text>
  </g>
  <g transform="translate(1120, 720)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#a7f3d0">github.io</text>
  </g>
  <g transform="translate(1320, 720)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#a7f3d0">anthropic.ai</text>
  </g>

  <!-- Bottom Badges: Protocols -->
  <g transform="translate(800, 835)" text-anchor="middle">
    <rect x="-420" y="-22" width="840" height="44" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text y="6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#cbd5e1">
      <tspan fill="#38bdf8" font-weight="700">UDP 53</tspan> 经典明文  ·  
      <tspan fill="#fbbf24" font-weight="700">DNSSEC</tspan> 数字火漆  ·  
      <tspan fill="#a855f7" font-weight="700">DoT / DoH</tspan> 装甲加密  ·  
      <tspan fill="#10b981" font-weight="700">DoQ (QUIC)</tspan> 零阻断多路复用
    </text>
  </g>
</svg>
