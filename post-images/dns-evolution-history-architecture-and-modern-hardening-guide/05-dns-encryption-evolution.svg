<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#111c35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" fill="url(#bg5)" rx="16"/>
  <rect x="1" y="1" width="1198" height="658" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <text x="600" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="700" fill="#f8fafc">
    现代 DNS 加密协议全景对比：从明文裸奔到量子级隐私保护
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94a3b8">
    Classic UDP 53 vs DNSCrypt vs DoT vs DoH vs DoQ (QUIC) vs ODoH
  </text>

  <!-- Table Header -->
  <g transform="translate(40, 110)">
    <rect width="1120" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="120" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">协议代号</text>
    <text x="280" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">端口 &amp; 传输层</text>
    <text x="440" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">加密算法与机制</text>
    <text x="660" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">中间件/防火墙穿透性</text>
    <text x="940" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">优劣势与最佳应用场景</text>
  </g>

  <!-- Row 1: Classic DNS -->
  <g transform="translate(40, 165)">
    <rect width="1120" height="68" rx="8" fill="#111827" stroke="#374151"/>
    <text x="120" y="40" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#ef4444">Classic DNS</text>
    <text x="280" y="40" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">UDP/TCP 53</text>
    <text x="440" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f87171">无加密 (明文裸奔)</text>
    <text x="660" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#f87171">极易被 ISP 监听/劫持/投毒</text>
    <text x="940" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94a3b8">极速低开销，但安全为零；</text>
    <text x="940" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#ef4444">仅用于纯内网环境</text>
  </g>

  <!-- Row 2: DoT -->
  <g transform="translate(40, 245)">
    <rect width="1120" height="68" rx="8" fill="#111827" stroke="#374151"/>
    <text x="120" y="40" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#fbbf24">DoT (RFC 7858)</text>
    <text x="280" y="40" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">TCP 853 (TLS)</text>
    <text x="440" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#fbbf24">TLS 1.2 / 1.3 强加密</text>
    <text x="660" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#fbbf24">专用端口 853，易被路由器封锁</text>
    <text x="940" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#cbd5e1">系统级原生支持 (Android/Linux)；</text>
    <text x="940" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#fde68a">适合操作系统原生安全解析</text>
  </g>

  <!-- Row 3: DoH -->
  <g transform="translate(40, 325)">
    <rect width="1120" height="68" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="40" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#38bdf8">DoH (RFC 8484)</text>
    <text x="280" y="40" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">TCP 443 (HTTPS)</text>
    <text x="440" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#38bdf8">HTTPS / H2 / H3 封装</text>
    <text x="660" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#34d399">极佳！与普通网页流量混淆不可封</text>
    <text x="940" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#cbd5e1">浏览器与应用层标准 (Chrome/Firefox)；</text>
    <text x="940" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#7dd3fc">抗封锁与抗劫持能力最强</text>
  </g>

  <!-- Row 4: DoQ -->
  <g transform="translate(40, 405)">
    <rect width="1120" height="68" rx="8" fill="#111827" stroke="#374151"/>
    <text x="120" y="40" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#a855f7">DoQ (RFC 9250)</text>
    <text x="280" y="40" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">UDP 853 (QUIC)</text>
    <text x="440" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#c084fc">QUIC 原生加密 + 0-RTT</text>
    <text x="660" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">依赖 UDP 853 放行</text>
    <text x="940" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#cbd5e1">无队头阻塞，弱网丢包极速重传；</text>
    <text x="940" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#e9d5ff">移动端蜂窝切换首选</text>
  </g>

  <!-- Row 5: ODoH -->
  <g transform="translate(40, 485)">
    <rect width="1120" height="68" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="40" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#34d399">ODoH (RFC 9230)</text>
    <text x="280" y="40" text-anchor="middle" font-family="monospace" font-size="13" fill="#cbd5e1">HTTPS 443 (Proxy)</text>
    <text x="440" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#34d399">盲代理公私钥双层信封</text>
    <text x="660" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#34d399">绝佳！代理与目标解析器互盲</text>
    <text x="940" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#a7f3d0">IP 与查询内容彻底解耦；</text>
    <text x="940" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6ee7b7">零信任网络与匿名化终极方案</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(600, 600)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">
      架构选型黄金法则：浏览器与桌面优先 <tspan fill="#38bdf8" font-weight="700">DoH</tspan>；移动蜂窝设备首选 <tspan fill="#a855f7" font-weight="700">DoQ</tspan>；隐私极致追求者选型 <tspan fill="#34d399" font-weight="700">ODoH</tspan>。
    </text>
  </g>
</svg>
