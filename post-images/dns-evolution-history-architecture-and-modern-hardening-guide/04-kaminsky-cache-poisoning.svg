<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b0e"/>
      <stop offset="100%" stop-color="#1e1e2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" fill="url(#bg4)" rx="16"/>
  <rect x="1" y="1" width="1198" height="658" fill="none" stroke="#4c1d24" stroke-width="2" rx="15"/>

  <text x="600" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="700" fill="#fecdd3">
    2008 年丹·卡明斯基 (Dan Kaminsky) 经典 DNS 缓存投毒漏洞深度拆解
  </text>
  <text x="600" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#fda4af">
    如何绕过 TTL 限制，用随机不存在子域名在数十秒内篡改整座权威域权威 NS 记录
  </text>

  <!-- Left: The Attack Mechanism -->
  <g transform="translate(60, 120)">
    <rect width="520" height="480" rx="14" fill="#2d1216" stroke="#e11d48" stroke-width="2"/>
    <rect width="520" height="46" rx="14" fill="#9f1239"/>
    <text x="260" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffe4e6">
      致命漏洞机制：生日攻击与伪造权威委派
    </text>

    <g transform="translate(30, 75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#fecdd3">
      <text y="20" font-weight="700" fill="#fb7185">① 传统投毒痛点：</text>
      <text y="45" fill="#e2e8f0">以前黑客只能查 bank.com，一旦猜错 TXID，真实权威返回后</text>
      <text y="70" fill="#cbd5e1">递归器会缓存真实记录几天几夜，黑客必须等待 TTL 过期。</text>

      <text y="110" font-weight="700" fill="#fb7185">② 卡明斯基的天才突破：</text>
      <text y="135" fill="#e2e8f0">向递归器密集发起数万个<tspan fill="#f43f5e" font-weight="700">随机子域查询</tspan>：</text>
      <text y="160" font-family="monospace" fill="#fecdd3">sub001.bank.com, sub002.bank.com ...</text>
      <text y="185" fill="#cbd5e1">每个随机域名都绝对未命中缓存，触发递归器立即向权威发包！</text>

      <text y="225" font-weight="700" fill="#fb7185">③ 狂暴伪造响应包（暴破 16位 TXID）：</text>
      <text y="250" fill="#cbd5e1">黑客并发灌入数千个伪造应答，并在 Authority 节附带：</text>
      <text y="275" font-family="monospace" fill="#f43f5e">Authority Section: bank.com NS = evil-dns.com</text>
      <text y="300" font-family="monospace" fill="#f43f5e">Additional Section: evil-dns.com A = x.x.*.*</text>

      <text y="340" font-weight="700" fill="#fb7185">④ 瞬间攻陷全域：</text>
      <text y="365" fill="#cbd5e1">只要 16 位 TXID (65536 种可能) 猜中任意一个包，</text>
      <text y="390" fill="#fda4af" font-weight="700">整个 bank.com 的所有解析从此全部沦陷并受黑客掌控！</text>
    </g>
  </g>

  <!-- Right: The Fix -->
  <g transform="translate(620, 120)">
    <rect width="520" height="480" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect width="520" height="46" rx="14" fill="#065f46"/>
    <text x="260" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#ecfdf5">
      救赎之道：源端口随机化与 DNSSEC 签名
    </text>

    <g transform="translate(30, 75)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#d1fae5">
      <text y="20" font-weight="700" fill="#34d399">① 源端口随机化 (Source Port Randomization)：</text>
      <text y="45" fill="#e2e8f0">将原本固定的 UDP 53 源端口改为动态随机选择端口。</text>
      <text y="70" fill="#6ee7b7" font-weight="700">熵增空间计算：</text>
      <text y="95" font-family="monospace" fill="#a7f3d0">16-bit TXID × 16-bit UDP Port = 2^32 ≈ 42.9 亿种组合</text>
      <text y="120" fill="#cbd5e1">黑客每秒发包数万，也需要耗费数月甚至数年才能命中一次！</text>

      <text y="160" font-weight="700" fill="#34d399">② 严格 Bailiwick 域边界检查：</text>
      <text y="185" fill="#cbd5e1">递归器严格审查应答：解析 sub.bank.com 时，应答中若声明</text>
      <text y="210" fill="#cbd5e1">接管 .com 或无关域名，直接判定为越权欺诈并丢弃！</text>

      <text y="250" font-weight="700" fill="#34d399">③ 终极防御：DNSSEC 密码学数字火漆印章：</text>
      <text y="275" fill="#cbd5e1">引入非对称公私钥加密链条（RRSIG / DNSKEY / DS）：</text>
      <text y="300" fill="#e2e8f0">- 记录携带权威签名，伪造包没有私钥无法通过校验；</text>
      <text y="325" fill="#e2e8f0">- 从根信任锚点 (Trust Anchor) 一路逐级验证到叶子域。</text>

      <rect x="0" y="360" width="460" height="40" rx="8" fill="#1e293b"/>
      <text x="230" y="385" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
        全球联合发布补丁：互联网历史上最默契的安全大救援
      </text>
    </g>
  </g>
</svg>
