<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#131e32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg3)" rx="16"/>
  <rect x="1" y="1" width="1198" height="698" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <text x="600" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="700" fill="#f8fafc">
    标准 DNS 8步完整递归解析时序流与报文交互
  </text>
  <text x="600" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94a3b8">
    客户端 Stub Resolver 与递归解析器（Recursive Resolver）的完整交互链路 (Port 53 UDP)
  </text>

  <!-- Actors -->
  <g transform="translate(100, 110)">
    <rect width="160" height="46" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">客户端 (Client)</text>
    <line x1="80" y1="46" x2="80" y2="520" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(340, 110)">
    <rect width="180" height="46" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">递归解析器 (Resolver)</text>
    <line x1="90" y1="46" x2="90" y2="520" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(600, 110)">
    <rect width="160" height="46" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#c084fc">根域名服务器 (Root)</text>
    <line x1="80" y1="46" x2="80" y2="520" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(820, 110)">
    <rect width="160" height="46" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#60a5fa">顶级域服务器 (TLD)</text>
    <line x1="80" y1="46" x2="80" y2="520" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(1010, 110)">
    <rect width="160" height="46" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#34d399">权威服务器 (Auth)</text>
    <line x1="80" y1="46" x2="80" y2="520" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Sequence Arrows -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">
    <!-- Step 1 -->
    <g transform="translate(0, 180)">
      <line x1="180" y1="0" x2="420" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <polygon points="425,0 415,-5 415,5" fill="#38bdf8"/>
      <text x="300" y="-8" text-anchor="middle" fill="#7dd3fc">① 递归查询: A? example.com (RD=1)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 225)">
      <line x1="430" y1="0" x2="670" y2="0" stroke="#a855f7" stroke-width="2"/>
      <polygon points="675,0 665,-5 665,5" fill="#a855f7"/>
      <text x="550" y="-8" text-anchor="middle" fill="#d8b4fe">② 迭代查询: A? example.com</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 270)">
      <line x1="680" y1="0" x2="440" y2="0" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,4"/>
      <polygon points="435,0 445,-5 445,5" fill="#a855f7"/>
      <text x="560" y="-8" text-anchor="middle" fill="#d8b4fe">③ 委派应答: Referral -> NS .com (Glue A)</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 315)">
      <line x1="430" y1="0" x2="890" y2="0" stroke="#3b82f6" stroke-width="2"/>
      <polygon points="895,0 885,-5 885,5" fill="#3b82f6"/>
      <text x="660" y="-8" text-anchor="middle" fill="#93c5fd">④ 迭代查询: A? example.com</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(0, 360)">
      <line x1="900" y1="0" x2="440" y2="0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,4"/>
      <polygon points="435,0 445,-5 445,5" fill="#3b82f6"/>
      <text x="670" y="-8" text-anchor="middle" fill="#93c5fd">⑤ 委派应答: Referral -> NS a.iana-servers.net</text>
    </g>

    <!-- Step 6 -->
    <g transform="translate(0, 405)">
      <line x1="430" y1="0" x2="1080" y2="0" stroke="#10b981" stroke-width="2"/>
      <polygon points="1085,0 1075,-5 1075,5" fill="#10b981"/>
      <text x="750" y="-8" text-anchor="middle" fill="#6ee7b7">⑥ 迭代查询: A? example.com</text>
    </g>

    <!-- Step 7 -->
    <g transform="translate(0, 450)">
      <line x1="1090" y1="0" x2="440" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="5,4"/>
      <polygon points="435,0 445,-5 445,5" fill="#10b981"/>
      <text x="760" y="-8" text-anchor="middle" fill="#6ee7b7">⑦ 权威应答: Answer A: x.x.*.* (TTL=3600, AA=1)</text>
    </g>

    <!-- Step 8 -->
    <g transform="translate(0, 495)">
      <line x1="420" y1="0" x2="190" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
      <polygon points="185,0 195,-5 195,5" fill="#38bdf8"/>
      <text x="300" y="-8" text-anchor="middle" fill="#7dd3fc" font-weight="700">⑧ 最终应答返回客户端 (存入本地内存缓存)</text>
    </g>
  </g>

  <!-- Bottom Note -->
  <g transform="translate(600, 650)" text-anchor="middle">
    <rect x="-420" y="-22" width="840" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#94a3b8">
      说明：第 ① ⑧ 步为<tspan fill="#38bdf8" font-weight="700">递归查询</tspan>（必须给出确切 IP）；第 ②~⑦ 步为<tspan fill="#fbbf24" font-weight="700">迭代查询</tspan>（可返回下级服务指针 Referral）。
    </text>
  </g>
</svg>
