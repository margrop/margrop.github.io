<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg2)" rx="16"/>
  <rect x="1" y="1" width="1198" height="678" fill="none" stroke="#334155" stroke-width="2" rx="15"/>

  <text x="600" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">
    小学生秒懂：DNS 就像“外卖小哥跑腿查门牌”的大型协同游戏
  </text>
  <text x="600" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#94a3b8">
    将抽象的递归解析、根域名、顶级域与本地缓存比作日常生活
  </text>

  <!-- Step 1: User / Browser -->
  <g transform="translate(60, 130)">
    <rect width="240" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#0369a1"/>
    <text x="120" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      ① 饥饿的小朋友 (浏览器)
    </text>
    <text x="120" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#cbd5e1">
      “我要去‘好喝奶茶店’！”
    </text>
    <text x="120" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#7dd3fc">
      只知道招牌名字
    </text>
    <text x="120" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">
      不知道门牌经纬度 (IP)
    </text>
  </g>

  <!-- Step 2: Recursive Resolver -->
  <g transform="translate(360, 130)">
    <rect width="480" height="150" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="480" height="38" rx="12" fill="#b45309"/>
    <text x="240" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      ② 尽职的外卖小哥 (本地递归解析器 8.8.*.* / 1.1.*.*)
    </text>
    <text x="240" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#fef3c7">
      小哥翻翻裤兜里的小便签（本地缓存 Cache）：
    </text>
    <text x="240" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">
      “如果 5 分钟内有人问过（TTL 未过期），我直接告诉你门牌！”
    </text>
    <text x="240" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#fde68a">
      “便签上没有？别急，我骑上电瓶车替你满世界去问！”
    </text>
  </g>

  <!-- Step 3: Cache / TTL Notebook -->
  <g transform="translate(900, 130)">
    <rect width="240" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#047857"/>
    <text x="120" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      ③ 倒计时便签本 (TTL)
    </text>
    <text x="120" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#a7f3d0">
      TTL = 300 秒 (5分钟)
    </text>
    <text x="120" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1">
      闹钟一响，便签撕掉
    </text>
    <text x="120" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">
      防止店家搬家找错门
    </text>
  </g>

  <!-- Arrows -->
  <g stroke="#38bdf8" stroke-width="3" fill="none">
    <path d="M300,205 L350,205"/>
    <path d="M840,205 L890,205"/>
  </g>

  <!-- The 3 Inquiry Stops -->
  <g transform="translate(60, 320)">
    <!-- Root -->
    <g transform="translate(0, 0)">
      <rect width="330" height="230" rx="12" fill="#111827" stroke="#a855f7" stroke-width="2"/>
      <rect width="330" height="42" rx="12" fill="#6b21a8"/>
      <text x="165" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
        第一站：国家邮政总局警卫 (根域名 .)
      </text>
      <text x="165" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#e9d5ff">
        小哥：“请问‘好喝奶茶.com’在哪？”
      </text>
      <text x="165" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#f8fafc">
        警卫：“我不知道具体哪家店，”
      </text>
      <text x="165" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc">
        “但我知道‘.com’商业街办事处”
      </text>
      <text x="165" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">
        “出门左转去商业街办事处问！”
      </text>
      <rect x="35" y="185" width="260" height="30" rx="6" fill="#1e293b"/>
      <text x="165" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#d8b4fe">NS 指针: a.gtld-servers.net</text>
    </g>

    <!-- TLD -->
    <g transform="translate(370, 0)">
      <rect width="330" height="230" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
      <rect width="330" height="42" rx="12" fill="#1d4ed8"/>
      <text x="165" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
        第二站：商业街办事处 (顶级域 .com)
      </text>
      <text x="165" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#bfdbfe">
        小哥：“好喝奶茶到底在哪条道上？”
      </text>
      <text x="165" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#f8fafc">
        官员：“好喝奶茶向我们登记了，”
      </text>
      <text x="165" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">
        “他们的专属物业传达室在东区！”
      </text>
      <text x="165" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">
        “去他们的专属物业柜台查！”
      </text>
      <rect x="35" y="185" width="260" height="30" rx="6" fill="#1e293b"/>
      <text x="165" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#93c5fd">NS 指针: ns1.naicha-dns.com</text>
    </g>

    <!-- Auth -->
    <g transform="translate(740, 0)">
      <rect width="340" height="230" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
      <rect width="340" height="42" rx="12" fill="#047857"/>
      <text x="170" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
        第三站：企业物业前台 (权威域名服务器)
      </text>
      <text x="170" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#a7f3d0">
        小哥：“您好！好喝奶茶的收件门牌？”
      </text>
      <text x="170" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" fill="#f8fafc">
        前台小姐姐翻开内部花名册：
      </text>
      <text x="170" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="900" fill="#34d399">
        “A 记录：门牌号是 x.x.*.*！”
      </text>
      <text x="170" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94a3b8">
        小哥记入便签，飞速带回给小朋友！
      </text>
      <rect x="40" y="185" width="260" height="30" rx="6" fill="#1e293b"/>
      <text x="170" y="205" text-anchor="middle" font-family="monospace" font-size="13" fill="#6ee7b7">A: x.x.*.* (TTL=300)</text>
    </g>
  </g>

  <!-- Bottom Flow Summary -->
  <g transform="translate(600, 615)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#fcd34d">
      ★ 核心法则：问路只需一次（迭代问路），小哥抄在本上（缓存）；人人各司其职，没有一个人需要背下全球所有人的电话！
    </text>
  </g>
</svg>
