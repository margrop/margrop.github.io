<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBucket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bgBucket)" rx="16"/>

  <text x="500" y="45" fill="#ffffff" font-size="24" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">The "Weakest Link" Rule of USB &amp; Type-C Performance</text>
  <text x="500" y="75" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">USB 接口速率的“木桶理论”：主板接口 + 传输线缆 + 外设设备，任一短板决定最终结果</text>

  <!-- Box 1: Host Port -->
  <g transform="translate(60, 120)">
    <rect width="260" height="250" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="35" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">① 电脑主板接口 (Host)</text>
    <rect x="25" y="60" width="210" height="70" rx="8" fill="#0f172a"/>
    <text x="130" y="90" fill="#22c55e" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">雷电 4 / USB4</text>
    <text x="130" y="115" fill="#94a3b8" font-size="12" font-family="sans-serif" text-anchor="middle">接口理论带宽: 40 Gbps</text>

    <text x="30" y="160" fill="#e2e8f0" font-size="12" font-family="sans-serif">✓ 配备 PCIe 4.0 控制器</text>
    <text x="30" y="185" fill="#e2e8f0" font-size="12" font-family="sans-serif">✓ 支持 DP 1.4 8K 视频</text>
    <text x="30" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">✓ 支持 100W PD 反向供电</text>
    <text x="130" y="240" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">【超跑级高速车道】</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 335 240 L 365 240" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Box 2: Cable (The Culprit!) -->
  <g transform="translate(370, 120)">
    <rect width="260" height="250" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="3"/>
    <text x="130" y="35" fill="#f87171" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">② 连接线材 (Cable) ⚠️</text>
    <rect x="25" y="60" width="210" height="70" rx="8" fill="#1f1315"/>
    <text x="130" y="90" fill="#f87171" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">普通手机原装充电线</text>
    <text x="130" y="115" fill="#fca5a5" font-size="12" font-family="sans-serif" text-anchor="middle">内部仅焊接 4 根充电/老线</text>

    <text x="30" y="160" fill="#fecaca" font-size="12" font-family="sans-serif">❌ 无高速差分对 (TX/RX)</text>
    <text x="30" y="185" fill="#fecaca" font-size="12" font-family="sans-serif">❌ 无 E-Marker 芯片认证</text>
    <text x="30" y="210" fill="#f87171" font-size="13" font-weight="bold" font-family="sans-serif">⚠️ 协议被锁死在 USB 2.0</text>
    <text x="130" y="240" fill="#ef4444" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">【木桶最短的这根木板】</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 645 240 L 675 240" stroke="#f59e0b" stroke-width="4"/>

  <!-- Box 3: Device -->
  <g transform="translate(680, 120)">
    <rect width="260" height="250" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="35" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">③ 外部存储/外设 (Device)</text>
    <rect x="25" y="60" width="210" height="70" rx="8" fill="#0f172a"/>
    <text x="130" y="90" fill="#22c55e" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">NVMe 移动固态硬盘</text>
    <text x="130" y="115" fill="#94a3b8" font-size="12" font-family="sans-serif" text-anchor="middle">内置读写速度: 2000 MB/s</text>

    <text x="30" y="160" fill="#e2e8f0" font-size="12" font-family="sans-serif">✓ PCIe 3.0x4 满血主控</text>
    <text x="30" y="185" fill="#e2e8f0" font-size="12" font-family="sans-serif">✓ 支持 USB 3.2 Gen 2x2</text>
    <text x="30" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">✓ 理论传输高达 20Gbps</text>
    <text x="130" y="240" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">【高性能跑车外设】</text>
  </g>

  <!-- Result Banner -->
  <g transform="translate(60, 395)">
    <rect width="880" height="95" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="440" y="35" fill="#ffffff" font-size="18" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">最终握手协商结果：降级为 USB 2.0 (480 Mbps / 实际传输仅 35~40 MB/s)</text>
    <text x="440" y="65" fill="#fed7aa" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">生活比喻：你买了一辆时速 300 公里的法拉利（设备），开在十车道的高速公路入口（电脑），</text>
    <text x="440" y="85" fill="#fed7aa" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">中间却架了一座限速 30 公里、只能容纳独轮车的木吊桥（廉价充电线）！</text>
  </g>
</svg>
