    <text x="680.0" y="254" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">B4</text>
    <text x="680.0" y="268" fill="#ffffff" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">VBUS</text>
    
