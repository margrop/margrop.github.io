    <text x="548.0" y="254" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">B6</text>
    <text x="548.0" y="268" fill="#ffffff" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">D+</text>
    
