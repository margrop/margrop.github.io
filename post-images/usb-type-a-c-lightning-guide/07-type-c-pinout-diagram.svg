  <!-- Point-symmetry annotation -->
  <path d="M 400 160 Q 500 130 600 160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <text x="500" y="145" fill="#38bdf8" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">中心点 180° 旋转对称：无论正插还是反插，引脚功能严丝合缝！</text>
