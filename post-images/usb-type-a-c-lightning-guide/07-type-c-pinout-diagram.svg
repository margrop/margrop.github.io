    <text x="614.0" y="254" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">B5</text>
    <text x="614.0" y="268" fill="#ffffff" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">CC2</text>
    
