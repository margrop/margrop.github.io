<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1000" height="520" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Title -->
  <text x="500" y="45" fill="#f8fafc" font-size="24" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">USB Type-C 24-Pin Receptacle Pinout &amp; Symmetry Principle</text>
  <text x="500" y="75" fill="#94a3b8" font-size="14" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Type-C 24 引脚全功能母口定义与 180° 中心对称盲插机制图解</text>

  <!-- Receptacle Oval Outline -->
