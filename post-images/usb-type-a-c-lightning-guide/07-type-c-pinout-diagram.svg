    <text x="878.0" y="254" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">B1</text>
    <text x="878.0" y="268" fill="#ffffff" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">GND</text>
    
  <!-- Legends & Notes -->
  <g transform="translate(60, 390)">
    <!-- Legend Items -->
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#ef4444"/>
    <text x="24" y="13" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">VBUS (供电 5V~48V/5A, 最高 240W)</text>

    <rect x="300" y="0" width="16" height="16" rx="3" fill="#475569"/>
    <text x="324" y="13" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">GND (地线 回路保障)</text>

    <rect x="520" y="0" width="16" height="16" rx="3" fill="#8b5cf6"/>
    <text x="544" y="13" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">CC1/CC2 (配置通道: 侦测正反插/PD协商/线缆角色)</text>

    <rect x="0" y="32" width="16" height="16" rx="3" fill="#22c55e"/>
    <text x="24" y="45" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">D+/D- (兼容 USB 2.0 基础传输 480Mbps)</text>

    <rect x="300" y="32" width="16" height="16" rx="3" fill="#0ea5e9"/>
    <text x="324" y="45" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">TX/RX (超高速差分对: USB 3.2/USB4/DP/雷电数据车道)</text>

    <rect x="740" y="32" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="764" y="45" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">SBU1/2 (辅助边带信号)</text>
