<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="500" fill="url(#bgLightning)" rx="16"/>

  <text x="500" y="45" fill="#ffffff" font-size="24" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Apple Lightning Connector Pinout &amp; MFi Security Architecture</text>
  <text x="500" y="75" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">苹果 Lightning 8 针结构与内置加密芯片/动态触点映射图解</text>

  <!-- Plug Body -->
  <rect x="80" y="140" width="280" height="180" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="360" y="160" width="300" height="140" rx="12" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>

  <!-- 8 Gold Pins -->

    <rect x="390" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="399" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">1</text>
    <text x="399" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">GND</text>
    
    <rect x="420" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="429" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">2</text>
    <text x="429" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">L0p</text>
    
    <rect x="450" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="459" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">3</text>
    <text x="459" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">L0n</text>
    
    <rect x="480" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="489" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">4</text>
    <text x="489" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">ID0</text>
    
    <rect x="510" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="519" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">5</text>
    <text x="519" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">PWR</text>
    
    <rect x="540" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="549" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">6</text>
    <text x="549" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">L1n</text>
    
    <rect x="570" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="579" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">7</text>
    <text x="579" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">L1p</text>
    
    <rect x="600" y="200" width="18" height="60" rx="3" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="609" y="190" fill="#f8fafc" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">8</text>
    <text x="609" y="280" fill="#0f172a" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">ID1</text>
    
  <!-- Plug Internal Anatomy (MFi Chip) -->
  <rect x="110" y="165" width="220" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="130" y="185" width="80" height="90" rx="4" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
  <text x="170" y="225" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">MFi</text>
  <text x="170" y="245" fill="#f8fafc" font-size="10" font-family="sans-serif" text-anchor="middle">认证安全芯片</text>
  <text x="170" y="260" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">(BQ2025等)</text>

  <rect x="230" y="185" width="85" height="90" rx="4" fill="#334155" stroke="#e2e8f0" stroke-width="1"/>
  <text x="272" y="225" fill="#f59e0b" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">MUX</text>
  <text x="272" y="245" fill="#f8fafc" font-size="10" font-family="sans-serif" text-anchor="middle">模拟开关芯片</text>
  <text x="272" y="260" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">(动态引脚重定向)</text>

  <!-- Explanation card right side -->
  <rect x="690" y="135" width="280" height="190" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="710" y="165" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">Lightning 技术核心机制：</text>
  <text x="710" y="195" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">• 动态引脚切换：正反插入由内部</text>
  <text x="725" y="215" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">MUX 芯片根据握手电平调换引脚</text>
  <text x="710" y="245" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">• 物理针脚仅 8 针：上限锁死在</text>
  <text x="725" y="265" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">USB 2.0 (480Mbps)，无法升级高速</text>
  <text x="710" y="295" fill="#e2e8f0" font-size="13" font-family="system-ui, sans-serif">• MFi 加密校验：握手失败即弹窗</text>
  <text x="725" y="315" fill="#f87171" font-size="12" font-family="system-ui, sans-serif">“此配件可能不受支持”</text>

  <!-- Bottom Comparison -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="840" height="100" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="20" y="30" fill="#eab308" font-size="14" font-weight="bold" font-family="sans-serif">【为什么落后被汰？】</text>
    <text x="20" y="60" fill="#94a3b8" font-size="13" font-family="sans-serif">1. 传输速度只有 480Mbps：录制 1 小时 4K ProRes 视频（~200GB），导到电脑需要 1.5 小时！</text>
    <text x="20" y="85" fill="#94a3b8" font-size="13" font-family="sans-serif">2. 供电瓶颈：针脚纤细且间距狭小，极限承载通常不超过 3A/27W，完全无法支持百瓦级 PD 快充。</text>
  </g>
</svg>
