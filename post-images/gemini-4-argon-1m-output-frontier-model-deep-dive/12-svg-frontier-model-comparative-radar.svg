  <text x="730" y="210" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12" font-weight="bold">ARGON</text>
  <text x="870" y="210" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12" font-weight="bold">GPT-6 ASTRA</text>
  <text x="1010" y="210" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12" font-weight="bold">OPUS 5.5</text>
  <line x1="550" y1="222" x2="1130" y2="222" stroke="#334155" stroke-width="1"/>

  <!-- Rows -->
  <g font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">
    <!-- Row 1 -->
