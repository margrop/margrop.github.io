    <text x="730" y="250" fill="#34d399" font-weight="bold">1,000,000</text>
    <text x="870" y="250" fill="#cbd5e1">128,000</text>
    <text x="1010" y="250" fill="#cbd5e1">64,000</text>
    <line x1="550" y1="265" x2="1130" y2="265" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="550" y="295" fill="#e2e8f0" font-weight="bold">DeepSWE v1.1</text>
    <text x="730" y="295" fill="#34d399" font-weight="bold">77.9% (SOTA)</text>
    <text x="870" y="295" fill="#cbd5e1">73.2%</text>
    <text x="1010" y="295" fill="#cbd5e1">71.8%</text>
    <line x1="550" y1="310" x2="1130" y2="310" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="550" y="340" fill="#e2e8f0" font-weight="bold">CWE-bench v1</text>
    <text x="730" y="340" fill="#34d399" font-weight="bold">68.0% (SOTA)</text>
    <text x="870" y="340" fill="#cbd5e1">59.4%</text>
    <text x="1010" y="340" fill="#cbd5e1">57.2%</text>
    <line x1="550" y1="355" x2="1130" y2="355" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 4 -->
    <text x="550" y="385" fill="#e2e8f0" font-weight="bold">LVBench (Long Video)</text>
    <text x="730" y="385" fill="#34d399" font-weight="bold">84.3% (SOTA)</text>
    <text x="870" y="385" fill="#cbd5e1">76.1%</text>
    <text x="1010" y="385" fill="#cbd5e1">72.4%</text>
    <line x1="550" y1="400" x2="1130" y2="400" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 5 -->
    <text x="550" y="430" fill="#e2e8f0" font-weight="bold">Input Pricing / 1M</text>
    <text x="730" y="430" fill="#34d399" font-weight="bold">$2.00 (Intro)</text>
    <text x="870" y="430" fill="#cbd5e1">$5.00</text>
    <text x="1010" y="430" fill="#cbd5e1">$15.00</text>
    <line x1="550" y1="445" x2="1130" y2="445" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 6 -->
    <text x="550" y="475" fill="#e2e8f0" font-weight="bold">Output Pricing / 1M</text>
    <text x="730" y="475" fill="#34d399" font-weight="bold">$10.00 (Intro)</text>
    <text x="870" y="475" fill="#cbd5e1">$20.00</text>
    <text x="1010" y="475" fill="#cbd5e1">$75.00</text>
    <line x1="550" y1="490" x2="1130" y2="490" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 7 -->
    <text x="550" y="520" fill="#e2e8f0" font-weight="bold">Prompt Cache Discount</text>
    <text x="730" y="520" fill="#34d399" font-weight="bold">95% Off ($0.10)</text>
    <text x="870" y="520" fill="#cbd5e1">50% Off ($2.50)</text>
    <text x="1010" y="520" fill="#cbd5e1">90% Off ($1.50)</text>
    <line x1="550" y1="535" x2="1130" y2="535" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 8 -->
    <text x="550" y="565" fill="#e2e8f0" font-weight="bold">Early Access Program</text>
    <text x="730" y="565" fill="#34d399" font-weight="bold">Google Fairwind</text>
    <text x="870" y="565" fill="#cbd5e1">Tier 5 Red Team</text>
    <text x="1010" y="565" fill="#cbd5e1">Enterprise Alpha</text>
    <line x1="550" y1="580" x2="1130" y2="580" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- Summary comment -->
  <text x="550" y="618" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12" font-weight="bold">Argon Advantage: First model to break 1M sustained output tokens at $0.10/M cache rate.</text>
</svg>