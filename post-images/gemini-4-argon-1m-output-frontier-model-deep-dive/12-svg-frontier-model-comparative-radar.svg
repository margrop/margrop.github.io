<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgRadar)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold" letter-spacing="2">FRONTIER COMPARISON · 前沿大模型全维雷达矩阵</text>
  <text x="50" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="24" font-weight="bold">Gemini 4 Argon vs GPT-6 Astra vs Claude Opus 5.5</text>

  <!-- Left: Radar Visualization Graphic -->
  <circle cx="280" cy="380" r="180" fill="none" stroke="#1e293b" stroke-dasharray="4,4"/>
  <circle cx="280" cy="380" r="135" fill="none" stroke="#1e293b" stroke-dasharray="4,4"/>
  <circle cx="280" cy="380" r="90" fill="none" stroke="#1e293b" stroke-dasharray="4,4"/>
  <circle cx="280" cy="380" r="45" fill="none" stroke="#1e293b" stroke-dasharray="4,4"/>

  <!-- Radar Axes (5 Dimensions) -->
  <!-- Top: Output Horizon (1M) -->
  <line x1="280" y1="380" x2="280" y2="190" stroke="#334155" stroke-width="1.5"/>
  <text x="280" y="175" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">输出长度 (1M Output)</text>

  <!-- Top Right: Software Engineering -->
  <line x1="280" y1="380" x2="451" y2="324" stroke="#334155" stroke-width="1.5"/>
  <text x="465" y="325" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">真实软件工程 (DeepSWE)</text>

  <!-- Bottom Right: Cyber Defense -->
  <line x1="280" y1="380" x2="385" y2="525" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="540" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">网络安全防御 (CWE-bench)</text>

  <!-- Bottom Left: Cost Efficiency -->
  <line x1="280" y1="380" x2="174" y2="525" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="540" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">成本经济性 (Prompt Cache)</text>

  <!-- Top Left: Multimodal Video -->
  <line x1="280" y1="380" x2="108" y2="324" stroke="#334155" stroke-width="1.5"/>
  <text x="95" y="325" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">长视频理解 (LVBench)</text>

  <!-- Polygon for Gemini 4 Argon (Cyan / Emerald) -->
  <polygon points="280,200 440,328 375,505 185,510 115,330" fill="#10b981" fill-opacity="0.35" stroke="#10b981" stroke-width="3"/>

  <!-- Polygon for GPT-6 Astra (Purple) -->
  <polygon points="280,290 420,335 340,460 215,440 160,350" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Polygon for Claude Opus 5.5 (Amber) -->
  <polygon points="280,310 415,340 330,450 205,430 180,360" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Legend -->
  <rect x="70" y="600" width="420" height="45" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="95" cy="622" r="6" fill="#10b981"/>
  <text x="110" y="627" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12" font-weight="bold">Gemini 4 Argon</text>

  <circle cx="230" cy="622" r="6" fill="#8b5cf6"/>
  <text x="245" y="627" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">GPT-6 Astra</text>

  <circle cx="350" cy="622" r="6" fill="#f59e0b"/>
  <text x="365" y="627" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">Claude Opus 5.5</text>

  <!-- Right: Comparison Table Matrix -->
  <rect x="530" y="140" width="620" height="505" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="530" y="140" width="620" height="45" rx="10" fill="#1e293b"/>
  <text x="550" y="168" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">EVALUATION METRIC BREAKDOWN TABLE</text>

