<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="blockBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="blockPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="blockEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#darkBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold" letter-spacing="2">ARCHITECTURAL BLUEPRINT · 底层架构解密</text>
  <text x="50" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="24" font-weight="bold">Gemini 4 Argon 100万 Token 超长输出流式持久化架构</text>

  <!-- 3 Major Tiers -->
  <!-- Tier 1: Input & Context Cache -->
  <rect x="50" y="130" width="340" height="490" rx="12" fill="url(#blockBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="50" y="130" width="340" height="45" rx="12" fill="#1d4ed8"/>
  <text x="70" y="158" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="16" font-weight="bold">1. 提示词分层缓存 (Input Cache)</text>

  <rect x="70" y="195" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="222" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">2,000,000 Tokens 上下文池</text>
  <text x="85" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">整库代码树、十万行依赖定义、全量文档</text>
  <text x="85" y="265" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">95% Prompt Cache 命中折扣 ($0.10/M)</text>

  <rect x="70" y="295" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="322" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">前缀对齐与哈希树 (Prefix Merkle)</text>
  <text x="85" y="345" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">基于 AST 抽象语法树的子树分块哈希</text>
  <text x="85" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">微小文件编辑仅需重算局部 Token 状态</text>

  <rect x="70" y="395" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="422" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">多模态流式图元注入</text>
  <text x="85" y="445" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">视频关键帧序列直接映射至时序 Token</text>
  <text x="85" y="465" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">2小时长视频保持毫秒级交叉注意力检索</text>

  <!-- Tier 2: Argon Reasoning Core -->
  <rect x="430" y="130" width="340" height="490" rx="12" fill="url(#blockPurple)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="430" y="130" width="340" height="45" rx="12" fill="#7e22ce"/>
  <text x="450" y="158" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="16" font-weight="bold">2. 长程推理核心 (Argon Engine)</text>

  <rect x="450" y="195" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="465" y="222" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">Dense + Sparse MoE 混合专家</text>
  <text x="465" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">代码构建、算法设计、形式化验证专精专家</text>
  <text x="465" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">动态路由器根据问题复杂度分配推理算力</text>

  <rect x="450" y="295" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="465" y="322" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">测试时计算 (Test-Time Compute)</text>
  <text x="465" y="345" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">隐式思维树搜索 (MCTS) 与状态回溯</text>
  <text x="465" y="365" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">自我对抗模拟 (Self-Play Red Teaming)</text>

  <rect x="450" y="395" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="465" y="422" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">符号化自检监视器 (Symbolic Verifier)</text>
  <text x="465" y="445" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">实时检查变量生命周期、悬挂指针与死锁</text>
  <text x="465" y="465" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">生成过程绝不失真、拒绝幻觉发散</text>

  <!-- Tier 3: 1M Output Stream -->
  <rect x="810" y="130" width="340" height="490" rx="12" fill="url(#blockEmerald)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="810" y="130" width="340" height="45" rx="12" fill="#047857"/>
  <text x="830" y="158" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="16" font-weight="bold">3. 100万 Token 生成输出流水线</text>

  <rect x="830" y="195" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="845" y="222" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">KV-Cache 分层压缩持久化</text>
  <text x="845" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">将历史显存状态动态下沉至高速 HBM/SSD</text>
  <text x="845" y="265" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">突破传统 64K Token 显存墙瓶颈</text>

  <rect x="830" y="295" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="845" y="322" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">推测解码 (Speculative Streaming)</text>
  <text x="845" y="345" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">小草稿模型先行起跑，大模型并行核验</text>
  <text x="845" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">每秒稳定吐字 140+ Tokens，零卡顿延迟</text>

  <rect x="830" y="395" width="300" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="845" y="422" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">完整项目工程交付物</text>
  <text x="845" y="445" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">单次生成整套微服务、全量前端工程</text>
  <text x="845" y="465" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">包含配套 Makefile、Dockerfile、集成测试</text>

  <!-- Connectors -->
  <line x1="390" y1="375" x2="430" y2="375" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="375" x2="810" y2="375" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>