<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Section -->
  <text x="50" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold" letter-spacing="2">EVERYDAY ANALOGY · 小学生秒懂的生活大比方</text>
  <text x="50" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="24" font-weight="bold">为什么 100万 Token 输出与长程推理是降维打击？</text>

  <!-- Left Card: Traditional Model -->
  <rect x="50" y="130" width="520" height="500" rx="14" fill="url(#blueCard)" stroke="#dc2626" stroke-width="2"/>
  <rect x="50" y="130" width="520" height="50" rx="14" fill="#991b1b" />
  <text x="75" y="162" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="16" font-weight="bold">传统大模型 (64K 输出上限 / 碎片化拼接)</text>

  <!-- Left Metaphor 1: Oral exam student -->
  <rect x="75" y="200" width="470" height="120" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="245" r="22" fill="#ef4444" opacity="0.2"/>
  <text x="110" y="252" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="20">🗣️</text>
  <text x="150" y="235" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">就像背诵比赛中的“喘气小孩”</text>
  <text x="150" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">只能一口气背两分钟，气喘吁吁必须停下。</text>
  <text x="150" y="280" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">写长代码必须分段截断，拼在一起到处是接口冲突！</text>

  <!-- Left Metaphor 2: 10-piece Lego -->
  <rect x="75" y="340" width="470" height="120" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="385" r="22" fill="#f59e0b" opacity="0.2"/>
  <text x="110" y="392" text-anchor="middle" fill="#f59e0b" font-family="Arial" font-size="20">🚗</text>
  <text x="150" y="375" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">拼10块积木的简易小玩具车</text>
  <text x="150" y="400" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">积木一旦超过100块，脑子就彻底转不过来。</text>
  <text x="150" y="420" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">经常把车轮安在屋顶上，走几步就推翻重来。</text>

  <!-- Left Metaphor 3: Repurchase dictionary -->
  <rect x="75" y="480" width="470" height="120" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
  <circle cx="110" cy="525" r="22" fill="#a855f7" opacity="0.2"/>
  <text x="110" y="532" text-anchor="middle" fill="#a855f7" font-family="Arial" font-size="20">💸</text>
  <text x="150" y="515" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">每次查字都得按原价重新买一本字典</text>
  <text x="150" y="540" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">改一个单词就要把整本书重新印刷计费。</text>
  <text x="150" y="560" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">长上下文多轮问答让 Token 账单瞬间爆炸！</text>

  <!-- Right Card: Gemini 4 Argon -->
  <rect x="630" y="130" width="520" height="500" rx="14" fill="url(#blueCard)" stroke="#10b981" stroke-width="2"/>
  <rect x="630" y="130" width="520" height="50" rx="14" fill="#065f46" />
  <text x="655" y="162" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="16" font-weight="bold">Gemini 4 Argon (100万 Token 超长输出 / 连续状态留存)</text>

  <!-- Right Metaphor 1: Master Architect -->
  <rect x="655" y="200" width="470" height="120" rx="8" fill="#182234" stroke="#047857" stroke-width="1"/>
  <circle cx="690" cy="245" r="22" fill="#10b981" opacity="0.2"/>
  <text x="690" y="252" text-anchor="middle" fill="#10b981" font-family="Arial" font-size="20">📜</text>
  <text x="730" y="235" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">自带无限羊皮卷的“城市总设计师”</text>
  <text x="730" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">书桌前一气呵成写完整座城市的自来水管网规范。</text>
  <text x="730" y="280" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">500页一口气完成，第499页螺丝与第3页图纸丝丝入扣！</text>

  <!-- Right Metaphor 2: 10,000-piece Hogwarts -->
  <rect x="655" y="340" width="470" height="120" rx="8" fill="#182234" stroke="#047857" stroke-width="1"/>
  <circle cx="690" cy="385" r="22" fill="#38bdf8" opacity="0.2"/>
  <text x="690" y="392" text-anchor="middle" fill="#38bdf8" font-family="Arial" font-size="20">🏰</text>
  <text x="730" y="375" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">徒手组装10000块乐高霍格沃茨城堡</text>
  <text x="730" y="400" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">在脑中先建立起完整的受力结构三维虚拟空间。</text>
  <text x="730" y="420" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">不仅零件零缺失，而且自主校验每一根横梁的力学平衡！</text>

  <!-- Right Metaphor 3: Dictionary staying on desk -->
  <rect x="655" y="480" width="470" height="120" rx="8" fill="#182234" stroke="#047857" stroke-width="1"/>
  <circle cx="690" cy="525" r="22" fill="#f59e0b" opacity="0.2"/>
  <text x="690" y="532" text-anchor="middle" fill="#f59e0b" font-family="Arial" font-size="20">📖</text>
  <text x="730" y="515" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">词典一直摊开放在课桌上，随意翻阅</text>
  <text x="730" y="540" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">Prompt Caching 直接享受 95% 巨额折扣。</text>
  <text x="730" y="560" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">百万词元输入仅需 $0.10，海量多步骤智能体狂奔无负担！</text>
</svg>