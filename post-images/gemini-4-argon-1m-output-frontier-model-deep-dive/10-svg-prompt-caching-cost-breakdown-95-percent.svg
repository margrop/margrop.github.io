<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgCost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgCost)" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold" letter-spacing="2">TOKEN ECONOMICS · 成本与缓存经济学</text>
  <text x="50" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="24" font-weight="bold">Gemini 4 Argon 定价优势：95% 提示词缓存折扣击穿底线</text>

  <!-- Comparison Bars -->
  <!-- Case 1: Legacy Frontier Models (GPT-5 / Claude 3 Opus) -->
  <rect x="70" y="140" width="1060" height="120" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="95" y="172" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">传统商业旗舰 (Legacy Frontier Models - 无长程缓存或高昂计费)</text>
  <text x="95" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">1,000,000 输入词元常规调用：$15.00 ~ $30.00 / 1M | 100次多轮智能体循环：$1,500 ~ $3,000</text>
  
  <rect x="95" y="210" width="950" height="30" rx="6" fill="#334155"/>
  <rect x="95" y="210" width="950" height="30" rx="6" fill="url(#barRed)"/>
  <text x="1055" y="231" text-anchor="end" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">$30.00 / 1M</text>

  <!-- Case 2: Gemini 4 Argon Standard (No Cache) -->
  <rect x="70" y="280" width="1060" height="120" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="95" y="312" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">Gemini 4 Argon (冷启动标准计费 - 无缓存模式)</text>
  <text x="95" y="335" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">尝鲜期输入仅 $2.00 / 1M | 输出 $10.00 / 1M (标准期 $4.00 / $20.00)</text>
  
  <rect x="95" y="350" width="950" height="30" rx="6" fill="#334155"/>
  <rect x="95" y="350" width="120" height="30" rx="6" fill="#f59e0b"/>
  <text x="230" y="371" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">$2.00 / 1M (直降 93%)</text>

  <!-- Case 3: Gemini 4 Argon WITH 95% PROMPT CACHING -->
  <rect x="70" y="420" width="1060" height="140" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <rect x="70" y="420" width="1060" height="35" rx="10" fill="#064e3b"/>
  <text x="95" y="445" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="15" font-weight="bold">Gemini 4 Argon + 95% 提示词缓存 (Prompt Caching 极致加速)</text>
  <text x="95" y="480" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13">缓存命中词元仅需 $0.10 / 1M！100次智能体长程多轮思考总成本仅需区区 $10.00！</text>

  <rect x="95" y="500" width="950" height="30" rx="6" fill="#1e293b"/>
  <rect x="95" y="500" width="25" height="30" rx="6" fill="url(#barGreen)"/>
  <text x="135" y="521" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="14" font-weight="bold">$0.10 / 1M (折合 95% 巨额优惠，降低 300 倍！)</text>

  <!-- Bottom ROI summary -->
  <rect x="70" y="580" width="1060" height="70" rx="8" fill="#13233e" stroke="#2563eb" stroke-width="1"/>
  <text x="95" y="610" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="13" font-weight="bold">企业级工程 ROI 结论：</text>
  <text x="95" y="632" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Arial" font-size="12">百万级代码库的连续长程重构成本，从以往的几千美元直接打穿至一杯咖啡的价格，彻底消除 Agent 运维成本顾虑。</text>
</svg>