<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="960" height="560" fill="url(#bgGrad)" rx="16" />

  <!-- Title -->
  <text x="480" y="42" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica">
    iOS 27 AirPrint 发现与 TLS 证书合规阻断时序全景
  </text>
  <text x="480" y="70" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica">
    从 mDNS 广播成功到 TLS 握手因“10年出厂证书”遭到苹果安全沙盒拒绝的全过程
  </text>

  <!-- Lifeline Headers -->
  <g transform="translate(140, 100)">
    <rect x="-90" y="0" width="180" height="48" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="29" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">📱 iPhone (iOS 27)</text>
    <line x1="0" y1="48" x2="0" y2="420" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  </g>

  <g transform="translate(480, 100)">
    <rect x="-90" y="0" width="180" height="48" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="29" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">📡 局域网 mDNS (5353)</text>
    <line x1="0" y1="48" x2="0" y2="420" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  </g>

  <g transform="translate(820, 100)">
    <rect x="-90" y="0" width="180" height="48" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <text x="0" y="29" fill="#34d399" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">🖨️ 奔图 P2206W (EWS)</text>
    <line x1="0" y1="48" x2="0" y2="420" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" />
  </g>

  <!-- Step 1: mDNS Query -->
  <g transform="translate(0, 175)">
    <line x1="140" y1="0" x2="480" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="475,-4 485,0 475,4" fill="#38bdf8" />
    <text x="310" y="-8" fill="#e2e8f0" font-size="13" font-family="sans-serif" text-anchor="middle">1. 组播查询: _ipp._tcp.local. PTR</text>
  </g>

  <!-- Step 2: mDNS Response -->
  <g transform="translate(0, 215)">
    <line x1="820" y1="0" x2="480" y2="0" stroke="#34d399" stroke-width="2" />
    <polygon points="485,-4 475,0 485,4" fill="#34d399" />
    <line x1="480" y1="0" x2="140" y2="0" stroke="#34d399" stroke-width="2" />
    <polygon points="145,-4 135,0 145,4" fill="#34d399" />
    <text x="480" y="-8" fill="#34d399" font-size="13" font-family="sans-serif" text-anchor="middle">2. Bonjour 响应: Pantum-P2206W (TXT: TLS=1.2, URF=V1.5, port=631)</text>
  </g>

  <!-- Step 3: IPPS / TLS ClientHello -->
  <g transform="translate(0, 275)">
    <line x1="140" y1="0" x2="820" y2="0" stroke="#38bdf8" stroke-width="2" />
    <polygon points="815,-4 825,0 815,4" fill="#38bdf8" />
    <text x="480" y="-8" fill="#e2e8f0" font-size="13" font-family="sans-serif" text-anchor="middle">3. 发起安全连接: TLS 1.2 / 1.3 ClientHello (CipherSuites, SNI)</text>
  </g>

  <!-- Step 4: ServerHello + Factory Cert -->
  <g transform="translate(0, 325)">
    <line x1="820" y1="0" x2="140" y2="0" stroke="#f59e0b" stroke-width="2" />
    <polygon points="145,-4 135,0 145,4" fill="#f59e0b" />
    <text x="480" y="-8" fill="#fbbf24" font-size="13" font-family="sans-serif" text-anchor="middle">4. ServerHello + 出厂自带证书 (NotAfter: 2031年，长达10年！无SAN扩展)</text>
  </g>

  <!-- Step 5: iOS 27 Rejection Box -->
  <g transform="translate(80, 365)">
    <rect x="0" y="0" width="340" height="95" rx="8" fill="#450a0a" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)" />
    <text x="170" y="24" fill="#f43f5e" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">⛔ iOS 27 ATS 证书核验铁律触发</text>
    <text x="170" y="46" fill="#fecdd3" font-size="12" text-anchor="middle" font-family="sans-serif">• 证书有效期 3650 天 ≫ 苹果上限 825 天</text>
    <text x="170" y="66" fill="#fecdd3" font-size="12" text-anchor="middle" font-family="sans-serif">• 缺失 Subject Alternative Name 扩展</text>
    <text x="170" y="86" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">➔ 立即断开 TLS 并吞掉 AirPrint 候选！</text>
  </g>

  <!-- Step 6: Final Symptom -->
  <g transform="translate(480, 485)">
    <rect x="-240" y="0" width="480" height="42" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="0" y="26" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">用户端表现：界面转圈 30 秒 ➔ 弹出“未找到 AirPrint 打印机”</text>
  </g>
</svg>