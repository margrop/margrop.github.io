<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="#0b0f19" rx="16" />

  <text x="480" y="44" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    Apple ATS 与奔图出厂证书合规性技术对比矩阵
  </text>
  <text x="480" y="74" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    为何老旧出厂证书在 iOS 27 惨遭暴毙，而 825 天自签证书能秒级满血复活？
  </text>

  <!-- Table Header -->
  <g transform="translate(40, 105)">
    <rect width="880" height="48" rx="8" fill="url(#headerGrad)" stroke="#334155" stroke-width="1" />
    <text x="140" y="30" fill="#94a3b8" font-size="14" font-weight="bold" font-family="sans-serif">技术维度 / 规范要求</text>
    <text x="380" y="30" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">苹果 ATS / iOS 27 强制底线</text>
    <text x="600" y="30" fill="#f43f5e" font-size="14" font-weight="bold" font-family="sans-serif">奔图出厂默认证书 (原装)</text>
    <text x="780" y="30" fill="#10b981" font-size="14" font-weight="bold" font-family="sans-serif">自签定制 825 天证书 (修复后)</text>
  </g>

  <!-- Rows -->
  <g transform="translate(40, 160)">
    <!-- Row 1 -->
    <rect y="0" width="880" height="54" fill="#111827" />
    <text x="25" y="32" fill="#e2e8f0" font-size="14" font-family="sans-serif">证书有效期上限</text>
    <text x="380" y="32" fill="#38bdf8" font-size="13" font-family="sans-serif">≤ 825 天 (约 27 个月)</text>
    <text x="600" y="32" fill="#f43f5e" font-size="13" font-weight="bold" font-family="sans-serif">❌ 3650 天 (10 年长效)</text>
    <text x="780" y="32" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">✅ 825 天 (完全合规)</text>

    <!-- Row 2 -->
    <rect y="56" width="880" height="54" fill="#1e293b" />
    <text x="25" y="88" fill="#e2e8f0" font-size="14" font-family="sans-serif">SAN (主题备选名称)</text>
    <text x="380" y="88" fill="#38bdf8" font-size="13" font-family="sans-serif">必须显式声明 DNS/IP</text>
    <text x="600" y="88" fill="#f43f5e" font-size="13" font-weight="bold" font-family="sans-serif">❌ 缺失 SAN 扩展</text>
    <text x="780" y="88" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">✅ 包含 *.local 与 IP</text>

    <!-- Row 3 -->
    <rect y="112" width="880" height="54" fill="#111827" />
    <text x="25" y="144" fill="#e2e8f0" font-size="14" font-family="sans-serif">RSA 密钥长度</text>
    <text x="380" y="144" fill="#38bdf8" font-size="13" font-family="sans-serif">≥ 2048 bit</text>
    <text x="600" y="144" fill="#10b981" font-size="13" font-family="sans-serif">✅ 2048 bit</text>
    <text x="780" y="144" fill="#10b981" font-size="13" font-family="sans-serif">✅ 2048 bit</text>

    <!-- Row 4 -->
    <rect y="168" width="880" height="54" fill="#1e293b" />
    <text x="25" y="200" fill="#e2e8f0" font-size="14" font-family="sans-serif">摘要签名算法</text>
    <text x="380" y="200" fill="#38bdf8" font-size="13" font-family="sans-serif">SHA-256 或更优</text>
    <text x="600" y="200" fill="#10b981" font-size="13" font-family="sans-serif">✅ sha256WithRSA</text>
    <text x="780" y="200" fill="#10b981" font-size="13" font-family="sans-serif">✅ sha256WithRSA</text>

    <!-- Row 5 -->
    <rect y="224" width="880" height="54" fill="#111827" />
    <text x="25" y="256" fill="#e2e8f0" font-size="14" font-family="sans-serif">iOS 27 最终仲裁</text>
    <text x="380" y="256" fill="#38bdf8" font-size="13" font-family="sans-serif">严格信任库审计</text>
    <text x="600" y="256" fill="#f43f5e" font-size="13" font-weight="bold" font-family="sans-serif">⛔ 握手阻断 (无AirPrint)</text>
    <text x="780" y="256" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">🚀 握手放行 (秒速打印)</text>

    <!-- Row 6: Legacy Compatibility -->
    <rect y="280" width="880" height="54" fill="#1e293b" />
    <text x="25" y="312" fill="#e2e8f0" font-size="14" font-family="sans-serif">旧系统 / PC 兼容性</text>
    <text x="380" y="312" fill="#38bdf8" font-size="13" font-family="sans-serif">向下兼容</text>
    <text x="600" y="312" fill="#cbd5e1" font-size="13" font-family="sans-serif">老系统检查宽松可打印</text>
    <text x="780" y="312" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">全平台完美通吃</text>
  </g>
</svg>