<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="#030712" rx="16" />

  <text x="480" y="44" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    小学生也能秒懂的 TLS 证书生活大比方：三幕生活大戏
  </text>
  <text x="480" y="74" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    把晦涩的密码学握手与 X.509 规范，变成谁都经历过的安检门故事
  </text>

  <!-- Act 1 -->
  <g transform="translate(40, 110)">
    <rect width="270" height="370" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="2" />
    <rect width="270" height="46" rx="12" fill="#881337" />
    <text x="135" y="30" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">第一幕：10年超长入场券</text>
    
    <text x="135" y="90" font-size="42" text-anchor="middle">🎟️ ➔ 👮</text>
    
    <text x="25" y="150" fill="#fecdd3" font-size="14" font-weight="bold" font-family="sans-serif">【生活场景】</text>
    <text x="25" y="175" fill="#cbd5e1" font-size="13" font-family="sans-serif">你拿着一张盖着章但写着</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="13" font-family="sans-serif">“有效期10年”的游乐园门票。</text>
    <text x="25" y="225" fill="#f43f5e" font-size="13" font-weight="bold" font-family="sans-serif">新保安（iOS 27）：</text>
    <text x="25" y="248" fill="#fca5a5" font-size="12" font-family="sans-serif">“现在规矩变了！所有门票</text>
    <text x="25" y="268" fill="#fca5a5" font-size="12" font-family="sans-serif">最长只能保825天！10年的</text>
    <text x="25" y="288" fill="#fca5a5" font-size="12" font-family="sans-serif">早就容易伪造了，直接没收！”</text>

    <rect x="20" y="320" width="230" height="32" rx="6" fill="#4c0519" />
    <text x="135" y="341" fill="#fecdd3" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">结局：打印机被安全门拒之门外</text>
  </g>

  <!-- Act 2 -->
  <g transform="translate(345, 110)">
    <rect width="270" height="370" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <rect width="270" height="46" rx="12" fill="#0369a1" />
    <text x="135" y="30" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">第二幕：火漆密封的文件袋</text>
    
    <text x="135" y="90" font-size="42" text-anchor="middle">✉️ 🔐 📦</text>
    
    <text x="25" y="150" fill="#bae6fd" font-size="14" font-weight="bold" font-family="sans-serif">【生活场景】</text>
    <text x="25" y="175" fill="#cbd5e1" font-size="13" font-family="sans-serif">钥匙（私钥）和房产证（证书）</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="13" font-family="sans-serif">不能散着到处扔，容易弄丢。</text>
    <text x="25" y="225" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">PKCS#12 (.p12/.pfx)：</text>
    <text x="25" y="248" fill="#e0f2fe" font-size="12" font-family="sans-serif">就像一个带密码锁的保险袋，</text>
    <text x="25" y="268" fill="#e0f2fe" font-size="12" font-family="sans-serif">把证件与私钥打包密封起来，</text>
    <text x="25" y="288" fill="#e0f2fe" font-size="12" font-family="sans-serif">整套端给打印机安装。</text>

    <rect x="20" y="320" width="230" height="32" rx="6" fill="#082f49" />
    <text x="135" y="341" fill="#bae6fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">结局：格式合规，打印机安全装载</text>
  </g>

  <!-- Act 3 -->
  <g transform="translate(650, 110)">
    <rect width="270" height="370" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
    <rect width="270" height="46" rx="12" fill="#047857" />
    <text x="135" y="30" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">第三幕：实名认证的825天VIP卡</text>
    
    <text x="135" y="90" font-size="42" text-anchor="middle">🏷️ ➔ 🖨️ ✅</text>
    
    <text x="25" y="150" fill="#a7f3d0" font-size="14" font-weight="bold" font-family="sans-serif">【生活场景】</text>
    <text x="25" y="175" fill="#cbd5e1" font-size="13" font-family="sans-serif">重新补办了刚好825天的VIP卡，</text>
    <text x="25" y="195" fill="#cbd5e1" font-size="13" font-family="sans-serif">而且上面清晰印着名字（SAN）。</text>
    <text x="25" y="225" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">新保安（iOS 27）：</text>
    <text x="25" y="248" fill="#d1fae5" font-size="12" font-family="sans-serif">“有效期825天内，合格！</text>
    <text x="25" y="268" fill="#d1fae5" font-size="12" font-family="sans-serif">名字和房间号对得上，放行！”</text>
    <text x="25" y="288" fill="#d1fae5" font-size="12" font-family="sans-serif">瞬间秒搜秒连！</text>

    <rect x="20" y="320" width="230" height="32" rx="6" fill="#064e3b" />
    <text x="135" y="341" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">结局：iPhone 瞬间发现奔图打印机</text>
  </g>
</svg>