<text x="64" y="160" font-size="52" fill="#17323b" font-weight="600">The whiteboard is erased. Keep a ledger.</text>
<text x="64" y="216" font-size="27" fill="#587078" font-weight="400">A successful state write proves visibility now; restoration handles the restart.</text>
