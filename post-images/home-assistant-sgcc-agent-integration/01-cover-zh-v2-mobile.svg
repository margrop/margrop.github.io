<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1079" viewBox="0 0 600 1079" role="img" aria-label="电费接进 HA，重启后却没了？"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1079" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">FIELD NOTES / HOME ASSISTANT</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">电费接进 HA，重启后却没了？</text><text x="28" y="157" font-size="22" fill="#587078" font-weight="400">两天实战：把“显示一个数字”变成“能解释、能恢复</text><text x="28" y="190" font-size="22" fill="#587078" font-weight="400">、能核对的数据”。</text><rect x="28" y="251" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="299" font-size="25" fill="#1f7898" font-weight="600">01</text><text x="119" y="299" font-size="29" fill="#17323b" font-weight="600">接通</text><text x="52" y="354" font-size="26" fill="#587078" font-weight="400">账号自己填</text><text x="52" y="397" font-size="26" fill="#587078" font-weight="400">用电数据完成推送</text><text x="52" y="440" font-size="26" fill="#587078" font-weight="400">验证码 ≠ 全部问题</text><rect x="28" y="505" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="553" font-size="25" fill="#1f7898" font-weight="600">02</text><text x="119" y="553" font-size="29" fill="#17323b" font-weight="600">留住</text><text x="52" y="608" font-size="26" fill="#587078" font-weight="400">临时状态会消失</text><text x="52" y="651" font-size="26" fill="#587078" font-weight="400">触发模板保留有效值</text><text x="52" y="694" font-size="26" fill="#587078" font-weight="400">缓存必须标明来源</text><rect x="28" y="759" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="807" font-size="25" fill="#1f7898" font-weight="600">03</text><text x="119" y="807" font-size="29" fill="#17323b" font-weight="600">算对</text><text x="52" y="862" font-size="26" fill="#587078" font-weight="400">用电日 ≠ 抓取日</text><text x="52" y="905" font-size="26" fill="#587078" font-weight="400">日值不能当累计值</text><text x="52" y="948" font-size="26" fill="#587078" font-weight="400">长期统计不是账单</text><text x="28" y="1051" font-size="18" fill="#587078" font-weight="400">原创示意 · 非实测读数</text></svg>