<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1006" viewBox="0 0 600 1006" role="img" aria-label="Three drawers. Three kinds of retention."><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1006" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">RETENTION / NOT A BILLING LEDGER</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">Three drawers. Three kinds</text><text x="28" y="155" font-size="34" fill="#17323b" font-weight="600">of retention.</text><text x="28" y="204" font-size="22" fill="#587078" font-weight="400">Detailed history, dated daily rows and</text><text x="28" y="237" font-size="22" fill="#587078" font-weight="400">long-term trends solve different</text><text x="28" y="270" font-size="22" fill="#587078" font-weight="400">problems.</text><rect x="28" y="331" width="544" height="183" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="378" font-size="25" fill="#1f7898" font-weight="600">01</text><text x="119" y="378" font-size="29" fill="#17323b" font-weight="600">Raw state history</text><text x="52" y="430" font-size="25" fill="#587078" font-weight="400">Configured for 30 days here;</text><text x="52" y="467" font-size="25" fill="#587078" font-weight="400">individual state changes.</text><rect x="28" y="534" width="544" height="183" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="581" font-size="25" fill="#1f7898" font-weight="600">02</text><text x="119" y="581" font-size="29" fill="#17323b" font-weight="600">Recent dated cache</text><text x="52" y="633" font-size="25" fill="#587078" font-weight="400">Deduplicate by usage date; up to</text><text x="52" y="670" font-size="25" fill="#587078" font-weight="400">120 rows restored with template.</text><rect x="28" y="737" width="544" height="183" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="784" font-size="25" fill="#1f7898" font-weight="600">03</text><text x="119" y="784" font-size="29" fill="#17323b" font-weight="600">Long-term statistics</text><text x="52" y="836" font-size="25" fill="#587078" font-weight="400">Needs valid numeric semantics and</text><text x="52" y="873" font-size="25" fill="#587078" font-weight="400">units; not automatically purged.</text><text x="28" y="978" font-size="18" fill="#587078" font-weight="400">Original illustration · No private readings</text></svg>