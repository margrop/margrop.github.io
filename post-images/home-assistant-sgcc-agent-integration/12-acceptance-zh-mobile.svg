<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1178" viewBox="0 0 600 1178" role="img" aria-label="卡片有数字，还不算接入完成"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1178" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">ACCEPTANCE / SIX CHECKS</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">卡片有数字，还不算接入完成</text><text x="28" y="157" font-size="22" fill="#587078" font-weight="400">让 Agent 交付一条能复查的证据链。</text><rect x="28" y="218" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="264" font-size="29" fill="#24755c" font-weight="600">账号</text><text x="52" y="314" font-size="25" fill="#587078" font-weight="400">每个户号都成功</text><rect x="28" y="367" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="413" font-size="29" fill="#24755c" font-weight="600">业务日期</text><text x="52" y="463" font-size="25" fill="#587078" font-weight="400">显示用电日，不猜今天</text><rect x="28" y="516" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="562" font-size="29" fill="#24755c" font-weight="600">重启</text><text x="52" y="612" font-size="25" fill="#587078" font-weight="400">恢复后保留有效值</text><rect x="28" y="665" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="711" font-size="29" fill="#24755c" font-weight="600">失败</text><text x="52" y="761" font-size="25" fill="#587078" font-weight="400">缺数据不自动填零</text><rect x="28" y="814" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="860" font-size="29" fill="#24755c" font-weight="600">统计</text><text x="52" y="910" font-size="25" fill="#587078" font-weight="400">不混淆日值与累计量</text><rect x="28" y="963" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="1009" font-size="29" fill="#24755c" font-weight="600">权限</text><text x="52" y="1059" font-size="25" fill="#587078" font-weight="400">专用令牌，可单独撤销</text><text x="28" y="1150" font-size="18" fill="#587078" font-weight="400">原创示意 · 非实测读数</text></svg>