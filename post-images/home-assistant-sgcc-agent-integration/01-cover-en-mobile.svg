<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1126" viewBox="0 0 600 1126" role="img" aria-label="The bill arrived. Then HA restarted."><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1126" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">FIELD NOTES / HOME ASSISTANT</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">The bill arrived. Then HA</text><text x="28" y="155" font-size="34" fill="#17323b" font-weight="600">restarted.</text><text x="28" y="204" font-size="22" fill="#587078" font-weight="400">A two-day integration story about</text><text x="28" y="237" font-size="22" fill="#587078" font-weight="400">dates, persistence and evidence.</text><rect x="28" y="298" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="346" font-size="25" fill="#1f7898" font-weight="600">01</text><text x="119" y="346" font-size="29" fill="#17323b" font-weight="600">Collect</text><text x="52" y="401" font-size="26" fill="#587078" font-weight="400">Keep credentials private</text><text x="52" y="444" font-size="26" fill="#587078" font-weight="400">Verify every account</text><text x="52" y="487" font-size="26" fill="#587078" font-weight="400">Login is only step one</text><rect x="28" y="552" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="600" font-size="25" fill="#1f7898" font-weight="600">02</text><text x="119" y="600" font-size="29" fill="#17323b" font-weight="600">Restore</text><text x="52" y="655" font-size="26" fill="#587078" font-weight="400">Temporary states disappear</text><text x="52" y="698" font-size="26" fill="#587078" font-weight="400">Cache valid observations</text><text x="52" y="741" font-size="26" fill="#587078" font-weight="400">Restored is not fresh</text><rect x="28" y="806" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="854" font-size="25" fill="#1f7898" font-weight="600">03</text><text x="119" y="854" font-size="29" fill="#17323b" font-weight="600">Interpret</text><text x="52" y="909" font-size="26" fill="#587078" font-weight="400">Usage date is not arrival</text><text x="52" y="952" font-size="26" fill="#587078" font-weight="400">Daily is not cumulative</text><text x="52" y="995" font-size="26" fill="#587078" font-weight="400">Statistics are not bills</text><text x="28" y="1098" font-size="18" fill="#587078" font-weight="400">Original illustration · No private readings</text></svg>