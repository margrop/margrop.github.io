<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Three drawers. Three kinds of retention.">
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="1440" height="820" fill="#f6f4ee"/>
<path d="M64 71H116" stroke="#1f7898" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#1f7898" font-weight="600">RETENTION / NOT A BILLING LEDGER</text>
<text x="64" y="160" font-size="52" fill="#17323b" font-weight="600">Three drawers. Three kinds of retention.</text>
<text x="64" y="216" font-size="27" fill="#587078" font-weight="400">Detailed history, dated daily rows and long-term trends solve different problems.</text>
<rect x="64" y="282" width="1312" height="116" rx="18" fill="white" stroke="#d8e0dc"/><rect x="88" y="309" width="60" height="60" rx="12" fill="#1f7898" stroke="#1f7898"/><text x="103" y="349" font-size="24" fill="white" font-weight="600">01</text><text x="182" y="330" font-size="30" fill="#17323b" font-weight="600">Raw state history</text><text x="182" y="370" font-size="26" fill="#587078" font-weight="400">Configured for 30 days here; individual state changes.</text><rect x="64" y="418" width="1312" height="116" rx="18" fill="white" stroke="#d8e0dc"/><rect x="88" y="445" width="60" height="60" rx="12" fill="#b46c26" stroke="#b46c26"/><text x="103" y="485" font-size="24" fill="white" font-weight="600">02</text><text x="182" y="466" font-size="30" fill="#17323b" font-weight="600">Recent dated cache</text><text x="182" y="506" font-size="26" fill="#587078" font-weight="400">Deduplicate by usage date; up to 120 rows restored with template.</text><rect x="64" y="554" width="1312" height="116" rx="18" fill="white" stroke="#d8e0dc"/><rect x="88" y="581" width="60" height="60" rx="12" fill="#24755c" stroke="#24755c"/><text x="103" y="621" font-size="24" fill="white" font-weight="600">03</text><text x="182" y="602" font-size="30" fill="#17323b" font-weight="600">Long-term statistics</text><text x="182" y="642" font-size="26" fill="#587078" font-weight="400">Needs valid numeric semantics and units; not automatically purged.</text>
<path d="M64 751H1376" stroke="#d4ddd8"/>
<text x="64" y="790" font-size="20" fill="#587078" font-weight="400">Original illustration · No household readings · 2026-10-26</text><text x="1300" y="790" font-size="21" fill="#1f7898" font-weight="600">10</text>
</svg>