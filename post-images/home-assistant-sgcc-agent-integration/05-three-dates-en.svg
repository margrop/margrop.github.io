<text x="136" y="80" font-size="22" fill="#1f7898" font-weight="600">DATA SEMANTICS / BUSINESS DATE</text>
<text x="64" y="160" font-size="52" fill="#17323b" font-weight="600">Three dates, like a delayed parcel</text>
<text x="64" y="216" font-size="27" fill="#587078" font-weight="400">Ordering, dispatch and delivery do not happen at the same time.</text>
<rect x="64" y="280" width="416" height="414" rx="18" fill="white" stroke="#d8e0dc"/><rect x="92" y="310" width="62" height="46" rx="10" fill="#1f7898" stroke="#1f7898"/><text x="106" y="342" font-size="23" fill="white" font-weight="600">D1</text><text x="92" y="410" font-size="32" fill="#17323b" font-weight="600">Usage date</text><text x="92" y="467" font-size="25" fill="#587078" font-weight="400">Energy used on Monday</text><text x="92" y="513" font-size="25" fill="#587078" font-weight="400">Date supplied by utility</text><text x="92" y="559" font-size="25" fill="#587078" font-weight="400">Key the daily ledger here</text><path d="M485 487h20m-9 -8l9 8-9 8" fill="none" stroke="#1f7898" stroke-width="3"/><rect x="512" y="280" width="416" height="414" rx="18" fill="white" stroke="#d8e0dc"/><rect x="540" y="310" width="62" height="46" rx="10" fill="#b46c26" stroke="#b46c26"/><text x="554" y="342" font-size="23" fill="white" font-weight="600">D2</text><text x="540" y="410" font-size="32" fill="#17323b" font-weight="600">Publication date</text><text x="540" y="467" font-size="25" fill="#587078" font-weight="400">Utility processes readings</text><text x="540" y="513" font-size="25" fill="#587078" font-weight="400">May appear on Wednesday</text><text x="540" y="559" font-size="25" fill="#587078" font-weight="400">Delay is not proof of failure</text><path d="M933 487h20m-9 -8l9 8-9 8" fill="none" stroke="#1f7898" stroke-width="3"/><rect x="960" y="280" width="416" height="414" rx="18" fill="white" stroke="#d8e0dc"/><rect x="988" y="310" width="62" height="46" rx="10" fill="#24755c" stroke="#24755c"/><text x="1002" y="342" font-size="23" fill="white" font-weight="600">D3</text><text x="988" y="410" font-size="32" fill="#17323b" font-weight="600">Arrival date</text><text x="988" y="467" font-size="25" fill="#587078" font-weight="400">Collector sends it to HA</text><text x="988" y="513" font-size="25" fill="#587078" font-weight="400">Normal statistics use arrival</text><text 