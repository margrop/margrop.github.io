<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1126" viewBox="0 0 600 1126" role="img" aria-label="From a utility bill to a dashboard tile"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1126" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">ARCHITECTURE / 3 LINKS</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">From a utility bill to a</text><text x="28" y="155" font-size="34" fill="#17323b" font-weight="600">dashboard tile</text><text x="28" y="204" font-size="22" fill="#587078" font-weight="400">Verify each link independently to</text><text x="28" y="237" font-size="22" fill="#587078" font-weight="400">locate the failure.</text><rect x="28" y="298" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="346" font-size="25" fill="#1f7898" font-weight="600">A</text><text x="119" y="346" font-size="29" fill="#17323b" font-weight="600">Utility website</text><text x="52" y="401" font-size="26" fill="#587078" font-weight="400">Authenticate and read</text><text x="52" y="444" font-size="26" fill="#587078" font-weight="400">Daily data can arrive late</text><text x="52" y="487" font-size="26" fill="#587078" font-weight="400">One login, several meters</text><rect x="28" y="552" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="600" font-size="25" fill="#1f7898" font-weight="600">B</text><text x="119" y="600" font-size="29" fill="#17323b" font-weight="600">Collector</text><text x="52" y="655" font-size="26" fill="#587078" font-weight="400">Manage browser session</text><text x="52" y="698" font-size="26" fill="#587078" font-weight="400">Read dated observations</text><text x="52" y="741" font-size="26" fill="#587078" font-weight="400">Push states, keep cache</text><rect x="28" y="806" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="854" font-size="25" fill="#1f7898" font-weight="600">C</text><text x="119" y="854" font-size="29" fill="#17323b" font-weight="600">Home Assistant</text><text x="52" y="909" font-size="26" fill="#587078" font-weight="400">States feed the dashboard</text><text x="52" y="952" font-size="26" fill="#587078" font-weight="400">Templates restore values</text><text x="52" y="995" font-size="26" fill="#587078" font-weight="400">Statistics retain trends</text><text x="28" y="1098" font-size="18" fill="#587078" font-weight="400">Original illustration · No private readings</text></svg>