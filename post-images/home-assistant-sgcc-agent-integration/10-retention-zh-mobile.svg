<svg xmlns="http://www.w3.org/2000/svg" width="600" height="926" viewBox="0 0 600 926" role="img" aria-label="三个抽屉，三种“保留”"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="926" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">RETENTION / NOT A BILLING LEDGER</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">三个抽屉，三种“保留”</text><text x="28" y="157" font-size="22" fill="#587078" font-weight="400">历史曲线、近期日明细、长期趋势各有用途，不能相</text><text x="28" y="190" font-size="22" fill="#587078" font-weight="400">互冒充。</text><rect x="28" y="251" width="544" height="183" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="298" font-size="25" fill="#1f7898" font-weight="600">01</text><text x="119" y="298" font-size="29" fill="#17323b" font-weight="600">原始状态历史</text><text x="52" y="350" font-size="25" fill="#587078" font-weight="400">现场设置保留 30 天；详细变化记录。</text><rect x="28" y="454" width="544" height="183" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="501" font-size="25" fill="#1f7898" font-weight="600">02</text><text x="119" y="501" font-size="29" fill="#17323b" font-weight="600">模板近期明细</text><text x="52" y="553" font-size="25" fill="#587078" font-weight="400">按业务日期去重，最多 120 条；随模板恢复</text><text x="52" y="590" font-size="25" fill="#587078" font-weight="400">。</text><rect x="28" y="657" width="544" height="183" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="704" font-size="25" fill="#1f7898" font-weight="600">03</text><text x="119" y="704" font-size="29" fill="#17323b" font-weight="600">长期统计</text><text x="52" y="756" font-size="25" fill="#587078" font-weight="400">符合数值、单位与统计语义；默认不自动清理</text><text x="52" y="793" font-size="25" fill="#587078" font-weight="400">。</text><text x="28" y="898" font-size="18" fill="#587078" font-weight="400">原创示意 · 非实测读数</text></svg>