<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1181" viewBox="0 0 600 1181" role="img" aria-label="The whiteboard is erased. Keep a ledger."><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1181" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">PERSISTENCE / RESTART WINDOW</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">The whiteboard is erased.</text><text x="28" y="155" font-size="34" fill="#17323b" font-weight="600">Keep a ledger.</text><text x="28" y="204" font-size="22" fill="#587078" font-weight="400">A successful state write proves</text><text x="28" y="237" font-size="22" fill="#587078" font-weight="400">visibility now; restoration handles the</text><text x="28" y="270" font-size="22" fill="#587078" font-weight="400">restart.</text><rect x="28" y="331" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="378" font-size="25" fill="#1f7898" font-weight="600">01</text><text x="119" y="378" font-size="29" fill="#17323b" font-weight="600">State pushed</text><text x="52" y="443" font-size="25" fill="#587078" font-weight="400">The tile has a value</text><rect x="28" y="508" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="555" font-size="25" fill="#1f7898" font-weight="600">02</text><text x="119" y="555" font-size="29" fill="#17323b" font-weight="600">Core restarts</text><text x="52" y="620" font-size="25" fill="#587078" font-weight="400">Temporary state is gone</text><rect x="28" y="685" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="732" font-size="25" fill="#1f7898" font-weight="600">03</text><text x="119" y="732" font-size="29" fill="#17323b" font-weight="600">Template restores</text><text x="52" y="797" font-size="25" fill="#587078" font-weight="400">Show last valid cache</text><rect x="28" y="862" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="909" font-size="25" fill="#1f7898" font-weight="600">04</text><text x="119" y="909" font-size="29" fill="#17323b" font-weight="600">New collection</text><text x="52" y="974" font-size="25" fill="#587078" font-weight="400">Update value and date</text><text x="28" y="1059" font-size="25" fill="#24755c" font-weight="600">A restored answer means cached, not</text><text x="28" y="1097" font-size="25" fill="#24755c" font-weight="600">newly verified.</text><text x="28" y="1153" font-size="18" fill="#587078" font-weight="400">Original illustration · No private readings</text></svg>