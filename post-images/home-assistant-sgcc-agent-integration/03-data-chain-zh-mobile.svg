<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1046" viewBox="0 0 600 1046" role="img" aria-label="从一张账单到一张卡片"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1046" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">ARCHITECTURE / 3 LINKS</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">从一张账单到一张卡片</text><text x="28" y="157" font-size="22" fill="#587078" font-weight="400">三段链路分别验收，才能知道故障究竟发生在哪里。</text><rect x="28" y="218" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="266" font-size="25" fill="#1f7898" font-weight="600">A</text><text x="119" y="266" font-size="29" fill="#17323b" font-weight="600">网上国网</text><text x="52" y="321" font-size="26" fill="#587078" font-weight="400">登录并读取账单</text><text x="52" y="364" font-size="26" fill="#587078" font-weight="400">可能晚一到两天</text><text x="52" y="407" font-size="26" fill="#587078" font-weight="400">一个账号可含多户</text><rect x="28" y="472" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="520" font-size="25" fill="#1f7898" font-weight="600">B</text><text x="119" y="520" font-size="29" fill="#17323b" font-weight="600">采集器</text><text x="52" y="575" font-size="26" fill="#587078" font-weight="400">处理网页与会话</text><text x="52" y="618" font-size="26" fill="#587078" font-weight="400">分户提取业务日期</text><text x="52" y="661" font-size="26" fill="#587078" font-weight="400">推送状态并保存缓存</text><rect x="28" y="726" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="774" font-size="25" fill="#1f7898" font-weight="600">C</text><text x="119" y="774" font-size="29" fill="#17323b" font-weight="600">Home Assistant</text><text x="52" y="829" font-size="26" fill="#587078" font-weight="400">实体负责当前显示</text><text x="52" y="872" font-size="26" fill="#587078" font-weight="400">模板负责重启恢复</text><text x="52" y="915" font-size="26" fill="#587078" font-weight="400">统计负责长期趋势</text><text x="28" y="1018" font-size="18" fill="#587078" font-weight="400">原创示意 · 非实测读数</text></svg>