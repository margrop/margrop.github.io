<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1101" viewBox="0 0 600 1101" role="img" aria-label="白板被擦掉，账本还在"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1101" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">PERSISTENCE / RESTART WINDOW</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">白板被擦掉，账本还在</text><text x="28" y="157" font-size="22" fill="#587078" font-weight="400">状态写入成功，只说明现在可见；恢复机制决定重启</text><text x="28" y="190" font-size="22" fill="#587078" font-weight="400">之后。</text><rect x="28" y="251" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="298" font-size="25" fill="#1f7898" font-weight="600">01</text><text x="119" y="298" font-size="29" fill="#17323b" font-weight="600">推送完成</text><text x="52" y="363" font-size="25" fill="#587078" font-weight="400">数字出现在卡片上</text><rect x="28" y="428" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="475" font-size="25" fill="#1f7898" font-weight="600">02</text><text x="119" y="475" font-size="29" fill="#17323b" font-weight="600">Core 重启</text><text x="52" y="540" font-size="25" fill="#587078" font-weight="400">临时状态没有重建</text><rect x="28" y="605" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="652" font-size="25" fill="#1f7898" font-weight="600">03</text><text x="119" y="652" font-size="29" fill="#17323b" font-weight="600">模板恢复</text><text x="52" y="717" font-size="25" fill="#587078" font-weight="400">显示上次有效缓存</text><rect x="28" y="782" width="544" height="157" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="829" font-size="25" fill="#1f7898" font-weight="600">04</text><text x="119" y="829" font-size="29" fill="#17323b" font-weight="600">真实新推送</text><text x="52" y="894" font-size="25" fill="#587078" font-weight="400">更新读数与业务日期</text><text x="28" y="979" font-size="25" fill="#24755c" font-weight="600">缓存是“保留上次答案”，不是“刚刚重新查过”</text><text x="28" y="1017" font-size="25" fill="#24755c" font-weight="600">。</text><text x="28" y="1073" font-size="18" fill="#587078" font-weight="400">原创示意 · 非实测读数</text></svg>