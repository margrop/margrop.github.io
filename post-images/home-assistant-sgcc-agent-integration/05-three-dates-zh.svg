<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="像收快递一样，分清三个日期">
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="1440" height="820" fill="#f6f4ee"/>
<path d="M64 71H116" stroke="#1f7898" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#1f7898" font-weight="600">DATA SEMANTICS / BUSINESS DATE</text>
<text x="64" y="160" font-size="52" fill="#17323b" font-weight="600">像收快递一样，分清三个日期</text>
<text x="64" y="216" font-size="27" fill="#587078" font-weight="400">下单、发货、签收不是同一天；用电、出数、推送也一样。</text>
<rect x="64" y="280" width="416" height="414" rx="18" fill="white" stroke="#d8e0dc"/><rect x="92" y="310" width="62" height="46" rx="10" fill="#1f7898" stroke="#1f7898"/><text x="106" y="342" font-size="23" fill="white" font-weight="600">D1</text><text x="92" y="410" font-size="32" fill="#17323b" font-weight="600">用电发生日</text><text x="92" y="467" font-size="25" fill="#587078" font-weight="400">周一用了多少电</text><text x="92" y="513" font-size="25" fill="#587078" font-weight="400">对应账单里的日期</text><text x="92" y="559" font-size="25" fill="#587078" font-weight="400">日报按这一天归档</text><path d="M485 487h20m-9 -8l9 8-9 8" fill="none" stroke="#1f7898" stroke-width="3"/><rect x="512" y="280" width="416" height="414" rx="18" fill="white" stroke="#d8e0dc"/><rect x="540" y="310" width="62" height="46" rx="10" fill="#b46c26" stroke="#b46c26"/><text x="554" y="342" font-size="23" fill="white" font-weight="600">D2</text><text x="540" y="410" font-size="32" fill="#17323b" font-weight="600">平台出数日</text><text x="540" y="467" font-size="25" fill="#587078" font-weight="400">电网整理计量数据</text><text x="540" y="513" font-size="25" fill="#587078" font-weight="400">可能到周三才可查</text><text x="540" y="559" font-size="25" fill="#587078" font-weight="400">等待不等于集成坏了</text><path d="M933 487h20m-9 -8l9 8-9 8" fill="none" stroke="#1f7898" stroke-width="3"/><rect x="960" y="280" width="416" height="414" rx="18" fill="white" stroke="#d8e0dc"/><rect x="988" y="310" width="62" height="46" rx="10" fill="#24755c" stroke="#24755c"/><text x="1002" y="342" font-size="23" fill="white" font-weight="600">D3</text><text x="988" y="410" font-size="32" fill="#17323b" font-weight="600">HA 收到日</text><text x="988" y="467" font-size="25" fill="#587078" font-weight="400">采集器此时才推送</text><text x="988" y="513" font-size="25" fill="#587078" font-weight="400">普通统计按到达记录</text><text x="988" y="559" font-size="25" fill="#587078" font-weight="400">不会自动回到周一</text>
<path d="M64 751H1376" stroke="#d4ddd8"/>
<text x="64" y="790" font-size="20" fill="#587078" font-weight="400">原创示意 · 非实测读数 · 2026-10-26</text><text x="1300" y="790" font-size="21" fill="#1f7898" font-weight="600">05</text>
</svg>