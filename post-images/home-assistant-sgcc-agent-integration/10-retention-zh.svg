<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="三个抽屉，三种“保留”">
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="1440" height="820" fill="#f6f4ee"/>
<path d="M64 71H116" stroke="#1f7898" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#1f7898" font-weight="600">RETENTION / NOT A BILLING LEDGER</text>
<text x="64" y="160" font-size="52" fill="#17323b" font-weight="600">三个抽屉，三种“保留”</text>
<text x="64" y="216" font-size="27" fill="#587078" font-weight="400">历史曲线、近期日明细、长期趋势各有用途，不能相互冒充。</text>
<rect x="64" y="282" width="1312" height="116" rx="18" fill="white" stroke="#d8e0dc"/><rect x="88" y="309" width="60" height="60" rx="12" fill="#1f7898" stroke="#1f7898"/><text x="103" y="349" font-size="24" fill="white" font-weight="600">01</text><text x="182" y="330" font-size="30" fill="#17323b" font-weight="600">原始状态历史</text><text x="182" y="370" font-size="26" fill="#587078" font-weight="400">现场设置保留 30 天；详细变化记录。</text><rect x="64" y="418" width="1312" height="116" rx="18" fill="white" stroke="#d8e0dc"/><rect x="88" y="445" width="60" height="60" rx="12" fill="#b46c26" stroke="#b46c26"/><text x="103" y="485" font-size="24" fill="white" font-weight="600">02</text><text x="182" y="466" font-size="30" fill="#17323b" font-weight="600">模板近期明细</text><text x="182" y="506" font-size="26" fill="#587078" font-weight="400">按业务日期去重，最多 120 条；随模板恢复。</text><rect x="64" y="554" width="1312" height="116" rx="18" fill="white" stroke="#d8e0dc"/><rect x="88" y="581" width="60" height="60" rx="12" fill="#24755c" stroke="#24755c"/><text x="103" y="621" font-size="24" fill="white" font-weight="600">03</text><text x="182" y="602" font-size="30" fill="#17323b" font-weight="600">长期统计</text><text x="182" y="642" font-size="26" fill="#587078" font-weight="400">符合数值、单位与统计语义；默认不自动清理。</text>
<path d="M64 751H1376" stroke="#d4ddd8"/>
<text x="64" y="790" font-size="20" fill="#587078" font-weight="400">原创示意 · 非实测读数 · 2026-10-26</text><text x="1300" y="790" font-size="21" fill="#1f7898" font-weight="600">10</text>
</svg>