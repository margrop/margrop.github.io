<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1126" viewBox="0 0 600 1126" role="img" aria-label="Three dates, like a delayed parcel"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1126" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">DATA SEMANTICS / BUSINESS DATE</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">Three dates, like a</text><text x="28" y="155" font-size="34" fill="#17323b" font-weight="600">delayed parcel</text><text x="28" y="204" font-size="22" fill="#587078" font-weight="400">Ordering, dispatch and delivery do not</text><text x="28" y="237" font-size="22" fill="#587078" font-weight="400">happen at the same time.</text><rect x="28" y="298" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="346" font-size="25" fill="#1f7898" font-weight="600">D1</text><text x="119" y="346" font-size="29" fill="#17323b" font-weight="600">Usage date</text><text x="52" y="401" font-size="26" fill="#587078" font-weight="400">Energy used on Monday</text><text x="52" y="444" font-size="26" fill="#587078" font-weight="400">Date supplied by utility</text><text x="52" y="487" font-size="26" fill="#587078" font-weight="400">Key the daily ledger here</text><rect x="28" y="552" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="600" font-size="25" fill="#1f7898" font-weight="600">D2</text><text x="119" y="600" font-size="29" fill="#17323b" font-weight="600">Publication date</text><text x="52" y="655" font-size="26" fill="#587078" font-weight="400">Utility processes readings</text><text x="52" y="698" font-size="26" fill="#587078" font-weight="400">May appear on Wednesday</text><text x="52" y="741" font-size="26" fill="#587078" font-weight="400">Delay is not proof of failure</text><rect x="28" y="806" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="854" font-size="25" fill="#1f7898" font-weight="600">D3</text><text x="119" y="854" font-size="29" fill="#17323b" font-weight="600">Arrival date</text><text x="52" y="909" font-size="26" fill="#587078" font-weight="400">Collector sends it to HA</text><text x="52" y="952" font-size="26" fill="#587078" font-weight="400">Normal statistics use arrival</text><text x="52" y="995" font-size="26" fill="#587078" font-weight="400">No automatic backdating</text><text x="28" y="1098" font-size="18" fill="#587078" font-weight="400">Original illustration · No private readings</text></svg>