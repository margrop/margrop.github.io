<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="白板被擦掉，账本还在">
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style>
<rect width="1440" height="820" fill="#f6f4ee"/>
<path d="M64 71H116" stroke="#1f7898" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#1f7898" font-weight="600">PERSISTENCE / RESTART WINDOW</text>
<text x="64" y="160" font-size="52" fill="#17323b" font-weight="600">白板被擦掉，账本还在</text>
<text x="64" y="216" font-size="27" fill="#587078" font-weight="400">状态写入成功，只说明现在可见；恢复机制决定重启之后。</text>
<rect x="64" y="315" width="304" height="272" rx="18" fill="white" stroke="#d8e0dc"/><text x="88" y="375" font-size="35" fill="#1f7898" font-weight="600">01</text><text x="88" y="441" font-size="29" fill="#17323b" font-weight="600">推送完成</text><text x="88" y="496" font-size="21" fill="#587078" font-weight="400">数字出现在卡片上</text><path d="M374 440h20m-9 -8l9 8-9 8" fill="none" stroke="#1f7898" stroke-width="3"/><rect x="400" y="315" width="304" height="272" rx="18" fill="white" stroke="#d8e0dc"/><text x="424" y="375" font-size="35" fill="#b46c26" font-weight="600">02</text><text x="424" y="441" font-size="29" fill="#17323b" font-weight="600">Core 重启</text><text x="424" y="496" font-size="21" fill="#587078" font-weight="400">临时状态没有重建</text><path d="M710 440h20m-9 -8l9 8-9 8" fill="none" stroke="#b46c26" stroke-width="3"/><rect x="736" y="315" width="304" height="272" rx="18" fill="white" stroke="#d8e0dc"/><text x="760" y="375" font-size="35" fill="#24755c" font-weight="600">03</text><text x="760" y="441" font-size="29" fill="#17323b" font-weight="600">模板恢复</text><text x="760" y="496" font-size="21" fill="#587078" font-weight="400">显示上次有效缓存</text><path d="M1046 440h20m-9 -8l9 8-9 8" fill="none" stroke="#24755c" stroke-width="3"/><rect x="1072" y="315" width="304" height="272" rx="18" fill="white" stroke="#d8e0dc"/><text x="1096" y="375" font-size="35" fill="#1f7898" font-weight="600">04</text><text x="1096" y="441" font-size="29" fill="#17323b" font-weight="600">真实新推送</text><text x="1096" y="496" font-size="21" fill="#587078" font-weight="400">更新读数与业务日期</text><rect x="64" y="623" width="1312" height="74" rx="10" fill="#e6eee8" stroke="#c9d9ce"/><text x="90" y="670" font-size="29" fill="#24755c" font-weight="600">缓存是“保留上次答案”，不是“刚刚重新查过”。</text>
<path d="M64 751H1376" stroke="#d4ddd8"/>
<text x="64" y="790" font-size="20" fill="#587078" font-weight="400">原创示意 · 非实测读数 · 2026-10-26</text><text x="1300" y="790" font-size="21" fill="#1f7898" font-weight="600">08</text>
</svg>