<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1258" viewBox="0 0 600 1258" role="img" aria-label="A number on a tile is only the beginning."><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1258" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">ACCEPTANCE / SIX CHECKS</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">A number on a tile is only</text><text x="28" y="155" font-size="34" fill="#17323b" font-weight="600">the beginning.</text><text x="28" y="204" font-size="22" fill="#587078" font-weight="400">Ask the Agent for evidence you can</text><text x="28" y="237" font-size="22" fill="#587078" font-weight="400">inspect and repeat.</text><rect x="28" y="298" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="344" font-size="29" fill="#24755c" font-weight="600">Accounts</text><text x="52" y="394" font-size="25" fill="#587078" font-weight="400">Every expected account succeeds</text><rect x="28" y="447" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="493" font-size="29" fill="#24755c" font-weight="600">Usage date</text><text x="52" y="543" font-size="25" fill="#587078" font-weight="400">Show the utility date</text><rect x="28" y="596" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="642" font-size="29" fill="#24755c" font-weight="600">Restart</text><text x="52" y="692" font-size="25" fill="#587078" font-weight="400">Restore the last valid value</text><rect x="28" y="745" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="791" font-size="29" fill="#24755c" font-weight="600">Failure</text><text x="52" y="841" font-size="25" fill="#587078" font-weight="400">Missing never means zero</text><rect x="28" y="894" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="940" font-size="29" fill="#24755c" font-weight="600">Statistics</text><text x="52" y="990" font-size="25" fill="#587078" font-weight="400">Daily is not cumulative</text><rect x="28" y="1043" width="544" height="131" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="1089" font-size="29" fill="#24755c" font-weight="600">Access</text><text x="52" y="1139" font-size="25" fill="#587078" font-weight="400">Dedicated, revocable token</text><text x="28" y="1230" font-size="18" fill="#587078" font-weight="400">Original illustration · No private readings</text></svg>