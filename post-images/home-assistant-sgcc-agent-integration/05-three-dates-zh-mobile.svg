<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1079" viewBox="0 0 600 1079" role="img" aria-label="像收快递一样，分清三个日期"><style>text{font-family:'PingFang SC','Noto Sans CJK SC',Arial,sans-serif}</style><rect width="600" height="1079" fill="#f6f4ee"/><text x="28" y="48" font-size="17" fill="#1f7898" font-weight="600">DATA SEMANTICS / BUSINESS DATE</text><text x="28" y="108" font-size="34" fill="#17323b" font-weight="600">像收快递一样，分清三个日期</text><text x="28" y="157" font-size="22" fill="#587078" font-weight="400">下单、发货、签收不是同一天；用电、出数、推送也</text><text x="28" y="190" font-size="22" fill="#587078" font-weight="400">一样。</text><rect x="28" y="251" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="299" font-size="25" fill="#1f7898" font-weight="600">D1</text><text x="119" y="299" font-size="29" fill="#17323b" font-weight="600">用电发生日</text><text x="52" y="354" font-size="26" fill="#587078" font-weight="400">周一用了多少电</text><text x="52" y="397" font-size="26" fill="#587078" font-weight="400">对应账单里的日期</text><text x="52" y="440" font-size="26" fill="#587078" font-weight="400">日报按这一天归档</text><rect x="28" y="505" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="553" font-size="25" fill="#1f7898" font-weight="600">D2</text><text x="119" y="553" font-size="29" fill="#17323b" font-weight="600">平台出数日</text><text x="52" y="608" font-size="26" fill="#587078" font-weight="400">电网整理计量数据</text><text x="52" y="651" font-size="26" fill="#587078" font-weight="400">可能到周三才可查</text><text x="52" y="694" font-size="26" fill="#587078" font-weight="400">等待不等于集成坏了</text><rect x="28" y="759" width="544" height="234" rx="18" fill="white" stroke="#d8e0dc"/><text x="52" y="807" font-size="25" fill="#1f7898" font-weight="600">D3</text><text x="119" y="807" font-size="29" fill="#17323b" font-weight="600">HA 收到日</text><text x="52" y="862" font-size="26" fill="#587078" font-weight="400">采集器此时才推送</text><text x="52" y="905" font-size="26" fill="#587078" font-weight="400">普通统计按到达记录</text><text x="52" y="948" font-size="26" fill="#587078" font-weight="400">不会自动回到周一</text><text x="28" y="1051" font-size="18" fill="#587078" font-weight="400">原创示意 · 非实测读数</text></svg>