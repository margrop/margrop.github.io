<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" width="1280" height="1010">
<rect width="1280" height="1010" fill="#0f172a"/>
<text x="640.0" y="58" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#f1f5f9" font-weight="700">DKMS 在包安装时如何挑选「要伺候」的内核</text>
<rect x="210" y="100" width="420" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="420" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#e2e8f0" font-weight="600">i915-sriov-dkms 的 postinst 触发</text>
<text x="420" y="152" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#64748b" font-weight="400">（dpkg configure 阶段）</text>
<line x1="420" y1="164" x2="420" y2="214" stroke="#475569" stroke-width="2.5"/>
<path d="M 415.7 205.0 L 420 214 L 424.3 205.0 Z" fill="#475569"/>
<rect x="210" y="214" width="420" height="64" rx="12" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="2"/>
<text x="420" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#38bdf8" font-weight="700">export autoinstall_all_kernels=1</text>
<text x="420" y="268" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#7dd3fc" font-weight="400">（开关：不再只伺候当前内核）</text>
<line x1="420" y1="278" x2="420" y2="328" stroke="#475569" stroke-width="2.5"/>
<path d="M 415.7 319.0 L 420 328 L 424.3 319.0 Z" fill="#475569"/>
<rect x="210" y="328" width="420" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="420" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#e2e8f0" font-weight="600">遍历 /lib/modules/ 下所有版本</text>
<line x1="420" y1="392" x2="420" y2="442" stroke="#475569" stroke-width="2.5"/>
<path d="M 415.7 433.0 L 420 442 L 424.3 433.0 Z" fill="#475569"/>
<path d="M 420 452 L 670 530 L 420 608 L 170 530 Z" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="2"/>
<text x="420" y="518" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="17" fill="#fbbf24" font-weight="600">这个版本有 headers 吗？</text>
<text x="420" y="548" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#fcd34d" font-weight="400">/lib/modules/&lt;ver&gt;/build 存在？</text>
<line x1="670" y1="530" x2="840" y2="530" stroke="#f472b6" stroke-width="2.5"/>
<path d="M 831.0 534.3 L 840 530 L 831.0 525.7 Z" fill="#f472b6"/>
<text x="750" y="516" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#f472b6" font-weight="600">没有</text>
<rect x="840" y="494" width="380" height="72" rx="12" fill="rgba(244,114,182,0.08)" stroke="#f472b6" stroke-width="2"/>
<text x="1030" y="524" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="16" fill="#f9a8d4" font-weight="600">跳过，不编译</text>
<text x="1030" y="550" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#f9a8d4" font-weight="400">6.14 三个空目录由此幸免</text>
<line x1="420" y1="608" x2="420" y2="668" stroke="#34d399" stroke-width="2.5"/>
<path d="M 415.7 659.0 L 420 668 L 424.3 659.0 Z" fill="#34d399"/>
<text x="434" y="644" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#34d399" font-weight="600">有</text>
<rect x="210" y="668" width="420" height="64" rx="12" fill="rgba(52,211,153,0.10)" stroke="#34d399" stroke-width="2"/>
<text x="420" y="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#34d399" font-weight="600">dkms install（编译并安装一份）</text>
<text x="420" y="722" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="13" fill="#6ee7b7" font-weight="400">6.17 × 4 全部命中</text>
<line x1="420" y1="732" x2="420" y2="792" stroke="#475569" stroke-width="2.5"/>
<path d="M 415.7 783.0 L 420 792 L 424.3 783.0 Z" fill="#475569"/>
<rect x="210" y="792" width="420" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
<text x="420" y="824" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#e2e8f0" font-weight="600">depmod -a</text>
<text x="420" y="846" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="13" fill="#64748b" font-weight="400">update-initramfs -u -k all（全内核）</text>
<rect x="80" y="880" width="1120" height="92" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="110" y="916" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#7dd3fc" font-weight="600">对照：</text>
<text x="170" y="916" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#cbd5e1" font-weight="400">不设这个变量时，Debian 的 common.postinst 默认只给「当前运行内核 + 最新内核」编译</text>
<text x="170" y="944" text-anchor="start" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="15" fill="#64748b" font-weight="400">（见 Launchpad Bug #2120641，也正是这行代码让 6.17 的幽灵们拿到了「开工许可」）</text>
</svg>