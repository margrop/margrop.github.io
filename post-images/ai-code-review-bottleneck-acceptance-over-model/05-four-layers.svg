<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="50" fill="#0f172a" font-size="30" font-weight="bold" text-anchor="middle">四层验收体系：像机场安检一样层层把关</text>
  <text x="600" y="86" fill="#64748b" font-size="19" text-anchor="middle">每一层拦截不同类型的问题，越往下越严格、越接近「能不能上线」</text>

  <!-- 四层 -->
  <g>
    <rect x="140" y="120" width="920" height="100" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
    <text x="180" y="160" fill="#0369a1" font-size="24" font-weight="bold">L1 意图验收</text>
    <text x="180" y="195" fill="#075985" font-size="19">AI 交的是不是我点的那道菜？—— 读一遍 diff 标题与需求是否对得上</text>
    <text x="1010" y="180" fill="#38bdf8" font-size="40" text-anchor="middle">🎯</text>
  </g>
  <g>
    <rect x="140" y="240" width="920" height="100" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="180" y="280" fill="#15803d" font-size="24" font-weight="bold">L2 自动化验收</text>
    <text x="180" y="315" fill="#166534" font-size="19">测试、Lint、类型检查、安全扫描全部通过 —— 机器能查的绝不人肉查</text>
    <text x="1010" y="300" fill="#22c55e" font-size="40" text-anchor="middle">🤖</text>
  </g>
  <g>
    <rect x="140" y="360" width="920" height="100" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="3"/>
    <text x="180" y="400" fill="#a16207" font-size="24" font-weight="bold">L3 关键路径人工验收</text>
    <text x="180" y="435" fill="#854d0e" font-size="19">钱、数据、权限相关的代码逐行读 —— 就像核数钞票，必须亲手点一遍</text>
    <text x="1010" y="420" fill="#eab308" font-size="40" text-anchor="middle">🔍</text>
  </g>
  <g>
    <rect x="140" y="480" width="920" height="100" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="180" y="520" fill="#b91c1c" font-size="24" font-weight="bold">L4 可回滚验收</text>
    <text x="180" y="555" fill="#991b1b" font-size="19">小步提交、随时可回退 —— 万一验收漏了，也能 5 分钟撤回，不伤筋骨</text>
    <text x="1010" y="540" fill="#ef4444" font-size="40" text-anchor="middle">⏪</text>
  </g>

  <text x="600" y="618" fill="#334155" font-size="19" text-anchor="middle">口诀：先看「做的对不对」，再让机器查「跑不跑得通」，最后只把眼力花在「错不起」的地方</text>
</svg>
