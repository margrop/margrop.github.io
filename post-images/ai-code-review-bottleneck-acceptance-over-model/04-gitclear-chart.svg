<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="50" fill="#0f172a" font-size="30" font-weight="bold" text-anchor="middle">GitClear 2.11 亿行代码统计：代码越来越像「复制粘贴」</text>

  <!-- 双折线 -->
  <!-- axes -->
  <line x1="140" y1="480" x2="1100" y2="480" stroke="#0f172a" stroke-width="3"/>
  <line x1="140" y1="120" x2="140" y2="480" stroke="#0f172a" stroke-width="3"/>
  <!-- years -->
  <text x="260" y="512" fill="#334155" font-size="18" text-anchor="middle">2021</text>
  <text x="480" y="512" fill="#334155" font-size="18" text-anchor="middle">2022</text>
  <text x="700" y="512" fill="#334155" font-size="18" text-anchor="middle">2023</text>
  <text x="920" y="512" fill="#334155" font-size="18" text-anchor="middle">2024</text>
  <!-- 重构/移动代码 25% -> <10%  (下降) -->
  <polyline points="260,200 480,250 700,330 920,420" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="260" cy="200" r="8" fill="#22c55e"/>
  <circle cx="920" cy="420" r="8" fill="#22c55e"/>
  <text x="275" y="190" fill="#15803d" font-size="20" font-weight="bold">移动/重构代码 ≈25%</text>
  <text x="700" y="452" fill="#15803d" font-size="20" font-weight="bold">2024 跌破 10%</text>
  <!-- 复制粘贴 上升 -->
  <polyline points="260,400 480,360 700,280 920,170" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <circle cx="260" cy="400" r="8" fill="#ef4444"/>
  <circle cx="920" cy="170" r="8" fill="#ef4444"/>
  <text x="930" y="160" fill="#b91c1c" font-size="20" font-weight="bold">复制粘贴代码 ↑</text>
  <text x="540" y="330" fill="#b91c1c" font-size="20" font-weight="bold">重复代码块一年涨 8 倍</text>
  <!-- crossover marker -->
  <circle cx="810" cy="300" r="10" fill="#f59e0b"/>
  <text x="810" y="272" fill="#92400e" font-size="18" font-weight="bold" text-anchor="middle">2024 首次「粘贴超过搬运」</text>

  <rect x="140" y="540" width="960" height="46" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="570" fill="#92400e" font-size="20" text-anchor="middle">类比：装修队不再「改水电」，只会「多砌几面墙」—— 房子变大，户型没变</text>
</svg>
