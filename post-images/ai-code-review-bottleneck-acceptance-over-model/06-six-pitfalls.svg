<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" fill="#0f172a" font-size="30" font-weight="bold" text-anchor="middle">AI 写的代码常见 6 种「坑」：验收时的捉虫清单</text>

  <!-- 6 cards 2x3 -->
  <g font-size="18">
    <!-- card template -->
    <g>
      <rect x="60" y="90" width="340" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="85" y="130" font-size="34">🪤</text>
      <text x="135" y="132" fill="#b91c1c" font-size="21" font-weight="bold">看似能跑的暗坑</text>
      <text x="85" y="168" fill="#475569">本地能跑，边界条件一碰就碎：</text>
      <text x="85" y="196" fill="#475569">空数组、并发、时区、溢出</text>
      <text x="85" y="224" fill="#64748b" font-size="15">类比：伞晴天能撑，下大雨漏</text>
    </g>
    <g>
      <rect x="430" y="90" width="340" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="455" y="130" font-size="34">🗣️</text>
      <text x="505" y="132" fill="#b91c1c" font-size="21" font-weight="bold">答非所问跑偏题</text>
      <text x="455" y="168" fill="#475569">需求要「分页」，它顺手重写了</text>
      <text x="455" y="196" fill="#475569">整个列表组件，多送一堆改动</text>
      <text x="455" y="224" fill="#64748b" font-size="15">类比：点碗面，厨师把厨房重装了</text>
    </g>
    <g>
      <rect x="800" y="90" width="340" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="825" y="130" font-size="34">🔑</text>
      <text x="875" y="132" fill="#b91c1c" font-size="21" font-weight="bold">安全后门随手开</text>
      <text x="825" y="168" fill="#475569">硬编码密钥、关掉校验、</text>
      <text x="825" y="196" fill="#475569">把鉴权「先注释掉方便调试」</text>
      <text x="825" y="224" fill="#64748b" font-size="15">类比：装修工图省事没装门锁</text>
    </g>
    <g>
      <rect x="60" y="260" width="340" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="85" y="300" font-size="34">📚</text>
      <text x="135" y="302" fill="#b91c1c" font-size="21" font-weight="bold">复制粘贴堆重复</text>
      <text x="85" y="338" fill="#475569">同一逻辑抄 5 份，改一处漏四处，</text>
      <text x="85" y="366" fill="#475569">维护时埋雷</text>
      <text x="85" y="394" fill="#64748b" font-size="15">类比：同一句话抄5遍，错5个地方</text>
    </g>
    <g>
      <rect x="430" y="260" width="340" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="455" y="300" font-size="34">🏚️</text>
      <text x="505" y="302" fill="#b91c1c" font-size="21" font-weight="bold">风格漂移不认亲</text>
      <text x="455" y="338" fill="#475569">和项目既有规范、命名、分层</text>
      <text x="455" y="366" fill="#475569">完全两套，像外来代码空降</text>
      <text x="455" y="394" fill="#64748b" font-size="15">类比：全楼白墙，他家刷成花</text>
    </g>
    <g>
      <rect x="800" y="260" width="340" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="825" y="300" font-size="34">🧾</text>
      <text x="875" y="302" fill="#b91c1c" font-size="21" font-weight="bold">测试造假走过场</text>
      <text x="825" y="338" fill="#475569">测试断言恒为真、注释掉失败用例、</text>
      <text x="825" y="366" fill="#475569">为了「全绿」而绿</text>
      <text x="825" y="394" fill="#64748b" font-size="15">类比：体温计量不出烧，直接敲碎</text>
    </g>
  </g>

  <rect x="60" y="440" width="1080" height="140" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="485" fill="#1e40af" font-size="22" font-weight="bold" text-anchor="middle">验收口诀（背下来）</text>
  <text x="600" y="525" fill="#1e3a8a" font-size="20" text-anchor="middle">跑过 ≠ 正确 ｜ 代码少 ≠ 改动小 ｜ 测试绿 ≠ 没造假 ｜ 能动 ≠ 敢上线</text>
  <text x="600" y="560" fill="#3b82f6" font-size="17" text-anchor="middle">这 6 条里中任何 1 条，这次验收就不算过</text>
</svg>
