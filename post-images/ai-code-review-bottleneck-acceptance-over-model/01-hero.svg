<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- conveyor belt of code blocks -->
  <g opacity="0.9">
    <rect x="60" y="70" width="240" height="60" rx="10" fill="#1e40af" opacity="0.55"/>
    <rect x="330" y="70" width="240" height="60" rx="10" fill="#1e40af" opacity="0.7"/>
    <rect x="600" y="70" width="240" height="60" rx="10" fill="#2563eb" opacity="0.85"/>
    <rect x="870" y="70" width="270" height="60" rx="10" fill="#3b82f6"/>
    <text x="90" y="107" fill="#bfdbfe" font-size="22">PR #1024</text>
    <text x="360" y="107" fill="#bfdbfe" font-size="22">PR #1025</text>
    <text x="630" y="107" fill="#dbeafe" font-size="22">PR #1026</text>
    <text x="900" y="107" fill="#eff6ff" font-size="22">PR #1027 ...</text>
    <text x="60" y="165" fill="#64748b" font-size="18">AI 24 小时不间断产出代码 →</text>
  </g>
  <!-- the human inspector -->
  <g transform="translate(120,330)">
    <circle cx="0" cy="0" r="46" fill="#f59e0b"/>
    <rect x="-40" y="46" width="80" height="110" rx="16" fill="#d97706"/>
    <!-- magnifier -->
    <circle cx="120" cy="40" r="52" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <line x1="158" y1="80" x2="205" y2="127" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text x="310" y="390" fill="#f8fafc" font-size="56" font-weight="bold">模型天天换，验收没人干</text>
  <text x="310" y="450" fill="#94a3b8" font-size="30">代码审查，才是 AI 编程时代的新瓶颈</text>
  <rect x="310" y="490" width="560" height="6" rx="3" fill="url(#accent)"/>
  <text x="310" y="545" fill="#7dd3fc" font-size="24">AI 写代码越来越快，你的「验收能力」跟上了吗？</text>
  <!-- stamp -->
  <g transform="translate(980,470) rotate(-12)">
    <rect x="-140" y="-50" width="280" height="100" rx="12" fill="none" stroke="#ef4444" stroke-width="6"/>
    <text x="0" y="15" fill="#ef4444" font-size="40" font-weight="bold" text-anchor="middle">验收合格?</text>
  </g>
</svg>
