<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="52" fill="#0f172a" font-size="30" font-weight="bold" text-anchor="middle">METR 随机对照试验：感觉 vs 实测（246 个真实任务）</text>

  <!-- baseline y=420 -->
  <line x1="120" y1="420" x2="1100" y2="420" stroke="#0f172a" stroke-width="3"/>
  <text x="140" y="408" fill="#0f172a" font-size="16">基准：不用 AI 的完成时间</text>

  <!-- +24% -->
  <rect x="200" y="228" width="160" height="192" rx="8" fill="#38bdf8"/>
  <text x="280" y="210" fill="#0369a1" font-size="28" font-weight="bold" text-anchor="middle">+24%</text>
  <text x="280" y="452" fill="#334155" font-size="20" text-anchor="middle">实验前预期</text>
  <text x="280" y="480" fill="#64748b" font-size="16" text-anchor="middle">“AI 能让我更快”</text>

  <!-- +20% -->
  <rect x="520" y="260" width="160" height="160" rx="8" fill="#818cf8"/>
  <text x="600" y="242" fill="#4338ca" font-size="28" font-weight="bold" text-anchor="middle">+20%</text>
  <text x="600" y="452" fill="#334155" font-size="20" text-anchor="middle">实验后感觉</text>
  <text x="600" y="480" fill="#64748b" font-size="16" text-anchor="middle">“我确实变快了”</text>

  <!-- -19% (below baseline) -->
  <rect x="840" y="420" width="160" height="152" rx="8" fill="#ef4444"/>
  <text x="920" y="404" fill="#b91c1c" font-size="28" font-weight="bold" text-anchor="middle">-19%</text>
  <text x="920" y="505" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">实测反而更慢</text>
  <text x="920" y="600" fill="#334155" font-size="20" text-anchor="middle">实测结果</text>

  <!-- 结论条 -->
  <rect x="120" y="540" width="620" height="100" rx="12" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text x="430" y="580" fill="#b91c1c" font-size="21" font-weight="bold" text-anchor="middle">感知与实测相差 39 个百分点</text>
  <text x="430" y="615" fill="#9f1239" font-size="18" text-anchor="middle">省下的时间，全被检查、改错、返工吃掉了</text>
</svg>
