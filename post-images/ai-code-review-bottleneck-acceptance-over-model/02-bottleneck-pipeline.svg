<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <rect width="1200" height="600" fill="#f8fafc"/>
  <text x="600" y="52" fill="#0f172a" font-size="32" font-weight="bold" text-anchor="middle">AI 编程流水线的「瓶颈迁移」</text>
  <text x="600" y="88" fill="#64748b" font-size="20" text-anchor="middle">写代码的环节越来越快，排队全部挤到了「验收」环节</text>

  <!-- 阶段1 -->
  <text x="180" y="150" fill="#334155" font-size="22" font-weight="bold" text-anchor="middle">① 需求 / Prompt</text>
  <rect x="80" y="170" width="200" height="70" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="212" fill="#0369a1" font-size="20" text-anchor="middle">人类 · 10 分钟</text>

  <!-- 阶段2 -->
  <text x="420" y="150" fill="#334155" font-size="22" font-weight="bold" text-anchor="middle">② 生成代码</text>
  <rect x="320" y="170" width="200" height="70" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="420" y="212" fill="#15803d" font-size="20" text-anchor="middle">AI · 3 分钟 ⚡</text>

  <!-- 阶段3 瓶颈 -->
  <text x="660" y="150" fill="#334155" font-size="22" font-weight="bold" text-anchor="middle">③ 验收 / Review</text>
  <rect x="540" y="170" width="240" height="110" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
  <text x="660" y="212" fill="#b91c1c" font-size="22" font-weight="bold" text-anchor="middle">人类 · 2 小时+</text>
  <text x="660" y="245" fill="#b91c1c" font-size="18" text-anchor="middle">排队堆积 ↓↓↓</text>
  <!-- 堆积的任务 -->
  <g>
    <rect x="560" y="300" width="200" height="26" rx="6" fill="#fecaca"/>
    <rect x="568" y="332" width="184" height="26" rx="6" fill="#fca5a5"/>
    <rect x="576" y="364" width="168" height="26" rx="6" fill="#f87171"/>
    <text x="660" y="420" fill="#991b1b" font-size="16" text-anchor="middle">未审查的 AI 代码越堆越高</text>
  </g>

  <!-- 阶段4 -->
  <text x="960" y="150" fill="#334155" font-size="22" font-weight="bold" text-anchor="middle">④ 合并上线</text>
  <rect x="880" y="170" width="200" height="70" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="980" y="212" fill="#475569" font-size="20" text-anchor="middle">等待验收通过…</text>

  <!-- arrows -->
  <line x1="280" y1="205" x2="318" y2="205" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="520" y1="205" x2="538" y2="205" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="780" y1="205" x2="878" y2="205" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- 类比条 -->
  <rect x="80" y="470" width="1040" height="100" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="512" fill="#92400e" font-size="22" font-weight="bold" text-anchor="middle">生活类比：餐厅换了 10 倍速的自动炒菜机</text>
  <text x="600" y="548" fill="#92400e" font-size="20" text-anchor="middle">出菜飞快，但试菜员只有 1 个 —— 出餐速度取决于试菜，而不是炒菜机</text>
</svg>
