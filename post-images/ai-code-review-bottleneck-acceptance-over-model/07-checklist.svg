<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica, Arial, 'PingFang SC', sans-serif">
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" fill="#0f172a" font-size="30" font-weight="bold" text-anchor="middle">一张「验收清单」：贴在你的工位上</text>
  <text x="600" y="86" fill="#64748b" font-size="19" text-anchor="middle">每次合并 AI 写的代码前，从上往下打勾 —— 全部 ✅ 才准 merge</text>

  <rect x="180" y="110" width="840" height="470" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- clipboard clip -->
  <rect x="520" y="92" width="160" height="40" rx="10" fill="#94a3b8"/>
  <circle cx="600" cy="112" r="10" fill="#f8fafc"/>

  <g font-size="21" fill="#334155">
    <text x="230" y="168"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">意图对得上</tspan>：这堆 diff 真的只做了我让它做的事？</text>
    <text x="230" y="214"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">没有夹带私货</tspan>：改动范围没有超出需求？（警惕顺手重构）</text>
    <text x="230" y="260"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">测试是真的</tspan>：断言会失败吗？（故意改错代码，看测试红不红）</text>
    <text x="230" y="306"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">关键路径亲读</tspan>：钱 / 数据 / 权限相关代码逐行看过？</text>
    <text x="230" y="352"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">无安全隐患</tspan>：密钥、注入、越权、日志泄密扫过一遍？</text>
    <text x="230" y="398"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">风格统一</tspan>：命名、分层、错误处理和项目一致？</text>
    <text x="230" y="444"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">能回滚</tspan>：提交足够小、5 分钟内可以干净 revert？</text>
    <text x="230" y="490"><tspan fill="#16a34a" font-size="24">✅</tspan>  <tspan font-weight="bold">我讲得清</tspan>：这段代码「为什么这么写」，我能向同事解释？</text>
  </g>
  <line x1="230" y1="512" x2="970" y2="512" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="548" fill="#b91c1c" font-size="20" font-weight="bold" text-anchor="middle">最后一条是底线：讲不清，就不 merge —— 你签的名，你负的责</text>
</svg>
