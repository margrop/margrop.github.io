<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460">
  <rect width="920" height="460" fill="#f4f9f4"/>
  <text x="460" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="bold" fill="#2c3e50">同样是画画：人类画家 vs 语言模型</text>

  <line x1="460" y1="80" x2="460" y2="420" stroke="#cfd8dc" stroke-width="3" stroke-dasharray="10,8"/>

  <!-- left: human painter -->
  <g>
    <circle cx="230" cy="200" r="58" fill="#ffe0b2" stroke="#d7a86e" stroke-width="3"/>
    <circle cx="212" cy="188" r="6" fill="#2c3e50"/>
    <circle cx="252" cy="188" r="6" fill="#2c3e50"/>
    <path d="M212,222 q20,16 40,0" stroke="#2c3e50" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="130" y="300" width="200" height="90" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="3"/>
    <path d="M150,370 q30,-40 60,-14 q26,-42 60,-10" stroke="#66bb6a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="205" cy="345" r="8" fill="#ef5350"/>
    <!-- loop arrows -->
    <path d="M330,180 q40,-40 0,-76" stroke="#43a047" stroke-width="5" fill="none" stroke-dasharray="10,7" marker-end="url(#arrG)"/>
    <path d="M330,220 q40,40 0,76" stroke="#43a047" stroke-width="5" fill="none" stroke-dasharray="10,7" marker-end="url(#arrG)"/>
    <text x="360" y="146" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#2e7d32">看一眼</text>
    <text x="360" y="278" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#2e7d32">改一笔</text>
    <text x="230" y="430" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">人类画家：画一笔，看一眼，改一下</text>
  </g>

  <!-- right: LLM blindfolded -->
  <g>
    <circle cx="690" cy="200" r="58" fill="#ffe0b2" stroke="#d7a86e" stroke-width="3"/>
    <rect x="628" y="176" width="124" height="26" rx="6" fill="#37474f"/>
    <path d="M640,180 L740,198" stroke="#90a4ae" stroke-width="4"/>
    <path d="M676,226 q16,12 32,0" stroke="#2c3e50" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- speech bubble with code -->
    <rect x="560" y="60" width="260" height="76" rx="12" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/>
    <path d="M680,136 l-8,20 l22,-20 z" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/>
    <text x="690" y="90" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#37474f">&lt;circle cx="240" cy="370" r="60"/&gt;</text>
    <text x="690" y="116" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#37474f">&lt;polygon points="..." /&gt;</text>
    <!-- one-way arrow to canvas -->
    <path d="M760,220 q60,30 60,80" stroke="#e53935" stroke-width="5" fill="none" marker-end="url(#arrR)"/>
    <rect x="640" y="300" width="200" height="90" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="3"/>
    <path d="M660,372 l36,-52 l30,36 l24,-58 l40,60" stroke="#ef9a9a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="690" y="430" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="bold" fill="#c62828">语言模型：蒙着眼睛，一次说完</text>
  </g>

  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#43a047"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#e53935"/></marker>
  </defs>
</svg>