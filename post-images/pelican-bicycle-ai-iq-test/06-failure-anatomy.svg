<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560">
  <rect width="920" height="560" fill="#fdf3f0"/>
  <text x="460" y="46" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="bold" fill="#c0392b">大模型鹈鹕图鉴 · 典型翻车现场</text>
  <line x1="30" y1="480" x2="620" y2="480" stroke="#8d6e63" stroke-width="4"/>

  <!-- broken bike: unequal wheels, rear wheel floating -->
  <circle cx="200" cy="360" r="70" fill="none" stroke="#34495e" stroke-width="7"/>
  <circle cx="420" cy="430" r="46" fill="none" stroke="#34495e" stroke-width="7"/>
  <line x1="200" y1="360" x2="330" y2="430" stroke="#34495e" stroke-width="7"/>
  <line x1="330" y1="430" x2="420" y2="430" stroke="#34495e" stroke-width="7"/>
  <line x1="330" y1="430" x2="300" y2="300" stroke="#34495e" stroke-width="7"/>
  <line x1="300" y1="300" x2="420" y2="430" stroke="#34495e" stroke-width="6"/>
  <line x1="300" y1="300" x2="452" y2="330" stroke="#34495e" stroke-width="6"/>
  <circle cx="452" cy="330" r="6" fill="#555"/>

  <!-- floating body -->
  <ellipse cx="290" cy="222" rx="62" ry="40" fill="#fdf6e3" stroke="#d9cfae" stroke-width="3" transform="rotate(-6 290 222)"/>
  <path d="M320,208 C338,196 344,176 360,162" fill="none" stroke="#d9cfae" stroke-width="26" stroke-linecap="round"/>
  <path d="M320,208 C338,196 344,176 360,162" fill="none" stroke="#fdf6e3" stroke-width="21" stroke-linecap="round"/>
  <circle cx="364" cy="158" r="19" fill="#fdf6e3" stroke="#d9cfae" stroke-width="3"/>
  <!-- beak fused into handlebar -->
  <path d="M368,152 L456,328 L382,168 Z" fill="#f5a623" stroke="#d48806" stroke-width="2"/>
  <circle cx="382" cy="150" r="3" fill="#22313f"/>
  <!-- both legs same (near) side -->
  <path d="M282,256 L306,320 L322,368" fill="none" stroke="#e67e22" stroke-width="6" stroke-linecap="round"/>
  <path d="M300,258 L322,322 L336,370" fill="none" stroke="#e67e22" stroke-width="6" stroke-linecap="round"/>
  <circle cx="330" cy="430" r="6" fill="#e67e22"/>

  <!-- red callouts -->
  <g fill="none" stroke="#e74c3c" stroke-width="3.5" stroke-dasharray="8,6">
    <circle cx="200" cy="404" r="44"/>
    <circle cx="420" cy="440" r="60"/>
    <circle cx="452" cy="330" r="34"/>
    <circle cx="306" cy="352" r="46"/>
    <circle cx="292" cy="272" r="52"/>
  </g>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#2c3e50">
    <text x="640" y="120">①  后轮悬空，离地 50px</text>
    <text x="640" y="170">②  前后轮一大一小（70px vs 46px）</text>
    <text x="640" y="220">③  嘴巴直接「焊」在车把上</text>
    <text x="640" y="270">④  两条腿长在同一侧</text>
    <text x="640" y="320">⑤  屁股离车座 30px，悬空开车</text>
    <text x="640" y="370">⑥  全车只有一个脚蹬子</text>
    <text x="640" y="420">⑦  眼睛点在了头顶外面</text>
  </g>
  <text x="460" y="540" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#95a5a6">七个错误全部来自真实模型输出中反复出现的失败模式（作者自绘示意）</text>
</svg>