<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500">
  <rect width="920" height="500" fill="#f3f7fb"/>
  <text x="460" y="44" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="bold" fill="#2c3e50">让「睁着眼睛」的 Agent 循环替你把关</text>

  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" text-anchor="middle">
    <rect x="30" y="180" width="170" height="76" rx="12" fill="#ffffff" stroke="#5c8ac9" stroke-width="3"/>
    <text x="115" y="212" fill="#2c3e50">出题</text>
    <text x="115" y="238" font-size="14" fill="#7f8c8d">鹈鹕骑车动画</text>

    <rect x="250" y="180" width="170" height="76" rx="12" fill="#ffffff" stroke="#5c8ac9" stroke-width="3"/>
    <text x="335" y="212" fill="#2c3e50">生成 SVG</text>
    <text x="335" y="238" font-size="14" fill="#7f8c8d">蒙眼作画</text>

    <rect x="470" y="180" width="170" height="76" rx="12" fill="#ffffff" stroke="#8e6cc9" stroke-width="3"/>
    <text x="555" y="212" fill="#2c3e50">渲染成图</text>
    <text x="555" y="238" font-size="14" fill="#7f8c8d">给它「眼睛」</text>

    <rect x="690" y="168" width="200" height="100" rx="12" fill="#ffffff" stroke="#8e6cc9" stroke-width="3"/>
    <text x="790" y="198" fill="#2c3e50">视觉自检</text>
    <text x="790" y="224" font-size="13.5" fill="#7f8c8d">轮子接地了吗？</text>
    <text x="790" y="246" font-size="13.5" fill="#7f8c8d">嘴缠到车把了吗？</text>

    <rect x="470" y="340" width="170" height="76" rx="12" fill="#fff8e1" stroke="#e6a23c" stroke-width="3"/>
    <text x="555" y="372" fill="#8d5b00">发回修改</text>
    <text x="555" y="398" font-size="14" fill="#a9761f">截图 + 问题清单</text>

    <rect x="30" y="340" width="170" height="76" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="3"/>
    <text x="115" y="372" fill="#1b5e20">通过，收工 ✅</text>
    <text x="115" y="398" font-size="14" fill="#388e3c">自己先当面试官</text>
  </g>

  <g stroke="#546e7a" stroke-width="4" fill="none">
    <path d="M200,218 L244,218" marker-end="url(#arrB)"/>
    <path d="M420,218 L464,218" marker-end="url(#arrB)"/>
    <path d="M640,218 L684,218" marker-end="url(#arrB)"/>
  </g>
  <path d="M790,268 C790,330 680,352 646,368" stroke="#e6a23c" stroke-width="4" fill="none" marker-end="url(#arrO)"/>
  <text x="712" y="322" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e6a23c">不通过</text>
  <path d="M555,340 C555,300 440,258 428,240" stroke="#e6a23c" stroke-width="4" fill="none" marker-end="url(#arrO)"/>
  <text x="412" y="300" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#e6a23c">循环 2-4 轮</text>
  <path d="M790,268 C790,452 420,452 208,382" stroke="#43a047" stroke-width="4" fill="none" marker-end="url(#arrG2)"/>
  <text x="500" y="446" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#43a047">通过</text>

  <defs>
    <marker id="arrB" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#546e7a"/></marker>
    <marker id="arrO" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#e6a23c"/></marker>
    <marker id="arrG2" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#43a047"/></marker>
  </defs>
  <text x="460" y="488" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#95a5a6">生成 → 渲染 → 自检 → 修改的闭环，等价于给「蒙眼画家」配了一位监考老师（作者自绘）</text>
</svg>