<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow-6" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1000" height="540" rx="16" fill="url(#bg-grad-6)" />

  <text x="500" y="44" fill="#f8fafc" font-size="22" font-family="sans-serif" font-weight="700" text-anchor="middle">信封加密与“单向绝密投币箱”比喻</text>
  <text x="500" y="72" fill="#94a3b8" font-size="14" font-family="sans-serif" text-anchor="middle">为什么说这不是“用户备份”，而是“单向数据收割”？</text>

  <!-- Left Card: Technical Implementation -->
  <g transform="translate(60, 100)" filter="url(#shadow-6)">
    <rect width="410" height="390" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="42" rx="12" fill="#374151" />
    <text x="205" y="27" fill="#60a5fa" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="middle">💻 技术实现：信封加密 (Envelope Encryption)</text>

    <!-- Sub boxes -->
    <g transform="translate(20, 60)">
      <rect width="370" height="65" rx="8" fill="#111827" stroke="#3b82f6" />
      <text x="15" y="24" fill="#93c5fd" font-size="13" font-weight="700" font-family="sans-serif">1. 源码与 .git 数据打包加密</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">AES-256-CTR (使用随机生成的会话对称密钥 K)</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="370" height="65" rx="8" fill="#111827" stroke="#8b5cf6" />
      <text x="15" y="24" fill="#c4b5fd" font-size="13" font-weight="700" font-family="sans-serif">2. 包装对称密钥 K (Key Wrapping)</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">RSA-OAEP-SHA256 (使用服务端下发的动态公钥)</text>
    </g>

    <g transform="translate(20, 220)">
      <rect width="370" height="85" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5" />
      <text x="15" y="24" fill="#f87171" font-size="13" font-weight="700" font-family="sans-serif">3. 私钥所有权与解密能力</text>
      <text x="15" y="46" fill="#fca5a5" font-size="11" font-weight="600" font-family="sans-serif">❌ 本地用户：无私钥，无法解密本地生成的 .enc</text>
      <text x="15" y="66" fill="#fca5a5" font-size="11" font-weight="600" font-family="sans-serif">❌ ZCode 客户端：无私钥，无法执行本地回退</text>
    </g>

    <g transform="translate(20, 320)">
      <rect width="370" height="50" rx="8" fill="#1e3a8a" stroke="#60a5fa" />
      <text x="185" y="30" fill="#ffffff" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">🔑 只有云端服务器持有 RSA 私钥能够解密！</text>
    </g>
  </g>

  <!-- Right Card: Kid-friendly Analogy -->
  <g transform="translate(530, 100)" filter="url(#shadow-6)">
    <rect width="410" height="390" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="42" rx="12" fill="#374151" />
    <text x="205" y="27" fill="#fbbf24" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="middle">📮 通俗比喻：街头特制投币保险箱</text>

    <g transform="translate(20, 60)">
      <rect width="370" height="65" rx="8" fill="#111827" stroke="#f59e0b" />
      <text x="15" y="24" fill="#fde68a" font-size="13" font-weight="700" font-family="sans-serif">1. 塞入全部日记与秘密</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="12" font-family="sans-serif">你把整本日记（代码 + 过去写的所有草稿涂改）塞进盒子</text>
    </g>

    <g transform="translate(20, 140)">
      <rect width="370" height="65" rx="8" fill="#111827" stroke="#f59e0b" />
      <text x="15" y="24" fill="#fde68a" font-size="13" font-weight="700" font-family="sans-serif">2. 啪嗒一声！大铜锁自动锁死</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="12" font-family="sans-serif">盒子用公司特供的铜锁锁死，谁都可以随手按下锁头</text>
    </g>

    <g transform="translate(20, 220)">
      <rect width="370" height="85" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5" />
      <text x="15" y="24" fill="#f87171" font-size="13" font-weight="700" font-family="sans-serif">3. 谁有开锁的钥匙？</text>
      <text x="15" y="46" fill="#fca5a5" font-size="12" font-family="sans-serif">❌ 你手里没有钥匙，你自己打不开！</text>
      <text x="15" y="66" fill="#fca5a5" font-size="12" font-family="sans-serif">❌ 帮你跑腿的快递员也没有钥匙！</text>
    </g>

    <g transform="translate(20, 320)">
      <rect width="370" height="50" rx="8" fill="#78350f" stroke="#f59e0b" />
      <text x="185" y="30" fill="#fef3c7" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">🏛️ 唯独远在千里之外的总公司仓库有这把钥匙！</text>
    </g>
  </g>

  <text x="500" y="515" fill="#94a3b8" font-size="12" font-family="sans-serif" text-anchor="middle">💡 灵魂发问：如果是为了给用户自己做“本地时光机”，为什么本地连解密的能力都不配拥有？</text>
</svg>
