<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
  </defs>

  <rect width="1000" height="500" rx="16" fill="url(#bg-grad-9)" />

  <text x="500" y="42" fill="#f8fafc" font-size="22" font-family="sans-serif" font-weight="700" text-anchor="middle">删文件为何成了“打地鼠”？内核不可变锁破局对比</text>
  <text x="500" y="70" fill="#94a3b8" font-size="14" font-family="sans-serif" text-anchor="middle">对比手动删除（陷入无限重试死循环）与操作系统内核不可变标志（直接击毙写入行为）</text>

  <!-- Left: Whack A Mole Loop -->
  <g transform="translate(60, 95)">
    <rect width="410" height="360" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="40" rx="12" fill="#7f1d1d" />
    <text x="205" y="26" fill="#fecaca" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="middle">❌ 徒劳的打地鼠循环 (手动 rm -rf)</text>

    <!-- Flow nodes -->
    <g transform="translate(30, 60)">
      <rect width="350" height="45" rx="8" fill="#0f172a" stroke="#ef4444" />
      <text x="175" y="28" fill="#fca5a5" font-size="12" font-family="sans-serif" text-anchor="middle">1. 用户发现 313MB 密文，手动执行 rm 删除</text>
    </g>

    <g transform="translate(30, 130)">
      <rect width="350" height="45" rx="8" fill="#0f172a" stroke="#f59e0b" />
      <text x="175" y="28" fill="#fde68a" font-size="12" font-family="sans-serif" text-anchor="middle">2. ZCode 观察者发现 baseline 丢失</text>
    </g>

    <g transform="translate(30, 200)">
      <rect width="350" height="45" rx="8" fill="#0f172a" stroke="#ef4444" />
      <text x="175" y="28" fill="#fca5a5" font-size="12" font-family="sans-serif" text-anchor="middle">3. 触发重试：重新遍历工作区与 .git 重新打包</text>
    </g>

    <g transform="translate(30, 270)">
      <rect width="350" height="60" rx="8" fill="#450a0a" stroke="#ef4444" />
      <text x="175" y="26" fill="#fecaca" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">4. 生成全新 313MB 密文，failureCount + 1</text>
      <text x="175" y="46" fill="#fca5a5" font-size="11" font-family="monospace" text-anchor="middle">卡在 pending 队列，死循环消耗 CPU 和磁盘</text>
    </g>
  </g>

  <!-- Right: Kernel Immutable Lock -->
  <g transform="translate(530, 95)">
    <rect width="410" height="360" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="40" rx="12" fill="#064e3b" />
    <text x="205" y="26" fill="#a7f3d0" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="middle">✅ 内核不可变锁 (chflags uchg / chattr +i)</text>

    <g transform="translate(30, 60)">
      <rect width="350" height="45" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="175" y="28" fill="#6ee7b7" font-size="12" font-family="sans-serif" text-anchor="middle">1. 清空 checkpoints 目录并打上内核保护标志</text>
    </g>

    <g transform="translate(30, 130)">
      <rect width="350" height="45" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="175" y="28" fill="#6ee7b7" font-size="12" font-family="sans-serif" text-anchor="middle">2. ZCode 尝试创建快照打包文件或状态文件</text>
    </g>

    <g transform="translate(30, 200)">
      <rect width="350" height="50" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="175" y="22" fill="#a7f3d0" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">🛡️ 操作系统内核直接拦截！</text>
      <text x="175" y="40" fill="#6ee7b7" font-size="11" font-family="monospace" text-anchor="middle">EPERM: Operation not permitted</text>
    </g>

    <g transform="translate(30, 270)">
      <rect width="350" height="60" rx="8" fill="#022c22" stroke="#10b981" />
      <text x="175" y="26" fill="#a7f3d0" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">4. 本地无密文产物，向 OSS 上传流程胎死腹中</text>
      <text x="175" y="46" fill="#6ee7b7" font-size="11" font-family="sans-serif" text-anchor="middle">日常代码补全、智能体对话等不受任何干扰</text>
    </g>
  </g>
</svg>
