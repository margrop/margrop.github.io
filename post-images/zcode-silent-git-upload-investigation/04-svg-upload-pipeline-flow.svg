<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="auth-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="oss-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1000" height="560" rx="16" fill="url(#bg-grad)" />

  <text x="500" y="46" fill="#f8fafc" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" text-anchor="middle">ZCode 工作区快照静默打包直传 OSS 完整链路时序</text>
  <text x="500" y="74" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">绕过业务核心集群，通过动态公钥与表单签名直甩公有云对象存储</text>

  <!-- Lifeline headers -->
  <!-- Entity 1: Client -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="200" height="50" rx="10" fill="url(#client-grad)" />
    <text x="100" y="26" fill="#ffffff" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">ZCode 客户端</text>
    <text x="100" y="42" fill="#dbeafe" font-size="11" font-family="monospace" text-anchor="middle">SnapshotSidecar (Local)</text>
  </g>
  <line x1="200" y1="150" x2="200" y2="520" stroke="#334155" stroke-dasharray="6 6" stroke-width="2" />

  <!-- Entity 2: Coordination Server -->
  <g transform="translate(400, 100)" filter="url(#shadow)">
    <rect width="200" height="50" rx="10" fill="url(#auth-grad)" />
    <text x="100" y="26" fill="#ffffff" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">智谱协调服务</text>
    <text x="100" y="42" fill="#ede9fe" font-size="11" font-family="monospace" text-anchor="middle">zcode.z.ai / API</text>
  </g>
  <line x1="500" y1="150" x2="500" y2="520" stroke="#334155" stroke-dasharray="6 6" stroke-width="2" />

  <!-- Entity 3: Aliyun OSS -->
  <g transform="translate(700, 100)" filter="url(#shadow)">
    <rect width="200" height="50" rx="10" fill="url(#oss-grad)" />
    <text x="100" y="26" fill="#ffffff" font-size="14" font-weight="700" font-family="sans-serif" text-anchor="middle">阿里云 OSS 集群</text>
    <text x="100" y="42" fill="#fef3c7" font-size="11" font-family="monospace" text-anchor="middle">*.oss-cn-beijing.aliyuncs.com</text>
  </g>
  <line x1="800" y1="150" x2="800" y2="520" stroke="#334155" stroke-dasharray="6 6" stroke-width="2" />

  <!-- Steps -->
  <!-- Step 1 -->
  <g transform="translate(0, 180)">
    <line x1="200" y1="0" x2="500" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />
    <polygon points="496,-5 506,0 496,5" fill="#60a5fa" />
    <rect x="220" y="-18" width="260" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="350" y="-2" fill="#93c5fd" font-size="12" font-weight="600" font-family="sans-serif" text-anchor="middle">1. POST /api/v1/snapshot/upload-credential (携带JWT)</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(0, 240)">
    <line x1="500" y1="0" x2="200" y2="0" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 3" />
    <polygon points="204,-5 194,0 204,5" fill="#a78bfa" />
    <rect x="220" y="-28" width="260" height="36" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="350" y="-14" fill="#c4b5fd" font-size="12" font-weight="600" font-family="sans-serif" text-anchor="middle">2. 下发 OSS 表单签名 + RSA 动态公钥</text>
    <text x="350" y="2" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">{snapshot_id, key, policy, signature, rsa_pubkey}</text>
  </g>

  <!-- Step 3 (Client self action) -->
  <g transform="translate(0, 310)">
    <rect x="70" y="-20" width="260" height="42" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="200" y="-3" fill="#f87171" font-size="11" font-weight="700" font-family="sans-serif" text-anchor="middle">3. 本地打包 + 流式信封加密</text>
    <text x="200" y="14" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">tar.gz(含.git 86.6%) → AES-256 → RSA-OAEP</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(0, 390)">
    <line x1="200" y1="0" x2="800" y2="0" stroke="#f59e0b" stroke-width="2.5" />
    <polygon points="796,-6 808,0 796,6" fill="#f59e0b" />
    <rect x="360" y="-28" width="280" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="500" y="-12" fill="#fcd34d" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">4. HTTP POST 表单直接直传 OSS (313MB+)</text>
    <text x="500" y="5" fill="#fef08a" font-size="10" font-family="monospace" text-anchor="middle">绕过业务服务器！直接向阿里云 OSS 写入 tar.gz.enc</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(0, 460)">
    <line x1="800" y1="0" x2="500" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="504,-5 494,0 504,5" fill="#10b981" />
    <rect x="540" y="-18" width="220" height="24" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="650" y="-2" fill="#6ee7b7" font-size="12" font-weight="600" font-family="sans-serif" text-anchor="middle">5. OSS Server Callback 通知入库</text>
  </g>

  <rect x="80" y="500" width="840" height="36" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="500" y="523" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">⚠️ 关键结论：客户端不经中间审核，直接把整个本地 .git 数据库加密推送到云端对象存储桶</text>
</svg>
