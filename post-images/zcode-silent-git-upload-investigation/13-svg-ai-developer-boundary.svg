<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1000" height="480" rx="16" fill="url(#bg-grad-13)" />

  <text x="500" y="44" fill="#f8fafc" font-size="22" font-family="sans-serif" font-weight="700" text-anchor="middle">AI 编程助手的合法边界：上下文索引 vs 仓库历史收割</text>
  <text x="500" y="72" fill="#94a3b8" font-size="14" font-family="sans-serif" text-anchor="middle">用技术准绳厘清“正常 AI 辅助”与“侵犯数据主权”的天壤之别</text>

  <!-- Left: Legitimate Context -->
  <g transform="translate(60, 100)">
    <rect width="410" height="340" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="40" rx="12" fill="#1e3a8a" />
    <text x="205" y="26" fill="#bfdbfe" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="middle">🟢 正当的 AI 上下文检索 (合法边界内)</text>

    <g transform="translate(20, 60)">
      <text x="0" y="18" fill="#93c5fd" font-size="13" font-weight="700" font-family="sans-serif">● 按需提取当前文件与符号</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">仅将用户光标所在文件、导入声明及相关函数送入 Prompt</text>
    </g>

    <g transform="translate(20, 125)">
      <text x="0" y="18" fill="#93c5fd" font-size="13" font-weight="700" font-family="sans-serif">● 本地向量化检索 (Local Embedding / RAG)</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">知识库在开发者本地构建索引，仅将命中的代码片段出网</text>
    </g>

    <g transform="translate(20, 190)">
      <text x="0" y="18" fill="#93c5fd" font-size="13" font-weight="700" font-family="sans-serif">● 遵循 .gitignore 与排除规则</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">严格禁止窥探二进制、环境变量、秘钥及版本库底层</text>
    </g>

    <g transform="translate(20, 255)">
      <text x="0" y="18" fill="#93c5fd" font-size="13" font-weight="700" font-family="sans-serif">● 透明可控的用户授权机制</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">每次大额数据上云必须弹窗授权，密钥由用户本地支配</text>
    </g>
  </g>

  <!-- Right: Overstepping -->
  <g transform="translate(530, 100)">
    <rect width="410" height="340" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="40" rx="12" fill="#7f1d1d" />
    <text x="205" y="26" fill="#fecaca" font-size="15" font-weight="700" font-family="sans-serif" text-anchor="middle">🔴 越界的静默快照收割 (引发恐慌的根源)</text>

    <g transform="translate(20, 60)">
      <text x="0" y="18" fill="#fca5a5" font-size="13" font-weight="700" font-family="sans-serif">● 打包全量底层版本库 (.git 占比 86.6%)</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">将包括 LFS 附件、commit历史、已删除敏感记录全部打包</text>
    </g>

    <g transform="translate(20, 125)">
      <text x="0" y="18" fill="#fca5a5" font-size="13" font-weight="700" font-family="sans-serif">● 单向盲盒信封加密</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">私钥仅服务端独享，本地无法审计，宣称备份实则不可读</text>
    </g>

    <g transform="translate(20, 190)">
      <text x="0" y="18" fill="#fca5a5" font-size="13" font-weight="700" font-family="sans-serif">● 设置界面开关沦为虚设</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">关闭体验优化与索引后，底层后台上传 sidecar 依然全开</text>
    </g>

    <g transform="translate(20, 255)">
      <text x="0" y="18" fill="#fca5a5" font-size="13" font-weight="700" font-family="sans-serif">● 隐私协议零披露与静默执拗重传</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif">删除了重新打，上百次死循环重传，对底层行为缺乏敬畏</text>
    </g>
  </g>
</svg>
