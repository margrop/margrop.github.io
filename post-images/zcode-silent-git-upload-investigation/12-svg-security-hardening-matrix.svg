<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1000" height="520" rx="16" fill="url(#bg-grad-12)" />

  <text x="500" y="45" fill="#f8fafc" font-size="22" font-family="sans-serif" font-weight="700" text-anchor="middle">多维度安全防御与阻断策略效能矩阵</text>
  <text x="500" y="75" fill="#94a3b8" font-size="14" font-family="sans-serif" text-anchor="middle">从文件系统、网络边界、Git 规范到官方补丁的综合对比</text>

  <!-- Table Header -->
  <g transform="translate(50, 105)">
    <rect width="900" height="42" rx="8" fill="#334155" />
    <text x="130" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">防御策略方案</text>
    <text x="320" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">阻断层级</text>
    <text x="490" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">阻断效果</text>
    <text x="660" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">功能影响</text>
    <text x="810" y="26" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">推荐评级</text>
  </g>

  <!-- Row 1: Filesystem Immutable Lock -->
  <g transform="translate(50, 160)">
    <rect width="900" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="130" y="32" fill="#34d399" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">内核文件系统锁</text>
    <text x="130" y="50" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">chflags / chattr / ACL</text>
    <text x="320" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">OS 存储内核层</text>
    <text x="490" y="38" fill="#34d399" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">100% 杜绝密文生成</text>
    <text x="660" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">仅快照回滚不可用</text>
    <text x="810" y="38" fill="#34d399" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">⭐⭐⭐⭐⭐ 极力推荐</text>
  </g>

  <!-- Row 2: DNS Sinkhole -->
  <g transform="translate(50, 235)">
    <rect width="900" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="130" y="32" fill="#60a5fa" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">DNS 黑洞 / 域名劫持</text>
    <text x="130" y="50" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">/etc/hosts 指向 0.0.0.0</text>
    <text x="320" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">网络解析层</text>
    <text x="490" y="38" fill="#60a5fa" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">阻断凭证获取与直传</text>
    <text x="660" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">Wiki生成/检查点失效</text>
    <text x="810" y="38" fill="#60a5fa" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">⭐⭐⭐⭐ 强力推荐</text>
  </g>

  <!-- Row 3: Manual Deletion -->
  <g transform="translate(50, 310)">
    <rect width="900" height="65" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="130" y="32" fill="#f87171" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">单纯手动删除目录</text>
    <text x="130" y="50" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">rm -rf ~/.zcode/v2/...</text>
    <text x="320" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">用户文件操作</text>
    <text x="490" y="38" fill="#f87171" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">完全无效 (自动重传)</text>
    <text x="660" y="38" fill="#f87171" font-size="12" font-family="sans-serif" text-anchor="middle">白白浪费 CPU 与 IO</text>
    <text x="810" y="38" fill="#f87171" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">❌ 不推荐 (打地鼠)</text>
  </g>

  <!-- Row 4: Official Client Update -->
  <g transform="translate(50, 385)">
    <rect width="900" height="65" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="130" y="32" fill="#c084fc" font-size="13" font-weight="700" font-family="sans-serif" text-anchor="middle">升级官方最新修复版</text>
    <text x="130" y="50" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">待官方开源与修复发布</text>
    <text x="320" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">软件应用层</text>
    <text x="490" y="38" fill="#c084fc" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">从根源关闭静默上传</text>
    <text x="660" y="38" fill="#cbd5e1" font-size="12" font-family="sans-serif" text-anchor="middle">需验证开关与审计代码</text>
    <text x="810" y="38" fill="#c084fc" font-size="13" font-weight="800" font-family="sans-serif" text-anchor="middle">⭐⭐⭐⭐ 长期方案</text>
  </g>

  <rect x="50" y="465" width="900" height="38" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="500" y="489" fill="#94a3b8" font-size="12" font-family="sans-serif" text-anchor="middle">💡 最佳实践组合拳：内核锁 + DNS 兜底阻断 + 审计待推远端的 Git Commit 敏感资产</text>
</svg>
