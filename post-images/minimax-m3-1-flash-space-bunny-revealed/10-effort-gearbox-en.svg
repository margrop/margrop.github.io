<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,'Segoe UI',Arial,sans-serif">
<rect width="1200" height="610" fill="#0b1020"/>
<text x="600" y="50" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="bold">Five effort levels: gears on a bicycle</text>
<text x="600" y="84" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="normal">Thinking is always on. You can shift gears but not turn it off (disabling returns 400)</text>
<rect x="70" y="300" width="180" height="60" rx="10" fill="#34d399" opacity="0.85"/>
<text x="160" y="286" font-size="22" fill="#34d399" text-anchor="middle" font-weight="bold">low</text>
<rect x="70" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#34d399" stroke-width="2"/>
<text x="160" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">1st: low</text>
<text x="160" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">flat road</text>
<text x="160" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">format / classify</text>
<text x="160" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">lowest latency</text>
<rect x="285" y="260" width="180" height="100" rx="10" fill="#38bdf8" opacity="0.85"/>
<text x="375" y="246" font-size="22" fill="#38bdf8" text-anchor="middle" font-weight="bold">medium</text>
<rect x="285" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#38bdf8" stroke-width="2"/>
<text x="375" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">2nd: medium</text>
<text x="375" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">daily commute</text>
<text x="375" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">small funcs / explain</text>
<text x="375" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">value gear</text>
<rect x="500" y="220" width="180" height="140" rx="10" fill="#a78bfa" opacity="0.85"/>
<text x="590" y="206" font-size="22" fill="#a78bfa" text-anchor="middle" font-weight="bold">high</text>
<rect x="500" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#a78bfa" stroke-width="2"/>
<text x="590" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">3rd: high</text>
<text x="590" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">small hill</text>
<text x="590" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">bug fix / tests</text>
<text x="590" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">enough for most</text>
<rect x="715" y="180" width="180" height="180" rx="10" fill="#fbbf24" opacity="0.85"/>
<text x="805" y="166" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">xhigh</text>
<rect x="715" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#fbbf24" stroke-width="2"/>
<text x="805" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">4th: xhigh</text>
<text x="805" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">long climb</text>
<text x="805" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">cross-file refactor</text>
<text x="805" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">clearly slower</text>
<rect x="930" y="140" width="180" height="220" rx="10" fill="#f43f5e" opacity="0.85"/>
<text x="1020" y="126" font-size="22" fill="#f43f5e" text-anchor="middle" font-weight="bold">max</text>
<rect x="930" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#f43f5e" stroke-width="2"/>
<text x="1020" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">5th: max</text>
<text x="1020" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">steepest hill</text>
<text x="1020" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">the default</text>
<text x="1020" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">watch token budget</text>
<text x="70" y="120" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">Taller bar = longer thinking, more tokens, slower, pricier</text>
<rect x="70" y="545" width="1060" height="40" rx="10" fill="#0f172a" stroke="#2a3550" stroke-width="2"/>
<text x="600" y="571" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="normal">Rule of thumb: start at high, shift up on failure, drop to low/medium for bulk jobs</text>
</svg>
