<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,'Segoe UI',Arial,sans-serif">
<rect width="1200" height="600" fill="#0b1020"/>
<text x="600" y="50" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="bold">我该怎么用 M3.1 Flash？</text>
<text x="600" y="84" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="normal">按你手头的情况对号入座（价格以官方页面为准）</text>
<rect x="400" y="110" width="400" height="60" rx="30" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
<text x="600" y="148" font-size="19" fill="#fbbf24" text-anchor="middle" font-weight="bold">你现在最在意什么？</text>
<path d="M600,170 L170,230" stroke="#2a3550" stroke-width="3" fill="none"/>
<rect x="40" y="230" width="260" height="300" rx="14" fill="#151c2f" stroke="#34d399" stroke-width="2"/>
<text x="170" y="268" font-size="19" fill="#34d399" text-anchor="middle" font-weight="bold">想零成本试一试</text>
<text x="60" y="312" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">OpenRouter 免费版</text>
<text x="60" y="344" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">minimax-m3.1-flash:free</text>
<text x="60" y="376" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">免费档实测约 64 tok/s</text>
<text x="60" y="408" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">排队和限速都正常</text>
<text x="60" y="440" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">别放敏感代码</text>
<path d="M600,170 L455,230" stroke="#2a3550" stroke-width="3" fill="none"/>
<rect x="325" y="230" width="260" height="300" rx="14" fill="#151c2f" stroke="#38bdf8" stroke-width="2"/>
<text x="455" y="268" font-size="19" fill="#38bdf8" text-anchor="middle" font-weight="bold">按量付费跑 Agent</text>
<text x="345" y="312" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">官方 API</text>
<text x="345" y="344" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">$0.15 入 / $0.60 出</text>
<text x="345" y="376" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">缓存命中 $0.015</text>
<text x="345" y="408" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">Anthropic 兼容接口</text>
<text x="345" y="440" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">Claude Code 可直连</text>
<path d="M600,170 L740,230" stroke="#2a3550" stroke-width="3" fill="none"/>
<rect x="610" y="230" width="260" height="300" rx="14" fill="#151c2f" stroke="#a78bfa" stroke-width="2"/>
<text x="740" y="268" font-size="19" fill="#a78bfa" text-anchor="middle" font-weight="bold">天天写代码</text>
<text x="630" y="312" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">M Plan + MiniMax Code</text>
<text x="630" y="344" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">订阅制不用算账</text>
<text x="630" y="376" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">预览期就已开放</text>
<text x="630" y="408" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">适合高频交互</text>
<text x="630" y="440" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">注意套餐额度</text>
<path d="M600,170 L1025,230" stroke="#2a3550" stroke-width="3" fill="none"/>
<rect x="895" y="230" width="260" height="300" rx="14" fill="#151c2f" stroke="#f43f5e" stroke-width="2"/>
<text x="1025" y="268" font-size="19" fill="#f43f5e" text-anchor="middle" font-weight="bold">要本地部署</text>
<text x="915" y="312" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">再等等</text>
<text x="915" y="344" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">官方说权重稍后发布</text>
<text x="915" y="376" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">目前只能调云端</text>
<text x="915" y="408" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">合规场景先评估</text>
<text x="915" y="440" font-size="15" fill="#f1f5f9" text-anchor="start" font-weight="normal">或继续用 M3</text>
<text x="600" y="570" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="normal">提示：官方说 Pro 版也会晚些到来，追求极限智力的任务可以先观望</text>
</svg>
