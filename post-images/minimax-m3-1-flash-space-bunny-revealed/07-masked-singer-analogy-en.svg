<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,'Segoe UI',Arial,sans-serif">
<rect width="1200" height="600" fill="#0b1020"/>
<text x="600" y="50" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="bold">An analogy: a masked singing contest</text>
<text x="600" y="84" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="normal">Think of stealth model, preview, and GA as one masked singer TV show</text>
<rect x="50" y="120" width="340" height="400" rx="16" fill="#151c2f" stroke="#38bdf8" stroke-width="2"/>
<rect x="50" y="120" width="340" height="56" rx="16" fill="#38bdf8" opacity="0.25"/>
<text x="220" y="156" font-size="21" fill="#38bdf8" text-anchor="middle" font-weight="bold">Act 1: bunny mask on</text>
<circle cx="220" cy="215" r="26" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="220" y="225" font-size="28" fill="#38bdf8" text-anchor="middle" font-weight="bold">1</text>
<text x="74" y="280" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">Singer wears a mask</text>
<text x="74" y="314" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">Audience judges the voice</text>
<text x="74" y="348" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">No name means</text>
<text x="74" y="382" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">no brand bias</text>
<text x="74" y="416" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">= anonymous OpenRouter</text>
<text x="74" y="450" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">devs judge by results</text>
<rect x="430" y="120" width="340" height="400" rx="16" fill="#151c2f" stroke="#a78bfa" stroke-width="2"/>
<rect x="430" y="120" width="340" height="56" rx="16" fill="#a78bfa" opacity="0.25"/>
<text x="600" y="156" font-size="21" fill="#a78bfa" text-anchor="middle" font-weight="bold">Act 2: guess who</text>
<circle cx="600" cy="215" r="26" fill="none" stroke="#a78bfa" stroke-width="3"/>
<text x="600" y="225" font-size="28" fill="#a78bfa" text-anchor="middle" font-weight="bold">2</text>
<text x="454" y="280" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">Some hear vocal habits</text>
<text x="454" y="314" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">Some spot the shoes</text>
<text x="454" y="348" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">Detectives gather clues</text>
<text x="454" y="382" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">Some guess wrong</text>
<text x="454" y="416" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">= tokenizer fingerprints</text>
<text x="454" y="450" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">we guessed wrong</text>
<rect x="810" y="120" width="340" height="400" rx="16" fill="#151c2f" stroke="#f43f5e" stroke-width="2"/>
<rect x="810" y="120" width="340" height="56" rx="16" fill="#f43f5e" opacity="0.25"/>
<text x="980" y="156" font-size="21" fill="#f43f5e" text-anchor="middle" font-weight="bold">Act 3: mask off</text>
<circle cx="980" cy="215" r="26" fill="none" stroke="#f43f5e" stroke-width="3"/>
<text x="980" y="225" font-size="28" fill="#f43f5e" text-anchor="middle" font-weight="bold">3</text>
<text x="834" y="280" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">Host reveals the name</text>
<text x="834" y="314" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">and the official album</text>
<text x="834" y="348" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">debuts with real fans</text>
<text x="834" y="382" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">prices now public</text>
<text x="834" y="416" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">= M3.1 Flash launch</text>
<text x="834" y="450" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">price and scores out</text>
<path d="M396,320 L422,320" stroke="#fbbf24" stroke-width="4"/><path d="M418,310 L428,320 L418,330 Z" fill="#fbbf24"/>
<path d="M776,320 L802,320" stroke="#fbbf24" stroke-width="4"/><path d="M798,310 L808,320 L798,330 Z" fill="#fbbf24"/>
<text x="600" y="565" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="normal">Upside: honest feedback. Cost: stealth prompts may be retained, so never send secrets</text>
</svg>
