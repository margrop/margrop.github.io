<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,'Segoe UI',Arial,sans-serif">
<rect width="1200" height="600" fill="#0b1020"/>
<text x="600" y="50" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="bold">打个比方：蒙面唱歌比赛</text>
<text x="600" y="84" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="normal">把“隐形模型 → 预览版 → 正式版”想成一档蒙面歌唱节目</text>
<rect x="50" y="120" width="340" height="400" rx="16" fill="#151c2f" stroke="#38bdf8" stroke-width="2"/>
<rect x="50" y="120" width="340" height="56" rx="16" fill="#38bdf8" opacity="0.25"/>
<text x="220" y="156" font-size="21" fill="#38bdf8" text-anchor="middle" font-weight="bold">第一幕：戴兔子头套</text>
<circle cx="220" cy="215" r="26" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="220" y="225" font-size="28" fill="#38bdf8" text-anchor="middle" font-weight="bold">1</text>
<text x="74" y="280" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">歌手戴头套上台</text>
<text x="74" y="314" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">观众只听声音打分</text>
<text x="74" y="348" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">不知道是谁，就不会</text>
<text x="74" y="382" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">因为名气偏心</text>
<text x="74" y="416" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">= 匿名上架 OpenRouter</text>
<text x="74" y="450" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">开发者只看效果用不用</text>
<rect x="430" y="120" width="340" height="400" rx="16" fill="#151c2f" stroke="#a78bfa" stroke-width="2"/>
<rect x="430" y="120" width="340" height="56" rx="16" fill="#a78bfa" opacity="0.25"/>
<text x="600" y="156" font-size="21" fill="#a78bfa" text-anchor="middle" font-weight="bold">第二幕：观众猜身份</text>
<circle cx="600" cy="215" r="26" fill="none" stroke="#a78bfa" stroke-width="3"/>
<text x="600" y="225" font-size="28" fill="#a78bfa" text-anchor="middle" font-weight="bold">2</text>
<text x="454" y="280" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">有人听出唱腔习惯</text>
<text x="454" y="314" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">有人看鞋子和手势</text>
<text x="454" y="348" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">像侦探一样找线索</text>
<text x="454" y="382" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">也有人猜错了人</text>
<text x="454" y="416" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">= 分词器、参数指纹</text>
<text x="454" y="450" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">社区推理，本站押错</text>
<rect x="810" y="120" width="340" height="400" rx="16" fill="#151c2f" stroke="#f43f5e" stroke-width="2"/>
<rect x="810" y="120" width="340" height="56" rx="16" fill="#f43f5e" opacity="0.25"/>
<text x="980" y="156" font-size="21" fill="#f43f5e" text-anchor="middle" font-weight="bold">第三幕：摘下头套</text>
<circle cx="980" cy="215" r="26" fill="none" stroke="#f43f5e" stroke-width="3"/>
<text x="980" y="225" font-size="28" fill="#f43f5e" text-anchor="middle" font-weight="bold">3</text>
<text x="834" y="280" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">主持人宣布真名</text>
<text x="834" y="314" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">并发布正式专辑</text>
<text x="834" y="348" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">带着现场好评出道</text>
<text x="834" y="382" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">价格和曲目都公开</text>
<text x="834" y="416" font-size="16" fill="#f1f5f9" text-anchor="start" font-weight="normal">= 官宣 M3.1 Flash</text>
<text x="834" y="450" font-size="16" fill="#94a3b8" text-anchor="start" font-weight="normal">公开定价和跑分</text>
<path d="M396,320 L422,320" stroke="#fbbf24" stroke-width="4"/><path d="M418,310 L428,320 L418,330 Z" fill="#fbbf24"/>
<path d="M776,320 L802,320" stroke="#fbbf24" stroke-width="4"/><path d="M798,310 L808,320 L798,330 Z" fill="#fbbf24"/>
<text x="600" y="565" font-size="17" fill="#fbbf24" text-anchor="middle" font-weight="normal">好处：评价更真实；代价：匿名期你的提示词可能被提供方保留，别发敏感数据</text>
</svg>
