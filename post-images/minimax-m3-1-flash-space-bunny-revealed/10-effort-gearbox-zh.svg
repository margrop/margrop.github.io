<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,'Segoe UI',Arial,sans-serif">
<rect width="1200" height="610" fill="#0b1020"/>
<text x="600" y="50" font-size="28" fill="#f1f5f9" text-anchor="middle" font-weight="bold">effort 五档：像变速自行车的档位</text>
<text x="600" y="84" font-size="16" fill="#94a3b8" text-anchor="middle" font-weight="normal">思考永远开着，只能换档，不能熄火（关闭 thinking 会返回 400）</text>
<rect x="70" y="300" width="180" height="60" rx="10" fill="#34d399" opacity="0.85"/>
<text x="160" y="286" font-size="22" fill="#34d399" text-anchor="middle" font-weight="bold">low</text>
<rect x="70" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#34d399" stroke-width="2"/>
<text x="160" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">一档 low</text>
<text x="160" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">平路随便骑</text>
<text x="160" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">格式转换 / 分类</text>
<text x="160" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">延迟最低</text>
<rect x="285" y="260" width="180" height="100" rx="10" fill="#38bdf8" opacity="0.85"/>
<text x="375" y="246" font-size="22" fill="#38bdf8" text-anchor="middle" font-weight="bold">medium</text>
<rect x="285" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#38bdf8" stroke-width="2"/>
<text x="375" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">二档 medium</text>
<text x="375" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">日常通勤</text>
<text x="375" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">小函数 / 解释代码</text>
<text x="375" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">性价比档</text>
<rect x="500" y="220" width="180" height="140" rx="10" fill="#a78bfa" opacity="0.85"/>
<text x="590" y="206" font-size="22" fill="#a78bfa" text-anchor="middle" font-weight="bold">high</text>
<rect x="500" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#a78bfa" stroke-width="2"/>
<text x="590" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">三档 high</text>
<text x="590" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">上个小坡</text>
<text x="590" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">改 Bug / 写测试</text>
<text x="590" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">多数任务够用</text>
<rect x="715" y="180" width="180" height="180" rx="10" fill="#fbbf24" opacity="0.85"/>
<text x="805" y="166" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">xhigh</text>
<rect x="715" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#fbbf24" stroke-width="2"/>
<text x="805" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">四档 xhigh</text>
<text x="805" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">长坡慢慢爬</text>
<text x="805" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">跨文件重构</text>
<text x="805" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">明显更慢</text>
<rect x="930" y="140" width="180" height="220" rx="10" fill="#f43f5e" opacity="0.85"/>
<text x="1020" y="126" font-size="22" fill="#f43f5e" text-anchor="middle" font-weight="bold">max</text>
<rect x="930" y="385" width="180" height="140" rx="12" fill="#151c2f" stroke="#f43f5e" stroke-width="2"/>
<text x="1020" y="420" font-size="15" fill="#f1f5f9" text-anchor="middle" font-weight="bold">五档 max</text>
<text x="1020" y="450" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">最陡的山</text>
<text x="1020" y="480" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">默认档位</text>
<text x="1020" y="510" font-size="15" fill="#94a3b8" text-anchor="middle" font-weight="normal">注意 Token 预算</text>
<text x="70" y="120" font-size="15" fill="#94a3b8" text-anchor="start" font-weight="normal">柱子越高 = 想得越久、输出越多、越慢越贵</text>
<rect x="70" y="545" width="1060" height="40" rx="10" fill="#0f172a" stroke="#2a3550" stroke-width="2"/>
<text x="600" y="571" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="normal">省钱口诀：先用 high 跑通，失败了再升档；批量小任务降到 low / medium</text>
</svg>
