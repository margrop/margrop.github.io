<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131c"/>
      <stop offset="1" stop-color="#1d2438"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- chess board -->
  <g transform="translate(90,120) rotate(-6)">
    <rect x="0" y="0" width="360" height="360" rx="14" fill="#2a3040" stroke="#4a5468" stroke-width="4"/>
    <g>
      <rect x="12"  y="12"  width="42" height="42" fill="#3d4763"/><rect x="96"  y="12"  width="42" height="42" fill="#3d4763"/><rect x="180" y="12"  width="42" height="42" fill="#3d4763"/><rect x="264" y="12"  width="42" height="42" fill="#3d4763"/>
      <rect x="54"  y="54"  width="42" height="42" fill="#3d4763"/><rect x="138" y="54"  width="42" height="42" fill="#3d4763"/><rect x="222" y="54"  width="42" height="42" fill="#3d4763"/><rect x="306" y="54"  width="42" height="42" fill="#3d4763"/>
      <rect x="12"  y="96"  width="42" height="42" fill="#3d4763"/><rect x="96"  y="96"  width="42" height="42" fill="#3d4763"/><rect x="180" y="96"  width="42" height="42" fill="#3d4763"/><rect x="264" y="96"  width="42" height="42" fill="#3d4763"/>
      <rect x="54"  y="138" width="42" height="42" fill="#3d4763"/><rect x="138" y="138" width="42" height="42" fill="#3d4763"/><rect x="222" y="138" width="42" height="42" fill="#3d4763"/><rect x="306" y="138" width="42" height="42" fill="#3d4763"/>
      <rect x="12"  y="180" width="42" height="42" fill="#3d4763"/><rect x="96"  y="180" width="42" height="42" fill="#3d4763"/><rect x="180" y="180" width="42" height="42" fill="#3d4763"/><rect x="264" y="180" width="42" height="42" fill="#3d4763"/>
      <rect x="54"  y="222" width="42" height="42" fill="#3d4763"/><rect x="138" y="222" width="42" height="42" fill="#3d4763"/><rect x="222" y="222" width="42" height="42" fill="#3d4763"/><rect x="306" y="222" width="42" height="42" fill="#3d4763"/>
      <rect x="12"  y="264" width="42" height="42" fill="#3d4763"/><rect x="96"  y="264" width="42" height="42" fill="#3d4763"/><rect x="180" y="264" width="42" height="42" fill="#3d4763"/><rect x="264" y="264" width="42" height="42" fill="#3d4763"/>
      <rect x="54"  y="306" width="42" height="42" fill="#3d4763"/><rect x="138" y="306" width="42" height="42" fill="#3d4763"/><rect x="222" y="306" width="42" height="42" fill="#3d4763"/><rect x="306" y="306" width="42" height="42" fill="#3d4763"/>
    </g>
    <!-- pieces -->
    <circle cx="75"  cy="75"  r="26" fill="#c0392b" stroke="#7b241c" stroke-width="4"/>
    <circle cx="285" cy="285" r="26" fill="#2e4053" stroke="#1b2631" stroke-width="4"/>
    <circle cx="159" cy="201" r="26" fill="#c0392b" stroke="#7b241c" stroke-width="4"/>
    <circle cx="243" cy="117" r="26" fill="#2e4053" stroke="#1b2631" stroke-width="4"/>
  </g>
  <!-- peeking eye -->
  <g transform="translate(560,150)">
    <path d="M0,120 C90,20 270,20 360,120 C270,220 90,220 0,120 Z" fill="url(#eye)" stroke="#b35c00" stroke-width="5"/>
    <circle cx="180" cy="120" r="62" fill="#10131c"/>
    <circle cx="180" cy="120" r="26" fill="#58a6ff"/>
    <circle cx="200" cy="100" r="10" fill="#ffffff" opacity="0.85"/>
  </g>
  <!-- text -->
  <text x="80" y="560" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="56" font-weight="700" fill="#f0f3fa">偷看对手的棋盘，到底道不道德？</text>
  <text x="80" y="605" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" fill="#8a92a8">13 个大模型的弱智吧大考 · 非官方娱乐向 IQ 测试报告</text>
  <!-- IQ badge -->
  <g transform="translate(980,420)">
    <circle cx="70" cy="70" r="66" fill="none" stroke="#58a6ff" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="70" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#58a6ff">IQ</text>
    <text x="70" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f0f3fa">???</text>
  </g>
</svg>
