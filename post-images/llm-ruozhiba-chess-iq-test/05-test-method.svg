<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <rect width="1200" height="480" fill="#10131c"/>
  <text x="50" y="56" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="40" font-weight="700" fill="#f0f3fa">测试方法：一道题，同时发给 13 个模型</text>
  <g font-family="PingFang SC,Hiragino Sans GB,sans-serif">
    <!-- question box -->
    <rect x="50" y="140" width="320" height="180" rx="16" fill="#2a3040" stroke="#58a6ff" stroke-width="3"/>
    <text x="210" y="190" text-anchor="middle" font-size="26" font-weight="700" fill="#58a6ff">弱智吧经典提问</text>
    <text x="210" y="240" text-anchor="middle" font-size="22" fill="#c8cfdd">“在下象棋的时候，</text>
    <text x="210" y="274" text-anchor="middle" font-size="22" fill="#c8cfdd">偷看对手棋盘，</text>
    <text x="210" y="308" text-anchor="middle" font-size="22" fill="#c8cfdd">是不是很不道德啊”</text>
    <!-- arrow -->
    <line x1="375" y1="230" x2="455" y2="230" stroke="#8a92a8" stroke-width="3" marker-end="url(#a)"/>
    <!-- gateway -->
    <rect x="460" y="140" width="280" height="180" rx="16" fill="#2a3040" stroke="#d29922" stroke-width="3"/>
    <text x="600" y="190" text-anchor="middle" font-size="26" font-weight="700" fill="#d29922">自建 NewAPI 中转站</text>
    <text x="210" y="0" font-size="0" fill="none"></text>
    <text x="600" y="240" text-anchor="middle" font-size="22" fill="#c8cfdd">OpenAI 兼容接口</text>
    <text x="600" y="274" text-anchor="middle" font-size="22" fill="#c8cfdd">temperature = 0.7</text>
    <text x="600" y="308" text-anchor="middle" font-size="22" fill="#c8cfdd">同一个 Key 轮询</text>
    <line x1="745" y1="230" x2="825" y2="230" stroke="#8a92a8" stroke-width="3" marker-end="url(#a)"/>
    <!-- models -->
    <rect x="830" y="100" width="320" height="300" rx="16" fill="#2a3040" stroke="#3fb950" stroke-width="3"/>
    <text x="990" y="148" text-anchor="middle" font-size="26" font-weight="700" fill="#3fb950">13 个主流模型</text>
    <text x="990" y="192" text-anchor="middle" font-size="21" fill="#c8cfdd">gpt-5.6 / deepseek-v4 / glm-5.2</text>
    <text x="990" y="228" text-anchor="middle" font-size="21" fill="#c8cfdd">k3 / k3-256k / kimi-k2p6</text>
    <text x="990" y="264" text-anchor="middle" font-size="21" fill="#c8cfdd">qwen3.8-max / MiniMax-M3</text>
    <text x="990" y="310" text-anchor="middle" font-size="21" fill="#8a92a8">记录回答全文</text>
    <text x="990" y="344" text-anchor="middle" font-size="21" fill="#8a92a8">记录延迟与 Token 消耗</text>
    <text x="990" y="378" text-anchor="middle" font-size="21" fill="#8a92a8">人工评分：是否识破陷阱</text>
    <!-- footer -->
    <text x="600" y="452" text-anchor="middle" font-size="22" fill="#8a92a8">自定义别名与非主流名称的模型不参与本次考试</text>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8a92a8"/></marker>
  </defs>
</svg>
