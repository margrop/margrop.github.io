<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#10131c"/>
  <text x="50" y="56" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="40" font-weight="700" fill="#f0f3fa">这道题的陷阱在哪里？</text>
  <text x="50" y="94" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="22" fill="#8a92a8">象棋不是扑克：双方看的是同一副棋盘，所有棋子位置都是公开信息</text>
  <!-- two players -->
  <g font-family="PingFang SC,Hiragino Sans GB,sans-serif">
    <circle cx="180" cy="200" r="46" fill="#2a3040" stroke="#58a6ff" stroke-width="3"/>
    <text x="180" y="212" text-anchor="middle" font-size="30" fill="#58a6ff">你</text>
    <circle cx="1020" cy="200" r="46" fill="#2a3040" stroke="#f85149" stroke-width="3"/>
    <text x="1020" y="212" text-anchor="middle" font-size="30" fill="#f85149">对手</text>
    <!-- shared board -->
    <g transform="translate(450,120)">
      <rect x="0" y="0" width="300" height="300" rx="12" fill="#2a3040" stroke="#d29922" stroke-width="4"/>
      <rect x="14" y="14" width="34" height="34" fill="#3d4763"/><rect x="82" y="14" width="34" height="34" fill="#3d4763"/><rect x="150" y="14" width="34" height="34" fill="#3d4763"/><rect x="218" y="14" width="34" height="34" fill="#3d4763"/>
      <rect x="48" y="48" width="34" height="34" fill="#3d4763"/><rect x="116" y="48" width="34" height="34" fill="#3d4763"/><rect x="184" y="48" width="34" height="34" fill="#3d4763"/><rect x="252" y="48" width="34" height="34" fill="#3d4763"/>
      <rect x="14" y="82" width="34" height="34" fill="#3d4763"/><rect x="82" y="82" width="34" height="34" fill="#3d4763"/><rect x="150" y="82" width="34" height="34" fill="#3d4763"/><rect x="218" y="82" width="34" height="34" fill="#3d4763"/>
      <rect x="48" y="116" width="34" height="34" fill="#3d4763"/><rect x="116" y="116" width="34" height="34" fill="#3d4763"/><rect x="184" y="116" width="34" height="34" fill="#3d4763"/><rect x="252" y="116" width="34" height="34" fill="#3d4763"/>
      <rect x="14" y="150" width="34" height="34" fill="#3d4763"/><rect x="82" y="150" width="34" height="34" fill="#3d4763"/><rect x="150" y="150" width="34" height="34" fill="#3d4763"/><rect x="218" y="150" width="34" height="34" fill="#3d4763"/>
      <rect x="48" y="184" width="34" height="34" fill="#3d4763"/><rect x="116" y="184" width="34" height="34" fill="#3d4763"/><rect x="184" y="184" width="34" height="34" fill="#3d4763"/><rect x="252" y="184" width="34" height="34" fill="#3d4763"/>
      <circle cx="99" cy="133" r="20" fill="#c0392b"/>
      <circle cx="201" cy="167" r="20" fill="#2e86c1"/>
      <circle cx="167" cy="99" r="20" fill="#c0392b"/>
      <circle cx="133" cy="201" r="20" fill="#2e86c1"/>
    </g>
    <text x="600" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#d29922">同一个棋盘 · 双方共享 · 完全公开</text>
    <!-- sight lines -->
    <line x1="230" y1="210" x2="445" y2="240" stroke="#58a6ff" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="970" y1="210" x2="755" y2="240" stroke="#f85149" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="300" y="300" font-size="24" fill="#58a6ff">光明正大地看</text>
    <text x="770" y="300" font-size="24" fill="#f85149">也光明正大地看</text>
    <!-- punchline -->
    <text x="600" y="530" text-anchor="middle" font-size="24" fill="#8a92a8">“偷看对手的棋盘” ≈ “偷看对手和你一起看的东西”——前提本身就不成立</text>
  </g>
</svg>
