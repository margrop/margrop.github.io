  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">任务管理器 > 详细信息 > 右键选择列 > 勾选「体系结构」：可实时显示 x64、x86 或 Arm64</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">系统设置 > 系统 > 关于：明确标明「64 位操作系统，基于 x64 的处理器」或「基于 ARM 的处理器」</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">Copilot+ PC 专属特征：骁龙 X 系列芯片将显示为基于 ARM 的处理器，仿真运行 x64 应用</text>
