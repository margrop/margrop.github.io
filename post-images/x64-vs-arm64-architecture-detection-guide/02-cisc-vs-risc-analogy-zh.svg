<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="48" y="40" width="320" height="36" rx="18" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.35)"/>
  <text x="68" y="64" fill="rgb(168, 85, 247)" font-size="14" font-weight="bold" font-family="sans-serif">生活大比方 · 核心原理解构</text>
  <text x="48" y="135" fill="#f8fafc" font-size="34" font-weight="900" font-family="sans-serif">生活大比方：瑞士军刀老宗师 (CISC/x64) vs 乐高积木小神童 (RISC/ARM64)</text>
  <text x="48" y="180" fill="#94a3b8" font-size="18" font-family="sans-serif">深入理解计算机底层指令集哲学的分水岭</text>
  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">CISC (x64)：瑞士军刀老法师，工具箱极其沉重，复杂指令一步到位，内部微码拆解，发热与功耗较高</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">RISC (ARM64)：乐高积木神童，定长 32 位精简指令，流水线丝滑顺畅，硬件极致轻量，能效比封神</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">编译器分工：CISC 让硬件干更多脏活累活；RISC 让编译器与软件多优化，让硬件流水线极速奔跑</text>
</svg>