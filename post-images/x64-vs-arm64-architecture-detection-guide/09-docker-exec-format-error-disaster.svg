<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="48" y="40" width="320" height="36" rx="18" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.35)"/>
  <text x="68" y="64" fill="rgb(239, 68, 68)" font-size="14" font-weight="bold" font-family="sans-serif">故障深度复盘 · FATAL ERROR</text>
  <text x="48" y="135" fill="#f8fafc" font-size="34" font-weight="900" font-family="sans-serif">惨烈翻车现场：跨架构混淆引发的真实崩溃故障</text>
  <text x="48" y="180" fill="#94a3b8" font-size="18" font-family="sans-serif">standard_init_linux.go: exec user process caused: exec format error</text>
  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">崩溃现象：docker run 抛出 standard_init_linux.go: exec user process caused: exec format error</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">故障根因：在 x86_64 生产机拉取了在 Apple Silicon 或 ARM64 CI 构建的单架构 aarch64 镜像</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">根治方案：使用 docker buildx 构建多架构清单 (Multi-Arch Manifest) 镜像，自动适配平台</text>
</svg>