<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="48" y="40" width="320" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="rgb(56, 189, 248)" font-size="14" font-weight="bold" font-family="sans-serif">全景拓扑 · 架构三级判定逻辑</text>
  <text x="48" y="135" fill="#f8fafc" font-size="34" font-weight="900" font-family="sans-serif">跨平台架构三级确诊决策树 (硬件层 → 内核层 → 运行态)</text>
  <text x="48" y="180" fill="#94a3b8" font-size="18" font-family="sans-serif">三级判定拓扑，排查物理芯片、OS 内核模式与进程仿真状态</text>
  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">Level 1 物理硬件：查明主板上的物理芯片真实身份 (Intel/AMD vs Apple Silicon/Qualcomm)</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">Level 2 内核模式：查明操作系统内核寻址空间 (64-bit 还是 32-bit，x86_64 还是 aarch64)</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">Level 3 进程运行时：排查当前执行环境是否掉入 Rosetta 2、WOW64 或 QEMU 仿真转译</text>
</svg>