<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="48" y="40" width="320" height="36" rx="18" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(168, 85, 247, 0.35)"/>
  <text x="68" y="64" fill="rgb(168, 85, 247)" font-size="14" font-weight="bold" font-family="sans-serif">PLAIN ANALOGY · CORE HARDWARE</text>
  <text x="48" y="135" fill="#f8fafc" font-size="34" font-weight="900" font-family="sans-serif">The Swiss Army Master (CISC/x64) vs The Lego Builder (RISC/ARM64)</text>
  <text x="48" y="180" fill="#94a3b8" font-size="18" font-family="sans-serif">Demystifying instruction set philosophy through plain-English daily analogies</text>
  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">CISC (x64): Heavy master toolbox, complex variable instructions, immense decoders, high peak power & heat</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">RISC (ARM64): Fixed 32-bit modular bricks, ultra-lean execution pipeline, stellar performance-per-watt</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">Philosophy: CISC offloads complexity to hardware silicon; RISC offloads complexity to intelligent compilers</text>
</svg>