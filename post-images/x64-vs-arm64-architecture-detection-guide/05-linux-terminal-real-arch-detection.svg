<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <radialGradient id="bg" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <rect x="48" y="40" width="320" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="68" y="64" fill="rgb(56, 189, 248)" font-size="14" font-weight="bold" font-family="sans-serif">真实终端实录 · LINUX NATIVE X86_64</text>
  <text x="48" y="135" fill="#f8fafc" font-size="34" font-weight="900" font-family="sans-serif">Linux (Ubuntu Server) 真实终端体系结构实测</text>
  <text x="48" y="180" fill="#94a3b8" font-size="18" font-family="sans-serif">uname -m · dpkg --print-architecture · lscpu · getconf LONG_BIT</text>
  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">uname -m: x86_64 (Linux 内核原生 64 位 x86 体系)</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">dpkg --print-architecture: amd64 (Debian 体系下 amd64 即为 x86_64，二者完全同义)</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">getconf LONG_BIT: 64 (防止 64 位内核下跑 32 位用户态的隐蔽陷阱，确认为纯 64 位运行时)</text>
