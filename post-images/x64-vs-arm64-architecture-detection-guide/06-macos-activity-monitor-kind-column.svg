  <text x="48" y="135" fill="#f8fafc" font-size="34" font-weight="900" font-family="sans-serif">macOS 活动监视器「种类」列秒查原生 vs 转译进程</text>
  <text x="48" y="180" fill="#94a3b8" font-size="18" font-family="sans-serif">Activity Monitor Kind Column: Apple (ARM64) vs Intel (Rosetta 2)</text>
  <rect x="60" y="280" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="318" fill="#cbd5e1" font-size="18" font-family="sans-serif">种类 = Apple：代表应用已编译为原生 ARM64 二进制，发挥芯片满血性能与续航</text><rect x="60" y="355" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="393" fill="#cbd5e1" font-size="18" font-family="sans-serif">种类 = Intel：代表应用为旧版 x86_64 二进制，正通过 Rosetta 2 动态仿真运行</text><rect x="60" y="430" width="1320" height="60" rx="8" fill="#17223b" stroke="rgba(255,255,255,0.08)"/><text x="90" y="468" fill="#cbd5e1" font-size="18" font-family="sans-serif">排查技巧：在活动监视器进程列表表头右键，勾选「种类」列即可常驻监控</text>
