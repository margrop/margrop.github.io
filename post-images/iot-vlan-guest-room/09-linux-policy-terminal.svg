<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="374" viewBox="0 0 1200 374">
<rect width="1200" height="374" rx="26" fill="#111827"/>
<circle cx="42" cy="38" r="8" fill="#ff6b6b"/><circle cx="70" cy="38" r="8" fill="#ffd43b"/><circle cx="98" cy="38" r="8" fill="#51cf66"/>
<text x="140" y="45" fill="#adb5bd" font-size="18" font-family="-apple-system,BlinkMacSystemFont,sans-serif">Linux host · live firewall inspection</text>
<text x="54" y="94" fill="#ff8787" font-size="18" font-family="SFMono-Regular,Menlo,monospace">$ ssh root@publish-host nft list ruleset</text>
<text x="54" y="125" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">table ip nat {</text>
<text x="54" y="156" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">	chain DOCKER {</text>
<text x="54" y="187" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">		iifname &quot;docker0&quot; counter packets 0 bytes 0 return</text>
<text x="54" y="218" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">		iifname &quot;virtual-interface-omitted&quot; counter packets 0 bytes 0 return</text>
<text x="54" y="249" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">		iifname != &quot;virtual-interface-omitted&quot; tcp dport 3003 counter packets 0 bytes 0 dnat to 192.0.2.x:3000</text>
<text x="54" y="280" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">		iifname != &quot;docker0&quot; tcp dport 8080 counter packets 0 bytes 0 dnat to 192.0.2.x:8080</text>
<text x="54" y="311" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">		iifname != &quot;docker0&quot; tcp dport 9000 counter packets 42 bytes 2280 dnat to 192.0.2.x:9000</text></svg>