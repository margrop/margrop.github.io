<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="32" fill="#f8f9fa"/><text x="70" y="70" fill="#172b4d" font-size="34" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,sans-serif">排障顺序不要反</text><text x="70" y="112" fill="#6c757d" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">先确认归属，再确认路径，最后才怀疑云端</text><rect x="70" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#1971c2" stroke-width="4"/><text x="98" y="218" fill="#1971c2" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">1. 归属</text><text x="98" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">设备拿到了哪个 SSID/VLAN</text><rect x="620" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#2f9e44" stroke-width="4"/><text x="648" y="218" fill="#2f9e44" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">2. 地址</text><text x="648" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">DHCP 地址与网关是否正确</text><rect x="70" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#f08c00" stroke-width="4"/><text x="98" y="423" fill="#f08c00" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">3. 路径</text><text x="98" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">DNS、网关、规则是否放行</text><rect x="620" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#862e9c" stroke-width="4"/><text x="648" y="423" fill="#862e9c" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">4. 服务</text><text x="648" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">mDNS/控制端口是否需要例外</text></svg>