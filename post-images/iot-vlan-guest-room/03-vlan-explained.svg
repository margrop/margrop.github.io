<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="32" fill="#f8f9fa"/><text x="70" y="70" fill="#172b4d" font-size="34" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,sans-serif">VLAN 就像小区门禁</text><text x="70" y="112" fill="#6c757d" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">交换机负责分房间，路由器/防火墙负责决定能不能串门</text><rect x="70" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#1971c2" stroke-width="4"/><text x="98" y="218" fill="#1971c2" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">SSID</text><text x="98" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">Wi-Fi 名称：客人看到哪扇门</text><rect x="620" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#f08c00" stroke-width="4"/><text x="648" y="218" fill="#f08c00" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">VLAN</text><text x="648" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">二层标签：设备属于哪间房</text><rect x="70" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#2f9e44" stroke-width="4"/><text x="98" y="423" fill="#2f9e44" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">子网</text><text x="98" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">三层地址：房间里的门牌号</text><rect x="620" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#862e9c" stroke-width="4"/><text x="648" y="423" fill="#862e9c" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">规则</text><text x="648" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">防火墙：谁可以访问谁</text></svg>