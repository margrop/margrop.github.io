<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="32" fill="#f8f9fa"/><text x="70" y="70" fill="#172b4d" font-size="34" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,sans-serif">别把所有设备放在同一个房间</text><text x="70" y="112" fill="#6c757d" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">隔离前：一把钥匙开所有门；隔离后：每个房间只拿到需要的钥匙</text><rect x="70" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#e03131" stroke-width="4"/><text x="98" y="218" fill="#e03131" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">隔离前</text><text x="98" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">手机、电视、摄像头互相可见</text><rect x="620" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#2f9e44" stroke-width="4"/><text x="648" y="218" fill="#2f9e44" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">隔离后</text><text x="648" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">IoT 只能访问必要服务</text><rect x="70" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#1971c2" stroke-width="4"/><text x="98" y="423" fill="#1971c2" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">关键动作</text><text x="98" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">分 SSID + 分 VLAN</text><rect x="620" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#f08c00" stroke-width="4"/><text x="648" y="423" fill="#f08c00" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">最终目标</text><text x="648" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">故障有边界，风险不串门</text></svg>