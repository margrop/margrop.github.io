<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" rx="32" fill="#f8f9fa"/><text x="70" y="70" fill="#172b4d" font-size="34" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,sans-serif">家庭网络的三间客房</text><text x="70" y="112" fill="#6c757d" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">示例网段只使用文档保留地址，不对应任何真实家庭网络</text><rect x="70" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#1971c2" stroke-width="4"/><text x="98" y="218" fill="#1971c2" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">主网</text><text x="98" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">电脑、手机、NAS：允许管理设备</text><rect x="620" y="170" width="470" height="150" rx="24" fill="#ffffff" stroke="#f08c00" stroke-width="4"/><text x="648" y="218" fill="#f08c00" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">IoT 网</text><text x="648" y="261" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">灯、音箱、电视：默认不能访问主网</text><rect x="70" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#2f9e44" stroke-width="4"/><text x="98" y="423" fill="#2f9e44" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">访客网</text><text x="98" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">访客手机：只出互联网</text><rect x="620" y="375" width="470" height="150" rx="24" fill="#ffffff" stroke="#862e9c" stroke-width="4"/><text x="648" y="423" fill="#862e9c" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,sans-serif">防火墙</text><text x="648" y="466" fill="#343a40" font-size="20" font-family="-apple-system,BlinkMacSystemFont,sans-serif">只放行 DNS、NTP、必要控制流</text></svg>