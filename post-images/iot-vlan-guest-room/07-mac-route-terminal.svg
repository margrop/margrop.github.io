<text x="140" y="45" fill="#adb5bd" font-size="18" font-family="-apple-system,BlinkMacSystemFont,sans-serif">macOS · live default route</text>
<text x="54" y="94" fill="#74c0fc" font-size="18" font-family="SFMono-Regular,Menlo,monospace">$ route -n get default</text>
<text x="54" y="125" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">   route to: default</text>
<text x="54" y="156" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">destination: default</text>
<text x="54" y="187" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">       mask: default</text>
<text x="54" y="218" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">    gateway: 192.0.2.x</text>
<text x="54" y="249" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">  interface: en0</text>
<text x="54" y="280" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace">      flags: &lt;UP,GATEWAY,DONE,STATIC,PRCLONING,GLOBAL&gt;</text>
<text x="54" y="311" fill="#e9ecef" font-size="18" font-family="SFMono-Regular,Menlo,monospace"> recvpipe  sendpipe  ssthresh  rtt,msec    rttvar  hopcount      mtu     expire</text></svg>