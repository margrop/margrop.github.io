<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #f8fafc; }
      .kicker { font-size: 24px; fill: #7dd3fc; letter-spacing: 4px; }
      .title { font-size: 56px; font-weight: 800; }
      .subtitle { font-size: 30px; fill: #cbd5e1; }
      .tag { font-size: 24px; fill: #bae6fd; }
      .footer { font-size: 22px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg6)"/>
  <circle cx="1160" cy="190" r="120" fill="#0ea5e9" opacity="0.28"/>
  <circle cx="1040" cy="330" r="180" fill="#8b5cf6" opacity="0.20"/>
  <circle cx="1210" cy="520" r="220" fill="#22c55e" opacity="0.16"/>
  <rect x="80" y="140" width="880" height="80" rx="20" fill="#0f172a" opacity="0.72"/>
  <text x="118" y="192" class="kicker">NAS · Docker · nginx · Portainer</text>
  <text x="80" y="330" class="title">把网站搬进容器后，</text>
  <text x="80" y="410" class="title">为什么还是打不开？</text>
  <text x="80" y="490" class="subtitle">一次 Synology Web Station 到 nginx 容器的真实迁移复盘</text>
  <rect x="80" y="560" width="980" height="120" rx="24" fill="#0f172a" opacity="0.72"/>
  <text x="118" y="612" class="tag">关键词：静态站点迁移 / ACL 权限 / 只读挂载 / 蓝绿切换 / 可回滚</text>
  <text x="118" y="656" class="footer">真正卡住你的，往往不是服务没跑起来，而是文件不许读。</text>
  <rect x="80" y="742" width="260" height="64" rx="18" fill="url(#accent)"/>
  <text x="118" y="784" class="tag" fill="#0f172a">实战复盘 + 三平台脚本</text>
</svg>
