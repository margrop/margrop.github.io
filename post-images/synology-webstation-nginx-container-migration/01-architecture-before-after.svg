<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e5e7eb; }
      .title { font-size: 36px; font-weight: 700; }
      .sub { font-size: 22px; fill: #cbd5e1; }
      .box-title { font-size: 24px; font-weight: 600; }
      .box-text { font-size: 20px; fill: #cbd5e1; }
      .small { font-size: 18px; fill: #94a3b8; }
      .arrow-text { font-size: 18px; fill: #7dd3fc; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="72" y="86" class="title">迁移前后：谁在前面接客，谁在后面出菜</text>
  <text x="72" y="128" class="sub">这次改动的重点不是“换一个网页服务器”，而是把网站内容交给容器，同时保留原入口和回滚能力。</text>

  <rect x="72" y="180" width="600" height="560" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <text x="112" y="238" class="box-title">迁移前</text>
  <rect x="120" y="280" width="180" height="92" rx="18" fill="#0ea5e9"/>
  <text x="150" y="322" class="box-title" fill="#0f172a">浏览器</text>
  <text x="144" y="352" class="box-text" fill="#0f172a">访问 80 / 443</text>
  <line x1="300" y1="326" x2="420" y2="326" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="280" width="220" height="92" rx="18" fill="#334155"/>
  <text x="462" y="322" class="box-title">群晖原生 nginx</text>
  <text x="450" y="352" class="box-text">HTTPS / 入口转发</text>
  <line x1="530" y1="372" x2="530" y2="470" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="390" y="470" width="280" height="110" rx="18" fill="#1d4ed8"/>
  <text x="442" y="515" class="box-title">Web Station</text>
  <text x="428" y="548" class="box-text">直接提供静态站点</text>
  <line x1="530" y1="580" x2="530" y2="674" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="380" y="674" width="300" height="88" rx="18" fill="#065f46"/>
  <text x="438" y="713" class="box-title">网站文件目录</text>
  <text x="418" y="743" class="box-text">首页、工具、静态资源</text>

  <rect x="768" y="180" width="600" height="560" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <text x="808" y="238" class="box-title">迁移后</text>
  <rect x="816" y="280" width="180" height="92" rx="18" fill="#0ea5e9"/>
  <text x="846" y="322" class="box-title" fill="#0f172a">浏览器</text>
  <text x="840" y="352" class="box-text" fill="#0f172a">访问 80 / 443</text>
  <line x1="996" y1="326" x2="1116" y2="326" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1116" y="280" width="220" height="92" rx="18" fill="#334155"/>
  <text x="1158" y="322" class="box-title">群晖原生 nginx</text>
  <text x="1148" y="352" class="box-text">继续负责入口</text>
  <line x1="1226" y1="372" x2="1226" y2="470" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1096" y="470" width="260" height="110" rx="18" fill="#7c3aed"/>
  <text x="1138" y="515" class="box-title">nginx 容器</text>
  <text x="1128" y="548" class="box-text">Portainer 管理</text>
  <line x1="1226" y1="580" x2="1226" y2="674" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1076" y="674" width="300" height="88" rx="18" fill="#065f46"/>
  <text x="1128" y="713" class="box-title">网站文件目录</text>
  <text x="1114" y="743" class="box-text">只读挂载进容器</text>

  <text x="690" y="806" text-anchor="middle" class="arrow-text">对外入口不变，内容提供方从 Web Station 换成容器</text>
</svg>
