<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4ade80"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #f8fafc; }
      .title { font-size: 34px; font-weight: 700; }
      .node { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; fill: #d1fae5; }
      .step { font-size: 22px; font-weight: 600; fill: #bbf7d0; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg4)"/>
  <text x="72" y="88" class="title">正确顺序：先并行，再切换，随时可回滚</text>
  <g transform="translate(90,170)">
    <circle cx="60" cy="60" r="60" fill="#16a34a"/>
    <text x="38" y="72" class="step" fill="#052e16">1</text>
    <text x="150" y="52" class="node">新容器先跑在临时端口</text>
    <text x="150" y="90" class="label">旧站继续服务，不影响用户</text>
  </g>
  <g transform="translate(90,330)">
    <circle cx="60" cy="60" r="60" fill="#16a34a"/>
    <text x="38" y="72" class="step" fill="#052e16">2</text>
    <text x="150" y="52" class="node">逐条验证关键页面</text>
    <text x="150" y="90" class="label">首页、工具页、静态资源、404、PHP 行为</text>
  </g>
  <g transform="translate(90,490)">
    <circle cx="60" cy="60" r="60" fill="#16a34a"/>
    <text x="38" y="72" class="step" fill="#052e16">3</text>
    <text x="150" y="52" class="node">备份原生入口配置</text>
    <text x="150" y="90" class="label">保证出错时能立刻恢复</text>
  </g>
  <g transform="translate(90,650)">
    <circle cx="60" cy="60" r="60" fill="#16a34a"/>
    <text x="38" y="72" class="step" fill="#052e16">4</text>
    <text x="150" y="52" class="node">再切原 80 / 443 入口</text>
    <text x="150" y="90" class="label">切换后立刻复测，任何失败就回滚</text>
  </g>
  <line x1="840" y1="230" x2="1120" y2="230" stroke="#4ade80" stroke-width="4" marker-end="url(#arrow4)"/>
  <rect x="1120" y="160" width="220" height="140" rx="20" fill="#065f46"/>
  <text x="1170" y="215" class="node">回滚</text>
  <text x="1150" y="255" class="label">恢复原配置</text>
  <rect x="840" y="420" width="500" height="220" rx="24" fill="#052e16" stroke="#166534" stroke-width="2"/>
  <text x="880" y="482" class="node">为什么要这样做？</text>
  <text x="880" y="530" class="label">因为迁移失败最常见的代价，不是“新容器起不来”，</text>
  <text x="880" y="574" class="label">而是“旧入口先被切掉，新站点又没准备好”。</text>
</svg>
