<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#facc15"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #f8fafc; }
      .title { font-size: 34px; font-weight: 700; }
      .node { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; fill: #e2e8f0; }
      .good { fill: #86efac; font-size: 20px; }
      .bad { fill: #fca5a5; font-size: 20px; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg5)"/>
  <text x="72" y="88" class="title">403 / 404 排查树：先查路，再查门，最后查钥匙</text>
  <rect x="90" y="180" width="280" height="110" rx="20" fill="#334155"/>
  <text x="140" y="228" class="node">访问失败</text>
  <text x="124" y="264" class="label">403 或 404</text>
  <line x1="370" y1="235" x2="500" y2="235" stroke="#facc15" stroke-width="4" marker-end="url(#arrow5)"/>
  <rect x="500" y="180" width="260" height="110" rx="20" fill="#0f766e"/>
  <text x="545" y="228" class="node">路径挂载对吗</text>
  <text x="532" y="264" class="label">文件是否真的进容器</text>
  <line x1="760" y1="235" x2="890" y2="235" stroke="#facc15" stroke-width="4" marker-end="url(#arrow5)"/>
  <rect x="890" y="180" width="260" height="110" rx="20" fill="#0f766e"/>
  <text x="938" y="228" class="node">nginx 配置对吗</text>
  <text x="926" y="264" class="label">root / index 是否生效</text>
  <line x1="1150" y1="235" x2="1280" y2="235" stroke="#facc15" stroke-width="4" marker-end="url(#arrow5)"/>
  <rect x="1280" y="180" width="120" height="110" rx="20" fill="#7f1d1d"/>
  <text x="1310" y="228" class="node">权限</text>
  <text x="1300" y="264" class="label">能不能读</text>

  <rect x="150" y="390" width="1200" height="300" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="190" y="450" class="node">如果路径和配置都对，最后就看权限</text>
  <text x="190" y="505" class="label">容器内执行一个最简单的读文件动作，比反复改配置更有用。</text>
  <text x="190" y="555" class="label">因为这时候答案已经很清楚：不是“找不到文件”，而是“看见了但不给读”。</text>
  <text x="190" y="605" class="label">一旦确认是权限问题，就不要继续折腾站点配置了，去查运行用户和 ACL。</text>
  <text x="190" y="655" class="good">解决原则：最小改动，优先复用已有组权限。</text>
</svg>
