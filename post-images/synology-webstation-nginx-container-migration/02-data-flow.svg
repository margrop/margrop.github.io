<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #e5e7eb; }
      .title { font-size: 34px; font-weight: 700; }
      .node { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; fill: #cbd5e1; }
      .small { font-size: 18px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg2)"/>
  <text x="72" y="90" class="title">一次网页请求，实际经过了哪几站</text>
  <g transform="translate(80,180)">
    <rect x="0" y="0" width="240" height="120" rx="20" fill="#0ea5e9"/>
    <text x="42" y="50" class="node" fill="#0f172a">用户浏览器</text>
    <text x="32" y="84" class="label" fill="#0f172a">输入原站点地址</text>
  </g>
  <line x1="320" y1="240" x2="450" y2="240" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow2)"/>
  <g transform="translate(450,180)">
    <rect x="0" y="0" width="260" height="120" rx="20" fill="#334155"/>
    <text x="42" y="50" class="node">群晖原生 nginx</text>
    <text x="34" y="84" class="label">继续处理 HTTPS 和入口</text>
  </g>
  <line x1="710" y1="240" x2="840" y2="240" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow2)"/>
  <g transform="translate(840,180)">
    <rect x="0" y="0" width="240" height="120" rx="20" fill="#7c3aed"/>
    <text x="52" y="50" class="node">nginx 容器</text>
    <text x="30" y="84" class="label">真正读取静态文件</text>
  </g>
  <line x1="1080" y1="240" x2="1210" y2="240" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow2)"/>
  <g transform="translate(1210,180)">
    <rect x="0" y="0" width="160" height="120" rx="20" fill="#065f46"/>
    <text x="30" y="50" class="node">文件目录</text>
    <text x="20" y="84" class="label">只读挂载</text>
  </g>
  <rect x="120" y="390" width="1200" height="250" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="160" y="448" class="node">为什么这样拆？</text>
  <text x="160" y="500" class="label">1. 对外访问地址不用变，老链接不会失效。</text>
  <text x="160" y="544" class="label">2. 新容器可以先用临时端口并行验证，风险更低。</text>
  <text x="160" y="588" class="label">3. 网站文件仍然只读挂载，容器不会意外改动站点内容。</text>
</svg>
