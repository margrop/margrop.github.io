<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f97316"/>
    </marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #f8fafc; }
      .title { font-size: 34px; font-weight: 700; }
      .node { font-size: 22px; font-weight: 600; }
      .label { font-size: 20px; fill: #e2e8f0; }
      .warn { font-size: 22px; fill: #fdba74; font-weight: 600; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg3)"/>
  <text x="72" y="88" class="title">这次真正的坑：不是门坏了，而是名单没对上</text>
  <g transform="translate(120,180)">
    <rect x="0" y="0" width="280" height="140" rx="22" fill="#312e81"/>
    <text x="44" y="54" class="node">Unix 权限</text>
    <text x="30" y="96" class="label">像小区大门口的告示牌</text>
  </g>
  <g transform="translate(580,180)">
    <rect x="0" y="0" width="280" height="140" rx="22" fill="#7c2d12"/>
    <text x="44" y="54" class="node">ACL</text>
    <text x="30" y="96" class="label">像额外的小门禁名单</text>
  </g>
  <g transform="translate(1040,180)">
    <rect x="0" y="0" width="280" height="140" rx="22" fill="#14532d"/>
    <text x="34" y="54" class="node">容器 nginx 用户</text>
    <text x="30" y="96" class="label">像临时进来的送餐员</text>
  </g>
  <line x1="400" y1="250" x2="580" y2="250" stroke="#f97316" stroke-width="4" marker-end="url(#arrow3)"/>
  <line x1="860" y1="250" x2="1040" y2="250" stroke="#f97316" stroke-width="4" marker-end="url(#arrow3)"/>
  <rect x="120" y="420" width="1200" height="250" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="160" y="482" class="warn">现象：容器明明挂载了目录，首页却还是 403，其他页面 404</text>
  <text x="160" y="536" class="label">原因：文件还在，路径也对，但 nginx worker 用户没有被允许读这些文件。</text>
  <text x="160" y="586" class="label">所以问题不在“网页服务有没有启动”，而在“谁有权限进门”。</text>
  <text x="160" y="636" class="label">最小修复方式：让 nginx worker 复用现有用户组权限，而不是粗暴 chmod 777。</text>
</svg>
