<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="小学生秒懂比方：物业调度中心、方言老伯与专属同传翻译官">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#7c3aed" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#7c3aed" font-weight="600">ELEMENTARY ANALOGY / ARCHITECTURE MAPPING</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">小学生秒懂比方：居委会物业、方言老伯与专属同传翻译官</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">用日常生活场景，讲透 Home Assistant、偏门设备、自定义集成与 AI Agent</text>

<g transform="translate(64, 255)">
  <!-- Box 1 -->
  <rect x="0" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="24" width="70" height="36" rx="8" fill="#0284c7"/>
  <text x="59" y="48" font-size="16" fill="white" font-weight="600" text-anchor="middle">物业中心</text>
  <text x="24" y="98" font-size="22" fill="#0f172a" font-weight="600">Home Assistant</text>
  <text x="24" y="128" font-size="15" fill="#475569">负责全小区综合运行调度</text>
  <line x1="24" y1="145" x2="286" y2="145" stroke="#f1f5f9" stroke-width="2"/>
  <text x="24" y="180" font-size="16" fill="#334155">🏢 大厅大屏监控全屋水电</text>
  <text x="24" y="220" font-size="16" fill="#334155">📢 只听得懂标准普通话</text>
  <text x="24" y="260" font-size="16" fill="#334155">⏱️ 前台办理不能停顿半秒</text>
  <text x="24" y="300" font-size="16" fill="#334155">🚫 任何卡顿导致全楼抗议</text>
  <rect x="20" y="340" width="270" height="85" rx="10" fill="#f0f9ff"/>
  <text x="32" y="375" font-size="15" fill="#0284c7" font-weight="600">核心痛点：</text>
  <text x="32" y="405" font-size="14" fill="#0369a1">不认识方言，没翻译官不给办入户</text>

  <!-- Box 2 -->
  <rect x="334" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="358" y="24" width="70" height="36" rx="8" fill="#d97706"/>
  <text x="393" y="48" font-size="16" fill="white" font-weight="600" text-anchor="middle">方言老伯</text>
  <text x="358" y="98" font-size="22" fill="#0f172a" font-weight="600">偏门智能设备</text>
  <text x="358" y="128" font-size="15" fill="#475569">功能强大但说话极其小众</text>
  <line x1="358" y1="145" x2="620" y2="145" stroke="#f1f5f9" stroke-width="2"/>
  <text x="358" y="180" font-size="16" fill="#334155">💡 自带温湿度/开关能力</text>
  <text x="358" y="220" font-size="16" fill="#334155">🗣️ 只会讲私有 REST 方言</text>
  <text x="358" y="260" font-size="16" fill="#334155">🚪 躲在局域网内低调工作</text>
  <text x="358" y="300" font-size="16" fill="#334155">⚡ 连续被疯狂敲门会直接晕厥</text>
  <rect x="354" y="340" width="270" height="85" rx="10" fill="#fffbeb"/>
  <text x="366" y="375" font-size="15" fill="#d97706" font-weight="600">核心痛点：</text>
  <text x="366" y="405" font-size="14" fill="#b45309">没有现成官方插件，无法对接中枢</text>

  <!-- Box 3 -->
  <rect x="668" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="692" y="24" width="70" height="36" rx="8" fill="#059669"/>
  <text x="727" y="48" font-size="16" fill="white" font-weight="600" text-anchor="middle">专属翻译</text>
  <text x="692" y="98" font-size="22" fill="#0f172a" font-weight="600">Custom Component</text>
  <text x="692" y="128" font-size="15" fill="#475569">两边传话的特聘同传译员</text>
  <line x1="692" y1="145" x2="954" y2="145" stroke="#f1f5f9" stroke-width="2"/>
  <text x="692" y="180" font-size="16" fill="#334155">🪪 manifest.json 是身份证</text>
  <text x="692" y="220" font-size="16" fill="#334155">📋 config_flow 是登记表格</text>
  <text x="692" y="260" font-size="16" fill="#334155">👮 Coordinator 定期查水表</text>
  <text x="692" y="300" font-size="16" fill="#334155">🎛️ sensor/switch 是大屏卡片</text>
  <rect x="688" y="340" width="270" height="85" rx="10" fill="#f0fdf4"/>
  <text x="700" y="375" font-size="15" fill="#059669" font-weight="600">过去难题：</text>
  <text x="700" y="405" font-size="14" fill="#15803d">新手必须先考出同传证才敢手写</text>

  <!-- Box 4 -->
  <rect x="1002" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1026" y="24" width="70" height="36" rx="8" fill="#7c3aed"/>
  <text x="1061" y="48" font-size="16" fill="white" font-weight="600" text-anchor="middle">外包天团</text>
  <text x="1026" y="98" font-size="22" fill="#0f172a" font-weight="600">AI Agent</text>
  <text x="1026" y="128" font-size="15" fill="#475569">懂万国方言的顶级架构师</text>
  <line x1="1026" y1="145" x2="1288" y2="145" stroke="#f1f5f9" stroke-width="2"/>
  <text x="1026" y="180" font-size="16" fill="#334155">👂 听一次老伯说话就懂语法</text>
  <text x="1026" y="220" font-size="16" fill="#334155">⚡ 3 分钟手搓全套标准代码</text>
  <text x="1026" y="260" font-size="16" fill="#334155">🩺 自动语法体检杜绝卡顿陷阱</text>
  <text x="1026" y="300" font-size="16" fill="#334155">🚀 一键送进 HA 零门槛跑起</text>
  <rect x="1022" y="340" width="270" height="85" rx="10" fill="#faf5ff"/>
  <text x="1034" y="375" font-size="15" fill="#7c3aed" font-weight="600">现在的魔力：</text>
  <text x="1034" y="405" font-size="14" fill="#6b21a8">小白只需动嘴，Agent 承包全部工程</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">概念图解 · 用小学生秒懂比方讲透智能家居自定义集成角色体系 · 2026-10-29</text>
</svg>