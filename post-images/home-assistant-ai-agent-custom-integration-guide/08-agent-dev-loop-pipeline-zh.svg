<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="AI Agent 自动化开发、语法审查与热重载流水线">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#059669" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#059669" font-weight="600">WORKFLOW AUTOMATION / AGENT DEV LOOP</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">AI Agent 自动化开发、语法审查与热重载闭环</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">从终端提示词下发到实体上线，全程无人值守的安全研发闭环流水线</text>

<g transform="translate(64, 255)">
  <!-- Step 1 -->
  <rect x="0" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="50" cy="45" r="20" fill="#0284c7"/>
  <text x="50" y="52" font-size="18" fill="white" font-weight="600" text-anchor="middle">1</text>
  <text x="85" y="52" font-size="22" fill="#0f172a" font-weight="600">协议嗅探 (Probe)</text>
  <line x1="24" y1="85" x2="286" y2="85" stroke="#f1f5f9" stroke-width="2"/>
  <text x="24" y="125" font-size="16" fill="#334155" font-weight="600">输入：设备局域网 IP 与端口</text>
  <text x="24" y="160" font-size="15" fill="#475569">• 发送 HTTP GET /api/status 探测</text>
  <text x="24" y="195" font-size="15" fill="#475569">• 捕获温度、电压、功率与状态</text>
  <text x="24" y="230" font-size="15" fill="#475569">• 自动脱敏并生成数据契约 JSON</text>
  <rect x="20" y="270" width="270" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4"/>
  <text x="32" y="300" font-size="13" fill="#64748b" font-family="monospace">HTTP/1.1 200 OK</text>
  <text x="32" y="325" font-size="13" fill="#64748b" font-family="monospace">"temperature": 26.8,</text>
  <text x="32" y="350" font-size="13" fill="#64748b" font-family="monospace">"power": 313.1,</text>
  <text x="32" y="375" font-size="13" fill="#64748b" font-family="monospace">"state": "ON"</text>
  <text x="32" y="405" font-size="13" fill="#0284c7" font-weight="600">✓ 契约提取完毕</text>

  <!-- Step 2 -->
  <rect x="334" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="384" cy="45" r="20" fill="#d97706"/>
  <text x="384" y="52" font-size="18" fill="white" font-weight="600" text-anchor="middle">2</text>
  <text x="419" y="52" font-size="22" fill="#0f172a" font-weight="600">骨架搭建 (Scaffold)</text>
  <line x1="358" y1="85" x2="620" y2="85" stroke="#f1f5f9" stroke-width="2"/>
  <text x="358" y="125" font-size="16" fill="#334155" font-weight="600">输入：契约参数与领域命名</text>
  <text x="358" y="160" font-size="15" fill="#475569">• 自动生成 custom_components 目录</text>
  <text x="358" y="195" font-size="15" fill="#475569">• 生成 8 个标准核心代码组件</text>
  <text x="358" y="230" font-size="15" fill="#475569">• 植入 DataUpdateCoordinator</text>
  <rect x="354" y="270" width="270" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4"/>
  <text x="366" y="300" font-size="13" fill="#64748b" font-family="monospace">+ manifest.json</text>
  <text x="366" y="325" font-size="13" fill="#64748b" font-family="monospace">+ coordinator.py</text>
  <text x="366" y="350" font-size="13" fill="#64748b" font-family="monospace">+ config_flow.py</text>
  <text x="366" y="375" font-size="13" fill="#64748b" font-family="monospace">+ sensor.py &amp; switch.py</text>
  <text x="366" y="405" font-size="13" fill="#d97706" font-weight="600">✓ 8 大文件组装就绪</text>

  <!-- Step 3 -->
  <rect x="668" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="718" cy="45" r="20" fill="#059669"/>
  <text x="718" y="52" font-size="18" fill="white" font-weight="600" text-anchor="middle">3</text>
  <text x="753" y="52" font-size="22" fill="#0f172a" font-weight="600">AST 审查 (Lint)</text>
  <line x1="692" y1="85" x2="954" y2="85" stroke="#f1f5f9" stroke-width="2"/>
  <text x="692" y="125" font-size="16" fill="#334155" font-weight="600">输入：生成的全部 Python 源码</text>
  <text x="692" y="160" font-size="15" fill="#475569">• AST 静态树语法遍历校验</text>
  <text x="692" y="195" font-size="15" fill="#475569">• 严查 requests / time.sleep 阻塞</text>
  <text x="692" y="230" font-size="15" fill="#475569">• 验证 manifest 字段与版本规范</text>
  <rect x="688" y="270" width="270" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4"/>
  <text x="700" y="300" font-size="13" fill="#059669" font-family="monospace">[PASS] manifest.json schema</text>
  <text x="700" y="325" font-size="13" fill="#059669" font-family="monospace">[PASS] coordinator async AST</text>
  <text x="700" y="350" font-size="13" fill="#059669" font-family="monospace">[PASS] sensor non-blocking</text>
  <text x="700" y="375" font-size="13" fill="#059669" font-family="monospace">[PASS] config_flow schema</text>
  <text x="700" y="405" font-size="13" fill="#059669" font-weight="600">✓ 零阻塞零死锁验收通过</text>

  <!-- Step 4 -->
  <rect x="1002" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="1052" cy="45" r="20" fill="#7c3aed"/>
  <text x="1052" y="52" font-size="18" fill="white" font-weight="600" text-anchor="middle">4</text>
  <text x="1087" y="52" font-size="22" fill="#0f172a" font-weight="600">部署验证 (Deploy)</text>
  <line x1="1026" y1="85" x2="1288" y2="85" stroke="#f1f5f9" stroke-width="2"/>
  <text x="1026" y="125" font-size="16" fill="#334155" font-weight="600">输入：通过体检的集成包</text>
  <text x="1026" y="160" font-size="15" fill="#475569">• 自动同步至 /config/custom_components</text>
  <text x="1026" y="195" font-size="15" fill="#475569">• 自动备份旧版本，失败可秒级回滚</text>
  <text x="1026" y="230" font-size="15" fill="#475569">• 触发 HA 热重载，UI 登记即刻上线</text>
  <rect x="1022" y="270" width="270" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4"/>
  <text x="1034" y="300" font-size="13" fill="#7c3aed" font-family="monospace">Deployment complete!</text>
  <text x="1034" y="325" font-size="13" fill="#7c3aed" font-family="monospace">Setup domain took 0.03s</text>
  <text x="1034" y="350" font-size="13" fill="#7c3aed" font-family="monospace">4 entities registered</text>
  <text x="1034" y="375" font-size="13" fill="#7c3aed" font-family="monospace">Lovelace card synced</text>
  <text x="1034" y="405" font-size="13" fill="#7c3aed" font-weight="600">✓ 实体已点亮并入网</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">流水线设计 · AI Agent 从嗅探到上线的全自动化工程闭环 · 2026-10-29</text>
</svg>