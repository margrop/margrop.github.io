<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="新手高频翻车与四大排错矩阵">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#dc2626" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#dc2626" font-weight="600">TROUBLESHOOTING MATRIX / POST-MORTEM</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">新手手搓 HA 自定义集成高频翻车与排错矩阵</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">精准定位事件循环阻塞、轮询风暴、配置流死锁与 Manifest 校验拦截</text>

<g transform="translate(64, 255)">
  <!-- Card 1 -->
  <rect x="0" y="0" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="20" width="80" height="30" rx="6" fill="#fee2e2"/>
  <text x="64" y="40" font-size="14" fill="#dc2626" font-weight="600" text-anchor="middle">翻车点 1</text>
  <text x="116" y="43" font-size="20" fill="#0f172a" font-weight="600">事件循环阻塞：整个 HA 变慢甚至假死</text>
  <line x1="24" y1="62" x2="606" y2="62" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="24" y="90" font-size="14" fill="#475569">• <strong>现象</strong>：日志狂刷 <code>Detecting blocking call to ... in event loop</code></text>
  <text x="24" y="120" font-size="14" fill="#475569">• <strong>根因</strong>：在 async 函数中调用了 <code>requests.get()</code> 或 <code>time.sleep()</code></text>
  <text x="24" y="150" font-size="14" fill="#475569">• <strong>解法</strong>：换用 <code>async_get_clientsession(hass)</code> 与 <code>aiohttp</code> 协程</text>
  <rect x="24" y="170" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="36" y="190" font-size="13" fill="#059669" font-weight="600">✓ 处方：运行 AST 静态审查工具一键查杀所有同步 I/O 陷阱</text>

  <!-- Card 2 -->
  <rect x="682" y="0" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="706" y="20" width="80" height="30" rx="6" fill="#fef3c7"/>
  <text x="746" y="40" font-size="14" fill="#d97706" font-weight="600" text-anchor="middle">翻车点 2</text>
  <text x="798" y="43" font-size="20" fill="#0f172a" font-weight="600">轮询风暴：设备被频繁查数轰死掉线</text>
  <line x1="706" y1="62" x2="1288" y2="62" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="706" y="90" font-size="14" fill="#475569">• <strong>现象</strong>：ESP32 或智能插座每隔几分钟频繁 Wi-Fi 重启</text>
  <text x="706" y="120" font-size="14" fill="#475569">• <strong>根因</strong>：5 个传感器各自并发轮询设备，廉价单片机连接池耗尽</text>
  <text x="706" y="150" font-size="14" fill="#475569">• <strong>解法</strong>：引入 <code>DataUpdateCoordinator</code> 实行单一时钟统一抓取</text>
  <rect x="706" y="170" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="718" y="190" font-size="13" fill="#059669" font-weight="600">✓ 处方：实体只读 Coordinator 内存缓存，网络请求暴降 80%</text>

  <!-- Card 3 -->
  <rect x="0" y="240" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="260" width="80" height="30" rx="6" fill="#fee2e2"/>
  <text x="64" y="280" font-size="14" fill="#dc2626" font-weight="600" text-anchor="middle">翻车点 3</text>
  <text x="116" y="283" font-size="20" fill="#0f172a" font-weight="600">配置流死锁：点击添加集成提示“未知错误”</text>
  <line x1="24" y1="302" x2="606" y2="302" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="24" y="330" font-size="14" fill="#475569">• <strong>现象</strong>：输入 IP 点击提交后菊花一直转，随后提示未知异常</text>
  <text x="24" y="360" font-size="14" fill="#475569">• <strong>根因</strong>：未设置 5 秒超时保护，或未捕获网络异常导致协程崩解</text>
  <text x="24" y="390" font-size="14" fill="#475569">• <strong>解法</strong>：用 <code>async with asyncio.timeout(5)</code> 包裹并抛出 cannot_connect</text>
  <rect x="24" y="410" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="36" y="430" font-size="13" fill="#059669" font-weight="600">✓ 处方：严格遵循 strings.json 错误码映射，UI 友好中文反馈</text>

  <!-- Card 4 -->
  <rect x="682" y="240" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="706" y="260" width="80" height="30" rx="6" fill="#fef3c7"/>
  <text x="746" y="280" font-size="14" fill="#d97706" font-weight="600" text-anchor="middle">翻车点 4</text>
  <text x="798" y="283" font-size="20" fill="#0f172a" font-weight="600">Manifest 拦截：重启后提示“未找到集成”</text>
  <line x1="706" y1="302" x2="1288" y2="302" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="706" y="330" font-size="14" fill="#475569">• <strong>现象</strong>：文件复制进去了，但 HA 的“添加集成”列表里搜不到</text>
  <text x="706" y="360" font-size="14" fill="#475569">• <strong>根因</strong>：<code>manifest.json</code> 缺少 <code>version</code> 或 <code>iot_class</code> 被强校验拦截</text>
  <text x="706" y="390" font-size="14" fill="#475569">• <strong>解法</strong>：补齐 <code>"version": "1.0.0"</code> 与 <code>"iot_class": "local_polling"</code></text>
  <rect x="706" y="410" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="718" y="430" font-size="13" fill="#059669" font-weight="600">✓ 处方：使用脚手架自动生成标准 JSON，启动前检查 100% 通过</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">排错矩阵 · Home Assistant 自定义集成核心四大翻车点根因剖析 · 2026-10-29</text>
</svg>