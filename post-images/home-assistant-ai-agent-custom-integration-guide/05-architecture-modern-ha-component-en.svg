<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Modern Home Assistant Custom Component Architecture">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">CORE ARCHITECTURE / MODERN HA COMPONENT</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">Modern Home Assistant Custom Component Architecture</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">Decoupled design powered by DataUpdateCoordinator, ConfigFlow, and pure asyncio</text>

<g transform="translate(64, 255)">
  <!-- 1. manifest & const -->
  <rect x="0" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="24" width="90" height="36" rx="8" fill="#0284c7"/>
  <text x="69" y="48" font-size="14" fill="white" font-weight="600" text-anchor="middle">Credentials</text>
  <text x="24" y="98" font-size="21" fill="#0f172a" font-weight="600">manifest / const</text>
  <line x1="24" y1="120" x2="286" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="24" y="155" font-size="15" fill="#334155" font-weight="600">📄 manifest.json</text>
  <text x="24" y="185" font-size="14" fill="#475569">• domain: Unique lowercase slug</text>
  <text x="24" y="215" font-size="14" fill="#475569">• iot_class: local_polling</text>
  <text x="24" y="245" font-size="14" fill="#475569">• version: SemVer (e.g. 1.0.0)</text>
  <text x="24" y="275" font-size="14" fill="#475569">• config_flow: true for UI setup</text>
  <text x="24" y="325" font-size="15" fill="#334155" font-weight="600">🧱 const.py</text>
  <text x="24" y="355" font-size="14" fill="#475569">• DOMAIN / SCAN_INTERVAL</text>
  <text x="24" y="385" font-size="14" fill="#475569">• CONF_HOST / CONF_PORT / API_KEY</text>
  <rect x="20" y="405" width="270" height="32" rx="6" fill="#e0f2fe"/>
  <text x="32" y="426" font-size="13" fill="#0369a1" font-weight="500">HA startup contract; strictly checked</text>

  <!-- 2. config_flow -->
  <rect x="334" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="358" y="24" width="90" height="36" rx="8" fill="#d97706"/>
  <text x="403" y="48" font-size="14" fill="white" font-weight="600" text-anchor="middle">Onboarding</text>
  <text x="358" y="98" font-size="21" fill="#0f172a" font-weight="600">config_flow.py</text>
  <line x1="358" y1="120" x2="620" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="358" y="155" font-size="15" fill="#334155" font-weight="600">🖥️ async_step_user</text>
  <text x="358" y="185" font-size="14" fill="#475569">• Renders IP &amp; port form in UI</text>
  <text x="358" y="215" font-size="14" fill="#475569">• Probes device using aiohttp</text>
  <text x="358" y="265" font-size="15" fill="#334155" font-weight="600">🔒 Unique ID Lock</text>
  <text x="358" y="295" font-size="14" fill="#475569">• async_set_unique_id(host:port)</text>
  <text x="358" y="325" font-size="14" fill="#475569">• Prevents duplicate entries</text>
  <text x="358" y="365" font-size="15" fill="#334155" font-weight="600">🌐 strings.json</text>
  <text x="358" y="395" font-size="14" fill="#475569">• Multi-language UI error labels</text>
  <rect x="354" y="405" width="270" height="32" rx="6" fill="#fef3c7"/>
  <text x="366" y="426" font-size="13" fill="#b45309" font-weight="500">Zero YAML editing; native UI setup</text>

  <!-- 3. coordinator -->
  <rect x="668" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="692" y="24" width="90" height="36" rx="8" fill="#059669"/>
  <text x="737" y="48" font-size="14" fill="white" font-weight="600" text-anchor="middle">Coordinator</text>
  <text x="692" y="98" font-size="21" fill="#0f172a" font-weight="600">coordinator.py</text>
  <line x1="692" y1="120" x2="954" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="692" y="155" font-size="15" fill="#334155" font-weight="600">⏱️ DataUpdateCoordinator</text>
  <text x="692" y="185" font-size="14" fill="#475569">• Inherits HA coordinator base</text>
  <text x="692" y="215" font-size="14" fill="#475569">• Centralized 30s polling cycle</text>
  <text x="692" y="265" font-size="15" fill="#334155" font-weight="600">⚡ Non-Blocking aiohttp</text>
  <text x="692" y="295" font-size="14" fill="#475569">• Shares HA async ClientSession</text>
  <text x="692" y="325" font-size="14" fill="#475569">• asyncio.timeout(10) safety limit</text>
  <text x="692" y="365" font-size="15" fill="#334155" font-weight="600">🛡️ UpdateFailed Exception</text>
  <text x="692" y="395" font-size="14" fill="#475569">• Flags offline state on connection drop</text>
  <rect x="688" y="405" width="270" height="32" rx="6" fill="#dcfce7"/>
  <text x="700" y="426" font-size="13" fill="#15803d" font-weight="500">1 single poll dispatches to all entities</text>

  <!-- 4. sensor & switch -->
  <rect x="1002" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1026" y="24" width="90" height="36" rx="8" fill="#7c3aed"/>
  <text x="1071" y="48" font-size="14" fill="white" font-weight="600" text-anchor="middle">Entities</text>
  <text x="1026" y="98" font-size="21" fill="#0f172a" font-weight="600">sensor / switch</text>
  <line x1="1026" y1="120" x2="1288" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="1026" y="155" font-size="15" fill="#334155" font-weight="600">🌡️ CoordinatorEntity</text>
  <text x="1026" y="185" font-size="14" fill="#475569">• Subscribes to coordinator updates</text>
  <text x="1026" y="215" font-size="14" fill="#475569">• Zero-overhead memory cache reads</text>
  <text x="1026" y="265" font-size="15" fill="#334155" font-weight="600">🔌 SwitchEntity Control</text>
  <text x="1026" y="295" font-size="14" fill="#475569">• async_turn_on / turn_off handlers</text>
  <text x="1026" y="325" font-size="14" fill="#475569">• Triggers immediate request_refresh</text>
  <text x="1026" y="365" font-size="15" fill="#334155" font-weight="600">🏷️ DeviceInfo Tree</text>
  <text x="1026" y="395" font-size="14" fill="#475569">• Bundles entities into one device</text>
  <rect x="1022" y="405" width="270" height="32" rx="6" fill="#f3e8ff"/>
  <text x="1034" y="426" font-size="13" fill="#6b21a8" font-weight="500">Seamless Lovelace, HomeKit &amp; Siri support</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">Architecture Diagram · 2026 Modern Home Assistant Decoupled Integration Pattern · 2026-10-29</text>
</svg>