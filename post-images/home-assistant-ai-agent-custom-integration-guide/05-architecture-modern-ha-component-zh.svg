<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="现代 Home Assistant 自定义集成四大核心件解剖图">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">CORE ARCHITECTURE / MODERN HA COMPONENT</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">现代 Home Assistant 自定义集成四大核心件解剖图</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">告别陈旧教程坏味道：基于 DataUpdateCoordinator 与 ConfigFlow 的高可靠解耦设计</text>

<g transform="translate(64, 255)">
  <!-- 1. manifest & const -->
  <rect x="0" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="24" width="90" height="36" rx="8" fill="#0284c7"/>
  <text x="69" y="48" font-size="15" fill="white" font-weight="600" text-anchor="middle">资质与常量</text>
  <text x="24" y="98" font-size="22" fill="#0f172a" font-weight="600">manifest / const</text>
  <line x1="24" y1="120" x2="286" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="24" y="155" font-size="15" fill="#334155" font-weight="600">📄 manifest.json</text>
  <text x="24" y="185" font-size="14" fill="#475569">• domain: 唯一标识英文字符串</text>
  <text x="24" y="215" font-size="14" fill="#475569">• iot_class: local_polling</text>
  <text x="24" y="245" font-size="14" fill="#475569">• version: 符合 SemVer 规范</text>
  <text x="24" y="275" font-size="14" fill="#475569">• config_flow: 开启可视化配置</text>
  <text x="24" y="325" font-size="15" fill="#334155" font-weight="600">🧱 const.py</text>
  <text x="24" y="355" font-size="14" fill="#475569">• DOMAIN / DEFAULT_SCAN_INTERVAL</text>
  <text x="24" y="385" font-size="14" fill="#475569">• CONF_HOST / CONF_PORT / API_KEY</text>
  <rect x="20" y="405" width="270" height="32" rx="6" fill="#e0f2fe"/>
  <text x="32" y="426" font-size="13" fill="#0369a1" font-weight="500">HA 启动必检身份证，缺项直接拒绝加载</text>

  <!-- 2. config_flow -->
  <rect x="334" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="358" y="24" width="90" height="36" rx="8" fill="#d97706"/>
  <text x="403" y="48" font-size="15" fill="white" font-weight="600" text-anchor="middle">入户登记</text>
  <text x="358" y="98" font-size="22" fill="#0f172a" font-weight="600">config_flow.py</text>
  <line x1="358" y1="120" x2="620" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="358" y="155" font-size="15" fill="#334155" font-weight="600">🖥️ async_step_user</text>
  <text x="358" y="185" font-size="14" fill="#475569">• 渲染前端 IP 与端口输入表单</text>
  <text x="358" y="215" font-size="14" fill="#475569">• 使用 aiohttp 现场探针预检连通</text>
  <text x="358" y="265" font-size="15" fill="#334155" font-weight="600">🔒 唯一性锁 (Unique ID)</text>
  <text x="358" y="295" font-size="14" fill="#475569">• async_set_unique_id(host:port)</text>
  <text x="358" y="325" font-size="14" fill="#475569">• 自动拦截重复添加，保持洁净</text>
  <text x="358" y="365" font-size="15" fill="#334155" font-weight="600">🌐 多语言 strings.json</text>
  <text x="358" y="395" font-size="14" fill="#475569">• 中英双语提示与报错文案</text>
  <rect x="354" y="405" width="270" height="32" rx="6" fill="#fef3c7"/>
  <text x="366" y="426" font-size="13" fill="#b45309" font-weight="500">告别手写 YAML，点鼠标即可完成安装</text>

  <!-- 3. coordinator -->
  <rect x="668" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="692" y="24" width="90" height="36" rx="8" fill="#059669"/>
  <text x="737" y="48" font-size="15" fill="white" font-weight="600" text-anchor="middle">中心协调</text>
  <text x="692" y="98" font-size="22" fill="#0f172a" font-weight="600">coordinator.py</text>
  <line x1="692" y1="120" x2="954" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="692" y="155" font-size="15" fill="#334155" font-weight="600">⏱️ DataUpdateCoordinator</text>
  <text x="692" y="185" font-size="14" fill="#475569">• 继承官方更新调度器基类</text>
  <text x="692" y="215" font-size="14" fill="#475569">• 设定 30 秒单一抓取时钟</text>
  <text x="692" y="265" font-size="15" fill="#334155" font-weight="600">⚡ 纯非阻塞 aiohttp 会话</text>
  <text x="692" y="295" font-size="14" fill="#475569">• 共享 HA 全局 ClientSession</text>
  <text x="692" y="325" font-size="14" fill="#475569">• asyncio.timeout(10) 超时防死锁</text>
  <text x="692" y="365" font-size="15" fill="#334155" font-weight="600">🛡️ UpdateFailed 异常封装</text>
  <text x="692" y="395" font-size="14" fill="#475569">• 设备断网时自动标记离线</text>
  <rect x="688" y="405" width="270" height="32" rx="6" fill="#dcfce7"/>
  <text x="700" y="426" font-size="13" fill="#15803d" font-weight="500">统一抓取分发，杜绝十几个实体疯狂并发</text>

  <!-- 4. sensor & switch -->
  <rect x="1002" y="0" width="310" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1026" y="24" width="90" height="36" rx="8" fill="#7c3aed"/>
  <text x="1071" y="48" font-size="15" fill="white" font-weight="600" text-anchor="middle">实体呈现</text>
  <text x="1026" y="98" font-size="22" fill="#0f172a" font-weight="600">sensor / switch</text>
  <line x1="1026" y1="120" x2="1288" y2="120" stroke="#f1f5f9" stroke-width="2"/>
  <text x="1026" y="155" font-size="15" fill="#334155" font-weight="600">🌡️ CoordinatorEntity</text>
  <text x="1026" y="185" font-size="14" fill="#475569">• 自动监听 Coordinator 数据更新</text>
  <text x="1026" y="215" font-size="14" fill="#475569">• native_value 零开销读取缓存</text>
  <text x="1026" y="265" font-size="15" fill="#334155" font-weight="600">🔌 SwitchEntity 控制双通</text>
  <text x="1026" y="295" font-size="14" fill="#475569">• async_turn_on / turn_off 下发指令</text>
  <text x="1026" y="325" font-size="14" fill="#475569">• 执行后立即 request_refresh</text>
  <text x="1026" y="365" font-size="15" fill="#334155" font-weight="600">🏷️ DeviceInfo 拓扑树</text>
  <text x="1026" y="395" font-size="14" fill="#475569">• 自动聚合在同一个物理设备名下</text>
  <rect x="1022" y="405" width="270" height="32" rx="6" fill="#f3e8ff"/>
  <text x="1034" y="426" font-size="13" fill="#6b21a8" font-weight="500">实体标准化，完美接入 HomeKit 与 Lovelace</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">架构解析 · 2026 年现代 Home Assistant 自定义集成四层解耦范式 · 2026-10-29</text>
</svg>