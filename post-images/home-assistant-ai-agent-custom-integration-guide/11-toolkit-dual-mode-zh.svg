<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="三端一键脚手架工作流：人工一键运行 vs Agent 自动接管">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">TOOLKIT ARCHITECTURE / DUAL-MODE EXECUTION</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">三端一键脚手架工作流：人工一键运行 vs Agent 自动接管</text>
<text x="64" y="204" font-size="24" fill="#475569" font-weight="400">支持 Windows 11、Ubuntu 26.04、macOS 27，100% 纯本地运行零第三方服务依赖</text>

<g transform="translate(64, 255)">
  <!-- Left Column: Manual Execution -->
  <rect x="0" y="0" width="630" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="32" y="28" width="130" height="38" rx="8" fill="#0284c7"/>
  <text x="97" y="53" font-size="16" fill="white" font-weight="600" text-anchor="middle">模式一：人工执行</text>
  <text x="180" y="55" font-size="22" fill="#0f172a" font-weight="600">单行命令，三端一键直达</text>
  <line x1="32" y1="85" x2="598" y2="85" stroke="#f1f5f9" stroke-width="2"/>

  <!-- OS Sub-cards -->
  <rect x="32" y="110" width="566" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="138" font-size="15" fill="#0284c7" font-weight="600">🪟 Windows 11 (PowerShell 7)</text>
  <text x="52" y="168" font-size="13" fill="#334155" font-family="monospace">.\windows-11.ps1 all -Domain my_custom_device</text>

  <rect x="32" y="210" width="566" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="238" font-size="15" fill="#d97706" font-weight="600">🐧 Ubuntu 26.04 LTS (Bash)</text>
  <text x="52" y="268" font-size="13" fill="#334155" font-family="monospace">bash ubuntu-26.04.sh all</text>

  <rect x="32" y="310" width="566" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="338" font-size="15" fill="#059669" font-weight="600">🍎 macOS 27 (Zsh)</text>
  <text x="52" y="368" font-size="13" fill="#334155" font-family="monospace">zsh macos-27.sh all</text>

  <rect x="32" y="405" width="566" height="36" rx="6" fill="#e0f2fe"/>
  <text x="52" y="428" font-size="13" fill="#0369a1" font-weight="500">✓ 零依赖 Python 标准库，不连任何第三方云端，隐私无忧</text>

  <!-- Right Column: Agent Execution -->
  <rect x="682" y="0" width="630" height="455" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="714" y="28" width="130" height="38" rx="8" fill="#7c3aed"/>
  <text x="779" y="53" font-size="16" fill="white" font-weight="600" text-anchor="middle">模式二：Agent 接管</text>
  <text x="862" y="55" font-size="22" fill="#0f172a" font-weight="600">标准指令，AI 自主交付</text>
  <line x1="714" y1="85" x2="1280" y2="85" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Prompt Box -->
  <rect x="714" y="110" width="566" height="235" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="734" y="140" font-size="14" fill="#7c3aed" font-weight="600">💬 标准 Agent 接入提示词 (Prompt)：</text>
  <text x="734" y="170" font-size="13" fill="#475569">"你现在是我的 Home Assistant 专属架构师与驱动专家。"</text>
  <text x="734" y="195" font-size="13" fill="#475569">"1. 调用 ha_custom_kit.py probe 探测局域网设备端口并提取契约；"</text>
  <text x="734" y="220" font-size="13" fill="#475569">"2. 调用 scaffold 严格按 2026 异步标准生成 8 大核心文件；"</text>
  <text x="734" y="245" font-size="13" fill="#475569">"3. 运行 lint 进行 AST 审查，确保零阻塞、零同步死锁调用；"</text>
  <text x="734" y="270" font-size="13" fill="#475569">"4. 安全部署至 /config/custom_components 并输出接入验收报告。"</text>
  <text x="734" y="300" font-size="13" fill="#7c3aed" font-weight="500">严禁泄露完整局域网 IP 与完整计算机主机名。</text>

  <rect x="714" y="360" width="566" height="75" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="734" y="388" font-size="14" fill="#059669" font-weight="600">🤖 适用本地 AI 工具：</text>
  <text x="734" y="414" font-size="13" fill="#15803d">Claude Code · Codex CLI · Antigravity · Cursor · OpenCode · TinyAgent</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">工具箱设计 · 三端一键自动化工具与 Agent 提示词工程规范 · 2026-10-29</text>
</svg>