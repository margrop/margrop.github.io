<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Beginner Failure Symptoms &amp; 4-Quadrant Troubleshooting Matrix">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#dc2626" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#dc2626" font-weight="600">TROUBLESHOOTING MATRIX / POST-MORTEM</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">Beginner HA Custom Integration Troubleshooting Matrix</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">Diagnosing blocking I/O, polling storms, config flow deadlocks, and manifest validation</text>

<g transform="translate(64, 255)">
  <!-- Card 1 -->
  <rect x="0" y="0" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="20" width="80" height="30" rx="6" fill="#fee2e2"/>
  <text x="64" y="40" font-size="13" fill="#dc2626" font-weight="600" text-anchor="middle">Pitfall 1</text>
  <text x="116" y="43" font-size="19" fill="#0f172a" font-weight="600">Event Loop Blocked: Entire HA Freezes</text>
  <line x1="24" y1="62" x2="606" y2="62" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="24" y="90" font-size="14" fill="#475569">• Symptom: Logs flooded with <code>Detecting blocking call to ...</code></text>
  <text x="24" y="120" font-size="14" fill="#475569">• Root Cause: Invoking <code>requests.get()</code> or <code>time.sleep()</code> in async loop</text>
  <text x="24" y="150" font-size="14" fill="#475569">• Solution: Switch to <code>async_get_clientsession(hass)</code> with aiohttp</text>
  <rect x="24" y="170" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="36" y="190" font-size="13" fill="#059669" font-weight="600">✓ Remedy: Run AST static linting to kill blocking calls</text>

  <!-- Card 2 -->
  <rect x="682" y="0" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="706" y="20" width="80" height="30" rx="6" fill="#fef3c7"/>
  <text x="746" y="40" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle">Pitfall 2</text>
  <text x="798" y="43" font-size="19" fill="#0f172a" font-weight="600">Polling Storm: IoT Hardware Crashes</text>
  <line x1="706" y1="62" x2="1288" y2="62" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="706" y="90" font-size="14" fill="#475569">• Symptom: ESP32 or smart plug randomly reboots under load</text>
  <text x="706" y="120" font-size="14" fill="#475569">• Root Cause: 5 entities concurrently polling the tiny chip</text>
  <text x="706" y="150" font-size="14" fill="#475569">• Solution: Centralize polling with <code>DataUpdateCoordinator</code></text>
  <rect x="706" y="170" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="718" y="190" font-size="13" fill="#059669" font-weight="600">✓ Remedy: Entities read cached memory; traffic drops by 80%</text>

  <!-- Card 3 -->
  <rect x="0" y="240" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="260" width="80" height="30" rx="6" fill="#fee2e2"/>
  <text x="64" y="280" font-size="13" fill="#dc2626" font-weight="600" text-anchor="middle">Pitfall 3</text>
  <text x="116" y="283" font-size="19" fill="#0f172a" font-weight="600">ConfigFlow Deadlock: 'Unknown Error' in UI</text>
  <line x1="24" y1="302" x2="606" y2="302" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="24" y="330" font-size="14" fill="#475569">• Symptom: Setup spinner hangs and throws unexpected error</text>
  <text x="24" y="360" font-size="14" fill="#475569">• Root Cause: Missing connection timeout and uncaught exceptions</text>
  <text x="24" y="390" font-size="14" fill="#475569">• Solution: Wrap with <code>asyncio.timeout(5)</code> and catch client errors</text>
  <rect x="24" y="410" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="36" y="430" font-size="13" fill="#059669" font-weight="600">✓ Remedy: Map errors cleanly to strings.json translations</text>

  <!-- Card 4 -->
  <rect x="682" y="240" width="630" height="215" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="706" y="260" width="80" height="30" rx="6" fill="#fef3c7"/>
  <text x="746" y="280" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle">Pitfall 4</text>
  <text x="798" y="283" font-size="19" fill="#0f172a" font-weight="600">Manifest Rejection: Integration Not Discovered</text>
  <line x1="706" y1="302" x2="1288" y2="302" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="706" y="330" font-size="14" fill="#475569">• Symptom: Files exist in custom_components but not found in UI</text>
  <text x="706" y="360" font-size="14" fill="#475569">• Root Cause: Missing <code>version</code> or <code>iot_class</code> in manifest</text>
  <text x="706" y="390" font-size="14" fill="#475569">• Solution: Supply valid SemVer version and <code>local_polling</code></text>
  <rect x="706" y="410" width="582" height="30" rx="6" fill="#f0fdf4"/>
  <text x="718" y="430" font-size="13" fill="#059669" font-weight="600">✓ Remedy: Use toolkit to generate strict compliant manifest</text>
</g>

<path d="M64 751H1376" stroke="#cbd5e1"/>
<text x="64" y="790" font-size="20" fill="#475569" font-weight="400">Troubleshooting Matrix · Root Causes and Fixes for HA Custom Components · 2026-10-29</text>
</svg>