<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="dagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1a2234"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="url(#dagBg)" rx="16"/>

  <!-- Title -->
  <text x="500" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    《Dr. STONE 石纪元》科学王国核心科技树拓扑依赖图 (Directed Acyclic Graph)
  </text>
  <text x="500" y="65" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    现代文明复活工程：从大自然六大天然原材料，一步步解锁电气、医药与无限信息的全景因果链
  </text>

  <!-- Level 1: Natural Raw Materials (Y=100) -->
  <g>
    <!-- Label -->
    <rect x="30" y="90" width="110" height="26" rx="6" fill="#334155"/>
    <text x="85" y="107" font-family="sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">第 1 级：天然原料</text>

    <!-- Nodes -->
    <!-- Iron Sand -->
    <rect x="160" y="85" width="110" height="36" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="215" y="108" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">🪨 磁铁矿 / 铁砂</text>

    <!-- Copper Ore -->
    <rect x="290" y="85" width="100" height="36" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="340" y="108" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">🪙 孔雀石 / 铜矿</text>

    <!-- Silica Sand -->
    <rect x="410" y="85" width="100" height="36" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="460" y="108" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">🏖️ 石英砂 / 贝壳</text>

    <!-- Sulfur / Spring -->
    <rect x="530" y="85" width="120" height="36" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="590" y="108" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">🌋 硫磺湖 / 硫酸泉</text>

    <!-- Coal / Wood -->
    <rect x="670" y="85" width="110" height="36" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="725" y="108" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">🪵 木材 / 煤炭</text>

    <!-- Bat Guano -->
    <rect x="800" y="85" width="140" height="36" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="870" y="108" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">🦇 蝙蝠粪(硝酸钾)</text>
  </g>

  <!-- Level 2: Smelting & Primary Chemicals (Y=200) -->
  <g>
    <rect x="30" y="195" width="110" height="26" rx="6" fill="#334155"/>
    <text x="85" y="212" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" text-anchor="middle">第 2 级：冶金初化</text>

    <!-- Iron -->
    <rect x="160" y="190" width="110" height="36" rx="8" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="215" y="213" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚙️ 炼钢与铁板</text>

    <!-- Copper Wire -->
    <rect x="290" y="190" width="100" height="36" rx="8" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="340" y="213" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🪢 延展纯铜线</text>

    <!-- Glass Flasks -->
    <rect x="410" y="190" width="110" height="36" rx="8" fill="#0f766e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="465" y="213" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🧪 耐酸耐热玻璃</text>

    <!-- Concentrated Sulfuric Acid -->
    <rect x="540" y="190" width="130" height="36" rx="8" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="605" y="213" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚗️ 工业之母：纯硫酸</text>

    <!-- Nital Fluid -->
    <rect x="750" y="190" width="160" height="36" rx="8" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="830" y="213" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🧬 奇迹复活液 (硝酸酒精)</text>
  </g>

  <!-- Level 3: Power & Optics (Y=310) -->
  <g>
    <rect x="30" y="305" width="110" height="26" rx="6" fill="#334155"/>
    <text x="85" y="322" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" text-anchor="middle">第 3 级：动力与光学</text>

    <!-- Generator -->
    <rect x="190" y="300" width="150" height="38" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="265" y="324" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ 水车发电机 (能量之源)</text>

    <!-- Light Bulb -->
    <rect x="370" y="300" width="140" height="38" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="440" y="324" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">💡 爱迪生竹丝电灯泡</text>

    <!-- Eyeglasses / Optics -->
    <rect x="540" y="300" width="130" height="38" rx="8" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="605" y="324" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">👓 凹凸透镜 (治愈弱视)</text>

    <!-- Hydrochloric & Nitric Reagents -->
    <rect x="700" y="300" width="150" height="38" rx="8" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="775" y="324" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🧪 纯碱、盐酸与乙酸酐</text>
  </g>

  <!-- Level 4: Synthesis & Electronics (Y=420) -->
  <g>
    <rect x="30" y="415" width="110" height="26" rx="6" fill="#334155"/>
    <text x="85" y="432" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" text-anchor="middle">第 4 级：化学合成</text>

    <!-- Sulfa Drug -->
    <rect x="220" y="410" width="190" height="38" rx="8" fill="#7c2d12" stroke="#ea580c" stroke-width="1.5"/>
    <text x="315" y="434" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">💊 广谱抗生素：磺胺 (治愈肺炎)</text>

    <!-- Vacuum Tube -->
    <rect x="460" y="410" width="170" height="38" rx="8" fill="#4338ca" stroke="#6366f1" stroke-width="1.5"/>
    <text x="545" y="434" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">📻 钨丝真空三极管 (信号放大)</text>

    <!-- Plastic & Gear -->
    <rect x="670" y="410" width="160" height="38" rx="8" fill="#4338ca" stroke="#6366f1" stroke-width="1.5"/>
    <text x="750" y="434" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🛞 酚醛塑料 (电绝缘零件)</text>
  </g>

  <!-- Level 5: Climax & Civilization Reboot (Y=530) -->
  <g>
    <rect x="30" y="525" width="110" height="26" rx="6" fill="#334155"/>
    <text x="85" y="542" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cbd5e1" text-anchor="middle">第 5 级：文明跃迁</text>

    <!-- Mobile Phone -->
    <rect x="230" y="515" width="220" height="44" rx="10" fill="#047857" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="340" y="542" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">📱 无线手机通讯战胜司帝国</text>

    <!-- Steam Gorilla Car -->
    <rect x="480" y="515" width="200" height="44" rx="10" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <text x="580" y="542" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🚗 蒸汽大猩猩号装甲车</text>

    <!-- Modern Computer & Rocket -->
    <rect x="710" y="515" width="200" height="44" rx="10" fill="#047857" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="810" y="542" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🚀 硅芯片计算机与重返月球</text>
  </g>

  <!-- Arrows / Connectors -->
  <!-- Level 1 to 2 -->
  <path d="M 215 121 L 215 190" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 340 121 L 340 190" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 460 121 L 465 190" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 590 121 L 605 190" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 870 121 L 830 190" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Level 2 to 3 -->
  <path d="M 215 226 L 250 300" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 340 226 L 270 300" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 280 300 L 410 300" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 465 226 L 440 300" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 465 226 L 605 300" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 605 226 L 750 300" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Level 3 to 4 -->
  <path d="M 750 338 L 350 410" stroke="#ea580c" stroke-width="1.5"/>
  <path d="M 605 226 L 310 410" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 265 338 L 510 410" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M 440 338 L 540 410" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Level 4 to 5 -->
  <path d="M 545 448 L 370 515" stroke="#10b981" stroke-width="2"/>
  <path d="M 750 448 L 400 515" stroke="#10b981" stroke-width="2"/>
  <path d="M 265 338 L 560 515" stroke="#10b981" stroke-width="1.5"/>
  <path d="M 545 448 L 780 515" stroke="#10b981" stroke-width="2"/>
</svg>