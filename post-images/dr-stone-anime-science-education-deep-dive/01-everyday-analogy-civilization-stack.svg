<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="senkuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    现代文明的「隐形千层塔」vs 石纪元的「科技断崖归零」
  </text>
  <text x="500" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    为什么现代人穿越到原始森林会瞬间退化为猴子？而千空能凭借科学因果律从零手搓文明？
  </text>

  <!-- Left Column: Modern Invisible Stack -->
  <g transform="translate(60, 100)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="410" height="45" rx="12" fill="url(#modernGrad)"/>
    <text x="205" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🏢 现代人：被严重宠坏的「终极黑盒消费者」
    </text>

    <!-- Stack Layers -->
    <g transform="translate(20, 60)">
      <!-- Layer 5: App / AI -->
      <rect x="0" y="0" width="370" height="50" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="15" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">L5. 顶层应用：AI 大模型、智能手机、即时配送</text>
      <text x="15" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">99% 人类的全部认知仅停留在这一层（以为按个按钮一切理所当然）</text>

      <!-- Layer 4: Microchips -->
      <rect x="0" y="60" width="370" height="50" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1.2"/>
      <text x="15" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#818cf8">L4. 算力基座：2nm 芯片、光刻机、光纤骨干网</text>
      <text x="15" y="102" font-family="sans-serif" font-size="11" fill="#94a3b8">依赖全球 200 个国家协同分工，任何一颗螺丝断供即全线瘫痪</text>

      <!-- Layer 3: Chemical & Pharma -->
      <rect x="0" y="120" width="370" height="50" rx="8" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="15" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">L3. 精细化工与现代制药：抗生素、化学试剂、高分子材料</text>
      <text x="15" y="162" font-family="sans-serif" font-size="11" fill="#94a3b8">没有抗生素，人类平均寿命跌破 35 岁，一次小小擦伤就是死刑</text>

      <!-- Layer 2: Energy & Grid -->
      <rect x="0" y="180" width="370" height="50" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.2"/>
      <text x="15" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f472b6">L2. 能源与冶金：特种钢材、发电厂、超高压电网</text>
      <text x="15" y="222" font-family="sans-serif" font-size="11" fill="#94a3b8">一切工业动力的血液；断电 48 小时，现代都市退化为原始荒漠</text>

      <!-- Layer 1: Foundation -->
      <rect x="0" y="240" width="370" height="50" rx="8" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="15" y="265" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fb7185">L1. 基础生存：干净水源、自来水管网、肥皂与卫生隔离</text>
      <text x="15" y="282" font-family="sans-serif" font-size="11" fill="#94a3b8">人类战胜瘟疫最强大的武器不是玄学，而是能破坏病菌囊膜的肥皂</text>

      <!-- Warning note -->
      <rect x="0" y="300" width="370" height="45" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
      <text x="185" y="322" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">
        ⚠️ 致命痛点：一旦遭遇全球石化，整座塔瞬间灰飞烟灭！
      </text>
      <text x="185" y="338" font-family="sans-serif" font-size="11" fill="#f87171" text-anchor="middle">
        普通人连一颗螺丝钉、一盒阿莫西林都手搓不出来！
      </text>
    </g>
  </g>

  <!-- Right Column: Senku's DAG Climbing -->
  <g transform="translate(530, 100)">
    <rect width="410" height="420" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="410" height="45" rx="12" fill="url(#senkuGrad)"/>
    <text x="205" y="28" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      🧪 千空：从零拓扑排序的「科学因果解题法」
    </text>

    <!-- Senku Steps -->
    <g transform="translate(20, 60)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="370" height="50" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">第 1 阶：化学破壁——从蝙蝠粪硝酸到复活液</text>
      <text x="15" y="42" font-family="sans-serif" font-size="11" fill="#94a3b8">硝酸 + 蒸馏发酵酒精 = 侵蚀石化外壳的硝酸酒精溶液（Nital）</text>

      <!-- Step 2 -->
      <rect x="0" y="60" width="370" height="50" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="85" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">第 2 阶：基础冶炼与能量——炼铁炉与铜线发电机</text>
      <text x="15" y="102" font-family="sans-serif" font-size="11" fill="#94a3b8">磁铁矿石 + 鼓风炉 = 熟铁；铜线绕圈 + 水车旋转 = 驯服电流</text>

      <!-- Step 3 -->
      <rect x="0" y="120" width="370" height="50" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">第 3 阶：精密容器与光学——吹制耐酸玻璃与矫正镜片</text>
      <text x="15" y="162" font-family="sans-serif" font-size="11" fill="#94a3b8">石英砂 + 碳酸钠 = 耐酸玻璃烧杯（解锁高难度化学实验）与近视镜</text>

      <!-- Step 4 -->
      <rect x="0" y="180" width="370" height="50" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">第 4 阶：生化自愈——25 步全合成抗生素磺胺</text>
      <text x="15" y="222" font-family="sans-serif" font-size="11" fill="#94a3b8">从硫酸、食盐、煤焦油一步步合成出治愈肺炎的磺胺药剂</text>

      <!-- Step 5 -->
      <rect x="0" y="240" width="370" height="50" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
      <text x="15" y="265" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">第 5 阶：信息跃迁——矿石收音机与真空管无线电通信</text>
      <text x="15" y="282" font-family="sans-serif" font-size="11" fill="#94a3b8">打破距离与时间阻隔，用科学战胜武力蛮干的司帝国</text>

      <!-- Success note -->
      <rect x="0" y="300" width="370" height="45" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="185" y="322" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">
        💡 核心本质：科学不是凭空魔法，而是一张严密的有向无环图！
      </text>
      <text x="185" y="338" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">
        只要掌握因果依赖，两百万年的文明历程可以在几年内极速复现！
      </text>
    </g>
  </g>
</svg>