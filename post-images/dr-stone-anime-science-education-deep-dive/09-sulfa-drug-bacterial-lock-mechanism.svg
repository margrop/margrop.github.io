<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="drugBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1e2f"/>
    </linearGradient>
    <linearGradient id="pabaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sulfaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#drugBg)" rx="16"/>

  <!-- Title -->
  <text x="500" y="42" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    抗生素磺胺的微观生化机制：小学生也能秒懂的「假钥匙卡死锁芯」
  </text>
  <text x="500" y="68" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    为什么磺胺（Sulfanilamide）能精准饿死致命肺炎双球菌，却不会对人体细胞造成致命伤害？
  </text>

  <!-- Left: Normal Bacterial Reaction (PABA) -->
  <g transform="translate(60, 95)">
    <rect width="410" height="390" rx="12" fill="#182234" stroke="#334155" stroke-width="1.5"/>
    <rect width="410" height="42" rx="12" fill="#065f46"/>
    <text x="205" y="27" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ✅ 正常状态：细菌吃下真正的 PABA 营养
    </text>

    <!-- Key & Lock Diagram -->
    <g transform="translate(30, 60)">
      <!-- PABA Molecule (Key) -->
      <rect x="40" y="15" width="130" height="45" rx="8" fill="url(#pabaGrad)"/>
      <text x="105" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">真钥匙：PABA</text>
      <text x="105" y="75" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">(对氨基苯甲酸 H2N-C6H4-COOH)</text>

      <!-- Arrow Down -->
      <path d="M 105 85 L 105 125" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
      <polygon points="100,125 110,125 105,135" fill="#10b981"/>

      <!-- Enzyme Lock -->
      <rect x="20" y="145" width="310" height="75" rx="12" fill="#334155" stroke="#475569" stroke-width="2"/>
      <path d="M 75 145 Q 105 175 135 145" fill="#182234"/>
      <text x="175" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#93c5fd" text-anchor="middle">
        二氢蝶酸合酶 (细菌合成叶酸的专用生产车间)
      </text>

      <!-- Outcome -->
      <rect x="10" y="240" width="330" height="65" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.2"/>
      <text x="175" y="265" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0" text-anchor="middle">
        🦠 结果：顺利合成叶酸与 DNA 复制
      </text>
      <text x="175" y="288" font-family="sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">
        细菌疯狂繁衍分裂 ➡️ 琉璃肺部大面积感染，危及生命！
      </text>
    </g>
  </g>

  <!-- Right: Sulfa Inhibition (Competitive Antagonist) -->
  <g transform="translate(530, 95)">
    <rect width="410" height="390" rx="12" fill="#182234" stroke="#334155" stroke-width="1.5"/>
    <rect width="410" height="42" rx="12" fill="#7f1d1d"/>
    <text x="205" y="27" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ❌ 磺胺介入：竞争性抑制（假钥匙卡死锁孔）
    </text>

    <!-- Key & Lock Diagram -->
    <g transform="translate(30, 60)">
      <!-- Sulfa Molecule (Fake Key) -->
      <rect x="40" y="15" width="150" height="45" rx="8" fill="url(#sulfaGrad)"/>
      <text x="115" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">假钥匙：磺胺药剂</text>
      <text x="115" y="75" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">(氨基磺酰基 H2N-C6H4-SO2NH2)</text>

      <!-- Arrow Down -->
      <path d="M 115 85 L 115 125" stroke="#ef4444" stroke-width="2.5"/>
      <polygon points="110,125 120,125 115,135" fill="#ef4444"/>

      <!-- Enzyme Lock Jammed -->
      <rect x="20" y="145" width="310" height="75" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
      <path d="M 85 145 Q 115 175 145 145" fill="#7f1d1d"/>
      <text x="175" y="180" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fca5a5" text-anchor="middle">
        🔒 酶活性中心被死死霸占！真钥匙被彻底拒之门外！
      </text>

      <!-- Outcome -->
      <rect x="10" y="240" width="330" height="65" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1.2"/>
      <text x="175" y="265" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fecaca" text-anchor="middle">
        🛡️ 结果：细菌断粮，叶酸为零，全军覆灭！
      </text>
      <text x="175" y="288" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">
        人类由于自身直接从食物吸收现成叶酸，完全不受磺胺毒害！
      </text>
    </g>
  </g>
</svg>