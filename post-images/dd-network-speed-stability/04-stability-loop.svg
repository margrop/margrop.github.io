<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Stability is a loop, not a single screenshot">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/></marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/><circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">Stability is a loop, not a single screenshot</text><text x="82" y="136" class="subtitle">Repeat the same payload, record each wall-clock result, then look at spread and failures</text>

<circle cx="800" cy="470" r="190" fill="#111c31" stroke="#38bdf8" stroke-width="4"/>
<text x="675" y="450" class="h">same payload</text><text x="710" y="495" class="metric">N rounds</text>
<path d="M800 260 C1120 170 1360 300 1335 520" class="arrow"/><path d="M1335 520 C1260 760 1040 790 850 680" class="arrow"/><path d="M750 680 C480 780 220 650 265 420" class="arrow"/><path d="M265 420 C300 240 520 190 720 250" class="arrow"/>
<rect x="90" y="300" width="310" height="135" rx="22" class="good"/><text x="130" y="355" class="k">RECORD</text><text x="130" y="400" class="p">seconds + rc</text>
<rect x="1200" y="300" width="310" height="135" rx="22" class="warn"/><text x="1240" y="355" class="k">COMPARE</text><text x="1240" y="400" class="p">avg / min / max / CV</text>
<rect x="1110" y="625" width="400" height="135" rx="22" class="card"/><text x="1150" y="680" class="k">CORRELATE</text><text x="1150" y="725" class="p">ping + logs + time</text>
<rect x="90" y="625" width="400" height="135" rx="22" class="bad"/><text x="130" y="680" class="k">STOP</text><text x="130" y="725" class="p">error budget exceeded</text>

<text x="80" y="866" class="small">Original diagram · dd + SSH · reproducible evidence · no private endpoints</text>
</svg>