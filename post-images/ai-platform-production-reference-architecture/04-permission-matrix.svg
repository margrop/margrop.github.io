<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="The model never owns permission">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">The model never owns permission</text>
<text x="82" y="136" class="subtitle">It may suggest a tool call; deterministic policy evaluates identity, scope, risk and approval.</text>

<g class="k"><text x="95" y="225">ACTION</text><text x="620" y="225">READER</text><text x="890" y="225">OPERATOR</text><text x="1190" y="225">ADMIN</text></g>
<g>
<rect x="80" y="255" width="1440" height="105" rx="18" class="card"/><text x="120" y="320" class="h">Read sanitized health</text><text x="635" y="320" class="h" fill="#86efac">ALLOW</text><text x="905" y="320" class="h">ALLOW</text><text x="1205" y="320" class="h">ALLOW</text>
<rect x="80" y="385" width="1440" height="105" rx="18" class="card"/><text x="120" y="450" class="h">Restart a service</text><text x="635" y="450" class="h">DENY</text><text x="905" y="450" class="h">APPROVE</text><text x="1205" y="450" class="h">APPROVE</text>
<rect x="80" y="515" width="1440" height="105" rx="18" class="card"/><text x="120" y="580" class="h">Delete an artifact</text><text x="635" y="580" class="h">DENY</text><text x="905" y="580" class="h">DENY</text><text x="1205" y="580" class="h">APPROVE</text>
</g>
<rect x="80" y="670" width="1440" height="88" rx="18" class="warn"/><text x="125" y="726" class="h">Approval binds exact arguments + expiry + approver; changing the plan invalidates it.</text>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>