<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Four planes, one identity spine">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">Four planes, one identity spine</text>
<text x="82" y="136" class="subtitle">Separate responsibilities so a fluent sentence cannot silently become an irreversible action.</text>

<rect x="85" y="205" width="1430" height="115" rx="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
<text x="125" y="255" class="k">EXPERIENCE PLANE</text><text x="500" y="270" class="h">Channels · Turn Manager · streaming · barge-in · citations</text>
<rect x="85" y="345" width="1430" height="115" rx="24" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
<text x="125" y="395" class="k">CONTROL PLANE</text><text x="500" y="410" class="h">AI Gateway · router · policy · approval · task state</text>
<rect x="85" y="485" width="1430" height="115" rx="24" fill="#3b1f0b" stroke="#f59e0b" stroke-width="2"/>
<text x="125" y="535" class="k">EXECUTION PLANE</text><text x="500" y="550" class="h">Workers · tools · sandbox · idempotency · retry budget</text>
<rect x="85" y="625" width="1430" height="115" rx="24" fill="#052e24" stroke="#10b981" stroke-width="2"/>
<text x="125" y="675" class="k">DATA + EVIDENCE PLANE</text><text x="500" y="690" class="h">Memory · artifacts · traces · audit · evals · cost</text>
<path d="M300 195 V750" stroke="#f8fafc" stroke-width="4" stroke-dasharray="10 12" opacity=".5"/>
<text x="120" y="795" class="k">IDENTITY / TENANT / DEVICE CONTEXT CROSSES EVERY PLANE</text>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>