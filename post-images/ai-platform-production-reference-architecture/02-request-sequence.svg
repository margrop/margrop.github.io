<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="One request, many accountable handoffs">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">One request, many accountable handoffs</text>
<text x="82" y="136" class="subtitle">Like an airport trip: ticket, security, gate, aircraft and baggage tracking are different jobs.</text>

<g class="k"><text x="90" y="220">USER</text><text x="320" y="220">TURN</text><text x="560" y="220">GATEWAY</text><text x="830" y="220">POLICY</text><text x="1070" y="220">WORKER</text><text x="1330" y="220">EVIDENCE</text></g>
<g stroke="#475569" stroke-width="3" stroke-dasharray="8 8"><path d="M125 250 V700"/><path d="M355 250 V700"/><path d="M615 250 V700"/><path d="M875 250 V700"/><path d="M1125 250 V700"/><path d="M1390 250 V700"/></g>
<path d="M125 300 H345" class="arrow"/><text x="155" y="285" class="small">message + identity</text>
<path d="M355 370 H605" class="arrow"/><text x="395" y="355" class="small">normalized turn</text>
<path d="M615 440 H865" class="arrow"/><text x="650" y="425" class="small">plan + requested tool</text>
<path d="M875 510 H1115" class="arrow"/><text x="915" y="495" class="small">allow / deny / approve</text>
<path d="M1125 580 H1380" class="arrow"/><text x="1160" y="565" class="small">result + idempotency</text>
<path d="M1380 650 H365" class="arrow"/><text x="795" y="635" class="small">trace + sanitized stream + audit</text>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>