<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Scale stateless edges; protect stateful cores">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">Scale stateless edges; protect stateful cores</text>
<text x="82" y="136" class="subtitle">High availability is about eliminating ambiguous ownership, not drawing more boxes.</text>

<rect x="80" y="220" width="300" height="480" rx="26" class="card"/><text x="120" y="280" class="k">CHANNEL EDGE</text><text x="120" y="340" class="p">Web / App</text><text x="120" y="380" class="p">voice / webhook</text><text x="120" y="450" class="h">stateless × N</text>
<path d="M390 450 H510" class="arrow"/>
<rect x="540" y="220" width="470" height="480" rx="26" class="card"/><text x="580" y="280" class="k">CONTROL SERVICES</text><text x="580" y="340" class="p">Turn Manager</text><text x="580" y="380" class="p">AI Gateway + policy</text><text x="580" y="420" class="p">Task API + approvals</text><text x="580" y="485" class="h">stateless × N</text><text x="580" y="545" class="p">lease + retry budgets</text>
<path d="M1020 450 H1140" class="arrow"/>
<rect x="1170" y="220" width="350" height="220" rx="26" class="warn"/><text x="1210" y="280" class="k">WORKERS</text><text x="1210" y="340" class="h">sandboxed × N</text><text x="1210" y="390" class="p">tool-specific pools</text>
<rect x="1170" y="475" width="350" height="225" rx="26" class="good"/><text x="1210" y="535" class="k">STATEFUL CORE</text><text x="1210" y="590" class="p">SQL + queue</text><text x="1210" y="630" class="p">object store + telemetry</text>
<path d="M1345 465 V445" class="arrow"/>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>