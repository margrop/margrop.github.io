<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Routing is a policy, not a catch-all retry">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">Routing is a policy, not a catch-all retry</text>
<text x="82" y="136" class="subtitle">Only eligible failures cross providers; authentication errors and unsafe prompts must stop.</text>

<rect x="80" y="235" width="380" height="420" rx="28" class="card"/>
<text x="125" y="300" class="k">REQUEST ENVELOPE</text><text x="125" y="355" class="p">tenant + purpose</text><text x="125" y="395" class="p">latency SLO</text><text x="125" y="435" class="p">data class</text><text x="125" y="475" class="p">cost ceiling</text>
<path d="M470 440 H610" class="arrow"/>
<rect x="640" y="235" width="400" height="420" rx="28" class="warn"/>
<text x="685" y="300" class="k">PRIMARY PROVIDER</text><text x="685" y="385" class="metric">429</text><text x="685" y="440" class="p">retry budget: 1</text><text x="685" y="480" class="p">eligible: rate limit</text>
<path d="M1050 440 H1185" class="arrow"/>
<rect x="1215" y="235" width="305" height="420" rx="28" class="good"/>
<text x="1255" y="300" class="k">FALLBACK</text><text x="1255" y="385" class="metric">200</text><text x="1255" y="440" class="p">same policy</text><text x="1255" y="480" class="p">audit route</text>
<rect x="500" y="700" width="1020" height="70" rx="16" class="bad"/><text x="545" y="746" class="h">401 / invalid auth / denied policy → STOP, never hide it with fallback</text>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>