<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="PgBouncer is the restaurant host">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">PgBouncer is the restaurant host</text>
<text x="82" y="136" class="subtitle">Guests wait at one desk; a bounded kitchen team serves transactions in turns.</text>

<text x="90" y="225" class="k">150 CLIENTS</text>
<g fill="#38bdf8"><circle cx="120" cy="280" r="12"/><circle cx="160" cy="280" r="12"/><circle cx="200" cy="280" r="12"/><circle cx="240" cy="280" r="12"/><circle cx="280" cy="280" r="12"/><circle cx="320" cy="280" r="12"/><circle cx="360" cy="280" r="12"/><circle cx="400" cy="280" r="12"/><circle cx="440" cy="280" r="12"/><circle cx="480" cy="280" r="12"/><circle cx="120" cy="320" r="12"/><circle cx="160" cy="320" r="12"/><circle cx="200" cy="320" r="12"/><circle cx="240" cy="320" r="12"/><circle cx="280" cy="320" r="12"/><circle cx="320" cy="320" r="12"/><circle cx="360" cy="320" r="12"/><circle cx="400" cy="320" r="12"/><circle cx="440" cy="320" r="12"/><circle cx="480" cy="320" r="12"/><circle cx="120" cy="360" r="12"/><circle cx="160" cy="360" r="12"/><circle cx="200" cy="360" r="12"/><circle cx="240" cy="360" r="12"/><circle cx="280" cy="360" r="12"/><circle cx="320" cy="360" r="12"/><circle cx="360" cy="360" r="12"/><circle cx="400" cy="360" r="12"/><circle cx="440" cy="360" r="12"/><circle cx="480" cy="360" r="12"/><circle cx="120" cy="400" r="12"/><circle cx="160" cy="400" r="12"/><circle cx="200" cy="400" r="12"/><circle cx="240" cy="400" r="12"/><circle cx="280" cy="400" r="12"/><circle cx="320" cy="400" r="12"/><circle cx="360" cy="400" r="12"/><circle cx="400" cy="400" r="12"/><circle cx="440" cy="400" r="12"/><circle cx="480" cy="400" r="12"/></g>
<text x="90" y="520" class="p">Many client sessions</text><text x="90" y="555" class="p">do not need 150 backends.</text>
<path d="M540 400 H690" class="arrow"/>
<rect x="710" y="250" width="330" height="300" rx="28" class="card"/>
<text x="755" y="325" class="k">HOST DESK</text><text x="755" y="385" class="h">PgBouncer</text>
<text x="755" y="435" class="p">transaction mode</text><text x="755" y="475" class="p">short fair turns</text>
<path d="M1050 400 H1190" class="arrow"/>
<rect x="1210" y="245" width="310" height="310" rx="28" class="good"/>
<text x="1250" y="315" class="k">KITCHEN</text><text x="1250" y="385" class="metric">21</text>
<text x="1250" y="430" class="p">backend connections</text><text x="1250" y="490" class="k">0 FAILED TX</text>
<rect x="700" y="630" width="830" height="95" rx="18" class="good"/>
<text x="745" y="689" class="h">35,751 transactions · 2,995.425 TPS · measured in the lab</text>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>