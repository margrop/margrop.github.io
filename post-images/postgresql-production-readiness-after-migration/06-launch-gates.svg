<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Four green gates before cutover">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">Four green gates before cutover</text>
<text x="82" y="136" class="subtitle">A launch decision is an evidence board, not a feeling.</text>

<g>
<rect x="90" y="225" width="330" height="430" rx="26" class="good"/><text x="130" y="285" class="k">GATE 1</text><text x="130" y="345" class="h">Connections</text><text x="130" y="410" class="p">pool mode known</text><text x="130" y="450" class="p">reserve slots kept</text><text x="130" y="520" class="metric">PASS</text>
<rect x="450" y="225" width="330" height="430" rx="26" class="good"/><text x="490" y="285" class="k">GATE 2</text><text x="490" y="345" class="h">Queries</text><text x="490" y="410" class="p">top SQL measured</text><text x="490" y="450" class="p">plans inspected</text><text x="490" y="520" class="metric">PASS</text>
<rect x="810" y="225" width="330" height="430" rx="26" class="good"/><text x="850" y="285" class="k">GATE 3</text><text x="850" y="345" class="h">Vacuum</text><text x="850" y="410" class="p">dead tuples watched</text><text x="850" y="450" class="p">freeze age alerted</text><text x="850" y="520" class="metric">PASS</text>
<rect x="1170" y="225" width="330" height="430" rx="26" class="good"/><text x="1210" y="285" class="k">GATE 4</text><text x="1210" y="345" class="h">Recovery</text><text x="1210" y="410" class="p">RPO/RTO defined</text><text x="1210" y="450" class="p">restore rehearsed</text><text x="1210" y="520" class="metric">PASS</text>
</g>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>