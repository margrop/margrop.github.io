<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="The four-part PostgreSQL journey">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
  </marker>
</defs>
<style>
  .title{font:700 52px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .subtitle{font:400 25px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .h{font:700 28px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fafc}
  .k{font:700 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#7dd3fc;letter-spacing:1px}
  .p{font:400 22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#cbd5e1}
  .small{font:400 18px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#94a3b8}
  .metric{font:800 48px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}
  .mono{font:500 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe}
  .card{fill:#111c31;stroke:#334155;stroke-width:2;filter:url(#shadow)}
  .good{fill:#052e24;stroke:#10b981;stroke-width:2}
  .warn{fill:#3b1f0b;stroke:#f59e0b;stroke-width:2}
  .bad{fill:#3a1218;stroke:#fb7185;stroke-width:2}
  .arrow{stroke:#7dd3fc;stroke-width:5;fill:none;marker-end:url(#arrow)}
</style>

<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1460" cy="70" r="250" fill="#1d4ed8" opacity=".12"/>
<circle cx="100" cy="870" r="230" fill="#0ea5e9" opacity=".08"/>
<text x="80" y="92" class="title">The four-part PostgreSQL journey</text>
<text x="82" y="136" class="subtitle">A migration is a chain; the weakest untested link defines launch risk.</text>

<rect x="70" y="245" width="330" height="390" rx="26" class="card"/>
<text x="105" y="300" class="k">01 · WHY</text><text x="105" y="355" class="h">Choose PostgreSQL</text>
<text x="105" y="410" class="p">Capability</text><text x="105" y="445" class="p">trade-offs</text><text x="105" y="500" class="p">exit criteria</text>
<path d="M405 440 H455" class="arrow"/>
<rect x="465" y="245" width="330" height="390" rx="26" class="card"/>
<text x="500" y="300" class="k">02 · MOVE</text><text x="500" y="355" class="h">Migrate data</text>
<text x="500" y="410" class="p">schema mapping</text><text x="500" y="445" class="p">dual verification</text><text x="500" y="500" class="p">rollback window</text>
<path d="M800 440 H850" class="arrow"/>
<rect x="860" y="245" width="330" height="390" rx="26" class="card"/>
<text x="895" y="300" class="k">03 · TUNE</text><text x="895" y="355" class="h">Fit the workload</text>
<text x="895" y="410" class="p">memory budget</text><text x="895" y="445" class="p">connection pool</text><text x="895" y="500" class="p">WAL + vacuum</text>
<path d="M1195 440 H1245" class="arrow"/>
<rect x="1255" y="225" width="280" height="430" rx="26" class="good"/>
<text x="1290" y="280" class="k">04 · PROVE</text><text x="1290" y="335" class="h">Rehearse failure</text>
<text x="1290" y="395" class="p">overload</text><text x="1290" y="430" class="p">slow SQL</text><text x="1290" y="465" class="p">bloat</text><text x="1290" y="500" class="p">accidental delete</text>
<text x="1290" y="580" class="k">THIS FINALE</text>

<text x="80" y="866" class="small">Original diagram · reproducible evidence, explicit boundaries, no hidden magic</text>
</svg>