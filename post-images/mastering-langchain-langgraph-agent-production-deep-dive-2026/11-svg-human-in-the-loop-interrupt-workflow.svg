<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow11)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">工业级高危管控：LangGraph 人在回路 (HITL) 状态机持久化全流程</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">高风险操作（转账/删库/发邮件）如何通过中断挂起、状态快照与人工审批实现绝对安全</text>

  <!-- Flowchart Stages -->
  <g transform="translate(60, 130)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="220" height="380" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#0284c7"/>
    <text x="110" y="24" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">1. 智能体意图决策</text>
    
    <text x="15" y="65" fill="#f1f5f9" font-size="13" font-weight="bold">• 接收用户指令：</text>
    <text x="15" y="85" fill="#94a3b8" font-size="12">"批量下线过期账单数据库"</text>
    
    <text x="15" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• Agent 节点规划：</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">调用 drop_database 工具</text>
    <text x="15" y="165" fill="#cbd5e1" font-size="12">参数: target="billings_2024"</text>

    <text x="15" y="215" fill="#f59e0b" font-size="13" font-weight="bold">• 条件边安全判决：</text>
    <text x="15" y="235" fill="#fde68a" font-size="12">检测到高危标记 (is_critical)</text>
    <text x="15" y="255" fill="#fde68a" font-size="12">触发路由 -&gt; "approval_gate"</text>
    
    <rect x="15" y="300" width="190" height="60" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="110" y="325" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">当前状态: RUNNING</text>
    <text x="110" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">thread_id="session-9921"</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="295,310 315,320 295,330" fill="#38bdf8"/>

  <!-- Stage 2 -->
  <g transform="translate(330, 130)">
    <rect x="0" y="0" width="220" height="380" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#e11d48"/>
    <text x="110" y="24" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">2. 状态机中断挂起</text>

    <text x="15" y="65" fill="#f1f5f9" font-size="13" font-weight="bold">• 触发 interrupt()：</text>
    <text x="15" y="85" fill="#fda4af" font-size="12">状态图立即暂停执行</text>
    
    <text x="15" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 检查点自动快照：</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">Postgres/SqliteSaver 写入</text>
    <text x="15" y="165" fill="#cbd5e1" font-size="12">完整 State 快照与调用栈</text>

    <text x="15" y="215" fill="#f59e0b" font-size="13" font-weight="bold">• 释放计算资源：</text>
    <text x="15" y="235" fill="#cbd5e1" font-size="12">API 向客户端返回 202</text>
    <text x="15" y="255" fill="#cbd5e1" font-size="12">"任务已挂起，等待审核"</text>

    <rect x="15" y="300" width="190" height="60" rx="6" fill="#0f172a" stroke="#e11d48"/>
    <text x="110" y="325" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="bold">当前状态: SUSPENDED</text>
    <text x="110" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">等待人工介入信号</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="565,310 585,320 565,330" fill="#f59e0b"/>

  <!-- Stage 3 -->
  <g transform="translate(600, 130)">
    <rect x="0" y="0" width="220" height="380" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#d97706"/>
    <text x="110" y="24" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">3. 人工审查与参数微调</text>

    <text x="15" y="65" fill="#f1f5f9" font-size="13" font-weight="bold">• 运维中控台通知：</text>
    <text x="15" y="85" fill="#fef08a" font-size="12">管理看板收到高危卡片</text>
    
    <text x="15" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 人工校验与修正：</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">管理员核对数据库备份</text>
    <text x="15" y="165" fill="#cbd5e1" font-size="12">支持微调工具参数 payload</text>

    <text x="15" y="215" fill="#34d399" font-size="13" font-weight="bold">• 发出恢复信号：</text>
    <text x="15" y="235" fill="#a7f3d0" font-size="12">点击【确认执行】或【驳回】</text>
    <text x="15" y="255" fill="#a7f3d0" font-size="12">app.invoke(Command(resume=...))</text>

    <rect x="15" y="300" width="190" height="60" rx="6" fill="#0f172a" stroke="#d97706"/>
    <text x="110" y="325" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">审查操作: APPROVED</text>
    <text x="110" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">附带签名令牌</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="835,310 855,320 835,330" fill="#10b981"/>

  <!-- Stage 4 -->
  <g transform="translate(870, 130)">
    <rect x="0" y="0" width="270" height="380" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="36" rx="6" fill="#059669"/>
    <text x="135" y="24" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">4. 断点无缝恢复与终结</text>

    <text x="15" y="65" fill="#f1f5f9" font-size="13" font-weight="bold">• 状态机无损唤醒：</text>
    <text x="15" y="85" fill="#a7f3d0" font-size="12">从 Checkpoint 完美还原现场</text>
    
    <text x="15" y="125" fill="#f1f5f9" font-size="13" font-weight="bold">• 工具安全执行：</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="12">执行安全隔离后的数据库下线</text>
    <text x="15" y="165" fill="#cbd5e1" font-size="12">结果写入消息总线</text>

    <text x="15" y="215" fill="#38bdf8" font-size="13" font-weight="bold">• 最终交付与归档：</text>
    <text x="15" y="235" fill="#bae6fd" font-size="12">生成合规审计日志 (Audit Log)</text>
    <text x="15" y="255" fill="#bae6fd" font-size="12">通知用户操作已圆满完成</text>

    <rect x="15" y="300" width="240" height="60" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="135" y="325" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">最终状态: COMPLETED</text>
    <text x="135" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">全流程可追溯、零事故风险</text>
  </g>
  </g>

  <!-- Bottom summary bar -->
  <g transform="translate(60, 550)">
    <rect width="1080" height="80" rx="10" fill="#111827" stroke="#334155"/>
    <text x="24" y="32" fill="#38bdf8" font-size="15" font-weight="bold">💡 企业生产核心共识：</text>
    <text x="24" y="58" fill="#cbd5e1" font-size="13">永远不要给予大模型“无限制的 Root 权限”。生产级智能体不是脱缰野马，通过 LangGraph 的持久化中断机制，既享受了 AI 的自动化红利，又在关键命脉处筑牢了 100% 确定性的安全护栏！</text>
  </g>
</svg>