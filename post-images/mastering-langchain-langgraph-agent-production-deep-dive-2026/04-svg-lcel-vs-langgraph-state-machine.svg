<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow4)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">架构演进跃迁：LCEL 线性链 vs LangGraph 循环状态机</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16">从不可控的管道黑盒，走向确定性、可持久化、人在回路的生产级状态拓扑</text>

  <!-- Left: LCEL (Linear Chain) -->
  <g transform="translate(60, 115)">
    <rect width="520" height="520" rx="16" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="520" rx="4" fill="#64748b"/>
    <text x="24" y="40" fill="#94a3b8" font-size="20" font-weight="bold">传统范式：LCEL 线性管道 (Linear Chain)</text>
    <text x="24" y="68" fill="#64748b" font-size="14">适用于：确定性 RAG 召回、文本清洗、结构化单向转换</text>

    <!-- Pipeline nodes -->
    <g transform="translate(40, 95)">
      <rect width="440" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="220" y="33" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">用户输入 (PromptTemplate / Dict)</text>
      
      <path d="M 220 54 L 220 74" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <polygon points="216,74 220,82 224,74" fill="#64748b"/>

      <g transform="translate(0, 85)">
        <rect width="440" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="220" y="33" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">管道操作符: prompt | model | parser</text>
      </g>

      <polygon points="216,160 220,168 224,160" fill="#64748b"/>

      <g transform="translate(0, 170)">
        <rect width="440" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="220" y="33" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">LLM 单次推理 (ChatOpenAI / ChatAnthropic)</text>
      </g>

      <polygon points="216,245 220,253 224,245" fill="#64748b"/>

      <g transform="translate(0, 255)">
        <rect width="440" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="220" y="33" text-anchor="middle" fill="#cbd5e1" font-size="15" font-weight="bold">输出解析 (StrOutputParser / JsonOutputParser)</text>
      </g>
    </g>

    <g transform="translate(30, 435)">
      <rect width="460" height="70" rx="8" fill="#1f2937" stroke="#dc2626" stroke-width="1"/>
      <text x="16" y="26" fill="#f87171" font-size="14" font-weight="bold">⚠️ 生产致命瓶颈：</text>
      <text x="16" y="48" fill="#cbd5e1" font-size="13">• 无法优雅支持自纠错回环，一旦出错全链路瘫痪；</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="13">• 缺乏长期状态持久化，高并发下无重试与断点续跑能力。</text>
    </g>
  </g>

  <!-- Right: LangGraph (Cyclic StateGraph) -->
  <g transform="translate(620, 115)">
    <rect width="520" height="520" rx="16" fill="#111827" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="0" y="0" width="8" height="520" rx="4" fill="url(#purpleGlow)"/>
    <text x="24" y="40" fill="#c084fc" font-size="20" font-weight="bold">现代重器：LangGraph 循环状态机 (StateGraph)</text>
    <text x="24" y="68" fill="#a78bfa" font-size="14">适用于：自主多步 Agent、复杂决策流、人在回路管控</text>

    <!-- State box -->
    <g transform="translate(40, 90)">
      <rect width="440" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="220" y="26" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="bold">全局共享状态 (TypedDict + Reducers + Checkpointer)</text>
    </g>

    <!-- Node cluster -->
    <g transform="translate(40, 145)">
      <!-- Agent Node -->
      <rect x="20" y="10" width="180" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="110" y="38" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">Agent 规划节点</text>
      <text x="110" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">LLM Decision &amp; Plan</text>

      <!-- Conditional Edge -->
      <path d="M 200 40 L 240 40" stroke="#f59e0b" stroke-width="2"/>
      <text x="220" y="32" text-anchor="middle" fill="#f59e0b" font-size="12">条件边</text>

      <!-- Tool Node -->
      <rect x="240" y="10" width="180" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="330" y="38" text-anchor="middle" fill="#10b981" font-size="15" font-weight="bold">工具执行节点</text>
      <text x="330" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Tool Execution</text>

      <!-- Cyclic loop back -->
      <path d="M 330 70 L 330 110 L 110 110 L 110 70" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
      <polygon points="106,75 110,67 114,75" fill="#8b5cf6"/>
      <text x="220" y="105" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="bold">循环反馈回路 (Cyclic Edge)</text>

      <!-- HITL Gate -->
      <g transform="translate(40, 135)">
        <rect width="360" height="52" rx="8" fill="#312e81" stroke="#a855f7"/>
        <text x="180" y="32" text-anchor="middle" fill="#e9d5ff" font-size="14" font-weight="bold">人在回路闸门 (interrupt() 挂起与持久化审查)</text>
      </g>
    </g>

    <!-- Bottom perks -->
    <g transform="translate(30, 420)">
      <rect width="460" height="85" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="24" fill="#34d399" font-size="14" font-weight="bold">✨ 生产级核心突破：</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="13">• 纯函数节点设计：只返回状态更新差量，消灭状态污染；</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="13">• 持久化检查点 (Postgres/SqliteSaver)：原生支持时光倒流排障；</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="13">• 线程级隔离 (thread_id)：单集群稳定承载千万多租户会话。</text>
    </g>
  </g>
</svg>