<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow9)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">生产避坑指南：LangChain / LangGraph 四大致命死穴与破局对策</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">为什么 Demo 跑得飞起，一上生产几小时内就遭遇严重事故？深度根因剖析</text>

  <!-- 4 Cards Grid (2x2) -->
  <!-- Card 1: Top Left -->
  <g transform="translate(60, 120)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#f43f5e"/>
    <text x="24" y="38" fill="#f43f5e" font-size="19" font-weight="bold">死穴一：无限递归死循环“Token 焚尸炉”</text>
    <text x="24" y="68" fill="#f8fafc" font-size="14" font-weight="bold">💥 事故现象：模型因细微幻觉在两个工具间反复踢皮球，烧光额度</text>
    <text x="24" y="98" fill="#cbd5e1" font-size="13">• 致命根因：条件边完全依赖 LLM 的自然语言判断，缺乏确定性终止边界；</text>
    <text x="24" y="124" fill="#cbd5e1" font-size="13">• 破坏威力：单次会话消耗数十万 Token，引发 API 速率限流与巨额账单；</text>
    <text x="24" y="154" fill="#34d399" font-size="14" font-weight="bold">🛡️ 破局对策：硬编码 Recursion Limit 熔断器 + 意图漂移衰减检测</text>
    <text x="24" y="184" fill="#94a3b8" font-size="12">通过 config={"recursion_limit": 15} 与状态内累计重试计数器实施强制降级退出。</text>
  </g>

  <!-- Card 2: Top Right -->
  <g transform="translate(620, 120)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#f59e0b"/>
    <text x="24" y="38" fill="#f59e0b" font-size="19" font-weight="bold">死穴二：可变状态并发竞争与数据污染</text>
    <text x="24" y="68" fill="#f8fafc" font-size="14" font-weight="bold">💥 事故现象：并发执行多个工具分支时，节点互相覆盖状态导致数据丢失</text>
    <text x="24" y="98" fill="#cbd5e1" font-size="13">• 致命根因：在节点内部就地修改 state 字典，破坏了状态机的不变性语义；</text>
    <text x="24" y="124" fill="#cbd5e1" font-size="13">• 破坏威力：偶发性竞态条件（Race Condition），本地单元测试完全无法复现；</text>
    <text x="24" y="154" fill="#34d399" font-size="14" font-weight="bold">🛡️ 破局对策：纯函数节点设计 + 显式 Reducer (add_messages)</text>
    <text x="24" y="184" fill="#94a3b8" font-size="12">节点严禁就地修改，必须返回增量更新字典；消息列表必须标记累加规约器。</text>
  </g>

  <!-- Card 3: Bottom Left -->
  <g transform="translate(60, 380)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#a855f7"/>
    <text x="24" y="38" fill="#c084fc" font-size="19" font-weight="bold">死穴三：内存状态暴毙与会话不可恢复</text>
    <text x="24" y="68" fill="#f8fafc" font-size="14" font-weight="bold">💥 事故现象：容器滚动发布或 Pod 突发重启，用户数小时对话全线报废</text>
    <text x="24" y="98" fill="#cbd5e1" font-size="13">• 致命根因：直接沿用官方新手教程中的 MemorySaver 内存单例检查点；</text>
    <text x="24" y="124" fill="#cbd5e1" font-size="13">• 破坏威力：无分布式会话恢复能力，根本无法支撑企业级水平伸缩架构；</text>
    <text x="24" y="154" fill="#34d399" font-size="14" font-weight="bold">🛡️ 破局对策：采用持久化 PostgresSaver / SqliteSaver + 线程级隔离</text>
    <text x="24" y="184" fill="#94a3b8" font-size="12">利用带连接池的持久化存储，将 thread_id 与用户租户强绑定，支持随时无损恢复。</text>
  </g>

  <!-- Card 4: Bottom Right -->
  <g transform="translate(620, 380)">
    <rect width="520" height="230" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="230" rx="4" fill="#38bdf8"/>
    <text x="24" y="38" fill="#38bdf8" font-size="19" font-weight="bold">死穴四：黑盒工具调用与全链路雪崩</text>
    <text x="24" y="68" fill="#f8fafc" font-size="14" font-weight="bold">💥 事故现象：外部工具超时或吐出不规则异常，直接穿透模型阻断全流程</text>
    <text x="24" y="98" fill="#cbd5e1" font-size="13">• 致命根因：工具缺乏输入强校验与网络防御超时，未实现异常语义包裹；</text>
    <text x="24" y="124" fill="#cbd5e1" font-size="13">• 破坏威力：模型接收到未处理的 Python 原始报错堆栈，引发严重思维幻觉；</text>
    <text x="24" y="154" fill="#34d399" font-size="14" font-weight="bold">🛡️ 破局对策：Pydantic 严格入参契约 + 异常自愈回传给 LLM 决策</text>
    <text x="24" y="184" fill="#94a3b8" font-size="12">将错误格式化为 ToolMessage 反馈给模型，引导 Agent 自动尝试降级备选方案。</text>
  </g>
</svg>