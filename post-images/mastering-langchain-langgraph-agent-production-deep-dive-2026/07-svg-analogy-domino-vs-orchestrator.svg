<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow7)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">小学生秒懂：LangChain / LangGraph 核心概念生活大比方</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">把晦涩的拓扑图、检查点与人在回路，映射到日常最直观的生活场景</text>

  <!-- Card 1 -->
  <g transform="translate(60, 120)">
    <rect width="345" height="490" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="10" rx="4" fill="#38bdf8"/>
    <text x="24" y="44" fill="#38bdf8" font-size="20" font-weight="bold">比方一：LCEL 链 vs 状态图</text>
    <text x="24" y="74" fill="#e2e8f0" font-size="15" font-weight="bold">多米诺骨牌 vs 工厂调度调度室</text>
    
    <rect x="20" y="95" width="305" height="150" rx="8" fill="#0f172a"/>
    <text x="32" y="125" fill="#f43f5e" font-size="14" font-weight="bold">🧱 LCEL = 多米诺骨牌：</text>
    <text x="32" y="152" fill="#cbd5e1" font-size="13">牌推下去一条路走到黑，中间哪怕有一</text>
    <text x="32" y="172" fill="#cbd5e1" font-size="13">块卡住倒不下去，整排牌当场死翘翘，</text>
    <text x="32" y="192" fill="#cbd5e1" font-size="13">没人能把它扶正了接着推。</text>
    <text x="32" y="222" fill="#94a3b8" font-size="12">（不可重试、不可分支回环）</text>

    <rect x="20" y="260" width="305" height="195" rx="8" fill="#0f172a"/>
    <text x="32" y="290" fill="#38bdf8" font-size="14" font-weight="bold">🏭 LangGraph = 现代化流水线：</text>
    <text x="32" y="318" fill="#cbd5e1" font-size="13">调度室墙上挂着黑板（State），工人</text>
    <text x="32" y="338" fill="#cbd5e1" font-size="13">拿着对讲机（Node），质检员站在岔</text>
    <text x="32" y="358" fill="#cbd5e1" font-size="13">路口（Edge）。发现螺丝拧歪了，一</text>
    <text x="32" y="378" fill="#cbd5e1" font-size="13">键打回上一步返工重拧！</text>
    <text x="32" y="408" fill="#34d399" font-size="12">（状态可回流、逻辑可循环闭环）</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(428, 120)">
    <rect width="345" height="490" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="10" rx="4" fill="#a855f7"/>
    <text x="24" y="44" fill="#c084fc" font-size="20" font-weight="bold">比方二：记忆与 Checkpoint</text>
    <text x="24" y="74" fill="#e2e8f0" font-size="15" font-weight="bold">金鱼脑 vs 侦探案情笔记本</text>
    
    <rect x="20" y="95" width="305" height="150" rx="8" fill="#0f172a"/>
    <text x="32" y="125" fill="#f43f5e" font-size="14" font-weight="bold">🐟 内存记忆 = 7秒金鱼脑：</text>
    <text x="32" y="152" fill="#cbd5e1" font-size="13">全靠脑子硬记，服务器只要闪退或者重</text>
    <text x="32" y="172" fill="#cbd5e1" font-size="13">启一次，瞬间失忆，用户聊了半天的</text>
    <text x="32" y="192" fill="#cbd5e1" font-size="13">订单与上下文全部灰飞烟灭！</text>
    <text x="32" y="222" fill="#94a3b8" font-size="12">（MemorySaver 的生产盲区）</text>

    <rect x="20" y="260" width="305" height="195" rx="8" fill="#0f172a"/>
    <text x="32" y="290" fill="#c084fc" font-size="14" font-weight="bold">🕵️ Checkpoint = 铁证日志本：</text>
    <text x="32" y="318" fill="#cbd5e1" font-size="13">每推理一步，大侦探都在小本本上盖</text>
    <text x="32" y="338" fill="#cbd5e1" font-size="13">戳存档（PostgresSaver）。哪怕天塌</text>
    <text x="32" y="358" fill="#cbd5e1" font-size="13">地陷，翻开对应页码（thread_id），</text>
    <text x="32" y="378" fill="#cbd5e1" font-size="13">随时能够穿越回案发第一现场！</text>
    <text x="32" y="408" fill="#34d399" font-size="12">（故障断点秒恢复、时光机排障）</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(795, 120)">
    <rect width="345" height="490" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="10" rx="4" fill="#10b981"/>
    <text x="24" y="44" fill="#34d399" font-size="20" font-weight="bold">比方三：人在回路 (HITL)</text>
    <text x="24" y="74" fill="#e2e8f0" font-size="15" font-weight="bold">无脑炒菜机 vs 米其林大厨把关</text>
    
    <rect x="20" y="95" width="305" height="150" rx="8" fill="#0f172a"/>
    <text x="32" y="125" fill="#f43f5e" font-size="14" font-weight="bold">🤖 纯自主 Agent = 盲盒炒菜机：</text>
    <text x="32" y="152" fill="#cbd5e1" font-size="13">放盐还是放糖全凭大模型心情，稍不</text>
    <text x="32" y="172" fill="#cbd5e1" font-size="13">留神直接一把倒进半袋洗洁精，还把</text>
    <text x="32" y="192" fill="#cbd5e1" font-size="13">菜直接端给客人（直接删库/转账）！</text>
    <text x="32" y="222" fill="#94a3b8" font-size="12">（无审查高危工具调用的恶果）</text>

    <rect x="20" y="260" width="305" height="195" rx="8" fill="#0f172a"/>
    <text x="32" y="290" fill="#34d399" font-size="14" font-weight="bold">👨‍🍳 HITL 闸门 = 总厨试味：</text>
    <text x="32" y="318" fill="#cbd5e1" font-size="13">学徒机器人切菜翻炒，到了“开火放</text>
    <text x="32" y="338" fill="#cbd5e1" font-size="13">绝密调料”的关键一步（interrupt），</text>
    <text x="32" y="358" fill="#cbd5e1" font-size="13">必须停火等待总厨亲自尝一口，批准</text>
    <text x="32" y="378" fill="#cbd5e1" font-size="13">盖章后才允许端给顾客！</text>
    <text x="32" y="408" fill="#34d399" font-size="12">（零安全隐患、高风险企业级防御）</text>
  </g>
</svg>