<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGlow12)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="bold">跨平台沙箱架构：零依赖 LangChain / Agent 生产自测验证套件</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-size="16">原生适配三大操作系统，无需任何外部大模型 API Key，纯本地确定性验证</text>

  <!-- 3 OS Columns -->
  <!-- Col 1: Windows 11 -->
  <g transform="translate(60, 120)">
    <rect width="345" height="420" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="38" rx="6" fill="#0284c7"/>
    <text x="172" y="25" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Windows 11 (PowerShell 7.4+)</text>
    
    <text x="20" y="70" fill="#38bdf8" font-size="14" font-weight="bold">执行入口：</text>
    <rect x="15" y="80" width="315" height="32" rx="6" fill="#0f172a"/>
    <text x="25" y="102" fill="#e2e8f0" font-size="12" font-family="monospace">.\agent_langchain_sandbox_windows11.ps1</text>

    <text x="20" y="145" fill="#f1f5f9" font-size="13" font-weight="bold">• 原生 PS7 高并发 Runspace 压测</text>
    <text x="20" y="170" fill="#cbd5e1" font-size="12">• 内置本地状态机与 Reducer 竞态检测</text>
    <text x="20" y="195" fill="#cbd5e1" font-size="12">• 模拟无限循环 Token 熔断保护</text>
    <text x="20" y="220" fill="#cbd5e1" font-size="12">• 自动导出 JSON 结构化评估报告</text>

    <rect x="20" y="270" width="305" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="295" fill="#34d399" font-size="13" font-weight="bold">双模自适应驱动：</text>
    <text x="30" y="325" fill="#cbd5e1" font-size="12">• 人工模式：-Interactive</text>
    <text x="30" y="350" fill="#cbd5e1" font-size="12">• Agent 模式：-AgentMode -Silent</text>
    <text x="30" y="380" fill="#94a3b8" font-size="11">零第三方模块依赖，双击或一键调用</text>
  </g>

  <!-- Col 2: Ubuntu 26.04 -->
  <g transform="translate(428, 120)">
    <rect width="345" height="420" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="38" rx="6" fill="#ea580c"/>
    <text x="172" y="25" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Ubuntu 26.04 (Bash 5.2+)</text>

    <text x="20" y="70" fill="#fb923c" font-size="14" font-weight="bold">执行入口：</text>
    <rect x="15" y="80" width="315" height="32" rx="6" fill="#0f172a"/>
    <text x="25" y="102" fill="#e2e8f0" font-size="12" font-family="monospace">./agent_langchain_sandbox_ubuntu2604.sh</text>

    <text x="20" y="145" fill="#f1f5f9" font-size="13" font-weight="bold">• 纯 Bash + Python 3 标准库联动</text>
    <text x="20" y="170" fill="#cbd5e1" font-size="12">• 基于 SQLite3 验证状态检查点恢复</text>
    <text x="20" y="195" fill="#cbd5e1" font-size="12">• 子进程并发轰炸测试 Reducer 规约</text>
    <text x="20" y="220" fill="#cbd5e1" font-size="12">• CI/CD 自动化流水线退出码规范</text>

    <rect x="20" y="270" width="305" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="295" fill="#34d399" font-size="13" font-weight="bold">双模自适应驱动：</text>
    <text x="30" y="325" fill="#cbd5e1" font-size="12">• 人工模式：--interactive</text>
    <text x="30" y="350" fill="#cbd5e1" font-size="12">• Agent 模式：--agent-mode</text>
    <text x="30" y="380" fill="#94a3b8" font-size="11">适配 Debian/Ubuntu 原生环境</text>
  </g>

  <!-- Col 3: macOS 27 -->
  <g transform="translate(795, 120)">
    <rect width="345" height="420" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="345" height="38" rx="6" fill="#9333ea"/>
    <text x="172" y="25" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">macOS 27 (Darwin Zsh 5.9+)</text>

    <text x="20" y="70" fill="#c084fc" font-size="14" font-weight="bold">执行入口：</text>
    <rect x="15" y="80" width="315" height="32" rx="6" fill="#0f172a"/>
    <text x="25" y="102" fill="#e2e8f0" font-size="12" font-family="monospace">./agent_langchain_sandbox_macos27.zsh</text>

    <text x="20" y="145" fill="#f1f5f9" font-size="13" font-weight="bold">• 原生 Apple Silicon 极致性能调度</text>
    <text x="20" y="170" fill="#cbd5e1" font-size="12">• Zsh 彩色格式化仪表盘输出</text>
    <text x="20" y="195" fill="#cbd5e1" font-size="12">• 验证 Human-in-the-Loop 中断与恢复</text>
    <text x="20" y="220" fill="#cbd5e1" font-size="12">• 无依赖开箱即跑，一秒输出评估</text>

    <rect x="20" y="270" width="305" height="135" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="295" fill="#34d399" font-size="13" font-weight="bold">双模自适应驱动：</text>
    <text x="30" y="325" fill="#cbd5e1" font-size="12">• 人工模式：--interactive</text>
    <text x="30" y="350" fill="#cbd5e1" font-size="12">• Agent 模式：--agent-mode</text>
    <text x="30" y="380" fill="#94a3b8" font-size="11">兼容 macOS Terminal / iTerm2</text>
  </g>

  <!-- Bottom Checklist -->
  <g transform="translate(60, 560)">
    <rect width="1080" height="75" rx="10" fill="#111827" stroke="#334155"/>
    <text x="30" y="28" fill="#38bdf8" font-size="14" font-weight="bold">沙箱四大核心评测引擎：</text>
    <text x="30" y="55" fill="#cbd5e1" font-size="13">[1] 循环递归熔断拦截 (100分)  |  [2] 消息规约并发原子性 (98分)  |  [3] SQLite 持久化检查点回滚 (96分)  |  [4] 工具沙箱防御降级 (98分)</text>
  </g>
</svg>