<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101d33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="1" stop-color="#111b2f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="60" y="74" font-size="40" font-weight="700" fill="#f1f5f9">ip.skk.moe：一个网站 = 七件网络诊断武器</text>
  <text x="60" y="112" font-size="20" fill="#7f93b3">从「我是谁」到「我从哪条路出门」一次看清</text>

  <g font-size="19" fill="#dbe6f7">
    <!-- card template -->
    <g>
      <rect x="60" y="150" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="84" y="192" font-size="24" font-weight="700" fill="#7dd3fc">① 本机 IP 查询</text>
      <text x="84" y="228" fill="#9db1cf">IPv4 / IPv6、位置、ISP、ASN</text>
      <text x="84" y="256" fill="#9db1cf">四个数据源交叉验证</text>
    </g>
    <g>
      <rect x="435" y="150" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="459" y="192" font-size="24" font-weight="700" fill="#7dd3fc">② 网站分流测试</text>
      <text x="459" y="228" fill="#9db1cf">国内 / 国际网站分别走哪条路</text>
      <text x="459" y="256" fill="#9db1cf">验证域名分流规则</text>
    </g>
    <g>
      <rect x="810" y="150" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="834" y="192" font-size="24" font-weight="700" fill="#7dd3fc">③ 多出口 IP 查询</text>
      <text x="834" y="228" fill="#9db1cf">1600+ 探针验证策略路由</text>
      <text x="834" y="256" fill="#9db1cf">PBR / 分流隧道体检</text>
    </g>
    <g>
      <rect x="60" y="310" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="84" y="352" font-size="24" font-weight="700" fill="#7dd3fc">④ CDN 命中节点</text>
      <text x="84" y="388" fill="#9db1cf">Cloudflare / Akamai / Fastly…</text>
      <text x="84" y="416" fill="#9db1cf">看你被分配到哪个边缘节点</text>
    </g>
    <g>
      <rect x="435" y="310" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="459" y="352" font-size="24" font-weight="700" fill="#7dd3fc">⑤ DNS 出口查询</text>
      <text x="459" y="388" fill="#9db1cf">你的 DNS 从哪个城市出门</text>
      <text x="459" y="416" fill="#9db1cf">判断 CDN 是否被「带偏」</text>
    </g>
    <g>
      <rect x="810" y="310" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="834" y="352" font-size="24" font-weight="700" fill="#7dd3fc">⑥ WebRTC UDP 查询</text>
      <text x="834" y="388" fill="#9db1cf">UDP 流量走哪个出口</text>
      <text x="834" y="416" fill="#9db1cf">检查 UDP 泄漏</text>
    </g>
    <g>
      <rect x="60" y="470" width="330" height="130" rx="16" fill="url(#card)" stroke="#2a3a58"/>
      <text x="84" y="512" font-size="24" font-weight="700" fill="#7dd3fc">⑦ IP 洞察</text>
      <text x="84" y="548" fill="#9db1cf">20+ GeoIP 数据库同时问诊</text>
      <text x="84" y="576" fill="#9db1cf">一个 IP 的「多方会诊」</text>
    </g>
    <g>
      <rect x="435" y="470" width="705" height="130" rx="16" fill="#0e1a2e" stroke="#2a3a58" stroke-dasharray="6 6"/>
      <text x="459" y="516" font-size="22" font-weight="700" fill="#fbbf24">生活类比</text>
      <text x="459" y="552" fill="#9db1cf">IP 查询 = 看门牌号 ｜ 分流测试 = 看出门走哪条路</text>
      <text x="459" y="580" fill="#9db1cf">CDN 节点 = 快递分拣站 ｜ DNS 出口 = 问路处的位置</text>
    </g>
  </g>
</svg>
