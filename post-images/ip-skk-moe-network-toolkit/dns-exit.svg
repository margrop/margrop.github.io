<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif">
  <rect width="1200" height="560" rx="24" fill="#0b1220"/>
  <text x="60" y="70" font-size="36" font-weight="700" fill="#f1f5f9">DNS 出口为什么决定 CDN 快不快？</text>
  <text x="60" y="104" font-size="19" fill="#7f93b3">把 CDN 想成分布全国的快递柜：派件员按「问路处」的位置给你分柜子</text>

  <!-- 你 -->
  <rect x="70" y="240" width="180" height="90" rx="14" fill="#16233c" stroke="#2a3a58"/>
  <text x="160" y="280" font-size="22" fill="#dbe6f7" text-anchor="middle">你（北京）</text>
  <text x="160" y="308" font-size="16" fill="#9db1cf" text-anchor="middle">想找最近的快递柜</text>

  <!-- 递归DNS -->
  <rect x="420" y="180" width="220" height="90" rx="14" fill="#1b2a4a" stroke="#3b82f6"/>
  <text x="530" y="218" font-size="21" fill="#93c5fd" text-anchor="middle">递归 DNS（问路处）</text>
  <text x="530" y="246" font-size="16" fill="#9db1cf" text-anchor="middle">出口在上海</text>
  <rect x="420" y="330" width="220" height="90" rx="14" fill="#1b2a4a" stroke="#22c55e"/>
  <text x="530" y="368" font-size="21" fill="#86efac" text-anchor="middle">递归 DNS（问路处）</text>
  <text x="530" y="396" font-size="16" fill="#9db1cf" text-anchor="middle">出口在北京</text>

  <!-- CDN -->
  <rect x="840" y="150" width="260" height="80" rx="14" fill="#16233c" stroke="#2a3a58"/>
  <text x="970" y="185" font-size="20" fill="#dbe6f7" text-anchor="middle">CDN 上海节点</text>
  <text x="970" y="210" font-size="15" fill="#f87171" text-anchor="middle">离你 1200km，慢</text>
  <rect x="840" y="360" width="260" height="80" rx="14" fill="#16233c" stroke="#2a3a58"/>
  <text x="970" y="395" font-size="20" fill="#dbe6f7" text-anchor="middle">CDN 北京节点</text>
  <text x="970" y="420" font-size="15" fill="#4ade80" text-anchor="middle">就在同城，快</text>

  <g stroke-width="3" fill="none">
    <path d="M250 270 C330 250 360 225 420 222" stroke="#3b82f6"/>
    <path d="M250 300 C330 330 360 368 420 372" stroke="#22c55e"/>
    <path d="M640 222 C720 210 780 195 840 190" stroke="#f87171" stroke-dasharray="7 6"/>
    <path d="M640 372 C720 385 780 395 840 398" stroke="#4ade80" stroke-dasharray="7 6"/>
  </g>
  <text x="720" y="140" font-size="17" fill="#f87171">被分去上海柜子</text>
  <text x="720" y="470" font-size="17" fill="#4ade80">被分去北京柜子</text>
  <text x="60" y="520" font-size="17" fill="#7f93b3">DNS 出口查询 = 看看「问路处」本人站在哪座城市，就知道 CDN 为什么把你带偏了。</text>
</svg>
