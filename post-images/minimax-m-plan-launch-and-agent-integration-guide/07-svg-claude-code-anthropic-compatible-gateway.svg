<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="gwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050913" />
    </linearGradient>
    <linearGradient id="gBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="620" fill="url(#gwBg)" rx="16" />
  <rect x="12" y="12" width="1176" height="596" fill="none" stroke="#1e293b" stroke-width="2" rx="14" />

  <text x="600" y="55" fill="#f8fafc" font-size="24" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">Claude Code 与 MiniMax M Plan 的 Anthropic 协议网关架构</text>
  <text x="600" y="85" fill="#94a3b8" font-size="14" font-family="-apple-system, sans-serif" text-anchor="middle">Seamless Zero-Code-Change Drop-in Replacement via ANTHROPIC_BASE_URL</text>
  <line x1="60" y1="105" x2="1140" y2="105" stroke="#334155" stroke-width="1" />

  <!-- Step 1: Terminal / Claude Code -->
  <g transform="translate(60, 150)">
    <rect width="300" height="400" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="2" />
    <rect x="20" y="20" width="260" height="40" rx="6" fill="#d97706" />
    <text x="150" y="46" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">1. 客户端：Claude Code</text>
    <text x="25" y="90" fill="#fbbf24" font-size="13" font-weight="bold">本地环境配置 (Env / Settings)</text>
    <text x="25" y="120" fill="#cbd5e1" font-size="11" font-family="monospace">ANTHROPIC_BASE_URL=</text>
    <text x="25" y="140" fill="#34d399" font-size="11" font-family="monospace">https://api.minimax.io/anthropic</text>
    <text x="25" y="180" fill="#cbd5e1" font-size="11" font-family="monospace">ANTHROPIC_AUTH_TOKEN=</text>
    <text x="25" y="200" fill="#38bdf8" font-size="11" font-family="monospace">sk-mplan-auth-token-xxx</text>
    <text x="25" y="240" fill="#cbd5e1" font-size="11" font-family="monospace">ANTHROPIC_MODEL=</text>
    <text x="25" y="260" fill="#a78bfa" font-size="11" font-family="monospace">MiniMax-M3.1-Flash</text>
    <line x1="25" y1="285" x2="275" y2="285" stroke="#334155" />
    <text x="25" y="315" fill="#94a3b8" font-size="11">• 发起 /v1/messages 原生调用</text>
    <text x="25" y="340" fill="#94a3b8" font-size="11">• 支持 Tool Calling &amp; Streaming</text>
    <text x="25" y="365" fill="#94a3b8" font-size="11">• 零第三方中间代理插件依赖</text>
  </g>

  <!-- Flow 1 to 2 -->
  <path d="M 370 330 L 440 330" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <text x="405" y="315" fill="#fbbf24" font-size="11" text-anchor="middle">HTTPS</text>

  <!-- Step 2: MiniMax Gateway -->
  <g transform="translate(450, 150)">
    <rect width="320" height="400" rx="12" fill="url(#gBoxGrad)" stroke="#3b82f6" stroke-width="2" />
    <rect x="20" y="20" width="280" height="40" rx="6" fill="#2563eb" />
    <text x="160" y="46" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">2. MiniMax Anthropic 适配网关</text>
    <text x="25" y="90" fill="#60a5fa" font-size="13" font-weight="bold">协议层自动双向解耦与翻译</text>
    
    <rect x="25" y="115" width="270" height="60" rx="6" fill="#1e293b" />
    <text x="35" y="138" fill="#e2e8f0" font-size="12" font-weight="bold">身份鉴权与 M Plan 校验</text>
    <text x="35" y="158" fill="#94a3b8" font-size="11">校验 Subscription Key / 判定所属档位</text>

    <rect x="25" y="190" width="270" height="60" rx="6" fill="#1e293b" />
    <text x="35" y="213" fill="#e2e8f0" font-size="12" font-weight="bold">Anthropic Messages 格式转换</text>
    <text x="35" y="233" fill="#94a3b8" font-size="11">将 content blocks 转换为 MiniMax 内部结构</text>

    <rect x="25" y="265" width="270" height="60" rx="6" fill="#1e293b" />
    <text x="35" y="288" fill="#e2e8f0" font-size="12" font-weight="bold">流式 SSE 事件重组 (Streaming)</text>
    <text x="35" y="308" fill="#94a3b8" font-size="11">content_block_delta 实时逐字推流</text>

    <text x="160" y="365" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="bold">首字响应低至 280ms / 零丢包</text>
  </g>

  <!-- Flow 2 to 3 -->
  <path d="M 780 330 L 850 330" stroke="#3b82f6" stroke-width="3" fill="none" />
  <text x="815" y="315" fill="#60a5fa" font-size="11" text-anchor="middle">RPC</text>

  <!-- Step 3: MiniMax Foundation Engine -->
  <g transform="translate(860, 150)">
    <rect width="280" height="400" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="20" y="20" width="240" height="40" rx="6" fill="#059669" />
    <text x="140" y="46" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">3. 核心大模型集群</text>
    <text x="25" y="90" fill="#34d399" font-size="13" font-weight="bold">MiniMax 456B / M3.1 Flash</text>

    <text x="25" y="125" fill="#cbd5e1" font-size="12">• 1M 上下文长程推理</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="12">• Tunable Reasoning (思考链)</text>
    <text x="25" y="185" fill="#cbd5e1" font-size="12">• 跨文件 AST 语法精准重构</text>
    <text x="25" y="215" fill="#cbd5e1" font-size="12">• 工具调用 (Bash / File Edit)</text>
    
    <rect x="20" y="260" width="240" height="100" rx="8" fill="#064e3b" stroke="#10b981" />
    <text x="140" y="290" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">M Plan 扣费策略</text>
    <text x="140" y="315" fill="#e0f2fe" font-size="11" text-anchor="middle">定额包月，无按量额外扣费</text>
    <text x="140" y="335" fill="#6ee7b7" font-size="11" text-anchor="middle">极速跑通几千行工程代码重构</text>
  </g>
</svg>