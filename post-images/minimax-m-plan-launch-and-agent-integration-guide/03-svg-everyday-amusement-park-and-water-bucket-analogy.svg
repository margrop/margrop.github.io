<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16" />
  <rect x="12" y="12" width="1176" height="656" fill="none" stroke="#1e293b" stroke-width="2" rx="14" />

  <!-- Header -->
  <text x="600" y="55" fill="#f8fafc" font-size="24" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">小学生秒懂的日常生活大比方：从按量买票到全通手环与共享水库</text>
  <text x="600" y="85" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Deep Analogy: Why MiniMax M Plan Transforms Agentic Coding &amp; Quota Economics</text>
  <line x1="60" y1="105" x2="1140" y2="105" stroke="#334155" stroke-width="1" />

  <!-- Panel 1: Amusement Park -->
  <g transform="translate(50, 130)">
    <rect width="530" height="500" rx="12" fill="url(#cardGrad1)" stroke="#4338ca" stroke-width="2" />
    <text x="265" y="40" fill="#a5b4fc" font-size="18" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">比方一：游乐园单次买票 vs 畅玩通票手环</text>

    <!-- Sub Box Left -->
    <rect x="25" y="70" width="225" height="400" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="137" y="100" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">传统按量 / 旧Token模式</text>
    <text x="137" y="125" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="-apple-system, sans-serif">像进游乐园每个项目单独刷卡</text>
    
    <circle cx="137" cy="180" r="36" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
    <text x="137" y="185" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">单次扣费</text>

    <text x="40" y="245" fill="#fca5a5" font-size="12" font-family="-apple-system, sans-serif">• 旋转木马: 每次敲代码扣费</text>
    <text x="40" y="275" fill="#fca5a5" font-size="12" font-family="-apple-system, sans-serif">• 碰碰车: 智能体跑单测扣费</text>
    <text x="40" y="305" fill="#fca5a5" font-size="12" font-family="-apple-system, sans-serif">• 摩天轮: 代码审查再次扣费</text>
    <text x="40" y="345" fill="#f87171" font-size="12" font-weight="bold" font-family="-apple-system, sans-serif">【核心痛点】：</text>
    <text x="40" y="370" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">每走一步都在肉疼算账</text>
    <text x="40" y="390" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">Agent反复重试引发"账单恐慌"</text>
    <text x="40" y="440" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">随时可能耗尽余额弹窗中断！</text>

    <!-- Sub Box Right -->
    <rect x="280" y="70" width="225" height="400" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="392" y="100" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">全新 MiniMax M Plan</text>
    <text x="392" y="125" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="-apple-system, sans-serif">戴上VIP全通手环畅玩全场</text>

    <circle cx="392" cy="180" r="36" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="392" y="185" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">全通手环</text>

    <text x="295" y="245" fill="#6ee7b7" font-size="12" font-family="-apple-system, sans-serif">• 碰碰车(M3.1极速文本): 随意坐</text>
    <text x="295" y="275" fill="#6ee7b7" font-size="12" font-family="-apple-system, sans-serif">• 旋转木马(语音与图像): 随心配</text>
    <text x="295" y="305" fill="#6ee7b7" font-size="12" font-family="-apple-system, sans-serif">• 跳楼机(H3超清视频): 畅快玩</text>
    <text x="295" y="345" fill="#34d399" font-size="12" font-weight="bold" font-family="-apple-system, sans-serif">【升级体验】：</text>
    <text x="295" y="370" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">开发者保持沉浸心流状态</text>
    <text x="295" y="390" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">定额包月，预算100%可控</text>
    <text x="295" y="440" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">无限次尝试直到Bug被彻底修好！</text>
  </g>

  <!-- Panel 2: Water Reservoir -->
  <g transform="translate(620, 130)">
    <rect width="530" height="500" rx="12" fill="url(#cardGrad2)" stroke="#059669" stroke-width="2" />
    <text x="265" y="40" fill="#6ee7b7" font-size="18" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">比方二：水电气分散分账 vs 共享中央水库</text>

    <!-- Sub Box Left -->
    <rect x="25" y="70" width="225" height="400" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="137" y="100" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">旧模式：三块独立表计</text>
    <text x="137" y="125" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="-apple-system, sans-serif">文本/画图/做视频各自划账</text>

    <rect x="50" y="160" width="175" height="45" rx="6" fill="#374151" stroke="#9ca3af" />
    <text x="137" y="188" fill="#e5e7eb" font-size="12" text-anchor="middle">水表: 文本Token额度</text>
    <rect x="50" y="215" width="175" height="45" rx="6" fill="#374151" stroke="#9ca3af" />
    <text x="137" y="243" fill="#e5e7eb" font-size="12" text-anchor="middle">电表: 生图积分点数</text>
    <rect x="50" y="270" width="175" height="45" rx="6" fill="#374151" stroke="#9ca3af" />
    <text x="137" y="298" fill="#e5e7eb" font-size="12" text-anchor="middle">气表: 视频渲染时长</text>

    <text x="40" y="345" fill="#f59e0b" font-size="12" font-weight="bold" font-family="-apple-system, sans-serif">【割裂窘境】：</text>
    <text x="40" y="370" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">写代码额度花不完却过期</text>
    <text x="40" y="390" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">想做条视频却提示没有额外余额</text>
    <text x="40" y="440" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">多把Key多份账单，管理心力憔悴！</text>

    <!-- Sub Box Right -->
    <rect x="280" y="70" width="225" height="400" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="392" y="100" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">M Plan：全模态中央水库</text>
    <text x="392" y="125" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="-apple-system, sans-serif">一池活水，全模态按需舀取</text>

    <rect x="305" y="160" width="175" height="155" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="2" />
    <text x="392" y="195" fill="#67e8f9" font-size="13" font-weight="bold" text-anchor="middle">M Plan 统一额度池</text>
    <text x="392" y="225" fill="#bae6fd" font-size="11" text-anchor="middle">↓ 文本/代码 (M3.1 Flash)</text>
    <text x="392" y="250" fill="#bae6fd" font-size="11" text-anchor="middle">↓ 视频生成 (H3 Video)</text>
    <text x="392" y="275" fill="#bae6fd" font-size="11" text-anchor="middle">↓ 语音合成 + 图像生成</text>

    <text x="295" y="345" fill="#38bdf8" font-size="12" font-weight="bold" font-family="-apple-system, sans-serif">【灵活优势】：</text>
    <text x="295" y="370" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">今天写代码就拧开自来水龙头</text>
    <text x="295" y="390" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif">明天做视频就多舀两瓢高能水</text>
    <text x="295" y="440" fill="#06b6d4" font-size="12" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">额度动态自适应，每一分钱都不浪费！</text>
  </g>
</svg>