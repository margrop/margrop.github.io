<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#rBg)" rx="16" />
  <rect x="12" y="12" width="1176" height="616" fill="none" stroke="#1e293b" stroke-width="2" rx="14" />

  <text x="600" y="55" fill="#f8fafc" font-size="24" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">工业级 Coding Agent 成本效益与能力雷达多维对比</text>
  <text x="600" y="85" fill="#94a3b8" font-size="14" font-family="-apple-system, sans-serif" text-anchor="middle">Comparative Radar &amp; Cost Efficiency: MiniMax M Plan vs Claude Pro vs GPT-4o Plus</text>
  <line x1="60" y1="105" x2="1140" y2="105" stroke="#334155" stroke-width="1" />

  <!-- Left Radar Chart (Center: 350, 360) -->
  <g transform="translate(350, 360)">
    <!-- Concentric Web Rings -->
    <polygon points="0,-180 171,-55 106,145 -106,145 -171,-55" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <polygon points="0,-135 128,-41 80,109 -80,109 -128,-41" fill="none" stroke="#1e293b" stroke-width="1" />
    <polygon points="0,-90 85,-27 53,72 -53,72 -85,-27" fill="none" stroke="#1e293b" stroke-width="1" />
    <polygon points="0,-45 43,-14 26,36 -26,36 -43,-14" fill="none" stroke="#1e293b" stroke-width="1" />

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-195" stroke="#334155" />
    <line x1="0" y1="0" x2="185" y2="-60" stroke="#334155" />
    <line x1="0" y1="0" x2="115" y2="155" stroke="#334155" />
    <line x1="0" y1="0" x2="-115" y2="155" stroke="#334155" />
    <line x1="0" y1="0" x2="-185" y2="-60" stroke="#334155" />

    <!-- Labels -->
    <text x="0" y="-205" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">成本性价比 (Cost Value)</text>
    <text x="200" y="-60" fill="#f8fafc" font-size="12" font-weight="bold">首字延迟与吞吐 (Speed/TTFT)</text>
    <text x="125" y="175" fill="#f8fafc" font-size="12" font-weight="bold">全模态覆盖 (Video/Voice/Img)</text>
    <text x="-125" y="175" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="end">并发Agent扩展性</text>
    <text x="-200" y="-60" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="end">上下文长度 (1M Context)</text>

    <!-- Polygon: Claude Pro (Orange) -->
    <!-- Cost: 0.6, Speed: 0.65, Multi: 0.45, Concurrency: 0.4, Context: 0.7 -->
    <polygon points="0,-108 111,-36 48,65 -42,58 -120,-38" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="2" />

    <!-- Polygon: GPT-4o Plus (Blue) -->
    <!-- Cost: 0.55, Speed: 0.75, Multi: 0.65, Concurrency: 0.45, Context: 0.65 -->
    <polygon points="0,-99 128,-41 69,94 -48,65 -111,-35" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="2" />

    <!-- Polygon: MiniMax M Plan (Cyan) -->
    <!-- Cost: 0.95, Speed: 0.92, Multi: 0.95, Concurrency: 0.88, Context: 0.95 -->
    <polygon points="0,-171 157,-50 101,138 -93,128 -162,-52" fill="rgba(6, 182, 212, 0.35)" stroke="#06b6d4" stroke-width="3" />
  </g>

  <!-- Right Details & Stats -->
  <g transform="translate(680, 150)">
    <rect width="460" height="430" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="30" y="40" fill="#38bdf8" font-size="16" font-weight="bold" font-family="-apple-system, sans-serif">核心指标量化评测对比矩阵</text>

    <!-- Legend -->
    <circle cx="40" cy="75" r="6" fill="#06b6d4" />
    <text x="55" y="80" fill="#f8fafc" font-size="12" font-weight="bold">MiniMax M Plan (Explore/Build)</text>

    <circle cx="270" cy="75" r="6" fill="#f59e0b" />
    <text x="285" y="80" fill="#94a3b8" font-size="12">Claude Pro ($20/mo)</text>

    <line x1="30" y1="100" x2="430" y2="100" stroke="#334155" />

    <!-- Metric items -->
    <text x="30" y="130" fill="#e2e8f0" font-size="13" font-weight="bold">1. 编码模型单次生成与首字延迟 (TTFT)</text>
    <text x="30" y="152" fill="#34d399" font-size="12">• MiniMax M3.1-Flash: ~280ms 首字 / 126+ Tokens/s (极速流畅)</text>
    <text x="30" y="172" fill="#94a3b8" font-size="11">• 传统模型: 1,800ms ~ 3,200ms 首字 (频繁工具交互易产生卡顿)</text>

    <text x="30" y="210" fill="#e2e8f0" font-size="13" font-weight="bold">2. 上下文窗口容量 (Context Window)</text>
    <text x="30" y="232" fill="#34d399" font-size="12">• MiniMax M Plan: 1,000,000 (1M) Tokens 原生支持</text>
    <text x="30" y="252" fill="#94a3b8" font-size="11">• 行业常规: 128K ~ 200K Tokens (大工程易触发上下文压缩失真)</text>

    <text x="30" y="290" fill="#e2e8f0" font-size="13" font-weight="bold">3. 全模态全家桶综合权益</text>
    <text x="30" y="312" fill="#34d399" font-size="12">• MiniMax: 统一额度池通吃 M3.1 + H3 4K视频 + 语音复刻 + 图像</text>
    <text x="30" y="332" fill="#94a3b8" font-size="11">• 竞品: 文本/视频往往单独建账，需跨平台订阅多项服务</text>

    <text x="30" y="370" fill="#e2e8f0" font-size="13" font-weight="bold">4. 第三方智能体无缝集成</text>
    <text x="30" y="392" fill="#38bdf8" font-size="12">• Claude Code / Cursor / OpenCode 通过 M Plan API Key 零改造直连</text>
  </g>
</svg>