<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="dtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#dtBg)" rx="16" />
  <rect x="12" y="12" width="1176" height="616" fill="none" stroke="#1e293b" stroke-width="2" rx="14" />

  <text x="600" y="55" fill="#f8fafc" font-size="24" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">旧Token Plan vs 新M Plan：升级决策树与避坑指南</text>
  <text x="600" y="85" fill="#94a3b8" font-size="14" font-family="-apple-system, sans-serif" text-anchor="middle">Migration Decision Flowchart: Should You Keep Legacy Token Plan or Upgrade to M Plan?</text>
  <line x1="60" y1="105" x2="1140" y2="105" stroke="#334155" stroke-width="1" />

  <!-- Start Node -->
  <g transform="translate(450, 130)">
    <rect width="300" height="70" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="150" y="32" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">起点：你的当前账户状态？</text>
    <text x="150" y="55" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="-apple-system, sans-serif">New User vs Legacy Token Plan</text>
  </g>

  <!-- Branch 1: New User -->
  <path d="M 450 165 L 250 250" stroke="#38bdf8" stroke-width="2" fill="none" />
  <text x="320" y="200" fill="#38bdf8" font-size="12">新用户/未订阅</text>

  <!-- Branch 2: Existing User -->
  <path d="M 750 165 L 950 250" stroke="#38bdf8" stroke-width="2" fill="none" />
  <text x="820" y="200" fill="#38bdf8" font-size="12">老用户保有Token Plan</text>

  <!-- Node Left: New User Action -->
  <g transform="translate(100, 250)">
    <rect width="300" height="130" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <text x="150" y="35" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">Token Plan 已停止新售</text>
    <text x="20" y="70" fill="#e2e8f0" font-size="12">• 唯一官方正途：直接选购 M Plan</text>
    <text x="20" y="95" fill="#e2e8f0" font-size="12">• 抓紧首月5折特惠 (截止10月14日)</text>
    <text x="20" y="120" fill="#34d399" font-size="12" font-weight="bold">• 推荐日常：Explore档 ($55/月)</text>
  </g>

  <!-- Node Right: Decision 2 -->
  <g transform="translate(800, 250)">
    <rect width="300" height="130" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="150" y="35" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">是否有视频(H3)或多Agent需求？</text>
    <text x="20" y="70" fill="#cbd5e1" font-size="12">• 是否想直接调用 H3 顶级视频模型？</text>
    <text x="20" y="95" fill="#cbd5e1" font-size="12">• 是否经常多终端并发跑 Coding Agent？</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="12">• 是否需要统一扣除图像与音频额度？</text>
  </g>

  <!-- Sub Branch Right Yes / No -->
  <path d="M 850 380 L 700 450" stroke="#10b981" stroke-width="2" fill="none" />
  <text x="750" y="415" fill="#10b981" font-size="12">是 (需要全模态/重度)</text>

  <path d="M 1050 380 L 1050 450" stroke="#ef4444" stroke-width="2" fill="none" />
  <text x="1060" y="415" fill="#ef4444" font-size="12">否 (纯轻量只看文字)</text>

  <!-- Final Box 1: Upgrade to M Plan -->
  <g transform="translate(550, 450)">
    <rect width="320" height="150" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="160" y="35" fill="#a7f3d0" font-size="15" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">强烈建议：果断平滑升级至 M Plan</text>
    <text x="20" y="70" fill="#ffffff" font-size="12">• 解锁 H3 视频与多模态统一额度池</text>
    <text x="20" y="95" fill="#ffffff" font-size="12">• 享受新用户首月5折升级抵扣券</text>
    <text x="20" y="120" fill="#ffffff" font-size="12">• 避免Token Plan即将面临的算力排队</text>
    <text x="20" y="140" fill="#6ee7b7" font-size="11">注意：升级后旧版Token Plan特定早鸟折扣将失效</text>
  </g>

  <!-- Final Box 2: Keep Legacy -->
  <g transform="translate(920, 450)">
    <rect width="240" height="150" rx="10" fill="#374151" stroke="#9ca3af" stroke-width="1.5" />
    <text x="120" y="35" fill="#e5e7eb" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">保守策略：维持自动续费</text>
    <text x="15" y="70" fill="#cbd5e1" font-size="11">• 确保续费银行卡或账户资金充足</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="11">• 自动续费开启即可长期保有原权益</text>
    <text x="15" y="120" fill="#cbd5e1" font-size="11">• 一旦中断续费将无法重新购买</text>
    <text x="15" y="140" fill="#fca5a5" font-size="11">无 H3 视频生成权限</text>
  </g>
</svg>