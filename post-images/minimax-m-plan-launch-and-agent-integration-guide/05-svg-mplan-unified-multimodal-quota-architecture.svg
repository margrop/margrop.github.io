<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <rect width="1200" height="650" fill="url(#qBg)" rx="16" />
  <rect x="12" y="12" width="1176" height="626" fill="none" stroke="#1e293b" stroke-width="2" rx="14" />

  <text x="600" y="55" fill="#f8fafc" font-size="24" font-weight="bold" font-family="-apple-system, sans-serif" text-anchor="middle">MiniMax M Plan 全模态统一额度池调度架构</text>
  <text x="600" y="85" fill="#94a3b8" font-size="14" font-family="-apple-system, sans-serif" text-anchor="middle">Unified Quota Pooling Architecture with Dynamic Multimodal Weighting Engine</text>
  <line x1="60" y1="105" x2="1140" y2="105" stroke="#334155" stroke-width="1" />

  <!-- Center Pool -->
  <g transform="translate(350, 130)">
    <rect width="500" height="150" rx="16" fill="url(#poolGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="250" y="45" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">M Plan 统一全模态额度池 (Unified Quota Pool)</text>
    <text x="250" y="75" fill="#e0f2fe" font-size="13" text-anchor="middle" font-family="-apple-system, sans-serif">Go (1.0x)  |  Explore (3.0x + H3)  |  Build (7.5x + Priority H3)</text>
    <text x="250" y="115" fill="#7dd3fc" font-size="12" font-family="-apple-system, sans-serif" text-anchor="middle">支持 5小时滚动平滑限流 (Rolling Window) + 额度防穿透熔断算法</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 450 280 L 200 370" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <path d="M 550 280 L 450 370" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <path d="M 650 280 L 750 370" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <path d="M 750 280 L 1000 370" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none" />

  <!-- 4 Modality Leaf Nodes -->
  <!-- Node 1: Text & Code -->
  <g transform="translate(80, 370)">
    <rect width="240" height="230" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <rect x="15" y="15" width="210" height="35" rx="6" fill="#0284c7" />
    <text x="120" y="38" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">文本与编程模型</text>
    <text x="20" y="75" fill="#38bdf8" font-size="13" font-weight="bold">M3.1-Flash-Preview</text>
    <text x="20" y="98" fill="#cbd5e1" font-size="11">• 1M Token 超大上下文</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• 动态慢思考 (4档调谐)</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="11">• 极速响应 &amp; 单测生成</text>
    <text x="20" y="175" fill="#94a3b8" font-size="11">额度权重折算比率:</text>
    <text x="20" y="195" fill="#34d399" font-size="12" font-weight="bold">1x 标准消耗 (极高性价比)</text>
  </g>

  <!-- Node 2: Video H3 -->
  <g transform="translate(340, 370)">
    <rect width="240" height="230" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="15" y="15" width="210" height="35" rx="6" fill="#8b5cf6" />
    <text x="120" y="38" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">生成式视频模型</text>
    <text x="20" y="75" fill="#c4b5fd" font-size="13" font-weight="bold">MiniMax H3 / Hailuo</text>
    <text x="20" y="98" fill="#cbd5e1" font-size="11">• Explore / Build 专属解锁</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• 4K 高画质多镜头连贯</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="11">• 物理引擎级动态表现</text>
    <text x="20" y="175" fill="#94a3b8" font-size="11">额度权重折算比率:</text>
    <text x="20" y="195" fill="#f43f5e" font-size="12" font-weight="bold">重载消耗 (算力按秒折算)</text>
  </g>

  <!-- Node 3: Audio TTS/ASR -->
  <g transform="translate(620, 370)">
    <rect width="240" height="230" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="210" height="35" rx="6" fill="#10b981" />
    <text x="120" y="38" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">语音与音频引擎</text>
    <text x="20" y="75" fill="#6ee7b7" font-size="13" font-weight="bold">Speech-01 系列</text>
    <text x="20" y="98" fill="#cbd5e1" font-size="11">• 超拟真多情感声音复刻</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• 毫秒级流式文本转语音</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="11">• 智能降噪语音识别</text>
    <text x="20" y="175" fill="#94a3b8" font-size="11">额度权重折算比率:</text>
    <text x="20" y="195" fill="#34d399" font-size="12" font-weight="bold">轻量消耗 (按字符数计费)</text>
  </g>

  <!-- Node 4: Image & Vision -->
  <g transform="translate(880, 370)">
    <rect width="240" height="230" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="15" width="210" height="35" rx="6" fill="#f59e0b" />
    <text x="120" y="38" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="-apple-system, sans-serif">图像与视觉理解</text>
    <text x="20" y="75" fill="#fcd34d" font-size="13" font-weight="bold">Image-01 &amp; Multimodal</text>
    <text x="20" y="98" fill="#cbd5e1" font-size="11">• 精细文字渲染与画质</text>
    <text x="20" y="120" fill="#cbd5e1" font-size="11">• 架构图与界面视觉识别</text>
    <text x="20" y="142" fill="#cbd5e1" font-size="11">• 复杂多图长文联合解析</text>
    <text x="20" y="175" fill="#94a3b8" font-size="11">额度权重折算比率:</text>
    <text x="20" y="195" fill="#fbbf24" font-size="12" font-weight="bold">中等消耗 (按张数阶梯计费)</text>
  </g>
</svg>