<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">隐形模型生产落地合规防线：本地隐私脱敏与安全看门狗流水线</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Enterprise Privacy Guard: Pre-Filtering Secrets, Ast Sanitization, and Watchdog Protection</text>

  <!-- Flow Boxes -->
  <g transform="translate(60, 110)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="220" height="300" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15" font-weight="bold">1. 原始本地工作区</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Raw Local Context</text>

    <rect x="15" y="75" width="190" height="50" rx="6" fill="#0f172a"/>
    <text x="25" y="96" fill="#f87171" font-size="11">敏感环境变量 (.env)</text>
    <text x="25" y="114" fill="#64748b" font-size="10">API_KEY, DB_PASS, JWT</text>

    <rect x="15" y="135" width="190" height="50" rx="6" fill="#0f172a"/>
    <text x="25" y="156" fill="#f87171" font-size="11">企业私有内网信息</text>
    <text x="25" y="174" fill="#64748b" font-size="10">完整 IP、主机名、内网域名</text>

    <rect x="15" y="195" width="190" height="50" rx="6" fill="#0f172a"/>
    <text x="25" y="216" fill="#cbd5e1" font-size="11">业务逻辑与源码</text>
    <text x="25" y="234" fill="#64748b" font-size="10">Next.js App / Components</text>

    <text x="20" y="275" fill="#f87171" font-size="11">⚠️ 绝不能直接裸连外网！</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 285 260 L 335 260" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- Stage 2: Local Privacy Guard -->
  <g transform="translate(340, 110)">
    <rect x="0" y="0" width="240" height="300" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="32" fill="#38bdf8" font-size="15" font-weight="bold">2. 本地隐私清洗管道</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Local Sanitizer Proxy</text>

    <rect x="15" y="75" width="210" height="48" rx="6" fill="#0c4a6e"/>
    <text x="25" y="96" fill="#7dd3fc" font-size="11" font-weight="bold">Regex 凭据拦截器</text>
    <text x="25" y="112" fill="#bae6fd" font-size="10">自动抹除 sk-*, Bearer 密钥</text>

    <rect x="15" y="132" width="210" height="48" rx="6" fill="#0c4a6e"/>
    <text x="25" y="153" fill="#7dd3fc" font-size="11" font-weight="bold">网络指纹打码引擎</text>
    <text x="25" y="169" fill="#bae6fd" font-size="10">内网IP替换为 &lt;MASKED_IP&gt;</text>

    <rect x="15" y="190" width="210" height="48" rx="6" fill="#0c4a6e"/>
    <text x="25" y="211" fill="#7dd3fc" font-size="11" font-weight="bold">代码语法树抽象映射</text>
    <text x="25" y="227" fill="#bae6fd" font-size="10">私有业务名哈希混淆保护</text>

    <text x="20" y="275" fill="#34d399" font-size="11">✓ 本地 0 毫秒延时极速脱敏</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 585 260 L 635 260" stroke="#34d399" stroke-width="3" fill="none"/>

  <!-- Stage 3: Vercel AI Gateway -->
  <g transform="translate(640, 110)">
    <rect x="0" y="0" width="240" height="300" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" fill="#34d399" font-size="15" font-weight="bold">3. Vercel AI Gateway</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">stealth/pixel-canary</text>

    <rect x="15" y="75" width="210" height="52" rx="6" fill="#064e3b"/>
    <text x="25" y="97" fill="#a7f3d0" font-size="11" font-weight="bold">256K 超大代码上下文</text>
    <text x="25" y="115" fill="#6ee7b7" font-size="10">纯净脱敏 Prompt 安全输入</text>

    <rect x="15" y="136" width="210" height="52" rx="6" fill="#064e3b"/>
    <text x="25" y="158" fill="#a7f3d0" font-size="11" font-weight="bold">可调慢思考深度 (Medium)</text>
    <text x="25" y="176" fill="#6ee7b7" font-size="10">专注高精前端与重构推理</text>

    <rect x="15" y="198" width="210" height="52" rx="6" fill="#064e3b"/>
    <text x="25" y="220" fill="#a7f3d0" font-size="11" font-weight="bold">100% 免费调用红利</text>
    <text x="25" y="238" fill="#6ee7b7" font-size="10">零成本享受 96.8% 屠榜能力</text>

    <text x="20" y="275" fill="#34d399" font-size="11">✓ 即使数据被留存也无任何泄密风险</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 885 260 L 935 260" stroke="#f59e0b" stroke-width="3" fill="none"/>

  <!-- Stage 4: Local Watchdog -->
  <g transform="translate(940, 110)">
    <rect x="0" y="0" width="200" height="300" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="32" fill="#fbbf24" font-size="15" font-weight="bold">4. 还原与看门狗</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Unmask &amp; Watchdog</text>

    <rect x="15" y="75" width="170" height="55" rx="6" fill="#451a03"/>
    <text x="25" y="97" fill="#fde68a" font-size="11" font-weight="bold">本地符号反混淆</text>
    <text x="25" y="117" fill="#fed7aa" font-size="10">无缝还原真实环境变量</text>

    <rect x="15" y="140" width="170" height="55" rx="6" fill="#451a03"/>
    <text x="25" y="162" fill="#fde68a" font-size="11" font-weight="bold">超时熔断守卫</text>
    <text x="25" y="182" fill="#fed7aa" font-size="10">&gt;25s 自动切换备选模型</text>

    <text x="20" y="275" fill="#34d399" font-size="11">✓ 安全、合规、高可用闭环</text>
  </g>

  <!-- Bottom Guidelines -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="1080" height="150" rx="10" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="30" y="32" fill="#f8fafc" font-size="15" font-weight="bold">🔒 架构师关键提示：如何看待“隐形模型留存会话数据（Data Retention）”官方声明？</text>
    <text x="30" y="60" fill="#cbd5e1" font-size="12">所有平台的 Stealth 隐形模型（如 OpenRouter 的 Space Bunny、Vercel 的 Pixel Canary）之所以完全免费，核心商业逻辑在于模型研发方需要海量真实边缘用例做监督对齐。</text>
    <text x="30" y="85" fill="#94a3b8" font-size="12">作为理性开发者，既不能“因噎废食”拒绝免费顶尖生产力，更不能“粗心大意”将未脱敏的核心资产裸传。</text>
    <text x="30" y="110" fill="#38bdf8" font-size="12">采用上述三端本地清洗流水线，即可在保护知识产权的前提下，把 Pixel Canary 压榨为智能体集群中最锋利的屠榜利刃！</text>
  </g>
</svg>