  <!-- Bottom Details Box -->
  <g transform="translate(60, 400)">
    <rect x="0" y="0" width="1080" height="180" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="30" y="35" fill="#f8fafc" font-size="16" font-weight="bold">💡 为什么顶级实验室选择“先上马甲盲测，后官宣揭面”？</text>
    <text x="30" y="70" fill="#94a3b8" font-size="13">• <tspan fill="#38bdf8" font-weight="bold">彻底打破品牌光环效应 (Halo Effect)</tspan>：消除开发者对 OpenAI / Google / Anthropic 固有品牌的先入为主判断，全凭代码真实交付能力说话。</text>
    <text x="30" y="100" fill="#94a3b8" font-size="13">• <tspan fill="#34d399" font-weight="bold">零 PR 风险收集边缘失败样本</tspan>：在不损害官方旗舰声誉的前提下，通过海量免费调用捕获最残酷的边界 Bug、死循环与幻觉用例。</text>
    <text x="30" y="130" fill="#94a3b8" font-size="13">• <tspan fill="#f59e0b" font-weight="bold">真实开发者流量压力实战</tspan>：检验全新分布式 MoE 调度架构、KV Cache 共享算法以及极端高并发下的推理服务器容灾韧性。</text>
