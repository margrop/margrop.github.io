<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">小学生秒懂打比方：无牌原型超级跑车的“深夜风洞试车场”</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Understanding Pixel Canary, Vercel AI Gateway, and Reasoning Effort via Everyday Racing Analogy</text>

  <!-- Left: The Mystery Car -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="340" height="340" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="42" rx="12" fill="#0c4a6e"/>
    <text x="20" y="27" fill="#ffffff" font-size="15" font-weight="bold">🏎️ 无牌神秘超跑 (Pixel Canary)</text>
    <text x="20" y="75" fill="#38bdf8" font-size="13" font-weight="bold">【隐形代码大模型 Stealth Model】</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="12">• 就像汽车巨头秘密打造的赛道试验车</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="12">• 全车贴满伪装胶布，隐去所有品牌车标</text>
    <text x="20" y="155" fill="#cbd5e1" font-size="12">• 免费借给顶级赛车手在黑夜里极限测试</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="12">• 不看品牌谁更响，只看赛道圈速有多猛</text>
    <rect x="20" y="215" width="300" height="95" rx="8" fill="#1e293b"/>
    <text x="32" y="240" fill="#94a3b8" font-size="11">小学生理解关键：</text>
    <text x="32" y="265" fill="#f8fafc" font-size="12">平时你叫滴滴只认品牌，但这辆车不写名字，</text>
    <text x="32" y="290" fill="#38bdf8" font-size="12">跑起来却比所有名牌跑车都更快更稳！</text>
  </g>

  <!-- Middle: The Gateway & Control Tower -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="340" height="340" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="42" rx="12" fill="#064e3b"/>
    <text x="20" y="27" fill="#ffffff" font-size="15" font-weight="bold">🗼 赛道调度指挥塔 (AI Gateway)</text>
    <text x="20" y="75" fill="#34d399" font-size="13" font-weight="bold">【统一模型路由与监控网关】</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="12">• 负责给每一辆赛车发号施令、统一定时</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="12">• 毫秒级记录首圈延迟（TTFT）与弯道极速</text>
    <text x="20" y="155" fill="#cbd5e1" font-size="12">• 不管来的是法拉利还是保时捷，统一接口</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="12">• 提供安全防护护栏，防止赛车失控冲撞</text>
    <rect x="20" y="215" width="300" height="95" rx="8" fill="#1e293b"/>
    <text x="32" y="240" fill="#94a3b8" font-size="11">小学生理解关键：</text>
    <text x="32" y="265" fill="#f8fafc" font-size="12">就像学校运动会的智能计时器，无论哪个班</text>
    <text x="32" y="290" fill="#34d399" font-size="12">参赛，它都用同一把尺子测算谁是真第一！</text>
  </g>

  <!-- Right: The Gearbox & Big Trunk -->
  <g transform="translate(800, 110)">
    <rect x="0" y="0" width="340" height="340" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="42" rx="12" fill="#78350f"/>
    <text x="20" y="27" fill="#ffffff" font-size="15" font-weight="bold">⚙️ 双模变速箱 + 巨型车斗</text>
    <text x="20" y="75" fill="#fbbf24" font-size="13" font-weight="bold">【Reasoning Effort + 256K 窗口】</text>
    <text x="20" y="105" fill="#cbd5e1" font-size="12">• 平路挂 1 挡 (Low)：轻踩油门秒速吐字</text>
    <text x="20" y="130" fill="#cbd5e1" font-size="12">• 复杂多弯道挂 S 挡 (High)：深度演算不翻车</text>
    <text x="20" y="155" fill="#cbd5e1" font-size="12">• 巨型后备箱 (256K Context)：装下整本图纸</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="12">• 前缀缓存 (KV Cache)：熟路不用重新看地图</text>
    <rect x="20" y="215" width="300" height="95" rx="8" fill="#1e293b"/>
    <text x="32" y="240" fill="#94a3b8" font-size="11">小学生理解关键：</text>
    <text x="32" y="265" fill="#f8fafc" font-size="12">做简单口算飞快写答案；遇到奥数大题</text>
    <text x="32" y="290" fill="#fbbf24" font-size="12">自动拿出超大草稿纸演算，保证不丢分！</text>
  </g>

  <!-- Bottom: Summary Banner -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="1080" height="110" rx="10" fill="#111827" stroke="#475569" stroke-width="1"/>
    <text x="30" y="32" fill="#38bdf8" font-size="15" font-weight="bold">🌟 核心结论：为什么“无牌车”能在 Next.js 盲测中拿下 96.8% 屠榜成绩？</text>
    <text x="30" y="60" fill="#cbd5e1" font-size="12">因为当去掉一切大厂品牌营销包袱后，Pixel Canary 针对前端全栈真实痛点（服务端渲染水合、异步 Server Actions、图片字体打包优化）</text>
    <text x="30" y="85" fill="#94a3b8" font-size="12">进行了极致定向微调。结合 AGENTS.md 规范，如同赛车手拿到了最精准的赛道领航路书，以无可争议的战绩逼平甚至超越了所有万亿参数旗舰！</text>
  </g>
</svg>