<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">Pixel Canary 核心架构：256K 巨幅窗口与动态慢思考阶梯</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">KV Cache Prefix Sharing, Multi-Tier Reasoning Ladder, and 128K Output Completion Architecture</text>

  <!-- Left: 256K Context Window -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="340" height="340" rx="10" fill="#111827" stroke="#0ea5e9" stroke-width="2"/>
    <text x="20" y="32" fill="#38bdf8" font-size="16" font-weight="bold">256K 超大线性上下文窗口</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Total Context: 262,144 Tokens</text>

    <!-- Context Blocks -->
    <rect x="20" y="80" width="300" height="60" rx="6" fill="#0c4a6e"/>
    <text x="35" y="105" fill="#7dd3fc" font-size="13" font-weight="bold">1. 仓库规则与文档 (AGENTS.md)</text>
    <text x="35" y="125" fill="#bae6fd" font-size="11">Prefix KV Cache 命中率高达 85%+</text>

    <rect x="20" y="150" width="300" height="60" rx="6" fill="#1e293b"/>
    <text x="35" y="175" fill="#e2e8f0" font-size="13" font-weight="bold">2. 全工程源码与依赖包类型</text>
    <text x="35" y="195" fill="#94a3b8" font-size="11">package.json / tsconfig / prisma.schema</text>

    <rect x="20" y="220" width="300" height="60" rx="6" fill="#1e293b"/>
    <text x="35" y="245" fill="#e2e8f0" font-size="13" font-weight="bold">3. 连续会话历史与交互轨迹</text>
    <text x="35" y="265" fill="#94a3b8" font-size="11">保留完整报错堆栈与多轮重试记录</text>

    <text x="20" y="315" fill="#34d399" font-size="12">✓ 告别切片分块，支持完整工程整体投喂</text>
  </g>

  <!-- Middle: Reasoning Effort Ladder -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="340" height="340" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="32" fill="#fbbf24" font-size="16" font-weight="bold">动态思考深度阶梯 (Reasoning Effort)</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Fine-Grained Computational Budget</text>

    <rect x="20" y="80" width="300" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="105" fill="#94a3b8" font-size="13" font-weight="bold">Level 1: Low (极速浅思考)</text>
    <text x="35" y="125" fill="#64748b" font-size="11">耗费 &lt; 250 tokens，适用于常规语法补全与注释</text>

    <rect x="20" y="155" width="300" height="75" rx="6" fill="#451a03" stroke="#f59e0b"/>
    <text x="35" y="180" fill="#fde68a" font-size="13" font-weight="bold">Level 2: Medium (平衡推荐模式)</text>
    <text x="35" y="200" fill="#fed7aa" font-size="11">耗费 500~1,500 tokens，Next.js App Router 迁移</text>
    <text x="35" y="218" fill="#fbbf24" font-size="10">★ 96.8% 屠榜评估基准默认推荐级别</text>

    <rect x="20" y="240" width="300" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="265" fill="#94a3b8" font-size="13" font-weight="bold">Level 3: High (超硬核慢思考)</text>
    <text x="35" y="285" fill="#64748b" font-size="11">耗费 3,000+ tokens，适用于复杂算法与安全审计</text>

    <text x="20" y="325" fill="#f59e0b" font-size="12">⚠️ 避免盲目拉满 High 导致智能体空转超时</text>
  </g>

  <!-- Right: 128K Output & Guard -->
  <g transform="translate(800, 110)">
    <rect x="0" y="0" width="340" height="340" rx="10" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="32" fill="#34d399" font-size="16" font-weight="bold">128K 天量生成与语法看门狗</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Max Output: 131,072 Tokens</text>

    <rect x="20" y="80" width="300" height="70" rx="6" fill="#064e3b"/>
    <text x="35" y="105" fill="#a7f3d0" font-size="13" font-weight="bold">单次巨幅代码输出</text>
    <text x="35" y="125" fill="#6ee7b7" font-size="11">一口气生成完整微服务或多模块前端工程</text>
    <text x="35" y="140" fill="#6ee7b7" font-size="11">彻底告别传统 4K/8K 截断导致的“代码残卷”</text>

    <rect x="20" y="160" width="300" height="70" rx="6" fill="#1e293b"/>
    <text x="35" y="185" fill="#e2e8f0" font-size="13" font-weight="bold">原生 AST 语法合法性自校验</text>
    <text x="35" y="205" fill="#94a3b8" font-size="11">输出前触发闭环检查，杜绝漏括号与无效导出</text>

    <rect x="20" y="240" width="300" height="60" rx="6" fill="#1e293b"/>
    <text x="35" y="265" fill="#e2e8f0" font-size="13" font-weight="bold">智能体熔断看门狗</text>
    <text x="35" y="285" fill="#94a3b8" font-size="11">30秒无有效代码即刻降级至备选模型</text>

    <text x="20" y="325" fill="#34d399" font-size="12">✓ 生产环境高吞吐高容错闭环</text>
  </g>

  <!-- Bottom: Connection Banner -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="1080" height="110" rx="10" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="30" y="35" fill="#f8fafc" font-size="15" font-weight="bold">🚀 工程落地架构建议：构建本地智能体双重防护盾（Local Privacy &amp; Watchdog Shield）</text>
    <text x="30" y="65" fill="#94a3b8" font-size="12">由于隐形预览模型会留存会话数据进行训练优化，企业级团队在接入 Pixel Canary 时，应当部署本地预过滤层对私钥、内网域名和业务数据进行脱敏；</text>
    <text x="30" y="90" fill="#cbd5e1" font-size="12">同时挂载 25 秒超时熔断看门狗，既白嫖 256K 超大窗口与 96.8% 顶尖编码能力，又万无一失保障数据隐私与流水线稳定性。</text>
  </g>
</svg>