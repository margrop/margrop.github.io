<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">MiniMax Code (MCode) 核心三位一体 Multi-Agent 编排流水线</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">General Agent (Planner) ➔ Coder Agent (M3.1-Flash) ➔ Verifier Agent (Local Sandbox)</text>

  <!-- Flow Nodes -->
  <g transform="translate(60, 120)">
    <!-- 1. User Prompt -->
    <rect x="0" y="160" width="160" height="120" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="200" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">开发人员 / CI</text>
    <text x="80" y="225" text-anchor="middle" fill="#94a3b8" font-size="12">需求或 Issue 描述</text>
    <text x="80" y="250" text-anchor="middle" fill="#38bdf8" font-size="11">mcode "Fix leak"</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 160 220 L 220 220" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 2. General Agent -->
    <rect x="220" y="120" width="220" height="200" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="220" y="120" width="220" height="40" rx="10" fill="#1d4ed8"/>
    <text x="330" y="146" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">General Agent (总策划)</text>
    <text x="240" y="185" fill="#cbd5e1" font-size="12">● 任务目标深度拆解</text>
    <text x="240" y="210" fill="#cbd5e1" font-size="12">● 三级记忆上下文挂载</text>
    <text x="240" y="235" fill="#cbd5e1" font-size="12">● 决定推理深度 (Reasoning)</text>
    <text x="240" y="260" fill="#cbd5e1" font-size="12">● 动态调用 MCP / 本地工具</text>
    <rect x="235" y="280" width="190" height="24" rx="4" fill="#0f172a"/>
    <text x="330" y="296" text-anchor="middle" fill="#60a5fa" font-size="11">任务清单派发给 Coder</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 440 220 L 500 220" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 3. Coder Agent -->
    <rect x="500" y="100" width="260" height="240" rx="10" fill="#111827" stroke="#10b981" stroke-width="3"/>
    <rect x="500" y="100" width="260" height="40" rx="10" fill="#047857"/>
    <text x="630" y="126" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">Coder Agent (编码核心)</text>
    <text x="630" y="165" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">MiniMax M3.1-Flash-Preview</text>
    <text x="520" y="195" fill="#e2e8f0" font-size="12">● 首字延迟 &lt; 300ms 快速生成</text>
    <text x="520" y="220" fill="#e2e8f0" font-size="12">● 126+ tok/s 极速代码流输出</text>
    <text x="520" y="245" fill="#e2e8f0" font-size="12">● 生成原子级 Git Unified Diff</text>
    <text x="520" y="270" fill="#e2e8f0" font-size="12">● 避免全局重写，精准打补丁</text>
    <rect x="515" y="295" width="230" height="26" rx="4" fill="#064e3b"/>
    <text x="630" y="312" text-anchor="middle" fill="#a7f3d0" font-size="11">输出补丁送审 Verifier</text>

    <!-- Arrow 3 -> 4 -->
    <path d="M 760 220 L 820 220" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 4. Verifier Agent -->
    <rect x="820" y="120" width="240" height="200" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="820" y="120" width="240" height="40" rx="10" fill="#b45309"/>
    <text x="940" y="146" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">Verifier Agent (质检验收)</text>
    <text x="840" y="185" fill="#cbd5e1" font-size="12">● 本地沙箱隔离运行测试</text>
    <text x="840" y="210" fill="#cbd5e1" font-size="12">● 静态类型推断与 Linter 检查</text>
    <text x="840" y="235" fill="#cbd5e1" font-size="12">● 单元测试 (Pass / Fail 评判)</text>
    <text x="840" y="260" fill="#cbd5e1" font-size="12">● 验证失败自动捕获 Stderr</text>
    <rect x="835" y="280" width="210" height="24" rx="4" fill="#0f172a"/>
    <text x="940" y="296" text-anchor="middle" fill="#fcd34d" font-size="11">通过 ➔ 提交 / 失败 ➔ 回退</text>
  </g>

  <!-- Loopback Arrow on Failure -->
  <path d="M 940 440 L 940 470 L 630 470 L 630 460" stroke="#ef4444" stroke-dasharray="6,4" stroke-width="2"/>
  <text x="785" y="490" text-anchor="middle" fill="#f87171" font-size="12">测试失败：带着 Stderr 自动闭环回退重试 (Max 3 次)</text>

  <!-- Success Output -->
  <path d="M 1060 220 L 1120 220" stroke="#10b981" stroke-width="3"/>
  <rect x="1030" y="340" width="130" height="50" rx="6" fill="#022c22" stroke="#10b981"/>
  <text x="1095" y="362" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">Git Commit</text>
  <text x="1095" y="380" text-anchor="middle" fill="#a7f3d0" font-size="10">生产合规放行</text>
</svg>