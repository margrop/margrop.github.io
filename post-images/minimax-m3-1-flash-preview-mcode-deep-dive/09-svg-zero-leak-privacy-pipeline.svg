<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">企业级本地零泄漏隐私脱敏与智能体防护流水线</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Zero-Leak Local Privacy Sanitization Pipeline for MiniMax Code Agents</text>

  <g transform="translate(60, 120)">
    <!-- Stage 1: Local Repo -->
    <rect x="0" y="40" width="220" height="380" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="40" width="220" height="40" rx="10" fill="#1d4ed8"/>
    <text x="110" y="65" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">本地开发与代码仓库</text>
    <text x="20" y="110" fill="#94a3b8" font-size="12">包含真实资产信息：</text>
    <text x="20" y="135" fill="#f87171" font-size="12">● 私网 IP (192.168.x.x)</text>
    <text x="20" y="160" fill="#f87171" font-size="12">● 内部主机名 / 域名</text>
    <text x="20" y="185" fill="#f87171" font-size="12">● JWT 令牌 / API Key</text>
    <text x="20" y="210" fill="#f87171" font-size="12">● 数据库连接字符串</text>
    <rect x="15" y="240" width="190" height="60" rx="6" fill="#0f172a"/>
    <text x="110" y="265" text-anchor="middle" fill="#cbd5e1" font-size="11">禁止裸传公共大模型</text>
    <text x="110" y="285" text-anchor="middle" fill="#f43f5e" font-size="11">合规最高红线！</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 220 230 L 280 230" stroke="#475569" stroke-width="2"/>

    <!-- Stage 2: Privacy Filter Engine -->
    <rect x="280" y="20" width="280" height="420" rx="10" fill="#111827" stroke="#10b981" stroke-width="3"/>
    <rect x="280" y="20" width="280" height="40" rx="10" fill="#047857"/>
    <text x="420" y="45" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">本地脱敏看门狗管道</text>
    <text x="300" y="90" fill="#34d399" font-size="13" font-weight="bold">1. AST 语法树遍历</text>
    <text x="300" y="115" fill="#94a3b8" font-size="11">分析代码语义，提取敏感常量与字面量</text>
    <text x="300" y="150" fill="#34d399" font-size="13" font-weight="bold">2. 正则掩码转换器</text>
    <text x="300" y="175" fill="#cbd5e1" font-size="11">IP ➔ [INTERNAL_ENDPOINT_IP]</text>
    <text x="300" y="195" fill="#cbd5e1" font-size="11">Key ➔ [REDACTED_SECRET_KEY]</text>
    <text x="300" y="230" fill="#34d399" font-size="13" font-weight="bold">3. 内存混淆字典 (Shadow Map)</text>
    <text x="300" y="255" fill="#94a3b8" font-size="11">仅在本地内存维护符号映射表</text>
    <rect x="295" y="290" width="250" height="130" rx="6" fill="#064e3b"/>
    <text x="420" y="320" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="bold">脱敏校验通过率: 100%</text>
    <text x="420" y="345" text-anchor="middle" fill="#f8fafc" font-size="11">敏感特征全被中性占位符替代</text>
    <text x="420" y="370" text-anchor="middle" fill="#f8fafc" font-size="11">代码结构与逻辑 100% 完整保留</text>
    <text x="420" y="395" text-anchor="middle" fill="#a7f3d0" font-size="11">保证 M3.1-Flash 理解无衰减</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 560 230 L 620 230" stroke="#475569" stroke-width="2"/>

    <!-- Stage 3: Cloud Model Execution -->
    <rect x="620" y="40" width="220" height="380" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="620" y="40" width="220" height="40" rx="10" fill="#0284c7"/>
    <text x="730" y="65" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">MiniMax MCode 云端</text>
    <text x="640" y="110" fill="#38bdf8" font-size="12" font-weight="bold">M3.1-Flash-Preview</text>
    <text x="640" y="135" fill="#94a3b8" font-size="11">● 接收纯净逻辑代码</text>
    <text x="640" y="160" fill="#94a3b8" font-size="11">● 极速生成算法补丁</text>
    <text x="640" y="185" fill="#94a3b8" font-size="11">● 首字延迟 &lt; 300ms</text>
    <text x="640" y="210" fill="#94a3b8" font-size="11">● 吐出匿名化 Diff 流</text>
    <rect x="635" y="250" width="190" height="70" rx="6" fill="#0f172a"/>
    <text x="730" y="275" text-anchor="middle" fill="#38bdf8" font-size="11">云端完全看不到内部机密</text>
    <text x="730" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">符合 SOC2 &amp; 等保三级要求</text>

    <!-- Arrow 3 -> 4 -->
    <path d="M 840 230 L 900 230" stroke="#475569" stroke-width="2"/>

    <!-- Stage 4: Local Rehydration -->
    <rect x="900" y="40" width="180" height="380" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="900" y="40" width="180" height="40" rx="10" fill="#6d28d9"/>
    <text x="990" y="65" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">本地回填水合</text>
    <text x="915" y="110" fill="#c4b5fd" font-size="12">基于本地 Shadow Map</text>
    <text x="915" y="135" fill="#cbd5e1" font-size="11">将占位符逆向还原：</text>
    <text x="915" y="160" fill="#10b981" font-size="11">✔ 真实凭据准确回填</text>
    <text x="915" y="185" fill="#10b981" font-size="11">✔ 本地执行单元测试</text>
    <text x="915" y="210" fill="#10b981" font-size="11">✔ Git 无缝 Stage 提交</text>
    <rect x="915" y="250" width="150" height="70" rx="6" fill="#0f172a"/>
    <text x="990" y="280" text-anchor="middle" fill="#a78bfa" font-size="11">零泄密 + 极速生成</text>
    <text x="990" y="300" text-anchor="middle" fill="#f8fafc" font-size="10">鱼与熊掌兼得！</text>
  </g>
</svg>