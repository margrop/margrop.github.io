<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">MiniMax 编程双子星架构对比：M3 全能重器 vs M3.1-Flash 极速轻跑</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">MiniMax M3 (428B MoE Flagship) vs MiniMax M3.1-Flash-Preview (Lightweight Turbo Engine)</text>

  <!-- Left: MiniMax M3 -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="500" height="490" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="50" rx="12" fill="#1e3a8a"/>
    <text x="250" y="32" text-anchor="middle" fill="#93c5fd" font-size="18" font-weight="bold">MiniMax M3 (全尺寸旗舰基座)</text>
    
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="28" fill="#60a5fa" font-size="14" font-weight="bold">总参数规模: 428B 混合专家 (MoE)</text>
      <text x="20" y="50" fill="#94a3b8" font-size="12">超大知识容量储备，密集跨模态多专家路由</text>
    </g>
    
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="28" fill="#60a5fa" font-size="14" font-weight="bold">上下文能力: 100 万 (1M) Tokens 超长窗口</text>
      <text x="20" y="50" fill="#94a3b8" font-size="12">整库级代码知识吞吐，全仓架构拓扑梳理</text>
    </g>

    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="28" fill="#60a5fa" font-size="14" font-weight="bold">推理延迟: 1.5s - 2.8s 首字响应 (TTFT)</text>
      <text x="20" y="50" fill="#94a3b8" font-size="12">深度慢思考默认常驻，重载计算吞吐</text>
    </g>

    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="440" height="135" rx="8" fill="#0f172a" stroke="#3b82f6"/>
      <text x="20" y="30" fill="#f8fafc" font-size="14" font-weight="bold">最佳工程适用场景：</text>
      <text x="20" y="58" fill="#94a3b8" font-size="12">● 大型系统跨语言架构重构与重写</text>
      <text x="20" y="82" fill="#94a3b8" font-size="12">● 跨数十个服务/模块的深层依赖与解耦分析</text>
      <text x="20" y="106" fill="#94a3b8" font-size="12">● 复杂跨模态交互与系统级技术白皮书生成</text>
    </g>
  </g>

  <!-- Right: MiniMax M3.1-Flash-Preview -->
  <g transform="translate(640, 110)">
    <rect x="0" y="0" width="500" height="490" rx="12" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="50" rx="12" fill="#064e3b"/>
    <text x="250" y="32" text-anchor="middle" fill="#6ee7b7" font-size="18" font-weight="bold">MiniMax M3.1-Flash-Preview (轻量极速引擎)</text>
    
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="28" fill="#34d399" font-size="14" font-weight="bold">架构特性: 稀疏自注意力 (MSA) + 投机解码</text>
      <text x="20" y="50" fill="#94a3b8" font-size="12">极低显存驻留开销，面向日常代码场景极致剪枝</text>
    </g>
    
    <g transform="translate(30, 160)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="28" fill="#34d399" font-size="14" font-weight="bold">上下文能力: 131,072 (128K) Tokens 极速窗口</text>
      <text x="20" y="50" fill="#94a3b8" font-size="12">毫秒级 KV Cache 检索，完全覆盖日常模块与函数</text>
    </g>

    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="28" fill="#34d399" font-size="14" font-weight="bold">推理延迟: &lt; 300ms 首字响应 | 126+ Tokens/s</text>
      <text x="20" y="50" fill="#94a3b8" font-size="12">4 档可调慢思考（Low / Medium / High / Max）</text>
    </g>

    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="440" height="135" rx="8" fill="#0f172a" stroke="#10b981"/>
      <text x="20" y="30" fill="#f8fafc" font-size="14" font-weight="bold">最佳工程适用场景：</text>
      <text x="20" y="58" fill="#94a3b8" font-size="12">● 快速 Bug 修复、异常定位与单元测试补全</text>
      <text x="20" y="82" fill="#94a3b8" font-size="12">● 终端 CLI 交互、日常代码补全与实时重构</text>
      <text x="20" y="106" fill="#94a3b8" font-size="12">● Multi-Agent 协作中的高频执行者（Coder Agent）</text>
    </g>
  </g>

  <!-- Central Dispatch Icon -->
  <circle cx="600" cy="355" r="32" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
  <text x="600" y="352" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">MCode</text>
  <text x="600" y="370" text-anchor="middle" fill="#fbbf24" font-size="11">动态路由</text>
</svg>