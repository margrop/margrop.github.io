<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">MiniMax MCode 跨平台自动化探针与智能体调度矩阵</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Windows 11 (PowerShell 7+) ╳ Ubuntu 26.04 (Bash) ╳ macOS 26 (Zsh)</text>

  <g transform="translate(60, 110)">
    <!-- Column 1: Windows 11 -->
    <rect x="0" y="0" width="340" height="490" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#0369a1"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Windows 11 (PowerShell 7+)</text>
    
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="300" height="60" rx="6" fill="#0f172a"/>
      <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="bold">脚本: minimax_mcode_probe_windows11.ps1</text>
      <text x="15" y="46" fill="#94a3b8" font-size="11">基于 Invoke-RestMethod，免安装三方库</text>
    </g>

    <g transform="translate(20, 140)">
      <text x="10" y="20" fill="#e2e8f0" font-size="13" font-weight="bold">运行命令：</text>
      <rect x="0" y="30" width="300" height="40" rx="6" fill="#0b0f19" stroke="#334155"/>
      <text x="10" y="55" fill="#38bdf8" font-size="11" font-family="monospace">.\minimax_mcode_probe_windows11.ps1</text>
      
      <text x="10" y="95" fill="#e2e8f0" font-size="13" font-weight="bold">智能体 JSON 调度命令：</text>
      <rect x="0" y="105" width="300" height="40" rx="6" fill="#0b0f19" stroke="#334155"/>
      <text x="10" y="130" fill="#34d399" font-size="11" font-family="monospace">.\probe.ps1 -AgentMode | ConvertFrom-Json</text>
    </g>

    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="300" height="150" rx="6" fill="#0f172a" stroke="#0ea5e9"/>
      <text x="15" y="26" fill="#7dd3fc" font-size="13" font-weight="bold">Windows 平台专属特性：</text>
      <text x="15" y="52" fill="#cbd5e1" font-size="11">● 兼容 Windows Terminal 丰富色彩渲染</text>
      <text x="15" y="76" fill="#cbd5e1" font-size="11">● 自动捕获 PowerShell ExecutionPolicy</text>
      <text x="15" y="100" fill="#cbd5e1" font-size="11">● 原生接入 Visual Studio / Cursor</text>
      <text x="15" y="124" fill="#34d399" font-size="11">● 零第三方依赖，绿色即拷即用</text>
    </g>
  </g>

  <!-- Column 2: Ubuntu 26.04 -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="340" height="490" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#c2410c"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">Ubuntu 26.04 LTS (Bash)</text>

    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="300" height="60" rx="6" fill="#0f172a"/>
      <text x="15" y="24" fill="#fb923c" font-size="12" font-weight="bold">脚本: minimax_mcode_probe_ubuntu2604.sh</text>
      <text x="15" y="46" fill="#94a3b8" font-size="11">Bash 5.2+ 原生 / curl / 内置 Python 解析</text>
    </g>

    <g transform="translate(20, 140)">
      <text x="10" y="20" fill="#e2e8f0" font-size="13" font-weight="bold">运行命令：</text>
      <rect x="0" y="30" width="300" height="40" rx="6" fill="#0b0f19" stroke="#334155"/>
      <text x="10" y="55" fill="#38bdf8" font-size="11" font-family="monospace">bash minimax_mcode_probe_ubuntu2604.sh</text>
      
      <text x="10" y="95" fill="#e2e8f0" font-size="13" font-weight="bold">智能体 JSON 调度命令：</text>
      <rect x="0" y="105" width="300" height="40" rx="6" fill="#0b0f19" stroke="#334155"/>
      <text x="10" y="130" fill="#34d399" font-size="11" font-family="monospace">bash probe.sh --agent-mode | jq .</text>
    </g>

    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="300" height="150" rx="6" fill="#0f172a" stroke="#f97316"/>
      <text x="15" y="26" fill="#fed7aa" font-size="13" font-weight="bold">Linux 平台专属特性：</text>
      <text x="15" y="52" fill="#cbd5e1" font-size="11">● 兼容 CI/CD 无人值守 Headless 环境</text>
      <text x="15" y="76" fill="#cbd5e1" font-size="11">● 针对无 jq 环境自带 Python 兜底解析器</text>
      <text x="15" y="100" fill="#cbd5e1" font-size="11">● 支持 systemd 定时巡检与健康告警</text>
      <text x="15" y="124" fill="#34d399" font-size="11">● 生产服务器与远程 Docker 即刻可用</text>
    </g>
  </g>

  <!-- Column 3: macOS 26 -->
  <g transform="translate(800, 110)">
    <rect x="0" y="0" width="340" height="490" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#7e22ce"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">macOS 26 (Apple Silicon / Zsh)</text>

    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="300" height="60" rx="6" fill="#0f172a"/>
      <text x="15" y="24" fill="#c084fc" font-size="12" font-weight="bold">脚本: minimax_mcode_probe_macos26.zsh</text>
      <text x="15" y="46" fill="#94a3b8" font-size="11">纯 Zsh 原生打造，无需 Homebrew 包</text>
    </g>

    <g transform="translate(20, 140)">
      <text x="10" y="20" fill="#e2e8f0" font-size="13" font-weight="bold">运行命令：</text>
      <rect x="0" y="30" width="300" height="40" rx="6" fill="#0b0f19" stroke="#334155"/>
      <text x="10" y="55" fill="#38bdf8" font-size="11" font-family="monospace">zsh minimax_mcode_probe_macos26.zsh</text>
      
      <text x="10" y="95" fill="#e2e8f0" font-size="13" font-weight="bold">智能体 JSON 调度命令：</text>
      <rect x="0" y="105" width="300" height="40" rx="6" fill="#0b0f19" stroke="#334155"/>
      <text x="10" y="130" fill="#34d399" font-size="11" font-family="monospace">zsh probe.zsh -a &gt; telemetry.json</text>
    </g>

    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="300" height="150" rx="6" fill="#0f172a" stroke="#a855f7"/>
      <text x="15" y="26" fill="#e9d5ff" font-size="13" font-weight="bold">macOS 平台专属特性：</text>
      <text x="15" y="52" fill="#cbd5e1" font-size="11">● 针对 Apple Silicon M系列芯片优化</text>
      <text x="15" y="76" fill="#cbd5e1" font-size="11">● 原生 ANSI 256 色 / Truecolor 视网膜渲染</text>
      <text x="15" y="100" fill="#cbd5e1" font-size="11">● 适配 Zed / VSCode / Claude Code 工作流</text>
      <text x="15" y="124" fill="#34d399" font-size="11">● 零包管理器依赖，开箱即测</text>
    </g>
  </g>
</svg>