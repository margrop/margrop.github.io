<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">小学生秒懂日常比方：F1 极速超跑、草稿纸心算与三人协作车队</text>
  <text x="600" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Demystifying M3.1-Flash-Preview, Tunable Reasoning, and Multi-Agent Orchestration</text>

  <!-- Box 1: Freight Train vs F1 Supercar -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="340" height="490" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#1d4ed8"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">1. 万吨火车 vs 极速超跑</text>
    
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="300" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" fill="#93c5fd" font-size="13" font-weight="bold">万吨重载火车（MiniMax M3）</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">拉 100 节车厢，运力极大（428B/1M 窗口）</text>
      <text x="15" y="72" fill="#94a3b8" font-size="11">但是启动和刹车都要 10 分钟。</text>
      <text x="15" y="94" fill="#f87171" font-size="11">去楼下超市买包盐开它，费油又费劲！</text>
    </g>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="300" height="120" rx="6" fill="#0f172a" stroke="#10b981"/>
      <text x="15" y="26" fill="#6ee7b7" font-size="13" font-weight="bold">轻量 F1 超跑（M3.1-Flash）</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">拆掉笨重多余装配，专注于极速狂飙</text>
      <text x="15" y="72" fill="#34d399" font-size="11">零百加速只要 1.8 秒（首字响应 280ms）</text>
      <text x="15" y="94" fill="#34d399" font-size="11">遇到小弯道（改Bug、写测试）瞬间漂移通过！</text>
    </g>

    <text x="170" y="340" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">【小结】</text>
    <text x="25" y="370" fill="#94a3b8" font-size="12">日常编程不需要每次都调动万吨重卡，</text>
    <text x="25" y="395" fill="#94a3b8" font-size="12">轻巧灵敏的“小钢炮”才是工程师日常</text>
    <text x="25" y="420" fill="#94a3b8" font-size="12">最趁手的生产力伙伴！</text>
  </g>

  <!-- Box 2: Scratch Paper vs Mental Math -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="340" height="490" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#b45309"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">2. 心算口算 vs 草稿纸演算</text>

    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="300" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" fill="#fcd34d" font-size="13" font-weight="bold">口算心算模式（Low 慢思考）</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">考卷第一道题：2 + 3 等于几？</text>
      <text x="15" y="72" fill="#38bdf8" font-size="11">一眼看出等于 5，直接填空，0.1 秒交卷！</text>
      <text x="15" y="94" fill="#94a3b8" font-size="11">根本不需要在草稿纸上写公式。</text>
    </g>

    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="300" height="120" rx="6" fill="#0f172a" stroke="#f59e0b"/>
      <text x="15" y="26" fill="#fcd34d" font-size="13" font-weight="bold">草稿纸演算模式（Max 慢思考）</text>
      <text x="15" y="50" fill="#cbd5e1" font-size="11">压轴奥数几何题：求立体截面面积</text>
      <text x="15" y="72" fill="#fbbf24" font-size="11">必须在草稿纸上画辅助线、列方程联立</text>
      <text x="15" y="94" fill="#fbbf24" font-size="11">每一步验算正确，再把终版写上卷子！</text>
    </g>

    <text x="170" y="340" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">【小结】</text>
    <text x="25" y="370" fill="#94a3b8" font-size="12">M3.1-Flash 的动态可调推理深度，</text>
    <text x="25" y="395" fill="#94a3b8" font-size="12">就像让 AI 针对不同题目自由决定：</text>
    <text x="25" y="420" fill="#94a3b8" font-size="12">是要“秒出答案”还是“缜密验算”！</text>
  </g>

  <!-- Box 3: Pit Stop Team -->
  <g transform="translate(800, 110)">
    <rect x="0" y="0" width="340" height="490" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="10" fill="#047857"/>
    <text x="170" y="30" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">3. F1 进站维修三人专业队</text>

    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="300" height="80" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" fill="#6ee7b7" font-size="13" font-weight="bold">车队总策略官（General Agent）</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="11">统筹全局战况，拆解任务目标并分配工序</text>
    </g>

    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="300" height="80" rx="6" fill="#0f172a" stroke="#10b981"/>
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="bold">金牌换胎技师（Coder Agent: Flash）</text>
      <text x="15" y="46" fill="#38bdf8" font-size="11">搭载 M3.1-Flash，1.8 秒极速敲代码换胎</text>
    </g>

    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="300" height="80" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="bold">安全质检主管（Verifier Agent）</text>
      <text x="15" y="46" fill="#cbd5e1" font-size="11">扭力扳手测压，跑通单元测试才准驶出维修区！</text>
    </g>

    <text x="170" y="350" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">【小结】</text>
    <text x="25" y="380" fill="#94a3b8" font-size="12">MCode 的 Multi-Agent 分工明确，</text>
    <text x="25" y="405" fill="#94a3b8" font-size="12">每个人各司其职，保证代码既写得飞快，</text>
    <text x="25" y="430" fill="#94a3b8" font-size="12">又绝对不会在生产环境抛锚！</text>
  </g>
</svg>