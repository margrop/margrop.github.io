<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101d33"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233c"/><stop offset="1" stop-color="#111b2f"/></linearGradient></defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<text x="60" y="74" font-size="40" font-weight="700" fill="#f1f5f9">puzzle-*.com：41 款在线逻辑谜题</text>
<text x="60" y="112" font-size="20" fill="#7f93b3">免费、免安装、有中文版，按玩法可以分成六大类</text>
<g><rect x="60" y="150" width="330" height="180" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="84" y="196" font-size="26" font-weight="700" fill="#7dd3fc">填数字</text><text x="366" y="196" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">7 款</text><text x="84" y="246" font-size="19" fill="#dbe6f7">数独 · 杀手数独 · 数和 · 高楼</text><text x="84" y="286" font-size="17" fill="#9db1cf">在格子里填 1~N，满足各种约束</text></g>
<g><rect x="435" y="150" width="330" height="180" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="459" y="196" font-size="26" font-weight="700" fill="#7dd3fc">涂黑格子</text><text x="741" y="196" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">13 款</text><text x="459" y="246" font-size="19" fill="#dbe6f7">数织 · 数墙 · 数壹 · 阴阳</text><text x="459" y="286" font-size="17" fill="#9db1cf">每格非黑即白，按线索二选一</text></g>
<g><rect x="810" y="150" width="330" height="180" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="834" y="196" font-size="26" font-weight="700" fill="#7dd3fc">画线连线</text><text x="1116" y="196" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">7 款</text><text x="834" y="246" font-size="19" fill="#dbe6f7">数回 · 珍珠 · 搭桥 · 接水管</text><text x="834" y="286" font-size="17" fill="#9db1cf">连成一个回路或一张网络</text></g>
<g><rect x="60" y="365" width="330" height="180" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="84" y="411" font-size="26" font-weight="700" fill="#7dd3fc">放置物品</text><text x="366" y="411" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">9 款</text><text x="84" y="461" font-size="19" fill="#dbe6f7">扫雷 · 点灯 · 帐篷 · 星之战</text><text x="84" y="501" font-size="17" fill="#9db1cf">按计数线索摆放地雷、灯泡等</text></g>
<g><rect x="435" y="365" width="330" height="180" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="459" y="411" font-size="26" font-weight="700" fill="#7dd3fc">划分区域</text><text x="741" y="411" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">3 款</text><text x="459" y="461" font-size="19" fill="#dbe6f7">数方 · 星系 · 数邻</text><text x="459" y="501" font-size="17" fill="#9db1cf">把整个盘面切成合规的小块</text></g>
<g><rect x="810" y="365" width="330" height="180" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="834" y="411" font-size="26" font-weight="700" fill="#7dd3fc">其他</text><text x="1116" y="411" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="end">2 款</text><text x="834" y="461" font-size="19" fill="#dbe6f7">象棋解谜 · 找单词</text><text x="834" y="501" font-size="17" fill="#9db1cf">只能吃子的象棋与拼词游戏</text></g>
<text x="1140" y="612" font-size="15" fill="#5b6e8f" text-anchor="end">分类与统计：本文自制</text>
</svg>
