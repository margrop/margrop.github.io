<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101d33"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233c"/><stop offset="1" stop-color="#111b2f"/></linearGradient></defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="60" y="74" font-size="36" font-weight="700" fill="#f1f5f9">涂黑类谜题最常见的三条约束</text>
<text x="60" y="110" font-size="19" fill="#7f93b3">下面三个盘面各违反一条规则，红框标出了出错的位置</text>
<g><rect x="60" y="140" width="330" height="390" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="84" y="184" font-size="24" font-weight="700" fill="#7dd3fc">黑格不能相邻</text><rect x="121" y="206" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="173" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="225" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="277" y="206" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="121" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="173" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="225" y="258" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="277" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="121" y="310" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="173" y="310" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="225" y="310" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="277" y="310" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="121" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="173" y="362" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="225" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="277" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="228" y="261" width="46" height="98" fill="none" stroke="#f43f5e" stroke-width="5" rx="6"/><text x="84" y="460" font-size="18" fill="#fda4af">错误：上下两个黑格挨在一起</text><text x="84" y="496" font-size="17" fill="#9db1cf">常见于：数壹、数间、田鼠挖洞</text></g>
<g><rect x="435" y="140" width="330" height="390" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="459" y="184" font-size="24" font-weight="700" fill="#7dd3fc">白格必须连通</text><rect x="496" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="548" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="600" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="652" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="496" y="258" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="548" y="258" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="600" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="652" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="496" y="310" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="548" y="310" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="600" y="310" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="652" y="310" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="496" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="548" y="362" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="600" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="652" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="499" y="313" width="46" height="98" fill="none" stroke="#f43f5e" stroke-width="5" rx="6"/><text x="459" y="460" font-size="18" fill="#fda4af">错误：左下角的白格被黑墙隔开</text><text x="459" y="496" font-size="17" fill="#9db1cf">常见于：数壹、数墙、阴阳</text></g>
<g><rect x="810" y="140" width="330" height="390" rx="16" fill="url(#card)" stroke="#2a3a58"/><text x="834" y="184" font-size="24" font-weight="700" fill="#7dd3fc">不能出现 2×2</text><rect x="871" y="206" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="923" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="975" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="1027" y="206" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="871" y="258" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="923" y="258" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="975" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="1027" y="258" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="871" y="310" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="923" y="310" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="975" y="310" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="1027" y="310" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="871" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="923" y="362" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="975" y="362" width="52" height="52" fill="#0f172a" stroke="#64748b" stroke-width="2"/><rect x="1027" y="362" width="52" height="52" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="926" y="313" width="98" height="98" fill="none" stroke="#f43f5e" stroke-width="5" rx="6"/><text x="834" y="460" font-size="18" fill="#fda4af">错误：右下出现了 2×2 的黑块</text><text x="834" y="496" font-size="17" fill="#9db1cf">常见于：数墙、LITS、土派艺术</text></g>
