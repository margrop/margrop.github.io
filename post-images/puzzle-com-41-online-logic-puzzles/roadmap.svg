<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101d33"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233c"/><stop offset="1" stop-color="#111b2f"/></linearGradient></defs>
<rect width="1200" height="630" rx="24" fill="url(#bg)"/>
<text x="60" y="74" font-size="36" font-weight="700" fill="#f1f5f9">新手入门路线：五站从易到难</text>
<text x="60" y="110" font-size="19" fill="#7f93b3">每一站先玩 5×5 或简单难度，能独立解出 3 题再进入下一站</text>
<line x1="96" y1="170" x2="96" y2="530" stroke="#2a3a58" stroke-width="4"/>
<rect x="140" y="136" width="1000" height="68" rx="14" fill="url(#card)" stroke="#2a3a58"/><circle cx="96" cy="170" r="24" fill="#0ea5e9"/><text x="96" y="178" font-size="22" font-weight="700" fill="#0b1220" text-anchor="middle">1</text><text x="166" y="178" font-size="23" font-weight="700" fill="#7dd3fc">填数字热身</text><text x="370" y="178" font-size="21" fill="#dbe6f7">数独 → 杀手数独 → 数和</text><text x="1116" y="178" font-size="18" fill="#fbbf24" text-anchor="end">练：排除法、求和组合</text>
<rect x="140" y="226" width="1000" height="68" rx="14" fill="url(#card)" stroke="#2a3a58"/><circle cx="96" cy="260" r="24" fill="#0ea5e9"/><text x="96" y="268" font-size="22" font-weight="700" fill="#0b1220" text-anchor="middle">2</text><text x="166" y="268" font-size="23" font-weight="700" fill="#7dd3fc">数字推黑格</text><text x="370" y="268" font-size="21" fill="#dbe6f7">扫雷 → 马赛克 → 数织</text><text x="1116" y="268" font-size="18" fill="#fbbf24" text-anchor="end">练：按数字计数推断</text>
<rect x="140" y="316" width="1000" height="68" rx="14" fill="url(#card)" stroke="#2a3a58"/><circle cx="96" cy="350" r="24" fill="#0ea5e9"/><text x="96" y="358" font-size="22" font-weight="700" fill="#0b1220" text-anchor="middle">3</text><text x="166" y="358" font-size="23" font-weight="700" fill="#7dd3fc">黑白约束</text><text x="370" y="358" font-size="21" fill="#dbe6f7">数壹 → 数墙 → 数间</text><text x="1116" y="358" font-size="18" fill="#fbbf24" text-anchor="end">练：不相邻、要连通</text>
<rect x="140" y="406" width="1000" height="68" rx="14" fill="url(#card)" stroke="#2a3a58"/><circle cx="96" cy="440" r="24" fill="#0ea5e9"/><text x="96" y="448" font-size="22" font-weight="700" fill="#0b1220" text-anchor="middle">4</text><text x="166" y="448" font-size="23" font-weight="700" fill="#7dd3fc">画回路</text><text x="370" y="448" font-size="21" fill="#dbe6f7">数回 → 珍珠 → 信号旗</text><text x="1116" y="448" font-size="18" fill="#fbbf24" text-anchor="end">练：每个点 0 或 2 条线</text>
<rect x="140" y="496" width="1000" height="68" rx="14" fill="url(#card)" stroke="#2a3a58"/><circle cx="96" cy="530" r="24" fill="#0ea5e9"/><text x="96" y="538" font-size="22" font-weight="700" fill="#0b1220" text-anchor="middle">5</text><text x="166" y="538" font-size="23" font-weight="700" fill="#7dd3fc">挑战大盘面</text><text x="370" y="538" font-size="21" fill="#dbe6f7">星之战 · 黑白+ · LITS</text><text x="1116" y="538" font-size="18" fill="#fbbf24" text-anchor="end">练：组合多条约束</text>
<text x="1140" y="604" font-size="15" fill="#5b6e8f" text-anchor="end">路线建议：本文自制</text>
</svg>
