<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" rx="32" fill="#f8f9fa"/>
<text x="70" y="70" fill="#172b4d" font-size="34" font-weight="800" font-family="Noto Sans CJK SC,sans-serif">LTS 升级是一场接力赛，不是跨栏</text>
<text x="70" y="112" fill="#6c757d" font-size="20" font-family="Noto Sans CJK SC,sans-serif">do-release-upgrade 只认“相邻的下一棒”，棒不能隔空扔</text>
<rect x="70" y="160" width="300" height="170" rx="24" fill="#ffffff" stroke="#4dabf7" stroke-width="4"/>
<text x="98" y="212" fill="#1864ab" font-size="26" font-weight="700" font-family="Noto Sans CJK SC,sans-serif">第一棒 · 22.04</text>
<text x="98" y="258" fill="#343a40" font-size="20" font-family="Noto Sans CJK SC,sans-serif">把当前版本所有包升级到位</text><rect x="450" y="160" width="300" height="170" rx="24" fill="#ffffff" stroke="#ffd43b" stroke-width="4"/>
<text x="478" y="212" fill="#e67700" font-size="26" font-weight="700" font-family="Noto Sans CJK SC,sans-serif">第二棒 · 24.04</text>
<text x="478" y="258" fill="#343a40" font-size="20" font-family="Noto Sans CJK SC,sans-serif">重启进入新内核再交棒</text><rect x="830" y="160" width="300" height="170" rx="24" fill="#ffffff" stroke="#69db7c" stroke-width="4"/>
<text x="858" y="212" fill="#2b8a3e" font-size="26" font-weight="700" font-family="Noto Sans CJK SC,sans-serif">第三棒 · 26.04</text>
<text x="858" y="258" fill="#343a40" font-size="20" font-family="Noto Sans CJK SC,sans-serif">重复检查、升级、重启、验收</text>
<path d="M380 245 L440 245" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
<path d="M760 245 L820 245" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
<polygon points="440,233 462,245 440,257" fill="#495057"/><polygon points="820,233 842,245 820,257" fill="#495057"/>
<rect x="70" y="380" width="1060" height="90" rx="20" fill="#fff5f5" stroke="#fa5252" stroke-width="3"/>
<text x="100" y="435" fill="#c92a2a" font-size="24" font-family="Noto Sans CJK SC,sans-serif">想“一步到位”直接改源到 26.04？等于把接力棒直接扔向终点——掉棒概率最大，摔了还没有裁判录像。</text>
<rect x="70" y="500" width="1060" height="90" rx="20" fill="#ebfbee" stroke="#2f9e44" stroke-width="3"/>
<text x="100" y="555" fill="#2b8a3e" font-size="24" font-family="Noto Sans CJK SC,sans-serif">正确姿势：每一棒都完整跑完“全量升级 → 重启 → 验证”，交接前确认上一棒没有留问题。</text>
</svg>