<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" rx="32" fill="#f8f9fa"/>
<text x="70" y="70" fill="#172b4d" font-size="34" font-weight="800" font-family="Noto Sans CJK SC,sans-serif">meta-release：升级器眼里的“营业时间牌”</text>
<text x="70" y="112" fill="#6c757d" font-size="20" font-family="Noto Sans CJK SC,sans-serif">do-release-upgrade 不看你的意愿，只看牌子上写什么</text>
<rect x="90" y="160" width="440" height="360" rx="24" fill="#ffffff" stroke="#343a40" stroke-width="4"/>
<rect x="230" y="130" width="14" height="330" fill="#868e96"/>
<polygon points="244,180 420,220 244,260" fill="#fa5252"/>
<text x="300" y="228" fill="#ffffff" font-size="24" font-weight="700" font-family="Noto Sans CJK SC,sans-serif" transform="rotate(6 300 228)">Supported: 0</text>
<text x="130" y="430" fill="#c92a2a" font-size="22" font-weight="700" font-family="Noto Sans CJK SC,sans-serif">店里明明有货（26.04.1 已发布）</text>
<text x="130" y="470" fill="#868e96" font-size="20" font-family="Noto Sans CJK SC,sans-serif">但牌子写“暂停营业”，升级器扭头就走：</text>
<text x="130" y="500" fill="#868e96" font-size="20" font-family="Noto Sans CJK SC,sans-serif">“There is no development version of an LTS available.”</text>
<rect x="670" y="160" width="440" height="360" rx="24" fill="#ffffff" stroke="#2f9e44" stroke-width="4"/>
<rect x="810" y="130" width="14" height="330" fill="#868e96"/>
<polygon points="824,180 1000,220 824,260" fill="#2f9e44"/>
<text x="880" y="228" fill="#ffffff" font-size="24" font-weight="700" font-family="Noto Sans CJK SC,sans-serif" transform="rotate(6 880 228)">Supported: 1</text>
<text x="710" y="430" fill="#2b8a3e" font-size="22" font-weight="700" font-family="Noto Sans CJK SC,sans-serif">解法：自己下载一份 meta-release 副本</text>
<text x="710" y="470" fill="#868e96" font-size="20" font-family="Noto Sans CJK SC,sans-serif">把 resolute 的标志翻成 1，存成 file:// 地址</text>
<text x="710" y="500" fill="#868e96" font-size="20" font-family="Noto Sans CJK SC,sans-serif">升级器马上就“看见”了 26.04。升级完记得换回原配置。</text>
<text x="70" y="590" fill="#6c757d" font-size="20" font-family="Noto Sans CJK SC,sans-serif">比喻：不是让你闯进没开门的店，而是确认货真的到了之后，把门口挂反的牌子翻正。</text>
</svg>