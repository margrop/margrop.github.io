<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Everyday Analogies for AirPrint">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#13233c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bgGrad)"/>

  <text x="60" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#f59e0b">小学生秒懂：用生活大白话把 AirPrint 拆解成三幕日常大戏</text>
  <text x="60" y="98" font-family="-apple-system, sans-serif" font-size="15" fill="#94a3b8">高大上的网络通信，本质上就是我们每天在学校和生活中经历的互动逻辑</text>

  <!-- Act 1: Classroom roll call -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="1080" height="180" rx="14" fill="#152033" stroke="#253550" stroke-width="2"/>
    <rect x="80" y="150" width="140" height="40" rx="8" fill="#0284c7"/>
    <text x="100" y="176" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">第一幕：问路</text>
    <text x="245" y="177" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">mDNS 广播 = 班级大嗓门借卷笔刀</text>
    <text x="80" y="218" font-family="-apple-system, sans-serif" font-size="15" fill="#cbd5e1">【生活比方】小明在教室里喊：“谁有自动削铅笔机？”（UDP 5353 组播）。打印机举手：“我有！我在第三排第二座”。</text>
    <text x="80" y="250" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 变化】新班主任极其严厉，要求举手的同时必须胸前挂着官方核发的《支持削 2B/HB 铅笔的准考证》（TXT 记录包含 URF=... 和 pdl=image/urf）。老打印机只喊了声“我有”，没挂证件，小明被班主任遮住了双眼，当作没听见！</text>
    <text x="80" y="285" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">【直接后果】iPhone 屏幕显示冷冰冰的八个字：“未找到 AirPrint 打印机”。</text>
  </g>

  <!-- Act 2: Amusement park gate -->
  <g filter="url(#shadow)">
    <rect x="60" y="330" width="1080" height="180" rx="14" fill="#152033" stroke="#253550" stroke-width="2"/>
    <rect x="80" y="350" width="140" height="40" rx="8" fill="#059669"/>
    <text x="100" y="376" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">第二幕：看证件</text>
    <text x="245" y="377" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399">TLS 证书 = 游乐园安检门查验身份证保质期</text>
    <text x="80" y="418" font-family="-apple-system, sans-serif" font-size="15" fill="#cbd5e1">【生活比方】走到门口敲门（TCP 631 握手），保安要求出示游乐园通行证（IPPS TLS 证书），核实你到底是不是真正的设施。</text>
    <text x="80" y="450" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 变化】老系统查得松，只要有张纸就行；iOS 27 换成了人脸比对机：证书有效期超过 825 天（老设备常年签 10 年）？不准进！没有防伪条形码（SAN 扩展属性）？不准进！用模糊公章盖的（SHA-1 算法）？全部撕掉！</text>
    <text x="80" y="485" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">【直接后果】iPhone 搜到了打印机名字，但一点打印就转圈卡死，随后弹出“无法连接到打印机”。</text>
  </g>

  <!-- Act 3: Translator & Drawing Board -->
  <g filter="url(#shadow)">
    <rect x="60" y="530" width="1080" height="180" rx="14" fill="#152033" stroke="#253550" stroke-width="2"/>
    <rect x="80" y="550" width="140" height="40" rx="8" fill="#7c3aed"/>
    <text x="100" y="576" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">第三幕：画图纸</text>
    <text x="245" y="577" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#c084fc">CUPS 过滤器 = 苹果蜡笔画与激光雕刻机的翻译官</text>
    <text x="80" y="618" font-family="-apple-system, sans-serif" font-size="15" fill="#cbd5e1">【生活比方】iPhone 递过来一张用特制“苹果蜡笔”画的草稿纸（image/urf 格式），但打印机是老外，只听懂“机械加工图纸”（PCL/PostScript）。</text>
    <text x="80" y="650" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 变化】中继的电脑（Linux/Mac CUPS）负责当翻译官。如果中继服务器没有装《苹果蜡笔转加工图纸字典》（cups-filters driverless 支持），翻译官瞬间懵圈，把草稿纸揉成一团扔在地上（Filter Failed 报错）。</text>
    <text x="80" y="685" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">【直接后果】打印机马达咔哒响了一声，接着吐出一整叠空白纸，或者任务在队列中无限期挂起。</text>
  </g>

  <text x="60" y="745" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">科普设计：Margrop 博客 · 用直观具象化生活思维还原严谨网络协议本质</text>
</svg>