<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Apple ATS and TLS Certificate Rules">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" fill="url(#bgGrad)"/>

  <text x="60" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">苹果 ATS 安全规范与打印机 TLS 证书四大硬性指标</text>
  <text x="60" y="98" font-family="-apple-system, sans-serif" font-size="15" fill="#94a3b8">为什么很多老旧打印机的“自签自足”在 iOS 27 面前直接撞墙遭拒？</text>

  <!-- Card 1: Lifespan -->
  <g>
    <rect x="60" y="135" width="520" height="260" rx="12" fill="#111a2c" stroke="#1e293b" stroke-width="2"/>
    <rect x="60" y="135" width="10" height="260" rx="4" fill="#f87171"/>
    <text x="90" y="175" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f87171">1. 有效期必须 ≤ 825 天（公立 CA ≤ 398 天）</text>
    <text x="90" y="210" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">【传统老坑】老打印机出厂固件通常签发 10 年（3650 天）有效期的根证书。</text>
    <text x="90" y="245" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 判定】根据 RFC 5280 与 Apple Security Policy，任何有效期超出 825 天的 TLS 证书都会被 CoreOS 安全子系统无条件标记为非法！</text>
    <rect x="90" y="315" width="460" height="50" rx="8" fill="#1f1a24" stroke="#e11d48"/>
    <text x="110" y="345" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f43f5e">❌ 典型报错：kSecTrustResultFatalTrustFailure (3650 days > 825 days)</text>
  </g>

  <!-- Card 2: SAN (Subject Alternative Name) -->
  <g>
    <rect x="620" y="135" width="520" height="260" rx="12" fill="#111a2c" stroke="#1e293b" stroke-width="2"/>
    <rect x="620" y="135" width="10" height="260" rx="4" fill="#38bdf8"/>
    <text x="650" y="175" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">2. 强制要求 SAN 扩展属性（废弃纯 CN）</text>
    <text x="650" y="210" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">【传统老坑】早期自签证书只在 Common Name (CN) 中填写一个打印机主机名。</text>
    <text x="650" y="245" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 判定】完全废弃对 CN 的域名核验逻辑。证书必须显式包含 Subject Alternative Name，且必须包含 DNS:printer.local 与 IP:192.168.x.x。</text>
    <rect x="650" y="315" width="460" height="50" rx="8" fill="#042f2e" stroke="#059669"/>
    <text x="670" y="345" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ 合规配置：subjectAltName = DNS:printer.local, IP:192.168.x.x</text>
  </g>

  <!-- Card 3: Key size & Hash -->
  <g>
    <rect x="60" y="425" width="520" height="260" rx="12" fill="#111a2c" stroke="#1e293b" stroke-width="2"/>
    <rect x="60" y="425" width="10" height="260" rx="4" fill="#f59e0b"/>
    <text x="90" y="465" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f59e0b">3. 密钥长度 ≥ 2048 位，签名 ≥ SHA-256</text>
    <text x="90" y="500" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">【传统老坑】低算力打印机芯片历史上常使用 1024 位 RSA 密钥与 SHA-1 哈希。</text>
    <text x="90" y="535" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 判定】SHA-1 碰撞被视为致命安全隐患，1024 位密钥已可被民用 GPU 算力破译。iOS 27 对此类弱密钥实行零容忍拦截。</text>
    <rect x="90" y="605" width="460" height="50" rx="8" fill="#042f2e" stroke="#059669"/>
    <text x="110" y="635" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ 合规配置：RSA 2048/4096-bit 或 ECC NIST P-256 + SHA256withRSA</text>
  </g>

  <!-- Card 4: TLS 1.3 / Extended Key Usage -->
  <g>
    <rect x="620" y="425" width="520" height="260" rx="12" fill="#111a2c" stroke="#1e293b" stroke-width="2"/>
    <rect x="620" y="425" width="10" height="260" rx="4" fill="#a855f7"/>
    <text x="650" y="465" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#a855f7">4. 扩展密钥用法 (EKU) 与 TLS 1.3 优先</text>
    <text x="650" y="500" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">【传统老坑】证书缺少 serverAuth 标识，或服务器仅开启已废弃的 TLS 1.0/1.1。</text>
    <text x="650" y="535" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8">【iOS 27 判定】必须包含 extendedKeyUsage = serverAuth。握手阶段优先发起 TLS 1.3 ClientHello，若服务端仅支持明文则受限于局部策略阻断。</text>
    <rect x="650" y="605" width="460" height="50" rx="8" fill="#042f2e" stroke="#059669"/>
    <text x="670" y="635" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ 合规配置：TLS 1.3 + CipherSuite TLS_AES_128_GCM_SHA256</text>
  </g>

  <text x="60" y="735" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">标准参考：Apple Requirements for Trusted Certificates in iOS · RFC 5280 · RFC 8446</text>
</svg>