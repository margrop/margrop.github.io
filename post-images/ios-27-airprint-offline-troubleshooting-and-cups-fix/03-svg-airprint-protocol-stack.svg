<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="AirPrint 4-Tier Protocol Stack">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f1b2f"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="60" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="28" font-weight="700" fill="#38bdf8">AirPrint 4 层协议栈全景与 iOS 27 关键断点剖析</text>
  <text x="60" y="98" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" fill="#94a3b8">从零配置发现到光栅化渲染：每一个阶段的严格契约决定了打印任务能否顺利落地</text>

  <!-- 4 Layer Cards -->
  <!-- Layer 1 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="130" width="1080" height="135" rx="12" fill="#111c30" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="60" y="130" width="12" height="135" rx="4" fill="#38bdf8"/>
    <text x="95" y="168" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">第 1 层：服务发现层 (Service Discovery) · mDNS / Bonjour (UDP 5353)</text>
    <text x="95" y="198" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">协议职责：广播宣告 _ipp._tcp.local. 与 _ipps._tcp.local.；下发 TXT 记录定义支持语言与驱动属性</text>
    <text x="95" y="228" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">iOS 27 痛点：TXT 记录严格审查，缺失 URF=... 或 pdl 中未显式包含 image/urf 直接从搜索列表中静默丢弃！</text>
  </g>

  <!-- Layer 2 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="285" width="1080" height="135" rx="12" fill="#111c30" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="60" y="285" width="12" height="135" rx="4" fill="#34d399"/>
    <text x="95" y="323" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399">第 2 层：安全传输层 (Secure Transport) · IPPS / TLS 1.3 (TCP 631 / 443)</text>
    <text x="95" y="353" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">协议职责：TLS 加密隧道建立，X.509 数字证书双向校验，保障局域网敏感打印内容不可嗅探</text>
    <text x="95" y="383" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">iOS 27 痛点：强制执行 ATS 规范，拒绝大于 825 天超期证书；强制 SAN 必须匹配 printer.local 或局域网段</text>
  </g>

  <!-- Layer 3 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="440" width="1080" height="135" rx="12" fill="#111c30" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="60" y="440" width="12" height="135" rx="4" fill="#f59e0b"/>
    <text x="95" y="478" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f59e0b">第 3 层：协议控制层 (IPP Session) · IPP 2.0 / RFC 8011</text>
    <text x="95" y="508" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">协议职责：交互 Get-Printer-Attributes，下发 Validate-Job 验证纸张尺寸、双面打印、颜色支持能力</text>
    <text x="95" y="538" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">iOS 27 痛点：全面抛弃陈旧 IPP 1.1 降级策略，遇 server-error-version-not-supported 直接弹“无法连接打印机”</text>
  </g>

  <!-- Layer 4 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="595" width="1080" height="135" rx="12" fill="#111c30" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="60" y="595" width="12" height="135" rx="4" fill="#a855f7"/>
    <text x="95" y="633" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#a855f7">第 4 层：光栅化与驱动转换层 (Raster Filtering) · Apple Raster / PWG</text>
    <text x="95" y="663" font-family="-apple-system, sans-serif" font-size="14" fill="#cbd5e1">协议职责：iOS 发送 image/urf (UNIRAST 字节流)；中继服务端（CUPS）通过 rastertopclx 转换成硬件点阵</text>
    <text x="95" y="693" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f87171">iOS 27 痛点：若 CUPS 服务器缺少 driverless 过滤器，产生 Filter Failed 报错，打印机吐白纸或死锁！</text>
  </g>

  <!-- Bottom watermark -->
  <text x="60" y="755" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">架构图源：Margrop 博客原创设计 · 遵循 IPP Everywhere 与 RFC 6763 规范 · 脱敏验证标准</text>
</svg>