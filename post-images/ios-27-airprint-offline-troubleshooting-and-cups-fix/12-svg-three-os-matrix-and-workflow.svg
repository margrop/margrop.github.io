<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-label="Deployment Matrix and Troubleshooting Flowchart">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#111f38"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="780" fill="url(#bgGrad)"/>

  <text x="60" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#38bdf8">三端部署支持矩阵与 iOS 27 AirPrint 排障决策全景树</text>
  <text x="60" y="98" font-family="-apple-system, sans-serif" font-size="15" fill="#94a3b8">按图索骥：从现象自查到针对性自动化修复的分步指引</text>

  <!-- Left: Matrix Table -->
  <g filter="url(#shadow)">
    <rect x="60" y="135" width="520" height="580" rx="14" fill="#131e33" stroke="#233552" stroke-width="2"/>
    <text x="90" y="175" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">三大操作系统作为 AirPrint 服务端对比</text>

    <!-- Table Header -->
    <rect x="80" y="200" width="480" height="35" fill="#1e2c45"/>
    <text x="95" y="223" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">操作系统</text>
    <text x="200" y="223" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">核心组件</text>
    <text x="320" y="223" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">mDNS 广播</text>
    <text x="440" y="223" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">自动化修复</text>

    <!-- Row 1: Ubuntu 26.04 -->
    <rect x="80" y="240" width="480" height="85" fill="#16233a"/>
    <text x="95" y="270" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f97316">Ubuntu 26.04</text>
    <text x="95" y="295" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">推荐中继服务器</text>
    <text x="200" y="270" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">CUPS 2.4+</text>
    <text x="200" y="295" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">cups-filters 2.x</text>
    <text x="320" y="270" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">avahi-daemon</text>
    <text x="320" y="295" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">XML 声明定义</text>
    <text x="440" y="275" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">一键 Bash 脚本</text>

    <!-- Row 2: macOS 26 -->
    <rect x="80" y="330" width="480" height="85" fill="#131e33"/>
    <text x="95" y="360" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#06b6d4">macOS 26</text>
    <text x="95" y="385" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">原生生态共享</text>
    <text x="200" y="360" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">原生 CUPS</text>
    <text x="200" y="385" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">cupsctl CLI</text>
    <text x="320" y="360" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">mDNSResponder</text>
    <text x="320" y="385" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">零配置自动反射</text>
    <text x="440" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">一键 Zsh 脚本</text>

    <!-- Row 3: Windows 11 -->
    <rect x="80" y="420" width="480" height="85" fill="#16233a"/>
    <text x="95" y="450" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Windows 11</text>
    <text x="95" y="475" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">桌面办公共享</text>
    <text x="200" y="450" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">Print Spooler</text>
    <text x="200" y="475" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">IPP 客户端</text>
    <text x="320" y="450" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">Bonjour 服务</text>
    <text x="320" y="475" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">或 Python 桥接</text>
    <text x="440" y="455" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">一键 PS1 脚本</text>

    <!-- Bottom summary box -->
    <rect x="80" y="525" width="480" height="160" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="100" y="555" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f59e0b">选型建议：</text>
    <text x="100" y="585" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• 若家里有 NAS 或软路由：首选 Ubuntu/Debian 运行 CUPS + Avahi</text>
    <text x="100" y="615" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• 若日常主力机是 Mac：直接开启“打印机共享”并运行 macOS 脚本</text>
    <text x="100" y="645" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• 若只有 Windows PC：运行 PS1 脚本开启防火墙与 IPP 桥接服务</text>
  </g>

  <!-- Right: Decision Flowchart -->
  <g filter="url(#shadow)">
    <rect x="620" y="135" width="520" height="580" rx="14" fill="#131e33" stroke="#233552" stroke-width="2"/>
    <text x="650" y="175" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#34d399">快速排障 5 步决策树</text>

    <!-- Step 1 -->
    <rect x="645" y="200" width="470" height="60" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="665" y="225" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. 检查物理网络与 Wi-Fi 隔离</text>
    <text x="665" y="248" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">iPhone 与打印机同网段？路由器关闭 AP 隔离与启用 IGMP？</text>

    <!-- Step 2 -->
    <rect x="645" y="280" width="470" height="60" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="665" y="305" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">2. 检查 iPhone“专用地址”设置</text>
    <text x="665" y="328" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">进入当前 Wi-Fi 设置，将“专用无线局域网地址”临时切换为“关闭”</text>

    <!-- Step 3 -->
    <rect x="645" y="360" width="470" height="60" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="665" y="385" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">3. 验证 mDNS TXT 声明 (avahi-browse / dns-sd)</text>
    <text x="665" y="408" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">是否包含 pdl=image/urf 以及 URF=W8,SRGB24 等必要标牌？</text>

    <!-- Step 4 -->
    <rect x="645" y="440" width="470" height="60" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="665" y="465" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">4. 检查 IPPS TLS 证书与端口 (TCP 631)</text>
    <text x="665" y="488" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">自签证书有效期是否 ≤ 825 天？是否包含 SAN 扩展属性？</text>

    <!-- Step 5 -->
    <rect x="645" y="520" width="470" height="60" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="665" y="545" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">5. 执行平台专属自动化修复脚本</text>
    <text x="665" y="568" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">运行本文提供脚本，一键重塑 mDNS 配置文件与 CUPS 队列</text>

    <!-- Success box -->
    <rect x="645" y="605" width="470" height="80" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
    <text x="730" y="640" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#34d399">🎉 打印机顺利复活，AirPrint 即点即打！</text>
    <text x="730" y="665" font-family="-apple-system, sans-serif" font-size="12" fill="#a7f3d0">iOS 27 严苛认证全部通过 · 极速光栅化完成 · 纸张平稳输出</text>
  </g>

  <text x="60" y="745" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">决策树设计：Margrop 博客 · 严谨遵循 IEEE / RFC / Apple 官方技术规范</text>
</svg>