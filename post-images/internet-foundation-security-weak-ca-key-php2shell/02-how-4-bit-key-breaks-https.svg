<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#0B0F19"/>
  <rect x="50" y="40" width="1300" height="680" rx="20" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="32" font-weight="700" fill="#F9FAFB">Cryptographic Contrast: Standard P-384 vs Broken 4-Bit Key</text>
  <text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" fill="#9CA3AF">Why reducing key entropy from 384 bits to single-digit integers shatters all mathematical security.</text>

  <!-- Left: Standard P-384 -->
  <g transform="translate(90, 200)">
    <rect width="570" height="390" rx="16" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="570" height="50" rx="16" fill="#064E3B"/>
    <rect x="0" y="30" width="570" height="20" fill="#064E3B"/>
    <text x="285" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Standard NIST P-384 (secp384r1)</text>

    <text x="30" y="90" font-family="Arial, sans-serif" font-size="17" fill="#D1FAE5">- Key Space: 2^384 possible states</text>
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="17" fill="#D1FAE5">- In Decimals: ~394,117,144... (116 digits long!)</text>
    <text x="30" y="160" font-family="Arial, sans-serif" font-size="17" fill="#D1FAE5">- Physical Comparison: More than all atoms in the universe</text>
    <text x="30" y="195" font-family="Arial, sans-serif" font-size="17" fill="#D1FAE5">- Supercomputer Time to Crack: Billions of trillions of years</text>
    <text x="30" y="230" font-family="Arial, sans-serif" font-size="17" fill="#D1FAE5">- Security Level: 192-bit symmetric equivalent (Military grade)</text>
    <text x="30" y="265" font-family="Arial, sans-serif" font-size="17" fill="#D1FAE5">- Formula: Q = d * G (Discrete Logarithm is computationally hard)</text>

    <rect x="30" y="305" width="510" height="55" rx="10" fill="#047857"/>
    <text x="285" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Result: Unbreakable by Modern Computing</text>
  </g>

  <!-- Right: Broken eMudhra Key -->
  <g transform="translate(740, 200)">
    <rect width="570" height="390" rx="16" fill="#7F1D1D" fill-opacity="0.2" stroke="#EF4444" stroke-width="2"/>
    <rect x="0" y="0" width="570" height="50" rx="16" fill="#991B1B"/>
    <rect x="0" y="30" width="570" height="20" fill="#991B1B"/>
    <text x="285" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Compromised eMudhra Key (Oct 2026)</text>

    <text x="30" y="90" font-family="Arial, sans-serif" font-size="17" fill="#FEE2E2">- Key Space: 2^3 to 2^8 possible states</text>
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="17" fill="#FEE2E2">- In Decimals: Exactly 8 to 256 numbers!</text>
    <text x="30" y="160" font-family="Arial, sans-serif" font-size="17" fill="#FEE2E2">- Physical Comparison: Shorter than a bicycle lock code</text>
    <text x="30" y="195" font-family="Arial, sans-serif" font-size="17" fill="#FEE2E2">- Real Observation: Private key d was found to be 4</text>
    <text x="30" y="230" font-family="Arial, sans-serif" font-size="17" fill="#FEE2E2">- Attack Algorithm: Baby-Step Giant-Step or direct brute force</text>
    <text x="30" y="265" font-family="Arial, sans-serif" font-size="17" fill="#FEE2E2">- Computation Time: 0.0001 seconds on a smartphone</text>

    <rect x="30" y="305" width="510" height="55" rx="10" fill="#DC2626"/>
    <text x="285" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Result: Instantly Cracked & Forgery Enabled</text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <rect x="90" y="620" width="1220" height="70" rx="12" fill="#1F2937"/>
  <text x="120" y="662" font-family="Arial, sans-serif" font-size="18" fill="#F3F4F6">Takeaway: The strongest cryptography in the world collapses to zero when the random seed generation process fails.</text>
</svg>