<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#0B0F19"/>
  <rect x="50" y="40" width="1300" height="700" rx="20" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="32" font-weight="700" fill="#F9FAFB">Three-Tier Defense Architecture for Normal Users &amp; Homelabs</text>
  <text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" fill="#9CA3AF">A practical protection matrix against CA revocation lags and web runtime zero-days.</text>

  <!-- Column 1: Client & Browser Tier -->
  <g transform="translate(90, 200)">
    <rect width="370" height="420" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="0" y="0" width="370" height="50" rx="16" fill="#0284C7"/>
    <rect x="0" y="30" width="370" height="20" fill="#0284C7"/>
    <text x="185" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tier 1: Browser &amp; Client</text>

    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">Who it protects:</text>
    <text x="25" y="120" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">Daily web surfing, online banking, shopping.</text>

    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#38BDF8">Core Defense Mechanisms:</text>
    <text x="25" y="200" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Chrome CRLSet auto background push</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Mozilla Firefox OneCRL push sync</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Certificate Transparency (CT) enforcement</text>
    <text x="25" y="290" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Strict Transport Security (HSTS)</text>

    <rect x="25" y="340" width="320" height="50" rx="10" fill="#0369A1"/>
    <text x="185" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">User Action: Keep Browsers Updated</text>
  </g>

  <!-- Column 2: OS & System Trust Store -->
  <g transform="translate(515, 200)">
    <rect width="370" height="420" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="370" height="50" rx="16" fill="#059669"/>
    <rect x="0" y="30" width="370" height="20" fill="#059669"/>
    <text x="185" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tier 2: OS Trust Store</text>

    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34D399">Who it protects:</text>
    <text x="25" y="120" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">Native desktop apps, curl, git, API clients.</text>

    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#34D399">Core Defense Mechanisms:</text>
    <text x="25" y="200" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Windows CTL Disallowed Certificate store</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Ubuntu ca-certificates package</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- macOS SecTrust &amp; System Roots</text>
    <text x="25" y="290" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Python certifi / Go crypto denylist</text>

    <rect x="25" y="340" width="320" height="50" rx="10" fill="#047857"/>
    <text x="185" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">User Action: Run Audit Script</text>
  </g>

  <!-- Column 3: Servers, Containers & Runtimes -->
  <g transform="translate(940, 200)">
    <rect width="370" height="420" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="370" height="50" rx="16" fill="#D97706"/>
    <rect x="0" y="30" width="370" height="20" fill="#D97706"/>
    <text x="185" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Tier 3: Server &amp; Container</text>

    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FBBF24">Who it protects:</text>
    <text x="25" y="120" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">Self-hosted blogs, cloud VPS, Docker apps.</text>

    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FBBF24">Core Defense Mechanisms:</text>
    <text x="25" y="200" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Patch PHP runtime (8.2.35+ / 8.3.36+)</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Rebuild stale Docker base images</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- WAF rules on multipart payloads</text>
    <text x="25" y="290" font-family="Arial, sans-serif" font-size="15" fill="#CBD5E1">- Memory limit &amp; process restarts</text>

    <rect x="25" y="340" width="320" height="50" rx="10" fill="#B45309"/>
    <text x="185" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Admin Action: Update &amp; Rebuild Images</text>
  </g>

  <!-- Bottom Checklist -->
  <rect x="90" y="650" width="1220" height="60" rx="12" fill="#1F2937"/>
  <text x="120" y="688" font-family="Arial, sans-serif" font-size="17" fill="#E5E7EB">Key Takeaway: True security is never reliant on a single lock. Layered defense keeps you safe even when a root key fails.</text>
</svg>