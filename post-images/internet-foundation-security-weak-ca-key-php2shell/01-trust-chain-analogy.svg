<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <rect width="1400" height="780" fill="#0F172A"/>
  <rect x="50" y="40" width="1300" height="700" rx="24" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <text x="90" y="110" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">How HTTPS Trust Chain Works: The Notary Office Analogy</text>
  <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="20" fill="#94A3B8">Every time you see the green lock in your browser, this four-tier verification chain happened in milliseconds.</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,2 L8,5 L1,8" fill="#38BDF8" stroke="#38BDF8" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Level 1: Root CA -->
  <g transform="translate(90, 220)">
    <rect width="260" height="340" rx="16" fill="#0B132B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="55" rx="16" fill="#1E3A8A"/>
    <rect x="0" y="35" width="260" height="20" fill="#1E3A8A"/>
    <text x="130" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1. Root CA</text>
    <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">[National Notary HQ]</text>
    <text x="25" y="140" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Hardcoded in OS/Browser</text>
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Never leaves safe vault</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Signs Intermediate CAs</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Example: DigiCert, IdenTrust</text>
    <rect x="25" y="290" width="210" height="30" rx="8" fill="#0284C7"/>
    <text x="130" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Master Seal</text>
  </g>

  <!-- Level 2: Intermediate CA -->
  <g transform="translate(400, 220)">
    <rect width="260" height="340" rx="16" fill="#0B132B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="55" rx="16" fill="#78350F"/>
    <rect x="0" y="35" width="260" height="20" fill="#78350F"/>
    <text x="130" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2. Intermediate CA</text>
    <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FBBF24">[Branch Notary Office]</text>
    <text x="25" y="140" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Daily operational signer</text>
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Issues website certificates</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="16" fill="#EF4444">- THE TARGET IN CRISIS:</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="16" fill="#F87171">- eMudhra weak private keys!</text>
    <rect x="25" y="290" width="210" height="30" rx="8" fill="#D97706"/>
    <text x="130" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Subordinate Seal</text>
  </g>

  <!-- Level 3: Leaf / Server Certificate -->
  <g transform="translate(710, 220)">
    <rect width="260" height="340" rx="16" fill="#0B132B" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="55" rx="16" fill="#064E3B"/>
    <rect x="0" y="35" width="260" height="20" fill="#064E3B"/>
    <text x="130" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3. Server Certificate</text>
    <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#34D399">[Business License]</text>
    <text x="25" y="140" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Bound to specific domain</text>
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- e.g. *.example.com</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Contains public key</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Expires every 90-398 days</text>
    <rect x="25" y="290" width="210" height="30" rx="8" fill="#059669"/>
    <text x="130" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Storefront Credential</text>
  </g>

  <!-- Level 4: Client Verification -->
  <g transform="translate(1020, 220)">
    <rect width="260" height="340" rx="16" fill="#0B132B" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="55" rx="16" fill="#4C1D95"/>
    <rect x="0" y="35" width="260" height="20" fill="#4C1D95"/>
    <text x="130" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4. Client Verification</text>
    <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#C084FC">[Security Inspector]</text>
    <text x="25" y="140" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Checks mathematical math</text>
    <text x="25" y="180" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Checks CRLSet / OneCRL</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Checks expiration & SAN</text>
    <text x="25" y="260" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Shows Padlock or Warning</text>
    <rect x="25" y="290" width="210" height="30" rx="8" fill="#7C3AED"/>
    <text x="130" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Browser & Device</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M350, 390 L395, 390" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M660, 390 L705, 390" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M970, 390 L1015, 390" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Danger Annotation -->
  <rect x="90" y="600" width="1190" height="95" rx="14" fill="#450A0A" stroke="#EF4444" stroke-width="2"/>
  <text x="120" y="638" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FCA5A5">The Catastrophic Vulnerability: Why an Intermediate CA Private Key Leak is Devastating</text>
  <text x="120" y="670" font-family="Arial, sans-serif" font-size="17" fill="#FECACA">If an attacker recovers the Intermediate CA private key, they can forge ANY valid website certificate without the domain owner's permission!</text>
</svg>