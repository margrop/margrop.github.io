<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#0F172A"/>
  <rect x="50" y="40" width="1300" height="680" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2"/>

  <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="32" font-weight="700" fill="#F8FAFC">How PHP2Shell Works: The Panicking Kitchen Analogy</text>
  <text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" fill="#94A3B8">Explaining Out-of-Memory heap corruption and longjmp state leaks in everyday terms.</text>

  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,2 L8,5 L1,8" fill="#10B981" stroke="#10B981" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(90, 200)">
    <rect width="270" height="360" rx="16" fill="#0B132B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="50" rx="16" fill="#0369A1"/>
    <rect x="0" y="30" width="270" height="20" fill="#0369A1"/>
    <text x="135" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">1. The Busy Chef</text>
    
    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- PHP engine is the chef</text>
    <text x="25" y="125" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Memory is the prep table</text>
    <text x="25" y="160" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Incoming web requests</text>
    <text x="25" y="195" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">  are customer orders</text>
    <text x="25" y="235" font-family="Arial, sans-serif" font-size="16" fill="#38BDF8">Normal Operation:</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Allocates memory, cooks</text>
    <text x="25" y="295" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">response, cleans up table.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(390, 200)">
    <rect width="270" height="360" rx="16" fill="#0B132B" stroke="#F59E0B" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="50" rx="16" fill="#B45309"/>
    <rect x="0" y="30" width="270" height="20" fill="#B45309"/>
    <text x="135" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">2. Table Overload (OOM)</text>
    
    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Attacker sends abnormal</text>
    <text x="25" y="125" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">  giant multipart payload</text>
    <text x="25" y="160" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Prep table runs out of</text>
    <text x="25" y="195" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">  space (Out-Of-Memory)</text>
    <text x="25" y="235" font-family="Arial, sans-serif" font-size="16" fill="#FBBF24">The Error Trigger:</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Memory allocation fails</text>
    <text x="25" y="295" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">unexpectedly mid-flight.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(690, 200)">
    <rect width="270" height="360" rx="16" fill="#0B132B" stroke="#EF4444" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="50" rx="16" fill="#991B1B"/>
    <rect x="0" y="30" width="270" height="20" fill="#991B1B"/>
    <text x="135" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">3. Panic Escape (longjmp)</text>
    
    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Chef panics and jumps</text>
    <text x="25" y="125" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">  straight to exit (longjmp)</text>
    <text x="25" y="160" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Frees memory buffers</text>
    <text x="25" y="195" font-family="Arial, sans-serif" font-size="16" fill="#EF4444">- BUT forgets to clear</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="16" fill="#EF4444">  global pointer notes!</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Note still points to</text>
    <text x="25" y="295" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">freed table space.</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(990, 200)">
    <rect width="270" height="360" rx="16" fill="#0B132B" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="50" rx="16" fill="#5B21B6"/>
    <rect x="0" y="30" width="270" height="20" fill="#5B21B6"/>
    <text x="135" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">4. Kitchen Hijack (RCE)</text>
    
    <text x="25" y="90" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Next request arrives</text>
    <text x="25" y="125" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Places crafted shellcode</text>
    <text x="25" y="160" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">  in the old empty spot</text>
    <text x="25" y="195" font-family="Arial, sans-serif" font-size="16" fill="#CBD5E1">- Chef reads old note</text>
    <text x="25" y="230" font-family="Arial, sans-serif" font-size="16" fill="#A78BFA">- Executes attacker code!</text>
    <text x="25" y="270" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Full server control</text>
    <text x="25" y="295" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">achieved by attacker.</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M360, 380 L385, 380" stroke="#10B981" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M660, 380 L685, 380" stroke="#10B981" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M960, 380 L985, 380" stroke="#10B981" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- Footer Tip -->
  <rect x="90" y="595" width="1170" height="90" rx="14" fill="#022C22" stroke="#059669" stroke-width="2"/>
  <text x="120" y="635" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#34D399">The Golden Fix: Complete State Reset on Error</text>
  <text x="120" y="665" font-family="Arial, sans-serif" font-size="16" fill="#A7F3D0">The official patch in PHP 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 ensures all global pointers and structures are cleanly wiped when an OOM occurs.</text>
</svg>