<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="badPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="goodPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGlow7)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold">反爬对抗黑科技：传统自动化工具 vs feder-cr/dots C++ 补丁版 Firefox</text>
  <text x="600" y="85" text-anchor="middle" fill="#9ca3af" font-size="16">小学生打比方：头顶戴着“我是机器人”大帽子的铁皮人 vs 披着隐形斗篷、呼吸步态完全与真人一致的特工</text>

  <!-- Top Flow: Traditional Automation -->
  <g transform="translate(60, 120)">
    <rect width="1080" height="235" rx="14" fill="#1f2937" stroke="#ef4444" stroke-width="1.5" opacity="0.95"/>
    <text x="35" y="38" fill="#f87171" font-size="18" font-weight="bold">❌ 传统 Web 自动化路线（Selenium / Puppeteer / 标准 Playwright）</text>

    <!-- Node 1 -->
    <rect x="35" y="65" width="220" height="135" rx="10" fill="#111827" stroke="#374151"/>
    <text x="145" y="95" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="bold">Chrome DevTools (CDP)</text>
    <text x="145" y="125" text-anchor="middle" fill="#9ca3af" font-size="13">暴露 navigator.webdriver</text>
    <text x="145" y="150" text-anchor="middle" fill="#9ca3af" font-size="13">自动化全局标记泄漏</text>
    <text x="145" y="175" text-anchor="middle" fill="#ef4444" font-size="12">🚩 指纹漏洞百出</text>

    <!-- Arrow 1 -->
    <path d="M 265 132 L 315 132" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="290" y="122" text-anchor="middle" fill="#f87171" font-size="12">网络请求</text>

    <!-- Node 2 -->
    <rect x="325" y="65" width="220" height="135" rx="10" fill="#111827" stroke="#374151"/>
    <text x="435" y="95" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="bold">合成事件触发 (Dispatch)</text>
    <text x="435" y="125" text-anchor="middle" fill="#9ca3af" font-size="13">鼠标瞬间瞬移点击 (0ms)</text>
    <text x="435" y="150" text-anchor="middle" fill="#9ca3af" font-size="13">isTrusted=false 标记泄漏</text>
    <text x="435" y="175" text-anchor="middle" fill="#ef4444" font-size="12">🚩 行为特征极度异常</text>

    <!-- Arrow 2 -->
    <path d="M 555 132 L 605 132" stroke="#ef4444" stroke-width="2"/>
    <text x="580" y="122" text-anchor="middle" fill="#f87171" font-size="12">触碰风控</text>

    <!-- Node 3 -->
    <rect x="615" y="65" width="220" height="135" rx="10" fill="#111827" stroke="#374151"/>
    <text x="725" y="95" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="bold">Cloudflare / DataDome</text>
    <text x="725" y="125" text-anchor="middle" fill="#9ca3af" font-size="13">TLS 握手 JA3/JA4 探测</text>
    <text x="725" y="150" text-anchor="middle" fill="#9ca3af" font-size="13">Canvas / WebGL 随机噪点</text>
    <text x="725" y="175" text-anchor="middle" fill="#ef4444" font-size="12">🚩 瞬间判定为恶意脚本</text>

    <!-- Arrow 3 -->
    <path d="M 845 132 L 895 132" stroke="#ef4444" stroke-width="2"/>
    <text x="870" y="122" text-anchor="middle" fill="#f87171" font-size="12">阻断</text>

    <!-- Node 4 -->
    <rect x="905" y="65" width="140" height="135" rx="10" fill="#450a0a" stroke="#ef4444"/>
    <text x="975" y="115" text-anchor="middle" fill="#fca5a5" font-size="16" font-weight="bold">🚫 403 阻断</text>
    <text x="975" y="145" text-anchor="middle" fill="#f87171" font-size="13">智能体直接瘫痪</text>
  </g>

  <!-- Bottom Flow: feder-cr/dots -->
  <g transform="translate(60, 390)">
    <rect width="1080" height="235" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <text x="35" y="38" fill="#34d399" font-size="18" font-weight="bold">✅ feder-cr/dots 隐形架构（底层 C++ 补丁版 Firefox Gecko 引擎）</text>

    <!-- Node 1 -->
    <rect x="35" y="65" width="220" height="135" rx="10" fill="#062e24" stroke="#059669"/>
    <text x="145" y="95" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="bold">C++ 引擎级抹除特征</text>
    <text x="145" y="125" text-anchor="middle" fill="#9ca3af" font-size="13">彻底重写 Gecko 内部源码</text>
    <text x="145" y="150" text-anchor="middle" fill="#9ca3af" font-size="13">零自动化变量，指纹完全真实</text>
    <text x="145" y="175" text-anchor="middle" fill="#34d399" font-size="12">🛡️ 与正常人类安装版无异</text>

    <!-- Arrow 1 -->
    <path d="M 265 132 L 315 132" stroke="#10b981" stroke-width="2"/>
    <text x="290" y="122" text-anchor="middle" fill="#34d399" font-size="12">拟人操作</text>

    <!-- Node 2 -->
    <rect x="325" y="65" width="220" height="135" rx="10" fill="#062e24" stroke="#059669"/>
    <text x="435" y="95" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="bold">真实 OS 级交互 (Trusted)</text>
    <text x="435" y="125" text-anchor="middle" fill="#9ca3af" font-size="13">贝塞尔曲线平滑鼠标轨迹</text>
    <text x="435" y="150" text-anchor="middle" fill="#9ca3af" font-size="13">随机打字间隔 (50~150ms)</text>
    <text x="435" y="175" text-anchor="middle" fill="#34d399" font-size="12">🛡️ isTrusted 100% 真实</text>

    <!-- Arrow 2 -->
    <path d="M 555 132 L 605 132" stroke="#10b981" stroke-width="2"/>
    <text x="580" y="122" text-anchor="middle" fill="#34d399" font-size="12">风控核验</text>

    <!-- Node 3 -->
    <rect x="615" y="65" width="220" height="135" rx="10" fill="#062e24" stroke="#059669"/>
    <text x="725" y="95" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="bold">确定性硬件指纹 (Seed)</text>
    <text x="725" y="125" text-anchor="middle" fill="#9ca3af" font-size="13">--seed 绑定真实字体/显卡</text>
    <text x="725" y="150" text-anchor="middle" fill="#9ca3af" font-size="13">--profile-dir 保存登录 Cookie</text>
    <text x="725" y="175" text-anchor="middle" fill="#34d399" font-size="12">🛡️ 每次访问均被视作同一真人</text>

    <!-- Arrow 3 -->
    <path d="M 845 132 L 895 132" stroke="#10b981" stroke-width="2"/>
    <text x="870" y="122" text-anchor="middle" fill="#34d399" font-size="12">无感放行</text>

    <!-- Node 4 -->
    <rect x="905" y="65" width="140" height="135" rx="10" fill="#064e3b" stroke="#34d399"/>
    <text x="975" y="115" text-anchor="middle" fill="#a7f3d0" font-size="16" font-weight="bold">🎉 200 畅行</text>
    <text x="975" y="145" text-anchor="middle" fill="#34d399" font-size="13">多步骤长程任务稳定</text>
  </g>
</svg>