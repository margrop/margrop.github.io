<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGlow12)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold">跨平台落地：三大操作系统零依赖一键全自动部署架构</text>
  <text x="600" y="85" text-anchor="middle" fill="#9ca3af" font-size="16">纯原生脚本支持：Windows 11 (PowerShell 7) / Ubuntu 26.04 (Bash) / macOS 26 (Zsh)</text>

  <!-- 3 OS Cards -->
  <g transform="translate(60, 120)">
    <!-- Windows 11 Card -->
    <rect x="0" y="0" width="340" height="420" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="310" height="40" rx="8" fill="#0284c7" opacity="0.4"/>
    <text x="170" y="42" text-anchor="middle" fill="#38bdf8" font-size="17" font-weight="bold">🪟 Windows 11 26H2</text>
    <text x="25" y="85" fill="#f1f5f9" font-size="14" font-weight="bold">脚本：.ps1 (PowerShell 7/5.1)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="13">• 自动绕过 ExecutionPolicy 限制</text>
    <text x="25" y="136" fill="#94a3b8" font-size="13">• 探测 winget 与 Python 3.12+</text>
    <text x="25" y="160" fill="#94a3b8" font-size="13">• 一键配置 uv 与 feder-cr/dots</text>
    <text x="25" y="184" fill="#94a3b8" font-size="13">• 本地防火墙入站端口检测 (8765)</text>
    <text x="25" y="208" fill="#94a3b8" font-size="13">• 注册 Windows 后台计划任务</text>

    <rect x="25" y="240" width="290" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="268" fill="#38bdf8" font-size="12" font-family="monospace"># 人工一键启动交互模式</text>
    <text x="35" y="290" fill="#e2e8f0" font-size="12" font-family="monospace">.\openai_dots_oss_windows11.ps1</text>
    <text x="35" y="325" fill="#34d399" font-size="12" font-family="monospace"># Agent 全自动静默模式</text>
    <text x="35" y="347" fill="#e2e8f0" font-size="11" font-family="monospace">.\openai_dots_oss_windows11.ps1 `</text>
    <text x="45" y="367" fill="#e2e8f0" font-size="11" font-family="monospace">  -AgentMode -Port 8765</text>

    <!-- Ubuntu Card -->
    <rect x="370" y="0" width="340" height="420" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <rect x="385" y="15" width="310" height="40" rx="8" fill="#ea580c" opacity="0.4"/>
    <text x="540" y="42" text-anchor="middle" fill="#fb923c" font-size="17" font-weight="bold">🐧 Ubuntu 26.04 LTS</text>
    <text x="395" y="85" fill="#f1f5f9" font-size="14" font-weight="bold">脚本：.sh (POSIX/Bash 原生)</text>
    <text x="395" y="112" fill="#94a3b8" font-size="13">• 检测 apt 镜像源与 python3-venv</text>
    <text x="395" y="136" fill="#94a3b8" font-size="13">• 自动拉取 uv 官方一键脚本</text>
    <text x="395" y="160" fill="#94a3b8" font-size="13">• 生成 systemd 守护进程单元</text>
    <text x="395" y="184" fill="#94a3b8" font-size="13">• 支持 Headless 无头隐形模式</text>
    <text x="395" y="208" fill="#94a3b8" font-size="13">• 零外部依赖，纯原生命令</text>

    <rect x="395" y="240" width="290" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="405" y="268" fill="#fb923c" font-size="12" font-family="monospace"># 人工一键启动交互模式</text>
    <text x="405" y="290" fill="#e2e8f0" font-size="12" font-family="monospace">bash openai_dots_oss_ubuntu.sh</text>
    <text x="405" y="325" fill="#34d399" font-size="12" font-family="monospace"># Agent 全自动静默模式</text>
    <text x="405" y="347" fill="#e2e8f0" font-size="11" font-family="monospace">bash openai_dots_oss_ubuntu.sh \</text>
    <text x="415" y="367" fill="#e2e8f0" font-size="11" font-family="monospace">  --agent-mode --port 8765</text>

    <!-- macOS Card -->
    <rect x="740" y="0" width="340" height="420" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="755" y="15" width="310" height="40" rx="8" fill="#9333ea" opacity="0.4"/>
    <text x="910" y="42" text-anchor="middle" fill="#c084fc" font-size="17" font-weight="bold">🍎 macOS 26 (Apple Silicon)</text>
    <text x="765" y="85" fill="#f1f5f9" font-size="14" font-weight="bold">脚本：.zsh (macOS 原生 Zsh)</text>
    <text x="765" y="112" fill="#94a3b8" font-size="13">• 检测 Xcode Command Line Tools</text>
    <text x="765" y="136" fill="#94a3b8" font-size="13">• 探测 Homebrew 与 uv 环境</text>
    <text x="765" y="160" fill="#94a3b8" font-size="13">• 配置 launchd 用户守护 plist</text>
    <text x="765" y="184" fill="#94a3b8" font-size="13">• 支持 Keychain 凭据安全存储</text>
    <text x="765" y="208" fill="#94a3b8" font-size="13">• 自动管理常驻后台 24 小时进程</text>

    <rect x="765" y="240" width="290" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="775" y="268" fill="#c084fc" font-size="12" font-family="monospace"># 人工一键启动交互模式</text>
    <text x="775" y="290" fill="#e2e8f0" font-size="12" font-family="monospace">zsh openai_dots_oss_macos.zsh</text>
    <text x="775" y="325" fill="#34d399" font-size="12" font-family="monospace"># Agent 全自动静默模式</text>
    <text x="775" y="347" fill="#e2e8f0" font-size="11" font-family="monospace">zsh openai_dots_oss_macos.zsh \</text>
    <text x="785" y="367" fill="#e2e8f0" font-size="11" font-family="monospace">  --agent-mode --port 8765</text>
  </g>

  <!-- Bottom Common Bar -->
  <g transform="translate(60, 565)">
    <rect width="1080" height="75" rx="10" fill="#111827" stroke="#374151"/>
    <text x="540" y="30" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">🎯 双重落地范式：人类一键向导交互 + AI 智能体/DevOps 声明式自动化</text>
    <text x="540" y="55" text-anchor="middle" fill="#9ca3af" font-size="13">全自动化环境探测与自愈 · 零第三方外部依赖 · 结构化 JSON 状态输出 · 自动守护运行</text>
  </g>
</svg>