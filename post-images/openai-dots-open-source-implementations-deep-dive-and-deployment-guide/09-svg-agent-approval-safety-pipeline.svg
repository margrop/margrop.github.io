<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGlow9)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold">安全与人机协作：Open-Dots 三级权限审批闸口机制</text>
  <text x="600" y="85" text-anchor="middle" fill="#9ca3af" font-size="16">生活大比方：家庭机器人的电子锁权限——拿抹布擦桌子自己做，动抽屉现金必须向主人手机弹窗请示</text>

  <!-- Flow chart -->
  <g transform="translate(60, 130)">
    <!-- Stage 1: User Request -->
    <rect x="0" y="180" width="180" height="100" rx="10" fill="#1f2937" stroke="#4b5563"/>
    <text x="90" y="225" text-anchor="middle" fill="#f3f4f6" font-size="16" font-weight="bold">用户长程目标</text>
    <text x="90" y="250" text-anchor="middle" fill="#9ca3af" font-size="13">"整理收件箱并重构项目"</text>

    <!-- Arrow 1 -->
    <path d="M 180 230 L 240 230" stroke="#60a5fa" stroke-width="2"/>

    <!-- Stage 2: Intent Classifier / Guard Model -->
    <rect x="240" y="150" width="220" height="160" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="350" y="185" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="bold">意图分流与风控模型</text>
    <text x="350" y="210" text-anchor="middle" fill="#cbd5e1" font-size="13">Guardrails Classifier</text>
    <text x="350" y="240" text-anchor="middle" fill="#94a3b8" font-size="12">基于动作危害等级</text>
    <text x="350" y="265" text-anchor="middle" fill="#94a3b8" font-size="12">对 Tool Call 进行语义评级</text>

    <!-- Divergence Arrows -->
    <path d="M 460 190 L 540 100" stroke="#10b981" stroke-width="2"/>
    <path d="M 460 230 L 540 230" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 460 270 L 540 360" stroke="#ef4444" stroke-width="2"/>

    <!-- Tier 1: Low Risk -->
    <rect x="540" y="40" width="250" height="110" rx="10" fill="#064e3b" stroke="#10b981"/>
    <text x="665" y="72" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold">🟢 级别 1：只读无损操作</text>
    <text x="665" y="98" text-anchor="middle" fill="#e2e8f0" font-size="13">网络搜索、查询邮件、读文件</text>
    <text x="665" y="122" text-anchor="middle" fill="#a7f3d0" font-size="12">无需审批，后台静默自动执行</text>

    <!-- Tier 2: Medium Risk -->
    <rect x="540" y="180" width="250" height="110" rx="10" fill="#451a03" stroke="#f59e0b"/>
    <text x="665" y="212" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold">🟡 级别 2：有限环境变更</text>
    <text x="665" y="238" text-anchor="middle" fill="#e2e8f0" font-size="13">起草草稿、更新待办卡片、暂存代码</text>
    <text x="665" y="262" text-anchor="middle" fill="#fde68a" font-size="12">静默运行并记录可回滚日志</text>

    <!-- Tier 3: High Risk -->
    <rect x="540" y="320" width="250" height="110" rx="10" fill="#450a0a" stroke="#ef4444"/>
    <text x="665" y="352" text-anchor="middle" fill="#f87171" font-size="15" font-weight="bold">🔴 级别 3：高危破坏性操作</text>
    <text x="665" y="378" text-anchor="middle" fill="#e2e8f0" font-size="13">执行 Shell、删除文件、资金支付</text>
    <text x="665" y="402" text-anchor="middle" fill="#fca5a5" font-size="12">强制拦截！等待人类交互审批</text>

    <!-- Arrow from Tier 3 to Approval Modal -->
    <path d="M 790 375 L 860 375" stroke="#ef4444" stroke-width="2"/>

    <!-- Approval Modal Card -->
    <rect x="860" y="280" width="220" height="180" rx="12" fill="#18181b" stroke="#f43f5e" stroke-width="2"/>
    <text x="970" y="315" text-anchor="middle" fill="#f43f5e" font-size="16" font-weight="bold">⚠️ 人机交互审批卡片</text>
    <text x="970" y="342" text-anchor="middle" fill="#e4e4e7" font-size="12">"Agent 申请执行:"</text>
    <rect x="880" y="355" width="180" height="35" rx="6" fill="#27272a"/>
    <text x="970" y="377" text-anchor="middle" fill="#f87171" font-size="12">rm -rf /dist/release</text>
    <rect x="885" y="405" width="80" height="35" rx="6" fill="#10b981"/>
    <text x="925" y="427" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">批准</text>
    <rect x="985" y="405" width="80" height="35" rx="6" fill="#ef4444"/>
    <text x="1025" y="427" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">拒绝</text>

    <!-- Execution result -->
    <path d="M 790 95 L 940 95 L 940 250" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="940" cy="250" r="5" fill="#10b981"/>
  </g>
</svg>