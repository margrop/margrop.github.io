<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="cardLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGlow)"/>

  <text x="600" y="52" text-anchor="middle" fill="#f9fafb" font-size="28" font-weight="bold" letter-spacing="1">深度对比：OpenAI 官方 dots vs 开源 Open-Dots 本地私有化生态</text>
  <text x="600" y="85" text-anchor="middle" fill="#9ca3af" font-size="16">生活大比方：五星级酒店包月客房与高昂托管服务 vs 自家私人庭院配置全能智能管家</text>

  <!-- Left Card: OpenAI Dots -->
  <g transform="translate(60, 115)">
    <rect width="510" height="525" rx="16" fill="url(#cardLeft)" stroke="#374151" stroke-width="1.5"/>
    <rect x="25" y="25" width="460" height="42" rx="8" fill="#374151" opacity="0.6"/>
    <text x="255" y="52" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold">🔒 OpenAI 官方 dots（闭源全托管云端电脑）</text>

    <g transform="translate(25, 90)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">1</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">运行环境：专属云端虚拟机（外人掌控）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">运行在 OpenAI 托管云上，无法访问本地局域网私有资产。</text>
    </g>

    <g transform="translate(25, 165)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">2</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">模型绑定：仅限 GPT-6 Astra（闭源黑盒）</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">无法切换到本地开源模型（如 DeepSeek/Qwen），无微调自由。</text>
    </g>

    <g transform="translate(25, 240)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">3</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">订阅天花板：每月 $100~$200 高昂账单</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">必须订阅 ChatGPT Pro 或 Business，多开助理费用成倍暴涨。</text>
    </g>

    <g transform="translate(25, 315)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">4</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">合规与地域限制：欧盟/英国强制拦截</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">EEA/UK 地区无法使用；代码与文件全部经过第三方云端存储。</text>
    </g>

    <g transform="translate(25, 390)">
      <circle cx="15" cy="18" r="12" fill="#ef4444" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold">5</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">浏览器能力：云端无痕沙箱，极易被反爬封禁</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">遇到 Cloudflare 等验证码无法人工无缝接管登录状态。</text>
    </g>
  </g>

  <!-- Right Card: Open-Dots -->
  <g transform="translate(630, 115)">
    <rect width="510" height="525" rx="16" fill="url(#cardRight)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="25" y="25" width="460" height="42" rx="8" fill="#1e3a8a" opacity="0.5"/>
    <text x="255" y="52" text-anchor="middle" fill="#38bdf8" font-size="18" font-weight="bold">🚀 开源 Dots 生态（本地全掌控 + 任意模型自由）</text>

    <g transform="translate(25, 90)">
      <circle cx="15" cy="18" r="12" fill="#10b981" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">1</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">运行环境：本机宿主 / 本地 Docker 容器</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">数据 100% 留在自家机器，无缝访问内网 NAS、数据库与本地代码。</text>
    </g>

    <g transform="translate(25, 165)">
      <circle cx="15" cy="18" r="12" fill="#10b981" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">2</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">模型自选：Ollama / vLLM / OpenRouter / DeepSeek</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">随意更换思考引擎，支持高隐私离线本地大模型与性价比 API。</text>
    </g>

    <g transform="translate(25, 240)">
      <circle cx="15" cy="18" r="12" fill="#10b981" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">3</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">成本归零：核心软件 MIT 开源，零订阅费</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">无需向官方支付每月数百美元月费，按需按 token 极低成本调用。</text>
    </g>

    <g transform="translate(25, 315)">
      <circle cx="15" cy="18" r="12" fill="#10b981" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">4</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">人机安全闸口：高危操作强制人工审批</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">删除文件、执行命令、对外发信必须在卡片弹窗点击“确认”。</text>
    </g>

    <g transform="translate(25, 390)">
      <circle cx="15" cy="18" r="12" fill="#10b981" opacity="0.2"/>
      <text x="15" y="23" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">5</text>
      <text x="40" y="20" fill="#f3f4f6" font-size="16" font-weight="bold">魔改隐形内核：C++ 补丁版 Firefox 绕过反爬</text>
      <text x="40" y="42" fill="#9ca3af" font-size="14">原生 OS 级鼠标事件与指纹持久化，Cloudflare 误判率趋近于 0。</text>
    </g>
  </g>
</svg>