<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="gate-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="flow-arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#gate-bg)"/>

  <!-- Title -->
  <text x="80" y="60" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">iOS 27.3 Apple Intelligence 四重门禁鉴权架构</text>
  <text x="80" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#8b949e">解构苹果在 iOS 27.3 中针对国行设备设置的层级校验：只要命中任意一道红线，系统便返回 0x4102 状态码</text>

  <!-- 4 Verification Layers -->
  <!-- Layer 1: Hardware SKU -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="40" rx="12" fill="#21262d"/>
    <rect x="0" y="28" width="300" height="12" fill="#21262d"/>
    <text x="16" y="26" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">第一道门：硬件销售地 (SKU)</text>
    <text x="20" y="70" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">MobileGestalt.plist</text>
    <text x="20" y="95" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">RegionCode: "CH"</text>
    <text x="20" y="118" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">ModelNumber: "MYWW3CH/A"</text>
    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#ff7b72" font-weight="bold">硬编码特征：物理主板出厂固化</text>
  </g>

  <!-- Layer 2: Baseband & Carrier -->
  <g transform="translate(420, 140)">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="40" rx="12" fill="#21262d"/>
    <rect x="0" y="28" width="300" height="12" fill="#21262d"/>
    <text x="16" y="26" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#ff7b72">第二道门：基带蜂窝网络</text>
    <text x="20" y="70" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">CommCenter Baseband Trace</text>
    <text x="20" y="95" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">SIM MCC: 460 (中国三大运营商)</text>
    <text x="20" y="118" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">Cellular PLMN: 46000 / 46001</text>
    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#ff7b72" font-weight="bold">实时信令：基站物理位置不可伪造</text>
  </g>

  <!-- Layer 3: Geolocation & Wi-Fi -->
  <g transform="translate(760, 140)">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="40" rx="12" fill="#21262d"/>
    <rect x="0" y="28" width="300" height="12" fill="#21262d"/>
    <text x="16" y="26" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#d29922">第三道门：物理环境探针</text>
    <text x="20" y="70" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">locationd &amp; WiFiFramework</text>
    <text x="20" y="95" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">Wi-Fi 802.11d Beacon: "CN"</text>
    <text x="20" y="118" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">BSSID Trianulation: China mainland</text>
    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#d29922" font-weight="bold">周边扫描：飞行模式亦可通过信标探测</text>
  </g>

  <!-- Layer 4: Apple ID Account -->
  <g transform="translate(1100, 140)">
    <rect x="0" y="0" width="260" height="180" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="40" rx="12" fill="#21262d"/>
    <rect x="0" y="28" width="260" height="12" fill="#21262d"/>
    <text x="16" y="26" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#a371f7">第四道门：账号云端属性</text>
    <text x="20" y="70" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">Accounts.framework</text>
    <text x="20" y="95" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">Storefront: 143465 (CN)</text>
    <text x="20" y="118" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#c9d1d9">Billing Country: CHN</text>
    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#a371f7" font-weight="bold">云端账单：决定 Private Cloud 节点</text>
  </g>

  <!-- Middle Core Evaluator: eligibilityd -->
  <g transform="translate(80, 370)">
    <rect x="0" y="0" width="1280" height="220" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="40" y="45" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#58a6ff">中枢仲裁引擎：/usr/libexec/eligibilityd (Domain 41: OS_ELIGIBILITY_DOMAIN_GREYMATTER)</text>
    <line x1="40" y1="65" x2="1240" y2="65" stroke="#30363d" stroke-width="1"/>

    <!-- Left Box: Ineligible Default -->
    <rect x="40" y="85" width="570" height="110" rx="8" fill="#21262d"/>
    <text x="60" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#ff7b72">国行出厂未处理（默认阻断流）：</text>
    <text x="60" y="142" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#8b949e">Input: [DeviceRegionCode == "CH"] -> Status: 0x4102 (INELIGIBLE)</text>
    <text x="60" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#f85149">结果：设置页面置灰，写作工具/Siri流光完全锁定，候补名单拒绝加入</text>

    <!-- Right Box: Policy Overridden -->
    <rect x="670" y="85" width="570" height="110" rx="8" fill="#21262d"/>
    <text x="690" y="115" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#3fb950">自动化脚本无损配置后（合规破局流）：</text>
    <text x="690" y="142" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#8b949e">PolicyCache: [Domain 41 Status: ELIGIBLE] -> Answer: 0x0000 (PASSED)</text>
    <text x="690" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#3fb950">结果：全量激活端侧 3.8B 语言模型，解锁写作工具、Clean Up 与动态光晕</text>
  </g>

  <!-- Bottom Result Pathways -->
  <g transform="translate(80, 640)">
    <!-- Path A: Local On-Device -->
    <rect x="0" y="0" width="400" height="200" rx="12" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
    <text x="24" y="36" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#3fb950">通道 A：端侧神经引擎 (AFM 3.8B)</text>
    <text x="24" y="66" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 零网络依赖，100% 隐私在设备本地</text>
    <text x="24" y="92" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 文本校对、智能总结、智能回复、照片擦除</text>
    <text x="24" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 算力消耗：A17 Pro / A18 / A19 NPU 满血运行</text>
    <rect x="24" y="145" width="352" height="35" rx="6" fill="#238636" fill-opacity="0.2"/>
    <text x="200" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">✓ 本地 0ms 延迟 · 飞行模式正常使用</text>

    <!-- Path B: Domestic Compliant Cloud -->
    <rect x="440" y="0" width="400" height="200" rx="12" fill="#1c2128" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="464" y="36" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#58a6ff">通道 B：国内合规私有网关 (备案大模型)</text>
    <text x="464" y="66" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 协同百度文心 / 阿里通义千问等备案云端模型</text>
    <text x="464" y="92" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 处理长文档多模态深度理解、中国文化问答</text>
    <text x="464" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 数据不出境，符合网信办深度合成算法备案</text>
    <rect x="464" y="145" width="352" height="35" rx="6" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="640" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">✓ 官方合规链路 · 安全沙盒数据隔离</text>

    <!-- Path C: Global Private Cloud Compute -->
    <rect x="880" y="0" width="400" height="200" rx="12" fill="#1c2128" stroke="#a371f7" stroke-width="1.5"/>
    <text x="904" y="36" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#a371f7">通道 C：全球 Private Cloud Compute (PCC)</text>
    <text x="904" y="66" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 苹果海外自研安全集群 (Apple Silicon 服务器)</text>
    <text x="904" y="92" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 运行 70B+ AFM 大模型与 ChatGPT-5 插件集成</text>
    <text x="904" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 国行设备需切换全球账号与网络协议栈访问</text>
    <rect x="904" y="145" width="352" height="35" rx="6" fill="#8957e5" fill-opacity="0.2"/>
    <text x="1080" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">⚡ 极客满血能力 · 跨国复杂推理</text>
  </g>
</svg>