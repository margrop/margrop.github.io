<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880">
  <defs>
    <linearGradient id="pip-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#pip-bg)"/>

  <!-- Title -->
  <text x="80" y="60" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">iOS 27.3 端云协同混合推理管线 (Hybrid Inference Pipeline)</text>
  <text x="80" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#8b949e">从用户发起意图到端侧 NPU 分流、合规云端模型中继与私有云计算的全流程逻辑链路</text>

  <!-- Left: User Interaction Block -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="240" height="660" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="24" y="45" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">用户交互发起点</text>
    <line x1="24" y1="65" x2="216" y2="65" stroke="#30363d" stroke-width="1"/>

    <!-- 4 User Entrypoints -->
    <rect x="20" y="90" width="200" height="110" rx="10" fill="#21262d"/>
    <text x="36" y="125" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">1. 写作工具</text>
    <text x="36" y="152" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 文本智能重写</text>
    <text x="36" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 语法校对与总结</text>

    <rect x="20" y="220" width="200" height="110" rx="10" fill="#21262d"/>
    <text x="36" y="255" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#a371f7">2. 新版 Siri 交互</text>
    <text x="36" y="282" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 屏幕内容深度感知</text>
    <text x="36" y="304" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 跨应用协同操作</text>

    <rect x="20" y="350" width="200" height="110" rx="10" fill="#21262d"/>
    <text x="36" y="385" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#3fb950">3. 照片 Clean Up</text>
    <text x="36" y="412" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 杂物智能识别涂抹</text>
    <text x="36" y="434" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 背景神经修补补全</text>

    <rect x="20" y="480" width="200" height="110" rx="10" fill="#21262d"/>
    <text x="36" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#d29922">4. 通知优先级智能</text>
    <text x="36" y="542" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 摘要长篇群聊信息</text>
    <text x="36" y="564" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9">· 紧急事项置顶提醒</text>
  </g>

  <!-- Middle: Semantic Router & Orchestrator -->
  <g transform="translate(360, 150)">
    <rect x="0" y="0" width="340" height="660" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="24" y="45" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff">端侧语义路由器 (Orchestrator)</text>
    <text x="24" y="72" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8b949e">A18 Pro / A19 Neural Engine Subsystem</text>
    <line x1="24" y1="90" x2="316" y2="90" stroke="#30363d" stroke-width="1"/>

    <!-- Router Logic Steps -->
    <rect x="20" y="110" width="300" height="120" rx="10" fill="#21262d"/>
    <text x="36" y="140" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">阶段 1：复杂度与敏感度评估</text>
    <text x="36" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">· 检查文本长度、隐私敏感度与计算预算</text>
    <text x="36" y="195" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">· 判断是否需要外部世界事实知识库</text>

    <!-- Branch Decision Diamond -->
    <rect x="40" y="260" width="260" height="130" rx="12" fill="#1c2128" stroke="#d29922" stroke-width="1.5"/>
    <text x="170" y="295" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#e3b341" text-anchor="middle">分流决策路由</text>
    <text x="170" y="325" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#c9d1d9" text-anchor="middle">是否可由端侧 3.8B 参数满足？</text>
    <text x="170" y="355" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#3fb950" font-weight="bold" text-anchor="middle">YES ➔ 走分支 A (本地推理)</text>
    <text x="170" y="375" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#58a6ff" font-weight="bold" text-anchor="middle">NO  ➔ 走分支 B/C (云端中继)</text>

    <!-- Privacy Shield -->
    <rect x="20" y="420" width="300" height="210" rx="10" fill="#21262d"/>
    <text x="36" y="455" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="bold" fill="#3fb950">隐私安全防护盾 (Privacy Shield)</text>
    <text x="36" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">· 本地个人语义索引 (Semantic Index)</text>
    <text x="36" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">· 数据脱敏引擎：消除联系人手机/密码</text>
    <text x="36" y="545" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">· 云端只接收匿名化意图，不留痕迹</text>
    <rect x="36" y="575" width="268" height="35" rx="6" fill="#238636" fill-opacity="0.2"/>
    <text x="170" y="598" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">100% 硬件隔离安全沙盒</text>
  </g>

  <!-- Right: 3 Inference Engines -->
  <g transform="translate(740, 150)">
    <!-- Engine 1: On Device NPU -->
    <rect x="0" y="0" width="620" height="195" rx="16" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="40" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#3fb950" text-anchor="middle">A</text>
    <text x="75" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">端侧本地模型：Apple Foundation Model (3.8B AFM)</text>
    <text x="24" y="90" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 运行位置：iPhone 本地神经引擎 (16-core Neural Engine) + 4GB 专用显存</text>
    <text x="24" y="118" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 性能指标：首次响应延迟 &lt; 25ms，处理速度 38 tokens/s，零流量消耗</text>
    <text x="24" y="146" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#3fb950" font-weight="bold">· 适用场景：邮件重写、信息摘要、照片抠图、Siri 本机系统操作指令</text>

    <!-- Engine 2: Domestic Licensed Cloud -->
    <rect x="0" y="225" width="620" height="195" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="20" y="245" width="40" height="40" rx="8" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="40" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#58a6ff" text-anchor="middle">B</text>
    <text x="75" y="271" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">国内合规中继云：百度文心 / 阿里通义千问备案模型</text>
    <text x="24" y="315" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 运行位置：国内高等级安全数据中心 (网信办深度合成算法备案)</text>
    <text x="24" y="343" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 传输保障：双向证书绑定 (Certificate Pinning)，阅后即焚，不存日志</text>
    <text x="24" y="371" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#58a6ff" font-weight="bold">· 适用场景：全网实时信息搜索、中文复杂诗词文化问答、超长文档跨模态理解</text>

    <!-- Engine 3: Private Cloud Compute -->
    <rect x="0" y="450" width="620" height="210" rx="16" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <rect x="20" y="470" width="40" height="40" rx="8" fill="#8957e5" fill-opacity="0.2"/>
    <text x="40" y="496" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#a371f7" text-anchor="middle">C</text>
    <text x="75" y="496" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">全球私有云计算：Private Cloud Compute (70B+ AFM)</text>
    <text x="24" y="540" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 运行位置：苹果自研 Apple Silicon 服务器，定制硬核安全隔离操作系统</text>
    <text x="24" y="568" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 校验特性：公钥可验证证明 (Verifiable Transparency Log)，第三方安全审计</text>
    <text x="24" y="596" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#a371f7" font-weight="bold">· 极客破局：国行手机经本教程工具无损激活后，可自由解锁该通道接入能力</text>
  </g>
</svg>