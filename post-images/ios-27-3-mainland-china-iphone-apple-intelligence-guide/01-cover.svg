<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff375f"/>
      <stop offset="20%" stop-color="#ff9f0a"/>
      <stop offset="40%" stop-color="#ffd60a"/>
      <stop offset="60%" stop-color="#30d158"/>
      <stop offset="80%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Top Rainbow Glow Line -->
  <rect x="0" y="0" width="100%" height="6" fill="url(#ai-glow)"/>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badges -->
    <rect x="0" y="0" width="170" height="34" rx="8" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1.5"/>
    <text x="85" y="22" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">iOS 27.3 全景深度剖析</text>

    <rect x="185" y="0" width="160" height="34" rx="8" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="1.5"/>
    <text x="265" y="22" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">国行 iPhone 破局指南</text>

    <rect x="360" y="0" width="180" height="34" rx="8" fill="#a371f7" fill-opacity="0.2" stroke="#8957e5" stroke-width="1.5"/>
    <text x="450" y="22" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#bc8cff" text-anchor="middle">三端全自动一键配置</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="Noto Sans CJK SC, sans-serif" font-size="44" font-weight="bold" fill="#ffffff">iOS 27.3 国行 iPhone 苹果智能全景实测与破局</text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#8b949e">解构四重门禁鉴权 · 拆解端云协同合规模型 · 附三大系统（Win11/Ubuntu/macOS）一键自动化配置工具</text>
  </g>

  <!-- 4 Main Architecture Cards -->
  <g transform="translate(80, 260)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="295" height="420" rx="16" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="44" y="52" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#58a6ff" text-anchor="middle">1</text>
    <text x="20" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">硬件身份门禁</text>
    <text x="20" y="135" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#58a6ff">MobileGestalt (CH/A)</text>
    <line x1="20" y1="155" x2="275" y2="155" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="185" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 锁定出厂销售地区代码</text>
    <text x="20" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 芯片级神经引擎 38 TOPS</text>
    <text x="20" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 无法仅靠改语言解锁</text>
    <rect x="20" y="340" width="255" height="45" rx="8" fill="#161b22"/>
    <text x="147" y="368" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">底层文件: MobileGestalt.plist</text>

    <!-- Card 2 -->
    <rect x="325" y="0" width="295" height="420" rx="16" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="345" y="20" width="48" height="48" rx="12" fill="#ff7b72" fill-opacity="0.2"/>
    <text x="369" y="52" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#ff7b72" text-anchor="middle">2</text>
    <text x="345" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">网络基站地理围栏</text>
    <text x="345" y="135" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#ff7b72">MCC 460 / 802.11d</text>
    <line x1="345" y1="155" x2="600" y2="155" stroke="#30363d" stroke-width="1"/>
    <text x="345" y="185" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 运营商蜂窝基站代码校验</text>
    <text x="345" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· Wi-Fi 信标国家码探针</text>
    <text x="345" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 纯代理网络无法穿透</text>
    <rect x="345" y="340" width="255" height="45" rx="8" fill="#161b22"/>
    <text x="472" y="368" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">基带守护: CommCenter &amp; locationd</text>

    <!-- Card 3 -->
    <rect x="650" y="0" width="295" height="420" rx="16" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="670" y="20" width="48" height="48" rx="12" fill="#d29922" fill-opacity="0.2"/>
    <text x="694" y="52" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#d29922" text-anchor="middle">3</text>
    <text x="670" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">资格判定状态机</text>
    <text x="670" y="135" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#d29922">eligibilityd (Domain 41)</text>
    <line x1="670" y1="155" x2="925" y2="155" stroke="#30363d" stroke-width="1"/>
    <text x="670" y="185" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· GREYMATTER 策略路由引擎</text>
    <text x="670" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 动态计算 Ineligible 码</text>
    <text x="670" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 阻断设置面板开启入口</text>
    <rect x="670" y="340" width="255" height="45" rx="8" fill="#161b22"/>
    <text x="797" y="368" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">核心守护: /usr/libexec/eligibilityd</text>

    <!-- Card 4 -->
    <rect x="975" y="0" width="295" height="420" rx="16" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5"/>
    <rect x="995" y="20" width="48" height="48" rx="12" fill="#3fb950" fill-opacity="0.2"/>
    <text x="1019" y="52" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="bold" fill="#3fb950" text-anchor="middle">4</text>
    <text x="995" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">端云协同合规路由</text>
    <text x="995" y="135" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#3fb950">AFM 3.8B + Domestic LLM</text>
    <line x1="995" y1="155" x2="1250" y2="155" stroke="#30363d" stroke-width="1"/>
    <text x="995" y="185" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 端侧基础模型本地快速响应</text>
    <text x="995" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 国内备案云端模型协同接入</text>
    <text x="995" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#c9d1d9">· 私有云计算 PCC 隔离机制</text>
    <rect x="995" y="340" width="255" height="45" rx="8" fill="#161b22"/>
    <text x="1122" y="368" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">模型架构: Hybrid On-Device &amp; Cloud</text>
