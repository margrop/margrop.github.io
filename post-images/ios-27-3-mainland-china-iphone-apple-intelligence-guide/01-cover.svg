  <!-- Bottom Banner -->
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="1280" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="30" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">全自动交付清单：</text>
    <text x="180" y="42" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#e6edf3">ios_ai_toolkit_windows11.ps1  |  ios_ai_toolkit_ubuntu2604.sh  |  ios_ai_toolkit_macos27.zsh</text>
    <text x="1120" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#3fb950" font-weight="bold">✓ 零外部依赖 · 官方协议</text>
  </g>
