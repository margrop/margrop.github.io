<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920">
  <defs>
    <linearGradient id="an-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="act1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="act2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="act3-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#an-bg)"/>

  <!-- Title Section -->
  <text x="80" y="60" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">小学生秒懂的生活大比方：三幕大戏讲透 iOS 27.3 苹果智能</text>
  <text x="80" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#8b949e">不用晦涩的代码与枯燥的协议术语，用日常身边的三幕生活大戏，带你 100% 搞懂门禁原理与破解逻辑</text>

  <!-- Act 1 -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="1280" height="220" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="220" rx="4" fill="url(#act1-grad)"/>

    <rect x="30" y="25" width="120" height="32" rx="6" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="90" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff" text-anchor="middle">第一幕 · 身份篇</text>

    <text x="170" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">游乐园年卡与身份证上的“籍贯印章”</text>

    <!-- Analogy content -->
    <text x="30" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">【通俗比方】 小明买了一张世界顶级游乐园（Apple Intelligence）的畅玩 VIP 年卡（iPhone 16/17 Pro 手机）。但游乐园在发卡时，</text>
    <text x="30" y="125" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">在卡面右下角用红色墨水盖上了一个“某地特供版”钢印（国行 CH/A）。小明即便自己学了一口流利的英语、穿上了西装（修改语言和地区），</text>
    <text x="30" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">检票口的阿姨拿起卡片往紫外灯下一照，看到那个特供印章，立马摇头：“小朋友，这个专属通道针对特供卡暂时没开通，请走普通通道！”</text>

    <!-- Technical counterpart -->
    <rect x="30" y="175" width="1220" height="32" rx="6" fill="#0d1117"/>
    <text x="45" y="196" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#58a6ff">对应硬核技术：系统底层 MobileGestalt 硬件注册表中的 RegionCode: CH 属于出厂烧录属性，纯软件切换语言无法绕过。</text>
  </g>

  <!-- Act 2 -->
  <g transform="translate(80, 390)">
    <rect x="0" y="0" width="1280" height="220" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="220" rx="4" fill="url(#act2-grad)"/>

    <rect x="30" y="25" width="120" height="32" rx="6" fill="#d29922" fill-opacity="0.2"/>
    <text x="90" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#e3b341" text-anchor="middle">第二幕 · 侦测篇</text>

    <text x="170" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">考场大厅里无死角的三道“防作弊安检门”</text>

    <!-- Analogy content -->
    <text x="30" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">【通俗比方】 很多同学以为“只要挂个外国梯子，不就能假装自己在加州了吗？”这就好比进考场时，门口站着三位铁面无私的安检大爷：</text>
    <text x="30" y="125" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">第一位大爷看准考证（手机硬件型号）；第二位大爷拿着金属探测仪，听你口袋里手机连的是哪个基站信号（SIM 卡 MCC 460）；</text>
    <text x="30" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">第三位大爷侧耳倾听考场周围其他考生的口音（Wi-Fi 信标广播国家码）。三位大爷一旦有一位对不上号，大门当场“哔哔”红灯报警！</text>

    <!-- Technical counterpart -->
    <rect x="30" y="175" width="1220" height="32" rx="6" fill="#0d1117"/>
    <text x="45" y="196" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#e3b341">对应硬核技术：iOS 27.3 采用多维交叉验证 (eligibilityd 聚合 Baseband MCC、Wi-Fi 802.11d 国家码与账号 Storefront)。</text>
  </g>

  <!-- Act 3 -->
  <g transform="translate(80, 640)">
    <rect x="0" y="0" width="1280" height="220" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="220" rx="4" fill="url(#act3-grad)"/>

    <rect x="30" y="25" width="120" height="32" rx="6" fill="#2ea043" fill-opacity="0.2"/>
    <text x="90" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">第三幕 · 协同篇</text>

    <text x="170" y="48" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">私人厨房大厨切配与星级外卖中央厨房</text>

    <!-- Analogy content -->
    <text x="30" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">【通俗比方】 手机里的 AI 并不是一个孤零零的机器人，而是一对“黄金搭档”：你家里厨房住着一位动作极快的手工大厨（端侧 3.8B 大模型），</text>
    <text x="30" y="125" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">他熟悉你所有的私人喜好，改写短邮件、修剪照片几毫秒就搞定，食材（私人数据）绝对不出家门；但当你需要准备一桌国宴大餐（超长复杂总结）时，</text>
    <text x="30" y="155" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#c9d1d9">大厨会把菜谱匿名打包，快送给由安全锁密封的中央合规大厨房（私有云计算与国内备案模型），做完菜立即销毁底稿，绝不偷看隐私！</text>

    <!-- Technical counterpart -->
    <rect x="30" y="175" width="1220" height="32" rx="6" fill="#0d1117"/>
    <text x="45" y="196" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#3fb950">对应硬核技术：端云协同混合架构（Hybrid Inference Pipeline），本地神经引擎优先运算，复杂任务走 PCC 零日志加密通道。</text>
  </g>
</svg>