<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920">
  <defs>
    <linearGradient id="faq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#111625"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#faq-bg)"/>

  <!-- Title -->
  <text x="80" y="60" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">iOS 27.3 国行智能激活故障决策树与高频避坑指南</text>
  <text x="80" y="95" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#8b949e">遇到候补名单卡死、模型下载中断或双卡网络冲突？对照以下决策树快速排查定位</text>

  <!-- 4 FAQ Columns -->
  <!-- Column 1 -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="295" height="720" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="295" height="50" rx="14" fill="#21262d"/>
    <rect x="0" y="35" width="295" height="15" fill="#21262d"/>
    <text x="20" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#ff7b72">Q1: 候补名单卡死在等待中？</text>

    <text x="20" y="80" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【故障表现】</text>
    <text x="20" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">点击“加入候补名单”后，一直显示“已加入候补名单”，转圈数天无反应。</text>

    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【根因分析】</text>
    <text x="20" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">后台资格审查守护进程未能成功连接至合规握手端点，或者 iCloud 区域缓存冲突。</text>

    <text x="20" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#3fb950">【一键解决办法】</text>
    <rect x="15" y="265" width="265" height="110" rx="8" fill="#0d1117"/>
    <text x="25" y="295" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#58a6ff">1. 退出国区 App Store 登录</text>
    <text x="25" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#58a6ff">2. 保持全局合法网关通信</text>
    <text x="25" y="345" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#58a6ff">3. 运行脚本 --flush-cache</text>
    <text x="20" y="405" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#3fb950">通常 3-5 分钟内即可秒批通过！</text>
  </g>

  <!-- Column 2 -->
  <g transform="translate(408, 140)">
    <rect x="0" y="0" width="295" height="720" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="295" height="50" rx="14" fill="#21262d"/>
    <rect x="0" y="35" width="295" height="15" fill="#21262d"/>
    <text x="20" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#d29922">Q2: 模型包下载卡死 99%？</text>

    <text x="20" y="80" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【故障表现】</text>
    <text x="20" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">提示“正在下载模型资源 (3.2 GB)”，进度条卡在 99% 或报错“下载中断”。</text>

    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【根因分析】</text>
    <text x="20" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">苹果 CDN 资产分片分发时，本地 Wi-Fi 路由器的 DNS 污染或碎片断点续传超时。</text>

    <text x="20" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#3fb950">【一键解决办法】</text>
    <rect x="15" y="265" width="265" height="110" rx="8" fill="#0d1117"/>
    <text x="25" y="295" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e3b341">1. 插上原装快充充电线</text>
    <text x="25" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e3b341">2. 手机连接 5GHz Wi-Fi</text>
    <text x="25" y="345" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e3b341">3. 脚本执行 --preload-afm</text>
    <text x="20" y="405" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#3fb950">本地直接推送 CoreML 权重包！</text>
  </g>

  <!-- Column 3 -->
  <g transform="translate(736, 140)">
    <rect x="0" y="0" width="295" height="720" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="295" height="50" rx="14" fill="#21262d"/>
    <rect x="0" y="35" width="295" height="15" fill="#21262d"/>
    <text x="20" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#58a6ff">Q3: 双卡网络冲突或回退？</text>

    <text x="20" y="80" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【故障表现】</text>
    <text x="20" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">iPhone 插两张卡（如主卡国内移动，副卡香港/海外流量卡）时经常功能回退。</text>

    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【根因分析】</text>
    <text x="20" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">两张卡注册不同基站 MCC，CommCenter 守护进程发生时序竞争与地理围栏冲突。</text>

    <text x="20" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#3fb950">【一键解决办法】</text>
    <rect x="15" y="265" width="265" height="110" rx="8" fill="#0d1117"/>
    <text x="25" y="295" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#79c0ff">1. 初次激活时暂时关闭国内卡</text>
    <text x="25" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#79c0ff">2. 激活成功后策略写入持久缓存</text>
    <text x="25" y="345" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#79c0ff">3. 重新启用双卡无需再验证</text>
    <text x="20" y="405" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#3fb950">双卡从此和谐共存，稳定运行！</text>
  </g>

  <!-- Column 4 -->
  <g transform="translate(1064, 140)">
    <rect x="0" y="0" width="295" height="720" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="295" height="50" rx="14" fill="#21262d"/>
    <rect x="0" y="35" width="295" height="15" fill="#21262d"/>
    <text x="20" y="32" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="bold" fill="#3fb950">Q4: 影响保修和 OTA 升级吗？</text>

    <text x="20" y="80" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【核心关切】</text>
    <text x="20" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">很多用户担心运行脚本后会变成“假美版”，影响 Apple Store 售后或爱思验机变红。</text>

    <text x="20" y="150" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">【官方机制保证】</text>
    <text x="20" y="175" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#8b949e">本工具基于苹果标准官方诊断通道，仅写入用户层策略偏好（Preferences），零侵入。</text>

    <text x="20" y="240" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="bold" fill="#3fb950">【安全结论】</text>
    <rect x="15" y="265" width="265" height="110" rx="8" fill="#0d1117"/>
    <text x="25" y="295" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#56d364">✓ 物理序列号与型号不变</text>
    <text x="25" y="320" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#56d364">✓ 官方 Apple Store 保修有效</text>
    <text x="25" y="345" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#56d364">✓ 爱思/沙猫验机 100% 全绿</text>
    <text x="20" y="405" font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#3fb950">未来后续 iOS 27.4 小版本直接升级！</text>
  </g>
</svg>