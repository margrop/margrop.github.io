<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#0f172a"/>
<rect x="50" y="40" width="1300" height="680" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">ETC 快速通道比喻：纯软路由 vs 硬件流量卸载 (Hardware Flow Offloading)</text>
<text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">为什么千兆宽带下普通路由器 CPU 飙到 100%，而开了 PPE/WED 加速的 ImmortalWrt 稳如泰山？</text>

<defs>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,2 L8,5 L0,8" fill="#f43f5e"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,2 L8,5 L0,8" fill="#10b981"/></marker>
</defs>

<!-- Mode 1: Traditional Software Routing -->
<rect x="90" y="180" width="1220" height="210" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
<rect x="110" y="200" width="160" height="36" rx="8" fill="#e11d48"/>
<text x="190" y="224" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">传统纯软路由模式</text>
<text x="290" y="225" font-family="sans-serif" font-size="16" fill="#fda4af">相当于「人工收费站」：每个数据包都要敲开 CPU 房门，挨个查验、盖章、记账</text>

<g transform="translate(120, 260)" font-family="sans-serif">
  <rect x="0" y="0" width="190" height="100" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="95" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">网卡接收数据包</text>
  <text x="95" y="70" text-anchor="middle" font-size="14" fill="#94a3b8">产生大量硬件中断</text>

  <path d="M200 50 H235" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="245" y="0" width="220" height="100" rx="10" fill="#3b0764" stroke="#d946ef"/>
  <text x="355" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f0abfc">Linux 内核网络栈</text>
  <text x="355" y="65" text-anchor="middle" font-size="13" fill="#e879f9">sk_buff 内存分配与拷贝</text>
  <text x="355" y="85" text-anchor="middle" font-size="13" fill="#e879f9">Conntrack 连接跟踪查询</text>

  <path d="M475 50 H510" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="520" y="0" width="220" height="100" rx="10" fill="#450a0a" stroke="#f43f5e"/>
  <text x="630" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#fca5a5">防火墙与路由查找</text>
  <text x="630" y="65" text-anchor="middle" font-size="13" fill="#fda4af">逐条匹配 Netfilter 规则</text>
  <text x="630" y="85" text-anchor="middle" font-size="13" fill="#fda4af">软中断软交换高频耗能</text>

  <path d="M750 50 H785" stroke="#f43f5e" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="795" y="0" width="385" height="100" rx="10" fill="#18181b" stroke="#71717a"/>
  <text x="987" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#ef4444">结果：千兆测速 CPU 瞬间 100% 满载</text>
  <text x="987" y="68" text-anchor="middle" font-size="14" fill="#a1a1aa">伴随严重发热、高延迟抖动、无线 WiFi 降速至 300M</text>
</g>

<!-- Mode 2: Hardware Flow Offloading (ImmortalWrt) -->
<rect x="90" y="415" width="1220" height="210" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<rect x="110" y="435" width="210" height="36" rx="8" fill="#059669"/>
<text x="215" y="459" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">ImmortalWrt 硬件加速</text>
<text x="340" y="460" font-family="sans-serif" font-size="16" fill="#6ee7b7">相当于「ETC 专用快速通道」：首包建立直通规则后，后续海量数据包硬件直通秒过</text>

<g transform="translate(120, 495)" font-family="sans-serif">
  <rect x="0" y="0" width="210" height="100" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="105" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">首个数据包 (First Pkt)</text>
  <text x="105" y="70" text-anchor="middle" font-size="13" fill="#94a3b8">正常握手并记录五元组</text>

  <path d="M220 50 H255" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="265" y="0" width="230" height="100" rx="10" fill="#064e3b" stroke="#10b981"/>
  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">写入 PPE / 硬件流表</text>
  <text x="380" y="65" text-anchor="middle" font-size="13" fill="#6ee7b7">MediaTek PPE 芯片硬件寄存器</text>
  <text x="380" y="85" text-anchor="middle" font-size="13" fill="#6ee7b7">WED 无线以太网调度直通</text>

  <path d="M505 50 H540" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="550" y="0" width="230" height="100" rx="10" fill="#042f2e" stroke="#14b8a6"/>
  <text x="665" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#5eead4">芯片硬件直接转发</text>
  <text x="665" y="65" text-anchor="middle" font-size="13" fill="#2dd4bf">完全绕过 Linux 内核协议栈</text>
  <text x="665" y="85" text-anchor="middle" font-size="13" fill="#2dd4bf">零 CPU 复制、零内存中断</text>

  <path d="M790 50 H825" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="835" y="0" width="345" height="100" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="1007" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#4ade80">结果：千兆满速狂飙 CPU 仅 2~5%</text>
  <text x="1007" y="68" text-anchor="middle" font-size="14" fill="#bbf7d0">千兆跑满 940Mbps+，毫秒级超低延迟，全屋清凉省电</text>
</g>

<!-- Footer Takeaway -->
<rect x="90" y="645" width="1220" height="50" rx="10" fill="#090d16" stroke="#334155"/>
<text x="120" y="677" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">💡 核心启发：</text>
<text x="210" y="677" font-family="sans-serif" font-size="15" fill="#cbd5e1">不要盲目花大价钱升级多核 x86 软路由，只要打开了 ImmortalWrt 的硬件流量卸载，数十元的 ARM/MIPS 路由器同样能跑满千兆！</text>
</svg>