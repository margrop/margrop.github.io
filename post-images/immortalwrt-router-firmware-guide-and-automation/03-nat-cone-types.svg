  <text x="270" y="130" text-anchor="middle" font-size="12" fill="#cbd5e1">固定公网映射: :20000</text>
  <text x="270" y="155" text-anchor="middle" font-size="12" fill="#cbd5e1">任何公网节点直接投递</text>
  <text x="270" y="195" text-anchor="middle" font-size="12" fill="#22c55e">无需重复打洞即通</text>

  <!-- External Nodes -->
  <rect x="400" y="20" width="120" height="60" rx="8" fill="#334155"/>
  <text x="460" y="48" text-anchor="middle" font-size="14" fill="#f8fafc">游戏服务器 A</text>
  <text x="460" y="68" text-anchor="middle" font-size="11" fill="#4ade80">✔ 极速连接响应</text>

  <rect x="400" y="120" width="120" height="60" rx="8" fill="#334155"/>
  <text x="460" y="148" text-anchor="middle" font-size="14" fill="#f8fafc">玩家队友 P2P</text>
  <text x="460" y="168" text-anchor="middle" font-size="11" fill="#4ade80">✔ 直接打洞直通成功</text>

  <path d="M140 70 H180" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M350 50 H390" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M390 150 H350" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
</g>
<text x="1010" y="580" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#86efac">游戏显示“NAT Open / NAT1”、秒速联机连麦、BT 下载做种提速 300%</text>

