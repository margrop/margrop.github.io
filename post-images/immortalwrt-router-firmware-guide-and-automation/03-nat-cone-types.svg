  <text x="75" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">内网主机</text>
  <text x="75" y="90" text-anchor="middle" font-size="12" fill="#94a3b8">端口 :5000</text>

  <!-- Router NAT -->
  <rect x="190" y="10" width="150" height="220" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="265" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">严苛传达室</text>
  <text x="265" y="65" text-anchor="middle" font-size="12" fill="#94a3b8">对外目标不同时</text>
  <text x="265" y="85" text-anchor="middle" font-size="12" fill="#f87171">分配完全不同端口</text>
  <text x="265" y="130" text-anchor="middle" font-size="12" fill="#cbd5e1">连服务器A → :10001</text>
  <text x="265" y="155" text-anchor="middle" font-size="12" fill="#cbd5e1">连服务器B → :10002</text>
  <text x="265" y="195" text-anchor="middle" font-size="12" fill="#ef4444">外部主机未知则拦截</text>

  <!-- External Nodes -->
