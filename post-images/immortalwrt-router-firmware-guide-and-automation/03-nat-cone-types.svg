<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#0f172a"/>
<rect x="50" y="40" width="1300" height="680" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">NAT 网络类型拆解：为什么联机打游戏和 P2P 必须开启 Full Cone (NAT1)？</text>
<text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#94a3b8">从日常生活中的“传达室信件转交”模型，看对称型 NAT 与全锥型 NAT 的本质差异</text>

<defs>
  <marker id="arr-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,2 L8,5 L0,8" fill="#ef4444"/></marker>
  <marker id="arr-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,2 L8,5 L0,8" fill="#22c55e"/></marker>
  <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,2 L8,5 L0,8" fill="#94a3b8"/></marker>
</defs>

<!-- Left: Symmetric NAT -->
<rect x="90" y="180" width="580" height="440" rx="16" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
<rect x="110" y="200" width="540" height="40" rx="8" fill="#7f1d1d"/>
<text x="380" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fecaca">对称型 NAT (Symmetric / NAT4)</text>

<g transform="translate(120, 260)" font-family="sans-serif">
