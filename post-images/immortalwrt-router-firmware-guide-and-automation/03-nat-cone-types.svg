  <text x="450" y="48" text-anchor="middle" font-size="14" fill="#f8fafc">游戏服务器 A</text>
  <text x="450" y="68" text-anchor="middle" font-size="11" fill="#94a3b8">允许通信 (对端匹配)</text>

  <rect x="390" y="120" width="120" height="60" rx="8" fill="#334155"/>
  <text x="450" y="148" text-anchor="middle" font-size="14" fill="#f8fafc">玩家队友 P2P</text>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#f87171">❌ 直接被路由器丢弃</text>

  <path d="M140 70 H180" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M340 50 H380" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M390 150 H350" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr-red)"/>
</g>
<text x="380" y="580" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#fca5a5">游戏显示“NAT 严格”、匹配延迟大、Switch/PS 联机组队频频报错</text>

<!-- Right: Full Cone NAT -->
<rect x="710" y="180" width="600" height="440" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
<rect x="730" y="200" width="560" height="40" rx="8" fill="#14532d"/>
<text x="1010" y="227" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#bbf7d0">全锥型 NAT (Full Cone / NAT1) - ImmortalWrt 标配</text>

<g transform="translate(740, 260)" font-family="sans-serif">
  <!-- Host -->
  <rect x="10" y="30" width="130" height="80" rx="8" fill="#1e293b" stroke="#475569"/>
