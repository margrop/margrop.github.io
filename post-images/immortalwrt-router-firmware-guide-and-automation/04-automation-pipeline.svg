<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#0f172a"/>
<rect x="50" y="40" width="1300" height="680" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="700" fill="#f8fafc">跨平台路由器自动化运维与巡检流水线</text>
<text x="90" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#94a3b8">支持 Windows 11 / Ubuntu 26.04 / macOS 26 原生无第三方依赖，人工与 Agent 双模式闭环</text>

<defs>
  <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,2 L8,5 L0,8" fill="#38bdf8"/></marker>
</defs>

<!-- 5 Steps Horizontal -->
<g transform="translate(80, 220)" font-family="sans-serif">
  <!-- Step 1 -->
  <rect x="0" y="0" width="220" height="230" rx="14" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="15" y="15" width="40" height="30" rx="6" fill="#0284c7"/>
  <text x="35" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="110" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f9ff">网关与网络勘测</text>
  <text x="110" y="115" text-anchor="middle" font-size="13" fill="#bae6fd">自动发现默认网关</text>
  <text x="110" y="140" text-anchor="middle" font-size="13" fill="#bae6fd">测试延迟与丢包率</text>
  <text x="110" y="165" text-anchor="middle" font-size="13" fill="#bae6fd">检测最佳 MTU 握手值</text>
  <text x="110" y="190" text-anchor="middle" font-size="13" fill="#bae6fd">验证 DNS 递归响应耗时</text>

  <!-- Step 2 -->
  <rect x="250" y="0" width="220" height="230" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="265" y="15" width="40" height="30" rx="6" fill="#6366f1"/>
  <text x="285" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="360" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f9ff">路由器健康体检</text>
  <text x="360" y="115" text-anchor="middle" font-size="13" fill="#c7d2fe">SSH 免密或临时认证</text>
  <text x="360" y="140" text-anchor="middle" font-size="13" fill="#c7d2fe">CPU 负载与内存占用</text>
  <text x="360" y="165" text-anchor="middle" font-size="13" fill="#c7d2fe">检查 TurboACC 驱动加载</text>
  <text x="360" y="190" text-anchor="middle" font-size="13" fill="#c7d2fe">确认无线信道拥塞状态</text>

  <!-- Step 3 -->
  <rect x="500" y="0" width="220" height="230" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="515" y="15" width="40" height="30" rx="6" fill="#10b981"/>
  <text x="535" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="610" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f9ff">配置安全归档</text>
  <text x="610" y="115" text-anchor="middle" font-size="13" fill="#a7f3d0">自动调用 sysupgrade -b</text>
  <text x="610" y="140" text-anchor="middle" font-size="13" fill="#a7f3d0">打包网络、DHCP与防火墙</text>
  <text x="610" y="165" text-anchor="middle" font-size="13" fill="#a7f3d0">本地日期戳压缩归档</text>
  <text x="610" y="190" text-anchor="middle" font-size="13" fill="#a7f3d0">生成回滚校验和</text>

  <!-- Step 4 -->
  <rect x="750" y="0" width="220" height="230" rx="14" fill="#581c87" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="765" y="15" width="40" height="30" rx="6" fill="#a855f7"/>
  <text x="785" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="860" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f9ff">软件源一键提速</text>
  <text x="860" y="115" text-anchor="middle" font-size="13" fill="#e9d5ff">测速官方 vs 国内镜像</text>
  <text x="860" y="140" text-anchor="middle" font-size="13" fill="#e9d5ff">自动切换清华/阿里源</text>
  <text x="860" y="165" text-anchor="middle" font-size="13" fill="#e9d5ff">更新 distfeeds.conf</text>
  <text x="860" y="190" text-anchor="middle" font-size="13" fill="#e9d5ff">验证 opkg update 0 报错</text>

  <!-- Step 5 -->
  <rect x="1000" y="0" width="240" height="230" rx="14" fill="#713f12" stroke="#eab308" stroke-width="1.5"/>
  <rect x="1015" y="15" width="40" height="30" rx="6" fill="#eab308"/>
  <text x="1035" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#000">5</text>
  <text x="1120" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#fef9c3">结构化交付与告警</text>
  <text x="1120" y="115" text-anchor="middle" font-size="13" fill="#fef08a">生成 JSON/Markdown 摘要</text>
  <text x="1120" y="140" text-anchor="middle" font-size="13" fill="#fef08a">脱敏屏蔽内网私有 IP/主机名</text>
  <text x="1120" y="165" text-anchor="middle" font-size="13" fill="#fef08a">人类一键审查确认</text>
  <text x="1120" y="190" text-anchor="middle" font-size="13" fill="#fef08a">Agent 自动调度决策</text>

  <!-- Connecting Arrows -->
  <path d="M225 115 H245" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-blue)"/>
  <path d="M475 115 H495" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-blue)"/>
  <path d="M725 115 H745" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-blue)"/>
  <path d="M975 115 H995" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-blue)"/>
</g>

<!-- Execution Dual Modes -->
<rect x="80" y="490" width="1240" height="130" rx="14" fill="#0f172a" stroke="#334155"/>
<text x="110" y="525" font-family="sans-serif" font-size="18" font-weight="700" fill="#38bdf8">两种执行方式：</text>

<g font-family="sans-serif">
  <rect x="110" y="540" width="580" height="65" rx="8" fill="#1e293b"/>
  <text x="130" y="565" font-size="15" font-weight="700" fill="#a5f3fc">【人工一键执行】</text>
  <text x="130" y="590" font-size="13" fill="#cbd5e1">打开 PowerShell 或终端，直接粘贴一键运行脚本，交互式看体检报告与备份存档。</text>

  <rect x="730" y="540" width="580" height="65" rx="8" fill="#1e293b"/>
  <text x="750" y="565" font-size="15" font-weight="700" fill="#fed7aa">【Agent 自动配置】</text>
  <text x="750" y="590" font-size="13" fill="#cbd5e1">Agent 按照严格脱敏护栏与幂等校验执行，巡检失败自动保留证据，绝不盲目升级固件。</text>
</g>

<!-- Footer -->
<rect x="80" y="645" width="1240" height="50" rx="10" fill="#090d16" stroke="#334155"/>
<text x="110" y="677" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">🛡️ 安全底线：</text>
<text x="210" y="677" font-family="sans-serif" font-size="15" fill="#cbd5e1">脚本全程严格遵循无感脱敏规范，日志输出与报告中杜绝出现真实私网完整 IP 与局域网主机名。</text>
</svg>