<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#0f172a"/>
<rect x="50" y="40" width="1300" height="740" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="90" y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">ImmortalWrt vs. 官方 OpenWrt：技术架构与硬件加速对比</text>
<text x="90" y="138" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#94a3b8">从 Linux 内核驱动分支、硬件流量调度器、网络加速栈到国内生态软件源的深度解构</text>

<!-- Left Column: Official OpenWrt -->
<rect x="90" y="170" width="580" height="520" rx="16" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
<rect x="110" y="190" width="540" height="44" rx="8" fill="#334155"/>
<text x="380" y="219" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">官方 OpenWrt (Mainline)</text>

<!-- Layer 1: App & UI -->
<rect x="110" y="250" width="540" height="80" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="130" y="280" font-family="sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">【用户层】极简原生 LuCI</text>
<text x="130" y="310" font-family="sans-serif" font-size="14" fill="#94a3b8">• 纯英文默认界面，依赖海外源手动装中文语言包</text>

<!-- Layer 2: Ecosystem & Packages -->
<rect x="110" y="345" width="540" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="130" y="375" font-family="sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">【生态与源】官方默认镜像源 (openwrt.org)</text>
<text x="130" y="402" font-family="sans-serif" font-size="14" fill="#94a3b8">• 国内网络经常握手超时、签名校验报错</text>
<text x="130" y="422" font-family="sans-serif" font-size="14" fill="#94a3b8">• 插件包遵循严格自由开源准则，缺失部分私有闭源驱动</text>

<!-- Layer 3: Acceleration Engine -->
<rect x="110" y="450" width="540" height="95" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="130" y="480" font-family="sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">【网络加速】通用 Flow Offloading</text>
<text x="130" y="507" font-family="sans-serif" font-size="14" fill="#94a3b8">• 仅支持标准 Linux 内核软件流表卸载</text>
<text x="130" y="527" font-family="sans-serif" font-size="14" fill="#f87171">• 缺失 MTK WED / 私有 PPE 硬件直通驱动，无线转发瓶颈大</text>

<!-- Layer 4: Kernel & Drivers -->
<rect x="110" y="560" width="540" height="110" rx="10" fill="#1e293b" stroke="#475569"/>
<text x="130" y="590" font-family="sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">【内核与驱动】标准主线驱动</text>
<text x="130" y="618" font-family="sans-serif" font-size="14" fill="#94a3b8">• 严格坚持开源纯洁度，不合入未经代码审核的厂商补丁</text>
<text x="130" y="640" font-family="sans-serif" font-size="14" fill="#94a3b8">• 国产主流路由器芯片（联发科、瑞芯微）特性支持相对保守</text>

<!-- Right Column: ImmortalWrt -->
<rect x="710" y="170" width="600" height="520" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
<rect x="730" y="190" width="560" height="44" rx="8" fill="#0284c7"/>
<text x="1010" y="219" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">ImmortalWrt (本土化高能优化版)</text>

<!-- Layer 1: App & UI -->
<rect x="730" y="250" width="560" height="80" rx="10" fill="#0c4a6e" stroke="#0284c7"/>
<text x="750" y="280" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">【用户层】开箱即用的现代化交互</text>
<text x="750" y="310" font-family="sans-serif" font-size="14" fill="#e0f2fe">• 预装 Argon 极简炫酷主题，原生中文，移动端完美自适应</text>

<!-- Layer 2: Ecosystem & Packages -->
<rect x="730" y="345" width="560" height="90" rx="10" fill="#064e3b" stroke="#10b981"/>
<text x="750" y="375" font-family="sans-serif" font-size="16" font-weight="700" fill="#34d399">【生态与源】一键高速镜像生态 (清华/中科大/阿里)</text>
<text x="750" y="402" font-family="sans-serif" font-size="14" fill="#d1fae5">• 内置丰富 LuCI 插件库，opkg 秒速下载不报错</text>
<text x="750" y="422" font-family="sans-serif" font-size="14" fill="#d1fae5">• 固件挑选器 (Firmware Selector) 支持在线定制编译</text>

<!-- Layer 3: Acceleration Engine -->
<rect x="730" y="450" width="560" height="95" rx="10" fill="#4c1d95" stroke="#a855f7"/>
<text x="750" y="480" font-family="sans-serif" font-size="16" font-weight="700" fill="#c084fc">【网络加速】TurboACC 全套狂飙引擎</text>
<text x="750" y="507" font-family="sans-serif" font-size="14" fill="#f3e8ff">• 集成 Shortcut-FE + Flow Offload + BBRv3 拥塞控制</text>
<text x="750" y="527" font-family="sans-serif" font-size="14" fill="#4ade80">• 标配 Full Cone NAT1 穿透，联机对战/BT下载满速通畅</text>

<!-- Layer 4: Kernel & Drivers -->
<rect x="730" y="560" width="560" height="110" rx="10" fill="#701a75" stroke="#e879f9"/>
<text x="750" y="590" font-family="sans-serif" font-size="16" font-weight="700" fill="#f5d0fe">【内核与驱动】深度打补丁的厂商级芯片支持</text>
<text x="750" y="618" font-family="sans-serif" font-size="14" fill="#fdf4ff">• 完美集成 MediaTek MT798x / Filogic 原厂 WED 驱动</text>
<text x="750" y="640" font-family="sans-serif" font-size="14" fill="#fdf4ff">• Rockchip RK3568/RK3588、x86 多网卡千兆万兆驱动全开</text>

<!-- Summary Footer -->
<rect x="90" y="710" width="1220" height="50" rx="10" fill="#090d16" stroke="#334155"/>
<text x="120" y="742" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8">📌 核心定位：</text>
<text x="210" y="742" font-family="sans-serif" font-size="15" fill="#cbd5e1">官方 OpenWrt 像是「基础毛坯房」，ImmortalWrt 则是针对国内家庭网络深度精装定制的「拎包入住豪华房」。</text>
</svg>