<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Three Fortified Defense Lines for Self-Hosted Home Assistant">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">NETWORK TOPOLOGY / ZERO EXPOSURE</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">Three Fortified Defense Lines for Self-Hosted HA</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">From Zero Public Port Exposure to Secure Tunnels and Host-Level IP Bans</text>

<!-- Card 1 -->
<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="96" height="46" rx="10" fill="#0284c7"/>
<text x="140" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Line 1</text>
<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">Zero-Exposure Perimeter</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">Never forward raw port 8123 on your router</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="18.5" fill="#334155" font-weight="400">Use Cloudflare Tunnels for outbound-only egress</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="18.5" fill="#334155" font-weight="400">Or connect securely via Tailscale WireGuard mesh</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="18.5" fill="#334155" font-weight="400">Completely disappear from global Shodan scanners</text>

<!-- Arrow 1 -->
<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 2 -->
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="96" height="46" rx="10" fill="#d97706"/>
<text x="588" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Line 2</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">Encrypted Auth Boundary</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="18.5" fill="#334155" font-weight="400">Enforce Let's Encrypt TLS encryption on all traffic</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">Configure use_x_forwarded_for trusted proxies correctly</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">Mandate TOTP two-factor authentication on all accounts</text>
<circle cx="548" cy="611" r="4.5" fill="#d97706"/>
<text x="564" y="618" font-size="18.5" fill="#334155" font-weight="400">Audit authorized client devices and revoke obsolete sessions</text>

<!-- Arrow 2 -->
<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 3 -->
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="96" height="46" rx="10" fill="#059669"/>
<text x="1036" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Line 3</text>
<text x="988" y="390" font-size="26" fill="#0f172a" font-weight="600">Host-Level Defense &amp; Ban</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">Enable ip_ban_enabled: true in configuration.yaml</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">Lock out repeated failed login attempts automatically</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="18.5" fill="#334155" font-weight="400">Isolate IoT devices in dedicated VLANs to prevent lateral moves</text>
<circle cx="996" cy="611" r="4.5" fill="#059669"/>
<text x="1012" y="618" font-size="18.5" fill="#334155" font-weight="400">Run periodic automated security audits on system logs</text>
</svg>