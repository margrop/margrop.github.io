<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="小学生秒懂：刷新令牌 vs. 长期访问令牌究竟是什么？">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">TOKEN ARCHITECTURE / ELEMENTARY ANALOGY</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">小学生秒懂：刷新令牌 vs. 长期访问令牌究竟是什么？</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">用「酒店房卡续期凭证」与「永不过期的至尊万能钥匙」看透身份生命周期</text>

<!-- Card 1 -->
<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="96" height="46" rx="10" fill="#0284c7"/>
<text x="140" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">临时</text>
<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">日常房卡 (Access Token)</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">相当于客房感应卡，单次有效期仅 30 分钟</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="18.5" fill="#334155" font-weight="400">掉在走廊或被偷，几分钟后自动失效作废</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="18.5" fill="#334155" font-weight="400">浏览器网页与手机 App 日常交互所用凭据</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="18.5" fill="#334155" font-weight="400">后台静默向系统出示续期证明自动领新卡</text>

<!-- Arrow 1 -->
<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 2 -->
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="96" height="46" rx="10" fill="#d97706"/>
<text x="588" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">存根</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">前台凭证 (Refresh Token)</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="18.5" fill="#334155" font-weight="400">相当于你入住时在前台合法登记的身份证件</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">只有前台系统（HA 鉴权内核）才能校验其真伪</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">支持在个人资料页随时查看、一键注销旧设备</text>
<circle cx="548" cy="611" r="4.5" fill="#d97706"/>
<text x="564" y="618" font-size="18.5" fill="#334155" font-weight="400">一旦注销，丢掉的手机瞬间无法继续申领新房卡</text>

<!-- Arrow 2 -->
<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 3 -->
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="96" height="46" rx="10" fill="#dc2626"/>
<text x="1036" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">万能</text>
<text x="988" y="390" font-size="26" fill="#0f172a" font-weight="600">至尊钥匙 (长期令牌 LLAT)</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#dc2626"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">相当于酒店工程总监持有的 10 年万能通开金钥匙</text>
<circle cx="996" cy="507" r="4.5" fill="#dc2626"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">无需 30 分钟轮换，见门即开且直通管理员权限</text>
<circle cx="996" cy="559" r="4.5" fill="#dc2626"/>
<text x="1012" y="566" font-size="18.5" fill="#334155" font-weight="400">专供自动化脚本、第三方中枢或 AI Agent 调用</text>
<circle cx="996" cy="611" r="4.5" fill="#dc2626"/>
<text x="1012" y="618" font-size="18.5" fill="#334155" font-weight="400">一旦泄露必须第一时间进系统后台手动吊销</text>
</svg>