<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Hardening AI Agent Integration: Best Practices for Smart Home Assistants">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">AI AGENT / LEAST PRIVILEGE</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">Hardening AI Agent Integration for Smart Homes</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">Implementing Least Privilege: Entity Whitelisting, Guardrails, and Human Confirmation</text>

<!-- Card 1 -->
<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="96" height="46" rx="10" fill="#0284c7"/>
<text x="140" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Scope</text>
<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">Dedicated Service Token</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">Never share owner admin tokens with LLM prompts</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="18.5" fill="#334155" font-weight="400">Create dedicated non-admin users with scoped tokens</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="18.5" fill="#334155" font-weight="400">Expose only whitelisted entities needed for routines</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="18.5" fill="#334155" font-weight="400">Read-only access for environmental and power sensors</text>

<!-- Arrow 1 -->
<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 2 -->
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="96" height="46" rx="10" fill="#dc2626"/>
<text x="588" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Gates</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">Two-Phase Human-in-the-Loop</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#dc2626"/>
<text x="564" y="462" font-size="18.5" fill="#334155" font-weight="400">Classify locks, covers, and alarms as critical assets</text>
<circle cx="548" cy="507" r="4.5" fill="#dc2626"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">Prohibit autonomous unlocking or disarming at all times</text>
<circle cx="548" cy="559" r="4.5" fill="#dc2626"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">Mandate interactive human mobile confirmation via push</text>
<circle cx="548" cy="611" r="4.5" fill="#dc2626"/>
<text x="564" y="618" font-size="18.5" fill="#334155" font-weight="400">Set strict rate limits to prevent hallucinated runaway loops</text>

<!-- Arrow 2 -->
<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 3 -->
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="96" height="46" rx="10" fill="#059669"/>
<text x="1036" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Audit</text>
<text x="988" y="390" font-size="26" fill="#0f172a" font-weight="600">MCP Tools and Traceability</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">Use Model Context Protocol (MCP) for schema-typed tools</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">Log all LLM tool calls and parameters in append-only storage</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="18.5" fill="#334155" font-weight="400">Provide an instant panic killswitch to sever API access</text>
<circle cx="996" cy="611" r="4.5" fill="#059669"/>
<text x="1012" y="618" font-size="18.5" fill="#334155" font-weight="400">Audit agent capabilities periodically with security toolkits</text>
</svg>