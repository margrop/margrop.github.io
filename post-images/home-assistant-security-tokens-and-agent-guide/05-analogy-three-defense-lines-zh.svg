<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="自建 Home Assistant 的三道金钟罩安全防线">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">NETWORK TOPOLOGY / ZERO EXPOSURE</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">自建 Home Assistant 的三道金钟罩安全防线</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">从拒绝公网端口直连、零信任隧道穿透，到内网反向代理与核心层自动封禁</text>

<!-- Card 1 -->
<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="96" height="46" rx="10" fill="#0284c7"/>
<text x="140" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">第一道</text>
<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">外网零暴露隔离</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">严禁路由器公网映射 8123 端口，不设靶子</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="18.5" fill="#334155" font-weight="400">采用 Cloudflare Tunnel 建立出站加密隧道穿透</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="18.5" fill="#334155" font-weight="400">或依托 Tailscale 组建私有 WireGuard 虚拟内网</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="18.5" fill="#334155" font-weight="400">杜绝公网空间爬虫与端口扫描器的被动探测</text>

<!-- Arrow 1 -->
<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 2 -->
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="96" height="46" rx="10" fill="#d97706"/>
<text x="588" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">第二道</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">传输加密与身份验证</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="18.5" fill="#334155" font-weight="400">强制开启 HTTPS 与 Let's Encrypt 现代 TLS 加密</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">反向代理正确配置 use_x_forwarded_for 信任源</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">所有真实管理员用户全面强制启用 TOTP 双因素</text>
<circle cx="548" cy="611" r="4.5" fill="#d97706"/>
<text x="564" y="618" font-size="18.5" fill="#334155" font-weight="400">严格剔除简易口令，定期审查已知授权设备列表</text>

<!-- Arrow 2 -->
<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 3 -->
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="96" height="46" rx="10" fill="#059669"/>
<text x="1036" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">第三道</text>
<text x="988" y="390" font-size="26" fill="#0f172a" font-weight="600">内核主动封禁与审计</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">配置 http 集成开启 ip_ban_enabled: true 封禁</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">密码试错达到 5 次瞬间将攻击源拉入黑名单</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="18.5" fill="#334155" font-weight="400">物联网设备划分独立 VLAN，隔绝局域网越权威胁</text>
<circle cx="996" cy="611" r="4.5" fill="#059669"/>
<text x="1012" y="618" font-size="18.5" fill="#334155" font-weight="400">依托自动化探针定期审计系统日志与鉴权异常</text>
</svg>