<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="Elementary Analogy: What are Refresh Tokens vs. Long-Lived Access Tokens?">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">TOKEN ARCHITECTURE / ELEMENTARY ANALOGY</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">Elementary Analogy: Refresh Token vs. Long-Lived Token</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">Understanding Token Lifecycles via Hotel Keycards vs. Perpetual Master Keys</text>

<!-- Card 1 -->
<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="96" height="46" rx="10" fill="#0284c7"/>
<text x="140" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Card</text>
<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">Temporary Access Token</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">Like a hotel room keycard valid for only 30 minutes</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="18.5" fill="#334155" font-weight="400">If dropped in hallway, it quickly expires and becomes harmless</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="18.5" fill="#334155" font-weight="400">Carried by Web browsers and Mobile Apps for regular requests</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="18.5" fill="#334155" font-weight="400">App silently asks front desk for renewal before expiry</text>

<!-- Arrow 1 -->
<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 2 -->
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="96" height="46" rx="10" fill="#d97706"/>
<text x="588" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Voucher</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">Front-Desk Refresh Token</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#d97706"/>
<text x="564" y="462" font-size="18.5" fill="#334155" font-weight="400">Like verified identity papers kept at hotel front desk</text>
<circle cx="548" cy="507" r="4.5" fill="#d97706"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">Only the authentication server can validate this voucher</text>
<circle cx="548" cy="559" r="4.5" fill="#d97706"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">Audited and revocable from user profile at any time</text>
<circle cx="548" cy="611" r="4.5" fill="#d97706"/>
<text x="564" y="618" font-size="18.5" fill="#334155" font-weight="400">Revoking this voucher instantly cuts off renewed keycards</text>

<!-- Arrow 2 -->
<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 3 -->
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="96" height="46" rx="10" fill="#dc2626"/>
<text x="1036" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">Master</text>
<text x="988" y="390" font-size="26" fill="#0f172a" font-weight="600">Perpetual Master Key (LLAT)</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#dc2626"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">Like an all-access golden master key valid for 10 years</text>
<circle cx="996" cy="507" r="4.5" fill="#dc2626"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">Never expires on its own; unlocks any door instantly</text>
<circle cx="996" cy="559" r="4.5" fill="#dc2626"/>
<text x="1012" y="566" font-size="18.5" fill="#334155" font-weight="400">Dedicated for automated scripts, CLI tools, and AI Agents</text>
<circle cx="996" cy="611" r="4.5" fill="#dc2626"/>
<text x="1012" y="618" font-size="18.5" fill="#334155" font-weight="400">If compromised, must be manually deleted from Profile</text>
</svg>