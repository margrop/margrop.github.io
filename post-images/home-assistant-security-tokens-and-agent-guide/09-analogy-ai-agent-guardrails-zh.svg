<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-label="如何给 AI Agent 穿上安全护甲？智能管家接入实战规范">
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Noto Sans CJK SC",sans-serif}</style>
<rect width="1440" height="820" fill="#f8fafc"/>
<path d="M64 71H116" stroke="#0284c7" stroke-width="6"/>
<text x="136" y="80" font-size="22" fill="#0284c7" font-weight="600">AI AGENT / LEAST PRIVILEGE</text>
<text x="64" y="150" font-size="38" fill="#0f172a" font-weight="600">如何给 AI Agent 穿上安全护甲？智能管家接入实战</text>
<text x="64" y="204" font-size="23" fill="#475569" font-weight="400">遵循最小特权原则：实体白名单过滤、高危设备隔离与人类介入确认防线</text>

<!-- Card 1 -->
<rect x="64" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="92" y="295" width="96" height="46" rx="10" fill="#0284c7"/>
<text x="140" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">特权</text>
<text x="92" y="390" font-size="26" fill="#0f172a" font-weight="600">非管理员专属令牌</text>
<line x1="92" y1="416" x2="452" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="100" cy="455" r="4.5" fill="#0284c7"/>
<text x="116" y="462" font-size="18.5" fill="#334155" font-weight="400">严禁将家庭所有者 Admin 令牌直接喂给大模型</text>
<circle cx="100" cy="507" r="4.5" fill="#0284c7"/>
<text x="116" y="514" font-size="18.5" fill="#334155" font-weight="400">为 Agent 创建专属普通用户与独立长期访问令牌</text>
<circle cx="100" cy="559" r="4.5" fill="#0284c7"/>
<text x="116" y="566" font-size="18.5" fill="#334155" font-weight="400">实体访问严格白名单化，非必要设备一律隐蔽</text>
<circle cx="100" cy="611" r="4.5" fill="#0284c7"/>
<text x="116" y="618" font-size="18.5" fill="#334155" font-weight="400">传感器仅读状态开放，断开配电箱与总闸实体</text>

<!-- Arrow 1 -->
<path d="M485 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 2 -->
<rect x="512" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="540" y="295" width="96" height="46" rx="10" fill="#dc2626"/>
<text x="588" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">阻断</text>
<text x="540" y="390" font-size="26" fill="#0f172a" font-weight="600">高危执行两阶段确认</text>
<line x1="540" y1="416" x2="900" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="548" cy="455" r="4.5" fill="#dc2626"/>
<text x="564" y="462" font-size="18.5" fill="#334155" font-weight="400">门锁、车库门与警报控制台划归绝对高危受控区</text>
<circle cx="548" cy="507" r="4.5" fill="#dc2626"/>
<text x="564" y="514" font-size="18.5" fill="#334155" font-weight="400">严禁 Agent 自主深夜开锁或在无人时撤防报警器</text>
<circle cx="548" cy="559" r="4.5" fill="#dc2626"/>
<text x="564" y="566" font-size="18.5" fill="#334155" font-weight="400">动作执行必须触发推送至手机要求人类点击确认</text>
<circle cx="548" cy="611" r="4.5" fill="#dc2626"/>
<text x="564" y="618" font-size="18.5" fill="#334155" font-weight="400">设定调用频率防抖阈值，彻底防止模型死循环</text>

<!-- Arrow 2 -->
<path d="M933 482h20m-9 -8l9 8-9 8" fill="none" stroke="#0284c7" stroke-width="3"/>

<!-- Card 3 -->
<rect x="960" y="265" width="416" height="435" rx="16" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="988" y="295" width="96" height="46" rx="10" fill="#059669"/>
<text x="1036" y="325" font-size="19" fill="white" font-weight="600" text-anchor="middle">护栏</text>
<text x="988" y="390" font-size="26" fill="#0f172a" font-weight="600">MCP 协议与可审计性</text>
<line x1="988" y1="416" x2="1348" y2="416" stroke="#f1f5f9" stroke-width="2"/>
<circle cx="996" cy="455" r="4.5" fill="#059669"/>
<text x="1012" y="462" font-size="18.5" fill="#334155" font-weight="400">依托 Model Context Protocol 构建类型化受限工具</text>
<circle cx="996" cy="507" r="4.5" fill="#059669"/>
<text x="1012" y="514" font-size="18.5" fill="#334155" font-weight="400">所有 Agent 工具调用输入与输出全程持久化审计</text>
<circle cx="996" cy="559" r="4.5" fill="#059669"/>
<text x="1012" y="566" font-size="18.5" fill="#334155" font-weight="400">设立硬件/网络一键急停开关，秒断 Agent 控制权</text>
<circle cx="996" cy="611" r="4.5" fill="#059669"/>
<text x="1012" y="618" font-size="18.5" fill="#334155" font-weight="400">定期运行安全扫描探针，识别越权实体与失效配置</text>
</svg>