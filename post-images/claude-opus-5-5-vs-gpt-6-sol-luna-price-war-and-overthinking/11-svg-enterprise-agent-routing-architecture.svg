<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle">
    工业级三阶模型混合路由架构 (3-Tier Agent Orchestration Topology)
  </text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" font-family="sans-serif" text-anchor="middle">
    规避 Overthinking 陷阱、兼顾顶级推理能力与 80%+ 综合降本的最佳实战落地指南
  </text>

  <!-- Layer 1: Planning & Governance -->
  <g transform="translate(80, 110)">
    <rect width="1040" height="135" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="30" y="32" fill="#c7d2fe" font-size="16" font-weight="bold" font-family="sans-serif">
      第一层：战略规划与安全质检层 (Strategic Planning &amp; Quality Audit)
    </text>
    
    <rect x="30" y="50" width="460" height="65" rx="6" fill="#312e81"/>
    <text x="45" y="75" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Master Planner: Claude Opus 5.5</text>
    <text x="45" y="98" fill="#cbd5e1" font-size="12" font-family="sans-serif">参数约束: effort="medium" | max_thinking_budget=8000</text>

    <rect x="520" y="50" width="480" height="65" rx="6" fill="#312e81"/>
    <text x="535" y="75" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Final Code Review &amp; Safety Auditor</text>
    <text x="535" y="98" fill="#cbd5e1" font-size="12" font-family="sans-serif">调用频次: 每个任务仅首尾各执行 1 次 (单任务成本掌控在 $0.08 内)</text>
  </g>

  <!-- Arrow Down 1 -->
  <path d="M 600 245 L 600 285" stroke="#818cf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Layer 2: Main Execution -->
  <g transform="translate(80, 285)">
    <rect width="1040" height="135" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="30" y="32" fill="#bfdbfe" font-size="16" font-weight="bold" font-family="sans-serif">
      第二层：主干代码构建与业务执行层 (Core Implementation &amp; Feature Engineering)
    </text>

    <rect x="30" y="50" width="460" height="65" rx="6" fill="#1e40af"/>
    <text x="45" y="75" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Feature Builder: GPT-6 Sol</text>
    <text x="45" y="98" fill="#cbd5e1" font-size="12" font-family="sans-serif">参数约束: reasoning_effort="medium" | 84 t/s 稳健代码重构</text>

    <rect x="520" y="50" width="480" height="65" rx="6" fill="#1e40af"/>
    <text x="535" y="75" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif">Unit Test &amp; Sub-function Synthesis</text>
    <text x="535" y="98" fill="#cbd5e1" font-size="12" font-family="sans-serif">调用频次: 任务核心轮次 (5-15次调用，享受 $2/$10 骨折级单价)</text>
  </g>

  <!-- Arrow Down 2 -->
  <path d="M 600 420 L 600 460" stroke="#60a5fa" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Layer 3: High-Frequency Swarm -->
  <g transform="translate(80, 460)">
    <rect width="1040" height="155" rx="10" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="30" y="32" fill="#99f6e4" font-size="16" font-weight="bold" font-family="sans-serif">
      第三层：高并发工具蜂群与日志流处理层 (High-Throughput Swarm &amp; Real-time Tool Bus)
    </text>

    <rect x="30" y="50" width="310" height="85" rx="6" fill="#115e59"/>
    <text x="45" y="75" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Tool Dispatcher: GPT-6 Luna</text>
    <text x="45" y="95" fill="#ccfbf1" font-size="12" font-family="sans-serif">毫秒级入参合法性校验</text>
    <text x="45" y="115" fill="#99f6e4" font-size="11" font-family="sans-serif">TTFT 140ms · $0.10/M</text>

    <rect x="360" y="50" width="310" height="85" rx="6" fill="#115e59"/>
    <text x="375" y="75" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Log Stream Filter: GPT-6 Luna</text>
    <text x="375" y="95" fill="#ccfbf1" font-size="12" font-family="sans-serif">万行终端输出实时提纯</text>
    <text x="375" y="115" fill="#99f6e4" font-size="11" font-family="sans-serif">157 t/s 闪电吞吐</text>

    <rect x="690" y="50" width="310" height="85" rx="6" fill="#115e59"/>
    <text x="705" y="75" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif">Context Cache Worker</text>
    <text x="705" y="95" fill="#ccfbf1" font-size="12" font-family="sans-serif">超长上下文命中复用</text>
    <text x="705" y="115" fill="#99f6e4" font-size="11" font-family="sans-serif">缓存读取仅 $0.01/M</text>
  </g>
</svg>