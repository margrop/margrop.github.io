<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad2)" stroke="#3a506b" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="55" fill="#f8fafc" font-size="26" font-weight="bold" font-family="sans-serif" text-anchor="middle">
    通俗大比方：小学生也能秒懂的“米其林星级后厨”大模型分工学
  </text>
  <text x="600" y="88" fill="#94a3b8" font-size="15" font-family="sans-serif" text-anchor="middle">
    Executive Chef (Claude Opus 5.5) · Master Chef (GPT-6 Sol) · Prep Cook &amp; Expediter (GPT-6 Luna)
  </text>

  <!-- 3 Columns -->
  <!-- Column 1: Executive Chef -->
  <g transform="translate(50, 130)">
    <rect width="340" height="490" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="50" rx="12" fill="#312e81"/>
    <text x="170" y="32" fill="#c7d2fe" font-size="17" font-weight="bold" font-family="sans-serif" text-anchor="middle">
      👑 行政总厨 (Claude Opus 5.5)
    </text>

    <text x="25" y="85" fill="#a5b4fc" font-size="15" font-weight="bold" font-family="sans-serif">【后厨角色】</text>
    <text x="25" y="110" fill="#e0e7ff" font-size="14" font-family="sans-serif">米其林三星主理人，专门研发国宴大菜、</text>
    <text x="25" y="132" fill="#e0e7ff" font-size="14" font-family="sans-serif">调味疑难把关、最后品尝试味验收。</text>

    <rect x="20" y="155" width="300" height="1" fill="#4338ca"/>

    <text x="25" y="185" fill="#38bdf8" font-size="15" font-weight="bold" font-family="sans-serif">【在智能体工程中对应】</text>
    <text x="25" y="210" fill="#94a3b8" font-size="13" font-family="sans-serif">• 顶层任务规划器 (Planner)</text>
    <text x="25" y="232" fill="#94a3b8" font-size="13" font-family="sans-serif">• 极端复杂架构重构与死锁排查</text>
    <text x="25" y="254" fill="#94a3b8" font-size="13" font-family="sans-serif">• 深度代码审查 (Merge Auditor)</text>

    <rect x="20" y="280" width="300" height="1" fill="#4338ca"/>

    <text x="25" y="310" fill="#fbbf24" font-size="15" font-weight="bold" font-family="sans-serif">【成本与特性】</text>
    <text x="25" y="335" fill="#fde68a" font-size="13" font-family="sans-serif">• 智力巅峰：SWE-bench 89.9%</text>
    <text x="25" y="357" fill="#fde68a" font-size="13" font-family="sans-serif">• 价格：$4.00 进 / $20.00 出 (每1M)</text>
    <text x="25" y="379" fill="#fde68a" font-size="13" font-family="sans-serif">• 注意事项：切忌开 max 乱想！</text>

    <rect x="20" y="410" width="300" height="60" rx="8" fill="#312e81"/>
    <text x="170" y="445" fill="#e0e7ff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">“负责最难的脑力，绝不做低级杂活”</text>
  </g>

  <!-- Column 2: Master Chef -->
  <g transform="translate(430, 130)">
    <rect width="340" height="490" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="50" rx="12" fill="#1e40af"/>
    <text x="170" y="32" fill="#bfdbfe" font-size="17" font-weight="bold" font-family="sans-serif" text-anchor="middle">
      🍳 骨干主厨 (GPT-6 Sol)
    </text>

    <text x="25" y="85" fill="#93c5fd" font-size="15" font-weight="bold" font-family="sans-serif">【后厨角色】</text>
    <text x="25" y="110" fill="#dbeafe" font-size="14" font-family="sans-serif">经验极其丰富的老厨师长，负责烹饪所有的</text>
    <text x="25" y="132" fill="#dbeafe" font-size="14" font-family="sans-serif">招牌大菜，手法稳健、火候精准、速度极快。</text>

    <rect x="20" y="155" width="300" height="1" fill="#1d4ed8"/>

    <text x="25" y="185" fill="#38bdf8" font-size="15" font-weight="bold" font-family="sans-serif">【在智能体工程中对应】</text>
    <text x="25" y="210" fill="#94a3b8" font-size="13" font-family="sans-serif">• 核心功能代码编写 (Coder)</text>
    <text x="25" y="232" fill="#94a3b8" font-size="13" font-family="sans-serif">• 单元测试生成与日常 Bugfix</text>
    <text x="25" y="254" fill="#94a3b8" font-size="13" font-family="sans-serif">• 生产业务主力骨干工作流</text>

    <rect x="20" y="280" width="300" height="1" fill="#1d4ed8"/>

    <text x="25" y="310" fill="#fbbf24" font-size="15" font-weight="bold" font-family="sans-serif">【成本与特性】</text>
    <text x="25" y="335" fill="#fde68a" font-size="13" font-family="sans-serif">• 智力适中：达到 Opus 的 86% 水准</text>
    <text x="25" y="357" fill="#fde68a" font-size="13" font-family="sans-serif">• 价格：$2.00 进 / $10.00 出 (便宜50%)</text>
    <text x="25" y="379" fill="#fde68a" font-size="13" font-family="sans-serif">• 吐字速度：84 t/s 稳如泰山</text>

    <rect x="20" y="410" width="300" height="60" rx="8" fill="#1e3a8a"/>
    <text x="170" y="445" fill="#dbeafe" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">“性价比无可匹敌，扛起80%主力业务”</text>
  </g>

  <!-- Column 3: Prep Cook -->
  <g transform="translate(810, 130)">
    <rect width="340" height="490" rx="12" fill="#042f2e" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="50" rx="12" fill="#115e59"/>
    <text x="170" y="32" fill="#99f6e4" font-size="17" font-weight="bold" font-family="sans-serif" text-anchor="middle">
      ⚡ 闪电配菜员 (GPT-6 Luna)
    </text>

    <text x="25" y="85" fill="#5eead4" font-size="15" font-weight="bold" font-family="sans-serif">【后厨角色】</text>
    <text x="25" y="110" fill="#ccfbf1" font-size="14" font-family="sans-serif">身手敏捷的小学徒，洗菜、切葱、传菜、</text>
    <text x="25" y="132" fill="#ccfbf1" font-size="14" font-family="sans-serif">擦桌子，手速快到飞起且工钱极低。</text>

    <rect x="20" y="155" width="300" height="1" fill="#0f766e"/>

    <text x="25" y="185" fill="#38bdf8" font-size="15" font-weight="bold" font-family="sans-serif">【在智能体工程中对应】</text>
    <text x="25" y="210" fill="#94a3b8" font-size="13" font-family="sans-serif">• 工具路由与格式校验 (Router)</text>
    <text x="25" y="232" fill="#94a3b8" font-size="13" font-family="sans-serif">• 海量终端日志实时过滤与高亮</text>
    <text x="25" y="254" fill="#94a3b8" font-size="13" font-family="sans-serif">• 数据库大批量 SQL 生成与结构提取</text>

    <rect x="20" y="280" width="300" height="1" fill="#0f766e"/>

    <text x="25" y="310" fill="#fbbf24" font-size="15" font-weight="bold" font-family="sans-serif">【成本与特性】</text>
    <text x="25" y="335" fill="#fde68a" font-size="13" font-family="sans-serif">• 极速：157 t/s，首字延迟 0.74s</text>
    <text x="25" y="357" fill="#fde68a" font-size="13" font-family="sans-serif">• 白菜价：$0.10 进 / $0.50 出 (仅Opus 2.5%)</text>
    <text x="25" y="379" fill="#fde68a" font-size="13" font-family="sans-serif">• 缓存读取：低至 $0.01 / 1M</text>

    <rect x="20" y="410" width="300" height="60" rx="8" fill="#134e4a"/>
    <text x="170" y="445" fill="#ccfbf1" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">“千次高频调用不心疼，海量流水线利器”</text>
  </g>
</svg>