<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad3)" stroke="#374151" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle">
    2026年9月大模型“智力 vs 成本”帕累托前沿曲线 (Pareto Frontier)
  </text>
  <text x="600" y="78" fill="#9ca3af" font-size="14" font-family="sans-serif" text-anchor="middle">
    基于 Artificial Analysis 综合指数与每百万输出 Token 官方定价建模
  </text>

  <!-- Axes -->
  <!-- X: Intelligence Index (20 to 70), Y: Cost ($0 to $60) -->
  <!-- Graph area: x: 120 to 1100, y: 120 to 580 -->
  <line x1="140" y1="560" x2="1120" y2="560" stroke="#4b5563" stroke-width="2"/>
  <line x1="140" y1="120" x2="140" y2="560" stroke="#4b5563" stroke-width="2"/>

  <!-- Grid lines & Labels -->
  <!-- Y: 0, 10, 20, 30, 40, 50, 60 -->
  <text x="120" y="565" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="end">$0</text>
  <line x1="140" y1="490" x2="1120" y2="490" stroke="#1f2937" stroke-dasharray="4,4"/>
  <text x="120" y="495" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="end">$10</text>
  <line x1="140" y1="420" x2="1120" y2="420" stroke="#1f2937" stroke-dasharray="4,4"/>
  <text x="120" y="425" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="end">$20</text>
  <line x1="140" y1="350" x2="1120" y2="350" stroke="#1f2937" stroke-dasharray="4,4"/>
  <text x="120" y="355" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="end">$30</text>
  <line x1="140" y1="280" x2="1120" y2="280" stroke="#1f2937" stroke-dasharray="4,4"/>
  <text x="120" y="285" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="end">$40</text>
  <line x1="140" y1="210" x2="1120" y2="210" stroke="#1f2937" stroke-dasharray="4,4"/>
  <text x="120" y="215" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="end">$50</text>

  <text x="60" y="340" fill="#e5e7eb" font-size="14" font-weight="bold" font-family="sans-serif" transform="rotate(-90 60 340)">输出价格 ($/1M Tokens)</text>

  <!-- X ticks: 30, 40, 50, 60, 70 -->
  <text x="340" y="585" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="middle">35 (入门高频)</text>
  <text x="540" y="585" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="middle">45 (开源旗舰/实用)</text>
  <text x="740" y="585" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="middle">55 (高智力区间)</text>
  <text x="940" y="585" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="middle">65 (闭源算力顶峰)</text>
  <text x="630" y="620" fill="#e5e7eb" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">综合智能指数 (Artificial Analysis Intelligence Index)</text>

  <!-- Pareto Curve (Glowing Green line) -->
  <path d="M 280 556 Q 600 520 740 420 T 1000 210" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <text x="680" y="380" fill="#4ade80" font-size="14" font-weight="bold" font-family="sans-serif">全新帕累托最优前沿 (New Pareto Frontier)</text>

  <!-- Model Nodes -->
  <!-- 1. GPT-6 Luna: score 32, cost $0.50 -> x: 280, y: 556 -->
  <circle cx="280" cy="556" r="8" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/>
  <text x="280" y="540" fill="#2dd4bf" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">GPT-6 Luna ($0.50)</text>

  <!-- 2. Step 5 Preview: score 44, cost $2.70 -> x: 520, y: 541 -->
  <circle cx="520" cy="541" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <text x="520" y="525" fill="#f59e0b" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Step 5 Preview ($2.70)</text>

  <!-- 3. GPT-6 Sol: score 48.5, cost $10.00 -> x: 610, y: 490 -->
  <circle cx="610" cy="490" r="10" fill="#60a5fa" stroke="#ffffff" stroke-width="3"/>
  <text x="610" y="470" fill="#60a5fa" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">GPT-6 Sol ($10.00)</text>

  <!-- 4. Claude Opus 5.5: score 58.2, cost $20.00 -> x: 800, y: 420 -->
  <circle cx="800" cy="420" r="11" fill="#c084fc" stroke="#ffffff" stroke-width="3"/>
  <text x="800" y="398" fill="#c084fc" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">Claude Opus 5.5 ($20.00)</text>

  <!-- 5. GPT-6 Astra: score 62.0, cost $50.00 -> x: 920, y: 210 -->
  <circle cx="920" cy="210" r="10" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
  <text x="920" y="190" fill="#f43f5e" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">GPT-6 Astra ($50.00)</text>

  <!-- Deprecated / Sub-optimal nodes -->
  <!-- GPT-5.6 Sol: score 46, cost $20.00 -> x: 560, y: 420 -->
  <circle cx="560" cy="420" r="7" fill="#6b7280"/>
  <text x="560" y="405" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="middle">GPT-5.6 Sol (已淘汰)</text>

  <!-- Claude Opus 5: score 52, cost $25.00 -> x: 680, y: 385 -->
  <circle cx="680" cy="385" r="7" fill="#6b7280"/>
  <text x="680" y="370" fill="#9ca3af" font-size="12" font-family="sans-serif" text-anchor="middle">Opus 5.0 (已降代)</text>
</svg>