<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="55" fill="#f8fafc" font-size="26" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    深度解析：为什么 Claude Opus 5.5 Max 会陷入“过度思考死循环”？
  </text>
  <text x="600" y="88" fill="#94a3b8" font-size="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Normal Reasoning (Adaptive) vs Runaway Overthinking Loop (128k Completion Token Exhaustion)
  </text>

  <!-- Left: Healthy Reasoning Flow -->
  <g transform="translate(60, 130)">
    <rect width="510" height="490" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <rect x="0" y="0" width="510" height="46" rx="12" fill="#14532d"/>
    <text x="255" y="30" fill="#4ade80" font-size="17" font-weight="bold" font-family="sans-serif" text-anchor="middle">
      ✅ 正常思维：收敛性工程推理 (Effort: Medium / High)
    </text>

    <!-- Step 1 -->
    <rect x="30" y="70" width="450" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="98" fill="#38bdf8" font-size="15" font-weight="bold" font-family="sans-serif">阶段 1：解析任务目标与关键约束</text>
    <text x="50" y="122" fill="#94a3b8" font-size="13" font-family="sans-serif">提炼主要骨架、构图层级与关键函数接口，耗费 ~1,200 Tokens</text>

    <!-- Arrow 1 -->
    <path d="M 255 140 L 255 165" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Step 2 -->
    <rect x="30" y="170" width="450" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="198" fill="#a78bfa" font-size="15" font-weight="bold" font-family="sans-serif">阶段 2：自适应逻辑推演与局部验证</text>
    <text x="50" y="222" fill="#94a3b8" font-size="13" font-family="sans-serif">多步推演算法、自检边界条件与语法树，耗费 ~6,500 Tokens</text>

    <!-- Step 3 -->
    <rect x="30" y="275" width="450" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="303" fill="#4ade80" font-size="15" font-weight="bold" font-family="sans-serif">阶段 3：停止推演，果断转入代码生成</text>
    <text x="50" y="327" fill="#94a3b8" font-size="13" font-family="sans-serif">思维链自然收敛触发生成门控，平滑输出完整 SVG/代码结构</text>

    <!-- Summary Box -->
    <rect x="30" y="380" width="450" height="85" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="50" y="410" fill="#a7f3d0" font-size="15" font-weight="bold" font-family="sans-serif">任务圆满完成 (Success)</text>
    <text x="50" y="432" fill="#e2e8f0" font-size="13" font-family="sans-serif">总推理 Token: 7,700 | 输出 Token: 2,400 | 耗时: 12秒</text>
    <text x="50" y="452" fill="#34d399" font-size="13" font-weight="bold" font-family="sans-serif">单次调用综合成本: $0.052 USD · 产物完美交付</text>
  </g>

  <!-- Right: Overthinking Death Loop -->
  <g transform="translate(630, 130)">
    <rect width="510" height="490" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="510" height="46" rx="12" fill="#7f1d1d"/>
    <text x="255" y="30" fill="#fca5a5" font-size="17" font-weight="bold" font-family="sans-serif" text-anchor="middle">
      ❌ 致命死循环：过度思考崩盘 (Effort: Max 无约束)
    </text>

    <!-- Step 1 -->
    <rect x="30" y="70" width="450" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="98" fill="#f87171" font-size="15" font-weight="bold" font-family="sans-serif">第 1 圈：显微镜级解构 (胫骨长度 95.2?)</text>
    <text x="50" y="122" fill="#94a3b8" font-size="13" font-family="sans-serif">反复纠结脚趾与脚踏板接触曲率、嘴囊羽毛微米级阴影</text>

    <!-- Step 2 -->
    <rect x="30" y="165" width="450" height="75" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="50" y="193" fill="#f87171" font-size="15" font-weight="bold" font-family="sans-serif">第 2-N 圈：无限推演与自我质疑死循环</text>
    <text x="50" y="217" fill="#94a3b8" font-size="13" font-family="sans-serif">在草稿纸上算到地老天荒，反复重估 viewBox 坐标与链轮齿数</text>

    <!-- Step 3 Crash -->
    <rect x="30" y="265" width="450" height="90" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" filter="url(#glowRed)"/>
    <text x="50" y="295" fill="#fca5a5" font-size="15" font-weight="bold" font-family="sans-serif">💥 触发硬限制：128,000 Completion Tokens 耗尽！</text>
    <text x="50" y="318" fill="#fecaca" font-size="13" font-family="sans-serif">输出窗口被推理思维完全占满，还未动笔生成一个有效字符即被斩断</text>
    <text x="50" y="340" fill="#f87171" font-size="13" font-weight="bold" font-family="sans-serif">stop_reason: "max_tokens" · 产物输出为 0</text>

    <!-- Summary Box -->
    <rect x="30" y="380" width="450" height="85" rx="8" fill="#2d0606" stroke="#b91c1c"/>
    <text x="50" y="410" fill="#f87171" font-size="15" font-weight="bold" font-family="sans-serif">灾难性事故：白烧 $2.56 且任务失败</text>
    <text x="50" y="432" fill="#fca5a5" font-size="13" font-family="sans-serif">推理 Token: 128,000 (100% 浪费) | 输出 Token: 0 | 耗时: 19分48秒</text>
    <text x="50" y="452" fill="#ef4444" font-size="13" font-weight="bold" font-family="sans-serif">根本原因：强化学习奖励过度偏向思维长度，导致缺乏停止收敛机制</text>
  </g>
</svg>