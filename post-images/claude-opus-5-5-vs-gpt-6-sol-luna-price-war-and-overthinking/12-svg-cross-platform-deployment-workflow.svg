<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad5)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="50" fill="#f8fafc" font-size="24" font-weight="bold" font-family="sans-serif" text-anchor="middle">
    跨平台零依赖验证探针与发布闭环工作流 (Cross-Platform Verification &amp; Release)
  </text>
  <text x="600" y="78" fill="#94a3b8" font-size="14" font-family="sans-serif" text-anchor="middle">
    Windows 11 (PowerShell) · Ubuntu 26.04 (Bash) · macOS 26 (Zsh) 统一规范
  </text>

  <!-- 4 Step Boxes -->
  <g transform="translate(60, 130)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="240" height="470" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#0284c7"/>
    <text x="120" y="27" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">1. 环境嗅探与准备</text>

    <text x="15" y="70" fill="#7dd3fc" font-size="13" font-weight="bold" font-family="sans-serif">【平台原生检测】</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="12" font-family="sans-serif">• macOS 26: zsh + curl</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="12" font-family="sans-serif">• Ubuntu 26.04: bash + awk</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12" font-family="sans-serif">• Windows 11: pwsh 7.4+</text>

    <text x="15" y="180" fill="#7dd3fc" font-size="13" font-weight="bold" font-family="sans-serif">【零第三方依赖】</text>
    <text x="15" y="205" fill="#94a3b8" font-size="12" font-family="sans-serif">不安装 pip 包、不装 npm，</text>
    <text x="15" y="225" fill="#94a3b8" font-size="12" font-family="sans-serif">自带自洽 Mock 模拟器，</text>
    <text x="15" y="245" fill="#94a3b8" font-size="12" font-family="sans-serif">离线网络亦可瞬间验证。</text>

    <text x="15" y="300" fill="#7dd3fc" font-size="13" font-weight="bold" font-family="sans-serif">【隐私脱敏护盾】</text>
    <text x="15" y="325" fill="#94a3b8" font-size="12" font-family="sans-serif">完全抹除任何内网 IP、</text>
    <text x="15" y="345" fill="#94a3b8" font-size="12" font-family="sans-serif">计算机名与本地主目录名。</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(330, 130)">
    <rect x="0" y="0" width="240" height="470" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#4f46e5"/>
    <text x="120" y="27" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">2. 模型能效实测探针</text>

    <text x="15" y="70" fill="#c7d2fe" font-size="13" font-weight="bold" font-family="sans-serif">【实测指标测量】</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 首字延迟 (TTFT)</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 流式吞吐速度 (t/s)</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 上下文缓存命中率</text>

    <text x="15" y="180" fill="#c7d2fe" font-size="13" font-weight="bold" font-family="sans-serif">【Overthinking 卫兵】</text>
    <text x="15" y="205" fill="#fca5a5" font-size="12" font-family="sans-serif">实时检测思考 Token 膨胀，</text>
    <text x="15" y="225" fill="#fca5a5" font-size="12" font-family="sans-serif">超阈值自动熔断阻断，</text>
    <text x="15" y="245" fill="#fca5a5" font-size="12" font-family="sans-serif">防止被薅走 $2.56 巨款。</text>

    <text x="15" y="300" fill="#c7d2fe" font-size="13" font-weight="bold" font-family="sans-serif">【成本测算器】</text>
    <text x="15" y="325" fill="#94a3b8" font-size="12" font-family="sans-serif">三模型同题算力成本比对，</text>
    <text x="15" y="345" fill="#94a3b8" font-size="12" font-family="sans-serif">直观输出帕累托效能比。</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(600, 130)">
    <rect x="0" y="0" width="240" height="470" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#059669"/>
    <text x="120" y="27" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">3. 智能路由决策输出</text>

    <text x="15" y="70" fill="#a7f3d0" font-size="13" font-weight="bold" font-family="sans-serif">【任务分类路由】</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 宏观重构 &rarr; Opus 5.5</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 业务编写 &rarr; GPT-6 Sol</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 工具流 &rarr; GPT-6 Luna</text>

    <text x="15" y="180" fill="#a7f3d0" font-size="13" font-weight="bold" font-family="sans-serif">【动态降级回退】</text>
    <text x="15" y="205" fill="#94a3b8" font-size="12" font-family="sans-serif">若遇 API 429 速率限制，</text>
    <text x="15" y="225" fill="#94a3b8" font-size="12" font-family="sans-serif">自动将非核心请求无缝</text>
    <text x="15" y="245" fill="#94a3b8" font-size="12" font-family="sans-serif">转移至备份极速路由。</text>

    <text x="15" y="300" fill="#a7f3d0" font-size="13" font-weight="bold" font-family="sans-serif">【配置自动化输出】</text>
    <text x="15" y="325" fill="#94a3b8" font-size="12" font-family="sans-serif">自动生成环境变量与</text>
    <text x="15" y="345" fill="#94a3b8" font-size="12" font-family="sans-serif">Agent 统一连接文件。</text>
  </g>

  <!-- Box 4 -->
  <g transform="translate(870, 130)">
    <rect x="0" y="0" width="240" height="470" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#d97706"/>
    <text x="120" y="27" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">4. 构建发布与双重校验</text>

    <text x="15" y="70" fill="#fde68a" font-size="13" font-weight="bold" font-family="sans-serif">【本地静态构建】</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="12" font-family="sans-serif">• Hugo 原生双语编译</text>
    <text x="15" y="115" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 检验 500+ 文章基线</text>

    <text x="15" y="160" fill="#fde68a" font-size="13" font-weight="bold" font-family="sans-serif">【Git 远端双向推送】</text>
    <text x="15" y="185" fill="#cbd5e1" font-size="12" font-family="sans-serif">• 远端 Gitea 主仓推送</text>
    <text x="15" y="205" fill="#cbd5e1" font-size="12" font-family="sans-serif">• GitHub Pages 增量同步</text>

    <text x="15" y="250" fill="#fde68a" font-size="13" font-weight="bold" font-family="sans-serif">【公网真实验收】</text>
    <text x="15" y="275" fill="#34d399" font-size="12" font-family="sans-serif">访问独立域名线上站点，</text>
    <text x="15" y="295" fill="#34d399" font-size="12" font-family="sans-serif">校验首页、单页与归档，</text>
    <text x="15" y="315" fill="#34d399" font-size="12" font-family="sans-serif">确保 HTTP 200 完美上线！</text>
  </g>
</svg>