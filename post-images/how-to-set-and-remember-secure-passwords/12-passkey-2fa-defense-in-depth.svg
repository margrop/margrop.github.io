<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="gradLayer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradLayer2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gradLayer3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradLayer4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" fill="#0d1527"/>

  <text x="480" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">现代账户纵深防御模型 (Defense-in-Depth Architecture)</text>
  <text x="480" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">不要单点依赖任何单一密码：层层递进的现代身份防护</text>

  <!-- 4 Layers -->
  <!-- Layer 1 -->
  <g transform="translate(80, 95)">
    <rect width="800" height="85" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="8" height="85" rx="4" fill="url(#gradLayer1)"/>
    <text x="25" y="32" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">第一层：强主密码 / Passphrase (知识凭证 - Something You Know)</text>
    <text x="25" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">采用 4 词以上高熵短语，阻断所有在线/离线暴力碰撞与字典扫描。唯一由人类记忆保管的钥匙。</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(80, 195)">
    <rect width="800" height="85" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="8" height="85" rx="4" fill="url(#gradLayer2)"/>
    <text x="25" y="32" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">第二层：密码管理器 + 零知识加密 (密文隔离 - Zero-Knowledge Vault)</text>
    <text x="25" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">所有网站采用独一无二随机密码。即使单一网站被黑客攻破脱裤，撞库攻击立刻被物理斩断。</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(80, 295)">
    <rect width="800" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="8" height="85" rx="4" fill="url(#gradLayer3)"/>
    <text x="25" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">第三层：TOTP / 硬件令牌 2FA (持有凭证 - Something You Have)</text>
    <text x="25" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">基于时间的一次性动态验证码 (RFC 6238) 或物理硬件安全锁。即使密码被旁路窃听，攻击者依然无法登录。</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(80, 395)">
    <rect width="800" height="85" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="8" height="85" rx="4" fill="url(#gradLayer4)"/>
    <text x="25" y="32" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">第四层：Passkey 通行密钥与生物识别 (无密码未来 - FIDO2 / WebAuthn)</text>
    <text x="25" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">基于非对称公私钥对与域名强绑定，天然免疫钓鱼网站欺诈。生物识别 (Touch ID / Face ID) 解锁本地私钥。</text>
  </g>
</svg>