<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" fill="#0a0f1d"/>

  <text x="480" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">黑客攻击方式与生活常识大比方（小学生也能懂）</text>
  <text x="480" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">攻防世界的核心本质：不是魔法，是算力、概率与偷懒的博弈</text>

  <!-- Row 1: Brute Force & Dictionary -->
  <!-- Box 1: Brute Force -->
  <g transform="translate(50, 95)">
    <rect width="415" height="135" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="32" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">1. 暴力穷举 (Brute Force)</text>
    <text x="20" y="60" fill="#facc15" font-family="system-ui, sans-serif" font-size="13">【日常比方】 像转动四位数字密码挂锁</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">从 0000、0001 一直试到 9999，无论多么坚固，</text>
    <text x="20" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">只要时间足够、锁位够短，总能被试开。</text>
  </g>

  <!-- Box 2: Dictionary Attack -->
  <g transform="translate(495, 95)">
    <rect width="415" height="135" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1"/>
    <text x="20" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">2. 字典攻击 (Dictionary Attack)</text>
    <text x="20" y="60" fill="#facc15" font-family="system-ui, sans-serif" font-size="13">【日常比方】 拿着《百家姓》和常见词典对暗号</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">不从 aaaa 乱猜，而是优先尝试 "admin", "123456",</text>
    <text x="20" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">"iloveyou" 等高频词汇及其变形。</text>
  </g>

  <!-- Row 2: Credential Stuffing & Rainbow Table -->
  <!-- Box 3: Credential Stuffing -->
  <g transform="translate(50, 245)">
    <rect width="415" height="135" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1"/>
    <text x="20" y="32" fill="#f87171" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">3. 撞库攻击 (Credential Stuffing)</text>
    <text x="20" y="60" fill="#facc15" font-family="system-ui, sans-serif" font-size="13">【日常比方】 捡到一把钥匙，跑去试整栋小区的门</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">一个小网站数据库泄露，黑客拿着你的账号密码，</text>
    <text x="20" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">自动去刷你的支付宝、微信、邮箱和网盘。</text>
  </g>

  <!-- Box 4: Rainbow Table -->
  <g transform="translate(495, 245)">
    <rect width="415" height="135" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">4. 彩虹表破解 (Rainbow Table)</text>
    <text x="20" y="60" fill="#facc15" font-family="system-ui, sans-serif" font-size="13">【日常比方】 提前背熟「九九乘法表」抢答</text>
    <text x="20" y="84" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">黑客提前预计算几亿个常用词的哈希密文查表。</text>
    <text x="20" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">只要看到数据库里密文，一秒查出原始明文！</text>
  </g>

  <!-- Row 3: Salted Hash Countermeasure -->
  <g transform="translate(50, 395)">
    <rect width="860" height="135" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="17" font-weight="bold">🛡️ 防御终极法宝：加盐慢哈希 (Salted Hash &amp; Argon2id)</text>
    <text x="25" y="64" fill="#facc15" font-family="system-ui, sans-serif" font-size="13">【日常比方】 给每道菜都放不同秘制配方的盐，并且大火慢炖一小时才出锅</text>
    <text x="25" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">即使两人密码都是 123456，系统给每个人分配一个独立随机的"盐 (Salt)"，算出来的密文完全不同；</text>
    <text x="25" y="112" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">同时使用故意极耗内存的 Argon2id 算法，让彩虹表直接彻底失效，GPU 算力成本暴涨几百万倍！</text>
  </g>
</svg>