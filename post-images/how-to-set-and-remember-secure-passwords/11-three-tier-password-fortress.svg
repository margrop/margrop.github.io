<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="sTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="aTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bTier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#0b1329"/>

  <text x="480" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">三级密码金字塔防御体系 (The 3-Tier Password Fortress)</text>
  <text x="480" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">人脑记忆有限，安全责任分层：不同价值资产采用不同的防御策略</text>

  <!-- S-Tier -->
  <g transform="translate(50, 110)">
    <rect width="270" height="390" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="270" height="44" rx="12" fill="url(#sTier)"/>
    <rect y="20" width="270" height="24" fill="url(#sTier)"/>
    <text x="135" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">S 级：数字王冠资产</text>

    <text x="20" y="80" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">适用对象：</text>
    <text x="20" y="104" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 密码库主密码 (Master Key)</text>
    <text x="20" y="126" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 核心主邮箱 (重置其他账号的根)</text>
    <text x="20" y="148" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Apple ID / Google / 微信</text>

    <text x="20" y="185" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">策略要求：</text>
    <text x="20" y="209" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 采用 4-5 词独立 Passphrase</text>
    <text x="20" y="231" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 必须物理人脑死记，不存云端</text>
    <text x="20" y="253" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 强制绑定硬件 Key (FIDO2) 或 2FA</text>

    <rect x="15" y="330" width="240" height="40" rx="6" fill="rgba(139, 92, 246, 0.15)"/>
    <text x="135" y="355" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">防守级别：物理隔离 / 绝对核心</text>
  </g>

  <!-- A-Tier -->
  <g transform="translate(345, 110)">
    <rect width="270" height="390" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="270" height="44" rx="12" fill="url(#aTier)"/>
    <rect y="20" width="270" height="24" fill="url(#aTier)"/>
    <text x="135" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A 级：高价值日常资产</text>

    <text x="20" y="80" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">适用对象：</text>
    <text x="20" y="104" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 银行与金融理财支付</text>
    <text x="20" y="126" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 公司企业邮箱与办公内网</text>
    <text x="20" y="148" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 常用电商平台、云服务器</text>

    <text x="20" y="185" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">策略要求：</text>
    <text x="20" y="209" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 密码管理器自动生成 20+ 位</text>
    <text x="20" y="231" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 每个网站 100% 独一无二</text>
    <text x="20" y="253" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 开启 TOTP 动态双因子验证</text>

    <rect x="15" y="330" width="240" height="40" rx="6" fill="rgba(59, 130, 246, 0.15)"/>
    <text x="135" y="355" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">防守级别：随机唯一 / 密管托管</text>
  </g>

  <!-- B-Tier -->
  <g transform="translate(640, 110)">
    <rect width="270" height="390" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="270" height="44" rx="12" fill="url(#bTier)"/>
    <rect y="20" width="270" height="24" fill="url(#bTier)"/>
    <text x="135" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">B 级：边缘与临时资产</text>

    <text x="20" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">适用对象：</text>
    <text x="20" y="104" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 临时论坛、WiFi 认证</text>
    <text x="20" y="126" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 偶尔下载软件的临时注册</text>
    <text x="20" y="148" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 一次性活动、问卷系统</text>

    <text x="20" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">策略要求：</text>
    <text x="20" y="209" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 密码管理器自动生成 16 位</text>
    <text x="20" y="231" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 配合临时邮箱或邮件别名</text>
    <text x="20" y="253" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">• 随时可弃，被黑无伤大雅</text>

    <rect x="15" y="330" width="240" height="40" rx="6" fill="rgba(100, 116, 139, 0.15)"/>
    <text x="135" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">防守级别：沙箱隔离 / 一键抛弃</text>
  </g>
</svg>