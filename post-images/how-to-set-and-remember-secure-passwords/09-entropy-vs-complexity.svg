<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="480" y="46" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">传统复杂密码 vs 现代多词短语 (Passphrase)</text>
  <text x="480" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">为什么“反人类”的复杂字符容易被秒破，而“好记”的单词组合却牢不可破？</text>

  <!-- Left Card: Weak Complex -->
  <g transform="translate(50, 105)" filter="url(#shadow)">
    <rect width="410" height="395" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="410" height="44" rx="12" fill="url(#redGrad)"/>
    <rect y="20" width="410" height="24" fill="url(#redGrad)"/>
    <text x="205" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">传统模式：假安全，真折磨</text>

    <!-- Example box -->
    <rect x="25" y="65" width="360" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="205" y="100" fill="#f87171" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">Tr0ub4dor&amp;3</text>

    <!-- Metrics -->
    <text x="30" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">密码长度：<tspan fill="#f8fafc" font-weight="bold">11 字符</tspan></text>
    <text x="30" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">人类记忆难度：<tspan fill="#ef4444" font-weight="bold">极高 (极易输错、只能写便签)</tspan></text>
    <text x="30" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">字符复杂度：大小写 + 数字 + 符号</text>
    
    <line x1="30" y1="230" x2="380" y2="230" stroke="#334155" stroke-width="1"/>

    <text x="30" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">黑客视角分析：</text>
    <text x="30" y="288" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• 基础词根为常见单词 "troubadour"</text>
    <text x="30" y="312" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• 典型黑客字典替换规则：o→0, a→4, e→3</text>
    <text x="30" y="336" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">• 真实有效信息熵：约 <tspan font-weight="bold">28 bits</tspan></text>

    <!-- Crack Time Box -->
    <rect x="25" y="350" width="360" height="36" rx="6" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444"/>
    <text x="205" y="374" fill="#ef4444" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU 算力集群破解耗时：约 3 天</text>
  </g>

  <!-- Right Card: Strong Passphrase -->
  <g transform="translate(500, 105)" filter="url(#shadow)">
    <rect width="410" height="395" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="410" height="44" rx="12" fill="url(#greenGrad)"/>
    <rect y="20" width="410" height="24" fill="url(#greenGrad)"/>
    <text x="205" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">现代推荐：易记忆，难破解</text>

    <!-- Example box -->
    <rect x="25" y="65" width="360" height="55" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="205" y="100" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">correct-horse-battery-staple</text>

    <!-- Metrics -->
    <text x="30" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">密码长度：<tspan fill="#f8fafc" font-weight="bold">28 字符</tspan></text>
    <text x="30" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">人类记忆难度：<tspan fill="#10b981" font-weight="bold">极低 (脑海形成画面，过目不忘)</tspan></text>
    <text x="30" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">字符复杂度：纯小写英文字母 + 连字符</text>

    <line x1="30" y1="230" x2="380" y2="230" stroke="#334155" stroke-width="1"/>

    <text x="30" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">黑客视角分析：</text>
    <text x="30" y="288" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">• 4 个完全随机词汇，无逻辑关联</text>
    <text x="30" y="312" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">• 字典组合空间：2048^4 ≈ 1.75 × 10^13</text>
    <text x="30" y="336" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">• 真实有效信息熵：约 <tspan font-weight="bold">44 ~ 52 bits</tspan></text>

    <!-- Crack Time Box -->
    <rect x="25" y="350" width="360" height="36" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
    <text x="205" y="374" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">GPU 算力集群破解耗时：约 550 年</text>
  </g>
</svg>